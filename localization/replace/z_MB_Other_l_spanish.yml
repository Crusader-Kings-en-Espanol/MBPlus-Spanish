  #Text changes

  DOMAIN: "Dominio"
  task_manage_domain: "Gestionar el dominio"
  task_manage_domain_effect_desc: "[councillor.GetShortUINameNoTooltip] se centra en tu dominio y tus posesiones personales\n\nSu apoyo te da:\n[councillor.GetModifierDescForTask('task_manage_domain')]"
  innovation_guilds_desc: "A medida que nuestras tierras se expanden, resulta cada vez más ineficaz gestionar directamente todo el comercio que tiene lugar en nuestro territorio. Concediendo cartas de gremio a organizaciones de mercaderes y artesanos podemos darles más autonomía sobre sus negocios, al tiempo que nos aseguramos de obtener beneficios de sus empresas."
  innovation_seigneurialism_desc: "Al delegar más responsabilidades en los nobles locales, podemos tanto hacerlos felices como liberar más de nuestra atención para centrarnos en nuestro propio dominio."
  THEOCRATIC_LEASE_INCOME_DOMAIN: "Templos en [CHARACTER.GetShortUINamePossessive] dominio"
  major_decisions.0501.desc: "A través de matrimonios, alianzas y conquistas cuidadosamente planificadas, la dinastía [ROOT.Char.GetDynasty.GetBaseNameNoTooltip] ha ocupado el lugar que le corresponde entre las verdaderas potencias del mundo conocido.\n\n[realm_1.GetNameNoTierNoTooltip|U], [realm_2.GetNameNoTierNoTooltip|U], [realm_3.GetNameNoTierNoTooltip|U], [realm_4.GetNameNoTierNoTooltip|U]... Nuestro dominio se extiende a lo largo y ancho. Muchas coronas se asientan sobre nuestras cabezas, pero por la sangre, estamos unidos como uno."
  roman_restoration.0023.desc: "La isla de Hibernia es la última adición al siempre creciente dominio del Imperio Romano. Esta tierra de colinas suavemente onduladas y campos verdes nunca fue conquistada por el antiguo imperio, pero debería convertirse en un feudo agradable de gobernar si a uno no le importa la lluvia o los malolientes colonos nórdicos de la costa."
  nobility_domain: "dominio"
  nobility_domain_plural: "dominios"
  stewardship_duty.1071.desc: "Una afluencia de siervos ha llegado a [target_county.GetName] desde el vecino [origin_county.GetName]. Afirman que huyen del gobierno abusivo de [origin_county_owner.Custom2('MyCharacterIntroduction', ROOT.Char)], y que desean vivir en mi dominio en lugar de [origin_county_owner.GetHerHis].\n\nLegalmente hablando, todavía están en régimen de servidumbre con [origin_county_owner.GetFirstName], pero si les permito establecerse en mis tierras sería casi imposible para [origin_county_owner.GetHerHim] demostrar que realmente son [origin_county_owner.GetHerHis] siervos."
  diplomacy_foreign.1153.desc: "[ruler.GetTitledFirstName] me ha presentado hoy una propuesta peculiar.\n\n[ruler.GetSheHe|U] afirma que [ruler.GetSheHe] está dispuesto a renunciar [ruler.GetHerHis] control sobre [neighbor_county.GetNameNoTier], una provincia sobre la que mi reino tiene antiguas reivindicaciones, a cambio de [county.GetName], sobre el que los antepasados de [ruler.GetHerHis] supuestamente tenían dominio."
  martial_authority.2050.desc.vassal: "dentro de [right_hand_person.GetHerHis] propio dominio."
  vassal.1001.desc: "Mi [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('religious_liege'))], el [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('religious_liege'))] [religious_liege.GetTitledFirstName], está pasando por mi distrito. Mientras [religious_liege.GetSheHe] examina los edificios, [religious_liege.GetSheHe] [ROOT.Char.Custom2('QuirkPresentPosOrNeg', SCOPE.sC('religious_liege'))] y frunce el ceño.\n\n"¿Sabes lo que falta en esta vista? Un [religious_liege.GetFaith.HouseOfWorship] - ¡un glorioso tributo a [religious_liege.GetFaith.HighGodName]!"
  vassal.1101.desc: ""Mi [ROOT.Char.GetLadyLord], me he dado cuenta de que hay espacio para una [religious_vassal.GetFaith.HouseOfWorship] en tu territorio."\n\nMi [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('religious_vassal'))], el [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('religious_vassal'))] [religious_vassal.GetTitledFirstName], [ROOT.Char. Custom2('QuirkPresentPosOrNeg', SCOPE.sC('religious_vassal'))] antes de continuar: "Si construyes uno seguramente tendrás [religious_vassal.GetFaith.HighGodNameAlternatePossessive] gratitud, así como la mía."
  stress_threshold.3411.desc.just: "Sólo que, por más que persiga con fervor el imperio de la ley, la delincuencia sigue aflorando en todos los rincones de mi demarcación."
  ostentatious_follies_modifier_desc: "La finca de este personaje está salpicada de feos monumentos a medio terminar de su grandeza."
  raiding.0004.desc.spared_plundered: "A pesar de haber asediado con éxito el asentamiento de [sacked_barony.GetNameNoTierNoTooltip], una fortificación que protege franjas de la gran [sacked_county.GetNameNoTierNoTooltip], [raider.GetTitledFirstName] ha contenido a sus tropas. El saqueo resultante ha sido aislado y esporádico.\n\nAunque tu vasallo se ha salvado, los [raider.GetPrimaryTitle.GetAdjectiveNoTooltip] miran con avidez a tu demarcación personal..."
  stewardship_domain_focus: "Foco del dominio"
  stewardship_domain_focus_effect_desc: "Centrándose en las concesiones del dominio:"
  ZOOM_LEVEL_DOMAIN: "Mapa de Dominio"
  OUTLINER_HOLDINGS: "Propiedades de Dominio"
  DOMAIN_LIMIT_OVERRUN_EFFECT: "   Opinión de [vassal|E]: $OPINION|+$\n   Dominio [levies|E]: $LEVY|+%0$\n   Dominio [taxes|E]: $TAX|+%0$"
  GRANT_REVOKE_TITLES_NEW_DOMAIN_LABEL: "Nuevo Tamaño de Dominio:"
  GRANT_REVOKE_TITLE_VASSAL_PROVINCE_DOMAIN: "#T [CHARACTER.GetUINamePossessive|U] Dominio#!"
  GRANT_TITLE_NOT_IN_DOMAIN: "@warning_icon!#X Sólo puedes conceder títulos de tu propio Dominio#!"
  REVOKE_TITLE_NOT_IN_DOMAIN: "@warning_icon!#X Sólo puedes revocar títulos de tu Dominio personal#!"
  DECLARE_WAR_TARGET_PROVINCE_TOOLTIP: "Si ganas, [TITLE.GetName] pasará a formar parte de tu Dominio"
  it_is_my_domain_perk_name: "Es MI Dominio"
  task_manage_domain_modifier: "Cónyuge — Manejar Dominio"
  MODIFIER_FROM_PROVINCES: "Del Dominio"
  MY_REALM_WINDOW_DOMAIN_TAB: "Dominio"
  MY_REALM_WINDOW_DOMAIN_LIMIT: "Dominio:"
  MY_REALM_WINDOW_DOMAIN_LIMIT_WARNING: "#X Dominio: #!"
  lesson_basics_domain: "XII — Dominio"
  lesson_basics_domain_2_desc:2 "Tenga en cuenta que hay un límite en la cantidad de terreno que puede poseer personalmente, antes de empezar a incurrir en sanciones: el [domain_limit|E].\n\n#TUT Cuando sobrepases tu Límite de Dominio, puede ser una buena idea utilizar la interacción #TUT_KW Conceder Título#! en [characters|E] con los que tienes amistad, convirtiéndolos en tus [vassals|E].\n\nComo no te sobran títulos para regalar, de momento no puedes hacerlo, pero de lo contrario lo encontraría en la sección menú de $game_concept_character$, visible al hacer clic con el botón derecho en un $game_concept_character$.#!"
  reactive_advice_domain_limit_step_1: "Límite de Dominio"
  reactive_advice_domain_limit_desc: "Ahora mismo tienes en tu [domain|lE] más tierras de las que tu personaje puede gestionar… ¡Es hora de crear nuevos [vassals|lE]!\n\nComo seguramente quieras conservar los títulos valiosos en tu dominio, te recomendamos que vayas a la pestaña Dominio en la vista de tu señorío, donde podrás ver el valor que das a cada título. Además, ten en cuenta qué títulos están en tu [de_jure|lE].\n\n#TUT Hay que evitar superar el [domain_limit|lE] demasiado tiempo, porque tendrá consecuencias.\n\nPara permanecer por debajo del límite, es mejor ceder el exceso de [titles|lE] a nuevos vasallos. Aunque puedes conceder títulos a los vasallos existentes, suele ser mejor encontrar a alguien sin tierras al que dárselos.\n\nAquellos miembros lejanos de la [dynasty|lE] o [courtiers|lE] con el [trait|lE] [GetTrait('content').GetName( GetPlayer )] serían unos vasallos excelentes, mientras que los [claimants|lE] a tus títulos o cortesanos con el rasgo [GetTrait('ambitious').GetName( GetPlayer )], no tanto.#!"
  reactive_advice_vassal_limit_desc: "Nadie puede manejar una horda de condes… ¡los aspirantes a conquistadores necesitan confiar en [vassals|lE] de cierto nivel, como duques, para que gestionen sus tierras por ellos!\n\nEn la vista Dominio puedes ver tu actual límite de vasallaje.\n\n#TUT Como sucede con el límite de dominios, no es recomendable superar el [vassal_limit|lE]. Para evitar esta penalización, debes consolidar tus vasallos.\n\nEl mejor modo de hacerlo es conceder [duchies|lE] a los vasallos. ¡Eso les permitirá gobernar un área mayor para no tener que hacerlo tú! Aunque, para que esto funcione, tendrías que poseer un [kingdom|lE] o un [empire|lE], ¡pero no cometas el error de entregar uno de tus [primary_titles|lE]!\n\nSi resulta que superas el límite de vasallaje como duque, te recomendamos que formes un reino lo antes posible.#!"
  princely_elective_succession_law_effects: "El emperador y los siete príncipes electores pueden proponer un [title_heir|lE] de entre ellos, cualquier hijo [legitimate|lE] y hermanos del [ruler|lE], así como otro gran [vassal|lE] [de_jure|lE] del Imperio. Si un [title|lE] histórico de elector está en manos de infieles o no existe, otro vasallo [de_jure|lE] asumirá su lugar. Esta [succession_law|lE] da gran importancia a la [faith|lE] y la [piety|lE].\n\nLos títulos electorales de este señorío son los condados de Colonia, Maguncia y Tréveris, y los ducados de Bohemia, Franconia Oriental, Ostfalia y Ostmark."
  princely_elective_electors_tooltip: "Además de tal [SuccessionElectionWindow.GetTitle.GetHolder.GetTitleAsNameNoTooltip|l], los titulares de los siguientes [titles|lE] se ven favorecidos como [electors|lE] bajo [SuccessionElectionWindow.GetSuccessionLaw.GetName|l]:[SuccessionElectionWindow.GetTitle.Custom('GetPrincelyElector1')][SuccessionElectionWindow.GetTitle.Custom('GetPrincelyElector2')][SuccessionElectionWindow.GetTitle.Custom('GetPrincelyElector3')][SuccessionElectionWindow.GetTitle.Custom('GetPrincelyElector4')][SuccessionElectionWindow.GetTitle.Custom('GetPrincelyElector5')][SuccessionElectionWindow.GetTitle.Custom('GetPrincelyElector6')][SuccessionElectionWindow.GetTitle.Custom('GetPrincelyElector7')]\n\nSi alguno de estos no está creado, no está en posesión de un [vassal|lE] imperial [de_jure|lE], ya está en posesión de otro elector, o la [faith|lE] del titular es distinta de la del emperador, se seleccionará otro título de iure que posea un vasallo imperial directo o [independent_ruler|lE] de acuerdo a estos criterios:\n$EFFECT_LIST_BULLET$Se favorece a gobernantes de la [faith|lE] y [culture|lE] del emperador\n$EFFECT_LIST_BULLET$Se favorece a gobernantes tipo [theocratic|lE] y [feudal|lE]"
  game_concept_levies_desc:2 "La mayor parte de la mayoría de los [armies|E] está formada por $game_concept_levies$.\n\nCada [holding|E] proporciona un número determinado de $game_concept_levies$ a su [holder|E]. Los [vassals|E], a su vez, entregan una parte de sus $game_concept_levies$ a su [liege|E].\n\nLos $game_concept_levies$ están formados principalmente por combatientes mal armados que debían proporcionar su propio equipo #weak (plebeyos libres, mercenarios locales, nobles arruinados, pequeños terratenientes, etc.)#! y se consideran su propio tipo de unidad.\n\nUna $game_concept_levy$ tiene [GetDefine('NCombat', 'LEVY_ATTACK')|0] de [damage|E] y [GetDefine('NCombat', 'LEVY_TOUGHNESS')|0] de [toughness|E]. El otro tipo de [soldiers|E] del juego son los [men_at_arms|E]: profesionales entrenados y costosos."
  LV_FLAVOR: "Las levas están formadas por nobles menores, mercenarios y plebeyos que servían a un noble superior y estaban equipados con lo que podían permitirse. Su gran número constituye el grueso de la mayoría de los ejércitos."


