  #Decisions

  british_isles.1001.t: "Unir los Tronos de Inglaterra"
  british_isles.1001.desc: "Con los distintos Reinos de Inglaterra ahora bajo un solo Rey es hora de acabar con los muchos títulos y sustituirlos por uno solo, ¡el Reino de Inglaterra!"
  british_isles.1001.a: "¡Una nueva era amanece!"

  reunite_two_sicilies_decision: "Reunir las Dos Sicilias"
  reunite_two_sicilies_decision_desc: "Si los dos reinos de Sicilia fueran gobernados por un solo rey, podrían reunirse en una sola Sicilia como lo fueron antes."
  reunite_two_sicilies_decision_confirm: "$reunite_two_sicilies_decision$"
  reunite_two_sicilies_decision_tooltip: "Fusionar Nápoles y Trinacria en un [de_jure|E] [kingdom|E]"

  form_mamluk_decision: "Fundar el Sultanato Mameluco"
  form_mamluk_decision_desc: "Los mamelucos fueron traídos a estas tierras como guerreros esclavos desde el Cáucaso y la Estepa. Recibimos una formación exhaustiva en diversos campos, como las artes marciales, la etiqueta de la corte y las ciencias islámicas, y ahora nos encontramos en posición de gobernar las tierras de nuestros antiguos amos y fundar un nuevo sultanato bajo el gobierno de los mamelucos."
  form_mamluk_decision_tooltip: "Fundar el Sultanato Mameluco"
