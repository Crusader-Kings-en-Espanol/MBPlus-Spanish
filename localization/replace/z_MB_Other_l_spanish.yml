  holy_order_county_government: "Orden Sagrada"
  holy_order_county_government_desc: "Esta es una Orden Sagrada que ha conquistado una región y ha asumido un papel que recuerda más a los reinos feudales. Aunque es santa en su nombre y en sus trampas, y quizás en algunas de sus funciones de gobierno, los hermanos de este capítulo operan en gran medida como una monarquía electiva."
