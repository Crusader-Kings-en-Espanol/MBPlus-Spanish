  landed_order_elective_title_succession_law: "Orden terrestre electiva"
  landed_order_elective_title_succession_law_effects: "El [ruler|E] y todos los [vassals|E] directos de la misma fe pueden nombrar un [title_heir|E] entre los Maestros de la Orden y todos los consejeros de la misma fe del [ruler|E]. El [title_heir|E] heredará todos los títulos de nivel primario del [ruler|E].\n$EFFECT_LIST_BULLET$Se preferirá a los candidatos de mayor edad, prestigio y destreza"
  landed_order_elective_candidates: "Consejeros y vasallos de la Orden de las Tierras"
  landed_order_elective_candidates_tooltip: "Para ser un candidato válido bajo el Orden Terrestre Electivo, un personaje debe cumplir una de las siguientes condiciones:\n$EFFECT_LIST_BULLET$Ser un consejero de la misma fe del gobernante actual \n$EFFECT_LIST_BULLET$Ser un vasallo directo del Orden Terrestre de la misma fe del gobernante actual"
  landed_order_elective_electors: "Gobernante y vasallos de la misma fe"
  landed_order_elective_electors_tooltip: "Para ser un [elector|E] válido bajo el Landed Order Elective, un vasallo debe cumplir todas las condiciones siguientes:\n$EFFECT_LIST_BULLET$Ser un vasallo directo del gobernante actual\n$EFFECT_LIST_BULLET$Seguir la misma [faith|E] que el gobernante actual"
  holy_order_county_succession_law: "Orden sagrada"
  holy_order_county_succession_law_effects: "Los santos guerreros de las órdenes han dedicado su vida a luchar contra los infieles y a servir a su fe. Pueden poseer castillos cedidos por terratenientes piadosos. El líder de la orden se elige dentro de las filas de la orden."

  holy_elective_candidates: "Familiares cercanos, reclamantes y electores"
  holy_elective_candidates_tooltip: "Para ser un Candidato válido bajo la Elección Feudal, un personaje debe cumplir una de las siguientes condiciones: \n$EFFECT_LIST_BULLET$Ser un miembro legítimo de la [close_family|E] del gobernante actual, que no esté en línea para heredar una Teocracia o República\n$EFFECT_LIST_BULLET$Ser un [reclamante|E] del título, que no esté en línea para heredar una Teocracia o una República\n$EFFECT_LIST_BULLET$Ser un [elector|E] feudal válido para el título\n$EFFECT_LIST_BULLET$Se preferirán los candidatos de mayor edad, más prestigiosos y con más proezas"
  holy_elective_electors: "Gobernante y vasallos"
  holy_elective_electors_tooltip: "Para ser un [elector|E] válido bajo la Elección Feudal, un vasallo debe cumplir todas las condiciones siguientes:\n$EFFECT_LIST_BULLET$Ser un vasallo directo del título\n$EFFECT_LIST_BULLET$Ser sólo uno o dos [rangos|E] por debajo del título"

