l_spanish:
 travel_danger_type_savanna: "Sabana"
 travel_danger_type_savanna_desc: "La vasta sabana se extiende hasta donde alcanza la vista, albergando tanto depredadores ocultos como un calor abrasador."
 
 travel_danger_type_high_boreal: "Tierras Altas Boreales"
 travel_danger_type_high_boreal_desc: "Las escarpadas Tierras Altas Boreales presentan un desafío formidable, con vientos helados y acantilados traicioneros que esperan al viajero desprevenido."
 
 travel_danger_type_dry_hills: "Colinas Áreas"
 travel_danger_type_dry_hills_desc: "Entre las colinas áridas, uno debe soportar un calor abrasador y fuentes de agua escasas, mientras se mantiene alerta ante los depredadores de las tierras altas."
