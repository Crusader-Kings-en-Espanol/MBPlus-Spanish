 game_concept_romanobrit: "Romano-Britón"
 game_concept_romanobrittonic: "Romano-Britón"
 game_concept_romano_briton: "Romano-Britones"
 game_concept_briton: "Britón"
 game_concept_romano_briton_desc: "Los Romano-Britones, o simplemente Britones, eran los [oldbrit|E] que habitaban Britannia hasta el siglo V d.C., cuando la provincia gradualmente cayó en una anarquía militar debido a las [raids|E] pictas, irlandesas y sajonas.\n\nCuando Roma finalmente abandonó Britania alrededor del año 440 d.C., los caudillos británicos oportunistas establecieron sus propios [kingdoms|E] utilizando [mercenaries|E] germánicos que a menudo tendían a usurpar el liderazgo para sí mismos. \nEn algunos casos, sin embargo, la élite gobernante parece haberse mantenido y simplemente se asimiló a sus séquitos a lo largo de los siglos.\n\nPara el siglo VII, los britones habían sido culturalmente asimilados en nuevos grupos [anglosaxon|E], o habían evolucionado gradualmente en los diversos pueblos brítónicos."
 
 game_concept_oldbrit: "Pritanī"
 game_concept_old_briton: "Pritanos"
 game_concept_old_briton_desc: "Los Pritanīans eran los habitantes originales de la isla de Britania antes de la conquista romana. \n\nDespués de la invasión de Claudio, la isla fue gradualmente integrada en el mundo romano más amplio, lo que llevó a la Romanización constante de los Pritanīans dentro de la provincia, mientras que aquellos más allá de las murallas en el norte eventualmente evolucionarían hacia los antepasados de los pictos. \n\nSi bien los Pritanīans originales han desaparecido, su lengua, así como aspectos de su cultura, sobreviven en las tradiciones [romanobrit|E] y pictas."
 
 game_concept_anglosaxon: "Anglo-Sajón"
 game_concept_anglo_saxon: "Anglo-Sajones"
 game_concept_anglo_saxon_desc: "Los Anglo-Sajones eran un conjunto de pueblos de habla Ænglisċ que habitaron Britania desde el Período Sub-Romano desde el siglo V en adelante. \n\nDescendientes de los [romano_briton|E] asimilados y de varios grupos germánicos [mercenaries|E], nunca fueron una fuerza verdaderamente unificada. Sin embargo, gracias a los esfuerzos de escritores como Beda, los habitantes de habla ænglisc de los muchos [kingdoms|E] germánicos desarrollarían gradualmente una identidad común de Angelcynn que se diferenciaba de los francos en el continente y de los [romano_briton|E] de habla brítónica de Gales y Cornualles."
 
 game_concept_rus: "Rus"
 game_concept_eastslavic: "Eslavo Oriental"
 game_concept_east_slavs: "Eslavos Orientales"
 game_concept_eastslavs: "Eslavos orientales"
 game_concept_east_slavs_desc: "Los Eslavos Orientales, también conocidos como Rus o Rutenians, son los descendientes de los [old_slavs|E] que migraron hacia el este desde su tierra ancestral de Podlasia.\n\nEstableciéndose en la estepa pontica y en las antiguas tierras bálticas y fino-ugrinas al norte, estos Eslavos Orientales caerían gradualmente bajo la influencia de los raiders germánicos del norte, varangios, así como bajo la influencia bizantina que se expandió gradualmente hacia el norte desde el Mar Negro. Para el siglo IX, los Eslavos Orientales estaban divididos en varias tribus que fueron influenciadas de diversas maneras por sus muchos vecinos antes del eventual ascenso de la Rus de Kiev.\n\nCaracterizados por su [culture|E] influenciada por Bizancio y germánica del norte, y su [heritages|E] eslavo oriental, los Eslavos Orientales forman el vínculo entre los [west_slavs|E] y los [south_slavs|E]."
 
 game_concept_westslavic: "Eslavo Occidental"
 game_concept_west_slavs: "Eslavos Occidentales"
 game_concept_west_slavs_desc: "Los Eslavos Occidentales, coloquialmente también conocidos como los Wends o Lechitas, son los descendientes de los [old_slavs|E] que migraron hacia el oeste a las antiguas tierras germánicas de los Lugios, Godones y Warini.\n\nEstableciéndose a lo largo de los ríos Vístula, Oder y Elba, las diversas tribus eslavas occidentales gradualmente repoblarían estas tierras después de la partida de sus habitantes anteriores, mientras que al mismo tiempo asimilaban a los pocos grupos que se quedaron atrás. Para el siglo IX, la mayoría de estas tribus lechitas se habían establecido en la sección occidental de la Llanura del Norte de Europa y se entrelazaron cada vez más con los estados francos y búlgaros que las rodeaban, lo que contribuyó al surgimiento de principados nativos como Moravia o Polonia.\n\nCaracterizados por su [culture|E] influenciada por los francos y su [heritages|E] eslavo occidental, los Eslavos Occidentales forman el vínculo norte entre los [east_slavs|E] y los [pannonian_slavs|E]."

 game_concept_southslavic: "Eslavo Meridional"
 game_concept_south_slavs: "Eslavos Meridionales"
 game_concept_south_slavs_desc: "Los Eslavos Meridionales, coloquialmente también conocidos como los Esclavianos o Ilirios, son los descendientes de los [old_slavs|E] que huyeron ante el avance de los Avaros cruzando al territorio bizantino durante el curso de los siglos VI y VII.\n\nAsentándose rápidamente en los territorios que se extienden desde el Mar Negro hasta los Alpes Dináricos, los Eslavos Meridionales se convirtieron en el grupo etnolingüístico dominante en los Balcanes para el siglo IX, habiendo asimilado a la mayoría de los pueblos griegos, románicos y antiguos ilirios que residían allí.\n\nCaracterizados por su [culture|E] influenciada por Bizancio y los francos y su [heritages|E] eslavo meridional, los Eslavos Meridionales forman el vínculo sur entre los [east_slavs|E] y los [pannonian_slavs|E]."
 
 game_concept_pannonianslavic: "Eslavo Pannoniano"
 game_concept_pannonian_slavs: "Eslavos Pannonianos"
 game_concept_pannonian_slavs_desc: "Los Eslavos Pannonianos son los descendientes de los [old_slavs|E] que vivieron bajo el dominio de los Avaros desde los siglos VI hasta IX.\n\nTras la desintegración del Janato Avaro a finales del siglo VIII, los Eslavos Pannonianos aprovecharon el vacío de poder dejado atrás para establecer una serie de sus propios principados, como Savia, Balatón y Carantania, todos los cuales gradualmente caerían en la órbita franca durante el siglo IX en diferentes grados.\n\nCaracterizados por su [culture|E] influenciada por los francos y su [heritages|E] mixta entre eslavos del sur y del oeste, los Eslavos Pannonianos forman el vínculo entre los [south_slavs|E] y los [west_slavs|E]."
 
 game_concept_oldslavic: "Eslavo"
 game_concept_old_slavs: "Eslavos"
 game_concept_old_slavs_desc: "Los Eslavos son los antepasados de los muchos pueblos eslavos que comenzaron a habitar gran parte de Europa del Este a partir del siglo VI d.C.\n\nSi bien el origen exacto y la etnogénesis de los Eslavos siguen siendo un misterio incluso hasta el día de hoy, una probable patria de estos Viejos Eslavos se encuentra en la región de Podlasia, entre Ucrania y Bielorrusia, desde donde estos Eslavos comenzarían a migrar hacia el este, sur y oeste en dirección a Rutenia, Polonia, Alemania Oriental, Panonia y los Balcanes. Si bien es muy probable que muchos pueblos eslavos puedan rastrear su origen hasta pueblos preexistentes que terminarían siendo asimilados debido a estas migraciones eslavas, no obstante, se consideraban a sí mismos, y eran considerados por sus vecinos, como un solo pueblo, más o menos, incluso hasta el período moderno temprano.\n\nEn el juego, los Eslavos son la cultura ancestral de los diversos pueblos eslavos orientales, occidentales, meridionales y pannonianos."
 
 game_concept_egyptian: "Egipcio"
 game_concept_egyptians: "Egipcios"
 game_concept_coptic: "Copto"
 game_concept_egyptians_desc: "Los egipcios eran los antiguos habitantes del Valle del Nilo que se concentraron alrededor de las grandes ciudades de Menfis, Tebas y El Cairo.\n\nAunque la cultura egipcia es más conocida por sus grandiosos monumentos y su arquitectura, también se desarrolló un profundo sentido de identidad étnica que hizo que los egipcios se consideraran a sí mismos como una cultura única. El Imperio Romano conquistó Egipto en 30 a.C. y lo incorporó como una provincia, siendo desde entonces el Egipto romano visto como un territorio distintivo y único, y los egipcios se volvieron menos egipcios e, irónicamente, más romanos a medida que pasaron los siglos. Para el siglo V d.C., la cultura egipcia estaba profundamente marcada por la influencia romana, mientras que simultáneamente sufría la disolución de su legado [pharaonic|E] por el cristianismo en auge. Los coptos fueron los descendientes de los egipcios que continuaron con la fe [coptic|E] en medio de la creciente influencia de la iglesia católica romana y la dominación musulmana durante el primer milenio."
 
 game_concept_iranian: "Ērānio"
 game_concept_iranians: "Ērānios"
 game_concept_iranianized: "Ērānizado"
 game_concept_daylamite: "Daylamita"
 game_concept_iranians_desc: "Los Ērānians, conocidos coloquialmente también como los Sasánidas, o a veces simplemente y erróneamente como 'persas', fueron los habitantes del Imperio Sasánida que dominó Irán desde el siglo III hasta el VII.\n\nLa Casa de Sasan surgió de la provincia histórica de Pars y en el siglo III d.C. derrocó a los partos arsácidas que habían gobernado Irán hasta ese momento, dando así origen al Imperio Sasánida que dominaría la meseta durante los siguientes cuatro siglos. Autoproclamándose como un Imperio aqueménida restaurado, incluso acercándose a restablecer las fronteras históricas durante la guerra final entre los sasánidas y los bizantinos, el Imperio Sasánida quedó finalmente debilitado tras décadas de guerra y se convirtió en un objetivo fácil para el temprano Califato islámico.\n\nTras la conquista islámica de Irán, muchos pueblos del antiguo imperio comenzaron a convertirse lentamente a la nueva religión, dando lugar a nuevas dinastías iraníes nativas como los Saffáridas o Samaníes durante el Intermezzo iraní. Además de ser la fuerza principal detrás de la integración de Jwarazm y Sogdiana en la esfera Ērāniana, estas dinastías también fueron mecenas de la cultura y las artes que dieron lugar a la fusión cultural islámico-persa.\n\nCaracterizados por su [herencia|E] iraní y diversas [lenguas|E] iraníes como el persa, jwarazmiano o caspio, los muchos descendientes de los Ērānians siguen formando el grupo dominante en la meseta iraní y en Asia Central."
 
 game_concept_scytho_sarmatian: "Iraní oriental"
 game_concept_scytho_sarmatians: "Iraníes orientales"
 game_concept_scythian: "Escita"
 game_concept_scythians: "Escitas"
 game_concept_sarmatian: "Sarmata"
 game_concept_sarmatians: "Sarmatas"
 game_concept_chorasmian: "Corasmio"
 game_concept_chorasmians: "Corasmians"
 game_concept_pactyran: "Pactyano"
 game_concept_pactyrans: "Pactyanos"
 game_concept_saka: "Saca"
 game_concept_sakas: "Sacas"
 game_concept_parni: "Parnos"
 game_concept_cadusi: "Cadusios"
 game_concept_scytho_sarmatians_desc: "Los iraníes orientales, también conocidos como escitas, sarmatas o saka, son un pueblo antiguo que habitó históricamente las estepas de Eurasia, viviendo tan al oeste como Panonia y tan al este como Zhetysu. Durante la era de migración, muchas tribus como los Taifales o Alanos se trasladaron al Imperio Romano, estableciendo sus propios reinos junto con grupos germánicos como los vándalos en el norte de África.\n\nDespués de estas migraciones, aquellos iraníes orientales que se quedaron atrás se asimilaron gradualmente en nuevos grupos emergentes como los diversos pueblos túrquicos o [eslavos antiguos|E], aunque algunos permanecen como los Alanos del Cáucaso o los Saka de la Cuenca de Tarim.\n\nCaracterizados por su [herencia|E] serindia y sarmata, así como por sus diversas [lenguas|E] iraníes como el alanio, sogdiano o saka, los iraníes orientales se encuentran principalmente en Alania, Kashgar, Khotan, así como en varios bolsillos a lo largo de la India."
 
 game_concept_aramean: "Arameo"
 game_concept_chaldean: "Caldeo"
 game_concept_athoraya: "Asoriano"
 game_concept_arameans: "Arameos"
 game_concept_arameans_desc: "Los arameos, también conocidos como sirios o caldeos, fueron un pueblo antiguo originario de Aram, ubicado en el Levante. Durante la época del Imperio Asirio, la lengua aramea se extendió gradualmente a Mesopotamia, reemplazando las antiguas lenguas acadianas que una vez se hablaban allí.\n\nA lo largo del periodo post-asirio, los diversos pueblos de habla aramea cayeron gradualmente bajo la influencia de imperios vecinos, a saber, los iraníes y los romanos, lo que provocó una divergencia gradual en la cultura.\n\nCaracterizados por su [herencia|E] aramea y su [lengua|E] aramea compartida, los descendientes de los arameos continúan viviendo en forma de los siríacos, asirios, así como en la comunidad mandea."
 
 game_concept_aryan: "Ario"
 game_concept_aryans: "Arios"
 game_concept_sakans: "Sacas"
 
 game_concept_germans: "Alemanes"
 game_concept_german: "Alemán"
 game_concept_east_frankish: "Franco oriental"
 game_concept_germans_desc: "Los alemanes son los descendientes de diversas antiguas tribus germánicas que habitaron los territorios orientales de Francia, como Renania, Sajonia o Franconia.\n\nSi bien en origen estaban divididas entre sus componentes tribales, como los francos, los sajones, los alamanes y los bávaros, estas tribus compartían una serie de dialectos germánicos similares que las separaban de los francos, progresivamente romanizados, del oeste. Esta lengua diutisc común acabaría sentando la base de una identidad compartida que distinguió a estos europeos centrales de sus vecinos romances y eslavos, aunque no sería hasta la época moderna cuando surgiría un verdadero sentimiento de identidad nacional compartida. No obstante, pese a la mudanza y evolución de unas identidades tribales que solían servir de término genérico para este grupo, estos hablantes de diutisc de Europa central llegaron a ser conocidos como un pueblo más o menos único y coherente y desempeñarían un papel crucial en la historia dinástica y política de Europa durante siglos.\n\nCaracterizados por su [culture|E] de influencia franca y su [heritage|E] germánico central, los alemanes habitan principalmente en Europa central, en los territorios que conformaron la Francia Oriental."
 
 game_concept_arabs: "Árabes"
 game_concept_arab: "Árabe"
 game_concept_arabic: "Árabe"
 game_concept_arabicized: "Arabizado"
 game_concept_bedouins: "Beduinos"
 game_concept_bedouin: "Beduino"
 game_concept_arabs_desc: "Los árabes son los descendientes de diversos pueblos de Arabia que fueron unidos, en época reciente, bajo la bandera del islam.\n\nAunque permanecieron desunidos durante gran parte de su historia, su reciente unificación en el siglo VII bajo el Califato Rashidún les permitió conquistar buena parte del mundo conocido. En el transcurso de apenas un siglo, los árabes lograron imponer su dominio sobre tierras tan occidentales como Hispania y tan orientales como Jorasán. Con la expansión de la nueva religión, la lengua y la cultura árabes, reforzadas por la migración y la asimilación, se fueron difundiendo y divergiendo por los vastos imperios islámicos, dando lugar con el tiempo a diversas culturas nuevas.\n\nCaracterizados por su [language|E] árabe y su [heritage|E] árabe, los árabes habitan principalmente la península arábiga, pero también se los encuentra en número considerable en Mesopotamia, el Levante y el Magreb."
 
 game_concept_visigoths: "Godos"
 game_concept_visigoth: "Godo"
 game_concept_visigothic: "Gótico"
 game_concept_visigoths_desc: "Los godos, conocidos coloquialmente también como visigodos, ostrogodos y godos de Crimea, son un pueblo germánico oriental originario de las costas septentrionales del mar Negro.\n\nSi bien su origen puede rastrearse probablemente hasta el Vístula e incluso quizá hasta Escandinavia, las pruebas concretas de un pueblo godo diferenciado solo surgen después de que los tervingios y los greutungos cruzaran el Danubio hacia territorio romano durante el siglo IV d. C. Tras una serie de conflictos entre romanos y hunos, y en medio de diversas guerras civiles romanas, los godos fundaron sus propios reinos en la Galia y, más tarde, en Iberia e Italia. Aunque en su mayor parte los godos se asimilaron a la cultura romana en sentido amplio, dejaron su huella en el paisaje mediterráneo durante siglos, especialmente en Iberia y el sur de Francia, donde las leyes visigodas persistieron hasta bien entrado el siglo X d. C. y más allá.\n\nCaracterizados por su [language|E] germánica oriental y su [heritage|E] germánico oriental, los godos fueron asimilados hace mucho y hoy solo pueden hallarse en Crimea."
 
