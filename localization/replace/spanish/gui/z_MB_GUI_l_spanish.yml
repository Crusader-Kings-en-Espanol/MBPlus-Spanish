 game_concept_celtiberians: "Celtiberos"
 game_concept_celtiberian: "Celtibero"
 game_concept_old_galician: "Galaicos"
 game_concept_old_asturian: "Astures"
 game_concept_old_cantabrian: "Cántabros"
 game_concept_celtiberians_desc: "Los Celtiberos fueron los antiguos habitantes de las regiones septentrional y occidental de la península ibérica. Aunque la mayoría de ellos acabó conquistada y asimilada con el tiempo, los antiguos galaicos, astures y cántabros lograron resistir a los romanos hasta la época de Augusto y solo fueron sometidos hacia finales del siglo I a. C. Pese a ello, consiguieron preservar su lengua y su cultura hasta bien entrada la alta Edad Media, período en el que reafirmarían brevemente su independencia.\n\nAunque finalmente serían conquistados y [romanized|E] definitivamente por los visigodos, aún desempeñarían un papel vital en el futuro de Iberia: tras la conquista musulmana de la península, parte de la nobleza visigoda huiría a las regiones montañosas, donde se aliaría con los lugareños para formar el Reino de Asturias, predecesor de reinos posteriores como León, Castilla y Galicia."

 game_concept_romans: "Romanos"
 game_concept_roman: "Romano"
 game_concept_romanized: "Romanizados"
 game_concept_romance: "Cortejar"
 game_concept_romans_desc: "Los romanos fueron un pueblo originalmente latino que habitaba la ciudad de Roma, pero cuyo nombre e identidad llegaron a ser adoptados por buena parte del mundo mediterráneo a lo largo de la historia del Imperio romano.\n\nSi bien en origen, en su sentido más estricto, el término romano designaba a un habitante de la ciudad de Roma o a un descendiente de un ciudadano romano, la propia idea de lo que significaba ser romano fue generalizándose progresivamente hasta que, hacia el año 212 d. C., la ciudadanía romana se concedió por fin a todos los habitantes del Imperio. A lo largo de la historia de Roma, la etiqueta pasó a designar más bien un estilo de vida cultural y un estatus jurídico que una identidad étnica propiamente dicha, aunque con frecuencia también adoptó esa forma.\n\nCaracterizados por sus [languages|E] derivadas del griego o del latín, así como por sus [heritages|E] latino, franco, ibérico, valaco, rético o romano (oriental), los descendientes de los romanos siguen constituyendo la población mayoritaria en buena parte del Mediterráneo."
 
 
