 game_concept_guelph: "Guelfos"
 game_concept_guelphs: "Guelfos"
 game_concept_guelphs_desc: "Los Guelfos, también conocidos como el Partido Papal, son partidarios de los Welfs y su santidad el Papa en los conflictos con el Emperador del Sacro Imperio Romano y [gibelino|E], que comenzaron inicialmente con la Controversia de las Investiduras."
 game_concept_guelph_desc: "Los Guelfos, también conocidos como el Partido Papal, son partidarios de los Welfs y su santidad el Papa en los conflictos con el Emperador del Sacro Imperio Romano y [gibelino|E], que comenzaron inicialmente con la Controversia de las Investiduras."
 game_concept_ghibelline: "Gibelinos"
 game_concept_ghibellines: "Gibelinos"
 game_concept_ghibellines_desc: "Los Gibelinos, también conocidos como el Partido Imperial, son partidarios del Emperador del Sacro Imperio Romano en los conflictos con el Papa y [guelfo|E], que comenzaron inicialmente con la Controversia de las Investiduras."
 game_concept_ghibelline_desc: "Los Gibelinos, también conocidos como el Partido Imperial, son partidarios del Emperador del Sacro Imperio Romano en los conflictos con el Papa y [guelfo|E], que comenzaron inicialmente con la Controversia de las Investiduras."
 
 game_concept_early_medieval1: "Temprano Medieval"
 game_concept_early_medieval1_desc: "La Alta Edad Media o Período Medieval Temprano, a veces referido como la Edad Oscura (un término que los historiadores modernos ya no usan), es generalmente considerada por los historiadores como que duró desde finales del siglo V o principios del siglo VI hasta el siglo X. El término alternativo Antigüedad Tardía, para la primera parte del período, enfatiza elementos de continuidad con el Imperio Romano, mientras que la Alta Edad Media se usa para enfatizar desarrollos característicos del período medieval anterior.\n\nEn el 800, el título de Emperador fue revivido en Europa Occidental con Carlomagno, cuyo Imperio Carolingio afectó en gran medida la estructura social y la historia europea posterior. Europa experimentó un retorno a la agricultura sistemática en la forma del sistema feudal, que adoptó innovaciones como la siembra de tres campos y el arado pesado. La migración bárbara se estabilizó en gran parte de Europa, aunque la expansión vikinga afectó en gran medida al norte de Europa.\n\nDespués de que Mahoma introdujera el Islam, se aceleró la cultura del Medio Oriente hacia una Edad de Oro Islámica, inspirando logros en arquitectura, la reactivación de antiguos avances en ciencia y tecnología, y la formación de una forma de vida distintiva. Los musulmanes salvaron y difundieron avances griegos en medicina, álgebra, geometría, astronomía, anatomía y ética que más tarde encontrarían su camino de regreso a Europa Occidental."
 game_concept_high_medieval1: "Alta Medieval"
 game_concept_high_medieval1_desc: "La Alta Edad Media, o Período Medieval Alto, fue el período de la historia europea que duró desde alrededor del año 1000 hasta 1250. La Alta Edad Media fue precedida por la Edad Media Temprana y seguida por la Baja Edad Media, que terminó alrededor del año 1500.\n\nLas tendencias históricas clave de la Alta Edad Media incluyen el aumento rápido de la población en Europa, lo que provocó grandes cambios sociales y políticos respecto a la era anterior, y el Renacimiento del siglo XII, incluidos los primeros desarrollos del éxodo rural y la urbanización. Para 1250, el robusto aumento de la población había beneficiado en gran medida a la economía europea, que alcanzó niveles que no se volverían a ver en algunas áreas hasta el siglo XIX. Esa tendencia se desvaneció durante la Baja Edad Media debido a una serie de calamidades, notablemente la Peste Negra, pero también a numerosas guerras y estancamiento económico.\n\nEn el Medio Oriente, este fue el apogeo de la Edad de Oro Islámica, que tradicionalmente terminó con el colapso del Califato Abasí debido a la invasión mongola y el Asedio de Bagdad."
 game_concept_late_medieval1: "Baja Medieval"
 game_concept_late_medieval1_desc: "La Baja Edad Media o Período Medieval Bajo fue el período de la historia europea que duró desde el año 1250 hasta 1500. La Baja Edad Media siguió a la Alta Edad Media y precedió al inicio del período moderno temprano (y en gran parte de Europa, el Renacimiento).\n\nAlrededor de 1300, siglos de prosperidad y crecimiento en Europa llegaron a su fin. Una serie de hambrunas y plagas, incluida la Gran Hambruna de 1315–1317 y la Peste Negra, redujeron la población a alrededor de la mitad de lo que había sido antes de las calamidades. Junto con la despoblación, surgieron disturbios sociales y guerras endémicas. Francia e Inglaterra experimentaron serios levantamientos de campesinos, como la Jacquerie y la Rebelión de los Campesinos, así como más de un siglo de conflicto intermitente, la Guerra de los Cien Años. Para añadir a los muchos problemas del período, la unidad de la Iglesia Católica se vio temporalmente destrozada por el Cisma de Occidente. Colectivamente, esos eventos a veces se denominan la Crisis de la Baja Edad Media.\n\nA pesar de las crisis, el siglo XIV también fue una época de grandes avances en las artes y las ciencias. Tras un renovado interés en los textos griegos y romanos antiguos que se había arraigado en la Alta Edad Media, comenzó el Renacimiento italiano. La absorción de textos latinos había comenzado antes del Renacimiento del siglo XII a través del contacto con árabes durante las Cruzadas, pero la disponibilidad de textos griegos importantes se aceleró con la Captura de Constantinopla por los turcos otomanos, cuando muchos eruditos bizantinos tuvieron que buscar refugio en Occidente, particularmente en Italia."
 
 game_concept_anglosaxons: "Anglian y Sajón"
 game_concept_anglosaxons_desc: "A finales del siglo IX y principios del siglo X, los reyes de Wessex derrotaron a los daneses y liberaron a los ángulos del Danelaw. Unieron su casa en matrimonio con la realeza anglosajona sobreviviente, y fueron aceptados por los ángulos como sus reyes. Esto marcó el paso del viejo mundo anglosajón y el amanecer de los 'ingleses' como un nuevo pueblo."
 
