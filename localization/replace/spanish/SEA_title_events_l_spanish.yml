l_spanish:
 sea_title_event.0001.title:0 "A Royal Name"
 sea_title_event.0001.desc:0 "Ahora que soy [ROOT.Char.GetTitleTierName], sólo es apropiado que tome un nuevo nombre de ajuste de mi estación. Me llamaré a mí mismo..."
 sea_title_event.0001.father:0 "Después de mi querido padre, [ROOT.Char.GetFather.GetFirstNameNoTooltip]"
 sea_title_event.0001.mother:0 "Después de mi querida madre, [ROOT.Char.GetMother.GetFirstNameNoTooltip]"

 sea_title_event.2001.t:0 "El [title.GetNameNoTooltip]"
 sea_title_event.2001.desc:0 "La gente del [title.GetName] ha seleccionado [new_count.GetName] para representarlos."
 sea_title_event.2001.a:0 "Por supuesto, la gente debe gobernarse a sí misma."
 sea_title_event.2001.b:0 "¡No, [title.GetNameNoTierNoTooltip] es mío!"

 sea_gov_event.1000.t:0 "Un Reino Unido"
 sea_gov_event.1000.desc:0 "Después de generaciones de luchas, he conseguido asegurar el lugar correcto de mi dinastía como los gobernantes de [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTier]. \n \n Con mi autoridad sin cuestionar, las posibilidades son infinitas. Pronto, todo el mundo sabrá el nombre - [ROOT.Char.GetDynasty.GetBaseNameNoTooltip]!"
 sea_gov_event.1000.a:0 "Podemos reinar mucho."

 sea_gov_event.1001.t:0 "Las comunas de [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]"
 sea_gov_event.1001.desc:0 "Las tierras que yo dirijo y represento se han vuelto demasiado grandes para mí para dirigir por mi cuenta, y por lo tanto mantuve una reunión de la gente respetada de la tierra para reformar en una confederación de comunas, unificada para la defensa común, pero liderada por miembros respetados de las comunidades locales. Hemos acordado que debido a mi posición respetada, seré el primero en dirigir esta confederación."
 sea_gov_event.1001.a:0 "¡Viva [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]!"

 sea_title_event.5001.title:0 "Una Nueva Dinastía"
 sea_title_event.5001.desc:0 "Con la guerra y el reino asegurado, ahora es el momento de seleccionar un nuevo nombre para una nueva era. Como el nuevo portador del Mandato del Cielo, un nombre auspicioso debe ser elegido para reflejar la virtud de mi regla y guiar el reino a la prosperidad."
 sea_title_event.5001.qi:0 "Ahora es el momento del Gran Qi."
 sea_title_event.5001.liang:0 "Liang llevará a cabo una era de paz."
 sea_title_event.5001.wu:0 "El Mandato del Cielo pertenece a Wu."
 sea_title_event.5001.chu:0 "¡Ch sufrirá por mil años!"
 sea_title_event.5001.han:0 "El Han restaura el orden al reino."
 sea_title_event.5001.xia:0 "La gloriosa Xia produce una nueva era."
 sea_title_event.5001.min:0 "La luz de Min brillará brillantemente."
 sea_title_event.5001.yue:0 "Se levanta, fuerte y verdadero."
 sea_title_event.5001.chen:0 "Chen ushers en una era de prosperidad."
 sea_title_event.5001.song:0 "La dinastía Song, bendecida por el Cielo, unificará la tierra."
 sea_title_event.5001.yan:0 "La fuerza de Yan conquistará todo."
 sea_title_event.5001.zhao:0 "El destino de Zhao es gobernar."
 sea_title_event.5001.jin:0 "La dinastía Jin produce una paz duradera."
 sea_title_event.5001.shu:0 "Shu se levantará como un faro de justicia."
 sea_title_event.5001.wei:0 "El poder de Wei es inigualable."
 sea_title_event.5001.zhou:0 "La dinastía Zhou renueva el mandato celestial."
 sea_title_event.5001.yuan:0 "Yuan trae un nuevo orden al mundo."
 sea_title_event.5001.tang:0 "La dinastía Tang traerá una era de gloria sin precedentes."
 sea_title_event.5001.qin:0 "Qin unifica a todos bajo el cielo."
 sea_title_event.5001.ba:0 "El espíritu de Ba nunca se romperá."
 sea_title_event.5001.liao:0 "El reinado de Liao será vasto y poderoso."
