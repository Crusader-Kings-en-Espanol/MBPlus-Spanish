l_spanish:
## Byzantine
 byzantine_peltast: "Peltastas"
 byzantine_peltast_flavor: "#F Infantes ligeros equipados con escudos y armas arrojadizas, expertos en hostigar al enemigo mediante escaramuzas y capaces de combatir cuerpo a cuerpo cuando es necesario.#!"

 byzantine_apelatai: "Apelatai"
 byzantine_apelatai_flavor: "#F Guerreros fronterizos bizantinos especializados en incursiones, exploración y emboscadas, que aprovechan su conocimiento del terreno para hostigar a los enemigos del imperio.#!"

 byzantine_toxotai: "Toxotai"
 byzantine_toxotai_flavor: "#F Arqueros bizantinos equipados con arcos compuestos y armaduras acolchadas, que apoyan a la infantería mediante salvas de flechas y portan espadas o pequeñas hachas para defenderse.#!"

 byzantine_psiloi: "Psiloi"
 byzantine_psiloi_flavor: "#F Infantes ligeros bizantinos armados con arcos, hondas o jabalinas, que hostigan las formaciones enemigas y aprovechan su movilidad para evitar el combate directo.#!"

 byzantine_akontistai: "Akontistai"
 byzantine_akontistai_flavor: "#F Hostigadores bizantinos armados con jabalinas ligeras, pequeños escudos y hachas, que debilitan al enemigo mediante ataques a distancia antes de retirarse.#!"

 byzantine_koursores: "Koursores"
 byzantine_koursores_flavor: "#F Jinetes bizantinos de gran movilidad, equipados para combatir cuerpo a cuerpo y especializados en proteger los flancos, perseguir al enemigo y enfrentarse a su caballería.#!"

 byzantine_trapezitai: "Trapezitai"
 byzantine_trapezitai_flavor: "#F Jinetes ligeros de las fronteras orientales del imperio, encargados de vigilar los pasos fronterizos, alertar de las incursiones enemigas y hostigar a los invasores hasta la llegada de refuerzos.#!"

 byzantine_hippotoxotai: "Hippotoxotai"
 byzantine_hippotoxotai_flavor: "#F Arqueros montados bizantinos equipados con arcos compuestos y armaduras, que disparan salvas coordinadas mientras aprovechan su movilidad para hostigar las formaciones enemigas.#!"

 byzantine_skythikon: "Skythikon"
 byzantine_skythikon_flavor: "#F Arqueros montados reclutados entre los pueblos nómadas de las estepas, especialmente los cumanos, que emplean arcos compuestos y rápidas maniobras para desgastar al enemigo.#!"

 byzantine_vardariotai: "Vardariotas"
 byzantine_vardariotai_flavor: "#F Jinetes de élite procedentes de las comunidades asentadas en el valle del Vardar, expertos en el manejo del arco compuesto y en las maniobras de caballería ligera.#!"

 byzantine_menaulatoi: "Menaulatoi"
 byzantine_menaulatoi_flavor: "#F Infantes especializados en el manejo del menaúlion, una pesada lanza de varios metros de longitud, que protegen las formaciones bizantinas frente a las cargas de caballería.#!"

 byzantine_skoutatoi: "Skoutatoi"
 byzantine_skoutatoi_flavor: "#F Infantes pesados bizantinos equipados con largas lanzas, espadas y grandes escudos llamados skouta, que forman líneas defensivas para resistir las acometidas enemigas.#!"

 byzantine_kontophoros: "Kontophoros"
 byzantine_kontophoros_flavor: "#F Lanceros pesados bizantinos protegidos por armaduras y grandes escudos, que forman sólidas líneas defensivas capaces de contener las cargas de caballería y proteger a las tropas de apoyo.#!"

 byzantine_klibanophoroi: "Klibanophoroi"
 byzantine_klibanophoroi_flavor: "#F Catafractos bizantinos de élite, protegidos por pesadas armaduras tanto en el jinete como en la montura, que ejecutan devastadoras cargas con sus largas lanzas.#!"

 byzantine_latinkon: "Latinkon"
 byzantine_latinkon_flavor: "#F Caballeros occidentales al servicio del Imperio bizantino, protegidos por cotas de malla y equipados con largas lanzas, que destacan por la fuerza de sus cargas de caballería pesada.#!"

 byzantine_trebuchet: "Helépolis"
 byzantine_trebuchet_flavor: "#F Máquinas de asedio bizantinas empleadas para lanzar grandes proyectiles de piedra contra murallas y fortificaciones, abriendo brechas para facilitar el asalto de las ciudades enemigas.#!"

## BULGARIAN
 bulgarian_voynik: "Voynik"
 bulgarian_voynik_flavor: "#F Infantes eslavos de los ejércitos búlgaros, equipados con lanzas, espadas y escudos, que constituyen el grueso de la infantería y apoyan las maniobras de la caballería.#!"

 bulgarian_ciobani: "Ciobani"
 bulgarian_ciobani_flavor: "#F Pastores y montañeses acostumbrados a las duras condiciones de las tierras altas, que combaten como infantería ligera armados con lanzas, garfios y otras armas de asta.#!"

 bulgarian_oklopnitsi: "Oklopnitsi"
 bulgarian_oklopnitsi_flavor: "#F Guerreros profesionales al servicio de los boliares y otros grandes señores búlgaros, protegidos por pesadas armaduras y entrenados para resistir los combates más encarnizados.#!"

 bulgarian_konnik: "Konnik"
 bulgarian_konnik_flavor: "#F Jinetes pesados que constituyen la principal fuerza de choque de los ejércitos búlgaros, protegidos por armaduras y equipados con lanzas y espadas para ejecutar poderosas cargas.#!"

 bulgarian_testudos: "Arietes protegidos"
 bulgarian_testudos_flavor: "#F Arietes cubiertos por estructuras reforzadas con placas metálicas, que protegen a sus servidores de los proyectiles enemigos mientras derriban puertas y fortificaciones.#!"

## TURKISH
 turkish_azabs: "Azabes"
 turkish_azabs_flavor: "#F Infantes ligeros otomanos reclutados para proteger caminos y posiciones estratégicas, equipados con armas sencillas y empleados como apoyo de las tropas regulares.#!"

 sipahis: "Sipahíes"
 sipahis_flavor: "#F Jinetes otomanos armados con arcos compuestos y protegidos por armaduras ligeras, capaces de hostigar al enemigo y combatir cuerpo a cuerpo cuando es necesario.#!"

 sipahi_lancers: "Lanceros sipahíes"
 sipahi_lancers_flavor: "#F Jinetes sipahíes equipados con lanzas y armaduras resistentes, especializados en ejecutar cargas contra las formaciones enemigas y combatir cuerpo a cuerpo.#!"

 janissaries_archer: "Arqueros jenízaros"
 janissaries_archer_flavor: "#F Arqueros profesionales del cuerpo de jenízaros, entrenados para mantener un fuego constante de flechas y debilitar las formaciones enemigas antes del avance de la infantería.#!"

 janissaries_infantry: "Jenízaros"
 janissaries_infantry_flavor: "#F Infantes de élite otomanos sometidos a un riguroso entrenamiento, equipados con armas de asta y espadas, que destacan por su disciplina y eficacia en el combate.#!"

 turkish_qapukulu: "Kapıkulu"
 turkish_qapukulu_flavor: "#F Soldados profesionales de la casa militar del sultán, protegidos por buenas armaduras y armados con mazas, que destacan por su disciplina y destreza en el combate cuerpo a cuerpo.#!"

 islamic_ahdath: "Ahdath"
 islamic_ahdath_flavor: "#F Milicianos urbanos reclutados para defender sus ciudades, armados con largas lanzas y organizados para resistir las acometidas enemigas.#!"

 islamic_iqtadar: "Iqtadar"
 islamic_iqtadar_flavor: "#F Jinetes que prestan servicio militar a cambio de los ingresos de tierras concedidas por sus señores, equipados con arcos y armaduras para combatir a distancia y cuerpo a cuerpo.#!"

 islamic_hasham: "Hasham"
 islamic_hasham_flavor: "#F Guerreros escogidos para integrar el séquito militar del soberano, equipados con buenas armas y armaduras y encargados de protegerlo durante el combate.#!"

## ISLAMIC
 islamic_rijal: "Rijal"
 islamic_rijal_flavor: "#F Infantes de los primeros califatos, armados con lanzas y espadas, que combinan cargas y retiradas sucesivas para desgastar y desorganizar las formaciones enemigas.#!"

 islamic_rumat: "Rumat"
 islamic_rumat_flavor: "#F Arqueros árabes entrenados para disparar con precisión, que debilitan las formaciones enemigas mediante salvas de flechas antes del avance de la infantería.#!"

 islamic_fursan: "Fursan"
 islamic_fursan_flavor: "#F Jinetes árabes protegidos por armaduras y equipados con lanzas y espadas, que aprovechan la velocidad de sus monturas para ejecutar poderosas cargas contra el enemigo.#!"

 barbary_corsairs: "Berberiscos"
 barbary_corsairs_flavor: "#F Marinos y combatientes de los puertos del norte de África, expertos en incursiones costeras, abordajes y ataques contra las embarcaciones mercantes del Mediterráneo.#!"

 islamic_naffatun: "Naffatun"
 islamic_naffatun_flavor: "#F Especialistas en el empleo de sustancias incendiarias, que arrojan recipientes de nafta inflamada para sembrar el pánico y provocar incendios entre las filas enemigas.#!"

 abbasid_trebuchet: "Manjaniq"
 abbasid_trebuchet_flavor: "#F Máquinas de asedio empleadas por los ejércitos de los califatos para lanzar grandes proyectiles contra murallas y fortificaciones, facilitando el asalto de las plazas enemigas.#!"

## EGYPTIAN
 islamic_khasseki_infantry: "Infantería khasseki"
 islamic_khasseki_infantry_flavor: "#F Mercenarios de origen kurdo y beduino que sirven como infantería auxiliar en los ejércitos egipcios, equipados con hachas, escudos y armaduras ligeras.#!"

 abid_alshira: "Abid al-Shira"
 abid_alshira_flavor: "#F Soldados de origen sudanés reclutados mediante la esclavitud militar, armados con arcos compuestos y cuchillos, que destacan por su eficacia en el combate a distancia.#!"

 islamic_alashair_infantry: "Lanceros al-Ashair"
 islamic_alashair_infantry_flavor: "#F Guerreros procedentes de las tribus de Siria, Palestina y el Líbano, armados con lanzas y escudos, que sirven como mercenarios o infantería regular de sus señores.#!"

 mamluk_cavalry: "Caballería mameluca"
 mamluk_cavalry_flavor: "#F Jinetes profesionales reclutados mediante la esclavitud militar, sometidos a un riguroso entrenamiento y equipados para servir como caballería de élite de sus señores.#!"

 ghilman_nubians: "Ghilman zanj"
 ghilman_nubians_flavor: "#F Infantes de origen sudanés y nubio al servicio de los gobernantes egipcios, que constituyen una fuerza permanente y disciplinada dentro de sus ejércitos.#!"

 sibyan_alkhass: "Sibyan al-Jass"
 sibyan_alkhass_flavor: "#F Jóvenes soldados escogidos para servir en la guardia de élite del soberano, protegidos por cotas de malla y armados con espadas y arcos compuestos.#!"

 egyptian_tabardariyya: "Tabardariyya"
 egyptian_tabardariyya_flavor: "#F Guardias de palacio armados con hachas de guerra, encargados de proteger las dependencias del sultán y combatir a quienes amenacen su seguridad.#!"

 egyptian_khassaki: "Khassaki"
 egyptian_khassaki_flavor: "#F Jinetes de élite que forman la guardia personal del sultán, escogidos por su lealtad y destreza, y equipados con excelentes caballos, armas y armaduras.#!"

## PERSIAN
 persian_paighan: "Paighan"
 persian_paighan_flavor: "#F Infantes reclutados entre las clases populares del Imperio sasánida, equipados con armas sencillas y escasa protección, que constituyen el grueso de sus fuerzas de infantería.#!"

 persian_kamandaran: "Kamandaran"
 persian_kamandaran_flavor: "#F Arqueros persas entrenados para disparar con rapidez y precisión, que combaten protegidos tras grandes escudos mientras mantienen una lluvia constante de flechas sobre el enemigo.#!"

 persian_neyzedaran: "Neyze-daran"
 persian_neyzedaran_flavor: "#F Lanceros persas equipados con grandes escudos de mimbre, que forman líneas defensivas para contener las acometidas enemigas y proteger a las tropas de proyectiles.#!"

 persian_war_elephant: "Elefantes de guerra persas"
 persian_war_elephant_flavor: "#F Enormes elefantes empleados por los ejércitos persas para quebrar las formaciones enemigas, sembrando el pánico entre hombres y caballos con sus poderosas embestidas.#!"

 persian_cataphract: "Aswārān"
 persian_cataphract_flavor: "#F Jinetes de la aristocracia sasánida, protegidos por pesadas armaduras y diestros en el manejo de lanzas y arcos, que constituyen la principal fuerza de caballería del imperio.#!"

 gondi_shahanshah: "Gond-i Shahanshah"
 gondi_shahanshah_flavor: "#F Guerreros de élite dailamitas al servicio del sahansah, armados con jabalinas y hachas de guerra, que combaten protegidos por grandes escudos y destacan por su resistencia y disciplina.#!"

 ## NUBIAN
 nubian_archers: "Arqueros Nubios"
 nubian_archers_flavor: "#F El núcleo de los ejércitos nubios eran sus afamados arqueros, que empleaban anillos en los pulgares para aumentar la fuerza y precisión de sus disparos. Durante casi 600 años, los poderosos arqueros de la región crearon una barrera para la expansión musulmana hacia el noreste del continente africano, combatiendo múltiples invasiones y asaltos con enjambres de flechas urticantes.#!"

 ## ETHIOPIAN
 shotel_warriors: "Shotelai"
 shotel_warriors_flavor: "#F Un guerrero entrenado en el uso del shotel y sus técnicas. Utilizando la naturaleza curva del shotel, estos guerreros son capaces de enganchar al oponente alcanzándolo alrededor de un escudo o cualquier otro implemento defensivo o arma.#!"

 ## MONGOL
 mongol_cataphract: "Lanceros mongoles"
 mongol_cataphract_flavor: "#F Caballería pesada de élite mongola, protegida por armaduras laminares conocidas como khuyag y equipada con lanzas y mazas. Sus jinetes y monturas acorazadas destacan por la fuerza de sus cargas y su destreza en el combate cuerpo a cuerpo.#!"

 ## IBERIA
 iberian_raiders: "Almogávares"
 iberian_raiders_flavor: "#F Infantes ligeros expertos en incursiones y ataques por sorpresa, armados con azconas, lanzas cortas y cuchillos, capaces de combatir con eficacia en terrenos difíciles.#!"

 spanish_jinete: "Jinete"
 spanish_jinete_flavor: "#F Jinetes ligeros ibéricos armados con lanzas, adargas y jabalinas, expertos en hostigar al enemigo mediante rápidas acometidas y retiradas.#!"

 muslim_jinete: "Jinetes nazaríes"
 muslim_jinete_flavor: "#F Jinetes ligeros nazaríes armados con adargas y jabalinas, expertos en hostigar al enemigo mediante rápidas acometidas y retiradas.#!"

 portugal_crossbowmen: "Besteiros do conto"
 portugal_crossbowmen_flavor: "#F Ballesteros reclutados entre las milicias concejiles portuguesas, organizados mediante cupos de servicio y entrenados para defender ciudades y fortalezas.#!"

 iberian_coseletes: "Coseletes"
 iberian_coseletes_flavor: "#F Infantes protegidos por coseletes y armados con picas, espadas y otras armas de asta, que refuerzan las formaciones de infantería ibéricas.#!"

 iberian_picas_secas: "Picas secas"
 iberian_picas_secas_flavor: "#F Piqueros equipados únicamente con sus largas picas y armamento básico, que forman el grueso de las compañías de infantería y mantienen a raya a la caballería enemiga.#!"

 portugal_aventuros: "Aventureiros"
 portugal_aventuros_flavor: "#F Piqueros portugueses de élite, protegidos por buenas armaduras y escogidos por su experiencia y valentía para combatir en las posiciones más peligrosas.#!"

 ## GAELIC
 gaelic_ceathairne: "Ceathairne"
 gaelic_ceathairne_flavor: "#F Una banda de combatientes de un clan de las Tierras Altas de Escocia.#!"

 ## IRISH
 irish_ceithern: "Ceithern"
 irish_ceithern_flavor: "#F Infantes ligeros irlandeses que aprovechan su velocidad y conocimiento del terreno para hostigar al enemigo mediante ataques rápidos y retiradas estratégicas.#!"

 irish_ostmen: "Ostmen"
 irish_ostmen_flavor: "#F Guerreros de ascendencia norgaélica asentados en Irlanda, experimentados en el combate con espada y escudo.#!"

 irish_ridire: "Ridire"
 irish_ridire_flavor: "#F Caballeros de la nobleza irlandesa, entrenados para combatir a caballo y equipados con lanzas, mazas y armaduras resistentes.#!"

 irish_cliathairi: "Cliathairi"
 irish_cliathairi_flavor: "#F Infantes profesionales disciplinados, expertos en el manejo de largas lanzas para mantener a raya a la caballería enemiga.#!"

 irish_horseboys: "Jinetes"
 irish_horseboys_flavor: "#F Jóvenes escuderos irlandeses que combaten a caballo, aprovechando su velocidad y destreza con las jabalinas para hostigar al enemigo.#!"

 irish_muire: "Muire"
 irish_muire_flavor: "#F Espadachines escogidos y equipados por sus señores, a quienes sirven como escoltas personales y protegen durante el combate.#!"

 irish_galloglaigh: "Gall óglaigh"
 irish_galloglaigh_flavor: "#F Mercenarios norgaélicos protegidos por cotas de malla y armados con grandes hachas de dos manos, temidos por su fuerza en el combate cuerpo a cuerpo.#!"

 ## WELSH
 welsh_helwyr: "Helwyr"
 welsh_helwyr_flavor: "#F Cazadores acostumbrados a los bosques y terrenos escarpados de Gales, expertos en hostigar al enemigo y combatir en terrenos difíciles.#!"

 welsh_saethwyr: "Saethwyr"
 welsh_saethwyr_flavor: "#F Arqueros galeses diestros en el manejo del arco largo, capaces de hostigar al enemigo desde la distancia, pero vulnerables en combate cuerpo a cuerpo.#!"

 welsh_rhyfelwyr: "Rhyfelwyr"
 welsh_rhyfelwyr_flavor: "#F Guerreros de infantería pesada, protegidos por armaduras y armados con hachas de dos manos para romper las formaciones enemigas.#!"

 welsh_teulu: "Teulu"
 welsh_teulu_flavor: "#F Jinetes escogidos entre los guerreros más leales al señor, que forman su séquito personal y lo acompañan y protegen en combate.#!"

 ## POLISH
 woodsmen: "Drwale"
 woodsmen_flavor: "#F Guerreros polacos acostumbrados a combatir en los densos bosques de Europa oriental, armados con grandes hachas y expertos en aprovechar el terreno para tender emboscadas.#!"

 polish_strzelcy: "Strzelcy"
 polish_strzelcy_flavor: "#F Jinetes ligeros polacos armados con pequeñas ballestas, expertos en hostigar al enemigo y aprovechar su movilidad para evitar el combate cuerpo a cuerpo.#!"

 ## LITHUANIAN
 giltines_chosen: "Elegidos de Giltinė"
 giltines_chosen_flavor: "#F Guerreros escogidos en nombre de Giltinė, diosa de la muerte, equipados con buenas armaduras y armas de asta para enfrentarse tanto a infantes como a jinetes.#!"

 dzukijan_horsemen: "Jinetes dzūkianos"
 dzukijan_horsemen_flavor: "#F Arqueros montados de Dzūkija, equipados con armaduras ligeras o sin protección, que aprovechan su movilidad para hostigar al enemigo y evitar el combate cuerpo a cuerpo.#!"

 dievas_guard: "Guardia de Dievas"
 dievas_guard_flavor: "#F Jinetes pesados consagrados a Dievas, equipados con robustas monturas y horcas de guerra, que destacan por la fuerza de sus acometidas.#!"

 lithuanian_bajorija: "Bajorija"
 lithuanian_bajorija_flavor: "#F Jinetes de la nobleza lituana, protegidos por buenas armaduras y armados con hachas de guerra, que constituyen una fuerza destacada de sus ejércitos.#!"

 ## HUNGARIAN
 pavise_spearmen: "Lanceros con paveses"
 pavise_spearmen_flavor: "#F Infantes húngaros equipados con lanzas, armaduras y grandes paveses, que forman sólidas líneas defensivas para resistir las acometidas enemigas.#!"

 hungarian_hussar: "Húsares"
 hungarian_hussar_flavor: "#F Jinetes ligeros húngaros armados con lanzas, espadas y escudos, expertos en ejecutar rápidas acometidas y retiradas para hostigar al enemigo.#!"

 hungarian_tizlandzsasok: "Tízlándzsások"
 hungarian_tizlandzsasok_flavor: "#F Nobles privilegiados de la región de Szepes, obligados a proporcionar contingentes de lanceros al ejército húngaro a cambio de sus derechos y exenciones.#!"

 hungarian_banderium: "Banderío real"
 hungarian_banderium_flavor: "#F Jinetes pesados que combaten bajo el estandarte real, protegidos por buenas armaduras y equipados con lanzas y espadas para servir como fuerza de choque del soberano.#!"

 ## RUSSIAN
 berdiche_axemen: "Berdicheros"
 berdiche_axemen_flavor: "#F Infantes de choque armados con grandes hachas de hoja alargada llamadas berdiches, protegidos por cotas de malla o brigantinas y especializados en el combate cuerpo a cuerpo.#!"

 druzhina_cavalry: "Caballería druzhina"
 druzhina_cavalry_flavor: "#F Jinetes de élite que forman el séquito militar de los príncipes de la Rus, protegidos por cotas de malla y armados con lanzas y hachas de guerra.#!"

 dvor_cavalry: "Caballería de dvor"
 dvor_cavalry_flavor: "#F Jinetes al servicio de los príncipes y boyardos de la Rus, equipados con arcos y armaduras, que combinan el hostigamiento a distancia con el combate cuerpo a cuerpo.#!"

 cossack_cavalry: "Caballería cosaca"
 cossack_cavalry_flavor: "#F Jinetes ligeros de las estepas, armados con arcos compuestos y sables, que aprovechan su movilidad para hostigar al enemigo mediante rápidas incursiones y retiradas.#!"

 ## ITALIAN
 genoese_crossbowmen: "Balestrieri genovesi"
 genoese_crossbowmen_flavor: "#F Ballesteros genoveses célebres por su precisión y disciplina, que combaten al servicio de la República de Génova o como mercenarios de otros señores europeos.#!"

 milan_famiglia_ducale: "Familia ducal"
 milan_famiglia_ducale_flavor: "#F Caballeros de élite al servicio del duque de Milán, protegidos por armaduras de placas y equipados con lanzas y espadas para combatir en defensa de su señor.#!"

 lanze_spezzate: "Lanze spezzate"
 lanze_spezzate_flavor: "#F Jinetes profesionales experimentados, protegidos por armaduras de placas y armados con lanzas y espadas, que sirven como combatientes independientes de las compañías de caballería.#!"

 ## SICILIAN
 sicilian_archers: "Arqueros lucerinos"
 sicilian_archers_flavor: "#F Arqueros musulmanes de Lucera, descendientes de las comunidades trasladadas desde Sicilia, que sirven a los soberanos del sur de Italia equipados con arcos y armaduras ligeras.#!"

 ## ENGLISH
 yeoman_archers: "Arqueros yeomen"
 yeoman_archers_flavor: "#F Arqueros ingleses reclutados entre los pequeños propietarios rurales, entrenados en el manejo del arco largo y capaces de mantener una lluvia constante de flechas sobre el enemigo.#!"

 sherwood_archers: "Arqueros de Sherwood"
 sherwood_archers_flavor: "#F Arqueros expertos en el manejo del arco largo de tejo, acostumbrados a combatir en terrenos boscosos y tender emboscadas aprovechando su puntería y conocimiento del terreno.#!"

 english_billmen: "Billmen"
 english_billmen_flavor: "#F Infantes ingleses armados con bills, armas de asta provistas de hojas cortantes y ganchos, capaces de herir, derribar y desarmar tanto a infantes como a jinetes.#!"

 english_hobilar: "Hobilares"
 english_hobilar_flavor: "#F Jinetes ligeros ingleses montados en pequeños caballos, equipados con lanzas y espadas, que destacan en tareas de exploración, incursiones y persecución de enemigos en retirada.#!"

 ## FRANKISH
 french_aventurier: "Aventuriers"
 french_aventurier_flavor: "#F Combatientes profesionales equipados con ballestas y espadas, protegidos por armaduras de placas y experimentados tanto en el combate a distancia como cuerpo a cuerpo.#!"

 french_voulgier: "Voulgiers"
 french_voulgier_flavor: "#F Infantes franceses armados con voulges, armas de asta de hoja ancha y cortante, eficaces tanto contra la infantería como contra la caballería enemiga.#!"

 french_caballarii: "Caballarii"
 french_caballarii_flavor: "#F Jinetes francos equipados con cascos, corazas, espadas y largas lanzas, que combaten mediante cargas y acometidas para romper las formaciones enemigas.#!"

 ## NORMAN
 norman_knights: "Caballeros normandos"
 norman_knights_flavor: "#F Jinetes pesados normandos protegidos por cotas de malla y armados con lanzas y espadas, célebres por sus poderosas cargas y su participación en campañas de conquista por toda Europa.#!"

 ## CENTRAL GERMANIC
 germanic_verlorene_haufe: "Verlorene Haufe"
 germanic_verlorene_haufe_flavor: "#F Guerreros escogidos para combatir en las posiciones más peligrosas, armados con grandes espadas de dos manos y protegidos por pesadas armaduras, que encabezan los asaltos contra las formaciones enemigas.#!"

 ## DANISH
 danish_obudshaer: "Obudshær"
 danish_obudshaer_flavor: "#F Infantes daneses protegidos por armaduras de placas y armados con alabardas, capaces de contener las cargas de caballería y combatir eficazmente cuerpo a cuerpo.#!"

 danish_svenner: "Svenner"
 danish_svenner_flavor: "#F Jinetes daneses equipados con armas y armaduras ligeras, que complementan a la caballería pesada mediante tareas de apoyo, exploración y persecución.#!"

 ## OUTREMER
 outremer_bowmen: "Arqueros sodeer"
 outremer_bowmen_flavor: "#F Arqueros mercenarios al servicio de los Estados cruzados, equipados con arcos y cuchillos, que compensan la escasez de tropas feudales mediante su experiencia en el combate a distancia.#!"

 outremer_turcopoles: "Turcópolos"
 outremer_turcopoles_flavor: "#F Jinetes ligeros reclutados entre las poblaciones de Oriente Próximo, armados con arcos y lanzas, que sirven como exploradores y hostigadores en los ejércitos cruzados.#!"

 outremer_heavy_cavalry: "Caballeros de Jerusalén"
 outremer_heavy_cavalry_flavor: "#F Caballeros feudales del Reino de Jerusalén, protegidos por cotas de malla y equipados con lanzas, espadas y hachas, que constituyen la principal fuerza de choque de sus ejércitos.#!"

 ## MALINKE
 sofa: "Sofas"
 sofa_flavor: "#F Arqueros mandingas equipados con arcos cortos y flechas envenenadas o incendiarias, que compensan el alcance limitado de sus armas mediante disparos concentrados y ataques contra las posiciones enemigas.#!"