## Byzantine
 byzantine_peltast: "Peltastas"
 byzantine_peltast_flavor: "#F Los peltastas eran un tipo de soldados de infantería ligera, originarios de Tracia y Peonia, y llamados así por el tipo de escudo que llevaban. Los peltastas solían servir como escaramuzadores, soldados relativamente poco equipados capaces de una gran movilidad en el campo de batalla. Sin embargo, a veces se describía a los peltastas bizantinos como "tropas de asalto", igualmente capaces de combatir cuerpo a cuerpo.#!"

 byzantine_apelatai: "Apelatai"
 byzantine_apelatai_flavor: "#F Los apelatai actuaban como incursores, exploradores y guardias fronterizos en la perenne guerra fronteriza entre Bizancio y sus vecinos orientales, caracterizada por escaramuzas e incursiones.#!"

 byzantine_toxotai: "Toxotai"
 byzantine_toxotai_flavor: "#F Los toxotai eran arqueros de la antigua Grecia y Bizancio. Su equipo incluía un arco compuesto, una "armadura blanda" de construcción textil acolchada y acolchada, y un spathion (espada recta de doble filo) o tzikourion (hacha pequeña) para la autodefensa. #!"

 byzantine_psiloi: "Psiloi"
 byzantine_psiloi_flavor: "#F Estos soldados, altamente entrenados en el arte del arco, eran arqueros formidables y unidades de gran movilidad. La mayoría de los arqueros imperiales procedían de Asia Menor, especialmente de la región alrededor de Trebisonda, en el mar Negro, donde fueron criados, entrenados y equipados.#!"

 byzantine_akontistai: "Akontistai"
 byzantine_akontistai_flavor: "#F Significa 'jabalineros'. Los akontistai no son más que campesinos armados por el gobernante local. Su arma principal es un puñado de jabalinas ligeras de caza, pero también van armados con una rodela de madera y un hacha pequeña para cuando se ven obligados a entablar combate cuerpo a cuerpo.#!"

 byzantine_koursores: "Koursores"
 byzantine_koursores_flavor: "#F Los koursores eran caballería móvil de combate cuerpo a cuerpo y puede considerarse que procedían de los kataphraktoi, más ligeramente equipados. Los koursores estaban destinados principalmente a enfrentarse a la caballería enemiga y solían situarse en los flancos de la línea de batalla principal.#!"

 byzantine_trapezitai: "Trapezitai"
 byzantine_trapezitai_flavor: "#F Los Trapezitai eran la caballería ligera que complementaba a los Apelatai, la infantería ligera que vigilaba las fronteras orientales del Imperio. En caso de una gran incursión árabe, debían (junto con los Apelatai) dar la voz de alarma, ayudar en la evacuación de la población local a los distintos bastiones, y hacer sombra y hostigar a la fuerza enemiga hasta que pudieran llegar los refuerzos.#!"

 byzantine_hippotoxotai: "Hippotoxotai"
 byzantine_hippotoxotai_flavor: "#F Arqueros montados que cabalgaban por delante de la caballería, estos arqueros a caballo bizantinos eran soldados de caballería más pesados, a menudo acorazados y armados con arcos, que disparaban desde filas disciplinadas. Disparaban flechas por orden y ofrecían una concentración móvil de fuego de proyectiles en el campo de batalla.#!"

 byzantine_skythikon: "Skythikon"
 byzantine_skythikon_flavor: "#F Skythikon es el término bizantino utilizado para describir a los nómadas asiáticos, principalmente cumanes, que sirven al Imperio Bizantino exclusivamente como arqueros a caballo. Acostumbrados a ir a caballo por las llanuras y estepas de Europa oriental, así como por la región del Mar Negro, estos jinetes llevan poca armadura y van armados con un arco compuesto y una espada pequeña.#!"

 byzantine_vardariotai: "Vardariotas"
 byzantine_vardariotai_flavor: "#F Los vardariotai proceden principalmente de los magiares que se asentaron en el valle del Vardar, y de sus descendientes. Disciplinados y altamente entrenados, los Vardariotai son arqueros a caballo de élite. Llevan cotas de malla ligeras o armaduras brigandinas y disparan un potente arco compuesto desde el caballo. Son capaces de acribillar implacablemente a sus enemigos con flechas y utilizan su movilidad para no meterse en líos.#!"

 byzantine_menaulatoi: "Menaulatoi"
 byzantine_menaulatoi_flavor: "#F Los menaulatoi eran una unidad de infantería de élite especializada y entrenada en el uso del "menaulion", una lanza pesada de unos tres o cuatro metros de longitud. Los menaulatoi se utilizaban a menudo como complemento de los escaramuzadores, para tapar huecos entre las filas de infantería o para atacar a la caballería que se acercaba.#!"

 byzantine_skoutatoi: "Skoutatoi"
 byzantine_skoutatoi_flavor: "#F El grueso de la infantería bizantina - llamada así por el skouton, un gran escudo ovalado, redondo o en forma de cometa que portaban. Cada unidad tenía una decoración de escudo diferente, a menudo con motivos helenísticos o cristianos. Además del escudo, iban armados con lanzas largas y/o espadas.#!"

 byzantine_kontophoros: "Kontophoros"
 byzantine_kontophoros_flavor: "#F La infantería pesada komneniana iba armada con una larga lanza, portaba grandes escudos y disponía de toda la armadura disponible. El papel de estas tropas, dispuestas en filas, era principalmente defensivo. Constituían un baluarte capaz de resistir las cargas de la caballería pesada enemiga, formaban una base móvil desde la que la caballería podía lanzar ataques y detrás de la cual podían agruparse.#!"

 byzantine_klibanophoroi: "Klibanophoroi"
 byzantine_klibanophoroi_flavor: "#F Los Klibanophoroi, que significan 'portadores del horno del campamento', eran una unidad militar bizantina de caballería pesada acorazada. Al igual que los catafractos, los jinetes y sus monturas estaban completamente blindados. Su nombre se debe a la cantidad de armadura que llevaban, que hacía que se calentaran muy rápidamente en la batalla.#!"

 byzantine_latinkon: "Latinkon"
 byzantine_latinkon_flavor: "#F Latinkon es el término colectivo para las formaciones de caballería pesada 'caballeresca' latina del ejército bizantino. Con su pesada cota de malla y sus lanzas, la carga del caballero occidental era muy temida por los bizantinos.#!"

 byzantine_trebuchet: "Helépolis"
 byzantine_trebuchet_flavor: "El ejército bizantino contaba con un formidable brazo de artillería que era especialmente temido por sus enemigos orientales. En los relatos contemporáneos, las máquinas de guerra más conspicuas eran los trebuchets de tracción a piedra, denominados helepolis, traducidos como 'tomadores de ciudades'.#!"

## BULGARIAN
 bulgarian_voynik: "Voynik"
 bulgarian_voynik_flavor: "#F La infantería del estado búlgaro estaba compuesta principalmente por eslavos, que generalmente eran soldados ligeramente armados. Los soldados de infantería eslavos iban equipados con espadas, lanzas, arcos y escudos de madera o cuero. Sin embargo, eran menos disciplinados y menos eficaces que la caballería búlgara.#!"

 bulgarian_ciobani: "Ciobani"
 bulgarian_ciobani_flavor: "#F Llevando una vida de pastor y bandolero, viviendo en lo alto de las montañas, estos soldados irregulares son más duros que un simple campesino, pero siguen siendo nada más que una milicia ligera, portando lanzas y otras armas de asta, como garfios de pico, similares a sus báculos de pastor.#!"

 bulgarian_oklopnitsi: "Oklopnitsi"
 bulgarian_oklopnitsi_flavor: "#F Todo noble notable y rico, incluidos los grandes boliares y el propio zar, mantiene una unidad profesional y regular de guerreros personales. Como sugiere el nombre "oklopnik" (que significa "soldado, cubierto de hierro"), estos hombres están fuertemente acorazados y pueden aguantar más que casi nadie en una batalla campal.#!"

 bulgarian_konnik: "Konnik"
 bulgarian_konnik_flavor: "#F "jinete" en búlgaro, los konnik representan la famosa caballería pesada que formaba el núcleo del ejército búlgaro. En su apogeo, en los siglos IX y X, fue una de las fuerzas militares más formidables de Europa y muy temida por sus enemigos.#!"

 bulgarian_testudos: "Testudos"
 bulgarian_testudos_flavor: "#F Los Testudos son arietes con un revestimiento metálico en la parte superior que ayuda a defenderse de los proyectiles hostiles.#!"

## TURKISH
 turkish_azabs: "Azabs"
 turkish_azabs_flavor: "#F Tropas ligeras mal armadas que deben vigilar puentes y carreteras y apoyar a las tropas más pesadas. #!"

 sipahis: "Sipahis"
 sipahis_flavor: "#F Arqueros a caballo medianamente armados, aunque menos móviles que otros arqueros a caballo, son más aptos para la lucha cuerpo a cuerpo.#!"

 sipahi_lancers: "Lanceros Sipahi"
 sipahi_lancers_flavor: "#F "Una clase superior de sipahis, más aptos para el combate cuerpo a cuerpo que sus homólogos arqueros.#!"

 janissaries_archer: "Janisarios"
 janissaries_archer_flavor: "#F Los jenízaros son expertos arqueros equipados con poderosos arcos. Los arqueros jenízaros bombardean al enemigo con flechas, debilitando y rompiendo las formaciones antes de que la infantería avance. Suelen llevar alguna armadura debajo de la túnica.#!"

 janissaries_infantry: "Janisarios"
 janissaries_infantry_flavor: "#F Entrenados en muchas armas, estos jenízaros luchan con una alabarda y están protegidos por una armadura de cota de malla. Se espera de ellos que lideren la carga de infantería en la batalla con valentía y honor.#!"

 turkish_qapukulu: "Qapukulu"
 turkish_qapukulu_flavor: "#Guardias domésticos de élite, bien acorazados y equipados con mazas, los Qapukulu son duros oponentes en el combate cuerpo a cuerpo.#!"

 islamic_ahdath: "Ahdath"
 islamic_ahdath_flavor: "¡Milicia armada con lanzas largas.#!"

 islamic_iqtadar: "Iqta'dar"
 islamic_iqtadar_flavor: "#F Estas tropas reciben tierras de su Emir a cambio del servicio militar. Caballería de misiles dura y bien protegida.#!"

 islamic_hasham: "Hasham"
 islamic_hasham_flavor: "#Guerreros de élite elegidos entre los mamelucos para ser el regimiento personal y guardaespaldas del sultán.#!"

## ISLAMIC
 islamic_rijal: "Rijal"
 islamic_rijal_flavor: "#F Las líneas de infantería en pie formaban la mayor parte del ejército Rashidun. Realizaban repetidas cargas y retiradas conocidas como karr wa farr, utilizando lanzas y espadas combinadas con salvas de flechas para debilitar a los enemigos y desgastarlos.#!"

 islamic_rumat: "Rumat"
 islamic_rumat_flavor: "#F Los arqueros Rashidun destacan por su aguda habilidad para apuntar a los ojos del enemigo y suelen ser tiradores precisos y potentes, parecidos al arquero bizantino.#!"

 islamic_fursan: "Fursan"
 islamic_fursan_flavor: "#F Los cronistas clásicos dan a entender que la caballería árabe del siglo V en adelante son tropas montadas pesadas bien blindadas, comparables a los catafractos. Los árabes solían cubrir sus armaduras con capas de colores apagados para evitar las quemaduras solares en sus armaduras metálicas causadas por el clima caluroso del desierto.#!"

 barbary_corsairs: "Corsarios Bereberes"
 barbary_corsairs_flavor: "#F Los corsarios bereberes eran piratas y corsarios musulmanes que operaban desde el norte de África, con base principalmente en los puertos de Salé, Rabat, Argel, Túnez y Trípoli. Esta zona era conocida en Europa como la Costa Berberisca, en referencia a los bereberes. Sus actividades de depredación se extendían por todo el Mediterráneo, hacia el sur a lo largo de la costa atlántica de África Occidental y hacia el Atlántico Norte hasta Islandia, pero operaban principalmente en el Mediterráneo occidental.#!"

 islamic_naffatun: "Nafta"
 islamic_naffatun_flavor: "#F Estos hombres lanzan mortíferas vasijas de nafta inflamada que pueden atravesar cualquier armadura.#!"

 abbasid_trebuchet: "Manjaniq"
 abbasid_trebuchet_flavor: "#F Las catapultas fueron evidentes en la historia de los primeros califatos y se utilizaron ampliamente en operaciones de asedio siempre que se esperaba que los ejércitos musulmanes permanecieran atrincherados en una zona durante mucho tiempo. Christides destacó las altas curvas de aprendizaje de los árabes durante los primeros califatos en el sentido de que podían ponerse a la altura de civilizaciones más establecidas como la bizantina en la fabricación de complejas máquinas de guerra como la catapulta manjaniq.#!"

## EGYPTIAN
 islamic_khasseki_infantry: "Infantería Khasseki"
 islamic_khasseki_infantry_flavor: "#F Los Khasseki proceden de nómadas kurdos y beduinos que se alquilan como mercenarios. Muy utilizados como auxiliares en todo Egipto, estas tropas van equipadas con un hacha y un escudo, además de llevar una armadura básica.#!"

 abid_alshira: "Abid al-Shira"
 abid_alshira_flavor: "#F Los Abid al-Shira, 'esclavos comprados', son unidades formadas por esclavos sudaneses. Estas tropas van armadas con un arco compuesto, y sólo disponen de un cuchillo para luchar. Esto y su armadura ligera les hace poco aptos para el combate cuerpo a cuerpo. #!"

 islamic_alashair_infantry: "Lanceros de Al-'Ashair"
 islamic_alashair_infantry_flavor: "#F Los al-Ashair son nómadas sirio-palestinos y miembros de tribus libanesas contratados principalmente como infantería. Originalmente contratados como mercenarios en tiempos de guerra, se convirtieron en soldados regulares cuando se establecieron junto a sus jefes, a los que habían dado tierras para que las mantuvieran. Estos miembros de las tribus van equipados con lanza, escudo y llevan poca o ninguna armadura.

 mamluk_cavalry: "Caballería Mameluca"
 mamluk_cavalry_flavor: "Los mamelucos eran soldados militares esclavos, comprados, entrenados y equipados para luchar en nombre del gobernante como expertos soldados de caballería.#!"

 ghilman_nubians: "Zanj Ghilman"
 ghilman_nubians_flavor: "El uso de soldados procedentes de Sudán y del sur ha sido una larga práctica en Egipto, sobre todo desde los tuluníes. Estos soldados sirven como infantería y son el pilar del ejército del gobernante.#!"

 sibyan_alkhass: "Sibyan al-Jass"
 sibyan_alkhass_flavor: "#F Significando 'guardia joven', los Sibyan al-Khass son tropas de élite dentro de los Mamelucos Reales armados con arcos compuestos, espadas y armadura de cota de malla.#!"

 egyptian_tabardariyya: "Tabardariyya"
 egyptian_tabardariyya_flavor: "#F Normalmente se encuentran custodiando el palacio del sultán, estos guerreros armados con hachas son excelentes luchadores. #!"

 egyptian_khassaki: "Khassaki"
 egyptian_khassaki_flavor: "#F Estas tropas de élite son los guardaespaldas del propio sultán, a los que se les dan los mejores caballos y se equipan con las mejores armaduras y armas disponibles.#!"

## PERSIAN
 persian_paighan: "Paighan"
 persian_paighan_flavor: "#F Los Paighan eran la unidad de infantería ligera de reclutas del ejército sasánida y formaban el grueso de su fuerza de infantería. A veces se decía que los Paighan eran utilizados como "carne de cañón." #!"

 persian_kamandaran: "Kamandaran"
 persian_kamandaran_flavor: "#F Traducido literalmente como "portador del arco", estos arqueros formaban la élite de la infantería persa. Estaban entrenados para lanzar sus flechas con extrema rapidez y con una puntería casi infalible. Los arqueros sasánidas disparaban sus armas con gran eficacia detrás de una especie de muro formado por enormes escudos ondulados."

 persian_neyzedaran: "Neyze-daran"
 persian_neyzedaran_flavor: "#F Traducidos literalmente como "Portadores de lanzas", los neyze-daran eran una infantería media armada con lanzas y grandes escudos de mimbre que posiblemente eran un subconjunto de las unidades paighan.#!"

 persian_war_elephant: "Elefantes de Guerra Persas"
 persian_war_elephant_flavor: "#F Aunque pequeños en número, los elefantes de guerra han servido durante mucho tiempo como componentes integrales de los ejércitos persas. Su sola presencia en el campo de batalla dispersa a hombres y horeses por igual mientras pisotean a aquellos valientes, necios o desafortunados que se interponen en su camino.#!"

 persian_cataphract: "Aswārān"
 persian_cataphract_flavor: "#F Los Aswārān, también deletreados Asbārān y Savaran, eran una fuerza de caballería que formaba la columna vertebral del ejército del Imperio sasánida. Los proporcionaba la aristocracia, estaban fuertemente acorazados y podían ser desde arqueros hasta catafractos.

 gondi_shahanshah: "Gond-i Shahanshah"
 gondi_shahanshah_flavor: "#F Llamados así por la famosa unidad de élite daylamita del Shahanshah sasánida, estos hombres son sorprendentemente duros, hábiles en el combate cuerpo a cuerpo y capaces de soportar terribles privaciones. Van armados con jabalinas y hachas de combate, y llevan altos escudos pintados en colores grises. En la batalla, suelen formar un muro con sus escudos contra los atacantes.#!"

 ## NUBIAN
 nubian_archers: "Arqueros Nubios"
 nubian_archers_flavor: "#F El núcleo de los ejércitos nubios eran sus afamados arqueros, que empleaban anillos en los pulgares para aumentar la fuerza y precisión de sus disparos. Durante casi 600 años, los poderosos arqueros de la región crearon una barrera para la expansión musulmana hacia el noreste del continente africano, combatiendo múltiples invasiones y asaltos con enjambres de flechas urticantes.#!"

 ## ETHIOPIAN
 shotel_warriors: "Shotelai"
 shotel_warriors_flavor: "#F Un guerrero entrenado en el uso del shotel y sus técnicas. Utilizando la naturaleza curva del shotel, estos guerreros son capaces de enganchar al oponente alcanzándolo alrededor de un escudo o cualquier otro implemento defensivo o arma.#!"

 ## MONGOL
 mongol_cataphract: "Lanceros Mongoles"
 mongol_cataphract_flavor: "#F Estas tropas de choque de élite cambian la movilidad por una armadura más pesada tanto en el jinete como en la montura. Son guerreros sumamente hábiles que destacan en el combate armado y la equitación. Van armados con una lanza y una maza conocidas como "gulda" y blindados con una coraza laminar llamada "khuyad."#!"

 ## IBERIA
 iberian_raiders: "Almogávares"
 iberian_raiders_flavor: "#Fuerzas de choque de infantería y asaltantes que combatían a pie, con armas ligeras y equipaje, generalmente con un par de jabalinas, una lanza corta y un falchion.#!"

 spanish_jinete: "Jinete"
 spanish_jinete_flavor: "#F Jinete ligero español que vestía armadura de cuero e iba armado con jabalinas, una lanza, una espada y un escudo.#!"

 muslim_jinete: "Jinetes granadinos"
 muslim_jinete_flavor: "#F Escaramuzadores con armadura ligera, armados con jabalina y capaces de formar en círculo proporcionando fuego constante contra el enemigo.#!"

 portugal_crossbowmen: "Besteiros do conto"
 portugal_crossbowmen_flavor: "#F milicia portuguesa formada por arqueros con ballesta, generalmente reclutados entre artesanos acostumbrados a la caza.#!"

 iberian_coseletes: "Coseletes"
 iberian_coseletes_flavor: "#F Llamados así por la armadura defensiva básica que llevaban, los coseletes servían como élites en las formaciones de picas ibéricas.#!"

 iberian_picas_secas: "Picas secas"
 iberian_picas_secas_flavor: "#F Los soldados peor pagados de sus compañías, los picas secas ("picas secas") eran normalmente novicios que automáticamente servían en estas posiciones hasta que compraban el equipo necesario para poder servir en otros roles.#!"

 portugal_aventuros: "Aventuros"
 portugal_aventuros_flavor: "#Impetuosos y de sangre caliente, armados con picas y una excelente armadura, esta unidad de élite es una de las mejores unidades de picas disponibles.#!"

 ## GAELIC
 gaelic_ceathairne: "Ceathairne"
 gaelic_ceathairne_flavor: "#F Una banda de combatientes de un clan de las Tierras Altas de Escocia.#!"

 ## IRISH
 irish_ceithern: "Ceithern"
 irish_ceithern_flavor: "#F Los ceithern acompañaban a las bandas de los mercenarios gall óglaigh como sus fuerzas de infantería ligera. Ataviados con armaduras sencillas, los ceithern se basaban en la velocidad y la movilidad, y a menudo utilizaban tácticas de ataque relámpago como multiplicador de fuerzas para enfrentarse a formaciones mucho más numerosas.#!"

 irish_ostmen: "Ostmen"
 irish_ostmen_flavor: "#F Soldados de origen vikingo competentes en el uso de la espada y el escudo.#!"

 irish_ridire: "Ridire"
 irish_ridire_flavor: "#F Estos caballeros proceden de familias nobles, están bien entrenados y equipados con lanza y maza.#!"

 irish_cliathairi: "Cliathairi"
 irish_cliathairi_flavor: "#F ¡Soldados profesionales bien entrenados, diestros en el uso de la lanza larga.#!"

 irish_horseboys: "Jinetes"
 irish_horseboys_flavor: "#F Estos jóvenes escuderos son excelentes jinetes, llevan poca armadura y son rápidos y muy precisos con la jabalina.#!"

 irish_muire: "Muire"
 irish_muire_flavor: "#F Bien equipados por sus señores, estos espadachines protegen y custodian a sus amos a cambio.#!"

 irish_galloglaigh: "Gall óglaigh"
 irish_galloglaigh_flavor: "#F Los gallóglaigh blandían enormes hachas de esparto a dos manos y una espada ancha o claymore. Como armadura, los gallóglaigh llevaban una cota de malla sobre una chaqueta acolchada y un casco de hierro. A menudo iban acompañados de dos muchachos, uno de los cuales portaba sus lanzas arrojadizas mientras que el otro llevaba sus provisiones.#!"

 ## WELSH
 welsh_helwyr: "Helwyr"
 welsh_helwyr_flavor: "#F Cazadores locales, que aunque poco hábiles y mal equipados para la guerra, son feroces y decididos luchadores.#!"

 welsh_saethwyr: "Saethwyr"
 welsh_saethwyr_flavor: "#F Los primeros portadores del arco largo. Al estar totalmente desarmados, deben mantenerse alejados del cuerpo a cuerpo.#!"

 welsh_rhyfelwyr: "Rhyfelwyr"
 welsh_rhyfelwyr_flavor: "#F Infantería de ataque fuerte y con armadura pesada, experta en el uso del hacha de doble mango. #!"

 welsh_teulu: "Teulu"
 welsh_teulu_flavor: "#¡Casi familiares, estos jinetes son los más allegados a su señor.#!"

 ## POLISH
 woodsmen: "Leñadores"
 woodsmen_flavor: "#F Gente dura de los bosques del noreste de Europa, ¡armados con una gran hacha.#!"

 polish_strzelcy: "Strzelcy"
 polish_strzelcy_flavor: "#F Strzelcy, que significa tiradores en polaco, son tropas de caballos ligeros protegidos por una armadura ligera que usan una ballesta pequeña.#!"

 ## LITHUANIAN
 giltines_chosen: "Elegidos de Giltine"
 giltines_chosen_flavor: "#F Bien equipados, estos hombres forman una infantería sólida, y sus armas de asta los hacen eficaces tanto contra enemigos a pie como a caballo. #!"

 dzukijan_horsemen: "Jinetes de Dzukijan"
 dzukijan_horsemen_flavor: "#F Estos jinetes con arcos evitan el combate cuerpo a cuerpo, ya que suelen luchar sin armadura.#!"

 dievas_guard: "Guardia de Dievas"
 dievas_guard_flavor: "#F Poderosa caballería que entra en batalla montada en fuertes corceles y empuñando brutales horcas de guerra.#!"

 lithuanian_bajorija: "Bajorija"
 lithuanian_bajorija_flavor: "#F Estos nobles prefieren blandir un hacha en la batalla y llevar una armadura similar a la de sus homólogos occidentales.#!"

 ## HUNGARIAN
 pavise_spearmen: "Lanceros de Pavise"
 pavise_spearmen_flavor: "#F Baja burguesía al servicio militar. Llevan una buena armadura y van equipados con una lanza, pudiendo formar un anillo defensivo de lanzas.#!"

 hungarian_hussar: "Húsares"
 hungarian_hussar_flavor: "#F Reconocidos por sus rápidas tácticas de golpear y huir, los húsares van equipados con cota de malla, escudo, lanza y espada.#!"

 hungarian_tizlandzsasok: "Tízlándzsások"
 hungarian_tizlandzsasok_flavor: "#F Los tízlándzsások, que significan nobles de diez lanzas, eran un grupo de nobles condicionales que vivían en la región de Szepes del Reino de Hungría. Anteriormente, estos nobles formaban parte del contingente asignado a tareas de guardia fronteriza en la periferia de los territorios conquistados de la región. Estaban obligados a equipar con diez caballeros o lanceros al ejército húngaro.

 hungarian_banderium: "Banderío Real"
 hungarian_banderium_flavor: "#Farmados con lanzas y enfundados en armaduras de placas estos leales guerreros actúan como séquitos y guardaespaldas de la realeza.#!"

 ## RUSSIAN
 berdiche_axemen: "Hacheros de Berdiche"
 berdiche_axemen_flavor: "#F Hacheros a dos manos utilizados como tropas de choque. Pueden llevar armadura desde malla hasta brigandina.#!"

 druzhina_cavalry: "Caballería druzhina"
 druzhina_cavalry_flavor: "#Fieros guerreros de caballería con armadura de cota de malla y armados con lanza y un hacha malvada, que actúan como guardaespaldas de los Jefes.#!"

 dvor_cavalry: "Caballería de Dvor"
 dvor_cavalry_flavor: "#F Al servicio del Príncipe local o del Boyardo de alto estatus, los Dvors se encuentran entre la mejor caballería de proyectiles disponible.#!"

 cossack_cavalry: "Caballería Cosaca"
 cossack_cavalry_flavor: "#Fieros y resistentes, aunque carentes de armadura, los cosacos van equipados con una espada y un arco compuesto que utilizan desde el caballo.#!"

 ## ITALIAN
 genoese_crossbowmen: "Balestrieri Genovesi"
 genoese_crossbowmen_flavor: "#F Los ballesteros genoveses (en italiano: Balestrieri genovesi) fueron un famoso cuerpo militar de la Edad Media, que actuó tanto en defensa de la República de Génova como fuerza mercenaria para otras potencias italianas o europeas.#!"

 milan_famiglia_ducale: "Familia Ducal"
 milan_famiglia_ducale_flavor: "#Con armadura de placas y lanzas, estos caballeros de élite defienden el honor de su duque.#!"

 lanze_spezzate: "Lanze Spezzate"
 lanze_spezzate_flavor: "#F Los Lanze Spezzate son soldados profesionales bien entrenados y experimentados, protegidos por armaduras de placas y armados con lanzas y espadas.#!"

 ## SICILIAN
 sicilian_archers: "Arqueros Luceranos"
 sicilian_archers_flavor: "#F Tropas compuestas por musulmanes sicilianos que luchan por su ciudad, equipados con arcos y armaduras ligeras.#!"

 ## ENGLISH
 yeoman_archers: "Arqueros Yeoman"
 yeoman_archers_flavor: "El Rey exige a los propietarios de tierras inglesas que estén entrenados para la guerra. Los Yeoman archers son tropas a distancia altamente cualificadas.#!"

 sherwood_archers: "Arqueros de Sherwood"
 sherwood_archers_flavor: "#F blandiendo un arco largo hecho de tejo, y capaces de esconderse en cualquier terreno, estos hombres son excelentes en las emboscadas y tienen una puntería excepcional.#!"

 english_billmen: "Billmen"
 english_billmen_flavor: "#F Un billmen entrenado puede apuñalar, cortar y arrastrar a sus enemigos, incluyendo tanto infantería como caballería.#!"

 english_hobilar: "Hobilares"
 english_hobilar_flavor: "#F Caballería ligera con lanzas. Útil para perseguir a la infantería ligera, y perseguir al enemigo que huye.#!"

 ## FRANKISH
 french_aventurier: "Aventurero"
 french_aventurier_flavor: "#¡Tropas muy hábiles armadas con ballesta y espada y blindadas con placas.#!"

 french_voulgier: "Voulgier"
 french_voulgier_flavor: "#F Bien equipados, estos hombres forman una infantería sólida, y sus armas de asta los hacen eficaces tanto contra enemigos a pie como a caballo.#!"

 french_caballarii: "Caballarii"
 french_caballarii_flavor: "#F Se esperaba que un caballarius completamente armado tuviera casco, coraza, espada y lanza. Esta última medía entre 2,5 y 3 metros de longitud y tenía la cabeza de hierro extendida y afilada. Los caballarii de Carlomagno usaban la lanza por encima o por debajo de la mano, como arma arrojadiza; o lanzaban la lanza a corta distancia.#!"

 ## NORMAN
 norman_knights: "Caballeros Normandos"
 norman_knights_flavor: "#F De todos los caballeros de Europa, los normandos son los más renombrados. Su herencia vikinga y su ansia de batalla han llevado a muchos a buscar fortuna en el extranjero, especialmente en el sur de Italia. La excepcional ferocidad del caballero normando, así como su pesada armadura, hacen que sea temido en cualquier campo de batalla.#!"

 ## CENTRAL GERMANIC
 germanic_verlorene_haufe: "Verlorene Haufe"
 germanic_verlorene_haufe_flavor: "#F Estos hombres desesperados van armados con una enorme espada a dos manos y una gruesa armadura.#!"

 ## DANISH
 danish_obudshaer: "Obudshaer"
 danish_obudshaer_flavor: "#Una unidad de alabarderos daneses con armadura de placas.#!"

 danish_svenner: "Svenner"
 danish_svenner_flavor: "#¡Una unidad de caballería barata, útil para complementar a caballeros más caros.#!"

 ## OUTREMER
 outremer_bowmen: "Arqueros de Sodeer"
 outremer_bowmen_flavor: "#F Sodeer, que significa soldado, son mercenarios contratados para tareas de larga duración en Outremer. Los mercenarios desempeñan un papel esencial en los estados cruzados, ya que compensan parcialmente la falta de tropas feudales. Esta unidad de arqueros experimentados y bien entrenados apenas llevan armadura y van armados con un arco propio y un cuchillo.#!"

 outremer_turcopoles: "Turcopoles"
 outremer_turcopoles_flavor: "#F Durante el periodo de las Cruzadas, los turcopoles ("hijos de turcos") eran arqueros a caballo y caballería ligera reclutados localmente y empleados por los estados cruzados. En Tierra Santa, los turcopoles estaban más ligeramente equipados que los caballeros y sargentos (hombres de armas a caballo), pues iban armados con lanzas y arcos para ayudar a combatir a las fuerzas musulmanas, más móviles. Los turcopoles servían como caballería ligera, proporcionando escaramuzadores, exploradores y arqueros montados, y a veces cabalgaban como segunda línea en una carga, para respaldar a los caballeros y sargentos francos. Los turcopoles tenían caballos más ligeros y rápidos que las tropas montadas occidentales y llevaban armaduras mucho más ligeras.#!"

 outremer_heavy_cavalry: "Caballeros de Jerusalén"
 outremer_heavy_cavalry_flavor: "#F Caballeros vasallos que deben servicio al Reino de Jerusalén, equipados con lanza, hacha y vistiendo armadura de malla.#!"

 ## MALINKE
 sofa: "Sofas"
 sofa_flavor: "#F Los Sofas iban equipados con dos carcajs, y su arco era pequeño para los estándares europeos. No podía disparar muy lejos ni con mucha potencia, así que los sofás utilizaban venenos mortales y disparaban en arco para dar fuerza a las flechas. Los sofas también utilizaban flechas incendiarias, especialmente contra fortificaciones que a menudo eran poco más que paja o empalizadas de madera.#!"
