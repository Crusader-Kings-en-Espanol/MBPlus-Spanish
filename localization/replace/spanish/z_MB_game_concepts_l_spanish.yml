 game_concept_mandala_desc: "Un Mandala es una forma de [gobierno|E] relativamente descentralizada donde, con una centralización mínima, los [vasallos|E] conceden a su [señor|E] [impuestos|E] pero no [tropas|E]. Sin embargo, los [vasallos aliados|E] pueden ser llamados a la guerra, y un señor de Mandala puede formar una [alianza|E] con un vasallo sin [matrimonio|E]. Al suceder, los vasallos descontentos pueden declarar su independencia, pero el exseñor puede Subyugar a estos gobernantes con descuento."
