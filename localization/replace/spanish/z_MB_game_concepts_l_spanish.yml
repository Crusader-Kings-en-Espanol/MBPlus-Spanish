  game_concept_bp_monolithic_culture_tradition: "Tradición de Cultura Monolítica"
  game_concept_bp_monolithic_culture_tradition_desc: "Una tradición cultural que hace más difícil crear [divergent_cultures|E] y [hybrid_cultures|E] como un personaje de esta cultura. Tiene los siguientes efectos:\n\n$EFFECT_LIST_BULLET$Crear una [hybrid_culture|E] requiere tener un [duchy|E] o superior.\n$EFFECT_LIST_BULLET$[divergent_cultures|E] son #N 150%#! más costosas de crear\n$EFFECT_LIST_BULLET$#EMP No#! se pueden crear [divergent_culture|E] o [hybrid_culture|E] con esta tradición si tu [culture_head|E] es tu [liege|E] o superior, o tu [culture_head|E] es un vasallo compañero."


