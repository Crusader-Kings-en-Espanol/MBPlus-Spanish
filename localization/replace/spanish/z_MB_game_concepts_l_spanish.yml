  game_concept_early_medieval: "Era Medieval Temprana"
  game_concept_early_medieval_desc: "La Edad Media Temprana o Período Medieval Temprano, a veces conocida como la Edad Oscura (un término que los historiadores modernos ya no usan), es típicamente considerada por los historiadores como un período que va desde finales del siglo V o principios del siglo VI hasta el siglo X. El término alternativo Antigüedad Tardía, para la primera parte del período, enfatiza elementos de continuidad con el Imperio Romano, mientras que Edad Media Temprana se usa para enfatizar los desarrollos característicos del período medieval temprano.\n\nEn el año 800, el título de Emperador fue revivido en Europa Occidental con Carlomagno, cuyo Imperio Carolingio afectó significativamente la estructura social y la historia europea posterior. Europa experimentó un regreso a la agricultura sistemática en forma de feudalismo, que adoptó innovaciones como la plantación de tres campos y el arado pesado. La migración bárbara se estabilizó en gran parte de Europa, aunque la expansión vikinga afectó notablemente el norte de Europa.\n\nDespués de que Mahoma introdujo el Islam, se impulsó la cultura de Medio Oriente hacia una Edad de Oro Islámica, inspirando logros en arquitectura, la recuperación de antiguos avances en ciencia y tecnología, y la formación de una forma de vida distintiva. Los musulmanes conservaron y difundieron avances griegos en medicina, álgebra, geometría, astronomía, anatomía y ética, que luego regresarían a Europa Occidental."
  game_concept_high_medieval: "Era Medieval Alta"
  game_concept_high_medieval_desc: "La Alta Edad Media, o Período Medieval Alto, fue el período de la historia europea que duró aproximadamente del año 1000 al 1250 d.C. La Alta Edad Media fue precedida por la Edad Media Temprana y seguida por la Baja Edad Media, que terminó alrededor del año 1500 d.C.\n\nLas principales tendencias históricas de la Alta Edad Media incluyen el rápido crecimiento de la población de Europa, que trajo grandes cambios sociales y políticos desde la era anterior, y el Renacimiento del siglo XII, incluyendo los primeros desarrollos del éxodo rural y de la urbanización. Para 1250, el aumento robusto de la población había beneficiado enormemente la economía europea, alcanzando niveles que no se verían nuevamente en algunas áreas hasta el siglo XIX. Esa tendencia se debilitó durante la Baja Edad Media debido a una serie de calamidades, sobre todo la Peste Negra, pero también numerosas guerras y estancamiento económico.\n\nEn el Medio Oriente, este fue el apogeo de la Edad de Oro Islámica, que tradicionalmente terminó con el colapso del Califato Abasí debido a la invasión mongola y el Sitio de Bagdad."
  game_concept_late_medieval: "Era Medieval Baja"
  game_concept_late_medieval_desc: "La Baja Edad Media o Período Medieval Bajo fue el período de la historia europea que duró desde el año 1250 hasta 1500. La Baja Edad Media siguió a la Alta Edad Media y precedió el inicio del período moderno temprano (y en gran parte de Europa, el Renacimiento).\n\nAlrededor de 1300, siglos de prosperidad y crecimiento en Europa se detuvieron. Una serie de hambrunas y plagas, incluida la Gran Hambruna de 1315-1317 y la Peste Negra, redujeron la población a aproximadamente la mitad de lo que había sido antes de las calamidades. Junto con la despoblación vino el malestar social y la guerra endémica. Francia e Inglaterra experimentaron serias revueltas campesinas, como la Jacquerie y la Revuelta Campesina, así como más de un siglo de conflicto intermitente, la Guerra de los Cien Años. Para sumar a los problemas del período, la unidad de la Iglesia Católica fue temporalmente fracturada por el Cisma de Occidente. Colectivamente, esos eventos se denominan a veces como la Crisis de la Baja Edad Media.\n\nA pesar de las crisis, el siglo XIV fue también un tiempo de gran progreso en las artes y ciencias. Tras un renovado interés en los textos griegos y romanos antiguos que se afianzó en la Alta Edad Media, comenzó el Renacimiento italiano. La absorción de textos latinos había comenzado antes del Renacimiento del siglo XII mediante el contacto con los árabes durante las Cruzadas, pero la disponibilidad de importantes textos griegos se aceleró con la Captura de Constantinopla por los turcos otomanos, cuando muchos estudiosos bizantinos tuvieron que buscar refugio en Occidente, particularmente en Italia."


  game_concept_cow3: "Una ciudad de maravilla"
  game_concept_cow3_desc: "Este Holding es el hogar de una de las ciudades más impresionantes del mundo, con riqueza, cultura y comodidades que la mayoría de la gente nunca podría imaginar o soñar con experimentar por sí mismos. \n \n Progreso: \n Burge - Confía Metrópolis - conejo Megalopolis"
  
  game_concept_theology_desc: "La teología es el estudio sistemático de la naturaleza de lo divino, o más ampliamente de la creencia religiosa. El estudio de la teología puede ayudar a los teólogos a comprender más profundamente su propia tradición religiosa, otra tradición religiosa, o puede permitirles explorar la naturaleza de la divinidad sin referencia a ninguna tradición específica. La teología puede utilizarse para propagar, reformar o justificar una tradición religiosa; o se puede utilizar para comparar, reto (por ejemplo. Crítica bíblica) o oposición (por ejemplo, irreligión) una tradición religiosa o visión del mundo. La teología también podría ayudar a un teólogo a abordar alguna situación actual o necesidad a través de una tradición religiosa, o a explorar posibles formas de interpretar el mundo."
  game_concept_syncretic_desc: "El sincretismo es la práctica de combinar diferentes creencias y diversas escuelas de pensamiento. El sincretismo implica la fusión o asimilación de varias tradiciones originalmente discretas, especialmente en la teología y la mitología de la religión, afirmando así una unidad subyacente y permitiendo un enfoque inclusivo a otras religiones."
