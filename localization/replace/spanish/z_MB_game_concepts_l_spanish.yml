 game_concept_siro_europe: "Vías Comerciales Europeas"
 game_concept_siro_europe_desc: "Varias [siro_trade_route|E] que se extienden desde Iberia en el oeste hasta las tierras de los Rus en el este.\n\n#weak Las rutas comerciales de Europa generalmente consistían en antiguas carreteras imperiales romanas, rutas de peregrinación y otros caminos. Las rutas principales eran [siro_via_regia|E], [siro_via_imperii|E], [siro_varangian|E], [siro_volga|E]. Muchas ciudades a lo largo de la costa del norte de Europa también ganaron importancia cuando se formó la [siro_hanseatic|E].#!"
 game_concept_siro_europe_trade_post: "Puesto de Comercio Europeo"
 game_concept_siro_sahara: "Trans-Sahariana"
 game_concept_siro_sahara_desc: "Amplias [siro_trade_route|E] que viajan a través de la [GetGeographicalRegion('world_africa_sahara').GetName] [region|E] entre el África subsahariana y el norte de África.\n\n#weak El comercio trans-sahariano requiere viajar a través del Sahara entre el África subsahariana y el norte de África. Aunque existía desde tiempos prehistóricos, el auge del comercio se extendió desde el siglo VIII hasta principios del siglo XVII. El Sahara alguna vez tuvo un entorno muy diferente. En Libia y Argelia, desde al menos el 7000 a.C., había pastoreo, la cría de ovejas, cabras, grandes asentamientos y cerámica. El ganado fue introducido en el Sahara Central (Ahaggar) entre 4000 y 3500 a.C. Pinturas rupestres notables (datadas entre 3500 y 2500 a.C.) en lugares que actualmente están muy secos, retratan flora y fauna que no están presentes en el moderno entorno desértico.\n\nComo desierto, el Sahara es ahora una vasta extensión hostil que separa la economía mediterránea de la economía de la cuenca del Níger. El comercio se realizaba mediante caravanas de camellos. Según Ibn Battuta, el explorador que acompañó a una de las caravanas, el tamaño promedio por caravana era de 1,000 camellos, pero algunas caravanas eran tan grandes como 12,000. Las caravanas eran guiadas por berberes muy bien remunerados, que conocían el desierto y podían asegurar un paso seguro entre sus compañeros nómadas del desierto. La supervivencia de una caravana era precaria y dependía de una cuidadosa coordinación. Se enviaban corredores por delante a los oasis para que el agua pudiera ser transportada a la caravana cuando aún estaba a varios días de distancia, ya que las caravanas no podían llevar suficiente agua para todo el viaje. En el siglo XIV, Ibn Battuta cruzó el desierto desde Sijilmasa a través de las minas de sal en Taghaza hasta el oasis de Oualata. Se envió un guía por delante y se llevó agua en un viaje de cuatro días desde Oualata para encontrarse con la caravana.\n\nSe establecieron varias rutas comerciales, quizás la más importante terminando en Sijilmasa (Marruecos) e Ifriqiya al norte. Allí, y en otras ciudades del norte de África, los comerciantes berberes tuvieron un contacto creciente con el Islam, fomentando conversiones, y para el siglo VIII, los musulmanes viajaban a Ghana. Muchos en Ghana se convirtieron al Islam, y es probable que el comercio del Imperio fuera privilegiado como resultado. Alrededor de 1050, Ghana perdió Aoudaghost ante los almorávides, pero nuevas minas de oro en Bure redujeron el comercio a través de la ciudad, beneficiando en su lugar a los malinkés del sur, que más tarde fundaron el Imperio Malí. La ruta trans-sahariana oriental condujo al desarrollo del duradero Imperio Kanem–Bornu, así como de los imperios de Ghana, Malí y Songhai, centrados en la zona del lago Chad. Esta ruta comercial fue algo menos eficiente y solo alcanzó una gran prominencia cuando hubo tumulto en el oeste, como durante las conquistas almohades.#!"
 game_concept_siro_sahara_trade_post: "Puesto de Comercio Trans-Sahariano"
 game_concept_siro_silk_road: "Ruta de la Seda"
 game_concept_siro_silk_road_desc: "Una red de [siro_trade_route|E] que conecta Oriente y Occidente.\n\n#weak La Ruta de la Seda fue una red de rutas comerciales euroasiáticas que comenzó en el siglo II a.C. durante la Dinastía Han y duró hasta mediados del siglo XV. Con más de 6,400 kilómetros (4,000 millas), desempeñó un papel central en la facilitación de interacciones económicas, culturales, políticas y religiosas entre Oriente y Occidente.\n\nPrimero acuñado a finales del siglo XIX, el nombre \"Ruta de la Seda\" ha caído en desuso entre algunos historiadores modernos en favor de Rutas de Seda, que describe más precisamente la intrincada red de rutas terrestres y marítimas que conectan el Este y el Sureste de Asia, el subcontinente indio, Asia Central, el Medio Oriente, el Este de África y Europa.\n\nDurante sus aproximadamente 1,500 años de existencia, la Ruta de la Seda sobrevivió a la subida y caída de numerosos imperios y varias calamidades importantes, incluyendo la Peste Negra y las conquistas mongolas. Después de estas calamidades, la Ruta de la Seda a menudo emergió más fuerte que antes, incluso después del Imperio Mongol y su rama, la Dinastía Yuan. Como una red altamente descentralizada, la seguridad era escasa. Los viajeros enfrentaban constantes amenazas de bandidaje y asaltantes nómadas, y largos tramos de terreno inhóspito. Pocas personas cruzaron la totalidad de la Ruta de la Seda, en su lugar confiando en una sucesión de intermediarios basados en varios puntos de parada a lo largo del camino.\n\nA pesar de sobrevivir repetidamente a muchos cambios y disrupciones geopolíticas, la Ruta de la Seda terminó abruptamente con la subida del Imperio Otomano en 1453, que casi inmediatamente cortó el comercio entre Oriente y Occidente. Esto impulsó los esfuerzos europeos por buscar rutas alternativas hacia las riquezas orientales, inaugurando así la Era de los Descubrimientos, el colonialismo europeo y un proceso de globalización más intensificado, que había comenzado, posiblemente, con la Ruta de la Seda.#!"
 game_concept_siro_silk_road_trade_post: "Puesto de Comercio de la Ruta de la Seda"
 game_concept_siro_trade_route: "Rutas Comerciales"
 game_concept_siro_trade_value: "Valor Comercial"
 game_concept_stateless_desc: "Una sociedad sin estado carece de las jerarquías formales de otras formas de gobernanza. Cada 'gobernante' es un representante de sus tierras, cuyas acciones son vigiladas por el pueblo. La sucesión en una comuna es electiva, con cada representante teniendo voz. Si una sola familia logra mantener el poder el tiempo suficiente, podría reformar al sistema Tribal."
 game_concept_unity: "Unidad tribal"
