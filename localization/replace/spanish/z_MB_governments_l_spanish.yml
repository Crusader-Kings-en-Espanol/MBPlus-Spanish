l_spanish:

 default_tax_collector: "Impuestos básicos"
 default_tax_collector_desc: "Base [obligations|E] aplicar, basado en [aptitude|E] de los asignados [tax_collector|E]"
 default_tax_collector_flavor_desc: "Un impuesto estándar. Los contribuyentes no pagan ni más ni menos de lo que se espera."

 jizya_special_rights_tax_collector: "Tasa de protección"
 jizya_special_rights_tax_collector_desc: "#emphasis #bold [vassal|E] Privilegios:#!#!\nEl [liege|E] no puede [demand_conversion|E] de la [vassal|E]\nEl [liege|E] no se puede utilizar [convert_county|E] en el [vassals|E]'tierras'\nEl [liege|E] no se puede utilizar [faith|E] como una razón para evitar [tyranny|E] cuando revoque títulos\nEl [liege|E] no puede revocar [vassals_possessive|E] [titles|E]\n\n#flavor El [vassal|E] está garantizada la propiedad de su [titles], previniendo el [liege|E] de revocarlos – independientemente de la $game_concept_liege$ tener una [revoke_title_reason|E] o no.\n\nEl $game_concept_vassal$ se otorga también una condición especial protegida, y el reino reconoce oficialmente su derecho a practicar su propio derecho [faith|E].#!"
 jizya_special_rights_tax_collector_flavor_desc: "Un impuesto tributario, llamado Jizya en los reinos islámicos, impuesto a los de diferentes religiones a cambio de la seguridad y los derechos legales dentro del reino y el privilegio de practicar su fe."
 unlock_jizya_contract_name: "[GetFaithDoctrine('tenet_tax_nonbelievers').GetBaseName] [core_tenet|E]"

 jizya_special_rights:0 "$jizya_special_rights_tax_collector$" 
 jizya_special_rights_default:0 "$jizya_special_rights$ predeterminado"
 jizya_special_rights_default_short:0 "Default" 
 jizya_special_rights_granted:0 "$jizya_special_rights$ impuesto"
 jizya_special_rights_granted_desc:0 "$jizya_special_rights_tax_collector_desc$" 
 jizya_special_rights_granted_short:0 "Granted"


 iqta_special_rights_tax_collector: "Land Grant Charter"
 iqta_special_rights_tax_collector_desc: "El [vassal|E] tiene obligaciones más bajas pero ayuda a aportar [men_at_arms|E] al [liege|E] ."
 iqta_special_rights_tax_collector_flavor_desc: "Un sistema de agricultura fiscal, llamado Iqta en los reinos islámicos, donde los magnates locales tienen amplia autoridad para recaudar impuestos en nombre del Estado a cambio de servicio militar."


 ghazi_special_rights_tax_collector: "Casta Guerrera"
 ghazi_special_rights_tax_collector_desc: "#emphasis #bold [vassal|E] Privilege:#!#!\nEl [vassal|E] paga menos [piety|E] a utilizar [holy_war|E] [casus_bellis|E] pero más [prestige_i][prestige|E] para cualquier otro [casus_bellis|E]\nEnables [raiding|E]\n\n#flavor El [vassal|E] es elegido como un guerrero del [faith|E] por el [liege|E], cargado de llevar las fronteras hacia afuera [holy_war|E].#!"
 ghazi_special_rights_tax_collector_flavor_desc: "Conocido como Ghazi en los territorios islámicos, los vasallos honrados con este decreto recogen los ingresos del saqueo y el soborno, y libran una guerra interminable contra los enemigos religiosos del estado."


 deqhan_special_rights_tax_collector: "Dehqan"
 deqhan_special_rights_tax_collector_flavor_desc: "Los deqhans, potentados persas con un sistema antiguo y descentralizado de recaudación de impuestos, gestionan cuidadosamente sus tierras para fomentar su productividad… y su propio prestigio."

 maguh_special_rights_tax_collector: "Estatuto de maguh"
 maguh_special_rights_tax_collector_flavor_desc: "Antigua forma sasánida de administración de distritos, los maguh fomentan el desarrollo local a cambio de una reducción de impuestos al Estado."

 muqata_special_rights_tax_collector: "Contratos de ingresos"
 muqata_special_rights_tax_collector_flavor_desc: "Los contratos de ingresos son un sistema de recaudación de impuestos, denominado Muqata en tierras islámicas, donde las tierras lejanas reciben mayor autonomía y se gravan menos, para promover la estabilidad y el desarrollo a largo plazo."
 
 strict_taxation_tax_collector: "Tithe Decree"
 strict_taxation_tax_collector_flavor_desc: "Un impuesto caritativo impuesto a los ricos, conocidos como Zakat en tierras islámicas, como medio para proporcionar ingresos adicionales para el estado y ayudar a los necesitados."

 clan_tax_slot: "Jurisdicción tributaria"
 chinese_government: "Burocrático"
 chinese_government_desc: "#F En el sistema imperial chino, toda autoridad desciende del Emperador, el Hijo del Cielo. Las designaciones se basan típicamente en el mérito, con funcionarios que necesitan estudiar los Clásicos Chinos y pasar una serie de exámenes de servicio civil. #!"
 mandala_government: "Mandala"
