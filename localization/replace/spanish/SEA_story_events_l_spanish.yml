 nanzhao_collapse.1004.desc.2:0 "Los [previous_holder.Custom('InsultAdjective')] [previous_holder.GetFirstNameNoTooltip] y [previous_holder.GetHerHis] se sientan en mis mazmorras. ¿Les concedo la misma 'merecida' querían en mi posición, o ahora es el momento de la indulgencia?"
 nanzhao_collapse.1004.a:0 "Atrapa al verdugo, nadie quedará vivo."
 nanzhao_collapse.1004.b:0 "Serán perdonados... por ahora."

 nanzhao_collapse.1005.t:0 "Los Cielos Prosperosos"
 nanzhao_collapse.1005.desc:0 "Como el nuevo [ROOT.Char.GetTitleTierName] , es sólo apropiado otorgar a mi reino un nombre acorde al orden que deseo establecer. Por lo tanto, [title.GetNameNoTierNoTooltip] no será más. En su lugar estará Da Tian Xing, los Grandes Cielos Prosperosos."
 nanzhao_collapse.1005.a:0 "Larga vida el [ROOT.Char.GetTitleTierName], y larga vida Da Tian Xing."

 # 2000
