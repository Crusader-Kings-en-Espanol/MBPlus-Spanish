 nanzhao_collapse.1003.desc:0 "Mi vasallo [instigator.GetNameNoTooltip] ha presentado reclamo al [targeted_title.GetNameNoTooltip]. [instigator.GetSheHe|U] me llama un gobernante débil, y puede pronto hacer un movimiento para el trono."
 nanzhao_collapse.1003.a:0 "Muy preocupante... debo estar en mi guardia."

