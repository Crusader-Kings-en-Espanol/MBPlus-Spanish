 nanzhao_collapse.2005.t:0 "Una paz justa"
 nanzhao_collapse.2005.desc:0 "Como el nuevo [ROOT.Char.GetTitleTierName] , es sólo apropiado conceder a mi reino un nombre acorde con el orden que deseo establecer. De aquí en adelante, [title.GetNameNoTierNoTooltip] no será más. En su lugar estará Da Yi Ning, la Gran Paz Derecha."
 nanzhao_collapse.2005.a:0 "Larga vida el [ROOT.Char.GetTitleTierName], y larga vida Da Yi Ning."

 # 3000
 nanzhao_collapse.3002.t:0 "El [ROOT.Char.GetLiege.GetTitleTierName] de [ROOT.Char.GetLiege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]"
 nanzhao_collapse.3002.desc:0 "Una y otra vez, el ciclo repite. Un pretendiente al trono se levanta, golpea el último, pero sólo para ser reemplazado una vez más. Basta de esto. Alguien debe restaurar el orden, y no las falsas promesas de los reyes pasados."
 nanzhao_collapse.3002.a:0 "El ciclo de destrucción termina ahora."
 nanzhao_collapse.3002.b:0 "Quizás... pero no ahora, debo esperar un momento más oportuno."
 nanzhao_collapse.3002.b.tt:0 "Vais a perder vuestro tiempo, por ahora."
 nanzhao_collapse.3002.c:0 "Pensamientos tontos, esto no terminará diferente de antes."
 nanzhao_collapse.3002.c.tt:0 "Usted abandonará su trama, aunque otro puede encontrar ideas similares..."

 nanzhao_collapse.3003.t:0 "Un Vassal ambicioso"
 nanzhao_collapse.3003.desc:0 "Mi vasallo [instigator.GetNameNoTooltip] ha presentado reclamo al [targeted_title.GetNameNoTooltip]. [instigator.GetSheHe|U] me llama un gobernante débil, y puede pronto hacer un movimiento para el trono."
 nanzhao_collapse.3003.a:0 "Muy preocupante... debo estar en mi guardia."

 nanzhao_collapse.3004.t:0 "El destino de [previous_holder.GetDynasty.GetNameNoTooltip]"
 nanzhao_collapse.3004.desc.1:0 "¡La victoria es mía!"
 nanzhao_collapse.3004.desc.2:0 "[previous_holder.GetFirstNameNoTooltip] espera en mis mazmorras. Poner a [previous_holder.GetHerHim] a la muerte puede hacerme no mejor que todos los demás, pero ¿qué opción tengo?"
 nanzhao_collapse.3004.a:0 "Hago lo que debo."
 nanzhao_collapse.3004.b:0 "Es demasiado peligroso, todos deben morir."
 nanzhao_collapse.3004.c:0 "La vida [previous_holder.GetHerHis|U] se salvará, venga lo que pueda."

 nanzhao_collapse.3005.t:0 "El Reino de Dali"
 nanzhao_collapse.3005.desc:0 "Los antiguos tiranos trataron de legitimar su regla alegando que usaban en una nueva era, haciendo falsas afirmaciones en nombre de la Paz o la Armonía. En esto al menos, puedo empezar de forma diferente. El centro del reino es la ciudad de Dali, y así nombraré al país así. \n \n Quizás ahora podamos empezar de nuevo."
 nanzhao_collapse.3005.a:0 "Viva Dali."
