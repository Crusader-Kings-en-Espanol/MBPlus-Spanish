l_spanish:
 # 0000
 nanzhao_collapse.0002.t:0 "El Emperador tan llamado"
 nanzhao_collapse.0002.desc:0 "Me he sentado bajo el pulgar del [ROOT.Char.GetLiege.Custom('InsultAdjective')] [ROOT.Char.GetLiege.GetFirstNameNoTooltip] por mucho tiempo. ¿Qué derecho tiene [ROOT.Char.GetLiege.GetSheHe] para llamar a [ROOT.Char.GetLiege.GetHerselfHimself] [ROOT.Char.GetLiege.GetTitleTierName] ? ¡Debo liberar el mundo de la línea [ROOT.Char.GetLiege.GetHerHim] y [ROOT.Char.GetLiege.GetHerHis], y tomar el [ROOT.Char.GetLiege.GetPrimaryTitle.GetTierAsNameNoTooltip] para mí mismo!"
 nanzhao_collapse.0002.a:0 "El tiempo de [ROOT.Char.GetLiege.GetDynasty.GetNameNoTooltip] ha llegado a su fin."
 nanzhao_collapse.0002.b:0 "Quizás... pero no ahora, debo esperar un momento más oportuno."
 nanzhao_collapse.0002.b.tt:0 "Vais a perder vuestro tiempo, por ahora."
 nanzhao_collapse.0002.c:0 "¿Qué estoy pensando? ¡Estos son pensamientos tontos, y sólo me matarán!"
 nanzhao_collapse.0002.c.tt:0 "Usted abandonará su trama, aunque otro puede encontrar ideas similares..."

 nanzhao_collapse.0003.t:0 "Un Vassal ambicioso"
 nanzhao_collapse.0003.desc:0 "Parece que mi vasallo [instigator.GetNameNoTooltip] ha presentado reclamo al [targeted_title.GetNameNoTooltip] . [instigator.GetSheHe|U] me llama un gobernante débil, y puede pronto hacer un movimiento para el trono."
 nanzhao_collapse.0003.a:0 "Muy preocupante... debo estar en mi guardia."

 nanzhao_collapse.0004.t:0 "El destino de [previous_holder.GetDynasty.GetNameNoTooltip]"
 nanzhao_collapse.0004.desc.1:0 "¡El [title.GetNameNoTooltip] es mío!"
 nanzhao_collapse.0004.desc.2:0 "Los [previous_holder.Custom('InsultAdjective')] [previous_holder.GetFirstNameNoTooltip] y [previous_holder.GetHerHis] se sentaron en mis mazmorras, esperando su destino. Si yo mostrara misericordia ahora, [previous_holder.GetSheHe] volverá sin duda por mi cabeza."
 nanzhao_collapse.0004.a:0 "Atrapa al verdugo, nadie quedará vivo."
 nanzhao_collapse.0004.b:0 "Serán perdonados... por ahora."

 nanzhao_collapse.0005.t:0 "Una gran armonía larga"
 nanzhao_collapse.0005.desc:0 "Como el nuevo [ROOT.Char.GetTitleTierName] , es sólo apropiado conceder a mi reino un nombre acorde con el orden que deseo establecer. Por lo tanto, [title.GetNameNoTierNoTooltip] no será más. En su lugar estará Dachanghe, la Gran Armonía Long."
 nanzhao_collapse.0005.a:0 "Larga vida el [ROOT.Char.GetTitleTierName], y larga vida Dachanghe."

 # 1000
 nanzhao_collapse.1002.t:0 "El [ROOT.Char.GetLiege.GetTitleTierName] de [ROOT.Char.GetLiege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]"
 nanzhao_collapse.1002.desc:0 "Cuando [ROOT.Char.GetLiege.GetFirstNameNoTooltip] tomó el trono, [ROOT.Char.GetLiege.GetSheHe] juró mantener la armonía en el reino. Sin embargo, a medida que pasa el tiempo, el [ROOT.Char.GetLiege.GetDynasty.GetNameNoTooltip] demuestra ser tan cruel como sus predecesores. \n \n Algo debe hacerse."
 nanzhao_collapse.1002.a:0 "¡El [ROOT.Char.GetLiege.GetDynasty.GetNameNoTooltip] ha tenido su camino por demasiado tiempo!"
 nanzhao_collapse.1002.b:0 "Quizás... pero no ahora, debo esperar un momento más oportuno."
 nanzhao_collapse.1002.b.tt:0 "Vais a perder vuestro tiempo, por ahora."
 nanzhao_collapse.1002.c:0 "¿Qué estoy pensando? ¡Estos son pensamientos tontos, y sólo me matarán!"
 nanzhao_collapse.1002.c.tt:0 "Usted abandonará su trama, aunque otro puede encontrar ideas similares..."

