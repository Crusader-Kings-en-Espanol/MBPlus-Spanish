 # GAME COCNEPTS
 game_concept_yazata:0 "Yazata"
 game_concept_yazatas:0 "Yazatas"
 game_concept_yazata_desc:0 "Los Yazatas son aquellos que son dignos de adoración o veneración en $zoroastrianism_religion$. Para algunos, son deidades distintas; a otros, son emanaciones del dios supremo. \n \n $zoroastrianism_religion_adj$ [faiths|E] puede tener diferentes [doctrines|E] que representan el conjunto de Yazatas que han sido importantes para ellos debido a razones de historia, cultura, geografía y contacto con sistemas de creencias cercanos. \n \n Excepto aquellos cuyo [faith|E] tiene el $rice_zoroastrian_no_yazatas_doctrine_name$ [doctrine|E] , todos $zoroastrianism_religion_adj$ [rulers|E] tienen acceso a un [decision|E] a $RICE_khwarezm_worship_yazata$ , que le da un [character_modifier|E] temporal con beneficios basados en los cuales Yazata usted elige. Los Yazatas disponibles dependen de su Yazata [doctrine|E] . \n \n Ciertos Yazata [doctrines|E] incluso le otorgan acceso a un [decision|E] para establecer un [zoroastrian_cult_center|E] , que proporciona más beneficios para adorar Yazatas."
 game_concept_yazatas_desc:0 "Los Yazatas son aquellos que son dignos de adoración o veneración en $zoroastrianism_religion$. Para algunos, son deidades distintas; para otros, son emanaciones del dios supremo.\n\nAlgunas [faiths|E] $zoroastrianism_religion_adj$ pueden tener diferentes [doctrines|E] que representan el conjunto de Yazatas que han sido importantes para ellos debido a razones de historia, cultura, geografía y contacto con sistemas de creencias cercanos.\n\nExcepto para aquellos cuya [faith|E] tiene la [doctrine|E] $rice_zoroastrian_no_yazatas_doctrine_name$, todos los [rulers|E] $zoroastrianism_religion_adj$ tienen acceso a una [decision|E] para $RICE_khwarezm_worship_yazata$, que te da un [character_modifier|E] temporal con beneficios basados en el Yazata que elijas. Los Yazatas disponibles dependen de tu Yazata [doctrine|E].\n\nCiertas [doctrines|E] de Yazata incluso te otorgan acceso a una [decision|E] para Establecer un [zoroastrian_cult_center|E], que proporciona más beneficios por adorar a Yazatas."
