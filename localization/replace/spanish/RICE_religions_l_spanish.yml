 game_concept_zoroastrian_cult_centers:0 "Centros Locales de Culto Zoroastriano"
 game_concept_zoroastrian_cult_center:0 "Centro Local de Culto Zoroastriano"
 game_concept_zoroastrian_cult_center_desc:0 "Algunas [faiths|E] $zoroastrianism_religion_adj$, si tienen las [doctrines|E] [yazata|E] adecuadas, pueden tomar la [decision|E] para $RICE_khwarezm_establish_cult_center$.\n\nLos centros de culto son [counties|E] donde la adoración de un [yazata|E] en particular es prominente, y como tal, una vez que elijas qué [yazata|E] establecerá el centro de culto, un [county_modifier|E] correspondiente se colocará en tu [capital|E]. Después, si tomas la [decision|E] para Adorar a un [yazata|E], y eliges un [yazata|E] cuyo centro de culto posees (o es poseído por tu [vassal|E] o alguien bajo ellos), obtendrás una versión mejorada del [character_modifier|E] que usualmente obtendrías, así como prestigio adicional y piedad. Ten en cuenta que solo puede haber #bold un#! centro de culto por [duchy|E].\n\nSi tu [faith|E] no tiene una [doctrine|E] que te permita crear centros de culto, o sigues una [faith|E] no zoroastriana, en su lugar puedes tomar la [decision|E] para $RICE_khwarezm_destroy_cult_center$. Hacer esto eliminará cualquier [county_modifiers|E] de centros de culto en tu [domain|E], aunque si eres zoroastriano solo afectará a aquellos pertenecientes a [yazatas|E] que no adoras. También ganarás [gold|E] y [piety|E] dependiendo de cuántos centros de culto suprimas."


 # RELIGIOUS DOCTRINES / TENETS

 # Buddhist
 rice_doctrine_buddhist_canon_desc:0 "Es importante reconocer qué enseñanzas son auténticas y no contradicen la palabra de Buda. Estas se compilarán en colecciones, cuyo núcleo son las #italic tripitaka#! (que significa "Tres Cestas")."
 rice_mahayana_canon_doctrine_name:0 "Canon Mahayana"
 rice_mahayana_canon_doctrine_desc:0 "El Gran Almacén de Escrituras (#italic Dazangjing#! en chino), también conocido como el Canon Chino o del Este Asiático, es un canon laxo de textos budistas aceptados por las sectas Mahayana del budismo en el Este de Asia. Incluye varios sutras Mahayana, así como textos de las primeras escuelas del budismo que no forman parte o fueron descartados del Canon Pali, como los canones de las escuelas Sarvastivada y Dharmaguptaka."
 rice_theravada_canon_doctrine_name:0 "Canon Pali"
 rice_theravada_canon_doctrine_desc:0 "El Tripitaka Pali es el canon de textos budistas aceptado por las sectas Theravada del budismo en el Sudeste Asiático. Tradicionalmente, se creía que el primer Canon Pali fue escrito en el Cuarto Concilio Budista en Sri Lanka en el año 29 a.C., aunque el canon siguió siendo revisado y cambiado durante varios siglos después, ya que las escuelas Theravada, Mahayana, Vajrayana y otras primeras escuelas budistas intercambiaban ideas."
 rice_vajrayana_canon_doctrine_name:0 "Canon Tántrico"
 rice_vajrayana_canon_doctrine_desc:0 "El Canon Tántrico es la colección de textos budistas aceptados por las llamadas escuelas esotéricas del budismo, como el Vajrayana tibetano y las sectas influenciadas por él. El Canon Tibetano, por ejemplo, consiste en el Kangyur ("Traducción de la Palabra") y el Tengyur ("Traducción de los Tratados"). Estos cánones incluyen textos Mahayana, así como textos de las primeras escuelas del budismo que no forman parte o fueron descartados del Canon Pali."
 rice_pudgalavada_canon_doctrine_desc:0 "Las escuelas Pudgalavada o Personalistas del budismo han sido fuertemente criticadas por otras sectas budistas por sus puntos de vista únicos sobre la doctrina budista del no-yo. Independientemente de la validez de su interpretación de las enseñanzas de Buda, han mantenido su propio canon extenso y riguroso de textos budistas."
 doctrine_parameter_hostility_override_rice_mahayana_canon_doctrine:1 "Otras [faiths|E] budistas que también aceptan el #italic Canon Mahayana#! como su canon se consideran [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 doctrine_parameter_hostility_override_rice_theravada_canon_doctrine:1 "Otras [faiths|E] budistas que también aceptan el #italic Canon Pali#! como su canon se consideran [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 doctrine_parameter_hostility_override_rice_vajrayana_canon_doctrine:1 "Otras [faiths|E] budistas que también aceptan el #italic Canon Tántrico#! como su canon se consideran [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 doctrine_parameter_hostility_override_rice_pudgalavada_canon_doctrine:1 "Otras [faiths|E] budistas que también aceptan el #italic Canon Pudgalavada#! como su canon se consideran [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 doctrine_parameter_hostility_override_rice_theravada_canon_mahavihara_doctrine:1 "$doctrine_parameter_hostility_override_rice_theravada_canon_doctrine$"
 doctrine_parameter_hostility_override_rice_theravada_canon_abhayagiri_doctrine:1 "$doctrine_parameter_hostility_override_rice_theravada_canon_doctrine$"
 doctrine_parameter_hostility_override_rice_theravada_canon_jetavana_doctrine:1 "$doctrine_parameter_hostility_override_rice_theravada_canon_doctrine$"
 rice_life_liberation_active_name:1 "capacidad para realizar liberaciones de vida"
 doctrine_parameter_rice_life_liberation_active:0 "Desbloquea la [activity|E] [GetActivityType('activity_RICE_magadha_life_liberation').GetName] para liberar animales, seres sensibles, del sufrimiento"
 rice_vassa_active_name:1 "capacidad para abstenerse de vicios durante Vassa"
 doctrine_parameter_rice_vassa_active:0 "Puede tomar una [decision|E] para #V Abstenerse de Vicios Durante Vassa#!, una observancia de tres meses también conocida como el Retiro de Lluvias"
 rice_pagodas_unlocked_active_name:1 "capacidad para donar a las pagodas"
 doctrine_parameter_rice_pagodas_unlocked_active:0 "Puede construir pagodas por un coste adicional al tomar la [decision|E] para #V Construir un Sitio Religioso Budista Local#!"
 rice_theravada_canon_mahavihara_doctrine_name:0 "Preeminencia de Mahavihara"
 rice_theravada_canon_mahavihara_doctrine_desc:0 "#weak Esta [doctrine|E] es heredada automáticamente por cualquier [faith|E] budista con la [GetFaithDoctrine('rice_theravada_canon_doctrine').GetBaseName] [doctrine|E].#!\n\nEl monasterio [mahavihara|E] emergió como la secta dominante en [RICE_sri_lanka_s_sangha|E], y se ha convertido en la principal escuela de pensamiento entre los budistas que siguen el Canon Pali."
 rice_theravada_canon_abhayagiri_doctrine_name:0 "Preeminencia de Abhayagiri"
 rice_theravada_canon_abhayagiri_doctrine_desc:0 "#weak Esta [doctrine|E] es heredada automáticamente por cualquier [faith|E] budista con la [GetFaithDoctrine('rice_theravada_canon_doctrine').GetBaseName] [doctrine|E].#!\n\nEl monasterio [abhayagiri|E] emergió como la secta dominante en [RICE_sri_lanka_s_sangha|E], y se ha convertido en la principal escuela de pensamiento entre los budistas que siguen el Canon Pali."
 rice_theravada_canon_jetavana_doctrine_name:0 "Preeminencia de Jetavana"
 rice_theravada_canon_jetavana_doctrine_desc:0 "#weak Esta [doctrine|E] es heredada automáticamente por cualquier [faith|E] budista con la [GetFaithDoctrine('rice_theravada_canon_doctrine').GetBaseName] [doctrine|E].#!\n\nEl monasterio [jetavana|E] emergió como la secta dominante en [RICE_sri_lanka_s_sangha|E], y se ha convertido en la principal escuela de pensamiento entre los budistas que siguen el Canon Pali."
 rice_theravada_accumulation_doctrine_name:0 "Acumulación de Mérito"
 rice_theravada_accumulation_doctrine_desc:0 "Los monasterios rivales de la [RICE_sri_lanka_struggle|E] se unificaron durante la [struggle_phase_sri_lanka_accumulation|E]. Fue una era en la que las instituciones religiosas florecieron bajo el patrocinio de la élite y pudieron unirse para resolver sus diferencias. El espíritu de la época ha influido posteriormente de manera significativa en esta rama del budismo."
 rice_theravada_purification_doctrine_name:0 "Gran Purificación"
 rice_theravada_purification_doctrine_desc:0 "Los monasterios rivales de la [RICE_sri_lanka_struggle|E] se unificaron durante la [struggle_phase_sri_lanka_purification|E]. Fue una época de grandes reformas, aunque duras pero necesarias, que eliminaron los elementos corruptos en las instituciones religiosas de la isla que habían disputado durante demasiado tiempo. El espíritu de la época ha influido posteriormente de manera significativa en esta rama del budismo."
 rice_theravada_degeneration_doctrine_name:0 "Era de Degeneración"
 rice_theravada_degeneration_doctrine_desc:0 "Los monasterios rivales de la [RICE_sri_lanka_struggle|E] se unificaron durante la [struggle_phase_sri_lanka_degeneration|E]. Con el declive del budismo debido a amenazas extranjeras, locales sin escrúpulos y monásticos corruptos, la Sangha tuvo que unirse si querían sobrevivir a estas difíciles circunstancias. El espíritu de la época ha influido posteriormente de manera significativa en esta rama del budismo."
 rice_theravada_destruction_of_sangha_doctrine_name:0 "Destrucción de la Sangha de Sri Lanka"
 rice_theravada_destruction_of_sangha_doctrine_desc:0 "La [RICE_sri_lanka_struggle|E] fue completamente destruido por gobernantes extranjeros que profesaban diferentes creencias. Algunos culpan de esto a la constante rivalidad entre los monasterios rivales de la isla. Independientemente, esto fue un gran golpe para las ramas del budismo que reclaman influencia de la comunidad budista de Sri Lanka, que ahora es una sombra de su antiguo yo, si es que todavía existe."
 rice_theravada_outsider_doctrine_name:0 "Renacimiento Más Allá de $k_lanka$"
 rice_theravada_outsider_doctrine_desc:0 "La [RICE_sri_lanka_struggle|E] no pudo unificarse sin la ayuda de benevolentes gobernantes extranjeros. Como resultado de esto, el aprendizaje y el pensamiento budista se revitalizaron en estas tierras extranjeras, que se convirtieron en un nuevo centro del budismo. El espíritu de la época en que esto ocurrió ha influido posteriormente de manera significativa en esta rama del budismo."
 doctrine_parameter_rice_reduced_costs_buddhist_religious_sites:0 "#P -20%#! de costes para todas las opciones al tomar la [decision|E] para #V Construir un Sitio Religioso Budista Local#!"
 doctrine_parameter_rice_sri_lanka_struggle_effects_active:0 "Influenciado por la [RICE_sri_lanka_struggle|E] y obtiene acceso a varias [decisions|E] y [activities|E] relacionadas con la [struggle|E] dependiendo de la proximidad geográfica a la [region|E] [GetGeographicalRegion('RICE_sri_lanka_struggle_region').GetName]"
 doctrine_parameter_rice_mahayana_deities:0 "Desbloquea el [decision|E] a $RICE_select_personal_deity_buddhist_decision$ si no eres de $heritage_burman_name$ o $heritage_tibetan_name$ [heritage|E] (quien tiene acceso a diferentes [decisions|E] en lugar)"
 doctrine_parameter_rice_vajrayana_deities:0 "$doctrine_parameter_rice_mahayana_deities$"
 doctrine_parameter_rice_theravada_deities:0 "No se puede acceder al [decision|E] a $RICE_select_personal_deity_buddhist_decision$ ( $heritage_burman_name$ o $heritage_tibetan_name$ [heritage|E] tienen acceso a diferentes caracteres [decisions|E] que no son afectados)"
 doctrine_parameter_rice_pudgalavada_deities:0 "$doctrine_parameter_rice_theravada_deities$"
 rice_doctrine_bon_deities_name:0 "Deidades del Himalaya"
 rice_doctrine_bon_deities_desc:0 "El [GetGeographicalRegion('world_himalaya').GetName] [region|E] es el hogar de muchas deidades y espíritus. Su relación con la gente viviente y el uno al otro, y su papel en el cosmos, varía de local a local."
 rice_bon_deities_old_doctrine_name:0 "Deidades Asertivas"
 rice_bon_deities_old_doctrine_desc:0 "Las deidades y los espíritus han habitado en nuestras tierras durante todo el tiempo que cualquiera pueda recordar. Son poderosos, y a veces peligrosos e impredecibles, incluso cuando nos ayudan, y deben ser aplacados a través de rituales y respeto ferviente."
 rice_bon_deities_new_doctrine_name:0 "Deidades protectoras"
 rice_bon_deities_new_doctrine_desc:0 "Las deidades y los espíritus fueron una vez poderosos, pero fueron domesticados por maestros espirituales que respondieron a una fuerza religiosa superior, o aceptaron voluntariamente estas nuevas doctrinas religiosas. Ahora, estos seres santos protegen las verdaderas enseñanzas, muchas de las cuales fueron ocultadas por maestros espirituales para ser descubiertas cuando el tiempo es correcto."
 doctrine_parameter_rice_no_piety_cost_deities:0 "El [decision|E] a #bold $RICE_select_personal_deity_tibet_decision$ #! no cuesta ningún [piety_i|E] [piety|E]"
 doctrine_parameter_rice_unlocks_terton_content:0 "Se puede acceder a los mecánicos [Glossary( 'Tertön', 'TERTON_GLOSS' )], permitiendo que ciertos personajes obtengan el [GetTrait('RICE_terton').GetName( GetNullCharacter )] [trait|E]"
 rice_theravada_canon_mahavihara_doctrine_group_name:0 "Preeminencia de Mahavihara"
 rice_theravada_canon_abhayagiri_doctrine_group_name:0 "Preeminencia de Abhayagiri"
 rice_theravada_canon_jetavana_doctrine_group_name:0 "Preeminencia de Jetavana"
 rice_theravada_accumulation_doctrine_group_name:0 "Acumulación de Mérito"
