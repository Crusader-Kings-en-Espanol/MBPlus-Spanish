 # Peristani/Kalash/Nuristani
 peristani_religion_desc:1 "Los paganos indoiraníes que viven a lo largo de las montañas del Pamir y el Hindu Kush adoran a muchos dioses de una manera que recuerda a los antiguos indios pre-védicos e iraníes pre-zoroástricos. La pureza y la impureza son conceptos importantes, y la creencia en espíritus o hadas conocidos como Peris es fuerte."
 nuristani_pagan_desc:0 "Dezaw era la deidad suprema creadora de varias tribus paganas en el norte de Pakistán y el este de Afganistán, particularmente los Kalash. Sus rituales se centran en los límites entre los mundos de pureza e impureza. Por ejemplo, las altas montañas, las cabras y los niños prepúberes se consideran ejemplos de pureza."
 nuristani_pagan_old_desc:0 "Dezaw era la deidad suprema creadora de varias tribus paganas en el norte de Pakistán y el este de Afganistán, particularmente los Kalash. Sus rituales se centran en los límites entre los mundos de pureza e impureza. Por ejemplo, las altas montañas, las cabras y los niños prepúberes se consideran ejemplos de pureza."
 
