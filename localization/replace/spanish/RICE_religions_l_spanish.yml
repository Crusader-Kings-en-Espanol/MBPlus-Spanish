 # Kinnaur Valley folk religion
 west_himalayan_religion:1 "West Himalayan"
 west_himalayan_religion_adj:1 "West Himalayan"
 west_himalayan_religion_adherent:1 "West Himalayan"
 west_himalayan_religion_adherent_plural:1 "West Himalayans"
 west_himalayan_religion_desc:1 "Los pueblos de las tierras fronterizas montañosas entre el Tíbet y la India adoran a muchas deidades locales. Estas deidades deben tener el debido respeto y devoción, ya que pueden ser un lote caprichoso, en particular los poderosos dioses de las montañas, y su percepción de los mortales puede ser la diferencia entre si una aldea prospera con abundancia, o sufre de pobreza y calamidad."
 kinnaur_pagan:0 "Kimshuism"
 kinnaur_pagan_adj:0 "Kimshuist"
 kinnaur_pagan_adherent:1 "Kimshuist"
 kinnaur_pagan_adherent_plural:0 "Kimshuists"
 kinnaur_pagan_desc:0 "Hay muchas deidades en este mundo, particularmente los poderosos espíritus de las montañas. Las deidades locales son a menudo honradas a través de ídolos colocados en el templo del pueblo, y estos ídolos son sacados en palanquínes durante diversas ceremonias. Cada bodega tiene un #italic Kimshu #! , o espíritu protector personal, que debe ser adorado regularmente."
 kinnaur_pagan_old:0 "Antiguo Kimshuism"
 kinnaur_pagan_old_adj:0 "Viejo Kimshuist"
 kinnaur_pagan_old_adherent:1 "Viejo Kimshuist"
