 minaro_pagan_desc:0 "Los Bonoñah son un panteón de deidades adoradas por algunos pueblos de Dardi, que son venerados mejor a través de los sacrificios. Los sacrificios de cabra son los más ideales, debido a la pureza sagrada de los montes y los pastores que habitan allí."
