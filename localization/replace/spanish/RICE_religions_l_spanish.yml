 rice_theravada_degeneration_doctrine_group_name:0 "Era de Degeneración"
 rice_theravada_destruction_of_sangha_doctrine_group_name:0 "Destrucción de la Sangha de Sri Lanka"
 rice_theravada_outsider_doctrine_group_name:0 "Renacimiento Más Allá de $k_lanka$"




 # Zunist
 rice_zun_hephthalite_warriors_name:0 "Guerreros de Zun"
 rice_zun_hephthalite_warriors_desc:0 "Con el resurgimiento del Imperio Heftalita, el culto a Zun, la deidad solar heftalita, está floreciendo. Guerreros de cerca y de lejos están orgullosos de luchar en nombre del ardiente sol."
 rice_zun_hephthalite_warriors_doctrine_name:0 "$rice_zun_hephthalite_warriors_name$"
 rice_zun_hephthalite_warriors_doctrine_desc:0 "$rice_zun_hephthalite_warriors_desc$"
 rice_zun_hephthalite_culture_name:0 "Comerciantes y Artesanos de Zun"
 rice_zun_hephthalite_culture_desc:0 "Con el resurgimiento del Imperio Heftalita, el culto a Zun, la deidad solar heftalita, está floreciendo. La gente cree que el comercio y la cultura prosperarán bajo el dios de la justicia."
 rice_zun_hephthalite_culture_doctrine_name:0 "$rice_zun_hephthalite_culture_name$"
 rice_zun_hephthalite_culture_doctrine_desc:0 "$rice_zun_hephthalite_culture_desc$"

 # Dualist
 rice_doctrine_dualist_ritual_purification_name:0 "Purificación Ritual"
 rice_doctrine_dualist_ritual_purification_desc:0 "Es importante purificarnos del oscuro mundo material, para que podamos alcanzar el luminoso mundo espiritual. La manera de hacerlo es a través de rituales sagrados."
 rice_baptism_purification_doctrine_name:0 "Bautismo como Purificación"
 rice_baptism_purification_doctrine_desc:0 "Sumergirnos en el agua es la mejor manera de purificar nuestros cuerpos y almas. El bautismo debe hacerse regularmente para conectarnos con la luz y obtener el perdón por nuestros pecados."
 rice_food_purification_doctrine_name:0 "La Comida como Purificación"
 rice_food_purification_doctrine_desc:0 "Evitando la carne de seres vivos durante comidas rituales especiales, podemos limpiar nuestros cuerpos y alcanzar una mayor pureza espiritual y comprensión."
 rice_prayer_purification_doctrine_name:0 "La Oración como Purificación"
 rice_prayer_purification_doctrine_desc:0 "No importa qué ritos realizamos para purificarnos, es más importante tener una mente clara y enfocarnos en lo divino a través de la oración."
 #rice_baptism_decision_unlocked_active_name:1 "ability to undergo ritual baptisms"
 doctrine_parameter_rice_baptism_decision_unlocked_active:0 "Puede tomar la [decision|E] para $RICE_khuzestan_gnostic_baptism_rite$"
 rice_prayer_love_doctrine_name:0 "Procreación como Purificación"
 rice_prayer_love_doctrine_desc:0 "A diferencia de otros gnósticos, vemos el coito como una fuerza espiritual positiva y una manera para que las parejas casadas se acerquen a lo divino y comprendan mejor los lazos familiares."
 rice_light_purification_doctrine_name:0 "Liberación de la Luz como Purificación"
 rice_light_purification_doctrine_desc:0 "Nuestras almas vinieron del mundo de la luz pero han estado atrapadas por la materia, que vino del mundo de las tinieblas. Al seguir las enseñanzas del Profeta Mani, podemos liberar la luz de la materia, y reunirla con el mundo de la luz."
 doctrine_parameter_rice_bema_feast_activity_unlocked_active:0 "Desbloquea el [GetActivityType( 'activity_RICE_manichean_bema_festival' ).GetName] [activity|E]"
 doctrine_parameter_rice_manichean_manuscript_unlocked_active:0 "Puede llevar el [decision|E] a la Comisión un Manuscrito"
 doctrine_parameter_rice_manichean_weekly_confession_unlocked_active:0 "Puede tomar el [decision|E] a $RICE_manichean_confession_decision$"
 special_doctrine_rice_doctrine_late_manicheism_abandon_name:0 "La luz oculta"
 rice_doctrine_late_manicheism_abandon_name:0 "$special_doctrine_rice_doctrine_late_manicheism_abandon_name$"
 special_doctrine_rice_doctrine_late_manicheism_abandon_desc:0 "La Religión de la Luz ha sufrido mucho recientemente, y en algunos lugares, sus adherentes han ido bajo tierra o han estado involucrados en levantamientos campesinos. Mientras las fuerzas de la Oscuridad crecen más fuerte, los seguidores de Mani, y la Luz, prevalecerán al final!"
 doctrine_parameter_rice_unlock_manichean_mechanics_cost_more_gold:0 "El [decisions|E] a la Comisión de un Manuscrito y $RICE_manichean_confession_decision$ y el [GetActivityType( 'activity_RICE_manichean_bema_festival' ).GetName] [activity|E] cuesta más [gold_i|E] [gold|E]"
 doctrine_parameter_rice_unlock_manichean_manuscripts_lower_learning_req:0 "Al tomar la [decision|E] de encargar un manuscrito, el requisito de [learning|E] para escribirlo personalmente se reduce de [learning_i|E] #V 12#! a [learning_i|E] #V 8#!"
 special_doctrine_rice_doctrine_late_manicheism_support_name:0 "La Luz Amplificada"
 rice_doctrine_late_manicheism_support_name:0 "$special_doctrine_rice_doctrine_late_manicheism_support_name$"
 special_doctrine_rice_doctrine_late_manicheism_support_desc:0 "La Religión de la Luz ha sufrido mucho recientemente, ya que incluso el [Glossary( 'Elect', 'ELECT_GLOSS' )] han sido objeto de calumnias maliciosas desde dentro. Los líderes seculares y religiosos han fortalecido sus vínculos y un sentido de solidaridad: juntos, enfrentarán la Oscuridad y liberarán la Luz!"
 doctrine_parameter_rice_unlock_manichean_bema_festival_legitimacy_bonus:0 "Acabar el [GetActivityType( 'activity_RICE_manichean_bema_festival' ).GetName] [activity|E] da una pequeña cantidad de [legitimacy_i|E] [legitimacy|E]"
 special_doctrine_rice_doctrine_late_manicheism_reform_name:0 "La Luz Restaurada"
 rice_doctrine_late_manicheism_reform_name:0 "$special_doctrine_rice_doctrine_late_manicheism_reform_name$"
 special_doctrine_rice_doctrine_late_manicheism_reform_desc:0 "La Religión de la Luz ha sufrido mucho en los últimos años, y sus líderes han visto la necesidad de escuchar las advertencias del [Glossary( 'dinavariya', 'DINAVARIYA_GLOSS' )] que la Iglesia había crecido demasiado laxa y corrupta. A través de reformas muy necesarias, la Luz será liberada, y la Oscuridad derrotada!"
 doctrine_parameter_rice_unlock_manichean_improved_sin_loss_chances:0 "Al tomar el [decision|E] a $RICE_manichean_confession_decision$ o participar en el [GetActivityType( 'activity_RICE_manichean_bema_festival' ).GetName] [activity|E] , las posibilidades de perder mal [traits|E] es #P dobled #!"
 doctrine_parameter_rice_unlock_manichean_mechanics_cost_less_gold:0 "El [decisions|E] a la Comisión de un Manuscrito y $RICE_manichean_confession_decision$ y el [GetActivityType( 'activity_RICE_manichean_bema_festival' ).GetName] [activity|E] cuesta menos [gold_i|E] [gold|E]"

 # Zoroastrian
 rice_doctrine_zoroastrian_yazatas_name:0 "Yazatas"
 rice_doctrine_zoroastrian_yazatas_desc:0 "$game_concept_yazatas_desc$"
 rice_zoroastrian_sassanian_doctrine_name:0 "Yazatas Sasánidas"
 rice_zoroastrian_sassanian_doctrine_desc:0 "Es importante que sigamos venerando a los [yazatas|E] de la manera desarrollada por el gran Imperio Sasánida. Se permite la variación regional, siempre que no contradiga lo que consideramos la verdad."
 rice_zoroastrian_armenian_doctrine_name:0 "Yazatas Armenios"
 rice_zoroastrian_armenian_doctrine_desc:0 "No encontramos problema en venerar a las divinidades paganas de Anatolia, el mundo helénico y los antiguos armenios, además de los tradicionales [yazatas|E] zoroastrianos. Mientras nuestra realeza preside sobre los grandes cultos, los nobles locales atienden a los [yazatas|E] menores."
 rice_zoroastrian_eastern_doctrine_name:0 "Yazatas Bactro-Sogdianos"
 rice_zoroastrian_eastern_doctrine_desc:0 "Los [yazatas|E] que veneramos están influenciados por una variedad de tradiciones religiosas a lo largo de la Ruta de la Seda. En última instancia, depende de cada ciudad, cada región y cada familia determinar en qué [yazatas|E] deben enfocarse."
 rice_zoroastrian_no_yazatas_doctrine_name:0 "Sin Yazatas"
 rice_zoroastrian_no_yazatas_doctrine_desc:0 "La veneración obsesiva de los [yazatas|E] es, en el mejor de los casos, un error, ya que nos distrae de enfocar nuestra adoración en el creador supremo, [ROOT.Faith.HighGodName]."
 rice_zoroastrian_georgian_doctrine_name:0 "Yazatas Kartvelianos"
 rice_zoroastrian_georgian_doctrine_desc:0 "No encontramos problema en venerar a las divinidades paganas de los diversos antiguos pueblos del Cáucaso, además de los tradicionales [yazatas|E] zoroastrianos. Mientras algunos prefieren una divinidad u otra, todas son en última instancia dignas de adoración."
 doctrine_parameter_rice_unlock_bactro_sogdian_yazatas:0 "Añade los siguientes [yazatas|E] para la adoración: Siyavash, Vakhsh y Weshparkar"
 doctrine_parameter_rice_unlock_armenian_yazatas:0 "Añade los siguientes [yazatas|E] para la adoración: Astghik, Barshamin, Tork y Vahagn (reemplazando a Bahram)"
 doctrine_parameter_rice_unlock_georgian_yazatas:0 "Añade los siguientes [yazatas|E] para la adoración: Dali, Gaim (reemplazando a Sraosha), Gatsi (reemplazando a Rashnu), Kopala y Zaden"
 doctrine_parameter_rice_yazata_prestige_gain_automatic:0 "Gana automáticamente [prestige|E] al tomar la [decision|E] para Adorar a los [yazatas|E]"
 doctrine_parameter_rice_yazata_pay_for_modifier_upgrade:0 "Puede pagar [gold|E] adicional para obtener una mejor versión del [character_modifier|E] al tomar la [decision|E] para Adorar a los [yazatas|E]"
 doctrine_parameter_rice_unlock_destroy_cult_centers:0 "Puede tomar la [decision|E] para Suprimir [zoroastrian_cult_centers|E] de los "[yazatas|E]" que no se adhieren a tu [doctrine|E] [yazata|E]"
 doctrine_parameter_rice_unlock_yazata_cult_center:0 "Puede tomar la [decision|E] para Establecer un [zoroastrian_cult_center|E] en la [capital|E]"
 doctrine_parameter_rice_no_yazatas:0 "Desactiva la [decision|E] para Adorar a los [yazatas|E]"

 # YAZIDI
 rice_doctrine_west_iranian_name:0 "Mitema Central"
 rice_doctrine_west_iranian_desc:0 "La devoción religiosa debe centrarse en figuras cosmológicas importantes. Aunque la gente puede tener ideas variadas sobre su naturaleza, las leyendas asociadas con ellos e incluso sus identidades exactas, la práctica y acción correctas, u ortopraxia, es lo más importante al venerarlos."
 rice_west_iranian_yazidi_doctrine_name:0 "Siete Ángeles"
 rice_west_iranian_yazidi_doctrine_desc:0 "Los #italic Heft Sirr#!, o Siete Ángeles, fueron creados por Dios para manejar los asuntos del mundo. El mayor de ellos es Tawûsî Melek, el Ángel Pavo Real, que tiene poder sobre toda la naturaleza."
 doctrine_parameter_rice_yazidi_decision_unlocked_active:0 "Desbloquea la [activity|E] [GetActivityType('activity_RICE_yazidi_tiwaf').GetName]"
 doctrine_parameter_rice_yazidi_decision_2_unlocked_active:0 "Desbloquea la [activity|E] [GetActivityType('activity_RICE_yazidi_tawus_geran').GetName]"
 rice_west_iranian_yarsani_doctrine_name:0 "Siete Personas"
 rice_west_iranian_yarsani_doctrine_desc:0 "En cada época, Dios aparece en siete manifestaciones, los #italic Haft Tan#!, o Siete Personas, que guían a los fieles. Sultan Sahak fue la manifestación principal de Dios en esta época."
 doctrine_parameter_rice_yarsani_decision_unlocked_active:0 "Desbloquea la [activity|E] [GetActivityType('activity_RICE_yazidi_yarsani_jam').GetName]"
 rice_west_iranian_kurdish_pagan_doctrine_name:0 "Mitra"
 rice_west_iranian_kurdish_pagan_doctrine_desc:0 "Hay muchos seres divinos que deben ser adorados, pero Mithra, el dios de la verdad, la justicia y el sol, es uno de los más importantes, pues es el demiurgo que creó el mundo sacrificando un toro al amanecer de la existencia."
 doctrine_parameter_rice_kurdish_pagan_decision_unlocked_active:0 "Desbloquea la [activity|E] [GetActivityType('activity_RICE_yazidi_bull_sacrifice').GetName]"
 special_doctrine_is_west_iranian_faith_name:0 "Ortopraxia Irania Occidental"
 is_west_iranian_faith_name:0 "$special_doctrine_is_west_iranian_faith_name$"
 special_doctrine_is_west_iranian_faith_desc:0 "Gracias a su aislamiento y terreno accidentado, las tierras altas y valles del norte de Mesopotamia, el oeste de Irán y el este de Anatolia son hogar de muchas religiones heterodoxas. Aunque pueden tener diferentes orígenes religiosos, estas sectas comparten muchas prácticas, creencias e ideas."
 doctrine_parameter_hostility_override_special_doctrine_is_west_iranian_faith:0 "Las [faiths|E] no orientales con la [doctrine|E] $special_doctrine_is_west_iranian_faith_name$ se consideran [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V] en lugar de $hostility_hostile_tooltippable$ o $hostility_evil_tooltippable$"

 # Pagan rice_doctrine_horse_sacrifice
 special_doctrine_rice_doctrine_horse_sacrifice_name:0 "Caballos Sagrados"
 rice_doctrine_horse_sacrifice_name:0 "$special_doctrine_rice_doctrine_horse_sacrifice_name$"
 special_doctrine_rice_doctrine_horse_sacrifice_desc:0 "Los caballos son una de las criaturas más maravillosas de nuestro universo. Hay que venerarlos como es debido y sacrificarlos al cielo como parte de nuestros rituales religiosos."
 doctrine_parameter_rice_unlock_horse_sacrifice:0 "Desbloquea la [activity|E] [GetActivityType('activity_RICE_mordvin_horse_sacrifice').GetName]"

 # Northeast African Tattoo Doctrine
 special_doctrine_rice_doctrine_northeast_african_tattoo_name:0 "African Apotropaic Tattoos"
 rice_doctrine_northeast_african_tattoo_name:0 "$special_doctrine_rice_doctrine_northeast_african_tattoo_name$"
 special_doctrine_rice_doctrine_northeast_african_tattoo_desc:0 "Tradicionalmente, los tatuajes de símbolos religiosos fueron vistos como tener un poder mágico, protector y espiritual en el noreste de África, independientemente de sus creencias."
 doctrine_parameter_rice_unlock_northeast_african_tattoo_decision:0 "Desbloquea el [decision|E] a #bold $RICE_east_african_tattoo_decision$ #! independientemente de [culture|E]"

 # Austroasiatic Religion
 special_doctrine_is_austroasiatic_faith_name:0 "Botas austrámicas"
 is_austroasiatic_faith_name:0 "$special_doctrine_is_austroasiatic_faith_name$"
 special_doctrine_is_austroasiatic_faith_desc:0 "Aunque muy separados por la distancia, física y cronológicamente, los pueblos de habla Austroasiática, y los influenciados por ellos, comparten una serie de creencias religiosas notablemente similares, como la adoración o el miedo de la Deidad Tigre y la Deidad Rice."
 doctrine_parameter_hostility_override_special_doctrine_is_austroasiatic_faith:0 "[faiths|E] con el $special_doctrine_is_austroasiatic_faith_name$ [doctrine|E] son considerados [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V] en lugar de $hostility_hostile_tooltippable$ o $hostility_evil_tooltippable$"
 doctrine_parameter_rice_unlocks_tiger_spirits_content:0 "Desbloquea el $rice_doctrine_austroasiatic_tiger_god_name$ [doctrines|E] y el [decision|E] a $RICE_austroasiatic_tiger_god_decision$"

 # Austroasiatic Tiger Doctrine
 rice_doctrine_austroasiatic_tiger_god_name:0 "Espíritus del tigre"
 rice_doctrine_austroasiatic_tiger_god_desc:0 "Aunque el culto tigre se encuentra en todo el mundo, en muchos [faiths|E] Austroasiáticos como parte de su patrimonio compartido, Dioses o espíritus Tigre espiritualmente poderosos juegan un papel clave en sus cosmologías y vidas espirituales diarias. En estas religiones, se cree que la gente puede incluso convertirse en mentigres en ciertas circunstancias."
 rice_austroasiatic_wise_tiger_name:0 "Espíritus Tigre sabios"
 rice_austroasiatic_wise_tiger_desc:0 "Los espíritus tigresos, aunque duros e incluso temibles, son en última instancia benevolentes, porque nos dieron conocimiento sagrado en el pasado remoto y legendario."
 doctrine_parameter_rice_austroasiatic_tiger_mechanic_wisdom:0 "El [decision|E] a $RICE_austroasiatic_tiger_god_decision$ proporciona el [GetModifier('RICE_austroasiatic_wise_tiger_modifier').GetNameWithTooltip] [modifier|E] ."
 rice_austroasiatic_majestic_tiger_name:0 "Espíritus Tigre Majestuosos"
 rice_austroasiatic_majestic_tiger_desc:0 "Aunque tememos a los espíritus Tigre, son finalmente seres de una naturaleza digna, real y justa. Si les damos el debido respeto, pueden ayudarnos a su vez."
 doctrine_parameter_rice_austroasiatic_tiger_mechanic_majesty:0 "El [decision|E] a $RICE_austroasiatic_tiger_god_decision$ proporciona el [GetModifier('RICE_austroasiatic_majestic_tiger_modifier').GetNameWithTooltip] [modifier|E] ."
 rice_austroasiatic_retributive_tiger_name:0 "Espíritus Tigre Retributivos"
 rice_austroasiatic_retributive_tiger_desc:0 "En el desierto los espíritus Tiger se acechan, esperando a presas en los vivos. Se dirigen especialmente a aquellos que merecen castigo, como los invirtuosos o los que han roto tabúes. Deben estar apaciguados con los rituales apropiados."
 doctrine_parameter_rice_austroasiatic_tiger_mechanic_danger:0 "El [decision|E] a $RICE_austroasiatic_tiger_god_decision$ proporciona el [GetModifier('rice_austroasiatic_retributive_tiger_modifier').GetNameWithTooltip] [modifier|E] ."
 rice_austroasiatic_savage_tiger_name:0 "Espíritus del tigre feroces"
 rice_austroasiatic_savage_tiger_desc:0 "Es difícil si no imposible razonar con o controlar los espíritus Tiger, que atacarán, poseerán y destruirán lo suficientemente tontos como para aventurarse más allá de la seguridad de nuestros hogares desprotegidos, especialmente aquellos que son inmorales o han roto tabúes."
 doctrine_parameter_rice_austroasiatic_tiger_mechanic_savagery:0 "El [decision|E] a $RICE_austroasiatic_tiger_god_decision$ proporciona el [GetModifier('RICE_austroasiatic_savage_tiger_modifier').GetNameWithTooltip] [modifier|E] ."
 rice_austroasiatic_no_tiger_name:0 "Espíritus del tigre debilitados"
 rice_austroasiatic_no_tiger_desc:0 "Tal vez los tigres pueden tener algún poder espiritual, pero los espíritus tigres, incluso si existen, no son una gran fuerza de otro mundo que vale la pena adorar o temer – #italic nosotros #! no están vaciados por la selva y sus dones."
 doctrine_parameter_rice_austroasiatic_tiger_mechanic_disabled:0 "El [decision|E] a $RICE_austroasiatic_tiger_god_decision$ está deshabilitado."

 # Kava Role Doctrine
 rice_doctrine_kava_role_name:0 "Papel de Kava"
 rice_doctrine_kava_role_desc:0 "El consumo de kava desempeña un papel importante en muchas sociedades oceánicas."
 rice_kava_role_social_doctrine_name:0 "Kava: función social"
 rice_kava_role_social_doctrine_desc:0 "Aunque a veces parte de diversas ceremonias políticas y religiosas, consumir kava no se considera parte esencial de estas ceremonias, y su papel más importante es facilitar la interacción social."
 rice_kava_role_ceremonial_doctrine_name:0 "Kava: Función ceremonial"
 rice_kava_role_ceremonial_doctrine_desc:0 "Consumir la kava es una parte crucial de diversas ceremonias políticas y religiosas que legitiman la autoridad de los líderes, y alientan la armonía religiosa y la prosperidad en la comunidad."
 rice_kava_role_medicinal_doctrine_name:0 "Kava: Papel medicinal"
 rice_kava_role_medicinal_doctrine_desc:0 "Aunque a veces parte de varias ceremonias políticas y religiosas, y a veces se utiliza para facilitar la interacción social, la razón más importante para consumir kava es por sus supuestos beneficios medicinales y espirituales."
 doctrine_parameter_rice_kava_bonus_faith_political:0 "El [GetTrait('RICE_kava_drinker').GetName( GetNullCharacter )] [trait|E] otorga bonos a [diplomacy_i|E] [diplomacy|E] y [legitimacy_i|E] [legitimacy|E]"
 doctrine_parameter_rice_kava_bonus_faith_health:0 "El [GetTrait('RICE_kava_drinker').GetName( GetNullCharacter )] [trait|E] otorga bonos a [learning_i|E] [learning|E] y [health|E]"
 doctrine_parameter_rice_kava_increased_chances:0 "Aumento de las posibilidades de ganar el [GetTrait('RICE_kava_drinker').GetName( GetNullCharacter )] [trait|E] especialmente con mayor [prestige_i|E] [prestige_level|E] o [piety_i|E] [piety_level|E]"
 doctrine_parameter_rice_kava_cheaper:0 "El [decision|E] a #V Drink Kava #! cuesta menos [gold_i|E] [gold|E]"
 doctrine_parameter_rice_kava_expensive:0 "El [decision|E] a #V Drink Kava #! cuesta más [gold_i|E] [gold|E]"

 # Ancestors' Embodiment Doctrine (West Papuan, Moluccan)
 rice_doctrine_west_papuan_ancestor_focus_name:0 "Embodiment de los antepasados"
 rice_doctrine_west_papuan_ancestor_focus_desc:0 "¿Qué significan nuestros antepasados para nosotros? ¿Cómo nos ayudan en nuestras vidas cotidianas?"
 rice_west_papuan_ancestor_focus_gosimo_name:0 "Ubicación"
 rice_west_papuan_ancestor_focus_gosimo_desc:0 "Los ancestros salvaguardan nuestras tierras y mares; siempre y cuando les paguemos el debido respeto, desde estos lugares donde a menudo moran, nos proporcionarán orientación y asesoramiento, ya sea en forma de mensajes, ayudándonos en ceremonias u otras formas."
 rice_west_papuan_ancestor_focus_wor_name:0 "Estatuas talladas"
 rice_west_papuan_ancestor_focus_wor_desc:0 "Estatuas de madera llamadas #italic korwar #! albergan las almas, y a veces incluso los cráneos, de los muertos. Son una manera importante de venerar y comunicarse con los antepasados."
 #rice_west_papuan_ancestor_focus_wor_desc_old:0 "Through ritual songs and dances known as #italic Wor#!, we can ask for the ancestors' blessings and protection in all facets of life, from childbirth and marriage to war and wealth."
 rice_west_papuan_ancestor_focus_wuon_name:0 "Secret Lore"
 rice_west_papuan_ancestor_focus_wuon_desc:0 "Los espíritus ancestrales nos enseñaron #italic Wuon #!, loro sagrado y conocimiento, que es ser pasado en secreto a los dignos."
 rice_west_papuan_ancestor_focus_matutuo_name:0 "Lizards"
 rice_west_papuan_ancestor_focus_matutuo_desc:0 "Nuestros antepasados totémicos son #italic Matutuo #!, grandes espíritus de forma semi-lizard y medio-humana; les proporcionamos ofrendas en cuevas, en particular las de la costa, y a su vez nos traen abundantes peces y riquezas."
 doctrine_parameter_rice_unlocks_ancestor_activity:0 "Desbloquea el [GetActivityType( 'activity_RICE_venerate_ancestors' ).GetName] [activity|E] independientemente de [religion|E] o [culture|E]"
 doctrine_parameter_rice_ancestor_activity_bonus_legitimacy:0 "La [activity|E] de [GetActivityType( 'activity_RICE_venerate_ancestors' ).GetName] otorga [legitimacy_i|E] [legitimacy|E] adicional y mejora la [opinion_i|E] [opinion|E] de los [vassal|E]"
 doctrine_parameter_rice_ancestor_activity_bonus_naval:0 "[GetActivityType( 'activity_RICE_venerate_ancestors' ).GetName] [activity|E] da un [character_modifier|E] con [health|E] y bonificaciones militares (como [raiding|E] ) para #V 10 #! años"
 doctrine_parameter_rice_ancestor_activity_bonus_mystical:0 "El [GetActivityType( 'activity_RICE_venerate_ancestors' ).GetName] [activity|E] ofrece un [character_modifier|E] con bonos relacionados con @scheme_icon! [schemes|E] para #V 10 #! años"
 doctrine_parameter_rice_ancestor_activity_bonus_prosperity:0 "El [GetActivityType( 'activity_RICE_venerate_ancestors' ).GetName] [activity|E] da un [county_modifier|E] a la ubicación donde se mantiene con bonos relacionados con [gold_i|E] [tax|E] para #V 10 #! años"
