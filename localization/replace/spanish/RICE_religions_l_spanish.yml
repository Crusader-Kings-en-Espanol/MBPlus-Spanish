 # Semitic (formerly Helleno-Semitic)
 semitic_religion_adherent:1 "Semítica"
 semitic_religion_desc:1 "Los pueblos del Medio Oriente tienen una larga tradición de politeísmo. Algunos de sus panteones se han mezclado con los de otros pueblos con los que han estado en contacto a lo largo de los siglos, como los griegos y los romanos."
 #semitic_religion_desc:1 "In the Classical Era, Graeco-Roman religion syncretized with the native polytheistic beliefs of the Semitic peoples living in the Levant and northern Mesopotamia following centuries of rule under the Diadochi and later the Roman Empire."
 harranian_pagan_old:0 "Antiguo Harranismo"
 harranian_pagan_old_adj:0 "Antiguo Harraniano"
 harranian_pagan_old_adherent:1 "Antiguo Harraniano"
 harranian_pagan_old_adherent_plural:0 "Antiguos Harranianos"
 harranian_pagan_desc:0 "Aunque eligieron identificarse como los Sabeos mencionados en el Corán para ser etiquetados como Gente del Libro por sus vecinos musulmanes, los paganos de Harrán son una secta distinta. Sus prácticas van desde la adoración de deidades mesopotámicas y helénicas antiguas hasta las búsquedas esotéricas de sus renombrados eruditos que observan las estrellas y siguen una filosofía basada en el neoplatonismo clásico y el hermetismo."
 heliopolitan_pagan:0 "Heliopolitanismo"
 heliopolitan_pagan_old:0 "Antiguo Heliopolitanismo"
 heliopolitan_pagan_old_adj:0 "Antiguo Heliopolitano"
 heliopolitan_pagan_old_adherent:1 "Antiguo Heliopolitano"
 heliopolitan_pagan_old_adherent_plural:0 "Antiguos Heliopolitanos"
 heliopolitan_pagan_desc:0 "El Culto de la Tríada era una forma sincrética del politeísmo romano y cananeo que adoraba por encima de todos los dioses a una Tríada compuesta por: Júpiter, identificado con Baal o Hadad, y Helios; Venus, identificada con Astarté; y Mercurio, identificado con Adón. Era prominente en Baalbek, o Heliópolis, que siguió siendo uno de los últimos bastiones paganos en el Cercano Oriente (además de Harrán) hasta las conquistas árabes del siglo VII."
 nabataean_pagan:0 "Dusharaismo"
 nabataean_pagan_adj:0 "Dusharista"
 nabataean_pagan_adherent:1 "Dusharista"
 nabataean_pagan_adherent_plural:0 "Dusharistas"
 nabataean_pagan_old:0 "Antiguo Dusharaismo"
 nabataean_pagan_old_adj:0 "Antiguo Dusharista"
 nabataean_pagan_old_adherent:1 "Antiguo Dusharista"
 nabataean_pagan_old_adherent_plural:0 "Antiguos Dusharistas"
 nabataean_pagan_desc:0 "Los nabateos incorporaron una variedad de dioses de otras culturas en su panteón semítico, particularmente los dioses griegos y romanos después de que Nabatea se convirtiera en parte del Imperio Romano. La prominencia de su deidad principal Dushara diferencia a los nabateos de otros pueblos árabes antiguos, y más tarde se asoció con Zeus (o Júpiter) y Dionisio. La adoración de Dushara pudo haber persistido hasta el período islámico temprano."
 arabic_pagan_desc:0 "Las tribus árabes de la península arábiga central y septentrional adoraban a una plétora de deidades, con menos influencia extranjera que sus primos más al norte como los nabateos. Su deidad principal era Hubal, dios de la luna."
 aksumite_pagan_desc:0 "Los cultos de los antiguos etíopes tienen una fuerte influencia de los reinos de Arabia del Sur. El dios supremo es Mahrem, hijo del dios Ashtar; los dioses son llamados los Hijos del Invencible Mahrem."
 south_arabian_pagan_old:0 "Antiguo Athtarismo"
 south_arabian_pagan_old_adj:0 "Antiguo Athtarista"
 south_arabian_pagan_old_adherent:1 "Antiguo Athtarista"
 south_arabian_pagan_old_adherent_plural:0 "Antiguos Athtaristas"
 south_arabian_pagan_desc:0 "Aunque los pueblos antiguos del sur de Arabia adoraban a una variedad de deidades dependiendo de su región, también tienen muchos elementos compartidos en sus prácticas religiosas, distintos de los árabes menos urbanizados al norte."

 
  
