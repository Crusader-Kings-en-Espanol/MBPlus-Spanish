 the_great_steppe_sub_region_steppe_south: "Southern Steppe"
 the_great_steppe_sub_region_steppe_south_desc: "$SITUATION_SUB_REGION_TOOLTIP_DESC$ \n \n #weak Las estepas del sur son las estepas al sur de la estepa eurasiática que cubren Transoxiana, Tibet, la Cuenca del Tarim y Xia y han sido históricamente una puerta de entrada a varios grandes imperios. Estos estepas han sido habitados por pueblos nómadas durante milenios y han tenido varias relaciones con sus vecinos más asentados al sur en Irán y China, donde han sido tanto sujetos como conquistadores. #!"
 the_great_steppe_sub_region_steppe_central: "Northern Steppe"
 the_great_steppe_sub_region_steppe_central_desc: "$SITUATION_SUB_REGION_TOOLTIP_DESC$ \n \n #weak Los estepas del norte van desde el Volga en el oeste, el lago Baikal en el este, y la estepa central en el sur. La estepa del norte es la zona de transición entre la estepa y el taiga Siberiano. #!"
 the_great_steppe_sub_region_steppe_east: "Estepa oriental"
 the_great_steppe_sub_region_steppe_east_desc: "$SITUATION_SUB_REGION_TOOLTIP_DESC$ \n \n #weak Los estepas orientales van desde Transoxiana en el oeste, al norte del desierto de Gobi a las tierras de los Jurchens en el este. Estas vastas estepas crían guerreros fuertes que eventualmente viajarán hacia el oeste o buscarán las riquezas de sus vecinos sureste. #!"
 game_concept_the_great_steppe: "La gran estepa"
 game_concept_the_great_steppe_desc: "$game_concept_the_great_steppe$ representa el mar sin fin de hierba de la estepa eurasiática y está rodeando la estepa, y las condiciones climáticas que lo dan forma, y se divide en cuatro regiones: Occidental (White), Northern (Black), Eastern (Blue), y el sur (región) o, en turco, Aq, Qara, Gök, y Kizil o, en Mongolia, Tsagaan, Khar, Khökh, y Ulaan. \n \n Los diferentes [steppe_seasons|E] representan estos eventos tanto positivos como adversos, ofreciendo oportunidades para acciones especiales sólo disponibles durante ese tiempo, y modificando el [county_fertility|E] de cada región. \n \n Sólo [GetGovernment( 'nomad_government' ).GetName] y [herder|E] [rulers|E] participan en este [situation|E] y el [gurkhan|E] representa el gobernante más poderoso de toda la región."
 world_innovation_camels: "Oriente Medio, Persia o norte de África"
 
