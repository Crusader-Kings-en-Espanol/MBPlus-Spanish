 restore_military_comp: "Restaurar [military_comp|E]"
 restore_military_comp_desc: "Después de nuestra gran y vergonzosa incompetencia militar, hemos recuperado nuestra posición y el mundo vuelve a considerar a nuestro ejército como el mejor."
 restore_military_comp_tooltip: "Restaura tu [military_comp|E]"
 restore_military_comp_confirm: "¡Por el Imperio!"

 restore_civic_comp: "Restaura tu [civic_comp|E]"
 restore_civic_comp_desc: "Tras nuestra gran y vergonzosa incompetencia en nuestra gestión cívica, hemos recuperado nuestra posición y el mundo vuelve a considerar nuestro reino como el mejor."
 restore_civic_comp_tooltip: "Restaura tu [civic_comp|E]"
 restore_civic_comp_confirm: "¡Por el Imperio!"

 restore_diplo_comp: "Restaura tu [diplo_comp|E]"
 restore_diplo_comp_desc: "Tras nuestra gran y vergonzosa incompetencia diplomática tanto dentro COMO fuera de nuestro reino, gobernantes cercanos y lejanos han recuperado la confianza con nosotros y nuestras interacciones y el mundo reconsidera nuestra diplomacia como la mejor."
 restore_diplo_comp_tooltip: "Restaura tu [diplo_comp|E]"
 restore_diplo_comp_confirm: "¡Por el Imperio!"
 
 titular_tribe_settle: "Asentar la tribu"
 titular_tribe_settle_desc: "Nuestro pueblo lleva demasiado tiempo disperso. Hoy debemos consolidar las tribus bajo mi dirección."
 titular_tribe_settle_tooltip: "Consolidar la Tribu"
 titular_tribe_settle_confirm: "¡Que prosperemos!"

 find_aurelian_helmet: "Encuentra el casco de Aureliano"
 find_aurelian_helmet_tooltip: "Envía a tu anticuario a la tarea de encontrar el casco del Imperator Aureliano, perdido hace mucho tiempo."
 find_aurelian_helmet_desc: "Envía a tu anticuario a la tarea de encontrar el casco perdido hace mucho tiempo del Imperator Aureliano. Encontrarlo no es seguro, pero traerá consigo el poder, la grandeza y la fuerza de la gloria de su reinado."
 find_aurelian_helmet_confirm: "¡Que entren!"

 forge_roman_regalia: "Forja la Regalia romana"
 forge_roman_regalia_desc: "¡El Imperio se ha unido! Es hora de olvidar los tiempos oscuros por los que marchamos. Sin embargo, por mucho que intentemos seguir adelante, la regalia sigue ahí, recordándonos, atormentándonos con recuerdos del pasado, así que me he reunido con mis consejeros para poner fin a esto."
 forge_roman_regalia_tooltip: "¡El Imperio se ha unido! Sin embargo, por mucho que intentemos seguir adelante, la regalia sigue ahí, recordándonos con recuerdos del pasado."
 forge_roman_regalia_confirm: "Es hora de pasar página."

 gregorian_mission: "Comienza la misión gregoriana"
 gregorian_mission_desc: "Paganos y herejes campan a sus anchas por nuestra preciosa tierra, para asegurar que nuestra fe y reino continúen y prosperen tenemos que solicitar al clero y a los gobernantes cristianos que nos ayuden en nuestra guerra contra estos herejes."
 gregorian_mission_tooltip: "Solicitar ayuda al clero para luchar contra los herejes en britannia"
 gregorian_mission_confirm: "Por la fe"
 
 
 mandate.0001.t: "Mandato Guerra"
 mandate.0001.desc: "决定天命的时刻终于到来，一方诸侯已起兵问鼎天下。历史掌握在你手中。选择加入义军，成功推翻皇帝后，从龙之士必将获得封赏；如果加入勤王，你将成为大大的忠臣；但每种选择都可能面临失败，也许，还有第三条道路......"
 mandate.0001.a: "Así que únete a ellos"
 mandate.0001.b: "No puedo, elijo el honor"
 mandate.0001.c: "我今大举义兵，欲宁天下，远迎主上还！"
 mandate.0001.c_desc: "Quizá yo también pueda..."
 
 mandate.0002.title: "Guerra de mandatos"
 mandate.0002.base.desc: "国家丧乱，苍生困穷，我若不救济，终为上天所责。帝王岂有常哉，唯有德者居之！讨国贼，诛暴君，正在今朝！"
 mandate.0002.a: "¡El cielo se apiada de mí!."
 
 mandate.0003.title: "Guerra de mandatos"
 mandate.0003.base.desc: "反贼起事，妄言天数，兵戈直指京师。冒犯天威，罪不容赦。我要即刻点齐朝廷兵马，并诏令各地勤王。跌落皇座的天子会是什么下场？"
 mandate.0003.a: "Cómo te atreves！"
 
 mandate.0005.title: "Caída del Tang tardío"
 mandate.0005.base.desc: "La dinastía Tang ha caído ante nosotros y nuestros aliados jitanos y con ello el norte de China vuelve a estar unido. A cambio de su ayuda, los khitanos exigen que se les entreguen las Dieciséis Prefecturas. Si nos negamos es probable que entren en guerra con nosotros y perdamos algo más que esas prefecturas. ¿Deberíamos someternos a sus demandas o rechazarlas y esperar poder resistir el poderío de los khitanos?"
 mandate.0005.a: "Nos someteremos a sus demandas..."
 mandate.0005.b: "¡No cederemos ninguna tierra que nos pertenezca por derecho!"
 
 
 # "改朝换代"
 east_title.0001.t: "Cambia la Dinastía"
 # "江山易主，皇纲解纽。旧帝国已经坠落，一个新的家族登基建极。若选择效忠，你将成为新皇朝信赖的封疆大吏；若拒绝效忠，你将从帝国独立，割据一方。此后，是扬旗对抗篡逆，问鼎天下，抑或联结诸侯，匡扶正统，在这乱世中，你会如何抉择呢？"
 east_title.0001.desc: "Esta tierra ha cambiado de dueño, y el gobierno del viejo emperador ha terminado. Con la caída del viejo imperio, un nuevo nombre ha tomado el trono. Si eliges la lealtad, te convertirás en el funcionario de confianza de la nueva dinastía; si la rechazas, puedes utilizar tu ejército para convertirte en gobernador independiente de una región. A partir de ahí, toca izar la bandera para luchar contra la usurpación, buscar el mundo o unirse a otros caudillos y apoyar a los ortodoxos. En este mundo convulso, ¿cómo elegirás?"
 # "天数有变，神器更易，顺之者昌，逆之者亡！"
 east_title.0001.a: "El mandato del cielo ha cambiado, y el equilibrio se ha roto. Los que lo sigan prosperarán, ¡y los que se opongan morirán!."
 #
 # "我从未见过如此厚颜无耻之人！"
 east_title.0001.b: "¡Nunca he visto una persona tan descarada! ¡Qué vergüenza!"
 
