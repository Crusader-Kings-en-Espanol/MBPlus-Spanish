#Abandon Britannia
 abandon_britannia_decision: "Abandonar Bretaña"
 abandon_britannia_decision_confirm: "No hay alternativa"
 abandon_britannia_decision_desc: "El Imperio Romano de Occidente está en peligro de ser alcanzado por los bárbaros que yacen fuera de nuestras fronteras. No podemos dejar el destino de nuestras tierras centrales a la suerte, así que nuestras provincias menos productivas económicamente deben ser abandonadas para aliviar la carga y permitir que nuestros ejércitos se centren en la defensa del continente. Britannia, aunque leal al imperio durante siglos, debe prepararse para luchar por su cuenta contra las tribus celtas y germánicas."
 abandon_britannia_decision_tooltip: "Un gran coste quizás, pero hay que hacerlo."
 abandon_britannia_decision_effect_tooltip: "La administración romana abandona la provincia de Britannia. La #V Diócesis de $k_britannia$#! es destruida, y eliminada de las fronteras [de_jure|E] del Imperio"
 abandon_britannia_decision_effect_tooltip_2: "¡Esto libera considerables tropas y administradores para el resto del Imperio, y te otorgará una gran cantidad de [gold_i|E] [gold|E]\n #F ¡Dejarla ahora liberará #V [gold_i|E][EmptyScope.ScriptValue('abandon_britannia_oro_ganado')|0]#! para nuestro tesoro Imperial#!"
 abandon_britannia_decision_effect_tooltip_3: "¡Abandonar la provincia provocará una #N disminución global de las infraestructuras en toda la provincia#!, ¡y varios [edificios|E] serán #N demolidos o desactivados#!"

 central_claim: "Reclama el Trono de [ROOT.Char.GetLiege.GetNameNoTooltip]"
 central_claim_desc: "¡Como parte central del imperio, has ganado suficiente poder en el reino para presionar tu reclamación sobre la totalidad del imperio! ya no se puede confiar en nuestros antiguos gobernantes."
 central_claim_tooltip: "Reclamas el trono de tu señor"
 central_claim_confirm: "¡Reclamaré lo que es mío por derecho!"

 change_to_imperial: "Adopta modos burocráticos"
 change_to_imperial_desc: "Tras nuestra integración en los imperios romanos, es hora de dar un giro al futuro de mi reino y dinastía y adoptar sus modos burocráticos."
 change_to_imperial_tooltip: "Adoptas los modos burocráticos"
 change_to_imperial_confirm: "Ya es hora"

 change_to_autocratic: "Adoptas los modos Autocráticos"
 change_to_autocratic_desc: "Tras nuestra separación de los imperios romanos, es hora de dar un giro al futuro de mi reino y dinastía y adoptar nuestros propios modos autocráticos."
 change_to_autocratic_tooltip: "Adoptas las formas autocráticas"
 change_to_autocratic_confirm: "Ya es hora"
 
 establish_red_sea: "Establece la supremacía sobre el Mar Rojo"
 establish_red_sea_desc: "La costa del Mar Rojo ha albergado una de las mayores y más increíbles rutas marítimas comerciales, llevando objetos preciosos desde Constantinopla hasta Sri Lanka. Ha llegado el momento de asegurar la entrada como legítima casa de mi pueblo."
 establish_red_sea_tooltip: "Vosotros formáis el Imperio del Mar Rojo."
 establish_red_sea_confirm: "Unifica el Mar Sagrado."

 change_to_islamic: "Adopta formas de gobierno islámicas"
 change_to_islamic_desc: "Tras nuestra conversión al islam, es hora de dar un giro al futuro de mi reino y dinastía y adoptar sus formas de gobernar."
 change_to_islamic_tooltip: "Adoptas las formas burocráticas"
 change_to_islamic_confirm: "Es el momento"

 change_to_caliphate: "Desafía el asiento del Califa"
 change_to_caliphate_desc: "¡Las costumbres de nuestro pueblo se han perdido! La gente ya no nos admira por la verdad y el poder. Alguien debe dar un paso al frente y tomar el manto de califa y liderar nuestra gran fe hacia la grandeza."
 change_to_caliphate_tooltip: "Alguien debe dar un paso adelante y tomar el manto de califa y llevar nuestra gran fe a la grandeza"
 change_to_caliphate_confirm: "Ya es hora"

 send_missionaries: "Envía misioneros"
 send_missionaries_desc: "Hay muchos ahí fuera que no creen en nuestra [ROOT.Char.GetFaith.GetAdjective] [faith|E]. Debería enviar misioneros para encontrar a cualquier incrédulo en tierras extranjeras, ya sean nobles o gente común, y convertirlos a la única y verdadera [faith|E]."
 send_missionaries_tooltip: "Envía misioneros para persuadir a nobles y gente común de que adopten tu [faith|E]"
 send_missionaries_effect_tooltip_1: "Tus misioneros viajarán a una tierra extranjera e intentarán convertir a su [ruler|E] o pueblo para que se conviertan a la [faith|E] [THIS.Char.GetFaith.GetAdjective]"
 send_missionaries_effect_tooltip_2: "El trabajo misionero requiere una inversión de [gold|E] - ¡cuantos más fondos proporciones a tus misioneros, más posibilidades tendrán de tener éxito! #weak (Coste mínimo: @gold_icon! 100)#!"
 send_missionaries_confirm: "¡Que [ROOT.Char.GetFaith.HighGodName] nos guíe!"

 change_to_imperial_byz: "Restablecer formas burocráticas"
 change_to_imperial_byz_desc: "Tras la disuloción de los modos burocráticos del imperio, es hora de dar un giro al futuro del imperio y restablecer los modos burocráticos."
 change_to_imperial_byz_tooltip: "Adoptas los modos Burocráticos"
 change_to_imperial_byz_confirm: "Ya es hora"

 change_to_imperial_feudal: "Adoptas las maneras romanas [GetGovernment( 'gobierno_imperial' ).GetName]"
 change_to_imperial_feudal_desc: "¡Para cimentar nuestro legado a través de las generaciones, debemos seguir las formas y enseñanzas anteriores del imperio romano! Es hora de que nuestra dinastía resuene a través de las generaciones."
 change_to_imperial_feudal_tooltip: "Adoptas las formas burocráticas romanas"
 change_to_imperial_feudal_confirm: "Es la hora"

