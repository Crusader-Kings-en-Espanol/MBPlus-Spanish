 #Pannonian Decisions
 consolidate_danubian_frontier_decision: "Consolidar la frontera danubiana"
 consolidate_danubian_frontier_decision_desc: "Muchos fuertes antiguos salpican las orillas del Danubio. Utilizado por los romanos como línea defensiva natural hace cientos de años, el río marca hoy la frontera entre búlgaros y francos. \n\nCon la inversión adecuada podemos reocupar estos fuertes y además establecer una nueva marcha para consolidar la frontera del Danubio."
 consolidate_danubian_frontier_decision_tooltip: "Restaurar la antigua frontera romana"
 consolidate_danubian_frontier_decision_confirm: "Reunir el reino"
 
 danubian_frontier_duchy.preview.tta: "Crea el [duchy|E] de [GetTitleByKey('d_szekesfehervar').GetNameNoTier]"
 danubian_frontier_duchy.preview.ttb: "Los [counties|E] de [GetTitleByKey('c_szekesfehervar').GetNameNoTier], [GetTitleByKey('c_esztergom'). GetNameNoTier], [GetTitleByKey('c_komarom').GetNameNoTier] y [GetTitleByKey('c_veszprem').GetNameNoTier] se convertirán en [de_jure|E] de [GetTitleByKey('d_szekesfehervar').GetNameNoTier]."
 danubian_frontier_duchy.preview.ttc: "El [duchy|E] de [GetTitleByKey('d_szekesfehervar').GetNameNoTier] se disolverá si el [title|E] es destruido o usurpado por un gobernante que no sea ni eslavo ni romano y que también posea el [duchy|E] de [GetTitleByKey('d_visegrad').GetNameNoTier]."
 
 ce_custom_transdanubia: "Transdanubio"
 ce_custom_roman_pannonia: "Panonia eslava"
 
 restore_roman_pannonia_decision: "Unir Panonia"
 restore_roman_pannonia_decision_desc: "Los principados de Blatno y Savia solían estar unidos bajo una única administración provincial en la antigüedad. Sin embargo, tras las invasiones hunas, Panonia quedó permanentemente dividida, ya que godos, lombardos y ávaros ocuparon las tierras alrededor del lago Blatno, mientras que las tierras de Savia se convirtieron en una frontera salvaje entre los romanos y estos mismos ocupantes. \n\nPero con la desaparición de los ávaros y el debilitamiento gradual de la autoridad franca en la gran Panonia, ha llegado el momento de corregir este error. Desde los Alpes hasta el Danubio, Panonia volverá a alzarse triunfante."
 restore_roman_pannonia_decision_tooltip: "Fundar el Reino de Panonia"
 restore_roman_pannonia_decision_confirm: "Reunido el reino"
 
 restore_roman_pannonia.preview.tta: "Evita que el [duchy|E] de [GetTitleByKey('d_szekesfehervar').GetNameNoTier] se disuelva"
 restore_roman_pannonia.preview.ttb: "Si se posee, [GetTitleByKey('d_syrmia').GetNameNoTier] se convertirá en la capital [de_jure|E] de [GetTitleByKey('k_balaton').GetNameNoTier]"
 restore_roman_pannonia.preview.ttc: "Surgirá una nueva cultura eslava"
 
 #British Flavour Decisions
 restore_hen_ogledd_decision_title: "Restaurar el Reino de Yr Hen Ogledd"
 restore_hen_ogledd_decision_desc: "Yr Hen Ogledd, "el antiguo Norte", estuvo una vez unido bajo el próspero gobierno de reyes legendarios como Coel Hen o Urien Rheged. Sin embargo, con el paso del tiempo, Hen Ogledd se dividió en una serie de pequeños reinos de los que hoy sólo queda [GetTitleByKey('d_galloway')).GetNameNoTier]. \Por lo tanto, nos corresponde a nosotros restaurar Cumbria a su antigua gloria. Yma o Hyd!"
 restore_hen_ogledd_decision_tooltip: "Restaurar el antiguo Reino del Norte"
 restore_hen_ogledd_decision_confirm: "Paz y Prosperidad al fin"
 
 restore_hen_ogledd_decision.preview.tta: "Obtendrás [GetTitleByKey('k_cumbria').GetName]"
 restore_hen_ogledd_decision.preview.ttb: "Obtendrás [GetTitleByKey('d_cumbria').GetName]"
 restore_hen_ogledd_decision.preview.ttc: "[GetTitleByKey('d_cumbria').GetNameNoTier] y [GetTitleByKey('d_galloway').GetNameNoTier] se convertirán en [de_jure|E] de [GetTitleByKey('k_cumbria').GetNameNoTier]"
 restore_hen_ogledd_decision.preview.ttd: "Si son propiedad, los [title|E] de [GetTitleByKey('d_lothian').GetNameNoTier], [GetTitleByKey('d_lancaster'). GetNameNoTier], [GetTitleByKey('d_northumberland').GetNameNoTier] y [GetTitleByKey('d_york').GetNameNoTier] pasarán a ser [de_jure|E] de [GetTitleByKey('k_cumbria').GetNameNoTier]."
 restore_pengwern_decision_title: "Restaurar las fronteras de Powys"
 restore_pengwern_decision_desc: "El Reino de Pengwern fue un poderoso reino británico postromano y altomedieval situado en las Midlands occidentales. \n\nPengwern, antaño hegemón regional de Gran Bretaña, hace tiempo que fue absorbido por Mercia, y sus últimos vestigios se han convertido en los restos de Powys, así como en el ya desaparecido reino de Ergyng.\n\nRestaurar este Reino debería ser el primer paso hacia la reconquista de toda Gran Bretaña a los invasores sajones."
 restore_pengwern_decision_tooltip: "Restaurar las fronteras de Pengwern"
 restore_pengwern_decision_confirm: "Un Gran Reino Reforzado"
 
 restore_pengwern_decision.preview.tta: "Obtendrás [GetTitleByKey('d_ergyng').GetName]"
 restore_pengwern_decision.preview.ttb: "Las fronteras de [GetTitleByKey('d_powys').GetNameNoTier] y [GetTitleByKey('k_wales').GetNameNoTier] se ampliará hasta el río Severn"       
 
 #Balkan Flavour Events
 
 balkan_flavour.0001.t: "Las Tierras de Eslavonia"
 balkan_flavour.0001.desc: "Ante la amenaza potencial de los magiares, el Principado de Savia se transforma lentamente en una mera región fronteriza."
 balkan_flavour.0001.a: "Interesante."
 
 balkan_flavour.0003.t: "La Llegada de los Magiares"
 balkan_flavour.0003.desc: "En un giro inesperado de los acontecimientos, tras aplastar cualquier oposición a su migración, los magiares han logrado cruzar los montes Cárpatos y se han hecho con el control de la cuenca oriental. Gran parte de las tierras que han conquistado hasta ahora han sido pasto de las llamas y sus habitantes han huido o han sido esclavizados por estos recién llegados. \n\nEs sólo cuestión de tiempo que estos magiares intenten ampliar sus ganancias a nuestra costa."
 balkan_flavour.0003.a: "¡Vamos a capear el temporal!"

 balkan_flavour.0004.t: "Susurros de una Ciudad Antigua"
 balkan_flavour.0004.desc: "Mientras mis exploradores recorrían las tierras de Panonia, se toparon con la ciudad fortificada de Castei, cuyos habitantes hablan una lengua extraña e ininteligible para los pueblos de los alrededores, e informaron a mi mayordomo al respecto. \nCuriosamente, los habitantes de la ciudad parecen diferir no sólo en su forma de hablar, sino también en su estilo de vida, ya que parecen ser artesanos de gran talento, fabricando artefactos únicos de todo tipo, nunca vistos en el resto de Panonia. \Del mismo modo, su ciudad es diferente a muchas otras de la zona, ya que cuenta con fortificaciones de piedra respetables y una arquitectura única que recuerda a tiempos pasados.\NMientras estaba allí, mis exploradores fueron abordados por un local que desea una audiencia conmigo."
 balkan_flavour.0004.a: "Permíteles una audiencia. Deseo escuchar su historia."
 balkan_flavour.0004.b: "No tengo tiempo para esto."
 
 balkan_flavour.0005.t: "La Panonia"
 balkan_flavour.0005.desc: "Un hombre se pone delante de mí y se presenta:\n\n'Salutio, dominu.\n\nMe llamo [ce_pannonian_romance_guest_spawn.GetTitledFirstName] y le agradezco humildemente que me haya concedido esta audiencia. Nosotros [ce_pannonian_romance_guest_spawn.GetCulture.GetNameNoTooltip]s hemos vivido en estas tierras entre los ávaros y los eslavos durante incontables generaciones. Pero últimamente, nuestras ciudades se han vuelto escasas y nuestros campos, estériles. Temo que nuestras costumbres [ce_pannonian_romance_guest_spawn.GetCulture.GetName] y lengua [ce_pannonian_romance_guest_spawn.GetCulture.GetLanguage.GetName] pronto se pierdan para siempre.\n\n¿Quizás podrías escuchar nuestras historias y permitirnos mezclarnos aquí en la corte para que otros puedan escuchar la historia de la vieja Panonia?"
 balkan_flavour.0005.a: "¡Por favor, enséñame sobre tu gente!"
 balkan_flavour.0005.b: "Entiendo tus preocupaciones, puedes quedarte aquí como invitado."
 balkan_flavour.0005.c: "Esto no es de mi incumbencia."
 
 #British Flavour Events
 
 british_flavour.0001.t: "El Saqueo de Alt Clut"
 british_flavour.0001.desc: "Reúno las pertenencias que puedo llevar antes de salir corriendo hacia la puerta. El campo de los alrededores ya ha sido saqueado y gran parte de la tierra ha sido pasto de las llamas. Tardaremos un rato en llegar a la explotación temporal de Gwovan, río arriba. Durante el viaje, reflexiono sobre lo sucedido.\n\nLa Fortaleza de [GetTitleByKey('c_lennox').GetNameNoTier] ha sido finalmente saqueada. Aquellos que no lograron escapar del asedio han sido asesinados o capturados por los invasores. Sólo puedo imaginar el horror de los que no lo lograron. \n\nA medida que llegamos a Gwovan, se hace cada vez más evidente que no volveremos a [GetTitleByKey('b_dumbarton')).GetNameNoTier] en un futuro próximo. El viejo castillo ya no es más que una ruina y una presa fácil para cualquier invasor exterior. Tendremos que conformarnos con lo que nos queda y, por tanto, el reino de [GetTitleByKey('d_galloway').GetNameNoTier], el último bastión de Hen Ogledd, ya no existe. En su lugar se alza Strathclyde, dispuesta a defender el [ROOT.Char.GetCulture.GetCollectiveNoun] en el futuro."
 british_flavour.0001.a: "¡Venceremos!"
 
 
 #Iranian Flavour Events
 iranian_flavour.0001.t: "El ascenso de Adharestán"
 iranian_flavour.0001.desc: "En la antigüedad, las tierras noroccidentales de Irán estaban habitadas por diversos pueblos, como los medos, los cadusios y los albanos, entre otros. Cuando cayó el Imperio aqueménida, Atropates, sátrapa de Media, siguió gobernando el norte de la antigua satrapía que pasaría a llamarse Atropatene.\n\nDesde entonces, los lugareños han sido fuertemente eranianizados y persianizados, dando lugar a las diversas tribus adhari que viven allí en la actualidad. Dividida durante mucho tiempo entre diversas políticas tribales, o gobernada por señores extranjeros sin lazos con la tierra, finalmente he conseguido poner la zona bajo mi dominio, consolidándola en una única entidad política.\n\nYa no estaremos sometidos a los extranjeros, sino que gobernaremos la tierra nosotros mismos. Al igual que Atropates antes que yo, yo también forjaré un Adharestán fuerte e independiente que resista el paso del tiempo."
 iranian_flavour.0001.a: "Atropates estaría orgulloso."
 iranian_flavour.0001.b: "¡Eran aún no está perdido!"
 
 iranian_flavour.0002.t: "El Pueblo Talyshi"
 iranian_flavour.0002.desc: "Talysh ha estado habitada por iraníes desde la antigüedad; conocida en su día como Cadusios, la tierra ha sido gobernada por varios imperios y dinastías que han influido de forma variable en la cultura local, dando lugar a Deilami, Adhari, Gilaki y otros.\n\nCon nuestra reciente política de solidificar la zona bajo una única entidad política, los lugareños han empezado a cambiar de nuevo su identidad hacia una nueva talyshi."
 iranian_flavour.0002.a: "¡Deberíamos promover esta tendencia!"
 iranian_flavour.0002.b: "Son las mismas personas que antes."
 
 british_culture.0002.t: "El Auge de los Anglosajones"
 british_culture.0002.desc: "Tras la caída del Imperio Romano de Occidente, varias tribus germánicas comenzaron a emigrar a las Islas Británicas, entre ellas los jutos, los anglos y los sajones, que llegarían a formar sus propios pequeños reinos en gran parte del territorio que colonizaron. Tras un largo periodo de expansión contra los nativos británicos y de consolidación de las tribus circundantes, reinos como los de Kent, Mercia y Northumbria empezaron a forjar nuevas culturas regionales únicas en la isla, con sus propios dialectos e identidades. Esto cambiaría poco a poco con la invasión vikinga, que vio caer muchos de estos antiguos reinos en rápida sucesión, mientras el resto era absorbido gradualmente por lo que más tarde se convertiría en Inglaterra. Como tal, una nueva cultura ha comenzado a surgir, una que se define por la fe compartida, el origen y la lengua de estos germanos nativos de Gran Bretaña, que se encuentra en un contraste con los del otro lado del mar. Por fin, estos pueblos han empezado a verse a sí mismos ya no como mercianos, sajones occidentales o reyes, sino como un pueblo inglés común."
 british_culture.0002.a: "Esto cambiará el curso de la historia."
 
 british_culture.0003.t: "La reforma de Pengwern"
 british_culture.0003.desc: "Hace mucho tiempo, gran parte de las Tierras Medias estaban gobernadas por la Casa de Pengwern, hasta que la descentralización y las invasiones extranjeras pusieron al reino de rodillas. \n\nAunque la ubicación exacta de la Corte de Pengwern se ha perdido en el tiempo, sabemos que una vez gobernó una parte considerable del territorio que se extendía desde Powys hasta el Severn, posiblemente incluso hasta el sur del Canal de Bristol. Sin embargo, cuando las comunidades rurales de Powys comenzaron a afirmar su independencia y los mercios empezaron a invadir el territorio desde el este, el reino acabó siendo subsumido y olvidado.\n\nPero por fin, mi casa ha conseguido recuperar los territorios perdidos de Ergyng, Pengwern y Powys, empujando a los anglos más allá del Severn. \nCon Pengwern de nuevo en manos británicas, es sólo cuestión de tiempo que subyuguemos a los últimos ingleses rebeldes que una vez intentaron contenernos en las tierras montañosas de Cambria; ¡pronto toda Gran Bretaña jurará lealtad a mi casa!"
 british_culture.0003.a: "¡Levantaos, Herederos de Pengwern!"
 
 british_culture.0011.t: "La Divergencia de Brythonica"
 british_culture.0011.desc: "Desde la Caída de Caergloui a manos de los anglosajones, los britanos de Britania y Bretaña han divergido entre sí lenta pero constantemente. Tras siglos de relativo aislamiento, han surgido dos variedades bretonas únicas a partir de los dialectos de Dumnonia y Cambria respectivamente: aunque ambos siguen identificándose como bretones, la variedad de cada zona se ha vuelto en gran medida ininteligible para la otra."
 british_culture.0011.a: "¡Brythonwyr o hyd!"
 
 balkan_culture.0002.t: "Un Pueblo Bosnio"
 balkan_culture.0002.desc: "Cuando se estableció el Reino de Bosnia, no muchos podían imaginar el renacimiento que traería consigo; independiente tanto de Serbia como de Croacia, el pueblo de los Alpes Dináricos Centrales y a lo largo del río Bosna ha empezado a verse a sí mismo ni como serbio ni como croata, sino como un nuevo y distinto pueblo bosnio con su propia cultura y herencia, ambas fundadas en nuestro mismo reino. "
 balkan_culture.0002.a: "¡Živjela slobodna Bosna!"
 
 balkan_culture.0004.t: "El Pueblo Ilirio"
 balkan_culture.0004.desc: "Cuando los eslavos emigraron por primera vez a los Balcanes en el siglo VI, estaban formados por muchas tribus dispares que simplemente huían de los invasores ávaros. \n\nPero desde que unimos las tierras de Iliria, las tribus se han acostumbrado unas a otras; poetas e intelectuales de todo el mundo conocido viajan a la corte iliria, contribuyendo a un emergente Renacimiento eslavo. Bajo la estabilidad de mi reino, el pueblo ilirio ha desarrollado por fin una identidad común que trasciende las antiguas fronteras tribales.\nPor lo tanto, es justo que fomentemos este incipiente sentimiento de unidad y lo desarrollemos hasta convertirlo en algo verdaderamente nuevo y duradero."
 balkan_culture.0004.a: "¡Slava Iliriji!"
 
 balkan_culture.0005.t: "El Pueblo Ilirio"
 balkan_culture.0005.desc: "Cuando los eslavos emigraron por primera vez a los Balcanes en el siglo VI, estaban formados por muchas tribus dispares que simplemente huían de los invasores ávaros.\nPero desde la formación del Reino Ilirio, estas tribus se han acercado cada vez más unas a otras hasta el punto de que ahora se consideran un solo pueblo."
 balkan_culture.0005.a: "Bien por ellos."
 
 balkan_culture.0006.t: "Las Tierras de Panonia"
 balkan_culture.0006.desc: "Hace muchos siglos, [GetTitleByKey('k_balaton')).GetNameNoTier] fue invadida por las viles hordas de los hunos, que saquearon y devastaron la tierra. Tras su desaparición, la tierra fue ocupada por pueblos como los godos, los lombardos, los ávaros y, por último, nosotros [pannonian_founder.GetCulture.GetNameNoTooltip]s.  \n\nPero ahora, después de incontables siglos, he conseguido reunir estas tierras bajo un solo estandarte. Mi autoridad se extiende desde las fortalezas vitales de [GetTitleByKey('b_sisak').GetNameNoTier] y [GetTitleByKey('b_vakovo').GetNameNoTier] en el río Sava hasta la antigua ciudad de [GetTitleByKey('b_gyor').GetNameNoTier] en el río Danubio. Por fin, Panonia está completa una vez más. \n¡Es hora de forjar un nuevo destino para estas tierras que resonará a través de los siglos!"
 balkan_culture.0006.a: "¡Somos los verdaderos herederos de Panonia, ahora y siempre!"
 balkan_culture.0006.b: "¡Ha llegado la hora de los Dulebov!"
 balkan_culture.0006.c: "¡Dunavia resistirá triunfante la prueba del tiempo!"
 
 balkan_culture.0007.t: "El Ascenso de un Nuevo Pueblo"
 balkan_culture.0007.desc: "Enfrentados a la constante amenaza exterior de francos, búlgaros, magiares e incluso compañeros eslavos, los habitantes de mi reino han forjado cada vez más un nuevo vínculo que ha crecido más allá de las divisivas líneas tribales de antaño."
 balkan_culture.0007.a: "Fascinante."
 
 establish_pannonian_culture_effect.tta: "Adoptas la nueva cultura."
 
 establish_pannonian_culture_decision_effect.tta: "Una nueva cultura eslava panónica surgirá después de un cierto tiempo"
 establish_pannonian_culture_decision_effect.ttb: "Dulebov comenzará a extenderse en Transdanubia"
 establish_pannonian_culture_decision_effect.ttc: "Dunavian surgirá después de un cierto tiempo"
 establish_pannonian_culture_decision_effect.ttd: "[GetTitleByKey('k_balaton').GetNameNoTier] se conocerá como Panonia"
 establish_pannonian_culture_decision_effect.tte: "[GetTitleByKey('k_balaton').GetNameNoTier] se conocerá como Dulebia"
 establish_pannonian_culture_decision_effect.ttf: "[GetTitleByKey('k_balaton').GetNameNoTier] se conocerá como Dunavia"
 
 ce_custom_kingdom_event.0001.t: "La Restauración de Iliria"
 ce_custom_kingdom_event.0001.desc: "Hoy celebramos el resurgimiento del Reino de Iliria. Desde su caída ante la República Romana en el siglo II a.C., Iliria ha permanecido bajo el yugo del dominio extranjero, cambiando de manos entre varios usurpadores romanos, invasores germánicos y, finalmente, jefes y príncipes eslavos.\n\nPero, por fin, he conseguido lo que ni siquiera Pleuratus podría haber soñado: He unido Iliria bajo una sola corona, reunido a sus muchas tribus bajo un estandarte común. Esta antigua tierra ya no se doblegará ante tiranos extranjeros, ¡sino que prosperará como un reino unido bajo mi benévolo gobierno!."
 ce_custom_kingdom_event.0001.a: "Los Batonianos han sido vengados"
 
 rus_culture.0002.t: "El Pueblo de Rus"
 rus_culture.0002.desc: "Han pasado muchas décadas desde que los nórdicos invadieron las tierras de los eslavos orientales. Pero a medida que ha pasado el tiempo, los nórdicos han ido adoptando cada vez más la lengua y las costumbres de los lugareños; simultáneamente, los nórdicos han prestado sus conocimientos en gobierno y guerra a los eslavos a los que gobiernan, creando una nueva identidad que trasciende la antigua."
 rus_culture.0002.a: "¡Debemos abrazar estos cambios dentro de nuestro reino!"
 rus_culture.0002.b: "Deberíamos seguir con las viejas costumbres..."
 
 
