 sri_lanka.0150.a: "Me pregunto cuál equipo ganó esta vez."
 sri_lanka.0150.a.failure: "El equipo de Pattini pierde el juego"
 sri_lanka.0150.a.success: "El equipo de Pattini gana el juego"
 sri_lanka.0150.pattini_games_intro: "En [GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName], es la costumbre tradicional de los pueblos organizar juegos rituales para la diosa [GetPlayer.Custom('RICE_pattini')] en ocasiones especiales.\n\nAmbos equipos para estos juegos suelen ser masculinos, y estas son grandes ocasiones para que los hombres se luzcan. Un equipo representa a la diosa, mientras que otro equipo representa a su esposo, o alguna deidad masculina. Si el equipo de la diosa gana, esto seguramente asegura buena fertilidad agrícola y prosperidad para el año, pero se espera que ambos equipos jueguen en serio para que el ritual se considere legítimo.\n\n"
