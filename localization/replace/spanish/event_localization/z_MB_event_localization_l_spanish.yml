 illyrian_kingdom_with_bosnia.preview.ttb: "[GetTitleByKey('k_serbia').GetNameNoTier], [GetTitleByKey('k_bosnia').GetNameNoTier] y [GetTitleByKey('k_croatia'). GetNameNoTier] serán destruidos y sus territorios originales pasarán a ser [de_jure|E] de [GetTitleByKey('k_illyria').GetNameNoTier]."
