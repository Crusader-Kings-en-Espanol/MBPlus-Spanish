 east_title.0005: "Lealtad a la Nueva Dinastía"
 east_title.0005.opening: "Una Nueva Dinastía"
 east_title.0005.desc: "Únete a la Dinastía recién reclamada"
 east_title.0005.a: "Eres sabio."
 east_title.0005.b: "¡Te agarraré yo solo!"
 east_title.0006: "Desobedecer"
 east_title.0006.opening: "Una Nueva Dinastía"
 east_title.0006.desc: "Rechazar la Dinastía recién reclamada"
 east_title.0006.a: "¡Maldita sea!"
 
 east_title.0007.opening: "Mi Señor:"
 east_title.0007.desc: "No puedes obtener un Nivel del Reino cuando eres un burócrata o tienes una ley de sucesión oficial, a menos que la cultura de tu señor tenga la innovación «Oficial de la Corte»"
 east_title.0007.a: "Así que……"                                        
