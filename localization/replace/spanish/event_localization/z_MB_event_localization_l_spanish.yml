 bureaucracy.0001.t: "Investigación y traslado de funcionarios"
 # "汝为官一任，能恪尽职守，操劳民生，堪为百官之表率。经审官院勘磨，并报呈请中书，命汝赴任新职，即日交接印绶案牍；望汝不负朝廷重托，履新之后，造福一方！"
 bureaucracy.0001.desc: "Según la investigación de la Corte Imperial sobre tus logros, creemos que has contribuido a pacificar al pueblo y a beneficiar el lugar; Ahora te nombramos nueva oficiana y esperamos que estés a la altura de nuestras altas expectativas y sigas beneficiando al pueblo. "
 # "谨奉朝命，必当竭力！"
 bureaucracy.0001.a: "¡No escatimaré ningún efecto para seguir la orden de nuestra Corte Imperial!"
 # "我去！我不去！"
 bureaucracy.0001.b: "¿Qué demonios? ¡No voy a ir!"
 bozo.0012.t: "Enterrando a Mi [ROOT.Char.Custom2('RelationToMe', ROOT.Var('RICE_ghana_burial_ancestor').Char)|U]"
 minorities.0001.desc: "Como [ROOT.Char.GetCulture.GetNameNoTooltip] [ROOT.Char.GetTitleTierName], gobierno sobre muchos temas diferentes... algunos más problemáticos que otros. Aunque siempre se puede esperar una coexistencia pacífica, puede ser más fácil simplemente expulsarlos del reino.\n\nY si por casualidad dejaran alguna propiedad, naturalmente el [ROOT.Char.GetTitleTierName] sería responsable de "limpiar" el desorden."
 minorities.0001.t: "Para expulsar a los bárbaros"
 minorities.1001.cancel: "Quizás no sea la mejor idea, después de todo."
 minorities.1001.desc: "La mía es una tierra de creyentes en [ROOT.Char.GetFaith.HighGodName], pero algunos de los campesinos han empezado a seguir a dioses extraños. Puede ser prudente expulsarlos del reino, antes de que empiecen a causar problemas para mí y mis compañeros [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip].\n\nY si por casualidad dejaran algunas de sus pertenencias, naturalmente le correspondería al [ROOT.Char.GetTitleTierName] asegurarse de que éstas sean debidamente "eliminadas.""
 minorities.1001.t: "Los infieles"
 nice: "Bien"
 niger_delta.0006.t: "Un nuevo Ọọ̀ni"
 niger_delta.0077.a.tooltip: "El Ọọ̀ni recibió varios regalos, incluyendo [gold_i|E] [gold|E], de la gente"
 socotra.0005.t: "Piratas del Océano Índico"
 socotra.0021.tooltip: "Tener un premio mayor alentará a más personas a participar, lo que te traerá, como anfitrión, mayor fama: premios más grandes resultan en más [prestige|E] y mejores bonificaciones para ti una vez que termine la competencia, obviamente a costa de más oro."
 south_ethiopia.0010.a: "¡Sí, eres bienvenido aquí!"
 south_ethiopia.0010.b: "No, no vemos ningún beneficio en esto."
 south_ethiopia.0010.base: "Las tierras del interior de África Oriental son hogar de muchas tribus y reinos que están conectados a través de lazos de ascendencia y de comercio.\n\nUn [courtier.GetWomanMan] de extracción [courtier.GetCulture.GetName], llamado [courtier.GetFirstName], ha llegado a mis tierras esperando que le dé la bienvenida como miembro de mi corte. [courtier.GetSheHe|U] tiene valiosos lazos con [courtier.GetHerHis] hermanos en su tierra natal, que podrían resultar útiles.\n\n"
 south_ethiopia.0010.t: "El Vagabundo [courtier.GetCulture.GetNameNoTooltip]"
 sri_lanka.0005.a: "Una nueva era amanece para el [buddhism.GetNameNoTooltip] en esta región."
 sri_lanka.0005.desc.intro: "Durante siglos, la Sangha [buddhism.GetAdjective] o comunidad monástica de [GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName] se ha dividido por la rivalidad entre sus tres principales monasterios: el Mahavihara, Abhayagiri y Jetavana.\n\nAunque los tres monasterios comparten muchas creencias, como la adhesión al [GetFaithDoctrine('rice_theravada_canon_doctrine').GetBaseName], también difieren en doctrina, rituales y más. Las élites, tanto budistas como no budistas, alimentaron el fuego al favorecer a una secta u otra, convirtiendo la lucha en un asunto político.\n\n"
 sri_lanka.0014.desc.not_budal_reward: "[budal.GetHerHim] y [budal.GetHerHis] descendientes privilegios legales y políticos extraordinarios a perpetuidad.\n\nEstos privilegios han sido inscritos en una placa de cobre y enviados formalmente a [budal.GetFirstNameNoTooltip], para que nadie pueda cuestionarlos."
 sri_lanka.0014.desc.not_vijayabahu_intro: "Hace años, cuando [vijayabahu.GetTitledFirstName] era solo un príncipe y un niño pequeño, [vijayabahu.GetHerHis] mi futuro era muy incierto, con invasores Chola y señores de la guerra locales siempre presentes como una amenaza para [vijayabahu.GetHerHis] seguridad. En esos años críticos, el más grande de los valientes que protegieron a [vijayabahu.GetHerHim] fue [budal.GetTitledFirstName].\n\nEs gracias a la ayuda de [budal.GetFirstNamePossessiveNoTooltip] que [GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName] pudo reunificarse."
 sri_lanka.0016.c: "Este es un nuevo día para [GetGeographicalRegion('RICE_sri_lanka_alt_region').GetNameNoTooltip]."
