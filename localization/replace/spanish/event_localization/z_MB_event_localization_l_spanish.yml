 # Found the Kingdom of Oman
 DE_decision_event.0001.t: "El Reino de Omán"
 DE_decision_event.0001.desc: "El pueblo ibadí ha carecido durante siglos de un reino para los suyos, mientras los persas al norte y los califas al oeste sometían nuestras tierras a la influencia extranjera, a falsos líderes y las tierras lejanas se burlaban de nuestras tribus, pero ya no. Las tribus desunidas ahora se arrodillan juntas ante el sultán de Omán.Con mi coronación como [fundador.GetTitleAsNameNoTooltip], daré paso a una edad dorada de prosperidad para todos los fieles de nuestro reino."
 DE_decision_event.0001.a: "¡Por fin!"

 # Restore the Kingdom of Old Saxony
 DE_decision_event.0002.t: "Los Viejos Sajones"
 DE_decision_event.0002.desc: "El pueblo sajón fue una vez una poderosa fuerza que se enfrentó a las fuerzas de Carlomagno hasta que no pudimos doblegarnos más. Desde aquel fatídico momento, los sajones han estado sometidos al gobierno de otros, incapaces de determinar su propio destino. Ahora que mis enemigos han sido derrotados y se ha logrado la independencia, ¡es hora de proclamar la restauración del Reino de Sajonia! Como [fundador.GetTitleAsNameNoTooltip], ¡lideraré a mi pueblo hacia un futuro glorioso!"
 DE_decision_event.0002.a: "¡Restaurado una vez más!"

 #Form the Grand Duchy of Saxony
 DE_decision_event.0003.t: "El Archiducado de Sajonia"
 DE_decision_event.0003.desc: "Gracias a mis ilustres logros consolidando las tierras centrales sajonas, y a la tremenda influencia que mi dinastía ha adquirido sobre el Sacro Imperio Romano Germánico, [scoped_emperor.GetTitledFirstName] ha reconocido finalmente la supremacía tradicional de Sajonia sobre los muchos pequeños duques de Alemania. \n\nA partir de hoy, todos mis sucesores llevarán el distinguido título de #EMPGranDuque#, igual que cualquier rey, para diferenciarse de los príncipes y princesas menores del Imperio."
 DE_decision_event.0003.a: "¡Sajonia erit in orbe ultima!"

 # Form the Grand Duchy of Franconia
 DE_decision_event.0004.t: "El Archiducado de Franconia"
 DE_decision_event.0004.desc: "Gracias a mis ilustres logros consolidando las tierras de Franconia, y a la tremenda influencia que mi dinastía ha adquirido sobre el Sacro Imperio Romano Germánico, [scoped_emperor.GetTitledFirstName] ha reconocido finalmente a Franconia como la última sede del poder sobre los muchos pequeños duques de Alemania. \n\nA partir de hoy, todos mis sucesores llevarán el distinguido título de #EMPGranDuque#, igual que cualquier rey, para diferenciarse de los príncipes y princesas menores del Imperio."
 DE_decision_event.0004.a: "¡Francon erit in orbe ultima!"

 # Form the Grand Duchy of Swabia
 DE_decision_event.0005.t: "El Archiducado de Suabia"
 DE_decision_event.0005.desc: "Gracias a mis ilustres logros consolidando las tierras centrales de Suabia, y a la tremenda influencia que mi dinastía ha adquirido sobre el Sacro Imperio Romano Germánico, [scoped_emperor.GetTitledFirstName] ha reconocido finalmente las tierras tradicionales de Alemannia como superiores a los muchos pequeños duques de Alemania. \n\nA partir de hoy, todos mis sucesores llevarán el distinguido título de #EMPGranDuque#, igual al de cualquier rey, para diferenciarse de los príncipes y princesas menores del Imperio."
 DE_decision_event.0005.a: "¡Swabia erit in orbe ultima!"

 # Forming Bulgarian Empire
 DE_decision_event.0006.t: "Surge una Nueva Roma"
 DE_decision_event.0006.desc: "Desde los tiempos de Asparuh, nuestro pueblo ha intentado desafiar el poder del Imperio Romano de Oriente. Gracias a nuestro poderío, los griegos han perdido su influencia sobre los Balcanes y nuestro reino los ha reemplazado. Ahora, incluso en toda Europa, nos atrevemos a compararnos con el antiguo Imperio Romano, ya que el Emperador Romano de Oriente y el Patriarca de Constantinopla sólo pueden arrodillarse asombrados ante nuestro poderío. Mi familia y yo hemos surgido como la hegemonía indiscutible en la península de los Balcanes.\nEs el momento adecuado para que yo mismo sea reconocido como Zar de los Búlgaros y el verdadero Basileus de los Romanos con todo el honor y autoridad asociados. Nuestra capital será conocida como la Tercera Roma, y nuestro imperio será conocido como el verdadero Imperio Romano - ¡un Imperio sobre Búlgaros y Romanos!"
 DE_decision_event.0006.a: "Me levanto ahora como Emperador sobre Búlgaros y Romanos."

 # Reform the Avar Khaganate 
 DE_decision_event.0007.t: "El Khaganato Avar"
 DE_decision_event.0007.desc: "Los ávaros gobernaron una vez un vasto imperio que se extendía desde las estepas pónticas hasta las fronteras de los germanos. Incapaces de resistir las despiadadas fuerzas de los francos, nuestro imperio se desmoronó ante nosotros. Nuestra lucha por sobrevivir ha sido un viaje difícil, pero hoy ya no luchamos más. El Khaganato Avar está ahora restaurado y listo para traer una era de gloria y prosperidad a nuestros pueblos."
 DE_decision_event.0007.a: "¡Por el nuevo Khaganate!"

 # Integrate Aquitaine
 DE_decision_event.0008.t: "Unidos como Uno"
 DE_decision_event.0008.desc: "Desde la conquista carolingia de Aquitania en 769, las tierras de Aquitania han sido centro de confusión y conflicto entre la nobleza y sus soberanos. El Reino de Aquitania sólo ha servido para dividir a nuestro pueblo, pero ya no más. A partir de ahora todos los francos serán gobernados bajo la Corona de Francia Occidental."
 DE_decision_event.0008.a: "No nos dividamos nunca más."

 # Restore the Kingdom of Aquitaine
 DE_decision_event.0009.t: "No Seamos más Serviles"
 DE_decision_event.0009.desc: "Durante demasiado tiempo, el pueblo de Aquitania ha estado sometido al dominio de reyes ausentes del norte de Francia. Siglos de supervisión extranjera han hecho que la idea de un reino independiente parezca un sueño lejano. Pero ya no. Bajo mi liderazgo, una Aquitania libre e independiente ya no es un sueño. Nuestro pueblo es ahora libre y está listo para buscar su destino entre las otras grandes potencias de Europa."
 DE_decision_event.0009.a: "Sólo nosotros determinaremos nuestro destino."

 # Reform Samo's Empire
 DE_decision_event.0010.t: "El Imperio de Samo"
 DE_decision_event.0010.desc: "Nuestro pueblo estuvo una vez unido bajo el liderazgo de Samos, que poseía un imperio que unía a muchos de los eslavos occidentales. Es con orgullo y regocijo que puedo proclamar el renacimiento del Imperio de Samo, "La Colina de los Wends." Nuestro reino superará al imperio de antaño y nos conducirá a un futuro glorioso."
 DE_decision_event.0010.a: "Nos uniremos una vez más"

 # Restore the Frisian Kingdom
 DE_decision_event.0011.t: "Un Reino Renacido"
 DE_decision_event.0011.desc: "Los frisones de antaño lograron mantener su independencia del yugo franco hasta que no pudieron soportarlo más. Siglos de dominación extranjera han hecho que la idea de un reino independiente parezca un sueño lejano. Bajo mi liderazgo, el reino de Frisia ha dejado de ser un sueño. Nuestro pueblo es ahora libre y está preparado para buscar su destino entre las otras grandes potencias de Europa."
 DE_decision_event.0011.a: "Seremos dueños de nuestro destino."
 
 # Unifying Italy, by Flavio Verna (From Base Game)
 DE_decision_event.0012.t: "El Imperio Italiano"
 DE_decision_event.0012.desc: "Desde la caída del Imperio de Occidente, la península itálica ha estado fracturada entre ciudades-estado rebeldes, obispos codiciosos y conquistadores bárbaros.\n\nSin embargo, bajo el gobierno de mi dinastía, Italia ha dejado a un lado las mezquinas luchas internas y se ha recompuesto una vez más, resurgiendo como una potencia dominante en Occidente. Ya no seremos un premio a disputar entre francos y griegos, ni seremos maltratados por piratas y pretendientes bárbaros. A partir de hoy retomaremos nuestro lugar como verdaderos herederos del Imperio Romano."
 DE_decision_event.0012.a: "¡Labor omnia vincit!"

 # Restore Zoroastrianism 
 DE_decision_event.0017.t: "Un Retorno a la Vieja Religión"
 DE_decision_event.0017.desc.intro: "No es ningún secreto que he tenido... dudas sobre mi [old_faith.GetAdjective] fe."
 DE_decision_event.0017.desc.excommunicated: "La excomunión ha sido difícil para mí, gravando mi alma injustamente y causando no pocas disputas con los otros [old_faith.GetAdherentNamePluralNoTooltip] de mi vida."
 DE_decision_event.0017.desc.rivalry_with_hof: "Las constantes discusiones con [old_faith.GetReligiousHead.GetTitledFirstName], una mezquina disputa temporal de que [old_faith.GetReligiousHead.GetSheHe] #EMP debería#! estar por encima, me han dejado desilusionado."
 DE_decision_event.0017.desc.negative_piety_level: "Mis actos me han marcado como un pecador, uno cuya fe parece contentarse con dejar caer por el camino espiritual, y no se puede negar lo aislante que ha sido."
 DE_decision_event.0017.desc.lorgar: "A pesar de que el fuego de mi creencia arde tan brillantemente como el Sol, no puedo evitar la sensación de que debe haber algo #EMP más# en el universo que sólo [old_faith.HighGodName]. Alguna verdad más primordial."
 DE_decision_event.0017.desc.sinful_traits: "Se siente como si cada uno de mis actos, cada uno de mis pensamientos, la forma en que vivo mi vida está marcada como inherentemente pecaminosa."
 DE_decision_event.0017.desc.virtuous_basque_pagan_traits: "A veces me pregunto cómo es que alguna vez lo amé, cuando toda mi personalidad parece #EMP construida#¡para algo diferente."
 DE_decision_event.0017.desc.naked_cynicism: "Me parece desinteresante, y lo que es peor, completamente cautivado por poderes sobre los que tengo poco o ningún control."
 DE_decision_event.0017.desc.outro: "Por fin, sin embargo, creo que he encontrado consuelo con [mazdayasna.GetName]. Estos adherentes a la antigua fe de la Antigua Eran no tienen juicios para mí, sólo esperanza y anhelo ante la perspectiva de volver a un tiempo parecido al Imperio Sasánida."
 DE_decision_event.0017.a: "¡[mazdayasna.GetNameNoTooltip] ya no será perseguido!"

 # Fufill the Hadith
 DE_decision_event.0018.t: "La Conquista de Constantinopla"
 DE_decision_event.0018.desc: "Docenas de ejércitos han intentado tomar Constantinopla y han fracasado. Nuestros propios antepasados flaquearon ante estos muros, al igual que muchos otros que intentaron romper esta gran ciudad. Hoy, los hemos vengado. Allah lo ha querido.\n\nEl Profeta dijo: "Conquistarás Constantinopla. Qué maravilloso líder será su líder. Y qué maravilloso ejército será ese ejército." Ahora, debemos usar nuestras manos y mentes para forjar una nueva era de las cenizas. La Manzana Roja ha sido entregada a los fieles."
 DE_decision_event.0018.a: "¡Allahu Akbar!"

 # Establish Cairo
 DE_decision_event.0020.t: "La Fundación de El Cairo"
 DE_decision_event.0020.desc: "Desde tiempos inmemoriales, Egipto ha sido considerado cuna de la civilización. Sus tierras han sido testigo de algunos de los primeros desarrollos de la escritura, la agricultura, la urbanización y el gobierno central. Para inaugurar el nacimiento de una nueva era en la larga historia de Egipto, he encargado la construcción de una nueva capital en el corazón del país. Estoy seguro de que, con el tiempo, mi nueva capital eclipsará a la propia Alejandría."
 DE_decision_event.0020.a: "Una nueva capital para una nueva era"
 DE_decision_event.0020.b: "Este Acto será mi logro definitorio"

 # Sicilian Muslim Event
 DE_decision_event.0023.t: "¿Un Ducado por tus pensamientos?"
 DE_decision_event.0023.desc: "Como centro del Mar Mediterráneo, Sicilia ha sido durante mucho tiempo una parte crítica en el comercio que gira en torno al gran mar. Y ahora parece que [rey_de_sicilia.GetTitledFirstName] ha decidido aprovechar este hecho para introducir una nueva forma de moneda.\NLlamada Ducado y modelada según la traquea bizantina, podría ser útil que aceptáramos esta moneda como emisión válida dentro de nuestro reino. Tal vez incluso podría servir de inspiración para una moneda propia..."
 DE_decision_event.0023.a: "Esto sólo puede beneficiar a nuestros bolsillos"
 DE_decision_event.0023.b: "Nuestra vieja moneda funciona igual de bien"

 # Sicilian Muslim Event
 DE_decision_event.0024.t: "Una cuestión de fe"
 DE_decision_event.0024.desc: "Como centro del mar Mediterráneo y de su comercio, mi reino acoge a un gran número no sólo de cristianos, sino también de griegos, judíos y musulmanes. Aunque tal vez no sean la mayoría en sus comunidades, todavía hay muchos entre esos grupos que llaman a Sicilia su hogar.\nSin embargo, mi llegada al trono siciliano no ha traído la paz social y religiosa completa a Sicilia. Me han dicho que incluso ahora hay grupos que esperan restaurar el dominio del Islam en la isla.\NMuchos de mis consejeros me han presionado para que tome algún tipo de acción, pero me he resistido a hacerlo. Pero ahora, siento que debo actuar."
 DE_decision_event.0024.a: "Pueden permanecer en mi reino, pero no en la propia Sicilia"
 DE_decision_event.0024.b: "Todos somos creación de Dios, y como tal, los aceptaré como son"
 DE_decision_event.0024.c: "El Islam no tiene cabida en mi reino"
 DE_decision_event.0024.d: "¡El único musulmán bueno es un musulmán muerto!"
 
 relocate_sicilian_muslims_decision_tooltip: "Reasientas a la población musulmana siciliana en la Italia continental. Dentro de este entorno controlado, no deberían poder desafiar la autoridad real mientras siguen beneficiando a la corona con impuestos y servicio militar"
 protect_sicilian_muslims_decision_tooltip: "Cualquiera que sean tus razones, permites que los musulmanes sicilianos permanezcan en Sicilia sin ser molestados por la autoridad real, aunque aún está por ver si la población local acepta o condena su presencia."
 exile_sicilian_muslims_decision_tooltip: "Ordenas que todos los musulmanes se conviertan o sean exiliados de Sicilia. Aunque esto permitirá una mayor cohesión religiosa (y lo que es más importante, el control real) en la isla, no se puede saber el impacto en su economía"
 massacre_sicilian_muslims_decision_tooltip: "Como dice el buen Libro, "El Señor es vengativo contra sus enemigos; se ensaña con sus enemigos" y los musulmanes son, efectivamente, mi enemigo. Bueno, incluso si no lo son, es mejor simplemente masacrarlos a todos para estar seguros"

 # Axum becomes Abyssinia
 ce_title_event_abyssinia_name_change.title: "El Fin de Axum"
 ce_title_event_abyssinia_name_change.desc: "¡El reinado de los reyes salomónidas ha llegado a su fin! [abyssinia_title.GetName] se ha escapado finalmente de sus manos. Con los Salomónidas eliminados, los últimos restos del antiguo Imperio Axumita ya no existen. Conmigo como futuro [ROOT.Char.GetTitleAsNameNoTooltip], tenemos un nuevo y brillante destino por delante. Por lo tanto, es justo eliminar #EMP todos y cada uno#! de los recordatorios de su influencia. Incluido el propio #EMP."
 ce_title_event_abyssinia_name_change.a: "¡Una nueva era comienza!"
 ce_title_event_abyssinia_name_change.a_tt_1: "El [abyssinia_title.GetName] cambia de nombre a #high $k_abyssinia$#!"
 
 # Establish Transcaucasia
 DE_decision_event.0025.t: "Un Imperio Propio"
 DE_decision_event.0025.desc: "Durante siglos, nuestra patria ha sido escenario de rivalidades políticas, militares, religiosas y culturales, y de expansionismo por parte de cualquier potencia que considerara oportuno tratar de imponer su voluntad... pero ya no. Por mi mano, guiada por mis antepasados, las tierras de Transcaucasia se mantienen unificadas e independientes quizá por primera vez en la historia. Nunca más mi pueblo será ignorado y descontado; dejado a merced de poderes mayores que utilizan sus tierras como su campo de batalla personal. Dirigida por mí y mis descendientes, Transcaucasia se ganará su lugar entre los grandes imperios de la historia."
 DE_decision_event.0025.a: "¡Estamos unidos!"
 
 # Unite Heptarchy
 DE_decision_event.0026.t: "Unidos como Uno"
 DE_decision_event.0026.desc: "Inglaterra ha estado históricamente dividida en 7 reinos independientes, también conocidos como la Heptarquía. La Heptarquía sólo ha servido para dividir a nuestro pueblo y nos ha hecho vulnerables a los invasores, pero ya no más. A partir de ahora todos los sajones serán gobernados bajo la Corona de Inglaterra."
 DE_decision_event.0026.a: "No nos dividamos nunca más."
 unify_saxons_decision_confirm: "Unir los Reinos Sajones"
 
 # Found the Kingdom of Oman
 ce_host_a_bride_show.0001.t: "El Espectáculo de la Novia"
 ce_host_a_bride_show.0001.desc: "Espero ansioso mientras las mujeres que pronto podrían ser mi esposa se filtran por las puertas hacia uno de los muchos espléndidos salones del palacio imperial. En los últimos días, los miembros más cercanos de mi familia y mis consejeros han hecho una selección de las jóvenes tras haber enviado funcionarios a reunir a las mujeres más bellas y bien nacidas de las provincias. Mi canciller, [canciller_imperial.GetTitledFirstName], anuncia a cada candidata con su nombre, familia, puesto y cualidades notables. Pero no importa lo que mis allegados piensen de las mujeres que tengo ante mí, la elección final depende de mí.\nEn mis manos descansa la acostumbrada manzana de oro. Al igual que Paris en su infame Juicio, ahora debo decidir a quién se le concederá la manzana y ascenderá a la posición de Emperatriz..."
 ce_host_a_bride_show.0001.a: "[bride_1.GetTitledFirstName] será mi esposa"
 ce_host_a_bride_show.0001.b: "[bride_2.GetTitledFirstName] es mi elección"
 ce_host_a_bride_show.0001.c: "[bride_3.GetTitledFirstName] es mi elección"
 ce_host_a_bride_show.0001.d: "¡Ninguna de estas candidatas es la adecuada!"
 ce_refuse_to_marry_any_option_tt: "Te niegas a casarte con cualquiera de las opciones que tienes delante"

 
 
 #Germania-Slavica Decisions
 consolidate_polish_identity_txt: "Unir a los Lechitas del Este"
 consolidate_polish_identity_tooltip: "Unir a los Lechitas de Polania y Vistulia en una sola cultura"
 consolidate_polish_identity_desc: "Los Hijos de Lech se asentaron en toda la sección oriental de la Llanura del Norte de Europa, habitando una vasta zona que se extiende desde el río Elba hasta el Bug, con el Oder formando una línea divisoria entre ambos.\n\nDebemos asumir una posición preeminente entre los lechitas del Vístula para defendernos de los ataques del sur y el este. No nos dividiremos entre Polan o Lend, sino que nos reconoceremos mutuamente como herederos iguales de Lech."
 consolidate_polish_identity.preview.tta: "Adoptarás una nueva [culture|E] basada en la anterior"
 consolidate_polish_identity.preview.ttb: "El [title|E] [kingdom|E] de [GetTitleByKey('k_poland').GetNameNoTier] adoptará un nuevo nombre"
 consolidate_polish_identity.preview.ttc: "El 40% de [counties|E] eslavos occidentales en [GetGeographicalRegion('ce_custom_poland').GetName] adoptarán la nueva [culture|E]"
 consolidate_polish_identity_confirm: "¡Vivan los hijos de Lech!"
 
 consolidate_polabian_identity_txt: "Unid a los Lechitas Occidentales"
 consolidate_polabian_identity_tooltip: "Unir a los Lechitas de Polabia y Sorbia en una sola cultura"
 consolidate_polabian_identity_desc: "Los Hijos de Lech se asentaron en toda la sección oriental de la Llanura del Norte de Europa, habitando una vasta zona que se extiende desde el río Elba hasta el Bug, con el Oder formando una línea divisoria entre ambos. \n\nTenemos que unir a los Lechitas a lo largo del Elba en un solo pueblo que pueda resistir la tormenta que se avecina de los reinos germánicos expansionistas al norte y al oeste. Ya no divididos entre Obotrite y Sorb, seremos conocidos como Wends, ¡los herederos de los Veneti y verdaderos gobernantes de estas tierras!"
 consolidate_polabian_identity.preview.tta: "Adoptaréis una nueva [culture|E]"
 consolidate_polabian_identity.preview.ttb: "Tu nueva [culture|E] se extenderá dinámicamente a [counties|E] eslavos occidentales en [GetGeographicalRegion('ce_custom_wendia').GetName] si son propiedad directa tuya o de tu [vassal|E]"
 consolidate_polabian_identity_effect: "El 40% de los [county|E] eslavos occidentales en [GetGeographicalRegion('ce_custom_wendia').GetName] adoptarán la nueva [culture|E]"
 consolidate_polabian_identity_confirm: "¡Viva Wendia!"
 
 ce_custom_poland: "Lechia oriental"
 ce_custom_wendia: "Wendia"
 
 invite_german_settlers_txt: "Invitar colonos"
 invite_german_settlers_tooltip: "Invita a nuevos colonos a tu reino"
 invite_german_settlers_desc: "Las tierras de nuestro reino están escasamente pobladas y presentan una variedad de pantanos, bosques y colinas que dificultan su desarrollo. \n\nSi no queremos quedarnos gravemente rezagados respecto al resto de Europa, tenemos que promulgar medidas drásticas e invitar tanto a colonos como a ingenieros experimentados a reclamar estas tierras para cultivarlas de forma rentable."
 invite_german_settlers.preview.tta: "Recibiremos un impulso a nuestro desarrollo en un [county|E] aleatorio"
 invite_german_settlers.preview.ttb: "Cada [county|E] puede recibir un segundo impulso con sus modificadores reducidos a la mitad tras 10 años"
 invite_german_settlers_confirm: "¡Envíen el mensaje!"
 
 #Central Germany Decisions
 embrace_upper_saxon_identity_txt: "Convertirse en Alta Sajonia"
 embrace_upper_saxon_identity_tooltip: "Adopta un nuevo nombre para tu [culture|E]"
 embrace_upper_saxon_identity_desc: "Al dejar de estar unida la región histórica de Sajonia, los diversos bajos sajones se separan cada vez más en nuevos grupos por las tierras bajas, mientras que simultáneamente, tanto los colonos sajones como los francos se desplazan constantemente hacia el este, a las tierras altas sorabas. Aunque muchos de ellos conservan o adoptan la identidad sajona, las diferencias culturales son cada vez más evidentes. \nEs hora de hacer oficial esta divergencia."
 embrace_upper_saxon_identity.preview.tta: "La [culture|E] sajona pasará a llamarse baja sajona"
 embrace_upper_saxon_identity.preview.ttb: "La [culture|E] milcénica pasará a ser conocida como alta sajona"
 embrace_upper_saxon_identity_confirm: "Era inevitable"
 
 
 #Form Illyria
 found_kingdom_of_illyria_decision: "Formar el Reino de Iliria"
 found_kingdom_of_illyria_decision_desc: "Hace muchos siglos, nos establecimos en estas tierras bajo la soberanía de los romanos. Mucho ha cambiado desde entonces.\n\nA medida que el dominio romano sobre Iliria desaparecía lentamente, establecimos muchas entidades tribales dispares como Raška, Croacia o Zachlumia. Pero divididos somos débiles: ¡ha llegado el momento de unir a nuestro pueblo bajo un único estandarte ilirio!."
 found_kingdom_of_illyria_decision_tooltip: "Iliria se convierte en un [kingdom|E] [de_jure|E]"
 found_kingdom_of_illyria_decision_confirm: "¡Hurra!"
 
