 restore_the_druids_decision: "Restaurar el Sacerdocio [ROOT.Char.GetFaith.GetNameNoTooltip]"
 restore_the_druids_decision_confirm: "¡Viva el Myrdidin!"
 restore_the_druids_decision_desc: "¡Ha llegado el momento de traer a los antiguos druidas de [ROOT.Char.GetFaith.GetName]!"
 restore_the_druids_decision_tooltip: "El sacerdocio de [ROOT.Char.GetFaith.GetAdjective] está establecido."
