 kadu_muarik.1001.t: "El auge del Mu'arikismo"
 kadu_muarik.1001.desc: "Parece que una creencia fringe se está apoderando en el [kadu_muarik_county.GetName]. El movimiento religioso está dirigido por un niño profeta entre la tribu Kutāma. ¡Han declarado al chico qibla y rezan hacia él en lugar de la Ka Apuestabah! \n \n Los magistrados locales están preocupados, pero seguramente un grupo religioso fringe liderado por un simple profeta niño no es nada de lo que preocuparse?"
 kadu_muarik.1001.a: "¿Por qué debería preocuparme?"
 kadu_muarik.1001.a.flavor: "¿Cuándo un grupo religioso marginal de provincias ha causado problemas a alguien?"
 kadu_muarik.1001.b: "Arranquemos esto de raíz antes de que se arraigue..."
 kadu_muarik.1001.b.conversion_tt: "Si ya estás convirtiendo la fe en [kadu_muarik_county.GetName], ¡el progreso puede perderse si eliges esta opción!"
 kadu_muarik.1001.player_warning: "@warning_icon! #X Fracaso en la conversión de [kadu_muarik_county.GetNameNoTier] del [kutama_pagan.GetName] lo suficientemente rápido conducirá a un levantamiento de los Mu'arikitas. Prepárate.#!"

 kadu_muarik.1002.desc: "El levantamiento religioso mu'arikista encabezado por el niño-príncipe Kadu ibn Mu'arik se ha precipitado desde las montañas como una presa reventada, arrasando con todo lo que toca. Estos sectarios pretenden recuperar el Magreb de los árabes en nombre de su Mahdi.n\n\Su líder, [hamim.GetTitledFirstName], al que llaman profeta, se dice que tiene poderes oraculares, como los bereberes de antaño, pero también afirma haber creado un nuevo Libro Sagrado del Islam. Sea como fuere, [hamim.GetSheHe] ha encontrado ahora un fuerte núcleo de seguidores, que han declarado a [kadu_ibn_muarik.GetHerHim] nada menos que ¡el Madhi!"
 kadu_muarik.1002.a: "¡Como si este humilde muchacho representara alguna amenaza!"
 kadu_muarik.1002.a.target.tt: "¡Los mu'arikitas van a la guerra contra ti!"
 kadu_muarik.1002.a.not_target.tt: "¡Los mu'arikitas van a la guerra contra tu señor!"
 kadu_muarik.1002.b: "[kadu_ibn_muarik.GetSheHe|U] tiene algunos puntos muy buenos, en realidad."
 kadu_muarik.1002.b.flavor: "Difícilmente puedo llamarme un fiel digno..."

 #kadu_muarik.1003.desc: "The Mu'arikists' founder, [kadu_ibn_muarik.GetTitledFirstName], has passed, and with that one would hope that [kadu_ibn_muarik.GetHerHis] movement would be consigned to history. If only we were so lucky.\n\nInstead, a new leader has risen! [al_mumin.GetTitledFirstName] has not only held the tribes together, [al_mumin.GetSheHe] has gathered #EMP more#! people to [al_mumin.GetHerHis] banner!"
 #kadu_muarik.1003.a: "These fanatics just keep coming!"
 #kadu_muarik.1003.a.tt: "The Mu'arikists return, stronger than ever."

 kadu_muarik.1004.t: "Control de Kairwan"
 kadu_muarik.1004.desc: "Fundada en su día como capital imperial, la [kairwan.GetTitle] está ahora bajo mi control, como es debido. Sin embargo, lleva un sinfín de influencias [old_faith.GetAdjective], y mis [kutama_pagan.GetName] están ansiosos por verla rehecha a mi imagen.\n\nParece una pena destruir tantos palacios y templos en perfecto estado, pero podría ser necesario para hacer realidad mi ambición de llevar la iluminación al Magreb."
 kadu_muarik.1004.a: "¡La convertiremos en nuestra nueva, [kutama_pagan.GetAdjective] capital!"
 kadu_muarik.1004.b: "¡Construyamos una nueva ciudad aún más grande!"
 kadu_muarik.1004.c: "Tal vez no sea el curso de acción más sabio..."
 
 hamim.1001.t: "El ascenso de los Ha-Mimites"
 hamim.1001.desc: "Parece que una creencia marginal se está imponiendo en el [hamim_county.GetName]. El movimiento religioso está encabezado por un autodenominado profeta de la tribu Ghomara. Este profeta afirma haber recibido una nueva revelación de Alá, en lengua bereber.\n\nLos magistrados locales están preocupados, pero seguramente un grupo religioso marginal liderado por un autodenominado profeta tribal no es nada de lo que preocuparse."
 hamim.1001.a: "¿Por qué habría de preocuparme?"
 hamim.1001.a.flavor: "¿Cuándo un grupo religioso marginal de provincias ha causado problemas a alguien?"
 hamim.1001.b: "Vamos a erradicar esto antes de que se arraigue bien..."
 hamim.1001.b.conversion_tt: "¡Si ya estás convirtiendo la fe en [hamim_county.GetName], el progreso puede perderse si eliges esta opción!"
 hamim.1001.player_warning: "@warning_icon! #X No convertir [hamim_county.GetNameNoTier] lejos de [ghomara_pagan.GetName] lo suficientemente rápido llevará a un levantamiento de los Ha-Mimites. Prepárate.#!"

 hamim.1002.desc: "El levantamiento de los Ha-Mim, encabezado por su autodenominado profeta Ha-Mim, que inicialmente echó raíces en las montañas del Rif, ha crecido rápidamente en apoyo entre las tribus Ghomara. Estos sectarios afirman que pretenden recuperar el Magreb de los árabes en nombre de su nuevo Mahdi. Su líder, [hamim.GetTitledFirstName], al que llaman profeta, cuenta también con el apoyo de un par de brujas. La primera es su tía, a la que llaman Sahira o Tanqit, y la segunda bruja es la hermana del profeta, una hermosa mujer llamada Daggu. Se dice que estas mujeres dominan los poderes de la adivinación, y Daggu especialmente se ha convertido en objeto de devoción e inspiración entre los hombres de Ha-Mim. Ha-Mim, por su parte, afirma haber recibido una revelación divina de Alá en lengua bereber, e incluso ha creado un Corán bereber basado en estas visiones. Sea como fuere, [hamim.GetSheHe] ha encontrado ahora un fuerte núcleo de seguidores, que han declarado a [hamim.GetHerHim] nada menos que el Madhi."
 hamim.1002.a: "¡Como si este "profeta" trastornado supusiera alguna amenaza!"
 hamim.1002.a.target.tt: "¡Los Ha-Mimitas van a la guerra contra ti!"
 hamim.1002.a.not_target.tt: "¡Los Ha-Mimites van a la guerra contra tu señor!"
 hamim.1002.b: "[hamim.GetSheHe|U] tiene algunos puntos muy buenos, en realidad."
 hamim.1002.b.flavor: "Difícilmente puedo llamarme un fiel digno..."

 hamim.1003.desc: "El fundador epónimo de los Ha-Mimites, [hamim.GetTitledFirstName], ha fallecido, y con ello uno esperaría que el movimiento [hamim.GetHerHis] pasara a la historia. Si tuviéramos tanta suerte. En cambio, ¡un nuevo líder ha surgido! [daggu.GetTitledFirstName], no sólo ha mantenido unidas a las tribus, ¡[daggu.GetSheHe] ha reunido a #EMP más#! personas a la bandera de [daggu.GetHerHis]!"
 hamim.1003.a: "¡Estos fanáticos siguen llegando!"
 hamim.1003.a.tt: "Los Ha-Mimitas vuelven, más fuertes que nunca."

 hamim.1004.t: "Control de Ceuta"
 hamim.1004.desc: "Fundada en su día como capital imperial, la [ceuta.GetTitle] está ahora bajo mi control, como es debido. Sin embargo, arrastra un sinfín de influencias [old_faith.GetAdjective], y mis [ghomara_pagan.GetName] están ansiosos por verla rehecha a mi imagen.\NParece una pena destruir tantos palacios y templos en perfecto estado, pero podría ser necesario para hacer realidad mi ambición de llevar la iluminación al Magreb."
 hamim.1004.a: "¡La convertiremos en nuestra nueva, [ghomara_pagan.GetAdjective] capital!"
 hamim.1004.b: "¡Construyamos una nueva ciudad aún más grande!"
 hamim.1004.c: "Tal vez no sea el curso de acción más sabio..."
 
 mz_faith_tenet_specific.1001.t: "El Precio de la Paz"
 mz_faith_tenet_specific.1001.desc: "Hace demasiado tiempo que no veo la batalla... si quiero mantener mi estatus a los ojos de [ROOT.Char.GetFaith.WarGodName], pronto debo emprender el camino de la gloriosa conquista."
 mz_faith_tenet_specific.1001.a: "Tengo un año."
 mz_faith_tenet_specific.1001.if: "Si no declaras una guerra ofensiva ni participas personalmente en una batalla o incursión en el plazo de un año:"

 mz_faith_tenet_specific.1002.t: "Desgracia"
 mz_faith_tenet_specific.1002.desc: "Aunque conocía las consecuencias, he seguido soportando esta paz insufrible, y ahora debo pagar el precio."
 mz_faith_tenet_specific.1002.a: "[ROOT.Char.GetFaith.WarGodName] está ciertamente disgustado."

 mz_faith_tenet_specific.2001.t: "Ritos Funerarios: [ancestor.GetTitledFirstNameNoTooltip|U]"
 mz_faith_tenet_specific.2001.desc: "Ha llegado el momento de dar sepultura a mi antepasado, [ancestor.GetTitledFirstName]. Debe construirse un gran edificio en honor de [ancestro.GetHerHis], y dentro [ancestro.GetTitledFirstNameNoTooltip|U] será enterrado con todas las riquezas y posesiones que [ancestro.GetSheHe] necesitará en la próxima vida. La obtención de los mismos me corresponde a mí, al igual que la elección del lugar."
 mz_faith_tenet_specific.2001.tt: "Antepasado enterrado"
 mz_faith_tenet_specific.2001.a: "[mz_location_a.GetNameNoTierNoTooltip|U] es la más apropiada."
 mz_faith_tenet_specific.2001.a_pyramids: "Las pirámides de [mz_location_a.GetNameNoTierNoTooltip|U] son las más adecuadas."
 mz_faith_tenet_specific.2001.b: "¿O quizás [mz_location_b.GetNameNoTierNoTooltip|U]?"
 mz_faith_tenet_specific.2001.b_pyramids: "¿O quizás las pirámides en [mz_location_a.GetNameNoTierNoTooltip|U]?"
 mz_faith_tenet_specific.2001.c: "No, [mz_location_c.GetNameNoTierNoTooltip|U] servirá."
 mz_faith_tenet_specific.2001.c_pyramids: "Las pirámides de [mz_location_a.GetNameNoTierNoTooltip|U] servirán."

 mz_faith_tenet_specific.2002.desc_pyramids: "Las pirámides están abiertas, listas para recibir a otra alma difunta. [ROOT.Char.GetFaith.HighGodName], sé testigo de este honor y guía a [ancestor.GetTitledFirstNameNoTooltip|U] en la próxima vida. He cumplido con mi deber de asegurar que todo lo que [ancestor.GetSheHe] requiere descansa con [ancestor.GetHerHim]."
 mz_faith_tenet_specific.2002.desc_default: "La construcción del edificio adecuado ha comenzado, y [ancestor.GetTitledFirstNameNoTooltip|U] pronto descansará. [ROOT.Char.GetFaith.HighGodName], sé testigo de este honor y guía a [ancestor.GetTitledFirstNameNoTooltip|U] en la próxima vida. He cumplido con mi deber de asegurar que todo lo que [ancestor.GetSheHe] requiere descansa con [ancestor.GetHerHim]."
 mz_faith_tenet_specific.2002.a: "Descansa en paz."

 mz_faith_tenet_specific.2101.t: "Constructores de Pirámides"
 mz_faith_tenet_specific.2101.desc: "Aunque llevará tiempo, una buena cantidad de recursos y un intenso trabajo, he decidido comenzar los preparativos para la construcción de una serie de Pirámides que algún día puedan albergar mis propios restos mortales, o tal vez los de otro antepasado. Todo lo que queda por hacer es elegir un lugar en el que construir dicha estructura. Debe ser un lugar que sirva debidamente a la fe, y dentro de mi ámbito personal."
 mz_faith_tenet_specific.2101.a: "Construiré $building_type_mz_pyramids_01$ en [mz_location_a.GetNameNoTierNoTooltip|U]."
 mz_faith_tenet_specific.2101.toast_a: "Ya puedes construir $building_type_mz_pyramids_01$ en [mz_location_a.GetNameNoTierNoTooltip|U]"
 mz_faith_tenet_specific.2101.b: "[mz_location_b.GetNameNoTierNoTooltip|U] ¿sería quizás más adecuado?"
 mz_faith_tenet_specific.2101.toast_b: "Ya puedes construir $building_type_mz_pyramids_01$ en [mz_location_b.GetNameNoTierNoTooltip|U]"
 mz_faith_tenet_specific.2101.c: "¿O quizás [mz_location_c.GetNameNoTierNoTooltip|U]?"
 mz_faith_tenet_specific.2101.toast_c: "Ya puedes construir $building_type_mz_pyramids_01$ en [mz_location_c.GetNameNoTierNoTooltip|U]"
 mz_faith_tenet_specific.2101.toast_t: "$building_type_mz_pyramids_01$ Construcción preparada"
 mz_faith_tenet_specific.2101.d: "Déjame considerarlo un poco más..."

 mz_faith_tenet_specific.2201.t: "Dedicación a la Naturaleza"
 mz_faith_tenet_specific.2201.desc: "A petición mía, [ROOT.Char.GetFaith.PriestNeuterPlural] de las arboledas de todo el reino se han reunido para realizar una dedicación aquí, en una de esas arboledas escondida en la naturaleza. Durante la ceremonia, cada uno recuerda a los reunidos que el mundo natural es un regalo de [ROOT.Char.GetFaith.HighGodName] que debemos salvaguardar y cuidar, y que a cambio de hacerlo, los fieles serán recompensados. Como [ROOT.Char.GetLadyLord] del reino, me corresponde a mí decidir qué tipo de bendición debemos solicitar..."
 mz_faith_tenet_specific.2201.a: "[ROOT.Char.GetFaith.WarGodName], ¡guíanos a la victoria!"
 mz_faith_tenet_specific.2201.b: "¡[ROOT.Char.GetFaith.WealthGodName], concédenos prosperidad!"
 mz_faith_tenet_specific.2201.c: "Por el hogar y la casa, en nombre de [ROOT.Char.GetFaith.HouseholdGodName]."
 mz_every_theocratic_count_plus: "Cada vasallo religioso de al menos rengo [count|E]"
 mz_county_bonus: "Cada [domain|El] [county|El] que venera la naturaleza"
 mz_minor_bonus: "Por cada [domain|El] [barony|El] que tenga una explotación en bosque, taiga o selva"
 mz_major_bonus: "Por cada [domain|El] [barony|El] que carezca de una explotación"
 
 
