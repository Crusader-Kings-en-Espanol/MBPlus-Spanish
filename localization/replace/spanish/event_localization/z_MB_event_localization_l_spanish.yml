#UNITE THE GEORGIAN THRONES
 unite_the_georgian_thrones_decision: "Unir los Tronos Georgianos"
 unite_the_georgian_thrones_decision_desc: "En 1259 los mongoles establecieron deliberadamente dos reyes de Georgia, siendo nominalmente superior el rey de Kartli-Kakheti, pero en realidad ambos eran iguales. Con esto la unidad georgiana se hizo añicos hasta Jorge V el Brillante, aunque la destrucción causada por Timur destruyó de nuevo el Reino unificado. Si alguno de los dos Reinos consigue conquistar al otro es posible que una Georgia unificada vuelva a alzarse."
 unite_the_georgian_thrones_decision_confirm: "Unir los Tronos"
 unite_the_georgian_thrones_decision_tooltip: "Los tronos georgianos se unirán una vez más"
 unite_the_georgian_thrones_decision_titles_tt: "Cada [title|E] [kingdom|E] georgiano que poseas (excepto tu [primary_title|E]) será destruido y sus territorios se convertirán en [de_jure|E] de tu título primario ([THIS.Char.GetPrimaryTitle.GetNameNoTier])"
 unite_the_georgian_thrones_decision_primary: "Tu [primary_title|E] es un [kingdom|E] ibérico"

 unite_the_georgian_thrones_decision_effects_de_jure_tt: "[title_d_imeretia.GetNameNoTier], [title_d_georgia.GetNameNoTier], [title_d_abkhazia.GetNameNoTier], [title_d_racha.GetNameNoTier], [title_d_mingrelia. GetNameNoTier], [title_d_meshketi.GetNameNoTier], [title_d_kartli.GetNameNoTier], [title_d_kakheti.GetNameNoTier], y [title_d_hereti.GetNameNoTier] pasan a formar parte [de_jure|E] del #V [title_k_georgia.GetName]# ."

 mb_events.0001.t: "Una Georgia Unida"
 mb_events.0001.desc: "Una vez más, los tronos de Georgia se han unido bajo un [ROOT.Char.GetTitleAsNameNoTooltip]. Los falsos monarcas han sido destronados, mientras que el orgulloso [ROOT.Char.GetPrimaryTitle.GetNameNoTier] se mantiene más fuerte que nunca."
 mb_events.0001.a: "Este es el amanecer de una nueva era."
 
 # Proto-Rus Tribes -> Rus
 global_culture.5001.t: "$global_culture.5000.t$"
 global_culture.5001.desc: "Estamos lejos de las tierras que nuestros antepasados nórdicos llamaban hogar, pero es la tierra de los Garðar la que consideramos nuestro país. Como líder de mi pueblo, es mi responsabilidad asegurar la prosperidad futura y si queremos prosperar, debemos adaptarnos a nuestro nuevo entorno. Debemos aprender de las personas cuyos antepasados hicieron uso de estas fértiles tierras.\n\nCon este decreto, cambiaremos nuestra forma de vida en beneficio de nuestros parientes. Forjaremos un nuevo camino como nuestro propio pueblo."
 global_culture.5001.a: "¡Desde hoy, nos llamamos Rus!"
 global_culture.5001.b: "No debemos dar la espalda a nuestras antiguas tribus."
 
 global_culture.5002.t: "$global_culture.5001.t$"
 global_culture.5002.desc: "Un grupo de colonos nórdicos procedentes de Escandinavia se ha asentado en las vastas tierras de Europa oriental, creando un nuevo hogar.\n\nSu líder, [russian_founder.GetTitledFirstName], ha decretado que [russian_founder.GetHerHis] gente debe adoptar varias costumbres y tradiciones locales para asegurarse de que prosperarán en esta nueva tierra."
 global_culture.5002.a: "¿Qué significa esto para la región?"
 
 # Rus -> Novgorodian
 global_culture.5004.t: "Auge de Novgorod"
 global_culture.5004.desc: "Gracias a la unificación política de la región, la clase dirigente comenzó a hablar una serie de dialectos estrechamente relacionados, pero la región de Novgorod pasó a hablar una lengua diferente a la Rus de Kiev, al sur."
 global_culture.5004.a: "¡Somos novgorodianos, ahora y siempre!"
 global_culture.5004.b: "No debemos dar la espalda a la Rus de Kiev."
 
 global_culture.5005.t: "$global_culture.5004.t$"
 global_culture.5005.desc: "Aunque comparten orígenes comunes con la Rus' de Kyiván, la región de Nóvgorod se separó de las tierras del sur y llegó a tener su propia cultura y lengua."
 global_culture.5005.a: "¿Serán capaces de prosperar por sí mismos?"
 
 # Russian Merge
 global_culture.5000.t: "Auge de la Rus de Kyivan"
 global_culture.5000.desc: "Las tierras de los Garðar han proporcionado a nuestro pueblo un terreno exuberante y fértil para asentarse y expandirse.\n\nAl adoptar algunas de las tradiciones de los lugareños, podremos aclimatarnos mejor a la región."
 global_culture.5000.a: "¡Por los nuevos amigos y los nuevos comienzos!"
 
 
 
 
 
 global_culture.5003.t: "Propagación de la cultura [russian.GetNameNoTooltip]"
 global_culture.5003.desc: "El auge de la Rus de Kyiván ha provocado un cambio cultural en el este de Europa.\n\n¡Ahora está claro que los habitantes de [county_to_change.GetName] ya no se ven a sí mismos como [old_culture.GetName], sino como nativos de [russian.GetCollectiveNoun]!"
 global_culture.5003.a: "Un desarrollo interesante..."
 
 global_culture.5010.a: "¡Maravilloso!"
 
 # Establish Russian Culture
 establish_russian_culture_decision: "Establecer la cultura de Rus"
 establish_russian_culture_decision_desc: "Nuestras viejas tradiciones no nos sirven en nuestro nuevo hogar. Deberíamos mirar a los lugareños y ver qué podemos aprender de ellos."
 establish_russian_culture_decision_confirm: "¡La Rus de Kyivan se levanta!"
 establish_russian_culture_decision_tooltip: "Fusionar nuestra cultura nórdica y la de la tribu Rus local"
 establish_russian_culture_decision_effect.tt: "Muchos [old_culture_1.GetName] y otros condados y personajes eslavos del este dentro de Kyivan Rus' se convierten en [new_culture.GetName]"
 establish_russian_culture_decision_effect.tt.2: "[normandy_title.GetName] pasa a llamarse $d_normandy$"

 # Frankish -> French
 global_culture.5007.t: "Los franceses"
 global_culture.5007.desc: "Aunque compartimos orígenes comunes con los demás pueblos germánicos, nuestra gente que vive aquí, en las tierras de Francia, ha empezado a divergir cultural y lingüísticamente al mezclarse con los pueblos nativos de esta tierra.\n\nMuchos de nuestros pueblos claman ahora por una identidad cultural única que podamos llamar nuestra. Algo de lo que podamos estar orgullosos de ser..."
 global_culture.5007.a: "¡Somos franceses, ahora y siempre!"
 global_culture.5007.b: "No debemos dar la espalda a nuestro pasado."
 
 global_culture.5008.t: "$global_culture.5007.t$"
 global_culture.5008.desc: "Aunque comparten orígenes comunes con los demás pueblos germánicos, los francos de las tierras de Francia se han adaptado a la vida en su nueva tierra.\n\nDivergiendo cultural y lingüísticamente de sus antiguos compatriotas, estos [french.GetName] han abrazado con entusiasmo su nueva identidad cultural."
 global_culture.5008.a: "¿Serán capaces de prosperar por sí mismos?"

   
 unite_angles_decision: "Unir a los Anglosajones"
 unite_angles_decision_tooltip: "Unir a los pueblos de Ængland en una sola cultura"
 unite_angles_decision_desc: "Inglaterra nunca ha estado verdaderamente unida, pero todos compartimos una herencia y una lengua comunes. Sean cuales sean las diferencias, las superaremos y forjaremos una identidad común entre todos los Anglecynn."
 unite_angles.preview.tt: "Los diversos pueblos germánicos occidentales de las Islas Británicas se unirán y se convertirán en anglosajones."
 unite_angles_confirm: "¡Por una próspera Ængland!"
 
 mamluk_events.0001.t: "De la pobreza a la riqueza"
 mamluk_events.0001.desc: "Los mamelucos fuimos traídos aquí desde nuestros hogares como guerreros esclavos, pero ahora hemos llegado a controlar las tierras de nuestros amos"
 mamluk_events.0001.a: "Que Alá nos guíe"
 rags_to_riches: "De la pobreza a la riqueza"
 
 n_polan_c_noun: "Polaco"
 
 reclaim_britannia_custom_decision1: "Todo su [powerful_vassals|E] tiene un [culture|E] con un Brythonic o Goidelic [heritage|E]"
 
 
 form_the_kingdom_of_aragon_decision.tt.drift.d_zaragoza: "Si [completely_control|E] [d_zaragoza.GetDefinitiveName], se [de_jure_drift_drifted|E] en [k_aragon.GetDefinitiveName]."
 form_the_kingdom_of_aragon_decision.tt.drift.d_teruel: "Si [completely_control|E] [d_teruel.GetDefinitiveName], será [de_jure_drift_drifted|E] en [k_aragon.GetDefinitiveName]."
 form_the_kingdom_of_aragon_decision.tt.drift.d_catalunya_nova: "Si [completely_control|E] [d_catalunya_nova.GetDefinitiveName], será [de_jure_drift_drifted|E] en [k_aragon.GetDefinitiveName]."
 form_the_kingdom_of_aragon_decision.tt.drift.d_urgell: "Si [completely_control|E] [d_urgell.GetDefinitiveName], será [de_jure_drift_drifted|E] en [k_aragon.GetDefinitiveName]."
 
 #Unify Saxons
 
 unify_saxons_decision: "Unificar la Heptarquía"
 unify_saxons_decision_tooltip: "Unir los siete reinos en uno"
 unify_saxons_decision_desc: "Las tierras de los siete reinos están ahora unificadas bajo el gobierno de un único monarca. Es hora de proclamar un nuevo Reino singular para gobernar la tierra."
   
 #Restore Byzatnine Empire
 custom_nb_restore_byzantine_decision_desc: "Como el legítimo heredero del imperio, debemos restaurar el Imperio Romano Oriental y recuperar la gloria de los romanos."    
 custom_nb_restore_byzantine_decision_tooltip: "Reconstruir el Imperio Romano Oriental que había colapsado."
 custom_nb_restore_byzantine_decision_effect_tooltip: "Reconstruir el Imperio Romano Oriental que había colapsado."
 custom_nb_restore_byzantine_decision_confirm: "¡Es hora de reconstruir el Imperio, compañeros romanos!" 
 custom_nb_restore_byzantine_decision.0001.l: "El verdadero Imperio Romano perdurará para siempre."
 custom_nb_restore_byzantine_decision.0001.l.tt: "El verdadero Imperio Romano perdurará para siempre."     
 
 
 custom_nb_byzantine_decision_opinions_vassals: "Todos los vasallos del imperio restaurado"    
 custom_nb_byzantine_decision_opinions: "Verdadero Emperador Romano"    


