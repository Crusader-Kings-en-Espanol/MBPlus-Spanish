 unite_the_illyrians_decision: "Abrazar la herencia iliria"
 unite_the_illyrians_decision_tooltip: "Unir a los [south_slavs|E] de Iliria en una sola cultura"
 unite_the_illyrians_decision_desc: "A medida que pasa el tiempo, las muchas tribus dispares de Iliria se acostumbran cada vez más las unas a las otras, especialmente frente a los imperios extranjeros que buscan subyugarlas en cuanto surge la oportunidad.\n\nCon los incentivos adecuados, podemos fomentar este sentimiento y unir de verdad a nuestro pueblo no sólo políticamente, sino también culturalmente."
 unite_the_illyrians.preview.tt: "Los eslavos del sur de Iliria se unirán en una sola cultura."
