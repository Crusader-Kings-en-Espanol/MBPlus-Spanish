 nonaggressionpact.001.opening: "[actor.Custom2('AppropriateGreeting', recipient )]"
 nonaggressionpact.001.desc: "Le pido que cumpla nuestro acuerdo pendiente y firme este Pacto de No Agresión..."
 nonaggressionpact.001.a: "Parece que tengo pocas opciones..."

 nonaggressionpact.002.opening: "[recipient.Custom2('AppropriateGreetingPositive', actor )]"
 nonaggressionpact.002.desc: "Me siento honrado por su petición, y estaría encantado de firmar un Pacto de No Agresión "
 nonaggressionpact.002.tooltip: "[recipient.GetTitledFirstNameNoTooltip] entró en [truce|E] contigo a través de un Pacto de No Agresión"
 nonaggressionpact.002.a: "¡Grandes noticias, amigo!"

 nonaggressionpact.003.opening: "[recipient.Custom2('AppropriateGreeting', actor )]"
 nonaggressionpact.003.desc: "Tras pensarlo mucho, me temo que he llegado a la conclusión de que debo rechazar tu oferta."
 nonaggressionpact.003.a: "Preocupante..."

 sea_gov_event.0002.opening: "[sender.Custom2('AppropriateGreetingNegative', ROOT.Char )]"
 sea_gov_event.0002.desc: "El anterior gobernante no era apto para gobernar, y no hay razón para pensar que tú serás mejor. Ya no serviré como tu vasallo."
 sea_gov_event.0002.a: "Lamentarás esta traición."
 sea_gov_event.0002.b: "Muy bien. Puedes irte con mi bendición."
 sea_gov_event.0002.c: "¡Espera! Quédate y te juro que valdrá la pena."

 asdac_roman_restoration.1001.t: "Bizancio restaurado"
 asdac_roman_restoration.1001.desc: "Una vez más, los grandes estandartes bizantinos de Constantinopla se han alzado. [scoped_emperor.GetTitledFirstName] ha restaurado las antiguas tierras de la corona de Bizancio, y el imperio griego se levanta de las cenizas de la derrota, para conquistar a sus antiguos enemigos tanto en el este como en el oeste.\n\nEl Imperio Romano de Oriente sufrió una derrota tras otra, cayendo finalmente ante la multitud de estados hostiles en sus fronteras. Pero, al igual que la Roma de antaño, sus enemigos no pudieron impedir que creciera en poder y volviera a ser un actor relevante.\n\nEl Imperio Bizantino es uno e indivisible, ¡salve [scoped_emperor.GetTitledFirstName] del Imperio Bizantino!"
 asdac_roman_restoration.1001.a: "Todo nuevo comienzo viene del final de otro comienzo."
 
 asdac_east_europe.9101.t: "Carantania restaurada"
 asdac_east_europe.9101.desc: "Con mi gobierno extendiéndose por las zonas centrales del antiguo Principado de Carantania, he declarado que el principado ha renacido y que yo soy su príncipe.\n\nDurante demasiado tiempo los eslovenos hemos sido gobernados por los alemanes; ahora, podemos tomar nuestro destino en nuestras manos."
 asdac_east_europe.9101.a: "¡Mi legado será recordado durante siglos!"
 asdac_east_europe.9101.b: "[restaurador.GetFaith.HighGodName] nos bendice!"
 asdac_east_europe.9101.c: "¡Sinceramente, mientras sea [restorer.GetTitleAsNameNoTooltip] de #EMP en alguna parte!..."
 asdac_east_europe.9102.t: "$asdac_east_europe.9101.t$"
 asdac_east_europe.9102.desc: "TEXTO"
 asdac_east_europe.9102.a: "Un patético advenedizo, en el mejor de los casos."
 asdac_east_europe.9102.b: "¡Salve [restorer.GetShortUINameNoTooltip]!"
 asdac_east_europe.9102.c: "Veremos cuánto dura esto..."
 
 LT.0003.t: "El traidor de Lorena"
 LT.0003.desc: "El traidor duque Giselberto de Lorena dejó nuestro servicio tras la muerte de nuestro estimado padre el rey Enrique. Ahora ha recurrido a la protección de los Karlings en Francia Occidental, pidiéndoles ayuda contra nosotros.\n\nNo sólo han abandonado su antiguo servicio a nuestro gobierno, sino que nuestros espías nos dicen que Giselbert ha estado conspirando con señores traidores del reino. El insulto es demasiado para soportar en este momento, y ya es hora de que recuperemos lo que es legítimamente nuestro."
 LT.0003.a: "Lorena no debe estar en manos de los Carolingios ni de sus vasallos."
 LT.0003.b: "Cumpliremos nuestra parte del pacto."
 LT.0003.b.tt: "Giselbert y Lorena serán dejados en paz."
 LT.0004.t: "Ataque de los alemanes"
 LT.0004.desc: "Los informes de nuestros exploradores en el este confirman nuestras sospechas, Otto está preparando un ataque a nuestras tierras. Durante mucho tiempo el rey de los germanos ha buscado una razón justificada para tratar de forzar a Lorena de nuevo bajo su soberanía, pero ahora parece que ha tirado la cautela al viento.\NEs hora de reunir a nuestros hombres y protegernos. Lorena es nuestra, y nos aseguraremos de que los alemanes paguen caro cada paso que den en ella."
 LT.0004.a: "No pasarán a nuestras tierras sin oposición."
 LT.0012.t: "El Reino de Italia"
 LT.0012.desc: "Bajo el horrendo liderazgo de [italian_king.GetTitledFirstName], Italia se ha convertido en una sombra de lo que fue. El gran legado de los romanos y sus descendientes ha sido destrozado por las guerras civiles y el caos de las últimas décadas.\n\nAhora muchos de los señores menores italianos bajo su liderazgo nos han enviado emisarios pidiendo ayuda. Supuestamente echan de menos los días en que estaban bajo nuestro lejano dominio. Si queremos volver a enarbolar los estandartes de Carlomagno, el Reino de Italia será esencial para asegurar nuestro reconocimiento como verdaderos descendientes de su imperio."
 LT.0012.a: "Preparad a nuestros hombres, Italia estará asegurada para el bien de todos."
 LT.0012.b: "No tenemos ningún interés en esta región, dejadles con sus mezquinas luchas internas."
 LT.0013.t: "Invasión de Otto"
 LT.0013.desc: "El rey de los germanos de nuestro norte, Otto, nos ha declarado la guerra. Afirma a voz en grito que es por el bien del pueblo italiano, y pretende que está liberando a Italia del dominio de [italian_king.GetTitledFirstName].\n\nLos alemanes se preparan para atravesar los Alpes, y poner fin al caos que ha envuelto a Italia de una vez por todas. ¿Quién se opondrá a ellos y los tratará como invasores, y quién los abrazará como viejos vecinos y amigos?"
 LT.0013.a: "¡Que vengan!"
 LT.0013.b: "Interesante..."
 
 
 # Rus' Split
 global_culture.8002.t: "El destino de la Rus'"
 global_culture.8002.desc: "La tierra de la Rus' ha cambiado a lo largo de los siglos. Aunque la identidad común de la Rus' no se ha desvanecido por completo de la memoria, no se puede negar que el pueblo de la Rus' se ha dividido en [great_russian.GetCollectiveNoun], [ukrainian.GetCollectiveNoun] y [belarusian.GetCollectiveNoun]."
 global_culture.8002.a: "$global_culture.0002.a$" #placeholder
 global_culture.8002.b: "$global_culture.0002.b$" #placeholder

 global_culture.8005.t: "$global_culture.8002.t$"
 global_culture.8005.desc: "$global_culture.8002.desc$" #placeholder
 global_culture.8005.a: "$global_culture.3005.a$" #placeholder
 global_culture.8005.desc_russian: "$global_culture.8002.desc$" #placeholder
 global_culture.8005.b: "$global_culture.0015.b$" #placeholder

 middle_europe_decisions.0001.desc: "Durante mucho tiempo, las ciudades de los Alpes centrales se han visto amenazadas por otros actores del Imperio. Unidas bajo una sola bandera, ahora han forjado alianzas mutuamente beneficiosas y han recibido el honor de la inmediatez imperial.\n\nEn honor a las contribuciones de mi dinastía a las ciudades-estado suizas, he sido elegido como jefe de esta unión, el que será el mascarón de proa de todos los cantones de nuestra nueva Confederación Suiza. Ya no seremos amenazados por extraños, sino que nos alzaremos como un fuerte actor independiente en el Imperio."
 middle_europe_decisions.0002.desc.emperor: "Después de años de luchas e incómodos acuerdos diplomáticos, me he visto obligado a conceder a los cantones suizos la inmediatez imperial.\n\nEste conjunto de ciudades alpinas se ha unido en una gran Confederación para protegerse de las depredaciones de los borgoñones y los señores alemanes. Debo tener cuidado de mantenerlos a raya, no vaya a ser que sus logros siembren la disensión entre los burgueses vecinos."
 middle_europe_decisions.0002.desc.vassals: "Una nueva entidad conocida como la Confederación Suiza se ha levantado en el Imperio. Son un conglomerado de ciudades con inmediatez imperial asentadas alrededor de los Alpes centrales, y han entrado en una alianza defensiva para protegerse de los otros electores que les rodean.\n\nUna fuerza independiente con la que hay que contar, se han liberado de cualquier reclamación anterior sobre sus tierras, ya sea de los antiguos borgoñones al oeste o de los señores alemanes al norte.\n\nDebería tener cuidado con esta nueva amenaza potencial en el Imperio."
 
 adopt_chinese_government_decision: "Adoptar un gobierno $chinese_government$"
 adopt_chinese_government_decision_desc: "Aunque gobierno sobre territorio en $e_celestia_china$ como rey, mi estilo de gobernar sigue siendo ajeno a China, lo que provoca cierta resistencia por parte de los nobles locales. Quizá reformando el estado y adoptando una forma de gobierno más acorde con las creencias locales, podría hacer más estable mi control del poder en la región."
 adopt_chinese_government_decision_tooltip: "Cambiar el tipo de [gobierno|E] adoptando un gobierno [chino|E]."
 adopt_chinese_government_decision_confirm: "Adopta la burocracia confuciana"
 
 
