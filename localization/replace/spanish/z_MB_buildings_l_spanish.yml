 # Hindu Temples
 building_type_multan_sun_temple_01: "Ruinas del Templo del Sol de Multan"
 building_type_multan_sun_temple_01_desc: "El Templo del Sol de Multan, una vez un próspero centro para el culto al Dios Surya, ha caído en ruinas. La estatua del Dios ha sido destruida y se dejó una pálida réplica en su lugar. Un astuto $rf_eastern$ gobernante podría incluso obtener beneficios de los peregrinos, además de ganar algunos conocimientos personales si alguien decide restaurarlo."
 building_type_multan_sun_temple_02: "Templo del Sol de Multan"
 building_type_multan_sun_temple_02_desc: "El antiguo templo dedicado al Dios Surya ha sido restaurado. La estatua dorada del Espléndido Sol ha sido restaurada nuevamente en el templo. El templo está nuevamente decorado con oro, plata y gemas desde sus puertas y pilares hasta el Shikhara. Los peregrinos y viajeros vienen de cerca para rendir homenaje a Surya y a otras figuras veneradas dentro del templo."
 building_multan_sun_temple_01: "$building_type_multan_sun_temple_01$"
 building_multan_sun_temple_01_desc: "$building_type_multan_sun_temple_01_desc$"
 building_multan_sun_temple_02: "$building_type_multan_sun_temple_02$"
 building_multan_sun_temple_02_desc: "$building_type_multan_sun_temple_02_desc$"
 multan_sun_temple_rebuilt_trigger: "El [holder|E] debe ser de la $rf_eastern$ [religious_family|E]"
 multan_sun_temple_ruins_trigger: "El [holder|E] debe ser de la $rf_eastern$ [religious_family|E]"
 building_type_ellora_caves_01: "Cuevas de Ellora"
 building_type_ellora_caves_01_desc: "Es uno de los complejos de monasterios y templos tallados en roca más grandes del mundo, con monumentos y obras de arte hindúes, budistas y jainistas. Aunque las cuevas sirven como monasterios, templos y un lugar de descanso para los peregrinos, la ubicación del sitio en una antigua ruta comercial también lo convirtió en un importante centro comercial en la región del Decán."
 building_ellora_caves_01: "$building_type_ellora_caves_01$"
 building_ellora_caves_01_desc: "$building_type_ellora_caves_01_desc$"
 building_type_ajanta_caves_01: "Cuevas de Ajanta"
 building_type_ajanta_caves_01_desc: "Las Cuevas de Ajanta son aproximadamente 30 monumentos budistas tallados en roca. Las Cuevas de Ajanta constituyen antiguos monasterios y salas de culto de diferentes tradiciones budistas talladas en una pared de roca de 75 metros (246 pies). Las cuevas también presentan pinturas que representan las vidas pasadas y renacimientos del Buda, cuentos pictóricos de la Jatakamala de Aryasura y esculturas talladas en roca de deidades budistas."
 building_ajanta_caves_01: "$building_type_ajanta_caves_01$"
 building_ajanta_caves_01_desc: "$building_type_ajanta_caves_01_desc$"
 building_type_pattadakal_01: "Pattadakal"
 building_type_pattadakal_01_desc: "Pattadakal es un complejo de templos hindúes y jainistas del siglo VII y VIII d.C. Los templos hindúes están generalmente dedicados a Shiva, pero también se presentan elementos de la teología y leyendas del Vaishnavismo y Shaktismo. Los frisos en los templos hindúes muestran varios conceptos védicos y puránicos, representan historias del Ramayana, el Mahabharata, el Bhagavata Purana, así como elementos de otros textos hindúes, como el Panchatantra y el Kirātārjunīya."
 building_pattadakal_01: "$building_type_pattadakal_01$"
 building_pattadakal_01_desc: "$building_type_pattadakal_01_desc$"
 building_type_elephanta_caves_01: "Cuevas de Elephanta"
 building_type_elephanta_caves_01_desc: "Las Cuevas de Elephanta son una colección de templos en cuevas predominantemente dedicados al dios hindú Shiva. Están en la Isla Elephanta, o Gharapuri (literalmente 'la ciudad de las cuevas'). Las Cuevas de Elephanta contienen esculturas talladas en roca que muestran el sincretismo de ideas e iconografía hindúes y budistas."
 building_elephanta_caves_01: "$building_type_elephanta_caves_01$"
 building_elephanta_caves_01_desc: "$building_type_elephanta_caves_01_desc$"
 building_type_katas_raj_temples_01: "Templos de Katas Raj"
 building_type_katas_raj_temples_01_desc: "Los Templos de Katas Raj son un complejo de varios templos hindúes conectados entre sí por pasarelas. El complejo de templos rodea un estanque llamado Katas, que es considerado sagrado por los hindúes. Se dice en los Puranas que el estanque de los templos fue creado a partir de las lágrimas de Shiva, después de que vagara por la Tierra inconsolable tras la muerte de su esposa Sati. Los templos desempeñan un papel en el poema épico hindú, el Mahābhārata, donde tradicionalmente se cree que los templos fueron el sitio donde los hermanos Pandava pasaron una parte significativa de su exilio."
 building_katas_raj_temples_01: "$building_type_katas_raj_temples_01$"
 building_katas_raj_temples_01_desc: "$building_type_katas_raj_temples_01_desc$"
 building_type_konark_sun_temple_01: "Templo del Sol de Konark"
 building_type_konark_sun_temple_01_desc: "El Templo del Sol de Konark está dedicado al Dios del Sol hindú Surya. El templo es conocido por su impresionante arquitectura Kalinga que incluye una representación de un carro de 100 pies de altura tirado por caballos y ruedas talladas de una sola piedra. El monumento retrata el imponente carro del dios del sol."
 building_konark_sun_temple_01: "$building_type_konark_sun_temple_01$"
 building_konark_sun_temple_01_desc: "$building_type_konark_sun_temple_01_desc$"
 building_type_ramanathaswamy_temple_01: "Templo de Ramanathaswamy"
 building_type_ramanathaswamy_temple_01_desc: "El Templo de Ramanathaswamy es un templo dedicado a Shiva. También es uno de los doce templos Jyotirlinga ubicados en la isla de Rameswaram. Se dice que el Lingam en el templo fue construido por Devi Sita con arena de la playa."
 building_ramanathaswamy_temple_01: "$building_type_ramanathaswamy_temple_01$"
 building_ramanathaswamy_temple_01_desc: "$building_type_ramanathaswamy_temple_01_desc$"
 building_type_madurai_temple_01: "Madurai"
 building_type_madurai_temple_01_desc: "La ciudad de Madurai tiene varios templos religiosos, siendo el más importante el Templo de Meenakshi, dedicado a Parvati y Shiva en sus formas de Meenakshi y Sundareshwar.\n\nNo muy lejos de Madurai se encuentra el Templo de Subramaniya Swamy, donde Lord Murugan mató al demonio Surapadman y se casó con Deivayani, la hija de Indra."
 building_madurai_temple_01: "$building_type_madurai_temple_01$"
 building_madurai_temple_01_desc: "$building_type_madurai_temple_01_desc$"
 building_type_arulmigu_solaimalai_temple_01: "Templo Arulmigu Solaimalai"
 building_type_arulmigu_solaimalai_temple_01_desc: "El Templo Arulmigu Solaimalai, ubicado en Pazhamudircholai, es uno de los Abodes de Murugan. Es aquí donde el gran santo y poeta tamil Avvaiyar fue probado por Lord Murugan."
 building_arulmigu_solaimalai_temple_01: "$building_type_arulmigu_solaimalai_temple_01$"
 building_arulmigu_solaimalai_temple_01_desc: "$building_type_arulmigu_solaimalai_temple_01_desc$"
 building_type_subramaniya_swamy_temple_01: "Templo Subramaniya Swamy"
 building_type_subramaniya_swamy_temple_01_desc: "El Templo Subramaniya Swamy es uno de los Abodes de Murugan. Se dice que Lord Murugan derrotó al demonio Srisandhinagaram e inspiró a los arquitectos a expandir la ciudad de Tiruchendil."
 building_subramaniya_swamy_temple_01: "$building_type_subramaniya_swamy_temple_01$"
 building_subramaniya_swamy_temple_01_desc: "$building_type_subramaniya_swamy_temple_01_desc$"
 building_type_dhandayuthapani_temple_01: "Templo Dhandayuthapani"
 building_type_dhandayuthapani_temple_01_desc: "El Templo Dhandayuthapani está dedicado al dios sol hindú Murugan. El templo es una de las moradas de Murugan. Se dice que el Gran Sabio Bogar creó la estatua del Señor Murugan a partir de una amalgama de nueve rocas. El templo actual fue renovado por Perumal, uno de los reyes Chera, a principios del siglo V. La entrada al templo tiene una placa conmemorativa de esta renovación."
 building_dhandayuthapani_temple_01: "$building_type_dhandayuthapani_temple_01$"
 building_dhandayuthapani_temple_01_desc: "$building_type_dhandayuthapani_temple_01_desc$"
 building_type_kailasanathar_temple_01: "Templo Kailasanathar"
 building_type_kailasanathar_temple_01_desc: "El Templo Kailasanathar es uno de los templos más antiguos de Kanchipuram. El templo está dedicado al Señor Shiva y construido en estilo dravídico. El rey Narasimhavarman II de la dinastía Pallava es quien ordenó la construcción del templo. Se dice que dentro del templo hay rutas secretas para que los reyes escapen si alguna vez amenaza el peligro a la ciudad."
 building_kailasanathar_temple_01: "$building_type_kailasanathar_temple_01$"
 building_kailasanathar_temple_01_desc: "$building_type_kailasanathar_temple_01_desc$"
 building_type_venkateswara_temple_01: "Templo Venkateswara"
 building_type_venkateswara_temple_01_desc: "El Templo Venkateswara está dedicado a Venkateswara, una de las formas del Señor Vishnu que salvará a la humanidad durante el Kali Yuga. Está construido con arquitectura dravídica. Este templo atrae a numerosos peregrinos de todo el mundo que hacen donaciones."
 building_venkateswara_temple_01: "$building_type_venkateswara_temple_01$"
 building_venkateswara_temple_01_desc: "$building_type_venkateswara_temple_01_desc$"
 building_type_alampur_jogulamba_temple_01: "Templo Alampur Jogulamba"
 building_type_alampur_jogulamba_temple_01_desc: "El templo es uno de los Maha Shakti Peethas, un grupo de dieciocho (Ashtadasa) templos considerados los santuarios y destinos de peregrinación más significativos en el Shaktismo. El templo fue construido en el estilo de arquitectura dravídica."
 building_alampur_jogulamba_temple_01: "$building_type_alampur_jogulamba_temple_01$"
 building_alampur_jogulamba_temple_01_desc: "$building_type_alampur_jogulamba_temple_01_desc$"
 building_type_mallikarjuna_temple_01: "Templo Mallikarjuna"
 building_type_mallikarjuna_temple_01_desc: "El Templo Mallikarjuna es uno de los 12 Jyotirlingas así como un lugar sagrado para Shakti. Tanto el Señor Shiva como Maa Parvati son adorados en el templo."
 building_mallikarjuna_temple_01: "$building_type_mallikarjuna_temple_01$"
 building_mallikarjuna_temple_01_desc: "$building_type_mallikarjuna_temple_01_desc$"
 building_type_mahalakshmi_temple_01: "Templo Mahalakshmi"
 building_type_mahalakshmi_temple_01_desc: "El Templo Mahalakshmi es uno de los sagrados Shakti Peeth, sagrado para la diosa Shakti en su forma como Lakshmi. El templo fue construido en el siglo VII por el imperio Chalukya en el estilo del Imperio Chalukya."
 building_mahalakshmi_temple_01: "$building_type_mahalakshmi_temple_01$"
 building_mahalakshmi_temple_01_desc: "$building_type_mahalakshmi_temple_01_desc$"
 building_type_vithoba_temple_01: "Templo Vithoba"
 building_type_vithoba_temple_01_desc: "El Templo Vithoba está dedicado a Vithoba, considerado uno de los Avatares del Señor Vishnu. El estilo del templo está construido en el estilo de la arquitectura Hoysala. Se dice que bañarse en el cercano río sagrado Chandrabhaga lavará los pecados de uno y conducirá a una vida virtuosa."
 building_vithoba_temple_01: "$building_type_vithoba_temple_01$"
 building_vithoba_temple_01_desc: "$building_type_vithoba_temple_01_desc$"
 building_type_mayureshwar_temple_01: "Templo Mayureshwar"
 building_type_mayureshwar_temple_01_desc: "El Templo Mayureshwar en Morgon es uno de los sitios más sagrados para la secta Ganapatya del hinduismo. El templo está asociado con el santo Moraya Gosavi. Se considera el punto de inicio y final de la ruta de peregrinación Ashtavinayaka."
 building_mayureshwar_temple_01: "$building_type_mayureshwar_temple_01$"
 building_mayureshwar_temple_01_desc: "$building_type_mayureshwar_temple_01_desc$"
 building_type_ujjayini_temple_city_01: "Templo Mahakaleshwar"
 building_type_ujjayini_temple_city_01_desc: "El Mahakaleshwar no solo es uno de los Jyotirlingas dedicados al Señor Shiva, sino una de las siete ciudades sagradas que atraen numerosos peregrinos."
 building_ujjayini_temple_city_01: "$building_type_ujjayini_temple_city_01$"
 building_ujjayini_temple_city_01_desc: "$building_type_ujjayini_temple_city_01_desc$"
 building_type_krishna_janmasthan_temple_01: "Templo Krishna Janmasthan"
 building_type_krishna_janmasthan_temple_01_desc: "El Krishna Janmasthan está dedicado a Krishna. Se dice que el templo es donde nació Krishna, y ha sido un sitio religioso desde el siglo VI a.C."
 building_krishna_janmasthan_temple_01: "$building_type_krishna_janmasthan_temple_01$"
 building_krishna_janmasthan_temple_01_desc: "$building_type_krishna_janmasthan_temple_01_desc$"
 building_type_har_ki_pauri_temple_01: "Templo Har Ki Pauri"
 building_type_har_ki_pauri_temple_01_desc: "El Templo Har Ki Pauri es uno de los famosos Ghats a lo largo de las orillas del Ganges en la ciudad de Haridwar. Se dice que el Señor Vishnu visitó Har Ki Pauri en el pasado antiguo. El ghat fue construido por el rey Vikramaditya en el siglo I a.C., en memoria de su hermano, Bharthari, quien vino a meditar aquí."
 building_har_ki_pauri_temple_01: "$building_type_har_ki_pauri_temple_01$"
 building_har_ki_pauri_temple_01_desc: "$building_type_har_ki_pauri_temple_01_desc$"
 building_type_badrinath_temple_01: "Templo Badrinath"
 building_type_badrinath_temple_01_desc: "El templo está dedicado al Señor Vishnu en su forma como Badrinarayan. El Templo Badrinath fue establecido como un templo por el Gran Sabio Adi Shankara en el siglo VII. Se dice que Adi Shankara es la razón por la cual Badrinath, un templo en el extremo norte de la India, está dirigido por bráhmanas de Kerala, ya que Adi Shankara era del sur de la India."
 building_badrinath_temple_01: "$building_type_badrinath_temple_01$"
 building_badrinath_temple_01_desc: "$building_type_badrinath_temple_01_desc$"
 building_type_kedarnath_temple_01: "Templo Kedarnath"
 building_type_kedarnath_temple_01_desc: "El Templo Kedarnath es un antiguo templo en los Himalayas que se dice que fue construido por los hermanos Pandava. El templo también es uno de los Jyotilingas, uno de los sitios sagrados dedicados al Señor Shiva. El templo es antiguo y se dice que los sacerdotes que se ocupan de él fueron concedidos este privilegio por el rey Janamejaya, quien desde entonces ha atendido el templo y a los muchos peregrinos que vienen a la zona."
 building_kedarnath_temple_01: "$building_type_kedarnath_temple_01$"
 building_kedarnath_temple_01_desc: "$building_type_kedarnath_temple_01_desc$"
 building_type_varanasi_temples_01: "varanasi"
 building_type_varanasi_temples_01_desc: "Varanasi es una ciudad sagrada en las orillas del Ganges. Numerosos ghats, stupas, pagodas, mandirs y templos de todo tipo salpican la ciudad sagrada. Se dice que la ciudad fue construida por Shiva y los hermanos Pandava visitaron la ciudad. Aquí es donde el Buda dio su primer sermón en la cercana ciudad de Sarnath. El lugar también es el lugar de nacimiento de Suparshvanatha, el séptimo Tirthankara, y Parshvanatha, el 23º Tirthankara. Debido a esta historia religiosa, la ciudad atrae a innumerables peregrinos a la tierra para visitar y rendir homenaje."
 building_varanasi_temples_01: "$building_type_varanasi_temples_01$"
 building_varanasi_temples_01_desc: "$building_type_varanasi_temples_01_desc$"
 building_type_jagannath_temple_01: "Templo de Jagannath"
 building_type_jagannath_temple_01_desc: "El Templo de Jagannath es un templo sagrado dedicado a la encarnación de Lord Vishnu, Jagannath. Junto con Jagannath, las deidades Balarama y Subhadra también son adoradas en el templo. El templo está construido en el estilo de arquitectura Kalinga. El templo es sagrado para todos los hindúes, pero especialmente para los vaishnavas. Debido a esta sacralidad, el templo atrae a numerosos peregrinos y visitantes."
 building_jagannath_temple_01: "$building_type_jagannath_temple_01$"
 building_jagannath_temple_01_desc: "$building_type_jagannath_temple_01_desc$"
 building_type_kamakhya_temple_01: "Templo de Kamakhya"
 building_type_kamakhya_temple_01_desc: "El Templo de Kamakhya está dedicado a la Diosa Kamakhya, una encarnación de Kali y Tripura Sundari. Numerosas dinastías han patrocinado el templo. El templo está construido en el estilo de arquitectura Nilachal. El templo también se considera uno de los Shakti Peeth."
 building_kamakhya_temple_01: "$building_type_kamakhya_temple_01$"
 building_kamakhya_temple_01_desc: "$building_type_kamakhya_temple_01_desc$"
 building_type_dwarkadhish_temple_01: "Templo Dwarkadhish"
 building_type_dwarkadhish_temple_01_desc: "El Templo Dwarkadhish está dedicado a Lord Krishna y se dice que fue construido por su nieto, Vajranabha. Debido a esto, el templo es sagrado para hindúes de todas las denominaciones y atrae a numerosos visitantes al templo."
 building_dwarkadhish_temple_01: "$building_type_dwarkadhish_temple_01$"
 building_dwarkadhish_temple_01_desc: "$building_type_dwarkadhish_temple_01_desc$"
 building_type_somnath_temple_temple_01: "Templo Somnath"
 building_type_somnath_temple_temple_01_desc: "El templo Somnath es un templo dedicado a Shiva y es uno de los Jyortilingas. El templo ha sido reconstruido numerosas veces. En el siglo VIII, el templo fue destruido por el gobernador árabe de Sindh, Al-Junayd, cuando invadió. En el siglo IX, el rey Nagabhata II de la dinastía Pratihara reconstruyó el templo con arenisca roja como parte de la construcción."
 building_somnath_temple_temple_01: "$building_type_somnath_temple_temple_01$"
 building_somnath_temple_temple_01_desc: "$building_type_somnath_temple_temple_01_desc$"
 building_type_sharada_peeth_01: "Sharada Peeth"
 building_type_sharada_peeth_01_desc: "Sharada Peeth es un complejo de templos en Cachemira dedicado a la Diosa Saraswati. El templo está construido en el estilo de Cachemira. El complejo del templo también funciona como uno de los centros de aprendizaje más importantes de la región."
 building_sharada_peeth_01: "$building_type_sharada_peeth_01$"
 building_sharada_peeth_01_desc: "$building_type_sharada_peeth_01_desc$"
# Buddhist Temples
 building_type_sanchi_01: "Sanchi"
 building_type_sanchi_01_desc: "La estupa de Sanchi es un complejo budista, famoso por su gran estupa, en una cima de colina en la ciudad de Sanchi. La gran estupa de Sanchi es una de las estructuras de piedra más antiguas de la India. Fue encargada originalmente por el emperador Ashoka en el siglo III a.C. Su núcleo era una simple estructura hemisférica de ladrillos construida sobre las reliquias del Buda. Estaba coronada por el chhatri, una estructura similar a un parasol que simboliza alto rango, destinada a honrar y albergar las reliquias."
 building_sanchi_01: "$building_type_sanchi_01$"
 building_sanchi_01_desc: "$building_type_sanchi_01_desc$"
 sanchi_trigger: "El [holder|E] debe ser de fe budista."
 building_type_takht_i_bahi_01: "Ruinas de Takht-i-Bahi"
 building_type_takht_i_bahi_01_desc: "Takht-i-Bahi es un antiguo complejo de templos monásticos budistas. El sitio es considerado uno de los más imponentes relicarios del budismo en toda Gandhara. Desde el siglo VII, el complejo ha estado en ruinas. Sin embargo, un astuto gobernante $rf_eastern$ podría ser capaz de restaurar el complejo a su gloria una vez más."
 building_takht_i_bahi_01: "$building_type_takht_i_bahi_01$"
 building_takht_i_bahi_01_desc: "$building_type_takht_i_bahi_01_desc$"
 building_type_takht_i_bahi_02: "Takht-i-Bahi"
 building_type_takht_i_bahi_02_desc: "Después de siglos de negligencia, Takht-i-Bahi ha sido restaurado a su gloria. Reliquias y peregrinos vuelven a viajar a Takht-i-Bahi. Las estupas y monasterios vuelven a elevarse en las montañas."
 building_takht_i_bahi_02: "$building_type_takht_i_bahi_02$"
 building_takht_i_bahi_02_desc: "$building_type_takht_i_bahi_02_desc$"
 building_type_dambulla_cave_temple_01: "Templo de la Cueva de Dambulla"
 building_type_dambulla_cave_temple_01_desc: "Dambulla es el complejo de templos en cueva más grande y mejor conservado de Sri Lanka. La roca se eleva 160 m sobre las llanuras circundantes. Hay más de 80 cuevas documentadas en la zona circundante. Estas pinturas y estatuas están relacionadas con Gautama Buda y su vida. Hay un total de 153 estatuas de Buda en el complejo del templo."
 building_dambulla_cave_temple_01: "$building_type_dambulla_cave_temple_01$"
 building_dambulla_cave_temple_01_desc: "$building_type_dambulla_cave_temple_01_desc$"
 building_type_pabonka_hermitage_01: "Ermita de Pabonka"
 building_type_pabonka_hermitage_01_desc: "La ermita de Pabonka fue fundada por Songtsen Gampo en el siglo VII, actualmente es la más grande e importante de las ermita de Sera y es el punto de partida para la 'Cuarta Día del Sexto Mes' (Drug pa tshe bzhi) del circuito de peregrinación de circunvalación de montaña de Sera (Se ra’i ri ’khor)."
 building_pabonka_hermitage_01: "$building_type_pabonka_hermitage_01$"
 building_pabonka_hermitage_01_desc: "$building_type_pabonka_hermitage_01_desc$"
 building_type_maya_devi_temple_01: "Templo de Maya Devi"
 building_type_maya_devi_temple_01_desc: "Se dice que el templo de Maya Devi es donde nació Siddhattha Gotama, mejor conocido como el Buda. El templo en sí data de la época de Ashoka, quien patrocinó la construcción y plantación de un sagrado árbol Bodhi aquí."
 building_maya_devi_temple_01: "$building_type_maya_devi_temple_01$"
 building_maya_devi_temple_01_desc: "$building_type_maya_devi_temple_01_desc$"
 building_type_sravasti_01: "Shravasti"
 building_type_sravasti_01_desc: "Shravasti es un antiguo complejo donde el Buda pasó gran parte de su vida enseñando a sus discípulos. Desde los días del Buda, el complejo ha atraído a numerosos monjes y monjas, así como a otros visitantes y peregrinos."
 building_sravasti_01: "$building_type_sravasti_01$"
 building_sravasti_01_desc: "$building_type_sravasti_01_desc$"
 building_type_sankassa_01: "Ermita de Pabonka"
 building_type_sankassa_01_desc: "Sankassa es una ciudad que el Buda visitó en su vida y fue grandemente expandida por Ashoka, quien construyó varias estupas aquí para honrar el tiempo del Buda en la ciudad."
 building_sankassa_01: "$building_type_sankassa_01$"
 building_sankassa_01_desc: "$building_type_sankassa_01_desc$"
 building_type_ratnagiri_01: "Ratnagiri"
 building_type_ratnagiri_01_desc: "Ratnagiri es un antiguo Mahavihra, construido en el siglo V. Aunque no es tan famoso como Nalanda, también funciona como un centro budista de aprendizaje además de una comunidad monástica."
 building_ratnagiri_01: "$building_type_ratnagiri_01$"
 building_ratnagiri_01_desc: "$building_type_ratnagiri_01_desc$"
 building_type_amaravati_stupa_01: "Estupa de Amaravati"
 building_type_amaravati_stupa_01_desc: "La gran estupa de Amaravati fue construida entre el siglo III a.C. y el siglo III d.C. Un número de esculturas y obras de arte decoran el templo, así como uno de los edictos de Ashoka. Desde entonces ha funcionado como un monasterio budista."
 building_amaravati_stupa_01: "$building_type_amaravati_stupa_01$"
 building_amaravati_stupa_01_desc: "$building_type_amaravati_stupa_01_desc$"
 building_type_mahamevnaw_01: "Jardines de Mahamevnawa"
 building_type_mahamevnaw_01_desc: "Los Jardines de Mahamevnāwa fueron creados por el rey Mutasiva en el siglo IV a.C. Los jardines albergan el árbol Jaya Sri Maha Bodhi, una rama del más famoso árbol Bodhi. Cerca de los jardines se encuentran la estupa Thuparamaya y la estupa Ruwanwelisaya, las estupas más antiguas de Lanka."
 building_mahamevnaw_01: "$building_type_mahamevnaw_01$"
 building_mahamevnaw_01_desc: "$building_type_mahamevnaw_01_desc$"
 building_sigiriya_01: "Sigiriya"
 building_sigiriya_01_desc: "En el 477 d.C., Kashyapa I, el hijo del rey por una consorte no real, tomó el trono de rey Dhatusena. El heredero legítimo, Moggallana, temiendo por su vida, huyó al sur de la India. Temiendo un ataque de Moggallana, Kashyapa trasladó la capital y su residencia de la capital tradicional de Anuradhapura a la más segura Sigiriya. Durante el reinado del rey Kashyapa, Sigiriya se desarrolló en una ciudad compleja y fortaleza. La mayoría de las elaboradas construcciones en la cima de la roca y a su alrededor, incluidas las estructuras defensivas, palacios y jardines, datan de este período."
 building_type_sigiriya_01: "$building_sigiriya_01$"
 building_type_sigiriya_01_desc: "$building_sigiriya_01_desc$"
# Jain Temples
 building_type_palitana_temple_01: "Templos de Palitana"
 building_type_palitana_temple_01_desc: "Los templos de Palitana del Jainismo están ubicados en la colina Shatrunjaya, cerca de la ciudad de Palitana. La ciudad del mismo nombre, conocida anteriormente como Padliptapur, ha sido apodada 'Ciudad de los Templos'. Shatrunjaya significa un 'lugar de victoria contra enemigos internos' o 'que conquista enemigos internos'. Este sitio en la colina Shatrunjaya es considerado sagrado por los jainistas Svetambara. Se dice que 23 de los 24 Tirthankaras jainistas, excepto Neminatha, santificaron la colina con sus visitas. Hay aproximadamente 863 templos esculpidos en mármol en las colinas, distribuidos principalmente en nueve grupos, algunos siendo vastos complejos de templos, mientras que la mayoría son pequeños en tamaño. El templo principal está dedicado a Rishabhanatha, el primer Tirthankara; es el santuario más sagrado para la secta Svetambara Murtipujaka."
 building_palitana_temple_01: "$building_type_palitana_temple_01$"
 building_palitana_temple_01_desc: "$building_type_palitana_temple_01_desc$"
 building_type_gammateshwara_statue_01: "Estatua de Gammateshwara"
 building_type_gammateshwara_statue_01_desc: "La Estatua de Gammateshwara es la estatua monolítica más alta del mundo dedicada a la figura sagrada jainista de Bahubali. La estatua está ubicada en la colina Vindyagiri, cerca de la ciudad de Shravanbelagola. Es tan grande que puede verse a 30 km de distancia. Atrae a peregrinos jainistas de todo el mundo, lo que a su vez ayuda a aumentar los impuestos que recibe la ciudad."
 building_gammateshwara_statue_01: "$building_type_gammateshwara_statue_01$"
 building_gammateshwara_statue_01_desc: "$building_type_palitana_temple_01_desc$"
 building_type_girnar_jain_temples_statue_01: "Complejo de Templos Jain de Girnar"
 building_type_girnar_jain_temples_01_desc: "Es aquí donde el 22º Tirthankara Neminath se convirtió en monje ascético y alcanzó el moksha desde la cima más alta del Monte Ginar. Hay varios templos pequeños alrededor de la montaña que atraen a peregrinos de todo el mundo."
 building_girnar_jain_temples_01: "$building_type_girnar_jain_temples_statue_01$"
 building_girnar_jain_temples_01_desc: "$building_type_girnar_jain_temples_01_desc$"
 building_type_girnar_jain_temples_statue_02: "Complejo de Templos Jain de Girnar"
 building_type_girnar_jain_temples_02_desc: "Es aquí donde el 22º Tirthankara Neminath se convirtió en monje ascético y alcanzó el moksha desde la cima más alta del Monte Ginar. El antiguo complejo de templos ha sido recientemente aumentado con un nuevo templo dedicado al 22º Tirthankara Neminath, que es el más grande de los templos. El complejo de templos atrae a peregrinos de todo el mundo."
 building_girnar_jain_temples_02: "$building_type_girnar_jain_temples_statue_01$"
 building_girnar_jain_temples_02_desc: "$building_type_girnar_jain_temples_01_desc$"
 building_type_jal_mandir_temple_01: "Jal Mandir"
 building_type_jal_mandir_temple_01_desc: "El antiguo Templo Jal Mandir fue construido por el Rey Nandivardhan, el hermano mayor de Mahavira. Aquí se dice que Mahavira fue cremado después de alcanzar el moksha."
 building_jal_mandir_temple_01: "$building_type_jal_mandir_temple_01$"
 building_jal_mandir_temple_01_desc: "$building_type_jal_mandir_temple_01_desc$"
 building_type_kanakagiri_tirth_01: "Templo Kanakagiri Tirth"
 building_type_kanakagiri_tirth_01_desc: "El Templo Kanakagiri Tirth fue construido en los siglos V y VI por la Dinastía Ganga Occidental. Se dice que los monasterios del templo en Kanakagiri fueron visitados por Mahavira y donde sostuvo reuniones."
 building_kanakagiri_tirth_01: "$building_type_kanakagiri_tirth_01$"
 building_kanakagiri_tirth_01_desc: "$building_type_kanakagiri_tirth_01_desc$"
 building_type_sonagiri_temple_01: "Templo Sonagiri"
 building_type_sonagiri_temple_01_desc: "La Estatua de Gammateshwara es la estatua monolítica más alta del mundo dedicada a la figura sagrada jainista de Bahubali. La estatua está ubicada en la colina Vindyagiri, cerca de la ciudad de Shravanbelagola. Es tan grande que puede verse a 30 km de distancia. Atrae a peregrinos jainistas de todo el mundo, lo que a su vez ayuda a aumentar los impuestos que recibe la ciudad."
 building_sonagiri_temple_01: "$building_type_sonagiri_temple_01$"
 building_sonagiri_temple_01_desc: "$building_type_sonagiri_temple_01_desc$"
# Forts and Castles
 building_type_chittorgarh_01: "Chittorgarh"
 building_type_chittorgarh_01_desc: "Chittorgarh se extiende sobre una colina de 180 m (590.6 ft) de altura, abarcando un área de 280 ha (691.9 acres) sobre las llanuras del valle drenadas por el río Berach. El fuerte cuenta con 84 cuerpos de agua. Estos cuerpos de agua son alimentados por captaciones naturales y lluvias, y tienen una capacidad total de 4 mil millones de litros que podrían satisfacer las necesidades de agua de un ejército de 50,000. El suministro podría durar cuatro años. Estos cuerpos de agua se presentan en forma de estanques, pozos y pozos escalonados."
 building_chittorgarh_01: "$building_type_chittorgarh_01$"
 building_chittorgarh_01_desc: "$building_type_chittorgarh_01_desc$"
 building_type_ranthambore_01: "Fuerte Ranthambore"
 building_type_ranthambore_01_desc: "El Fuerte Ranthambore está situado en la cima de una colina de 700 pies de altura, rodeado por un enorme muro de piedra con bastiones y torretas. Se extiende por 4 millas y encierra un área de casi 2.5 millas. En su interior, el complejo está lleno de muchas ruinas y maravillas arquitectónicas. Palacios, cenotafios, estanques, pabellones y templos están dispersos entre una red de caminos y patios."
 building_ranthambore_01: "$building_type_ranthambore_01$"
 building_ranthambore_01_desc: "$building_type_ranthambore_01_desc$"
 building_type_gwalior_fort_01: "Fuerte Gwalior"
 building_type_gwalior_fort_01_desc: "El Fuerte Gwalior se erige sobre una vasta colina rocosa llamada Gopachal. Construido en arenisca y mortero de cal, el fuerte domina la ciudad de Gwalior. Dentro del fuerte, varios palacios, templos y reservorios de agua emergen de la colina."
 building_gwalior_fort_01: "$building_type_gwalior_fort_01$"
 building_gwalior_fort_01_desc: "$building_type_gwalior_fort_01_desc$"
 building_potala_palace_01: "Palacio Potala"
 building_potala_palace_01_desc: "El sitio donde se alza el Palacio Potala está construido sobre un palacio erigido por Songtsen Gampo en la Colina Roja. En este momento, no es más que ruinas..."
 building_type_potala_palace_01: "$building_potala_palace_01$"
 building_type_potala_palace_01_desc: "$building_potala_palace_01_desc$"
 building_potala_palace_02: "Palacio Potala"
 building_potala_palace_02_desc: "El sitio donde se alza el Palacio Potala está construido sobre un palacio erigido por Songtsen Gampo en la Colina Roja. Solía ser una ruina, pero ahora es una majestuosa fortaleza. Incluso el más malvado pretendiente nunca invadirá este lugar."
 building_type_potala_palace_02: "$building_potala_palace_02$"
 building_type_potala_palace_02_desc: "$building_potala_palace_02_desc$"
# Other Buildings
 building_type_rani_ki_vav_01: "Rani ki vav"
 building_type_rani_ki_vav_01_desc: "Ubicado a orillas del río Saraswati, el Rani Ki Vav o Escalera de la Reina es el mayor ejemplo de una escalera de agua. Diseñada como un templo invertido que destaca la santidad del agua, la escalera de agua está dividida en siete niveles de escaleras con paneles escultóricos; más de 500 esculturas principales y más de mil menores combinan imágenes religiosas, mitológicas y seculares."
 building_rani_ki_vav_01: "$building_type_rani_ki_vav_01$"
 building_rani_ki_vav_01_desc: "$building_type_rani_ki_vav_01_desc$"
# Southeast Asia Buildings
 building_type_tran_quoc_pagoda_01: "Pagoda Tran Quoc"
 building_type_tran_quoc_pagoda_01_desc: "La Pagoda Tran Quoc es una de las más antiguas de Dai La, construida durante el reinado de Lý Nam Đế. Junto a la pagoda hay un pequeño estanque sereno que atrae a visitantes y monjes."
 building_tran_quoc_pagoda_01: "$building_type_tran_quoc_pagoda_01$"
 building_tran_quoc_pagoda_01_desc: "$building_type_tran_quoc_pagoda_01_desc$"
 building_type_po_nagar_01: "Po Nagar"
 building_type_po_nagar_01_desc: "Po Nagar es un templo Cham dedicado a la diosa Yan Po Nagar, la diosa patrona del pueblo Cham. Varios reyes Cham, especialmente Satyavarman y Harivarman, han contribuido a dotar y expandir el templo."
 building_po_nagar_01: "$building_type_po_nagar_01$"
 building_po_nagar_01_desc: "$building_type_po_nagar_01_desc$"
 building_type_preah_vihear_temple_01: "Templo Preah Vihear"
 building_type_preah_vihear_temple_01_desc: "loyal."
 building_preah_vihear_temple_01: "$building_type_preah_vihear_temple_01$"
 building_preah_vihear_temple_01_desc: "$building_type_preah_vihear_temple_01_desc$"
 building_type_phra_pathommachedi_01: "Phra Pathommachedi"
 building_type_phra_pathommachedi_01_desc: "Phra Pathommachedi es uno de los más antiguos estupas budistas en el sudeste asiático, construido en 193 a.C. con un diseño basado en el Gran Stupa de Sanchi en India."
 building_phra_pathommachedi_01: "$building_type_phra_pathommachedi_01$"
 building_phra_pathommachedi_01_desc: "$building_type_phra_pathommachedi_01_desc$"
 building_type_phra_pathommachedi_02: "Complejo Phra Pathommachedi"
 building_type_phra_pathommachedi_02_desc: "Phra Pathommachedi es uno de los más antiguos estupas budistas en el sudeste asiático, construido en 193 a.C., ahora reconstruido en estilo Dvaravati. Junto con el cercano Phra Prathonchedi, ambos actúan como los principales estupas del asentamiento de Nakhon Prathom."
 building_phra_pathommachedi_02: "$building_type_phra_pathommachedi_02$"
 building_phra_pathommachedi_02_desc: "$building_type_phra_pathommachedi_02_desc$"
 building_type_phra_pathommachedi_03: "Complejo Phra Pathommachedi"
 building_type_phra_pathommachedi_03_desc: "Phra Pathommachedi es uno de los más antiguos estupas budistas en el sudeste asiático, construido en 193 a.C., ahora reconstruido por tercera vez con una aguja Khmer Prang en la parte superior. Junto con el cercano Phra Prathonchedi, ambos actúan como los principales estupas del asentamiento de Nakhon Prathom."
 building_phra_pathommachedi_03: "$building_type_phra_pathommachedi_03$"
 building_phra_pathommachedi_03_desc: "$building_type_phra_pathommachedi_03_desc$"
 building_type_candi_muaro_jambi_01: "Candi Muaro Jambi"
 building_type_candi_muaro_jambi_01_desc: "El Candi Muaro Jambi es un complejo de templos budistas construido en el siglo VII. El complejo del templo está construido a lo largo del río Batang Hari, aunque hay espacio para la expansión."
 building_candi_muaro_jambi_01: "$building_type_candi_muaro_jambi_01$"
 building_candi_muaro_jambi_01_desc: "$building_type_candi_muaro_jambi_01_desc$"
 building_type_candi_muaro_jambi_02: "Candi Muaro Jambi"
 building_type_candi_muaro_jambi_02_desc: "El Candi Muaro Jambi es un complejo de templos budistas construido en el siglo VII. El complejo del templo de Candi Muaro Jambi se extiende por un gran área a lo largo de las orillas del río Batang Hari. El complejo del templo ha sido recientemente renovado y ampliado considerablemente alrededor del río Batang Hari."
 building_candi_muaro_jambi_02: "$building_type_candi_muaro_jambi_02$"
 building_candi_muaro_jambi_02_desc: "$building_type_candi_muaro_jambi_02_desc$"
 building_type_candi_muaro_takus_01: "Candi Muara Takus"
 building_type_candi_muaro_takus_01_desc: "Candi Muara Takus se considera uno de los templos más antiguos de Indonesia, construidos en el siglo IX. Este sitio tiene una amplia gama de santuarios budistas e hindúes, y se encuentra cerca del río Musi."
 building_candi_muaro_takus_01: "$building_type_candi_muaro_takus_01$"
 building_candi_muaro_takus_01_desc: "$building_type_candi_muaro_takus_01_desc$"

