 building_type_jokhang_monastery_01: "Monasterio Jokhang"
 building_type_jokhang_monastery_01_desc: "El Monasterio Jokhang es un templo construido durante el reinado de Songtsen Gampo. Alberga importantes estatuas y reliquias budistas enviadas como dote para las dos esposas del emperador tibetano, la princesa Wenchang de la dinastía Tang y la princesa Bhrikuti de Nepal."
