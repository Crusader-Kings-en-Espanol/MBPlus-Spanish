 #Bronze works
 building_type_wap_bronze_industry_01: "Industria de Trabajos en Bronce"
 building_type_wap_bronze_industry_01_desc: "Comenzando con los artesanos de Igbo-Ukwu antes de extenderse a Ifẹ y Benín, el dominio de la técnica de fundición a la cera perdida es una de las grandes innovaciones de la historia de África Occidental, produciendo algunas de las obras y esculturas de metal más hermosas del mundo."
 building_wap_bronze_industry_01: "Pequeños Talleres de Bronce"
 building_wap_bronze_industry_01_desc: "Comenzando a nivel de aldea, nuestros herreros han empezado a procesar materiales encontrados localmente, pero nuestros esfuerzos para desarrollar la industria se ven obstaculizados por nuestra producción aún descentralizada. Actualmente, los aldeanos recolectan recursos a nivel de clan encabezados por ancianos locales."
 building_wap_bronze_industry_02: "Talleres de bronce medianos"
 building_wap_bronze_industry_02_desc: "Hemos comenzado a centralizar nuestra industria de trabajo en bronce para reducir el desperdicio en nuestra producción y aumentar nuestra producción. Nuestros esfuerzos han resultado en el desarrollo de un sitio significativo de fundición a la cera perdida, alimentado por nuestras minas circundantes."
 building_wap_bronze_industry_03: "Grandes talleres de bronce"
 building_wap_bronze_industry_03_desc: "Ahora existe un distrito a gran escala y centralizado dedicado a nuestros trabajos maestros en bronce. Especializado en las mejores piezas de bronce, cobre y hierro, la fama de nuestros maestros artesanos se extiende desde el Níger hasta el valle del Nilo."

