 building_type_cothon_01: "Gran Coton de Cartago"
 building_type_cothon_01_desc: "El gran coton de Cartago se dividía en un puerto mercante rectangular, seguido de un puerto interior protegido y un astillero reservado para la marina. Este puerto interior era circular y estaba rodeado por un anillo de diques secos capaces de albergar doscientas veinte naves. En el centro estaba la casa de mando, elevada para que el capitán del puerto pudiera ver toda la bahía."
