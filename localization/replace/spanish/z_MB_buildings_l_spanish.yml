 ## Unique Buildings
 building_type_chongsheng_temple_01: "Templo Chongsheng"
 building_type_chongsheng_temple_01_desc: "La Pagoda Qianxun del Templo Chongsheng está construida de ladrillo y barro blanco, y se dice que aleja los desastres naturales. Una estatua de Buda de mármol blanco se encuentra en cada piso."
 building_chongsheng_temple_01: "Pagoda Qianxun"
 building_chongsheng_temple_01_desc: "$building_type_chongsheng_temple_01_desc$"
 building_chongsheng_temple_02: "Las Tres Pagodas"
 building_chongsheng_temple_02_desc: "Las dos pagodas adicionales se reflejan entre sí pero difieren en construcción del templo principal. Juntas forman un triángulo equilátero, visible desde cualquier lugar dentro de Dali."
 building_type_leshan_buddha_01: "Buda de Leshan"
 building_type_leshan_buddha_01_desc: "El Gran Buda de Leshan se sitúa sobre la confluencia de los ríos Dadu y Min, frente al sagrado Monte Emei. Se dice que calma las turbulentas aguas de abajo, haciéndolas seguras para los barcos de carga. Se considera la estatua más grande del mundo."
 building_leshan_buddha_01: "$building_type_leshan_buddha_01$"
 building_leshan_buddha_01_desc: "$building_type_leshan_buddha_01_desc$"
 building_type_pura_besakih_01: "Pura Besakih"
 building_type_pura_besakih_01_desc: "El complejo de pura Besakih en las laderas del Monte Agung es el templo hindú más grande y sagrado de Bali."
 building_pura_besakih_01: "$building_type_pura_besakih_01$"
 building_pura_besakih_01_desc: "$building_type_pura_besakih_01_desc$"
 building_type_angkor_wat_01: "Angkor Wat"
 building_type_angkor_wat_01_desc: "Angkor Wat, la Ciudad de los Templos, es un complejo masivo construido de arenisca hábilmente labrada, coronado con montañas de templos que representan el monte Meru de cinco picos. Está rodeado por una enorme muralla exterior y un foso de más de 5 kilómetros de largo."
 building_angkor_wat_01: "$building_type_angkor_wat_01$"
 building_angkor_wat_01_desc: "$building_type_angkor_wat_01_desc$"
 building_type_dujiangyan_01: "Dujiangyan"
 building_type_dujiangyan_01_desc: "El Dujiangyan es un sistema de riego construido en 256 a.C. por los Qin. Redirige las aguas del río Min, previniendo inundaciones y proporcionando a la cuenca de Chengdu abundante agua dulce para los campos."
 building_dujiangyan_01: "$building_type_dujiangyan_01$"
 building_dujiangyan_01_desc: "$building_type_dujiangyan_01_desc$"
 building_type_zhengguoqu_01: "Zhenguoqu"
 building_type_zhengguoqu_01_desc: "El Canal Zhenguo, que conecta los ríos Jing y Luo, fue construido durante la dinastía Qin. Irriga una gran porción de la llanura de Guanzhong, proporcionando tierras cultivables muy necesarias para la zona."
 building_zhengguoqu_01: "$building_type_zhengguoqu_01$"
 building_zhengguoqu_01_desc: "$building_type_zhengguoqu_01_desc$"
 building_type_daming_palace_01: "Palacio Daming"
 building_type_daming_palace_01_desc: "El Palacio Daming comenzó su construcción en 634 d.C. bajo el emperador Taizong de la dinastía Tang. Al completarse, era uno de los complejos palaciegos más grandes del mundo. Sirve como centro para la cultura y las artes, albergando actuaciones de música y danza, recitales de poesía y otros eventos culturales que atraen a artistas e intelectuales talentosos."
 building_daming_palace_01: "$building_type_daming_palace_01$"
 building_daming_palace_01_desc: "$building_type_daming_palace_01_desc$"
 building_type_luoyang_palace_01: "Palacio Ziwei"
 building_type_luoyang_palace_01_desc: "Construido inicialmente durante la dinastía Han del Este, el Palacio Ziwei alcanzó el pico de su escala y grandeza durante la dinastía Tang bajo Wu Zetian. Es famoso por su esplendor arquitectónico y sofisticación artística, reflejando la opulencia y el gusto refinado de la corte imperial. Su arquitectura y diseño han servido de inspiración para palacios similares construidos posteriormente en Corea y Japón."
 building_luoyang_palace_01: "$building_type_luoyang_palace_01$"
 building_luoyang_palace_01_desc: "$building_type_luoyang_palace_01_desc$"
 building_type_mount_song: "Monte Song"
 building_type_mount_song_desc: "Uno de los Cinco Grandes Montes de China, el Monte Song siempre ha sido un centro de cielo y tierra. Se dice que al principio del universo, cuando el cuerpo de Pangu se convirtió en el mundo, su estómago sobresalió para convertirse en esta cima."
 building_mount_song: "$building_type_mount_song$"
 building_mount_song_desc: "$building_type_mount_song_desc$"
