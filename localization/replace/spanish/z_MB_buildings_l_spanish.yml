 ###NORTH AFRICAN ###
 building_type_wap_mausoleum_of_juba_01: "Mausoleo de Juba II"
 building_type_wap_mausoleum_of_juba_01_desc: "El mausoleo es un impresionante complejo funerario real antiguo construido en el 3 a. C. por el último Rey de Numidia, y luego Rey del antiguo reino amazigh de Mauretania Caesariensis, Juba II (hijo de Juba I de Numidia) y su esposa Cleopatra Selene II. Cleopatra Selene II fue una princesa egipcia-griega ptolemaica, hija de la Reina Cleopatra VII de Egipto y del Triunviro Romano Marco Antonio. A través de su matrimonio con Juba II, se convirtió en la última Reina de Numidia y más tarde en Reina de Mauretania Caesariensis. El mausoleo alberga los restos del Rey Juba II y su esposa, la Reina Cleopatra Selene II."
 building_wap_mausoleum_of_juba_01: "$building_type_wap_mausoleum_of_juba_01$"
 building_wap_mausoleum_of_juba_01_desc: "$building_type_wap_mausoleum_of_juba_01_desc$"
 building_type_wap_madghacen_01: "Imdghasn"
 building_type_wap_madghacen_01_desc: "Imdghasn es un gran y antiguo templo y mausoleo real de los Reyes Numidios amazigh, construido entre los años 300 y 200 a. C., cerca de la época del Rey Masinisa y los primeros contactos romanos con los amazigh del norte de África. Imdghasn funciona como un lugar sagrado de peregrinación y el lugar de descanso final de los antiguos reyes amazigh, incluyendo al Rey Madghis de los reinos independientes de Numidia."
 building_wap_madghacen_01: "$building_type_wap_madghacen_01$"
 building_wap_madghacen_01_desc: "$building_type_wap_madghacen_01_desc$"
 building_type_wap_tomb_of_tin_hinan_01: "Tumba de Tin-Hinan"
 building_type_wap_tomb_of_tin_hinan_01_desc: "Tin Hinan es la progenitora ancestral y famosa Reina de los Tuareg, también conocida como la Reina del Hoggar, y por los tuareg como Tamenokalt, que literalmente significa mujer de las tiendas, o mujer noble. Es venerada como la madre de todas las tribus de tuareg, y su tumba se encuentra en el territorio de Ahaggar en el sur de Argelia. El interior de la tumba muestra grandes habilidades arquitectónicas y contiene una inscripción en tifinagh escrita en una de las paredes."
 building_wap_tomb_of_tin_hinan_01: "$building_type_wap_tomb_of_tin_hinan_01$"
 building_wap_tomb_of_tin_hinan_01_desc: "$building_type_wap_tomb_of_tin_hinan_01_desc$"
 ###WEST AFRICAN ####
 building_type_wap_sungbos_eredo_01: "Eredo de Sungbo"
 building_type_wap_sungbos_eredo_01_desc: "Eredo de Sungbo es un sistema de murallas y fosos defensivos que rodea el reino Yorùbá de Ìjẹ̀bú. Fue construido en el siglo IX d.C. en honor a la noble de Ìjẹ̀bú, Iyaloyé Bilikisu Sungbo."
 building_wap_sungbos_eredo_01: "$building_type_wap_sungbos_eredo_01$"
 building_wap_sungbos_eredo_01_desc: "$building_type_wap_sungbos_eredo_01_desc$"
 building_type_wap_walls_of_loropeni_01: "Murallas de Loropéni"
 building_type_wap_walls_of_loropeni_01_desc: "Las murallas de Loropéni representan un sistema de murallas de piedra y fosos defensivos que rodean la capital de la provincia de Loropéni. Fue construido en el siglo XI d.C. por el pueblo Kulango."
 building_wap_walls_of_loropeni_01: "$building_type_wap_walls_of_loropeni_01$"
 building_wap_walls_of_loropeni_01_desc: "$building_type_wap_walls_of_loropeni_01_desc$"
 building_type_wap_palace_of_al_ghaba_01: "Palacio Real de Al-Ghāba"
 building_type_wap_palace_of_al_ghaba_01_desc: "La joya del gran reino de Wagadu, la riqueza y el poder del Kaya Maghan es evidente para cualquier visitante del palacio de los gobernantes."
 building_wap_palace_of_al_ghaba_01: "$building_type_wap_palace_of_al_ghaba_01$"
 building_wap_palace_of_al_ghaba_01_desc: "$building_type_wap_palace_of_al_ghaba_01_desc$"
 building_type_wap_palace_of_gao_01: "Palacio Real de Gao"
 building_type_wap_palace_of_gao_01_desc: "La residencia real y la capital fortificada del antiguo reino de Gao. La riqueza, el poder y el esplendor del poderoso reino de comercio transahariano de Gao se reflejan en sus altas murallas de piedra, mercados y mansiones reales."
 building_wap_palace_of_gao_01: "$building_type_wap_palace_of_gao_01$"
 building_wap_palace_of_gao_01_desc: "$building_type_wap_palace_of_gao_01_desc$"
 building_type_wap_dhar_tichitt_01: "Ruinas de Dhar Tichitt"
 building_type_wap_dhar_tichitt_01_desc: "Se cree que fue el hogar de los antecesores del pueblo Soninke, las ruinas de Dhar Tichitt son un testimonio del drástico efecto del cambio climático en las civilizaciones del Sahara. Esta región cuenta con 500 asentamientos de piedra en lo que antes era una sabana, ahora desierto. Además de criar ganado, sus habitantes cazaban, pescaban, recolectaban grano silvestre y cultivaban mijo."
 building_wap_dhar_tichitt_01: "$building_type_wap_dhar_tichitt_01$"
 building_wap_dhar_tichitt_01_desc: "$building_type_wap_dhar_tichitt_01_desc$"
 building_type_wap_dutsen_dala_01: "Dutsen Dala"
 building_type_wap_dutsen_dala_01_desc: "Dutsen Dala, la montaña sagrada de Dala y centro del mundo para el antiguo pueblo Hausa. En la cima de Dutsen Dala, el sacerdote-rey antepasado de los Hausa, Barbushe, hacía sacrificios a Tsumburbura."
 building_wap_dutsen_dala_01: "$building_type_wap_dutsen_dala_01$"
 building_wap_dutsen_dala_01_desc: "$building_type_wap_dutsen_dala_01_desc$"
 building_type_wap_oracle_of_ife_01: "Oráculo de Ifẹ"
 building_type_wap_oracle_of_ife_01_desc: "#F El Oráculo de Ifẹ se encuentra en Ilé-Ifẹ, en el lugar del descenso de Odùduwà desde el cielo. Ahora ha sido debidamente amueblado y sirve como sitio de culto para los lugareños. También alberga a un olorìṣà de Odùduwà con el título de Obadio, quien ofrece servicio a los dignos.#!"
 building_wap_oracle_of_ife_01: "$building_type_wap_oracle_of_ife_01$"
 building_wap_oracle_of_ife_01_desc: "$building_type_wap_oracle_of_ife_01_desc$"
 building_type_wap_cavern_of_bida_01: "Abismo de Kumbi"
 building_type_wap_cavern_of_bida_01_desc: "#F Hogar del gran dios-serpiente Bida, y sitio de sacrificio anual de los gobernantes de Wagadu.#!"
 building_wap_cavern_of_bida_01: "$building_type_wap_cavern_of_bida_01$"
 building_wap_cavern_of_bida_01_desc: "$building_type_wap_cavern_of_bida_01_desc$"
 building_type_wap_jenne_walls_01: "Murallas de Jenné"
 building_type_wap_jenne_walls_01_desc: "#F Las murallas de Jenné fueron construidas en la segunda mitad del primer milenio d.C. y sirvieron para proteger la famosa ciudad transahariana de Jenné de sus numerosos rivales envidiosos. Al-Sadi, en su Tarikh al-Sudan, afirma que los malienses atacaron la ciudad noventa y nueve veces, pero Jenné nunca fue conquistada. No fue hasta el siglo XV que esta joya del alto Níger fue finalmente conquistada por el despiadado Si Ali del Imperio Songhai. Según al-Sadi, el asedio de Jenné duró 7 meses y 7 días y culminó con la rendición de la ciudad y la muerte del gobernante.#!"
 building_wap_jenne_walls_02: "Murallas de Jenné"
 building_wap_jenne_walls_02_desc: "#F Las murallas de Jenné fueron construidas en la segunda mitad del primer milenio d.C. y sirvieron para proteger la famosa ciudad transahariana de Jenné de sus numerosos rivales envidiosos. Al-Sadi, en su Tarikh al-Sudan, afirma que los malienses atacaron la ciudad noventa y nueve veces, pero Jenné nunca fue conquistada. No fue hasta el siglo XV que esta joya del alto Níger fue finalmente conquistada por el despiadado Si Ali del Imperio Songhai. Según al-Sadi, el asedio de Jenné duró 7 meses y 7 días y culminó con la rendición de la ciudad y la muerte del gobernante.#!"
 building_type_wap_walls_of_kano_01: "Murallas de Kano"
 building_type_wap_walls_of_kano_01_desc: "#F Las Murallas de Kano son antiguas murallas defensivas construidas para proteger a los habitantes de la antigua ciudad de Kano. La muralla fue inicialmente construida desde 1095 hasta 1134 y se completó a mediados del siglo XIV. Las Antiguas Murallas de la Ciudad de Kano fueron descritas como 'el monumento más impresionante de África Occidental'.#!"
 building_wap_walls_of_kano_01: "Murallas de Kano"
 building_wap_walls_of_kano_01_desc: "#F Las Murallas de Kano son antiguas murallas defensivas construidas para proteger a los habitantes de la antigua ciudad de Kano. La muralla fue inicialmente construida desde 1095 hasta 1134 y se completó a mediados del siglo XIV. Las Antiguas Murallas de la Ciudad de Kano fueron descritas como 'el monumento más impresionante de África Occidental'.#!"
 building_wap_walls_of_kano_02: "$building_type_wap_walls_of_kano_01$"
 building_wap_walls_of_kano_02_desc: "$building_type_wap_walls_of_kano_01_desc$"
 building_type_wap_senegambian_stone_circles_01: "Círculos de Piedra de Sine Ngayene"
 building_type_wap_senegambian_stone_circles_01_desc: "#F Los Círculos de Piedra de Sine Ngayene Senegambianos son la mayor concentración de círculos de piedra vista en el mundo. Están compuestos por sitios como Wassu y Kerbatch en Gambia, y Wanar y Sine Ngayene en Senegal. Entre estas cuatro áreas principales, hay aproximadamente 29,000 piedras, 17,000 monumentos y 2,000 sitios individuales. Construidos entre el siglo III a.C. y el siglo XVI d.C. Juntos, los círculos de piedra de pilares de laterita y sus montículos funerarios asociados presentan un vasto paisaje sagrado creado durante más de 1,500 años.#!"
 building_wap_senegambian_stone_circles_01: "$building_type_wap_senegambian_stone_circles_01$"
 building_wap_senegambian_stone_circles_01_desc: "$building_type_wap_senegambian_stone_circles_01_desc$"
 #EAST AFRICAN
 building_type_wap_fortress_of_dongola_01: "Fortaleza de Dongola"
 building_type_wap_fortress_of_dongola_01_desc: "Situada estratégicamente en una colina con vistas al Nilo, la Fortaleza de Dongola fue fundada en el siglo V d.C. y sirvió como el baluarte del Reino de Makuria durante cientos de años. Fue desde detrás de las murallas de piedra de la fortaleza que las fuerzas nubias repelieron dos veces la invasión de los ejércitos del Islam en la Alta Nubia, frustrando sus intentos de expandir el califato más profundamente en África y controlar el lucrativo comercio de lujos de los reinos de Nubia. La fortaleza protegía el palacio y la sala del trono de Dongola, sede del rey makurio, así como un monasterio, múltiples iglesias, incluyendo la Iglesia de Jesús el Grande, y la catedral central del obispado de Dongola."
 building_wap_fortress_of_dongola_01: "$building_type_wap_fortress_of_dongola_01$"
 building_wap_fortress_of_dongola_01_desc: "$building_type_wap_fortress_of_dongola_01_desc$"
 building_type_wap_temple_of_philae_01: "Ruinas del Templo de File"
 building_type_wap_temple_of_philae_01_desc: "#F El antaño grandioso Templo de File ha sido un lugar sagrado de peregrinación y de adoración de los antiguos dioses del Nilo desde tiempos antiguos. Ahora se encuentra en ruinas, profanado por saqueadores.#!"
 building_wap_temple_of_philae_01: "$building_type_wap_temple_of_philae_01$"
 building_wap_temple_of_philae_01_desc: "$building_type_wap_temple_of_philae_01_desc$"
 building_type_wap_temple_of_philae_02: "Templo de File"
 building_type_wap_temple_of_philae_02_desc: "#F El Templo de File ha sido un sitio sagrado de peregrinación y adoración de los antiguos dioses del Nilo desde tiempos antiguos. Después de una inversión significativa, el sitio ha sido limpiado y los edificios del templo reconstruidos y renovados en un estilo más moderno, listos para recibir peregrinos una vez más.#!"
 building_wap_temple_of_philae_02: "$building_type_wap_temple_of_philae_02$"
 building_wap_temple_of_philae_02_desc: "$building_type_wap_temple_of_philae_02_desc$"
 building_type_wap_temple_of_apedemak_01: "Ruinas del Templo de Apedemak"
 building_type_wap_temple_of_apedemak_01_desc: "#F El antaño grandioso templo de Apedemak honra al dios de la guerra con cabeza de león, y deidad patrona de los gobernantes del antiguo Kush - Apedemak. Ahora se encuentra en ruinas, profanado por saqueadores.#!"
 building_wap_temple_of_apedemak_01: "$building_type_wap_temple_of_apedemak_01$"
 building_wap_temple_of_apedemak_01_desc: "$building_type_wap_temple_of_apedemak_01_desc$"
 building_type_wap_temple_of_apedemak_02: "Templo de Apedemak"
 building_type_wap_temple_of_apedemak_02_desc: "#F El grandioso Templo de Apedemak honra al dios de la guerra con cabeza de león del antiguo panteón kushita, deidad patrona de los gobernantes del antiguo Kush. Tras una inversión significativa, el sitio ha sido limpiado y los edificios del templo renovados en un estilo más moderno, con un altar digno de Apedemak una vez más.#!"
 building_wap_temple_of_apedemak_02: "$building_type_wap_temple_of_apedemak_02$"
 building_wap_temple_of_apedemak_02_desc: "$building_type_wap_temple_of_apedemak_02_desc$"
 building_type_wap_temple_of_amun_01: "Jebel Barkal"
 building_type_wap_temple_of_amun_01_desc: "#F Situado al pie de la montaña sagrada de Jebel Barkal se encuentran las ruinas del Templo de Amón. Fue el sitio de coronación de los gobernantes de Kush durante siglos, ahora está en ruinas, profanado por saqueadores.#!"
 building_wap_temple_of_amun_01: "$building_type_wap_temple_of_amun_01$"
 building_wap_temple_of_amun_01_desc: "$building_type_wap_temple_of_amun_01_desc$"
 building_type_wap_temple_of_amun_02: "Templo de Amón"
 building_type_wap_temple_of_amun_02_desc: "#F Situado al pie de la montaña sagrada de Jebel Barkal se encuentra el Templo de Amón. Antiguo sitio de coronación de los gobernantes de Kush durante siglos, tras una inversión significativa ha sido restaurado a su antigua gloria. Los sitios del templo han sido reconstruidos y renovados en un estilo más moderno, y se ha construido un complejo palaciego para la realeza visitante y sus huéspedes.#!"
 building_wap_temple_of_amun_02: "$building_type_wap_temple_of_amun_02$"
 building_wap_temple_of_amun_02_desc: "$building_type_wap_temple_of_amun_02_desc$"
 building_type_wap_cathedral_of_our_lady_01: "Catedral de Nuestra Señora"
 building_type_wap_cathedral_of_our_lady_01_desc: "Famosa por sus magníficas pinturas murales, la Catedral de Nuestra Señora, también conocida como María Pachoras, es la catedral central del obispado de Faras."
 building_wap_cathedral_of_our_lady_01: "$building_type_wap_cathedral_of_our_lady_01$"
 building_wap_cathedral_of_our_lady_01_desc: "$building_type_wap_cathedral_of_our_lady_01_desc$"
 building_type_wap_st_marys_cathedral_01: "Catedral de Santa María"
 building_type_wap_st_marys_cathedral_01_desc: "La Catedral de Santa María es la catedral central del obispado de Qasr Ibrim, también conocido como 'Silimi' en Antiguo Nubio."
 building_wap_st_marys_cathedral_01: "$building_type_wap_st_marys_cathedral_01$"
 building_wap_st_marys_cathedral_01_desc: "$building_type_wap_st_marys_cathedral_01_desc$"
 building_type_wap_ghazali_monastery_01: "Monasterio de Ghazali"
 building_type_wap_ghazali_monastery_01_desc: "Fundado por el gran rey makurio Merkurios, el Monasterio de Ghazali es un lugar de peregrinación para cualquier cristiano notable que visite o viaje por el reino desde el siglo VI d.C. en adelante. El sitio estaba compuesto no solo por un monasterio, sino también por una iglesia, un asentamiento y un centro metalúrgico para la producción de hierro."
 building_wap_ghazali_monastery_01: "$building_type_wap_ghazali_monastery_01$"
 building_wap_ghazali_monastery_01_desc: "$building_type_wap_ghazali_monastery_01_desc$"
 building_type_wap_obelisk_of_aksum_01: "Obelisco de Axum"
 building_type_wap_obelisk_of_aksum_01_desc: "#F El Obelisco de Axum es un obelisco de fonolita del siglo IV d.C., de 24 metros de altura y 160 toneladas, ubicado en la ciudad de Axum en Etiopía. Está ornamentado con dos falsas puertas en la base y presenta decoraciones que asemejan ventanas en todos los lados. El obelisco termina en una parte superior semicircular, que solía estar rodeada por marcos de metal.#!"
 building_wap_obelisk_of_aksum_01: "$building_type_wap_obelisk_of_aksum_01$"
 building_wap_obelisk_of_aksum_01_desc: "$building_type_wap_obelisk_of_aksum_01_desc$"
 building_type_wap_pyramids_at_nuri_01: "Cementerio Real Kushita en Nuri"
 building_type_wap_pyramids_at_nuri_01_desc: "#F Las pirámides de Nuri fueron construidas durante un período de más de tres siglos, desde aproximadamente 670 a.C. para la más antigua, hasta alrededor de 310 a.C.#!"
 building_wap_pyramids_at_nuri_01: "$building_type_wap_pyramids_at_nuri_01$"
 building_wap_pyramids_at_nuri_01_desc: "$building_type_wap_pyramids_at_nuri_01_desc$"
 building_type_wap_pyramids_at_nuri_02: "Cementerio Real Kushita en Nuri"
 building_type_wap_pyramids_at_nuri_02_desc: "#F Las pirámides de Nuri fueron construidas durante un período de más de tres siglos, desde aproximadamente 670 a.C. para la más antigua, hasta alrededor de 310 a.C.#!"
 building_wap_pyramids_at_nuri_02: "$building_type_wap_pyramids_at_nuri_01$"
 building_wap_pyramids_at_nuri_02_desc: "$building_type_wap_pyramids_at_nuri_01_desc$"
 building_type_wap_rockhewn_church_01: "Betä Giyorgis"
 building_type_wap_rockhewn_church_01_desc: "#F Betä Giyorgis, o la Iglesia de San Jorge, es una de las once iglesias talladas en roca de la región. Ubicada en las Tierras Altas de Etiopía Occidental cerca de la ciudad de Lalibela (conocida como Roha antes del siglo XII), la iglesia fue encargada por el rey Gebre Mesqel Lalibela de la dinastía Zagwe, a finales del siglo XII y principios del siglo XIII, y es una iglesia dentro de un masivo proyecto de construcción de 11 iglesias talladas en roca para recrear la ciudad santa de Jerusalén.#!"
 building_wap_rockhewn_church_01: "$building_type_wap_rockhewn_church_01$"
 building_wap_rockhewn_church_01_desc: "$building_type_wap_rockhewn_church_01_desc$"
 building_type_wap_masjid_fakhr_ad_din_01: "Masjid Fakhr ad-Dīn"
 building_type_wap_masjid_fakhr_ad_din_01_desc: "#F Esta mezquita fue construida en 969 d.C. por el primer sultán del Sultanato de Mogadiscio, Abu Bakr Fakr ad-Din de la dinastía Fakr ad-Din. Construida de piedra y decorada lujosamente con mármol indio adornado con caligrafía, la estructura brilla con hermoso coral y azulejos vidriados. Un testamento no solo de la fe de los musulmanes somalíes, sino también de la riqueza y el poder de su ciudad.#!"
 building_wap_masjid_fakhr_ad_din_01: "$building_type_wap_masjid_fakhr_ad_din_01$"
 building_wap_masjid_fakhr_ad_din_01_desc: "$building_type_wap_masjid_fakhr_ad_din_01_desc$"
 building_type_wap_masjid_al_qiblatayn_01: "Masjid al-Qiblatayn"
 building_type_wap_masjid_al_qiblatayn_01_desc: "#F Construida en el siglo VII d.C. poco después de la hirjah, esta mezquita es una de las más antiguas de África y en la historia del Islam. También conocida como la mezquita Labo-Qibla, o la Mezquita de los dos Qiblahs, haciendo referencia a sus dos mihrabs: uno orientado al norte hacia La Meca, y el otro al noroeste hacia Jerusalén.#!"
 building_wap_masjid_al_qiblatayn_01: "$building_type_wap_masjid_al_qiblatayn_01$"
 building_wap_masjid_al_qiblatayn_01_desc: "$building_type_wap_masjid_al_qiblatayn_01_desc$"
