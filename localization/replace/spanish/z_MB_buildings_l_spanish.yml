 building_siro_b_temple_of_bel_01: "Templo de Bel"
 building_siro_b_temple_of_bel_01_desc: "El templo, consagrado al dios mesopotámico Bel, adorado en Palmira en tríada con el dios lunar Aglibol y el dios del sol Yarhibol, formó el centro de la vida religiosa en Palmira y fue dedicado en el año 32 d.C. El Templo de Bel fue convertido en una iglesia cristiana durante la era bizantina. Partes de la estructura fueron modificadas por árabes en 1132, lo que preservó la estructura y convirtió el Templo en una mezquita.\n\nQué destino le deparará al Templo de Bel en el futuro. Solo Dios lo sabe."
 building_siro_b_temple_of_bel_02: "Templo de Bel Convertido"
 building_siro_b_temple_of_bel_02_desc: "El Templo de Bel, que era solo un templo pagano, ha sido convertido en un templo de [GetPlayer.GetFaith.GetReligion.GetNameNoTooltip]. Lleno de fe [GetPlayer.GetFaith.GetReligion.GetNameNoTooltip], este lugar es verdaderamente un templo digno del propietario de Palmira."
 building_siro_b_turpan_karez_01: "Karez de Turpan"
 building_siro_b_turpan_karez_01_desc: "El sistema de pozos karez de Turpan fue crucial en el desarrollo de Turpan como un importante punto de parada en la antigua Ruta de la Seda que rodea el árido y hostil Desierto de Taklamakan. Turpan debe su prosperidad al agua proporcionada por su sistema de pozos karez."
 building_type_RICE_bawarij_den_01: "Guarida de los Bawarij"
 building_type_RICE_niger_delta_osun_osogbo_sacred_grove: "Bosque Sagrado de Osun-Osogbo"
 building_type_RICE_niger_delta_osun_osogbo_sacred_grove_desc: "Aunque hay varios bosques sagrados en Nigeria, Osun-Osogbo es uno de los más importantes. Situado a lo largo de las orillas del río Osun, es un centro principal de adoración para la deidad yoruba homónima y profundamente venerada, Osun, quien es la diosa del amor, la fertilidad, el agua, la belleza y la adivinación."
 building_type_RICE_pirate_den_01: "Guarida de Piratas del Océano Índico"
 building_type_RICE_south_ethiopia_tiya: "Megalitos de Tiya"
 building_type_RICE_south_ethiopia_tiya_desc: "Este lugar alberga una gran cantidad de estructuras megalíticas, incluidas tumbas, piedras erguidas y estelas, que han sido erigidas aquí a lo largo de los siglos. Las estelas presentan una variedad de diseños y temas, como emblemas de plantas y espadas, así como representaciones de figuras humanas."
 building_type_RICE_sri_lanka_ruins_of_anuradhapura: "Ruinas de Anuradhapura"
 building_type_RICE_sri_lanka_ruins_of_anuradhapura_desc: "Anuradhapura fue una vez la resplandeciente capital de [GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName], un centro de aprendizaje budista y comercio marítimo. Sin embargo, a raíz de invasiones y agitaciones políticas, ha perdido su prominencia y gran parte de la ciudad está abandonada. Los habitantes restantes viven entre poderosas ruinas que recuerdan los días de gloria de la ciudad."
 building_type_RICE_tarim_basin_bezeklik_caves: "Cuevas de Bezeklik"
 building_type_RICE_tarim_basin_bezeklik_caves_desc: "Las Cuevas de Bezeklik de los Mil Budas son un complejo de grutas budistas que datan de muchos siglos atrás. Sin embargo, el sitio solo ha ganado más prominencia en tiempos recientes y se ha convertido en un importante lugar de culto y peregrinación para los budistas locales."
 building_type_RICE_tarim_basin_dafo_temple: "Templo Dafo"
 building_type_RICE_tarim_basin_dafo_temple_desc: "El Templo Dafo, o el Gran Templo del Buda, alberga una de las estatuas de Buda reclinado más grandes del mundo. Se dice que un monje budista escuchó sonidos y vio luces celestiales provenientes de una colina; cuando investigó, encontró una hermosa estatua de Buda reclinado. Construyó este templo sobre esa misma colina en honor a este auspicioso descubrimiento."
 building_type_RICE_tarim_basin_kizil_caves: "Cuevas de Kizil"
 building_type_RICE_tarim_basin_kizil_caves_desc: "Las Cuevas de Kizil de los Mil Budas son un complejo de cientos de grutas budistas que datan de muchos siglos atrás y que sirven como un sitio sagrado local. Aunque las cuevas han sido cada vez más abandonadas y muchas han caído en un estado de deterioro, todavía se utilizan para el culto y son las cuevas más grandes de este tipo en el Tarim Basin, y solo son superadas en tamaño y esplendor por las Cuevas de Mogao cuando se trata de grutas budistas en la región."
 building_type_RICE_tarim_basin_mogao_caves: "Cuevas de Mogao"
 building_type_RICE_tarim_basin_mogao_caves_desc: "Las Grutas de los Mil Budas de Dunhuang son una red de cientos de cuevas que sirven como templos y santuarios dedicados al culto, la oración y la meditación budista. Las cuevas más antiguas fueron excavadas en el siglo IV, y desde entonces, devotos de lugares tan lejanos como el centro de China y Khotan han patrocinado la construcción de varias cuevas. Muchos clanes de élite locales tienen sus propias cuevas que han mantenido durante siglos."
 building_type_al_qarawiyyin_university: "Universidad Al-Qarawiyyin"
 building_type_al_qarawiyyin_university_desc: "#F La Universidad Al-Qarawiyyin es un complejo significativo de la arquitectura islámica que toma prestado en gran medida de los estilos arquitectónicos marroquíes. Esta universidad alienta a los musulmanes a aprender sobre la jurisprudencia, ya que se adhiere al Corán.#!"
 building_type_mz_pyramids_01: "Pirámides"
 building_type_mz_pyramids_01_desc: "Estas pirámides están construidas al estilo de las Grandes Pirámides de Giza y sirven como tumbas para los muertos."
 building_type_preburge_01: "Cimientos del Burgo"
