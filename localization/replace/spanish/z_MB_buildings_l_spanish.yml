l_spanish:
 
 building_type_tamil_bazaar_01: "$building_tamil_bazaar_01$"
 building_type_tamil_bazaar_01_desc: "$building_tamil_bazaar_01_desc$"
 building_tamil_bazaar_01: "Bazar de Nagapattinam"
 building_tamil_bazaar_01_desc: "La ciudad de Nagapattinam sirvió como el importante puerto para el comercio y las expediciones navales con destino al este para el Imperio Chola y continuó siendo un centro importante incluso después de que los Imperios colapsen."
 building_tamil_bazaar_02: "Sprawling Bazaar de Nagapattinam"
 building_tamil_bazaar_02_desc: "La ciudad de Nagapattinam sirvió como el importante puerto para el comercio y las expediciones navales con destino al este para el Imperio Chola y continuó siendo un centro importante incluso después de que los Imperios colapsen."

 building_type_isfahan_bazaar_01: "$building_isfahan_bazaar_01$"
 building_type_isfahan_bazaar_01_desc: "$building_isfahan_bazaar_01_desc$"
 building_isfahan_bazaar_01: "Mercado de Bagdad"
 building_isfahan_bazaar_01_desc: "La ciudad de la paz, en Bagdad, se encuentra en la confluencia de los Tigris y Eufrates, al mando de las rutas comerciales que fluyen desde el Este. Sus mercados masivos y bibliotecas lo convirtieron en el centro de aprendizaje y comercio inigualable, embalando la riqueza a todo el mundo islámico."
 building_isfahan_bazaar_02: "Sprawling Marketplace of Baghdad"
 building_isfahan_bazaar_02_desc: "La ciudad de la paz, en Bagdad, se encuentra en la confluencia de los Tigris y Eufrates, al mando de las rutas comerciales que fluyen desde el Este. Sus mercados masivos y bibliotecas lo convirtieron en el centro de aprendizaje y comercio inigualable, embalando la riqueza a todo el mundo islámico."

 building_type_constantinople_market_01: "$building_constantinople_market_01$"
 building_type_constantinople_market_01_desc: "$building_constantinople_market_01_desc$"
 building_constantinople_market_01: "Bazar de Constantinopla"
 building_constantinople_market_01_desc: "Constantinopla, señora indiscutible del comercio, se alza en la confluencia de los continentes. Como extremo occidental de la Ruta de la Seda, este mercado recibe las grandes caravanas y flotas mercantes de Oriente y controla el flujo de artículos de lujo hacia Europa y el Mediterráneo. Su importancia estratégica solo encuentra rival en su riqueza."
 building_constantinople_market_02: "Sprawling Bazaar de Constantinopla"
 building_constantinople_market_02_desc: "La amante inigualable del comercio, Constantinopla se encuentra en la confluencia de los continentes. Como último término occidental de la Ruta de la Seda, este mercado recibe las grandes caravanas y flotas marítimas del Este, controlando el flujo de bienes de lujo en toda Europa y el Mediterráneo. Su riqueza es igualada sólo por su importancia estratégica."
 
 building_type_angkor_market_01: "$building_angkor_market_01$"
 building_type_angkor_market_01_desc: "$building_angkor_market_01_desc$"
 building_angkor_market_01: "Bazar de Angkor"
 building_angkor_market_01_desc: "Situado en el corazón del gran Imperio Khmer, este bazar sirve como el bullicioso centro comercial de la península. Los bienes fluyen a través de las ciudades reales y en sus mercados, conectando la riqueza del sudeste interior Asia al mundo marítimo."
 building_angkor_market_02: "Sprawling Bazaar de Angkor"
 building_angkor_market_02_desc: "Situado en el corazón del gran Imperio Khmer, este bazar sirve como el bullicioso centro comercial de la península. Los bienes fluyen a través de las ciudades reales y en sus mercados, conectando la riqueza del sudeste interior Asia al mundo marítimo."
 
