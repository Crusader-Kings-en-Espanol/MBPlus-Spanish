 ## Common Buildings ##
 building_madrasa_01:0 "$building_madrasa_01$"
 building_type_madrasa_01:0 "Madrasa"
 building_madrasa_01_desc:0 "#F Una Madrasa es un lugar de aprendizaje académico islámico, debate e intercambio ideológico. Los asistentes de la Madrasa son instruidos en la ley islámica, estudios coránicos, y se les da una base sobre la cual conducirse como musulmanes curiosos e inquisitivos.#!"
 building_madrasa_desc:0 "$building_madrasa_01_desc$"

 ## Unique Buildings ##
 holy_site_lalish_shrine_01:0 "Santuario Yazidí de Lalish"
 building_type_holy_site_lalish_shrine_01:0 "Santuario Yazidí de Lalish"
 building_holy_site_lalish_shrine_01_desc:0 "El antiguo templo de Lalish es un lugar querido en los corazones de cada yazidí. Se espera que al menos una vez en su vida, los yazidíes hagan una peregrinación de seis días a Lalish para visitar la tumba de Şêx Adî y otros lugares sagrados. Estos otros lugares sagrados son santuarios dedicados a otros seres sagrados. Hay dos manantiales sagrados llamados Zamzam y Kaniya Spî."
 building_holy_site_lalish_shrine_01:0 "$building_type_holy_site_lalish_shrine_01$"
 building_holy_site_lalish_shrine_desc:0 "$building_holy_site_lalish_shrine_01_desc$"

 al_ukhaidir_fortress_01:0 "Fortaleza de Al-Ukhaidir"
 building_type_al_ukhaidir_fortress_01:0 "Fortaleza de Al-Ukhaidir"
 al_ukhaidir_fortress_01_desc:0 "#F La Fortaleza de Al-Ukhaidir fue erigida en 775 d.C. por el sobrino del califa abasí As-Saffah, Isa ibn Musa. Se alza en el desierto, un triunfo de la arquitectura abasí. Aunque posee todas las cualidades de una instalación militar, también contiene lujos como patios, salas de residencia y mezquitas.#!"
 building_al_ukhaidir_fortress_01:0 "$al_ukhaidir_fortress_01$"
 building_al_ukhaidir_fortress_01_desc:0 "$al_ukhaidir_fortress_01_desc$"
 
 alcazar_seville_01:0 "Alcázar de Sevilla"
 building_type_alcazar_seville_01:0 "Alcázar de Sevilla"
 alcazar_seville_01_desc:0 "#F En el año 913, tras una revuelta contra el gobierno de Córdoba, el primer califa de Andalucía Abd al-Rahman III construyó una construcción fortificada en lugar de una basílica cristiana visigoda. Era un recinto cuadrangular, fortificado y anexado a las murallas. En el siglo XI, el tercer gobernante de la taifa de Sevilla, Al-Mu'tamid, amplió la estructura hacia el oeste con un nuevo palacio 'Al Mubarak'. También se llevaron a cabo varias adiciones a la construcción, como establos y almacenes. A medida que Sevilla se estableció como la capital de Al-Andalus, los califas almohades hicieron del Alcázar su residencia principal.#!"
 building_alcazar_seville_01:0 "$alcazar_seville_01$"
 building_alcazar_seville_01_desc:0 "$alcazar_seville_01_desc$"

 alcazaba_almeria_01:0 "Alcázaba de Almería"
 building_type_alcazaba_almeria_01:0 "Alcázaba de Almería"
 alcazaba_almeria_01_desc:0 "#F Construida por Abdurrahman III de Andalucía en 955, esta fantástica muestra de la arquitectura morisca contiene plazas, complejos de vivienda, mezquitas y una enorme ciudadela, desde la cual el gobierno se asentaba y administraba las provincias locales.#!"
 building_alcazaba_almeria_01:0 "$alcazaba_almeria_01$"
 building_alcazaba_almeria_01_desc:0 "$alcazaba_almeria_01_desc$"

 alcazaba_badajoz_01:0 "Alcázaba de Badajoz"
 building_type_alcazaba_badajoz_01:0 "Alcázaba de Badajoz"
 alcazaba_badajoz_01_desc:0 "#F Construida por Abdalrahman ibn Marwan en 875, este complejo de ciudadela fue construido para crear un asiento de poder para los andaluces, desde el cual podían supervisar las áreas locales y administrar la ley islámica en todo. Muestra una geometría impresionantemente precisa, lo que ayuda a su reputación como un complejo defensivo temible.#!"
 building_alcazaba_badajoz_01:0 "$alcazaba_badajoz_01$"
 building_alcazaba_badajoz_01_desc:0 "$alcazaba_badajoz_01_desc$"

 toledo_walls_01:0 "Murallas de Toledo"
 building_type_toledo_walls_01:0 "Murallas de Toledo"
 toledo_walls_01_desc:0 "#F Las murallas de la ciudad de Toledo fueron erigidas por primera vez bajo el dominio romano. Habiendo sido pasadas de un conquistador a otro en la península ibérica, las murallas de Toledo han sido ampliadas a lo largo de los siglos para crear una defensa verdaderamente formidable para la antigua ciudad.#!"
 building_toledo_walls_01:0 "$toledo_walls_01$"
 building_toledo_walls_01_desc:0 "$toledo_walls_01_desc$"

 faro_walls_01:0 "Muralha de Faro"
 building_type_faro_walls_01:0 "Muralha de Faro"
 faro_walls_01_desc:0 "#F Las murallas de la ciudad de Faro son tan antiguas como el mismo Faro. Conocido como Ossonoba durante el período romano de la historia de Portugal, los romanos construyeron murallas para proteger su foro y otros edificios cívicos. Cuando el Imperio Romano se dividió en partes occidentales y orientales, los bizantinos (Imperio Romano Oriental) construyeron dos torres octogonales para reforzar las murallas originales. La muralla sufrió importantes alteraciones y ampliaciones entre los siglos IX y XI durante el período de ocupación árabe, y tiene dos torres 'albarrã' (una torre defensiva separada de la muralla cortina y conectada a ella por un puente o un arco) que datan de este período y que protegían la entrada al Arco do Repouso (Arco del Descanso) donde, según la leyenda, el rey Afonso III descansó después de que la ciudad fuera tomada a los moros en 1249. También data del período árabe la entrada con una puerta en forma de arco de herradura que se puede ver dentro del Arco da Vila.#!"
 building_faro_walls_01:0 "$faro_walls_01$"
 building_faro_walls_01_desc:0 "$faro_walls_01_desc$"

 fort_algeciras_01:0 "Fortaleza de Jebel al-Fath"
 building_type_fort_algeciras_01:0 "Fortaleza de Jebel al-Fath"
 fort_algeciras_01_desc:0 "#F La fortaleza de Jebel al-Fath fue construida al principio de la invasión árabe de la península ibérica, en la montaña de Jebel al-Fath, y tiene vistas al Mediterráneo. La fortaleza recibe su nombre de la Roca de Gibraltar, que los árabes llaman Jebel al-Fath, que se traduce como la Montaña de la Victoria.#!"
 building_fort_algeciras_01:0 "$fort_algeciras_01$"
 building_fort_algeciras_01_desc:0 "$fort_algeciras_01_desc$"

 fort_alicante_01:0 "Fortaleza de Banu Qatil"
 building_type_fort_alicante_01:0 "Fortaleza de Banu Qatil"
 fort_alicante_01_desc:0 "#F La fortaleza de Banu Qatil fue construida en Alicante, sobre la montaña de Banu Qatil, que se traduce literalmente como Pico de Alicante en árabe. Los árabes tenían una pequeña ciudad allí antes de que los cristianos llegaran a la península ibérica. El castillo es una mezcla de fortaleza y palacio, y todavía se pueden ver los restos de la estructura original. Esta fortaleza es conocida por haber resistido el asedio de las tropas cristianas en varias ocasiones.#!"
 building_fort_alicante_01:0 "$fort_alicante_01$"
 building_fort_alicante_01_desc:0 "$fort_alicante_01_desc$"

 qusayr_amra_01:0 "Qusayr Amra"
 building_type_qusayr_amra_01:0 "Qusayr Amra"
 qusayr_amra_01_desc:0 "#F Este lujoso remanente del Califato Omeya es un testimonio de sus prácticas indulgentes, completo con baños, tapices eróticos y escenarios teatrales. Se encuentra en una zona relativamente aislada en el desierto, donde un gobernante puede decidir quedarse y alejarse de los problemas de administrar su dominio.#!"
 building_qusayr_amra_01:0 "$qusayr_amra_01$"
 building_qusayr_amra_01_desc:0 "$qusayr_amra_01_desc$"

 fortress_amida_01:0 "Fortaleza de Amida"
 building_type_fortress_amida_01:0 "Fortaleza de Amida"
 fortress_amida_01_desc:0 "#F Establecida en la ciudad de Amida por los romanos, esta notable fortaleza ha visto a muchos gobernantes luchando por su dominio. Los mayores activos de la fortaleza son sus muros, altos, gruesos y casi impenetrables, construidos con resistencia y defensa en mente.#!"
 building_fortress_amida_01:0 "$fortress_amida_01$"
 building_fortress_amida_01_desc:0 "$fortress_amida_01_desc$"

 uqba_mosque_01:0 "Gran Mezquita de Kairouan"
 building_type_uqba_mosque_01:0 "Gran Mezquita de Kairouan"
 uqba_mosque_01_desc:0 "#F La Mezquita Uqba, conocida también como la Gran Mezquita de Kairouan, es una de las mezquitas más antiguas del mundo islámico. Es una pieza masiva e impresionantemente construida de arquitectura islámica, conocida por su fantástica escala y significado histórico.#!"
 building_uqba_mosque_01:0 "$uqba_mosque_01$"
 building_uqba_mosque_01_desc:0 "$uqba_mosque_01_desc$"
 building_type_uqba_mosque_01_duchy:0 "$uqba_mosque_01$"
 building_type_uqba_mosque_01_duchy_desc:0 "$uqba_mosque_01_desc$"
 building_uqba_mosque_01_duchy:0 "$uqba_mosque_01$"
 building_uqba_mosque_01_duchy_desc:0 "$uqba_mosque_01_desc$"

 hejra_01:0 "Hejra"
 building_type_hejra_01:0 "Hejra"
 hejra_01_desc:0 "#F Las antiguas ciudades nabateas de Hejra, también conocidas como Mada'in Salih, son sitios excepcionalmente impresionantes que exhiben asombrosa arquitectura nabatea tallada en acantilados árabes. La reputación de esta ciudad, sin embargo, es lo que la hace indeseable, ya que el Corán menciona que Dios castiga a los habitantes con relámpagos y temblores debido a su adoración a ídolos.#!"
 building_hejra_01:0 "$hejra_01$"
 building_hejra_01_desc:0 "$hejra_01_desc$"

 citadel_antioch_01:0 "Ciudadela de Antioquía"
 building_type_citadel_antioch_01:0 "Ciudadela de Antioquía"
 citadel_antioch_01_desc:0 "#F Construida en el siglo IV antes de Cristo por el legendario rey macedonio Seleuco, este complejo defensivo antiguo y extenso ha servido a muchos poderes a lo largo de la historia, cada uno de los cuales ha dejado su huella en él y lo ha convertido en uno de los centros militares más formidables de la región.#!"
 building_citadel_antioch_01:0 "$citadel_antioch_01$"
 building_citadel_antioch_01_desc:0 "$citadel_antioch_01_desc$"

 citadel_antioch_02:0 "Ciudadela de Antioquía"
 building_type_citadel_antioch_02:0 "Ciudadela de Antioquía"
 citadel_antioch_02_desc:0 "#F Construida en el siglo IV antes de Cristo por el legendario rey macedonio Seleuco, este complejo defensivo antiguo y extenso ha servido a muchos poderes a lo largo de la historia, cada uno de los cuales ha dejado su huella en él y lo ha convertido en uno de los centros militares más formidables de la región.#!"
 building_citadel_antioch_02:0 "$citadel_antioch_01$"
 building_citadel_antioch_02_desc:0 "$citadel_antioch_01_desc$"

 citadel_alexander_01:0 "Ciudadela de Alejandro"
 building_type_citadel_alexander_01:0 "Ciudadela de Alejandro"
 citadel_alexander_01_desc:0 "#F Conocida localmente como Qala Iqtiyaruddin, esta extensa ciudadela fue construida por el legendario Alejandro Magno. Dominando el antiguo valle fértil del río Hari, esta ciudadela, al igual que su homónimo, es verdaderamente una fuerza a tener en cuenta.#!"
 building_citadel_alexander_01:0 "$citadel_alexander_01$"
 building_citadel_alexander_01_desc:0 "$citadel_alexander_01_desc$"
 building_type_citadel_alexander_01_duchy:0 "$building_type_citadel_alexander_01$"
 building_citadel_alexander_01_duchy:0 "$citadel_alexander_01$"
 building_citadel_alexander_01_duchy_desc:0 "$citadel_alexander_01_desc$"

 citadel_homs_01:0 "Ciudadela de Homs"
 building_type_citadel_homs_01:0 "Ciudadela de Homs"
 citadel_homs_01_desc:0 "#F Esta impresionante ciudadela ha sido una constante en la antigua ciudad de Homs, siendo construida en el III milenio antes de Cristo. Una vez sirvió como base de operaciones para el poderoso Imperio Romano, esta fortaleza todavía cumple su propósito como bastión de la ciudad.#!"
 building_citadel_homs_01:0 "$citadel_homs_01$"
 building_citadel_homs_01_desc:0 "$citadel_homs_01_desc$"

 citadel_homs_02:0 "Ciudadela de Homs"
 building_type_citadel_homs_02:0 "Ciudadela de Homs"
 citadel_homs_02_desc:0 "#F Esta impresionante ciudadela ha sido una constante en la antigua ciudad de Homs, siendo construida en el III milenio antes de Cristo. Una vez sirvió como base de operaciones para el poderoso Imperio Romano, esta fortaleza todavía cumple su propósito como bastión de la ciudad.#!"
 building_citadel_homs_02:0 "$citadel_homs_02$"
 building_citadel_homs_02_desc:0 "$citadel_homs_02_desc$"

 sanaa_mosque_01:0 "Gran Mezquita de Sana'a"
 building_type_sanaa_mosque_01:0 "Gran Mezquita de Sana'a"
 sanaa_mosque_01_desc:0 "#F La Gran Mezquita de Sana'a es conocida en el mundo islámico como una verdadera joya en el desierto. La construcción de esta magnífica mezquita fue supervisada por el propio Profeta en 630 d.C., convirtiéndola en uno de los centros de Islam más antiguos de toda Arabia, y un lugar atractivo para todos los musulmanes."
 building_sanaa_mosque_01:0 "$sanaa_mosque_01$"
 building_sanaa_mosque_01_desc:0 "$sanaa_mosque_01_desc$"

 great_mosque_sousse_01:0 "Gran Mezquita de Susa"
 building_type_great_mosque_sousse_01:0 "Gran Mezquita de Susa"
 great_mosque_sousse_01_desc:0 "#F La Gran Mezquita de Susa fue encargada por el emir Abu Al-Abbas Muhammad Aghlabid en 851 d.C. mientras el Estado Aghlabid era un vasallo directo bajo el Califato Abbasí. Esta mezquita tiene una apariencia particularmente fortificada, pero cumple la función de una lujosa casa de culto, completa con balcones, magníficas salas de oración e intrincadas inscripciones cúficas."
 building_great_mosque_sousse_01:0 "$great_mosque_sousse_01$"
 building_great_mosque_sousse_01_desc:0 "$great_mosque_sousse_01_desc$"

 great_mosque_sfax_01:0 "Gran Mezquita de Sfax"
 building_type_great_mosque_sfax_01:0 "Gran Mezquita de Sfax"
 great_mosque_sfax_01_desc:0 "#F La Gran Mezquita de Sfax fue la primera mezquita en ser establecida en la ciudad, encargada bajo el dominio Aghlabid por el tanukhid Sahnun ibn Sa'id, un jurista islámico maliki de la ciudad cercana de Kairouan. La propia ciudad de Sfax se desarrolló alrededor de esta mezquita, siendo considerada por los lugareños como la pieza central y la joya de la ciudad."
 building_great_mosque_sfax_01:0 "$great_mosque_sfax_01$"
 building_great_mosque_sfax_01_desc:0 "$great_mosque_sfax_01_desc$"

 sanctuary_abraham_01:0 "Santuario de Abraham"
 building_type_sanctuary_abraham_01:0 "Santuario de Abraham"
 sanctuary_abraham_01_desc:0 "#F El Santuario de Abraham es el sitio más sagrado de Hebrón, y es venerado por las tres grandes religiones Abrahamicas como la cueva y la tierra que Abraham compró como una parcela de entierro. Una magnífica mezquita se levanta en el sitio. Esta tierra santa sigue atrayendo a los visitantes musulmanes, cristianos y judíos de toda Palestina y más allá."
 building_sanctuary_abraham_01:0 "$sanctuary_abraham_01$"
 building_sanctuary_abraham_01_desc:0 "$sanctuary_abraham_01_desc$"

 mashad_al_husain_01:0 "Mashhad of Ra's al-Hussain"
 building_type_mashad_al_husain_01:0 "Mashhad of Ra's al-Hussain"
 mashad_al_husain_01_desc:0 "#F En una colina en Ascalon se encuentra el sitio tranquilo pero sombrío del Santuario de al-Hussain. Construido por los fieles de Isma'ili que, según ellos, habían escondido secretamente la cabeza del nieto del Profeta Muhammad fuera de la mezquita omeya de Damasco y lo ocultó en Ascalon."
 building_mashad_al_husain_01:0 "$mashad_al_husain_01$"
 building_mashad_al_husain_01_desc:0 "$mashad_al_husain_01_desc$"

 me_old_mosque_basra_01:0 "Antigua mezquita de Basora"
 building_type_old_mosque_basra_01:0 "Antigua mezquita de Basora"
 me_old_mosque_basra_01_desc:0 "#F La primera mezquita que se construirá cerca de la ciudad de Basora y en un punto la mezquita central de la ciudad antes de una inundación envolvió a toda la ciudad, La Mezquita Vieja de Basora ahora se encuentra como monumento histórico y un lugar de peregrinación chiíta."
 building_me_old_mosque_basra_01:0 "$me_old_mosque_basra_01$"
 building_me_old_mosque_basra_01_desc:0 "$me_old_mosque_basra_01_desc$"

 jawatha_mosque_01:0 "Mezquita Jawatha"
 building_type_jawatha_mosque_01:0 "Mezquita Jawatha"
 jawatha_mosque_01_desc:0 "#F La Mezquita Jawatha es una joya simple pero ampliamente conocida de la arquitectura islámica temprana. Su apariencia humilde ayuda en la difusión de los valores islámicos a lo largo de la región."
 building_jawatha_mosque_01:0 "$jawatha_mosque_01$"
 building_jawatha_mosque_01_desc:0 "$jawatha_mosque_01_desc$"

 jameh_mosque_atigh_01:0 "Mezquita Jameh de Atigh"
 building_type_jameh_mosque_atigh_01:0 "Mezquita Jameh de Atigh"
 building_type_jameh_mosque_atigh_01_desc:0 "#F La Mezquita Jameh de Atigh es la mezquita más antigua de Shiraz y es conocida por su hermosa cerámica y su intrincada escritura caligráfica. Esta mezquita fue construida con un Shabestan, un refugio subterráneo pacífico y ventilado a través del cual los fieles pueden encontrar consuelo durante los calurosos veranos."
 jameh_mosque_atigh_01_desc:0 "#F La Mezquita Jameh de Atigh es la mezquita más antigua de Shiraz y es conocida por su hermosa cerámica y su intrincada escritura caligráfica. Esta mezquita fue construida con un Shabestan, un refugio subterráneo pacífico y ventilado a través del cual los fieles pueden encontrar consuelo durante los calurosos veranos."
 building_jameh_mosque_atigh_01:0 "$jameh_mosque_atigh_01$"
 building_jameh_mosque_atigh_01_desc:0 "$jameh_mosque_atigh_01_desc$"

 juma_mosque_shemakha_01:0 "Mezquita Juma de Shemakha"
 building_type_juma_mosque_shemakha_01:0 "Mezquita Juma de Shemakha"
 juma_mosque_shemakha_01_desc:0 "#F La Mezquita Juma de Shemakha fue construida en la fase de expansión temprana del Islam bajo el califato del omeya Valil I. El califa eligió al comandante Maslam Ibn Abd-ul-Malik, su hermano, para residir en la mezquita y administrarla como una base desde la cual se podía ejercer influencia musulmana sobre la región."
 building_juma_mosque_shemakha_01:0 "$juma_mosque_shemakha_01$"
 building_juma_mosque_shemakha_01_desc:0 "$juma_mosque_shemakha_01_desc$"

 al_zaytuna_mosque_01:0 "Mezquita Al-Zaytuna"
 building_type_al_zaytuna_mosque_01:0 "Mezquita Al-Zaytuna"
 al_zaytuna_mosque_01_desc:0 "#F La Gran Mezquita de Al-Zaytuna se construyó sobre un antiguo lugar de culto donde crecían olivos, lo que resulta en el nombre, que significa La Mezquita del Olivo. La mezquita es un lugar destacado de aprendizaje y respetado por miles.#!"
 building_al_zaytuna_mosque_01:0 "$al_zaytuna_mosque_01$"
 building_al_zaytuna_mosque_01_desc:0 "$al_zaytuna_mosque_01_desc$"
 
 building_type_ME_umayyad_mosque_01:0 "La mezquita omeya"
 building_type_ME_umayyad_mosque_01_desc:0 "#F La Mezquita Omeya, conocida como la Gran Mezquita de Damasco, es una Mezquita que fue construida por Caliph al-Walid I en 711 d.C. Es considerado por las tradiciones cristianas e islámicas como el lugar de entierro de la cabeza de Juan el Bautista, y es muy venerado como un símbolo de la autoridad islámica en la región."
 building_ME_umayyad_mosque_01:0 "$building_type_ME_umayyad_mosque_01$"
 building_ME_umayyad_mosque_01_desc:0 "$building_type_ME_umayyad_mosque_01_desc$"

 building_type_imam_hussain_shrine_01:0 "Santuario del Imam Husain"
 building_type_imam_hussain_shrine_01_desc:0 "#F El Santuario del Imam Husain es un importante sitio sagrado chiita. Es donde está enterrado el nieto del profeta Imam Husain, junto con los 72 mártires de la Batalla de Karbala, en la que el Imam y sus fieles sacrificaron todo para defender los valores del Islam."
 building_imam_hussain_shrine_01:0 "$building_type_imam_hussain_shrine_01$"
 building_imam_hussain_shrine_01_desc:0 "$building_type_imam_hussain_shrine_01_desc$"

 building_type_ME_al_qarawiyyin_university_01:0 "Al-Qarawiyin University"
 building_type_ME_al_qarawiyyin_university_01_desc:0 "#F La Universidad Al-Qarawiyyin es un complejo significativo de la arquitectura islámica que presta mucho de estilos arquitectónicos marroquíes. Esta universidad anima a los musulmanes a aprender el derecho mientras se adhiere al Corán. #!"
 building_ME_al_qarawiyyin_university_01:0 "$building_type_ME_al_qarawiyyin_university_01$"
 building_ME_al_qarawiyyin_university_01_desc:0 "$building_type_ME_al_qarawiyyin_university_01_desc$"
 
 building_type_tarikhaneh_mosque_01:0 "Tarikhaneh"
 building_type_tarikhaneh_mosque_01_desc:0 "#F El Templo de Fuego Tarikhaneh es un sitio que encuentra sus orígenes en los días del poderoso Imperio Sassánida, el más fuerte poder zoroastriano del mundo. Ahora se presenta como un remanente de la antigua gloria del zoroastrismo. Un sitio tan significativo puede atraer a los gobernantes islámicos que tendrían interés en convertirlo...#!"
 building_tarikhaneh_mosque_01:0 "$building_type_tarikhaneh_mosque_01$ Ruinas del Templo de Fuego"
 building_tarikhaneh_mosque_01_desc:0 "$building_type_tarikhaneh_mosque_01_desc$"
 building_tarikhaneh_mosque_02:0 "$building_type_tarikhaneh_mosque_01$ Mezquita"
 building_tarikhaneh_mosque_02_desc:0 "La Mezquita Tarikhaneh, anteriormente el Templo de Fuego Tarikhaneh, ha alcanzado una nueva altura de gloria, siendo revitalizada por los gobernantes islámicos y viviendo los años más prósperos en su historia desde su pasado zoroastriano. Brilla como un símbolo de la dominación musulmana de Persia."

 building_type_katasraj_temples_01:0 "Katasraj"
 building_type_katasraj_temples_01_desc:0 "#F Los templos de Katasraj son un sitio antiguo establecido en tiempos prehistóricos como un lugar de importancia religiosa. Se dice que el Dios hindú Krishna sentó las bases del templo, con el estanque circular en el medio registrado en textos sagrados hindúes como creado por las lágrimas del Dios Shiva.#!"
 building_katasraj_temples_01:0 "$building_type_katasraj_temples_01$ Templos"
 building_katasraj_temples_01_desc:0 "$building_type_katasraj_temples_01_desc$"
 building_katasraj_temples_02:0 "$building_type_katasraj_temples_01$ Complejo de Templos"
 building_katasraj_temples_02_desc:0 "El complejo de templos de Katasraj ha visto enormes expansiones y mejoras desde sus días como una mera colección de templos. Ahora, los peregrinos se reúnen aquí en números maravillosos para ver la espectacular arquitectura y la belleza natural que honra a las deidades Krishna y Shiva."

 building_type_qalat_bahrain_01:0 "Qalat Al-Bahrain"
 building_type_qalat_bahrain_01_desc:0 "#F Qalat Al-Bahrain es una fortaleza que data de miles de años antes de Cristo, conocida por su legendaria resistencia y su icónica presencia en las tierras de Bahréin. El poseedor de esta exquisita fortaleza, sin duda, tendrá una ventaja defensiva significativa.#!"
 building_qalat_bahrain_01:0 "$building_type_qalat_bahrain_01$ Ruinas de la Fortaleza"
 building_qalat_bahrain_01_desc:0 "$building_type_qalat_bahrain_01_desc$"
 building_qalat_bahrain_02:0 "$building_type_qalat_bahrain_01$ Fort"
 building_qalat_bahrain_02_desc:0 "La Fortaleza de Bahréin ha sido restaurada a su fantástica gloria. Este es un activo defensivo verdaderamente invaluable, poseyendo algunas de las tecnologías estratégicas más formidables del mundo."

 building_type_qila_baltit_01:0 "Qila Baltit"
 building_type_qila_baltit_01_desc:0 "#F Qila Baltit, también conocido como la Fortaleza Baltit, es una instalación excepcionalmente estratégica en el hermoso Valle de Hunza, que sirve para defender las tierras de Gilgit-Baltistán de invasiones extranjeras. Este bastión está intrincadamente decorado con una mezcla de estilos cachemiríes, árabes y punjabis, lo que lo convierte en un edificio muy impresionante.#!"
 building_qila_baltit_01:0 "$building_type_qila_baltit_01$"
 building_qila_baltit_01_desc:0 "$building_type_qila_baltit_01_desc$"

 building_type_gonbad_e_qavus_01:0 "Gonbad-e-Qavus"
 building_type_gonbad_e_qavus_01_desc:0 "#F Gonbad-e-Qavus es un monumento ominoso y elevado que se cierne sobre Gurgan. La estructura sirve como la tumba del gobernante ziyarí Qabus ibn Wushamgir, y es el edificio más icónico de la ciudad.#!"
 building_gonbad_e_qavus_01:0 "$building_type_gonbad_e_qavus_01$"
 building_gonbad_e_qavus_01_desc:0 "$building_type_gonbad_e_qavus_01_desc$"
 
 building_type_mankiala_stupa_01:0 "Estupa de Mankiala"
 building_type_mankiala_stupa_01_desc:0 "#F Construida hace siglos por antiguos pueblos budistas en el siglo II después de Cristo, la Estupa de Mankiala fue erigida para conmemorar una encarnación del Príncipe Sattva, quien se sacrificó en este mismo lugar para alimentar a siete cachorros de tigre hambrientos.#!"
 building_mankiala_stupa_01:0 "$building_type_mankiala_stupa_01$"
 building_mankiala_stupa_01_desc:0 "$building_type_mankiala_stupa_01_desc$"

 building_type_multan_fort_01:0 "Katochgarh"
 building_type_multan_fort_01_desc:0 "#F La Fortaleza de Multan, conocida localmente como Katochgarh en honor a la dinastía Katoch que la construyó, es una instalación defensiva verdaderamente impresionante con sus muros de 70 pies de altura y un total de 46 bastiones para defenderse. La fortaleza garantizará ser un gran activo para quien la posea, así como un formidable enemigo para quienes se opongan a ella.#!"
 building_multan_fort_01:0 "$building_type_multan_fort_01$"
 building_multan_fort_01_desc:0 "$building_type_multan_fort_01_desc$"

 building_type_prahladpuri_temple_01:0 "Templo Prahladpuri"
 building_type_prahladpuri_temple_01_desc:0 "#F Siempre que un viajero visita la ciudad de Multan, queda fascinado por la vista del antiguo Templo Prahladpuri. Los hindúes creen que este templo fue construido por Prahlada, el hijo del rey Asur Hiranyakashipu. La antigua tradición hindú de Holika Dahan se cree que se origina en este sitio.#!"
 building_prahladpuri_temple_01:0 "$building_type_prahladpuri_temple_01$"
 building_prahladpuri_temple_01_desc:0 "$building_type_prahladpuri_temple_01_desc$"

 building_type_etchmiadzin_cathedral_01:0 "Catedral de Etchmiadzin"
 building_type_etchmiadzin_cathedral_01_desc:0 "#F Construida durante el advenimiento del siglo IV por el santo patrono de Armenia, Gregorio el Iluminador, esta catedral se erige como un hito de la dominación del cristianismo en Armenia, construida sobre un antiguo templo pagano. Esta catedral representa no solo un sitio sagrado para los cristianos, sino un monumento a su éxito.#!"
 building_etchmiadzin_cathedral_01:0 "$building_type_etchmiadzin_cathedral_01$"
 building_etchmiadzin_cathedral_01_desc:0 "$building_type_etchmiadzin_cathedral_01_desc$"

 building_type_chapel_dzordzor_01:0 "Capilla de Dzordzor"
 building_type_chapel_dzordzor_01_desc:0 "#F Esta humilde capilla sirve como un lugar de reunión prominente para los cristianos armenios, y es uno de los lugares de culto más queridos y populares entre los locales.#!"
 building_chapel_dzordzor_01:0 "$building_type_chapel_dzordzor_01$"
 building_chapel_dzordzor_01_desc:0 "$building_type_chapel_dzordzor_01_desc$"

 building_type_monastery_saint_thaddeus_01:0 "Monasterio de San Tadeo"
 building_type_monastery_saint_thaddeus_01_desc:0 "#F Como una de las iglesias cristianas más antiguas del mundo, este monasterio es un hito imperdible de la región. Está dedicado al heroico apóstol armenio, San Tadeo, quien fue el primero en evangelizar Armenia y Persia.#!"
 building_monastery_saint_thaddeus_01:0 "$building_type_monastery_saint_thaddeus_01$"
 building_monastery_saint_thaddeus_01_desc:0 "$building_type_monastery_saint_thaddeus_01_desc$"

 building_type_monastery_saint_stepanos_01:0 "Monasterio de San Esteban"
 building_type_monastery_saint_stepanos_01_desc:0 "#F Originalmente fundado por el apóstol San Bartolomé bajo el reinado del gran Imperio Parto, este gran complejo monástico celebra al primer mártir cristiano de Armenia y al primero de los siete diáconos ordenados por los doce apóstoles.#!"
 building_monastery_saint_stepanos_01:0 "$building_type_monastery_saint_stepanos_01$"
 building_monastery_saint_stepanos_01_desc:0 "$building_type_monastery_saint_stepanos_01_desc$"
 
 building_type_port_beirut_01:0 "Puertos de Beirut"
 building_type_port_beirut_01_desc:0 "#F Los puertos en la bulliciosa ciudad de Beirut constituyen algunas de las localidades comerciales más ocupadas y rentables del Levante. Los comerciantes de Europa buscan importar seda, textiles, alimentos y otros recursos valiosos de regreso a sus tierras natales, y están dispuestos a pagar un precio justo por todo.#!"
 building_port_beirut_01:0 "$building_type_port_beirut_01$"
 building_port_beirut_01_desc:0 "$building_type_port_beirut_01_desc$"

 building_type_port_tyre_01:0 "Puertos de Tiro"
 building_type_port_tyre_01_desc:0 "#F Durante siglos, la ubicación geográfica de Tiro la convierte en el puerto "natural" de Damasco, al que está vinculada a través de caminos desarrollados durante el período romano. Es un punto importante a lo largo de la Ruta de la Seda. La ciudad es conocida por sus industrias tradicionales de tinte púrpura (un producto muy buscado por gobernantes y nobleza), producción de vidrio y azúcar.#!"
 building_port_tyre_01:0 "$building_type_port_tyre_01$"
 building_port_tyre_01_desc:0 "$building_type_port_tyre_01_desc$"

 building_type_port_alexandria_01:0 "Ruinas del Faro de Alejandría"
 building_type_port_alexandria_01_desc:0 "#F El Faro de Alejandría, a veces llamado el Faros de Alejandría, fue un faro construido por el Reino Ptolemaico, durante el reinado de Ptolomeo II Filadelfo (280–247 a.C.), que se ha estimado que tiene al menos 100 metros de altura en total. Una de las Siete Maravillas del Mundo Antiguo, durante muchos siglos fue una de las estructuras hechas por el hombre más altas del mundo. A pesar de su esplendor, el faro fue parcialmente agrietado y dañado por terremotos en 796 y 951, seguido por un colapso estructural en el terremoto de 956, y luego nuevamente en 1303 y 1323. La estructura en ruinas fue utilizada entonces como material de construcción para fortificaciones cercanas. Sin embargo, el espíritu del faro sigue vivo. Esto ha llevado a que la ubicación actual sea considerada como un sitio sagrado para los cristianos y musulmanes, y a la inclusión de una nueva tradición.#!"
 building_port_alexandria_01:0 "$building_type_port_alexandria_01$"
 building_port_alexandria_01_desc:0 "$building_type_port_alexandria_01_desc$"

 building_type_port_alexandria_02:0 "El Faro de Alejandría"
 building_type_port_alexandria_02_desc:0 "#F Después de grandes gastos, el Faro de Alejandría ha sido restaurado. Reforzado para disminuir el impacto de los terremotos, esta grandiosa estructura una vez más guía a los barcos hacia los puertos de Alejandría y se erige como un testimonio del esplendor de su poseedor. Ahora es digna del título de una de las Siete Maravillas del Mundo Antiguo.#!"
 building_port_alexandria_02:0 "$building_type_port_alexandria_02$"
 building_port_alexandria_02_desc:0 "$building_type_port_alexandria_02_desc$"

 building_type_port_tripoli_01:0 "Puerto de Trípoli"
 building_type_port_tripoli_01_desc:0 "#F El famoso puerto de Trípoli sigue siendo en gran medida un puerto formado por la naturaleza, una franja geográfica de tierra donde los veleros que atienden las líneas comerciales a lo largo de las costas de Turquía, Siria, Líbano y Egipto, extendiéndose hasta Malta, Creta y Grecia, atracarían. La bahía en forma de media luna de El Mina actuaba como refugio natural contra los vientos del noreste que crean corrientes fuertes en aguas profundas, permitiendo una atmósfera que fomenta la inversión de los comerciantes.#!"
 building_port_tripoli_01:0 "$building_type_port_tripoli_01$"
 building_port_tripoli_01_desc:0 "$building_type_port_tripoli_01_desc$"

 building_type_port_yaffa_01:0 "Puerto de Jaffa"
 building_type_port_yaffa_01_desc:0 "#F El antiguo puerto de Jaffa es uno que ha sido frecuentado desde la dominación romana y se menciona por nombre en textos históricos famosos como la Biblia Hebrea, el Libro de Jonás y las obras de Josefo. El puerto ha servido históricamente como la fuente más prominente de pescado en la región y, a través del comercio, refuerza la economía local.#!"
 building_port_yaffa_01:0 "$building_type_port_yaffa_01$"
 building_port_yaffa_01_desc:0 "$building_type_port_yaffa_01_desc$"
 
 building_type_me_legendary_mosque:0 "Mezquita legendaria"
 building_type_me_legendary_mosque_desc:0 "#F Grande, hermoso e imponente, esta Mezquita es una maravilla de arquitectura con su magnífico y vasto patio abierto, que puede albergar una gran cantidad de adoradores, peregrinos y eruditos que viajan durante meses sólo para presenciar la hermosa cúpula de la Mezquita. #!"
 building_me_legendary_mosque:0 "$building_type_me_legendary_mosque$"
 building_me_legendary_mosque_desc:0 "$building_me_legendary_mosque_desc$"
 
 building_type_me_legendary_mosque_ziyadid:0 "La mezquita de Ziyadi"
 building_type_me_legendary_mosque_ziyadid_desc:0 "#F Construido por la dinastía Ziyadid, con minaretes llamativos, magnífica cúpula y vasta biblioteca dentro de ella es Madrasa, esta maravilla de la ingeniería no sólo se representa como un símbolo de la historia e influencia de la dinastía dentro de la región, sino también como un símbolo de la autoridad islámica y el aprendizaje. #!"
 building_me_legendary_mosque_ziyadid:0 "$building_type_me_legendary_mosque_ziyadid$"
 building_me_legendary_mosque_ziyadid_desc:0 "$building_me_legendary_mosque_ziyadid_desc$"
 
 ## Building Requirements ##
 imam_ali_mosque_basra_01: "Mezquita Imam Ali de Basra"
 building_type_imam_ali_mosque_basra_01: "Mezquita Imam Ali de Basra"
 imam_ali_mosque_basra_01_desc: "#F Esta mezquita marca un lugar frecuentado por los peregrinos chiítas en su camino a Najaf y Karbala. La Mezquita Imam Ali de Basra, conocida localmente simplemente como la Vieja Mezquita, está dedicada al legendario guerrero musulmán y primer Imam chiíta Ali ibn Abu Talib, un familiar cercano del Profeta Muhammad y uno de los primeros en convertirse al Islam."
 building_imam_ali_mosque_basra_01: "$imam_ali_mosque_basra_01$"
 building_imam_ali_mosque_basra_01_desc: "$imam_ali_mosque_basra_01_desc$"
 building_type_the_friday_mosque_01: "Mezquita Jameh de Isfahan"
 building_type_the_friday_mosque_01_desc: "#F La Mezquita Jameh de Isfahan, conocida también como la Mezquita del Viernes, fue construida durante el gobierno de la dinastía omeya. Se dice que el califa hizo personalmente uno de los pilares de la mezquita. Antes de convertirse en mezquita, se dice que solía ser una casa de culto para los zoroastrianos.#!"
 building_the_friday_mosque_01: "$building_type_the_friday_mosque_01$"
 building_the_friday_mosque_01_desc: "$building_type_the_friday_mosque_01_desc$"
 building_type_damascus_mosque_01: "Gran Mezquita de Damasco"
 building_type_damascus_mosque_01_desc: "#F La Mezquita Omeya, conocida también como la Gran Mezquita de Damasco, es una mezquita que data del 715 d.C., y es venerada por muchos musulmanes como el lugar donde Jesús regresará a la Tierra en el Fin de los Días."
 building_damascus_mosque_01: "$building_type_damascus_mosque_01$"
 building_damascus_mosque_01_desc: "$building_type_damascus_mosque_01_desc$"
 building_type_imam_reza_shrine_01: "Santuario del Imam Reza"
 building_type_imam_reza_shrine_01_desc: "#F El Santuario del Imam Reza es un lugar sagrado para los chiitas Ithna Ash'ari, ya que contiene el mausoleo del octavo Imam del chiismo duodecimano, Imam Reza. Dentro de este complejo de santuarios, en honor al Imam, hay bibliotecas y seminarios dedicados a difundir los valores islámicos a quienes buscan aprender."
 building_imam_reza_shrine_01: "$building_type_imam_reza_shrine_01$"
 building_imam_reza_shrine_01_desc: "$building_type_imam_reza_shrine_01_desc$"
 building_siro_b_ajanta_caves_01: "Cuevas de Ajanta"
 building_siro_b_ajanta_caves_01_desc: "Puede [decide|E] meditar en soledad, reduciendo [stress|E] y posiblemente ganando conocimientos teológicos\n\nPuede tomar el [embrace_celibacy|E] y [abandon_celibacy|E] [decide|E]\n\nLas Cuevas de Ajanta son aproximadamente 30 monumentos budistas excavados en la roca que datan del siglo II a.C. hasta alrededor del 480 d.C. Las cuevas incluyen pinturas y esculturas en roca descritas como algunos de los mejores ejemplos supervivientes del arte indio antiguo, especialmente pinturas expresivas que presentan emociones a través de gestos, poses y formas."
 building_siro_b_ellora_caves_01: "Cuevas de Ellora"
 building_siro_b_ellora_caves_01_desc: "Puede albergar a otros personajes como huésped honrado, gastando [piety|E] a cambio de un aumento en [opinion|E]\n\nSi el titular tiene fe hindú, puede [decide|E] elegir un avatar personal para venerar, ganando un bono relacionado\n\nUno de los mayores complejos de cuevas de templos hindúes excavados en la roca en el mundo, que presenta el hinduismo en particular y algunas monumentos budistas y jainistas con obras de arte que datan del período 600-1000 d.C."
 building_siro_b_mogao_caves_01: "Cuevas de Dunhuang"
 building_siro_b_mogao_caves_01_desc: "[development|E] nivel de [siro_trade_post|E] requiriendo #P -25%#!\n\nLas cuevas contienen algunos de los mejores ejemplos de arte budista que abarcan un período de 1,000 años. Las primeras cuevas fueron excavadas en el año 366 d.C. como lugares de meditación y culto budista. Las Cuevas Mogao son las más conocidas de las grutas budistas chinas y, junto con las Grutas de Longmen y las Grutas de Yungang, son uno de los tres sitios escultóricos budistas antiguos más famosos de China."
 building_siro_b_osun-osogbo_sacred_01: "Bosque Sagrado de Osun-Osogbo"
 building_siro_b_osun-osogbo_sacred_01_desc: "Considerado como la morada de la diosa de la fertilidad Osun, uno de los panteones de los dioses yoruba, el paisaje del bosque y su río serpenteante está salpicado de santuarios y altares, esculturas y obras de arte en honor a Osun y otras deidades."
 building_siro_b_potala_palace_01: "Palacio de Potala"
 building_siro_b_potala_palace_01_desc: "[siro_trade_post|E] en el [realm|E] no hay penalización por rutas comerciales bloqueadas [siro_trade_route|E]\n\nEl sitio en el que se alza el Palacio de Potala está construido sobre un palacio erigido por Songtsen Gampo en la Colina Roja. No son más que ruinas en este momento..."
 building_siro_b_potala_palace_02: "Palacio de Potala"
 building_siro_b_potala_palace_02_desc: "[siro_trade_post|E] en el [realm|E] no hay penalización por rutas comerciales bloqueadas [siro_trade_route|E]\n\nEl sitio en el que se alza el Palacio de Potala está construido sobre un palacio erigido por Songtsen Gampo en la Colina Roja. Solía ser una ruina, pero ahora es una majestuosa fortaleza. Incluso el más malvado pretendiente nunca invadirá este lugar."
 building_siro_b_sanchi_stupa_01: "Estupa de Sanchi"
 building_siro_b_sanchi_stupa_01_desc: "La Gran Estupa en Sanchi es una de las estructuras de piedra más antiguas en India y un monumento importante de la arquitectura india. Fue originalmente encargada por el emperador Ashoka en el siglo III a.C. Su núcleo era una simple estructura hemisférica de ladrillos construida sobre las reliquias del Buda."
