 building_type_athenian_acropolis_01: "Acrópolis de Atenas"
 building_type_athenian_acropolis_01_desc: "La antigua ciudadela que dominaba la ciudad de Atenas en la antigüedad, la Acrópolis es una manifestación física de la gloria y el poder de la antigua Atenas."
 building_athenian_acropolis_01: "Ruinas de la Acrópolis"
