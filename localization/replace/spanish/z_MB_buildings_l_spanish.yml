 building_type_holy_site_chinese_grand_temple_01: "Gran Templo"
 building_type_holy_site_chinese_grand_temple_01_desc: "El [holy_site|E] en esta área es un punto de encuentro para los devotos y dedicados. El gran templo se erige como un noble tributo a los poderes superiores, sus paredes y cúpulas suavizadas y pintadas en colores resplandecientes que honran lo divino."
 building_holy_site_chinese_grand_temple_01: "Gran Templo"
 building_holy_site_chinese_grand_temple_01_desc: "$building_type_holy_site_chinese_grand_temple_01_desc$"
 building_type_phrathat_phanom_01: "Phanom"
 building_type_phrathat_phanom_01_desc: "El Phrathat Phanom es una estupa de 8 metros de altura construida en estilo jemer grabada con un patrón floral en su exterior, reutilizada de su origen como templo brahmánico. El Phrathat Phanom sirve como un nexo para nuestros devotos en toda la cuenca del río Chi-Mun y más allá."
 building_phrathat_phanom_01: "Phanom"
 building_phrathat_phanom_01_desc: "$building_type_phrathat_phanom_01_desc$"
 building_type_phrathat_phanom_02: "Complejo Phrathat Phanom"
 building_type_phrathat_phanom_02_desc: "Con generosa financiación de la comunidad local, el Phrathat Phanom fue reconstruido con una nueva aguja en forma de espada, ahora totalizando 43 metros de altura, así como nuevos edificios para el clero para acomodar a más peregrinos. El Complejo Phrathat Phanom sirve como un nexo para nuestros devotos a lo largo de la cuenca del río Chi-Mun y más allá."
 building_phrathat_phanom_02: "Complejo Phrathat Phanom"
 building_phrathat_phanom_02_desc: "$building_type_phrathat_phanom_02_desc$"
 building_type_china_grand_canal_01: "Gran Canal"
 building_type_china_grand_canal_01_desc: "El Gran Canal fue construido durante la Dinastía Sui para ayudar en el transporte de granos hacia la capital. Esta maravilla de la ingeniería es el sistema de canales más grande del mundo, conectando el norte y el sur de China y facilitando tanto el comercio como el movimiento de tropas a través del imperio."
 building_china_grand_canal_01: "Gran Canal"
 building_china_grand_canal_01_desc: "$building_type_china_grand_canal_01_desc$"
 building_type_china_grand_canal_02: "$building_type_china_grand_canal_01$"
 building_type_china_grand_canal_02_desc: "$building_type_china_grand_canal_01_desc$"
 building_china_grand_canal_02: "$building_china_grand_canal_01$"
 building_china_grand_canal_02_desc: "$building_china_grand_canal_01_desc$"
 building_type_longmen_grottoes_01: "Grutas Longmen"
 building_type_longmen_grottoes_01_desc: "Las Grutas Longmen son una serie de cuevas artificiales talladas en las caras de acantilados de piedra caliza de las Montañas Xiang y Longmen. Albergan decenas de miles de estatuas y relieves en roca del Buda y sus discípulos, junto con numerosas estelas, inscripciones y pagodas. Las grutas han sido patrocinadas desde la Dinastía Wei del Norte por emperadores, miembros de la familia real, generales y otros miembros ricos de la sociedad."
 building_longmen_grottoes_01: "$building_type_longmen_grottoes_01$"
 building_longmen_grottoes_01_desc: "$building_type_longmen_grottoes_01_desc$"
 building_type_tianlongshan_grottoes_01: "Grutas Tianlongshan"
 building_type_tianlongshan_grottoes_01_desc: "Las Grutas Tianlongshan son un complejo de cuevas que contiene una serie de templos budistas y más de 2000 estatuas y relieves, que datan de la Dinastía Qi del Norte."
 tianlongshan_grottoes_01: "$building_type_longmen_grottoes_01$"
 tianlongshan_grottoes_01_desc: "$building_type_longmen_grottoes_01_desc$"
 building_type_mount_fuji_01: "Monte Fuji"
 building_type_mount_fuji_01_desc: "Una de las montañas más sagradas del archipiélago japonés, el Monte Fuji es un volcán activo "
 #A great, snow-capped pinnacle steeped in ancient lore, Mount Damavand is said to be the prison of the monstrous tyrant Zahhāk, where he will abide until the end of the world. Many heroes of old have performed great feats on this mountain, and to those who travel there today, its mighty presence seem to touch their very souls. A dormant volcano, its slopes are dotted by hot springs where weary travelers can stop and relax, pondering the deeds of the ancients."
 building_mount_fuji_01: "$building_type_mount_fuji_01$"
 building_mount_fuji_01_desc: "$building_type_mount_fuji_01_desc$"
 ## Generic Buildings
 building_type_gold_mines_01: "Minerías de Oro"
 building_type_gold_mines_01_desc: "Las montañas aquí son abundantes en oro, simplemente esperando ser extraído."
 building_gold_mines_01: "Asentamiento de Minería de Oro"
 building_gold_mines_01_desc: "Un pequeño asentamiento minero ha surgido cerca de donde se encuentran los filones de mineral. Los colonos han comenzado a abrir los filones y extraer el mineral, pero hasta ahora solo están raspando la superficie."
 building_gold_mines_02: "Minería de Oro"
 building_gold_mines_02_desc: "A medida que el asentamiento crece, se está extrayendo cada vez más mineral. La afluencia de ingenieros competentes permite la construcción de una mina real."
 building_gold_mines_03: "Gran Mina de Oro"
 building_gold_mines_03_desc: "A medida que las operaciones mineras crecen, también lo hacen las minas mismas. Se construyen más entradas y se excavan grandes pozos para permitir la extracción de mineral profundo."
 building_gold_mines_04: "Complejo de Minería de Oro"
 building_gold_mines_04_desc: "A medida que la producción de mineral aumenta, se instalan varias fundiciones y fábricas alrededor del asentamiento. El procesamiento de metal se ha convertido en algo natural para los habitantes, y su habilidad es conocida en todo el mundo conocido."
 building_type_silver_mines_01: "Minerías de Plata"
 building_type_silver_mines_01_desc: "Las montañas aquí son abundantes en plata, simplemente esperando ser extraída."
