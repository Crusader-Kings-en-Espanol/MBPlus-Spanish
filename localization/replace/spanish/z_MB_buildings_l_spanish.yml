 building_siro_b_sh_tp_08_desc: "#color_dark_gray Estas Rutas Comerciales:#!\n[siro_trade_value|E]: @supply_icon!#P +800\n\n#color_gray Los puestos comerciales son un establecimiento o asentamiento donde se pueden intercambiar bienes y servicios. La ruta [siro_sahara|E] comerciaba enormes cantidades de oro de África subsahariana a cambio de sal."
 building_siro_b_sigiriya_01: "Sigiriya"
 building_siro_b_sigiriya_01_desc: "En el 477 d.C., Kashyapa I, el hijo del rey de una consorte no real, tomó el trono del rey Dhatusena. El heredero legítimo, Moggallana, temiendo por su vida, huyó al sur de India. Temiendo un ataque de Moggallana, Kashyapa trasladó la capital y su residencia de la tradicional capital de Anuradhapura a la más segura Sigiriya. Durante el reinado del rey Kashyapa, Sigiriya se desarrolló en una ciudad y fortaleza compleja. La mayoría de las elaboradas construcciones en la cima de la roca y a su alrededor, incluidas las estructuras defensivas, palacios y jardines, datan de este período."
