 building_type_white_horse_temple_01: "Templo del Caballo Blanco"
 building_type_white_horse_temple_01_desc: "El Templo del Caballo Blanco fue construido en el año 68 d.C. y es considerado el templo budista más antiguo de China. Su nombre proviene de una leyenda en la que el emperador Ming de la dinastía Han del Este soñó con un caballo blanco que llevaba sagrados textos budistas de la India. Desde entonces ha desempeñado un papel crucial en la difusión del budismo a lo largo del imperio."
