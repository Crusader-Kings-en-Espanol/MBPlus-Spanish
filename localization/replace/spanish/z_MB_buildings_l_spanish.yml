#Sprawl
 building_type_prambanan_temple_01: "Templo de Prambanan"
 building_type_prambanan_temple_01_desc: "El Templo de Prambanan está dedicado a la Trimūrti, las deidades hindúes Brahma, Vishnu y Shiva, y es uno de los templos hindúes más grandes del sudeste asiático. El diseño del templo se basa en el Vastu Shastra tradicional, la arquitectura del hinduismo. El complejo mayor se divide en tres zonas: Bhurloka, que representa el reino de mortales y demonios; Bhuvarloka, que representa el reino medio de personas santas y dioses menores; y Svarloka, que representa el reino más alto y sagrado, con la cúspide del templo, el Ratna de Prambanan, que simboliza la indestructibilidad."
 building_prambanan_temple_01: "$building_type_prambanan_temple_01$"
 building_prambanan_temple_01_desc: "$building_type_prambanan_temple_01_desc$"
 building_type_borobudur_temple_01: "Templo de Borobudur"
 building_type_borobudur_temple_01_desc: "El Templo de Borobudur, compuesto por nueve plataformas apiladas, coronadas por numerosas estupas y paneles que representan la vida de Buda, es icónico en Indonesia. El diseño en forma de mandala sigue la arquitectura budista javanesa, que fusiona los conceptos javaneses de culto a los ancestros y el Nirvana budista. La base piramidal escalonada sirve como recordatorio de las moradas montañosas de los espíritus ancestrales, y las tres divisiones representan la cosmología budista: el reino de los deseos en la base, el reino de las formas en el medio y en la cúspide, el reino sin forma."
 building_borobudur_temple_01: "$building_type_borobudur_temple_01$"
 building_borobudur_temple_01_desc: "$building_type_borobudur_temple_01_desc$"
 building_type_bamberg_cathedral_01: "Catedral de Bamberg"
 building_type_bamberg_cathedral_01_desc: "El fuego de las velas de Pascua consumió las dos primeras catedrales de Bamberg, pero aquí se erige un edificio mayor, de cuatro torres y de esplendor. Su construcción comenzó en estilo románico y pasó al estilo gótico en su última fase de construcción.\n\nEn una cripta subterránea, una tumba esculpida en mármol espera."
 building_bamberg_cathedral_01: "$building_type_bamberg_cathedral_01$"
 building_bamberg_cathedral_01_desc: "$building_type_bamberg_cathedral_01_desc$"
 current_date_above_1200_trigger: "La fecha actual está más allá del siglo XIII."
 building_type_greek_academy_01: "Academia Platónica"
 building_type_greek_academy_01_desc: "Fundada por Platón, la Academia de Atenas persistió durante el período helenístico como un centro de aprendizaje y filosofía griega. Miembros notables de la academia incluyen a Speusipo, Jenócrates, Aristóteles, Heráclides, Eudoxo de Cnido y Heráclides Póntico."
 building_greek_academy_01: "$building_type_greek_academy_01$"
 building_greek_academy_01_desc: "$building_type_greek_academy_01_desc$"
 building_type_knossos_ruins_01: "Palacio de Cnosos"
 building_type_knossos_ruins_01_desc: "Una de las ciudades más antiguas de Europa, Cnosos eventualmente se convirtió en el centro ceremonial y político de la antigua civilización minoica, ahora una sombra de su antiguo esplendor. En las leyendas griegas, el rey Minos de antaño habitaba el palacio, constructor del laberinto que contenía al legendario Minotauro."
 building_knossos_ruins_01: "$building_type_knossos_ruins_01$ Ruinas"
