 building_type_sea_salt_mines_01: "Minerías de Sal"
 building_type_sea_salt_mines_01_desc: "Esta área es rica en sal mineral, un recurso valioso para la conservación de alimentos."
 building_sea_salt_mines_01: "Asentamiento de Minería de Sal"
 building_sea_salt_mines_01_desc: "Un pequeño asentamiento minero ha surgido cerca de donde se encuentran los depósitos de sal. Los colonos han comenzado a tallar y extraer la sal, pero hasta ahora solo están raspando la superficie."
 building_sea_salt_mines_02: "Minería de Sal"
 building_sea_salt_mines_02_desc: "A medida que el asentamiento crece, se está extrayendo cada vez más sal. La afluencia de ingenieros competentes permite la construcción de una mina real."
 building_sea_salt_mines_03: "Gran Mina de Sal"
 building_sea_salt_mines_03_desc: "A medida que las operaciones mineras crecen, también lo hacen las minas mismas. Se construyen más entradas y se excavan grandes pozos para permitir la extracción desde lo profundo bajo la superficie."
 building_sea_salt_mines_04: "Complejo de Minería de Sal"
 building_sea_salt_mines_04_desc: "A medida que la producción de sal aumenta, también lo hacen las necesidades de los trabajadores. Se construyen grandes almacenes tanto para la sal como para los suministros, se amplían más los pozos mineros y se proporciona más agua para combatir la deshidratación. La mina y sus riquezas son famosas en todo el mundo conocido."
 building_type_sea_tea_plantation_01: "Plantación de Té"
 building_type_sea_tea_plantation_01_desc: "Las colinas en esta área cultivan un arbusto de hojas, apreciado por sus propiedades medicinales cuando se consume como bebida."
