########################################################################################################################MB


 tradition_sardinian_name: "Barbagiana"
 tradition_sardinian_desc: "Esta cultura tiene una larga historia de ser ferozmente independiente, definida por su resistencia a los invasores extranjeros. La dinámica de sus reinos giraba en torno a un monarca todopoderoso cuya autoridad y legitimidad descansaban en el apoyo popular de sus ciudadanos, ciudadanos que también formaban la base militar del reino como soldados voluntarios y profesionales."

########################################################################################################################BAP Traditions
 #This is also traditions BAP edited from Tenets to Doctrines


 tradition_joking_relationships_name: "Relaciones de broma"
 tradition_joking_relationships_serer_pulaar_name: "Maasir"
 tradition_joking_relationships_bozo_kibsi_name: "Mangu"
 tradition_joking_relationships_serer_pulaar_desc: "Maasir es el término para un tipo tradicional de [joking_relationships|E] entre los pueblos Serer y Fulbe. Aunque estas relaciones son ligeras, la profunda naturaleza de estos lazos culturales, a menudo relacionados con historias de amistad entre figuras recordadas con cariño de la historia de una cultura, puede desempeñar un papel significativo en la resolución de conflictos entre individuos. No sea que uno rompa el vínculo forjado por sus ancestros."
 tradition_joking_relationships_bozo_kibsi_desc: "Mangu es el término para un tipo tradicional de [joking_relationships|E] entre los pueblos Bozo y Kibsi (actualmente Dogon). Aunque estas relaciones son ligeras, la profunda naturaleza de estos lazos culturales, a menudo relacionados con historias de amistad entre figuras recordadas con cariño de la historia de una cultura, puede desempeñar un papel significativo en la resolución de conflictos entre individuos. No sea que uno rompa el vínculo forjado por sus ancestros."

 bap_scheme_interaction_tt_befriend_approved: "En África Occidental, algunas culturas comparten lo que se llama una [joking_relationship|E]. Caracterizadas por bromas amistosas o insultos, las relaciones de broma pueden ser una fuente potencial de gran humor y diversión entre individuos, así como una excelente manera de hacer amigos rápidamente con miembros de nuestra cultura prima. Basándome en esto, ¡me ayudará a ganar la amistad de [recipient.GetShortUIName]!"
 culture_parameter_joking_culture_befriend_access: "Los personajes de esta [culture|E] tienen acceso libre a la [GetScheme('befriend').GetTypeName] [scheme|E] con [characters|E] de una [culture|E] selecta con la que tienen una [joking_relationship|E]:"
 culture_parameter_joking_culture_befriend_access_serer: "Los personajes de la [culture|E] Fulɓe tienen acceso libre a la [GetScheme('befriend').GetTypeName] [scheme|E] con [characters|E] de la [culture|E] Serer"
 culture_parameter_joking_culture_befriend_access_pulaar: "Los personajes de la [culture|E] Serer tienen acceso libre a la [GetScheme('befriend').GetTypeName] [scheme|E] con [characters|E] de la [culture|E] Fulɓe"
 culture_parameter_joking_culture_befriend_access_bozo: "Los personajes de la [culture|E] Bozo tienen acceso libre a la [GetScheme('befriend').GetTypeName] [scheme|E] con [characters|E] de la [culture|E] Kibsi"
 culture_parameter_joking_culture_befriend_access_kibsi: "Los personajes de la [culture|E] Kibsi tienen acceso libre a la [GetScheme('befriend').GetTypeName] [scheme|E] con [characters|E] de la [culture|E] Bozo"

 game_concept_joking_relationship: "Relación de broma"
 game_concept_joking_relationships: "Relaciones de broma"
 game_concept_joking_relationship_possessive: "Relación de broma de"
 game_concept_joking_relationships_possessive: "Relaciones de broma de"
 game_concept_joking_relationship_desc: "Una [joking_relationship|E] es una forma ritualizada y única de broma entre individuos de diferentes clanes de culturas. En África Occidental, este tipo de relación existe a nivel intra-clan, así como inter-cultural. En cualquiera de los casos, esta relación de broma a menudo consiste en bromas amistosas o insultos sobre la cultura/clan del otro con quien se comparte una relación. Aunque estas relaciones son ligeras, la profunda naturaleza de estos lazos culturales, a menudo relacionados con historias de amistad entre figuras recordadas con cariño de la historia de una cultura, puede desempeñar un papel significativo en la resolución de conflictos entre individuos. No sea que uno rompa el vínculo forjado por sus ancestros."

 tradition_gbeto_name: "Guerreros Gbeto"
 tradition_gbeto_desc: "Los precursores de las temibles Mino de Dahomey o Amazonas de Dahomey, los [gbeto|E] son un grupo de mujeres cazadoras que se especializan en cazar los animales más valiosos y difíciles de matar, el elefante. Las [gbeto|E] especialmente feroces, valientes o hábiles también pueden servir en el ejército, como soldados o incluso generales."
 culture_parameter_can_designate_gbeto: "[characters|E] pueden nombrar a mujeres elegibles como guerreras [gbeto|E]. Las mujeres que se unen a las filas de las [gbeto|E] pueden servir como [knights|E] o [marshal|E] independientemente de los [gender_doctrines|E]."
 culture_parameter_unlock_chief_gbeto_title: "Desbloquea el título de Corte de la Jefa Gbeto."
 court_position_gbeto_trait: "[GetTrait('shieldmaiden').GetName( ROOT.Char )]"

 tradition_savanna_raiders_name: "Saqueadores de tierras secas"
 tradition_savanna_raiders_desc: "Esta cultura ha dominado el uso de la caballería ligeramente armada para atacar al enemigo con fuerza y luego retirarse a través de las llanuras abiertas con el botín a cuestas."
 culture_parameter_savanna_raider: "Desbloquea la habilidad de [raid|E] independientemente del tipo de [government|E] o [religion|E]."

 tradition_sahel_pastoralists_name: "Pastores del Sahel"
 tradition_sahel_pastoralists_desc: "Esta cultura se siente como en casa en el amplio y abierto terreno del Sahel, donde pastorean grandes grupos de animales."
 culture_in_dryland_or_desert_terrain_percentage_desc: "La [culture|E] no tiene #V 60%#! de sus [counties|E] en terreno de tierras secas [terrain|E], terreno desértico [terrain|E] o la [GetGeographicalRegion('custom_sahel_proper').GetName] [region|E]."

 tradition_eldership_name: "Gerontocracia"
 tradition_eldership_desc: "Esta cultura venera la posición de los ancianos dentro de la comunidad, enfatizando sobre todo la importancia de la edad y la experiencia al nombrar líderes y tomadores de decisiones. Las culturas que practican la Gerontocracia pueden presentar consejos de ancianos que pueden servir como árbitros o como electores para la clase terrateniente local."
 culture_parameter_mz_eldership_powerful_vassal_adjustment: "[powerful_vassals|E] ya no demandan posiciones en el [council|E] mientras tengan menos de 50 años."
 culture_parameter_mz_eldership_increase_skills: "Probabilidad de mejorar [skills|E] en cada cumpleaños a partir de los 50 años."
 culture_parameter_mz_eldership_councilor_bonus: "[rulers|E] reciben #P 4%#! de [piety|E] mensual por cada [councillor|E] de 50 años o más."
 mz_eldership_increase_skill_toast: "Sabiduría de Anciano"
 mz_eldership_councilor_bonus_modifier: "Consejero Anciano"

 tradition_bush_schools_name: "Escuelas de arbusto"
 tradition_bush_schools_desc: "Esta cultura cría a sus hijos en asociaciones de género segregadas por grupos de edad que se centran en habilidades tradicionales de arbusto, medicina, educación sexual y valores culturales tradicionales. A medida que los niños crecen, son inductados aún más en Sociedades Secretas centradas en la instrucción sobre el conocimiento tradicional y la religión."

 tradition_culture_conversion_name: "Adopción Cultural"
 tradition_culture_conversion_desc: "Esta cultura practica la adopción cultural ritualizada, absorbiendo a forasteros dispuestos como miembros plenos de la cultura madre, ya sea como niños o adultos, e integrándolos en las estructuras y tradiciones socioculturales de la cultura madre."
 culture_parameter_cultural_adoption_acceptance: "[characters|E] de esta [culture|E] pueden adoptar diferentes [courtiers|E] culturales en su familia y cultura."
 culture_parameter_easier_adult_cultural_conversion: "[characters|E] de esta [culture|E] encontrarán más fácil convertir culturalmente a los vasallos."
 #tradition_gadaa_name: "Gadaa"
 #tradition_gadaa_desc: "This culture prides itself on its egalitarian principles, and seeking to minimise power struggles between its clans regulates its political, economic, social and religious activities through elected assemblies, in a system collectively known as Gadaa."

 tradition_mande_hunters_name: "Donzo Ton"
 tradition_mande_hunters_desc: "Esta cultura ha organizado fraternidades de cazadores (Donzo) conocidas como Donzo Tɔn. Reverenciados por sus vecinos agricultores o pastores como poseedores de poder, sabiduría y fuerza especiales, los hijos de los Donzow (plural de Donzo) son criados en asociaciones de grupos de edad segregados por género que se enfocan en habilidades tradicionales de caza y bush, medicina y valores culturales tradicionales. A medida que los niños crecen, son inductidos en Sociedades Secretas centradas en la instrucción de la sabiduría tradicional y la religión. A lo largo de los siglos, debido a su destreza marcial y supuestas habilidades mágicas, los Donzow han formado una parte fundamental de los primeros ejércitos entre los pueblos Mande y, en consecuencia, también una poderosa facción dentro de la emergente sociedad civil de muchos reinos Mande."
 culture_parameter_unlock_maa_mande_hunter: "Puede reclutar [GetMaA('mande_hunter').GetName] como [men_at_arms|E]"

 tradition_sacred_rulership_name: "Reyes Sacerdotes"
 tradition_sacred_rulership_desc: "En esta cultura existe un sistema de Realeza Sagrada donde el gobernante y sus descendientes son vistos como íntimamente conectados con lo divino, y en algunos casos como descendientes de los propios dioses. En esta tradición, el papel de rey no es solo ser el cabeza del reino, sino también una figura religiosa altamente ceremonial, en cierto sentido, un objeto sagrado en sí mismo."

 tradition_way_of_the_thiedo_name: "Camino de los Thiédo"
 tradition_way_of_the_thiedo_desc: "Como miembros vitales de la clase guerrera dentro de la sociedad tradicional Wolof, los Thiédo valoran altamente las tradiciones marciales de honor y valentía, y a veces son implacables en su defensa tenaz de la cultura y religión tradicionales Wolof. Un Thiédo preferiría luchar hasta la muerte que dejar atrás a un compañero guerrero."

 tradition_griots_name: "Griots"
 tradition_griots_desc: "Los griots son conocidos en toda África Occidental bajo varios nombres, incluyendo jeli en las áreas del norte de Mande, jali en las áreas del sur de Mande, guewel en Wolof, gawlo en Pulaar, arokin en yorùbá, y gesere en soninke. Usualmente de casta baja, el lugar del griot en la sociedad de África Occidental es una combinación de historiador, narrador, cantor de alabanzas, poeta y músico."
 culture_parameter_can_appoint_court_griots: "Puede nombrar [courtier|E] para el #alto $court_griot_court_position$#! [court_position|E]"
 culture_parameter_characters_are_better_court_griots: "[characters|E] de esta [culture|E] rinden mejor cuando son nombrados para el #alto $court_griot_court_position$#! [court_position|E]"
 culture_parameter_invite_griot_active: "Gana un [decision|E] para reclutar a un [griot|E] hábil"
 culture_parameter_griot_trait_more_common: "El [GetTrait('griot').GetName( GetNullCharacter )] [trait|E] es más común"

 tradition_laawol_pulaaku_name: "Laawol Pulaaku"
 tradition_laawol_pulaaku_desc: "Central en el estilo de vida del pueblo Fulɓe es un código de conducta conocido como Laawol Pulaaku, que significa literalmente el Camino Pullo. Este código se transmite de generación en generación como altos valores morales de los Fulɓe, permitiendo que esta cultura mantenga su identidad a través de fronteras y cambios de estilo de vida."
 culture_parameter_semteende_traits_less_valued: "[GetTrait('wrathful').GetName( GetNullCharacter )], [GetTrait('arrogant').GetName( GetNullCharacter )], y [GetTrait('impatient').GetName( GetNullCharacter )] [traits|E] son considerados semteende, o vergonzosos."
 culture_parameter_pulaaku_trait_bonuses: "[GetTrait('brave').GetName( GetNullCharacter )] y [GetTrait('humble').GetName( GetNullCharacter )] [traits|E] son vistos como [prestige_i][prestigious|E] y otorgan un aumento en la misma [culture|E] [opinion|E]."
 #Land of the Bow
 culture_parameter_nile_hill_forts: "Para [counties|E] de esta [culture|E] $building_type_hill_forts_01$#! reemplazar $building_type_watchtowers_01$ cuando estén en llanuras aluviales [terrain|E]."

 #Parameters
 requires_tribal_government_trigger: "No tienes [tribal_government|E]"

 #Credit to More Traditions
 tradition_imperial_court_name: "Corte Imperial"
 tradition_imperial_court_desc: "Esta cultura se enorgullece de una corte vibrante y diversa. Solo aquellos que pueden ver la belleza pueden heredar."
 tradition_abstract_philosophy_name: "Filosofía Abstracta"
 tradition_abstract_philosophy_desc: "Esta cultura cree que lo esotérico es el dominio de lo divino."
 tradition_mercenary_bands_name: "Bandas Mercenarias"
 tradition_mercenary_bands_desc: "Los mercenarios son una parte esencial de la historia militar de esta cultura y regularmente complementan las fuerzas dedicadas del gobernante."
 tradition_historians_name: "Historiadores"
 tradition_historians_desc: "Esta cultura ya está en su apogeo, con familias bien establecidas que proporcionan liderazgo."
 culture_parameter_can_write_epic: "[rulers|E] pueden encargar Épicos"
 tradition_free_cities_name: "Ciudades Libres"
 tradition_free_cities_desc: "Esta cultura tiene una orgullosa tradición de ciudades charteradas que son inusualmente autónomas y libres para desarrollarse como deseen."

 # Triple lines.
 not_communal_egalitarian_or_bureaucratic_desc: "La [culture|E] no tiene el $ethos_communal_name$, $ethos_egalitarian_name$ o $ethos_bureaucratic_name$[ethos|E]"

 #BAP GUANCHE Traditions
 tradition_guanche_warrior_name: "Cichiciquitzo"
 tradition_guanche_warrior_desc: "#F El Cichiciquitzo formó la clase guerrera de los Guanche. Hábiles en lanzar proyectiles y emboscadas en desfiladeros, están ligeramente armados pero son hábiles escaramuzadores. El Cichiciquitzo defenderá el terreno montañoso de sus islas hasta la muerte.#!"


########################################################################################################################RoA


 tradition_angkorian_architecture_name: "Arquitectura Angkoriana"
 tradition_angkorian_architecture_desc: "Esta cultura considera que construir templos es el camino más directo hacia lo divino. Se espera que los gobernantes fervientes construyan muchos templos, y grandiosos."

 tradition_migratory_name: "Migratorio"
 tradition_migratory_desc: "Los pueblos de esta cultura están acostumbrados a empacar sus cosas y marcharse en un momento."

 tradition_confucian_philosophy_name: "Pensamiento Confuciano"
 tradition_confucian_philosophy_desc: "la "
 culture_parameter_unlock_bureaucracy_param: "Desbloquea el tipo de gobierno [chinese_government|E]."

 tradition_walled_villages_name: "Pueblos Amurallados"
 tradition_walled_villages_desc: "Esta cultura ha desarrollado un tipo único de estructura habitacional que se asemeja a algo entre un pueblo y un castillo. Tiene varios pisos, con una sola entrada y sin ventanas en el nivel del suelo, lo que la hace extremadamente defensible."

 tradition_underground_cities_name: "Ciudades Subterráneas"
 tradition_underground_cities_desc: "Esta cultura ha esculpido vastas cavernas interconectadas en las montañas de Capadocia durante siglos. Estas cavernas son tan extensas que, en verdad, son más como ciudades subterráneas. Altamente defensibles, a menudo están llenas de trampas y otras sorpresas aterradoras que esperan a cualquier ejército lo suficientemente imprudente como para atacarlas."

 culture_parameter_enable_baray_duchy_building: "Los gobernantes pueden construir el #alto $building_type_baray_01$#! [duchy_building|E]"
 culture_parameter_enable_migration_cb: "[rulers|E] tienen un [casus_belli|E] de Migración, lo que les permite abandonar su territorio por nuevas tierras una vez por vida."

 building_type_baray_01: "Baray"
 building_type_baray_01_desc: "Un baray es un cuerpo de agua artificial, útil para irrigar campos. Un gran baray también puede simbolizar el Océano de Creación hindú, mostrando la riqueza y piedad del constructor."
 building_baray_01: "Srah"
 building_baray_01_desc: "Un gran pero simple reservorio, excavado en el suelo y revestido con piedra. Almacena agua dulce y proporciona un pequeño refugio de paz y confort."
 building_baray_02: "Tanque Sagrado"
 building_baray_02_desc: "Las obras de piedra se elevan sobre el suelo, almacenando una gran cantidad de agua. El baray está rodeado de una multitud de árboles y flores."
 building_baray_03: "Lago Sagrado"
 building_baray_03_desc: "El baray se extiende varios kilómetros en cada lado y en el centro se erige un templo. Cualquiera puede usarlo, y los visitantes que lo contemplan dicen que pueden sentir el toque de lo divino."

 not_communal_courtly_or_bureaucratic_desc: "La [culture|E] no tiene el $ethos_communal_name$, $ethos_courtly_name$ o $ethos_bureaucratic_name$ [ethos|E]"

 # MAA
 luojuzi: "Luojuzi"
 luojuzi_flavor: "#F Los Luojuzi están equipados con escudos y picas. Los mejores de los mejores, son feroces y valientes en la batalla, nunca osando retirarse.#!"
 tradition_tiger_sons_name: "Hijos del Tigre"
 tradition_tiger_sons_desc: "Aquellos que están dispuestos a empuñar la espada y luchar por su cultura son dignos de admiración. Sin importar las probabilidades."
 culture_parameter_unlock_maa_luojuzi: "Puede reclutar [GetMaA('luojuzi').GetName] como [men_at_arms|E]"

 artamat: "Athamat"
 artamat_flavor: "#F Los guerreros Athamat son conocidos por sus rápidos, violentos e impredecibles ataques, capaces de contener a múltiples oponentes a la vez.#!"
 tradition_krabi_krabong_name: "Krabi-Krabong"
 tradition_krabi_krabong_desc: "Krabi-krabong es el antiguo arte marcial de los pueblos Tai. Enfatizando técnicas de espada y bastón, nuestros guerreros pueden defenderse más que adecuadamente en cualquier campo de batalla."
 culture_parameter_unlock_maa_tai: "Puede reclutar [GetMaA('artamat').GetName] como [men_at_arms|E]"

 bokator: "Nayar"
 bokator_flavor: "#F Los Nayar son una casta guerrera entrenada no solo en las artes marciales, sino también en cómo engañar y distraer a sus enemigos.#!"
 tradition_warrior_caste_name: "Casta Guerrera"
 tradition_warrior_caste_desc: "Nuestra gente ha desarrollado un estilo de lucha único inspirado en deidades hindúes y las bestias de la naturaleza. Labokatoa es extremadamente versátil y sus técnicas son un valioso recurso para nuestros soldados."
 culture_parameter_unlock_maa_khmer: "Puede reclutar [GetMaA('bokator').GetName] como [men_at_arms|E]"

 tradition_thalassocratic_name: "Talasocrático"
 tradition_thalassocratic_desc: "Esta cultura tiene poco interés en gobernar sobre áreas interiores. Para ellos, el verdadero poder radica en aprovechar los mares."
 culture_parameter_thalassocratic_coastal_holdings: "Los [holdings|E] costeros en [counties|E] de esta [culture|E] proporcionan un adicional #P +[EmptyScope.ScriptValue('thalassocratic_coastal_holdings_value_tt')|0]%#! [gold_i][tax|E]"
 culture_parameter_thalassocratic_non_coastal_holdings: "Los [holdings|E] no costeros en [counties|E] de esta [culture|E] proporcionan #N [EmptyScope.ScriptValue('thalassocratic_non_coastal_holdings_value_tt')|0]%#! menos [gold_i][tax|E]"

 tradition_disloyal_subjects_name: "Fiercemente Independientes"
 tradition_disloyal_subjects_desc: "Estas personas tienen una fuerte tradición de autogobierno y se oponen firmemente a cualquier forma de dominio jerárquico."
 culture_parameter_allow_adopting_anarchism: "Permite adoptar [anarchist_government|E]"

 convert_to_feudalism_liege_converted_decision_feudal_desc: "Cambiar el tipo de [government|E] convirtiéndose en [feudal|E]"
 convert_to_feudalism_liege_converted_decision_mandala_desc: "Cambiar el tipo de [government|E] formando un [mandala|E]"
 convert_to_feudalism_liege_converted_decision_clan_desc: "Cambiar el tipo de [government|E] convirtiéndose en [clan|E]"

 convert_whole_realm_to_feudalism_decision_feudal_tooltip: "Cambiar el tipo de [government|E] adoptando [feudalism|E]"
 convert_whole_realm_to_feudalism_decision_mandala_tooltip: "Cambiar el tipo de [government|E] formando un [mandala|E]"
 convert_whole_realm_to_feudalism_decision_clan_tooltip: "Cambiar el tipo de [government|E] convirtiéndose en [clan|E]"

 tradition_balbals_name: "Estelas Kurgan"
 tradition_balbals_desc: "Estas personas tienen una tradición de esculpir y colocar estelas de piedra conocidas como \"balbals\" en y alrededor de montículos funerarios rituales conocidos como \"kurgans.\""

 tradition_steppe_confederations_name: "Confederaciones de la Estepa"
 tradition_steppe_confederations_desc: "Esta cultura proviene de una tradición de confederaciones sueltas de nómadas de la estepa, en gran medida unificados contra enemigos extranjeros, pero de otro modo altamente autónomos."
 culture_parameter_has_steppe_alliances: "Puede proponer dos [alliances|E] sin un [marriage|E] con otros gobernantes"

 tradition_sinicized_culture_name: "Cultura Sinizada"
 tradition_sinicized_culture_desc: "Esta cultura ha forjado fuertes lazos con $e_celestia_china$ y ha adoptado elementos de la cultura y lengua chinas, mientras mantiene su propia distintividad cultural."

 tradition_soot_faced_councils_name: "Consejos de Rostros Sucios"
 tradition_soot_faced_councils_desc: "Cuando esta cultura marcha a la guerra, sus mejores líderes se reúnen con hollín negro pintado en sus rostros, planificando sus campañas a través de una discusión igualitaria."
 culture_parameter_unlock_maa_iron_buddhas: "Puede reclutar [GetMaA('iron_buddhas').GetName] como [men_at_arms|E]"

 tradition_horses_like_clouds_name: "Banderas del Río Negro"
 tradition_horses_like_clouds_desc: "Banderas del Tangut del Río Negro."

 #Not localized in RoA. I dunno what to use for a description but it's better than nothing at all

 sumpitan: "Sumpitan"
 sumpitan_flavor: "#F Estos guerreros utilizan cerbatanas para disparar dardos envenenados a sus enemigos, un arma altamente efectiva en combate en la jungla.#!"
 tradition_jungle_warfare_name: "Guerra en la Jungla"
 tradition_jungle_warfare_desc: "Esta cultura ha dominado el arte de combatir en la densa jungla, utilizando tácticas de guerrilla y dardos envenenados con gran efectividad."
 culture_parameter_unlock_maa_sumpitan: "Puede reclutar [GetMaA('sumpitan').GetName] como [men_at_arms|E]"

 cam_quan: "Cœm Quân"
 cam_quan_flavor: "#F Estas tropas de élite normalmente guarnicionan fuertes, pero también pueden defenderse en el campo de batalla.#!"
 tradition_people_of_the_red_river_name: "Pueblo del Río Rojo"
 tradition_people_of_the_red_river_desc: "El pueblo de esta cultura vive y muere para defender sus tierras. Este es su hogar, y nadie ni nada se lo quitará."
 culture_parameter_unlock_maa_cam_quan: "Puede reclutar [GetMaA('cam_quan').GetName] como [men_at_arms|E]"

 tradition_nasrani_partition_name: "Deber del Más Joven"
 tradition_nasrani_partition_desc: "Desde hace mucho tiempo es una tradición del pueblo siríaco que el hogar sea heredado por el heredero más joven, mientras que los hermanos mayores reciben una porción del hogar."
 culture_parameter_can_enact_nasrani_partition_succession_law: "Puede promulgar la #alta $nasrani_partition_law$#! [succession_law|E]"
 malabar_christian_population_desc: "Menos del #V 10%#! de los [culture|E]'s [counties|E] son $christianity_religion_adj$"
 nasrani_succession_not_christian_tt: "No eres [GetReligionByKey('christianity_religion').GetAdjective]"
 # Traditions
 tradition_caste_system_name: "Sistema de Castas"
 tradition_caste_system_desc: "Este sistema de castas indio está integrado en la sociedad en todos los niveles. Existen los cuatro Varnas y los numerosos Jati que se entrelazan y conforman la naturaleza compleja del Sistema de Castas. Su rigidez puede aumentar y disminuir, pero su presencia siempre está ahí y es el pilar de la sociedad para esta cultura."

 tradition_tamil_thai_name: "Tamiltay"
 tradition_tamil_thai_desc: "El idioma tamil ocupa un lugar especial en el corazón del pueblo tamil. Los tamil se enorgullecen de su literatura y poesía, que se remontan al antiguo período Sangam."


 ########################################################################################################################CE


 # Traditions
 tradition_ghazi_name: "Gazíes"
 tradition_ghazi_desc: "Ghazi es una palabra de origen árabe, derivada de ghazā - 'incursionado' o 'declarado la guerra', que designa a aquellos musulmanes que han jurado luchar contra los no creyentes en la religión islámica. En la cultura beduina preislámica, el ghazw era una forma de guerra limitada que rozaba el bandidaje, evitando enfrentamientos directos y enfatizando más bien el saqueo y el pillaje, generalmente de ganado. Tras su conversión y las primeras conquistas musulmanas, los ghāzīs islámicos asaltaron regularmente a lo largo de la frontera bizantina, encontrando en los akritoi griegos y armenios a su némesis.\n\nPara el siglo IX, las expediciones árabes lanzadas contra Bizancio desde la zona fronteriza habían asumido gradualmente un carácter casi ritual y estaban estrictamente organizadas. Según Qudama ibn Ja'far (un erudito siríaco y administrador del Califato Abasí), el patrón convencional de las incursiones árabes incluía una primera expedición en primavera, cuando los caballos podían encontrar forraje abundante, seguida después de aproximadamente un mes de descanso por un asalto de verano, generalmente la campaña principal del año, y a veces por un asalto invernal. La importancia de estas incursiones se resume en las palabras del erudito islámico Hugh N. Kennedy: 'el ṣāʿifa (asalto de verano) era tanto parte de las funciones simbólicas y rituales del Califato como lo era organizar y proporcionar liderazgo para el hajj anual a La Meca'."

 tradition_ep3_roman_pride_name: "Orgullo romano"
 tradition_ep3_roman_pride_desc: "Somos los Rhōmaîoi, romanos no solo de nombre, sino también por derecho y convicción. Desde las costas del Adriático hasta los salones de mármol de Constantinopla y las montañas de Anatolia, nuestro pueblo mantiene vivo el legado de Roma. Aunque los bárbaros de Occidente nos llamen «griegos», seguimos siendo los verdaderos herederos de los césares y guardianes de su derecho, su fe y su civilización."

 tradition_roman_pride_name: "Orgullo Romano"
 tradition_roman_pride_desc: "La exclusividad y el orgullo de los bizantinos se reflejaban en la palabra que utilizaban para describirse a sí mismos. Ellos y solo ellos eran los Rhōmaîoi, los verdaderos romanos; y cada ciudadano, de cualquier raza - griego, armenio o eslavo, era consciente de su derecho a llamarse 'Rhomaios'.\n\nSer un Romaios no significaba pertenecer a una nación. Más bien, significaba pertenecer al mundo - compuesto por un Imperio y una Iglesia, gobernados por un solo Emperador que sobrevivió a las tormentas de las invasiones bárbaras y al colapso de las provincias occidentales, y que vivir fuera de él era una gran desgracia que la Providencia algún día rectificaría.\n\nPara ellos, su Emperador era el elegido de Dios, coronado y protegido por el Padre Celestial. Su persona era sagrada y gobernaba desde el Palacio Sagrado en la Reina de las Ciudades como regente de Dios en la tierra - él era la imagen terrenal del Logos de Dios reinando sobre el reflejo terrenal del Reino de los Cielos. El Imperio no era, como los reinos o principados de la antigüedad, un fenómeno temporal que algún día llegaría a su fin. Era un reino previsto en el plan del Creador, anclado en la escatología cristiana, orgánicamente involucrado en la historia milenaria de la humanidad y destinado a perdurar hasta la Segunda Venida. Aquellos que pretendían desafiar o ignorar este esquema divinamente ordenado de las cosas eran culpables de una forma de herejía."

 tradition_karabisianoi_name: "Karabisianoi"
 tradition_karabisianoi_desc: "La marina bizantina era un componente único y esencial del Imperio Romano Oriental. Al igual que el imperio al que servía, era una continuación directa de su predecesor romano imperial, pero desempeñó un papel mucho mayor en la defensa y supervivencia del estado que su iteración anterior. Mientras que las flotas del Imperio Romano unificado enfrentaron pocas grandes amenazas navales, operando como una fuerza de policía enormemente inferior en poder y prestigio a las legiones, el mar se volvió vital para la existencia misma del estado bizantino, que varios historiadores han denominado un 'imperio marítimo'."

 tradition_eastern_roman_law_name: "Derecho Romano Oriental"
 tradition_eastern_roman_law_desc: "Como continuación del Imperio Romano, Constantinopla heredó la mayoría de sus instituciones políticas del periodo romano imperial tardío. Del mismo modo, el derecho romano constituyó la base del sistema legal romano oriental. Durante muchos siglos, las dos grandes codificaciones llevadas a cabo por Teodosio II y Justiniano respectivamente, fueron las piedras angulares de su legislación. Por supuesto, a lo largo de los años, estos códigos del temprano derecho romano oriental fueron ajustados a las circunstancias actuales de la época y luego reemplazados por nuevas codificaciones escritas en griego, como se observa con los Basilika de León VI, que fueron creados para simplificar y adaptar el Corpus Juris Civilis de Justiniano.\n\nAunque la estructura del derecho romano oriental había mantenido en gran medida un cuerpo constitucional romano, las principales diferencias del derecho romano oriental con respecto a su contraparte romano imperial se pueden encontrar tanto en la aplicación como en la interpretación del Derecho. En lugar de ver la Ley como una aplicación de la justicia misma, el Derecho Romano Oriental estaba sujeto y se aplicaba bajo principios en gran medida cristianos que desarrollaron un sistema legal que fomentaba interpretaciones más maleables de la ley de acuerdo con la filantropía y la evergetia - actuando por el bienestar y beneficio de la población en lugar de por la correcta estructuración de la sociedad."

 tradition_veche_name: "Veche"
 tradition_veche_desc: "Veche era una asamblea popular en los países eslavos medievales. En Novgorod y en Pskov, donde el veche adquirió gran prominencia, el veche era similar al thing nórdico o a la Landsgemeinde suiza. Se piensa que el veche eslavo oriental se originó en las asambleas tribales de Europa del Este, precediendo así al estado de Rus'. Las menciones más antiguas del veche en las crónicas de Europa del Este se refieren a ejemplos en Belgorod Kievsky en 997, Novgorod en 1016, Kiev en 1068, y en Pskov en 1123. Las asambleas consistían en todos los hombres adultos de la población y discutían asuntos de guerra y paz, adoptaban leyes y hacían acuerdos con sus gobernantes o los expulsaban e invitaban a otros a tomar su lugar. En Kiev, el veche se convocaba frente a la Catedral de Santa Sofía."

 tradition_rashidun_army_name: "Legado de los Rashidun"
 tradition_rashidun_army_desc: "El ejército Rashidun fue el núcleo de las fuerzas armadas del Califato Rashidun durante las primeras conquistas musulmanas en el siglo VII. Se informa que el ejército mantenía un alto nivel de disciplina, destreza estratégica y organización, lo que les otorgó victorias sucesivas en sus diversas campañas. En su tiempo, el ejército Rashidun fue una fuerza muy poderosa y efectiva, sirviendo como un componente clave en la expansión territorial del Califato Rashidun y como un medio para la temprana difusión del Islam en los territorios que conquistó. Aunque mucho ha cambiado desde las primeras conquistas musulmanas, el legado de esta poderosa fuerza permanece con nosotros hasta el día de hoy."

 tradition_pagan_protectors_name: "Guardianes de la Fe"
 tradition_pagan_protectors_desc: "Jurados a defender los santuarios terrenales de nuestros dioses paganos, estos guerreros no muestran piedad a aquellos que buscan profanar nuestros templos o santuarios. Montando altos corceles, cualquier enemigo que se aventure dentro del alcance de la Guardia de los Dievas seguramente verá desgarrados pedazos de carne de su cuerpo por sus brutales tridentes de guerra, mientras que los Elegidos de Giltine sirven como una infantería bien equipada, ya que sus armas largas son efectivas tanto contra enemigos a pie como montados."

 tradition_sasanian_army_name: "Legado del Imperio Sasánida"
 tradition_sasanian_army_desc: "El ejército sasánida fue el principal cuerpo militar del Imperio Sasánida que se remonta al ascenso de Ardashir I (r. 224–241), el fundador del Imperio Sasánida, al trono. Ardashir aspiraba a la revitalización del Imperio Persa, y para avanzar en este objetivo, reformó el ejército formando un ejército permanente que estaba bajo su mando personal. Restauró las organizaciones militares aqueménidas, retuvo el modelo de caballería parta y empleó nuevos tipos de armaduras y técnicas de guerra de asedio. Este fue el comienzo de un sistema militar que le sirvió a él y a sus sucesores durante más de 400 años, durante los cuales el Imperio Sasánida fue, junto con el Imperio Romano y luego el Imperio Romano Oriental, uno de los dos superpoderes de la Antigüedad Tardía en Eurasia Occidental. Aunque el Imperio Sasánida ha caído, su memoria permanece con nosotros y sirve como modelo para nuestras fuerzas hasta el día de hoy."

 tradition_teulu_name: "Teulu"
 tradition_teulu_desc: "Los 'teulu' eran la guardia personal de los jefes galeses. Seguían una tradición común en otras sociedades anglosajonas y germánicas de la época, en la que los compañeros cercanos y los retenedores del señor o rey luchaban junto a él en batalla con lealtad y habilidad inquebrantables. De esta manera, son análogos a los compañeros de hogar de los sajones y a los housecarls de los daneses y anglosajones. Teulu significa literalmente 'familia', lo que implica el estrecho vínculo que compartían con su señor. Montando a la batalla llevando lanzas y escudos, vestidos de cota de malla, eran en muchos aspectos muy parecidos a los primeros caballeros. En el campo de batalla, eran visiblemente similares, cargando contra sus enemigos con lanza o pica en nombre de su señor."

 tradition_barbary_corsairs_name: "Corsarios de Berbería"
 tradition_barbary_corsairs_desc: "Aunque la práctica de la piratería y las incursiones siempre había plagado el Mediterráneo, los estados costeros berberiscos pudieron enriquecerse enormemente a expensas de sus vecinos europeos. Tales incursiones fueron un verdadero dolor de cabeza para los gobernantes italianos, franceses e ibéricos, tanto que los normandos sicilianos invadieron el norte de África en 1135, y en 1390, una expedición militar conjunta franco-génovesa emprendió la cruzada de Berbería."

 tradition_almogavars_name: "Almogávares"
 tradition_almogavars_desc: "Los almogávares, aunque inicialmente se usaban para identificar pequeños grupos armados de sarracenos que participaban en saqueos y ataques sorpresivos, llegaron a referirse a una clase de soldado de infantería ligera del Reino de Aragón que se utilizó en las fases posteriores de la Reconquista, durante los siglos XIII y XIV. Los almogávares estaban levemente vestidos, eran rápidos y se movían como hombres del frente y soldados de infantería. Procedían del Reino de Aragón, el Principado de Cataluña, el Reino de Valencia, la Corona de Castilla y el Reino de Portugal. Al principio, estas tropas estaban formadas por campesinos y pastores provenientes del campo, los bosques y las áreas montañosas fronterizas que no podían usar sus valles en invierno porque habían sido ocupadas. Para poder seguir sobreviviendo, estos pastores tuvieron que organizarse en bandas de forajidos y penetrar en el dominio enemigo en busca de lo que su pueblo necesitaba para sobrevivir. Después de muchas generaciones de llevar este nuevo tipo de vida al que habían sido empujados por los invasores, parece claro que un genuino espíritu guerrero se formó en estas comunidades de pastores, que fue utilizado por los reinos ibéricos cristianos. A lo largo de los siglos siguientes, los almogávares llegarían a ser considerados una de las mejores infanterías de su época."

 tradition_mamluk_military_name: "Militar Mameluco"
 tradition_mamluk_military_desc: "Los mamelucos eran soldados esclavos militares, comprados, entrenados y equipados para luchar en nombre del gobernante, así como para realizar tareas administrativas. Desde el gobierno de los Tuluníes, también se emplearon junto a soldados de infantería esclavos de Sudán, que tienen una larga historia de servicio a las dinastías árabes gobernantes en el mundo musulmán."

 tradition_irish_cliathairi_name: "Cliathairi"
 tradition_irish_cliathairi_desc: "Los cliathairi eran los 'guardias' profesionales alrededor de un rey, que formaban la columna vertebral de un ejército en la guerra gaélica de la Irlanda medieval, habiendo elegido el servicio militar como carrera. Estos soldados profesionales eran a menudo empleados por terratenientes como una defensa asequible contra bandidos. Cuando eran convocados por jefes o reyes durante tiempos de guerra, estos soldados son una de las pocas unidades en el ejército irlandés entrenadas en el uso efectivo de la lanza larga. En batalla, serían acompañados por Ridire - caballeros de herencia gaélica noble que eran muy respetados en la sociedad irlandesa. Favoreciendo una lanza ligera y una maza, llenarían el nicho entre la caballería ligera y pesada."

 tradition_damascus_steel_name: "Acero de Damasco"
 tradition_damascus_steel_desc: "El acero de Damasco era el acero forjado de las hojas de las espadas trabajadas en el Cercano Oriente a partir de lingotes de acero Wootz. Estas espadas se caracterizan por patrones distintivos de bandas y manchas que recuerdan al agua fluyendo, a veces en un patrón de 'escalera' o 'rosa'. Se decía que tales hojas eran resistentes, resistentes a la fractura y capaces de ser afiladas a un borde afilado y resistente."

 tradition_toledo_steel_name: "Acero de Toledo"
 tradition_toledo_steel_desc: "El acero de Toledo, conocido históricamente por su alta calidad y durabilidad inusualmente alta, proviene de Toledo, España, que ha sido un centro tradicional de fabricación de espadas y trabajo del metal desde aproximadamente la época romana. Las técnicas de forjado del acero de Toledo se desarrollaron a partir de costumbres españolas antiguas y se utilizaron para forjar muchos tipos diferentes de armas a lo largo de muchos siglos. En términos simples, la técnica del acero de Toledo consistía en una hoja de acero que envolvía una tira de hierro forjado, evitando así que el acero se doblara o agrietara. Así, se decía que las armas de acero de Toledo, fuertes y duraderas, tenían un 'alma de hierro'. Al final de la Reconquista, Toledo era considerada el mayor centro de fabricación de espadas del mundo."

 tradition_barb_horses_name: "Caballos Barb"
 tradition_barb_horses_desc: "El caballo Barb es una raza del norte de África con gran resistencia y resistencia, y generalmente posee un temperamento ardiente. Estos valiosos sementales llevaron a los feroces invasores berberiscos durante la conquista de al-Andalus y se convirtieron en una piedra angular de las fuerzas montadas de élite de la península ibérica y más allá."

 tradition_nile_agriculture_name: "Agricultura del Nilo"
 tradition_nile_agriculture_desc: "El río Nilo fluye de sur a norte a través del este de África. Comienza en los ríos que desembocan en el lago Nalubaale y desemboca en el mar Mediterráneo más de 6,600 kilómetros al norte, lo que lo convierte en uno de los ríos más largos del mundo. El suelo del delta del Nilo, entre El Qâhira (El Cairo) y el mar Mediterráneo, es rico en nutrientes, gracias a los grandes depósitos de sedimentos que el Nilo deja atrás al fluir hacia el mar. Las orillas del Nilo a lo largo de su vasta longitud también contienen suelo rico, gracias a las inundaciones anuales que depositan sedimentos. Durante miles de años, gran parte de los alimentos de Egipto se han cultivado en la región del delta del Nilo. Los antiguos egipcios desarrollaron métodos de riego para aumentar la cantidad de tierras que podían utilizar para cultivos y sostener una población próspera. Se utilizan canales para llevar agua del Nilo para irrigar granjas y apoyar ciudades. Los frijoles, el algodón, el trigo y el lino eran cultivos importantes y abundantes que podían ser fácilmente almacenados e intercambiados."

 tradition_dzukijan_horsemen_name: "Jinetes Dzukijan"
 tradition_dzukijan_horsemen_desc: "Dzūkija, como una de las regiones más remotas de Lituania, es un excelente lugar para encontrar monturas fuertes y personas resistentes, y los jinetes dzukijan cumplen las expectativas en ambos aspectos. Usando un arco para enfrentarse al enemigo a distancia, estos jinetes buscan evitar el combate cuerpo a cuerpo, ya que a menudo luchan sin armadura."

 tradition_akritai_name: "akritai"
 tradition_akritai_desc: "El término Akritai se utilizó en el Imperio Bizantino en los siglos IX–XI para designar las unidades del ejército que protegían la frontera oriental del Imperio, enfrentándose a los estados musulmanes de Oriente Medio. Sus hazañas, embellecidas, inspiraron el 'épico nacional' bizantino de Digenes Akritas y el ciclo de las canciones acríticas. Estas eran infanterías ligeras reclutadas de armenios y de la población nativa bizantina. A finales del siglo X, la reconquista de gran parte del territorio en el Este significaba que a menudo estaban étnicamente y religiosamente mezclados, un hecho personificado por el legendario Digenes Akritas - 'digenes' significa 'de dos razas', es decir, 'romano' (bizantino/griego) y 'sarraceno'. Los Apelatai, cuyo papel y tácticas se describen en el De velitatione bellica de Nikephoros II Phokas, actuaban como asaltantes, exploradores y guardias fronterizos en la perpetua guerra fronteriza entre Bizancio y sus vecinos orientales, caracterizada por escaramuzas y raids. Además de la infantería ligera, las fuerzas fronterizas fueron complementadas por la caballería ligera llamada trapezitai. En caso de un importante raid árabe, se suponía que debían dar la alarma, ayudar en la evacuación de la población local a los diversos bastiones y seguir y hostigar a la fuerza enemiga hasta que llegaran refuerzos."

 tradition_portage_name: "Portage"
 tradition_portage_desc: "El portage (o portación) es la práctica de transportar embarcaciones o carga por tierra, ya sea alrededor de un obstáculo en un río o entre dos cuerpos de agua. Un camino donde se transportan regularmente artículos entre cuerpos de agua también se llama un portage. En los siglos VIII, IX y X, los comerciantes-adventureros vikingos aprovecharon una red de vías navegables en Europa del Este, con portages conectando los cuatro ríos más importantes de la región: el Volga, el Dvina Occidental, el Dnipro y el Don. Los portages de lo que ahora es Rusia fueron vitales para el comercio varangio con Oriente y Constantinopla. En los portages más importantes había puestos de comercio habitados por una mezcla de comerciantes nórdicos y población nativa. Los jazares construyeron la fortaleza de Sarkel para proteger un portage clave entre el Volga y el Don. Después de que el poder varangio y jazaro en Europa del Este disminuyera, los comerciantes eslavos continuaron utilizando los portages a lo largo de la ruta comercial del Volga y la ruta comercial del Dnipro."

 tradition_eyres_name: "Eyres"
 tradition_eyres_desc: "Un eyre o iter era el nombre de un circuito recorrido por un juez itinerante en la Inglaterra medieval (un juez en eyre), o el tribunal de circuito sobre el que presidían, o el derecho del monarca (o jueces actuando en su nombre) a visitar e inspeccionar las propiedades de cualquier vasallo. El eyre implicaba visitas e inspecciones a intervalos irregulares de las casas de los vasallos en el reino. El término se deriva del antiguo francés erre, del latín iter ('viaje'), y es afín a encargo y errante. También se celebraban eyres en aquellas partes de Irlanda bajo un control inglés seguro."

 tradition_assizes_ariano_name: "Assizes de Ariano"
 tradition_assizes_ariano_desc: "Las Assizes de Ariano fueron una serie de leyes para el Reino de Sicilia promulgadas en el verano de 1140 en Ariano, cerca de Benevento, por Roger II de Sicilia. Tras haber pacificado recientemente la península, constantemente en revuelta, decidió hacer un movimiento hacia un gobierno más centralizado. Las assizes establecieron la gran burocracia siciliana y buscaron mantener el sistema feudal bajo un estricto control real. Contenía cuarenta cláusulas que tocaban todos los posibles temas de preocupación legal contemporánea: propiedad privada, propiedad pública, la iglesia, derecho civil, finanzas reales y lo militar. El trabajo fue avanzado para su época, derivando sus preceptos no solo de teorías legales normandas y francesas, sino también musulmanas y romanas orientales (especialmente justinianas). Las assizes afirman que el rey es el único legislador en Sicilia, que es tanto juez como sacerdote (ya que posee los poderes legatarios del papa), y todos los sicilianos eran iguales y estaban bajo las mismas leyes, ya fueran latinos, griegos, normandos, lombardos, árabes, judíos o musulmanes. Castigaba la traición con la muerte. También se detallaba en otros crímenes de violencia: cobardía en la batalla, armar a una multitud, o retener apoyo del rey o sus aliados. Eclesiásticamente, los herejes cristianos y apóstatas perdían sus derechos. Se excusaba a los obispos de asistir a los tribunales, aunque se le otorgaba al rey la facultad de anular esto, como en todo, y no podía haber apelaciones. Militares, la clase caballeresca estaba cerrada. Nadie podía convertirse en caballero si no tenía linaje caballeresco. Finalmente, las assizes no ignoraron a los plebeyos y exigieron que se les tratara con justicia y no se les impusiera cargas indebidamente por sus señores."

 tradition_pravda_russkaya_name: "Pravda Russkaya"
 tradition_pravda_russkaya_desc: "Pravda Rusĭskaya (Justicia Rus' o Verdad Rus') fue el código legal de la Rus' de Kiev y los posteriores principados rusos durante los tiempos de división feudal. Fue escrito a principios del siglo XII y reformulado durante muchos siglos. La base de la Pravda Rusĭskaya, la Pravda de Yaroslav, fue escrita a principios del siglo XI. La Pravda Rusĭskaya fue una fuente principal del Derecho Ruso Antiguo. Las regulaciones legales de la Pravda Rusĭskaya reflejaron la evolución de las relaciones sociales en la Rus' de los siglos XI al XIII. El derecho común, la legislación del Knyaz y los procedimientos legales representaron la base de la Pravda Rusĭskaya. También reflejó las relaciones sociales que eran comunes entre otras naciones eslavas cercanamente relacionadas, como los croatas y los croatas blancos, y desde un periodo aproximadamente del mismo tiempo, el Estatuto de Poljica en Croacia emergió, que es notablemente similar en contenido a la Pravda Rus'skaya."

 tradition_outremer_armies_name: "Ejércitos del Exterior"
 tradition_outremer_armies_desc: "Durante casi noventa años, entre la fundación del Reino de Jerusalén y la derrota del ejército cristiano en Hattin en julio de 1187, los ejércitos de 'Exterior' fueron sustanciales, sorprendentemente efectivos y nominalmente feudales. La supervivencia de los Estados Cruzados depende casi en su totalidad de sus capacidades militares, y como tal, se espera que todos los vasallos menores de 60 años sirvan montados y completamente armados siempre que sean convocados por el Rey de Jerusalén."

 tradition_mudejar_art_name: "Arte Mudéjar"
 tradition_mudejar_art_desc: "El arte mudéjar, también conocido como estilo mudéjar, se refiere a un tipo de ornamentación y decoración utilizado en los reinos cristianos ibéricos, principalmente entre los siglos XIII y XVI. Se aplicó a los estilos arquitectónicos románico, gótico y renacentista, incorporando elaborados diseños geométricos y patrones como motivos constructivos, ornamentales y decorativos derivados de los que se habían traído o desarrollado en la Iberia islámica o Al-Ándalus. Se cree que comenzó con artesanos musulmanes que aplicaron elementos constructivos, ornamentales y decorativos tradicionales derivados de las artes islámicas a los estilos arquitectónicos cristianos. Estos métodos se convirtieron en parte de las tradiciones locales de construcción cristiana y se aplicaron a los estilos arquitectónicos románico, gótico y renacentista en los reinos cristianos en expansión de Iberia. Estas técnicas decorativas incluían caligrafía, geometría intrincada y formas vegetales derivadas del arte y la arquitectura islámicos."

 tradition_exechequer_name: "Tesorería"
 tradition_exechequer_desc: "La Tesorería, que recibió su nombre de una mesa utilizada para realizar cálculos de impuestos y bienes en la época medieval, era una oficina gubernamental responsable de recaudar ingresos y hacer pagos en nombre del soberano, auditar cuentas oficiales y juzgar casos legales relacionados con los ingresos. Se desconoce exactamente cuándo se estableció la Tesorería, pero la primera mención aparece en un escrito real de 1110 durante el reinado del rey Enrique I. Oficinas similares se crearon más tarde en Normandía alrededor de 1180, en Escocia alrededor de 1200 y en Irlanda en 1210."

 tradition_fatimid_royal_guard_name: "Guardia Real"
 tradition_fatimid_royal_guard_desc: "Tenemos una larga tradición de un ejército permanente hecho para proteger la capital y su soberano. Esto nos ha dado acceso a soldados duros que trabajan bien con tropas de apoyo. Esto incluye a los Khassaki, que son las propias tropas de élite del sultán. Con los mejores caballos y equipos, los Khassaki son ferozmente leales y son las únicas tropas a las que se les permite portar armas en todo momento. Además de las tareas ceremoniales, estos guerreros endurecidos se encargan de proteger al sultán durante las campañas, así como a menudo asumir las misiones o tareas más importantes dentro del ejército del sultán. La segunda unidad central de la guardia es la Tabardariyya, que protege al sultán y al palacio. Están armados con un gran hacha, 'tabar', similar a un hacha escandinava tradicional. Estas tropas de élite, bien armadas y blindadas, también son formidables en el campo de batalla."

 tradition_islamic_furusiyya_name: "Furūsiyya"
 tradition_islamic_furusiyya_desc: "Furūsiyya es el término histórico árabe para el ejercicio marcial caballeresco durante la Edad Media, particularmente durante las Cruzadas y el período mameluco, especialmente centrado en las artes marciales y la equitación de la Edad de Oro del Islam. El cuerpo de literatura arabo-persa 'Furūsiyya' incluye el género Faras-nāma, que es una recopilación enciclopédica de datos relacionados con los caballos.\n\nFue un concepto y un arte noble que incluía las artes de la guerra y la caza, la equitación, la táctica y la estrategia, y ciertos juegos como el ajedrez. Este arte fue practicado en todo el mundo musulmán y alcanzó su mayor logro en el Egipto mameluco durante el siglo XIV. Fue parte de un fenómeno regional más amplio de Eurasia occidental que incluyó la caballería europea de la época.\n\nSin embargo, furūsiyya también parece haber retenido un significado más amplio de 'el ethos continuo del esfuerzo masculino del Islam temprano', comparable a la noción contemporánea europea de caballería. La furūsiyya islámica y la caballería europea se influyeron mutuamente como un código de guerreros para los caballeros de ambas culturas."

 tradition_kulgrinda_name: "Kūlgrindos"
 tradition_kulgrinda_desc: "Kūlgrinda (del samogitiano kūlis 'piedra' y grinda 'pavimento', derivado de grįsti 'rastrillar, reunir') es un camino o vado oculto bajo el agua hecho de piedras o madera a través de pantanos y áreas pantanosas utilizado para la defensa en la historia de Lituania. Caminos secretos similares hechos principalmente de madera y tierra eran conocidos como medgrinda (de medis, 'árbol') y žemgrinda (de žemė, 'tierra').\n\nIndetectables desde la superficie, estos caminos eran generalmente conocidos solo por los lugareños y, como tal, eran un elemento importante de la defensa contra varios invasores, incluidos los Caballeros Teutónicos en los siglos XIII-XIV. Las kūlgrindas proporcionaban un atajo seguro entre aldeas, fortificaciones y otras estructuras defensivas. Se construían llevando piedras, madera o grava sobre pantanos congelados en invierno y dejándolos hundirse una vez que el hielo se derretía. Este procedimiento se repetía varias veces. A veces se insertaban postes de madera para proteger el área elevada de ser arrastrada."

 tradition_professional_army_name: "Ejército Profesional"
 tradition_professional_army_desc: "Esta cultura renuncia a la idea de convocar a las masas no entrenadas para luchar en sus guerras, prefiriendo desplegar una fuerza más pequeña, pero altamente entrenada y bien equipada."

 tradition_military_engineering_name: "Ingeniería Militar"
 tradition_military_engineering_desc: "Esta cultura se ha dedicado al estudio del diseño y construcción de fortificaciones militares más efectivas y armas de guerra. Desafortunadamente para cualquiera que se oponga a ellos, este conocimiento también les brinda una gran comprensión sobre cómo derribar cualquier estructura que se interponga en su camino."

 tradition_fierce_independence_name: "Migrantes Vláquios"
 tradition_fierce_independence_desc: "Los Vlachs han sido durante mucho tiempo un pueblo nómada compuesto por pastores y arrieros, sin importarles mucho los poderes que atraviesan sus tierras. Es decir, hasta que uno de esos poderes intente controlarlos, momento en el que pronto aprenderá que los Vlachs no se dejan controlar fácilmente."

 tradition_african_agriculture_name: "Irrigación Ifriqiyán"
 tradition_african_agriculture_desc: "Una vez llamada 'el granero del imperio', el norte de África (también conocido como Ifriqiya) fue uno de los mayores exportadores de grano durante la época del Imperio Romano. El grano no era el único producto de la región, con otros cultivos que incluían frutas, higos, uvas y frijoles. Esto se lograba mediante la construcción y el mantenimiento de sistemas de irrigación a gran escala alimentados principalmente por acueductos que recolectaban y transportaban agua por toda la región. Aunque gran parte de la infraestructura de irrigación sufrió tras el declive de la África romana y el reino vándalo, la conquista islámica del norte de África devolvió una medida de estabilidad que permitió que la región floreciera una vez más. Bajo dinastías islámicas como los aglabíes, se realizaron mejoras extensas en las obras de agua preexistentes para promover los olivares y otros tipos de agricultura, irrigar jardines reales y para el ganado. Los acueductos romanos para abastecer de agua a las ciudades fueron reconstruidos, ampliados y replicados en todo Ifriqiya. En la región de Kairuán se construyeron cientos de estanques para almacenar agua para la cría de caballos."

 tradition_merc_armies_name: "Ejércitos Contratados"
 tradition_merc_armies_desc: "¿Por qué arriesgar la vida y la integridad de nuestra propia gente cuando somos perfectamente capaces de contratar a otros para que lo hagan por nosotros? Es mucho mejor contratar a los llamados 'soldados profesionales' para que hagan nuestra lucha mientras nosotros nos enfocamos en lo que realmente es importante."

 tradition_norman_traditions_name: "Sangre del Norte"
 tradition_norman_traditions_desc: "Los normandos son conocidos tanto por su cultura, como su singular arquitectura románica y tradiciones musicales, como por sus importantes logros e innovaciones militares. Aventureros normandos participaron en la fundación del Reino de Sicilia bajo Roger II, después de conquistar brevemente el sur de Italia y Malta de los sarracenos y bizantinos, y una expedición en nombre de su duque, Guillermo el Conquistador, condujo a la conquista normanda de Inglaterra en la histórica Batalla de Hastings en 1066. Las fuerzas normandas y anglo-normandas contribuyeron a la Reconquista ibérica desde principios del siglo XI hasta mediados del siglo XIII.\n\nLa influencia cultural y militar normanda se extendió desde estos nuevos centros europeos a los estados cruzados del Cercano Oriente, donde su príncipe Bohemond I fundó el Principado de Antioquía en el Levante, a Escocia y Gales en Gran Bretaña, a Irlanda y a las costas del norte de África y las Islas Canarias. El legado de los normandos persiste hoy a través de las lenguas y dialectos regionales de Francia, Inglaterra, España, Quebec y Sicilia, y también a través de los diversos arreglos culturales, judiciales y políticos que introdujeron en sus territorios conquistados."

