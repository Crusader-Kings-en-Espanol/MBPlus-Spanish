 tradition_RICE_children_of_the_nile_name: "Hijos del Nilo"
 tradition_RICE_children_of_the_nile_desc: "#F El Nilo es el corazón de Egipto, la tierra es su cuerpo, y la gente es su sangre. Las claras aguas del precioso Nilo están llenas de vida, como siempre lo han estado desde los días de los faraones. Otros pueden no entender verdaderamente el Nilo, pero la gente de esta cultura sabe que mientras el Nilo permanezca, Egipto también perdurará.#!"
 RICE_culture_along_the_nile_desc:1 "La [culture|E] no tiene al menos #V 4#! [counties|E] a lo largo del [GetGeographicalRegion('RICE_nile_river_valley').GetName]"
 not_bureaucratic_spiritual_or_communal_desc:1 "La [culture|E] no tiene la [ethos|E] $ethos_bureaucratic_name$, $ethos_spiritual_name$ o $ethos_communal_name$ "
 culture_parameter_unlock_rice_decision_nile_flood_results:1 "Desbloquea las [activities|E] [GetActivityType('activity_RICE_upper_egypt_open_nile_canals').GetName] y [GetActivityType('activity_RICE_upper_egypt_pray_good_nile_flood').GetName], dependiendo de los resultados de la [nile_flood|E]"
 culture_parameter_unlock_rice_decision_build_nilometers:1 "Desbloquea la decisión Renovar Nilómetros Locales [decision|E]"
 culture_parameter_unlimited_chinir_festival:1 "Puede tomar la [decision|E] para $RICE_pamir_attend_chinir_festival$ en cualquier lugar"
 culture_parameter_cheaper_pamir_watchtower_decision:1 "Los costes de tomar las [decisions|E] para [repair_the_pamir_watchposts|E] del Corredor de Wakhan y las Montañas Karakorum se reducen en #P -25% #!"
 tradition_RICE_beyond_the_reach_of_eagles_name:1 "Más Allá del Alcance de las Águilas"
 tradition_RICE_beyond_the_reach_of_eagles_desc:1 "Los antiguos llamaban a los Pamir y el Hindu Kush, la tierra natal de esta cultura, una tierra 'más allá del alcance de las águilas', porque se dice que ni siquiera los pájaros pueden volar sobre estas altas cumbres. Sin embargo, estas tribus fracturadas no solo subsisten en estas montañas: perduran, prosperan, viven y han creado para sí mismas una sociedad vibrante."
 tradition_RICE_galician_portuguese_poetry_name: "Lírica Gallego-Portuguesa"
 tradition_RICE_galician_portuguese_poetry_desc: "#F Los poetas de esta cultura suelen usar la variante gallego-portuguesa del idioma romance ibérico al componer poesía lírica. Las cantigas son el estilo característico de canción entre estos poetas.#!"
 tradition_RICE_forest_suppliers_name: "Proveedores de Productos del Bosque"
 tradition_RICE_forest_suppliers_desc: "Esta cultura no solo es experta en utilizar la abundancia de los bosques para sí misma, sino que también se especializa en saber qué productos forestales serían deseables para los mercados extranjeros. Así, obtienen buenos beneficios suministrando estos productos forestales a los forasteros."
 tradition_RICE_wendish_confederations_name: "Confederaciones Wendish"
 tradition_RICE_wendish_confederations_desc: "Esta cultura eslava occidental ha estado tradicionalmente dividida por varias confederaciones políticas que consisten en varias tribus. Estas confederaciones traen riqueza a sus tribus constituyentes, que luchan contra los forasteros y enemigos como uno solo, siempre y cuando no se peleen entre ellos."
 
 tradition_sanseong_name: "Sanseong"
 tradition_sanseong_desc: "Sanseong (산성) significa «fortaleza de montaña» en coreano. Estas fortificaciones, levantadas en laderas y cumbres, protegían poblaciones y controlaban pasos estratégicos. Algunas, como Namhansanseong y Sangdang Sanseong, han perdurado hasta nuestros días."
 tradition_RICE_african_mud_masons_name: "Mamposteros de Barro"
 tradition_RICE_igwebuike_name: "Igwebuike"
 tradition_RICE_kinship_based_craft_guilds_name: "Gremios de Artesanía Basados en Clanes"
 tradition_RICE_ritual_hegemony_name: "Hegemonía Ritual"
 tradition_RICE_silk_road_name: "Pueblos de la Ruta de la Seda"
