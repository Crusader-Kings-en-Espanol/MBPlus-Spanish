 tradition_armenian_resilience_name: "Resiliencia Armena"
 tradition_armenian_resilience_desc: "Los armenios han soportado el ascenso y la caída de muchos imperios y pueblos. A lo largo de los siglos, su resiliencia les ha permitido mantener un fuerte sentido de identidad y prácticas culturales. Esa resiliencia ha llevado a la formación de un pueblo fiel y orgulloso, decidido a prosperar en un mundo en constante cambio."

 tradition_tabari_isolation_name: "Aislamiento Tabarí"
 tradition_tabari_isolation_desc: "Separado del resto de Irán por la cordillera del Alborz, Tabaristán ha permanecido como una región ferozmente independiente donde las tradiciones iraníes de antaño se mantienen vivas.\n\nHabiendo adaptado a su terreno boscoso y montañoso, los tabarí están listos para preservar o recuperar su independencia de conquistadores extranjeros en cualquier momento."

 tradition_qiqaniyya_name: "Qiqāniyya"
 tradition_qiqaniyya_desc: "Conocidos por sus habilidades en la arquería, los Jats de Kaikan han logrado repeler a los invasores extranjeros durante siglos. Cuando los árabes comenzaron a asaltar Sindh desde el siglo VII, hasta su eventual conquista de Kaikan en el siglo IX, muchos Jats fueron capturados y llevados a Irak, donde terminarían sirviendo como los arqueros de élite de..."


