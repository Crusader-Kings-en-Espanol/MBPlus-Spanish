l_spanish:

 # CULTURE DEFINITIONS AND GLOSSARY

 ANATOLIA_GLOSS: "La turquificación de Anatolia comenzó con la victoria selyúcida en Manzikert en 1071, lo que provocó oleadas de migración turcomana desde Asia Central hacia la península en manos bizantinas. Estos pueblos túrquicos, principalmente tribus oguzes, se fusionaron gradualmente con las poblaciones anatolias locales, incluidos griegos, armenios y otros pueblos indígenas. El proceso se aceleró bajo el Sultanato de Rum, con el turco convirtiéndose en la lengua dominante y la cultura islámica mezclándose con las tradiciones anatolias existentes. Esta fusión cultural creó una identidad turco-anatolia distintiva, diferente tanto de sus orígenes centroasiáticos como de los pueblos con los que se encontraron, caracterizada por una síntesis única de influencias túrquicas, persas y bizantinas."
 BULGARIAN_GLOSS: "Los búlgaros se volvieron semisedentarios durante el siglo VII en la estepa póntico-caspia, estableciendo el estado de la Vieja Gran Bulgaria hacia el 630-635, que fue derrotado por el Imperio Jázaro en el año 668. En 681, el kan Asparuh conquistó Escitia Menor, abriendo el acceso a Mesia, y estableció la Bulgaria del Danubio, el Primer Imperio Búlgaro, donde los búlgaros se convirtieron en una élite política y militar. Posteriormente se fusionaron con las poblaciones bizantinas ya establecidas, así como con tribus eslavas previamente asentadas, y terminaron eslavizándose, convirtiéndose así en uno de los antepasados de los búlgaros modernos."
 EGPYTIAN_GLOSS: "Antes de las conquistas islámicas, los árabes habían habitado durante siglos la península del Sinaí, el desierto oriental y el delta oriental. Estas regiones de Egipto eran conocidas colectivamente como «Arabia» por los historiadores y escritores contemporáneos que las documentaron. Varios reinos árabes preislámicos, como el reino cedarita, se extendían hacia estas regiones. Inscripciones y otros restos arqueológicos, como cuencos con inscripciones que identifican a reyes cedaritas e inscripciones árabes nabateas, confirman la presencia árabe en la región. Egipto fue conquistado a los romanos por el califato ortodoxo en el siglo VII d. C. El idioma copto, escrito con la variante copta del alfabeto griego, se hablaba en la mayor parte de Egipto antes de la conquista islámica. Sin embargo, el árabe ya se hablaba en los confines orientales de Egipto durante siglos antes de la llegada del islam. Para la época mameluca, ya se había producido la arabización de la población egipcia, junto con un cambio de la religión mayoritaria del cristianismo al islam."
 LECHITIC_GLOSS: "«Tribus polacas» es un término utilizado a veces para describir a las tribus léquitas eslavas occidentales que vivieron desde mediados del siglo VI en los territorios que se volvieron polacos con la creación del estado polaco por la dinastía Piast. El territorio en el que vivían pasó a formar parte del primer estado polaco creado por el duque Mieszko I, y se expandió a finales del siglo X, ampliándose aún más con las conquistas del rey Boleslao I a principios del siglo XI.\n\nHacia el año 850 d. C., el Geógrafo Bávaro escribió una lista de pueblos. En ella no aparecen los polanos, pomeranios y masovios de habla léquita, que se dieron a conocer más tarde y sobre los que escribió Néstor el Cronista en su Crónica Primaria (siglos XI/XII).\n\nLas tribus más importantes conquistadas por los polanos fueron los masovios, vístulos, silesios y pomeranios. Estas cinco tribus «compartían una cultura y una lengua fundamentalmente comunes, y estaban considerablemente más emparentadas entre sí que las tribus germánicas»."
 LEVANTINE_GLOSS: "En vísperas de la conquista del Levante por el califato ortodoxo, en el año 634 d. C., la población de Siria hablaba principalmente arameo y albergaba a pueblos arameos como los asirios y sirios, además de otros pueblos nativos como judíos, samaritanos y cristianos; el griego era el idioma oficial de la administración. La arabización e islamización de Siria comenzó en el siglo VII, y tomó varios siglos para que el islam, la identidad árabe y la lengua se extendieran; los árabes del califato no intentaron difundir su lengua o religión en los primeros periodos de la conquista, y formaron una aristocracia aislada. Los árabes del califato acomodaron a muchas tribus nuevas en zonas aisladas para evitar conflictos con los locales; el califa Uthman ordenó a su gobernador, Muawiya I, asentar a las nuevas tribus lejos de la población original. Los sirios pertenecientes a confesiones monofisitas recibieron a los árabes peninsulares como libertadores.\n\nLos abasíes de los siglos VIII y IX buscaron integrar a los pueblos bajo su autoridad, y la arabización de la administración fue una de las herramientas empleadas. La arabización cobró impulso con el creciente número de conversos al islam; el ascenso del árabe como lengua formal del estado impulsó la asimilación cultural y lingüística de los sirios conversos. Quienes permanecieron cristianos también se arabizaron; fue probablemente durante el periodo abasí, en el siglo IX, cuando los cristianos adoptaron el árabe como primera lengua; la primera traducción de los evangelios al árabe tuvo lugar en ese siglo. Muchos historiadores, como Claude Cahen y Bernard Hamilton, han propuesto que la arabización de los cristianos se completó antes de la Primera Cruzada. Para el siglo XIII, la lengua árabe había alcanzado el dominio en la región y sus hablantes pasaron a ser considerados árabes."
 LOMBARD_GLOSS: "Los lombardos fueron un pueblo germánico que conquistó la mayor parte de la península itálica entre los años 568 y 774.\n\nEl historiador medieval lombardo Pablo Diácono escribió en la Historia de los lombardos (redactada entre 787 y 796) que los lombardos descendían de una pequeña tribu llamada winnili, que habitaba el norte de Germania antes de emigrar en busca de nuevas tierras. Historiadores romanos anteriores ya escribieron sobre los lombardos en el siglo I d. C. como uno de los pueblos suevos, también originarios de lo que hoy es el norte de Alemania, cerca del río Elba. Migraron hacia el sur, y a finales del siglo V los lombardos se habían asentado en un área que coincidía aproximadamente con la actual Austria y Eslovaquia, al norte del Danubio. Allí sometieron a los hérulos y, más tarde, libraron guerras frecuentes contra los gépidos. El rey lombardo Audoín derrotó al líder gépido Turisindo en el año 551 o 552, y el sucesor de Audoín, Alboino, terminó por destruir a los gépidos en el año 567. Los lombardos también se asentaron en Panonia (la actual Hungría). Cerca de Szólád, los arqueólogos han desenterrado tumbas de hombres y mujeres lombardos enterrados juntos como familias, algo inusual entre los pueblos germánicos de la época. También se han hallado rastros contemporáneos de griegos mediterráneos y un posible migrante procedente de Francia.\n\nTras la victoria de Alboino sobre los gépidos, este condujo a su pueblo hacia el noreste de Italia, que había quedado gravemente despoblado y devastado tras la larga Guerra Gótica (535-554) entre el Imperio bizantino y el Reino ostrogodo. Numerosos sajones, hérulos, gépidos, búlgaros, turingios y ostrogodos se unieron a los lombardos, y su invasión de Italia apenas encontró resistencia. Para finales del año 569, habían conquistado todo el norte de Italia y las principales ciudades al norte del río Po, salvo Pavía, que cayó en el año 572. Al mismo tiempo, ocuparon zonas del centro y sur de Italia. Establecieron un reino lombardo en el norte y centro de Italia, que alcanzó su apogeo bajo el gobernante del siglo VIII Liutprando. En el año 774, el reino fue conquistado por el rey franco Carlomagno e integrado en el Imperio franco. Sin embargo, la nobleza lombarda continuó gobernando el sur de la península itálica hasta bien entrado el siglo XI, cuando fueron conquistados por los normandos e incorporados al condado de Sicilia. En este período, la parte sur de Italia aún bajo dominio lombardo era conocida por los nórdicos como Langbarðaland ('tierra de los lombardos'), según consta inscrito en las runas nórdicas. Su legado también es evidente en el nombre de la región de Lombardía, en el norte de Italia."
 MAGHREBI_GLOSS: "Las migraciones árabes al Magreb consistieron en sucesivas oleadas de migración y asentamiento de pueblos árabes en la región magrebí del norte de África (con exclusión de Egipto), que abarca la actual Argelia, Libia, Marruecos y Túnez. El proceso se prolongó a lo largo de varios siglos, desde principios del siglo VII hasta el siglo XVII. Los migrantes árabes procedían de Oriente Medio, en particular de la península arábiga, con grupos posteriores llegados del Levante e Irak.\n\nLa afluencia de árabes al Magreb comenzó en el siglo VII con la conquista árabe del Magreb, cuando los ejércitos árabes conquistaron la región como parte de las primeras conquistas musulmanas. A esta primera oleada de migración árabe le siguieron nuevos períodos de migración y asentamiento, en particular durante los califatos omeya y abasí y bajo dinastías árabes posteriores. Sin embargo, la oleada más significativa de migración árabe se produjo en el siglo XI, con la llegada de más tribus beduinas procedentes de la península arábiga, como los banu hilal, los banu sulaym y los maqil. La última oleada significativa de migración árabe al Magreb procedió de al-Ándalus en el siglo XVII, como resultado de la Reconquista. Estos migrantes establecieron numerosos imperios y dinastías árabes en el Magreb, como los aglabíes, idrisíes, sulaimaníes, salihíes, fatimíes, saadíes y alauitas.\n\nLas migraciones árabes al Magreb tuvieron un profundo impacto en la demografía y la cultura de la región. Provocaron un importante crecimiento demográfico árabe, el desplazamiento forzado y la arabización de las poblaciones bereberes y púnicas, y la difusión de la lengua y la cultura árabes por toda la región. Los descendientes de los colonos árabes en el Magreb se conocen como árabes magrebíes."
 MOZARAB_GLOSS: "Los mozárabes (lit. 'arabizados'), o más precisamente los cristianos andalusíes, eran los cristianos de al-Ándalus, es decir, los territorios de Iberia bajo dominio musulmán entre los años 711 y 1492. Tras la conquista omeya del reino visigodo de Hispania, la población cristiana de gran parte de Iberia quedó bajo control musulmán.\n\nInicialmente, la gran mayoría de los mozárabes conservó el cristianismo y sus dialectos derivados del latín. Con el tiempo, la población se fue convirtiendo al islam —se estima que un 50% ya lo había hecho en el año 951— y se vio influida, en distintos grados, por las costumbres y el saber árabes, adquiriendo a veces con ello un mayor estatus social. Las variedades romances locales, con una importante aportación del árabe y habladas tanto por cristianos como por musulmanes, se conocen como romance andalusí o lengua mozárabe. Los mozárabes eran en su mayoría católicos del rito visigodo o mozárabe. Dado que la sharia y el fiqh eran de carácter confesional y solo se aplicaban a los musulmanes, los cristianos pagaban el impuesto de la yizia, la única obligación relevante bajo la ley islámica, y conservaban un derecho civil de raíz romana e influencia visigoda.\n\nLa mayoría de los mozárabes eran descendientes de cristianos locales y hablaban principalmente variedades romances bajo dominio islámico. También incluían a aquellos miembros de la antigua élite gobernante visigoda que no se convirtieron al islam ni emigraron hacia el norte tras la conquista musulmana. Los cristianos españoles retrataron inicialmente a los musulmanes principalmente como enemigos militares o políticos, pero con el tiempo el islam pasó a ser visto como una religión y no solo como una amenaza. Los cristianos españoles buscaron desalentar la apostasía del cristianismo y defender las creencias cristianas, pero se fueron vinculando cada vez más al dar al-Islam (tierra del islam) a través de una cultura, lengua e interacción compartidas.\n\nUnos pocos eran cristianos árabes y bereberes, junto con conversos musulmanes al cristianismo que, como hablantes de árabe, se sentían como en casa entre los mozárabes originales. Un ejemplo destacado de un musulmán que se convirtió en mozárabe al abrazar el cristianismo es el rebelde andalusí y líder militar antiomeya Umar ibn Hafsún. Los mozárabes de origen musulmán eran descendientes de aquellos musulmanes que se convirtieron al cristianismo tras la conquista de Toledo, y quizás también tras las expediciones del rey Alfonso I de Aragón. Estos mozárabes de origen musulmán, que se convirtieron en masa a finales del siglo XI —muchos de ellos muladíes (iberos étnicos previamente convertidos al islam)— son totalmente distintos de los mudéjares y moriscos, que se convirtieron gradualmente al cristianismo entre los siglos XII y XVII.\n\nEnclaves mozárabes independientes se ubicaban en las grandes ciudades musulmanas, especialmente Toledo, Córdoba, Zaragoza y Sevilla."
 NURAGIC_GLOSS: "La civilización nurágica, también conocida como cultura nurágica, se formó en la isla mediterránea de Cerdeña, Italia, durante la Edad del Bronce. Duró desde el siglo XVIII a. C. (Edad del Bronce Medio) hasta la Edad del Hierro, o hasta la colonización romana en el año 238 a. C. Otros datan la cultura hasta al menos el siglo II d. C., y en algunas zonas, concretamente en la Barbagia, hasta el siglo VI d. C., o posiblemente incluso hasta el siglo XI d. C. Cabe señalar, sin embargo, que la construcción de nuevos nuraghi ya se había detenido hacia el siglo XII-XI a. C., durante el Bronce Final."
 RUSNORSE_GLOSS: "La formación de la Rus' comenzó con la llegada de pueblos nórdicos, originarios en su mayoría de la actual Suecia, que se asentaron y gobernaron a lo largo de las rutas fluviales entre el mar Báltico y el mar Negro desde aproximadamente el siglo VIII hasta el XI d. C. Formaron un estado conocido en la historiografía moderna como la Rus de Kiev, que fue inicialmente una sociedad multiétnica en la que los gobernantes nórdicos se fusionaron y asimilaron con las tribus eslavas orientales, bálticas y fínicas, terminando con el eslavo oriental antiguo como lengua común."
 SICILIAN_GLOSS: "El término cultura normanda-árabe-bizantina, cultura normanda-siciliana o, de forma menos inclusiva, cultura normanda-árabe (a veces denominada «civilización árabe-normanda»), hace referencia a la interacción de las culturas normanda, bizantina griega, latina y árabe tras la conquista normanda del antiguo emirato de Sicilia y del norte de África, entre los años 1061 y aproximadamente 1250. La civilización resultó de numerosos intercambios en los ámbitos cultural y científico, basados en la tolerancia mostrada por los normandos hacia las poblaciones cristianas de habla latina y griega y hacia los antiguos colonos árabes musulmanes. Como resultado, Sicilia bajo los normandos se convirtió en un cruce de caminos para la interacción entre las culturas normanda y latina católica, bizantina-ortodoxa y árabe-islámica."
 SILESIAN_GLOSS: "El Ostsiedlung (lit. 'asentamiento oriental') es el término empleado para la migración altomedieval y plenomedieval de pueblos germánicos y la germanización de las áreas pobladas por pueblos eslavos, bálticos y urálicos; el área más colonizada se conocía como Germania Slavica. Los esfuerzos de germanización abarcaron partes orientales de Francia, Francia Oriental y el Sacro Imperio Romano Germánico, y más allá; así como las consecuencias para el desarrollo de los asentamientos y las estructuras sociales en las zonas colonizadas. También se colonizaron otras regiones, aunque con menor intensidad. El Ostsiedlung abarcó múltiples regiones modernas e históricas, principalmente Alemania al este de los ríos Saale y Elba, los estados de Baja Austria y Estiria en Austria, Polonia y la República Checa, pero también otras partes de Europa Central y Oriental.\n\nLa mayoría de los colonos del Ostsiedlung se desplazaron de forma individual, en esfuerzos independientes, en múltiples etapas y por diferentes rutas. Muchos colonos fueron animados e invitados por los príncipes y señores regionales locales, que a veces incluso expulsaban a parte de las poblaciones indígenas para hacer sitio a los colonos alemanes.\n\nGrupos más pequeños de migrantes se desplazaron primero hacia el este durante la Alta Edad Media. Las mayores expediciones de colonos, que incluían eruditos, monjes, misioneros, artesanos y menestrales, a menudo invitados en cantidades no verificables, se desplazaron por primera vez hacia el este a mediados del siglo XII. Las conquistas territoriales militares y expediciones punitivas de los emperadores otónidas y salios durante los siglos XI y XII no forman parte del Ostsiedlung, ya que estas acciones no dieron lugar a ningún asentamiento significativo al este de los ríos Elba y Saale. Se considera que el Ostsiedlung fue un fenómeno puramente medieval, ya que finalizó a comienzos del siglo XIV. Los cambios legales, culturales, lingüísticos, religiosos y económicos provocados por este movimiento tuvieron una profunda influencia en la historia de la Europa central oriental, entre el mar Báltico y los Cárpatos, hasta el siglo XX."
 SYROMESOP_GLOSS: "Antes de las conquistas islámicas, Mesopotamia estaba habitada predominantemente por pueblos de habla aramea, como los asirios y los mandeos, y por administradores persas bajo dominio sasánida. La región había sido el centro de numerosos imperios, incluidos los babilonios, asirios y persas, con el arameo sirviendo como lengua franca desde el primer milenio a. C. La conquista árabe a mediados del siglo VII d. C. trajo consigo oleadas de colonos árabes procedentes de la península, en particular durante el período omeya. La población nativa, que incluía importantes comunidades cristianas y zoroástricas, fue adoptando gradualmente la lengua y las costumbres árabes en los siglos siguientes. La fundación de Bagdad, cerca del antiguo emplazamiento de Babilonia, en el año 762, estableció una nueva capital imperial que se convertiría en el corazón de la Edad de Oro islámica hasta su caída ante los mongoles."
 TURCOPERSIAN_GLOSS: "La tradición turco-persa surgió de la fusión de las tradiciones militares y políticas túrquicas con las costumbres administrativas y culturales persas, a partir del siglo X. A medida que dinastías túrquicas como los gaznávidas y los selyúcidas establecían su dominio sobre Irán, adoptaron las costumbres, la lengua y las prácticas burocráticas persas, al tiempo que mantenían sus tradiciones militares túrquicas y sus organizaciones tribales. Esta síntesis distintiva se convirtió en el modelo cultural dominante en gran parte de Asia Central y del Sur, caracterizado por el persa como lengua de la administración y la literatura, las instituciones religiosas islámicas y las organizaciones militares túrquicas. La tradición turco-persa influyó profundamente en la formación de estados y el desarrollo cultural desde Anatolia hasta la India."
 VISIGOTHIC_GLOSS: "Los visigodos fueron un pueblo germánico unido bajo el mando de un rey y que vivió dentro del Imperio romano durante la Antigüedad tardía. Los visigodos aparecieron por primera vez en los Balcanes, como un grupo militar bárbaro aliado de Roma unido bajo el mando de Alarico I. Se cree que sus orígenes exactos fueron diversos, pero probablemente incluyeron a muchos descendientes de los tervingios que se habían adentrado en el Imperio romano a partir del año 376 y habían desempeñado un papel importante en la derrota de los romanos en la batalla de Adrianópolis en el año 378. Las relaciones entre los romanos y los visigodos de Alarico variaron, con ambos grupos firmando tratados cuando les convenía y guerreando entre sí cuando no. Bajo Alarico, los visigodos invadieron Italia y saquearon Roma en agosto del año 410.\n\nLos visigodos fueron posteriormente asentados en el sur de la Galia como foederati de los romanos, una relación que se estableció en el año 418. Esto se desarrolló hasta convertirse en un reino independiente con capital en Tolosa, y extendieron su autoridad a Hispania a expensas de los suevos y vándalos, que habían tomado el control de amplias extensiones de territorio romano. En el año 507, el dominio visigodo en la Galia terminó a manos de los francos bajo Clodoveo I, quien los derrotó en la batalla de Vouillé.\n\nEs dentro de lo que hoy son España y Portugal donde los visigodos crearon el estado por el cual mejor se les recuerda. Durante su gobierno de Hispania, los visigodos construyeron varias iglesias que perduraron y fundaron varias ciudades. Hacia el año 589, los visigodos bajo Recaredo I se convirtieron del cristianismo arriano al cristianismo niceno, adoptando gradualmente la cultura de sus súbditos hispanorromanos. Su código legal, el Código Visigodo (completado en el año 654), abolió la práctica de larga data de aplicar leyes diferentes a la población hispanorromana y a los visigodos. Una vez que dejaron de hacerse distinciones legales entre romani y gothi, pasaron a conocerse colectivamente como hispani. En el siglo que siguió, la región estuvo dominada por los concilios de Toledo y el episcopado. En el año 711, una fuerza invasora de árabes y bereberes derrotó a los visigodos en la batalla de Guadalete. El rey visigodo Rodrigo y muchos miembros de la élite gobernante visigoda murieron, y su reino se derrumbó rápidamente. Esto fue seguido por la posterior formación del reino de Asturias en el norte de España y el comienzo de la Reconquista por parte de las tropas cristianas bajo Pelayo."
 YEMEN_GLOSS: "Las tierras altas y las regiones costeras de Yemen albergaron a numerosas civilizaciones desde la antigüedad, dominadas por los reinos sabeo, minaico, catabánico e himyarita. Estos pueblos surárabes desarrollaron complejos sistemas de irrigación, arquitectura monumental y su propia lengua surárabe antigua, distinta del árabe clásico. El reino himyarita, que unificó la región hacia el siglo IV d. C., decayó gradualmente debido a las invasiones etíopes, la influencia persa y los conflictos internos. La llegada del islam en el siglo VII d. C. aceleró la adopción de la lengua y las costumbres árabes entre la población local, así como la eventual extinción de las lenguas surárabes antiguas."

