 yamato_history_loc: "Se formó mediante la integración de [CULTURE.GetName] [Glossary('con los migrantes yayoi y las comunidades jōmon', 'YAMATO_GLOSS')] hacia el año [DATE.GetYear]"
 YAMATO_GLOSS: "La cultura yamato se consolidó a partir de siglos de mestizaje entre los migrantes yayoi, que habían llegado desde la península coreana trayendo la agricultura del arroz de regadío y la metalurgia, y las comunidades indígenas jōmon, que había habitado el archipiélago durante milenios. Centrada en la región de Kinai, cerca de la actual Nara, la corte Yamato unificó gradualmente los clanes de Honshu, Shikoku y el norte de Kyushu mediante una combinación de conquista militar, alianzas matrimoniales y el prestigio religioso de su monarquía. Las influencias continentales siguieron remodelando la cultura en oleadas sucesivas, a medida que artesanos, eruditos y monjes budistas coreanos y chinos llegaban a la corte, mezclándose con las tradiciones aristocráticas y religiosas emergentes de las islas para crear una identidad japonesa diferenciada."

 kyushu_history_loc: "Adquirió rasgos propios por el contacto entre [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('en la isla de Kyūshū', 'KYUSHU_GLOSS')] hacia el año [DATE.GetYear]"
 KYUSHU_GLOSS: "La cultura de Kyushu desarrolló rasgos propios respecto del núcleo yamato gracias a su posición singular como puerta de entrada de la influencia continental y a la vez como región de persistente resistencia indígena. El norte de Kyushu, sede de los antiguos puertos de Hakata y del centro administrativo de Dazaifu, recibió sucesivas influencias coreanas y chinas antes de que llegaran a la corte de Kinai, lo que le confirió un carácter más abierto al exterior. En el sur, los hayato —un pueblo de herencia jomon diferenciada que resistió la autoridad Yamato durante los siglos VII y VIII— fueron absorbidos gradualmente por la población provincial tras su sometimiento bajo la corte de Nara. Esta mezcla de cultura administrativa Yamato, cosmopolitismo continental y tradición indígena hayato dio a Kyushu un carácter distinto del de la cultura metropolitana de la capital."

 oshu_history_loc: "Surgió del contacto entre [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('en la frontera septentrional de Honshū', 'OSHU_GLOSS')] hacia el año [DATE.GetYear]"
 OSHU_GLOSS: "La cultura de Ōshū se desarrolló en una frontera marcada por prolongados conflictos entre el estado Yamato y los emishi, los pueblos indígenas del norte de Honshu que resistieron la expansión imperial durante más de dos siglos. A medida que los colonos, soldados y administradores Yamato avanzaban hacia las provincias de Mutsu y Dewa, se mezclaron con comunidades emishi que fueron cayendo gradualmente bajo la autoridad imperial como fushu —pueblos fronterizos sometidos que conservaban sus propias costumbres mientras eran absorbidos en la estructura provincial—. Las campañas de Sakanoue no Tamuramaro a finales del siglo VIII y principios del IX afianzaron la expansión militar hacia el norte, pero la cultura que arraigó en Ōshū no fue simplemente un trasplante Yamato: fue una identidad fronteriza, forjada por generaciones de contacto, conflicto y matrimonios mixtos con los emishi, y que más tarde adquirió una mayor autonomía bajo poderosos clanes regionales como los Abe, los Kiyohara y los Ōshū Fujiwara."

 ryukyu_history_loc: "Se desarrolló entre poblaciones de [CULTURE.GetName] [Glossary('establecidas en el archipiélago de Ryūkyū', 'RYUKYU_GLOSS')] hacia el año [DATE.GetYear]"
 RYUKYU_GLOSS: "La cultura ryukyuense se relaciona con la llegada de poblaciones de lengua japónica al archipiélago. La cronología y las etapas de esas migraciones son objeto de estudio. Sus lenguas evolucionaron como una rama propia de la familia japónica, distinta del japonés. Conectadas por las rutas marítimas del mar de China Oriental, las islas Ryukyu se desarrollaron en relativo aislamiento de las convulsiones políticas y culturales que remodelaban la corte Yamato en Honshu. Las comunidades insulares mantuvieron sus propias jefaturas dirigidas por señores conocidos como aji, y cultivaron redes comerciales tanto con el Japón continental como con el Asia continental, lo que dio a su cultura un carácter marcadamente marítimo e independiente, muy alejado de las tradiciones cortesanas de Kinai o de los conflictos fronterizos del norte."

 goryeo_history_loc: "Se consolidó a partir de [CULTURE.GetName] [Glossary('con la unificación de los reinos coreanos bajo Wang Geon', 'GORYEO_GLOSS')] hacia el año [DATE.GetYear]"
 GORYEO_GLOSS: "La península de Corea había estado durante mucho tiempo dividida entre reinos rivales enraizados en las antiguas confederaciones tribales de Fuyo y Han, del norte y del sur respectivamente. El período de los Tres Reinos vio a Goguryeo, Baekje y Silla dominar la península durante siglos, hasta que Silla unificó gran parte de Corea en el año 668 con apoyo de la dinastía Tang china, empujando a los remanentes de Goguryeo hacia el norte, donde con el tiempo formaron Balhae. El dominio de Silla se debilitó a lo largo del siglo IX, a medida que la aristocracia fragmentaba el poder y los caudillos regionales se repartían los Tres Reinos Posteriores: Goguryeo Posterior, Baekje Posterior y una Silla en declive. De este caos surgió Wang Geon, un general de Goguryeo Posterior, quien fundó Goryeo en el año 918 y completó la unificación de la península en el año 936, absorbiendo los territorios de Silla y Baekje Posterior. El nuevo estado de Goryeo se presentó deliberadamente como heredero de todas las tradiciones coreanas anteriores, y su propio nombre evocaba a Goguryeo, mientras que sus instituciones sintetizaban la cultura aristocrática de Silla, la herencia marcial norteña de los pueblos descendientes de Fuyo y las tradiciones comerciales y marítimas de las antiguas costas de Baekje."

 balhae_history_loc: "Reunió comunidades de [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('en el reino sucesor de Goguryeo', 'BALHAE_GLOSS')] hacia el año [DATE.GetYear]"
 BALHAE_GLOSS: "Tras la destrucción de Goguryeo por la alianza Silla-Tang en el año 668, los refugiados de Goguryeo huyeron hacia el norte, a Manchuria, donde se aliaron con las tribus tungúsicas mohe que habitaban la región desde hacía tiempo. Bajo el liderazgo de Dae Joyeong, un dirigente cuyo origen goguryeo o mohe es discutido, esta coalición derrotó a un ejército Tang que los perseguía en Tianmenling en el año 698 y estableció el reino de Balhae como sucesor de Goguryeo. El nuevo estado combinó las tradiciones administrativas aristocráticas coreanas de Goguryeo con la estructura tribal mohe, organizando su gobierno según modelos de la China Tang y manteniendo al mismo tiempo una identidad manchuriana distintiva. En su apogeo, Balhae controló un vasto territorio que se extendía desde el río Amur hasta el norte de la península coreana, comerciando con los Tang, Japón y las potencias esteparias, hasta su repentina destrucción a manos de la dinastía Liao kitana en el año 926, que dispersó a su población entre Liao y Goryeo."

 jurchen_history_loc: "Se consolidó entre comunidades de [CULTURE.GetName] [Glossary('tras la caída de Balhae', 'JURCHEN_GLOSS')] hacia el año [DATE.GetYear]"
 JURCHEN_GLOSS: "Los yurchen surgieron de los heishui mohe, el más septentrional y menos sinizado de los grupos tribales mohe, que habían permanecido fuera de la órbita de Balhae y se sometieron a la dinastía kitana Liao tras la caída de Balhae en el año 926. Mientras que sus parientes mohe dentro de Balhae habían sido en gran medida absorbidos por la estructura administrativa Liao, los heishui mohe conservaron su identidad tribal en los bosques del norte de Manchuria. El nombre «yurchen» apareció por primera vez en los registros chinos de esta época. Aunque fueron vasallos de Liao durante casi dos siglos, el clan Wanyan unificó gradualmente a las dispersas tribus yurchen, y bajo Wanyan Aguda fundaron la dinastía Jin en 1115. Derrocaron a Liao en 1125 y avanzaron hacia el sur para conquistar a los Song el norte de China."

 udege_history_loc: "Se diferenció dentro de [CULTURE.GetName] [Glossary('por su adaptación a los bosques del Ussuri y el Amur', 'UDEGE_GLOSS')] hacia el año [DATE.GetYear]"
 UDEGE_GLOSS: "Los udege surgieron como un pueblo distinto entre las poblaciones tungúsicas meridionales de la cuenca del Amur-Ussuri, diferenciándose dentro del ámbito tribal mohe por su adaptación a los densos bosques de taiga de la cordillera de Sijoté-Alín y los afluentes del río Ussuri. Mientras que sus parientes mohe a lo largo de los grandes ríos se convirtieron en los antepasados de los yurchen y los nanai, los udege se retiraron hacia el interior boscoso, desarrollando una cultura centrada en la caza, la caza con trampas y la recolección de ginseng en lugar de la pesca fluvial o el pastoreo. Sus creencias animistas, la veneración del tigre y el oso como animales sagrados, y sus tradiciones chamánicas reflejan esta relación íntima con el bosque templado, distinguiéndolos de los demás pueblos tungúsicos de la región a pesar de su ascendencia compartida."

 nanai_history_loc: "Desarrolló una tradición propia a partir de [CULTURE.GetName] [Glossary('en las comunidades ribereñas del Amur', 'NANAI_GLOSS')] hacia el año [DATE.GetYear]"
 NANAI_GLOSS: "Los nanai, conocidos por los rusos posteriores como goldi, representan una de las culturas más antiguas y continuas de la cuenca del río Amur, con vínculos con las antiguas comunidades pesqueras del bajo Amur. Dentro del ámbito tungúsico relacionado con los mohe, los nanai desarrollaron una cultura orientada casi por completo en torno al gran río y las migraciones estacionales de los salmones, con su cultura material, sus prácticas espirituales y su organización social moldeadas por los ritmos del Amur. Sus tradiciones chamánicas, su distintiva vestimenta de piel de pescado y sus elaboradas creencias cosmológicas en torno al río los distinguen de las ramas más pastoriles o forestales de sus parientes tungúsicos, y sus comunidades clánicas autónomas nunca llegaron a consolidarse en estados centralizados, dejándolos como uno de los pueblos más marcadamente ribereños del Lejano Oriente."

 satsumon_history_loc: "Se formó a partir de [CULTURE.GetName] [Glossary('y las tradiciones del norte de Honshū y Hokkaidō', 'SATSUMON_GLOSS')] hacia el año [DATE.GetYear]"
 SATSUMON_GLOSS: "La cultura satsumon surgió hacia el siglo VII en el norte de Honshu y el sur de Hokkaido, desarrollándose a partir de las tradiciones epijomon de los emishi y sus antepasados, que habían habitado las islas del norte desde el final del período jōmon. A medida que la presión Yamato empujaba a las poblaciones emishi hacia el norte, su cultura se mezcló con la tradición marítima de Ojotsk —un pueblo navegante emparentado con los nivjos, de las costas del mar de Ojotsk y Sajalín— cuando ambas culturas se encontraron en el norte de Hokkaido. Esta síntesis, caracterizada por aldeas pesqueras de salmón en los estuarios de los ríos, ceremonias del oso heredadas del ámbito de Ojotsk y las herramientas de hierro y la agricultura limitada traídas desde Honshu, contribuyó a la formación de la cultura ainu hacia el siglo XIII."

 emishi_history_loc: "Conservó una identidad propia entre los [Glossary('pueblos jōmon del norte de Honshū', 'EMISHI_GLOSS')] desde la Antigüedad"
 EMISHI_GLOSS: "Los emishi descendían de las poblaciones indígenas jōmon y epijōmon del norte de Honshū, asentadas en el archipiélago japonés desde mucho antes de la llegada de los agricultores yayoi procedentes de la península coreana. La expansión de la cultura yayoi desplazó o asimiló a muchas comunidades jōmon, pero en la región de Tōhoku persistieron poblaciones con tradiciones propias. La corte de Yamato las denominó «emishi», un término político y cultural aplicado a quienes quedaban fuera de la autoridad imperial. Su lengua no dejó testimonios escritos, aunque algunos topónimos de Tōhoku sugieren vínculos con el protoainu. Los emishi destacaban por su equitación y sus arqueros, y resistieron durante siglos la expansión de Yamato. Con el tiempo, muchos fueron incorporados a la sociedad fronteriza de la que surgió la cultura de Ōshū."

 khitan_history_loc: "Se consolidó entre las ramas orientales de [CULTURE.GetName] [Glossary('en las estepas próximas al río Liao', 'KHITAN_GLOSS')] hacia el año [DATE.GetYear]"
 KHITAN_GLOSS: "Los kitán surgieron como un pueblo diferenciado de las ramas orientales de la confederación xianbei tras su fragmentación en el siglo III, y se asentaron en la cuenca del río Liao, en la actual Mongolia Interior. Durante siglos fueron una potencia secundaria de la estepa: realizaron incursiones en las fronteras chinas y rindieron tributo a sucesivos kanatos túrquicos, mientras conservaban una vestimenta y una organización clánica propias. A comienzos del siglo X, Yelü Abaoji unificó las tribus kitán y extendió su dominio sobre pastores shiwei, agricultores de Balhae y poblaciones chinas han. Bajo la dinastía Liao se crearon sistemas de escritura kitán. Sus gobernantes administraron estos pueblos conforme a sus distintas costumbres, hasta que los yurchen de la dinastía Jin destruyeron su poder en 1125."

 shiwei_history_loc: "Se formó por el contacto entre [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('en la frontera forestal del Amur', 'SHIWEI_GLOSS')] hacia el año [DATE.GetYear]"
 SHIWEI_GLOSS: "Los shiwei surgieron de las ramas nororientales de la confederación xianbei tras su fragmentación en el siglo III, cerca de los territorios ocupados por los kitán. Las fuentes dinásticas chinas describen una lengua estrechamente emparentada con la de estos últimos, lo que los sitúa dentro del ámbito protomongólico. Su contacto prolongado con los pueblos tungúsicos mohe dio a algunas de sus tribus un carácter más forestal. Entre los grupos shiwei destacó el de los mengwu shiwei de la cuenca del río Ergune, vinculado por las tradiciones genealógicas mongolas a los antepasados del linaje borjigin, del que surgiría Gengis Kan."

 shatuo_history_loc: "Combinó tradiciones de [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('mediante el servicio militar en la frontera Tang', 'SHATUO_GLOSS')] hacia el año [DATE.GetYear]"
 SHATUO_GLOSS: "Los shatuo eran un pueblo túrquico procedente de la tribu chuyue del Kanato Túrquico Occidental. Tomaron su nombre del desierto de Shatuo, en la cuenca de Zungaria, al norte de la actual Sinkiang. La expansión tibetana los empujó hacia el este a comienzos del siglo IX, cuando buscaron la protección de la dinastía Tang y fueron reasentados en Daibei, al norte de Shanxi. El servicio militar fronterizo y los matrimonios con la población china han dieron lugar a una cultura túrquica progresivamente sinizada, aunque conservó sus tradiciones ecuestres. Tras la caída de los Tang, los jefes shatuo fundaron varias dinastías en el norte de China. Otros grupos permanecieron en la estepa de Mongolia Interior y contribuyeron a la formación de los öngüt."

 onggud_history_loc: "Desarrolló una identidad propia a partir de [CULTURE.GetName] [Glossary('entre las comunidades de la estepa próximas a los montes Yin', 'ONGGUD_GLOSS')] hacia el año [DATE.GetYear]"
 ONGGUD_GLOSS: "Los öngüt surgieron de grupos túrquicos shatuo que permanecieron en la estepa de Mongolia Interior después de que la dinastía Song pusiera fin al dominio shatuo en el norte de China en 979. Se establecieron junto a las montañas Yin y desempeñaron funciones de vigilancia fronteriza frente a las incursiones de la estepa. Adoptaron el cristianismo nestoriano, como atestiguan las cruces halladas en su antiguo territorio, y desarrollaron una identidad distinta tanto de sus antepasados shatuo como de sus vecinos mongoles. Los matrimonios entre la casa gobernante öngüt y la familia de Gengis Kan estrecharon sus vínculos con el Imperio mongol, en cuya sociedad terminaron integrándose."

 kerait_history_loc: "Reunió grupos de [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('en una confederación de la meseta mongola central', 'KERAIT_GLOSS')] hacia el año [DATE.GetYear]"
 KERAIT_GLOSS: "Los kerait fueron una de las principales confederaciones de la meseta mongola durante los siglos XI y XII. Su origen, túrquico, mongólico o mixto, sigue siendo debatido: sus gobernantes empleaban títulos túrquicos, pero las fuentes de la dinastía Yuan los incluían entre los mongoles. Tras la caída del Kanato Uigur, absorbieron a distintos grupos tribales y adquirieron gran influencia en la estepa central. En 1009, una parte importante de su población recibió el bautismo en el cristianismo nestoriano, que se arraigó entre sus comunidades. El poder kerait fue quebrado en 1203 por Temuyín, y sus supervivientes quedaron incorporados gradualmente a la confederación mongola."

 naiman_history_loc: "Integró comunidades de [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('en la confederación del Altái occidental', 'NAIMAN_GLOSS')] hacia el año [DATE.GetYear]"
 NAIMAN_GLOSS: "Los naimanos, cuyo nombre significa «ocho» en mongol y alude a una confederación de ocho tribus, ocuparon el oeste de la meseta mongola y la región del Altái. Sus orígenes se relacionan con los basmilos y otros pueblos túrquicos que adquirieron protagonismo tras la caída del Kanato Uigur en 840, aunque su filiación túrquica o turcomongola es objeto de debate. Adoptaron el cristianismo nestoriano y emplearon la escritura uigur en la administración, lo que les dio prestigio cultural entre los pueblos de la estepa. Tras su derrota en 1204, numerosos nobles y familias naimanas se dispersaron por Asia Central y entraron al servicio de los kara-kitán."

 uyghur_history_loc: "Combinó tradiciones de [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('tras las migraciones desde la estepa hacia los oasis del Tarim', 'UYGHUR_GLOSS')] hacia el año [DATE.GetYear]"
 UYGHUR_GLOSS: "Los uigures surgieron de una confederación de tribus túrquicas tiele que contribuyó al derrocamiento del Segundo Kanato Túrquico en 742. Fundaron un kanato que dominó la estepa mongola hasta su destrucción por los kirguises del Yeniséi en 840. La difusión del maniqueísmo y la adopción de una escritura derivada del sogdiano favorecieron una cultura urbana y letrada poco habitual entre los pueblos esteparios; esa escritura serviría después de base para la administración del Imperio mongol. Tras 840, grupos uigures emigraron hacia los oasis de Turfán y Ganzhou, donde se mezclaron con las poblaciones locales de la cuenca del Tarim y desarrollaron una cultura comercial y literaria que conservó su identidad mucho después de la caída del kanato."

 mongol_history_loc: "Se consolidó entre comunidades de [CULTURE.GetName] [Glossary('de la estepa oriental de Mongolia', 'MONGOL_GLOSS')] hacia el año [DATE.GetYear]"
 MONGOL_GLOSS: "Las tradiciones mongolas sitúan sus orígenes en el legendario valle de Ergüne-kün, donde un pequeño grupo de supervivientes se habría refugiado tras una gran derrota antes de multiplicarse y regresar a la estepa. Las fuentes chinas de época Tang mencionan a los mengwu shiwei, un pueblo forestal cuyo nombre se asemeja fonéticamente al de los mongoles. Las genealogías tradicionales vinculan a Bodonchar Munkhag con el origen del linaje borjigin, del que descendería Gengis Kan. Durante siglos, las tribus protomongolas fueron una fuerza menor entre los kitán, uigures y tártaros, hasta que su progresiva unificación les permitió imponerse a sus rivales."

 oirat_history_loc: "Desarrolló una identidad diferenciada de [CULTURE.GetName] [Glossary('en los bosques del oeste de Mongolia', 'OIRAT_GLOSS')] hacia el año [DATE.GetYear]"
 OIRAT_GLOSS: "Los oirates surgieron entre los pueblos forestales del oeste de Mongolia. Según la interpretación, su nombre podría relacionarse con «los del bosque» o con la idea de parentesco cercano. Se diferenciaban de los mongoles de Khamag por sus dialectos y formas de vida, y aparecen en las fuentes como vecinos y rivales ocasionales de la creciente confederación mongola. Su jefe Quduqa Beki se alió inicialmente contra Temuyín, antes de la sumisión e incorporación de los oirates al Imperio mongol."

 tataric_history_loc: "Se organizó a partir de [CULTURE.GetName] [Glossary('en la confederación de la región del lago Buir', 'TATARIC_GLOSS')] hacia el año [DATE.GetYear]"
 TATARIC_GLOSS: "Los tártaros formaron una de las grandes confederaciones de la estepa oriental de Mongolia, asentada en torno al lago Buir. Durante mucho tiempo fueron una de las principales potencias de la meseta, junto con los kerait, naimanos, merkitas y mongoles de Khamag. Por una extensión posterior del nombre en las crónicas persas y europeas, «tártaro» llegó a aplicarse a los conquistadores mongoles y, más tarde, a diversos pueblos túrquicos de la Horda de Oro. Sin embargo, los tártaros originales constituían un pueblo diferenciado y fueron enemigos encarnizados de Temuyín, quien los derrotó y sometió en 1202."

 onggirad_history_loc: "Se consolidó como un grupo propio dentro de [CULTURE.GetName] [Glossary('entre los linajes de la cuenca del lago Hulun', 'ONGGIRAD_GLOSS')] hacia el año [DATE.GetYear]"
 ONGGIRAD_GLOSS: "Los ongiratos se asentaron en las praderas que rodean el lago Hulun, en el este de Mongolia. Eran una tribu darligin incluida entre los pueblos mongoles, aunque sus tradiciones genealógicas no los hacían descender de Bodonchar. Nunca constituyeron una gran potencia militar unificada, pero adquirieron enorme influencia mediante alianzas matrimoniales. La madre de Gengis Kan, su esposa principal Börte y numerosas emperatrices y princesas mongolas procedían de sus linajes, lo que convirtió a los ongiratos en uno de los principales grupos emparentados con la dinastía gobernante."

 tajiuud_history_loc: "Se diferenció dentro de [CULTURE.GetName] [Glossary('como un linaje que reivindicaba la ascendencia de Bodonchar', 'TAJIUUD_GLOSS')] hacia el año [DATE.GetYear]"
 TAJIUUD_GLOSS: "Los taichiutos hacían remontar su linaje a Bodonchar Munkhag, antepasado legendario de varias tribus mongolas, por lo que estaban estrechamente emparentados con los borjigin de Temuyín. Este parentesco alimentó una intensa rivalidad: sus jefes figuraron entre los adversarios más antiguos del futuro Gengis Kan, a quien mantuvieron cautivo durante su juventud y disputaron el liderazgo de la confederación mongola. Finalmente fueron derrotados e incorporados a la nueva unidad política de la estepa."

 jadran_history_loc: "Se consolidó dentro de [CULTURE.GetName] [Glossary('entre los clanes nirun vinculados a Bodonchar', 'JADRAN_GLOSS')] hacia el año [DATE.GetYear]"
 JADRAN_GLOSS: "Los jadaran hacían remontar su ascendencia a Bodonchar Munkhag, al igual que otras tribus nirun. Este clan de pastores de la estepa oriental compartía un parentesco lejano con el linaje borjigin de Gengis Kan y seguía los mismos ciclos de pastoreo estacional que sus vecinos mongoles. Su posición dependía de las cambiantes alianzas y rivalidades entre los jefes de la estepa. Su representante más célebre fue Jamukha, hermano de sangre del joven Temuyín y, más tarde, uno de sus principales rivales. La suerte del clan quedó ligada a la de Jamukha y, tras su derrota, los jadaran fueron integrándose en la confederación mongola."

 qay_history_loc: "Surgió de las comunidades de [CULTURE.GetName] [Glossary('conocidas como kumo xi en la frontera del Liao', 'QAY_GLOSS')] hacia el año [DATE.GetYear]"
 QAY_GLOSS: "Los qay, conocidos por los cronistas chinos como kumo xi, procedían del mismo sustrato xianbei que los kitán. Se asentaron junto a ellos en la frontera del río Liao, donde fueron vecinos y frecuentes rivales. Aunque no llegaron a construir un imperio comparable al de los kitán, conservaron durante siglos una identidad tribal propia. Alternaron la sumisión a las dinastías chinas, las alianzas con los kitán y las rebeliones, hasta quedar incorporados a la estructura administrativa de la dinastía Liao."

 merkit_history_loc: "Se organizó a partir de [CULTURE.GetName] [Glossary('en la confederación del Selenga y el bajo Orjón', 'MERKIT_GLOSS')] hacia el año [DATE.GetYear]"
 MERKIT_GLOSS: "Los merkitas se establecieron en la cuenca del Selenga y el curso inferior del Orjón. Su filiación étnica es discutida: distintas fuentes los vinculan con los pueblos mongólicos o túrquicos, y sus nombres y títulos muestran influencias de ambas tradiciones. Formaron una de las principales confederaciones de la meseta mongola. Su enfrentamiento con Temuyín se agravó cuando una partida merkita secuestró a su esposa Börte, desencadenando una prolongada enemistad. Las sucesivas derrotas ante los mongoles acabaron por dispersar a sus comunidades a comienzos del siglo XIII."

 ekhirit_history_loc: "Conservó tradiciones propias de [CULTURE.GetName] [Glossary('entre las comunidades de los bosques del Baikal', 'EKHIRIT_GLOSS')] hacia el año [DATE.GetYear]"
 EKHIRIT_GLOSS: "Los ekhirit figuran entre las antiguas poblaciones de habla mongólica de la región del lago Baikal. Los bosques de su territorio los protegían de las grandes confederaciones e imperios que se sucedían en las estepas del sur. Organizados en clanes y redes de parentesco, sin un poder central comparable al de los kanatos, conservaron un modo de vida basado en la caza y el pastoreo en los márgenes de la taiga. Más tarde constituirían uno de los principales grupos que contribuyeron a la formación del pueblo buriato."

 tula_history_loc: "Desarrolló una identidad local a partir de [CULTURE.GetName] [Glossary('en los márgenes boscosos del Baikal', 'TULA_GLOSS')] hacia el año [DATE.GetYear]"
 TULA_GLOSS: "Los tula habitaban los márgenes boscosos de la región del lago Baikal, junto a los ekhirit y otros pueblos de habla mongólica. Su distancia de los grandes imperios de la estepa favoreció la conservación de una identidad propia, articulada en torno a los clanes. Apenas descritos por los cronistas extranjeros, vivían de la caza y el pastoreo, adaptados a los ciclos estacionales de la taiga. Formaron parte del conjunto de poblaciones de la región del Baikal del que posteriormente surgiría la identidad buriata."

 basmyl_history_loc: "Se consolidó dentro de [CULTURE.GetName] [Glossary('como una agrupación tribal de la estepa mongola', 'BASMYL_GLOSS')] hacia el año [DATE.GetYear]"
 BASMYL_GLOSS: "Los basmilos pertenecían al mundo tribal túrquico de la estepa mongola. Junto con uigures y carlucos, participaron en el derrocamiento del poder göktürk a mediados del siglo VIII. Llegaron a ejercer brevemente la autoridad suprema, pero sus aliados uigures los desplazaron y establecieron su propio kanato en 744. Desde entonces, los basmilos continuaron siendo un grupo tribal importante, aunque subordinado a otras potencias de la estepa."

 ograk_history_loc: "Se constituyó como una rama de [CULTURE.GetName] [Glossary('estrechamente vinculada a los basmilos', 'OGRAK_GLOSS')] hacia el año [DATE.GetYear]"
 OGRAK_GLOSS: "Los ograk constituían una rama estrechamente vinculada a los basmilos, con quienes compartían lengua y buena parte de su organización tribal. Como ellos, quedaron afectados por la reorganización de las confederaciones de la estepa tras la caída del poder göktürk en 744. Las fuentes chinas y túrquicas apenas distinguen su trayectoria de la del conjunto basmilo del que procedían."

 bayirku_history_loc: "Se consolidó como un grupo propio dentro de [CULTURE.GetName] hacia el año [DATE.GetYear]"
 BAYIRKU_GLOSS: "Los bayirku, mencionados en los anales chinos como bayegu, eran uno de los grupos de la confederación toquz oguz, los Nueve Clanes. Se establecieron en el extremo septentrional del territorio de los tiele, cerca del lago Baikal. Su nombre se ha relacionado con el posterior etnónimo de los barga de esa región, aunque la semejanza por sí sola no permite demostrar una continuidad directa entre ambas poblaciones."

 turgesh_history_loc: "Adquirió autonomía dentro de [CULTURE.GetName] en los valles de Zhetysu hacia el año [DATE.GetYear]"
 TURGESH_GLOSS: "Los türgesh surgieron entre las tribus de las Diez Flechas, la confederación on oq del Kanato Túrquico Occidental. Eran pastores del valle del Ili y de Zhetysu, cuyos rebaños aprovechaban los extensos pastizales de la región. Se dividían en dos grandes agrupaciones, los türgesh amarillos y los negros, que organizaban alianzas matrimoniales y derechos de pastoreo. Al desintegrarse el poder túrquico occidental a finales del siglo VII, adquirieron un protagonismo creciente en la lucha por el control del valle del Ili, que marcaría su historia durante buena parte del siglo siguiente."

 qun_history_loc: "Se distinguió como una comunidad de [CULTURE.GetName] hacia el año [DATE.GetYear]"
 QUN_GLOSS: "Los qun, relacionados con la tribu hun de las fuentes chinas, formaban parte del mundo tribal de los toquz oguz. Las inscripciones túrquicas del siglo VIII recogen las relaciones diplomáticas entre esta confederación, China y los kitán. Sin embargo, la trayectoria independiente de los qun está escasamente documentada y su identificación con otros grupos de nombre semejante sigue planteando dificultades."

 siqar_history_loc: "Se consolidó dentro del ámbito tribal de [CULTURE.GetName] hacia el año [DATE.GetYear]"
 SIQAR_GLOSS: "Los siqar eran una de las tribus de la confederación tiele de la estepa mongola, y su trayectoria estuvo ligada a la de los toquz oguz. Tras la caída del Kanato Uigur en 840, las confederaciones se reorganizaron y sus linajes se integraron en nuevas agrupaciones. Su nombre se ha vinculado con algunos de los grupos que contribuyeron a formar la confederación naimana de la estepa occidental."

 tongra_history_loc: "Se distinguió dentro de [CULTURE.GetName] [Glossary('por su tradición militar en el mundo tiele', 'TONGRA_GLOSS')] hacia el año [DATE.GetYear]"
 TONGRA_GLOSS: "Los tongra, mencionados en las fuentes chinas como tongluo, eran una de las tribus tiele más poderosas. Destacaban dentro del mundo de los toquz oguz por su capacidad militar y por sus vínculos con los pugu. Generaciones de servicio en las fronteras, tanto contra la dinastía Tang como a su lado, reforzaron una sociedad organizada en torno a la guerra a caballo y la vida nómada. Sus guerreros fueron solicitados como auxiliares por la corte Tang y por los jefes militares fronterizos que buscaban disponer de caballería propia."

 barsil_history_loc: "Se desarrolló entre comunidades de [CULTURE.GetName] del Cáucaso septentrional hacia el año [DATE.GetYear]"
 BARSIL_GLOSS: "Los barsiles pertenecían al ámbito túrquico de habla ogúrica del Cáucaso septentrional y la estepa póntico-caspia. Aparecen en fuentes bizantinas del siglo VI junto a sabires y onoguros, entre los pueblos surgidos tras la disgregación de la confederación huna. Diversos investigadores los consideran uno de los componentes que se integraron en el naciente poder jázaro durante el siglo VII, cuando este pasó a dominar la región."

 karluk_history_loc: "Se consolidó a partir de [CULTURE.GetName] [Glossary('entre las tribus del Altái y Zhetysu', 'KARLUK_GLOSS')] hacia el año [DATE.GetYear]"
 KARLUK_GLOSS: "Los carlucos estaban vinculados a las poblaciones túrquicas de la región del Altái y participaron en las luchas por el predominio en la estepa. Tras la fragmentación del kanato, se dispersaron por la estepa. Durante el siglo VIII se desplazaron hacia Zhetysu. La caída del Kanato Uigur en 840 provocó nuevas transformaciones en el equilibrio regional. Durante las generaciones siguientes, algunas comunidades carlucas abandonaron gradualmente el nomadismo y se asentaron en ciudades y oasis de Asia Central, donde convivieron y se mezclaron con poblaciones sogdianas y tocarias. Esta transformación sentó las bases de la población de la que surgiría el kanato qarajánida y contribuyó a la turquificación y la islamización de las cuencas del Tarim y Ferganá."

 laktan_history_loc: "Se integró desde [CULTURE.GetName] [Glossary('en las tribus fundadoras de la confederación kimek', 'LAKTAN_GLOSS')] hacia el año [DATE.GetYear]"
 LAKTAN_GLOSS: "Los laktan, identificados con los lanikaz mencionados por los geógrafos persas, eran una de las siete tribus de la confederación kimek, formada en torno al Altái y el curso superior del Irtish tras la desintegración del Kanato Túrquico Occidental. Una interpretación de su nombre lo relaciona con los alanos y los jázaros, aunque esa etimología es incierta. Como ocurre con otras tribus kimeks, su historia independiente solo se conoce de manera fragmentaria a través de autores árabes y persas, como Gardizi."

 bashkir_history_loc: "Desarrolló rasgos propios a partir de [CULTURE.GetName] [Glossary('en los bosques y estepas de los Urales meridionales', 'BASHKIR_GLOSS')] hacia el año [DATE.GetYear]"
 BASHKIR_GLOSS: "Los baskires se asentaron en la región de transición entre bosques y estepas de los Urales meridionales, entre las tierras de los búlgaros del Volga al oeste, las estepas de los kimeks y kipchaks al este y los bosques septentrionales. Eran hábiles criadores de caballos y cazadores, y conservaron sus costumbres e identidad tribal pese al paso de sucesivas oleadas de pueblos oguzes, kimeks y, posteriormente, kipchaks. Aunque incorporaron influencias de sus vecinos, mantuvieron una lengua y una forma de vida propias hasta la época de la Horda de Oro."

 kipchak_history_loc: "Se consolidó a partir de [CULTURE.GetName] [Glossary('entre las comunidades pastoriles del Altái y el Irtish', 'KIPCHAK_GLOSS')] hacia el año [DATE.GetYear]"
 KIPCHAK_GLOSS: "Los kipchaks aparecen por primera vez en las fuentes del siglo VIII como parte del segundo kanato turco, probablemente en la región del Altái. Tras la caída de aquel kanato, se integraron en la naciente confederación kimek a orillas del río Irtish. Sus comunidades pastoriles crecieron durante los siglos siguientes y, hacia el siglo XI, llegaron a superar en importancia a sus antiguos aliados kimeks. Desde allí se expandieron hacia el oeste por la estepa póntico-caspia, hasta el punto de que aquel vasto territorio pasó a conocerse como Desht-i Qipchaq, la estepa de los kipchaks. Más tarde, estas tierras se convertirían en el núcleo de la Horda de Oro."

 dukha_history_loc: "Se diferenció dentro de [CULTURE.GetName] [Glossary('mediante la cría de renos en la taiga de Sayán', 'DUKHA_GLOSS')] hacia el año [DATE.GetYear]"
 DUKHA_GLOSS: "Los dukha habitaban la taiga de los montes Sayán. Su identidad estuvo marcada por los bosques y la cría de renos, más que por los grandes kanatos de la estepa. Este modo de vida los distinguía de sus vecinos esteparios, aunque compartían vínculos lingüísticos y culturales con los pueblos túrquicos de Sayán-Altái y con el ámbito de los kirguises del Yeniséi."

 todzh_history_loc: "Conservó una identidad propia dentro de [CULTURE.GetName] [Glossary('en la cuenca boscosa del alto Yeniséi', 'TODZH_GLOSS')] hacia el año [DATE.GetYear]"
 TODZH_GLOSS: "Los todzh se establecieron en la cuenca boscosa del alto Yeniséi, dentro de la esfera de influencia de los kirguises. El aislamiento de sus montañas y bosques favoreció la conservación de una identidad local propia durante siglos, incluso mientras el poder de los kanatos kirguises se expandía y se desintegraba a su alrededor."

 cik_history_loc: "Mantuvo una identidad local en el ámbito de [CULTURE.GetName] [Glossary('tras su incorporación al mundo kirguís del Yeniséi', 'CIK_GLOSS')] hacia el año [DATE.GetYear]"
 CIK_GLOSS: "Los cik aparecen en antiguas fuentes túrquicas y chinas como un pueblo diferenciado de la cuenca del alto Yeniséi. Quedaron sometidos a los kirguises del Yeniséi e integrados en su esfera de influencia conforme esta se extendía por Sayán-Altái. Su nombre perduró como denominación tribal y territorial después de la incorporación política, dentro del mosaico de pueblos que componían el mundo kirguís."

 az_history_loc: "Se diferenció dentro de [CULTURE.GetName] [Glossary('entre las comunidades de los montes Sayán', 'AZ_GLOSS')] hacia el año [DATE.GetYear]"
 AZ_GLOSS: "Los az figuran entre los pueblos de la región montañosa de Sayán, cerca de Tuva. Su territorio quedó dentro de la esfera de los kirguises del Yeniséi, aunque su aislamiento les permitió conservar cierta autonomía local y una identidad propia durante los períodos de predominio kirguís y, posteriormente, mongol."

 shor_history_loc: "Desarrolló una tradición propia a partir de [CULTURE.GetName] [Glossary('entre cazadores y herreros del Alatáu de Kuznetsk', 'SHOR_GLOSS')] hacia el año [DATE.GetYear]"
 SHOR_GLOSS: "Los shor habitaban la región boscosa del Alatáu de Kuznetsk. Sus tradiciones metalúrgicas y de caza estaban adaptadas a la taiga montañosa. Vinculados lingüística y culturalmente con los kirguises del Yeniséi y los jakasios, conservaron una identidad forestal propia pese a la sucesión de imperios en las estepas del sur."

 telengit_history_loc: "Se consolidó a partir de [CULTURE.GetName] [Glossary('entre las comunidades de las altas montañas del Altái', 'TELENGIT_GLOSS')] hacia el año [DATE.GetYear]"
 TELENGIT_GLOSS: "Los telengit se establecieron en las altas montañas del Altái. Su identidad se formó mediante el contacto entre las antiguas poblaciones montañesas y la expansión de los kirguises del Yeniséi. Eran hábiles cazadores y jinetes, adaptados a las duras condiciones de las tierras altas, y mantuvieron su organización tribal bajo sucesivos poderes túrquicos y, más tarde, mongoles."

 kirghiz_history_loc: "Se desarrolló a partir de [CULTURE.GetName] [Glossary('durante las migraciones hacia el Tian Shan', 'KIRGHIZ_GLOSS')] hacia el año [DATE.GetYear]"
 KIRGHIZ_GLOSS: "Tras la conquista mongola de los territorios de los kirguises del Yeniséi a comienzos del siglo XIII, diversos grupos kirguises emigraron hacia el suroeste, en dirección al Tian Shan. Con el tiempo se diferenciaron de las comunidades que permanecieron en el sur de Siberia. Estas migraciones contribuyeron a la formación del pueblo kirguís de Asia Central, cuya lengua e identidad siguieron una evolución distinta de las de los pueblos de habla jakasia del Yeniséi."

 sakha_history_loc: "Se formó entre grupos de [CULTURE.GetName] [Glossary('que emigraron desde el Baikal hacia la cuenca del Lena', 'SAKHA_GLOSS')] hacia el año [DATE.GetYear]"
 SAKHA_GLOSS: "La expansión mongola alteró la región del Baikal durante el siglo XIII y favoreció el desplazamiento hacia el norte de grupos de pastores túrquicos relacionados con los kurykan. Siguiendo el Lena, llegaron a la taiga subártica, donde adaptaron la cría de caballos y ganado a un clima mucho más riguroso. Estas comunidades contribuyeron a la formación de los sajás, conocidos posteriormente por los rusos como yakutos."

 uriankhai_history_loc: "Adquirió rasgos propios a partir de [CULTURE.GetName] [Glossary('bajo la influencia mongola en Sayán-Altái', 'URIANKHAI_GLOSS')] hacia el año [DATE.GetYear]"
 URIANKHAI_GLOSS: "Tras la conquista mongola de los territorios de los kirguises del Yeniséi, los pueblos túrquicos de los bosques y montañas de Sayán-Altái quedaron sometidos a una prolongada influencia política y cultural mongola. Los conquistadores aplicaron el nombre uriankhai, empleado originalmente para designar a diversos pueblos forestales, a comunidades relacionadas con los antepasados de los jakasios y tuvanos. Durante generaciones, el contacto con los jefes mongoles, los matrimonios mixtos y la incorporación a la administración imperial favorecieron la adopción de elementos de la lengua y la identidad mongolas, sin que desaparecieran sus raíces túrquicas."

 pecheneg_history_loc: "Se consolidó entre grupos de [CULTURE.GetName] [Glossary('de la región del Sir Daria', 'PECHENEG_GLOSS')] hacia el año [DATE.GetYear]"
 PECHENEG_GLOSS: "Los pechenegos surgieron entre los pueblos túrquicos de la región del curso medio del Sir Daria, cerca de Taskent. Cronistas posteriores, como Rashid al-Din y Mahmud de Kashgar, los incluyeron entre las ramas de los oguzes. Presionados por confederaciones rivales, entre ellas las de los oguzes, kimeks y carlucos, emigraron hacia el oeste y cruzaron el Volga a comienzos del siglo IX. A finales de ese siglo ocupaban amplias zonas de la estepa póntico-caspia, desde el Caspio hasta el Danubio, y durante los dos siglos siguientes desempeñaron un papel destacado en las fronteras bizantinas, rusas y húngaras."

 salar_history_loc: "Desarrolló una identidad propia a partir de [CULTURE.GetName] [Glossary('tras la migración de grupos salur hacia Qinghai y Gansu', 'SALAR_GLOSS')] hacia el año [DATE.GetYear]"
 SALAR_GLOSS: "Los salares remontan sus orígenes a los salur, una de las tribus oguzes cuyo nombre figura entre los veinticuatro clanes tradicionales recogidos por los genealogistas medievales. Según su tradición, varios hermanos salur huyeron de la persecución religiosa en Samarcanda junto con un pequeño grupo de seguidores y llevaron un Corán sobre un camello blanco hacia el este, atravesando los pasos del Tian Shan. Finalmente se establecieron en el curso alto del río Amarillo, en la región de Qinghai-Gansu. Allí, siglos de convivencia y matrimonios con tibetanos, hui y chinos contribuyeron a la formación de una identidad salar diferenciada."

 khazar_history_loc: "Se consolidó a partir de [CULTURE.GetName] [Glossary('entre los pueblos túrquicos de la estepa póntico-caspia', 'KHAZAR_GLOSS')] hacia el año [DATE.GetYear]"
 KHAZAR_GLOSS: "Los jázaros surgieron entre los pueblos túrquicos del Cáucaso septentrional y la estepa póntico-caspia, en un entorno de antiguas confederaciones hunas y nuevos poderes túrquicos. En el siglo VII alcanzaron una posición dominante y establecieron un kanato multiétnico que se extendía desde el Cáucaso hasta el Volga. En sus dominios convivían eslavos, alanos, búlgaros y otros pueblos. Los jázaros son especialmente conocidos por la conversión de parte de su élite gobernante al judaísmo, probablemente entre los siglos VIII y IX."

 bolghar_history_loc: "Se organizó a partir de [CULTURE.GetName] [Glossary('entre las comunidades ogúricas de la estepa póntica', 'BOLGHAR_GLOSS')] hacia el año [DATE.GetYear]"
 BOLGHAR_GLOSS: "Los búlgaros descendían de los pueblos túrquicos de habla ogúrica de la estepa póntico-caspia, relacionados con los restos de la confederación huna y agrupaciones tribales posteriores, como los onoguros. Tras la desintegración de la Antigua Gran Bulgaria a mediados del siglo VII, bajo la presión de los jázaros, distintas comunidades búlgaras emigraron en varias direcciones. Una rama se estableció en los Balcanes y se mezcló con las poblaciones eslavas locales; otra avanzó hacia el norte siguiendo el Volga y fundó la Bulgaria del Volga, un próspero estado comercial que perduró hasta las conquistas mongolas del siglo XIII."

 avar_history_loc: "Se reorganizó a partir de [CULTURE.GetName] [Glossary('durante la migración de grupos rouran hacia Europa', 'AVAR_GLOSS')] hacia el año [DATE.GetYear]"
 AVAR_GLOSS: "Tras la destrucción del kanato de los rouran por sus antiguos vasallos túrquicos en 552, grupos de refugiados emigraron hacia el oeste por la estepa euroasiática y llegaron a la región póntica, donde aparecieron bajo el nombre de ávaros. En 567 se establecieron en la cuenca de los Cárpatos y sometieron a una población diversa de búlgaros ogúricos, eslavos y pueblos germánicos. Con el tiempo, estas comunidades quedaron integradas en un mundo político dominado por los ávaros, que perduró durante más de dos siglos hasta su desintegración ante la presión franca a finales del siglo VIII."

 tumed_history_loc: "Se diferenció dentro de [CULTURE.GetName] [Glossary('entre los pueblos forestales del Baikal y Sayán', 'TUMED_GLOSS')] hacia el año [DATE.GetYear]"
 TUMED_GLOSS: "Los tumed, mencionados como tumat en la Historia secreta de los mongoles, eran un pueblo de los bosques de la región del Baikal y los montes Sayán. Vivían de la caza y la cría de renos en la taiga, en lugar del pastoreo ecuestre característico de las estepas abiertas, al igual que sus vecinos buriatos y bargutos, con quienes mantenían vínculos regionales. Defendieron con firmeza sus territorios forestales y se rebelaron contra la autoridad mongola a comienzos del siglo XIII. Finalmente fueron sometidos e incorporados al imperio mongol, aunque conservaron buena parte de su modo de vida."

 barqut_history_loc: "Conservó una identidad regional dentro de [CULTURE.GetName] [Glossary('en el valle del Barguzín', 'BARQUT_GLOSS')] hacia el año [DATE.GetYear]"
 BARQUT_GLOSS: "Los bargutos o barga toman su nombre del valle del Barguzín, al este del lago Baikal. Su territorio de bosques y estepas los vinculaba con los buriatos y tumat y con las antiguas poblaciones kurykan de la región. Combinaban la caza en la taiga con el pastoreo estepario y mantuvieron una identidad tribal propia durante el ascenso del Imperio mongol. Su incorporación al mundo mongol no borró sus vínculos con el territorio del Barguzín."

 kimek_history_loc: "Se organizó a partir de [CULTURE.GetName] [Glossary('en la confederación del Irtish tras la caída del poder túrquico occidental', 'KIMEK_GLOSS')] hacia el año [DATE.GetYear]"
 KIMEK_GLOSS: "La confederación kimek se formó en la región del Irtish y el Obi tras la desintegración del Kanato Túrquico Occidental. Reunió a siete tribus —yemek, kipchak, tatar, bayandur, lanikaz, ajlad e imur— bajo una organización política flexible que permitía a cada una conservar sus pastizales y costumbres. Su territorio, entre el Altái y las estepas de los Urales, atravesaba importantes rutas comerciales. La caída del Kanato Uigur en 840 impulsó la llegada de nuevos grupos. Hacia el siglo XI, los kipchaks adquirieron una posición predominante e integraron buena parte de las tierras y poblaciones kimeks en su propia confederación."

 turkish_history_loc: "Se consolidó a partir de [CULTURE.GetName] [Glossary('durante los desplazamientos de tribus oguzes desde Zhetysu al Sir Daria', 'OGHUZ_GLOSS')] hacia el año [DATE.GetYear]"
 OGHUZ_GLOSS: "Los oguzes se consolidaron como una confederación diferenciada dentro del mundo túrquico de Asia Central. Tras la caída del Segundo Kanato Túrquico en 744 y las presiones ejercidas por los carlucos en Zhetysu, grupos de pastores se desplazaron hacia el oeste y se asentaron a lo largo del Sir Daria, con un importante centro en Yengikent. Los autores medievales, como Mahmud de Kashgar, recogieron sus divisiones tribales. Las comunidades conservaron tradiciones pastoriles, guerreras y tengristas, al tiempo que establecían vínculos con las poblaciones sedentarias y mercantiles de su nuevo territorio."

 cuman_history_loc: "Se formó por la integración de [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('durante las migraciones hacia la estepa póntica', 'CUMAN_GLOSS')] hacia el año [DATE.GetYear]"
 CUMAN_GLOSS: "Diversas fuentes medievales relacionan a los qun con los movimientos de población que precedieron a la expansión de los cumanos hacia el oeste. A lo largo de esas migraciones, grupos qun, cumanos y oguzes entraron en contacto, compartieron pastizales y establecieron vínculos matrimoniales. De esas relaciones surgió parte del mundo cumano-kipchak que dominó la estepa póntica durante los siglos XI y XII. Las conquistas mongolas del siglo XIII dispersaron a numerosas comunidades hacia Hungría, Bulgaria y otros territorios vecinos."

 torkil_history_loc: "Desarrolló una identidad propia a partir de [CULTURE.GetName] [Glossary('al servir como guardia fronteriza de los príncipes de la Rus', 'TORKIL_GLOSS')] hacia el año [DATE.GetYear]"
 TORKIL_GLOSS: "Los torkil, llamados torki por los cronistas de la Rus, eran grupos oguzes establecidos en la frontera meridional de la Rus de Kiev. Sirvieron a sus príncipes como guardias fronterizos y caballería ligera. Junto a berendeos, pechenegos y otros pueblos esteparios, formaron parte de los Chórnye Klobuki, los «gorros negros»: una confederación de comunidades seminómadas que defendía los principados de la Rus frente a las incursiones cumanas y conservaba sus tradiciones túrquicas."

 chigil_history_loc: "Se consolidó entre comunidades de [CULTURE.GetName] [Glossary('de Semirechye y los oasis próximos a Kashgar', 'CHIGIL_GLOSS')] hacia el año [DATE.GetYear]"
 CHIGIL_GLOSS: "Los chigil se establecieron en Semirechye y en las tierras próximas a Kashgar. Procedían del mundo tribal del Kanato Túrquico Occidental y de la confederación on oq. En el siglo XI, Mahmud de Kashgar los incluyó en su Diwan lughat al-Turk entre los pueblos túrquicos más destacados de su tiempo. Sus comunidades convivieron con los yagma y con las poblaciones de los oasis del Tarim, y contribuyeron a la base demográfica y política del primer Estado qarajánida."

 yagma_history_loc: "Se formó por el contacto entre [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('en torno a Kashgar y el lago Issyk-Kul', 'YAGMA_GLOSS')] hacia el año [DATE.GetYear]"
 YAGMA_GLOSS: "Los yagma se desarrollaron en torno a Kashgar y el lago Issyk-Kul, en contacto con grupos uigures, chigil y otras poblaciones túrquicas. Sus comunidades combinaron tradiciones pastoriles con las influencias culturales de los oasis. Formaron parte de los grupos tribales sobre los que se apoyó el poder qarajánida durante su expansión por la cuenca del Tarim y Transoxiana."

 tsangpa_history_loc: "Se desarrolló a partir de [CULTURE.GetName] [Glossary('en Ü-Tsang y los valles meridionales del Himalaya', 'TSANGPA_GLOSS')] hacia el año [DATE.GetYear]"
 TSANGPA_GLOSS: "La expansión de la lengua tibetana antigua desde Yarlung por Ü-Tsang y los valles meridionales del Himalaya vinculó a agricultores, pastores y comunidades monásticas con el mundo cultural de la meseta. En los territorios meridionales y occidentales, relacionados con los antepasados de poblaciones posteriores como los sherpas y los hablantes de kyirong-kagate, esos vínculos persistieron durante generaciones. Sin embargo, la distancia y el relieve favorecieron diferencias locales en la lengua y las costumbres."

 balti_history_loc: "Surgió entre comunidades de [CULTURE.GetName] [Glossary('establecidas en el alto Indo y Baltistán', 'BALTI_GLOSS')] hacia el año [DATE.GetYear]"
 BALTI_GLOSS: "Durante el siglo VIII, colonos tibetanos y familias vinculadas a las guarniciones se establecieron en el alto Indo y en los valles montañosos de Baltistán. Este corredor era disputado por el Imperio tibetano, la dinastía Tang y el califato por su control de los pasos hacia Asia Central. En contacto con vecinos dárdicos y túrquicos, y cada vez más separados de la meseta tras el debilitamiento del poder imperial, sus descendientes desarrollaron una identidad regional ligada a los valles de Baltistán."

 ladakhi_history_loc: "Adquirió rasgos propios a partir de [CULTURE.GetName] [Glossary('con el asentamiento de exiliados de Yarlung en Ladakh', 'LADAKHI_GLOSS')] hacia el año [DATE.GetYear]"
 LADAKHI_GLOSS: "Cuando el Imperio tibetano se fragmentó durante el siglo IX, miembros de la nobleza de Yarlung y sus seguidores emigraron hacia los altos valles de Ladakh. Allí se asentaron entre comunidades ya influidas por anteriores expansiones tibetanas. Los recién llegados aportaron tradiciones cortesanas, prácticas administrativas y vínculos religiosos. La convivencia y los matrimonios con la población local contribuyeron a una identidad ladakhí que conservó la herencia tibetana y desarrolló un carácter propio en los valles del Himalaya occidental."

 nakhi_history_loc: "Se desarrolló entre grupos de [CULTURE.GetName] [Glossary('que emigraron hacia la cuenca de Lijiang', 'NAKHI_GLOSS')] hacia el año [DATE.GetYear]"
 NAKHI_GLOSS: "Los naxi remontan sus orígenes a poblaciones de habla qiánguica que emigraron desde el borde oriental de la meseta tibetana hacia la cuenca de Lijiang, en el norte de Yunnan. La expansión de la China Tang y del reino de Nanzhao influyó en esos desplazamientos. Asentados en un corredor comercial entre el Tíbet, Yunnan y Sichuan, desarrollaron una cultura propia, conocida por las tradiciones rituales dongba y su escritura pictográfica. Sus comunidades conservaron una presencia regional duradera entre potencias vecinas más extensas."

 kirati_history_loc: "Conservó tradiciones de [CULTURE.GetName] [Glossary('entre las comunidades de las colinas del este de Nepal', 'KIRATI_GLOSS')] hacia el año [DATE.GetYear]"
 KIRATI_GLOSS: "Los kirati del este de Nepal toman su nombre de kirata, una antigua denominación sánscrita aplicada a diversos pueblos montañeses del Himalaya y sus fronteras orientales. El término aparece en la literatura india antigua, incluido el Mahabharata. Las crónicas nepalesas atribuyen a una dinastía kirata el gobierno del valle de Katmandú en un pasado remoto. Aunque los licchavi y otras potencias la sucedieron, las comunidades kirati de las colinas orientales conservaron sus lenguas, el culto a los antepasados y sus estructuras de clan."

 lhomon_history_loc: "Desarrolló una identidad local a partir de [CULTURE.GetName] [Glossary('en los valles del Himalaya oriental', 'LHOMON_GLOSS')] hacia el año [DATE.GetYear]"
 LHOMON_GLOSS: "Los lhomon habitaban los valles boscosos y las montañas donde el Himalaya oriental se une con la meseta tibetana. Se relacionan con antiguas poblaciones tibetobirmanas de las que proceden comunidades posteriores, como los monpa y otros pueblos de la región. El relieve y el aislamiento limitaron la influencia de los grandes imperios vecinos y favorecieron la continuidad de tradiciones locales de veneración de los antepasados y prácticas chamánicas."

 kachari_history_loc: "Se consolidó a partir de [CULTURE.GetName] [Glossary('entre las comunidades de la cuenca del Brahmaputra', 'KACHARI_GLOSS')] hacia el año [DATE.GetYear]"
 KACHARI_GLOSS: "Los pueblos kachari se establecieron en los valles y las colinas boscosas de la cuenca del Brahmaputra. Formaban parte de las antiguas poblaciones tibetobirmanas del noreste de la India, a menudo agrupadas por las fuentes sánscritas bajo el nombre de kirata. Sus comunidades de agricultores y cazadores se organizaban en clanes y mantenían estrechos vínculos con los ríos, los bosques y los lugares sagrados de su territorio. Algunas quedarían posteriormente integradas en el reino dimasa, aunque sus tradiciones locales eran anteriores a esa unificación política."

 tripuri_history_loc: "Se desarrolló a partir de [CULTURE.GetName] [Glossary('entre las comunidades de las colinas de Tripura', 'TRIPURI_GLOSS')] hacia el año [DATE.GetYear]"
 TRIPURI_GLOSS: "Los tripuri se establecieron en las colinas de la región de Tripura, dentro de los movimientos de población tibetobirmana que también contribuyeron a la formación de otros pueblos del noreste de la India. Su lengua, el kokborok, y su organización en clanes constituyeron los fundamentos de una identidad propia. El reino de Twipra dio expresión política a estas comunidades, cuyas tradiciones lingüísticas y sociales perduraron a través de los cambios dinásticos."

 meitei_history_loc: "Adquirió rasgos propios a partir de [CULTURE.GetName] [Glossary('en las comunidades agrícolas del valle de Manipur', 'MEITEI_GLOSS')] hacia el año [DATE.GetYear]"
 MEITEI_GLOSS: "Los meitei se establecieron en el fértil valle de Manipur, rodeado de colinas que les ofrecían cierta protección frente a las potencias de las llanuras indias, Birmania y el Tíbet. Su sociedad agrícola y sedentaria se organizó en clanes estrechamente vinculados. La vida en el valle favoreció una identidad propia, diferenciada de la de las comunidades tibetobirmanas más dispersas de las montañas circundantes."

 zo_history_loc: "Se diferenció dentro de [CULTURE.GetName] [Glossary('entre las aldeas montañesas de la frontera indobirmana', 'ZO_GLOSS')] hacia el año [DATE.GetYear]"
 ZO_GLOSS: "Los pueblos zo habitaron las montañas escarpadas y densamente boscosas de la frontera entre la India y Birmania. Formaban parte de las antiguas poblaciones tibetobirmanas del noreste de la India. Sus comunidades se organizaban en clanes y aldeas celosas de su autonomía, sin quedar reunidas de forma duradera en un reino centralizado. El relieve, los bosques y las relaciones de parentesco favorecieron tradiciones locales y formas de defensa adaptadas a su territorio."

 tani_history_loc: "Conservó tradiciones propias de [CULTURE.GetName] [Glossary('en los valles aislados del Himalaya oriental', 'TANI_GLOSS')] hacia el año [DATE.GetYear]"
 TANI_GLOSS: "Los pueblos tani, entre los que se cuentan los antepasados de comunidades como los adi y los nyishi, se establecieron en los valles y las laderas boscosas del Himalaya oriental. Formaban parte del amplio conjunto de poblaciones tibetobirmanas que antiguas fuentes sánscritas agrupaban bajo el nombre de kirata. El difícil relieve favoreció la conservación de tradiciones orales propias, una organización basada en clanes y vínculos religiosos con las montañas de su entorno."

 khampa_history_loc: "Se formó por el contacto entre [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('en la región de Kham, al este del Tíbet', 'KHAMPA_GLOSS')] hacia el año [DATE.GetYear]"
 KHAMPA_GLOSS: "Antes de la expansión de Yarlung, la región de Kham, en el este del Tíbet, estaba vinculada a poblaciones como los sumpa. La llegada de colonos y administradores tibetanos se superpuso a esas comunidades y favoreció el desarrollo de variedades lingüísticas y tradiciones regionales propias. El relieve escarpado, las rutas comerciales hacia China y la autonomía de los poderes locales dieron a Kham un carácter diferenciado, incluso bajo la soberanía nominal de gobernantes tibetanos o chinos."

 amdo_history_loc: "Se formó por el contacto entre [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('en los pastizales de Amdo, al noreste del Tíbet', 'AMDO_GLOSS')] hacia el año [DATE.GetYear]"
 AMDO_GLOSS: "Amdo, en el noreste del Tíbet, albergaba poblaciones relacionadas con los sumpa antes de la expansión de Yarlung. La lengua tibetana se difundió entre esas comunidades sin sustituir por completo sus tradiciones. Situada entre la meseta tibetana, la estepa mongola y Gansu, la región fue un espacio de contacto comercial y cultural. Sus extensos pastizales favorecieron una sociedad pastoril distinta de las comunidades agrícolas del Tíbet central."

 baima_history_loc: "Combinó tradiciones de [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('en los valles de la frontera sinotibetana', 'BAIMA_GLOSS')] hacia el año [DATE.GetYear]"
 BAIMA_GLOSS: "Los baima habitan los valles de la frontera entre la meseta tibetana y Sichuan. Sus orígenes se han relacionado con los antiguos di y otras poblaciones qiánguicas, aunque su historia y clasificación lingüística siguen siendo objeto de estudio. Pese a la prolongada influencia tibetana, conservaron tradiciones propias, entre ellas sus característicos sombreros de fieltro blanco, relatos orales y rituales anteriores a la difusión del budismo. Estos rasgos reflejan la diversidad cultural de la frontera sinotibetana."

 kinnauri_history_loc: "Conservó una herencia vinculada a [CULTURE.GetName] [Glossary('en los valles del antiguo ámbito de Zhangzhung', 'KINNAURI_GLOSS')] hacia el año [DATE.GetYear]"
 KINNAURI_GLOSS: "Los kinnauri pertenecen al antiguo ámbito lingüístico del Himalaya occidental, relacionado con Zhangzhung, el reino incorporado al Imperio tibetano en el siglo VII. Establecidos en los altos valles del actual Himachal Pradesh, conservaron lenguas vinculadas con ese mundo anterior a la expansión de Yarlung. El comercio, el budismo y la influencia política tibetana siguieron llegando desde la meseta, pero no borraron las particularidades de Kinnaur."

 yughur_history_loc: "Se formó por el contacto entre [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('tras la llegada de refugiados uigures al corredor de Hexi', 'YUGHUR_GLOSS')] hacia el año [DATE.GetYear]"
 YUGHUR_GLOSS: "Tras la destrucción del Kanato Uigur por los kirguises del Yeniséi en 840, grupos de refugiados se desplazaron hacia el corredor de Hexi, en Gansu. Allí convivieron con comunidades túrquicas y otros pueblos establecidos a lo largo de las rutas comerciales. La convivencia, los matrimonios y el contacto con tibetanos, tangutos y chinos contribuyeron a la formación de las comunidades yugur. Estas conservaron elementos de la herencia uigur mucho después de la desaparición del kanato."

 tangut_history_loc: "Se consolidó entre grupos de [CULTURE.GetName] [Glossary('reasentados desde Qinghai hacia la frontera de Ordos', 'TANGUT_GLOSS')] hacia el año [DATE.GetYear]"
 TANGUT_GLOSS: "Los tangutos se relacionan con los dangxiang, uno de los grupos del amplio mundo qiang de la frontera sinotibetana. La expansión del Imperio tibetano en el siglo VII impulsó a parte de estas comunidades hacia los dominios Tang, donde fueron asentadas en regiones fronterizas próximas a Ordos. Algunos de sus jefes reivindicaron vínculos con el prestigioso linaje tuoba de los Wei del Norte, una ascendencia discutida por los historiadores. Generaciones de vida en esa frontera de estepas y desiertos favorecieron una identidad militar y pastoril propia, vinculada tanto a sus raíces qiánguicas como a su nuevo territorio."

 sheren_history_loc: "Se diferenció dentro de [CULTURE.GetName] [Glossary('entre las comunidades montañesas vinculadas a la tradición de Panhu', 'SHEREN_GLOSS')] hacia el año [DATE.GetYear]"
 SHEREN_GLOSS: "Los she, al igual que los yao, vinculan sus orígenes con el legendario Panhu, un antepasado canino cuyos descendientes se habrían refugiado en las montañas. Esta tradición compartida refleja vínculos culturales dentro del ámbito hmong-mien. Los she se establecieron especialmente en las colinas entre Fujian, Guangdong y Jiangxi. Más tarde, esas tierras recibieron migrantes han que huían de guerras y de la escasez de tierras. La convivencia y los matrimonios entre comunidades locales y recién llegadas contribuyeron a la diversidad cultural de la región en la que se desarrollaron los hakka."

 sichuan_history_loc: "Adquirió un carácter regional a partir de [CULTURE.GetName] [Glossary('en las antiguas tierras de Ba y Shu', 'SICHUAN_GLOSS')] hacia el año [DATE.GetYear]"
 SICHUAN_GLOSS: "Antes de la expansión han, la cuenca de Sichuan albergaba los reinos de Ba y Shu, con lenguas y costumbres propias. La conquista de Qin en 316 a. C. incorporó sus territorios al mundo político chino. Durante los siglos siguientes, la migración y la administración favorecieron la difusión de la lengua y las costumbres chinas sobre aquel sustrato local. Las montañas que rodean la cuenca preservaron diferencias regionales y dificultaron su gobierno desde centros lejanos, favoreciendo una tradición cultural y política propia."

 min_history_loc: "Se desarrolló entre comunidades de [CULTURE.GetName] [Glossary('establecidas en los valles y montañas de Fujian', 'MIN_GLOSS')] hacia el año [DATE.GetYear]"
 MIN_GLOSS: "Las montañas costeras de Fujian fueron el núcleo del reino de Minyue, uno de los estados asociados a los pueblos baiyue. Su derrota frente a los Han en 111 a. C. provocó deportaciones y desplazamientos de población. En los siglos siguientes llegaron colonos han, con nuevas oleadas de refugiados durante las guerras de comienzos del siglo IV. El relieve montañoso y la separación entre valles favorecieron una gran diversidad de hablas min, muchas de ellas mutuamente ininteligibles."

 wu_history_loc: "Se transformó a partir de [CULTURE.GetName] [Glossary('con la llegada de refugiados del norte al bajo Yangtsé', 'WU_GLOSS')] hacia el año [DATE.GetYear]"
 WU_GLOSS: "En la antigüedad, el bajo Yangtsé albergaba los reinos de Wu y Yue. Sus poblaciones fueron adoptando la lengua y las costumbres chinas tras las conquistas de Chu, Qin y Han. La caída de Luoyang en 311, conocida como el desastre de Yongjia, impulsó la huida de familias aristocráticas y otros refugiados hacia el sur. La corte de los Jin Orientales se estableció después en Jiankang, la actual Nankín. El contacto entre las hablas de los recién llegados y las tradiciones locales de Wu y Yue contribuyó a la cultura regional de Jiangnan y a su posterior desarrollo literario y comercial."

 gan_history_loc: "Desarrolló rasgos regionales a partir de [CULTURE.GetName] [Glossary('en la cuenca del Gan y el lago Poyang', 'GAN_GLOSS')] hacia el año [DATE.GetYear]"
 GAN_GLOSS: "La cuenca del Gan, en Jiangxi, recibió influencias lingüísticas del antiguo reino de Chu. Tras la conquista de Qin, llegaron nuevas poblaciones a la región de Yuzhang, la actual Nanchang. Las guerras de comienzos del siglo IV y el desastre de Yongjia provocaron otra importante afluencia hacia la cuenca del lago Poyang. Estos movimientos contribuyeron a consolidar las hablas gan, situadas entre las variedades del Yangtsé y las que se desarrollarían más al sur entre las comunidades hakka."

 yue_history_loc: "Surgió del contacto entre [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('en Lingnan y el delta del río de las Perlas', 'YUE_GLOSS')] hacia el año [DATE.GetYear]"
 YUE_GLOSS: "Antes de la conquista china, Lingnan, al sur de los montes Nanling, estaba habitada por diversos pueblos baiyue, algunos relacionados con las poblaciones de habla tai. Sus comunidades siguieron siendo importantes tras la anexión de la región por los Han en 111 a. C. Durante siglos, la migración han, los matrimonios y la administración favorecieron el contacto entre el chino y las lenguas locales. Las sucesivas llegadas de población, especialmente durante las dinastías Tang y Song, contribuyeron al desarrollo de las hablas yue, entre ellas el cantonés del delta del río de las Perlas."

 xiang_history_loc: "Conservó y transformó tradiciones de [CULTURE.GetName] [Glossary('en las antiguas tierras de Chu, en Hunan', 'XIANG_GLOSS')] hacia el año [DATE.GetYear]"
 XIANG_GLOSS: "Las hablas chinas de Hunan conservan influencias relacionadas con el antiguo reino de Chu. Sobre ese sustrato se sucedieron movimientos de población y contactos con las regiones vecinas. Durante el final de la dinastía Tang y el período de las Cinco Dinastías, la llegada de hablantes de gan desde Jiangxi modificó especialmente las zonas orientales. Estas diferencias contribuyeron a la diversidad interna del xiang, con variedades más conservadoras y otras más influidas por las hablas vecinas."

 hakka_history_loc: "Se formó por el contacto entre [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('en las montañas entre Fujian, Guangdong y Jiangxi', 'HAKKA_GLOSS')] hacia el año [DATE.GetYear]"
 HAKKA_GLOSS: "Las guerras y los desplazamientos llevaron durante siglos a poblaciones han hacia el sur de China. Muchas de las tierras bajas más fértiles ya estaban ocupadas, por lo que parte de los recién llegados se estableció en las montañas entre Fujian, Guangdong y Jiangxi. Allí convivieron con los she y otras comunidades locales. El contacto, los matrimonios y la adaptación al territorio contribuyeron a una identidad propia. El nombre hakka, «familias invitadas», recordaba su condición de recién llegados, incluso después de que arraigaran en la región."

 yao_history_loc: "Se diferenció dentro de [CULTURE.GetName] [Glossary('entre las comunidades del interior montañoso del sur de China', 'YAO_GLOSS')] hacia el año [DATE.GetYear]"
 YAO_GLOSS: "Los yao, al igual que los she, vinculan sus orígenes con el legendario Panhu, cuyos descendientes se habrían refugiado en las montañas. Sus comunidades se extendieron por el interior de Guangxi, Hunan, Guangdong y Yunnan, donde practicaban la agricultura de roza y conservaban sus lenguas y tradiciones. Las fuentes chinas fueron distinguiéndolos de otros pueblos montañeses y registraron frecuentes resistencias a los tributos y a las prestaciones de trabajo obligatorio. El difícil relieve favoreció su autonomía y permitió nuevos desplazamientos cuando aumentaba la presión imperial."

 tai_history_loc: "Se extendió a partir de [CULTURE.GetName] [Glossary('con la dispersión de poblaciones tai hacia el suroeste', 'TAI_GLOSS')] hacia el año [DATE.GetYear]"
 TAI_GLOSS: "La conquista de los estados baiyue por Qin y Han incorporó progresivamente las tierras de Guangxi al mundo político chino. Las poblaciones relacionadas con los xi'ou y con las lenguas kam-tai participaron en un largo proceso de dispersión. A lo largo de muchas generaciones, comunidades de habla tai se desplazaron hacia el suroeste por los valles de Guangxi y Yunnan. Estos movimientos contribuyeron a la difusión de sus lenguas desde la cuenca del río Rojo hasta las del Irawadi y el Brahmaputra."

 kam_history_loc: "Conservó una identidad propia a partir de [CULTURE.GetName] [Glossary('en las montañas próximas a Guangxi', 'KAM_GLOSS')] hacia el año [DATE.GetYear]"
 KAM_GLOSS: "Los kam, emparentados lingüísticamente con los tai, se relacionan con las antiguas poblaciones del ámbito xi'ou de Guangxi. Mientras numerosas comunidades tai se dispersaron hacia el suroeste siguiendo los valles fluviales, los antepasados de los kam permanecieron más cerca de esa región. Se establecieron en las montañas del este de Guizhou, el oeste de Hunan y el norte de Guangxi. El relativo aislamiento favoreció una lengua propia y una organización aldeana de fuerte carácter comunitario, en la que destacan las torres del tambor y las festividades compartidas."

 be_history_loc: "Se desarrolló entre grupos de [CULTURE.GetName] [Glossary('que emigraron al norte de Hainan', 'BE_GLOSS')] hacia el año [DATE.GetYear]"
 BE_GLOSS: "Los be, también llamados ong be, están emparentados lingüísticamente con los pueblos tai. Sus antepasados llegaron al norte de Hainan a través de la península de Leizhou y el estrecho que separa la isla del continente. Su trayectoria fue distinta de la de los hlai, establecidos principalmente en las montañas del sur. Las comunidades be desarrollaron una identidad costera vinculada a la pesca, la agricultura y los intercambios del norte de Hainan, diferenciada tanto de sus parientes continentales como de sus vecinos insulares."

 siamese_history_loc: "Se formó por la integración de [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('en la cuenca del Chao Phraya', 'SIAMESE_GLOSS')] hacia el año [DATE.GetYear]"

 SIAMESE_GLOSS: "Durante la expansión de los pueblos de habla tai hacia el suroeste, algunas comunidades se asentaron en la fértil cuenca del Chao Phraya. Allí encontraron poblaciones mon vinculadas a la tradición de Dvaravati. Los recién llegados incorporaron prácticas administrativas, religiosas y artísticas de estas comunidades, al tiempo que consolidaban su propio poder político. Generaciones de matrimonios e intercambios culturales integraron el budismo y las tradiciones mon en la naciente sociedad siamesa, que llegaría a ocupar una posición central en el sudeste asiático continental."

 lanna_history_loc: "Combinó tradiciones de [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('en los valles del Ping y el Kok', 'LANNA_GLOSS')] hacia el año [DATE.GetYear]"
 LANNA_GLOSS: "Los migrantes tai que se establecieron en los valles del Ping y el Kok, en el actual norte de Tailandia, encontraron una región marcada por el reino mon de Hariphunchai, con centro en Lamphun. Adoptaron buena parte de sus tradiciones budistas, sistemas de escritura y prácticas cortesanas. La población mon se integró gradualmente en el reino de Lanna mediante la convivencia y los matrimonios. Esa herencia dejó una profunda huella en el arte, la arquitectura religiosa y los manuscritos de Lanna, incluso después del predominio político y lingüístico tai."

 lao_history_loc: "Se desarrolló por el contacto entre [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('en el curso medio del Mekong', 'LAO_GLOSS')] hacia el año [DATE.GetYear]"
 LAO_GLOSS: "Las comunidades tai que se asentaron en el curso medio del Mekong llegaron a una región influida por los poderes jemeres y por las tradiciones religiosas difundidas desde Angkor. Al formar sus principados, incorporaron prácticas administrativas, artísticas y religiosas de sus vecinos. Los intercambios y los matrimonios contribuyeron a la formación de la identidad lao. La geografía de los valles favoreció, a su vez, el desarrollo de variedades lingüísticas, escrituras y tradiciones cortesanas propias, distintas de las comunidades tai establecidas más al oeste."

 ahom_history_loc: "Se formó por la integración de [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('tras la llegada de los seguidores de Sukaphaa a Assam', 'AHOM_GLOSS')] hacia el año [DATE.GetYear]"
 AHOM_GLOSS: "Los seguidores tai de Sukaphaa cruzaron los montes Patkai y llegaron al valle del Brahmaputra, en Assam, habitado por comunidades bodo-kachari y otros pueblos. Los recién llegados se asentaron entre esas poblaciones y establecieron alianzas matrimoniales, también entre las familias dirigentes. La incorporación de conocimientos agrícolas, redes locales y tradiciones políticas contribuyó a consolidar el poder ahom. Durante las generaciones siguientes, la convivencia entre los migrantes tai y las comunidades de Assam dio lugar a una identidad que combinaba ambas herencias."

 shan_history_loc: "Se consolidó entre comunidades de [CULTURE.GetName] [Glossary('establecidas en los valles montañosos del noreste de Birmania', 'SHAN_GLOSS')] hacia el año [DATE.GetYear]"
 SHAN_GLOSS: "Los migrantes tai que avanzaron hacia el oeste se establecieron en los valles y montañas del actual noreste de Birmania. Allí formaron numerosos principados, separados por un relieve que dificultaba la unificación política. El contacto con birmanos, chinos y otros pueblos montañeses favoreció una cultura abierta a influencias diversas. Los gobernantes shan combinaron el comercio y las alianzas con las potencias vecinas para conservar su autoridad local, mientras sus comunidades mantenían tradiciones lingüísticas y sociales propias."

 bouxcuengh_history_loc: "Conservó una identidad regional de [CULTURE.GetName] [Glossary('entre las comunidades que permanecieron en Guangxi', 'BOUXCUENGH_GLOSS')] hacia el año [DATE.GetYear]"
 BOUXCUENGH_GLOSS: "Mientras numerosos pueblos tai se desplazaban hacia el suroeste, los bouxcuengh, vinculados a los posteriores zhuang, permanecieron en Guangxi, dentro del antiguo ámbito de los xi'ou. Sus comunidades conservaron una importante presencia en las colinas y los valles bajo sucesivas administraciones chinas, desde las guarniciones de Qin y Han hasta las prefecturas fronterizas de Tang y Song. La continuidad de sus lenguas tai septentrionales y de sus tradiciones agrícolas sostuvo una identidad propia pese a siglos de contacto con la población han."

 chong_history_loc: "Desarrolló rasgos propios dentro de [CULTURE.GetName] [Glossary('en los montes Cardamomos y las colinas de Chanthaburi', 'CHONG_GLOSS')] hacia el año [DATE.GetYear]"
 CHONG_GLOSS: "Los chong pertenecen a los pueblos de lenguas peáricas, una rama austroasiática distinta del jemer. Se establecieron en los montes Cardamomos y las colinas de Chanthaburi, en la actual frontera entre Tailandia y Camboya. El contacto prolongado con el mundo angkoriano dejó una profunda influencia en su religión y cultura material. Sin embargo, las comunidades de los valles montañosos conservaron sus lenguas y tradiciones, favorecidas por un relieve que limitaba la integración en las administraciones de las tierras bajas."

 muong_history_loc: "Siguió una evolución distinta de [CULTURE.GetName] [Glossary('entre las comunidades de las tierras altas próximas al río Rojo', 'MUONG_GLOSS')] hacia el año [DATE.GetYear]"
 MUONG_GLOSS: "Los muong y los vietnamitas proceden de poblaciones emparentadas del ámbito viet-muong. Durante los siglos de administración china, los habitantes del delta del río Rojo incorporaron vocabulario, escritura y prácticas cortesanas de origen chino. Las comunidades de las tierras altas estuvieron menos expuestas a esas influencias y conservaron otras formas de la herencia compartida. Tras la victoria de Ngô Quyền en 938 y la consolidación de un Estado vietnamita independiente, las diferencias entre los kinh de las tierras bajas y sus parientes muong se hicieron más marcadas."

 wa_history_loc: "Se diferenció dentro de [CULTURE.GetName] [Glossary('entre las aldeas autónomas de la frontera entre Yunnan y Birmania', 'WA_GLOSS')] hacia el año [DATE.GetYear]"
 WA_GLOSS: "Los wa y los palaung hablan lenguas de la rama palaúngica de la familia austroasiática. Mientras algunas comunidades palaung se organizaron en principados bajo una soberanía variable de gobernantes shan o birmanos, muchas aldeas wa conservaron mayor autonomía en las montañas entre Yunnan y la meseta Shan. La defensa del territorio y prácticas rituales como la caza de cabezas contribuyeron a limitar la intervención exterior. Las diferencias de organización política y contacto con los vecinos reforzaron identidades propias dentro de un ámbito lingüístico emparentado."

 katang_history_loc: "Conservó rasgos propios de [CULTURE.GetName] [Glossary('en las estribaciones de la cordillera Annamita', 'KATANG_GLOSS')] hacia el año [DATE.GetYear]"
 KATANG_GLOSS: "Los katang hablan una lengua katuica de la familia austroasiática. Habitan las estribaciones boscosas de la cordillera Annamita, entre las áreas de influencia jemer, lao y vietnamita. Sus comunidades mantuvieron vínculos cambiantes de tributo, comercio y conflicto con los estados de las tierras bajas. El relieve dificultó su incorporación permanente a una administración centralizada y favoreció la conservación de su lengua y organización social, pese a la llegada de influencias religiosas y culturales de las regiones vecinas."

 bruso_history_loc: "Desarrolló una identidad local a partir de [CULTURE.GetName] [Glossary('entre los valles de la cordillera Annamita', 'BRUSO_GLOSS')] hacia el año [DATE.GetYear]"
 BRUSO_GLOSS: "Los bru, como los katang, pertenecen al ámbito lingüístico katuico de la familia austroasiática. Sus comunidades se distribuyeron por las tierras altas de la cordillera Annamita, donde el relieve dificultaba el control de las administraciones jemeres, lao y vietnamitas. La separación entre valles, los contactos fronterizos y las tradiciones locales fueron diferenciando gradualmente su lengua y sus costumbres de las de otros pueblos katuicos. Esta identidad se desarrolló a lo largo de generaciones, sin depender de una única ruptura política."

 mnong_history_loc: "Se diferenció dentro de [CULTURE.GetName] [Glossary('en las tierras altas vinculadas al comercio con Champa', 'MNONG_GLOSS')] hacia el año [DATE.GetYear]"
 MNONG_GLOSS: "Los mnong hablan lenguas bahnáricas de la familia austroasiática y habitan las tierras altas centrales de Vietnam y regiones vecinas. Mantuvieron relaciones comerciales y tributarias con Champa, sin quedar sometidos de manera uniforme a su administración. Entre sus actividades destacaba la captura y domesticación de elefantes, que podían intercambiar con las poblaciones de las tierras bajas. Estas relaciones vincularon económicamente a las comunidades montañesas con los poderes costeros, al tiempo que conservaron una considerable autonomía política."

 stieng_history_loc: "Desarrolló tradiciones propias a partir de [CULTURE.GetName] [Glossary('en la frontera montañesa entre las influencias cham y jemer', 'STIENG_GLOSS')] hacia el año [DATE.GetYear]"
 STIENG_GLOSS: "Los stieng pertenecen al ámbito lingüístico bahnárico y se establecieron en el extremo meridional de las tierras altas centrales de Vietnam y zonas próximas de Camboya. Recibieron influencias cham y jemeres a través del comercio y de relaciones políticas cambiantes. La situación fronteriza y el relieve permitieron conservar tradiciones propias. Su vida comunitaria se articulaba en torno a la agricultura itinerante y a grupos familiares extensos, en ocasiones reunidos en grandes casas comunales."

 dega_history_loc: "Se desarrolló a partir de [CULTURE.GetName] [Glossary('entre las comunidades de las tierras altas centrales de Vietnam', 'DEGA_GLOSS')] hacia el año [DATE.GetYear]"
 DEGA_GLOSS: "Las comunidades conocidas como dega habitaban las mesetas y los valles de las tierras altas centrales de Vietnam. Sus contactos con Champa incluían redes comerciales y relaciones tributarias de intensidad variable. La separación entre aldeas y el relieve favorecieron fuertes identidades locales y de clan, con escasa centralización política. Estas poblaciones montañesas conservaron una importante diversidad lingüística y cultural."

 semang_history_loc: "Conservó tradiciones de [CULTURE.GetName] [Glossary('entre las comunidades cazadoras y recolectoras de la península malaya', 'SEMANG_GLOSS')] hacia el año [DATE.GetYear]"
 SEMANG_GLOSS: "Los antepasados de los semang vivían de la caza y la recolección en las selvas de la península malaya mucho antes del surgimiento de los reinos agrícolas y comerciales de sus costas. Organizados en pequeños grupos móviles, adaptaban sus desplazamientos a la disponibilidad estacional de alimentos, animales y productos forestales. Aunque mantuvieron intercambios con comunidades vecinas, conservaron formas de vida estrechamente vinculadas al bosque a lo largo de los cambios políticos de las tierras bajas."

 senoi_history_loc: "Se diferenció dentro de [CULTURE.GetName] [Glossary('entre las comunidades agrícolas de las montañas de la península malaya', 'SENOI_GLOSS')] hacia el año [DATE.GetYear]"
 SENOI_GLOSS: "Los pueblos senoi se establecieron en la cordillera central de la península malaya. Combinaban la agricultura de roza con la caza y la recolección, en contacto tanto con comunidades forestales como con poblaciones de las tierras bajas. Su relativa distancia de los puertos y las cortes favoreció la continuidad de tradiciones locales. Los relatos orales, las prácticas rituales y, en algunas comunidades, la interpretación de los sueños formaban parte de la vida social y de sus relaciones con el entorno."

 acehnese_history_loc: "Se desarrolló entre grupos de [CULTURE.GetName] [Glossary('que llegaron por mar al norte de Sumatra', 'ACEHNESE_GLOSS')] hacia el año [DATE.GetYear]"
 ACEHNESE_GLOSS: "El acehnés pertenece a la rama chámica de las lenguas austronesias, al igual que el cham del sudeste asiático continental, pese a hablarse en el extremo norte de Sumatra. Esa relación apunta a antiguos movimientos marítimos de población entre el continente y la isla. Las rutas que conectaban ambas regiones favorecieron después el comercio de especias y pimienta. Siglos de contacto con malayos, indios y árabes incorporaron numerosos préstamos, mientras la estructura de la lengua conservó su parentesco chámico."

 minangkabau_history_loc: "Adquirió rasgos propios a partir de [CULTURE.GetName] [Glossary('en los valles interiores de Sumatra occidental', 'MINANGKABAU_GLOSS')] hacia el año [DATE.GetYear]"
 MINANGKABAU_GLOSS: "Los minangkabau hablan una lengua maláyica, emparentada con el malayo antiguo documentado en las inscripciones de Srivijaya desde el siglo VII. Establecidos en los fértiles valles del interior de Sumatra occidental, desarrollaron tradiciones distintas de las comunidades costeras. Destaca su organización matrilineal, en la que la pertenencia al clan y buena parte de los bienes ancestrales se transmiten por vía femenina. Esta estructura perduró junto con formas de autoridad política y religiosa ejercidas principalmente por hombres."

 kerinci_history_loc: "Se diferenció dentro de [CULTURE.GetName] [Glossary('en los valles aislados de Kerinci', 'KERINCI_GLOSS')] hacia el año [DATE.GetYear]"
 KERINCI_GLOSS: "Los habitantes de Kerinci, en el interior montañoso de Sumatra, hablan una lengua del grupo maláyico. Sus relaciones con otras comunidades de la isla se combinaron con un notable aislamiento entre altas montañas y volcanes. Ese entorno favoreció el desarrollo de variedades lingüísticas y costumbres propias. La región conservó además la escritura incung, empleada en textos tradicionales y documentos locales, testimonio de una cultura escrita diferenciada dentro de Sumatra."

 basemah_history_loc: "Desarrolló una identidad regional a partir de [CULTURE.GetName] [Glossary('en las tierras altas del sur de Sumatra', 'BASEMAH_GLOSS')] hacia el año [DATE.GetYear]"
 BASEMAH_GLOSS: "Los basemah, también llamados pasemah, se establecieron en las tierras altas próximas al monte Dempo, en el sur de Sumatra. Su lengua maláyica y su derecho consuetudinario evolucionaron en relativo aislamiento de los grandes centros comerciales costeros. La región alberga numerosos monumentos megalíticos, con figuras de guerreros, animales y seres asociados al mundo ritual. Aunque la relación exacta entre sus constructores y las poblaciones posteriores es incierta, estos restos testimonian una larga historia cultural en las tierras altas."

 iban_history_loc: "Se extendió a partir de [CULTURE.GetName] [Glossary('mediante las migraciones fluviales desde Borneo occidental', 'IBAN_GLOSS')] hacia el año [DATE.GetYear]"
 IBAN_GLOSS: "Los iban hablan una lengua maláyica, emparentada con el malayo, mientras muchos otros pueblos dayak de Borneo pertenecen a ramas austronesias distintas. Sus comunidades se organizaron en casas comunales y combinaron el cultivo del arroz con tradiciones guerreras que incluían la caza de cabezas. Las tradiciones orales describen migraciones desde la cuenca del Kapuas, en Borneo occidental, hacia los sistemas fluviales del actual Sarawak. La búsqueda de nuevas tierras para la agricultura itinerante impulsó estos desplazamientos durante generaciones."

 komering_history_loc: "Desarrolló rasgos locales a partir de [CULTURE.GetName] [Glossary('en la cuenca del río Komering', 'KOMERING_GLOSS')] hacia el año [DATE.GetYear]"
 KOMERING_GLOSS: "Los komering toman su nombre del río de Sumatra meridional junto al que se establecieron. Su lengua y sus tradiciones jurídicas están estrechamente relacionadas con las de Lampung. Se los vincula con el ámbito consuetudinario pepadun y con migraciones del interior, frente a las comunidades costeras saibatin. La vida en la cuenca del Komering favoreció una identidad fluvial propia, sin romper sus vínculos culturales y lingüísticos con las poblaciones de Lampung situadas más al sur."

 banjar_history_loc: "Surgió del contacto entre [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('en los puertos y ríos del sur de Borneo', 'BANJAR_GLOSS')] hacia el año [DATE.GetYear]"
 BANJAR_GLOSS: "Los banjar se formaron en el sur de Borneo, especialmente en torno al delta del Barito, mediante el contacto entre comerciantes y colonos malayos y comunidades dayak, entre ellas los ngaju. Las rutas que unían el mar de Java con el interior fluvial favorecieron la convivencia, los matrimonios y los intercambios. Con el tiempo se difundió también el islam. El comercio de pimienta, diamantes y productos forestales contribuyó a una identidad y una lengua propias, vinculadas tanto a los puertos como a los ríos del interior."

 burmese_history_loc: "Se consolidó por la integración de [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('en el valle del Irawadi', 'BURMESE_GLOSS')] hacia el año [DATE.GetYear]"
 BURMESE_GLOSS: "Los bamar avanzaron hacia el valle del Irawadi entre los siglos VII y IX, en un contexto de expansión del reino de Nanzhao. Las incursiones de este último, incluida la que afectó a Halin en 832, debilitaron los centros pyu. Los recién llegados se asentaron entre sus poblaciones y consolidaron su poder en torno a Bagan. Durante los siglos siguientes, el contacto favoreció la integración de tradiciones urbanas, religiosas y culturales pyu en la sociedad birmana. La lengua pyu continuó documentándose durante parte de ese proceso, antes de perder terreno frente al birmano."

 rakhine_history_loc: "Combinó tradiciones de [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('en la costa de Arakán', 'RAKHINE_GLOSS')] hacia el año [DATE.GetYear]"
 RAKHINE_GLOSS: "Antes de la expansión de las comunidades de habla birmana, la costa de Arakán albergaba centros como Vesali, gobernado por la dinastía Chandra. Las inscripciones sánscritas y las tradiciones budistas e hinduistas reflejan sus vínculos con la bahía de Bengala. La llegada de poblaciones desde el este de los montes de Arakán abrió un largo período de contacto e integración. La identidad rakáin combinó esa herencia costera con la difusión de una lengua emparentada con el birmano y con nuevas formas de organización política."

 achang_history_loc: "Se desarrolló entre comunidades de [CULTURE.GetName] [Glossary('de los valles de Yunnan occidental', 'ACHANG_GLOSS')] hacia el año [DATE.GetYear]"
 ACHANG_GLOSS: "Los orígenes de los achang se relacionan con antiguos movimientos de poblaciones tibetobirmanas hacia las montañas de Yunnan. Algunas fuentes chinas vinculan a sus antepasados con los xunchuan, incluidos en la esfera del reino de Nanzhao. Sus comunidades estuvieron presentes en los valles del oeste de Yunnan y posteriormente en la región de Dehong, junto a Birmania. El contacto con han, bai, dai y birmanos incorporó nuevas influencias sin borrar su lengua ni sus tradiciones locales."

 hani_history_loc: "Adquirió rasgos propios a partir de [CULTURE.GetName] [Glossary('entre las comunidades de arrozales en terrazas de Yunnan', 'HANI_GLOSS')] hacia el año [DATE.GetYear]"
 HANI_GLOSS: "La unificación de los seis zhao por Piluoge durante el siglo VIII dio origen al reino de Nanzhao y transformó las relaciones políticas de Yunnan. Las poblaciones de las montañas, entre ellas las vinculadas con los antepasados de los hani, conservaron tradiciones propias en los márgenes de los centros de poder. Los hani desarrollaron complejos sistemas de arrozales en terrazas, adaptados a laderas escarpadas. La gestión comunitaria del agua y de los cultivos reforzó su arraigo en ese paisaje montañoso."

 lisu_history_loc: "Se diferenció dentro de [CULTURE.GetName] [Glossary('entre las comunidades montañesas del ámbito de Nanzhao', 'LISU_GLOSS')] hacia el año [DATE.GetYear]"
 LISU_GLOSS: "La expansión de Nanzhao durante el siglo VIII situó a las comunidades montañesas de Yunnan junto a un poder regional creciente, sin incorporarlas de manera uniforme a su administración. Los lisu combinaron la caza, la agricultura de roza y los intercambios por rutas de montaña. Durante los siglos posteriores, sus comunidades se desplazaron hacia el suroeste, llegando al norte de Birmania y, más tarde, a Tailandia. Esas migraciones extendieron su lengua y sus costumbres por un amplio territorio montañoso."

 assamese_history_loc: "Se desarrolló a partir de [CULTURE.GetName] [Glossary('en las comunidades del valle del Brahmaputra', 'ASSAMESE_GLOSS')] hacia el año [DATE.GetYear]"
 ASSAMESE_GLOSS: "El reino de Kamarupa abarcó gran parte del valle del Brahmaputra y, en distintos períodos, territorios vecinos. Sus inscripciones sánscritas contienen rasgos de las hablas indoarias locales, conocidas como prácrito de Kamarupa. Estas variedades se diferenciaron gradualmente de las de Bengala y otras regiones orientales. El contacto con comunidades tibetobirmanas y austroasiáticas contribuyó a su evolución. De ese ámbito lingüístico surgió el asamés, que desarrolló una tradición literaria propia pese a compartir raíces con otras lenguas indoarias orientales."

 rajbongshi_history_loc: "Siguió una evolución regional de [CULTURE.GetName] [Glossary('en los territorios occidentales del antiguo Kamarupa', 'RAJBONGSHI_GLOSS')] hacia el año [DATE.GetYear]"
 RAJBONGSHI_GLOSS: "Tras la fragmentación de Kamarupa, las hablas de su antiguo territorio siguieron trayectorias regionales distintas. En el valle oriental del Brahmaputra se desarrollaron variedades relacionadas con el asamés, mientras que en el oeste, en torno a Kamata y Cooch Behar, evolucionaron las hablas kamta. Los rajbongshi están vinculados con esta tradición occidental. Su lengua y su identidad reflejan la posición de la región entre el mundo bengalí y el valle del Brahmaputra, así como sus contactos con otras poblaciones locales."

 chutia_history_loc: "Se consolidó en contacto con [CULTURE.GetName] [Glossary('entre las poblaciones del alto Brahmaputra', 'CHUTIA_GLOSS')] hacia el año [DATE.GetYear]"
 CHUTIA_GLOSS: "La fragmentación de Kamarupa permitió el desarrollo de nuevos poderes en el valle del Brahmaputra. En su extremo oriental se consolidó el reino chutia, en una región de poblaciones tibetobirmanas e indoarias. El contacto con comunidades indoarias, las tradiciones religiosas de Assam y los cambios políticos transformaron gradualmente su sociedad. La posterior difusión del asamés no debe confundirse con un origen exclusivamente indoario: las relaciones entre las poblaciones y lenguas del reino siguen siendo objeto de estudio."

 bhojpuri_history_loc: "Desarrolló rasgos propios a partir de [CULTURE.GetName] [Glossary('en la llanura del Ganges medio', 'BHOJPURI_GLOSS')] hacia el año [DATE.GetYear]"
 BHOJPURI_GLOSS: "Las comunidades agrícolas y mercantiles del Ganges medio, en el actual este de Uttar Pradesh y oeste de Bihar, participaron en los cambios políticos que siguieron a la muerte de Harsha. Entre períodos de fragmentación y reorganización regional, sus hablas indoarias evolucionaron de forma diferenciada. El territorio situado entre Magadha y las antiguas tierras de Kosala desarrolló tradiciones locales que contribuyeron a la identidad bhojpuri. Su continuidad dependió de las comunidades rurales y urbanas, además de las dinastías que gobernaron la región."

 maithili_history_loc: "Cultivó una tradición propia a partir de [CULTURE.GetName] [Glossary('en los centros agrícolas y literarios de Mithila', 'MAITHILI_GLOSS')] hacia el año [DATE.GetYear]"
 MAITHILI_GLOSS: "El maithili pertenece al conjunto indoario oriental y comparte raíces históricas con otras lenguas de Bihar. La región de Mithila, con sus ciudades, templos y comunidades de estudiosos, favoreció una tradición literaria propia. Agricultores, poetas y eruditos transmitieron una lengua vinculada al prestigio intelectual y religioso del territorio. Los versos de Vidyapati serían una de sus expresiones más célebres. Esta continuidad cultural reforzó una identidad que trascendió los cambios de fronteras y dinastías."

 magadhi_history_loc: "Transformó la herencia de [CULTURE.GetName] [Glossary('entre las comunidades de la antigua Magadha', 'MAGADHI_GLOSS')] hacia el año [DATE.GetYear]"
 MAGADHI_GLOSS: "Magadha había sido uno de los grandes centros políticos de los imperios Maurya y Gupta. Los cambios posteriores, incluida la fragmentación del norte de la India tras la muerte de Harsha, alteraron la vida de sus comunidades. La expansión del poder pala desde el siglo VIII contribuyó a una nueva organización regional. Las hablas locales continuaron evolucionando entre agricultores, comerciantes y habitantes de las ciudades, manteniendo el nombre y la memoria de Magadha en la tradición lingüística magahi."

 nagpuri_history_loc: "Se desarrolló a partir de [CULTURE.GetName] [Glossary('como lengua de contacto en la meseta de Chota Nagpur', 'NAGPURI_GLOSS')] hacia el año [DATE.GetYear]"
 NAGPURI_GLOSS: "El nagpuri, también conocido como sadri, pertenece al ámbito de las lenguas indoarias de Bihar y regiones vecinas. Se desarrolló en la meseta boscosa de Chota Nagpur, al sur de la llanura del Ganges. Allí llegó a servir de lengua de comunicación entre comunidades diversas, incluidas poblaciones munda de habla austroasiática. Su uso en el comercio y en la vida cotidiana se extendió más allá de sus hablantes nativos, mientras muchos grupos conservaban sus propias lenguas para otros ámbitos comunitarios."

 malvi_history_loc: "Adquirió un carácter regional a partir de [CULTURE.GetName] [Glossary('en la meseta de Malwa', 'MALVI_GLOSS')] hacia el año [DATE.GetYear]"
 MALVI_GLOSS: "El malví comparte rasgos lingüísticos con las hablas de Rajastán, pero se desarrolló en la meseta de Malwa, al sureste de las regiones de Marwar y Mewar. Los suelos volcánicos y las condiciones agrícolas de la meseta favorecieron formas de vida distintas de las zonas más áridas del oeste. Esa geografía, junto con los contactos comerciales y los poderes regionales, contribuyó a una identidad y un habla propias, vinculadas al conjunto lingüístico y cultural de la India noroccidental."

 kumaoni_history_loc: "Se diferenció dentro de [CULTURE.GetName] [Glossary('en los principados montañeses de Kumaon', 'KUMAONI_GLOSS')] hacia el año [DATE.GetYear]"
 KUMAONI_GLOSS: "Los kumaoníes comparten con otras poblaciones del Himalaya central una herencia lingüística pahari y vínculos históricos con los khas. Las comunidades indoarias establecidas en las montañas desarrollaron diferencias locales favorecidas por el relieve y las divisiones políticas. Kumaon quedó organizado en principados con una trayectoria distinta de la de los territorios que posteriormente formarían Nepal. Esa historia regional contribuyó a preservar el kumaoní como lengua propia dentro del ámbito pahari."

 kutchi_history_loc: "Desarrolló rasgos propios a partir de [CULTURE.GetName] [Glossary('en la región marítima de Kutch', 'KUTCHI_GLOSS')] hacia el año [DATE.GetYear]"
 KUTCHI_GLOSS: "La lengua de Kutch está estrechamente relacionada con el sindhi y ha recibido importantes influencias del guyaratí. La posición de la región entre Sind y Guyarat, junto con su relativo aislamiento, favoreció una identidad diferenciada. Sus comunidades participaron en las rutas marítimas del mar Arábigo y desarrollaron amplias redes mercantiles. El contacto comercial y cultural con sus vecinos dio forma al kutchí, sin borrar sus vínculos con las hablas del bajo Indo."

 kathiawari_history_loc: "Se consolidó regionalmente a partir de [CULTURE.GetName] [Glossary('en la península de Kathiawar', 'KATHIAWARI_GLOSS')] hacia el año [DATE.GetYear]"
 KATHIAWARI_GLOSS: "La península de Kathiawar, también conocida como Saurashtra, desarrolló variedades regionales del guyaratí y una identidad vinculada a sus comunidades y poderes locales. Su nombre se relaciona con los clanes kathi. La existencia de numerosos principados y una larga costa abierta al mar Arábigo favoreció tradiciones políticas y mercantiles propias. Estas diferencias regionales coexistieron con estrechos vínculos lingüísticos y culturales con el resto de Guyarat."

 gujarati_history_loc: "Se desarrolló a partir de [CULTURE.GetName] [Glossary('entre las comunidades de la antigua Gurjaratra', 'GUJARATI_GLOSS')] hacia el año [DATE.GetYear]"
 GUJARATI_GLOSS: "El nombre de Guyarat se relaciona con los gurjara, documentados en la región desde la Antigüedad tardía, aunque sus orígenes siguen siendo debatidos. Bajo sucesivas dinastías, las comunidades agrícolas y mercantiles mantuvieron una intensa vida regional. Vallabhi, capital de los maitraka, destacó como centro político y de enseñanza budista. La evolución de las hablas locales y la continuidad de esas redes sociales contribuyeron a la formación de la identidad guyaratí, que perduró más allá de las dinastías que gobernaron el territorio."

 awadhi_history_loc: "Conservó y transformó la herencia de [CULTURE.GetName] [Glossary('en el valle del Sarayu y el entorno de Ayodhya', 'AWADHI_GLOSS')] hacia el año [DATE.GetYear]"
 AWADHI_GLOSS: "Las comunidades del valle del Sarayu conservaron la memoria del antiguo Kosala y el prestigio religioso de Ayodhya, vinculada a Rama. La región participó también en la historia de las tradiciones budistas y jainistas. Aunque quedó integrada en poderes más amplios, sus agricultores, peregrinos y centros religiosos mantuvieron vínculos locales duraderos. La cercanía de Kannauj reforzó su participación en la vida política del norte de la India. La lengua awadhi se desarrolló en ese entorno de continuidad regional y cambios de gobierno."

 hindustani_history_loc: "Evolucionó a partir de [CULTURE.GetName] [Glossary('entre las comunidades del territorio entre el Yamuna y el Ganges', 'HINDUSTANI_GLOSS')] hacia el año [DATE.GetYear]"
 HINDUSTANI_GLOSS: "Las poblaciones del territorio entre el Yamuna y el Ganges compartían una tradición lingüística relacionada con el prácrito shauraseni, cuyo prestigio se asociaba a centros como Mathura. Tras la muerte de Harsha en 647, la fragmentación política dio paso a numerosos poderes regionales. Las comunidades agrícolas y comerciales mantuvieron sus redes y sus hablas a través de estos cambios. La evolución de esas variedades indoarias occidentales contribuyó al ámbito lingüístico del que más tarde surgirían el hindaví y otras formas del hindi occidental."

 oriya_history_loc: "Desarrolló una identidad regional a partir de [CULTURE.GetName] [Glossary('en las llanuras costeras de la antigua Kalinga', 'ORIYA_GLOSS')] hacia el año [DATE.GetYear]"
 ORIYA_GLOSS: "Las comunidades de las llanuras costeras de Kalinga combinaron la agricultura con un activo comercio marítimo por la bahía de Bengala. Sus contactos alcanzaron distintas regiones del sudeste asiático. La memoria de Kalinga y las tradiciones religiosas locales persistieron bajo sucesivos poderes. Durante el siglo VII, los shailodbhava patrocinaron templos y centros cortesanos que reforzaron la vida cultural regional. La evolución de la lengua y la continuidad de estas comunidades contribuyeron a la formación de la identidad odia."

 bengali_history_loc: "Se consolidó a partir de [CULTURE.GetName] [Glossary('entre las comunidades del bajo Ganges', 'BENGALI_GLOSS')] hacia el año [DATE.GetYear]"
 BENGALI_GLOSS: "Las comunidades del bajo Ganges desarrollaron sus hablas a partir del ámbito indoario oriental, en un paisaje de ríos y suelos renovados por las inundaciones. La agricultura y el comercio sostuvieron redes que atravesaban las divisiones políticas. La consolidación del reino de Gauda bajo Shashanka, a comienzos del siglo VII, fue una etapa de esa historia, sin constituir por sí sola el origen de una lengua o un pueblo. A través de posteriores períodos de fragmentación y reunificación, se fueron formando la lengua y la identidad bengalíes."

 marathi_history_loc: "Desarrolló una tradición propia a partir de [CULTURE.GetName] [Glossary('en la meseta del Decán occidental', 'MARATHI_GLOSS')] hacia el año [DATE.GetYear]"
 MARATHI_GLOSS: "Las comunidades del Decán occidental cultivaban sus suelos volcánicos y participaban en extensas redes comerciales. El prácrito maharashtri gozaba de prestigio literario y se empleaba en la poesía y el teatro clásico. Durante el siglo VII, el poder chalukya y su resistencia a la expansión de Harsha reforzaron la autonomía política de parte del Decán. Sobre esta herencia lingüística y regional evolucionaron las hablas maratíes, transmitidas por comunidades agrícolas, mercantiles y cortesanas a través de sucesivos cambios dinásticos."

 hindustani_proper_history_loc: "Se transformó por el contacto entre [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('bajo la influencia de las cortes del Sultanato de Delhi', 'HINDUSTANI_PROPER_GLOSS')] hacia el año [DATE.GetYear]"
 HINDUSTANI_PROPER_GLOSS: "La consolidación del Sultanato de Delhi desde 1206 intensificó el contacto entre las hablas indoarias del norte y las tradiciones cortesanas persas y túrquicas. La administración, la poesía y la vida urbana favorecieron la incorporación de vocabulario persa y árabe. Autores como Amir Khusrau emplearon el hindaví junto al persa, dentro de un entorno literario multilingüe. La lengua conservó su estructura indoaria mientras desarrollaba nuevos registros. Este proceso contribuyó a la historia del indostaní y de las posteriores tradiciones literarias del hindi y el urdu."

 sambalpuri_history_loc: "Se diferenció dentro de [CULTURE.GetName] [Glossary('por los contactos con las comunidades de las tierras altas de Sambalpur', 'SAMBALPURI_GLOSS')] hacia el año [DATE.GetYear]"
 SAMBALPURI_GLOSS: "Las comunidades del interior de Sambalpur mantuvieron una trayectoria distinta de las llanuras costeras de Odisha. Sus contactos con pueblos adivasi y otras poblaciones de las tierras altas influyeron en la lengua, las costumbres y la vida económica. Esa orientación interior favoreció una identidad regional propia dentro del ámbito lingüístico de Odisha, con vínculos históricos con el odia y con las hablas de regiones vecinas."

 kannauji_history_loc: "Adquirió rasgos propios a partir de [CULTURE.GetName] [Glossary('en las comunidades del entorno de Kannauj', 'KANNAUJI_GLOSS')] hacia el año [DATE.GetYear]"
 KANNAUJI_GLOSS: "Kannauj y las comunidades de su entorno ocuparon una posición central en las rutas del norte de la India. La ciudad fue disputada por potencias rivales, especialmente durante la lucha entre palas, gurjara-pratiharas y rashtrakutas. Los cambios de gobierno, las migraciones y el comercio multiplicaron los contactos lingüísticos. En ese entorno se desarrolló el kannaují, una variedad del hindi occidental cuya identidad regional persistió más allá de las dinastías que compitieron por la ciudad."

 haryanvi_history_loc: "Desarrolló una identidad regional a partir de [CULTURE.GetName] [Glossary('en las llanuras de Haryana', 'HARYANVI_GLOSS')] hacia el año [DATE.GetYear]"
 HARYANVI_GLOSS: "Las comunidades agrícolas y pastoriles de las llanuras al oeste de Delhi conservaron vínculos con Kurukshetra, escenario de la gran guerra del Mahabharata según la tradición. El prestigio religioso de la región atrajo peregrinos y eruditos durante siglos. A través de sucesivos cambios políticos, sus habitantes mantuvieron redes locales y costumbres propias. En este territorio se desarrolló el haryanví, cuya identidad lingüística y regional se relaciona tanto con la vida rural como con la memoria cultural del antiguo ámbito kuru."

 braji_history_loc: "Cultivó una tradición propia a partir de [CULTURE.GetName] [Glossary('en torno a Mathura y los lugares de devoción a Krishna', 'BRAJI_GLOSS')] hacia el año [DATE.GetYear]"
 BRAJI_GLOSS: "La región de Braj, en torno a Mathura y Vrindavan, está vinculada en la tradición religiosa a la vida de Krishna. Allí se desarrolló el braj bhasha, una lengua indoaria estrechamente asociada a la poesía y la peregrinación devocionales. Su uso literario alcanzó gran prestigio en el norte de la India medieval y se extendió mucho más allá de su región de origen. La lengua contribuyó así a difundir las tradiciones religiosas de Braj entre comunidades de otros territorios."

 mewati_history_loc: "Se desarrolló por el contacto entre [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('en la frontera de Mewat entre Delhi y Rajastán', 'MEWATI_GLOSS')] hacia el año [DATE.GetYear]"
 MEWATI_GLOSS: "Mewat ocupa una zona de contacto entre las hablas de las llanuras próximas al Yamuna, el ámbito de Braj y Rajastán. Su población, especialmente la comunidad meo, desarrolló tradiciones regionales propias. Las rutas que enlazaban Delhi con el oeste de la India favorecieron intercambios y movimientos de personas. El mewatí refleja esos contactos, junto con la continuidad de las comunidades agrícolas y pastoriles del territorio."

 bundeli_history_loc: "Se formó por el contacto entre [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('en la meseta de Bundelkhand', 'BUNDELI_GLOSS')] hacia el año [DATE.GetYear]"
 BUNDELI_GLOSS: "La meseta de Bundelkhand se sitúa entre el norte de habla hindi occidental y las regiones vinculadas al awadhi hacia el este. Sus comunidades agrícolas y mercantiles mantuvieron contactos con ambos ámbitos lingüísticos. El relieve accidentado y la existencia de numerosos centros fortificados favorecieron particularidades locales. A lo largo de generaciones, estas relaciones y la continuidad de la población contribuyeron a la formación del bundelí, sin que su identidad dependiera de un único linaje gobernante."

 bagheli_history_loc: "Se diferenció dentro de [CULTURE.GetName] [Glossary('en la meseta de Baghelkhand', 'BAGHELI_GLOSS')] hacia el año [DATE.GetYear]"
 BAGHELI_GLOSS: "Baghelkhand toma su nombre del linaje rajput baghel, que gobernó parte de la meseta situada al sureste de Bundelkhand. Sus hablas, estrechamente relacionadas con el awadhi, adquirieron rasgos regionales propios. El relieve y las relaciones políticas locales favorecieron una trayectoria distinta de la de las llanuras septentrionales. El baghelí conservó vínculos con las variedades vecinas mientras desarrollaba una identidad lingüística reconocible."

 marwari_history_loc: "Desarrolló tradiciones propias a partir de [CULTURE.GetName] [Glossary('en las comunidades del desierto de Thar', 'MARWARI_GLOSS')] hacia el año [DATE.GetYear]"
 MARWARI_GLOSS: "Marwar, la región árida del oeste de Rajastán cuyo principal centro sería Jodhpur, desarrolló una lengua y una cultura vinculadas al desierto de Thar. El pastoreo, la agricultura adaptada a la escasez de agua y el comercio de larga distancia fueron fundamentales para sus comunidades. Las redes de familias mercantiles marwaríes se extendieron posteriormente por gran parte del subcontinente. Estas actividades coexistieron con las tradiciones políticas y militares de los linajes rajputs de la región."

 mewari_history_loc: "Se consolidó regionalmente a partir de [CULTURE.GetName] [Glossary('en las colinas de Aravalli y el entorno de Chittorgarh', 'MEWARI_GLOSS')] hacia el año [DATE.GetYear]"
 MEWARI_GLOSS: "Mewar, con centro histórico en la fortaleza de Chittorgarh y las colinas de Aravalli, desarrolló una identidad regional estrechamente vinculada a sus tradiciones rajputs. El relieve favoreció la defensa de sus centros políticos y una prolongada resistencia frente a poderes externos. La lengua mewarí formó parte de esa continuidad cultural, dentro del conjunto de hablas de Rajastán. Las tradiciones cortesanas y la memoria de sus conflictos contribuyeron a su prestigio regional."

 dhundari_history_loc: "Adquirió rasgos propios a partir de [CULTURE.GetName] [Glossary('en las llanuras de Dhundhar', 'DHUNDARI_GLOSS')] hacia el año [DATE.GetYear]"
 DHUNDARI_GLOSS: "Dhundhar, en torno a Amber y, posteriormente, Jaipur, desarrolló una variedad regional del rajastaní. Sus tierras relativamente abiertas y fértiles ofrecían condiciones distintas de las zonas desérticas de Marwar. La agricultura, el comercio y la consolidación de centros políticos favorecieron una identidad propia. Con el tiempo, estas redes contribuirían a la prosperidad de Jaipur y a la continuidad de la lengua dhundharí."

 harauti_history_loc: "Se diferenció dentro de [CULTURE.GetName] [Glossary('en los valles y mesetas de Hadoti', 'HARAUTI_GLOSS')] hacia el año [DATE.GetYear]"
 HARAUTI_GLOSS: "Hadoti, en torno a Kota y Bundi, ocupa una meseta del sureste de Rajastán. Sus valles fluviales, especialmente los del Chambal y sus afluentes, proporcionaban una base agrícola más favorable que la de muchas regiones áridas del oeste. Las comunidades locales desarrollaron tradiciones políticas y culturales propias, junto con el habla harautí. Esta identidad regional se mantuvo vinculada al conjunto rajastaní, aunque diferenciada de Marwar y Mewar."

 ahirwati_history_loc: "Desarrolló una identidad regional a partir de [CULTURE.GetName] [Glossary('entre las comunidades pastoriles de Ahirwal', 'AHIRWATI_GLOSS')] hacia el año [DATE.GetYear]"
 AHIRWATI_GLOSS: "Ahirwal, entre Rajastán y Haryana, toma su nombre de las comunidades ahir, tradicionalmente vinculadas a la ganadería. La combinación de pastoreo, agricultura y contactos fronterizos contribuyó a una identidad regional propia. El ahirwatí refleja la posición del territorio entre las hablas rajastaníes del oeste y el haryanví del norte. Sus hablantes mantuvieron vínculos con ambos ámbitos sin perder sus particularidades locales."

 konkani_history_loc: "Siguió una evolución propia respecto de [CULTURE.GetName] [Glossary('en la costa del Konkan', 'KONKANI_GLOSS')] hacia el año [DATE.GetYear]"
 KONKANI_GLOSS: "La franja costera del Konkan, entre los Ghats occidentales y el mar Arábigo, desarrolló una lengua indoaria propia, emparentada con el maratí. El relieve limitaba los contactos directos con algunas zonas del Decán, mientras las rutas marítimas conectaban sus puertos con otras costas. El comercio, las migraciones y las comunidades locales dieron al konkaní una trayectoria diferenciada. Sus vínculos con el interior coexistieron con una marcada orientación marítima."

 malayali_history_loc: "Se diferenció gradualmente de [CULTURE.GetName] [Glossary('en las comunidades de la costa de Kerala', 'MALAYALI_GLOSS')] hacia el año [DATE.GetYear]"
 MALAYALI_GLOSS: "Las comunidades de Kerala formaron parte del antiguo ámbito cultural y lingüístico tamil, aunque los Ghats occidentales y la costa del mar Arábigo les daban un entorno propio. El comercio marítimo, las instituciones locales y los contactos religiosos favorecieron diferencias regionales. Durante los primeros siglos medievales, sus hablas evolucionaron gradualmente hacia el malayalam. La identidad malayalí se desarrolló en ese proceso, combinando la herencia compartida con el mundo tamil y las relaciones comerciales de la costa de Malabar."

 nasrani_history_loc: "Se formó en el contacto entre [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('dentro de las redes religiosas y comerciales de Malabar', 'NASRANI_GLOSS')] hacia el año [DATE.GetYear]"
 NASRANI_GLOSS: "La tradición de los cristianos de santo Tomás atribuye el origen de sus comunidades a la predicación del apóstol en la costa de Malabar durante el siglo I. Kerala estaba vinculada a redes marítimas que conectaban la India con Arabia y el Mediterráneo, y que también favorecieron la presencia de comerciantes judíos y cristianos. Con el tiempo, las comunidades nasrani desarrollaron una identidad cristiana local, estrechamente relacionada con las tradiciones siríacas y con la vida comercial y social de la costa."

 knanaya_history_loc: "Combinó tradiciones de [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('con la llegada de migrantes cristianos a Malabar', 'KNANAYA_GLOSS')] hacia el año [DATE.GetYear]"
 KNANAYA_GLOSS: "La tradición knanaya relata que el comerciante Tomás de Cana encabezó la llegada a Malabar de familias cristianas procedentes de Persia y Mesopotamia. Según ese relato, recibieron tierras y privilegios de un gobernante local y se establecieron junto a las comunidades de cristianos de santo Tomás. Los recién llegados conservaron una identidad propia y prácticas matrimoniales endógamas. La memoria de esa migración y de sus vínculos siríacos perduró, aun cuando sus descendientes quedaron plenamente integrados en el entorno cultural de Kerala."

 qufs_history_loc: "Se distinguió de [CULTURE.GetName] [Glossary('entre las comunidades montañesas del sureste de Irán', 'QUFS_GLOSS')] hacia el año [DATE.GetYear]"
 QUFS_GLOSS: "Los geógrafos árabes y persas medievales mencionaron con frecuencia a los qufs junto a los baluches en las regiones montañosas del sureste de Irán. Sus relatos destacaban las incursiones y la resistencia de estas comunidades a las autoridades. Aunque su identificación exacta y sus relaciones con otros pueblos son discutidas, las fuentes los distinguían de sus vecinos baluches. La vida en territorios escarpados favorecía cierta autonomía y dificultaba el control de las rutas por los poderes regionales."

 aschomi_history_loc: "Conservó rasgos propios de [CULTURE.GetName] [Glossary('en las tierras altas de Larestán', 'ASCHOMI_GLOSS')] hacia el año [DATE.GetYear]"
 ASCHOMI_GLOSS: "Larestán, en el sur de Fars, ocupa un territorio de montañas áridas y desiertos, alejado de algunos de los principales centros políticos de Irán. Sus comunidades desarrollaron formas de organización adaptadas a ese entorno y conservaron variedades lingüísticas y tradiciones propias. La autonomía local y los vínculos comerciales con el golfo Pérsico contribuyeron a una identidad regional diferenciada dentro del mundo iranio meridional."

 bandari_history_loc: "Desarrolló una tradición marítima a partir de [CULTURE.GetName] [Glossary('en la costa del golfo Pérsico', 'BANDARI_GLOSS')] hacia el año [DATE.GetYear]"
 BANDARI_GLOSS: "Las comunidades bandaríes de la costa del golfo Pérsico desarrollaron una cultura marítima conectada con Arabia, la India y África oriental. La navegación en dhows, la pesca, la extracción de perlas y los intercambios favorecidos por los monzones multiplicaron los contactos. Sus hablas conservaron raíces iranias, al tiempo que incorporaban influencias de otras costas. Esta orientación marítima las diferenciaba de muchas comunidades agrícolas y pastoriles del interior de la meseta iraní."

 luri_history_loc: "De origen discutido, posiblemente vinculada a los [Glossary('antiguos pueblos de Elam y los Zagros', 'LURI_GLOSS')]"
 LURI_GLOSS: "Los orígenes de los luros son objeto de debate. Su historia se relaciona con las poblaciones de los Zagros y con la difusión de lenguas iranias en la región. Se han propuesto vínculos con los antiguos elamitas y casitas, así como con grupos iranios posteriores, pero no existe una reconstrucción única y segura de su formación. La lengua lurí pertenece al grupo iranio sudoccidental y mantiene una estrecha relación con el persa. La vida montañesa y las estructuras tribales contribuyeron a una identidad propia."

 ethiopian_history_loc: "Transformó la herencia de [CULTURE.GetName] [Glossary('en las comunidades de las tierras altas tras el declive de Aksum', 'ETHIOPIAN_GLOSS')] hacia el año [DATE.GetYear]"
 ETHIOPIAN_GLOSS: "El poder de Aksum se debilitó durante la Alta Edad Media, en un contexto de cambios en las rutas del mar Rojo y de presiones en sus fronteras. La contracción de sus centros políticos favoreció el desarrollo de poderes e identidades regionales en las tierras altas. El ge'ez perdió progresivamente su uso cotidiano, pero conservó su importancia como lengua litúrgica y escrita. Las comunidades cristianas transmitieron parte de la herencia aksumita a los estados posteriores, incluida la dinastía Zagüe, conocida por sus iglesias excavadas en la roca."

 tigray_history_loc: "Conservó una herencia de [CULTURE.GetName] [Glossary('en el núcleo histórico de Aksum', 'TIGRAY_GLOSS')] hacia el año [DATE.GetYear]"
 TIGRAY_GLOSS: "Las comunidades de Tigray habitaban el núcleo histórico del reino de Aksum y las tierras altas que rodeaban su antigua capital. Tras el debilitamiento de su poder político, conservaron importantes elementos de su tradición cristiana, su cultura escrita en ge'ez y su arquitectura. Las lenguas habladas siguieron sus propias evoluciones dentro de la familia etiosemítica. La proximidad a los antiguos centros religiosos y políticos sostuvo una fuerte continuidad cultural pese a la fragmentación del reino."

 argobba_history_loc: "Adquirió rasgos propios a partir de [CULTURE.GetName] [Glossary('entre las comunidades musulmanas de las tierras altas orientales', 'ARGOBBA_GLOSS')] hacia el año [DATE.GetYear]"
 ARGOBBA_GLOSS: "Las comunidades argobba se desarrollaron en las tierras altas orientales de Etiopía, vinculadas a las rutas comerciales que conectaban el interior con el mar Rojo y el golfo de Adén. Su participación en redes musulmanas favoreció la difusión del islam y unas relaciones distintas de las de los reinos cristianos occidentales. Su lengua pertenece a la familia etiosemítica. La combinación de vínculos lingüísticos regionales, fe islámica y actividad comercial contribuyó a una identidad propia."

 madan_history_loc: "Surgió de la convivencia entre [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('en las marismas del sur de Mesopotamia', 'MADAN_GLOSS')] hacia el año [DATE.GetYear]"
 MADAN_GLOSS: "Los humedales del sur de Mesopotamia sostuvieron durante milenios comunidades adaptadas a los canales, las cañas y las inundaciones. Tras las conquistas islámicas, grupos árabes se establecieron entre las poblaciones locales y adoptaron formas de vida propias de las marismas. La convivencia y los matrimonios contribuyeron a la formación de las comunidades madan. La navegación en pequeñas embarcaciones, la cría de búfalos y las construcciones de caña caracterizaron su cultura. Las semejanzas con representaciones antiguas reflejan continuidades técnicas, sin demostrar por sí solas una descendencia ininterrumpida."

 badawi_history_loc: "Conservó tradiciones de [CULTURE.GetName] [Glossary('entre las comunidades beduinas del Néyed', 'BADAWI_GLOSS')] hacia el año [DATE.GetYear]"
 BADAWI_GLOSS: "Los badawi del Néyed representan una tradición beduina vinculada al pastoreo nómada, la cría de camellos y la organización tribal. Las genealogías y las alianzas entre linajes desempeñaban un papel central en sus relaciones sociales. Aunque participaron en intercambios con otras regiones, las condiciones del interior de Arabia favorecieron formas de vida distintas de las ciudades del Hiyaz y los puertos del golfo. Sus hablas y costumbres mantuvieron rasgos propios después de la expansión del islam fuera de la península."

 bahraini_history_loc: "Se formó por el contacto entre [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('en las costas del golfo Pérsico', 'BAHRAINI_GLOSS')] hacia el año [DATE.GetYear]"
 BAHRAINI_GLOSS: "Antes de la expansión islámica, la región histórica de Bahréin y otras zonas de la costa oriental de Arabia estuvieron bajo influencia o dominio sasánida. En ellas convivían comunidades árabes con funcionarios, soldados y comerciantes de procedencia persa. El comercio costero y las perlas favorecían los intercambios. Tras el fin del poder sasánida, la conversión, las relaciones económicas y los matrimonios contribuyeron a nuevas identidades locales, en las que persistieron influencias culturales de ambas orillas del golfo."

 omani_history_loc: "Combinó tradiciones de [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('entre los asentamientos de la costa y las montañas de Omán', 'OMANI_GLOSS')] hacia el año [DATE.GetYear]"
 OMANI_GLOSS: "La tradición omaní vincula la llegada de grupos azd desde Yemen con las migraciones asociadas a la presa de Marib. Esas comunidades se establecieron entre poblaciones anteriores de la costa y las montañas de Omán. Los vínculos con el sur de Arabia contribuyeron a sus tradiciones genealógicas y culturales. La navegación hacia África oriental, Persia y la India, junto con el arraigo del islam ibadí, favoreció una identidad propia, conectada tanto con el océano Índico como con el resto de la península arábiga."

 hejazi_history_loc: "Se desarrolló en el contacto entre [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('en los territorios del Hiyaz vinculados al antiguo mundo nabateo', 'HEJAZI_GLOSS')] hacia el año [DATE.GetYear]"
 HEJAZI_GLOSS: "El reino nabateo, centrado en Petra, extendió su influencia hacia Hegra y el norte del Hiyaz. Sus inscripciones empleaban principalmente arameo, mientras su población incluía hablantes de árabe. La anexión romana de 106 terminó con la independencia del reino, pero sus tradiciones escritas continuaron evolucionando. La escritura nabatea desempeñó un papel fundamental en el desarrollo del alfabeto árabe. Las comunidades del Hiyaz participaron en esa continuidad cultural y en las redes comerciales y religiosas que precedieron al surgimiento del islam."

 saidi_history_loc: "Conservó rasgos regionales de [CULTURE.GetName] [Glossary('en las comunidades agrícolas del Alto Egipto', 'SAIDI_GLOSS')] hacia el año [DATE.GetYear]"
 SAIDI_GLOSS: "Las comunidades del Alto Egipto, en el valle del Nilo al sur de El Cairo, desarrollaron una identidad regional vinculada a la agricultura y a sus redes familiares y locales. Su distancia de los grandes centros del delta favoreció diferencias de habla y costumbres. La arabización se superpuso a una larga herencia egipcia y copta, con ritmos distintos según las comunidades. La identidad saidí conservó particularidades propias a través de los cambios políticos y religiosos del valle."

 harar_history_loc: "Se consolidó a partir de [CULTURE.GetName] [Glossary('en las redes urbanas y comerciales de Harar', 'HARAR_GLOSS')] hacia el año [DATE.GetYear]"
 HARAR_GLOSS: "Harar atrajo comerciantes, artesanos y estudiosos por su posición en las rutas que enlazaban el interior etíope con el golfo de Adén y Arabia. La llegada de familias de distintos orígenes, los matrimonios y la vida urbana favorecieron una identidad propia, relacionada con el antiguo ámbito harla. Sus habitantes desarrollaron una lengua y unas costumbres diferenciadas de las comunidades rurales vecinas. Las mezquitas, los santuarios y las redes de enseñanza islámica dieron a la ciudad una importancia cultural superior a su tamaño."
 maghrebi_history_loc: "Se formó por el contacto entre [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('durante la arabización del Magreb', 'MAGHREBI_GLOSS')] hacia el año [DATE.GetYear]"

 siqilli_history_loc: "Surgió de la convivencia entre [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('tras la conquista islámica de Sicilia', 'SIQILLI_GLOSS')] hacia el año [DATE.GetYear]"
 SIQILLI_GLOSS: "La conquista aglabí de Sicilia, iniciada en 827, llevó a la isla comunidades árabes y bereberes procedentes de Ifriquiya. La población local era mayoritariamente cristiana y contaba con una importante presencia de lengua griega. La conquista avanzó durante décadas, con hitos como la caída de Taormina en 902. La convivencia, las conversiones y los matrimonios contribuyeron a una cultura árabe siciliana propia. Su influencia persistió en la lengua, la agricultura, la cocina y la arquitectura después de la conquista normanda."

 maltese_history_loc: "Siguió una evolución propia a partir de [CULTURE.GetName] [Glossary('durante la cristianización de Malta bajo dominio normando y siciliano', 'MALTESE_GLOSS')] hacia el año [DATE.GetYear]"
 MALTESE_GLOSS: "La expedición del conde normando Roger a Malta en 1091 inició una nueva relación política con Sicilia, sin sustituir de inmediato a la población de habla sículo-árabe. La consolidación del dominio cristiano y los cambios religiosos se prolongaron durante generaciones. La lengua local conservó su base semítica e incorporó crecientes influencias romances. De ese proceso surgió la combinación de lengua y tradiciones que caracteriza a la identidad maltesa, vinculada al mundo católico mediterráneo."

 turco_hephthalite_history_loc: "Se formó por la integración de [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('tras la caída del poder heftalita', 'TURCO_HEPHTHALITE_GLOSS')] hacia el año [DATE.GetYear]"
 TURCO_HEPHTHALITE_GLOSS: "El poder heftalita en Asia Central fue quebrado durante la década de 560 por la alianza entre los sasánidas y el Primer Kanato Túrquico. Buena parte de la población permaneció en sus territorios bajo nuevos gobernantes. El asentamiento de grupos túrquicos, los matrimonios y los intercambios culturales contribuyeron a sociedades que combinaban tradiciones locales con las de los conquistadores. En ellas persistieron elementos de la herencia heftalita y del ámbito de lengua bactriana bajo nuevas estructuras políticas."

 semnani_history_loc: "Conservó rasgos locales de [CULTURE.GetName] [Glossary('en las poblaciones próximas al Alborz', 'SEMNANI_GLOSS')] hacia el año [DATE.GetYear]"
 SEMNANI_GLOSS: "Semnán y las poblaciones próximas al Alborz conservaron variedades lingüísticas propias dentro del mundo iranio. Aunque la región participaba en rutas que atravesaban la meseta, sus comunidades mantuvieron tradiciones locales a través de las conquistas y los cambios dinásticos. Sus hablas pertenecen al grupo iranio noroccidental y reflejan una historia distinta de la del persa dominante en otras zonas. La continuidad de sus asentamientos favoreció una identidad regional duradera."

 khalaj_history_loc: "Se desarrolló por el contacto entre [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('al sur del Hindu Kush', 'KHALAJ_GLOSS')] hacia el año [DATE.GetYear]"
 KHALAJ_GLOSS: "Los jalajes aparecen en fuentes musulmanas como una población túrquica establecida al sur del Hindu Kush y en regiones vecinas. Sus orígenes y movimientos anteriores siguen siendo discutidos. La convivencia con poblaciones iranias, el pastoreo y los matrimonios favorecieron intercambios culturales, mientras algunas comunidades conservaron su lengua túrquica. Grupos vinculados a los jalajes participaron posteriormente en campañas y asentamientos del norte de la India. Su relación con los gilzai afganos se ha propuesto en diversas reconstrucciones, pero no debe presentarse como una filiación indiscutible."

 brahui_history_loc: "Combinó tradiciones de [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('entre las comunidades de las tierras altas de Kalat', 'BRAHUI_GLOSS')] hacia el año [DATE.GetYear]"
 BRAHUI_GLOSS: "Los brahuis hablan una lengua dravídica en una región dominada por lenguas iranias. Su presencia en las tierras altas de Kalat ha dado lugar a distintas hipótesis: algunos investigadores proponen una continuidad antigua y otros una migración posterior desde el este. Las comunidades de Sarawan y Jhalawan mantuvieron estrechas relaciones con los baluches mediante el pastoreo, las alianzas y los matrimonios. Esa convivencia produjo numerosas semejanzas culturales y préstamos lingüísticos, sin borrar la singularidad dravídica del brahui."

 kashgari_history_loc: "Se formó por la integración de [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('en los oasis de la cuenca del Tarim', 'KASHGARI_GLOSS')] hacia el año [DATE.GetYear]"
 KASHGARI_GLOSS: "Kashgar fue durante siglos un importante oasis de la cuenca del Tarim, con mercados y tierras irrigadas conectados por rutas comerciales. La llegada de grupos túrquicos, entre ellos los chigil, transformó gradualmente su población y sus lenguas. La conversión al islam de Satuk Bughra Kan en el siglo X y la expansión qarajánida impulsaron una nueva identidad política y religiosa. La conquista de Jotán en 1006 fue otro hito de ese proceso. La convivencia entre poblaciones de oasis y grupos pastoriles favoreció una cultura urbana, mercantil y literaria de gran influencia."

 nepali_history_loc: "Desarrolló una identidad regional a partir de [CULTURE.GetName] [Glossary('en las comunidades del valle de Katmandú', 'NEPALI_GLOSS')] hacia el año [DATE.GetYear]"
 NEPALI_GLOSS: "Durante siglos, los agricultores, artesanos y comerciantes del valle de Katmandú desarrollaron una próspera economía agrícola y artesanal en torno a sus fértiles tierras de cultivo. La construcción de templos, los sistemas de irrigación y las actividades comerciales prosperaron bajo el patrocinio de los gobernantes de la dinastía Licchavi, sin depender de una única dinastía para asegurar su continuidad. Incluso cuando el poder político pasó de los Licchavi a los Thakuri y a las dinastías posteriores, los habitantes del valle continuaron cultivando las mismas tierras, venerando en los mismos templos y practicando las tradiciones artesanales y comerciales heredadas de sus antepasados. Esta continuidad de la vida cotidiana sobrevivió a los sucesivos cambios dinásticos y permitió preservar las costumbres y prácticas administrativas que, con el paso de las generaciones, contribuirían a la formación de una identidad nepalí diferenciada."

 greek_history_loc: "Integró las tradiciones de [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('en la sociedad grecorromana del Imperio oriental', 'GREEK_GLOSS')] hacia el año [DATE.GetYear]"
 GREEK_GLOSS: "La civilización helénica había perdurado durante siglos antes del surgimiento de Roma y, aun después de que las conquistas romanas incorporaran Grecia y el Mediterráneo oriental al Imperio, el griego continuó siendo la lengua de la filosofía, el comercio y la vida cotidiana en sus provincias orientales. Esta continuidad cultural terminó reflejándose en la administración imperial durante el reinado de Heraclio, a partir del año 610, cuando el griego adquirió una posición predominante frente al latín como lengua del gobierno. Se consolidaba así un proceso de transformación desarrollado durante siglos: un Estado que seguía considerándose romano, gobernado por un emperador que se proclamaba sucesor de Augusto, pero cuya población oriental hablaba, escribía y vivía principalmente en griego. Esta síntesis bizantina preservó el saber helénico, las artes y las tradiciones urbanas griegas dentro de un marco político y jurídico romano, dando lugar a una civilización que reunía elementos de la Antigüedad clásica con una identidad medieval propia."

 GEORGIAN_GLOSS: "La población del valle del río Kurá, conocido en georgiano como Mtkvari, ya era identificada por los autores griegos y romanos como los iberos mucho antes de que Farnavaz I estableciera, según la tradición, una monarquía autóctona hacia el año 302 a. C. Se trataba de un pueblo de agricultores y habitantes de las montañas, cuyas tradiciones atribuirían posteriormente al mismo monarca la creación del alfabeto georgiano. Durante siglos, Iberia fue objeto de disputas entre Roma, Persia y, posteriormente, el Califato árabe. Pese a los continuos cambios de dominio político, sus habitantes conservaron sus asentamientos, sus tierras de cultivo y su lengua, incluso después de que la Persia sasánida aboliera la monarquía ibérica en el año 580. Fue la continuidad de esta población, más que la permanencia de una dinastía determinada, la que permitió preservar su identidad cultural a través de los principados surgidos durante la dominación árabe y contribuyó a la formación gradual de una identidad georgiana unificada."

 mingrelian_history_loc: "Conservó y transformó la herencia de [CULTURE.GetName] [Glossary('en las llanuras del Rioni', 'MINGRELIAN_GLOSS')] hacia el año [DATE.GetYear]"
 MINGRELIAN_GLOSS: "El antiguo Reino de la Cólquida, cuya riqueza y legendario vellocino de oro inspiraron el mito griego de Jasón y los argonautas, dominó durante siglos las fértiles llanuras y los valles fluviales del oeste de Georgia, antes de que la conquista romana incorporara sus territorios al ámbito imperial. Las poblaciones colcas del interior, asentadas en el valle del Rioni, donde se encontraba el núcleo del antiguo reino, conservaron de manera especialmente directa su herencia cultural. Mientras bizantinos y árabes disputaban el control de Egrisi, el principado sucesor de la antigua Cólquida, estas comunidades fueron desarrollando una identidad diferenciada que daría origen al pueblo mingrelio. Entre los herederos de la civilización colca, los mingrelios mantuvieron una vinculación particularmente estrecha con el antiguo centro político y territorial del reino."

 lazi_history_loc: "Reunió tradiciones de [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('bajo la identidad regional de Lázica', 'LAZI_GLOSS')] hacia el año [DATE.GetYear]"
 LAZI_GLOSS: "Los geógrafos de la Antigüedad, como Arriano, identificaban a los lazos como uno de los pueblos de la costa de la Cólquida, diferenciándolos del conjunto de la población colca, aunque ambos compartían un mismo reino y una herencia cultural cartvelia. Tras la incorporación de la región al dominio romano, el nombre de Lázica terminó designando el territorio en referencia a este pueblo costero. Durante los siglos V y VI, historiadores bizantinos como Procopio y Agatías describieron a los lazos como herederos directos del antiguo Reino de la Cólquida, cuya población pasó a ser conocida por el nombre de la comunidad costera que había asumido su legado político. La unión de esta identidad particular con la herencia más amplia de la civilización colca dio lugar a una conciencia cultural diferenciada, vinculada tanto a sus tradiciones ancestrales como al prestigio histórico del antiguo reino. Este legado perduró durante la existencia del Reino de Lázica, vinculado al Imperio bizantino, y continuó formando parte de la identidad laza durante la Edad Media."

 svan_history_loc: "Conservó rasgos propios de [CULTURE.GetName] [Glossary('en los altos valles aislados del Cáucaso', 'SVAN_GLOSS')] hacia el año [DATE.GetYear]"
 SVAN_GLOSS: "En los elevados valles montañosos situados por encima de las ciudades costeras y las llanuras fluviales de la antigua Cólquida habitaban los esvanos, descritos ya por los geógrafos de la Antigüedad como un pueblo montañés de carácter independiente, apartado de las comunidades más accesibles de las tierras bajas. El extraordinario aislamiento de sus territorios, incluso para los estándares del Cáucaso, favoreció la conservación de rasgos lingüísticos y culturales arcaicos que fueron diferenciándolos progresivamente de los demás pueblos descendientes de la antigua población colca. Sus comunidades desarrollaron una sociedad orgullosa de su autonomía, organizada en torno a asentamientos fortificados y características torres defensivas. La dificultad de acceder a sus valles permitió que conservaran una considerable independencia frente a las sucesivas potencias que dominaron la región, desde los antiguos reinos colcos hasta los imperios bizantino y los posteriores estados georgianos."

 udi_history_loc: "Preservó una herencia de [CULTURE.GetName] [Glossary('entre las comunidades del antiguo reino de Albania caucásica', 'UDI_GLOSS')] hacia el año [DATE.GetYear]"
 UDI_GLOSS: "La Albania caucásica dominó antiguamente las llanuras y montañas del Cáucaso oriental como un reino independiente, habitado por diversos pueblos que hablaban lenguas de la familia lezguia. Su cristianización, iniciada en el siglo IV, favoreció su integración en el mundo cristiano del Cáucaso. La conquista árabe puso fin a su independencia política y, hacia el año 705, la Iglesia armenia había incorporado buena parte de sus estructuras eclesiásticas. Entretanto, gran parte de la población fue asimilándose progresivamente a las comunidades armenias vecinas y, más al este, a los pueblos iranios y túrquicos que se establecieron en la región. Sin embargo, en algunos enclaves aislados sobrevivieron comunidades que conservaron la lengua y las tradiciones de los antiguos habitantes de Albania caucásica. Sus descendientes, conocidos como udíes, mantuvieron esta herencia cultural mucho después de la desaparición del reino que había gobernado a sus antepasados."

 lezgi_history_loc: "Desarrolló una identidad propia a partir de [CULTURE.GetName] [Glossary('en las montañas del Cáucaso oriental', 'LEZGI_GLOSS')] hacia el año [DATE.GetYear]"
 LEZGI_GLOSS: "Los geógrafos de la Antigüedad mencionaban a los legas entre las numerosas tribus que integraban la confederación de Albania caucásica, formada por pueblos con sus propios gobernantes y dialectos, unidos mediante vínculos políticos relativamente flexibles, según la descripción de Estrabón. Su nombre ha perdurado en denominaciones asociadas a los lezguinos, como el etnónimo georgiano leki, utilizado históricamente para referirse a diversos pueblos de Daguestán. Protegidos por un territorio montañoso mucho más difícil de conquistar y administrar que las llanuras de Albania caucásica, los legas conservaron su lengua y una considerable autonomía, incluso cuando las regiones más accesibles de la confederación quedaron sometidas a la influencia armenia, persa y, posteriormente, túrquica. Esta continuidad lingüística y cultural permitió preservar su herencia montañesa, transmitida a los antepasados de los actuales lezguinos."

 tsakonian_history_loc: "Conservó una tradición diferenciada de [CULTURE.GetName] [Glossary('en las comunidades de lengua dórica del Parnón', 'TSAKONIAN_GLOSS')] hacia el año [DATE.GetYear]"
 TSAKONIAN_GLOSS: "A diferencia de casi todas las demás comunidades griegas, los habitantes de Tsakonia no remontan los orígenes de su lengua al griego común o koiné, del que evolucionó el griego bizantino, sino directamente al antiguo dialecto dórico, hablado en Laconia, la tierra de Esparta. Las escarpadas montañas del Parnón protegieron a estas pequeñas comunidades costeras y montañesas del Peloponeso de las migraciones eslavas que transformaron gran parte de Grecia durante los siglos VI y VII. Este aislamiento permitió conservar una tradición lingüística y cultural de origen dórico que se remontaba a la época de los reyes espartanos, mientras que en el resto del mundo bizantino predominaba el griego derivado de la koiné."

 griko_history_loc: "Se desarrolló entre comunidades de [CULTURE.GetName] [Glossary('que conservaron el griego en el sur de Italia', 'GRIKO_GLOSS')] hacia el año [DATE.GetYear]"
 GRIKO_GLOSS: "El dominio bizantino sobre el sur de Italia y Sicilia se prolongó durante siglos, incluso después de que el Imperio perdiera el control del resto de la península itálica. Esta presencia dejó comunidades de habla griega en Calabria y el Salento que perduraron mucho después de la desaparición de la autoridad política bizantina. Rodeadas por una Italia cada vez más latinizada y posteriormente sometida al dominio normando, estas comunidades conservaron su lengua y tradiciones religiosas de origen griego, constituyendo enclaves culturales diferenciados. La relación entre la herencia antigua de la Magna Grecia y las migraciones de época bizantina sigue siendo debatida; ambas forman parte de las interpretaciones sobre el origen de estas comunidades."

 tauro_romaic_history_loc: "Adquirió un carácter regional a partir de [CULTURE.GetName] [Glossary('en los puertos griegos de Crimea', 'TAURO_ROMAIC_GLOSS')] hacia el año [DATE.GetYear]"
 TAURO_ROMAIC_GLOSS: "Las ciudades-Estado griegas habían colonizado las costas de Crimea desde la Antigüedad, estableciendo una presencia helénica que perduró durante los períodos romano y bizantino. Su continuidad estuvo favorecida por el comercio del mar Negro y la influencia política de Constantinopla, ejercida a través de enclaves como Quersoneso y los territorios sucesores del antiguo Reino del Bósforo. Separadas del núcleo territorial bizantino por las estepas circundantes y los numerosos pueblos nómadas que las dominaban, las comunidades griegas de Crimea desarrollaron una identidad regional propia, vinculada tanto al comercio con los pueblos de la estepa como a sus relaciones políticas, religiosas y culturales con Constantinopla."

 crimean_gothic_history_loc: "Los godos [romanized|E] de Crimea"
 CRIMEAN_GOTHIC_GLOSS: "Mientras que la mayor parte de los pueblos godos emigró hacia occidente y terminó fundando los reinos visigodo y ostrogodo en los antiguos territorios romanos, algunas comunidades permanecieron en las montañas de Crimea, donde conservaron su lengua germánica durante siglos de relativo aislamiento. Estos godos de Crimea sobrevivieron mucho después de que sus parientes occidentales fueran asimilados por las poblaciones romanizadas de los territorios conquistados. Con el tiempo, quedaron bajo la influencia del Imperio bizantino, estableciendo vínculos religiosos con Constantinopla y manteniendo una organización eclesiástica propia. Durante el reinado de Justiniano, en el siglo VI, la construcción y fortificación de posiciones estratégicas en las montañas, entre ellas Doros, reforzó la presencia imperial en la región. Siglos de influencia religiosa bizantina, administración griega y contacto con las comunidades helénicas de la costa del mar Negro favorecieron la progresiva helenización de su cultura. Sin embargo, la lengua gótica logró sobrevivir a este proceso, convirtiéndose en una extraordinaria reliquia lingüística que todavía despertaba el asombro de los viajeros del siglo XVI, quienes encontraron testimonios de su uso en las montañas de Crimea mucho después de que hubiera desaparecido del resto de Europa."

 antiochian_history_loc: "Conservó una identidad regional de [CULTURE.GetName] [Glossary('en las comunidades de Antioquía y la costa siria', 'ANTIOCHIAN_GLOSS')] hacia el año [DATE.GetYear]"
 ANTIOCHIAN_GLOSS: "Desde su fundación durante el período helenístico, Antioquía había figurado entre las ciudades más importantes del mundo antiguo. Su población de habla griega continuó siendo una presencia destacada en la Siria bizantina, incluso cuando el arameo y, posteriormente, el árabe predominaban en las regiones rurales circundantes. Esta comunidad urbana y cosmopolita, profundamente marcada por la importancia de Antioquía como uno de los principales centros de la teología cristiana primitiva y sede de un influyente patriarcado, conservó una identidad cultural propia. Su carácter distintivo surgió de la posición de la ciudad como punto de encuentro entre el mundo grecobizantino y las poblaciones semíticas del Levante."

 cappadocian_history_loc: "Siguió una evolución propia respecto de [CULTURE.GetName] [Glossary('entre las comunidades aisladas tras la conquista selyúcida', 'CAPPADOCIAN_GLOSS')] hacia el año [DATE.GetYear]"
 CAPPADOCIAN_GLOSS: "Durante siglos, la población cristiana de habla griega de Capadocia había formado parte del mundo bizantino de Anatolia, habitando una región conocida por sus iglesias excavadas en la roca y sus ciudades subterráneas. Sin embargo, la decisiva derrota bizantina en la batalla de Manzikert, en 1071, abrió Anatolia al asentamiento de pueblos túrquicos y debilitó progresivamente los vínculos de Capadocia con el resto del Imperio. Rodeadas por poblaciones cada vez más numerosas de habla turca, estas comunidades griegas quedaron relativamente aisladas y desarrollaron, a lo largo de las generaciones siguientes, un dialecto profundamente diferenciado. La influencia del turco sobre su gramática alcanzó una intensidad excepcional dentro del conjunto de las variedades de la lengua griega."

 greek_cypriot_history_loc: "Desarrolló rasgos insulares propios de [CULTURE.GetName] [Glossary('durante los siglos de autonomía relativa de Chipre', 'GREEK_CYPRIOT_GLOSS')] hacia el año [DATE.GetYear]"
 GREEK_CYPRIOT_GLOSS: "Tras el comienzo de las incursiones árabes en el siglo VII, la población griega de Chipre vivió durante más de tres siglos bajo unas circunstancias políticas singulares. La isla quedó sometida a un régimen de autoridad compartida entre Constantinopla y el Califato, al que sus habitantes debían satisfacer tributos, sin encontrarse plenamente bajo el dominio directo de ninguna de las dos potencias. Esta prolongada situación favoreció el desarrollo de una considerable autonomía local, pues los agricultores, comerciantes y demás habitantes de Chipre se acostumbraron a administrar sus propios asuntos. Cuando las fuerzas bizantinas recuperaron definitivamente el control de la isla en el año 965, encontraron una población que había desarrollado una identidad grecochipriota diferenciada. Esta identidad, forjada durante generaciones de relativa autonomía, perduró tras la reincorporación de Chipre a la administración imperial."

 pontic_history_loc: "Se desarrolló por el contacto entre [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('en la costa sudoriental del mar Negro', 'PONTIC_GLOSS')] hacia el año [DATE.GetYear]"
 PONTIC_GLOSS: "La montañosa costa del Ponto, en el sudeste del mar Negro, había estado habitada durante siglos por comunidades lazas que convivían con las poblaciones de habla griega de sus ciudades. El comercio, los matrimonios mixtos y la convivencia entre ambos pueblos favorecieron el surgimiento de una identidad griega póntica diferenciada. Esta fusión cultural se profundizó a medida que la región adquiría una creciente autonomía política respecto de Constantinopla durante el siglo XII, un proceso que culminó con la fundación del Imperio independiente de Trebisonda. Su población griega póntica conservó aquella herencia grecolaza como uno de los principales rasgos de su identidad regional."

 arberian_history_loc: "Conservó rasgos propios a partir de [CULTURE.GetName] [Glossary('en las tierras altas de los Balcanes occidentales', 'ARBERIAN_GLOSS')] hacia el año [DATE.GetYear]"
 ARBERIAN_GLOSS: "Siglos de dominio provincial romano habían integrado a las antiguas poblaciones ilirias de los Balcanes occidentales en las estructuras administrativas, jurídicas y urbanas latinas mucho antes de que las migraciones eslavas de los siglos VI y VII transformaran profundamente el panorama político y lingüístico de la península. En las tierras bajas y los valles fluviales más accesibles, buena parte de esta población ilirorromana fue asimilada gradualmente por los pueblos eslavos recién llegados. Sin embargo, las migraciones apenas penetraron en las regiones montañosas más escarpadas, donde algunas comunidades aisladas conservaron buena parte de su identidad ancestral. La formación de los albaneses se relaciona con antiguas poblaciones balcánicas, aunque su filiación exacta sigue siendo discutida. Las comunidades arberias medievales conservaron una lengua propia, distinta de las eslavas y las romances, con importantes influencias latinas."

 jasz_history_loc: "Se consolidó entre grupos de [CULTURE.GetName] [Glossary('refugiados en Hungría tras la expansión mongola', 'JASZ_GLOSS')] hacia el año [DATE.GetYear]"
 JASZ_GLOSS: "Cuando las conquistas mongolas del siglo XIII destruyeron el poder de los cumanos en la estepa póntica, los yasos, un pueblo de ascendencia alana que había convivido durante largo tiempo con ellos, huyeron hacia occidente en busca de refugio en el reino de Hungría. Establecidos en un territorio propio de la llanura húngara, los yasos conservaron durante generaciones su lengua alana y su identidad cultural, pese a encontrarse lejos de sus antiguas tierras del Cáucaso y las estepas. Así, esta pequeña comunidad mantuvo viva una parte de la herencia alana en el corazón de la Hungría medieval."

 circassian_history_loc: "Transformó la herencia de [CULTURE.GetName] [Glossary('en la costa nororiental del mar Negro y sus montañas', 'CIRCASSIAN_GLOSS')] hacia el año [DATE.GetYear]"
 CIRCASSIAN_GLOSS: "Estrabón describió a los zigos como un pueblo de navegantes guerreros que habitaba la costa nororiental del mar Negro, al norte de la Cólquida, donde vivían de la piratería a bordo de embarcaciones ligeras que podían transportar a hombros hasta calas ocultas entre los bosques cuando se veían amenazados. Siglos después, esta misma región costera era conocida por los bizantinos como Ziquia, cuyos habitantes fueron incorporándose gradualmente al cristianismo gracias a la actividad misionera desarrollada durante el reinado del emperador Justiniano, en el siglo VI, con centro religioso en Nicopsia. Aunque nunca llegaron a constituir una monarquía unificada y duradera, pues preferían organizarse en principados tribales ampliamente autónomos vinculados mediante la elección de un gran príncipe, los habitantes de Ziquia conservaron su lengua caucásica noroccidental y sus tradiciones guerreras, convirtiéndose en los antepasados directos del pueblo circasiano. Pese a pertenecer a una misma familia lingüística, mantuvieron una identidad diferenciada de la de sus parientes abasgios, establecidos más al suroeste."

 tatars_history_loc: "Se formó por la integración de [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('en las estepas de la Horda de Oro', 'TATARS_GLOSS')] hacia el año [DATE.GetYear]"
 TATARS_GLOSS: "Cuando los ejércitos mongoles de Batú Kan conquistaron la estepa kipchak durante las décadas de 1230 y 1240, sus guerreros constituían una pequeña minoría gobernante frente a una población túrquica kipchak mucho más numerosa. En el transcurso de unas pocas generaciones, los descendientes de los conquistadores adoptaron la lengua kipchak y buena parte de las costumbres de los pueblos de la estepa, aunque conservaron la legitimidad política derivada de su ascendencia gengiskánida y las tradiciones militares mongolas. Los observadores extranjeros y, con el tiempo, los propios habitantes comenzaron a utilizar el antiguo nombre de tártaros para designar a esta nueva población de habla kipchak gobernada por descendientes de Gengis Kan. Originalmente, aquel nombre pertenecía a un pueblo distinto de la meseta mongola, sometido y prácticamente destruido por los mongoles varias generaciones antes. Sin embargo, la denominación terminó arraigando hasta convertirse en el nombre que identificaría a la población principal de la Horda de Oro durante el resto de su historia."

 nogai_history_loc: "Reunió comunidades de [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('en las confederaciones pastoriles vinculadas a la Horda de Oro', 'NOGAI_GLOSS')] hacia el año [DATE.GetYear]"
 NOGAI_GLOSS: "Los nogayos se formaron entre las poblaciones túrquicas y mongolas de las estepas de la Horda de Oro. Su nombre se vincula tradicionalmente con Nogai, el poderoso jefe militar muerto hacia 1299, aunque la confederación posterior no fue simplemente la continuación de sus seguidores. La Horda Nogaya se consolidó más tarde en torno a los manguitos y al linaje de Edigu. Sus comunidades conservaron una marcada tradición de pastoreo nómada y movilidad ecuestre durante la fragmentación del poder de la Horda de Oro."

 crimean_history_loc: "Se desarrolló por el contacto entre [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('en las estepas y los puertos de Crimea', 'CRIMEAN_GLOSS')] hacia el año [DATE.GetYear]"
 CRIMEAN_GLOSS: "Antes de las conquistas mongolas del siglo XIII, grupos cumanos y kipchaks dominaban buena parte de la estepa póntica y convivían con las diversas poblaciones de Crimea. Los conquistadores establecieron una nueva élite gobernante, que se integró gradualmente en ese entorno. Las comunidades costeras, incluidas las colonias comerciales italianas, mantuvieron extensas relaciones marítimas bajo la soberanía de la Horda de Oro. Esta diversidad contribuyó a la formación de una identidad tártara de Crimea diferenciada, sobre la que se apoyaría el posterior kanato."

 kazani_history_loc: "Se consolidó por la integración de [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('en las antiguas tierras de la Bulgaria del Volga', 'KAZANI_GLOSS')] hacia el año [DATE.GetYear]"
 KAZANI_GLOSS: "La Bulgaria del Volga era un próspero Estado islámico y comercial cuando los ejércitos mongoles la conquistaron en 1236. La población local y parte de sus tradiciones urbanas perduraron bajo la nueva administración. El contacto con grupos kipchaks y con las élites de origen mongol transformó gradualmente la región. De esas relaciones surgió una identidad tártara del Volga ligada tanto a la herencia búlgara como al mundo de la Horda de Oro. El posterior Kanato de Kazán se desarrolló sobre esa base regional."

 mishar_history_loc: "Se formó por el contacto entre [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('en las tierras fronterizas de Meshchera', 'MISHAR_GLOSS')] hacia el año [DATE.GetYear]"
 MISHAR_GLOSS: "Al oeste de los antiguos centros de la Bulgaria del Volga, grupos de habla kipchak y poblaciones vinculadas a la Horda de Oro se establecieron en la región de Meshchera. La convivencia con las comunidades locales contribuyó a la formación de los tártaros mishares. Su posición junto a los territorios forestales de los principados de la Rus favoreció funciones agrícolas y militares. Sus poblaciones proporcionaron caballería y participaron en la defensa de fronteras cambiantes bajo la Horda y sus estados sucesores."

 chagatai_history_loc: "Combinó tradiciones de [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('en el ulus centroasiático de Chagatai', 'CHAGATAI_GLOSS')] hacia el año [DATE.GetYear]"
 CHAGATAI_GLOSS: "Chagatai, segundo hijo de Gengis Kan, recibió un ulus que incluía amplios territorios de Asia Central. En Transoxiana y la cuenca del Tarim convivían poblaciones urbanas, agrícolas y pastoriles, entre ellas numerosos hablantes de lenguas túrquicas vinculadas a la herencia carluca y qarajánida. El contacto con las élites mongolas produjo nuevas formas culturales y políticas. La islamización y la influencia literaria persa avanzaron de manera desigual, mientras se conservaba la legitimidad gengiskánida. De ese entorno surgiría la gran tradición literaria chagatai."

 turkmeni_history_loc: "Se transformó por el contacto entre [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('en las estepas y desiertos de Asia Central', 'TURKMENI_GLOSS')] hacia el año [DATE.GetYear]"
 TURKMENI_GLOSS: "Las conquistas mongolas del siglo XIII alteraron la distribución de las comunidades oguzes de Jorasán y Asia Central. Algunas se desplazaron hacia el oeste, mientras otras permanecieron o se reorganizaron en las estepas y desiertos del área turcomana. El contacto con grupos mongoles y con los poderes regionales incorporó nuevas influencias. Sin embargo, las tradiciones pastoriles oguzes y las estructuras tribales conservaron una importancia central. La identidad turcomana continuó desarrollándose a través de esos cambios, sin originarse únicamente en la conquista mongola."

 illyro_roman_history_loc: "Surgió de la integración de [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('durante la romanización de Iliria', 'ILLYRO_ROMAN_GLOSS')] hacia el año [DATE.GetYear]"
 ILLYRO_ROMAN_GLOSS: "La conquista romana de las costas y el interior de Iliria introdujo una administración provincial, guarniciones, colonias y nuevas redes urbanas. Las poblaciones locales no desaparecieron: durante siglos adoptaron de manera desigual el latín, el derecho y las costumbres romanas. En la costa dálmata y su interior se desarrollaron sociedades provinciales que combinaban tradiciones anteriores con la romanización. Parte de esa herencia lingüística y cultural perduró después del debilitamiento de la autoridad imperial."

 rhaetio_roman_history_loc: "Se formó por la integración de [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('durante la romanización de los valles de Retia', 'RHAETIO_ROMAN_GLOSS')] hacia el año [DATE.GetYear]"
 RHAETIO_ROMAN_GLOSS: "Roma conquistó Retia en 15 a. C., incorporando diversas poblaciones alpinas. Los autores antiguos propusieron distintos orígenes para los retos, incluida una relación con los etruscos. Las calzadas, las guarniciones y los asentamientos favorecieron la difusión del latín y de las instituciones romanas. En los siglos siguientes se formaron comunidades provinciales romanizadas. Algunas de sus hablas romances perduraron en valles alpinos relativamente aislados mucho después de la caída del Imperio romano de Occidente."

 britano_roman_history_loc: "Combinó tradiciones de [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('bajo la administración romana de Britania', 'BRITANO_ROMAN_GLOSS')] hacia el año [DATE.GetYear]"
 BRITANO_ROMAN_GLOSS: "La invasión de Britania por el emperador Claudio en el año 43 sometió por primera vez a buena parte de su población celta al dominio directo de Roma. Durante casi cuatro siglos, la administración provincial, el derecho romano, el latín y la presencia de guarniciones transformaron profundamente la isla. Tras la retirada de la autoridad imperial a comienzos del siglo V, las comunidades britanorromanas conservaron parte de esta herencia mientras afrontaban nuevas presiones políticas y militares."

 african_roman_history_loc: "Se transformó por el contacto entre [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('en el África romana bajo dominio vándalo', 'AFRICAN_ROMAN_GLOSS')] hacia el año [DATE.GetYear]"
 AFRICAN_ROMAN_GLOSS: "La conquista vándala del África romana a comienzos del siglo V no eliminó a la población local romanizada, de raíces púnicas y africanas, sino que estableció sobre ella una nueva élite gobernante. Durante el dominio vándalo persistieron las instituciones, las tradiciones y buena parte de la vida urbana romana, mientras las comunidades locales convivían con los recién llegados. Las relaciones entre ambos grupos, incluidos los matrimonios y los cambios religiosos, contribuyeron a la transformación gradual de la sociedad africanorromana."

 friulian_history_loc: "Siguió una evolución regional de [CULTURE.GetName] [Glossary('en las estribaciones alpinas orientales', 'FRIULIAN_GLOSS')] hacia el año [DATE.GetYear]"
 FRIULIAN_GLOSS: "Tras la caída del Imperio romano de Occidente a finales del siglo V, las poblaciones romanizadas de las estribaciones alpinas orientales quedaron aisladas del resto de Italia por las invasiones y los nuevos asentamientos germánicos. La llegada de los lombardos y el avance de los pueblos eslavos desde el este acentuaron este aislamiento. En este territorio fronterizo, las comunidades locales conservaron elementos de su herencia latina mientras desarrollaban una identidad y unas hablas romances propias, de las que surgiría la tradición friulana."

 romansh_history_loc: "Conservó y transformó la herencia de [CULTURE.GetName] [Glossary('en los valles alpinos centrales', 'ROMANSH_GLOSS')] hacia el año [DATE.GetYear]"
 ROMANSH_GLOSS: "Tras la caída del Imperio romano de Occidente a finales del siglo V, las poblaciones romanizadas de los valles alpinos centrales encontraron protección en un relieve montañoso que dificultaba las migraciones y conquistas que transformaban las tierras bajas. El aislamiento de estas comunidades favoreció la conservación de sus hablas romances, derivadas del latín provincial, y el desarrollo de una identidad propia en contacto con los pueblos germánicos vecinos."

 ligurian_history_loc: "Se formó por la integración de [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('durante la romanización de Liguria', 'LIGURIAN_GLOSS')] hacia el año [DATE.GetYear]"
 LIGURIAN_GLOSS: "Los ligures resistieron durante décadas las campañas romanas en sus montañas y costas. El relieve hacía difícil la conquista, que avanzó mediante guerras, deportaciones y acuerdos. La posterior colonización y administración provincial favorecieron la difusión del latín y transformaron las comunidades locales. Las particularidades geográficas y los contactos marítimos siguieron influyendo en la región. El antiguo nombre de Liguria perduró en sociedades de lengua romance surgidas de esa larga romanización."

 italian_history_loc: "Siguió una evolución regional a partir de [CULTURE.GetName] [Glossary('tras la fragmentación del poder romano en Italia', 'ITALIAN_GLOSS')] hacia el año [DATE.GetYear]"
 ITALIAN_GLOSS: "Cuando desapareció el Imperio romano de Occidente en 476, las antiguas poblaciones de la península itálica llevaban siglos integradas en el mundo romano y mayoritariamente latinizadas. La ciudadanía concedida tras la guerra Social había sido una etapa importante de ese proceso. La fragmentación política posterior y los dominios ostrogodo, bizantino y lombardo favorecieron trayectorias regionales distintas. Las comunidades locales conservaron la herencia latina, mientras sus hablas y formas de organización evolucionaban hacia las diversas culturas de la Italia medieval."

 tuscan_ce_history_loc: "Desarrolló una tradición propia a partir de [CULTURE.GetName] [Glossary('en las ciudades de Toscana y el valle del Arno', 'TUSCAN_CE_GLOSS')] hacia el año [DATE.GetYear]"
 TUSCAN_CE_GLOSS: "Las ciudades de Toscana, entre ellas Florencia, Pisa y Siena, mantuvieron intensos contactos comerciales y culturales. Las rutas del valle del Arno y de las comarcas vecinas favorecieron la circulación de personas y de formas lingüísticas. Sus hablas romances adquirieron un creciente uso escrito durante la Edad Media. Las obras de Dante, Petrarca y Boccaccio otorgaron especial prestigio al toscano, que acabaría proporcionando la base principal del italiano literario, sin eliminar la diversidad de las lenguas regionales de la península."

 neapolitan_history_loc: "Se transformó a partir de [CULTURE.GetName] [Glossary('por la integración de lombardos y comunidades del sur de Italia', 'NEAPOLITAN_GLOSS')] hacia el año [DATE.GetYear]"
 NEAPOLITAN_GLOSS: "La expansión lombarda por el sur de Italia desde el siglo VI introdujo nuevos grupos gobernantes entre poblaciones de tradición romana y bizantina. Los matrimonios y la convivencia favorecieron la integración de costumbres lombardas y locales. Tras la conquista franca del reino septentrional en 774, los principados lombardos del sur siguieron su propia trayectoria. Los contactos con bizantinos, árabes y normandos añadieron nuevas influencias. En ese contexto se desarrollaron las culturas y hablas romances meridionales, incluida la napolitana."

 corsican_history_loc: "Combinó tradiciones de [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('mediante los contactos entre Córcega, Cerdeña y Toscana', 'CORSICAN_GLOSS')] hacia el año [DATE.GetYear]"
 CORSICAN_GLOSS: "Tras la caída de Roma, Córcega mantuvo relaciones con Cerdeña y con distintas potencias marítimas italianas. Su relieve montañoso favoreció la continuidad de comunidades locales, mientras los puertos recibían comerciantes y colonos. La influencia de Pisa intensificó los vínculos con Toscana y dejó una importante huella lingüística. La identidad corsa se desarrolló mediante esas relaciones entre el interior insular, las tradiciones sardas y los contactos toscanos, con diferencias regionales dentro de la propia isla."

 cisalpine_history_loc: "Se desarrolló por el contacto entre [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('tras la conquista franca del reino lombardo', 'CISALPINE_GLOSS')] hacia el año [DATE.GetYear]"
 CISALPINE_GLOSS: "La conquista del reino lombardo por Carlomagno en el año 774 extendió la autoridad franca sobre las fértiles tierras del valle del Po, que los lombardos habían dominado durante dos siglos desde su llegada a Italia en el siglo VI. Los nuevos administradores, nobles y colonos francos se integraron en una sociedad donde persistían las tradiciones lombardas y romanas. Esta convivencia favoreció el desarrollo de identidades regionales diferenciadas en la Italia septentrional."

 emilian_history_loc: "Adquirió rasgos regionales a partir de [CULTURE.GetName] [Glossary('entre las ciudades del corredor de la Vía Emilia', 'EMILIAN_GLOSS')] hacia el año [DATE.GetYear]"
 EMILIAN_GLOSS: "La antigua Vía Emilia enlazaba ciudades como Bolonia, Módena y Parma. Esta disposición favoreció un contacto constante entre centros urbanos y sus comarcas, mediante el comercio y los desplazamientos cotidianos. A lo largo de los siglos, las hablas romances de ese corredor desarrollaron rasgos compartidos dentro del ámbito septentrional italiano. La continuidad de la red de asentamientos contribuyó a una identidad emiliana diferenciada, vinculada a una vía construida originalmente en época romana."

 romagnol_history_loc: "Combinó tradiciones de [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('en las antiguas tierras del exarcado de Rávena', 'ROMAGNOL_GLOSS')] hacia el año [DATE.GetYear]"
 ROMAGNOL_GLOSS: "Rávena y las tierras próximas a la costa conservaron la administración bizantina durante más tiempo que buena parte del valle del Po. Funcionarios, comerciantes y clérigos mantuvieron sus vínculos con Constantinopla, mientras el poder lombardo avanzaba en los territorios vecinos. Tras la caída del exarcado en el siglo VIII, la región quedó vinculada a nuevos poderes, entre ellos los francos y el papado. Su trayectoria favoreció particularidades culturales y lingüísticas que perduraron en la identidad romañola."

 piedmontese_history_loc: "Se desarrolló por el contacto entre [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('en las rutas transalpinas del Piamonte', 'PIEDMONTESE_GLOSS')] hacia el año [DATE.GetYear]"
 PIEDMONTESE_GLOSS: "El extremo occidental del valle del Po mantuvo contactos a través de los Alpes con las regiones de habla occitana y francoprovenzal. Estas influencias se combinaron con las tradiciones políticas, jurídicas y lingüísticas de la Italia septentrional. El comercio y los desplazamientos por los pasos alpinos contribuyeron al carácter propio del Piamonte. Su lengua y su identidad reflejaron tanto esos vínculos transalpinos como su pertenencia al ámbito romance del norte de Italia."

 venetian_ce_history_loc: "Combinó tradiciones de [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('en las redes marítimas de la laguna veneciana', 'VENETIAN_CE_GLOSS')] hacia el año [DATE.GetYear]"
 VENETIAN_CE_GLOSS: "Los asentamientos de la laguna veneciana conservaron vínculos con el Imperio bizantino mientras los lombardos dominaban buena parte del interior. Su lealtad a Constantinopla se hizo progresivamente nominal, pero los contactos mercantiles y culturales continuaron. El comercio por el Adriático y el Mediterráneo oriental puso a la población romance de Venecia en relación con comunidades de habla griega y otros pueblos. Esa orientación marítima contribuyó a una identidad propia, conectada tanto con el mundo bizantino como con la península itálica."

 pannonian_romance_history_loc: "Se formó por la integración de [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('durante la romanización de Panonia', 'PANNONIAN_ROMANCE_GLOSS')] hacia el año [DATE.GetYear]"
 PANNONIAN_ROMANCE_GLOSS: "La incorporación de Panonia al Imperio romano convirtió el Danubio medio en una frontera estratégica. Las guarniciones, las colonias y las calzadas favorecieron la romanización de poblaciones de distintos orígenes, incluidas comunidades panonias y celtas. El latín se difundió de manera desigual y dio lugar a una cultura provincial propia. El debilitamiento del poder imperial y los sucesivos asentamientos hunos, germánicos, ávaros y eslavos transformaron la región. Algunas comunidades romanizadas perduraron durante parte de ese proceso, aunque su continuidad exacta es difícil de reconstruir."

 dalmatian_ce_history_loc: "Conservó una herencia de [CULTURE.GetName] [Glossary('en las ciudades fortificadas de la costa dálmata', 'DALMATIAN_CE_GLOSS')] hacia el año [DATE.GetYear]"
 DALMATIAN_CE_GLOSS: "Durante las migraciones eslavas de los siglos VI y VII, distintas comunidades romanizadas conservaron enclaves urbanos en la costa dálmata. Ciudades como Zadar, Split y Ragusa mantuvieron vínculos marítimos con Italia y el mundo bizantino, protegidas en parte por sus fortificaciones. La separación respecto de un interior progresivamente eslavizado favoreció la continuidad de hablas romances y tradiciones cívicas propias. Estas comunidades sostuvieron durante siglos una parte de la herencia provincial romana del Adriático oriental."

 andalusian_history_loc: "Surgió de la convivencia entre [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('en la sociedad de al-Ándalus', 'ANDALUSIAN_GLOSS')] hacia el año [DATE.GetYear]"
 ANDALUSIAN_GLOSS: "La conquista de la Hispania visigoda desde 711 estableció un nuevo poder dirigido por élites árabes y bereberes. Buena parte de la población local permaneció en sus tierras, mientras la conversión al islam y la arabización avanzaban con ritmos diversos. La convivencia, los matrimonios y la vida urbana entrelazaron tradiciones hispanorromanas, visigodas, árabes y bereberes. Centros como Córdoba desarrollaron una cultura cortesana, científica y literaria de gran prestigio. De ese proceso surgió una identidad andalusí diferenciada dentro del mundo islámico medieval."

 iqritis_history_loc: "Se formó por el contacto entre [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('tras la conquista de Creta por exiliados andalusíes', 'IQRITIS_GLOSS')] hacia el año [DATE.GetYear]"
 IQRITIS_GLOSS: "Tras la revuelta del Arrabal de Córdoba en 818, grupos de exiliados andalusíes abandonaron la península y algunos se establecieron en Alejandría. Después de ser expulsados de Egipto por las autoridades abasíes, conquistaron Creta durante la década de 820. Desde la fortaleza de Candía organizaron un emirato que participó en el comercio y las incursiones del Egeo. El contacto con la población griega local dio lugar a una sociedad insular propia. La reconquista bizantina de 961 puso fin al emirato."

 navarro_aragonese_history_loc: "Se desarrolló a partir de [CULTURE.GetName] [Glossary('entre las comunidades cristianas de la frontera pirenaica', 'NAVARRO_ARAGONESE_GLOSS')] hacia el año [DATE.GetYear]"
 NAVARRO_ARAGONESE_GLOSS: "Durante el siglo IX, los poderes cristianos de Navarra y Aragón se consolidaron en el entorno pirenaico. Sus poblaciones mantuvieron contactos con las regiones vecinas y recibieron migrantes, incluidos cristianos procedentes de al-Ándalus. La convivencia entre comunidades locales y recién llegadas contribuyó a sus tradiciones políticas y religiosas. Las hablas romances de la región evolucionaron en contacto con el vasco y con otras variedades pirenaicas, formando el ámbito navarroaragonés medieval."

 catalan_history_loc: "Combinó tradiciones de [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('en los condados de la Marca Hispánica', 'CATALAN_GLOSS')] hacia el año [DATE.GetYear]"
 CATALAN_GLOSS: "A finales del siglo VIII, Carlomagno impulsó la formación de la Marca Hispánica como frontera defensiva frente a al-Ándalus. Los colonos, administradores y soldados llegados del ámbito franco y occitano se asentaron junto a las poblaciones locales, aportando nuevas estructuras políticas y militares. La interacción entre estas comunidades y la continuidad de las tradiciones romances de la región contribuyeron al desarrollo de una identidad cultural catalana propia."

 aragonese_history_loc: "Se desarrolló en contacto con [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('en los territorios pirenaicos y del valle del Ebro', 'ARAGONESE_GLOSS')] hacia el año [DATE.GetYear]"
 ARAGONESE_GLOSS: "Las comunidades de los valles pirenaicos y las tierras del Ebro mantuvieron intercambios, matrimonios y contactos lingüísticos con sus vecinos. El reino de Aragón se consolidó durante el siglo XI y se expandió hacia el sur. La unión dinástica con el condado de Barcelona se inició con el acuerdo de 1137 entre Ramiro II y Ramón Berenguer IV. La nueva Corona reunió territorios con lenguas e instituciones diferentes. La identidad aragonesa se desarrolló dentro de ese marco sin constituir una simple fusión de las poblaciones aragonesa y catalana."

 asturleonese_history_loc: "Surgió de la integración de [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('en los territorios del reino asturleonés', 'ASTURLEONESE_GLOSS')] hacia el año [DATE.GetYear]"
 ASTURLEONESE_GLOSS: "Tras la conquista islámica de la península, grupos de refugiados y miembros de las élites visigodas se establecieron entre las comunidades de las montañas asturianas. La tradición vinculó el comienzo de la resistencia con Pelayo y Covadonga. La convivencia y la reorganización política contribuyeron a la formación del reino de Asturias, que se expandió hacia el sur y trasladó posteriormente su centro a León. Las poblaciones de esos territorios desarrollaron tradiciones y hablas romances que constituyeron el ámbito asturleonés."

 castilian_history_loc: "Se formó por el contacto entre [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('en la frontera oriental del reino asturleonés', 'CASTILIAN_GLOSS')] hacia el año [DATE.GetYear]"
 CASTILIAN_GLOSS: "La frontera oriental del reino asturleonés reunió comunidades locales y colonos de diversa procedencia en un territorio de fortalezas que daría nombre a Castilla. Las poblaciones vinculadas a la montaña cantábrica convivieron con grupos portadores de tradiciones hispanovisigodas y con otros migrantes. La defensa fronteriza, la expansión de los asentamientos y las relaciones con los territorios vecinos favorecieron una identidad propia. El condado castellano adquirió una autonomía creciente y acabaría convirtiéndose en un reino de gran influencia peninsular."

 galician_history_loc: "Combinó tradiciones de [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('en las comunidades del noroeste peninsular', 'GALICIAN_GLOSS')] hacia el año [DATE.GetYear]"
 GALICIAN_GLOSS: "Los refugiados visigodos que huían de la conquista omeya de la península ibérica encontraron refugio en las tierras montañosas y costeras del noroeste, habitadas desde antiguo por los descendientes de los galaicos, cuyo nombre pervive en el de Galicia. La integración de estas poblaciones cristianas y la herencia galaicorromana contribuyeron a formar una identidad gallega estrechamente vinculada a la vecina Asturias durante los primeros siglos de resistencia cristiana. Su orientación atlántica y las antiguas rutas romanas hacia Compostela otorgaron a la región un carácter propio dentro de la Iberia cristiana."

 portuguese_history_loc: "Desarrolló una identidad regional a partir de [CULTURE.GetName] [Glossary('en los territorios al sur del Miño', 'PORTUGUESE_GLOSS')] hacia el año [DATE.GetYear]"
 PORTUGUESE_GLOSS: "Las tierras situadas al sur del río Miño, conquistadas a al-Ándalus tras generaciones de guerras fronterizas, fueron repobladas por comunidades de gallegos, leoneses y cristianos mozárabes atraídos por las tierras de cultivo de esta frontera. A ellos se sumaron caballeros y colonos borgoñones llegados con Enrique de Borgoña, que recibió el condado en 1096. Esta población, diversa en sus orígenes y habituada a defender un territorio fronterizo, desarrolló gradualmente una identidad diferenciada de la gallega. Fue el apoyo de estas comunidades el que permitió a Alfonso Enríquez proclamarse rey de Portugal y romper sus vínculos políticos con Galicia y León."

 french_history_loc: "Se consolidó por la integración de [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('en los territorios de Francia Occidental', 'FRENCH_GLOSS')] hacia el año [DATE.GetYear]"
 FRENCH_GLOSS: "El Tratado de Verdún de 843 dividió el imperio de Carlomagno entre sus nietos. La parte asignada a Carlos el Calvo, Francia Occidental, comprendía buena parte de los antiguos territorios galorromanos sometidos durante siglos a la influencia franca. En este marco político, la evolución de las hablas romances y la integración de las tradiciones francas y galorromanas favorecieron la formación de una identidad francesa diferenciada."

 norman_history_loc: "Surgió de la integración de [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('tras el asentamiento escandinavo en el bajo Sena', 'NORMAN_GLOSS')] hacia el año [DATE.GetYear]"
 NORMAN_GLOSS: "En 911, Carlos el Simple acordó con el jefe nórdico Rollón su establecimiento en torno a Ruan, a cambio de su incorporación al orden político cristiano y de la defensa de la región. Los colonos escandinavos convivieron y contrajeron matrimonios con la población local. Sus descendientes adoptaron progresivamente las hablas romances y las instituciones del entorno franco. Esa integración dio lugar a la sociedad normanda, cuyas élites conservaron una fuerte tradición militar y protagonizaron posteriores conquistas en Inglaterra, el sur de Italia y Sicilia."

 poitevin_history_loc: "Se desarrolló por el contacto entre [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('en la frontera lingüística de Poitou', 'POITEVIN_GLOSS')] hacia el año [DATE.GetYear]"
 POITEVIN_GLOSS: "Poitou se encontraba en una zona de transición entre las lenguas de oíl del norte y las hablas occitanas del sur. Sus vínculos con Aquitania y las disputas entre los reyes franceses y los Plantagenet influyeron en su historia. El matrimonio de Leonor de Aquitania incorporó la región al conjunto de posesiones de la dinastía angevina. Los contactos políticos y culturales reforzaron una identidad poitevina propia, cuyo habla romance conserva rasgos de esa posición fronteriza."

 gallo_f_history_loc: "Conservó una identidad bretona a partir de [CULTURE.GetName] [Glossary('entre las comunidades romances de la Alta Bretaña', 'GALLO_F_GLOSS')] hacia el año [DATE.GetYear]"
 GALLO_F_GLOSS: "El este de Bretaña mantuvo una importante población de habla romance, en contacto con los territorios francos vecinos y con las comunidades de lengua bretona. Las hablas de oíl de la Alta Bretaña evolucionaron hacia el galó. Sus hablantes conservaron una identidad política y regional bretona pese a las diferencias lingüísticas con el oeste del ducado. Esta trayectoria refleja la diversidad histórica de Bretaña y no supone que toda su población oriental hubiera hablado antes una lengua celta."

 burgundian_oil_history_loc: "Combinó tradiciones de [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('en la Borgoña de habla romance', 'BURGUNDIAN_OIL_GLOSS')] hacia el año [DATE.GetYear]"
 BURGUNDIAN_OIL_GLOSS: "El antiguo reino burgundio dejó su nombre en una región cuya población combinaba una larga herencia galorromana con influencias germánicas. Las particiones carolingias y los cambios de soberanía dividieron repetidamente esos territorios. En la zona occidental se desarrollaron hablas de oíl y una identidad borgoñona propia. La continuidad regional sobrevivió a los distintos linajes gobernantes y a la fragmentación del antiguo espacio político de Borgoña."

 picard_history_loc: "Desarrolló una identidad regional a partir de [CULTURE.GetName] [Glossary('en las ciudades textiles de Picardía', 'PICARD_GLOSS')] hacia el año [DATE.GetYear]"
 PICARD_GLOSS: "Las ciudades de Picardía, entre ellas Amiens, prosperaron gracias a la producción y el comercio de tejidos. Sus habitantes obtuvieron cartas de privilegios y desarrollaron instituciones comunales, mediante negociaciones y, en ocasiones, conflictos con sus señores. Los gremios, los mercados y las milicias urbanas reforzaron la vida cívica. En ese entorno, las hablas picardas y la identidad regional conservaron rasgos propios dentro del ámbito de las lenguas de oíl."

 arpitan_history_loc: "Siguió una evolución propia respecto de [CULTURE.GetName] [Glossary('entre el Ródano y los Alpes occidentales', 'ARPITAN_GLOSS')] hacia el año [DATE.GetYear]"
 ARPITAN_GLOSS: "Las regiones del Ródano y los Alpes occidentales, incluidas Saboya y las tierras del lago Lemán, desarrollaron hablas romances distintas tanto del francés como del occitano. El relieve y las redes de comunicación favorecieron particularidades locales dentro de un ámbito compartido. El francoprovenzal, también llamado arpitano, conservó esa trayectoria lingüística propia. Su posición entre otras grandes áreas romances no lo convierte en una simple mezcla de ambas."

 outremer_history_loc: "Se formó por el contacto entre [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('en los estados cruzados del Levante', 'OUTREMER_GLOSS')] hacia el año [DATE.GetYear]"
 OUTREMER_GLOSS: "La Primera Cruzada y la formación de los estados cruzados favorecieron la llegada al Levante de caballeros, comerciantes, clérigos y otros colonos occidentales. Muchos eran francófonos y llamaban a aquellos territorios Outremer, «Ultramar». Se establecieron entre poblaciones locales diversas, con las que mantuvieron relaciones políticas, comerciales y familiares. El contacto con griegos, armenios, cristianos orientales y musulmanes contribuyó a una cultura franca levantina diferenciada de la de sus regiones europeas de origen."

 occitan_history_loc: "Siguió una evolución diferenciada de [CULTURE.GetName] [Glossary('en las comunidades romances del sur de la Galia', 'OCCITAN_GLOSS')] hacia el año [DATE.GetYear]"
 OCCITAN_GLOSS: "Las hablas derivadas del latín de la Galia evolucionaron de manera distinta en sus regiones septentrionales y meridionales. En el sur se desarrolló el ámbito de la lengua de oc, frente a las lenguas de oíl del norte. Aquitania, Languedoc y otras regiones occitanas conservaron variedades relacionadas y tradiciones culturales propias. Durante la Edad Media, la poesía de los trovadores otorgó al occitano un gran prestigio literario y cortesano, con influencia más allá de sus territorios de origen."

 gascon_history_loc: "Se desarrolló por el contacto entre [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('en las tierras aquitanas y los Pirineos occidentales', 'GASCON_GLOSS')] hacia el año [DATE.GetYear]"
 GASCON_GLOSS: "Las poblaciones de Aquitania y los Pirineos occidentales hablaban antiguamente lenguas relacionadas con el vasco. La difusión del latín y la evolución posterior de las hablas romances se produjeron sobre ese sustrato. De ese proceso surgió el gascón, cuyos rasgos lo distinguen dentro del ámbito occitano. Sus hablantes conservaron una identidad regional vinculada tanto a la herencia aquitana y vasca como a sus relaciones con las comunidades romances vecinas."

 provencal_history_loc: "Adquirió rasgos regionales a partir de [CULTURE.GetName] [Glossary('en el bajo Ródano y la costa de Provenza', 'PROVENCAL_GLOSS')] hacia el año [DATE.GetYear]"
 PROVENCAL_GLOSS: "La consolidación del condado de Provenza favoreció una identidad regional en las tierras del bajo Ródano y la costa mediterránea. Las comunidades occitanas de la región participaron en redes comerciales marítimas y en relaciones políticas con Borgoña, Italia y el condado de Barcelona. Estos contactos contribuyeron a sus tradiciones cortesanas y urbanas. El provenzal mantuvo su pertenencia al ámbito de la lengua de oc, con características propias vinculadas a la historia regional."

 bavarian_history_loc: "Surgió de la integración de [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('en los antiguos territorios de Retia y Nórico', 'BAVARIAN_GLOSS')] hacia el año [DATE.GetYear]"
 BAVARIAN_GLOSS: "Tras el debilitamiento de la autoridad romana en Retia y Nórico durante el siglo V, distintas poblaciones germánicas se establecieron entre comunidades ya romanizadas. Entre los grupos relacionados con la formación bávara se han propuesto marcomanos y otros pueblos suevos, junto con aportaciones alamanas, lombardas y turingias. De esa diversidad surgieron los baiuvarii, documentados en el siglo VI. Sus duques quedaron vinculados al poder franco, mientras se consolidaban la identidad regional y las instituciones del ducado de Baviera."

 saxon_history_loc: "Se transformó dentro del ámbito de [CULTURE.GetName] [Glossary('tras la conquista franca de Sajonia', 'SAXON_GLOSS')] hacia el año [DATE.GetYear]"
 SAXON_GLOSS: "Los sajones continentales combatieron durante más de tres décadas contra los ejércitos de Carlomagno en las guerras sajonas (772-804). El conflicto estuvo marcado por la matanza de Verden en 782 y por la imposición de conversiones y traslados forzosos con los que el monarca franco buscó acabar con la resistencia sajona. A diferencia de sus parientes que habían emigrado a Britania siglos antes y dieron origen a los anglosajones, los sajones continentales fueron incorporados directamente al Imperio carolingio."

 swabian_history_loc: "Se consolidó a partir de [CULTURE.GetName] [Glossary('en los territorios del alto Rin y la antigua frontera romana', 'SWABIAN_GLOSS')] hacia el año [DATE.GetYear]"
 SWABIAN_GLOSS: "El nombre de los suevos designaba en las fuentes romanas un amplio conjunto de pueblos germánicos. En las regiones del alto Rin y el sudoeste de Germania, las agrupaciones alamanas incorporaron distintas poblaciones y se extendieron sobre antiguos territorios romanos. Con el tiempo, las denominaciones sueva y alamana quedaron estrechamente vinculadas. La integración en el mundo franco no borró sus particularidades regionales, que perduraron en el ducado medieval de Suabia."

 ripuarian_history_loc: "Desarrolló rasgos propios dentro de [CULTURE.GetName] [Glossary('en torno a Colonia y el Rin', 'RIPUARIAN_GLOSS')] hacia el año [DATE.GetYear]"
 RIPUARIAN_GLOSS: "Los francos ripuarios se asentaron a lo largo del Rin medio, en torno a Colonia. Constituían una rama diferenciada del mundo franco, distinta de los francos salios, que se habían extendido hacia el oeste, por la Galia. Su derecho consuetudinario quedó recogido en la Lex Ripuaria, paralela a la más conocida Ley Sálica. Su posición en la frontera del Rin y la proximidad de sajones y frisones aún no sometidos contribuyeron a forjar una identidad propia, diferente de la de los francos salios occidentales, más romanizados."

 franconian_history_loc: "Se extendió a partir de [CULTURE.GetName] [Glossary('con los asentamientos francos del valle del Meno', 'FRANCONIAN_GLOSS')] hacia el año [DATE.GetYear]"
 FRANCONIAN_GLOSS: "Los asentamientos francos se extendieron hacia el este y el sur siguiendo el valle del río Meno, hasta las tierras que acabarían recibiendo el nombre de Franconia. Esta región fronteriza, próxima a los territorios de turingios y bávaros, recibió sucesivas oleadas de colonos francos tras las conquistas merovingias de comienzos del siglo VI. La expansión oriental del mundo franco, vinculada al Meno más que al Rin, favoreció el desarrollo de una identidad regional y un dialecto propios, sin romper sus vínculos con las tradiciones políticas y jurídicas francas."

 low_frankish_history_loc: "Siguió una evolución regional de [CULTURE.GetName] [Glossary('entre el bajo Rin y el Mosa', 'LOW_FRANKISH_GLOSS')] hacia el año [DATE.GetYear]"
 LOW_FRANKISH_GLOSS: "Los asentamientos francos en las tierras bajas del delta del Rin y el Mosa siguieron una evolución distinta de la de los territorios francos situados más al sur. El paisaje pantanoso, las frecuentes inundaciones y la proximidad de los frisones favorecieron el desarrollo de una identidad cultural y lingüística diferenciada de las variedades del alto franconio habladas en Renania y otras regiones del reino franco. Estas comunidades bajofranconas, vinculadas tanto a las poblaciones costeras del mar del Norte como a los territorios del interior, conservaron rasgos culturales y dialectales propios que contribuirían posteriormente a la formación de las lenguas bajofranconas, entre ellas el neerlandés."

 thuringian_history_loc: "Conservó una identidad propia de [CULTURE.GetName] [Glossary('tras la incorporación del reino turingio al poder franco', 'THURINGIAN_GLOSS')] hacia el año [DATE.GetYear]"
 THURINGIAN_GLOSS: "El reino independiente de los turingios había dominado el centro de Germania durante generaciones, hasta que el rey franco Teodorico derrotó a su ejército en la batalla del Unstrut en 531. Con ello terminó su independencia política y el núcleo de su territorio quedó incorporado al reino franco. Aunque perdieron su monarquía, los turingios conservaron su identidad bajo el dominio franco y sus costumbres jurídicas acabaron recogidas en un código propio."

 frisian_history_loc: "Se formó por la integración de [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('durante el repoblamiento de la costa del mar del Norte', 'FRISIAN_GLOSS')] hacia el año [DATE.GetYear]"
 FRISIAN_GLOSS: "Los frisios de época romana desaparecieron de las fuentes escritas después del siglo III, cuando las inundaciones y la subida del nivel del mar hicieron cada vez más difícil habitar sus tierras costeras. Hacia el año 400, amplias zonas quedaron abandonadas durante generaciones. Cuando la costa volvió a ser habitable en el siglo V, llegaron nuevos pobladores emparentados con los grupos anglosajones del mar del Norte, que absorbieron a los pequeños núcleos supervivientes de la antigua población. Los recién llegados adoptaron el nombre de frisios y, de esta mezcla, surgieron las comunidades frisias conocidas por las fuentes medievales."

 east_elbian_history_loc: "Se desarrolló entre comunidades de [CULTURE.GetName] [Glossary('que se asentaron al este del Elba', 'EAST_ELBIAN_GLOSS')] hacia el año [DATE.GetYear]"
 EAST_ELBIAN_GLOSS: "Las tierras al este del Elba habían estado habitadas durante siglos por pueblos eslavos polabios. Durante la expansión colonizadora hacia el este, conocida como Ostsiedlung, campesinos, monjes y fundadores de poblaciones sajones cruzaron la antigua frontera en busca de tierras y oportunidades. Muchos llegaron invitados por príncipes eslavos interesados en atraer colonos experimentados, mientras monasterios y diócesis impulsaban nuevos asentamientos. Esta colonización transformó gradualmente las marcas orientales en territorios de habla alemana y difundió las costumbres jurídicas y agrícolas de Sajonia."

 prussian_g_history_loc: "Surgió del contacto entre [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('bajo la colonización impulsada por la Orden Teutónica', 'PRUSSIAN_G_GLOSS')] hacia el año [DATE.GetYear]"
 PRUSSIAN_G_GLOSS: "La cruzada de la Orden Teutónica contra los prusianos bálticos paganos comenzó en la década de 1230, tras la invitación de un duque polaco que buscaba contener sus incursiones. A décadas de conquista siguió una política deliberada de colonización alemana. Los colonos sajones que acompañaron a los caballeros de la Orden se asentaron entre los supervivientes de la población báltica autóctona. Bajo la administración de la Orden, la mezcla de ambas tradiciones dio origen a una identidad prusiana germanizada, mientras la antigua lengua prusiana retrocedía paulatinamente hasta desaparecer."

 dutch_history_loc: "Se consolidó por el contacto entre [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('en las tierras bajas del Rin y el Mosa', 'DUTCH_GLOSS')] hacia el año [DATE.GetYear]"
 DUTCH_GLOSS: "Las comunidades bajofranconas del delta del Rin y el Mosa y las poblaciones frisias de las costas e islas habían seguido trayectorias distintas durante siglos: unas vinculadas al mundo franco y otras a sus propias tradiciones marítimas. Sin embargo, compartían las mismas tierras bajas y la lucha constante contra el mar. Siglos de vecindad, comercio y matrimonios entre ambos grupos entrelazaron sus hablas y costumbres, favoreciendo la aparición de la lengua y la identidad neerlandesas que caracterizarían al condado de Holanda y sus territorios vecinos."

 walloon_history_loc: "Se desarrolló por el contacto entre [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('en la frontera romance de los Países Bajos meridionales', 'WALLOON_GLOSS')] hacia el año [DATE.GetYear]"
 WALLOON_GLOSS: "El sur de los Países Bajos se encontraba sobre la antigua frontera lingüística entre las hablas romances y germánicas. Esta división atravesaba la región y exponía a sus principados a una influencia francesa constante, aunque sus instituciones políticas y sociales seguían vinculadas a los Países Bajos. La interacción de las hablas romances con las comunidades locales de los condados y obispados meridionales favoreció la aparición de una identidad valona diferenciada, romance por su lengua y ligada a los Países Bajos por su trayectoria histórica."

 flemish_history_loc: "Adquirió rasgos propios a partir de [CULTURE.GetName] [Glossary('en las ciudades textiles de Flandes', 'FLEMISH_GLOSS')] hacia el año [DATE.GetYear]"
 FLEMISH_GLOSS: "La industria textil de Flandes atrajo a sus ciudades una población rural cada vez más numerosa. Tejedores, tintoreros y bataneros acudieron a Brujas, Gante e Ypres desde las comarcas circundantes, hasta convertirlas en algunos de los mayores centros urbanos de la Europa medieval. Esta concentración de artesanos y comerciantes, organizados en gremios y asentados durante generaciones en las ciudades, diferenció a la población flamenca de las comunidades rurales de su entorno y dio a su identidad un marcado carácter urbano y mercantil."

 old_anglian_history_loc: "Se desarrolló entre grupos de [CULTURE.GetName] [Glossary('que emigraron a la Britania oriental', 'OLD_ANGLIAN_GLOSS')] hacia el año [DATE.GetYear]"
 OLD_ANGLIAN_GLOSS: "Los anglos continentales procedían de la península de Anglia, en el actual Schleswig-Holstein. Su emigración a Britania fue tan intensa que, según algunas fuentes, su tierra de origen quedó despoblada durante generaciones. A diferencia de los sajones, concentrados principalmente en el sur, los anglos se establecieron en la costa oriental de Britania y fundaron reinos como Northumbria, Anglia Oriental y Mercia. La propia lengua inglesa conserva su nombre y buena parte de su herencia, vinculados a estos pobladores anglos."

 northumbrian_history_loc: "Se consolidó por la integración de [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('con la unión de Bernicia y Deira', 'NORTHUMBRIAN_GLOSS')] hacia el año [DATE.GetYear]"
 NORTHUMBRIAN_GLOSS: "Las comunidades anglas de Bernicia y Deira compartían vínculos lingüísticos, aunque desarrollaron poderes y lealtades regionales distintos. Las guerras, las uniones dinásticas y los movimientos de población entre ambos territorios favorecieron su integración. La consolidación de Northumbria dio un marco político común a estas comunidades sin borrar de inmediato sus diferencias. Sus monasterios, entre ellos Lindisfarne y Jarrow, se convirtieron en destacados centros de enseñanza, producción manuscrita y arte durante la Alta Edad Media."

 anglo_norse_history_loc: "Surgió de la convivencia entre [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('en los asentamientos del Danelaw', 'ANGLO_NORSE_GLOSS')] hacia el año [DATE.GetYear]"
 ANGLO_NORSE_GLOSS: "La llegada del Gran Ejército Pagano en 865 y las conquistas posteriores favorecieron un importante asentamiento escandinavo en el norte y el este de Inglaterra. Las comunidades de lengua nórdica convivieron con la población anglosajona en los territorios conocidos como Danelaw. La agricultura, el comercio, los matrimonios y la adaptación de las costumbres jurídicas entrelazaron ambas tradiciones. Su influencia perduró en los topónimos, el vocabulario y las instituciones mucho después de la desaparición de las fronteras políticas del Danelaw."

 northerner_history_loc: "Combinó tradiciones de [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('en las comunidades del norte de Inglaterra', 'NORTHERNER_GLOSS')] hacia el año [DATE.GetYear]"
 NORTHERNER_GLOSS: "El norte de Inglaterra conservaba tradiciones anglas y una fuerte influencia escandinava antes de la conquista normanda. Las campañas de devastación de 1069 y 1070, conocidas como la devastación del Norte, afectaron gravemente a sus comunidades. La recuperación se desarrolló sobre una herencia regional que combinaba elementos northumbrios y anglonórdicos. Sus hablas y costumbres mantuvieron particularidades propias dentro del reino inglés, aunque esa identidad no nació de un único episodio de conquista."

 english_history_loc: "Se transformó por el contacto entre [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('tras la conquista normanda de Inglaterra', 'ENGLISH_GLOSS')] hacia el año [DATE.GetYear]"
 ENGLISH_GLOSS: "La victoria de Guillermo de Normandía en Hastings, en 1066, estableció una aristocracia francófona sobre una población mayoritariamente anglosajona. El francés normando adquirió prestigio en la corte, el derecho y la administración, mientras el inglés continuó siendo hablado por gran parte de la población. Durante los siglos siguientes, los contactos cotidianos y la integración social transformaron ambas comunidades. El inglés medio incorporó numerosos préstamos franceses sin perder su estructura germánica, y se consolidó una nueva identidad inglesa medieval."

 scottish_history_loc: "Se desarrolló por el contacto entre [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('en las Tierras Bajas del reino de Escocia', 'SCOTTISH_GLOSS')] hacia el año [DATE.GetYear]"
 SCOTTISH_GLOSS: "Las poblaciones anglas de Lothian y las comunidades britónicas de Strathclyde mantuvieron relaciones cambiantes de guerra, comercio y parentesco. Su incorporación progresiva al reino de Escocia durante los siglos X y XI reunió territorios de lenguas y tradiciones distintas. Las hablas de origen anglo se extendieron por parte de las Tierras Bajas y, con influencias posteriores, contribuyeron al desarrollo del escocés. Esta trayectoria fue diferente de la del gaélico, predominante en otras regiones del reino."

 scanian_history_loc: "Adquirió rasgos regionales a partir de [CULTURE.GetName] [Glossary('en las tierras agrícolas y los puertos de Escania', 'SCANIAN_GLOSS')] hacia el año [DATE.GetYear]"
 SCANIAN_GLOSS: "Escania ocupa el extremo meridional de la península escandinava. Sus fértiles llanuras y su acceso al estrecho de Øresund favorecieron una densa población agrícola, pesquera y mercantil. Los contactos con las islas danesas sostuvieron estrechos vínculos políticos y culturales. Dentro del reino danés medieval, Escania conservó una identidad regional propia. Su riqueza y su posición estratégica la convertirían después en un territorio disputado entre Dinamarca y Suecia."

 got_history_loc: "Desarrolló una identidad insular a partir de [CULTURE.GetName] [Glossary('en las rutas comerciales de Gotland', 'GOT_GLOSS')] hacia el año [DATE.GetYear]"
 GOT_GLOSS: "Las semejanzas entre los nombres de godos, gautas y habitantes de Gotland dieron lugar a tradiciones sobre un origen compartido, recogidas o reinterpretadas a partir de autores como Jordanes. Estas relaciones no permiten reconstruir con certeza una única migración o filiación. La Gutasaga conservó tradiciones propias sobre el poblamiento de Gotland. La isla desarrolló una sociedad marítima y mercantil diferenciada, favorecida por su posición en las rutas del Báltico y por sus contactos con las costas vecinas."

 greenlandic_history_loc: "Combinó tradiciones de [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('en los asentamientos nórdicos de Groenlandia', 'GREENLANDIC_GLOSS')] hacia el año [DATE.GetYear]"
 GREENLANDIC_GLOSS: "Erik el Rojo, exiliado de Islandia, impulsó el asentamiento nórdico en Groenlandia hacia 985. La tradición atribuye al nombre «tierra verde» la intención de atraer colonos. Los recién llegados establecieron granjas en fiordos adecuados para el pastoreo y llevaron consigo costumbres y leyes del mundo islandés. Las largas travesías, la corta estación de cultivo y las condiciones del Atlántico Norte favorecieron una identidad local entre estas comunidades nórdicas, distinta de las poblaciones indígenas de la isla."

 swedish_history_loc: "Se consolidó a partir de [CULTURE.GetName] [Glossary('con la integración de sueones y gautas', 'SWEDISH_GLOSS')] hacia el año [DATE.GetYear]"
 SWEDISH_GLOSS: "Los sueones del entorno del lago Mälaren mantenían centros religiosos y comerciales como Gamla Uppsala y Birka. Sus redes se extendían hacia el Báltico oriental. Al sur, los gautas conservaban sus propias tradiciones y centros de poder. Los intercambios, las alianzas y la consolidación de una monarquía común fueron vinculando ambos ámbitos. La identidad sueca se formó gradualmente sobre esas relaciones y otras aportaciones regionales, conservando un nombre asociado originalmente a los sueones."

 norwegian_history_loc: "Se desarrolló a partir de [CULTURE.GetName] [Glossary('mediante la integración marítima y política de los fiordos occidentales', 'NORWEGIAN_GLOSS')] hacia el año [DATE.GetYear]"
 NORWEGIAN_GLOSS: "Las comunidades agrícolas y pesqueras de Noruega estaban separadas por montañas y fiordos, pero conectadas por rutas marítimas. Durante la época vikinga, las expediciones comerciales, las incursiones y los asentamientos en otras costas intensificaron esas relaciones. La tradición atribuyó a Harald Cabellera Hermosa un papel central en la unificación, aunque la consolidación del reino fue un proceso prolongado. La creciente integración política y marítima favoreció una identidad noruega compartida sin borrar las lealtades regionales."

 norn_history_loc: "Siguió una evolución insular de [CULTURE.GetName] [Glossary('en las Orcadas y las Shetland', 'NORN_GLOSS')] hacia el año [DATE.GetYear]"
 NORN_GLOSS: "Los colonos nórdicos de las Orcadas y las Shetland mantuvieron relaciones con Noruega y con las costas de las islas británicas. Sus jarls conservaron una considerable autonomía en distintos períodos, incluso bajo la soberanía de la corona noruega. El comercio, las incursiones y los matrimonios los vincularon también con el mundo gaélico. En ese entorno insular evolucionó el norn, una lengua de origen nórdico que reflejaba la trayectoria propia de los archipiélagos."

 faroese_history_loc: "Se desarrolló entre comunidades de [CULTURE.GetName] [Glossary('establecidas en las islas Feroe', 'FAROESE_GLOSS')] hacia el año [DATE.GetYear]"
 FAROESE_GLOSS: "Los colonos nórdicos que llegaron a las Feroe encontraron un archipiélago volcánico con poca tierra cultivable y abundantes pastos para las ovejas. La pesca, la ganadería y la captura de aves marinas sostuvieron sus comunidades. La distancia respecto de Noruega y las dificultades de navegación favorecieron una vida insular con instituciones y costumbres propias. El feroés evolucionó a partir del nórdico de los colonos, conservando vínculos con otras lenguas del Atlántico Norte y desarrollando rasgos diferenciados."

 danish_history_loc: "Se consolidó por la integración de [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('entre Jutlandia y las islas danesas', 'DANISH_GLOSS')] hacia el año [DATE.GetYear]"
 DANISH_GLOSS: "Las comunidades danesas y jutas compartían las costas, islas y tierras de Jutlandia, con tradiciones germánicas septentrionales relacionadas. Siglos de convivencia, comercio y alianzas contribuyeron a su integración. La consolidación monárquica y la cristianización reforzaron ese proceso durante el siglo X. Las piedras de Jelling, vinculadas a Harald Diente Azul, proclamaban su autoridad sobre los daneses y su conversión al cristianismo. La identidad danesa se desarrolló sobre esas comunidades y redes anteriores, además de la acción de la monarquía."

 irish_history_loc: "Se desarrolló a partir de [CULTURE.GetName] [Glossary('en las comunidades de habla goidélica de Irlanda', 'IRISH_GLOSS')] hacia el año [DATE.GetYear]"
 IRISH_GLOSS: "Ptolomeo mencionó a los ivernos entre los pueblos del sur de Irlanda. Su nombre se relaciona con antiguas denominaciones de la isla y con tradiciones posteriores sobre los érainn. Las hipótesis acerca de sus lenguas y migraciones siguen siendo discutidas. Durante la Alta Edad Media, linajes como los Eóganachta y los Uí Néill adquirieron creciente poder. Las comunidades de habla goidélica, sus redes religiosas y sus tradiciones jurídicas y literarias contribuyeron a una identidad irlandesa compartida pese a la fragmentación política."

 manx_history_loc: "Siguió una evolución insular de [CULTURE.GetName] [Glossary('en la isla de Man', 'MANX_GLOSS')] hacia el año [DATE.GetYear]"
 MANX_GLOSS: "La isla de Man ocupa una posición central en el mar de Irlanda, próxima a Irlanda, Escocia, Gales y el norte de Inglaterra. La difusión de las hablas gaélicas y los contactos marítimos contribuyeron a su cultura. Los asentamientos nórdicos y las posteriores relaciones con Escocia e Inglaterra añadieron nuevas influencias. De esa historia insular surgió una identidad manesa propia, cuyo idioma conservó raíces goidélicas y evolucionó de manera diferenciada respecto del irlandés y el gaélico escocés."

 gaelic_history_loc: "Se consolidó por la integración de [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('durante la expansión del gaélico por Escocia', 'GAELIC_GLOSS')] hacia el año [DATE.GetYear]"
 GAELIC_GLOSS: "Las comunidades de Dál Riata mantuvieron estrechos vínculos entre el noreste de Irlanda y el oeste de Escocia. La expansión de la lengua gaélica, las redes monásticas y las relaciones dinásticas intensificaron el contacto con las poblaciones pictas. Durante los siglos siguientes, las transformaciones políticas que dieron origen a Alba favorecieron una difusión más amplia del gaélico. La identidad gaélica escocesa se desarrolló mediante esa integración prolongada, sin reducirse a una única conquista o unión de dos reinos."

 gall_goidel_history_loc: "Surgió de la convivencia entre [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('en las costas y las islas occidentales de Escocia', 'GALL_GOIDEL_GLOSS')] hacia el año [DATE.GetYear]"
 GALL_GOIDEL_GLOSS: "Los asentamientos escandinavos en las costas occidentales y las islas de Escocia favorecieron una intensa convivencia con las comunidades gaélicas. Los matrimonios, el comercio y la vida marítima dieron lugar a grupos conocidos como gall-goídil, vinculados a ambas tradiciones. Destacaron en las Hébridas y en el reino de las Islas. Sus comunidades combinaron la lengua y numerosas costumbres gaélicas con elementos nórdicos, especialmente en la navegación, la organización política y las tradiciones militares."

 neretljanian_history_loc: "Desarrolló una tradición marítima a partir de [CULTURE.GetName] [Glossary('en el curso inferior del Neretva y las islas del Adriático', 'NERETLJANIAN_GLOSS')] hacia el año [DATE.GetYear]"
 NERETLJANIAN_GLOSS: "Los cronistas bizantinos agruparon a los primeros pobladores eslavos de los Balcanes bajo la denominación general de esclavenos, pero hacia el siglo IX habían surgido distintas identidades tribales a lo largo de la fragmentada costa dálmata. Entre ellas destacaban los neretvanos, establecidos en el curso inferior del río Neretva y las islas cercanas. Protegidos por un laberinto de canales e islotes que dificultaba enormemente la vigilancia de las flotas extranjeras, los neretvanos adquirieron una temible reputación como piratas. Sus incursiones contra las embarcaciones mercantes venecianas y bizantinas llegaron a representar una amenaza tan persistente que incluso los dux de Venecia se vieron obligados a pagarles tributos para garantizar el paso seguro de sus naves por el Adriático durante generaciones."

 branichian_history_loc: "Adquirió rasgos regionales a partir de [CULTURE.GetName] [Glossary('en las disputadas fronteras del Danubio', 'BRANICHIAN_GLOSS')] hacia el año [DATE.GetYear]"
 BRANICHIAN_GLOSS: "Los branichevianos se establecieron en la región de Braničevo, junto a la frontera del Danubio, en una posición estratégica disputada sucesivamente por bizantinos, búlgaros y húngaros. Cada una de estas potencias procuró controlar los pasos del río y las importantes rutas comerciales que atravesaban la región. Su situación fronteriza expuso a sus habitantes a continuas campañas militares, conquistas y reconquistas, conforme cambiaba el equilibrio de poder en el Danubio medio. Esta inestabilidad contribuyó a forjar una identidad regional marcada por el contacto y los conflictos entre las potencias vecinas, más que por la continuidad de unas instituciones políticas propias."

 doclean_history_loc: "Se consolidó entre comunidades de [CULTURE.GetName] [Glossary('establecidas en las montañas del Adriático meridional', 'DOCLEAN_GLOSS')] hacia el año [DATE.GetYear]"
 DOCLEAN_GLOSS: "Los docleanos se establecieron en la montañosa región costera que rodeaba la antigua ciudad romana de Doclea, de la que tomaron su nombre. Su territorio, situado en el sur del Adriático, estaba formado por comunidades dispersas de agricultores, pastores y pescadores, en unas tierras que posteriormente serían conocidas como Zeta y, con el tiempo, Montenegro. Situados entre las ciudades costeras bizantinas y los principados serbios del interior, sus habitantes conservaron tradiciones y particularidades regionales propias. Esteban Vojislav afirmó su independencia durante el siglo XI, y sus sucesores consolidaron un reino propio. Sin embargo, con el transcurso de los siglos, la región quedó cada vez más vinculada política y culturalmente a los territorios serbios vecinos."

 travunian_history_loc: "Desarrolló una identidad regional a partir de [CULTURE.GetName] [Glossary('en las tierras montañosas de Trebinje', 'TRAVUNIAN_GLOSS')] hacia el año [DATE.GetYear]"
 TRAVUNIAN_GLOSS: "Los travunios se establecieron en las tierras montañosas que rodeaban Trebinje, donde surgió un pequeño principado situado estratégicamente entre la ciudad costera de Ragusa, los territorios de Zahumlia al noroeste y el principado de Doclea al sureste. Rodeada de vecinos más extensos y poderosos, Travunia desempeñó generalmente un papel secundario en la política balcánica. Sus gobernantes procuraron conservar su autoridad local mediante el reconocimiento de la soberanía de las potencias dominantes en cada período, ya fueran los bizantinos, los serbios o los gobernantes de Doclea. Esta posición permitió que el principado mantuviera una identidad regional propia, aunque su autonomía dependiera frecuentemente del equilibrio político entre sus vecinos."

 zachlumian_history_loc: "Se consolidó regionalmente a partir de [CULTURE.GetName] [Glossary('en las tierras altas de Zahumlia', 'ZACHLUMIAN_GLOSS')] hacia el año [DATE.GetYear]"
 ZACHLUMIAN_GLOSS: "Los zahumlios se establecieron en las tierras montañosas de Zahumlia, situadas al noroeste de Ragusa, donde formaron un principado cuya proximidad al curso inferior del Neretva y al mar Adriático le otorgó una importancia comercial y estratégica superior a la que cabría esperar de su extensión. Esta posición atrajo durante siglos el interés de las potencias bizantina, búlgara y serbia, que compitieron por ejercer su influencia sobre la región. El emperador Constantino VII Porfirogéneta relacionó a los habitantes de Zahumlia con los serbios, aunque atribuyó al linaje de Miguel de Zahumlia una procedencia distinta. Estos relatos deben entenderse en el contexto político y genealógico de su obra. Pese a estas relaciones, Zahumlia conservó durante largos períodos sus propios gobernantes y una identidad regional diferenciada."

 berzite_history_loc: "Conservó rasgos propios de [CULTURE.GetName] [Glossary('en las comunidades de las tierras altas de Macedonia', 'BERZITE_GLOSS')] hacia el año [DATE.GetYear]"
 BERZITE_GLOSS: "Los berzitas figuran entre las tribus eslavas mencionadas en los relatos reunidos bajo el título de los Milagros de san Demetrio, que describen las incursiones y los asedios sufridos por la ciudad bizantina de Tesalónica. Establecidos en las regiones montañosas del interior de Macedonia, formaron parte de las primeras comunidades eslavas que ejercieron una presión sostenida sobre los territorios bizantinos del norte del Egeo. La naturaleza escarpada de sus asentamientos dificultaba las expediciones de represalia y favorecía su autonomía frente a las autoridades imperiales. Gracias a esta protección natural, los berzitas mantuvieron su presencia en el interior macedonio durante generaciones, incluso cuando el Imperio bizantino recuperó gradualmente el control de las costas y los valles fluviales más accesibles."

 croatian_history_loc: "Se desarrolló entre grupos de [CULTURE.GetName] [Glossary('establecidos en Dalmacia y su interior', 'CROATIAN_GLOSS')] hacia el año [DATE.GetYear]"
 CROATIAN_GLOSS: "Las tradiciones recogidas por autores bizantinos situaban el origen de los croatas en una «Croacia Blanca» al norte de los Cárpatos y relacionaban su llegada a los Balcanes con el reinado de Heraclio. La localización exacta y los detalles de esa migración son discutidos. Durante la Alta Edad Media se consolidaron grupos e identidades croatas en Dalmacia y su interior. Sus principados y el posterior reino participaron en las disputas por el Adriático oriental junto a bizantinos, venecianos y otros poderes vecinos."

 serbian_history_loc: "Se consolidó entre comunidades de [CULTURE.GetName] [Glossary('que se asentaron en los Balcanes occidentales', 'SERBIAN_GLOSS')] hacia el año [DATE.GetYear]"
 SERBIAN_GLOSS: "La tradición medieval recogida por autores bizantinos vinculaba a los serbios con una «Serbia Blanca» situada al norte de los Balcanes. La semejanza de su nombre con el de los sorbios ha favorecido distintas interpretaciones sobre sus relaciones, sin resolver todos los detalles de la migración. Las comunidades serbias se consolidaron en los Balcanes occidentales durante la Alta Edad Media, en contacto con otras poblaciones eslavas y con el mundo bizantino. Sus identidades políticas se desarrollaron a través de principados y redes regionales."

 bosnian_history_loc: "Se desarrolló en contacto con [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('en los valles y montañas de Bosnia', 'BOSNIAN_GLOSS')] hacia el año [DATE.GetYear]"
 BOSNIAN_GLOSS: "El valle del Bosna y las montañas de su entorno se situaban entre áreas de influencia croata, serbia y bizantina, y posteriormente bajo la presión de Hungría. El relieve dificultaba un control uniforme desde los poderes vecinos. Las comunidades eslavas locales mantuvieron contactos en distintas direcciones y desarrollaron instituciones y lealtades regionales. La consolidación política de Bosnia reforzó una identidad propia, cuya formación no puede reducirse a una simple mezcla de dos pueblos vecinos."

 illyrian_slavic_history_loc: "Combinó tradiciones de [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('en las fronteras de los Balcanes occidentales', 'ILLYRIAN_SLAVIC_GLOSS')] hacia el año [DATE.GetYear]"
 ILLYRIAN_SLAVIC_GLOSS: "La vinculación de Croacia con la corona húngara desde 1102 modificó el equilibrio político de los Balcanes occidentales. Los llamados Pacta conventa son una fuente posterior cuya autenticidad y alcance se discuten. Las comunidades eslavas de las fronteras mantuvieron relaciones de comercio, parentesco y convivencia bajo influencias húngaras, bizantinas y venecianas. Esos vínculos favorecieron tradiciones regionales compartidas, sin borrar las diferencias entre las comunidades locales."

 carantanian_history_loc: "Surgió de la integración de [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('en los antiguos territorios de Nórico', 'CARANTANIAN_GLOSS')] hacia el año [DATE.GetYear]"
 CARANTANIAN_GLOSS: "Los grupos eslavos que llegaron a los Alpes orientales desde finales del siglo VI encontraron comunidades romanizadas todavía presentes en la antigua provincia de Nórico. La convivencia y la integración de esas poblaciones dejaron huellas en los asentamientos y los topónimos. Tras un período de predominio ávaro, se consolidó el principado de Carantania, con instituciones propias. Sus comunidades contribuyeron a la historia de los eslavos alpinos y a la posterior formación de la identidad eslovena."

 czech_history_loc: "Se consolidó entre comunidades de [CULTURE.GetName] [Glossary('establecidas en las tierras de Bohemia', 'CZECH_GLOSS')] hacia el año [DATE.GetYear]"
 CZECH_GLOSS: "Bohemia había albergado poblaciones marcomanas y otros grupos germánicos antes de la llegada de comunidades eslavas durante los siglos V y VI. Los nuevos asentamientos transformaron progresivamente la región. Parte de sus poblaciones quedó vinculada a la confederación de Samo en el siglo VII, que resistió presiones ávaras y francas. Tras su disolución, distintos poderes locales continuaron desarrollándose. La consolidación de los premislidas contribuyó después a un Estado checo y a una identidad política común en Bohemia."

 dravehnian_history_loc: "Se desarrolló por el contacto entre [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('en los territorios interiores de Polabia', 'DRAVEHNIAN_GLOSS')] hacia el año [DATE.GetYear]"
 DRAVEHNIAN_GLOSS: "Los drevanos habitaron territorios del interior de Polabia, en contacto con el ámbito obodrita y otros pueblos eslavos vecinos. Sus comunidades agrícolas y forestales tenían una orientación distinta de las poblaciones más próximas a la costa báltica. Las relaciones políticas regionales coexistieron con una lengua y unas costumbres locales. El relativo aislamiento de algunos asentamientos permitió conservar durante largo tiempo elementos de su herencia eslava dentro de un entorno progresivamente germanizado."

 ranian_history_loc: "Adquirió una identidad regional a partir de [CULTURE.GetName] [Glossary('en torno al santuario de Arkona, en Rügen', 'RANIAN_GLOSS')] hacia el año [DATE.GetYear]"
 RANIAN_GLOSS: "Los ranios se establecieron en la isla de Rügen y las costas adyacentes, donde se encontraba el gran templo de Svantevit en Arkona. La importancia de su oráculo y las riquezas acumuladas en su tesorería convirtieron a los príncipes ranios en algunas de las figuras religiosas y políticas más influyentes entre los pueblos eslavos polabios, pese a la reducida extensión de sus dominios. Arkona se convirtió en uno de los principales centros del paganismo eslavo, atrayendo peregrinos y tributos de las comunidades del Báltico meridional. Esta concentración de autoridad religiosa otorgó a los ranios una influencia regional muy superior a su poder territorial, que perduró hasta la conquista danesa de Rügen en 1168, cuando las fuerzas del rey Valdemar I destruyeron el santuario de Arkona y pusieron fin a su predominio religioso."

 lutici_history_loc: "Se organizó a partir de [CULTURE.GetName] [Glossary('en una confederación vinculada al santuario de Rethra', 'LUTICI_GLOSS')] hacia el año [DATE.GetYear]"
 LUTICI_GLOSS: "Los luticios formaron una confederación de tribus eslavas polabias con una organización relativamente descentralizada. Las asambleas y los centros religiosos, entre ellos Rethra, desempeñaron un papel importante frente al gobierno principesco de otros pueblos vecinos. La defensa de sus cultos paganos y de su autonomía favoreció alianzas y levantamientos contra poderes cristianos. Durante generaciones, la confederación fue un actor destacado en los conflictos de la frontera oriental del mundo germánico."

 kashubian_history_loc: "Conservó una identidad regional de [CULTURE.GetName] [Glossary('entre las comunidades de Pomerania oriental', 'KASHUBIAN_GLOSS')] hacia el año [DATE.GetYear]"
 KASHUBIAN_GLOSS: "Las comunidades eslavas de la Pomerania oriental estuvieron expuestas a influencias políticas polacas y a la expansión de los asentamientos germanófonos. En ese contexto conservaron hablas y tradiciones locales vinculadas a la herencia pomerana. La identidad casubia se desarrolló mediante esa continuidad regional y sus relaciones con los vecinos. A medida que otras zonas se germanizaban o se integraban lingüísticamente en el ámbito polaco, el casubio mantuvo rasgos propios dentro del grupo léquico."

 NOVGORODIAN_GLOSS: "Nóvgorod estaba situada en rutas que conectaban el Báltico con el Volga y el mundo bizantino. Sus mercados atrajeron a comerciantes escandinavos, bálticos y de pueblos fínicos, junto a una importante población eslava. La riqueza comercial y las redes de las élites urbanas favorecieron instituciones propias. El veche, la asamblea de la ciudad, adquirió un papel político destacado, aunque su funcionamiento y representatividad variaron. Esta trayectoria diferenció a Nóvgorod de otros principados de la Rus."

 belarusian_history_loc: "Siguió una evolución regional de [CULTURE.GetName] [Glossary('en los principados occidentales de la Rus vinculados a Lituania', 'BELARUSIAN_GLOSS')] hacia el año [DATE.GetYear]"
 BELARUSIAN_GLOSS: "Las conquistas mongolas transformaron el equilibrio político de la Rus durante el siglo XIII. Sus territorios occidentales, incluidos los de Pólotsk, quedaron cada vez más vinculados al Gran Ducado de Lituania. La integración política, los contactos sociales y la continuidad de las comunidades eslavas favorecieron una trayectoria distinta de la de los principados orientales tributarios de los mongoles. En los siglos siguientes, esa herencia rutena occidental contribuyó a la formación de la lengua y la identidad bielorrusas."

 savonian_history_loc: "Surgió del contacto entre [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('en los bosques y lagos de Savonia', 'SAVONIAN_GLOSS')] hacia el año [DATE.GetYear]"
 SAVONIAN_GLOSS: "Los bosques y lagos de Savonia se situaban entre los territorios de Tavastia y Carelia. Sus recursos pesqueros y sus tierras aptas para la agricultura de roza atrajeron pobladores de regiones vecinas. La convivencia, los desplazamientos y la adaptación al entorno lacustre favorecieron hablas y costumbres locales. La identidad savoniana se desarrolló mediante esos contactos, con una importante relación lingüística con el ámbito carelio y conexiones con otras poblaciones finesas."

 hungarian_history_loc: "Se transformó a partir de [CULTURE.GetName] [Glossary('con el asentamiento y la cristianización en la cuenca de los Cárpatos', 'HUNGARIAN_GLOSS')] hacia el año [DATE.GetYear]"
 HUNGARIAN_GLOSS: "La confederación magiar se estableció en la cuenca de los Cárpatos a finales del siglo IX. Una de sus tribus, los megyer, dio nombre al conjunto en su propia lengua. Tras décadas de expediciones militares, la derrota de Lechfeld en 955 contribuyó a un cambio de orientación. La consolidación del poder principesco, la expansión de la agricultura y la cristianización transformaron gradualmente sus comunidades. La coronación de Esteban hacia el año 1000 simbolizó una nueva etapa política, dentro de un proceso social más prolongado."

 szekely_history_loc: "Se consolidó dentro de [CULTURE.GetName] [Glossary('entre las comunidades encargadas de la defensa de Transilvania oriental', 'SZEKELY_GLOSS')] hacia el año [DATE.GetYear]"
 SZEKELY_GLOSS: "Los sículos desempeñaron funciones de defensa fronteriza al servicio de la corona húngara. Su asentamiento en el este de Transilvania se consolidó durante la Edad Media, con privilegios y formas de autogobierno ligados a sus obligaciones militares. Las tradiciones medievales los relacionaron con los hunos de Atila, aunque esa ascendencia no está demostrada. La organización militar, los derechos colectivos y la memoria de sus orígenes reforzaron una identidad propia dentro del reino de Hungría."

 kott_history_loc: "Conservó rasgos propios de [CULTURE.GetName] [Glossary('en las comunidades yeniseicas del sur de Siberia', 'KOTT_GLOSS')] hacia el año [DATE.GetYear]"
 KOTT_GLOSS: "Los kott pertenecían a la familia lingüística yeniseica, antiguamente extendida por distintas regiones del sur de Siberia. Sus comunidades conservaron una lengua propia y formas de vida basadas en la caza y la pesca. Estaban emparentados lingüísticamente con otros pueblos yeniseicos, sin formar por ello una única unidad política. Sus hablas desaparecieron en época moderna, mientras el ket quedó como la única lengua superviviente de la familia."

 egyptian_coptic_history_loc: "Se transformó por el contacto entre [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('durante los períodos helenístico y romano de Egipto', 'EGYPTIAN_COPTIC_GLOSS')] hacia el año [DATE.GetYear]"
 EGYPTIAN_COPTIC_GLOSS: "La conquista de Egipto por Alejandro Magno en 332 a. C. abrió un período de dominio ptolemaico y de asentamiento griego. Alejandría se convirtió en un gran centro cosmopolita, mientras amplias comunidades conservaron la lengua egipcia y sus tradiciones. El dominio romano desde 30 a. C. añadió nuevas transformaciones. El copto representa una etapa de la lengua egipcia, escrita principalmente con letras de origen griego y algunos signos demóticos. La cristianización dio a esa herencia una nueva expresión religiosa y cultural, que perduró después de la conquista islámica."

 hazara_history_loc: "Surgió del contacto entre [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('en los asentamientos militares de las tierras altas de Afganistán', 'HAZARA_GLOSS')] hacia el año [DATE.GetYear]"
 HAZARA_GLOSS: "El nombre hazara suele relacionarse con el persa hazar, «mil», y con las unidades militares de organización decimal del mundo mongol. La formación del pueblo hazara, sin embargo, reunió aportaciones diversas. Los asentamientos vinculados a las conquistas mongolas y a grupos túrquicos se integraron con poblaciones de las tierras altas del centro de Afganistán. La convivencia, los matrimonios y la difusión del persa contribuyeron a una identidad propia, en la que perduraron elementos de esas distintas herencias."

 chuvash_history_loc: "Conservó una herencia de [CULTURE.GetName] [Glossary('entre las comunidades rurales y forestales del Volga medio', 'CHUVASH_GLOSS')] hacia el año [DATE.GetYear]"
 CHUVASH_GLOSS: "Las poblaciones vinculadas a los antepasados de los chuvasios habitaron regiones del Volga medio en contacto con la Bulgaria del Volga y con pueblos vecinos. Muchas comunidades conservaron tradiciones rurales y religiosas distintas de las de los centros islámicos del reino. Su lengua mantuvo rasgos de la rama ogúrica de la familia túrquica, relacionada con las antiguas hablas búlgaras. El chuvasio es la única lengua viva de esa rama, testimonio de una trayectoria diferente de la de las lenguas túrquicas comunes."

 dehwar_history_loc: "Se consolidó entre comunidades de [CULTURE.GetName] [Glossary('de agricultores y administradores de habla persa en Baluchistán', 'DEHWAR_GLOSS')] hacia el año [DATE.GetYear]"
 DEHWAR_GLOSS: "El nombre dehwar se relaciona con vocablos persas vinculados a la aldea y a sus habitantes. Las comunidades de habla persa de las tierras altas de Baluchistán conservaron una importante presencia agrícola y administrativa. Bajo los poderes islámicos regionales, sus vínculos con la gestión de tierras e ingresos contribuyeron a una identidad diferenciada de la de muchas comunidades pastoriles vecinas. Más tarde, miembros de estas poblaciones participaron en la administración del Kanato de Kalat, manteniendo variedades locales del persa y tradiciones de vida sedentaria."

