l_spanish:

 # CULTURE DEFINITIONS AND GLOSSARY

 ANATOLIA_GLOSS: "La turquificación de Anatolia se intensificó tras la victoria selyúcida en Manzikert en 1071, lo que provocó oleadas de migración turcomana desde Asia Central hacia la península en manos bizantinas. Estos pueblos túrquicos, principalmente tribus oguzes, se fusionaron gradualmente con las poblaciones anatolias locales, incluidos griegos, armenios y otros pueblos indígenas. El proceso avanzó bajo el sultanato de Rum: el turco se difundió progresivamente y las tradiciones islámicas se combinaron con las culturas locales. De estos contactos surgió una identidad turcoanatolia propia, que combinaba influencias túrquicas, persas y bizantinas."
 BULGARIAN_GLOSS: "Los protobúlgaros adoptaron formas de vida semisedentarias durante el siglo VII en la estepa póntico-caspia, y establecieron la Antigua Gran Bulgaria hacia 630-635. Este poder se desintegró en la segunda mitad del siglo VII bajo la presión jázara. El asentamiento de grupos dirigidos por Asparuh al sur del Danubio dio origen a un Estado reconocido por Bizancio en 681, el Primer Imperio búlgaro. Los protobúlgaros constituían en él una élite política y militar. Posteriormente se fusionaron con las poblaciones bizantinas ya establecidas, así como con tribus eslavas previamente asentadas, y adoptaron progresivamente la lengua eslava, contribuyendo a la formación del pueblo búlgaro."
 EGPYTIAN_GLOSS: "Antes de las conquistas islámicas, los árabes habían habitado durante siglos la península del Sinaí, el desierto oriental y el delta oriental. Estas regiones de Egipto eran conocidas colectivamente como «Arabia» por los historiadores y escritores contemporáneos que las documentaron. Varios reinos árabes preislámicos, como el reino cedarita, se extendían hacia estas regiones. Inscripciones y otros restos arqueológicos, como cuencos con inscripciones que identifican a reyes cedaritas e inscripciones árabes nabateas, confirman la presencia árabe en la región. Egipto fue conquistado a los romanos por el califato de los primeros califas en el siglo VII d. C. El idioma copto, escrito con la variante copta del alfabeto griego, se hablaba en la mayor parte de Egipto antes de la conquista islámica. Sin embargo, el árabe se hablaba en los confines orientales de Egipto desde siglos antes de la llegada del islam. En época mameluca, el árabe y el islam habían adquirido una posición mayoritaria, aunque persistían comunidades cristianas y la tradición litúrgica copta."
 LECHITIC_GLOSS: "«Tribus polacas» es un término utilizado a veces para describir a las tribus léquitas eslavas occidentales que vivieron desde mediados del siglo VI en los territorios incorporados al Estado polaco por la dinastía Piast. El Estado consolidado por el duque Mieszko I se expandió a finales del siglo X y amplió sus dominios con las conquistas de Boleslao I a comienzos del XI.\n\nHacia el año 850 d. C., el Geógrafo Bávaro escribió una lista de pueblos. En ella no aparecen los polanos, pomeranios y masovios de habla léquita, que se dieron a conocer más tarde y sobre los que escribió Néstor el Cronista en su Crónica de los tiempos pasados (comienzos del siglo XII).\n\nLas tribus más importantes conquistadas por los polanos fueron los masovios, vístulos, silesios y pomeranios. Estas cinco tribus «compartían una cultura y una lengua fundamentalmente comunes, y estaban considerablemente más emparentadas entre sí que las tribus germánicas»."
 LEVANTINE_GLOSS: "En vísperas de la conquista del Levante por el califato de los primeros califas, en el año 634 d. C., la población de Siria hablaba principalmente arameo y albergaba a pueblos arameos como los asirios y sirios, además de comunidades judías, samaritanas y de distintas confesiones cristianas; el griego era el idioma oficial de la administración. La arabización e islamización de Siria comenzaron en el siglo VII y se desarrollaron a lo largo de varios siglos; durante las primeras etapas, los conquistadores constituyeron una élite relativamente diferenciada, sin imponer una conversión general de la población. Los árabes del califato asentaron a muchas de las tribus recién llegadas en zonas aisladas para evitar conflictos con los locales; el califa Uthman ordenó a su gobernador, Muawiya I, asentar a las nuevas tribus lejos de la población original. Algunas comunidades cristianas enfrentadas a la política religiosa imperial recibieron favorablemente el cambio de dominio.\n\nLos abasíes de los siglos VIII y IX buscaron integrar a los pueblos bajo su autoridad, y la arabización de la administración fue una de las herramientas empleadas. La arabización cobró impulso con el creciente número de conversos al islam; el ascenso del árabe como lengua formal del estado impulsó la asimilación cultural y lingüística de los sirios conversos. Numerosas comunidades cristianas también adoptaron el árabe. Durante el período abasí aumentó su uso escrito y se documentan traducciones de los evangelios, aunque la sustitución de las lenguas anteriores fue desigual. Muchos historiadores, como Claude Cahen y Bernard Hamilton, han propuesto que la arabización de los cristianos se completó antes de la Primera Cruzada. Hacia el siglo XIII, el árabe predominaba en gran parte de la región, sin que desaparecieran todas las demás tradiciones lingüísticas."
 LOMBARD_GLOSS: "Los lombardos fueron un pueblo germánico que conquistó amplias zonas de la península itálica desde 568 y mantuvo un reino en el norte hasta 774.\n\nEl historiador medieval lombardo Pablo Diácono escribió en la Historia de los lombardos (redactada entre 787 y 796) que los lombardos descendían de una pequeña tribu llamada winnili, que habitaba el norte de Germania antes de emigrar en busca de nuevas tierras. Historiadores romanos anteriores ya escribieron sobre los lombardos en el siglo I d. C. como uno de los pueblos suevos, también originarios de lo que hoy es el norte de Alemania, cerca del río Elba. Migraron hacia el sur, y a finales del siglo V los lombardos se habían asentado en un área que coincidía aproximadamente con la actual Austria y Eslovaquia, al norte del Danubio. Allí sometieron a los hérulos y, más tarde, libraron guerras frecuentes contra los gépidos. El rey lombardo Audoín derrotó al líder gépido Turisindo en el año 551 o 552, y el sucesor de Audoín, Alboino, terminó por destruir a los gépidos en el año 567. Los lombardos también se asentaron en Panonia (la actual Hungría). Cerca de Szólád, los arqueólogos han desenterrado tumbas de hombres y mujeres lombardos enterrados juntos como familias, algo inusual entre los pueblos germánicos de la época. También se han hallado rastros contemporáneos de griegos mediterráneos y un posible migrante procedente de Francia.\n\nTras la victoria de Alboino sobre los gépidos, este condujo a su pueblo hacia el noreste de Italia, que había quedado gravemente despoblado y devastado tras la larga Guerra Gótica (535-554) entre el Imperio bizantino y el Reino ostrogodo. Numerosos sajones, hérulos, gépidos, búlgaros, turingios y ostrogodos se unieron a los lombardos, y su invasión de Italia apenas encontró resistencia. Para finales del año 569, habían conquistado todo el norte de Italia y las principales ciudades al norte del río Po, salvo Pavía, que cayó en el año 572. Al mismo tiempo, ocuparon zonas del centro y sur de Italia. Establecieron un reino lombardo en el norte y centro de Italia, que alcanzó su apogeo bajo el gobernante del siglo VIII Liutprando. En el año 774, el reino fue conquistado por el rey franco Carlomagno e integrado en el Imperio franco. Sin embargo, la nobleza lombarda continuó gobernando el sur de la península itálica hasta bien entrado el siglo XI, cuando sus principados fueron conquistados por los normandos. En este período, la parte sur de Italia aún bajo dominio lombardo era conocida por los nórdicos como Langbarðaland ('tierra de los lombardos'), según atestiguan inscripciones rúnicas escandinavas. Su legado también es evidente en el nombre de la región de Lombardía, en el norte de Italia."
 MAGHREBI_GLOSS: "Las migraciones árabes al Magreb consistieron en sucesivas oleadas de migración y asentamiento de pueblos árabes en la región magrebí del norte de África (con exclusión de Egipto), que abarca la actual Argelia, Libia, Marruecos y Túnez. El proceso se prolongó a lo largo de varios siglos, desde principios del siglo VII hasta el siglo XVII. Los migrantes árabes procedían de Oriente Medio, en particular de la península arábiga, con grupos posteriores llegados del Levante e Irak.\n\nLa afluencia de árabes al Magreb comenzó en el siglo VII con la conquista árabe del Magreb, cuando los ejércitos árabes conquistaron la región como parte de las primeras conquistas musulmanas. A esta primera oleada de migración árabe le siguieron nuevos períodos de migración y asentamiento, en particular durante los califatos omeya y abasí y bajo dinastías árabes posteriores. Sin embargo, la oleada más significativa de migración árabe se produjo en el siglo XI, con la llegada de más tribus beduinas procedentes de la península arábiga, como los banu hilal, los banu sulaym y los maqil. Otra importante llegada de población procedente de la península ibérica tuvo lugar tras la expulsión de los moriscos entre 1609 y 1614. A lo largo de esos siglos surgieron distintas dinastías en el Magreb, con orígenes y bases sociales diversos, entre ellas los aglabíes, idrisíes, fatimíes, saadíes y alauitas.\n\nLas migraciones árabes al Magreb tuvieron un profundo impacto en la demografía y la cultura de la región. Favorecieron la difusión del árabe y transformaron las relaciones entre comunidades locales y recién llegadas. La arabización fue un proceso desigual, acompañado de integración, desplazamientos y persistencia de lenguas y tradiciones bereberes. Los descendientes de los colonos árabes en el Magreb se conocen como árabes magrebíes."
 MOZARAB_GLOSS: "Los mozárabes (lit. 'arabizados'), o más precisamente los cristianos andalusíes, eran los cristianos de al-Ándalus, es decir, los territorios de Iberia bajo dominio musulmán entre los años 711 y 1492. Tras la conquista omeya del reino visigodo de Hispania, la población cristiana de gran parte de Iberia quedó bajo control musulmán.\n\nInicialmente, la gran mayoría de los mozárabes conservó el cristianismo y sus dialectos derivados del latín. Con el tiempo, una parte de la población cristiana se convirtió al islam, mientras otras comunidades conservaron su fe y adoptaron en distintos grados la lengua y las costumbres árabes. Las variedades romances locales, con una importante aportación del árabe y habladas tanto por cristianos como por musulmanes, se conocen como romance andalusí o lengua mozárabe. Los mozárabes eran en su mayoría católicos del rito visigodo o mozárabe. Como comunidades protegidas bajo dominio islámico, los cristianos estaban sujetos a la yizia y a otras condiciones jurídicas. Conservaron cierta autonomía religiosa y normas internas de raíz romana y visigoda, sin quedar al margen de la autoridad islámica.\n\nLa mayoría de los mozárabes eran descendientes de cristianos locales y hablaban principalmente variedades romances bajo dominio islámico. También incluían a aquellos miembros de la antigua élite gobernante visigoda que no se convirtieron al islam ni emigraron hacia el norte tras la conquista musulmana. Las relaciones con la sociedad islámica incluyeron conflictos, intercambios y distintos grados de integración. Las autoridades religiosas cristianas procuraban conservar la fe de sus comunidades, aunque el uso del árabe y la vida cotidiana compartida reforzaban sus vínculos con al-Ándalus.\n\nUnos pocos eran cristianos árabes y bereberes, junto con conversos musulmanes al cristianismo que, como hablantes de árabe, podían integrarse lingüísticamente en estas comunidades. Un ejemplo destacado de un musulmán que se convirtió en mozárabe al abrazar el cristianismo es el rebelde andalusí y líder militar antiomeya Umar ibn Hafsún. La denominación mozárabe no debe confundirse con mudéjar ni con morisco. Los mudéjares eran musulmanes que vivían bajo dominio cristiano y conservaban su religión; los moriscos eran musulmanes convertidos al cristianismo y sus descendientes, especialmente tras las conversiones impuestas a comienzos del siglo XVI. Las comunidades mozárabes, en cambio, estaban vinculadas a la continuidad del cristianismo bajo dominio islámico.\n\nHabía comunidades mozárabes en las grandes ciudades musulmanas, especialmente Toledo, Córdoba, Zaragoza y Sevilla."
 NURAGIC_GLOSS: "La civilización nurágica, también conocida como cultura nurágica, se desarrolló en la isla mediterránea de Cerdeña, durante la Edad del Bronce. Se remonta a la Edad del Bronce y tuvo continuidad durante la Edad del Hierro. La cronología de sus etapas y de la pervivencia de sus tradiciones después de la conquista romana de 238 a. C. es discutida; en las regiones interiores, como Barbagia, algunos elementos culturales persistieron durante mucho más tiempo. Cabe señalar, sin embargo, que la construcción de nuevos nuraghi ya se había detenido hacia los siglos XII-XI a. C., durante el Bronce Final."
 RUSNORSE_GLOSS: "La formación de la Rus' comenzó con la llegada de pueblos nórdicos, originarios en su mayoría de la actual Suecia, que se asentaron y gobernaron a lo largo de las rutas fluviales entre el mar Báltico y el mar Negro desde aproximadamente el siglo VIII hasta el XI d. C. Formaron un estado conocido en la historiografía moderna como la Rus de Kiev, que fue inicialmente una sociedad multiétnica en la que los gobernantes nórdicos se integraron gradualmente con poblaciones eslavas orientales, bálticas y fínicas, mientras el eslavo oriental antiguo adquiría una posición predominante."
 SICILIAN_GLOSS: "El término cultura normandoárabe-bizantina, cultura normandosiciliana o, de forma menos inclusiva, cultura normandoárabe (a veces denominada «civilización árabe-normanda»), hace referencia a la interacción de las culturas normanda, bizantina griega, latina y árabe en la Sicilia normanda y sus territorios mediterráneos, entre los siglos XI y XIII. La civilización resultó de numerosos intercambios en los ámbitos cultural y científico, favorecidos por la convivencia de poblaciones cristianas de habla latina y griega y comunidades musulmanas de habla árabe, aunque esa convivencia también conoció tensiones y persecuciones. Como resultado, Sicilia bajo los normandos se convirtió en un cruce de caminos para la interacción entre las culturas normanda y latina católica, bizantina-ortodoxa y árabe-islámica."
 SILESIAN_GLOSS: "El Ostsiedlung, o colonización hacia el este, fue un conjunto de migraciones y fundaciones de asentamientos medievales que llevaron a poblaciones germanófonas hacia regiones de Europa central y oriental habitadas por eslavos, bálticos y otros pueblos. Su mayor desarrollo tuvo lugar entre los siglos XII y XIV. Transformó territorios al este del Elba y el Saale, así como regiones de las actuales Austria, Polonia y Chequia, con ritmos y efectos diferentes según la zona.\n\nLos colonos llegaron por distintas rutas y en sucesivas etapas. Príncipes, señores y monasterios, incluidos gobernantes eslavos, promovieron muchos de estos asentamientos para ampliar las tierras cultivadas y los ingresos. La llegada de campesinos, artesanos y comerciantes favoreció nuevas formas de organización rural y urbana. En algunos lugares hubo desplazamientos de población y conflictos; en otros predominó la convivencia y la integración gradual.\n\nLa colonización debe distinguirse de las campañas militares que no produjeron asentamientos duraderos. Sus consecuencias jurídicas, económicas, lingüísticas y culturales fueron profundas, aunque no supusieron una germanización completa o uniforme. En Silesia, la convivencia entre poblaciones eslavas locales y colonos de distintos orígenes contribuyó a nuevas identidades regionales."
 SYROMESOP_GLOSS: "Antes de las conquistas islámicas, Mesopotamia estaba habitada predominantemente por pueblos de habla aramea, como los asirios y los mandeos, y por administradores persas bajo dominio sasánida. La región había sido el centro de numerosos imperios, incluidos los babilonios, asirios y persas, y el arameo había servido como lengua franca desde el primer milenio a. C. La conquista árabe a mediados del siglo VII d. C. trajo consigo oleadas de colonos árabes procedentes de la península, en particular durante el período omeya. La población nativa, que incluía importantes comunidades cristianas y zoroástricas, fue adoptando gradualmente la lengua y las costumbres árabes en los siglos siguientes. La fundación de Bagdad en 762 creó una nueva capital imperial en el centro de Mesopotamia que se convertiría en el corazón de la Edad de Oro islámica hasta su caída ante los mongoles."
 TURCOPERSIAN_GLOSS: "La tradición turco-persa surgió de la fusión de las tradiciones militares y políticas túrquicas con las costumbres administrativas y culturales persas, a partir del siglo X. A medida que dinastías túrquicas como los gaznávidas y los selyúcidas establecían su dominio sobre Irán, adoptaron las costumbres, la lengua y las prácticas burocráticas persas, al tiempo que mantenían sus tradiciones militares túrquicas y sus organizaciones tribales. Esta síntesis distintiva se convirtió en el modelo cultural dominante en gran parte de Asia Central y del Sur, caracterizado por el persa como lengua de la administración y la literatura, las instituciones religiosas islámicas y las organizaciones militares túrquicas. La tradición turco-persa influyó profundamente en la formación de estados y el desarrollo cultural desde Anatolia hasta la India."
 VISIGOTHIC_GLOSS: "Los visigodos fueron un pueblo germánico unido bajo el mando de un rey y que vivió dentro del Imperio romano durante la Antigüedad tardía. Los visigodos aparecieron por primera vez en los Balcanes, como un grupo militar bárbaro aliado de Roma unido bajo el mando de Alarico I. Se cree que sus orígenes exactos fueron diversos, pero probablemente incluyeron a muchos descendientes de los tervingios que se habían adentrado en el Imperio romano a partir del año 376 y habían desempeñado un papel importante en la derrota de los romanos en la batalla de Adrianópolis en el año 378. Las relaciones entre los romanos y los visigodos de Alarico variaron, con ambos grupos firmando tratados cuando les convenía y guerreando entre sí cuando no. Bajo Alarico, los visigodos invadieron Italia y saquearon Roma en agosto del año 410.\n\nLos visigodos fueron posteriormente asentados en el sur de la Galia como foederati de los romanos, una relación que se estableció en el año 418. De ese asentamiento surgió un reino con capital en Tolosa, que extendió su autoridad a Hispania a expensas de los suevos y vándalos, que habían tomado el control de amplias extensiones de territorio romano. En el año 507, los visigodos perdieron la mayor parte de sus dominios galos frente a los francos de Clodoveo I, quien los derrotó en la batalla de Vouillé.\n\nEs dentro de lo que hoy son España y Portugal donde los visigodos crearon el estado por el cual mejor se les recuerda. Durante su gobierno de Hispania, los visigodos construyeron varias iglesias que perduraron y fundaron varias ciudades. Hacia el año 589, los visigodos bajo Recaredo I se convirtieron del cristianismo arriano al cristianismo niceno, adoptando gradualmente la cultura de sus súbditos hispanorromanos. Su código legal, el Código Visigodo (completado en el año 654), unificó la legislación aplicada a la población hispanorromana y a los visigodos. La unificación jurídica favoreció la integración de las poblaciones, aunque no eliminó de inmediato todas las diferencias sociales e identitarias. En el siglo que siguió, la región estuvo dominada por los concilios de Toledo y el episcopado. En el año 711, una fuerza invasora de árabes y bereberes derrotó a los visigodos en la batalla de Guadalete. El rey visigodo Rodrigo y muchos miembros de la élite gobernante visigoda murieron, y su reino se derrumbó rápidamente. En las décadas siguientes surgió el reino de Asturias, cuya tradición vinculó sus orígenes a la resistencia encabezada por Pelayo."
 YEMEN_GLOSS: "Las tierras altas y las regiones costeras de Yemen albergaron a numerosas civilizaciones desde la antigüedad, dominadas por los reinos sabeo, minaico, catabánico e himyarita. Estos pueblos surárabes desarrollaron complejos sistemas de irrigación, arquitectura monumental y sus propias lenguas surarábigas antiguas, distintas del árabe clásico. El reino himyarita, que unificó la región hacia el siglo IV d. C., decayó gradualmente debido a las invasiones etíopes, la influencia persa y los conflictos internos. La llegada del islam en el siglo VII d. C. aceleró la adopción de la lengua y las costumbres árabes entre la población local, dentro de un proceso de arabización que acompañó la desaparición de las antiguas lenguas escritas surarábigas."

