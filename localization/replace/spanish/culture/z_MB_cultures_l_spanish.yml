 yamato_history_loc: "Formado a partir de [CULTURE.GetName] y [Glossary('migrantes y los pueblos jomon indígenas', 'YAMATO_GLOSS')] alrededor del año [DATE.GetYear]"
 YAMATO_GLOSS: "La cultura Yamato se cristalizó a partir de siglos de mestizaje entre los migrantes yayoi, que habían llegado desde la península coreana trayendo la agricultura del arroz de regadío y la metalurgia, y el pueblo jomon indígena, que había habitado el archipiélago durante milenios. Centrada en la fértil llanura de Kinai, cerca de la actual Nara, la corte Yamato unificó gradualmente los clanes de Honshu, Shikoku y el norte de Kyushu mediante una combinación de conquista militar, alianzas matrimoniales y el prestigio de su realeza ritual. Las influencias continentales siguieron remodelando la cultura en oleadas sucesivas, a medida que artesanos, eruditos y monjes budistas coreanos y chinos llegaban a la corte, mezclándose con las tradiciones aristocráticas y religiosas emergentes de las islas para crear una identidad japonesa diferenciada."

 kyushu_history_loc: "Formado a partir de [CULTURE.GetName] y [Glossary('colonos que absorbieron a los', 'KYUSHU_GLOSS')] [TARGET_CULTURE.GetName] alrededor del año [DATE.GetYear]"
 KYUSHU_GLOSS: "La cultura de Kyushu divergió del núcleo Yamato gracias a su posición singular como puerta de entrada de la influencia continental y a la vez como región de persistente resistencia indígena. El norte de Kyushu, sede de los antiguos puertos de Hakata y del centro administrativo de Dazaifu, absorbió ola tras ola de influencia coreana y china que llegaba antes de alcanzar la corte de Kinai, lo que le confirió un carácter más abierto al exterior. En el sur, los hayato —un pueblo de herencia jomon diferenciada que resistió la autoridad Yamato durante los siglos VII y VIII— fueron absorbidos gradualmente por la población provincial tras su sometimiento bajo la corte de Nara. Esta mezcla de cultura administrativa Yamato, cosmopolitismo continental y tradición indígena hayato dio a Kyushu un carácter distinto del de la cultura metropolitana de la capital."

 oshu_history_loc: "Formado a partir de [CULTURE.GetName] y [Glossary('colonos que se mezclaron con', 'OSHU_GLOSS')] [TARGET_CULTURE.GetName] alrededor del año [DATE.GetYear]"
 OSHU_GLOSS: "La cultura de Ōshū surgió de la violenta y prolongada frontera entre el estado Yamato y los emishi, los pueblos indígenas del norte de Honshu que resistieron la expansión imperial durante más de dos siglos. A medida que los colonos, soldados y administradores Yamato avanzaban hacia las provincias de Mutsu y Dewa, se mezclaron con comunidades emishi que fueron cayendo gradualmente bajo la autoridad imperial como fushu —pueblos fronterizos sometidos que conservaban sus propias costumbres mientras eran absorbidos en la estructura provincial—. Las campañas de Sakanoue no Tamuramaro a finales del siglo VIII y principios del IX completaron la conquista militar del norte, pero la cultura que arraigó en Ōshū no fue simplemente un trasplante Yamato: fue una identidad fronteriza, forjada por generaciones de contacto, conflicto y matrimonios mixtos con los emishi, y a la que más tarde se le dio su propio sentido de autonomía bajo poderosos clanes regionales como los Abe, los Kiyohara y los Ōshū Fujiwara."

 ryukyu_history_loc: "Formado a partir de [CULTURE.GetName] y [Glossary('colonos a lo largo de la cadena de islas Ryukyu', 'RYUKYU_GLOSS')] alrededor del año [DATE.GetYear]"
 RYUKYU_GLOSS: "La cultura ryukyuense tiene sus orígenes en migrantes de lengua japónica que se asentaron en la cadena de islas durante el período Kofun, separándose de la población continental en un momento tan temprano que su lengua divergió hasta formar una familia distinta, ininteligible para los japoneses de siglos posteriores. Protegidas por las rutas marítimas del mar de China Oriental, las islas Ryukyu se desarrollaron en relativo aislamiento de las convulsiones políticas y culturales que remodelaban la corte Yamato en Honshu. Las comunidades insulares mantuvieron sus propias estructuras de caudillaje, conocidas como aji, y cultivaron redes comerciales tanto con el Japón continental como con el Asia continental, lo que dio a su cultura un carácter marcadamente marítimo e independiente, muy alejado de las tradiciones cortesanas de Kinai o de los conflictos fronterizos del norte."

 goryeo_history_loc: "Formado a partir de [CULTURE.GetName] y [Glossary('reinos unificados bajo Wang Geon', 'GORYEO_GLOSS')] en el año [DATE.GetYear]"
 GORYEO_GLOSS: "La península de Corea había estado durante mucho tiempo dividida entre reinos rivales enraizados en las antiguas confederaciones tribales de Fuyo y Han, del norte y del sur respectivamente. El período de los Tres Reinos vio a Goguryeo, Baekje y Silla dominar la península durante siglos, hasta que Silla unificó gran parte de Corea en el año 668 con apoyo de la dinastía Tang china, empujando a los remanentes de Goguryeo hacia el norte, donde con el tiempo formaron Balhae. El dominio de Silla se debilitó a lo largo del siglo IX, a medida que la aristocracia fragmentaba el poder y los caudillos regionales se repartían los Posteriores Tres Reinos de Posterior Goguryeo, Posterior Baekje y un Silla en declive. De este caos surgió Wang Geon, un general de Posterior Goguryeo, quien fundó Goryeo en el año 918 y completó la unificación de la península en el año 936, absorbiendo los restos de Silla y Posterior Baekje. El nuevo estado de Goryeo se posicionó deliberadamente como heredero de todas las tradiciones coreanas anteriores, y su propio nombre evocaba a Goguryeo, mientras que sus instituciones sintetizaban la cultura aristocrática de Silla, la herencia marcial norteña de los pueblos descendientes de Fuyo y las tradiciones comerciales y marítimas de las antiguas costas de Baekje."

 balhae_history_loc: "Formado a partir de [CULTURE.GetName] y [TARGET_CULTURE.GetName] y [Glossary('refugiados que fundaron un estado sucesor de Goguryeo', 'BALHAE_GLOSS')] en el año [DATE.GetYear]"
 BALHAE_GLOSS: "Tras la destrucción de Goguryeo por la alianza Silla-Tang en el año 668, los refugiados de Goguryeo huyeron hacia el norte, a Manchuria, donde se aliaron con las tribus tungúsicas mohe que habitaban la región desde hacía tiempo. Bajo el liderazgo de Dae Joyeong, un general de ascendencia mixta goguryeo y mohe, esta coalición derrotó a un ejército Tang que los perseguía en Tianmenling en el año 698 y estableció el reino de Balhae como sucesor de Goguryeo. El nuevo estado combinó las tradiciones administrativas aristocráticas coreanas de Goguryeo con la estructura tribal mohe, modelando su gobierno según el de la China Tang y manteniendo al mismo tiempo una identidad manchuriana distintiva. En su apogeo, Balhae controló un vasto territorio que se extendía desde el río Amur hasta el norte de la península coreana, comerciando con los Tang, Japón y las potencias esteparias, hasta su repentina destrucción a manos de la dinastía Liao kitana en el año 926, que dispersó a su población entre Liao y Goryeo."

 jurchen_history_loc: "Divergió de [CULTURE.GetName] y [Glossary('tribus surgidas tras la caída de Balhae', 'JURCHEN_GLOSS')] en el año [DATE.GetYear]"
 JURCHEN_GLOSS: "Los yurchen surgieron de los heishui mohe, el más septentrional y menos sinizado de los grupos tribales mohe, que habían permanecido fuera de la órbita de Balhae y se sometieron a la dinastía kitana Liao tras la caída de Balhae en el año 926. Mientras que sus parientes mohe dentro de Balhae habían sido en gran medida absorbidos por la estructura administrativa Liao, los heishui mohe conservaron su identidad tribal en los bosques del norte de Manchuria. El nombre «yurchen» apareció por primera vez en los registros chinos de esta época. Aunque fueron vasallos de Liao durante casi dos siglos, el clan Wanyan unificó gradualmente a las dispersas tribus yurchen, y bajo Wanyan Aguda derrocaron a Liao en el año 1125, proclamando la dinastía Jin y avanzando hacia el sur para conquistar el norte de China a los Song."

 udege_history_loc: "Divergió de [CULTURE.GetName] y [Glossary('pueblos asentados en los bosques del Ussuri y el Amur', 'UDEGE_GLOSS')] en el año [DATE.GetYear]"
 UDEGE_GLOSS: "Los udege surgieron como un pueblo distinto entre las poblaciones tungúsicas meridionales de la cuenca del Amur-Ussuri, divergiendo del mundo tribal mohe más amplio mediante su profunda adaptación a los densos bosques de taiga de la cordillera de Sijoté-Alín y los afluentes del río Ussuri. Mientras que sus parientes mohe a lo largo de los grandes ríos se convirtieron en los antepasados de los yurchen y los nanai, los udege se retiraron hacia el interior boscoso, desarrollando una cultura centrada en la caza, la trampería y la recolección de ginseng en lugar de la pesca fluvial o el pastoreo. Sus creencias animistas, la veneración del tigre y el oso como animales sagrados, y sus tradiciones chamánicas reflejan esta relación íntima con el bosque templado, distinguiéndolos de los demás pueblos tungúsicos de la región a pesar de su ascendencia compartida."

 nanai_history_loc: "Divergió de [CULTURE.GetName] y [Glossary('pueblos de la cuenca del río Amur', 'NANAI_GLOSS')] en el año [DATE.GetYear]"
 NANAI_GLOSS: "Los nanai, conocidos por los rusos posteriores como goldi, representan una de las culturas más antiguas y continuas de la cuenca del río Amur, con raíces que se remontan a comunidades pesqueras neolíticas cuya huella genética se ha rastreado en yacimientos de más de siete mil años de antigüedad a lo largo del bajo Amur. Divergiendo del mundo tungúsico mohe más amplio, los nanai desarrollaron una cultura orientada casi por completo en torno al gran río y sus corridas estacionales de salmón, con su cultura material, sus prácticas espirituales y su organización social moldeadas por los ritmos del Amur. Sus tradiciones chamánicas, su distintiva vestimenta de piel de pescado y sus elaboradas creencias cosmológicas en torno al río los distinguen de las ramas más pastoriles o forestales de sus parientes tungúsicos, y sus comunidades clánicas autónomas nunca llegaron a consolidarse en formaciones políticas mayores, dejándolos como uno de los pueblos más marcadamente ribereños del Lejano Oriente."

 satsumon_history_loc: "Formado a partir de [CULTURE.GetName] y [Glossary('pueblos de Hokkaidō y el norte de Honshū', 'SATSUMON_GLOSS')] en el año [DATE.GetYear]"
 SATSUMON_GLOSS: "La cultura satsumon surgió hacia el siglo VII en el norte de Honshu y el sur de Hokkaido, desarrollándose a partir de las tradiciones epijomon de los emishi y sus antepasados, que habían habitado las islas del norte desde la retirada del mundo jomon. A medida que la presión Yamato empujaba a las poblaciones emishi hacia el norte, su cultura se mezcló con la tradición marítima de Okhotsk —un pueblo navegante emparentado con los nivjos, de las costas del mar de Ojotsk y Sajalín— cuando ambas culturas se encontraron en el norte de Hokkaido. Esta síntesis, caracterizada por aldeas pesqueras de salmón en los estuarios de los ríos, ceremonias del oso heredadas del mundo de Okhotsk y las herramientas de hierro y la agricultura limitada traídas desde Honshu, formó la cultura transicional que con el tiempo se cristalizaría en los ainu hacia el siglo XIII."

 emishi_history_loc: "Se separó de [Glossary('pueblos jōmon del norte de Honshū', 'EMISHI_GLOSS')] en la antigüedad"
 EMISHI_GLOSS: "Los emishi descendían de las poblaciones indígenas jōmon y epijōmon del norte de Honshū, asentadas en el archipiélago japonés desde mucho antes de la llegada de los agricultores yayoi procedentes de la península coreana. La expansión de la cultura yayoi desplazó o asimiló a muchas comunidades jōmon, pero en la región de Tōhoku persistieron poblaciones con tradiciones propias. La corte de Yamato las denominó «emishi», un término político y cultural aplicado a quienes quedaban fuera de la autoridad imperial. Su lengua no dejó testimonios escritos, aunque algunos topónimos de Tōhoku sugieren vínculos con el protoainu. Los emishi destacaban por su equitación y sus arqueros, y resistieron durante siglos la expansión de Yamato. Con el tiempo, muchos fueron incorporados a la sociedad fronteriza de la que surgió la cultura de Ōshū."

 khitan_history_loc: "Se separó de [CULTURE.GetName] [Glossary('tribus de la estepa de Mongolia oriental', 'KHITAN_GLOSS')] en el año [DATE.GetYear]"
 KHITAN_GLOSS: "Los kitán surgieron como un pueblo diferenciado de las ramas orientales de la confederación xianbei tras su fragmentación en el siglo III, y se asentaron en la cuenca del río Liao, en la actual Mongolia Interior. Durante siglos fueron una potencia secundaria de la estepa: realizaron incursiones en las fronteras chinas y rindieron tributo a sucesivos kanatos túrquicos, mientras desarrollaban una vestimenta, una escritura y una organización clánica propias. A comienzos del siglo X, Yelü Abaoji unificó las tribus kitán y extendió su dominio sobre pastores shiwei, agricultores de Balhae y poblaciones chinas han. La dinastía Liao administró estos pueblos conforme a sus distintas costumbres, hasta que los yurchen de la dinastía Jin destruyeron su poder en 1125."

 shiwei_history_loc: "Se formó a partir de [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('tribus de la frontera entre la taiga y la estepa del Amur', 'SHIWEI_GLOSS')] en el año [DATE.GetYear]"
 SHIWEI_GLOSS: "Los shiwei surgieron de las ramas nororientales de la confederación xianbei tras su fragmentación en el siglo III, cerca de los territorios ocupados por los kitán. Las fuentes dinásticas chinas describen una lengua estrechamente emparentada con la de estos últimos, lo que los sitúa dentro del ámbito protomongólico. Su contacto prolongado con los pueblos tungúsicos mohe dio a algunas de sus tribus un carácter más forestal. Entre los grupos shiwei destacó el de los mengwu shiwei de la cuenca del río Ergune, vinculado por las tradiciones genealógicas mongolas a los antepasados del linaje borjigin, del que surgiría Gengis Kan."

 shatuo_history_loc: "Se formó a partir de [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('colonos túrquicos de la frontera Tang', 'SHATUO_GLOSS')] en el año [DATE.GetYear]"
 SHATUO_GLOSS: "Los shatuo eran un pueblo túrquico procedente de la tribu chuyue del Kanato Túrquico Occidental. Tomaron su nombre del desierto de Shatuo, en la cuenca de Zungaria, al norte de la actual Sinkiang. La expansión tibetana los empujó hacia el este a comienzos del siglo IX, cuando buscaron la protección de la dinastía Tang y fueron reasentados en Daibei, al norte de Shanxi. El servicio militar fronterizo y los matrimonios con la población china han dieron lugar a una cultura túrquica progresivamente sinizada, aunque conservó sus tradiciones ecuestres. Tras la caída de los Tang, los jefes shatuo fundaron varias dinastías en el norte de China. Otros grupos permanecieron en la estepa de Mongolia Interior y contribuyeron a la formación de los öngüt."

 onggud_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos de la estepa junto a los montes Yin', 'ONGGUD_GLOSS')] en el año [DATE.GetYear]"
 ONGGUD_GLOSS: "Los öngüt surgieron de grupos túrquicos shatuo que permanecieron en la estepa de Mongolia Interior después de que la dinastía Song pusiera fin al dominio shatuo en el norte de China en 979. Se establecieron junto a las montañas Yin y desempeñaron funciones de vigilancia fronteriza frente a las incursiones de la estepa. Adoptaron el cristianismo nestoriano, como atestiguan las cruces halladas en su antiguo territorio, y desarrollaron una identidad distinta tanto de sus antepasados shatuo como de sus vecinos mongoles. Los matrimonios entre la casa gobernante öngüt y la familia de Gengis Kan estrecharon sus vínculos con el Imperio mongol, en cuya sociedad terminaron integrándose."

 kerait_history_loc: "Se formó a partir de [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('tribus de la meseta mongola central', 'KERAIT_GLOSS')] en el año [DATE.GetYear]"
 KERAIT_GLOSS: "Los kerait fueron una de las principales confederaciones de la meseta mongola durante los siglos XI y XII. Su origen, túrquico, mongólico o mixto, sigue siendo debatido: sus gobernantes empleaban títulos túrquicos, pero las fuentes de la dinastía Yuan los incluían entre los mongoles. Tras la caída del Kanato Uigur, absorbieron a distintos grupos tribales y adquirieron gran influencia en la estepa central. En 1009, una parte importante de su población recibió el bautismo en el cristianismo nestoriano, que se arraigó entre sus comunidades. El poder kerait fue quebrado en 1203 por Temuyín, y sus supervivientes quedaron incorporados gradualmente a la confederación mongola."

 naiman_history_loc: "Se formó a partir de [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('tribus del Altai de Mongolia occidental', 'NAIMAN_GLOSS')] en el año [DATE.GetYear]"
 NAIMAN_GLOSS: "Los naimanos, cuyo nombre significa «ocho» en mongol y alude a una confederación de ocho tribus, ocuparon el oeste de la meseta mongola y la región del Altái. Sus orígenes se relacionan con los basmilos y otros pueblos túrquicos que adquirieron protagonismo tras la caída del Kanato Uigur en 840, aunque su filiación túrquica o turcomongola es objeto de debate. Adoptaron el cristianismo nestoriano y emplearon la escritura uigur en la administración, lo que les dio prestigio cultural entre los pueblos de la estepa. Tras su derrota en 1204, numerosos nobles y familias naimanas se dispersaron por Asia Central y entraron al servicio de los kara-kitán."

 uyghur_history_loc: "Se formó a partir de [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('de los pueblos del Tarim y la estepa de Mongolia', 'UYGHUR_GLOSS')] en el año [DATE.GetYear]"
 UYGHUR_GLOSS: "Los uigures surgieron de una confederación de tribus túrquicas tiele que contribuyó al derrocamiento del Segundo Kanato Túrquico en 742. Fundaron un kanato que dominó la estepa mongola hasta su destrucción por los kirguises del Yeniséi en 840. La difusión del maniqueísmo y la adopción de una escritura derivada del sogdiano favorecieron una cultura urbana y letrada poco habitual entre los pueblos esteparios; esa escritura serviría después de base para la administración del Imperio mongol. Tras 840, grupos uigures emigraron hacia los oasis de Turfán y Ganzhou, donde se mezclaron con las poblaciones locales de la cuenca del Tarim y desarrollaron una cultura comercial y literaria que conservó su identidad mucho después de la caída del kanato."

 mongol_history_loc: "Se separó de [CULTURE.GetName] [Glossary('tribus de la estepa de Mongolia oriental', 'MONGOL_GLOSS')] en el año [DATE.GetYear]"
 MONGOL_GLOSS: "Las tradiciones mongolas sitúan sus orígenes en el legendario valle de Ergüne-kün, donde un pequeño grupo de supervivientes se habría refugiado tras una gran derrota antes de multiplicarse y regresar a la estepa. Las fuentes chinas de época Tang mencionan a los mengwu shiwei, un pueblo forestal cuyo nombre se asemeja fonéticamente al de los mongoles. Las genealogías tradicionales vinculan a Bodonchar Munkhag con el origen del linaje borjigin, del que descendería Gengis Kan. Durante siglos, las tribus protomongolas fueron una fuerza menor entre los kitán, uigures y tártaros, hasta que su progresiva unificación les permitió imponerse a sus rivales."

 oirat_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos forestales de la estepa occidental', 'OIRAT_GLOSS')] en el año [DATE.GetYear]"
 OIRAT_GLOSS: "Los oirates surgieron entre los pueblos forestales del oeste de Mongolia. Según la interpretación, su nombre podría relacionarse con «los del bosque» o con la idea de parentesco cercano. Se diferenciaban de los mongoles de Khamag por sus dialectos y formas de vida, y aparecen en las fuentes como vecinos y rivales ocasionales de la creciente confederación mongola. Su jefe Quduqa Beki se alió inicialmente contra Temuyín, antes de la sumisión e incorporación de los oirates al Imperio mongol."

 tataric_history_loc: "Se separó de [CULTURE.GetName] [Glossary('tribus de la región del Lago Buir', 'TATARIC_GLOSS')] en el año [DATE.GetYear]"
 TATARIC_GLOSS: "Los tártaros formaron una de las grandes confederaciones de la estepa oriental de Mongolia, asentada en torno al lago Buir. Durante mucho tiempo fueron una de las principales potencias de la meseta, junto con los kerait, naimanos, merkitas y mongoles de Khamag. Por una extensión posterior del nombre en las crónicas persas y europeas, «tártaro» llegó a aplicarse a los conquistadores mongoles y, más tarde, a diversos pueblos túrquicos de la Horda de Oro. Sin embargo, los tártaros originales constituían un pueblo diferenciado y fueron enemigos encarnizados de Temuyín, quien los derrotó y sometió en 1202."

 onggirad_history_loc: "Se separó de [CULTURE.GetName] [Glossary('tribus de la cuenca del lago Hulun', 'ONGGIRAD_GLOSS')] en el año [DATE.GetYear]"
 ONGGIRAD_GLOSS: "Los ongiratos se asentaron en las praderas que rodean el lago Hulun, en el este de Mongolia. Eran una tribu darligin incluida entre los pueblos mongoles, aunque sus tradiciones genealógicas no los hacían descender de Bodonchar. Nunca constituyeron una gran potencia militar unificada, pero adquirieron enorme influencia mediante alianzas matrimoniales. La madre de Gengis Kan, su esposa principal Börte y numerosas emperatrices y princesas mongolas procedían de sus linajes, lo que convirtió a los ongiratos en uno de los principales grupos emparentados con la dinastía gobernante."

 tajiuud_history_loc: "Se separó de [CULTURE.GetName] [Glossary('descendientes de Bodonchar', 'TAJIUUD_GLOSS')] en el año [DATE.GetYear]"
 TAJIUUD_GLOSS: "Los taichiutos hacían remontar su linaje a Bodonchar Munkhag, antepasado legendario de varias tribus mongolas, por lo que estaban estrechamente emparentados con los borjigin de Temuyín. Este parentesco alimentó una intensa rivalidad: sus jefes figuraron entre los adversarios más antiguos del futuro Gengis Kan, a quien mantuvieron cautivo durante su juventud y disputaron el liderazgo de la confederación mongola. Finalmente fueron derrotados e incorporados a la nueva unidad política de la estepa."

 jadran_history_loc: "Se separó de [CULTURE.GetName] [Glossary('descendientes de Bodonchar', 'JADRAN_GLOSS')] en el año [DATE.GetYear]"
 JADRAN_GLOSS: "Los Jadaran rastrean su descendencia a Bodonchar Munkhag junto a las otras tribus Nirun, un clan pastoral de la estepa oriental que comparte amistad lejana con la línea Borjigin de Genghis Khan y siguiendo las mismas rondas de pastoreo de temporada que sus vecinos y rivales mongol. Como muchos clanes de Nirun, las fortunas de Jadaran estaban atadas menos a cualquier liderazgo centralizado por su cuenta que a la red de cambio de alianza y rivalidad entre los jefes de estepa, un patrón encarnado por su hijo más famoso, Jamukha, cuya hermandad sangrienta con el joven Temüjin y su rivalidad amarga más tarde con él se recuerda como uno de los dramas definitorios de la unificación de Mongolia. La fortuna del clan se levantó y cayó con la propia Jamukha, y la identidad de Jadaran fue absorbida en gran medida en la confederación de mongol más amplia una vez que su causa fue finalmente derrotada."

 qay_history_loc: "Se separó de [CULTURE.GetName] [Glossary('Kumo Xi pueblos de la estepa oriental', 'QAY_GLOSS')] en el año [DATE.GetYear]"
 QAY_GLOSS: "El Qay, conocido por los cronistas chinos como el Kumo Xi, se dividió de la misma acción xianbei que produjo el kitán, asentando como vecinos cercanos y rivales frecuentes de esa gente a lo largo de la frontera del río Liao. Aunque nunca alcanzaron las alturas imperiales de sus primos jeitan, el Qay mantuvo una identidad tribal distinta durante siglos, alternando entre sumisión a dinastías chinas, alianza con el kitán, y rebelión abierta, antes de ser absorbido en la estructura administrativa de la dinastía Liao."

 merkit_history_loc: "Se separó de [CULTURE.GetName] [Glossary('tribus de la cuenca del río Selenga', 'MERKIT_GLOSS')] en el año [DATE.GetYear]"
 MERKIT_GLOSS: "El Merkit estableció la cuenca del Selenga y los ríos inferiores de Orkhon, sus orígenes étnicos exactos debatidos por los cronistas incluso en su propio tiempo, algunas fuentes los llaman mongol, otros turcos, sus títulos y nombres tribales que llevan trazas de ambas tradiciones. Sea cual sea su raíz más profunda, el Merkit surgió como una de las cinco confederaciones dominantes de la meseta mongol, enemigos amargos del estado creciente de mongol después de que un partido de asalto Merkit secuestró a la esposa de Temüjin Börte, un acto de venganza y humillación que alimentaba décadas de guerra antes de su derrota final y dispersión alrededor de 1200."

 ekhirit_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos antiguos de los bosques de Baikal', 'EKHIRIT_GLOSS')] en el año [DATE.GetYear]"
 EKHIRIT_GLOSS: "El número Ekhirit entre las poblaciones más antiguas de habla mongolica de la región del lago Baikal, su tierra boscosa protegiéndolos de las grandes confederaciones e imperios que se levantaron y cayeron en la estepa abierta al sur. Organizado alrededor de clanes y parentescos en lugar de khanship centralizada, el Ekhirit mantuvo un camino de caza y pastoreo distinto en la franja de taiga, formando posteriormente uno de los grupos tribales fundamentales de los que emergería el pueblo buryat."

 tula_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos antiguos de los bosques de Baikal', 'TULA_GLOSS')] en el año [DATE.GetYear]"
 TULA_GLOSS: "La tribu Tula habitaba la franja de bosque de la región del Lago Baikal junto con los pueblos de habla mongolica y Ekhirit, su alejamiento de los grandes imperios de estepa que les permitían preservar una identidad distinta basada en el clan durante siglos. Poco grabado por los cronistas externos, la Tula persistió a través de la caza, el pastoreo y los ritmos estacionales de la taiga, parte del pozo profundo de los pueblos de Baikal-region de los cuales más tarde se dibujaría la identidad Buryat."

 basmyl_history_loc: "Se separó de [CULTURE.GetName] [Glossary('tribus de la confederación Toquz Oghuz', 'BASMYL_GLOSS')] en el año [DATE.GetYear]"
 BASMYL_GLOSS: "El Basmyl fue contado entre el Toquz Oghuz, los Nueve Clanes de la confederación de tiele que dominaron la estepa mongol bajo sucesivos caganados turcos. Junto a los Uyghurs y Karluks, el Basmyl jugó un papel central en el derrocamiento del último Göktürk khagan en 744, sosteniendo brevemente autoridad suprema en la estepa antes de que los Uyghurs los desmanecieron para el propio kanato, después de lo cual el Basmyl continuó como un poder tribal significativo pero subordinado."

 ograk_history_loc: "Se separó de [CULTURE.GetName] [Glossary('una rama de los basmilos', 'OGRAK_GLOSS')] en el año [DATE.GetYear]"
 OGRAK_GLOSS: "El Ograk se formó como una rama estrechamente relacionada del Basmyl, compartiendo su idioma y gran parte de su estructura tribal dentro del mundo Toquz Oghuz más amplio. Al igual que su tribu matriz, los Ograk fueron barridos en los grandes realineamientos de la estepa tras el colapso del caganato de Göktürk en 744, su historia mal distinguida en fuentes chinas y turcas de la confederación de Basmyl más amplia de la que brotaron."

 bayirku_history_loc: "Divergida de la [CULTURE.GetName] en [DATE.GetYear]"
 BAYIRKU_GLOSS: "El Bayirku, registrado en los anales chinos como el Bayegu, fue uno de los Nueve Clanes de la confederación Toquz Oghuz, establecido en los extremos norteños del territorio de tiele cerca del lago Baikal. Su nombre se hace eco más tarde en el etnónimo de los mongoles de Barga de la misma región, lo que sugiere una larga continuidad de la población, incluso a medida que las identidades políticas se desplazan a lo largo de los siglos."

 turgesh_history_loc: "Divergida de la [CULTURE.GetName] en [DATE.GetYear]"
 TURGESH_GLOSS: "El Turgesh surgió como una de las tribus de Ten Arrow de la confederación On Oq del turco occidental Kanato, un pueblo pastoral del valle del río Ili y de la región de Zhetysu cuyos rebaños pastaron el mismo rico corredor de pastizales que generaciones de pueblos de estepa antes que ellos habían dependido. Internamente los Turgesh se dividieron entre dos grandes agrupaciones de clanes, el Turgesh Amarillo y el Turgesh Negro, una división que moldeó alianzas matrimoniales y derechos de pastoreo mucho antes de que se hiciera una cuestión de política. A medida que la autoridad turca occidental se derrumbó al final del siglo VII, esta misma población de pastoreo se encontró sumida en la prominencia no acostumbrada, sus guerreros y pastizales repentinamente en el centro de un concurso para el control del valle de Ili que ocuparía el Turgesh para la mejor parte de un siglo."

 qun_history_loc: "Divergida de la [CULTURE.GetName] en [DATE.GetYear]"
 QUN_GLOSS: "El Qun, registrado en fuentes chinas como la tribu Hun, fue uno de los Nueve Clanes de la confederación Toquz Oghuz nombrado en las inscripciones de Orkhon de principios del siglo VIII. Los enviados que llevan el nombre tribal Qun aparecen en la inscripción de Tonyukuk entre los enviados por el Toquz Oghuz khagan para tratar con China y el kitán, atestiguando la posición de la tribu dentro de la confederación de tiele más amplia, incluso cuando su historia independiente permanece escasamente registrada."

 siqar_history_loc: "Divergida de la [CULTURE.GetName] en [DATE.GetYear]"
 SIQAR_GLOSS: "El Siqar era una tribu constituyente de la confederación de tiele en la estepa mongol, su historia ligada a la fortuna más amplia del Toquz Oghuz. Más tarde, los linajes Siqar contribuirían a la formación de nuevos poderes de estepa a medida que las confederaciones tribales se removían tras el colapso del uigures Kanato en 840, su nombre sobreviviendo como una raíz entre los muchos que se introdujeron en la confederación naimanos de la estepa occidental."

 tongra_history_loc: "Se separó de [CULTURE.GetName] [Glossary('tribus de la confederación Toquz Oghuz', 'TONGRA_GLOSS')] en el año [DATE.GetYear]"
 TONGRA_GLOSS: "Grabado en fuentes chinas como el Tongluo, los Tongra estaban entre las más fuertes de las tribus tiele, prominente dentro de la confederación Toquz Oghuz por su reputación marcial y su estrecha alianza con la tribu Pugu igualmente arraigada. Generaciones de servicio militar fronterizo contra y junto a la dinastía Tang endurecieron la sociedad Tongra en uno construido alrededor de la guerra montada y la vida móvil del campamento incluso más que la mayoría de sus parientes tiele, un carácter marcial que hizo que los guerreros Tongra buscaran como auxiliares por cualquier poder que actualmente se mantiene en el estepa, de la propia corte Tang a los generales de fronteras rebeldes que buscan la caballería propia."

 barsil_history_loc: "Divergida de la [CULTURE.GetName] en [DATE.GetYear]"
 BARSIL_GLOSS: "El Barsil pertenecía al mundo turco de habla Oghur del Cáucaso Norte y la estepa póntico-caspia, apareciendo en fuentes bizantinas del siglo VI junto a los Sabirs y Onogurs como uno de los pueblos descendidos de los restos de la confederación huniana. Al norte del Cáucaso en la era antes de la ascendencia de Khazar, los Barsil son considerados por varios eruditos para haber formado uno de los elementos fundadores más tarde absorbidos en el estado naciente de Khazar, su nombre y población doblando en el más amplio Khazar kanato mientras se levantó para dominar la región en el siglo VII."

 karluk_history_loc: "Se separó de [CULTURE.GetName] [Glossary('tribus de la confederación Toquz Oghuz', 'KARLUK_GLOSS')] en el año [DATE.GetYear]"
 KARLUK_GLOSS: "Los carlucos procedían de la confederación tribal del kanato turco occidental, en la región del Altái, donde formaban parte de las poblaciones pastoriles organizadas bajo el sistema On Oq. Tras la fragmentación del kanato, se dispersaron por la estepa. La caída del kanato uigur en 840 abrió nuevas tierras de pastoreo y rutas comerciales hacia el sur, lo que favoreció su migración hacia la región de Zhetysu. Durante las generaciones siguientes, algunas comunidades carlucas abandonaron gradualmente el nomadismo y se asentaron en ciudades y oasis de Asia Central, donde convivieron y se mezclaron con poblaciones sogdianas y tocarias. Esta transformación sentó las bases de la población de la que surgiría el kanato qarajánida y contribuyó a la turquificación y la islamización de las cuencas del Tarim y Ferganá."

 laktan_history_loc: "Se separó de [CULTURE.GetName] [Glossary('tribus fundadoras de la confederación de Kimek', 'LAKTAN_GLOSS')] en el año [DATE.GetYear]"
 LAKTAN_GLOSS: "El Laktan, grabado por geógrafos persas como el Lanikaz, fue una de las siete tribus fundadoras de la confederación de Kimek que emergieron en la región de Altái y Irtysh superior tras el colapso del Kanato turco occidental. Su nombre puede derivarse de una frase que significa 'Khazar Alans', insinuando una red de conexiones de estepa que se extienden lejos al oeste, aunque como varias de las tribus constitutivas de Kimek su historia independiente sólo se vislumbra a través de las observaciones externas de los cronistas árabes y persas como Gardizi."

 bashkir_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos de la estepa de Ural meridional', 'BASHKIR_GLOSS')] en el año [DATE.GetYear]"
 BASHKIR_GLOSS: "Los baskires se asentaron en la región de transición entre bosques y estepas de los Urales meridionales, entre las tierras de los búlgaros del Volga al oeste, las estepas de los kimeks y kipchaks al este y los bosques septentrionales. Eran hábiles criadores de caballos y cazadores, y conservaron sus costumbres e identidad tribal pese al paso de sucesivas oleadas de pueblos oguzes, kimeks y, posteriormente, kipchaks. Aunque incorporaron influencias de sus vecinos, mantuvieron una lengua y una forma de vida propias hasta la época de la Horda de Oro."

 kipchak_history_loc: "Se separó de [CULTURE.GetName] [Glossary('remanentes de los Altai e Irtysh', 'KIPCHAK_GLOSS')] en el año [DATE.GetYear]"
 KIPCHAK_GLOSS: "Los kipchaks aparecen por primera vez en las fuentes del siglo VIII como parte del segundo kanato turco, probablemente en la región del Altái. Tras la caída de aquel kanato, se integraron en la naciente confederación kimek a orillas del río Irtish. Sus comunidades pastoriles crecieron durante los siglos siguientes y, hacia el siglo XI, llegaron a superar en importancia a sus antiguos aliados kimeks. Desde allí se expandieron hacia el oeste por la estepa póntico-caspia, hasta el punto de que aquel vasto territorio pasó a conocerse como Desht-i Qipchaq, la estepa de los kipchaks. Más tarde, estas tierras se convertirían en el núcleo de la Horda de Oro."

 dukha_history_loc: "Se separó de [CULTURE.GetName] [Glossary('renos herederos de la taiga Sayan', 'DUKHA_GLOSS')] en el año [DATE.GetYear]"
 DUKHA_GLOSS: "El Dukha habitaba las franjas taiga de las montañas Sayan, su identidad moldeada menos por los grandes caganados de la estepa abierta que por el bosque profundo y sus renos, una vía de vida que los apartó de sus vecinos madrastras, incluso cuando compartieron el discurso y la ascendencia turcos Sayan-Altaic con el mundo más amplio de Yeniséi kirguises."

 todzh_history_loc: "Se separó de [CULTURE.GetName] [Glossary('los pueblos forestales del Yenisei superior', 'TODZH_GLOSS')] en el año [DATE.GetYear]"
 TODZH_GLOSS: "El Todzh estableció la cuenca boscosa del Yeniséi superior dentro de la esfera de la influencia de kirguises, su remota tierra montañosa y forestal preservando una identidad tribal distinta a través de los siglos, incluso mientras el ancho Yeniséi kirguises kanato se levantó y cayó alrededor de ellos."

 cik_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos absorbidos por el Yenisei Kirghiz', 'CIK_GLOSS')] en el año [DATE.GetYear]"
 CIK_GLOSS: "El Cik está atestiguado en las primeras fuentes turcas y chinas como un pueblo distinto de la cuenca superior de Yeniséi, sometido y absorbido en la esfera de Yeniséi kirguises en expansión, ya que esa confederación creció para dominar la región de Sayan-Altái. Su nombre persistió como un marcador tribal y territorial incluso después de la absorción política, parte de la parchería de pueblos que conformaron el mundo más amplio de kirguises."

 az_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos de las montañas de Sayan', 'AZ_GLOSS')] en el año [DATE.GetYear]"
 AZ_GLOSS: "Los Az se registran entre los pueblos tribales de la región montañosa de Sayan cerca de Tuva, su tierra montañosa colocandolos dentro de la órbita del poder de Yeniséi kirguises, incluso cuando su lejanía preservaba una medida de autonomía local e identidad distinta a través de los siglos de kirguises, y más tarde mongol, soberanía."

 shor_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos irlandeses del Kuznetsk Altai', 'SHOR_GLOSS')] en el año [DATE.GetYear]"
 SHOR_GLOSS: "El Shor habitaba la región boscosa Kuznetsk Altái, sus tradiciones de ironía y caza conformadas por el taiga de montaña en lugar de la estepa abierta. Vinculado por la ascendencia y el lenguaje al Yeniséi kirguises y al mundo más ancho de Khakas, el Shor mantuvo una identidad distinta de morada forestal incluso como imperios de estepa al sur se levantó y cayó."

 telengit_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos del Alto Altai', 'TELENGIT_GLOSS')] en el año [DATE.GetYear]"
 TELENGIT_GLOSS: "El Telengit estableció las altas montañas de Altái, su identidad forjada en la intersección de la expansión de Yeniséi kirguises y las poblaciones montañosas más antiguas de la región. Cazadores y jinetes esquiados adaptados a las duras tierras altas de Altái, el Telengit conserva su propia estructura tribal a través de sucesivas olas de kirguises, turco y eventualmente mongol sobrelordship."

 kirghiz_history_loc: "Se separó de [CULTURE.GetName] [Glossary('Kirghiz migrando hacia el Tian Shan', 'KIRGHIZ_GLOSS')] en el año [DATE.GetYear]"
 KIRGHIZ_GLOSS: "Tras la conquista mongol de la tierra natal de Yeniséi kirguises a principios del siglo XIII, las sucesivas olas de clanes kirguises comenzaron a emigrar al suroeste hacia las montañas Tian Shan, distinguiéndose gradualmente de sus parientes de Yeniséi-basin que permanecieron en el sur de Siberia. Esta rama de emigración hacia el sur, a lo largo de los siglos posteriores, se convertiría en los antepasados de la moderna kirguisa de Asia Central, su lenguaje e identidad que se divergían de los pueblos de habla kakas dejados atrás en los yenisei."

 sakha_history_loc: "Se separó de [CULTURE.GetName] [Glossary('Kurykans migrando a la cuenca del Lena', 'SAKHA_GLOSS')] en el año [DATE.GetYear]"
 SAKHA_GLOSS: "A medida que la expansión mongol trastornó la tierra natal de Baikal-region de los kurykans en el siglo XIII, grupos de estos pastores turcos criados por caballos fueron empujados hacia el norte por el río Lena hacia la dura taiga subarctica, una migración que los transformaría por generaciones en un pueblo totalmente distinto. Adaptando sus tradiciones de pastoreo a un clima alejado de la estepa de Baikal, estos migrantes se convirtieron en los sakha, antepasados de la gente más tarde conocida por los exploradores rusos como los Yakut."

 uriankhai_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos bajo la regla del mongol', 'URIANKHAI_GLOSS')] en el año [DATE.GetYear]"
 URIANKHAI_GLOSS: "Tras la conquista mongola de los territorios de los kirguises del Yeniséi, los pueblos túrquicos de los bosques y montañas de Sayán-Altái quedaron sometidos a una prolongada influencia política y cultural mongola. Los conquistadores aplicaron el nombre uriankhai, empleado originalmente para designar a diversos pueblos forestales, a comunidades relacionadas con los antepasados de los jakasios y tuvanos. Durante generaciones, el contacto con los jefes mongoles, los matrimonios mixtos y la incorporación a la administración imperial favorecieron la adopción de elementos de la lengua y la identidad mongolas, sin que desaparecieran sus raíces túrquicas."

 pecheneg_history_loc: "Se separó de [CULTURE.GetName] [Glossary('tribus de la región de Syr Darya', 'PECHENEG_GLOSS')] en el año [DATE.GetYear]"
 PECHENEG_GLOSS: "Los pechenegos surgieron entre los pueblos túrquicos de la región del curso medio del Sir Daria, cerca de Taskent. Cronistas posteriores, como Rashid al-Din y Mahmud de Kashgar, los incluyeron entre las ramas de los oguzes. Presionados por confederaciones rivales, entre ellas las de los oguzes, kimeks y carlucos, emigraron hacia el oeste y cruzaron el Volga a comienzos del siglo IX. A finales de ese siglo ocupaban amplias zonas de la estepa póntico-caspia, desde el Caspio hasta el Danubio, y durante los dos siglos siguientes desempeñaron un papel destacado en las fronteras bizantinas, rusas y húngaras."

 salar_history_loc: "Se separó de [CULTURE.GetName] [Glossary('tribu salur de la confederación oguz', 'SALAR_GLOSS')] en el año [DATE.GetYear]"
 SALAR_GLOSS: "Los salares remontan sus orígenes a los salur, una de las tribus oguzes cuyo nombre figura entre los veinticuatro clanes tradicionales recogidos por los genealogistas medievales. Según su tradición, varios hermanos salur huyeron de la persecución religiosa en Samarcanda junto con un pequeño grupo de seguidores y llevaron un Corán sobre un camello blanco hacia el este, atravesando los pasos del Tian Shan. Finalmente se establecieron en el curso alto del río Amarillo, en la región de Qinghai-Gansu. Allí, siglos de convivencia y matrimonios con tibetanos, hui y chinos contribuyeron a la formación de una identidad salar diferenciada."

 khazar_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos ogúricos y hunos de la estepa póntica', 'KHAZAR_GLOSS')] en el año [DATE.GetYear]"
 KHAZAR_GLOSS: "Los jázaros surgieron entre los pueblos túrquicos de habla ogúrica del Cáucaso septentrional y la estepa póntico-caspia, vinculados por diversas fuentes a los restos de la antigua confederación huna. En el siglo VII alcanzaron una posición dominante y establecieron un kanato multiétnico que se extendía desde el Cáucaso hasta el Volga. En sus dominios convivían eslavos, alanos, búlgaros y otros pueblos. Los jázaros son especialmente conocidos por la conversión de parte de su élite gobernante al judaísmo, probablemente entre los siglos VIII y IX."

 bolghar_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos ogúricos y hunos de la estepa póntica', 'BOLGHAR_GLOSS')] en el año [DATE.GetYear]"
 BOLGHAR_GLOSS: "Los búlgaros descendían de los pueblos túrquicos de habla ogúrica de la estepa póntico-caspia, relacionados con los restos de la confederación huna y agrupaciones tribales posteriores, como los onoguros. Tras la desintegración de la Antigua Gran Bulgaria a mediados del siglo VII, bajo la presión de los jázaros, distintas comunidades búlgaras emigraron en varias direcciones. Una rama se estableció en los Balcanes y se mezcló con las poblaciones eslavas locales; otra avanzó hacia el norte siguiendo el Volga y fundó la Bulgaria del Volga, un próspero estado comercial que perduró hasta las conquistas mongolas del siglo XIII."

 avar_history_loc: "Se separó de [CULTURE.GetName] [Glossary('Rouran refugees fleeing to Europe', 'AVAR_GLOSS')] en el año [DATE.GetYear]"
 AVAR_GLOSS: "Tras la destrucción del kanato de los rouran por sus antiguos vasallos túrquicos en 552, grupos de refugiados emigraron hacia el oeste por la estepa euroasiática y llegaron a la región póntica, donde aparecieron bajo el nombre de ávaros. En 567 se establecieron en la cuenca de los Cárpatos y sometieron a una población diversa de búlgaros ogúricos, eslavos y pueblos germánicos. Con el tiempo, estas comunidades quedaron integradas en un mundo político dominado por los ávaros, que perduró durante más de dos siglos hasta su desintegración ante la presión franca a finales del siglo VIII."

 tumed_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos tumat de los bosques de la taiga de Sayán', 'TUMED_GLOSS')] en el año [DATE.GetYear]"
 TUMED_GLOSS: "Los tumed, mencionados como tumat en la Historia secreta de los mongoles, eran un pueblo de los bosques de la región del Baikal y los montes Sayán. Vivían de la caza y la cría de renos en la taiga, en lugar del pastoreo ecuestre característico de las estepas abiertas, al igual que sus vecinos buriatos y bargutos, con quienes compartían raíces kurykan. Defendieron con firmeza sus territorios forestales y se rebelaron contra la autoridad mongola a comienzos del siglo XIII. Finalmente fueron sometidos e incorporados al imperio mongol, aunque conservaron buena parte de su modo de vida."

 barqut_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos del valle de Barguzin', 'BARQUT_GLOSS')] en el año [DATE.GetYear]"
 BARQUT_GLOSS: "El Barga toma su nombre del valle del río Barguzin al este del lago Baikal, una tierra natal de bosque-paso compartida con los pueblos Buryat y Tumat estrechamente relacionados que todos rastrean su más profunda ascendencia a los antiguos kurykans de la región de Baikal. Atravesando el límite entre la caza de taiga y el pastoreo de estepa, el Barga mantuvo su propia identidad tribal propia a través de la era del ascenso del Imperio mongol, siendo finalmente absorbido en la confederación más amplia de mongol mientras continuaba habitando su patria ancestral Barguzin en siglos posteriores."

 kimek_history_loc: "Se separó de [CULTURE.GetName] [Glossary('Remanentes del Khaganate turco occidental', 'KIMEK_GLOSS')] en el año [DATE.GetYear]"
 KIMEK_GLOSS: "La confederación de Kimek se formó en la región del río Irtysh-Ob tras el colapso del Kanato turco occidental en 656, reuniendo a siete poblaciones tribales constituyentes, Yemek, Kipchak, Tatar, Bayandur, Lanikaz, Ajlad, y Imur, bajo una sola estructura política floja, mientras cada una conserva sus propios terrenos y costumbres distintos. Su posición entre las montañas de Altái y la estepa Ural los situó en astridas rutas comerciales vitales, y la población de la confederación creció considerablemente después del colapso de uigures Kanato en 840 empujó a nuevos grupos tribales hacia su territorio a establecerse. Para el siglo XI la población Kipchak dentro de esta confederación había crecido tan numerosa que eclipsaron completamente a sus antiguos vecinos Kimek, absorbiendo el territorio de la confederación y la gente en la vasta estepa Kipchak que siguió."

 turkish_history_loc: "Se separó de [CULTURE.GetName] [Glossary('tribus de la región de Jetysu', 'OGHUZ_GLOSS')] en el año [DATE.GetYear]"
 OGHUZ_GLOSS: "El Oghuz se coaleszó como una confederación distinta dentro del mundo Toquz Oghuz más amplio tras el colapso del Segundo Göktürk Kanato en 744, y después de más presión de los Karluks los empujó fuera de la región de Jetysu, Las comunidades de pastoreo Oghuz emigraron hacia el oeste y se establecieron a lo largo del Syr Darya alrededor de 750, reuniéndose alrededor de la ciudad de Yengikent. Esta población migratoria se organizó en unas dos docenas de tribus, cada una registrada por los genealogistas posteriores como Mahmud al-Kashgari, y las tradiciones de pastoreo y guerrero de Tengrist que se llevaron al oeste con ellos desde la estepa Jetysu se arraigaron nuevamente a lo largo de su nueva patria Syr Darya, mezclando con las comunidades establecidas y comerciales que ya viven en la región."

 cuman_history_loc: "Se formó a partir de [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('refugiados que huyen de las conquistas mongol', 'CUMAN_GLOSS')] en el año [DATE.GetYear]"
 CUMAN_GLOSS: "Las crónicas húngaras conservan la memoria del Corán como un pueblo distinto de los Cumanes, pero estrechamente ligados a ellos, ambos conducidos al oeste a través del estepa por las mismas presiones que remodelan el Asia interior en los siglos IX y X, y el Corán dijo haber huido a Cumania misma antes de que las olas posteriores de desplazamiento llevaron a los grupos Cuman aún más adelante a Hungría. Estas comunidades migratorias de Qun y Cuman se fusionaron constantemente con poblaciones de Oghuz en su camino oeste, casarse y compartir pastos mientras iban, y la población fusionada resultante se unen al formidable mundo Cuman-Kipchak que establecería y dominaría la estepa pontica durante dos siglos, hasta que las conquistas mongoles del siglo XIII dispersaron a muchos de sus habitantes en tierras húngaras y búlgaras."

 torkil_history_loc: "Se separó de [CULTURE.GetName] [Glossary('guardias fronterizos de Kievan Rus', 'TORKIL_GLOSS')] en el año [DATE.GetYear]"
 TORKIL_GLOSS: "Conocido a los cronistas Rus como el Torki, el Torkil era una tribu Oghuz que estableció la frontera sur de Kievan Rus, entrando al servicio de los príncipes Rus como guardias fronterizos y caballería ligera. Junto a los Berendei, los Pechenegs, y otros pueblos de estepa, el Torkil formó parte del Chornye Klobuki, los 'Black Hats', una confederación de los guardianes de la frontera semi-nómada que defendieron a los principados de Rus contra las redadas Cuman manteniendo su propia identidad turca en la órbita política de Rus."

 chigil_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos de la región de Semirechye', 'CHIGIL_GLOSS')] en el año [DATE.GetYear]"
 CHIGIL_GLOSS: "El Chigil estableció la región de Semirechye y el país alrededor de Kashgar, surgiendo de la misma población remanente de On Oq/Western túrquico Kanato que produjo las confederaciones Kimek y otras estepas. El diwan lughat al-Turk del siglo XI de Mahmud al-Kashgari cuenta el Chigil entre las poblaciones turcos más prominentes de su día, sus comunidades asentadas que se entremezclan con los vecinos Yagma y otros pueblos oasiáticos de las tierras fronterizas de Tarim, una fusión de colonos que abastecían gran parte de la base poblacional de la cual el estado Qarakhanid temprano sacaría su fuerza."

 yagma_history_loc: "Se formó a partir de [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('tribus de la región de Kashgar e Issyk-Kul', 'YAGMA_GLOSS')] en el año [DATE.GetYear]"
 YAGMA_GLOSS: "El Yagma surgió de la interrelación de los colonos tribales uigures con la población vecina de Chigil alrededor del oasis de Kashgar y las costas de Issyk-Kul, una fusión de dos pueblos que produjo una de las comunidades turcos más influyentes de las fronteras de Tarim. Esta poblaciÃ3n mezclada de Yagma, aprovechando tanto su herencia literaria de uigures como su tradición de pastoreo de Chigil, formaron parte de la tierra tribal de la que el estado Qarakhanid atrajo gran parte de su temprana poblaciÃ3n y fuerza a medida que se extendÃ3 por la cuenca del Tarim y Transoxiana."

 tsangpa_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos del corazón de Ü-Tsang', 'TSANGPA_GLOSS')] en el año [DATE.GetYear]"
 TSANGPA_GLOSS: "Mientras el viejo discurso tibetano se extendía hacia fuera desde el corazón de Yarlung a través de Ü-Tsang y hacia los valles del sur de Himalaya, los granjeros, herders, y comunidades monásticas que arraigaron en estos extremos sur y occidental, incluyendo a los antepasados de los pueblos Sherpa y Kyirong-Kagate más tarde, permanecieron íntimamente ligados al mundo tibetano cortés que habían venido de, incluso a medida que la distancia y el terreno eventualmente trabajarían sus propios cambios silenciosos en su discurso y costumbre."

 balti_history_loc: "Se separó de [CULTURE.GetName] [Glossary('colonos de los valles de Indus y Baltistán', 'BALTI_GLOSS')] en el año [DATE.GetYear]"
 BALTI_GLOSS: "Los colonos tibetanos y las familias de guarnición que se mudaron al valle superior de Indus y la ayuno montañosa de Baltistán durante el siglo VIII, un corredor estratégicamente vital disputado entre el Imperio Tibetano, la dinastía Tang y el Califato árabe para controlar los pases hacia Asia Central, desarrollaron una identidad regional distinta a las generaciones que siguieron. Rodeada por vecinos de Dardic y turcos y cada vez más cortada de la meseta tibetana propia como el poder imperial, esta población de colonizadores creció cada vez más apegada a su propia tierra del valle que a la meseta lejana que sus antepasados habían dejado atrás."

 ladakhi_history_loc: "Se separó de [CULTURE.GetName] [Glossary('Yarlung exiles settling in Ladakh', 'LADAKHI_GLOSS')] en el año [DATE.GetYear]"
 LADAKHI_GLOSS: "Cuando el Imperio Tibetano colapsó en la guerra civil y la fragmentación a mediados del siglo IX, la nobleza yarlung y sus seguidores huyeron hacia el oeste hacia los altos valles de Ladakh, asentándose entre una población ya configurada por ondas anteriores de expansión tibetana en la región. Estos exiliados de Yarlung trajeron sus propias costumbres judiciales, hábitos administrativos y devoción budista en este mundo Ladakhi existente, y generaciones de vida compartida entre los recién llegados y la población del valle establecido forjaron una identidad Ladakhi distinta, una que llevaba adelante la herencia tibetana mientras permanecía firmemente arraigada en su propia tierra natal de alta altitud lejos de la meseta propia."

 nakhi_history_loc: "Se separó de [CULTURE.GetName] [Glossary('migrantes qiánguicos establecidos en torno a Lijiang', 'NAKHI_GLOSS')] en el año [DATE.GetYear]"
 NAKHI_GLOSS: "Los Nakhi rastrean sus orígenes a los pueblos de habla Qiangic que emigraron hacia el sur desde la meseta tibetana oriental hasta la fértil cuenca de Lijiang del norte de Yunnan, un movimiento que recogió el ritmo como Tang China y el creciente reino de Nanzhao extendieron la presión hacia la región. Asentando un importante corredor comercial que une el Tíbet, Yunnan y Sichuan, el Nakhi desarrolló una sociedad distinta reconocida en siglos posteriores por su escritura pictográfica de Dongba y las tradiciones del clan matrilineal, permaneciendo un poder regional persistente en las tierras fronterizas montañosas entre los estados más grandes."

 kirati_history_loc: "Se separó de [CULTURE.GetName] [Glossary('antiguos pueblos montañosos del este de Himalaya', 'KIRATI_GLOSS')] en el año [DATE.GetYear]"
 KIRATI_GLOSS: "El Kirati del este de Nepal toma su nombre de Kirata, el antiguo término sánscrito utilizado por los reinos de las llanuras de la India para describir a los pueblos montañosos tibetano-burgueses del Himalaya y su frontera oriental, un nombre ya registrado en el Mahabharata y la literatura Védica siglos antes de la Era Común. Las crónicas nepalesas recuerdan una dinastía Kirata que gobernaba el propio valle de Katmandú en profunda antigüedad, y aunque más tarde fueron barridas por Licchavi y otras potencias de tierras bajas, los pueblos Kirati del país de las colinas orientales conservaban su propio lenguaje, adoración a los antepasados y estructuras de clanes en las estribaciones de Himalaya."

 lhomon_history_loc: "Se separó de [CULTURE.GetName] [Glossary('antiguos pueblos montañosos del este de Himalaya', 'LHOMON_GLOSS')] en el año [DATE.GetYear]"
 LHOMON_GLOSS: "Se asentaron a través de los valles boscosos y las altas crestas donde el Himalaya oriental se encuentra con la meseta tibetana, los pueblos lhomon, antepasados del Monpa posterior, Lhoba, y comunidades conexas, rastrean sus raíces a la misma ola ancha del antiguo asentamiento de colinas Tibeto-Burman que fuentes sánscritas agrupadas bajo el nombre de Kirata. Su terreno remoto y difícil los mantuvo en gran medida aparte de los grandes imperios que formaban su norte y oeste, permitiendo que las distintas tradiciones locales de la veneración del ancestro y la práctica chamánica prosperen indisturbios."

 kachari_history_loc: "Se separó de [CULTURE.GetName] [Glossary('antiguos pueblos montañosos del este de Himalaya', 'KACHARI_GLOSS')] en el año [DATE.GetYear]"
 KACHARI_GLOSS: "Los pueblos kachari establecieron los valles del río y las colinas boscosas de la cuenca de Brahmaputra, parte del amplio y antiguo movimiento de los pueblos tibetano-burgueses hacia el noreste de la India que los primeros cronistas sánscritos se unieron bajo el término genérico Kirata. Su sociedad arraigaba alrededor del denso terreno de la selva y sus bosques sagrados, una población fluvial y forestal asentada cuyos descendientes se reunirían posteriormente bajo los reyes de Dimasa, aunque era esta base de población más profunda de agricultores, cazadores y comunidades de clanes que dieron a los Kachari su presencia duradera en las tierras fronterizas de Assam."

 tripuri_history_loc: "Se separó de [CULTURE.GetName] [Glossary('antiguos pueblos montañosos del este de Himalaya', 'TRIPURI_GLOSS')] en el año [DATE.GetYear]"
 TRIPURI_GLOSS: "Los pueblos tripuri establecieron el país montañoso de lo que se convertiría en Tripura, parte de la misma corriente amplia de la antigua migración tibetana-burguesa al noreste de la India que dio lugar a los Kachari, Meitei y otros pueblos vecinos. Su lenguaje de Kokborok y sus estructuras de clanes, dadas posteriormente la forma real bajo el reino de Twipra, crecieron de esta misma población del campo de las colinas profundas, una cuya expresión y organización social distintivas perduraron en todo el país de las colinas orientales, independientemente de la forma política que sus gobernantes le dieron."

 meitei_history_loc: "Se separó de [CULTURE.GetName] [Glossary('antiguos pueblos montañosos del este de Himalaya', 'MEITEI_GLOSS')] en el año [DATE.GetYear]"
 MEITEI_GLOSS: "Los Meitei asentaron el fértil valle de Manipur, resonado por colinas que les dieron una medida de protección de los grandes poderes de las llanuras indias, Birmania y la meseta tibetana por igual. Esta población del valle construyó su identidad alrededor de estructuras de clanes estrechas, a diferencia de las comunidades montañosas más dispersas de sus parientes tibetano-burgueses más allá en las tierras altas circundantes, y el asentado, carácter agrícola del propio valle, más que cualquier casa de gobierno, moldeó una identidad Meitei claramente fundada que apartó a la gente del valle de los pueblos montañosos que compartieron su ascendencia más amplia."

 zo_history_loc: "Se separó de [CULTURE.GetName] [Glossary('antiguos pueblos montañosos del este de Himalaya', 'ZO_GLOSS')] en el año [DATE.GetYear]"
 ZO_GLOSS: "Los pueblos Zo habitaron el robusto y densamente boscoso país montañoso de las tierras fronterizas de Indo-Burmese, parte de la amplia corriente antigua del asentamiento Tibeto-Burman que se extendió por el noreste de la India. Organizado en estructuras clanales y aldeas ferozmente independientes en lugar de reinos centralizados, el Zo desarrolló una cultura guerrera bien adaptada al difícil terreno que llamaban hogar, su identidad forjada tanto por las montañas y la selva que los aislaba como por la ascendencia compartida."

 tani_history_loc: "Se separó de [CULTURE.GetName] [Glossary('antiguos pueblos montañosos del este de Himalaya', 'TANI_GLOSS')] en el año [DATE.GetYear]"
 TANI_GLOSS: "Los pueblos Tani, ancestros de las comunidades posteriores Adi, Nyishi y las comunidades conexas, establecieron los valles escarpados y las crestas boscosas de las estribaciones orientales de Himalayan, parte de la antigua ola de migración Tibeto-Burman que fuentes sánscritas llamadas Kirata. Aislado por algunos de los terrenos más difíciles en el Himalaya, los Tani conservaban distintas tradiciones orales, estructuras sociales basadas en clanes, y una estrecha relación espiritual con las montañas sagradas que dominaban su mundo."

 khampa_history_loc: "Se formó a partir de [CULTURE.GetName] [Glossary('pueblos con', 'KHAMPA_GLOSS')] [TARGET_CULTURE.GetName] colonos en el este del Tíbet alrededor del año [DATE.GetYear]"
 KHAMPA_GLOSS: "La región de Kham del Tíbet oriental estaba dentro del antiguo territorio de la Sumpa antes de la expansión imperial de la dinastía de Yarlung llevó el discurso y la administración tibetana hacia el este a través de la meseta. En lugar de desplazar a la población sumpa existente, el asentamiento tibetano se encogió sobre él, produciendo un dialecto oriental distinto y un personaje regional famosamente independiente formado por el terreno accidentado de Kham, sus rutas comerciales astridas en China, y su historia de provincias locales gobernadas libremente que resistían el control centralizado incluso bajo el dominio nominal tibetano o chino posterior."

 amdo_history_loc: "Se formó a partir de [CULTURE.GetName] [Glossary('pueblos con', 'AMDO_GLOSS')] [TARGET_CULTURE.GetName] colonos en el noreste del Tíbet alrededor del año [DATE.GetYear]"
 AMDO_GLOSS: "La región de Amdo del Tíbet nororiental, como Kham al sur, se encuentra dentro del territorio de Sumpa antes de la expansión de la dinastía de Yarlung, y el dialecto tibetano que arraigaba allí se desarrolló sobre esta población de sustratos más antigua en lugar de sustituirla de manera directa. La posición de Amdo sobre la frontera entre la meseta tibetana, la estepa mongol y Gansu chino lo convirtió en una encrucijada perenne de contacto pastoral y comercial, y sus amplios pastizales apoyaron una sociedad fuertemente pastoral distinta de la agricultura establecida del Tíbet central."

 baima_history_loc: "Se formó a partir de [CULTURE.GetName] [Glossary('Pueblos Qiangicos', 'BAIMA_GLOSS')] [TARGET_CULTURE.GetName] en la frontera de Sino-Tibetan [DATE.GetYear]"
 BAIMA_GLOSS: "La Baima traza su descenso primario a la antigua Di, una población Qiangic que agrietó y asintió a través de la frontera Sino-Tibetana durante siglos antes de que el asentamiento tibetano llegara a su patria, algunas comunidades Di más tarde se dispersan hasta Sichuan y la cuenca superior del río Amarillo mientras que otras permanecieron arraigadas en sus valles de montaña originales. El estudio genético y cultural ha encontrado consistentemente la Baima más cercana a esta población Qiangic más amplia que a las comunidades tibetanas centrales a pesar de siglos de influencia budista y lingüística tibetana, y sus distintivos sombreros de fieltro blanco, épicas orales y tradiciones rituales pre-Buddhistas los marcan como una población separada, atravesando la frontera entre la meseta tibetana y Sichuan."

 kinnauri_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos de los reinos sucesores de Zhangzhung', 'KINNAURI_GLOSS')] en el año [DATE.GetYear]"
 KINNAURI_GLOSS: "Los Kinnauri descienden del mismo antiguo mundo lingüístico del Himalaya Occidental que Zhangzhung, el reino una vez independiente que dominaba el Tíbet occidental antes de su absorción en el Imperio Tibetano de Yarlung en el siglo VII. Se asentada en los altos valles de lo que ahora es Himachal Pradesh, el Kinnauri preservaba un lenguaje y una cultura estrechamente relacionados con la lengua Zhangzhung desaparecida, incluso como el budismo tibetano, comercio, y la influencia política siguió irradiando hacia fuera desde la meseta en los siglos posteriores a la caída de Zhangzhung, dejar Kinnaur como una de las ventanas más claras sobreviviendo en el paisaje lingüístico preimperial del Himalaya occidental."

 yughur_history_loc: "Se formó a partir de [CULTURE.GetName] y [TARGET_CULTURE.GetName] [Glossary('refugiados que se asientan en el Corredor Hexi', 'YUGHUR_GLOSS')] en el año [DATE.GetYear]"
 YUGHUR_GLOSS: "Tras el catastrófico colapso del uigures Kanato a una invasión de Yeniséi kirguises en 840, bandas dispersas de refugiados de uigures huyeron en varias direcciones, un grupo significativo que hace su camino al sur hacia el Corredor Hexi de Gansu, asentamiento entre la población turco shatuo ya establecido allí. Generaciones de vida compartida, entre matrimonios, y contacto diario entre estos exiliados uigures y sus vecinos shatuo gradualmente mezclaron las dos poblaciones juntas, y fue esta comunidad de Yughur fusionada, entre tibetano, Tangut, y los poderes chinos a lo largo de una arteria vital de Silk Road, que conservaba elementos de uigures y shatuo patrimonio mucho después de que la patria original de ambos grupos se hubiera convertido en un recuerdo distante."

 tangut_history_loc: "Se separó de [CULTURE.GetName] [Glossary('Tribus de Dangxiang huyendo a la frontera de Ordos', 'TANGUT_GLOSS')] en el año [DATE.GetYear]"
 TANGUT_GLOSS: "El Tangut desciende del Dangxiang, uno de los muchos grupos tribales del mundo Qiang más amplio de las tierras fronterizas Sino-Tibetan, que originalmente se establecieron en la región de Qinghai al sur de la frontera Tang. La expansión imperial tibetana bajo el Gampo Songtsen a mediados del siglo VII condujo al Dangxiang desde su patria, y el tribunal de Tang reasentó a las tribus migratorias en la región de Ordos como una población de amortiguación, otorgando a sus jefes el prestigioso apellido Tuoba, el mismo nombre del clan una vez llevado por los gobernantes de xianbei del norte de Wei, a reclamado pedigree la mayoría de los eruditos modernos consideran un prestigio inventado en lugar de un auténtico descenso. Retirada del mundo Qiangic más amplio y endurecida por generaciones de vida fronteriza en el margen estepe-deserto, esta población trasplantada de Dangxiang desarrolló un carácter militar y pastoral distinto todo el suyo, llevando adelante una identidad tribal formada tanto por la dura frontera de Ordos como por sus raíces Qiangic originales."

 sheren_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos montañosos del linaje Pan Hu', 'SHEREN_GLOSS')] en el año [DATE.GetYear]"
 SHEREN_GLOSS: "El pueblo She remonta su ascendencia, como sus parientes Yao, al legendario Panhu, un antepasado canino cuyos descendientes se dice que han llevado a las colinas en lugar de someterse a la realeza de tierras bajas, un mito de origen compartido que marca la profunda raíz común de los dos pueblos dentro del mundo más amplio de Hmong-Mien. Mientras que el Yao se extendió más ampliamente a través del interior montañoso del sur, se estableció específicamente en el país montañoso donde se encuentran Fujian, Guangdong y Jiangxi, una zona fronteriza agitada que, en siglos posteriores, también se convertiría en el refugio de migrantes Han que huían del conflicto y la escasez de tierra más al norte. Fue en este mismo país montañoso, generaciones después, que el contacto sostenido entre las comunidades she y estos colonos de Han llegado dio lugar a la gente de Hakka."

 sichuan_history_loc: "Se separó de [CULTURE.GetName] [Glossary('colonos de los antiguos reinos de Ba y Shu', 'SICHUAN_GLOSS')] en el año [DATE.GetYear]"
 SICHUAN_GLOSS: "Mucho antes del asentamiento de Han, la cuenca de Sichuan fue el hogar de las poblaciones independientes de Ba y Shu, cuyos idiomas y costumbres no iniciales dejaron una huella profunda en la región incluso después de la conquista de Qin en 316 A.C. llevó la cuenca permanentemente a la esfera china. Centurias de la migración y administración de Han subsiguientes superaban gradualmente este antiguo sustrato con discurso y costumbre chinos, pero el aislamiento de Sichuan detrás de las montañas de todos los lados preservaba a una población regional lo suficientemente distinta en perspectiva y dialecto que fuera de la autoridad encontró repetidamente difícil gobernar desde lejos la cuenca, un carácter autocontenido que el sustrato Ba-Shu había dado por primera vez a la región mucho antes de que llegara cualquier colonizador chino."

 min_history_loc: "Se separó de [CULTURE.GetName] [Glossary('colonos del antiguo reino de Minyue', 'MIN_GLOSS')] en el año [DATE.GetYear]"
 MIN_GLOSS: "Las montañas costeras de Fujian fueron una vez el corazón del reino independiente de Minyue, un estado de Baiyue que el emperador Wu de Han finalmente aplastado en 111 a.C., deportando gran parte de la población derrotada hacia el norte y dejando la región escasamente asentada. La migración de Han en el vacío resultante procedió constantemente a lo largo de los siglos siguientes, reforzada por nuevas olas que huían del caos del levantamiento de los Cinco Barbarianos a principios del siglo IV, cuando clanes como los famosos Ocho Grandes Apellidos reasentaron la provincia. El terreno costero robusto y compartimentalizado de Fujian iría a fracturar el discurso chino resultante en un número inusualmente grande de variedades locales mutuamente inteligibles, cada valle cultivando su propia lengua distinta."

 wu_history_loc: "Se separó de [CULTURE.GetName] [Glossary('refugiados del desastre de Yongjia', 'WU_GLOSS')] en el año [DATE.GetYear]"
 WU_GLOSS: "El delta de Yangtze inferior era, en la antigüedad, el hogar de los reinos independientes Wu y Yue, cuyas poblaciones de Baiyue sólo gradualmente Sinicized después de Chu y más tarde Qin-Han conquista. La transformación decisiva vino con el desastre de Yongjia de 311, cuando la caída de Luoyang a los invasores no chinos envió a la corte imperial Jin y una gran ola de familias aristocráticas del norte huyendo hacia el sur para fundar la dinastía de Jin oriental en Jiankang, Nanjing moderno. Esta afluencia de la nobleza y los acompañantes de las llanuras centrales se asentaron a través del delta de Yangtze y Zhejiang, su discurso mezclado con el vernáculo de Wu-Yue existente para producir la lengua Jiangnan distinta que iría a anclar un milenio de cultura literaria y comercial del sur chino."

 gan_history_loc: "Se separó de [CULTURE.GetName] [Glossary('colonos de la cuenca del río Gan', 'GAN_GLOSS')] en el año [DATE.GetYear]"
 GAN_GLOSS: "La cuenca del río Gan de Jiangxi traza su primera capa de discurso chino al antiguo reino de Chu, cuyo dialecto dejó rastros duraderos incluso después de la conquista Qin en 223 A.C. trajo olas de colonos del norte a la región alrededor de Yuzhang, hoy Nanchang. La ola decisiva de asentamiento se acercó al desastre de Yongjia de principios del siglo IV, cuando el mismo levantamiento que envió refugiados inundados en el delta de Yangtze también condujo a los colonos a la cuenca de Poyang, afianzando un vernáculo Jiangxi distinto que serviría más tarde como un dialecto puente crucial entre los chinos del Yangtze y el discurso emergente del Hakka más al sur."

 yue_history_loc: "Se formó a partir de [CULTURE.GetName] [Glossary('colonos que se mezclan con los', 'YUE_GLOSS')] [TARGET_CULTURE.GetName] alrededor [DATE.GetYear]"
 YUE_GLOSS: "La región de Lingnan al sur de las montañas Nanling era, antes de la conquista china, la tierra natal de los pueblos de Baiyue estrechamente relacionada con las poblaciones de habla Tai de la frontera sur más amplia, una población que siguió dominando el campo y la costa de la región incluso después de que los ejércitos de Han lo anexaron en 111 a.C. Centurias de la migración posterior de Han, el matrimonio y la administración mezclaron el discurso chino entrante con este substrato lingüístico y cultural de Baiyue ya presente, un proceso que se intensificó a través de repetidas olas de migración hacia el sur a través de las dinastías Tang y Song hasta que se cristalizó en la lengua cantonés-ancestral del delta del río Pearl."

 xiang_history_loc: "Se separó de [CULTURE.GetName] [Glossary('colonos de la antigua tierra del Chu', 'XIANG_GLOSS')] en el año [DATE.GetYear]"
 XIANG_GLOSS: "El discurso chino de Hunan traza un pedigrí inusualmente largo al antiguo reino de Chu, cuyo dialecto distintivo arraigaba en la región tan temprano como el siglo VIII a.C., siglos antes de que la mayoría del sur de China viera cualquier asentamiento cingítico comparable. Esta capa profunda de Chu-derived sobrevivió relativamente indisturbio en el centro de Hunan durante mucho más de un milenio, pero los alcances orientales de la provincia fueron remodelados por una gran ola de migrantes de habla Gan de Jiangxi vecino durante el último período de Tang y Cinco Dinastías, dividiendo el discurso chino de Hunan entre un mayor, más conservadora lengua del sur y un nuevo, dialecto influenciado por Gan más al norte y al este."

 hakka_history_loc: "Se formó a partir de [CULTURE.GetName] [Glossary('migrantes que se instalan entre los', 'HAKKA_GLOSS')] [TARGET_CULTURE.GetName] región montañosa alrededor del año [DATE.GetYear]"
 HAKKA_GLOSS: "Como repetidas oleadas de guerra y levantamiento empujaron a las poblaciones chinas de Han hacia el sur constantemente a lo largo de los siglos, las tierras bajas más fértiles de Fujian, Guangdong y Jiangxi ya fueron reclamadas por colonos anteriores, dejando más tarde llegadas para hacer sus hogares en el más difícil país montañoso de las fronteras provinciales. Esta tensa frontera ya era el hogar de la Ella, una gente de colinas distintas de los Han, y generaciones de contacto, entre matrimonios, y la vida interior compartida entre los migrantes entrantes y la población local Ella forjó una comunidad nueva y distinta. Sus vecinos los llamaban Hakka, que significa 'pueblos invitados', un nombre que se atascó como una placa de sus orígenes itinerantes, incluso cuando construyeron una identidad sólida y profundamente arraigada de sus propios por todo el país montañoso del sur."

 yao_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos montañosos del linaje Pan Hu', 'YAO_GLOSS')] en el año [DATE.GetYear]"
 YAO_GLOSS: "Como sus parientes, el Yao rastrea su descenso al legendario Panhu, cuya descendencia se dice que han llevado a las montañas en lugar de inclinarse a los gobernantes de las tierras bajas, pero donde se instaló en una colina en particular donde se reúnen tres provincias, el Yao se extendió mucho más ampliamente, Llevar la agricultura swidden y una lengua mien distinta a través del interior montañoso que se extiende desde Guangxi y Hunan hasta Guangdong y Yunnan. Los cronistas chinos de los períodos de Sui y Tang distinguen cada vez más al Yao como un pueblo aparte de sus parientes de habla Hmong, observando su feroz independencia y resistencia frecuente a las demandas fiscales y corvée de las administraciones de tierras bajas, un patrón de autonomía continental que las comunidades de Yao mantendrían durante siglos, retrocediendo cada vez más hacia las montañas cuando la autoridad imperial presionaba demasiado de cerca sobre ellos."

 tai_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos de la dispersión Xiou', 'TAI_GLOSS')] en el año [DATE.GetYear]"
 TAI_GLOSS: "A medida que las politizaciones independientes de Baiyue de Guangxi cayeron uno por uno a Qin y después la conquista de Han, la resistencia de Xi'ou fue finalmente rota y su territorio absorbido en la esfera china en expansión por el siglo II a.C. La población de habla Kam-Tai de la región comenzó una larga dispersión que llevaría el discurso de Tai mucho más allá de su tierra natal de Lingnan, con comunidades empujando constantemente al suroeste a lo largo de los valles del río de Yunnan, Guangxi, y más allá de muchas generaciones, un lento y sostenido movimiento de colonos que eventualmente sembrarían poblaciones de habla Tai del Río Rojo al Irrawaddy y el Brahmaputra."

 kam_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos de la dispersión Xiou', 'KAM_GLOSS')] en el año [DATE.GetYear]"
 KAM_GLOSS: "El Kam, pariente lingüístico cercano al Tai dentro de la familia Kam-Tai más amplia, traza sus raíces a la misma población Xi'ou-descendida del antiguo Guangxi. Donde las comunidades de lengua Tai-speaking empujaron hacia fuera por los valles del río del suroeste en una gran y duradera diáspora, los ancestros del Kam permanecieron más cerca de su tierra natal, asttling into the mountainous borderlands of eastern Guizhou, Hunan occidental, y Guangxi septentrional, donde siglos de aislamiento relativo preservaban un lenguaje distinto y una sociedad de pueblo fuertemente comunitaria organizada alrededor de la torre de tambor y sus festivales compartidos."

 be_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos de la dispersión Xiou', 'BE_GLOSS')] en el año [DATE.GetYear]"
 BE_GLOSS: "El Be, o Ong Be, desciende de la misma población Kam-Tai arraigada de Xi'ou como el Tai y Kam, pero siguió su propia migración distinta hacia el sur a través de la península de Leizhou y a través del estrecho hacia el norte de Hainan. Esta ruta los apartó de la población mayor de Hlai ya se estableció en las montañas del sur de la isla, que había llegado por una migración totalmente separada y mucho antes, y el Be desarrolló su propia identidad costera formada por la pesca y el comercio de la costa norte de Hainan, distinta de sus parientes Kam-Tai en el continente y sus vecinos Hlai más al sur."

 siamese_history_loc: "Se formó a partir de [CULTURE.GetName] [Glossary('colonizadores que absorben', 'SIAMESE_GLOSS')] [TARGET_CULTURE.GetName] pueblos de la cuenca del Chao Phraya [DATE.GetYear]"

 SIAMESE_GLOSS: "A medida que los pueblos de habla Tai emigraron al suroeste a través de la dispersión Kam-Tai de varios siglos, una corriente aprisionó en la fértil cuenca del río Chao Phraya, una zona dominada por la civilización Mon de Dvaravati, cuyas tradiciones administrativas, religiosas y artísticas los colonos del Tai entrante absorbieron incluso cuando establecieron su propia dominación política. Generaciones de matrimonios mixtos y intercambio cultural entre los guerreras-elites Tai y la población Mon existente wove Mon Buddhism, statecraft, y sensibilidad artística profundamente en el tejido de la identidad siamesa emergente, produciendo una síntesis que seguiría dominando el continente central sudeste asiático."

 lanna_history_loc: "Se formó a partir de [CULTURE.GetName] [Glossary('colonizadores que absorben', 'LANNA_GLOSS')] [TARGET_CULTURE.GetName] del valle superior de Mae Ping [DATE.GetYear]"
 LANNA_GLOSS: "Los migrantes Tai que establecieron los valles montañosos de los ríos Mae Ping y Kok en lo que ahora es el norte de Tailandia encontraron la tierra ya formada por el reino Mon de Hariphunchai, una civilización budista centrada en Lamphun cuyos monasterios, guiones y tradiciones cortesanas el Tai entrando absorbió al por mayor en lugar de desplazados. Esta fusión corrió profundamente: la población Mon de Hariphunchai fue absorbida gradualmente en la nueva policia de Lanna a través de generaciones de asentamiento e matrimonios mixtos, dejando el arte budista, la arquitectura y las tradiciones manuscritas de Lanna marcadas permanentemente por su herencia Mon, incluso cuando las estructuras políticas y sociales de Tai llegaron a dominar los valles del norte."

 lao_history_loc: "Se formó a partir de [CULTURE.GetName] [Glossary('colonizadores que absorben', 'LAO_GLOSS')] [TARGET_CULTURE.GetName] del valle medio de Mekong alrededor [DATE.GetYear]"
 LAO_GLOSS: "Comunidades de habla Tai que se establecieron a lo largo del valle del río Mekong medio, en el corazón montañoso del sudeste asiático continental, se establecieron dentro de un paisaje largo tocado por Khmer influencia política y religiosa irradiando hacia fuera desde Angkor, cuyas prácticas administrativas, Theravada and Hindu-Buddhist tradition, y la cultura epigráfica que los recién llegados de Tai dibujaron a medida que construyeron sus propios principados del río-valle. Generaciones de intermatrimonio y absorción cultural a lo largo de esta frontera de Khmer tejieron la artesanía angloria y la práctica religiosa en la identidad Lao emergente, incluso cuando la geografía separó el valle de Mekong Lao de las comunidades Tai más al oeste y fomentó su propio dialecto, escritura y tradición cortesana."

 ahom_history_loc: "Se formó a partir de [CULTURE.GetName] [Glossary('conquistadores que se casan con los', 'AHOM_GLOSS')] [TARGET_CULTURE.GetName] alrededor del año [DATE.GetYear]"
 AHOM_GLOSS: "Tai seguidores de Sukaphaa cruzaron la gama Patkai en el valle de Brahmaputra de Assam, llegando a una tierra ya habitada por Bodo-Kachari y otros pueblos locales en lugar de cualquier territorio vacío. En lugar de desplazar a esta población existente, los colonos del Tai que llegaban se casaron con ella desde el principio, lo más famoso a través de una costumbre que requiere la nobleza de Ahom para tomar esposas locales, una práctica que constantemente entrevistó a Kachari y otras familias indígenas en la clase dominante misma generación tras generación. Esta fusión de los colonos de Tai con el profundo conocimiento local y la mano de obra de los pueblos existentes de Assam produjo una población Ahom claramente híbrida, una cuyo carácter mezclado de Tai-Kachari resultó notablemente duradera a lo largo de los siglos que siguieron."

 shan_history_loc: "Se formó a partir de [CULTURE.GetName] [Glossary('colonos de las colinas superiores de Irrawaddy', 'SHAN_GLOSS')] alrededor del año [DATE.GetYear]"
 SHAN_GLOSS: "Los migrantes de Tai que empujaron al oeste más lejano en la gran dispersión Kam-Tai establecieron los valles montañosos y fluviales de lo que ahora es el noreste de Myanmar, estableciendo un parche de pequeños principados dispersos entre terrenos montañosos que nunca favorecieron el tipo de reinos riovalley centralizados vistos más al este. El contacto sostenido con los vecinos burmeses, chinos y otros pueblos montañosos a lo largo de esta región encrucijada le dio a Shan una cultura política particularmente cosmopolita y adaptable, un cómodo comercio de intermediación y lealtad a través de múltiples potencias más grandes en lugar de buscar el dominio absoluto de la región."

 bouxcuengh_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos que permanecieron en la tierra natal de Guangxi', 'BOUXCUENGH_GLOSS')] en el año [DATE.GetYear]"
 BOUXCUENGH_GLOSS: "Mientras que la dispersión más amplia de Kam-Tai llevó a los pueblos de habla Tai lejos al suroeste a lo largo de los siglos, el Bouxcuengh, ancestros de la Zhuang posterior, permaneció arraigado en la histórica tierra natal de Guangxi, el corazón de la vieja politía Xi'ou. Persistiendo como la mayoría de la población de la región incluso bajo sucesivas olas de control administrativo chino, desde Qin y Han garrisons a través de las prefecturas fronterizas con Tang y Song, el Bouxcuengh preservaba un idioma del norte y una sociedad agrícola de colinas y valles, permaneciendo la población más grande de habla Kra-Dai nunca haber dejado la patria ancestral Kra-Dai."

 chong_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos de las tierras altas de Cardamomo y Chanthaburi', 'CHONG_GLOSS')] en el año [DATE.GetYear]"
 CHONG_GLOSS: "El Chong pertenece a los pueblos peáricos, una rama de la familia Mon-Khmer distinta de origen de Khmer propiamente dicha, asentada en las montañas boscosas de Cardamom y la colina de Chanthaburi atrayendo lo que ahora es la frontera tailandesa-Camboya. Su patria se sentó dentro del núcleo histórico del estado anglobólico en expansión, y siglos de subordinación política y de contacto sostenido con la administración, religión y cultura material de Khmer dejaron una profunda huella en la sociedad de Chong, incluso cuando su lengua peárica distinguida perduraba en los valles montañosos más remotos, protegidos del peso completo de la asimilación khmer de tierras bajas."

 muong_history_loc: "Se separó de [CULTURE.GetName] [Glossary('los parientes de los vietnamitas', 'MUONG_GLOSS')] en el año [DATE.GetYear]"
 MUONG_GLOSS: "El Muong y los vietnamitas descienden de una sola población ancestral de Viet-Muong, su eventual separación impulsada menos por la geografía que por la divergencia de fortunas políticas. A medida que el Delta del Río Rojo de las Tierras Bajas llegaba bajo siglos de administración china directa, su población absorbía profundas capas de vocabulario, escritura y cultura cortesana, mientras que las comunidades de tierras altas que vivían más allá del alcance de las guarnición chinas conservaban una forma más arcaica del discurso ancestral compartido. Cuando la victoria de Ngô Quy curn en 938 finalmente rompió un milenio de gobierno chino y el estado independiente vietnamita comenzó a forjar su propia identidad corte sinicizada fuertemente, el golfo cultural entre los recién definidos calumnias Kinh y sus más conservadores parientes muong de tierra alta se habían convertido en una brecha inconfundible y duradera."

 wa_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos de la frontera entre China y Myanmar', 'WA_GLOSS')] en el año [DATE.GetYear]"
 WA_GLOSS: "El Wa comparte la rama palangica de Mon-Khmer con el Palaung, pero donde las comunidades de Palau se fusionaron en principados de colinas semicentralizados bajo la suzeraindad suelta de los poderes vecinos de Shan y Birmania, el Wa se retiró más profundamente en las montañas escarpadas que rodeaban la frontera entre Yunnan y las colinas Shan, desarrollar una independencia famosamente feroz y una tradición de caza de cabeza ritual que mantuvo fuera poderes a la longitud del brazo durante siglos. Esta divergencia en la organización política y el contacto exterior, más que cualquier ruptura lingüística aguda, marca la partición histórica de los dos pueblos."

 katang_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos de la franja de tierras altas de Annamite', 'KATANG_GLOSS')] en el año [DATE.GetYear]"
 KATANG_GLOSS: "El Katang pertenece a la rama Katuic de Mon-Khmer, asentada en las estribaciones boscosas de la gama Annamite en la franja de los Khmer y, más tarde, las esferas de influencia de Lao y Vietnam. Posición a lo largo de una frontera continental que ningún poder de las tierras bajas nunca absorbió completamente, las comunidades de Katang mantuvieron una identidad distinta, formada por patrones cambiantes de tributo, comercio e incursión con cualquier estado de tierras bajas que se mantenía en una generación determinada, preservando su propio lenguaje y estructura social, incluso cuando la influencia angloria se irradiaba hacia fuera de la tierra khmer."

 bruso_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos de la franja de tierras altas de Annamite', 'BRUSO_GLOSS')] en el año [DATE.GetYear]"
 BRUSO_GLOSS: "Los Brus, como el Katang, pertenecen a la rama katuica de Mon-Khmer y habitaron la misma zona fronteriza de las tierras altas a lo largo de la gama Annamite, sus comunidades dispersadas a través de un paisaje escarpado que desalentó el tipo de administración centralizada de tierras bajas vista en los valles de los ríos Khmer, Lao y Vietnamita. Esta posición de frente más común, más que cualquier ruptura histórica única, distinguió gradualmente la identidad Bru, el lenguaje y la costumbre de sus parientes katuicos durante el curso de muchas generaciones."

 mnong_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos de las tierras centrales vietnamitas', 'MNONG_GLOSS')] en el año [DATE.GetYear]"
 MNONG_GLOSS: "El Mnong pertenece a la rama bahárica de Mon-Khmer, asentada en todo el país de la meseta de las tierras centrales de Vietnam, un interior montañoso que el reino costero de Champa dibujó en redes sueltas de comercio y tributo desde tan temprano como el siglo VII sin imponer nunca la regla directa. Esta larga relación de brazo con la civilización del Cham de las tierras bajas, reconocida en la tradición Mnong por la habilidad de las comunidades de las tierras altas para capturar y tamar elefantes salvajes para el comercio a la costa, formó una clara identidad de las tierras altas que permanecía políticamente autónoma, incluso cuando se enredó económicamente con los poderes de las tierras bajas."

 stieng_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos de las tierras centrales vietnamitas', 'STIENG_GLOSS')] en el año [DATE.GetYear]"
 STIENG_GLOSS: "El Stieng pertenece a la rama bahárica de Mon-Khmer, asentada en los extremos meridionales de las tierras altas centrales de Vietnam, al alcance de Cham y, cada vez más a lo largo de los siglos, la influencia política y económica de Khmer irradiaba desde las tierras bajas. Atravesando esta frontera entre dos grandes civilizaciones de tierras bajas sin caer totalmente bajo el control de ninguno de los dos, el Stieng conserva una clara identidad de tierras altas construida alrededor del cultivo cambiante y una estructura social organizada alrededor de comunidades de larga data extendidas."

 dega_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos de las tierras centrales vietnamitas', 'DEGA_GLOSS')] en el año [DATE.GetYear]"
 DEGA_GLOSS: "Compartiendo la rama bahárica de Mon-Khmer con el Mnong y Stieng, las comunidades de tierras altas se acordaron bajo este nombre habitaron la meseta de Highlands Central dentro de la misma órbita suelta del comercio de tierras bajas Cham y el tributo que moldeó a sus vecinos de las tierras altas. La geografía en lugar de la política definía su mundo, un paisaje de valles y crestas dispersas que fomentaban una fuerte identidad local y clanial sobre cualquier autoridad centralizada más grande, dejando a los pueblos de las tierras altas de esta región políticamente fragmentada pero culturalmente resiliente a lo largo de los siglos."

 semang_history_loc: "Se separó de [CULTURE.GetName] [Glossary('los primeros habitantes de la Península Malaya', 'SEMANG_GLOSS')] en el año [DATE.GetYear]"
 SEMANG_GLOSS: "Los antepasados de Semang estaban cazando y reuniendo las selvas tropicales de la Península Malaya durante miles de años antes de cualquiera de los pueblos agrícolas o comerciantes posteriores que vendrían a dominar sus costas y valles fluviales llegados, una presencia tan antigua que ningún registro político de cualquier reino vecino llega lo suficientemente lejos como para marcar su comienzo. Viviendo en pequeñas bandas móviles profundas dentro del interior del bosque y moviéndose con la disponibilidad estacional de alimentos silvestres, juego y productos forestales, el Semang mantuvo una forma de vida en gran medida intacta por el ascenso y caída de los sultanatos costeros y reinos fluviales que llegaron y rodearon los bordes de su mundo forestal."

 senoi_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos de las tierras altas de la península de Malay', 'SENOI_GLOSS')] en el año [DATE.GetYear]"
 SENOI_GLOSS: "Se asentada en la columna montañosa que atraviesa el centro de la Península Malaya, el Senoi combinó la agricultura swidden con caza y recolección de bosques, ocupando un nicho entre la vida forestal totalmente móvil del Semang y el mundo montado de tierras bajas que eventualmente se elevaría por las costas. Lejos de las rutas y cortes comerciales que conforman la historia política de las costas de la península, las comunidades de Senoi desarrollaron sus propias costumbres en gran medida en sus propios términos, incluyendo una tradición inusualmente rica de interpretación de sueños tejida en la vida cotidiana y comunitaria."

 acehnese_history_loc: "Se separó de [CULTURE.GetName] [Glossary('migrantes asentados en el extremo norte de Sumatra', 'ACEHNESE_GLOSS')] en el año [DATE.GetYear]"
 ACEHNESE_GLOSS: "El lenguaje acnésico destaca como un sorprendente auge en el mundo Austronesiano: a pesar de ser hablado en la punta norte de Sumatra, pertenece a la rama cámica, la misma familia que el lenguaje cham de la costa vietnamita y camboyana, a miles de kilómetros de distancia a través del Mar del Sur de China. Los lingüistas rastrean esta conexión a una antigua migración marítima de hablantes chamicos desde el continente hasta el norte de Sumatra, probablemente llevaron a cabo las mismas rutas comerciales marítimas que más tarde convertirían a Aceh en una puerta crucial de la especia del Océano Índico y el comercio de pimienta. Centurias de contacto posterior con los comerciantes vecinos malayos, indios y árabes estrataron prestatarios pesados encima de este núcleo lingüístico chamico, pero los huesos gramaticales profundos de Acehnese todavía traicionan su origen continental sudeste asiático."

 minangkabau_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos de las tierras altas de Sumatran', 'MINANGKABAU_GLOSS')] en el año [DATE.GetYear]"
 MINANGKABAU_GLOSS: "El Minangkabau traza su lenguaje al mundo malaico que tomó forma alrededor del surgimiento de Srivijaya, el gran imperio de comercio marítimo centrado en el estrecho de Malaca cuyas inscripciones antiguas malayas del siglo VII representan algunos de los primeros discursos maliciosos certificados. Asentar los fértiles valles de las tierras altas de Sumatra Occidental en lugar de las zonas costeras en las que el poder de Srivijaya dependía, el Minangkabau se desarrolló a lo largo de su propio camino distinto, más famoso preservando una de las sociedades matrilineales más grandes y duraderas del mundo, en qué propiedad, nombre de clan, y las tierras pasan por la línea femenina, aun cuando la autoridad política y religiosa permanece en gran parte en manos de hombres."

 kerinci_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos de las tierras altas de Sumatran', 'KERINCI_GLOSS')] en el año [DATE.GetYear]"
 KERINCI_GLOSS: "Como sus vecinos Minangkabau, la gente de las remotas tierras altas de Kerinci rastrean su discurso malayo al Viejo Mundo Malayo que cristalizó alrededor del ascenso de Srivijaya en el siglo VII, Aunque el aislamiento extremo del valle detrás de algunos de los picos volcánicos más altos de Sumatra preservaba un lenguaje y una cultura lo suficientemente clara que Kerinci ahora se considera una de las ramas más conservadoras y divergentes de toda la familia malaya. Este aislamiento también conserva una de las tradiciones escritas más antiguas de Sumatra, con los propios antiguos incung escritura de Kerinci que registran acuerdos de tierras y leyes orales en una forma de escritura que no se encuentra en ninguna otra parte en la isla."

 basemah_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos de las tierras altas de Sumatran del Sur', 'BASEMAH_GLOSS')] en el año [DATE.GetYear]"
 BASEMAH_GLOSS: "La Basemah, o Pasemah, asentaron las laderas de las tierras altas alrededor del Monte Dempo en Sumatra del Sur, su discurso malayo y el derecho consuetudinario moldeados por el aislamiento relativo de los grandes estados comerciales de la costa de Sumatran. Su tierra natal está dispersa con una extraordinaria concentración de monumentos megalíticos, figuras de piedra talladas de guerreros, animales y espíritus ancestrales cuyos creadores permanecen inciertos, pero que hablan con una sociedad de tierras altas con profundas tradiciones rituales y ancestrales capas bajo su superficie lingüística malaya."

 iban_history_loc: "Se separó de [CULTURE.GetName] [Glossary('colonos del oeste de Borneo', 'IBAN_GLOSS')] en el año [DATE.GetYear]"
 IBAN_GLOSS: "A diferencia de la mayoría de sus vecinos de Dayak en el interior de Borneo, cuyos idiomas pertenecen a ramas enteramente separadas de la familia Austronesiana, el Iban habla una lengua genuinamente malaya, estrechamente relacionada con el propio Malayo a pesar de la sociedad muy diferente, centrada en el longhouse, arroz y cazacabezas que vino a definir la cultura de Iban en la selva naraní. La tradición oral y las historias migratorias de Iban describen un movimiento gradual fuera de la región del río Kapuas del oeste de Borneo, empujando constantemente a lo largo de los sistemas fluviales de lo que ahora es Sarawak en busca de tierras frescas para su cultivo cambiante, una expansión incansable que continuará durante siglos."

 komering_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos de la cuenca del río Komering', 'KOMERING_GLOSS')] en el año [DATE.GetYear]"
 KOMERING_GLOSS: "El pueblo komering toma su nombre del río a lo largo de cuyas orillas se establecieron en Sumatra del Sur, sus tradiciones lingüísticas y de derecho consuetudinario estrechamente vinculadas al mundo étnico más amplio de Lampung más al sur. Tradicionalmente contaba entre las comunidades de derecho consuetudinario de Pepadun que trazaban el descenso de la migración interior en lugar de las comunidades costeras Saibatin del mundo Lampung, el Komering desarrolló su propia identidad fluvial distinta, mientras que seguían siendo parte de la misma esfera cultural y lingüística más amplia que sus parientes Lampung."

 banjar_history_loc: "Se formó a partir de [CULTURE.GetName] [Glossary('colonos que se casan con los', 'BANJAR_GLOSS')] [TARGET_CULTURE.GetName] alrededor del año [DATE.GetYear]"
 BANJAR_GLOSS: "El pueblo banjar surgió a lo largo del delta del río Barito del sudeste Borneo de la fusión de comerciantes y colonos malayos, atraídos a la región por su posición estratégica en las rutas comerciales marítimas que unen el Mar de Java al archipiélago más amplio, con la población indígena Ngaju Dayak del interior del río. Esta fusión de la influencia comercial e islámica de la costa malaya con el mundo del Dayak fluvial produjo una identidad y un lenguaje banjar distintos, uno llevado adelante por generaciones de familias malayo-dayak cuyos medios de vida comerciales y de origen fluvial, construidos sobre pimienta, diamantes y otros bienes forestales, definieron la vida comercial del sudeste de Borneo mucho antes de que cualquier gobernante ató su nombre a una corona."

 burmese_history_loc: "Se formó a partir de [CULTURE.GetName] [Glossary('colonizadores fusionados con el último', 'BURMESE_GLOSS')] [TARGET_CULTURE.GetName] alrededor del año [DATE.GetYear]"
 BURMESE_GLOSS: "El Bamar migra al sur en el valle de Irrawaddy desde el norte a través de los siglos VII a IX, presionado hacia adelante por el reino de Nanzhao en expansión de Yunnan. Cuando las propias devastadoras redadas de Nanzhao rompieron el poder Pyu en Halin en 832, dispersando miles de cautivos a Yunnan y dejando un vacío político en el Alto Birmania, los guerreros Bamar se mudaron a la brecha resultante y fundaron una ciudad de guarnición en Bagan en el Irrawaddy. En lugar de desplazar a la población Pyu existente, los Bamar se establecieron entre ellos, y a lo largo de los siglos siguientes los dos pueblos se fusionaron gradualmente: planificación urbana Pyu, Devoción budista, e incluso elementos del escritura Pyu que se alimentan directamente en lo que se convertiría en la civilización clásica de Birmania, mientras que el propio lenguaje Pyu se entremezclaba en uso diario hasta finales del siglo XII antes de que sus oradores fueran plenamente absorbidos en la nueva identidad birmana."

 rakhine_history_loc: "Se formó a partir de [CULTURE.GetName] [Glossary('colonos que desplazan', 'RAKHINE_GLOSS')] [TARGET_CULTURE.GetName] gobernantes de Arakan alrededor del año [DATE.GetYear]"
 RAKHINE_GLOSS: "Durante siglos antes de que cualquier población de habla burguesa llegara a la costa arakan, la región era el hogar de la dinastía Chandra de Vesali, una población india cuyo sánscrito inscripciones, religión budista hindú y mahayana, y el carácter 'reuniendo al pueblo de Bengal' lo dejó firmemente dentro de la órbita cultural de la costa bengal en lugar del valle de Irrawaddy. Los colonos burmanes sólo comenzaron a cruzar las montañas del Yoma Arakan en el siglo IX, y la fusión entre estos recién llegados y la población de Vesali, ya existente, de Bengali, fue lo suficientemente gradual que el nombre Rakhine no aparece en inscripciones hasta el siglo XII. La identidad Rakhine resultante llevó adelante la profunda herencia budista e inspirada en Bengali de esta población mayor, incluso cuando el discurso burgués y las estructuras políticas llegaron a dominar la costa."

 achang_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos de la frontera Yunnan-Myanmar', 'ACHANG_GLOSS')] en el año [DATE.GetYear]"
 ACHANG_GLOSS: "El Achang traza su ascendencia a las migraciones Di-Qiang que llevaron a pueblos de habla tibetano-burguesa al sur de la cuenca del río Amarillo superior a las montañas de Yunnan en profunda antigüedad. Los registros chinos de la dinastía Tang describen a sus antepasados como el Xunchuan, ya establecido como un pueblo tributario del reino nanzhao en ascenso, viviendo esparcidos a lo largo de los valles de los ríos Jinsha, Lancang y Nu del Yunnan occidental mucho antes de su eventual asentamiento de la cuenca Dehong en la frontera de Myanmar. Centurias de contacto con Han, Bai, Dai, y eventualmente vecinos burmeses a lo largo de esta región encrucijada estrataron nuevas influencias sobre el antiguo núcleo lingüístico de Di-Qiang, pero las propias raíces de Achang llegan a algunos de los habitantes más antiguos de las tierras altas de Yunnan."

 hani_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos de las tierras altas de Nanzhao', 'HANI_GLOSS')] en el año [DATE.GetYear]"
 HANI_GLOSS: "Como el rey Piluoge unificó las seis provincias de Yunnan en el reino de Nanzhao por los 730, los pueblos de habla yi de la meseta se pusieron bajo un único poder de expansión por primera vez, y las laderas adosadas por encima de los valles del río núcleo de Nanzhao se convirtieron en el hogar de comunidades que llevarían adelante su propia identidad distinta, incluso cuando la corte de Nanzhao dominaba las tierras bajas. Los Hani construyeron una elaborada tradición de cultivo de arroz en terraza en estas pistas de montaña, una maestría agrícola de terrenos empinados que les permiten prosperar en el país el estado de Nanzhao basado en el valle nunca absorbido completamente en su propia administración directa."

 lisu_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos de las tierras altas de Nanzhao', 'LISU_GLOSS')] en el año [DATE.GetYear]"
 LISU_GLOSS: "Mientras el rey Piluoge unificó las seis provincias de Yunnan en el reino de Nanzhao por los años 730, las comunidades a lo largo de las montañas de la meseta se encontraron en el borde de un nuevo y creciente poder sin nunca ser arrastrado por completo en su administración de tierras bajas. El Lisu, combinando la caza, la agricultura swidden y las largas rutas comerciales de las tierras altas, se extendió gradualmente hacia el suroeste de las cordilleras hacia lo que ahora es el norte de Myanmar y Tailandia a lo largo de los siglos que siguieron, llevando su propio idioma y costumbres a través de un tramo inusualmente amplio del sudeste asiático más allá del alcance directo de Nanzhao."

 assamese_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos del valle de Brahmaputra', 'ASSAMESE_GLOSS')] en el año [DATE.GetYear]"
 ASSAMESE_GLOSS: "El reino de Kamarupa, en su altura que se extiende por el valle de Brahmaputra y hacia el norte de Bengala y Bután, habló Kamarupi Prakrit, una lengua Indo-Aria media atestiguada en los Prakritisms esparcidos a través de sus inscripciones reales de otro modo sánscrito. Para el siglo VII, este discurso local ya había comenzado a diferenciar del Prakrit de Bengal y Odisha a su oeste, un estudiante de divergencia atribuye en parte a la gran población no aria Austroasiática y Tibeto-Burman del valle adoptando la lengua Indo-Aria entrante en sus propios términos. Este linaje arraigado de Kamarupa, a lo largo de los siglos siguientes, maduraría en el lenguaje assameso, llevando adelante una identidad literaria y lingüística separada de Bengali a pesar de su ascendencia compartida de Prakrit."

 rajbongshi_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos occidentales de los estados sucesores de Kamarupa', 'RAJBONGSHI_GLOSS')] en el año [DATE.GetYear]"
 RAJBONGSHI_GLOSS: "Como Kamarupi Prakrit diferenciaba a lo largo de los siglos después de la fragmentación del gran reino, su discurso se dividió a lo largo de una línea este-oeste: las comunidades orientales del valle de Brahmaputra se desarrollaron a principios de Assamese, mientras que las comunidades occidentales alrededor del reino Kamata y Cooch Behar desarrollaron su propio discurso proto-Kamta a partir de 1250. Los Rajbongshi llevan adelante este linaje occidental de Kamarupa, su lenguaje e identidad configurados por la posición del reino Kamata en la frontera entre el mundo de habla bengalí al sur y el valle de Brahmaputra de habla assamesa al este."

 chutia_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos sucesores del reino de Kamarupa fragmentado', 'CHUTIA_GLOSS')] en el año [DATE.GetYear]"
 CHUTIA_GLOSS: "Cuando el antiguo reino de Kamarupa finalmente se fragmentó en el siglo XII después de ocho siglos de dominio sobre el valle de Brahmaputra, varias poblaciones sucesoras surgieron del vacío, entre ellas la comunidad que vendría a ser gobernada por la dinastía Chutia en los extremos orientales del valle. La sociedad Chutia aprovechó la misma herencia lingüística de Kamarupa-descendida que sus vecinos de Assamese y Rajbongshi, capas arriba de una población Bodo-Kachari sustancial cuya propia herencia tibetano-burguesa dio a la comunidad Chutia emergente un carácter claramente mezclado, incluso como su discurso favoreció la lengua descompuesta de Prakrit de sus precursores de Kamarupa."

 bhojpuri_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos de la llanura del Gangetic oriental', 'BHOJPURI_GLOSS')] en el año [DATE.GetYear]"
 BHOJPURI_GLOSS: "La población agrícola del medio Ganges, extendida por lo que ahora es el este de Uttar Pradesh y el oeste de Bihar, vivió el mismo colapso del orden que siguió a la muerte de Harsha, sus aldeas y ciudades de mercado atrapados en décadas de inestabilidad antes de la elección de Gopala como rey alrededor de 750 finalmente restaurado gobierno organizado a la región más amplia. Este retorno de la administración asentada permitió a los agricultores de la llanura de habla Bhojpuri, comerciantes, y la gente retoma la vida agrícola y comercial constante que el caos anterior había perturbado, y era esta misma población reasentada, distinto del país de Magadha a su este y las viejas tierras de Kosala a su oeste, que llevó adelante la lengua y la identidad Bhojpuri en los siglos que siguieron."

 maithili_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos de la región de Mithila', 'MAITHILI_GLOSS')] en el año [DATE.GetYear]"
 MAITHILI_GLOSS: "Maithili desciende de la misma familia de los vecinos de Magadhi Prakrit-rooted Eastern Apabhramsha como sus vecinos de Bhojpuri y Magahi, pero era la propia población de Mithila, generaciones de agricultores, eruditos y poetas asentadas alrededor de sus antiguas ciudades y templos, que dieron a Maithili discurso una profundidad literaria distintamente su propia. Este orgullo local en el lenguaje y el aprendizaje, celebrado más tarde en los versos de Vidyapati, puso Maithili en un camino hacia convertirse en uno de los más literariamente desarrollados de la familia del idioma bihari, su identidad tanto ligada a la cultura intelectual y devocional de Mithila como a cualquier límite político único."

 magadhi_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos de la antigua tierra de Magadha', 'MAGADHI_GLOSS')] en el año [DATE.GetYear]"
 MAGADHI_GLOSS: "Magadha había sido una vez la sede de los imperios Maurya y Gupta, pero después de la muerte de Harsha en 647 los granjeros y pueblos de la región sufrieron décadas de matsyanyaya, 'la regla de los peces,' un caos de jefes de guerra que se apoderan de los débiles. Esta anarquía terminó por fin alrededor de 750, cuando la población de la región más amplia se unió detrás de la nueva realeza de Gopala y la estabilidad su regla restaurada a Magadha por primera vez en un siglo. El discurso de Magadhi, llevando el nombre y el orgullo de una de las poblaciones más prestigiosas de la India, tomó su forma moderna distinta, ya que esta misma comunidad asentada, agrícola y comercial reconstruyó su vida cotidiana bajo el orden renovado de las generaciones siguientes."

 nagpuri_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos de la meseta Chota Nagpur', 'NAGPURI_GLOSS')] en el año [DATE.GetYear]"
 NAGPURI_GLOSS: "Nagpuri, también conocido como Sadri, emergió de la misma familia de lenguas bihari de Magadhi, desprovista de Magadhi, como Bhojpuri y Magahi, pero se arrastró no en la llanura Gangetic propia sino en la meseta de Chota Nagpur boscosa al sur. Allí, este discurso de Indo-Aria se convirtió en la franja de lingua cotidiana entre una población de meseta que incluyó un número sustancial de Munda y otros pueblos de habla autóstica, que adoptaron Nagpuri para el comercio y la vida cotidiana, mientras que con frecuencia conservan sus propios idiomas para los asuntos rituales y comunitarios, dando a Nagpuri un alcance inusualmente amplio a través de una región de tierras altas lingüísticamente diversas."

 malvi_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos de la meseta de Malwa', 'MALVI_GLOSS')] en el año [DATE.GetYear]"
 MALVI_GLOSS: "Malvi comparte sus raíces lingüísticas Rajasthani con los pueblos de Marwar, Mewar, y los otros principados del mundo Rajput, pero tomó forma no en las llanuras áridas de Rajasthan propia pero en la fértil meseta volcánica de Malwa más al sureste. Esta geografía distinta, rica en agua y agricultura en comparación con el corazón de Rajasthani, promovió una identidad regional y un dialecto propio, incluso cuando los hablantes de Malvi mantuvieron la herencia lingüística y cultural más amplia de sus vecinos occidentales."

 kumaoni_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos del Kumaon Himalaya', 'KUMAONI_GLOSS')] en el año [DATE.GetYear]"
 KUMAONI_GLOSS: "Los Kumaoni comparten sus raíces lingüísticas de Pahari y el patrimonio ancestral de Khas con los pueblos de habla nepalí más al este, ambos descendiendo de la misma población amplia de colonos montañosos de Indo-Aria que se extendieron a través de las estribaciones centrales de Himalaya en el período medieval temprano. La geografía política atrajo un límite entre ellos que el lenguaje por sí solo no lo hizo: las colinas de Kumaon cayeron dentro de una esfera separada de principados de colinas distintos de la unificación que posteriormente forjaría un solo reino de habla nepalesa más al este, preservando Kumaoni como su propia lengua regional dentro de la familia lingüística más amplia de Pahari-Khas."

 kutchi_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos de la península de Kutch', 'KUTCHI_GLOSS')] en el año [DATE.GetYear]"
 KUTCHI_GLOSS: "Kutchi comparte sus raíces lingüísticas sindhi con los pueblos del Indus delta más al oeste, la propia posición de la península de Kutch como una frontera semiaislada entre Sindh y Gujarat configurando una identidad regional distinta, incluso mientras su lenguaje permanecía firmemente dentro del pliegue de Sindhi. Larga una encrucijada del comercio marítimo entre Gujarat, Sindh y el mundo del Mar Arábigo, Kutch desarrolló una cultura mercante y un dialecto propio, sin perder completamente sus profundos vínculos lingüísticos con el mundo indus de habla sindhi al norte."

 kathiawari_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos de la península de Kathiawar', 'KATHIAWARI_GLOSS')] en el año [DATE.GetYear]"
 KATHIAWARI_GLOSS: "Kathiawari, también conocido como Saurashtra, comparte sus raíces lingüísticas Gujarati con los pueblos continentales a su este, pero el propio grupo de pequeños estados principes independientes de la península de Kathiawar fomentaba un dialecto e identidad regional distinto dentro del mundo más amplio de habla guerárati. Nombrada para los clanes pastorales Kathi que establecieron la península y le dieron su nombre, los muchos reinos pequeños de Kathiawar y su larga costa orientada hacia el comercio marítimo a través del Mar Arábigo lo pusieron en su propia trayectoria regional, incluso mientras permanecía lingüísticamente parte de la familia más amplia de Gujarati."

 gujarati_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos de la tierra natal de Gurjaratra', 'GUJARATI_GLOSS')] en el año [DATE.GetYear]"
 GUJARATI_GLOSS: "La población de Gurjaratra rastreó su nombre y gran parte de su identidad al pueblo de Gurjara, cuya presencia a finales del siglo VI en la región está demostrada incluso si sus orígenes más profundos siguen siendo debatidos entre la migración extranjera y el desarrollo indígena de los países montañosos alrededor del Monte Abu. Esta población desprovista de Gurjara cultivaba y comercializaba en toda la región durante generaciones bajo una sucesión de dinastías dominantes, la mayoría de los Maitrakas, cuyos tres siglos de gobierno estable de Vallabhi permiten a la población construir uno de los grandes centros de aprendizaje budista de la India sin necesidad de mirar a ningún capital imperial distante. Fue esta población asentada, cada vez más autosuficiente de Gurjara, no la dinastía Maitraka misma, que llevó el antiguo nombre tribal hacia adelante como una identidad diferenciada de Gujarati mucho después de que los Maitrakas mismos hubieran pasado de la historia."

 awadhi_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos del valle del río Sarayu', 'AWADHI_GLOSS')] en el año [DATE.GetYear]"
 AWADHI_GLOSS: "La población del valle del río Sarayu había vivido a la sombra del antiguo prestigio de Kosala durante siglos, agricultores y peregrinos por igual atraídos al legendario estatus de Ayodhya como la patria de Rama y una cuna de los movimientos de reforma budista y jain. Este profundo orgullo religioso y cultural nunca dejó a la población del valle incluso después de que la independencia política de Kosala hubiera dado paso a imperios más grandes, y cuando la dinastía Maukhari se levantó a la prominencia en la cercana Kannauj en los siglos sexto y séptimo, los granjeros y pueblos del valle encontraron su antigua herencia de Kosala arrastrada hacia el centro de la vida india del Norte. Era esta población, su identidad arraigada en la leyenda de Ayodhya en lugar de en cualquier casa dominante, que llevaba el nombre y la lengua Awadhi hacia adelante en el carácter medieval de la región."

 hindustani_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos del valle del río Yamuna', 'HINDUSTANI_GLOSS')] en el año [DATE.GetYear]"
 HINDUSTANI_GLOSS: "La población agrícola y comercial del doab Yamuna-Ganga había vivido bajo el prestigio del viejo discurso de Surasena Shauraseni Prakrit desde los días de las cortes Kushan y Gupta en Mathura, un pueblo agrícola establecido cuyo idioma llevaba real peso literario incluso después de que la independencia política de Surasena se había desvanecido en la memoria. Cuando el imperio de corta vida de Harsha se derrumbó después de su muerte en 647 y ningún poder único inmediatamente lo sustituyó, esta misma población doab se encontró gobernando sus propios asuntos bajo un parche de pequeños señores regionales en lugar de cualquier corte unificador distante. Era esta nueva población doab autosuficiente, todavía hablando la vieja lengua desprovista de Shauraseni de sus antepasados de Surasena, que dio lugar a una identidad claramente hindú, de pie por su cuenta en lugar de bajo la sombra de cualquier dinastía."

 oriya_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos de las llanuras costeras orientales', 'ORIYA_GLOSS')] en el año [DATE.GetYear]"
 ORIYA_GLOSS: "La población costera de Kalinga había cultivado las fértiles llanuras entre el delta Mahanadi y el mar durante siglos, un pueblo marítimo y agrícola cuyo comercio marítimo llevaba a los colonos kalinganos hasta el sudeste asiático, incluso cuando la fortuna política del viejo reino subió y cayó. La propia identidad de esta población costera, forjada en memoria de la feroz resistencia de Kalinga a los siglos de Ashoka antes y sostenida por su continuo comercio exterior, encontró una renovada expresión política bajo la dinastía de Shailodbhava en el siglo VII, cuyo templo-construcción y patronato de la corte dieron a la población existente de la región un nuevo sentido de propósito compartido. Era esta misma población costera de construcción del templo, no la dinastía misma, que llevó adelante el antiguo orgullo de Kalinga hacia lo que sería reconocido como Odia."

 bengali_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos del delta del Gangetic inferior', 'BENGALI_GLOSS')] en el año [DATE.GetYear]"
 BENGALI_GLOSS: "La población del delta Gangetic inferior había cultivado su suelo alimentado por inundaciones durante siglos bajo la herencia común Prakrit de la India oriental, un pueblo agrícola establecido cuyo discurso ya se alejaba de la de sus vecinos hasta el Ganges mucho antes de que cualquier rey diera ese nombre a la deriva. Cuando Shashanka unificó brevemente el delta bajo la bandera de Gauda a principios del siglo VII, no creó esta población ni su discurso, sino la estabilidad y la administración compartida de su reinado que los agricultores, comerciantes y habitantes de la región se reconozcan por primera vez como un pueblo único, un reconocimiento que superó el propio colapso político de su reino. Fue esta población delta, no la dinastía que brevemente los gobernó, que llevó el nombre de Gauda y la lengua de Bengali hacia adelante a través de los siglos de fragmentación y reunificación que siguieron."

 marathi_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos de la meseta de Deccan', 'MARATHI_GLOSS')] en el año [DATE.GetYear]"
 MARATHI_GLOSS: "Los pueblos de la meseta de Deccan habían cultivado y negociado a través de su suelo negro volcánico durante siglos, su discurso de Maharashtri Prakrit con suficiente prestigio literario, incluso bajo la antigua dinastía de Satavahana, para ser utilizados para ciertos personajes en el drama clásico del sánscrito. El propio sentido de la población de la meseta se agudizó considerablemente en el siglo VII, cuando la dinastía de Chalukya pudo comprobar las ambiciones del norte Gangetic, repeliendo famosomente una invasión por el emperador Harsha mismo, dio a los agricultores y pueblos decán común algo concreto para sentirse orgullosos y unidos por. Fue esta población de meseta, aprovechando generaciones de la herencia literaria mahayrashtri y confiando en su capacidad de mantener su propia contra el norte, que llevó el antiguo nombre de Deccan hacia adelante como una clara identidad de Marathi."

 hindustani_proper_history_loc: "Se formó a partir de [CULTURE.GetName] [Glossary('de los oradores que absorben la lengua judicial', 'HINDUSTANI_PROPER_GLOSS')] [TARGET_CULTURE.GetName] gobernaciones alrededor del año [DATE.GetYear]"
 HINDUSTANI_PROPER_GLOSS: "La fundación de la Sultanía de Delhi en 1206 llevó a los tribunales persas y turcos a gobernar permanentemente sobre el corazón de habla hindú del doab Yamuna-Ganga, y los siglos de administración, poesía y contacto diario que siguieron dejaron su marca en el idioma mismo. Los poetas de la corte como Amir Khusrow comenzaron a tejer vocabulario persa y árabe en el verso de Hindavi, produciendo un nuevo registro cortesano de la vieja lengua hindú que retuvo sus huesos gramaticales Sauraseni mientras absorbía todo un vocabulario de gobernanza, filosofía, y cultura refinada de sus gobernantes turco-persas, La construcción de las bases lingüísticas para lo que en los siglos posteriores se ramificaría aún más en Hindi y Urdu."

 sambalpuri_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos de las tierras altas occidentales', 'SAMBALPURI_GLOSS')] en el año [DATE.GetYear]"
 SAMBALPURI_GLOSS: "Mientras que la Odia de las llanuras costeras se desarrolló bajo la influencia constante de las antiguas tradiciones marítimas y cortesanas de Kalinga, las tierras altas del interior de Sambalpur siguieron su propio camino, formada mucho más por la proximidad a las comunidades tribales adivasi que por el comercio marítimo y la cultura cortesana sánscrita de la costa. Este carácter interior, más inflexible tribalmente, apartó a Sambalpuri como una identidad regional distinta, incluso mientras seguía siendo parte firmemente del mundo lingüístico de Odia más amplio."

 kannauji_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos del Triángulo Kannauj', 'KANNAUJI_GLOSS')] en el año [DATE.GetYear]"
 KANNAUJI_GLOSS: "Las ciudades de Kannauj y los pueblos agrícolas circundantes vivieron durante siglos en el centro de uno de los cruces más ocupados del norte de la India, su mercado y el campo repetidamente sobrecorrieron y reasentaron mientras la ciudad cambió de manos entre poderes rivales en la larga lucha del Triángulo de Kannauj. Este constante torbellino de contacto, reasentamiento y exposición a cualquier corte que actualmente celebraba la ciudad dejó el discurso de la población circundante inusualmente pulido y gramáticamente conservador en comparación con sus vecinos, un dialecto de prestigio que superó a cualquiera de los poderes individuales que alguna vez habían luchado por su patria."

 haryanvi_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos de la tierra entre ríos', 'HARYANVI_GLOSS')] en el año [DATE.GetYear]"
 HARYANVI_GLOSS: "La población agrícola de las llanuras al oeste de Delhi, regada por los Yamuna y sus afluentes, se estableció alrededor de Kurukshetra, el campo donde la tradición Védica coloca la gran guerra del Mahabharata y recuerda como el asiento paradigmático del ritual y el aprendizaje correctos. Este prestigio religioso atrajo un flujo constante de peregrinos y eruditos a la región por un milenio y más, y generaciones de agricultores y pastores locales, hospedando y proporcionando a estos visitantes incluso como el antiguo poder político kuru que había gobernado una vez la zona se desvaneció en la memoria, construyó su propio carácter regional contundente y directo alrededor de este papel duradero como cuidadores de terreno sagrado. Era esta misma población agrícola asentada, no cualquier dinastía dominante, que llevaba la lengua y la identidad Haryanvi hacia adelante a través de los siglos de cambio político que siguió."

 braji_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos de la tierra natal de Krishna', 'BRAJI_GLOSS')] en el año [DATE.GetYear]"
 BRAJI_GLOSS: "La región Braj alrededor de Mathura y Vrindavan, antigua tierra del antiguo reino de Surasena y venerado en la tradición como la patria de Krishna, desarrolló un dialecto hindú profundamente ligado a la poesía y la peregrinación devocionales. Braj Bhasha iría a convertirse en uno de los grandes idiomas literarios del verso devocional medieval del norte de la India, su prestigio como la lengua de la propia patria de Krishna que la llevaba más allá de las fronteras regionales del dialecto."

 mewati_history_loc: "Se formó a partir de [CULTURE.GetName] [Glossary('speakers blending with', 'MEWATI_GLOSS')] [TARGET_CULTURE.GetName] en la frontera entre Delhi y Rajastán alrededor del año [DATE.GetYear]"
 MEWATI_GLOSS: "La región de Mewat atravesó la frontera entre las llanuras Yamuna de habla hindú y el país Braj hacia el sur, un territorio fronterizo cuyo discurso absorbió influencia de ambos dialectos vecinos sin pertenecer plenamente a ninguno de los dos. Larga casa de la comunidad Meo y su propia mezcla de costumbres y creencias regionales, la ubicación de Mewat encadenó las rutas que unen Delhi a Rajasthan dio al dialecto de la región un carácter híbrido formado tanto por el comercio y los viajes como por la agricultura asentada."

 bundeli_history_loc: "Se formó a partir de [CULTURE.GetName] [Glossary('speakers blending with', 'BUNDELI_GLOSS')] [TARGET_CULTURE.GetName] en la meseta Bundelkhand alrededor del año [DATE.GetYear]"
 BUNDELI_GLOSS: "El robusto país de la meseta de Bundelkhand se sentó en el punto de encuentro del doab de habla hindú a su norte y las tierras de habla Awadhi a su este, y la población que cultivaba y asentaba este territorio limítrofe se basaba en las tradiciones de expresión vecinas en una medida prácticamente igual a medida que las familias y los comerciantes se movieron hacia atrás y hacia adelante a través de la frontera cambiante de la mes generaciones. El terreno fracturado y fortificado de la región mantuvo a estas comunidades un poco separadas de las poblaciones más amplias de ambos lados, y fue esta misma población de mesetas asentada, no cualquier único clan gobernante, que llevó el discurso y el carácter de Bundeli resultante hacia adelante como su propia identidad distinta."

 bagheli_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos de la meseta Baghelkhand', 'BAGHELI_GLOSS')] en el año [DATE.GetYear]"
 BAGHELI_GLOSS: "Baghelkhand toma su nombre del clan Baghel Rajput que vino a gobernar el país de la meseta al sureste de Bundelkhand, y el discurso de Awadhi-descendido local que se desarrolló bajo su regla absorbió suficiente distintividad regional sobre las generaciones para ser reconocido como su propio dialecto. Trasladado por el país montañoso de las llanuras más controvertidas más al norte, Baghelkhand conserva una forma relativamente conservadora de discurso de Awadhi, incluso cuando el lenguaje continúa evolucionando en otros lugares."

 marwari_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos del país del desierto de Thar', 'MARWARI_GLOSS')] en el año [DATE.GetYear]"
 MARWARI_GLOSS: "Marwar, el árido país del desierto centrado en Jodhpur, desarrolló un dialecto Rajasthani y una cultura mercante conformada por las exigencias de su entorno duro, donde el comercio de larga distancia a través del desierto de Thar se convirtió en el centro de la identidad de Marwari como los famosos clanes guerreros de la región. Las familias comerciales de Marwari seguirían construyendo redes comerciales que iban más allá del propio Rajastán, llevando su dialecto y su acumen empresarial a través del subcontinente en los siglos que siguieron."

 mewari_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos de la región montañosa de Aravalli', 'MEWARI_GLOSS')] en el año [DATE.GetYear]"
 MEWARI_GLOSS: "Mewar, centrada en la ciudad fortaleza de Chittorgarh en medio de las colinas de Aravalli, desarrolló su propio orgulloso dialecto Rajasthani inseparable de la reputación de la región como el corazón de Rajput honor marcial y resistencia prolongada a la conquista exterior. El terreno accidentado y desfavorecido de Mewar fomentaba una tradición política ferozmente independiente que llegaría a definir la identidad de la región tanto como su dialecto distintivo del discurso de Rajasthani."

 dhundari_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos de las llanuras de Dhundhar', 'DHUNDARI_GLOSS')] en el año [DATE.GetYear]"
 DHUNDARI_GLOSS: "La región de Dhundhar alrededor de Amber y más tarde Jaipur desarrolló un dialecto Rajasthani formado por su terreno relativamente más abierto y fértil en comparación con el país desierto de Marwar más al oeste, fomentando un centro político y económico que eventualmente haría Jaipur una de las ciudades más prósperas de Rajasthan. Esta geografía comparativamente más suave dio a los gobernantes y comerciantes de Dhundhar como un carácter más resuelto y agrícola que sus vecinos del desierto."

 harauti_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos de la meseta de Hadoti', 'HARAUTI_GLOSS')] en el año [DATE.GetYear]"
 HARAUTI_GLOSS: "Hadoti, el país de la meseta alrededor de Kota y Bundi en el sureste de Rajasthan, desarrolló su propio dialecto Rajasthani en algo de un alejamiento de las tierras del desierto de Marwar y las fortalezas de la colina de Mewar, sus valles de ríos relativamente fértiles que sustentan una identidad regional distinta dentro del mundo más amplio de Rajasthani. El paso del río Chambal a través de la región le dio a Hadoti un pie algo más agrícolamente seguro que la mayor parte del resto del árido Rajastán."

 ahirwati_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos del territorio fronterizo de Ahirwal', 'AHIRWATI_GLOSS')] en el año [DATE.GetYear]"
 AHIRWATI_GLOSS: "Ahirwal, la frontera donde Rajasthan se encuentra con Haryana, tomó su nombre de las comunidades pastorales de Ahir que dominaron durante mucho tiempo la economía ganadera de la región, y el dialecto Rajasthani que se desarrolló allí absorbió suficiente carácter local de este patrimonio pastoral para ser reconocido como su propio discurso distintivo. Sentados al borde del mundo lingüístico Rajasthani, los oradores de Ahirwati mantenían estrechos lazos con sus parientes Rajasthani al oeste y sus vecinos Haryanvi al norte."

 konkani_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos de la franja costera occidental', 'KONKANI_GLOSS')] en el año [DATE.GetYear]"
 KONKANI_GLOSS: "La estrecha franja costera de Konkan, enmarcada entre los Ghats Occidentales y el Mar Arábigo, desarrolló su propio dialecto distintivo de Marathi modelado por siglos de comercio marítimo y el relativo aislamiento geográfico de la región desde el interior de la meseta de Deccan. Esta orientación costera le dio a Konkani un carácter propio, la fortuna de sus hablantes ligada tanto a los carriles marinos del Mar Arábigo como al mundo más amplio de Maharashtri-descendido del Deccan detrás de ellos."

 malayali_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos de la costa de Kerala', 'MALAYALI_GLOSS')] en el año [DATE.GetYear]"
 MALAYALI_GLOSS: "La población costera de Kerala había formado desde hace mucho tiempo parte del mundo tamil más amplio del sur de la India, sus agricultores, comerciantes y comunidades del templo ligadas por el lenguaje y la cultura al corazón tamil más al este, incluso cuando los Ghats occidentales dieron a la costa una geografía distinta de su propia. Desde el siglo IX en adelante esta población creció cada vez más orientada hacia el Mar Arábigo, su comercio, matrimonios y vida cotidiana cada vez más ligada a la propia costa monzón de Kerala y su lucrativo comercio de especias con los mundos árabes y europeos más tarde que al interior del Tamil. Esta creciente orientación costera, sostenida a lo largo de generaciones por el comercio marítimo que tocó a casi todas las familias a lo largo de la costa, cristalizó en un idioma malayalam separado y la identidad malayali para el siglo X, aun cuando nunca cortó totalmente sus profundas raíces lingüísticas tamiles."

 nasrani_history_loc: "Se formó a partir de [CULTURE.GetName] [Glossary('convertidos que se unen a las comunidades judías de comercio', 'NASRANI_GLOSS')] [TARGET_CULTURE.GetName] en la costa malabar alrededor del año [DATE.GetYear]"
 NASRANI_GLOSS: "La tradición sostiene que el apóstol Tomás mismo predicó a lo largo de la costa malabar y fundó allí iglesias en el primer siglo, arraigando entre una sociedad costera de Kerala ya profundamente enredada en las redes comerciales marítimas del Mar Arábigo, donde las comunidades mercantes judías habían establecido generaciones antes siguiendo las mismas rutas de especia y pimienta. Los primeros convertidos cristianos a lo largo de esta costa construyeron su comunidad sobre estas conexiones comerciales existentes y la misma población ribereña de la que la propia comunidad judía de la región había atraído a muchos convertidos y conexiones, produciendo una identidad claramente cristiana malabari, orgullosa de su origen apostólico y sus profundas raíces en el mundo comercial cosmopolita de Kerala."

 knanaya_history_loc: "Se formó a partir de [CULTURE.GetName] [Glossary('migrantes que se unen a la comunidad cristiana de Santo Tomás', 'KNANAYA_GLOSS')] [TARGET_CULTURE.GetName] alrededor del año [DATE.GetYear]"
 KNANAYA_GLOSS: "La tradición sostiene que un comerciante cristiano llamado Tomás de Cana dirigió una migración sustancial de las familias cristianas persas y mesopotamianas a la costa malabar, otorgó tierras y privilegios por el gobernante local y acogió con beneplácito la actual comunidad cristiana de Santo Tomás que Nasrani de Kerala ya había establecido para generaciones. En lugar de disolver en la comunidad más amplia de Nasrani, estos recién llegados mantuvieron su propia identidad y sus costumbres matrimoniales endogamas, preservando su ascendencia persa y mesopotamiana y conexión con la Iglesia del Este como un punto de orgullo incluso cuando se convirtieron plenamente enraizados en el mundo cristiano costero de Kerala."

 qufs_history_loc: "Se separó de [CULTURE.GetName] [Glossary('de la costa de Makran', 'QUFS_GLOSS')] alrededor del año [DATE.GetYear]"
 QUFS_GLOSS: "Los geógrafos árabes y persas medievales que escribían en la costa de Makran casi siempre emparejaban dos nombres: el Qufs y el Baloch, pueblos gemelos de la misma costa rugosa cuya reputación como piratas y asaltantes hicieron de la frase 'Qufs wa Baluch' un prefacio por peligro en los carriles marinos que unen el Golfo Pérsico a la India. Donde el Baloch se extendió más ampliamente a través de las colinas y llanuras interiores, el Qufs retenido al estrecho, propia franja costera montañosa, sus medios de vida construidos tanto alrededor de la redada que pasa el envío alrededor del pastoreo y la pesca, una clara identidad marítima-raider que los geógrafos de la era Abbasid se encargaban de distinguir de sus vecinos Baloch, incluso cuando ambos pueblos compartían una herencia lingüística iraní común."

 aschomi_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos de las tierras altas de Larestan', 'ASCHOMI_GLOSS')] alrededor del año [DATE.GetYear]"
 ASCHOMI_GLOSS: "La región de Larestan del sur de Fars se sentó aparte de las grandes carreteras que conectan las principales ciudades de Irán, su árido terreno montañoso y desierto que ofrece poco para atraer conquistadores o llevarlo a la órbita de cualquier poder dominante. Este aislamiento permite a las comunidades locales gobernar sus propios asuntos con independencia inusual, sus costumbres y su estructura social moldeadas más por las exigencias del desierto y la supervivencia de las montañas que por los tribunales y las ciudades caravanas del mundo persa más amplio."

 bandari_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos de la costa del Golfo Pérsico', 'BANDARI_GLOSS')] alrededor del año [DATE.GetYear]"
 BANDARI_GLOSS: "El Bandari y sus parientes de Bashkardi establecieron la costa calurosa y baja del Golfo Pérsico, un mundo marítimo orientado hacia el exterior por el agua hacia Arabia, India, y la costa de África Oriental en lugar de interior hacia los propios centros de poder de la meseta iraní. Las generaciones del comercio de dhow, el buceo de perlas y el comercio de monzón de temporada dieron a la costa un carácter cosmopolita y marinero muy distinto de la sociedad agraria y pastoral del interior, incluso cuando el discurso de Bandari permanecía firmemente arraigado en la misma familia lingüística iraní como sus vecinos interiores."

 luri_history_loc: "Of debated origin, possibly [Glossary('descendieron de los pueblos antiguos de Elam y los Zagros', 'LURI_GLOSS')]"
 LURI_GLOSS: "Los orígenes del pueblo luri permanecen verdaderamente inestables entre los historiadores. Muchos los trazaban a los antiguos Elamitas o Kassites que dominaban una vez las montañas de Zagros y las llanuras debajo de ellos, su lengua e identidad gradualmente se formaban por siglos de contacto con los hablantes persas entrantes hasta que una lengua iraní desplazaba lo que había antes. Otros argumentan por un origen más directo como una tribu mediana o persa que simplemente se adaptó al terreno de Zagros. Las reivindicaciones de un origen kurdo distinto para el Luri descansan en evidencias considerablemente más débiles que cualquiera de estas teorías y generalmente son tratadas con escepticismo por los historiadores serios de la región."

 ethiopian_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos de las tierras altas de Etiopía', 'ETHIOPIAN_GLOSS')] en el año [DATE.GetYear]"
 ETHIOPIAN_GLOSS: "El poder de Aksum, una vez que se extendía por el Mar Rojo para gobernar brevemente incluso Himyarite Yemen, ya había comenzado a erosionar gravemente para el siglo VIII mientras los nómadas Beja presionaban en sus territorios y el control islámico de las rutas comerciales del Mar Rojo desprendían el reino del comercio mediterráneo que había construido su riqueza. A medida que la autoridad política de Aksum se contrajo y finalmente colapsó alrededor de 960, Dios mismo desfalleció como lengua hablada, como era un lenguaje litúrgico sagrado, y los pueblos de las tierras altas que se habían llamado a sí mismos Aksumite comenzaron a formar nuevas identidades regionales de los restos, llevando adelante la fe cristiana de Aksum y el discurso semitico en los reinos sucesores que eventualmente coalesce alrededor de la dinastía Zagwe y sus iglesias de corazón rocoso."

 tigray_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos del corazón de Aksumite', 'TIGRAY_GLOSS')] en el año [DATE.GetYear]"
 TIGRAY_GLOSS: "Los pueblos de Tigray ocuparon el núcleo histórico del propio reino de Aksumite, el país de las tierras altas que rodea inmediatamente a la antigua capital, y como el poder político de Aksum se derrumbó ante las incursiones de Beja y la pérdida del dominio del comercio del Mar Rojo, era esta población de la tierra que heredaba directamente la fe cristiana del reino, sus tradiciones de piedra, y su discurso desprotegido por Dios. Más cerca del antiguo asiento de Aksum que cualquier otro pueblo sucesor, las comunidades de Tigray llevaron adelante la continuidad directa más fuerte con el viejo reino, incluso cuando su estructura política unificada se desmoronó alrededor de ellos."

 argobba_history_loc: "Se separó de [CULTURE.GetName] [Glossary('Comunidades comerciales musulmanas de las tierras altas orientales', 'ARGOBBA_GLOSS')] en el año [DATE.GetYear]"
 ARGOBBA_GLOSS: "A medida que la autoridad de Aksum se desvaneció desde las tierras altas al este de su antiguo territorio central, las comunidades de esta región se orientan cada vez más hacia las redes comerciales islámicas que irradian desde la costa del Mar Rojo y el Golfo de Adén en lugar de hacia los estados sucesores cristianos que se forman más al oeste. Esta orientación llevó a la Argobba al mundo del comercio islámico, incluso cuando su discurso seguía arraigado en la misma herencia etiosemita desprovista por Jesús como sus vecinos cristianos de tierras altas, produciendo un pueblo distinguido tanto por la fe y la orientación comercial como por el lenguaje."

 madan_history_loc: "Se formó a partir de [CULTURE.GetName] [Glossary('tribus que se asientan entre las', 'MADAN_GLOSS')] [TARGET_CULTURE.GetName] de las marismas del sur alrededor [DATE.GetYear]"
 MADAN_GLOSS: "Los vastos humedales en los que convergen los Tigris y Eufrates habían sostenido una población de morada de pantano desde los días del antiguo Sumer, sus aldeas reconstruidas y su forma de vida transmitida por canoa un hilo continuo que corría bajo las sucesivas civilizaciones babilónicas, asirias y arameas que se levantaron y cayeron a través de la llanura mesopotamiana. Las tribus árabes que se asientan a raíz de la conquista del siglo VII adaptaron sus propias tradiciones pastorales y tribales a este mismo mundo anfibio, y generaciones de matrimonios y la vida de pantano compartido tejían poblaciones árabes y de habla aramea mayores juntas en una sola identidad madana, una que continuaba construyendo casas de caña en un estilo apenas cambió de las imágenes talladas en sellos sumerios miles de años antes."

 badawi_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos del interior de Najd', 'BADAWI_GLOSS')] alrededor del año [DATE.GetYear]"
 BADAWI_GLOSS: "Los Badawi representan la tradición beduina en su forma más directa, las tribus de la meseta de Najd en el corazón de la Península Arábiga que mantenían el camino pastoral, hereditario y tribal-genealógico de la vida desde el cual el mundo árabe más amplio trazaba sus propios orígenes. Las comunidades de Najdi Badawi, apartadas del comercio costero y del tráfico de peregrinaciones que reconfiguran Hejazi y la sociedad árabe del Golfo, conservan un dialecto y una estructura social notablemente conservadora, bien después de que las conquistas islámicas hayan llevado la identidad árabe mucho más allá de la península misma."

 bahraini_history_loc: "Se formó a partir de [CULTURE.GetName] [Glossary('colonos entre las guarnición de', 'BAHRAINI_GLOSS')] [TARGET_CULTURE.GetName] en la costa del Golfo [DATE.GetYear]"
 BAHRAINI_GLOSS: "Mucho antes de que la conquista árabe llegara al Golfo, Bahréin y la costa circundante había sido una provincia administrada directamente del Imperio Persa Sassanid, encarcelada por tropas persas y gobernada por funcionarios persas que supervisaban el comercio lucrativo de perlas y el comercio costero de la región. Las tribus árabes que llegan a la estela de la propagación del Islam se establecieron entre esta población administrativa y mercante persa existente en lugar de desplazarla, y las dos comunidades gradualmente se entrelazan a través del comercio, la conversión y el matrimonio, produciendo una identidad árabe del Golfo que mantuvo una cultura persa bajo corriente mucho después de que el propio control político sasánido hubiera terminado."

 omani_history_loc: "Se formó a partir de [CULTURE.GetName] [Glossary('tribus que se asientan entre las', 'OMANI_GLOSS')] [TARGET_CULTURE.GetName] de la costa omaní [DATE.GetYear]"
 OMANI_GLOSS: "La tradición omaní recuerda la gran migración de Azd desde Yemen, tradicionalmente ligada al catastrófico colapso de la presa Marib, como el movimiento fundador del asentamiento árabe en Omán, sus tribus llegan a encontrar y establecerse entre la población mayor del sur de Arabia ya establecida a lo largo de la costa y en el interior de la montaña. Este Qahtani, La herencia desgarrada por Himyarite dio a Omán un carácter genealógico y cultural distinto de la tradición adnani beduina de la península del norte, y la población asentada que dio lugar, orientada tanto hacia África Oriental, Persia, y la India hacia el resto de la península, abrazó la rama Ibadi de la fe y una forma de vida marítima profunda que apartó a los omaníes de sus parientes beduinos más al norte."

 hejazi_history_loc: "Se formó a partir de [CULTURE.GetName] [Glossary('las tribus descendieron de los antiguos', 'HEJAZI_GLOSS')] [TARGET_CULTURE.GetName] reino alrededor del año [DATE.GetYear]"
 HEJAZI_GLOSS: "El reino de nabateo, centrado en Petra pero llegando al sur a través de Hegra profundamente en el Hejaz mismo, era un reino árabe en todos, pero su escritura: las inscripciones nabataicas conservan una lengua árabe hablada grabada en un escritura arameo adaptado, una fusión que hizo a los Nabataeans tanto los antepasados de la identidad árabe Hejazi posterior como cualquier linaje puramente beduino. La anexión romana en 106 terminó la independencia política de nabateo, pero su escritura cursiva distintiva continuó evolucionando durante siglos después, sus cartas simplificando y conectando gradualmente hasta que, para el tiempo del Islam, este mismo escritura había madurado en el escritura de Ḥijāzī utilizado para grabar las primeras copias del propio Corán. El Hejaz que dio a luz al Islam ya era una tierra completamente árabe en el habla y la sangre, su pueblo que llevaba adelante una herencia nabataean mucho más antigua que la nueva fe que haría su patria sagrada al mundo musulmán más amplio."

 saidi_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos del Alto Egipto', 'SAIDI_GLOSS')] alrededor del año [DATE.GetYear]"
 SAIDI_GLOSS: "El Sa'idi del Alto Egipto, el largo lazo del valle del Nilo que se extiende al sur de El Cairo hacia Nubia, desarrolló una clara identidad regional rural y conservadora formada por su eliminación del comercio y administración cosmopolita concentrados en el Delta del Nilo y la capital. Orgulloso de una tradición agrícola que se remonta a los tiempos faraónicos y a menudo mirado por los egipcios inferiores como más tradicional o anticuado, los Sa'idi mantuvieron lealtades tribales y clanes de cerca junto con su herencia lingüística árabe-cóptica bien después de que las ciudades del Bajo Egipto hubieran crecido completamente cosmopolitas."

 harar_history_loc: "Se separó de [CULTURE.GetName] [Glossary('Pueblos de comercio islámicos de las tierras altas orientales', 'HARAR_GLOSS')] alrededor del año [DATE.GetYear]"
 HARAR_GLOSS: "Comerciantes, artesanos, y colonos de las tierras altas y la costa del Mar Rojo se reunieron en las paredes de Harar durante los siglos, dibujado por la posición de la ciudad astridan las rutas que unen el interior etíope a Arabia y el Golfo de Adén, y esta constante afluencia de familias mercantes y eruditos islámicos construyeron gradualmente una población claramente urbana a diferencia de las comunidades rurales de las tierras altas que rodean la ciudad. Atravesado en el mundo cultural Harla más amplio de la región, pero cada vez más formado por generaciones de matrimonios entre estas familias comerciales, el Harari desarrolló su propia lengua, vestido y costumbres diarias, una identidad de ciudad amurallada lo suficientemente densa con mezquitas y santuarios domésticos para llenar calles muchas veces el tamaño modesto de la ciudad."
 maghrebi_history_loc: "Se formó a partir de [CULTURE.GetName] [Glossary('colonos que se mezclan con los', 'MAGHREBI_GLOSS')] [TARGET_CULTURE.GetName] en las tierras occidentales [DATE.GetYear]"

 siqilli_history_loc: "Se formó a partir de [CULTURE.GetName] [Glossary('conquistadores que se instalan entre los', 'SIQILLI_GLOSS')] [TARGET_CULTURE.GetName] población de Sicilia alrededor del año [DATE.GetYear]"
 SIQILLI_GLOSS: "La conquista aghlabid de Sicilia, a partir de 827 y terminada por la caída de Taormina en 902, trajo a los colonos árabes y bereberes de Ifriqiya a través del estrecho estrecho hacia una isla cuya población permanecía abrumadoramente griega y cristiana en el momento de la conquista. En lugar de sustituir a esta población griega siciliana existente, los colonos musulmanes entrantes construyeron una nueva sociedad encima de ella, y generaciones de coexistencia, conversión e intermatrimonio produjeron una cultura y dialecto arábico claramente siciliano, uno que seguiría dejando una marca permanente en el lenguaje, la cocina y la arquitectura de la isla mucho después de que el gobierno político musulmán llegara a su fin bajo los normandos."

 maltese_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos de Malta después de la conquista normanda', 'MALTESE_GLOSS')] alrededor del año [DATE.GetYear]"
 MALTESE_GLOSS: "Cuando el recuento normando Roger incauté a Malta del dominio musulmán en 1091, la población de habla siculoábica de la isla no desapareció, sino que entró en un largo proceso de cristianización gradual y relatinización bajo norma normando y posterior gobierno siciliano. El discurso de Malta en árabe sobrevivió a esta transición en gran medida intacta, incluso cuando su fe y orientación política se desplazaron decisivamente hacia el cristianismo latino, produciendo la combinación inusual y duradera que definiría la identidad maltesa: una lengua semítica arraigada en Siculo-Árabe, llevada adelante por un pueblo completamente católico y europeo."

 turco_hephthalite_history_loc: "Se formó a partir de [CULTURE.GetName] [Glossary('remanentes absorbidos por los restos llegados', 'TURCO_HEPHTHALITE_GLOSS')] [TARGET_CULTURE.GetName] alrededor del año [DATE.GetYear]"
 TURCO_HEPHTHALITE_GLOSS: "El poder del Imperio heftalita en Asia Central fue roto en los 560s por un asalto conjunto de los persas sánidas y el recién resucitado primer Kanato turco, cuyos ejércitos se arrastraron desde la estepa oriental para reclamar los antiguos dominios hephthalite como propios. En lugar de ser desplazados, gran parte de la población heftalita existente se mantuvo en la tierra, y como colonos y administradores turcos establecieron su propia regla en los antiguos territorios hephthalite, generaciones de matrimonios y intercambio cultural fusionaron a los dos pueblos, Llevar adelante la tradición regional de heftalita y el discurso influenciado por Bactrian bajo una nueva identidad política turcomana dominante."

 semnani_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos del Alborz', 'SEMNANI_GLOSS')] alrededor del año [DATE.GetYear]"
 SEMNANI_GLOSS: "Semnan y sus vecinas ciudades de estribación se separaron de las grandes carreteras que unen las principales ciudades de la meseta iraní, una posición que salvó a la región gran parte de la perturbación y el reasentamiento que llegaron con la conquista árabe y los siglos de agitación dinástica que siguieron a otros lugares de Irán. Este retiro relativo permitió que la nobleza local de Semnan y los pueblosfolk mantuvieran un sentido inusualmente directo de continuidad con el viejo mundo parthiano que sus antepasados habían pertenecido, sus costumbres y estructuras comunitarias preservadas por el mismo aislamiento que mantenía fuera de los ejércitos y administradores que los pasaban."

 khalaj_history_loc: "Se formó a partir de [CULTURE.GetName] [Glossary('bandas de guerreros que se instalan entre los', 'KHALAJ_GLOSS')] [TARGET_CULTURE.GetName] alrededor [DATE.GetYear]"
 KHALAJ_GLOSS: "Los geógrafos musulmanes creían que los Khalaj se originaron cerca del lago Issyk-Kul en la estepa del lejano este, llevados al sur por los grandes siglos de expansión de heftalita antes del Islam y se quedaron atrás como una población de habla turco en las montañas al sur del Kush hindú después del colapso del Imperio Hephtalita. Esta población turca se estableció entre los pueblos de habla Pashto de Zabulistán y el valle del río Kabul, y generaciones de vida montañosa compartida, pastoreo e intermatrimonio entre las dos comunidades, aun cuando las familias de Khalaj mantuvieron su propio discurso turco con vida dentro del mundo más amplio de Pashtun alrededor de ellos. Las bandas guerreras de Khalaj llevaban el nombre y la reputación de esta misma población mucho más allá de estas montañas en los siglos que siguieron, algunos se establecieron permanentemente en el norte de la India y otros permaneciendo en Afganistán, donde las generaciones posteriores gradualmente se mezclaron con lo que se conoció como la tribu Ghilji."

 brahui_history_loc: "Se formó a partir de [CULTURE.GetName] [Glossary('pueblos que se unen a migrantes', 'BRAHUI_GLOSS')] [TARGET_CULTURE.GetName] alrededor del año [DATE.GetYear]"
 BRAHUI_GLOSS: "La tradición de Brahui recuerda un origen lejano, algunos clanes que rastrean a sus antepasados a los migrantes que llegaron de lejos al este, una memoria popular que apunta hacia las rutas comerciales y migratorias reales que unen las tierras altas de Kalat a la India central a través de los siglos siguientes al asentamiento de Balochi de la región alrededor de 1000. Comunidades de comerciantes y colonos de habla Dravidiana que hacen este viaje al oeste derribaron raíces entre la población pastoral Baloch de Sarawan y Jahlawan, y las generaciones de matrimonios y la vida de tierras altas compartidas doblaron a los recién llegados al mundo existente de Baloch tan completamente que los clanes de Brahui siguen siendo parientes a sus vecinos de Baloch en todos los aspectos, pero uno: la lengua distinta que sus antepasados migrantes trajeron con ellos, y que la comunidad más amplia escogió conservar."

 kashgari_history_loc: "Se formó a partir de [CULTURE.GetName] [Glossary('tribus que se asientan entre las', 'KASHGARI_GLOSS')] [TARGET_CULTURE.GetName] de los oasis de Tarim alrededor del año [DATE.GetYear]"
 KASHGARI_GLOSS: "Kashgar había sido durante siglos una de las grandes ciudades de oasis desatendidas por Saka de la Cuenca del Tarim, sus mercados y campos irrigados que sustentan a una población de habla iraní asentada, como la vecina Khotan. Las tribus turcas de Chigil se asientan entre esta población de oasis no encontraron conquista sino fusión gradual, un proceso que se profundizaba más después de que el gobernante karanid Satuq Bughra Khan abrazara el Islam alrededor de 934, la creciente población turco-saka de Kashgar y la más amplia cuenca del Tarim en una identidad islámica compartida que se extendió con ellos hasta Khotan en 1006. Esta población mezclada, a la vez heredero de los antiguos habitantes de los oasis de Saka y de los pastores de Chigil, produjo una de las sociedades más alfabetizadas de Asia Central, sus eruditos y comerciantes que llevaban la lengua de Kashgari y aprendiendo a través de las rutas comerciales que cruzaron su patria."

 nepali_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos del valle de Katmandú', 'NEPALI_GLOSS')] en el año [DATE.GetYear]"
 NEPALI_GLOSS: "Durante siglos, los agricultores, artesanos y comerciantes del valle de Katmandú desarrollaron una próspera economía agrícola y artesanal en torno a sus fértiles tierras de cultivo. La construcción de templos, los sistemas de irrigación y las actividades comerciales prosperaron bajo el patrocinio de los gobernantes de la dinastía Licchavi, sin depender de una única dinastía para asegurar su continuidad. Incluso cuando el poder político pasó de los Licchavi a los Thakuri y a las dinastías posteriores, los habitantes del valle continuaron cultivando las mismas tierras, venerando en los mismos templos y practicando las tradiciones artesanales y comerciales heredadas de sus antepasados. Esta continuidad de la vida cotidiana sobrevivió a los sucesivos cambios dinásticos y permitió preservar las costumbres y prácticas administrativas que, con el paso de las generaciones, contribuirían a la formación de una identidad nepalí diferenciada."

 greek_history_loc: "Se formó a partir de [CULTURE.GetName] [Glossary('la administración imperial y su integración con el mundo', 'GREEK_GLOSS')] [TARGET_CULTURE.GetName] alrededor del año [DATE.GetYear]"
 GREEK_GLOSS: "La civilización helénica había perdurado durante siglos antes del surgimiento de Roma y, aun después de que las conquistas romanas incorporaran Grecia y el Mediterráneo oriental al Imperio, el griego continuó siendo la lengua de la filosofía, el comercio y la vida cotidiana en sus provincias orientales. Esta continuidad cultural terminó reflejándose en la administración imperial durante el reinado de Heraclio, a partir del año 610, cuando el griego adquirió una posición predominante frente al latín como lengua del gobierno. Se consolidaba así un proceso de transformación desarrollado durante siglos: un Estado que seguía considerándose romano, gobernado por un emperador que se proclamaba sucesor de Augusto, pero cuya población oriental hablaba, escribía y vivía principalmente en griego. Esta síntesis bizantina preservó el saber helénico, las artes y las tradiciones urbanas griegas dentro de un marco político y jurídico romano, dando lugar a una civilización que reunía elementos de la Antigüedad clásica con una identidad medieval propia."

 GEORGIAN_GLOSS: "La población del valle del río Kurá, conocido en georgiano como Mtkvari, ya era identificada por los autores griegos y romanos como los iberos mucho antes de que Farnavaz I estableciera, según la tradición, una monarquía autóctona hacia el año 302 a. C. Se trataba de un pueblo de agricultores y habitantes de las montañas, cuyas tradiciones atribuirían posteriormente al mismo monarca la creación del alfabeto georgiano. Durante siglos, Iberia fue objeto de disputas entre Roma, Persia y, posteriormente, el Califato árabe. Pese a los continuos cambios de dominio político, sus habitantes conservaron sus asentamientos, sus tierras de cultivo y su lengua, incluso después de que la Persia sasánida aboliera la monarquía ibérica en el año 580. Fue la continuidad de esta población, más que la permanencia de una dinastía determinada, la que permitió preservar su identidad cultural a través de los principados surgidos durante la dominación árabe y contribuyó a la formación gradual de una identidad georgiana unificada."

 mingrelian_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos de las llanuras del río Rioni', 'MINGRELIAN_GLOSS')] en el año [DATE.GetYear]"
 MINGRELIAN_GLOSS: "El antiguo Reino de la Cólquida, cuya riqueza y legendario vellocino de oro inspiraron el mito griego de Jasón y los argonautas, dominó durante siglos las fértiles llanuras y los valles fluviales del oeste de Georgia, antes de que la conquista romana incorporara sus territorios al ámbito imperial. Las poblaciones colcas del interior, asentadas en el valle del Rioni, donde se encontraba el núcleo del antiguo reino, conservaron de manera especialmente directa su herencia cultural. Mientras bizantinos y árabes disputaban el control de Egrisi, el principado sucesor de la antigua Cólquida, estas comunidades fueron desarrollando una identidad diferenciada que daría origen al pueblo mingrelio. Entre los herederos de la civilización colca, los mingrelios mantuvieron una vinculación particularmente estrecha con el antiguo centro político y territorial del reino."

 lazi_history_loc: "Se formó a partir de [CULTURE.GetName] [Glossary('pueblos que heredaron el legado de los', 'LAZI_GLOSS')] [TARGET_CULTURE.GetName] alrededor del año [DATE.GetYear]"
 LAZI_GLOSS: "Los geógrafos de la Antigüedad, como Arriano, identificaban a los lazos como uno de los pueblos de la costa de la Cólquida, diferenciándolos del conjunto de la población colca, aunque ambos compartían un mismo reino y una herencia cultural cartvelia. Tras la incorporación de la región al dominio romano, el nombre de Lázica terminó designando el territorio en referencia a este pueblo costero. Durante los siglos V y VI, historiadores bizantinos como Procopio y Agatías describieron a los lazos como herederos directos del antiguo Reino de la Cólquida, cuya población pasó a ser conocida por el nombre de la comunidad costera que había asumido su legado político. La unión de esta identidad particular con la herencia más amplia de la civilización colca dio lugar a una conciencia cultural diferenciada, vinculada tanto a sus tradiciones ancestrales como al prestigio histórico del antiguo reino. Este legado perduró durante la existencia del Reino de Lázica, vinculado al Imperio bizantino, y continuó formando parte de la identidad laza durante la Edad Media."

 svan_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos de los altos valles del Cáucaso', 'SVAN_GLOSS')] en el año [DATE.GetYear]"
 SVAN_GLOSS: "En los elevados valles montañosos situados por encima de las ciudades costeras y las llanuras fluviales de la antigua Cólquida habitaban los esvanos, descritos ya por los geógrafos de la Antigüedad como un pueblo montañés de carácter independiente, apartado de las comunidades más accesibles de las tierras bajas. El extraordinario aislamiento de sus territorios, incluso para los estándares del Cáucaso, favoreció la conservación de rasgos lingüísticos y culturales arcaicos que fueron diferenciándolos progresivamente de los demás pueblos descendientes de la antigua población colca. Sus comunidades desarrollaron una sociedad orgullosa de su autonomía, organizada en torno a asentamientos fortificados y características torres defensivas. La dificultad de acceder a sus valles permitió que conservaran una considerable independencia frente a las sucesivas potencias que dominaron la región, desde los antiguos reinos colcos hasta los imperios bizantino y los posteriores estados georgianos."

 udi_history_loc: "Se separó de [CULTURE.GetName] [Glossary('supervivientes del antiguo reino del Cáucaso oriental', 'UDI_GLOSS')] en el año [DATE.GetYear]"
 UDI_GLOSS: "La Albania caucásica dominó antiguamente las llanuras y montañas del Cáucaso oriental como un reino independiente, habitado por diversos pueblos que hablaban lenguas de la familia lezguia. Su cristianización, iniciada en el siglo IV, favoreció su integración en el mundo cristiano del Cáucaso. La conquista árabe puso fin a su independencia política y, hacia el año 705, la Iglesia armenia había incorporado buena parte de sus estructuras eclesiásticas. Entretanto, gran parte de la población fue asimilándose progresivamente a las comunidades armenias vecinas y, más al este, a los pueblos iranios y túrquicos que se establecieron en la región. Sin embargo, en algunos enclaves aislados sobrevivieron comunidades que conservaron la lengua y las tradiciones de los antiguos habitantes de Albania caucásica. Sus descendientes, conocidos como udíes, mantuvieron esta herencia cultural mucho después de la desaparición del reino que había gobernado a sus antepasados."

 lezgi_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos montañeses del Cáucaso oriental', 'LEZGI_GLOSS')] en el año [DATE.GetYear]"
 LEZGI_GLOSS: "Los geógrafos de la Antigüedad mencionaban a los legas entre las numerosas tribus que integraban la confederación de Albania caucásica, formada por pueblos con sus propios gobernantes y dialectos, unidos mediante vínculos políticos relativamente flexibles, según la descripción de Estrabón. Su nombre ha perdurado en denominaciones asociadas a los lezguinos, como el etnónimo georgiano leki, utilizado históricamente para referirse a diversos pueblos de Daguestán. Protegidos por un territorio montañoso mucho más difícil de conquistar y administrar que las llanuras de Albania caucásica, los legas conservaron su lengua y una considerable autonomía, incluso cuando las regiones más accesibles de la confederación quedaron sometidas a la influencia armenia, persa y, posteriormente, túrquica. Esta continuidad lingüística y cultural permitió preservar su herencia montañesa, transmitida a los antepasados de los actuales lezguinos."

 tsakonian_history_loc: "Se separó de [CULTURE.GetName] [Glossary('comunidades refugiadas en las montañas del Parnón', 'TSAKONIAN_GLOSS')] en el año [DATE.GetYear]"
 TSAKONIAN_GLOSS: "A diferencia de casi todas las demás comunidades griegas, los habitantes de Tsakonia no remontan los orígenes de su lengua al griego común o koiné, del que evolucionó el griego bizantino, sino directamente al antiguo dialecto dórico, hablado en Laconia, la tierra de Esparta. Las escarpadas montañas del Parnón protegieron a estas pequeñas comunidades costeras y montañesas del Peloponeso de las migraciones eslavas que transformaron gran parte de Grecia durante los siglos VI y VII. Este aislamiento permitió conservar una tradición lingüística y cultural de origen dórico que se remontaba a la época de los reyes espartanos, mientras que en el resto del mundo bizantino predominaba el griego derivado de la koiné."

 griko_history_loc: "Se separó de [CULTURE.GetName] [Glossary('comunidades griegas del sur de Italia y Sicilia', 'GRIKO_GLOSS')] en el año [DATE.GetYear]"
 GRIKO_GLOSS: "El dominio bizantino sobre el sur de Italia y Sicilia se prolongó durante siglos, incluso después de que el Imperio perdiera el control del resto de la península itálica. Esta presencia dejó comunidades de habla griega en Calabria y el Salento que perduraron mucho después de la desaparición de la autoridad política bizantina. Rodeadas por una Italia cada vez más latinizada y posteriormente sometida al dominio normando, estas comunidades conservaron su lengua griega y su fe ortodoxa, constituyendo enclaves culturales diferenciados. Su identidad representaba la continuidad de la antigua herencia helénica de la Magna Grecia, transmitida y transformada durante los siglos de dominio bizantino, en lugar de proceder directamente de la Antigüedad."

 tauro_romaic_history_loc: "Se separó de [CULTURE.GetName] [Glossary('comunidades griegas de la costa de Crimea', 'TAURO_ROMAIC_GLOSS')] en el año [DATE.GetYear]"
 TAURO_ROMAIC_GLOSS: "Las ciudades-Estado griegas habían colonizado las costas de Crimea desde la Antigüedad, estableciendo una presencia helénica que perduró durante los períodos romano y bizantino. Su continuidad estuvo favorecida por el comercio del mar Negro y la influencia política de Constantinopla, ejercida a través de enclaves como Quersoneso y los territorios sucesores del antiguo Reino del Bósforo. Separadas del núcleo territorial bizantino por las estepas circundantes y los numerosos pueblos nómadas que las dominaban, las comunidades griegas de Crimea desarrollaron una identidad regional propia, vinculada tanto al comercio con los pueblos de la estepa como a sus relaciones políticas, religiosas y culturales con Constantinopla."

 crimean_gothic_history_loc: "Los visigodos [romanized|E] de Crimea"
 CRIMEAN_GOTHIC_GLOSS: "Mientras que la mayor parte de los pueblos godos emigró hacia occidente y terminó fundando los reinos visigodo y ostrogodo en los antiguos territorios romanos, algunas comunidades permanecieron en las montañas de Crimea, donde conservaron su lengua germánica durante siglos de relativo aislamiento. Estos godos de Crimea sobrevivieron mucho después de que sus parientes occidentales fueran asimilados por las poblaciones romanizadas de los territorios conquistados. Con el tiempo, quedaron bajo la influencia del Imperio bizantino, estableciendo vínculos religiosos con Constantinopla y manteniendo una organización eclesiástica propia. Durante el reinado de Justiniano, en el siglo VI, la construcción y fortificación de posiciones estratégicas en las montañas, entre ellas Doros, reforzó la presencia imperial en la región. Siglos de influencia religiosa bizantina, administración griega y contacto con las comunidades helénicas de la costa del mar Negro favorecieron la progresiva helenización de su cultura. Sin embargo, la lengua gótica logró sobrevivir a este proceso, convirtiéndose en una extraordinaria reliquia lingüística que todavía despertaba el asombro de los viajeros del siglo XVI, quienes encontraron testimonios de su uso en las montañas de Crimea mucho después de que hubiera desaparecido del resto de Europa."

 antiochian_history_loc: "Se separó de [CULTURE.GetName] [Glossary('comunidades griegas de la costa siria', 'ANTIOCHIAN_GLOSS')] en el año [DATE.GetYear]"
 ANTIOCHIAN_GLOSS: "Desde su fundación durante el período helenístico, Antioquía había figurado entre las ciudades más importantes del mundo antiguo. Su población de habla griega continuó siendo una presencia destacada en la Siria bizantina, incluso cuando el arameo y, posteriormente, el árabe predominaban en las regiones rurales circundantes. Esta comunidad urbana y cosmopolita, profundamente marcada por la importancia de Antioquía como uno de los principales centros de la teología cristiana primitiva y sede de un influyente patriarcado, conservó una identidad cultural propia. Su carácter distintivo surgió de la posición de la ciudad como punto de encuentro entre el mundo grecobizantino y las poblaciones semíticas del Levante."

 cappadocian_history_loc: "Se separó de [CULTURE.GetName] [Glossary('comunidades aisladas tras la conquista selyúcida', 'CAPPADOCIAN_GLOSS')] en el año [DATE.GetYear]"
 CAPPADOCIAN_GLOSS: "Durante siglos, la población cristiana de habla griega de Capadocia había formado parte del mundo bizantino de Anatolia, habitando una región conocida por sus iglesias excavadas en la roca y sus ciudades subterráneas. Sin embargo, la decisiva derrota bizantina en la batalla de Manzikert, en 1071, abrió Anatolia al asentamiento de pueblos túrquicos y debilitó progresivamente los vínculos de Capadocia con el resto del Imperio. Rodeadas por poblaciones cada vez más numerosas de habla turca, estas comunidades griegas quedaron relativamente aisladas y desarrollaron, a lo largo de las generaciones siguientes, un dialecto profundamente diferenciado. La influencia del turco sobre su gramática alcanzó una intensidad excepcional dentro del conjunto de las variedades de la lengua griega."

 greek_cypriot_history_loc: "Se separó de [CULTURE.GetName] [Glossary('comunidades de una isla reconquistada', 'GREEK_CYPRIOT_GLOSS')] en el año [DATE.GetYear]"
 GREEK_CYPRIOT_GLOSS: "Tras el comienzo de las incursiones árabes en el siglo VII, la población griega de Chipre vivió durante más de tres siglos bajo unas circunstancias políticas singulares. La isla quedó sometida a un régimen de autoridad compartida entre Constantinopla y el Califato, al que sus habitantes debían satisfacer tributos, sin encontrarse plenamente bajo el dominio directo de ninguna de las dos potencias. Esta prolongada situación favoreció el desarrollo de una considerable autonomía local, pues los agricultores, comerciantes y demás habitantes de Chipre se acostumbraron a administrar sus propios asuntos. Cuando las fuerzas bizantinas recuperaron definitivamente el control de la isla en el año 965, encontraron una población que había desarrollado una identidad grecochipriota diferenciada. Esta identidad, forjada durante generaciones de relativa autonomía, perduró tras la reincorporación de Chipre a la administración imperial."

 pontic_history_loc: "Se formó a partir de [CULTURE.GetName] [Glossary('colonos que se mezclaron con los', 'PONTIC_GLOSS')] [TARGET_CULTURE.GetName] de la costa del mar Negro alrededor del año [DATE.GetYear]"
 PONTIC_GLOSS: "La montañosa costa del Ponto, en el sudeste del mar Negro, había estado habitada durante siglos por comunidades lazas que convivían con las poblaciones de habla griega de sus ciudades. El comercio, los matrimonios mixtos y la convivencia entre ambos pueblos favorecieron el surgimiento de una identidad griega póntica diferenciada. Esta fusión cultural se profundizó a medida que la región adquiría una creciente autonomía política respecto de Constantinopla durante el siglo XII, un proceso que culminó con la fundación del Imperio independiente de Trebisonda. Su población griega póntica conservó aquella herencia grecolaza como uno de los principales rasgos de su identidad regional."

 arberian_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos aislados en las tierras altas de los Balcanes occidentales', 'ARBERIAN_GLOSS')] en el año [DATE.GetYear]"
 ARBERIAN_GLOSS: "Siglos de dominio provincial romano habían integrado a las antiguas poblaciones ilirias de los Balcanes occidentales en las estructuras administrativas, jurídicas y urbanas latinas mucho antes de que las migraciones eslavas de los siglos VI y VII transformaran profundamente el panorama político y lingüístico de la península. En las tierras bajas y los valles fluviales más accesibles, buena parte de esta población ilirorromana fue asimilada gradualmente por los pueblos eslavos recién llegados. Sin embargo, las migraciones apenas penetraron en las regiones montañosas más escarpadas, donde algunas comunidades aisladas conservaron buena parte de su identidad ancestral. De estas poblaciones de las tierras altas surgieron los arbëres, que preservaron una lengua propia, distinta tanto de las lenguas eslavas como de las romances, y se convirtieron en los antepasados de los posteriores albaneses."

 jasz_history_loc: "Se separó de [CULTURE.GetName] [Glossary('refugiados que huyeron de la invasión mongola', 'JASZ_GLOSS')] en el año [DATE.GetYear]"
 JASZ_GLOSS: "Cuando la invasión mongola de 1241 destruyó el poder de los cumanos en la estepa póntica, los yasos, un pueblo de ascendencia alana que había convivido durante largo tiempo con ellos, huyeron hacia occidente en busca de refugio en el Reino de Hungría, gobernado por Bela IV. Establecidos en un territorio propio de la llanura húngara, los yasos conservaron durante generaciones su lengua alana y su identidad cultural, pese a encontrarse lejos de sus antiguas tierras del Cáucaso y las estepas. Así, esta pequeña comunidad mantuvo viva una parte de la herencia alana en el corazón de la Hungría medieval."

 circassian_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos de la costa nororiental del mar Negro', 'CIRCASSIAN_GLOSS')] en el año [DATE.GetYear]"
 CIRCASSIAN_GLOSS: "Estrabón describió a los zigos como un pueblo de navegantes guerreros que habitaba la costa nororiental del mar Negro, al norte de la Cólquida, donde vivían de la piratería a bordo de embarcaciones ligeras que podían transportar a hombros hasta calas ocultas entre los bosques cuando se veían amenazados. Siglos después, esta misma región costera era conocida por los bizantinos como Ziquia, cuyos habitantes fueron incorporándose gradualmente al cristianismo gracias a la actividad misionera desarrollada durante el reinado del emperador Justiniano, en el siglo VI, con centro religioso en Nicopsia. Aunque nunca llegaron a constituir una monarquía unificada y duradera, pues preferían organizarse en principados tribales ampliamente autónomos vinculados mediante la elección de un gran príncipe, los habitantes de Ziquia conservaron su lengua caucásica noroccidental y sus tradiciones guerreras, convirtiéndose en los antepasados directos del pueblo circasiano. Pese a pertenecer a una misma familia lingüística, mantuvieron una identidad diferenciada de la de sus parientes abasgios, establecidos más al suroeste."

 tatars_history_loc: "Se formó a partir de [CULTURE.GetName] [Glossary('guerreros que se integraron entre los', 'TATARS_GLOSS')] [TARGET_CULTURE.GetName] alrededor del año [DATE.GetYear]"
 TATARS_GLOSS: "Cuando los ejércitos mongoles de Batú Kan conquistaron la estepa kipchak durante las décadas de 1230 y 1240, sus guerreros constituían una pequeña minoría gobernante frente a una población túrquica kipchak mucho más numerosa. En el transcurso de unas pocas generaciones, los descendientes de los conquistadores adoptaron la lengua kipchak y buena parte de las costumbres de los pueblos de la estepa, aunque conservaron la legitimidad política derivada de su ascendencia gengiskánida y las tradiciones militares mongolas. Los observadores extranjeros y, con el tiempo, los propios habitantes comenzaron a utilizar el antiguo nombre de tártaros para designar a esta nueva población de habla kipchak gobernada por descendientes de Gengis Kan. Originalmente, aquel nombre pertenecía a un pueblo distinto de la meseta mongola, sometido y prácticamente destruido por los mongoles varias generaciones antes. Sin embargo, la denominación terminó arraigando hasta convertirse en el nombre que identificaría a la población principal de la Horda de Oro durante el resto de su historia."

 nogai_history_loc: "Se formó a partir de [CULTURE.GetName] [Glossary('guerreros que se fusionan en el', 'NOGAI_GLOSS')] [TARGET_CULTURE.GetName] alrededor del año [DATE.GetYear]"
 NOGAI_GLOSS: "Los guerreros Kipchak-mongol de la estepa de la Horda Dorada occidental se reunieron durante décadas bajo la bandera de Nogai, un general genghisid cuyo seguimiento personal creció tan grande que funcionó como su propia población tribal distinta de la autoridad central de la Horda. Cuando Nogai cayó en batalla alrededor de 1299, derrotado por el propio khan Toqta de Golden Horde, su muerte no dispersó a nadie, los guerreros y las familias que lo habían seguido por una generación o más simplemente llevaban su nombre hacia adelante como su propio, formando un pueblo distinto de Nogai cuyo caballo nació, la tradición pastoral de la estepa perduraba durante siglos como una de las poblaciones más duramente nómadas para emerger de la fragmentación de la Horda Dorada."

 crimean_history_loc: "Se formó a partir de [CULTURE.GetName] [Glossary('conquistadores que se fusionan en', 'CRIMEAN_GLOSS')] [TARGET_CULTURE.GetName] alrededor del año [DATE.GetYear]"
 CRIMEAN_GLOSS: "La confederación Cuman-Kipchak había dominado la estepa pontica y la península de Crimea durante más de un siglo antes de la conquista mongol de 1237 a 1240 barrido sobre ellos, y en lugar de desplazar a esta población existente los conquistadores mongol se establecieron entre ellos como un nuevo estrato gobernante. La posición única de Crimea como una península, sus colonias comerciales genovesas y venecianas aferradas a la costa incluso bajo la suzeraindad de Golden Horde, dio a la síntesis de tártaros de Crimea un carácter claramente cosmopolita y orientado al comercio marítimo, a diferencia de las poblaciones tártaras más puramente pastorales de la estepa abierta, un fundamento sobre el cual el Khanate de Crimea construiría su propio camino independiente."

 kazani_history_loc: "Se formó a partir de [CULTURE.GetName] [Glossary('conquistadores que se fusionan en', 'KAZANI_GLOSS')] [TARGET_CULTURE.GetName] alrededor del año [DATE.GetYear]"
 KAZANI_GLOSS: "Volga Bulgaria se había mantenido como un estado comercial islámico próspero y de larga data a lo largo del Volga medio durante más de tres siglos antes de que los ejércitos mongol lo aplastaran en 1236, una de las primeras conquistas importantes de la campaña occidental que seguiría creando la Horda de Oro. En lugar de borrar esta civilización Bulgar existente, La regla mongol se estableció en lo alto, y generaciones de matrimonio y administración compartida fusionaron a los conquistadores Genghisid con los mayores, población de Bulgar urbanizada, produciendo una identidad tártara claramente resuelta y comercialmente sofisticada a lo largo del Volga muy diferente de las poblaciones tártaras más puramente nómadas de la estepa abierta más al sur, a foundation from which the later Khanate of Kazan would eventually emerged."

 mishar_history_loc: "Se formó a partir de [CULTURE.GetName] [Glossary('guerreros que se fusionan en el', 'MISHAR_GLOSS')] [TARGET_CULTURE.GetName] alrededor del año [DATE.GetYear]"
 MISHAR_GLOSS: "Al oeste del corazón de Volga Bulgar, a lo largo de la frontera de Golden Horde con las tierras forestales de los principados de Rus, los conquistadores mongol y los guerreros de estepa de habla kipchak se establecieron entre una población regional mayor en las tierras de Meshchera, produciendo una comunidad de tártaros distinta de sus parientes kazanos más al este. Esta posición occidental, de cara a la frontera, dio al Mishar un papel tanto militar como agrícola, sus comunidades sirvieron durante mucho tiempo a la Horda Dorada y sus estados sucesores como un búfer y una fuente de caballería ligera a lo largo del límite siempre cambiante entre la estepa y el bosque."

 chagatai_history_loc: "Se formó a partir de [CULTURE.GetName] [Glossary('conquistadores que se fusionan en', 'CHAGATAI_GLOSS')] [TARGET_CULTURE.GetName] alrededor del año [DATE.GetYear]"
 CHAGATAI_GLOSS: "Chagatai, segundo hijo de Genghis Khan, recibió el corazón del Asia central de Transoxiana y la Cuenca del Tarim como su propio ulus, un reino ya hogar de una población de oasis de habla turca y colonizada descendió de siglos de Karluk y Kara-Khanid. Como la élite gobernante mongol de este ulus se estableció gradualmente en las ciudades de la región y tierras agrícolas irrigadas, el matrimonio y la gobernanza diaria junto con esta población de Karluk, producía una nueva síntesis turco-mongol, uno que cada vez más abrazaba el Islam y la cultura literaria perso-turca bajo gobernantes como Duwa Khan, incluso mientras preservaba la legitimidad política genghisid, sentar las bases lingüísticas y culturales para lo que se convertiría en el gran lenguaje literario Chagatai de Asia Central."

 turkmeni_history_loc: "Se formó a partir de [CULTURE.GetName] [Glossary('guerreros que se fusionan en el', 'TURKMENI_GLOSS')] [TARGET_CULTURE.GetName] alrededor del año [DATE.GetYear]"
 TURKMENI_GLOSS: "Las conquistas mongoles del siglo XIII dispersaron las tribus turcas de Oghuz de Khorasan y Transoxiana en diferentes direcciones, y mientras muchos huyeron al oeste hacia Anatolia para convertirse en los antepasados de los turcos otomanos posteriores, otros fueron empujados a los desiertos remotos y a las franjas estepas de Turkmenistán, donde elementos de la guarnición mongol y la administración se establecieron entre ellos en lugar de desplazarlos directamente. Este desierto y aislamiento de estepa, lejos de las grandes ciudades perianates, los mongoles gobernaban más directamente, dejaba que una clara identidad turcomana cristalizara de la poblada población de Oghuz y mongol, una que retenía las antiguas tradiciones pastorales nómadas del mundo más amplio de Oghuz, incluso a medida que llevaba adelante su propia herencia política genghisida."

 illyro_roman_history_loc: "Se formó a partir de [CULTURE.GetName] [Glossary('colonos provinciales fusionados con los', 'ILLYRO_ROMAN_GLOSS')] [TARGET_CULTURE.GetName] alrededor del año [DATE.GetYear]"
 ILLYRO_ROMAN_GLOSS: "La conquista romana de la costa y el interior de Illyrian, terminada por el siglo I a.C., trajo siglos de administración provincial, derecho latino y asentamiento colonial a una población que había resistido a Roma ferozmente en las guerras de Agron y Teuta generaciones anteriores. En lugar de borrar la actual población de Illyria, La regla romana se estableció en lo alto de ella, y los largos siglos del Pax Romana tejían el discurso latino y la costumbre de Illyrian juntos a lo largo de la costa dálmata y su interior montañoso, Produciendo una cultura provincial claramente Illyro-Romana que seguiría dando forma a la lengua e identidad de la región mucho después de que la propia administración romana directa se hubiera desvanecido."

 rhaetio_roman_history_loc: "Se formó a partir de [CULTURE.GetName] [Glossary('colonos provinciales fusionados con los', 'RHAETIO_ROMAN_GLOSS')] [TARGET_CULTURE.GetName] alrededor del año [DATE.GetYear]"
 RHAETIO_ROMAN_GLOSS: "Roma anexó la provincia alpina de Raetia en 15 a.C., sometiendo a una población montañosa desbordada cuyos orígenes y lenguaje seguían siendo algo de misterio incluso para los geógrafos romanos, algunos de los cuales especulaban que eran restos de los etruscos derrotados arrastrados a las montañas siglos antes. Las carreteras romanas, las guarnición y el asentamiento colonial gradualmente tejían el discurso latino en esta población alpina existente durante los siglos siguientes, produciendo una cultura provincial romana en los altos valles que resultaría notablemente duradera, preservando su propia lengua latina en bolsillos aislados alpinos mucho después de la caída de Roma."

 britano_roman_history_loc: "Se formó a partir de [CULTURE.GetName] [Glossary('colonos provinciales fusionados con los', 'BRITANO_ROMAN_GLOSS')] [TARGET_CULTURE.GetName] alrededor del año [DATE.GetYear]"
 BRITANO_ROMAN_GLOSS: "La invasión de Britania por el emperador Claudio en el año 43 sometió por primera vez a buena parte de su población celta al dominio directo de Roma. Durante casi cuatro siglos, la administración provincial, el derecho romano, el latín y la presencia de guarniciones transformaron profundamente la isla. Tras la retirada de la autoridad imperial a comienzos del siglo V, las comunidades britanorromanas conservaron parte de esta herencia mientras afrontaban nuevas presiones políticas y militares."

 african_roman_history_loc: "Se formó a partir de [CULTURE.GetName] [Glossary('refugiados que se mezclan con los', 'AFRICAN_ROMAN_GLOSS')] [TARGET_CULTURE.GetName] alrededor del año [DATE.GetYear]"
 AFRICAN_ROMAN_GLOSS: "La conquista vándala del África romana a comienzos del siglo V no eliminó a la población local romanizada, de raíces púnicas y africanas, sino que estableció sobre ella una nueva élite gobernante. Durante el dominio vándalo persistieron las instituciones, las tradiciones y buena parte de la vida urbana romana, mientras las comunidades locales convivían con los recién llegados. Las relaciones entre ambos grupos, incluidos los matrimonios y los cambios religiosos, contribuyeron a la transformación gradual de la sociedad africanorromana."

 friulian_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos de las estribaciones alpinas orientales', 'FRIULIAN_GLOSS')] en el año [DATE.GetYear]"
 FRIULIAN_GLOSS: "Tras la caída del Imperio romano de Occidente a finales del siglo V, las poblaciones romanizadas de las estribaciones alpinas orientales quedaron aisladas del resto de Italia por las invasiones y los nuevos asentamientos germánicos. La llegada de los lombardos y el avance de los pueblos eslavos desde el este acentuaron este aislamiento. En este territorio fronterizo, las comunidades locales conservaron elementos de su herencia latina mientras desarrollaban una identidad y unas hablas romances propias, de las que surgiría la tradición friulana."

 romansh_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos de los valles alpinos centrales', 'ROMANSH_GLOSS')] en el año [DATE.GetYear]"
 ROMANSH_GLOSS: "Tras la caída del Imperio romano de Occidente a finales del siglo V, las poblaciones romanizadas de los valles alpinos centrales encontraron protección en un relieve montañoso que dificultaba las migraciones y conquistas que transformaban las tierras bajas. El aislamiento de estas comunidades favoreció la conservación de sus hablas romances, derivadas del latín provincial, y el desarrollo de una identidad propia en contacto con los pueblos germánicos vecinos."

 ligurian_history_loc: "Se formó a partir de [CULTURE.GetName] [Glossary('colonos provinciales fusionados con los', 'LIGURIAN_GLOSS')] [TARGET_CULTURE.GetName] alrededor del año [DATE.GetYear]"
 LIGURIAN_GLOSS: "Los Ligures resistieron ferozmente la conquista romana a través de décadas de dura guerra de montaña entre el 238 y el 117 a.C., su robusta patria costera y alpina haciendo de la subyugación directa un asunto lento y costoso incluso por los propios estándares de Roma. La victoria romana eventualmente trajo el asentamiento colonial y la administración provincial a la región independientemente, y los siglos siguientes de contacto latino transformó gradualmente el discurso e identidad de Ligurian, aunque el difícil terreno de la región preservaba una cultura claramente independiente y orientada hacia el mar que llevaría el antiguo nombre de Ligurian hacia el mundo post-romano."

 italian_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos de la península italiana', 'ITALIAN_GLOSS')] en el año [DATE.GetYear]"
 ITALIAN_GLOSS: "Para cuando el gobierno bárbaro finalmente extinguió el Imperio Romano Occidental en 476, los muchos pueblos distintos de la península italiana, Etruscos, Samnites, Umbrians, y el resto, ya se habían fusionado a fondo en una sola población romana de habla latina durante más de cinco siglos, desde la Guerra Social del siglo I a.C. obtuvo la ciudadanía para los aliados italianos de Roma. El colapso político de la autoridad romana, en lugar de cualquier nueva oleada de población mezclada, marca el punto en el que una identidad claramente italiana comenzó a divergir del mundo más amplio de habla latina, ya que las ciudades y regiones de la península trazaron cada vez más sus propios cursos políticos bajo sucesiva superación ostrófica, bizantina y lombarda."

 tuscan_ce_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos del valle del Arno', 'TUSCAN_CE_GLOSS')] en el año [DATE.GetYear]"
 TUSCAN_CE_GLOSS: "La población de habla italiana se asentaba a lo largo del valle de Arno, agrupada en las ciudades de cerca espacio de Florencia, Pisa y Siena, mantenía una inusualmente densa red de contacto, comercio y viajes entre estas comunidades vecinas en comparación con las poblaciones rurales más dispersas en otras partes de la Italia Cisalpina. Esta estrecha proximidad urbana permite que el discurso del valle se desarrolle y se difunda con notable consistencia en sus ciudades, y cuando los escritores de la región, poetas, y los eruditos comenzaron a poner ese discurso toscano compartido al papel en los siglos que siguieron, más famoso Dante, Petrarch, y Boccaccio, sus palabras llevaban un dialecto ya ampliamente comprendido a través de la propia población interconectada del valle de Arno, sentar las bases para su posterior prestigio como la base del italiano literario."

 neapolitan_history_loc: "Se separó de [CULTURE.GetName] [Glossary('Los colonos lombardos entre los italianos del sur', 'NEAPOLITAN_GLOSS')] en el año [DATE.GetYear]"
 NEAPOLITAN_GLOSS: "Los guerreros-settlers lombardos que empujaron hacia el sur de Italia en el siglo VI encontraron que la región ya albergaba a una población italiana de influencia tardía romana y bizantina, y en lugar de desplazarla, los lombardos entrantes se establecieron entre estas comunidades del sur, entremar y mezclar gradualmente la costumbre lombarda con el discurso y la tradición locales existentes. Cortar de los territorios lombardos de franco del norte una vez que Carlomagno extinguió el reino del norte en 774, esta población del sur siguió desarrollándose a lo largo de su propio camino durante siglos, absorbiendo más bizantina, Arabe, y eventualmente los colonos normandos e influencias como cada poder a su vez impugnaron el sur, produciendo una identidad napolitana de capas distintas, formada por onda tras ola de recién llegados que se instalan en la misma población del sur de Italia."

 corsican_history_loc: "Se formó a partir de [CULTURE.GetName] [Glossary('colonos que se mezclan con los', 'CORSICAN_GLOSS')] [TARGET_CULTURE.GetName] alrededor del año [DATE.GetYear]"
 CORSICAN_GLOSS: "Córcega pasó por Cerdeña, pisana y varias otras esferas marítimas italianas de influencia a lo largo de los siglos posteriores a la caída de Roma, su robusto interior preservando a una antigua población desatendida por Cerdeña, incluso aumentando el comercio y asentamiento toscanos, especialmente una vez que Pisa estableció un firme control sobre la isla, trajo una constante ola de recién llegados de habla toscana a sus costas. Esta mezcla de una población de tierras altas arraigadas en Cerdeña con tierras bajas y comerciantes toscanos entrantes produjo el lenguaje e identidad distintos de Corsican, uno atrapado entre sus raíces sardas y su vida política y comercial cada vez más orientada a la Toscana."

 cisalpine_history_loc: "Se formó a partir de [CULTURE.GetName] [Glossary('conquistadores que se instalan entre los', 'CISALPINE_GLOSS')] [TARGET_CULTURE.GetName] alrededor del año [DATE.GetYear]"
 CISALPINE_GLOSS: "La conquista del reino lombardo por Carlomagno en el año 774 extendió la autoridad franca sobre las fértiles tierras del valle del Po, que los lombardos habían dominado durante dos siglos desde su llegada a Italia en el siglo VI. Los nuevos administradores, nobles y colonos francos se integraron en una sociedad donde persistían las tradiciones lombardas y romanas. Esta convivencia favoreció el desarrollo de identidades regionales diferenciadas en la Italia septentrional."

 emilian_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos del corredor Via Aemilia', 'EMILIAN_GLOSS')] en el año [DATE.GetYear]"
 EMILIAN_GLOSS: "La población se estableció a lo largo de la antigua carretera romana de la Vía Aemilia, que se extendía por de Bolonia, Módena, y Parma, vivieron en un patrón inusualmente lineal de ciudades muy espaciadas entre sí a lo largo de una sola carretera en lugar de dispersarse por el campo abierto, una geografía de asentamiento que mantuvo a las comunidades vecinas en un contacto mucho más constante entre sí que con la población cisalpina más amplia que fuera de la carretera. Esta estrecha y estrecha proximidad de carretera permite que el discurso y la costumbre de las ciudades se desarrollen juntos como un dialecto regional compartido distinto del mundo más amplio de Cisalpine que había crecido, la población del corredor que permanece ligada entre sí por la misma carretera que sus antepasados romanos habían construido por primera vez siglos antes."

 romagnol_history_loc: "Se formó a partir de [CULTURE.GetName] [Glossary('colonos que se mezclan con los', 'ROMAGNOL_GLOSS')] [TARGET_CULTURE.GetName] alrededor del año [DATE.GetYear]"
 ROMAGNOL_GLOSS: "La población alrededor de Ravenna y la franja costera al este de Bolonia permaneció atada a la administración y la cultura bizantinas durante casi dos siglos más que el resto del valle del Po, absorbiendo a funcionarios griegos, comerciantes y clérigos que mantenían la región orientada hacia Constantinopla incluso cuando los colonos lombardos empujaron constantemente hacia el campo circundante. Cuando Ravenna finalmente pasó de Bizantino a Lombard, y luego manos francas y papales a mediados del siglo VIII, esta poblacion bizantina-ravenna de larga data fusionada sólo gradualmente con el mundo cisalpino lombardo-francés alrededor de él, su discurso y costumbre conservando un sabor regional distinto que los extraños llegaron a reconocer como Romagnol."

 piedmontese_history_loc: "Se formó a partir de [CULTURE.GetName] [Glossary('colonos que se mezclan con los', 'PIEDMONTESE_GLOSS')] [TARGET_CULTURE.GetName] alrededor del año [DATE.GetYear]"
 PIEDMONTESE_GLOSS: "Los extremos occidentales del valle del Po, ubicados al pie de los Alpes frente a Francia, absorbieron la influencia constante de Occitan-Provençal de todas las montañas, incluso mientras la región seguía siendo parte firmemente del mundo más amplio de lombardo cisalpino en sus tradiciones políticas y jurídicas. Esta mezcla de influencia lingüística y cultural provenzal con la herencia cisalpina existente le dio a Piedmont un carácter claramente orientado hacia Francia, prefigurando la larga y estrecha relación de la región con su vecino transalpino en los siglos venideros."

 venetian_ce_history_loc: "Se formó a partir de [CULTURE.GetName] [Glossary('colonos que se mezclan con los', 'VENETIAN_CE_GLOSS')] [TARGET_CULTURE.GetName] alrededor del año [DATE.GetYear]"
 VENETIAN_CE_GLOSS: "La posición única de Venecia como asentamiento de lagunas, nunca conquistada por los lombardos y manteniendo una lealtad distinta, aunque cada vez más nominal, al Constantinopla Bizantino durante siglos, lo convirtió en una encrucijada natural entre el mundo italiano cisalpino y el adriático bizantino de habla griega. Firme contacto mercantil y cultural griego, sostenido por el creciente dominio comercial de Venecia a través del Adriático y del Mediterráneo oriental, se adentró en la población italiana cisalpina fundamentalmente de la ciudad, produciendo una identidad veneciana claramente cosmopolita orientada tanto hacia el mar y Constantinopla como hacia el continente italiano detrás de él."

 pannonian_romance_history_loc: "Se formó a partir de [CULTURE.GetName] [Glossary('colonos provinciales fusionados con los', 'PANNONIAN_ROMANCE_GLOSS')] [TARGET_CULTURE.GetName] alrededor del año [DATE.GetYear]"
 PANNONIAN_ROMANCE_GLOSS: "Roma completó la conquista de Panonia poblada por Illyrian bajo Augusto, y siglos de administración provincial, colonización militar y construcción de carreteras siguieron a medida que la región se convirtió en una provincia fronteriza vital que custodiaba el Danubio medio. El gobierno romano se estableció en la parte superior de la población Illyria existente en lugar de desplazarla, y la larga presencia romana usó el discurso latino en este sustrato Ilírico, produciendo una cultura latina claramente panoniana que persistiría en bolsillos aislados, incluso cuando el colapso del Imperio Occidental y las sucesivas olas de asentamiento hunnic, gótico y avar barrido sobre la provincia en los siglos que siguieron."

 dalmatian_ce_history_loc: "Se separó de [CULTURE.GetName] [Glossary('de las ciudades costeras fortificadas', 'DALMATIAN_CE_GLOSS')] en el año [DATE.GetYear]"
 DALMATIAN_CE_GLOSS: "A medida que las migraciones eslavas se extendieron por el interior de los Balcanes en los siglos VI y VII, remodelando el mapa político y lingüístico de la península, las ciudades fortificadas Illyro-romanas de la costa dálmata, Zadar, Sepárense. y Dubrovnik entre ellos, considerado como bolsillos aislados de vida urbana continuada en latín-descendida, protegidos por sus muros y su orientación marítima hacia Italia y Bizancio. Este aislamiento costero del interior dominado por los eslavos permitió que durante siglos perdurara una lengua y una identidad cívica diferenciadas, una continuación urbana directa del viejo mundo provincial Illyro-romano, incluso cuando los pueblos eslavos llegaron a dominar por completo la campiña circundante."

 andalusian_history_loc: "Se formó a partir de [CULTURE.GetName] [Glossary('población que se mezcla con la', 'ANDALUSIAN_GLOSS')] [TARGET_CULTURE.GetName] alrededor del año [DATE.GetYear]"
 ANDALUSIAN_GLOSS: "La conquista omeya de Ibérica Visigotía en 711 trajo el gobierno árabe y bereber a una población cristiana que, en lugar de ser desplazada, se estableció en un nuevo orden bajo sus conquistadores, convirtiendo al Islam en generaciones posteriores a un ritmo que eventualmente haría a los musulmanes la mayoría en gran parte de la península. Centurias de la gobernanza compartida, el matrimonio y la floración de una cultura de la corte Andalusi diferenciada en ciudades como Córdoba wove la población visigotica-romana existente junto con los recién llegados árabes y bereberes, produciendo una de las sociedades islámicas más sofisticadas y cosmopolitas del mundo medieval."

 iqritis_history_loc: "Se formó a partir de [CULTURE.GetName] [Glossary('exiliados conquistando los', 'IQRITIS_GLOSS')] [TARGET_CULTURE.GetName] alrededor del año [DATE.GetYear]"
 IQRITIS_GLOSS: "Los sobrevivientes de una revuelta fallida contra el gobierno de Omeya en el suburbio de Córdoba de al-Rabad en 818 huyeron completamente de Iberia, primero tratando de establecerse en Alejandría antes de que las fuerzas de Abbasid los expulsaran también. Esta banda de exiliados andaluces, con ningún otro lugar a girar, incautó la isla de Creta en 824 y fundó su propio emirato independiente, gobernando desde la fortaleza de Chandax como señores piratas del Egeo durante más de un siglo hasta que la reconquista bizantina finalmente extinguió su estado en 961. Lejos de su patria ibérica, estos exiliados andaluces construyeron una cultura insular distinta mezclando sus orígenes andalusíes con la población griega que ahora gobernaban."

 navarro_aragonese_history_loc: "Se separó de [CULTURE.GetName] [Glossary('Cristianos de la frontera pirenaica', 'NAVARRO_ARAGONESE_GLOSS')] en el año [DATE.GetYear]"
 NAVARRO_ARAGONESE_GLOSS: "A medida que los pequeños reinos cristianos tomando forma en las estribaciones pirenaicas de Navarra y Aragón crecieron y consolidaron a través del siglo IX, atrajeron a una población que incluía a cristianos mozárabes que habían vivido bajo el dominio musulmán más al sur antes de emigrar al norte para unirse a los reinos fronterizos tomando forma en las montañas. Esta mezcla de una población cristiana pirenaica existente con las distintas sensibilidades religiosas y culturales de los recién llegados mozárabes dio a la identidad navarro-aragonesa emergente un carácter tanto por su posición en la frontera de la Reconquista como por su territorio montañoso."

 catalan_history_loc: "Se formó a partir de [CULTURE.GetName] [Glossary('colonos que se mezclan con los', 'CATALAN_GLOSS')] [TARGET_CULTURE.GetName] alrededor del año [DATE.GetYear]"
 CATALAN_GLOSS: "A finales del siglo VIII, Carlomagno impulsó la formación de la Marca Hispánica como frontera defensiva frente a al-Ándalus. Los colonos, administradores y soldados llegados del ámbito franco y occitano se asentaron junto a las poblaciones locales, aportando nuevas estructuras políticas y militares. La interacción entre estas comunidades y la continuidad de las tradiciones romances de la región contribuyeron al desarrollo de una identidad cultural catalana propia."

 aragonese_history_loc: "Se formó a partir de [CULTURE.GetName] [Glossary('pueblos unidos con', 'ARAGONESE_GLOSS')] [TARGET_CULTURE.GetName] alrededor del año [DATE.GetYear]"
 ARAGONESE_GLOSS: "La población montañosa de las tierras altas pirenaicas, navarro-aragonesa en habla y costumbre, había intercambiado durante generaciones, contraído matrimonios y compartido pasto con la creciente población de habla catalana más al este, incluso mientras las dos regiones permanecían bajo dominio separado. Cuando estas dos poblaciones llegaron bajo una sola corona aragonesa en 1035, la unión política simplemente dio forma duradera a los lazos de comercio y parentesco de las comunidades de lengua alta y de habla catalana ya había estado construyendo a través de la frontera entre ellas, y como colonos de ambas poblaciones empujaron al sur contra al-Ándalus en los siglos siguientes, esta experiencia de frontera compartida fusionó la herencia navarro-argona y catalana en una sola identidad aragonesa distinta."

 asturleonese_history_loc: "Se formó a partir de [CULTURE.GetName] [Glossary('refugiados que se encuentran en situación de asentamiento', 'ASTURLEONESE_GLOSS')] [TARGET_CULTURE.GetName] alrededor del año [DATE.GetYear]"
 ASTURLEONESE_GLOSS: "Los nobles visigodosos y las familias refugiadas huyen al sur hacia las montañas de Asturias después de la conquista omeya de Iberia asentada entre la población montañosa que ya vive allí, una fusión recordada en la tradición como comienzo con la resistencia en Covadonga alrededor de 722. Generaciones de vida montañosa compartidas tejían a estos recién llegados visigoticos en la población asturiana existente, y a medida que esta comunidad mezclada expandía constantemente su territorio hacia el sur, eventualmente trasladando su centro a León, la población visigotía-asturiana fusionada llevó la tradición Reconquista más antigua hacia adelante como los antepasados de la identidad asturleonesa más amplia."

 castilian_history_loc: "Se formó a partir de [CULTURE.GetName] [Glossary('colonos que se mezclan con los', 'CASTILIAN_GLOSS')] [TARGET_CULTURE.GetName] alrededor del año [DATE.GetYear]"
 CASTILIAN_GLOSS: "La frontera oriental del Reino de Asturias, un territorio rocoso arrasado con los castillos que eventualmente darían su nombre a la región, llevó a los colonos desprovistos de Visigothic a la población montañosa Cantabria existente mientras los reinos cristianos empujaban sus defensas contra al-Ándalus cada vez más al este. Esta fusión de la herencia política visigotica con el mundo más antiguo y ferozmente independiente Cantabrian Highland produjo una identidad fronteriza que, en los siglos que siguieron, crecería de un pequeño condado oriental al poder dominante de Christian Iberia."

 galician_history_loc: "Se formó a partir de [CULTURE.GetName] [Glossary('refugiados que se mezclan con los', 'GALICIAN_GLOSS')] [TARGET_CULTURE.GetName] alrededor del año [DATE.GetYear]"
 GALICIAN_GLOSS: "Los refugiados visigodos que huían de la conquista omeya de la península ibérica encontraron refugio en las tierras montañosas y costeras del noroeste, habitadas desde antiguo por los descendientes de los galaicos, cuyo nombre pervive en el de Galicia. La integración de estas poblaciones cristianas y la herencia galaicorromana contribuyeron a formar una identidad gallega estrechamente vinculada a la vecina Asturias durante los primeros siglos de resistencia cristiana. Su orientación atlántica y las antiguas rutas romanas hacia Compostela otorgaron a la región un carácter propio dentro de la Iberia cristiana."

 portuguese_history_loc: "Se separó de [CULTURE.GetName] [Glossary('colonos de la frontera sur del Minho', 'PORTUGUESE_GLOSS')] en el año [DATE.GetYear]"
 PORTUGUESE_GLOSS: "Las tierras situadas al sur del río Miño, conquistadas a al-Ándalus tras generaciones de guerras fronterizas, fueron repobladas por comunidades de gallegos, leoneses y cristianos mozárabes atraídos por las tierras de cultivo de esta frontera. A ellos se sumaron caballeros y colonos borgoñones llegados con Enrique de Borgoña, que recibió el condado en 1096. Esta población, diversa en sus orígenes y habituada a defender un territorio fronterizo, desarrolló gradualmente una identidad diferenciada de la gallega. Fue el apoyo de estas comunidades el que permitió a Alfonso Enríquez proclamarse rey de Portugal y romper sus vínculos políticos con Galicia y León."

 french_history_loc: "Se formó a partir de [CULTURE.GetName] [Glossary('gobernantes que gobiernan sobre', 'FRENCH_GLOSS')] [TARGET_CULTURE.GetName] alrededor del año [DATE.GetYear]"
 FRENCH_GLOSS: "El Tratado de Verdún de 843 dividió el imperio de Carlomagno entre sus nietos. La parte asignada a Carlos el Calvo, Francia Occidental, comprendía buena parte de los antiguos territorios galorromanos sometidos durante siglos a la influencia franca. En este marco político, la evolución de las hablas romances y la integración de las tradiciones francas y galorromanas favorecieron la formación de una identidad francesa diferenciada."

 norman_history_loc: "Se formó a partir de [CULTURE.GetName] [Glossary('colonos otorgaron tierras entre los', 'NORMAN_GLOSS')] [TARGET_CULTURE.GetName] alrededor del año [DATE.GetYear]"
 NORMAN_GLOSS: "El rey Carlos sencillo, incapaz de detener las redadas vikingas a lo largo del Sena por la fuerza, concedió al jefe nórdico Rollo el territorio alrededor de Rouen por tratado en el 911, un arreglo que compró paz a cambio del bautismo de Rollo y sumisión nominal a la corona francesa. Los colonos nórdicos que siguieron a Rollo a este nuevo ducado se casaron rápidamente con la población francesa existente, y dentro de unas pocas generaciones sus descendientes habían abandonado la lengua nórdica enteramente para el francés, conservando sólo su reputación marcial vikinga y una feroz ambición de hambre terrestre que llevaría armas normanda a Inglaterra, Sicilia y más allá."

 poitevin_history_loc: "Se formó a partir de [CULTURE.GetName] [Glossary('gobernantes que gobiernan sobre', 'POITEVIN_GLOSS')] [TARGET_CULTURE.GetName] alrededor del año [DATE.GetYear]"
 POITEVIN_GLOSS: "Poitou se sentó directamente en la frontera lingüística entre el norte de habla Oïl y el sur de habla Oc, una posición que lo hizo un premio constante en las luchas de poder entre la corona francesa y los reyes Angevin de Inglaterra que, a través de Eleanor de Aquitania, reclamaron Poitou como parte de sus propias vastas posesiones continentales. Generaciones de dominio disputado bajo los señores franceses y de Angevin por igual tejían influencia occitana en lo que seguía siendo una población fundamentalmente francófona, produciendo un dialecto Poitevin distinto que llevaba las marcas de su larga posición como frontera entre dos mundos."

 gallo_f_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos del este de Bretaña', 'GALLO_F_GLOSS')] en el año [DATE.GetYear]"
 GALLO_F_GLOSS: "Las marchas orientales de Bretaña, más cercanas al mundo franco más allá, abandonaron gradualmente el discurso bretón celta para el francés romance, incluso cuando su lealtad política y su identidad cultural permanecieron firmemente ligadas al ducado bretón en lugar de a Francia misma. Este cambio lingüístico, que ocurre mientras la identidad bretón política y cultural persiste ininterrumpidamente, produjo el caso inusual de una población francófona que se consideraba completamente bretón, su discurso galo un lenguaje lingüístico en un ducado definido de otra manera por su lengua celta."

 burgundian_oil_history_loc: "Se formó a partir de [CULTURE.GetName] [Glossary('gobernantes que gobiernan sobre', 'BURGUNDIAN_OIL_GLOSS')] [TARGET_CULTURE.GetName] alrededor del año [DATE.GetYear]"
 BURGUNDIAN_OIL_GLOSS: "El antiguo reino de Borgoña, establecido generaciones antes por un pueblo germano oriental que dio su nombre a la región, fue dividido repetidamente y reasignado entre los herederos carolingianos competidores siguiendo el Tratado de Verdún, sus señores francos que cambiaron a medida que su población subyacente sufrió. Esta desafortunada superación política de Carolingian, encabezada por una población de Borgoña ya varios siglos en su propia fusión con el viejo mundo galo-romano, dio lugar a un dialecto e identidad distintos de Borgoña francés, incluso cuando el viejo nombre y orgullo de Borgoña persistía independientemente de lo que el señor franco reclamaba la región."

 picard_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos de las ciudades de comercio septentrional', 'PICARD_GLOSS')] en el año [DATE.GetYear]"
 PICARD_GLOSS: "Las ciudades de lana y tela de Picardy, jefe de Amiens entre ellos, se convirtieron en algunas de las comunas más ricas y ferozmente autogobernantes del gran avivamiento comercial medieval, sus cartas y milicias cívicas ganaron a través de la negociación dura y la revuelta abierta ocasional contra sus señores nominales. Esta concentración de la riqueza comercial urbana y la independencia comunal le dio a Picardy un orgullo y dialecto regionales distintos de los franceses de la corte real y el campo más al sur, uno arraigado tanto en la sala de gremios y plaza de mercado como en cualquier lealtad feudal."

 arpitan_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos de las tierras fronterizas de los Alpes y el Ródano', 'ARPITAN_GLOSS')] en el año [DATE.GetYear]"
 ARPITAN_GLOSS: "El país montañoso donde el valle del Ródano se encuentra con los Alpes occidentales, que abarcan a Saboya y las tierras alrededor del lago de Ginebra, se sentó en una auténtica encrucijada entre los mundos lingüísticos franceses y occitanos emergentes sin caer claramente en ninguno de los dos. Esta posición fronteriza, reforzada por el difícil terreno alpino de la región, deja que arraigue un discurso e identidad franco-Provençal distinto, que conservaba su propio carácter precisamente porque no pertenecía plenamente al norte ni al sur."

 outremer_history_loc: "Se formó a partir de [CULTURE.GetName] [Glossary('colonos que se establecen en los', 'OUTREMER_GLOSS')] [TARGET_CULTURE.GetName] alrededor del año [DATE.GetYear]"
 OUTREMER_GLOSS: "Cuando los ejércitos de la Primera Cruzada atravesaron los muros de Jerusalén en 1099, abrieron el camino para una ola de asentamiento francófono a través de los recién conquistados estados cruzados del Levante, los colonos llegaron a llamar simplemente a Outremer, 'extrañas'. Caballeros franceses, comerciantes, y clero que hizo sus casas en Jerusalén, Antioquía, Trípoli, Edessa construyó una sociedad francesa trasplantada en medio de una población levantina abrumadora, produciendo una cultura francesa Outremer distinta tanto por su entorno Levantine y contacto constante con bizantino, Armenia, y vecinos musulmanes como por sus orígenes franceses."

 occitan_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos del mundo galorromano meridional', 'OCCITAN_GLOSS')] en el año [DATE.GetYear]"
 OCCITAN_GLOSS: "El continuum lingüístico galo-romano que una vez se extendió a través de toda la Galia romana comenzó a dividirse a lo largo de una línea áspera que separaba al norte del sur antes de que cualquier reino franco dividiera formalmente el territorio, la zona sur de habla ocular que se desarrolla a lo largo de su propio camino distinto del norte de habla oïl que eventualmente daría lugar al francés. Esta divergencia sur, que abarca Aquitania, Languedoc, y el mundo más amplio de Occitan, produjo un lenguaje romaní y una cultura literaria de trovadores que florecería como una de las tradiciones cortesanas más sofisticadas de Europa medieval."

 gascon_history_loc: "Se formó a partir de [CULTURE.GetName] [Glossary('colonos que se mezclan con los', 'GASCON_GLOSS')] [TARGET_CULTURE.GetName] alrededor del año [DATE.GetYear]"
 GASCON_GLOSS: "Los antiguos Vascones de habla vasca mantenían las estribaciones occidentales de los Pirineos mucho antes de que el discurso de Occitán se extendiera a la región desde el mundo más ancho de galorromano hasta el norte y el este, y en lugar de desplazarse esta población vasca usaba sus propias características lingüísticas profundas en la lengua occitana entrante. Esta fusión produjo Gascón, un dialecto cuyo sustrato vasco lo caracteriza como inconfundible incluso entre la variada familia del discurso de Occitán, sus hablantes llevando adelante una identidad pirenaica formada tanto por sus antepasados vascos como por sus vecinos de habla occitana."

 provencal_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos del valle del bajo Ródano', 'PROVENCAL_GLOSS')] en el año [DATE.GetYear]"
 PROVENCAL_GLOSS: "A medida que el Condado de Provenza surgió como una entidad política distinta a lo largo de la costa baja del Ródano y del Mediterráneo, rompiendo el Reino fracturado de Borgoña para trazar su propio rumbo, su población de habla occitana desarrolló cada vez más una identidad regional para igualar. Esta creciente distintividad provenzal, anclada por el comercio mediterráneo del condado y su posterior cercanía con el condado de Barcelona, produjo un dialecto y una cultura orgullosos de su carácter costero y cosmopolita, incluso mientras permanecía firmemente arraigada en el mundo lingüístico occitano más amplio."

 bavarian_history_loc: "Se formó a partir de [CULTURE.GetName] [Glossary('colonos que se mezclan con los', 'BAVARIAN_GLOSS')] [TARGET_CULTURE.GetName] alrededor del año [DATE.GetYear]"
 BAVARIAN_GLOSS: "Los Marcomanni habían gobernado un poderoso reino suebio en Bohemia desde los días del rey Marbod, luchando contra Roma para mantenerse de pie en las Guerras Marcománicas del siglo II antes de siglos de continua presencia a lo largo de la frontera superior del Danubio. Cuando la autoridad romana en las provincias de Raetia y Noricum finalmente se derrumbó a mediados del siglo V, los colonos desprovistos de marcomano se trasladaron al sur a este antiguo territorio romano, encontrando tierras no vacías sino una población romanizada existente que había vivido bajo la sombra del imperio durante generaciones. Esta fusión de los recién llegados alemanes suebios con la población romanizada raetiana, unidos por contribuciones más pequeñas de los vecinos Alemanni, lombardos y Turingianos que pasan por la región, produjo la confederación poliétnica Baiuvarii, cuyos duques los francos pronto se dibujarían en su propia órbita mientras el ducado de tronco de Baviera tomó forma."

 saxon_history_loc: "Se separó de [CULTURE.GetName] [Glossary('tras la conquista franca', 'SAXON_GLOSS')] en el año [DATE.GetYear]"
 SAXON_GLOSS: "Los sajones continentales combatieron durante más de tres décadas contra los ejércitos de Carlomagno en las guerras sajonas (772-804). El conflicto estuvo marcado por la matanza de Verden en 782 y por la imposición de conversiones y traslados forzosos con los que el monarca franco buscó acabar con la resistencia sajona. A diferencia de sus parientes que habían emigrado a Britania siglos antes y dieron origen a los anglosajones, los sajones continentales fueron incorporados directamente al Imperio carolingio."

 swabian_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos que conforman la provincia de la frontera romana', 'SWABIAN_GLOSS')] en el año [DATE.GetYear]"
 SWABIAN_GLOSS: "Los suebios estaban entre los más poderosos y ampliamente dispersos de las antiguas confederaciones germánicas, tan dominantes en la etnografía de la era romana que Tacitus usaba su nombre casi como una palabra para el mundo alemán más amplio que el Rin. Como el poder romano en la provincia fronteriza que se convertiría en Swabia finalmente dio lugar en el siglo V, los colonos descompuestos por Suebian se establecieron a través de la región en una ola de asentamiento distinto de, aunque relacionado con, la migración marcomano que produciría la vecina Baviera, llevando el antiguo nombre suebio hacia adelante en el Ducado medieval de Swabia."

 ripuarian_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos del Rin medio', 'RIPUARIAN_GLOSS')] en el año [DATE.GetYear]"
 RIPUARIAN_GLOSS: "Los francos ripuarios se asentaron a lo largo del Rin medio, en torno a Colonia. Constituían una rama diferenciada del mundo franco, distinta de los francos salios, que se habían extendido hacia el oeste, por la Galia. Su derecho consuetudinario quedó recogido en la Lex Ripuaria, paralela a la más conocida Ley Sálica. Su posición en la frontera del Rin y la proximidad de sajones y frisones aún no sometidos contribuyeron a forjar una identidad propia, diferente de la de los francos salios occidentales, más romanizados."

 franconian_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos del valle del Meno', 'FRANCONIAN_GLOSS')] en el año [DATE.GetYear]"
 FRANCONIAN_GLOSS: "Los asentamientos francos se extendieron hacia el este y el sur siguiendo el valle del río Meno, hasta las tierras que acabarían recibiendo el nombre de Franconia. Esta región fronteriza, próxima a los territorios de turingios y bávaros, recibió sucesivas oleadas de colonos francos tras las conquistas merovingias de comienzos del siglo VI. La expansión oriental del mundo franco, vinculada al Meno más que al Rin, favoreció el desarrollo de una identidad regional y un dialecto propios, sin romper sus vínculos con las tradiciones políticas y jurídicas francas."

 low_frankish_history_loc: "Se separó de los [CULTURE.GetName] [Glossary('asentados entre los ríos Rin y el Mosa', 'LOW_FRANKISH_GLOSS')] en el año [DATE.GetYear]"
 LOW_FRANKISH_GLOSS: "Los asentamientos francos en las tierras bajas del delta del Rin y el Mosa siguieron una evolución distinta de la de los territorios francos situados más al sur. El paisaje pantanoso, las frecuentes inundaciones y la proximidad de los frisones favorecieron el desarrollo de una identidad cultural y lingüística diferenciada de las variedades del alto franconio habladas en Renania y otras regiones del reino franco. Estas comunidades bajofranconas, vinculadas tanto a las poblaciones costeras del mar del Norte como a los territorios del interior, conservaron rasgos culturales y dialectales propios que contribuirían posteriormente a la formación de las lenguas bajofranconas, entre ellas el neerlandés."

 thuringian_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos sometidos a la tribu', 'THURINGIAN_GLOSS')] en el año [DATE.GetYear]"
 THURINGIAN_GLOSS: "El reino independiente de los turingios había dominado el centro de Germania durante generaciones, hasta que el rey franco Teodorico derrotó a su ejército en la batalla del Unstrut en 531. Con ello terminó su independencia política y el núcleo de su territorio quedó incorporado al reino franco. Aunque perdieron su monarquía, los turingios conservaron su identidad bajo el dominio franco y sus costumbres jurídicas acabaron recogidas en un código propio."

 frisian_history_loc: "Se formó a partir de [CULTURE.GetName] [Glossary('colonos que absorben', 'FRISIAN_GLOSS')] [TARGET_CULTURE.GetName] alrededor del año [DATE.GetYear]"
 FRISIAN_GLOSS: "Los frisios de época romana desaparecieron de las fuentes escritas después del siglo III, cuando las inundaciones y la subida del nivel del mar hicieron cada vez más difícil habitar sus tierras costeras. Hacia el año 400, amplias zonas quedaron abandonadas durante generaciones. Cuando la costa volvió a ser habitable en el siglo V, llegaron nuevos pobladores emparentados con los grupos anglosajones del mar del Norte, que absorbieron a los pequeños núcleos supervivientes de la antigua población. Los recién llegados adoptaron el nombre de frisios y, de esta mezcla, surgieron las comunidades frisias conocidas por las fuentes medievales."

 east_elbian_history_loc: "Se separó de [CULTURE.GetName] [Glossary('colonos de la frontera de colonización oriental', 'EAST_ELBIAN_GLOSS')] en el año [DATE.GetYear]"
 EAST_ELBIAN_GLOSS: "Las tierras al este del Elba habían estado habitadas durante siglos por pueblos eslavos polabios. Durante la expansión colonizadora hacia el este, conocida como Ostsiedlung, campesinos, monjes y fundadores de poblaciones sajones cruzaron la antigua frontera en busca de tierras y oportunidades. Muchos llegaron invitados por príncipes eslavos interesados en atraer colonos experimentados, mientras monasterios y diócesis impulsaban nuevos asentamientos. Esta colonización transformó gradualmente las marcas orientales en territorios de habla alemana y difundió las costumbres jurídicas y agrícolas de Sajonia."

 prussian_g_history_loc: "Se formó a partir de [CULTURE.GetName] [Glossary('colonos que se mezclan con los', 'PRUSSIAN_G_GLOSS')] [TARGET_CULTURE.GetName] alrededor del año [DATE.GetYear]"
 PRUSSIAN_G_GLOSS: "La cruzada de la Orden Teutónica contra los prusianos bálticos paganos comenzó en la década de 1230, tras la invitación de un duque polaco que buscaba contener sus incursiones. A décadas de conquista siguió una política deliberada de colonización alemana. Los colonos sajones que acompañaron a los caballeros de la Orden se asentaron entre los supervivientes de la población báltica autóctona. Bajo la administración de la Orden, la mezcla de ambas tradiciones dio origen a una identidad prusiana germanizada, mientras la antigua lengua prusiana retrocedía paulatinamente hasta desaparecer."

 dutch_history_loc: "Se formó a partir de [CULTURE.GetName] [Glossary('colonos fusionados con los', 'DUTCH_GLOSS')] [TARGET_CULTURE.GetName] alrededor del año [DATE.GetYear]"
 DUTCH_GLOSS: "Las comunidades bajofranconas del delta del Rin y el Mosa y las poblaciones frisias de las costas e islas habían seguido trayectorias distintas durante siglos: unas vinculadas al mundo franco y otras a sus propias tradiciones marítimas. Sin embargo, compartían las mismas tierras bajas y la lucha constante contra el mar. Siglos de vecindad, comercio y matrimonios entre ambos grupos entrelazaron sus hablas y costumbres, favoreciendo la aparición de la lengua y la identidad neerlandesas que caracterizarían al condado de Holanda y sus territorios vecinos."

 walloon_history_loc: "Se formó a partir de [CULTURE.GetName] [Glossary('colonos que se mezclan con los', 'WALLOON_GLOSS')] [TARGET_CULTURE.GetName] alrededor del año [DATE.GetYear]"
 WALLOON_GLOSS: "El sur de los Países Bajos se encontraba sobre la antigua frontera lingüística entre las hablas romances y germánicas. Esta división atravesaba la región y exponía a sus principados a una influencia francesa constante, aunque sus instituciones políticas y sociales seguían vinculadas a los Países Bajos. La interacción de las hablas romances con las comunidades locales de los condados y obispados meridionales favoreció la aparición de una identidad valona diferenciada, romance por su lengua y ligada a los Países Bajos por su trayectoria histórica."

 flemish_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos de las grandes ciudades de comercio de tela', 'FLEMISH_GLOSS')] en el año [DATE.GetYear]"
 FLEMISH_GLOSS: "La industria textil de Flandes atrajo a sus ciudades una población rural cada vez más numerosa. Tejedores, tintoreros y bataneros acudieron a Brujas, Gante e Ypres desde las comarcas circundantes, hasta convertirlas en algunos de los mayores centros urbanos de la Europa medieval. Esta concentración de artesanos y comerciantes, organizados en gremios y asentados durante generaciones en las ciudades, diferenció a la población flamenca de las comunidades rurales de su entorno y dio a su identidad un marcado carácter urbano y mercantil."

 old_anglian_history_loc: "Se separó de [CULTURE.GetName] [Glossary('colonos de Gran Bretaña oriental', 'OLD_ANGLIAN_GLOSS')] en el año [DATE.GetYear]"
 OLD_ANGLIAN_GLOSS: "Los anglos continentales procedían de la península de Anglia, en el actual Schleswig-Holstein. Su emigración a Britania fue tan intensa que, según algunas fuentes, su tierra de origen quedó despoblada durante generaciones. A diferencia de los sajones, concentrados principalmente en el sur, los anglos se establecieron en la costa oriental de Britania y fundaron reinos como Northumbria, Anglia Oriental y Mercia. La propia lengua inglesa conserva su nombre y buena parte de su herencia, vinculados a estos pobladores anglos."

 northumbrian_history_loc: "Formado a partir de [CULTURE.GetName] y [Glossary('reinos unidos con', 'NORTHUMBRIAN_GLOSS')] [TARGET_CULTURE.GetName] alrededor del año [DATE.GetYear]"
 NORTHUMBRIAN_GLOSS: "Los colonos angloses de Bernicia y Deira compartieron un origen común en la misma migración de Angeln, sin embargo las dos comunidades se separaron a través de generaciones de asentamientos separados en ambos lados de los Tees, desarrollando sus propias costumbres y lealtades regionales, incluso cuando su discurso permanecía mutuamente inteligible. Centurias del cambio de la guerra fronteriza entre las dos poblaciones anglianas, marcadas por la conquista reiterada y la reunificación, condujeron oleadas de matrimonio y reasentamiento de una y otra vez a través de su antigua frontera como nobles y comunes por igual se encontraron absorbidos en cualquier reino que actualmente tenía la mano superior. Esta repetida parte de la población entre Bernicia y Deira agotó gradualmente cualquier distintividad regional que alguna vez había separado a las dos comunidades anglosianas, y era esta población completamente intermiada, no ninguna línea real, que dio lugar a un solo pueblo de Northumbrian duradero, uno cuyos monasterios en Lindisfarne y Jarrow pronto lo convertiría en un centro líder del aprendizaje y el arte manuscrito en la Cristiandad medieval temprana."

 anglo_norse_history_loc: "Se formó a partir de [CULTURE.GetName] [Glossary('colonos que se mezclan con los', 'ANGLO_NORSE_GLOSS')] [TARGET_CULTURE.GetName] alrededor del año [DATE.GetYear]"
 ANGLO_NORSE_GLOSS: "La conquista del Gran Ejército Heathen de gran parte del este y del norte de Inglaterra a partir de 865, seguido por un extenso asentamiento danés y noruego a través de lo que se conoció como el Danelaw, trajo a los recién llegados de habla nórdica en contacto directo diario con la población anglosajón existente de los reinos conquistados. En lugar de una gente desplazando a la otra, generaciones de tierras agrícolas compartidas, entre matrimonios, y alojamiento legal en virtud del derecho consuetudinario influenciado por el nórdico fusionaron a las dos poblaciones, produciendo una cultura claramente anglo-norse cuyos nombres de lugar, vocabulario, y las tradiciones legales todavía llevaban el sello inconfundible del asentamiento escandinavo mucho después de que los propios límites políticos de Danelaw se hubieran desvanecido."

 northerner_history_loc: "Se formó a partir de [CULTURE.GetName] [Glossary('pueblos que se unen con', 'NORTHERNER_GLOSS')] [TARGET_CULTURE.GetName] alrededor del año [DATE.GetYear]"
 NORTHERNER_GLOSS: "Las tierras anglo-norseles muy escandinavas del este de Danelaw y el antiguo reino anglicano de Northumbria, más allá del norte, habían seguido caminos políticos distintos durante generaciones, pero la conquista normanda y el brutal Harrying del norte que siguió en 1069 y 1070 devastaron ambos por igual, aplanando cualquier distinción política que los había separado. De esta devastación compartida y las lentas generaciones de recuperación que siguieron, surgió una identidad más amplia del norte de inglés, que fusionó la herencia anglo-norte y norumbría en una sola cultura regional orgullosa y a menudo desafíadamente distinta del sur dominado por Norman."

 english_history_loc: "Se formó a partir de [CULTURE.GetName] [Glossary('conquistadores gobernando sobre', 'ENGLISH_GLOSS')] [TARGET_CULTURE.GetName] alrededor del año [DATE.GetYear]"
 ENGLISH_GLOSS: "William de la victoria de Normandía en Hastings en 1066 trajo a una aristocracia normanda francófona para gobernar sobre una población anglosajón que superó en gran medida a sus nuevos conquistadores, y las generaciones siguientes vieron la capa francesa normanda en sí misma encima del inglés anglosajón en todos los niveles de derecho, tenencia de la tierra y vida cortesana. Esta lenta fusión, tocando a lo largo de aproximadamente un siglo cuando los señores normandos se casaron con esposas inglesas y sus descendientes crecieron hablando el idioma de sus madres y enfermeras, produjo una nueva identidad e idioma inglés, uno cuyo vocabulario todavía lleva visiblemente la doble herencia de la granja anglosajón y la mesa alta francesa normanda."

 scottish_history_loc: "Se formó a partir de [CULTURE.GetName] [Glossary('reinos unidos con los', 'SCOTTISH_GLOSS')] [TARGET_CULTURE.GetName] alrededor del año [DATE.GetYear]"
 SCOTTISH_GLOSS: "El antiguo reino angliano de Northumbria y los británicos de habla cumbric de Strathclyde se habían enfrentado entre sí a través de una frontera cambiante en el sur de Escocia durante siglos, su frontera volvió a formar repetidamente por la guerra, la incursión vikinga y el matrimonio dinástico por igual. Como la corona escocesa absorbió constantemente tanto lothian de Northumbrian como el antiguo reino de Strathclyde en un solo reino unificado a través de los siglos X y XI, la poblacion angliana y cumbric de las tierras bajas escocesas dio lugar a una identidad distinta de habla escocés, uno que llevaba adelante la herencia de Northumbrian y Cumbrian bajo una corona escocesa recién dominante."

 scanian_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos de la península meridional', 'SCANIAN_GLOSS')] en el año [DATE.GetYear]"
 SCANIAN_GLOSS: "Scania ocupó la punta más al sur de la península escandinava, su fértil suelo de tierras bajas que apoyaba a una de las poblaciones más densas y ricas de la agricultura y el comercio en cualquier lugar del mundo asentado por Dinamarca, una prosperidad que atrajo un asentamiento constante de todo el estrecho sonido que separa a Escania del resto de Dinamarca. Esta concentración de agricultores, pescadores y comerciantes a lo largo del sonido dio a Scania un carácter regional claramente próspero dentro de la población danesa más amplia, una cuya riqueza agrícola y ciudades comerciales mantendría a la región un premio codiciado entre los colonos daneseses y suecos durante siglos por venir."

 got_history_loc: "Se separó de [CULTURE.GetName] [Glossary('parientes del continente migratorio', 'GOT_GLOSS')] en el año [DATE.GetYear]"
 GOT_GLOSS: "El historiador gótico Jordanes contó a los Geats entre tres tribus estrechamente relacionadas de la antigua Scandza, junto a los Ostrogoths de Östergötland y una tercera gente generalmente identificada con los Gotlanders, todos considerados ramas de una familia gótica compartida antes de que los Goths continentales migraron al sur a lo largo de la Vístula para encontrar eventualmente los reinos visigodos y ostrogóticos del mundo romano. La isla de Gotland, preservando su propia leyenda de fundación del colonizador en el Gutasaga, desarrolló su propia identidad comercial marítima propia en los siglos que el continente Geats pasó como una entidad política separada, compartiendo una antigua raíz común pero siguiendo su propio camino de isla configurado por su posición central en el comercio del Mar Báltico."

 greenlandic_history_loc: "Se formó a partir de [CULTURE.GetName] [Glossary('colonizadores', 'GREENLANDIC_GLOSS')] [TARGET_CULTURE.GetName] alrededor del año [DATE.GetYear]"
 GREENLANDIC_GLOSS: "Erik el Rojo, exiliado de Islandia por homicidio, dirigió el primer asentamiento sustancial de Norse en Groenlandia alrededor de 985, designando deliberadamente la tierra nueva dura para atraer a otros colonos ansiosos por pastos verdes. Los colonos islandeses que siguieron a Erik a través del mar llevaron sus propias costumbres y leyes islandesas ya distintas a estas nuevas granjas costeras, y el aislamiento extremo de los asentamientos del fiordo de Groenlandia, cortada de Islandia por semanas de peligrosas velas en el océano abierto, dejar que una identidad groenlandesa distinta tome forma, uno adaptado a la temporada de crecimiento más corta y la granja más marginal de cualquier asentamiento de Norse en el Atlántico Norte."

 swedish_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos del valle de Mälaren', 'SWEDISH_GLOSS')] en el año [DATE.GetYear]"
 SWEDISH_GLOSS: "El Svear del valle de Mälaren, cuyo propio nombre Suecia todavía lleva, se estableció espesamente alrededor del centro sagrado en Old Uppsala y la ciudad comercial de Birka, una población agrícola y mercante que proyectaba su influencia al este a través del Báltico a través del comercio y asentamiento mucho antes de cualquier corona unida Svealand a sus vecinos del sur. Generaciones de contacto, comercio y eventual asentamiento entre esta población de Svear y las Geats del sur, una vez independientes, han tejido gradualmente a los dos pueblos juntos, una fusión dada una forma política duradera alrededor de la vuelta del milenio, pero arraigada en una historia mucho más larga de tierras de cultivo compartidas, matrimonio y comercio entre las dos poblaciones. Fue esta población mezclada de Svear-Geat que llevó adelante una identidad sueca distinta, que mantuvo el antiguo nombre de Svear, incluso ya que ahora abarcaba a los agricultores y pueblos Geatishfolk también."

 norwegian_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos de los fiordos occidentales', 'NORWEGIAN_GLOSS')] en el año [DATE.GetYear]"
 NORWEGIAN_GLOSS: "La población de Noruega vivió dispersa y aislada durante siglos, repleta de montañas y fiordos en pequeñas comunidades agrícolas y pesqueras autosuficientes cuyas lealtades regionales corrían más naturalmente a su propio valle y entrada que a cualquier identidad noruega más amplia. Este aislamiento comenzó a desmoronarse a medida que la propia población de la Edad Vikinga de Noruega se llevó cada vez más al mar, allanando, negociando y asentando hasta Islandia, Gran Bretaña y más allá, viajes que llevaron a las comunidades fiordos a un contacto mucho más regular entre sí que las rutas terrestres entre ellas. Fue esta mezcla marina entre antiguas poblaciones de fiordos aislados, formalizada políticamente alrededor de la unificación de Harald Fairhair de la costa, lo que dio lugar a una identidad noruega compartida distinta del patrón más antiguo de lealtad dispersada y llena de valle."

 norn_history_loc: "Se separó de [CULTURE.GetName] [Glossary('colonos de las islas del norte', 'NORN_GLOSS')] en el año [DATE.GetYear]"
 NORN_GLOSS: "Los colonos noruegos que colonizaron Orkney y Shetland encontraron cadenas isleñas lo suficientemente cercanas a la costa noruega para un contacto regular pero lo suficientemente distante para desarrollar su propio carácter regional, sus audífonos responden nominalmente a la corona noruega mientras funcionan durante largos tramos como poderes vikingos efectivamente independientes en su propio derecho. Este escenario de la isla del Atlántico Norte, orientado tanto hacia la incursión y el comercio en todo el Mar Irlandés como hacia el continente noruego, dio lugar a la lengua y cultura Norn, noruego en la raíz pero moldeado por su propia geografía insular y su enredo cercano, a menudo violento con el mundo gaélico a su oeste."

 faroese_history_loc: "Se separó de [CULTURE.GetName] [Glossary('colonos de las remotas islas del norte', 'FAROESE_GLOSS')] en el año [DATE.GetYear]"
 FAROESE_GLOSS: "Los colonos noruegos que hicieron el largo y peligroso cruce a distancia, visitaron las Islas Feroe un duro archipiélago volcánico con poca tierra cultivable pero excelente pastoreo para ovejas, de las cuales las islas llevan su propio nombre. Este aislamiento extremo, más allá del Atlántico Norte que casi cualquier otro asentamiento de Norse además de Islandia, deje que una lengua y cultura feroesas se arraiguen, una construida alrededor de la cría de ovejas, la caza de aves marinas y una vida comunal insular ferozmente autosuficiente formada por la distancia de las islas tanto de Noruega como del mundo nórdico más amplio."

 danish_history_loc: "Se formó a partir de [CULTURE.GetName] [Glossary('pueblos que se unen con', 'DANISH_GLOSS')] [TARGET_CULTURE.GetName] alrededor del año [DATE.GetYear]"
 DANISH_GLOSS: "Los daneses de la costa oriental de la península de Jutland y las islas danesas habían compartido desde hace mucho tiempo su patria con los Jutes del norte de Jutland, dos poblaciones relacionadas pero históricamente distintas del norte de Alemania, cuyas comunidades agrícolas y pesqueras se limitaban entre sí a través de la península durante generaciones. Centurias de convivencia, comercio y vida costera compartida entre estas poblaciones vecinas danesas y judías tejieron gradualmente a los dos pueblos juntos, una fusión que encontró una expresión política duradera bajo reyes como Harald Bluetooth en el siglo X, cuyas piedras Jelling proclamaron a los daneses unidos y cristianos bajo una corona. Fue esta larga población danesa y judía, no sólo la corona, la que llevó adelante la identidad danesa resultante a los siglos que siguieron."

 irish_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos de toda la isla', 'IRISH_GLOSS')] en el año [DATE.GetYear]"
 IRISH_GLOSS: "La geografía del siglo II de Ptolemy registra a los Iverni en el sur de Irlanda, un nombre tan estrechamente ligado a la isla misma que Ériu, Hibernia, e Irlanda todos descienden de la misma antigua raíz, y algunos eruditos creen que el nombre Iverni una vez aplicado a toda la población de la isla antes de estrecharse a un pueblo sur específico por el propio tiempo de Ptolomeo. Una teoría minoritaria pero influyente sostiene que los Iverni eran originalmente colonos de habla británica, más tarde desbordados por Gaels de habla goidelica que llegaban del continente, aunque esto sigue siendo realmente disputado entre los estudiosos celtas en lugar de un hecho resuelto. Sea cual sea la verdad exacta de ese debate, el orden político Iverni y sus parientes el Érainn dominaron una vez, incluyendo las dinastías Dáirine una vez poderosas de Munster, gradualmente dio paso a nuevas dinastías gaélicas como el Eóganachta y Uí Néill, y fue este consolidando a Gaelic, Orden de habla goidelica que dio a Irlanda medieval su identidad irlandesa duradera."

 manx_history_loc: "Se separó de [CULTURE.GetName] [Glossary('colonos del Mar Irlandés', 'MANX_GLOSS')] en el año [DATE.GetYear]"
 MANX_GLOSS: "La Isla del Hombre se sentó en el mismo centro del Mar Irlandés, a poca distancia de Irlanda, Escocia, Gales y el norte de Inglaterra por igual, y el asentamiento irlandés de la isla desde una fecha temprana le dio una población de habla gaélica desde el principio, incluso cuando su posición lo convirtió en una encrucijada natural y premio por todo poder de navegación en las aguas circundantes. Esta posición encrucijada, llamando repetidamente a Norse, escocés e inglés a lo largo de los siglos, permite que una identidad Manx Gaelic distinta tome forma, irlandesa en raíz lingüística pero configurada por una historia de la isla de contacto y conquista externa, a diferencia de la de Irlanda misma."

 gaelic_history_loc: "Se formó a partir de [CULTURE.GetName] [Glossary('colonos que se mezclan con los', 'GAELIC_GLOSS')] [TARGET_CULTURE.GetName] alrededor del año [DATE.GetYear]"
 GAELIC_GLOSS: "Los colonos irlandeses de Ulster cruzaron a Escocia occidental a lo largo de los siglos quinto y sexto, fundando el reino de Dál Riata atajó el Canal del Norte y poniendo el discurso goidelico en contacto directo y sostenido con la población Pictish existente en el continente escocés por primera vez. Centurios de matrimonio, realeza compartida, y eventual unión política, culminando en la unificación de los escoceses y los Picts en un solo reino en el siglo IX, fusionaron a los dos pueblos juntos, con el discurso gaélico y la costumbre constantemente desplazando Pictish incluso cuando la dinastía dominante del nuevo reino llevó adelante su propia herencia irlandesa y Pictish capa."

 gall_goidel_history_loc: "Se formó a partir de [CULTURE.GetName] [Glossary('colonos que se mezclan con los', 'GALL_GOIDEL_GLOSS')] [TARGET_CULTURE.GetName] alrededor del año [DATE.GetYear]"
 GALL_GOIDEL_GLOSS: "Las costas occidentales y las islas de Escocia vieron un intenso asentamiento de Norse a lo largo de la Edad Vikinga, y las generaciones de matrimonios y la vida costera compartida entre estos recién llegados nórdicos y la población gaélica existente produjeron una gente distintivamente mixta los irlandeses y los propios escoceses llamados el Gall-Goídil, esta cultura nórdica-galálica fusionada, prominente en los Hebrides y el Reino de la Isla, llevó adelante el discurso gaélico y gran parte de la costumbre gaélica, manteniendo una tradición nórdica y reputación de piratería que distinguen a la Gall-Goídil de las comunidades más puramente gaélicas de los continentes escoceses e irlandeseses."

 neretljanian_history_loc: "Se separó de [CULTURE.GetName] [Glossary('colonos del curso inferior del Neretva', 'NERETLJANIAN_GLOSS')] en el año [DATE.GetYear]"
 NERETLJANIAN_GLOSS: "Los cronistas bizantinos agruparon a los primeros pobladores eslavos de los Balcanes bajo la denominación general de esclavenos, pero hacia el siglo IX habían surgido distintas identidades tribales a lo largo de la fragmentada costa dálmata. Entre ellas destacaban los neretvanos, establecidos en el curso inferior del río Neretva y las islas cercanas. Protegidos por un laberinto de canales e islotes que dificultaba enormemente la vigilancia de las flotas extranjeras, los neretvanos adquirieron una temible reputación como piratas. Sus incursiones contra las embarcaciones mercantes venecianas y bizantinas llegaron a representar una amenaza tan persistente que incluso los dux de Venecia se vieron obligados a pagarles tributos para garantizar el paso seguro de sus naves por el Adriático durante generaciones."

 branichian_history_loc: "Se separó de [CULTURE.GetName] [Glossary('colonos de la frontera del Danubio', 'BRANICHIAN_GLOSS')] en el año [DATE.GetYear]"
 BRANICHIAN_GLOSS: "Los branichevianos se establecieron en la región de Braničevo, junto a la frontera del Danubio, en una posición estratégica disputada sucesivamente por bizantinos, búlgaros y húngaros. Cada una de estas potencias procuró controlar los pasos del río y las importantes rutas comerciales que atravesaban la región. Su situación fronteriza expuso a sus habitantes a continuas campañas militares, conquistas y reconquistas, conforme cambiaba el equilibrio de poder en el Danubio medio. Esta inestabilidad contribuyó a forjar una identidad regional marcada por el contacto y los conflictos entre las potencias vecinas, más que por la continuidad de unas instituciones políticas propias."

 doclean_history_loc: "Se separó de [CULTURE.GetName] [Glossary('colonos de la costa adriática meridional', 'DOCLEAN_GLOSS')] en el año [DATE.GetYear]"
 DOCLEAN_GLOSS: "Los docleanos se establecieron en la montañosa región costera que rodeaba la antigua ciudad romana de Doclea, de la que tomaron su nombre. Su territorio, situado en el sur del Adriático, estaba formado por comunidades dispersas de agricultores, pastores y pescadores, en unas tierras que posteriormente serían conocidas como Zeta y, con el tiempo, Montenegro. Situados entre las ciudades costeras bizantinas y los principados serbios del interior, sus habitantes conservaron tradiciones y particularidades regionales propias. Sus gobernantes llegaron a afirmar su independencia política y a consolidar un reino durante el siglo XI, especialmente bajo Esteban Vojislav y sus sucesores. Sin embargo, con el transcurso de los siglos, la región quedó cada vez más vinculada política y culturalmente a los territorios serbios vecinos."

 travunian_history_loc: "Se separó de [CULTURE.GetName] [Glossary('colonos de las tierras altas de Trebinje', 'TRAVUNIAN_GLOSS')] en el año [DATE.GetYear]"
 TRAVUNIAN_GLOSS: "Los travunios se establecieron en las tierras montañosas que rodeaban Trebinje, donde surgió un pequeño principado situado estratégicamente entre la ciudad costera de Ragusa, los territorios de Zahumlia al noroeste y el principado de Doclea al sureste. Rodeada de vecinos más extensos y poderosos, Travunia desempeñó generalmente un papel secundario en la política balcánica. Sus gobernantes procuraron conservar su autoridad local mediante el reconocimiento de la soberanía de las potencias dominantes en cada período, ya fueran los bizantinos, los serbios o los gobernantes de Doclea. Esta posición permitió que el principado mantuviera una identidad regional propia, aunque su autonomía dependiera frecuentemente del equilibrio político entre sus vecinos."

 zachlumian_history_loc: "Se separó de [CULTURE.GetName] [Glossary('colonos de las tierras altas de Hum', 'ZACHLUMIAN_GLOSS')] en el año [DATE.GetYear]"
 ZACHLUMIAN_GLOSS: "Los zahumlios se establecieron en las tierras montañosas de Zahumlia, situadas al noroeste de Ragusa, donde formaron un principado cuya proximidad al curso inferior del Neretva y al mar Adriático le otorgó una importancia comercial y estratégica superior a la que cabría esperar de su extensión. Esta posición atrajo durante siglos el interés de las potencias bizantina, búlgara y serbia, que compitieron por ejercer su influencia sobre la región. El emperador Constantino VII Porfirogéneta recogió una tradición que atribuía a los gobernantes de Zahumlia un origen serbio, reflejo de los estrechos vínculos dinásticos, culturales y políticos existentes entre el principado y los territorios serbios vecinos. Pese a estas relaciones, Zahumlia conservó durante largos períodos sus propios gobernantes y una identidad regional diferenciada."

 berzite_history_loc: "Se separó de [CULTURE.GetName] [Glossary('colonos de las tierras altas de Macedonia', 'BERZITE_GLOSS')] en el año [DATE.GetYear]"
 BERZITE_GLOSS: "Los berzitas figuran entre las tribus eslavas mencionadas en los relatos reunidos bajo el título de los Milagros de san Demetrio, que describen las incursiones y los asedios sufridos por la ciudad bizantina de Tesalónica. Establecidos en las regiones montañosas del interior de Macedonia, formaron parte de las primeras comunidades eslavas que ejercieron una presión sostenida sobre los territorios bizantinos del norte del Egeo. La naturaleza escarpada de sus asentamientos dificultaba las expediciones de represalia y favorecía su autonomía frente a las autoridades imperiales. Gracias a esta protección natural, los berzitas mantuvieron su presencia en el interior macedonio durante generaciones, incluso cuando el Imperio bizantino recuperó gradualmente el control de las costas y los valles fluviales más accesibles."

 croatian_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos emigrantes de la tierra septentrional', 'CROATIAN_GLOSS')] en el año [DATE.GetYear]"
 CROATIAN_GLOSS: "La tradición bizantina y posterior croata se acordó de una patria llamada Croacia Blanca lejos al norte, en alguna parte de la región del sudeste moderno de Polonia y el oeste de Ucrania, de la que los croatas emigraron al sur hacia Dalmacia por invitación del Emperador Heraclius para ayudar a expulsar a los Ávares. Cualquiera que sea la mecánica precisa de esta migración, una identidad croata distinta había arraigado firmemente a lo largo de la costa dálmata y su interior a principios del siglo VIII, sentando las bases para el reino medieval croata que pronto rivalizaría con sus vecinos bizantinos, venecianos y húngaros para el control del Adriático oriental."

 serbian_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos emigrantes de la tierra septentrional', 'SERBIAN_GLOSS')] en el año [DATE.GetYear]"
 SERBIAN_GLOSS: "La tradición medieval trazó a los serbios a una patria llamada Serbia Blanca en el norte, una región estrechamente asociada a las mismas tierras sorbias del Medio Elba que dieron a los sorbos lusatianos su propio nombre, de la cual se dijo que los serbios emigraron al sur a los Balcanes en el siglo VII. Esta conexión norteña de Sorbian-Serbia, conservada tanto en crónicas bizantinas como eslavas posteriores, dio a los serbios de los Balcanes occidentales una identidad distinta de sus vecinos croatas, incluso cuando ambos pueblos compartieron la misma amplia ola migratoria sur-eslavo en la península."

 bosnian_history_loc: "Se formó a partir de [CULTURE.GetName] [Glossary('pueblos que se mezclan con', 'BOSNIAN_GLOSS')] [TARGET_CULTURE.GetName] alrededor del año [DATE.GetYear]"
 BOSNIAN_GLOSS: "El valle del río Bosna se sentó directamente entre las tierras croatas hasta el oeste y los principados serbios hacia el este, un interior montañoso, difícil de gobernar que ni un vecino más grande jamás absorbió completamente en su propia estructura política. Centurias de cambiar la sobresordencia y el asentamiento de ambas direcciones tejían a las poblaciones croatas y serbias juntas en esta región central de las tierras altas, produciendo una identidad bosnia distinta que sacaba de las dos tradiciones vecinas mientras permanecía políticamente propia, protegida tanto por su terreno accidentado como por la rivalidad de las grandes potencias que la rodeaban."

 illyrian_slavic_history_loc: "Se formó a partir de [CULTURE.GetName] [Glossary('pueblos unidos bajo la corona', 'ILLYRIAN_SLAVIC_GLOSS')] [TARGET_CULTURE.GetName] alrededor del año [DATE.GetYear]"
 ILLYRIAN_SLAVIC_GLOSS: "La Conventa Pacta de 1102 ató la nobleza croata a la corona húngara en un sindicato personal, pero fue la población croata y serbia común que vivía a lo largo de la frontera cambiante entre el poder húngaro, bizantino y veneciano que hizo el verdadero trabajo de mezclarse en una identidad compartida más amplia durante los siglos siguientes. Generaciones de convivencia, comercio y vida fronteriza compartida entre comunidades eslavas del Sur atrapadas entre estas potencias más grandes tejen elementos de población croata y serbia en las regiones fronterizas donde se reunieron los dos, una fusión que atrajo ambas tradiciones vecinas sin ser reducible a una sola."

 carantanian_history_loc: "Se formó a partir de [CULTURE.GetName] [Glossary('colonos que absorben los restos de los', 'CARANTANIAN_GLOSS')] [TARGET_CULTURE.GetName] alrededor del año [DATE.GetYear]"
 CARANTANIAN_GLOSS: "Los colonos eslavos que se trasladan a los Alpes orientales a finales del siglo VI encontraron que la antigua provincia romana de Noricum sólo vaciaba parcialmente, su población celta romanizada que se había retirado a refugios fortificados como Ajdna en los Karawanks en lugar de abandonar la región de manera directa. Sujeto al principio a la sobreslordía de Avar después de la salida Lombard de la región, estos eslavos alpinos absorbieron la población Noric sobreviviente durante las generaciones que siguieron, una fusión todavía rastreable en los nombres de lugares de Noricum-derived dispersos en Carinthia hoy. Cuando la autoridad Anavar se debilitó después de 610, la marcha eslava de Carantania surgió como un principado independiente bajo sus propios duques elegidos, llevando adelante esta herencia eslava-norica mezclada como el antepasado directo de la identidad eslovena posterior."

 czech_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos de las antiguas tierras marcomanas', 'CZECH_GLOSS')] en el año [DATE.GetYear]"
 CZECH_GLOSS: "Bohemia había sido una vez el corazón mismo del reino marcomano bajo Marbod, siglos antes de los levantamientos del período de las migraciones dispersó y adelgazó a la antigua población suebia, dejando la tierra vaciada sustancialmente por el tiempo que los colonos eslavos comenzaron a llegar a finales del quinto y sexto siglos. Estas tribus eslavas entrantes, absorbiendo lo que quedaba de la antigua base de población marcomano, unidas brevemente bajo la confederación tribal del comerciante franco Samo de los 620 hasta su muerte en 658, la primera unión política eslava para resistir exitosamente tanto la presión de Avar como de franco. Cuando la confederación de Samo se disolvió, fue la tribu Čech específicamente quien se levantó a la prominencia entre los pueblos eslavos de Bohemia, su nombre dando identidad duradera a la tierra y gente que coalescería en el estado checo medieval bajo la dinastía Přemyslid nativa."

 dravehnian_history_loc: "Se formó a partir de [CULTURE.GetName] [Glossary('colonos que se mezclan con los', 'DRAVEHNIAN_GLOSS')] [TARGET_CULTURE.GetName] alrededor del año [DATE.GetYear]"
 DRAVEHNIAN_GLOSS: "Los Dravehnianos establecieron los alcances interiores de Polabia entre el territorio obodrito central y el mundo eslavo polabio más ancho al este, una posición que los situó dentro de la confederación política obodrita mientras permanecía algo distinto de las preocupaciones marítimas y costeras que moldearon la política obodrita a lo largo del Báltico. Esta orientación interior, ligada a la autoridad de los príncipes obodritos, aún configurada por su propia geografía más agraria y forestal, dio a los Dravehnianos un carácter regional dentro del mundo más amplio de Obodrite que los cronistas externos se encargaban de distinguir de las tribus costeras."

 ranian_history_loc: "Se formó a partir de [CULTURE.GetName] [Glossary('en torno al santuario sagrado de la isla de Rügen', 'RANIAN_GLOSS')] hacia el año [DATE.GetYear]"
 RANIAN_GLOSS: "Los ranios se establecieron en la isla de Rügen y las costas adyacentes, donde se encontraba el gran templo de Svantevit en Arkona. La importancia de su oráculo y las riquezas acumuladas en su tesorería convirtieron a los príncipes ranios en algunas de las figuras religiosas y políticas más influyentes entre los pueblos eslavos polabios, pese a la reducida extensión de sus dominios. Arkona se convirtió en uno de los principales centros del paganismo eslavo, atrayendo peregrinos y tributos de las comunidades del Báltico meridional. Esta concentración de autoridad religiosa otorgó a los ranios una influencia regional muy superior a su poder territorial, que perduró hasta la conquista danesa de Rügen en 1168, cuando las fuerzas del rey Valdemar I destruyeron el santuario de Arkona y pusieron fin a su predominio religioso."

 lutici_history_loc: "Se separó de [CULTURE.GetName] [Glossary('tribus de la confederación luticiana', 'LUTICI_GLOSS')] en el año [DATE.GetYear]"
 LUTICI_GLOSS: "La Lutici formó una confederación floja de tribus eslavas polabias unidas no por ningún solo príncipe sino por un centro religioso pagano compartido en Rethra, su estructura política notablemente descentralizada, basada en la asamblea, de pie en contraste deliberado con la regla principal más centralizada de sus vecinos obodritos al oeste. Esta tradición política confederada, ferozmente independiente, combinada con un apego militante a sus dioses paganos que alimentaban repetidos levantamientos contra la invasión alemana y cristiana, hizo la Lutici entre los opositores más persistentes de la expansión hacia el este de Ostsiedlung por generaciones."

 kashubian_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos de las marchas costeras orientales', 'KASHUBIAN_GLOSS')] en el año [DATE.GetYear]"
 KASHUBIAN_GLOSS: "Mientras Piast Polonia extendía constantemente su autoridad sobre la costa pomeraniana a través de los siglos XII y XIII, las comunidades pomeranianas más orientales, entre las presiones políticas polacas del sur y la colonización alemana que se extendían por la costa desde el oeste, desarrollaron una identidad regional cada vez más distinta. Este aprieto entre dos vecinos más grandes y más poderosos conservaba un lenguaje y cultura kashubian que llevaba adelante la antigua herencia pomeraniana, incluso cuando el mundo más amplio de Pomeranía era constantemente absorbido, germanizado o Polonizado alrededor de ella, dejando a Kashubia como una isla lingüística distinta entre dos vecinos mucho más grandes."

 NOVGORODIAN_GLOSS: "La posición de Novgorod astride las rutas comerciales que unen el Báltico al Volga y Bizancio dibujó una población excepcionalmente cosmopolita de colonos eslavos, comerciantes bálticos y finlandeses, y los comerciantes escandinavos en sus mercados y el campo circundante desde los primeros días de la ciudad, una mezcla de pueblos a lo largo de las rutas comerciales sin igual en cualquier otro lugar en las tierras Rus. Esta población mercante y comercial creció lo suficientemente rica y lo suficientemente numerosa, y lo suficientemente independiente de la familia de cualquier príncipe soltero, que su propia asamblea ciudadana, el veche, llegó a tener autoridad real sobre los asuntos de la ciudad, estableciendo una población nogorodiana acostumbrada a la autogobernancia aparte de las poblaciones más dominadas por príncipes de Kiev y las tierras del sur de Rus."

 belarusian_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos de los principados occidentales', 'BELARUSIAN_GLOSS')] en el año [DATE.GetYear]"
 BELARUSIAN_GLOSS: "La conquista mongol de Rus, que culminó en el saco catastrófico de Kiev en 1240, dispersó a la población del viejo mundo de Kiev en diferentes direcciones dependiendo de qué poder exterior ahora se cierne más grande sobre su rincón particular de las tierras de Rus. La población de las tierras occidentales de Rus centradas en Polotsk, rehusó lo peor de la sobresordencia directa de mongol por distancia y por proximidad al Gran Ducado de Lituania, cada vez más se encontró atraída en contacto más estrecho y eventual asentamiento junto a las comunidades lituanas en lugar de hacia las poblaciones monogol-tributarias más al este. Esta población de Rus orientada hacia el oeste, que absorbe la influencia política y social lituana a través de generaciones de vida compartida, llevó adelante una identidad bielorrusa distinta arraigada en el patrimonio de Rus, pero formada por sus vecinos lituanos."

 savonian_history_loc: "Se formó a partir de [CULTURE.GetName] [Glossary('colonizadores', 'SAVONIAN_GLOSS')] [TARGET_CULTURE.GetName] alrededor del año [DATE.GetYear]"
 SAVONIAN_GLOSS: "El desierto del lago de Savonia se encuentra entre el territorio de Tavastian establecido al oeste y las tierras de Karelian al este, una región fronteriza cuyos bosques densos e innumerables vías acuáticas atraen a colonos de ambos pueblos vecinos en lugar de pertenecer claramente a ninguno de los dos. Los colonos tavastianos y karelian que empujaron a esta frontera para limpiar las nuevas tierras de cultivo y los terrenos de pesca poco a poco intermixed, su vida fronteriza compartida produciendo un dialecto e identidad savoniano distinto que llevaba la herencia de ambos pueblos padres sin ser simplemente una extensión de uno de los dos."

 hungarian_history_loc: "Se separó de [CULTURE.GetName] [Glossary('tribus que conforman la cuenca carpática', 'HUNGARIAN_GLOSS')] en el año [DATE.GetYear]"
 HUNGARIAN_GLOSS: "El Mogyer, una de las siete tribus que formaron la confederación magíar cruzando hacia la cuenca carpata en el siglo IX, le prestó su propio nombre a la gente más amplia, un honor que refleja su prominencia dentro de la población tribal que estableció la llanura panoniana y lanzó décadas de allanamiento en toda Europa antes de la derrota desastrosa en Lechfeld en 955 forzó un cambio de rumbo. En las generaciones que siguieron, esta población asentada de Magyar tomó cada vez más la agricultura junto a sus tradiciones de pastoreo y comenzó a convertirse al cristianismo, una transformación formalmente marcada cuando el Gran Príncipe Vajk, bautizado Stephen, fue coronado el primer rey cristiano de Hungría en el año 1000. Fue este mismo asentamiento, convirtiendo a la población magyar, no sólo la corona, que llevó la identidad húngara desatendida por Mogyer hacia adelante en una nueva era cristiana y agrícola."

 szekely_history_loc: "Se separó de [CULTURE.GetName] [Glossary('guardias fronterizos de las marchas orientales', 'SZEKELY_GLOSS')] en el año [DATE.GetYear]"
 SZEKELY_GLOSS: "La corona húngara estableció el Székely a lo largo de los extremos más orientales de Transilvania a través del siglo XII, confiándolos con la vigilancia de la frontera montañosa del reino contra Cuman, Pecheneg y otras incursiones de estepa a cambio de una amplia medida de autogobierno y libertad de la obligación feudal ordinaria. Este papel de guardafronteras fomentaba una identidad székely orgullosamente distinta, una ligada a las leyendas de los cronistas húngaros medievales que rastrean Székely se origina en los restos de los hunos de Attila en vez de en la migración posterior de Magyar, a reclamado ancestro que, sin embargo dudoso históricamente, dio al Székely un sentido de su propio lugar separado y antiguo dentro del reino húngaro."

 kott_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos de la cuenca superior de Yenisei', 'KOTT_GLOSS')] en el año [DATE.GetYear]"
 KOTT_GLOSS: "El Kott representa una de varias ramas distintas del antiguo mundo de habla yeniseiana, una familia de pueblos una vez dispersos más ampliamente por los bosques y valles fluviales del sur de Siberia que sus únicos sobrevivientes modernos, el Ket, podría sugerir. El Kott mantuvo su propio lenguaje y forma de caza y pesca durante siglos, parte de un parche más amplio de pueblos yeniseianos relacionados pero identificados por separado cuya relación entre sí se conservaba más en vocabulario compartido y en la costumbre que en cualquier estructura política común."

 egyptian_coptic_history_loc: "Se formó a partir de [CULTURE.GetName] [Glossary('pueblos que se fusionan con el', 'EGYPTIAN_COPTIC_GLOSS')] [TARGET_CULTURE.GetName] alrededor del año [DATE.GetYear]"
 EGYPTIAN_COPTIC_GLOSS: "Alejandro la conquista del Grande de Egipto en 332 A.C. abrió la puerta a siglos de asentamiento griego bajo la dinastía ptolemaica que le siguió, Alejandría se convirtió en una de las grandes ciudades cosmopolitas del mundo antiguo, su élite de habla griega gobernando sobre una población egipcia cuyos templos, sacerdocio, y el lenguaje diario seguía siendo fundamentalmente Kemético incluso como el arte helenístico, filosofía, y la administración se arrastró sobre esta antigua fundación. Anexión romana en 30 A.C., siguiendo la derrota de Cleopatra, sólo profundizó esta fusión, y el mismo nombre Coptic descende de la palabra griega para Egipto mismo, una herencia adecuada para una cultura que llevó adelante la tradición religiosa faraónica y el lenguaje escrito ahora en un alfabeto tomado de griego, una síntesis que seguiría definiendo la identidad de Egipto cristiano mucho después de que tanto el gobierno ptolemaico como el romano hubiera pasado."

 hazara_history_loc: "Se formó a partir de [CULTURE.GetName] [Glossary('guarnición entre las guarniciones', 'HAZARA_GLOSS')] [TARGET_CULTURE.GetName] tierras altas alrededor del año [DATE.GetYear]"
 HAZARA_GLOSS: "La Hazara toma su nombre de la palabra persa para 'thousand', una referencia a las unidades decimales militares de noara a través de las cuales el Imperio mongol organizó sus fuerzas de guarnición a través de Khorasan conquistado y las tierras altas del Afganistán central. Como regla mongol fragmentada siguiendo la división del imperio, estas poblaciones de guarnición permanecieron asentadas en el corazón montañoso del Afganistán, y generaciones de matrimonios con la población tayika de habla persa cubrían elementos mongoles y turcos en lo que seguía siendo una sociedad de tierras altas fundamentalmente persas, produciendo un pueblo distinto que llevaba la memoria de sus orígenes militares en su propio nombre."

 chuvash_history_loc: "Se separó de [CULTURE.GetName] [Glossary('pueblos de la franja del bosque de Volga media', 'CHUVASH_GLOSS')] en el año [DATE.GetYear]"
 CHUVASH_GLOSS: "Como Volga Bulgaria consolidó su poder comercial a lo largo del medio Volga a través del siglo IX, no todas las comunidades desplegadas por Bulgar se establecieron en el núcleo urbano e influencia islámica del reino. Las comunidades más al norte, a lo largo de la franja forestal donde la estepa dio paso a la taiga, mantuvieron una forma de vida más rural y, durante siglos, más decididamente pagana, distinta de las ciudades de tráfico de ríos cada vez más musulmanas más al sur. Esta población de estiércol seguiría preservando el discurso turco Oghur como una lengua viva más larga que cualquier otra gente en la tierra, llevando la antigua herencia lingüística Bulgar hacia adelante siglos después de que cada otra comunidad de habla Oghur hubiera sido absorbida en mundos eslavos, húngaros u otros mundos de habla turco común."

 dehwar_history_loc: "Se separó de [CULTURE.GetName] [Glossary('terratenientes iranios asentados en Qusdar bajo los gaznávidas', 'DEHWAR_GLOSS')] alrededor del año [DATE.GetYear]"
 DEHWAR_GLOSS: "El nombre Dehwar desciende de la dihwar persa, un primo de Dihqan, la clase de señores de la aldea y los propietarios de tierras que recolectaban impuestos que habían administrado la campiña sasaniana y continuaron haciéndolo bajo el Califato primitivo. Cuando Sabuktigin de Ghazni incautó la fortaleza-ciudad de Qusdar en 978, la región de las tierras altas se adentró firmemente en el mundo administrativo perso-islámico su hijo Mahmud pronto se expandiría a través de la frontera, y los dihqans de habla persa que manejaron sus aldeas e ingresos se arraigó allí como un resuelto, comunidad de tierra separada de los nómadas Baloch y Brahui que llegaron a dominar el país circundante. Centuries más tarde, cuando Qusdar se convirtió en el corazón del Khanate de Kalat, sus descendientes continuarían con el personal de su burocracia, su identidad como agricultores y registradores como centrales a quienes eran como el dialecto de Persa que todavía hablaban."

