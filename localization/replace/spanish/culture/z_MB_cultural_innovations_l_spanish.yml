l_spanish:

 #Innovations

 innovation_nubianization: "Nubianización"
 innovation_nubianization_desc: "Durante el siglo XI, los reinos de Nubia atravesaron un proceso de Nubianización; al igual que los kushitas antes que ellos, los nubios absorbieron y adaptaron hábilmente influencias extranjeras, sintetizando estas influencias con su propia cultura para crear nuevas formas únicas de lenguaje, titular y religión. Uno de los principales iniciadores de este proceso activo de Nubianización de la vida cortesana ha sido sugerido como Georgios, el arzobispo de Dongola y, por lo tanto, el cabeza de la iglesia macuriana. Parece que popularizó el idioma nubio como el idioma escrito para reemplazar el griego nubio y contrarrestar la creciente influencia del árabe en la Iglesia copta de Egipto. También se introdujeron más influencias indígenas en la iglesia, como el culto a los gobernantes y obispos fallecidos, así como a los santos nubios indígenas."
 unlock_nubian_titles: "[rulers|E] pueden tomar una [decision|E] para reemplazar el actual consejo nubio influenciado por el griego y los títulos de los gobernantes con equivalentes indígenas nubios."
 declare_nubian_church: "Durante el transcurso de un evento, [rulers|E] pueden elegir reformar la [faith|E] nubia en una iglesia nacional que refleje las tradiciones cristianas indígenas."

 innovation_lost_wax_casting: "Fundición a la cera perdida"
 innovation_lost_wax_casting_desc: "Inspirados por los maestros de Igbo-Ukwu, nuestros artesanos han dominado una técnica de fundición de metal altamente sofisticada para producir hermosas y ornamentadas obras de arte. ¡Nuestras obras de bronce serán conocidas por toda la eternidad!"

 innovation_hashashin: "Hashin"
 innovation_hashashin_desc: "Perfeccionando el arte de la intriga y el engaño, nuestros nobles guerreros chiitas se comprometen a nuestra causa, capaces de luchar en batalla con un celo notable e inigualable."

 innovation_barbary_corsairs: "Rutas de Piratería Berber"
 innovation_barbary_corsairs_desc: "Provenientes de nuestra dura población del norte de África, valientes aventureros se dedican a aprovecharse por la fuerza de nuestros ricos gobernantes vecinos, sin importar si un mar nos divide de ellos."

 innovation_hindu_recruits: "Sipahis Hindúes"
 innovation_hindu_recruits_desc: "Gracias a nuestra geografía, tenemos una fuente de mano de obra religiosa dedicada dentro de la población hindú que puede ser reclutada a un precio justo. Son numerosos y feroces en su celo. Reclutarlos sería realmente un activo para nuestro ejército."
 hindu_recruits:0 "Sipahis Hindúes"

 bedouin_tribesmen:0 "Beduinos"
 innovation_bedouin_tribesmen: "Integración Tribal Beduina"
 innovation_bedouin_tribesmen_desc: "Originarios del implacable desierto árabe, los beduinos son algunas de las personas más resistentes del mundo, con un entorno duro que los ha moldeado en guerreros de reputación legendaria. Ofrecerles oportunidades para conectar más sus tribus con nuestro reino puede resultar lucrativo, y darles un lugar en nuestro ejército puede ser estratégicamente útil."

 macemen:0 "Mace"
 innovation_macemen: "Mace"
 innovation_macemen_desc: "Ninguna armadura es segura de los golpes aplastantes de la maza. Este avance que desafía la armadura utiliza la técnica mortal de aplastar al enemigo y entregar grandes cantidades de daño directamente a través de la armadura y hacia el cuerpo."

 culture_parameter_unlock_maa_bujakesos: "Puede reclutar [GetMaA('bujakesos').GetName] como [hombres_a_los_armas|E]"

 innovation_centralization_of_authority: "La Gran Unificación"
 innovation_centralization_of_authority_desc: "Como el primer emperador de China, Qin Shi Huang no solo unió todos los reinos, sino que también unificó pesos y medidas, caminos y escritura. Así, la cohesión de la cultura Han se ha fortalecido de manera sin precedentes, lo que permite a personas con todo tipo de acentos y hábitos en este enorme territorio comunicarse, comerciar y unirse bajo el dominio de un solo imperio."

 innovation_sacred_rulership: "Soberanía Sagrada Africana"
 innovation_sacred_rulership_desc: "Nuestro gobernante es de sangre divina. No solo como gobernante, sino también como el sumo sacerdote de nuestros ritos espirituales, ellos mismos son sagrados. La mayoría de los plebeyos nunca verán a nuestro soberano, sino que solo interactuarán con sus representantes en la corte."

 innovation_dynastic_rulership: "Soberanía Dinástica Africana"
 innovation_dynastic_rulership_desc: "Para la estabilidad de nuestro reino, los futuros gobernantes deben ser de nuestra dinastía solamente. Esta es una práctica extendida entre otros reinos africanos medievales altamente organizados y estratificados."

 innovation_age_grade_associations: "Asociaciones por Grupos de Edad" 
 innovation_age_grade_associations_desc: "La división de la sociedad en grupos de edad, a menudo separados por género, suele estar marcada por un rito de iniciación, que puede ser la culminación de una larga y compleja preparación, a veces en retiro. Después de un periodo de algunos años, durante el cual a menudo realizan ciertas actividades comunes, como la vigilancia en la comunidad o la construcción de nuevas viviendas. Bajo la guía de ancianos, los miembros de un grupo de edad pueden ser iniciados ya sea de forma colectiva o individual en un grupo de edad más senior. Este progreso suele ir acompañado de la revelación de conocimiento secreto. En la mayoría de las culturas, los sistemas de grupos de edad, al igual que los grupos de edad, son un privilegio de los hombres, y son los hombres mayores quienes controlan el conocimiento secreto de una sociedad, colectivamente o restringido a un consejo de ancianos y/o posiciones específicas como chamanes encargados de la preparación de ritos de iniciación."

 #Military
 innovation_princely_administration: "Administración Princely"
 innovation_princely_administration_desc: "Al expandir la administración con funcionarios separados para asuntos financieros, judiciales y militares, la administración será más eficiente. Al mismo tiempo, la separación de poderes debilita a los funcionarios, permitiendo más control por parte del gobernante."

 innovation_accounting: "Contabilidad"
 innovation_accounting_desc: "Una forma más sistemática de llevar un registro de lo que entra, lo que sale, lo que tenemos y lo que debemos nos permitirá gestionar mejor nuestras finanzas."

 innovation_estate_assembly: "Asamblea de Estamentos"
 innovation_estate_assembly_desc: "Una asamblea de los representantes de los estamentos del reino, las divisiones de la sociedad en tiempos feudales compuestas por clérigos, nobleza y plebeyos, convocada para fines de deliberación, legislación o tributación."

 innovation_renaissance_architecture: "Arquitectura del Renacimiento"
 innovation_renaissance_architecture_desc: "Nuestros arquitectos y artesanos están redescubriendo gradualmente los estilos de los antiguos griegos y romanos."

 innovation_polyphony: "Polifonía"
 innovation_polyphony_desc: "Las melodías en nuestros edificios de culto consisten en dos o más líneas simultáneas de melodía independiente, en contraste con una textura musical con solo una voz."

 innovation_libraries: "Bibliotecas"
 innovation_libraries_desc: "Mientras que los libros solían ser algo solo para los monjes y los eruditos, ahora cada noble que se respete a sí mismo posee al menos algunos, independientemente de si los lee o no."

 innovation_free_companies: "Compañías Libres"
 innovation_free_companies_desc: "El término 'compañía libre' se aplica más a menudo a las numerosas bandas de mercenarios que surgieron durante la Guerra de los Cien Años y que consistían mayormente en veteranos del conflicto, pero también en hombres de rango inferior que buscaban su fortuna en la guerra."

 innovation_halberdiers: "Halberdistas"
 innovation_halberdiers_desc: "Una halberd es un arma de asta de dos manos que llegó a tener un uso prominente durante los siglos XIV, XV y XVI. La halberd consiste en una hoja de hacha coronada con una punta montada en un largo mango, excelente contra oponentes acorazados. Siempre tiene un gancho o espina en el lado posterior de la hoja del hacha para atrapar combatientes montados."

 innovation_career_soldiers: "Soldados de Carrera"
 innovation_career_soldiers_desc: "Con el aumento de las escalas de las guerras y la consiguiente mayor necesidad de hombres capaces, cada vez más plebeyos consideran el servicio militar como una carrera válida."

 innovation_periodic_musters: "Reclutamientos Periódicos"
 innovation_periodic_musters_desc: "Al llevar a cabo reclutamientos periódicos en todas las regiones del reino, siempre sabemos quién está en condiciones de ir a la guerra cuando los necesitamos."

 innovation_humanism: "Humanismo"
 innovation_humanism_desc: "El humanismo se refiere a un enfoque en el bienestar humano y aboga por la libertad, autonomía y progreso humanos."

 innovation_sovereignty: "Soberanía"
 innovation_sovereignty_desc: "La soberanía es la autoridad suprema dentro de un territorio. A partir del Renacimiento, los magnates feudales perdieron drásticamente poder en favor de un príncipe territorial. Como tal, el estatus del príncipe cambió de soberanía a soberanía."

 halberdiers_unit: "Halberdistas"
 halberdiers_unit_desc: "Una halberd es un arma de asta de dos manos que llegó a tener un uso prominente durante los siglos XIV, XV y XVI. La halberd consiste en una hoja de hacha coronada con una punta montada en un largo mango, excelente contra oponentes acorazados. Siempre tiene un gancho o espina en el lado posterior de la hoja del hacha para atrapar combatientes montados."

 culture_era_renaissance: "Renacimiento"
 culture_era_renaissance_desc: "La era del Renacimiento marca el redescubrimiento de los autores clásicos, los inicios del método científico y nuevos estilos en arte, arquitectura y música. Pero también el crecimiento de la autoridad central y regional a expensas de los magnates feudales."


#CE


 innovation_: "la "
 innovation__desc: "la "

 #Tribal
 innovation_military_manuals: "Manuales militares Romanos Orientales"
 innovation_military_manuals_desc: "Una de las cualidades más simbólicas del ejército Romano Oriental a medida que se desarrollaba era el uso de los llamados manuales militares. Principalmente destinados a preservar y propagar la doctrina militar sofisticada entre los oficiales y comandantes del ejército, estos tratados jugaron un papel formidable en mantener al ejército Romano Oriental como una de las fuerzas de guerra más formidables, organizadas y disciplinadas durante el período medieval. El uso de tales manuales continuó una tradición del estudio grecorromano de la guerra y los tacticianos que se remonta a Jenofonte y a Eneás Táctico, con manuales militares helenísticos tardíos adaptados y aplicados a las necesidades y realidades del ejército Romano Oriental, la mayoría de ellos derivados del amplio corpus de autores griegos antiguos y helenísticos tardíos, especialmente Aelio, Onasandro y Polieno, y en menor medida Eneás y Arriano. El más famoso de estos manuales es el Strategikon, atribuido al emperador Mauricio (r. 582–602), que probablemente fue compilado a finales del siglo VI. Describiendo en detalle armamento y armaduras, la vida diaria en marcha o en campamento, ropa, comida, atención médica, ley militar y títulos del ejército Romano Oriental del siglo VII, el Strategikon ofrece ideas sobre el ethos militar Romano Oriental y ejerció una profunda influencia en el posterior género Romano Oriental."

 innovation_stirrups: "Estribo"
 innovation_stirrups_desc: "Un estribo es un marco ligero o anillo que sostiene el pie de un jinete, sujeto a la silla por una correa, a menudo llamada cuero de estribo. Los estribos suelen estar en pares y se utilizan para ayudar a montar y como soporte mientras se utiliza un animal de monta (generalmente un caballo u otro equino, como una mula). Aumentan enormemente la capacidad del jinete para permanecer en la silla y controlar la montura, aumentando la utilidad del animal para los humanos en áreas como la comunicación, el transporte y la guerra. A finales del siglo VI o principios del VII d.C., principalmente debido a invasores de Asia Central, como los ávaros, los estribos comenzaron a propagarse de Asia a Europa desde China. A partir de ahí, el estribo fue adoptado de manera errática por los estados europeos a lo largo de los siguientes tres siglos. La introducción del estribo no solo hizo que el guerrero montado fuera supremo en la guerra medieval, sino que pudo haber iniciado cambios sociales y culturales complejos y de gran alcance en Europa. Algunos académicos atribuyen el nacimiento del feudalismo y su posterior expansión en el norte de Italia, España, Alemania y en los territorios eslavos a este uso del estribo. Se argumenta que la creciente estructura de clases feudales de la Europa medieval derivó en última instancia del uso de los estribos: 'Pocas invenciones han sido tan simples como el estribo, pero pocas han tenido una influencia tan catalítica en la historia. Los requisitos del nuevo modo de guerra que hizo posible encontraron expresión en una nueva forma de sociedad europea occidental dominada por una aristocracia de guerreros dotados de tierras para que pudieran luchar de una manera nueva y altamente especializada.'"

 innovation_post_roman_britons: "Legado sub-romano"
 innovation_post_roman_britons_desc: "Nosotros [romano_britón|E] alguna vez habitamos toda Britannia, pero desde que los irlandeses y sajones se establecieron en nuestras costas, hemos sido empujados constantemente hacia los márgenes de la isla. Aunque los [anglosajones|E] ahora controlan las tierras fértiles al este, hemos sobrevivido y nos hemos adaptado. No nos inclinaremos ante los invasores extranjeros, ¡y lucharemos para preservar nuestra independencia! Un día recuperaremos nuestras tierras nativas, pero hasta entonces, haremos saber a nuestros enemigos que no somos fáciles de someter."

 # innovation_justinian_code: "Corpus Juris Civilis"
 # innovation_justinian_code_desc: "The Justinian Code or Corpus Juris Civilis (Corpus of Civil Law) was a major reform of Byzantine law created by Emperor Justinian I (r. 527-565 CE) in 528-9 CE. Aiming to clarify and update the old Roman laws, eradicate inconsistencies, and speed up legal processes, the collection of imperial edicts and expert opinions covered all manner of topics from punishments for specific crimes to marriage and the inheritance of property. Not only used as a basis for Byzantine law for over 900 years, the laws therein continue to influence many western legal systems to this day."

 innovation_hindu_numeral_system: "Sistema numérico hindú"
 innovation_hindu_numeral_system_desc: "El sistema numérico hindú es un sistema numérico decimal posicional, y es el sistema más común para la representación simbólica de números en el mundo. Fue inventado entre los siglos I y IV por matemáticos indios. El sistema se basa en diez (originalmente nueve) glifos. Los símbolos (glifos) utilizados para representar el sistema son en principio independientes del sistema mismo. Los glifos en uso actual descienden de los números Brahmi y se han dividido en varias variantes tipográficas desde la Edad Media."

 innovation_bulgarian_army: "Ejército búlgaro medieval"
 innovation_bulgarian_army_desc: "El ejército búlgaro medieval fue el principal cuerpo militar de los Primeros y Segundos Imperios búlgaros, y algunos estados títeres de los mismos, como el Despotado de Dobruja. Durante las primeras décadas tras la fundación del país, el ejército consistía en una caballería búlgara y una infantería eslava. El núcleo del ejército búlgaro era la caballería pesada, que consistía en aproximadamente 12,000 jinetes fuertemente armados. En su apogeo, en los siglos IX y X, fue una de las fuerzas militares más formidables de Europa y era temida por sus enemigos. Existen varios casos documentados de comandantes Romanos Orientales que abandonaron una invasión debido a la reticencia de enfrentarse al ejército búlgaro en su territorio natal."

 innovation_caravanserai: "Caravasar"
 innovation_caravanserai_desc: "Un caravanserai era una posada de carretera donde los viajeros podían descansar y recuperarse del viaje del día. Los caravanserais apoyaban el flujo de comercio, información y personas a través de la red de rutas comerciales que cubrían Asia, el norte de África y el sureste de Europa, más notablemente la Ruta de la Seda. Aunque muchos estaban ubicados a lo largo de caminos rurales en el campo, las versiones urbanas de los caravanserais también fueron históricamente comunes en ciudades de todo el mundo islámico. Los caravanserais urbanos también se convirtieron en importantes centros de actividad económica en ciudades de diferentes regiones del mundo musulmán, a menudo concentrados cerca de las principales áreas de souq, con muchos ejemplos aún en pie en las áreas históricas de Damasco, Alepo, El Cairo, Estambul y Fez. En muchas partes del mundo musulmán, los caravanserais también proporcionaban ingresos que se utilizaban para financiar funciones o edificios benéficos o religiosos. Estos ingresos y funciones se gestionaban a través de un waqf, un acuerdo protegido que daba a ciertos edificios e ingresos el estatus de dotaciones de dominio mortuorio garantizadas por la ley islámica."

 innovation_shotel: "Shotel"
 innovation_shotel_desc: "Un shotel es una espada curva originaria de Etiopía y Eritrea. Su forma es similar a una gran hoz y se puede usar de manera efectiva para alcanzar el escudo de un oponente y apuñalarlo en áreas vitales, como los riñones o los pulmones. Las técnicas con shotel, entre otras, incluían ataques de enganche tanto contra oponentes montados como desmontados, que tenían un efecto devastador, especialmente contra la caballería montada, ya que el shotel podía usarse para enganchar y derribar al guerrero del caballo."

 innovation_muslim_jinete: "Jinetes granadinos"
 innovation_muslim_jinete_desc: "Descendientes de los moros que se establecieron en la península ibérica. Estos escaramuzadores ligeramente armados son capaces de formar una formación circular que proporciona fuego constante contra el enemigo. Usan su velocidad para mantenerse fuera de peligro hasta que pueden lanzar sus jabalinas, luego se acercan cuando el enemigo está lo suficientemente debilitado."

 innovation_french_caballarii: "Caballarii"
 innovation_french_caballarii_desc: "La gran mayoría de las tropas francas durante la dinastía carolingia eran simplemente infantería con lanza; los francos habían abandonado mucho antes su tradicional hacha arrojadiza 'francisca'; pero el rey mantenía un contingente montado élite de caballería pesada: los célebres caballarii. Inicialmente, estos caballarii estaban alojados en o cerca del palacio, pero con el tiempo se extendieron entre los grandes magnates terratenientes. Mientras que la mayoría de las tropas eran simplemente levas convocadas en tiempos de guerra, los caballarii eran caballeros que juraban lealtad al rey y servían con el deber de apoyar su ejército y su soberano a lo largo de la historia. Como los francos finalmente dejaron de utilizar la infantería pesada, los caballarii se convirtieron en un recurso clave en el ejército."

 #Early Medieval
 innovation_heavy_plough: "Carruca"
 innovation_heavy_plough_desc: "La carruca era un tipo de arado pesado importante para el desarrollo de la agricultura medieval en el norte de Europa. La carruca utilizaba un reja de hierro pesado para voltear suelos duros y puede haber requerido un equipo de ocho bueyes. Antes de la introducción del arado pesado en el norte de Europa, era imposible aprovechar adecuadamente los fértiles suelos arcillosos. La investigación sugiere que la adopción de la carruca en el norte de Europa fue responsable de un considerable grado del crecimiento de la productividad sin precedentes y la urbanización que ocurrió desde los años 900 hasta 1300."

 innovation_hindu_arabic_numeral: "Sistema de Números Hindu-Árabes"
 innovation_hindu_arabic_numeral_desc: "El sistema de números hindu-árabes o sistema de números indo-árabes (también llamado sistema de números árabes o sistema de números hindúes) es un sistema de numeración decimal posicional y es el sistema más común para la representación simbólica de números en el mundo. Fue inventado entre los siglos I y IV por matemáticos indios. El sistema fue adoptado en la matemática árabe en el siglo IX. Fueron influyentes los libros del persa Al-Khwārizmī (Sobre el Cálculo con Números Hindúes, c.825) y Al-Kindi (Sobre el Uso de los Números Hindúes, c.830). El sistema se extendió más tarde a la Europa medieval durante la Alta Edad Media. El sistema se basa en diez (originalmente nueve) glifos. Los símbolos (glifos) utilizados para representar el sistema son en principio independientes del propio sistema. Los glifos en uso actual descienden de los números brahmi y se han dividido en varias variantes tipográficas desde la Edad Media. Estos conjuntos de símbolos pueden dividirse en tres familias principales: números árabes occidentales utilizados en el Gran Magreb y en Europa, números árabes orientales utilizados en el Medio Oriente, y los números indios en varios guiones utilizados en el subcontinente indio."

 innovation_bimaristan: "Bimaristán"
 innovation_bimaristan_desc: "Un bimaristán es un hospital en el mundo islámico histórico, cuyo propósito era servir como un lugar designado donde se podía dar tratamiento médico a individuos necesitados. En la cultura islámica, los bimaristánes atendían a todas las personas sin importar su raza, religión, ciudadanía o género. El objetivo de todos los médicos y el personal del hospital era trabajar juntos para ayudar al bienestar de sus pacientes. No había restricciones sobre el tiempo que un paciente podía pasar como internado, ya que los bimaristánes estaban obligados a mantener a todos los pacientes hasta que se recuperaran por completo. Las salas del hospital estaban divididas en enfermedades mentales, enfermedades contagiosas, enfermedades no contagiosas, cirugía, medicina y enfermedades oculares. Cada hospital podía contener un aula, cocina, farmacia, biblioteca, mezquita y, ocasionalmente, una capilla para pacientes cristianos. Se empleaban a menudo materiales recreativos y músicos para confortar y animar a los pacientes."

 innovation_acequia: "Acequia"
 innovation_acequia_desc: "La acequia, adaptada de la palabra árabe “al-asaqiya”, que significa 'el canal' o 'el camino del agua', es un curso de agua operado por la comunidad. Los moros de habla árabe de África del Norte trajeron el término y la tecnología a España durante su asentamiento en la península ibérica. Las acequias son canales de riego alimentados por gravedad; como tales, no requieren bombas ni tuberías y en su lugar dependen del flujo positivo de agua en pendiente, siendo la principal fuente de agua el deshielo de la nieve o el agua de los ríos. El flujo de agua puede ser redirigido a través de varios canales a campos lejanos mediante el uso de compuertas."

 innovation_fatimid_meritocracy: "Administración Meritocrática"
 innovation_fatimid_meritocracy_desc: "A diferencia de los gobiernos de Europa occidental de la época, el ascenso en los cargos estatales fatimíes era más meritocrático que hereditario. Los miembros de otras ramas del islam, como los sunitas, tenían la misma probabilidad de ser nombrados para puestos gubernamentales que los chiítas. La tolerancia se extendía a los no musulmanes, como los cristianos y los judíos, que ocupaban altos niveles en el gobierno en función de su capacidad, y esta política de tolerancia aseguraba el flujo de dinero de los no musulmanes para financiar el gran ejército de los califas."

 innovation_islamic_naffatun: "Nafta"
 innovation_islamic_naffatun_desc: "La nafta es una mezcla de químicos que se convierte en un líquido ardiente que es difícil de apagar. Estos hombres lanzan mortales jarrones de cerámica llenos de nafta ardiente que estallan en llamas al impacto, derramando un pegajoso desorden fundido que puede filtrarse a través de cualquier armadura. La perspectiva de una muerte ardiente puede desquiciar incluso al guerrero más valiente."

 innovation_berber_adarga: "Adarga"
 innovation_berber_adarga_desc: "La adarga era un escudo de cuero duro creado por los bereberes del norte de África, cuyo nombre se deriva del árabe 'al-daraqa' ('escudo'). Un importante centro de fabricación de la adarga fue la ciudad de Fez, Marruecos. La adarga se hacía típicamente de la piel del antílope (probablemente el oryx árabe) y era extremadamente resistente a los golpes de espada, lanza, jabalina y flecha, aunque también se utilizaban otros tipos de cuero. En el interior, en el centro, había un par de empuñaduras de cuero que se sostenían en la mano o se ataban al antebrazo con un pequeño cojín debajo para absorber el impacto. Originalmente, la adarga era redonda, luego en forma de corazón, y finalmente tomó la forma de un par de elipses o óvalos superpuestos, midiendo entre 69 y 80 cm en el eje largo. Dos o más capas de piel se pegaban y cosían juntas para hacer que la adarga fuera rígida y elástica, y a menudo se decoraba con ornamentos incisos y dorados, inscripciones moriscas y apliques y bordes metálicos. La adarga era una defensa tradicional empleada por el jinete ligero morisco, que la utilizaba junto con la lanza."

 innovation_cossack_cavalry: "Caballería Cosaca"
 innovation_cossack_cavalry_desc: "Los cosacos rusos pasan mucho tiempo a caballo, y como tal están acostumbrados a las tareas de vigilancia y protección de ciudades, caminos, fuertes y asentamientos. Reconocidos por su valentía y resistencia, los cosacos están equipados con una espada y un arco compuesto que utilizan desde a caballo."

 innovation_turkish_sipahi: "Sipahi"
 innovation_turkish_sipahi_desc: "Los sipahi eran jinetes profesionales desplegados por los selyúcida, y más tarde dos tipos de cuerpos de caballería otomanos, incluyendo el sipahi timarli, que poseía feudos y constituía la mayor parte del ejército, y el sipahi kapikulu, tropas del palacio. Los sipahi actuaban como caballería de choque empuñando arcos, jabalinas y, lo más notable, una lanza."

 innovation_welsh_helwyr: "Helwyr"
 innovation_welsh_helwyr_desc: "Extraídos de la población local, los Helwyr son cazadores hábiles que tienen poca experiencia en los caminos de la guerra. Aunque desarmados y equipados con armamento más adecuado para la caza, cuando se les llama a enfrentarse al enemigo en combates cercanos o a distancia, estos hombres son capaces de luchar con una determinación que oculta su falta de formación formal."

 innovation_nomadic_tribesmen: "Tribus Nómadas"
 innovation_nomadic_tribesmen_desc: "El ejército fatimí se basaba en gran medida en los guerreros bereberes kutama que fueron llevados en la marcha hacia Egipto, y siguieron siendo una parte importante del ejército incluso después de que Túnez comenzara a separarse. Ocurrió un cambio fundamental cuando el califato fatimí intentó avanzar hacia Siria en la segunda mitad del siglo X. Los fatimí se enfrentaron a las fuerzas dominadas por los turcos del califato abasí y comenzaron a darse cuenta de los límites de su ejército actual. Así, durante el reinado de Abu Mansur Nizar al-Aziz Billah y Al-Hakim bi-Amr Allah, el califa comenzó a incorporar ejércitos de turcos y, más tarde, de africanos negros (incluso más tarde, se utilizaron otros grupos como los armenios). Las unidades del ejército se separaban generalmente a lo largo de líneas étnicas: los bereberes solían ser la caballería ligera y los escaramuzadores a pie, mientras que los turcos eran los arqueros a caballo o la caballería pesada (conocidos como mamelucos). Los africanos negros, sirios y árabes generalmente actuaban como la infantería pesada y arqueros a pie. Este sistema de ejército basado en la etnicidad, junto con el estatus de esclavo parcial de muchos de los combatientes étnicos importados, permanecería fundamentalmente sin cambios en Egipto durante muchos siglos después de la caída del califato fatimí."

 #High Medieval
 innovation_hindu_arabic_numeral_european: "Sistema de Números Hindú-Árabes"
 innovation_hindu_arabic_numeral_european_desc: "El sistema de números hindú-árabes o sistema de números indos-árabes (también llamado sistema de números árabes o sistema de números hindúes) es un sistema numérico decimal posicional y es el sistema más común para la representación simbólica de números en el mundo. Fue inventado entre los siglos I y IV por matemáticos indios. El sistema fue adoptado en las matemáticas árabes en el siglo IX. Influyeron los libros del persa Al-Khwārizmī (Sobre el Cálculo con Números Hindúes, c.825) y Al-Kindi (Sobre el Uso de los Números Hindúes, c.830). El sistema se difundió más tarde en la Europa medieval durante la Alta Edad Media. El sistema se basa en diez (originalmente nueve) glifos. Los símbolos (glifos) utilizados para representar el sistema son en principio independientes del sistema mismo. Los glifos en uso actual son descendientes de los números bráhmicos y se han dividido en varias variantes tipográficas desde la Edad Media. Estos conjuntos de símbolos se pueden dividir en tres familias principales: números árabes occidentales utilizados en el Gran Magreb y en Europa, números árabes orientales utilizados en el Medio Oriente, y los números indios en varios guiones utilizados en el subcontinente indio."

 innovation_wheelbarrow: "Carretilla"
 innovation_wheelbarrow_desc: "Una carretilla es un pequeño vehículo propulsado a mano, generalmente con una sola rueda, diseñado para ser empujado y guiado por una sola persona usando dos manijas en la parte trasera. La carretilla está diseñada para distribuir el peso de su carga entre la rueda y el operador, lo que permite el transporte conveniente de cargas más pesadas y voluminosas de lo que sería posible si el peso fuera llevado completamente por el operador. Las primeras carretillas en la Europa medieval aparecieron entre 1170 y 1250, aunque la investigación sobre la historia temprana de la carretilla se ve dificultada por la marcada ausencia de una terminología común. Para el siglo XIII, la carretilla demostró ser útil en la construcción, operaciones mineras y agricultura. Sin embargo, según documentos e ilustraciones sobrevivientes, la carretilla siguió siendo una rareza relativa hasta el siglo XV y parecía estar limitada a Inglaterra, Francia y los Países Bajos."

 innovation_genoese_crossbowmen: "Ballesteros Genoveses"
 innovation_genoese_crossbowmen_desc: "Los ballesteros genoveses (italiano: Balestrieri genovesi) fueron un famoso cuerpo militar de la Edad Media, que actuó tanto en defensa de la República de Génova como una fuerza mercenaria para otros poderes italianos o europeos. El armamento principal de los ballesteros genoveses era la ballesta, fabricada en Génova por la Corporación Balistrai. Además, los mercenarios estaban equipados con un puñal, un casco de metal ligero, un gorgete, una cota de malla y un gran escudo, llamado pavise, que se usaba mientras se recargaba la ballesta. El equipo habitual consistía en un ballestero y dos asistentes, uno sosteniendo el pavise y el otro encargado de tensar una segunda ballesta, duplicando así la tasa de disparo. Los ballesteros genoveses adquirieron prominencia durante la Primera Cruzada, cuando el comandante genovés Guglielmo Embriaco utilizó el cuerpo durante el asedio de Jerusalén, y nuevamente en la Batalla de Jaffa en 1192 durante la Tercera Cruzada. Los ballesteros genoveses siguieron siendo uno de los cuerpos militares más respetados hasta el siglo XVI, bien entrada la introducción de armas de pólvora en Europa."

 innovation_hyperpyron: "Hiperpírron"
 innovation_hyperpyron_desc: "El hiperpírron era una moneda bizantina en uso durante la Baja Edad Media, que reemplazó al sólido como la moneda de oro del Imperio Bizantino. La moneda de oro tradicional del Imperio Bizantino había sido el sólido o nomisma, cuyo contenido de oro se había mantenido estable en 24 quilates durante siete siglos y, por lo tanto, era muy apreciada. Sin embargo, desde la década de 1030, la moneda se devaluó cada vez más, hasta que en la década de 1080, tras los desastres militares y las guerras civiles de la década anterior, su contenido de oro se redujo a casi cero. En consecuencia, en 1092, el emperador Alexios I Komnenos (r. 1081–1118) llevó a cabo una drástica revisión del sistema monetario bizantino e introdujo una nueva moneda de oro, el hiperpírron (que significa "super refinado"). Esta tenía el mismo peso estándar que el sólido, pero con menos contenido de oro debido al reciclaje de monedas anteriores devaluadas. El hiperpírron permaneció como la moneda de oro estándar hasta que las monedas de oro dejaron de ser acuñadas por los bizantinos a mediados del siglo XIV."

 innovation_milan_famiglia_ducale: "Familia Ducal"
 innovation_milan_famiglia_ducale_desc: "La Famiglia Ducale es, literalmente, la familia y el séquito del Duque. Provenientes de la nobleza, estas unidades están bien equipadas y practicadas en el arte de la guerra. Armados con armaduras de placa y empuñando lanzas y espadas, estas unidades están decididas a defender el honor de su señor y luchar por sus intereses, sean cuales sean."

 innovation_voulge: "Voulge"
 innovation_voulge_desc: "La voulge es un arma de asta relacionada con herramientas de cosecha simples, pero convertida en un arma de guerra. Superficialmente, una voulge podría parecerse mucho a una glaive, pero hay algunas diferencias notables en su construcción. Primero, la unión de la hoja de la voulge al eje generalmente se hacía atando los dos tercios inferiores de la hoja al lado del palo; la glaive a menudo tenía un casquillo integrado en la hoja misma y se montaba en la parte superior del palo. Además, aunque ambas tenían hojas curvas, la de la voulge era ancha y destinada a cortar, mientras que la de la glaive era estrecha y más adecuada para cortar. Una voulge se parece, por lo tanto, a una bardiche aplastada, o simplemente a un cuchillo de carne unido a un largo palo. Las tropas que usaban el arma se llaman voulgiers. Con una gran hoja de corte ligeramente curva en la parte superior, esta arma en manos de los voulgiers puede infligir heridas severas y a menudo fatales a cualquier víctima desafortunada. Esta arma es efectiva contra infantería y caballería."

 innovation_english_billmen: "Billhook"
 innovation_english_billmen_desc: "El gancho de pico se desarrolló originalmente a partir de una clase de aperos agrícolas utilizados para podar las ramas de los árboles, y consiste en un hacha y un gancho en el extremo de un palo largo. Un picador entrenado puede utilizarlo para apuñalar, cortar y arrastrar a sus enemigos, incluidos tanto soldados de infantería como de caballería. Es excelente como arma defensiva y ofensiva."

 innovation_egyptian_tabardariyya: "Tabardariyya"
 innovation_egyptian_tabardariyya_desc: "El papel principal de la Tabardariyya es proteger al Sultán y el palacio. Armados con un gran hacha, 'tabar', similar a un hacha escandinava tradicional. Estas tropas de élite, bien armadas, son formidables también en el campo de batalla."

 innovation_norman_knights: "Caballeros Normandos"
 innovation_norman_knights_desc: "De todos los caballeros de Europa, los normandos son los más renombrados. Su herencia vikinga y su ansia de batalla han llevado a muchos a buscar su fortuna en el extranjero, especialmente en el sur de Italia. Aquí, dos aventureros, Robert y Roger Guiscard, han establecido un formidable reino que emplea a muchos de sus compatriotas. La ferocidad excepcional del caballero normando y su armadura pesada lo hacen temido en cualquier campo de batalla."

 innovation_portugal_aventuros: "Aventuros"
 innovation_portugal_aventuros_desc: "Los aventuros son gentry impetuosos y aventureros, ansiosos por ver el mundo y luchar. Capaces de costear un buen equipo, estas tropas de élite están armadas con picas y buena armadura de malla o placa. A pesar de estar bien entrenados, estos nobles de sangre caliente pueden actuar imprudentemente en batalla, ansiosos por superar a otras unidades y entre sí."

 innovation_dvor_cavalry: "Caballería Dvor"
 innovation_dvor_cavalry_desc: "Dvor son las tropas domésticas de los nobles y príncipes rusos. Sus arcos y su fuerte armadura les permiten superar a los arqueros a caballo asiáticos, pero están igualmente listos para luchar cuerpo a cuerpo. Esta versatilidad, junto con una buena disciplina, los convierte en una fuerza formidable en el campo de batalla."

 innovation_hungarian_banderium: "Banderium"
 innovation_hungarian_banderium_desc: "Banderium son tropas que forman parte de los retenes baroniales, la 'bandiera', y se distinguían por el estandarte de un clérigo o noble de alto rango en el Reino medieval de Hungría. La élite de estas bandeiras, generalmente nobles, mercenarios excepcionales y miembros de alto rango de otras bandieras, conforman los retenes y guardaespaldas de los miembros de la familia real, el Banderium Real. Armados con lanzas y revestidos de armaduras de placas, son guerreros feroces y leales."

 innovation_komnenian_army: "Ejército Komneniano"
 innovation_komnenian_army_desc: "El ejército Romano Oriental de la era Komneniana, o ejército Komneniano, fue la fuerza establecida por el emperador Romano Oriental Alexios I Komnenos durante finales del siglo XI/principios del siglo XII, y perfeccionada por sus sucesores Juan II Komnenos y Manuel I Komnenos durante el siglo XII. Por necesidad, tras una extensa pérdida territorial y una derrota casi desastrosa a manos de los normandos del sur de Italia en Dyrrachion en 1081, Alexios construyó un nuevo ejército desde cero. Este nuevo ejército era significativamente diferente de las formas anteriores del ejército Romano Oriental, especialmente en los métodos utilizados para el reclutamiento y mantenimiento de soldados. El ejército se caracterizaba por una mayor dependencia de las capacidades militares del hogar imperial inmediato, los parientes de la dinastía gobernante y la aristocracia provincial bizantina. Otro elemento distintivo del nuevo ejército fue una expansión del empleo de tropas mercenarias extranjeras y su organización en unidades más permanentes. Sin embargo, la continuidad en el equipamiento, la organización de unidades, tácticas y estrategia de épocas anteriores es evidente. El ejército Komneniano fue instrumental en crear la integridad territorial y la estabilidad que permitieron la restauración Komneniana del Imperio Romano Oriental. Fue desplegado en los Balcanes, Italia, Hungría, Rusia, Anatolia, Siria, Tierra Santa y Egipto."

 innovation_ducat_trade_coin: "Moneda de Comercio Ducat"
 innovation_ducat_trade_coin_desc: "La moneda ducat se utilizó como moneda de comercio en Europa desde la Edad Media tardía, desde el siglo XIII hasta el XIX. La palabra ducat proviene del latín medieval 'ducalis' = 'relacionado con un duque (o ducado)', y inicialmente significaba 'moneda del duque' o 'moneda de un ducado'. La primera emisión de monedas de billón scyphate modeladas en trachea bizantina fue realizada por el Rey Roger II de Sicilia como parte de los Assizes de Ariano. Debía ser una emisión válida para todo el reino. Aunque la moneda fracasó más tarde, sirvió de inspiración para el Ducat veneciano que se introdujo solo unas décadas después."

 innovation_danish_svenner: "Svenner"
 innovation_danish_svenner_desc: "El costo requerido para entrenar a un caballero a menudo impide a un general desplegar tanto caballería como podría preferir. En estos casos, se puede recurrir a los Svenner, o 'páginas', para luchar junto a sus maestros. Aunque no son rivales para los caballeros profesionales, la ventaja que proporciona incluso la caballería inexperta puede ser suficiente para cambiar el rumbo de una batalla."

 innovation_mongol_cataphract: "Lanceros Mongoles"
 innovation_mongol_cataphract_desc: "Seis de cada diez soldados mongoles eran arqueros de caballería ligera; los otros cuatro eran lanceros más fuertemente armados y acorazados. En las batallas de campo, los mongoles típicamente bombardeaban a su enemigo con flechas penetrantes, abriendo el camino para una carga de caballería en la que jinetes de rápido movimiento segaban a los sobrevivientes con lanzas ganchudas. Había pocos ejércitos que pudieran oponerse a la combinación de estas fuerzas en combate abierto."

 innovation_islamic_iqtadar: "Iqta'dar"
 innovation_islamic_iqtadar_desc: "El Iqa'dar está formado por soldados que deben servicio militar a su Amir a través de un sistema similar al feudalismo conocido como Iqta'. Un sistema mediante el cual los Amirs pagan a sus hombres (esencialmente vasallos) mediante tierras, generalmente tierras capturadas o no cultivadas. Estas tropas son excelentes arqueros de caballería, capaces de disparar mortales salvas contra formaciones enemigas mientras están protegidos por su movilidad y armadura pesada."

 innovation_lithuanian_bajorija: "Bajorija"
 innovation_lithuanian_bajorija_desc: "Bajorija son miembros de la clase noble lituana que generalmente luchan para lograr lo que creen son objetivos caballerescos o simplemente por la adrenalina de vida o muerte que solo se puede experimentar en el campo de batalla. Estos nobles prefieren empuñar un hacha en combate y llevar armaduras similares a las de sus contrapartes occidentales."

 innovation_welsh_saethwyr: "Saethwyr"
 innovation_welsh_saethwyr_desc: "Saethwyr son los mejores arqueros con arco largo que el ejército de Gales tiene para ofrecer. Como inventores del arco largo, los galeses están entre sus más hábiles defensores. Aunque son débiles en combate cuerpo a cuerpo, son mortales a distancia."

 innovation_welsh_rhyfelwyr: "Rhyfelwyr"
 innovation_welsh_rhyfelwyr_desc: "Mientras que los infantes galeses generalmente favorecen la agilidad sobre la fuerza, los Rhyfelwyr no son tus galeses típicos. Empuñando un gran hacha de dos manos y la armadura más pesada disponible para ellos, lo que a estos hacheros les falta en táctica lo compensan con pura fuerza bruta."

 innovation_irish_ostmen: "Ostmen"
 innovation_irish_ostmen_desc: "Habiendo asaltado Irlanda con éxito durante muchas generaciones, los vikingos se han convertido en una parte importante de la cultura irlandesa y muchos ahora llaman a la Isla Esmeralda hogar. Los Ostmen están entre estos vikingos raiders convertidos en colonos, que ahora luchan bajo la bandera irlandesa, empuñando su combinación favorita de espada y escudo y llevando armaduras que varían en calidad desde un ligero acolchado hasta una pesada malla."

 innovation_irish_muire: "Muire"
 innovation_irish_muire_desc: "Los terratenientes irlandeses adinerados suelen emplear a Muire para actuar como protectores y guardianes de sus tierras. Como tal, los Muire están entre la infantería mejor equipada en Irlanda, empuñando finas espadas y vistiendo pesadas armaduras de placas."

 innovation_egyptian_khassaki: "Khassaki"
 innovation_egyptian_khassaki_desc: "Los Khassaki son las tropas de élite del Sultán. Dotados de los mejores caballos y equipo, los Khassaki son ferozmente leales y son las únicas tropas autorizadas a portar armas en todo momento. Además de sus deberes ceremoniales, estos guerreros endurecidos son responsables de proteger al Sultán, así como de asumir a menudo las misiones o tareas más importantes dentro del ejército del Sultán."

 #Late Medieval
 innovation_yassa: "Yassa"
 innovation_yassa_desc: "Yassa fue el código de ley oral de los mongoles declarado en público en Bujara por Gengis Kan y actuó como la ley de facto del Imperio Mongol, aunque la 'ley' se mantuvo en secreto y nunca se hizo pública. El Yassa parece tener su origen en decretos de guerra, que luego se codificaron y expandieron para incluir convenciones culturales y de estilo de vida. Al mantener el Yassa en secreto, los decretos podían ser modificados y utilizados de manera selectiva. Se cree que el Yassa fue supervisado por Gengis Kan y su medio hermano Shikhikhutag, entonces el alto juez del Imperio Mongol. Gengis Kan nombró a su segundo hijo, Chagatai, para supervisar la ejecución de las leyes. Ogedei Kan, el tercer hijo de Gengis Kan y el segundo Gran Kan, proclamó el Gran Yassa como un cuerpo integral de precedentes, confirmando la validez continua de los mandatos y ordenanzas de su padre y añadiendo los suyos propios. Ogedei codificó las reglas de vestimenta, la conducta de los kurultais, el consejo militar. Sus dos sucesores inmediatos siguieron la tradición del Yassa."

 innovation_pavise: "Pavise"
 innovation_pavise_desc: "Un pavise era un escudo oblonga utilizado durante finales del siglo XIV hasta principios del XVI. A menudo lo suficientemente grande como para cubrir todo el cuerpo, fue utilizado por arqueros, ballesteros y otros soldados de infantería. De origen europeo, el pavise era grande, cuadrado y convexo. También se fabricó una versión más pequeña para el combate cuerpo a cuerpo y para llevar en la espalda de los hombres de armas. El pavise se caracteriza por su prominente cresta central. El pavise fue utilizado principalmente por arqueros y ballesteros en la Edad Media, particularmente durante los asedios. Era llevado por un pavisier, generalmente un arquero, o, especialmente para los más grandes, por un portador de pavise especialista. El pavise se sostenía en su lugar por el pavisier o, a veces, se desplegaba en el suelo con un clavo adjunto a la parte inferior. Mientras recargaban sus armas, los arqueros y ballesteros se agachaban detrás de ellos para refugiarse de los ataques de misiles entrantes."

 innovation_hungarian_hussar: "Húsares"
 innovation_hungarian_hussar_desc: "Se piensa que los primeros húsares eran nobles serbios que buscaban refugio en Hungría. La tradición de tácticas de golpe y fuga de los húsares encontró un hogar fértil en Hungría, donde se vieron influenciados por los magiares y los turcos uigures. Muy rápidos, estos lanceros de élite están equipados con armaduras de malla ligera o brigandina y armados con lanza y espada."

 innovation_hungarian_tizlandzsasok: "Tízlándzsások"
 innovation_hungarian_tizlandzsasok_desc: "Los nobles de diez lanzas (húngaro: tízlándzsások), también lanceros de Szepes, lanceros de Spiš o portadores de lanzas de Szepes, eran un grupo de nobles condicionales que vivían en la región de Szepes del Reino de Hungría. Estos nobles formaban parte de un contingente asignado a tareas de guardia fronteriza en la periferia de los territorios conquistados en la región. En el siglo XIII, algunos de estos grupos fueron integrados oficialmente en la nobleza húngara. Recibieron sus privilegios del Rey Béla IV de Hungría en 1243. Estaban obligados a equipar a diez caballeros o lanceros. No estaban sujetos a la autoridad del ispán (o jefe) del Condado de Szepes y se les cobraba impuestos solo si los 'sirvientes reales' (o nobles) también debían pagarlo. Inicialmente, formaban alrededor de 40 familias, pero su número disminuyó a menos de 20 familias para el siglo XVI. Perdieron su estatus especial en 1804."

 innovation_germanic_verlorene_haufe: "Verlorene Haufe"
 innovation_germanic_verlorene_haufe_desc: "La 'Verlorene Haufe', o Esperanza Perdida como se les conoce, está compuesta por prisioneros y voluntarios desesperados por la gloria. Su trabajo es liderar la primera carga, generalmente fatal, utilizada para romper las formaciones de picas enemigas. La Esperanza Perdida está fuertemente armada y empuña enormes espadas 'zweihander'. Estas unidades son tropas de asalto viciosas que pueden desmembrar a un hombre en pedazos sangrientos."

 innovation_french_aventurier: "Aventurero"
 innovation_french_aventurier_desc: "Convocados para proteger a Francia de poderes extranjeros invasores, los Aventuriers son nobles patrióticos altamente capacitados en el uso de diversas armas, incluyendo la ballesta y la espada. Utilizados principalmente como tropas de proyectiles con sus ballestas, los Aventuriers están tan bien armados con armaduras de placas y son tan hábiles con la espada que también pueden ser utilizados como tropas de choque cuando se les requiere."

 innovation_polish_strzelcy: "Strzelcy"
 innovation_polish_strzelcy_desc: "Strzelcy, que significa tiradores en polaco, son tropas de caballería ligera creadas para contrarrestar las fuerzas rápidas del este utilizadas por los rusos y tártaros. Protegidos por armadura ligera y empuñando una ballesta más pequeña que sus compañeros de infantería, estas unidades utilizan su movilidad para mantenerse fuera de problemas mientras recargan."

 innovation_lanze_spezzate: "Lanze Spezzate"
 innovation_lanze_spezzate_desc: "En la Italia medieval, una lanza significaba un hombre de armas apoyado por algunas tropas más ligeras. El término lanza rota, o 'lanze spezzate', se refiere a hombres de armas que han sido separados de sus tropas de apoyo y contratados por separado. Son soldados profesionales bien disciplinados que luchan como caballería pesada con lanzas intactas y están bien protegidos por la mejor armadura de placas italiana."

 innovation_pavise_spearmen: "Lanceros Pavise"
 innovation_pavise_spearmen_desc: "Muchos de estos Pavise Spearmen están formados por los 'Jobbagy' de Hungría, poseedores de un pequeño feudo, que cumplen su deber militar como infantería porque son demasiado empobrecidos para poseer o equipar un caballo. Armados con una lanza y bien protegidos por buena armadura, estas tropas son una infantería media efectiva capaz de formar un anillo defensivo de lanzas."

 innovation_berdiche_axemen: "Hacheros de Berdiche"
 innovation_berdiche_axemen_desc: "Empuñando el poderoso 'berdiche', estos hacheros infunden miedo en el corazón de sus enemigos, justo antes de golpear en el corazón de sus enemigos. Los Berdiche Axemen reciben mucha formación para manejar sus temibles hachas de dos manos y están armados adecuadamente con armaduras que van desde malla hasta brigandina pesada. Muchos generales rusos utilizan a estos hombres como tropas de choque para debilitar las formaciones enemigas."

 innovation_janissaries: "Janízaros"
 innovation_janissaries_desc: "Los Janízaros, 'Yeni ceri', que significa nuevo soldado en griego, son reclutados por un reclutamiento de chicos cristianos dentro del imperio, pero también incluyen prisioneros de guerra que se han convertido al islam. Reclutados desde jóvenes, estos soldados constituyen una gran parte del ejército turco y juran lealtad al sultán."

 innovation_turkish_qapukulu: "Qapukulu"
 innovation_turkish_qapukulu_desc: "Los Qapukulu, 'esclavos de la corte', son regimientos de caballería doméstica leales al sultán. Formados por hijos de nobles entrenados desde una edad temprana, los jóvenes deben pasar exámenes de ingreso para unirse a este cuerpo. Una vez inscritos, estos soldados tienen un rango incluso por encima de los Janízaros. Estos hombres están equipados con lanzas y mazas, y tanto el hombre como el caballo están armados. Los Qapukulu son iguales a cualquier otra caballería en combate cuerpo a cuerpo."

 innovation_danish_obudshaer: "Obudshaer"
 innovation_danish_obudshaer_desc: "Los Obudshaer son unidades compuestas por hombres solteros creados para el servicio en el extranjero. Armados con una halberd y adornados con armadura de placas, estos hombres proporcionan una oposición dura y sangrienta a todos los que deseen hacerles daño. Sus largas halberds pueden repeler a la caballería y aplastar armaduras."

 innovation_spanish_jinete: "Jinete"
 innovation_spanish_jinete_desc: "Como término militar, jinete significa un caballero ligero español que usaba armadura de cuero y estaba armado con jabalinas, una lanza, una espada y un escudo. Eran un tipo de tropa montada desarrollada en la Alta Edad Media en respuesta a la caballería ligera masiva de los moros. A menudo se empleaban en números significativos por los españoles y, en ocasiones, eran los más numerosos de las tropas montadas españolas, desempeñando un papel importante en la guerra montada española a lo largo de la Reconquista hasta el siglo XVI. Sus tácticas no eran cerrar el combate, sino rodear a sus oponentes, hostigándolos continuamente hasta que cedieran terreno o rompieran su formación, cuando surgiera la oportunidad de cargar. Debían abrumar al enemigo con dardos, luego retirarse si el enemigo cargaba en masa y atacar sus flancos, para luego cargarlo cuando se cansara o cayera en desorden."

 innovation_iberian_pikes: "Piquetes ibéricos"
 innovation_iberian_pikes_desc: "En combate, los piqueteros luchaban en líneas muy cercanas, formando un cuadrado con sus armas apuntando hacia afuera como un gigantesco erizo. En la Baja Edad Media, los piqueteros ibéricos servían en dos grandes grupos, siempre luchando en orden cerrado, donde su formación les daba la ventaja. En las primeras filas estaban los piqueteros acorazados - la élite - ya que estaban equipados con una armadura defensiva básica, llamada coseletes, por la armadura que llevaban. El otro grupo estaba formado por los piqueteros ligeros, que no tenían otra armadura defensiva que un casco, y se llamaban picas secas."

 innovation_portugal_crossbowmen: "Besteiros do conto"
 innovation_portugal_crossbowmen_desc: "A lo largo de su existencia como fuerza militar, los besteiros do conto jugaron un papel fundamental en las batallas libradas por la Corona Portuguesa. El reclutamiento de hombres para esta milicia debía hacerse entre los artesanos, preferiblemente aquellos que estaban casados y no cultivaban la tierra de manera permanente con un yugo de bueyes. Armados con ballestas, estos soldados contaban con una precisión mortal y una capacidad de disparo altamente destructiva. Se cree que comenzaron a organizarse a fines del siglo XIII y principios del XIV por Dom Dinis o Dom Afonso IV."

 innovation_irish_galloglaigh: "Gall óglaigh"
 innovation_irish_galloglaigh_desc: "Los gall óglaigh ('guerreros extranjeros') eran una clase de guerreros mercenarios de élite que eran principalmente miembros de los clanes nórdico-gaélicos de Irlanda entre mediados del siglo XIII y finales del siglo XVI. Originalmente aplicados a los escoceses, que compartían un origen y lengua común con los irlandeses, pero como eran descendientes de colonos nórdicos del siglo X que se habían entremezclado con la población local en Escocia occidental, los irlandeses los llamaban Gall Gaeil ('gaélicos extranjeros'). Los gall óglaigh eran atractivos como infantería fuertemente armada y entrenada para ser considerados como una fuerte defensa para mantener una posición, a diferencia de la mayoría de los soldados de infantería irlandeses, que estaban menos bien armados que el típico noble irlandés que luchaba como caballería. Pronto, la mayoría de los gall óglaigh eran irlandeses nativos y el término llegó a significar un tipo de guerrero, en lugar de una designación étnica."

 innovation_irish_ceithern: "Ceithern"
 innovation_irish_ceithern_desc: "Ceithern, que significa 'banda de guerra', constituye la mayor parte de la infantería en los ejércitos irlandeses. Reclutados fácilmente de pueblos y aldeas, estos soldados gaélicos funcionan bien cuando se despliegan en conjunto con los pesados Galloglaigh. Su equipo preferido es a menudo lo que puedan conseguir, típicamente un hacha y un escudo, y para unos pocos afortunados, armadura acolchada."

 innovation_gaelic_ceathairne: "Ceathairne"
 innovation_gaelic_ceathairne_desc: "La palabra gaélica ‘ceathairne’ se utiliza para referirse a una banda de campesinos armados de las tierras altas escocesas. Literalmente, la palabra significa ‘hombre de batalla’ – un guerrero. Empleados específicamente por un señor de la guerra como una fuerza privada de combate para hostigar a clanes vecinos, con el tiempo los cateran se convirtieron en soldados profesionales, en lugar de simplemente hombres de baja condición presionados al servicio de su señor local de forma temporal."

 innovation_sofa: "Sofas"
 innovation_sofa_desc: "Sofa es un término mandinga para soldados esclavos que sirvieron en el ejército del Imperio de Malí. Los sofas aparecen por primera vez en registros orales y escritos durante la formación del Imperio de Malí. Los sofas eran reclutados de 'jonow' (esclavos) capturados en batalla o comprados de lejos. Se podía contar con ellos en la mayoría de los casos para obedecer, ya que su subsistencia dependía completamente de su amo. La institución de la esclavitud en el Imperio de Malí recompensaba fuertemente la lealtad, y los jonow podían ascender a posiciones civiles o militares de prominencia. Los jonow se convertían en parte del clan de su amo y a menudo eran liberados después de un cierto número de años. Como parte del clan, se esperaba que los jonow acompañaran a su amo a la batalla y manejaran su caballo y armas. Inicialmente prohibidos de participar en la guerra directa, los sofas eventualmente constituían la mayor parte del ejército de infantería de Malí. Como infantería, estaban armados con arcos y flechas por el estado o, más precisamente, por clanes reales dedicados al estado. Los sofas estaban equipados con dos aljabas, y su arco era pequeño en comparación con los estándares europeos. No podía disparar muy lejos o con gran potencia, así que los sofas utilizaban venenos mortales y disparaban en arcos para dar fuerza a las flechas. Los sofas también usaban flechas en llamas, especialmente contra fortificaciones que a menudo eran poco más que techos de paja o empalizadas de madera."

 innovation_irish_horseboys: "Jinetes"
 innovation_irish_horseboys_desc: "Los horseboys, aunque típicamente actúan como escuderos para los nobles irlandeses, son también capaces de luchar por sí mismos. Muestran una gran destreza en la equitación, montando sin estribos ni silla, y pueden lanzar jabalinas con precisión mortal. Aunque rápidos y ágiles, los horseboys evitan el combate cuerpo a cuerpo debido a su falta de armadura."

 innovation_turkish_azabs: "Azabs"
 innovation_turkish_azabs_desc: "En tiempos de guerra, se espera que cada pueblo y ciudad produzca, equipe y apoye a un número de reclutas, los Azabs, que significa solteros. Estas tropas ligeras mal armadas deben proteger puentes y caminos y apoyar a las tropas más pesadas."

 innovation_yeoman_archers: "Arqueros Yeoman"
 innovation_yeoman_archers_desc: "El arquero yeoman es un término aplicado específicamente a los arqueros de largo alcance ingleses y galeses (ya sea montados o a pie) de los siglos XIV-XV. Los arqueros yeoman eran campesinos; miembros libres de las clases sociales por debajo de la nobleza y la gentry. Eran un producto de la forma inglesa de feudalismo en la que el deber militar de un caballero hacia su señor (que era implícito en el feudalismo de tenencia) fue reemplazado por un servicio pagado y a corto plazo. Al negar la ventaja táctica de grandes números de caballería (caballeros montados y hombres de armas) con su capacidad para disparar rápidamente volúmenes de flechas, se considera que los arqueros yeoman son parte de la Revolución de la Infantería del siglo XIV. Las Batallas de Crécy y Agincourt son las victorias más conocidas de los arqueros yeoman."

 innovation_consulate_of_the_sea: "Carta Consular"
 innovation_consulate_of_the_sea_desc: "La Carta Consular, más tarde Consolat de mar, 'Consulado del Mar', fue un organismo cuasi-judicial que administraba las leyes internacionales marítimas y comerciales en el Mediterráneo occidental. \n\nLa institución, así como instituciones relacionadas como el ius mercadorium, otorgó a los comerciantes una serie de libertades para resolver sus propias disputas mercantiles sin interferencia real, mientras que ofrecía al rey una compensación financiera a cambio. \n\nAunque nunca se aplicó a todo el Mediterráneo, el Consulado del Mar estuvo aún muy extendido a lo largo de toda la Corona de Aragón y presente en ciudades importantes como Valencia o Barcelona."

 innovation_luceran_archery: "Tiro con arco Luceran"
 innovation_luceran_archery_desc: "El asentamiento musulmán de Lucera fue el resultado de la decisión del Rey de Sicilia Federico II de la dinastía Hohenstaufen (1194–1250) de trasladar a 20,000 musulmanes sicilianos a Lucera, un asentamiento en Apulia, en el sur de Italia. La comunidad era responsable, entre otras obligaciones, de suministrar a los Reyes de Sicilia un contingente militar teórico de alrededor de 14 a 15,000 hombres, de los cuales entre 7 y 10,000, según fuentes contemporáneas, eran efectivamente empleables en el campo de batalla en Cortenuova. Estas tropas, la mayoría de ellas arqueros ligeramente armados y muchos también entrenados en el uso de la honda, constituían la fiel guardia personal de los Hohenstaufen, ya que no tenían conexión con los rivales políticos de la 'Casa de Suabia', estaban listos para hacer la guerra—ferozmente incluso para los estándares contemporáneos—contra las poblaciones locales y dependían completamente de su soberano."


#BAP


 #BAP innovations

 #innovation_lost_wax_casting: "Lost-wax Casting"
 #innovation_lost_wax_casting_desc: "Inspired by the masters of Igbo-Ukwu, our artisans have mastered a highly sophisticated technique of casting metal to produce beautiful and ornate works of art. Our bronze works will be known for all of time!"

 #innovation_griots: "Griots"
 #innovation_griots_desc: "[griots|E] are known across West Africa under various names, including jeli in northern Mande areas, jali in southern Mande areas, guewel in Wolof, gawlo in Pulaar, arokin in Yorùbá, and gesere in Soninke. Usually of lower-caste the griot's place in West African society is that of historian, storyteller, praise singer, poet, or musician."
 #unlock_griot_interaction: "[characters|E] may appoint an [unlanded|E] [courtier|E] as their Royal [griot|E]."
 #unlock_griot_epic: "[rulers|E] with a Royal [griot|E] can use the [commission_epic|E] [decision|E]."


 mande_hunter:0 "Donzow"
 mande_hunter_flavor:0 "#F Los Donzow son los cazadores tradicionales de la sociedad mandinka. Formados en fraternidades sagradas conocidas como Donzo Tɔn, los Donzow tradicionalmente desempeñan un papel multifacético dentro de Manding. En primer lugar, como proveedores de alimentos, especialmente animales de caza; como figuras espirituales debido a su supuesta utilización de magia; y, finalmente, por su papel en los ejércitos de los mandinka debido a su destreza marcial. La naturaleza organizada de las fraternidades de los Donzow también los convirtió en una facción influyente en la vida política de la sociedad mandinka durante siglos.#!"


 #ROA


 innovation_outrigger_boats: "Barcos de Flotadores"
 innovation_outrigger_boats_desc: "Nuestras embarcaciones están equipadas con flotadores para mantenerlas estables en aguas turbulentas. Esto nos permite cruzar los océanos con facilidad mientras permanecemos ágiles y maniobrables."

 innovation_highland_agriculture: "Agricultura en Tierras Altas"
 innovation_highland_agriculture_desc: "La agricultura se desarrolló en las tierras altas de Papúa hace mucho tiempo, independientemente de cualquier otro lugar del mundo. Esto ha permitido que aquellos en el interior montañoso aislado prosperen más allá de lo que normalmente sugeriría el terreno hostil."

 innovation_mongolian_horse_breed: "Cría de Caballos Mongoles"
 innovation_mongolian_horse_breed_desc: "Cría de Caballos Mongoles"

 innovation_sandalwood_groves: "Bosques de Sándalo"

 fire_lances: "Lanzas de Fuego"
 fire_lances_flavor: "#F Los piqueros equipados con lanzas que escupen fuego traen terror a nuestros enemigos como nunca antes.#!"
 innovation_fire_lances: "Lanzas de Fuego"
 innovation_fire_lances_desc: "Con la invención de la pólvora, ahora podemos equipar las picas con una carga explosiva que daña y desmoraliza a las tropas enemigas."

 innovation_advanced_fire_lances: "Lanzas de Fuego Avanzadas"
 innovation_advanced_fire_lances_desc: "Construir tubos de lanzas de fuego de acero en lugar de madera aumenta enormemente su durabilidad y potencia. Con esto podemos llenar los tubos con metralla, devastando a las tropas enemigas."

 hand_cannons: "Cañoneros de Mano"
 hand_cannons_flavor: "#F La nueva artillería basada en pólvora permite a nuestros soldados devastar al enemigo desde lejos.#!"
 innovation_hand_cannons: "Cañones de Mano"
 innovation_hand_cannons_desc: "El tubo explosivo de las lanzas de fuego anteriores se puede reutilizar como un arma independiente, disparando proyectiles mortales desde la distancia."

 # MAA
 ballista_elephant: "Ballista de Elefante"
 ballista_elephant_flavor: "#F Por sí solo, un elefante de guerra es una fuerza a tener en cuenta. Al llevar una ballesta gigante, nuestros enemigos tienen aún más que temer.#!"
 innovation_ballista_elephant: "Elefantes Ballista"
 innovation_ballista_elephant_desc: "Los avances en tecnología nos han permitido equipar a nuestros elefantes de guerra con balistas. Esta plataforma de armas móvil es devastadora para las tropas enemigas y las murallas de los castillos por igual."

 nangchen_cavalry: "Caballería Nangchen"
 nangchen_cavalry_flavor: "#F Criados en las montañas y mesetas del Tíbet, los caballos Nangchen son una excelente caballería de escaramuza en terrenos donde la mayoría de los caballos tendrían dificultades.#!"
 innovation_highland_horse_breeding: "Cría de Caballos de Tierras Altas"
 innovation_highland_horse_breeding_desc: "Los caballos Nangchen son pequeños, pero ágiles y potentes, nativos de la meseta tibetana, valorados por el comercio a lo largo de la Ruta del Té y del Caballo. Su resistencia en terrenos difíciles sería un gran activo para nuestros ejércitos."

 iron_buddhas: "Budas de Hierro"
 iron_buddhas_flavor: "Budas de Hierro"

 iron_hawks: "Halcones de Hierro"
 iron_hawks_flavor: "Halcones de Hierro"

 bed_crossbows: "Ballestas de Cama"
 bed_crossbows_flavor: "Las ballestas de cama son armas de largo alcance que se utilizan en posiciones fijas, proporcionando apoyo a las tropas en combate y defendiendo lugares estratégicos."

 #RICE

 innovation_RICE_qanats:0 "Qanats"
 innovation_RICE_qanats_desc:0 "En gran parte de Oriente Medio y África del Norte, hay redes especiales de canales y acueductos subterráneos diseñados para traer agua a donde más se necesita. Conocido como qanats, foggaras, karizes, etc., estas hazañas de ingeniería han estado alrededor desde los días de los antiguos persas."
 RICE_yazd_qanat_decision_unlock:0 "Puede tomar el [decision|E] a #V $RICE_yazd_build_a_new_qanat$ #!"
 RICE_yazd_build_a_new_qanat:0 "Financiar la construcción de un Qanat (requiere RICE)"
 innovation_RICE_irrigation_tanks:0 "Tanques de Riego"
 innovation_RICE_irrigation_tanks_desc:0 "En todo el subcontinente indio, se construyen ciertos tipos de grandes pozos y embalses artificiales para aprovechar la topografía local con el fin de cosechar y conservar el agua de lluvia. Estos tanques pueden ser utilizados para la agricultura, el consumo, el baño y los rituales religiosos."
 RICE_irrigation_tanks_decision_unlock:0 "Puedes tomar la [decision|E] para #V $RICE_india_irrigation_tank_decision$#!"

 innovation_RICE_dog_sleds:0 "Sleds de perros"
 innovation_RICE_dog_sleds_desc:0 "En el extremo norte, algunos perros han sido criados y entrenados para tirar los trineos sobre nieve e incluso hielo. Estos trineos han demostrado ser eficaces para viajar, transportar suministros y cazar a grandes distancias."
 innovation_RICE_arctic_boats:0 "Barcos Árticos"
 innovation_RICE_arctic_boats_desc:0 "En las regiones frías del Océano Ártico, se utilizan dos tipos de barcos llamados el #italic kayak #! y el #italic umiak #! para transportar personas y ayudar en la caza de animales marinos, en particular las grandes y temibles ballenas."
 innovation_RICE_toggling_harpoons:0 "Toggling Harpoons"
 innovation_RICE_toggling_harpoons_desc:0 "La arpón es una innovación en la antigua harpoon utilizada a menudo en la caza marítima. En lugar de tener sólo un punto, tiene dos. Uno se une a la base de empuje, y el otro, que es desmontable, encajado sobre el primer punto como una tapa. Esto hace que la arpón sea mucho más eficaz en la incrustación dentro de un animal."
 innovation_RICE_skiing:0 "Esquí"
 innovation_RICE_skiing_desc:0 "Los esquís son estrechas tiras de madera usadas para deslizarse por la nieve y el terreno congelado. Se utilizan para viajar y transporte, especialmente durante el invierno o en regiones más frías donde la nieve y el hielo son prominentes."

 innovation_RICE_velakkara_guards:0 "Guardias Velakkara"
 innovation_RICE_velakkara_guards_desc:0 "Los Velakkara o Velaikkarar son gremios de soldados en el sur de la India que, aunque a menudo son de origen tamil, están afiliados a una variedad de castas y comunidades. Organizándose de manera corporativa, regulan sus propios asuntos a través de grandes asambleas. Su eficacia como soldados ha llevado a algunos reyes y nobles a emplear regimientos enteros de ellos como guardias reales o protectores de sitios sagrados."
 RICE_velakkara:0 "Velakkara"
 RICE_velakkara_flavor:0 "#F Los Velakkara o Velaikkarar son gremios de soldados que son bastante efectivos en batalla, y a menudo son desplegados como guardias reales o protectores de sitios sagrados.#!"
 RICE_bantu_warriors:0 "Guerreros Bantú"
 RICE_bantu_warriors_flavor:0 "#F Experimentados tanto en combate defensivo como ofensivo, estos guerreros tienen el valor y el coraje para hacer lo necesario por el bien de su gente.#!"
 
 
 
 # Flavorized localization
 
 # Dorui (土塁)
 innovation_motte_japanese: "Dorui"
 innovation_motte_japanese_desc: "Arrojar la tierra cavada de nuestras avenas en rampas elevadas, propiedad de madera da a nuestras fortalezas la tierra alta que ninguna simple redada puede superar."

 # Toseong (토성/土城)
 innovation_motte_korean: "Toseong"
 innovation_motte_korean_desc: "Empaquetado duro en capas a lo largo de nuestras curvas de río y pases de montaña, nuestro tenedor nos da tanto el suelo alto como una pared que no puede romper una simple redada."

 # Gord - shared early term across the West, East, and South Slavic branches
 innovation_motte_slavic: "Gord"
 innovation_motte_slavic_desc: "Anillados por la tierra y palisades de madera, nuestros gords están vigilando el campo y se forzaron por igual, dándonos refugio en la guerra y un asiento desde el cual gobernar nuestras tierras."

 # Balık - Old Turkic for a walled town/stronghold (cf. Ordu-Baliq)
 innovation_motte_turkic: "Balık"
 innovation_motte_turkic_desc: "Desde las ciudades amuralladas a lo largo de las carreteras comerciales hasta las fortalezas de nuestros khagans, un balık es a la vez fuerte y sede de autoridad, dándonos la tierra alta que nuestros enemigos no pueden tomar fácilmente."

 # Garh (गढ़)
 innovation_motte_indo_aryan: "Garh"
 innovation_motte_indo_aryan_desc: "Criados en la cima de la colina y en el río, nuestros garhs nos dan refugio y la tierra alta desde la cual hasta la entrada y la administración de nuestras tierras."

 # Dezh (دژ)
 innovation_motte_iranian: "Dezh"
 innovation_motte_iranian_desc: "Criado en los pases y alturas que protegen nuestras tierras, nuestro dezh se levanta como refugio y sede de autoridad, dándonos la tierra alta que nuestros enemigos no pueden tomar fácilmente."

 # Qal'a (قلعة)
 innovation_motte_arabic: "Qal'a"
 innovation_motte_arabic_desc: "Criado en la cima de la colina y el borde del desierto por igual, nuestro qal'a stand como refugio y sede de autoridad, dándonos la tierra alta que nuestros enemigos no pueden tomar fácilmente."

 # Kastron (κάστρον)
 innovation_motte_byzantine: "Kastron"
 innovation_motte_byzantine_desc: "Criado a lo largo de la frontera y la costa por igual, nuestro kastra sirve como refugio y sede de autoridad, dándonos la tierra alta que nuestros enemigos no pueden tomar fácilmente."

 # Chuángzǐ Nǔ (床子弩) - replaces the old unlocalized "Siege Crossbow" entry
 innovation_catapult_chinese: "ChuángzImpancés"
 innovation_catapult_chinese_desc: "Grandes arcos cruzados multi-codo montados sobre una cama de madera y enrollados por windlass o tripulaciones, estos tornillos pesados y piedras contra las paredes de la fortaleza, desde muy más allá de la gama de los propios arqueros defensores."

 # Yíng (营/營)
 innovation_barracks_chinese: "Yíng"
 innovation_barracks_chinese_desc: "Filas de yíng recubren nuestras guarnición, dando a nuestros soldados un lugar para comer, perforar y dormir como un solo cuerpo en lugar de dispersarse para defenderse por sí mismos."

 # Ribat (رباط)
 innovation_barracks_arabic: "Ribat"
 innovation_barracks_arabic_desc: "A lo largo de nuestras fronteras, bandas de bandos dedicados todo el año, dándonos un cuerpo permanente de hombres siempre listos para marchitar y marchar."

 # Fǔbīng (府兵)
 innovation_bannus_chinese: "FЁbīng"
 innovation_bannus_chinese_desc: "Bajo el sistema f descubrimientobīng, los hogares de nuestro reino están organizados para proporcionar y equipar a los soldados en rotación, dando a nuestros gobernantes una reclamación legal permanente sobre su servicio en la guerra."

 # Gundan (軍団)
 innovation_bannus_japanese: "Gundan"
 innovation_bannus_japanese_desc: "Organizado en gundan bajo la autoridad de la corte, los hombres de poder de nuestras provincias deben un plazo fijo de servicio, dando a nuestros gobernantes una base legal para los grandes anfitriones."

 # An-Nafīr al-'Āmm (النفير العام)
 innovation_bannus_arabic: "An-Nafīr al-'mm"
 innovation_bannus_arabic_desc: "Cuando nuestros gobernantes llaman al nafîr, todo hombre libre capaz de llevar armas está obligado por la costumbre y la fe a responder, formando la base legal para el pastoreo de un gran anfitrión."

 # Bambakion (βαμβάκιον)
 innovation_quilted_armor_byzantine: "Bambakion"
 innovation_quilted_armor_byzantine_desc: "Esposo con algodón crudo o desperdicios de seda, el bambakion puede ser usado solo o bajo correo, y es una manera asequible para armar un regimiento entero para la batalla."

 # Lodya (ладья)
 innovation_longboats_east_slavic: "Lodya"
 innovation_longboats_east_slavic_desc: "Nuestros lodyi ply abren el mar y el río por igual y pueden ser portaged entre las vías fluviales, dándonos una movilidad excepcional que ningún rival puede coincidir fácilmente."

 # Gajasenā (गजसेना) - the "elephant wing" of the classical fourfold (chaturanga) army
 innovation_elephantry_indo_aryan: "Gajasena"
 innovation_elephantry_indo_aryan_desc: "Junto a nuestros carros, caballería y infantería, la gajasena forma un miembro de cualquier ejército adecuado, y los elefantes entrenados para la guerra pueden pisotear una línea de infantería o llevar un aullido de arqueros al grueso de la batalla."

 # Yānaip Padai (யானைப் படை)
 innovation_elephantry_dravidian: "Yanaip Padai"
 innovation_elephantry_dravidian_desc: "Sung de incluso en los poemas de nuestros tribunales, el yanaip padai han sido considerados desde hace mucho tiempo entre los pilares de un ejército adecuado, y un elefante de guerra bien entrenado puede dispersar una línea de infantería o correr por un carro con facilidad."

 # Domrei Sangkream (ដំរីសង្គ្រាម)
 innovation_elephantry_mon_khmer: "Domrei Sangkream"
 innovation_elephantry_mon_khmer_desc: "Los domrei sangkream han llevado a nuestros reyes y comandantes a la batalla, pisoteando la infantería y llevando a los arqueros arriba de la fray."

 # Chang Suek (ช้างศึก)
 innovation_elephantry_tai: "Chang Suek"
 innovation_elephantry_tai_desc: "Ninguna vista rompe una línea enemiga como la cantina, elefantes entrenados para pisotear la infantería, destrozar las formaciones, y llevar comandantes por encima de la prensa de la batalla."

 # Pil (پیل)
 innovation_elephantry_iranian: "Pil"
 innovation_elephantry_iranian_desc: "Aunque debemos adquirirlos y entrenarlos de tierras más allá del este, la pupila que tenemos son una vista impresionante en el campo de batalla, capaz de pisotear la infantería y despojar a los caballos de caballería enemiga con su mera presencia."

 # Shotor Savar (شترسوار)
 innovation_war_camels_iranian: "Shotor Savar"
 innovation_war_camels_iranian_desc: "Bred y entrenado por nuestro savar para la guerra y no para el comercio, estos camellos y sus jinetes pueden cruzar el desierto más duro y los caballos enemigos desprevenidos sin usar a su olor."

 # Ibl al-Harb (إبل الحرب)
 innovation_war_camels_arabic: "Ibl al-Harb"
 innovation_war_camels_arabic_desc: "Entrenado para la guerra en lugar de comerciar, nuestro ibl al-harb puede cruzar el desierto más duro con facilidad, y el olor solo de estos camellos es suficiente para desatar los caballos de guerra de nuestros enemigos."

 # Ustra-sena (उष्ट्रसेना)
 innovation_war_camels_indo_aryan: "Ustra-sena"
 innovation_war_camels_indo_aryan_desc: "Levantado a lo largo de nuestras marchas del desierto, la ustra-sena puede cruzar el terreno que ningún caballo se atrevería, y el olor mismo de nuestros cámeles de guerra es suficiente para deshacerse de una línea enemiga de caballería."
 
 # Qanat (قنات)
 innovation_development_01_iranian: "Qanat"
 innovation_development_01_iranian_desc: "Al túnelear canales suavemente inclinados bajo tierra para entrar en acuíferos en la base de las colinas, nuestros qanats traen agua a granjas y asentamientos por igual sin que se evapore bajo el sol, dejando que nuestra gente prospere por generaciones venideras."

 # Foggara (فقّارة)
 innovation_development_01_berber: "Foggara"
 innovation_development_01_berber_desc: "Al túnelear canales suavemente inclinados bajo tierra para entrar en acuíferos en la base de las colinas, nuestros foggaras traen agua a nuestros asentamientos de oasis sin evaporarse bajo el sol del desierto, dejando que nuestra gente prospere por generaciones venideras."

 # Falaj (فلج)
 innovation_development_01_arabic: "Falaj"
 innovation_development_01_arabic_desc: "Canalizando agua de fuentes distantes y acuíferos a través de túneles excavados bajo tierra profunda, nuestro aflaj irrigar nuestras granjas y asentamientos sin perder su agua al sol del desierto, dejando que nuestra gente prospere por generaciones venideras."

 # Yaoyi (徭役)
 innovation_development_01_chinese: "Yáoyì"
 innovation_development_01_chinese_desc: "Llamando a nuestro pueblo a dar su trabajo a su vez, podemos cavar canales, criar graneros, y construir caminos que permitan que nuestros asentamientos crezcan en tamaños más grandes, asegurando la prosperidad de nuestro pueblo por generaciones venideras."

 # Grivna (гривна)
 innovation_currency_01_east_slavic: "Grivna"
 innovation_currency_01_east_slavic_desc: "Bartering es lento e ineficiente; el fundir nuestra plata en lingotes de grivna estándar reforzará el comercio y aumentará la difusión de ideas dentro de nuestro reino."

 # Karshapana (कार्षापण)
 innovation_currency_01_indo_aryan: "Karshapana"
 innovation_currency_01_indo_aryan_desc: "Bartering es lento e ineficiente; la adopción de karshapanas puntiagudas de plata y cobre como moneda oficialmente reconocida reforzará el comercio y aumentará la difusión de ideas dentro de nuestro reino."

 # Nomisma (νόμισμα)
 innovation_currency_01_byzantine: "Nomisma"
 innovation_currency_01_byzantine_desc: "Bartering es lento e ineficiente; golpear nuestro oro en nomismata de un peso fijo y pureza reforzará el comercio y aumentará la difusión de ideas dentro de nuestro reino."

 # Dinar (دينار)
 innovation_currency_01_arabic: "Dinar"
 innovation_currency_01_arabic_desc: "Bartering es lento e ineficiente; golpear nuestro oro en dinares de peso fijo y pureza reforzará el comercio y aumentará la difusión de ideas dentro de nuestro reino."

 # Drachm (درهم)
 innovation_currency_01_iranian: "Drachm"
 innovation_currency_01_iranian_desc: "Bartering es lento e ineficiente; golpear nuestra plata en drachms de un peso fijo y la pureza reforzará el comercio y aumentará la difusión de ideas dentro de nuestro reino."

 # Kaiyuan Tongbao (開元通寶)
 innovation_currency_01_chinese: "Kaiyuan Tongbao"
 innovation_currency_01_chinese_desc: "La barcaza es lenta e ineficiente; la fundición redonda de bronce kāiyuán tōngb proclamao coins, ligada por el agujero en su centro, reforzará el comercio y aumentará la difusión de ideas dentro de nuestro reino."

 # Wadokaichin (和同開珎)
 innovation_currency_01_japonic: "Wadokaichin"
 innovation_currency_01_japonic_desc: "Bartering es lento e ineficiente; acuñar nuestras propias monedas wadōkaichin de la manera de nuestros vecinos a través del mar reforzará el comercio y aumentará la difusión de ideas dentro de nuestro reino."

 # Cyfran - Welsh partible inheritance under the Laws of Hywel Dda
 innovation_gavelkind_brythonic: "Cyfran"
 innovation_gavelkind_brythonic_desc: "Estabilidad y prosperidad van de la mano. Bajo la costumbre de Cyfran, la tierra de un hombre muerto se divide por igual entre todos sus hijos en lugar de dejarse luchar, eliminando gran parte de la inestabilidad que tradicionalmente ocurre en la sucesión."

 # Ulus - the portion of realm and people granted to each son
 innovation_gavelkind_mongolic: "Ulus"
 innovation_gavelkind_mongolic_desc: "Estabilidad y prosperidad van de la mano. Concediendo a cada hijo su propio ulus a gobernar mientras vive, nosotros perdonamos nuestro reino la inestabilidad que tradicionalmente ocurre en la sucesión."

 # Vibhaga (विभाग) - Dharmashastra term for partition of inheritance
 innovation_gavelkind_indo_aryan: "Vibhaga"
 innovation_gavelkind_indo_aryan_desc: "Estabilidad y prosperidad van de la mano. Bajo la costumbre de vibhāga, las tenencias de un padre se dividen en la parte debida entre sus hijos en lugar de dejarse luchar, eliminando gran parte de la inestabilidad que tradicionalmente ocurre en la sucesión."

 # Zadruga - South Slavic joint household/kin commune
 innovation_gavelkind_south_slavic: "Zadruga"
 innovation_gavelkind_south_slavic_desc: "La estabilidad y la prosperidad van de la mano. De la manera del zadruga, la tierra y el hogar son compartidos y divididos entre parientes por costumbre acordada en lugar de dejarse luchar, eliminando gran parte de la inestabilidad que tradicionalmente ocurre en la sucesión."

 # Daitian Fa (代田法) - Han-dynasty "alternating fields" method
 innovation_crop_rotation_chinese: "Daitian"
 innovation_crop_rotation_chinese_desc: "Dividiendo nuestros campos en tiras alternas y girando que tiras se encuentran barbedas cada año, el método dàitián nos permite cultivar más cultivos sin agotar el suelo en nuestras fincas."

 # Vastu Shastra (वास्तुशास्त्र)
 innovation_city_planning_indo_aryan: "Vastu Shastra"
 innovation_city_planning_indo_aryan_desc: "Al establecer nuestros asentamientos de acuerdo con los principios de vastu shastra, orientados a las direcciones cardinales y los movimientos de los cielos, podemos construir nuevas tenencias que son tanto más funcionales como más auspiciosas que las anteriores que surgieron con el tiempo."

 # Kaogong ji (考工記) - the Rites of Zhou chapter on capital-city layout
 innovation_city_planning_chinese: "Kaogong ji"
 innovation_city_planning_chinese_desc: "Al establecer nuestros asentamientos de acuerdo con los viejos principios del kЁogōngjì, amurallado y orientado en una rejilla sobre el palacio del gobernante, podemos construir nuevas posesiones que sean tanto más funcionales como más adecuadas que las más antiguas que surgieron con el tiempo."

 # Misr (مصر), pl. Amsar - deliberately founded garrison-cities
 innovation_city_planning_arabic: "Misr"
 innovation_city_planning_arabic_desc: "Al fundar un nuevo amsar de tierra desnuda, colocado alrededor de la mezquita y el mercado congregacional en lugar de dejar crecer a mano, podemos construir nuevas tenencias que sean tanto más funcionales como mejor adaptadas a nuestro pueblo."

 # Taofa (討伐) - a rightful punitive expedition
 innovation_casus_belli_chinese: "Taofa"
 innovation_casus_belli_chinese_desc: "Podría haber sido la ley de la tierra durante generaciones, pero al definir nuestras campañas como tЁofá, una expedición punitiva justa contra el desorden, podemos evitar provocar el ire de nuestros vecinos y la represalia que a menudo viene con ella."

 # Dharmayuddha (धर्मयुद्ध) - righteous war fought by just cause and rule
 innovation_casus_belli_indo_aryan: "Dharmayuddha"
 innovation_casus_belli_indo_aryan_desc: "Podría haber sido la ley de la tierra por generaciones, pero al aferrarse a las viejas reglas de dharmayuddha, una guerra justa luchada por una causa justa, podemos evitar provocar el ire de nuestros vecinos y la represalia que a menudo viene con ella."

 # Thing/Ting - the Germanic folk assembly
 innovation_plenary_assemblies_germanic: "Thing"
 innovation_plenary_assemblies_germanic_desc: "Para gobernar eficazmente, debemos llamar a la cosa y reunir a todos los hombres libres del reino para discutir y resolver asuntos legislativos. La asistencia es obligatoria, y los que no vienen serán multados y perderán su capacidad de influir en cualquier decisión tomada."

 # Marchfeld - the Frankish spring assembly of free men (Campus Martius/Campus Madius)
 innovation_plenary_assemblies_frankish: "Marchfeld"
 innovation_plenary_assemblies_frankish_desc: "Para gobernar eficazmente, debemos llamar a nuestros hombres libres a la Marchfeld cada primavera para discutir y resolver asuntos legislativos. La asistencia es obligatoria, y los que no vienen serán multados y perderán su capacidad de influir en cualquier decisión tomada."

 # Veche (вече) - shared early Slavic town/tribal assembly
 innovation_plenary_assemblies_slavic: "Veche"
 innovation_plenary_assemblies_slavic_desc: "Con el fin de gobernar eficazmente, debemos llamar al veche y reunir a todos los hombres libres del reino para discutir y resolver asuntos legislativos. La asistencia es obligatoria, y los que no vienen serán multados y perderán su capacidad de influir en cualquier decisión tomada."

 # Kurultai (courultai/qurultai) - the Turko-Mongolic great council
 innovation_plenary_assemblies_turko_mongolic: "Kurultái"
 innovation_plenary_assemblies_turko_mongolic_desc: "Para gobernar eficazmente, debemos llamar a un kurultai y reunir a los jefes y hombres libres de nuestro pueblo para discutir y resolver asuntos de derecho y guerra. La asistencia es obligatoria, y los que no vienen serán multados y perderán su capacidad de influir en cualquier decisión tomada."

 # Majlis ash-Shura (مجلس الشورى) - Islamic consultative council
 innovation_plenary_assemblies_arabic: "Majlis ash-Shura"
 innovation_plenary_assemblies_arabic_desc: "Para gobernar eficazmente, debemos convocar un majlis ash-shura y reunir a los hombres libres del reino para discutir y resolver asuntos legislativos. La asistencia es obligatoria, y los que no vienen serán multados y perderán su capacidad de influir en cualquier decisión tomada."

 # Synkletos (σύγκλητος) - the Byzantine senate
 innovation_plenary_assemblies_byzantine: "Sinkletos"
 innovation_plenary_assemblies_byzantine_desc: "Para gobernar eficazmente, debemos convocar a los sinkletos y reunir a los hombres libres del reino para discutir y resolver asuntos legislativos. La asistencia es obligatoria, y los que no vienen serán multados y perderán su capacidad de influir en cualquier decisión tomada."

 # Sabha (सभा) - Vedic/Dharmashastra popular assembly
 innovation_plenary_assemblies_indo_aryan: "Sabha"
 innovation_plenary_assemblies_indo_aryan_desc: "Para gobernar eficazmente, debemos convocar el sabha y reunir a los hombres libres del reino para discutir y resolver asuntos legislativos. La asistencia es obligatoria, y los que no vienen serán multados y perderán su capacidad de influir en cualquier decisión tomada."

 # Zhangbu (帳簿)
 innovation_ledger_chinese: "Zhangbu"
 innovation_ledger_chinese_desc: "A medida que crecen nuestras tierras, necesitamos una mejor manera de hacer un seguimiento de lo que poseemos. Mantener un zhàngbù de nuestras posesiones asegurará que siempre sepamos qué recursos tenemos a nuestra disposición."

 # Diwan (ديوان) - established under Caliph Umar as the register of the state
 innovation_ledger_arabic: "Diwan"
 innovation_ledger_arabic_desc: "A medida que crecen nuestras tierras, necesitamos una mejor manera de hacer un seguimiento de lo que poseemos. Mantener un diwan de nuestras posesiones asegurará que siempre sepamos qué recursos tenemos a nuestra disposición."

 # Logothesion (λογοθέσιον) - a Byzantine fiscal bureau
 innovation_ledger_byzantine: "Logothesion"
 innovation_ledger_byzantine_desc: "A medida que crecen nuestras tierras, necesitamos una mejor manera de hacer un seguimiento de lo que poseemos. Mantener un logotipo de nuestras posesiones asegurará que siempre sepamos qué recursos tenemos a nuestra disposición."
 
 # Ilakkam (இலக்கம்) - the Tamil numeral tradition, representative of the wider Dravidian heritage
 innovation_hindu_numeral_system_dravidian: "Ilakkam"
 innovation_hindu_numeral_system_dravidian_desc: "Mucho antes de que los números del norte nos alcanzaran, nuestro propio ilakkam dio cada poder de diez su propia marca, dejando que nuestros escribas y comerciantes registren cualquier suma con facilidad."

 # Tsikhe (ციხე)
 innovation_motte_caucasian: "Tsikhe"
 innovation_motte_caucasian_desc: "Criado en cangrejo y colina a través de nuestras montañas, nuestro tsikhe nos da refugio y la tierra alta que nuestros enemigos no pueden tomar fácilmente."

 # Dzong (རྫོང་)
 innovation_motte_tibetan: "Dzong"
 innovation_motte_tibetan_desc: "Criado en las crestas y pases que protegen nuestros valles, nuestro dzong sirve como fortaleza, sede de autoridad y refugio de una vez, dándonos la tierra alta que nuestros enemigos no pueden tomar fácilmente."

 # Qionglong (邛笼) - native Qiang word for the stone watchtowers of the region
 innovation_motte_qiangic: "Qionglong"
 innovation_motte_qiangic_desc: "Historia edificada sobre la historia de piedra vestida, nuestro reloj qionglong sobre el campo y pasar por igual, dándonos refugio en la guerra y la tierra alta que nuestros enemigos no pueden tomar fácilmente."

 # Thanh (城/成)
 innovation_motte_viet: "Thanh"
 innovation_motte_viet_desc: "Anillados por murallas de barro y mofas por igual, nuestro bufón nos da refugio en la guerra y un asiento desde el cual gobernar nuestras tierras."

 # Linna
 innovation_motte_balto_finnic: "Linna"
 innovation_motte_balto_finnic_desc: "Anillo por tierra y palisades de madera, nuestro linnat vigilan el campo y la costa por igual, dándonos refugio en la guerra y un asiento desde el cual gobernar nuestras tierras."

 # Pilis
 innovation_motte_baltic: "Pilis"
 innovation_motte_baltic_desc: "Anillados por la tierra y palisades de madera, nuestros pilys están vigilando el campo y el bosque por igual, dándonos refugio en la guerra y un asiento desde el cual gobernar nuestras tierras."

 # Agadir (ⴰⴳⴰⴷⵉⵔ)
 innovation_motte_berber: "Agadir"
 innovation_motte_berber_desc: "Criado en los calambres por encima de nuestros pueblos, nuestros agadirs protegen nuestras tiendas y nuestros valiosos, refugiandonos tanto en la guerra como en la tierra alta que nuestros enemigos no pueden tomar fácilmente."

 # Kottai (கோட்டை)
 innovation_motte_dravidian: "Kottai"
 innovation_motte_dravidian_desc: "Criado en la cima de la colina y en el río, nuestros kottai nos dan refugio y la tierra alta desde la cual hasta la entrada y la administración de nuestras tierras."

 # Amba
 innovation_motte_east_african: "Amba"
 innovation_motte_east_african_desc: "Crecientes escalones por encima de las tierras bajas circundantes, nuestra necesidad de poco edificio para servir como refugio y fortaleza, dándonos la tierra alta que nuestros enemigos no pueden tomar fácilmente."

 # Stong Sde (སྟོང་སྡེ) - the Tibetan Empire's "thousand-district" levy units
 innovation_bannus_tibetan: "Stong Sde"
 innovation_bannus_tibetan_desc: "Divididos en el sde de púas, cada uno destinado a dotar y equipar a un cuerpo fijo de hombres, los hogares de nuestro reino dan a nuestros gobernantes una reclamación legal permanente sobre su servicio en la guerra."

 # Voi Chien
 innovation_elephantry_viet: "Voi Chien"
 innovation_elephantry_viet_desc: "Avanzado en batalla por nuestros comandantes desde los primeros días de la resistencia de nuestro pueblo a la dominación extranjera, el voi chien puede pisotear la infantería y llevar arqueros por encima de la fray."

 # Zhijia (紙甲) - Song-dynasty paper armor
 innovation_quilted_armor_chinese: "Zhijia"
 innovation_quilted_armor_chinese_desc: "Capido muchas docenas de hojas gruesas y presionadas duramente, nuestro zh Solucionesji proclama es más ligero que el correo todavía puede detener una flecha, y es una manera asequible para armar a todo un regimiento para la batalla."

 # Karez - the Turkic-language name for the qanat system (cf. Turpan karez)
 innovation_development_01_turkic: "Karez"
 innovation_development_01_turkic_desc: "Al túnelear canales suavemente inclinados bajo tierra para tocar en acuíferos en la base de las colinas, nuestro karez trae agua a granjas y asentamientos por igual sin que se evapore bajo el sol, dejando que nuestra gente prospere por generaciones venideras."

 # Eri (ஏரி)
 innovation_development_01_dravidian: "Eri"
 innovation_development_01_dravidian_desc: "Al recortar las corrientes y las lluvias en gran eri a través de nuestras tierras, podemos irrigar nuestros campos a través de los meses secos y dejar que nuestros asentamientos crezcan a tamaños más grandes, asegurando la prosperidad de nuestro pueblo para las generaciones venideras."

 # Kasu (காசு) - root of the English word "cash"
 innovation_currency_01_dravidian: "Kasu"
 innovation_currency_01_dravidian_desc: "Bartering es lento e ineficiente; el fundir nuestro cobre en kasu de peso fijo reforzará el comercio y aumentará la difusión de ideas dentro de nuestro reino."

 # Hwabaek (화백/和白)
 innovation_plenary_assemblies_korean: "Hwabaek"
 innovation_plenary_assemblies_korean_desc: "Para gobernar eficazmente, debemos convocar a los hwabaek y reunir a los nobles del reino para discutir y resolver asuntos legislativos por consentimiento unánime. La asistencia es obligatoria, y los que no vienen serán multados y perderán su capacidad de influir en cualquier decisión tomada."

 # Tajmaat
 innovation_plenary_assemblies_berber: "Tajmaat"
 innovation_plenary_assemblies_berber_desc: "Para gobernar eficazmente, debemos convocar el tajmaât y reunir a los hombres libres del reino para discutir y resolver asuntos legislativos. La asistencia es obligatoria, y los que no vienen serán multados y perderán su capacidad de influir en cualquier decisión tomada."

 # Seokseong (석성/石城)
 innovation_burhs_korean: "Seokseong"
 innovation_burhs_korean_desc: "Scattered across the countryside, seokseong replace our older landen walls with dress stone, giving us important fortified settlements we can use both to muster troops and to serve as administrative centers."

 # Teichos (τεῖχος)
 innovation_burhs_byzantine: "Teichos"
 innovation_burhs_byzantine_desc: "Atravesando el campo, nuestro teiche son importantes asentamientos fortificados que podemos utilizar tanto para las tropas más necesitadas como para servir como centros administrativos."

 # Hisn (حصن)
 innovation_burhs_arabic: "Hisn"
 innovation_burhs_arabic_desc: "Atravesados por el campo, nuestros husun son importantes asentamientos fortificados que podemos utilizar tanto para las tropas más necesitadas como para servir como centros administrativos."

 # Baru (بارو)
 innovation_burhs_iranian: "Baru"
 innovation_burhs_iranian_desc: "Atrapados por el campo, nuestras fortalezas cortadas son importantes asentamientos fortificados que podemos utilizar tanto para las tropas más necesitadas como para servir como centros administrativos."

 # Durga (दुर्ग)
 innovation_burhs_indo_aryan: "Durga"
 innovation_burhs_indo_aryan_desc: "Atravesados por el campo, nuestros durgas son importantes asentamientos fortificados que podemos utilizar tanto para las tropas más necesitadas como para servir como centros administrativos."

 # Korgan
 innovation_burhs_turkic: "Korgan"
 innovation_burhs_turkic_desc: "Scattered across the countryside, our korgans are important fortified strongholds we can use both to muster troops and to serve as administrative centers."

 # Burg - continental cognate of "Burh"
 innovation_burhs_carolingian: "Burg"
 innovation_burhs_carolingian_desc: "Atrapados por el campo, nuestros robos son importantes asentamientos fortificados que podemos utilizar tanto para las tropas más necesitadas como para servir como centros administrativos."

 # Borg - Old Norse, cf. Trelleborg, Aggersborg
 innovation_burhs_norse: "Borg"
 innovation_burhs_norse_desc: "Criado como grandes anillos de tierra y madera en la forma de las fortalezas de Harald, nuestros borgs son importantes asentamientos fortificados que podemos utilizar tanto para las tropas más fuertes como para servir como centros administrativos."

 # Guo (郭) - the outer wall in the classic "chengguo" inner/outer pairing
 innovation_battlements_chinese: "Guo"
 innovation_battlements_chinese_desc: "Más allá de fortificar sólo el propio cheng interior, elevar un guo exterior que puede ser manejado con seguridad por nuestros arqueros dará a nuestras ciudades una capa extra de protección contra los atacantes."

 # Kuruwa (郭/曲輪)
 innovation_battlements_japonic: "Kuruwa"
 innovation_battlements_japonic_desc: "Más allá de fortificar sólo el propio mantén, la colocación de recintos kuruwa que pueden ser manejados con seguridad por nuestros arqueros dará a nuestras fortalezas una capa extra de protección contra los atacantes."

 # Oeseong (외성/外城)
 innovation_battlements_korean: "Oeseong"
 innovation_battlements_korean_desc: "Más allá de fortificar sólo el interior se mantiene, levantando un oeseong que puede ser manejado con seguridad por nuestros arqueros dará a nuestras fortalezas una capa extra de protección contra los atacantes."

 # Peribolos (περίβολος)
 innovation_battlements_byzantine: "Peribolos"
 innovation_battlements_byzantine_desc: "Más allá de fortificar sólo la manténgase, criar un peribolos que puede ser manejado con seguridad por nuestros arqueros dará a nuestras fortalezas una capa extra de protección contra los atacantes."

 # Sur (سور)
 innovation_battlements_arabic: "Sur"
 innovation_battlements_arabic_desc: "Más allá de fortificar sólo la manténgase, criar un sur que puede ser manejado con seguridad por nuestros arqueros dará a nuestras fortalezas una capa extra de protección contra los atacantes."

 # Prakara (प्राकार) - shared Indo-Aryan/Dravidian architectural vocabulary
 innovation_battlements_indo_aryan: "Prakara"
 innovation_battlements_indo_aryan_desc: "Más allá de fortificar sólo la manténgase, criar un prakara que puede ser manejado con seguridad por nuestros arqueros dará a nuestras fortalezas una capa extra de protección contra los atacantes."

 # Housecarls
 innovation_house_soldiers_west_germanic: "Housecarls"
 innovation_house_soldiers_west_germanic_desc: "A medida que nuestras familias nobles crezcan en el poder, necesitan soldados para hacer cumplir su voluntad. Establecer un orden de autos dedicados asegurará que tengamos tropas mejor entrenadas y equipadas que un impuesto estándar."

 # Hetaireia (ἑταιρεία)
 innovation_house_soldiers_byzantine: "Hetaireia"
 innovation_house_soldiers_byzantine_desc: "A medida que nuestras familias nobles crezcan en el poder, necesitan soldados para hacer cumplir su voluntad. Establecer una hetaireia de soldados domésticos dedicados garantizará que tengamos tropas mejor entrenadas y equipadas que un impuesto estándar."

 # Yabing (牙兵)
 innovation_house_soldiers_chinese: "Yabing"
 innovation_house_soldiers_chinese_desc: "A medida que nuestras familias nobles crecen en el poder, necesitan soldados para hacer cumplir su voluntad. Establecer un cuerpo de yábîng leal a nosotros personalmente nos asegurará que tenemos tropas mejor entrenadas y equipadas que un impuesto estándar."

 # Roto (郎党)
 innovation_house_soldiers_japonic: "Roto"
 innovation_house_soldiers_japonic_desc: "A medida que nuestras familias nobles crezcan en el poder, necesitan soldados para hacer cumplir su voluntad. Reunir una banda personal de rōtō asegurará que tengamos tropas mejor entrenadas y equipadas que un levadura estándar."

 # Savaran (سواران)
 innovation_arched_saddle_iranian: "Savaran"
 innovation_arched_saddle_iranian_desc: "La caballería de luz es una fuerza con la que se debe tener en cuenta, pero no explotan realmente el potencial del caballo de guerra. Las sillas arqueadas nos permiten acampar guerreros salvajes, fuertemente blindados con lanzas sofisticadas, que aprovechan plenamente su impulso mientras cobran en líneas enemigas."

 # Kataphraktos (κατάφρακτος)
 innovation_arched_saddle_byzantine: "Kataphraktos"
 innovation_arched_saddle_byzantine_desc: "La caballería de la luz es una fuerza con la que se debe tener en cuenta, pero no explotan realmente el potencial del caballo de guerra. Las sillas arqueadas nos permiten acampar kataphraktoi, guerreros fuertemente armados con lanzas sofisticadas, que aprovechan plenamente su impulso mientras se cargan en líneas enemigas."
 
  # Shoen (荘園)
 innovation_manorialism_japonic: "Shoen"
 innovation_manorialism_japonic_desc: "Con la propiedad de la tierra consolidada bajo nuestra élite, muchos hombres y mujeres se encuentran incapaces de trabajar. Se establecerá un sistema shōen donde los hombres libres pueden trabajar nuestros campos a cambio de alquiler, mientras que aquellos que no pueden pagar pueden entrar en nuestro servicio como serfs consolidados."

 # Iqta (إقطاع)
 innovation_manorialism_arabic: "Iqta"
 innovation_manorialism_arabic_desc: "Con la propiedad de la tierra consolidada bajo nuestra élite, muchos hombres y mujeres se encuentran incapaces de trabajar. Concederemos iqta a nuestros funcionarios y soldados en lugar de salario, dejando que los hombres libres trabajen estas tierras a cambio de alquiler, mientras que aquellos que no pueden pagar pueden entrar en servicio como servidumbres atados en su lugar."

 # Zhuangyuan (庄园)
 innovation_manorialism_chinese: "Zhuangyuan"
 innovation_manorialism_chinese_desc: "Con la propiedad de la tierra consolidada bajo nuestra élite, muchos hombres y mujeres se encuentran incapaces de trabajar. Se establecerán propiedades de zhuāngyuán donde los hombres libres pueden trabajar nuestros campos a cambio de alquiler, mientras que aquellos que no pueden pagar pueden entrar en nuestro servicio como serfs consolidados."

 # Pronoia (πρόνοια)
 innovation_manorialism_byzantine: "Pronoia"
 innovation_manorialism_byzantine_desc: "Con la propiedad de la tierra consolidada bajo nuestra élite, muchos hombres y mujeres se encuentran incapaces de trabajar. Concederemos propiedades de pronoia a nuestros funcionarios y soldados, dejando que los hombres libres trabajen estas tierras a cambio de alquiler, mientras que aquellos que no pueden pagar pueden entrar en nuestro servicio como servidumbres consolidados."

 # Feiqian (飛錢) - "flying cash"
 innovation_currency_02_chinese: "Feiqian"
 innovation_currency_02_chinese_desc: "Las monedas no reguladas son difíciles de controlar y carecer de estabilidad. Los certificados Fēiqián, canjeables para moneda en oficinas de tesorería en todo el reino, dan nueva confianza a las transacciones comerciales mientras que los comerciantes desperdician la carga de transportar cadenas de efectivo de cobre."

 # Geonwon Jungbo (건원중보/乾元重寶) - Korea's first native coin, 996
 innovation_currency_02_korean: "Geonwon Jungbo"
 innovation_currency_02_korean_desc: "Las monedas no reguladas son difíciles de controlar y falta de estabilidad. Las monedas de geonwon jungbo minadas, medidas a pesos específicos y selladas con un sello real, dan nueva confianza a las transacciones comerciales."

 # Miliaresion (μιλιαρήσιον)
 innovation_currency_02_byzantine: "Miliaresion"
 innovation_currency_02_byzantine_desc: "Las monedas no reguladas son difíciles de controlar y falta de estabilidad. Miliaresia minada, medida a pesos específicos y sellada con un sello real, da nueva confianza a las transacciones comerciales."

 # Dirham (درهم)
 innovation_currency_02_arabic: "Dirham"
 innovation_currency_02_arabic_desc: "Las monedas no reguladas son difíciles de controlar y falta de estabilidad. Los dirhams mineros de plata, medidos a pesos específicos y sellados con un sello real, dan nueva confianza a las transacciones comerciales."

 # Qijuzhu (起居注)
 innovation_chronicle_writing_chinese: "Qijuzhu"
 innovation_chronicle_writing_chinese_desc: "No más se pasarán las historias de las hazañas de nuestra familia sólo a través de la tradición oral. Mantener un q Amenjūzhù, un diario de las actividades y decisiones diarias del gobernante, inspirará a las generaciones futuras, así como probar nuestras reivindicaciones sobre tierras que debemos tener con razón."

 # Chronographia (χρονογραφία)
 innovation_chronicle_writing_byzantine: "Chronographia"
 innovation_chronicle_writing_byzantine_desc: "No más las historias de las hazañas de nuestra familia serán pasadas a través de la tradición oral. Mantener una cronografía de todo lo que logramos inspirará a las generaciones futuras, así como probar nuestras reivindicaciones sobre tierras que debemos tener con razón."

 # Ta'rikh (تاريخ)
 innovation_chronicle_writing_arabic: "Ta'rikh"
 innovation_chronicle_writing_arabic_desc: "No más las historias de las hazañas de nuestra familia serán pasadas sólo a través de la tradición oral. Mantener un ta'rikh de todo lo que logramos inspirará a las generaciones futuras, así como probar nuestras reivindicaciones sobre las tierras que debemos tener con razón."

 # Kokushi (国史)
 innovation_chronicle_writing_japonic: "Kokushi"
 innovation_chronicle_writing_japonic_desc: "No más las historias de las hazañas de nuestra familia serán pasadas a través de la tradición oral. Mantener un kokushi de todo lo que logramos inspirará a las generaciones futuras, así como probar nuestras reivindicaciones sobre las tierras que debemos tener con razón."

 # Sagi (사기/史記)
 innovation_chronicle_writing_korean: "Sagi"
 innovation_chronicle_writing_korean_desc: "No más las historias de las hazañas de nuestra familia serán pasadas sólo a través de la tradición oral. Mantener un sagi de todo lo que conseguimos inspirará a las generaciones futuras, así como probar nuestras reivindicaciones sobre tierras que debemos tener con razón."

 # Hunyi (浑仪)
 innovation_armilary_sphere_chinese: "Hunyi"
 innovation_armilary_sphere_chinese_desc: "Compuesto por un marco esférico de anillos en movimiento, nuestro húnyí nos permite trazar y predecir el movimiento de los cielos. Mientras un fascinante dispositivo astrológico en su propio derecho, este conocimiento también ayudará a nuestros capitanes cuando navegan aguas lejos de la tierra."

 # Dhat al-Halaq (ذات الحلق)
 innovation_armilary_sphere_arabic: "Dhat al-Halaq"
 innovation_armilary_sphere_arabic_desc: "Compuesto por un marco esférico de anillos en movimiento, nuestro dhāt al-halaq nos permite trazar y predecir el movimiento de los cielos. Mientras que un fascinante dispositivo astrológico en su propio derecho, este conocimiento también ayudará a nuestros capitanes cuando navegan aguas lejos de la tierra."

 # Krites (κριτής) - split out from the Latin "Potestas" entry
 innovation_baliffs_byzantine: "Krites"
 innovation_baliffs_byzantine_desc: "Un gobernante no puede estar en todas partes a la vez. Al nombrar krites para hacer cumplir la ley del señor en todo el reino, podemos gobernar un área más grande de manera más efectiva de lo que podríamos de otra manera."

 # Xianling (县令)
 innovation_baliffs_chinese: "Xianling"
 innovation_baliffs_chinese_desc: "Un gobernante no puede estar en todas partes a la vez. Al nombrar xiànlìng para hacer cumplir la ley del señor en todo el reino, podemos gobernar un área más grande de manera más efectiva de lo que podríamos de otro modo."

 # Amil (عامل)
 innovation_baliffs_arabic: "Amil"
 innovation_baliffs_arabic_desc: "Un gobernante no puede estar en todas partes a la vez. Al designar amils para hacer cumplir la ley del señor en todo el reino, podemos gobernar un área más grande de manera más efectiva de lo que podríamos de otra manera."

 # Tudun
 innovation_baliffs_turkic: "Tudun"
 innovation_baliffs_turkic_desc: "Un gobernante no puede estar en todas partes a la vez. Al nombrar a los tuduns para hacer cumplir la ley del señor en todo el reino, podemos gobernar un área más grande de manera más efectiva de lo que podríamos de otro modo."

 # Posadnik (посадник)
 innovation_baliffs_slavic: "Posadnik"
 innovation_baliffs_slavic_desc: "Un gobernante no puede estar en todas partes a la vez. Al nombrar posadniks para hacer cumplir la ley del señor en todo el reino, podemos gobernar un área más grande de manera más efectiva de lo que podríamos de otra manera."

 # Autokrator (αὐτοκράτωρ)
 innovation_royal_prerogative_byzantine: "Autokrator"
 innovation_royal_prerogative_byzantine_desc: "Como nuestro autokrator tiene una carga mayor sobre ellos por su responsabilidad de gobernar el reino, así también se les otorgará privilegios reservados exclusivamente para ellos."

 # Zongfa (宗法)
 innovation_hereditary_rule_chinese: "Zongfa"
 innovation_hereditary_rule_chinese_desc: "Incluso dividiendo el reino entre todos los herederos elegibles fractura la unidad de nuestro pueblo. En lugar de romper nuestro reino bajo cada sucesión podemos asegurar que tenemos un corazón estable y próspero sosteniendo los principios de la vela zōngf."
 
 # Villa
 innovation_manorialism_latin: "Casa de campo"
 innovation_manorialism_latin_desc: "Con la propiedad de la tierra consolidada bajo nuestra élite, muchos hombres y mujeres se encuentran incapaces de trabajar. Vamos a establecer un sistema de villanos donde los hombres libres pueden trabajar nuestros campos a cambio de alquiler, mientras que aquellos que no pueden pagar pueden entrar en nuestro servicio como serfs consolidados."

 # Agrahara (अग्रहार/அக்ரகாரம்)
 innovation_manorialism_indo_aryan: "Agrahara"
 innovation_manorialism_indo_aryan_desc: "Con la propiedad de la tierra consolidada bajo nuestra élite, muchos hombres y mujeres se encuentran incapaces de trabajar. Concederemos a los agraharas a aquellos que favorezcamos, dejando que los hombres libres trabajen estas tierras a cambio de alquiler, mientras que aquellos que no pueden pagar pueden entrar en nuestro servicio como servidumbres atados en su lugar."

 # Denier - the Carolingian silver penny, 781 reform
 innovation_currency_02_carolingian: "Denier"
 innovation_currency_02_carolingian_desc: "Las monedas no reguladas son difíciles de controlar y falta de estabilidad. Deniers mineros, medidos a pesos específicos y sellados con un sello real, dan nueva confianza a las transacciones comerciales."

 # Srebrenik (сребреник) - Kievan Rus's first native coinage, c. 980s-1015
 innovation_currency_02_east_slavic: "Srebrenik"
 innovation_currency_02_east_slavic_desc: "Las monedas no reguladas son difíciles de controlar y falta de estabilidad. Los srebreniks mineros, medidos a pesos específicos y sellados con un sello real, dan nueva confianza a las transacciones comerciales."

 # Annales
 innovation_chronicle_writing_latin: "Annales"
 innovation_chronicle_writing_latin_desc: "No más las historias de las hazañas de nuestra familia serán pasadas a través de la tradición oral. Mantener las anales de todo lo que logramos inspirará a las generaciones futuras, así como probar nuestras reivindicaciones sobre tierras que debemos tener con razón."

 # Letopis (летопись)
 innovation_chronicle_writing_slavic: "Letopis"
 innovation_chronicle_writing_slavic_desc: "No más las historias de las hazañas de nuestra familia serán pasadas sólo a través de la tradición oral. Mantener una letopis de todo lo que logramos inspirará a las generaciones futuras, así como probar nuestras reivindicaciones sobre tierras que debemos tener con razón."

 # Bitig
 innovation_chronicle_writing_turkic: "Bitig"
 innovation_chronicle_writing_turkic_desc: "Ya no se pasarán las historias de las hazañas de nuestra familia sólo a través de la tradición oral. Llevar nuestro bitig en piedra y madera inspirará a las generaciones futuras, así como probar nuestras reivindicaciones sobre tierras que debemos tener con razón."

 # Gyalrab (རྒྱལ་རབས)
 innovation_chronicle_writing_tibetan: "Gyalrab"
 innovation_chronicle_writing_tibetan_desc: "No más las historias de las hazañas de nuestra familia serán pasadas sólo a través de la tradición oral. Mantener un giro de todo lo que logramos inspirará a las generaciones futuras, así como probar nuestras reivindicaciones sobre tierras que debemos tener con razón."

 # Khwaday-Namag
 innovation_chronicle_writing_iranian: "Khwaday-Namag"
 innovation_chronicle_writing_iranian_desc: "No más se pasarán las historias de las hazañas de nuestra familia sólo a través de la tradición oral. Mantener un khwadāy-nāmag, un libro de reyes, inspirará a las generaciones futuras, así como probar nuestras reivindicaciones sobre tierras que debemos tener con razón."

 # Qasbah (قصبة)
 innovation_burhs_berber: "Qasbah"
 innovation_burhs_berber_desc: "Atravesados por el campo, nuestras qasbahs son importantes asentamientos fortificados que podemos utilizar tanto para las tropas más necesitadas como para servir como centros administrativos."
 
 # Shenbi Nu (神臂弩) - the "Divine Arm Crossbow"
 innovation_advanced_bowmaking_chinese: "Shenbi Nu"
 innovation_advanced_bowmaking_chinese_desc: "Mientras que los arqueros han hecho y mantenido tradicionalmente sus propios arcos, los artesanos han comenzado a hacer nuevos tipos de arcos cruzados que son más fuertes y más complejos que antes. El shénbì n improvisar en particular puede perforar la armadura en rangos que ningún arco común puede coincidir, convirtiendo nuestros arqueros maestros en un activo militar invaluable."

 # Jinjun (禁军) - the Song dynasty's professional standing "Forbidden Army"
 innovation_men_at_arms_chinese: "Jinjun"
 innovation_men_at_arms_chinese_desc: "En lugar de depender sólo de los levies acolchados, mantendremos un jìnjūn permanente: soldados profesionales mantenidos bajo las armas y perforados durante todo el año, listos para marchar en un momento de aviso."

 # Bushi (武士)
 innovation_knighthood_japonic: "Bushi"
 innovation_knighthood_japonic_desc: "Al elevar a nuestros mejores luchadores al estatus de bushi y otorgarles tenencias de tierras en lugar de mera moneda, podemos darles el honor que merecen así como asegurar su lealtad a nosotros."

 # Faris (فارس)
 innovation_knighthood_arabic: "Faris"
 innovation_knighthood_arabic_desc: "Al elevar a nuestros mejores luchadores al estatus de faris y concederles tenencias de tierras en lugar de mera moneda, podemos darles el honor que merecen así como asegurar su lealtad a nosotros."
 
 # Mon (紋/家紋)
 innovation_heraldry_japonic: "Mon"
 innovation_heraldry_japonic_desc: "Estableciendo mon hereditario para identificar a nuestras familias nobles hará que sus miembros se vean como parte de un todo mayor, alentándolos a mejorar la reputación de su clan en lugar de estar simplemente obsesionados con el estatus personal."

 # Tamga
 innovation_heraldry_turko_mongolic: "Tamga"
 innovation_heraldry_turko_mongolic_desc: "Establecer tamga hereditaria para marcar nuestros nobles clanes hará que sus miembros se vean como parte de un todo mayor, alentándolos a mejorar la reputación de su clan en lugar de simplemente estar obsesionados con el estatus personal."

 # Lanchhana (लाञ्छन)
 innovation_heraldry_indo_aryan: "Lanchhana"
 innovation_heraldry_indo_aryan_desc: "Establecer lanchhana hereditaria para identificar a nuestras familias nobles hará que sus miembros se vean como parte de un todo mayor, alentándolos a mejorar la reputación de su dinastía en lugar de estar simplemente obsesionados con el estatus personal."

 # Rank (رنك)
 innovation_heraldry_arabic: "Rank"
 innovation_heraldry_arabic_desc: "Establecer dispositivos de rango hereditario para identificar a nuestras familias nobles hará que sus miembros se vean como parte de un todo mayor, alentándolos a mejorar la reputación de su dinastía en lugar de ser simplemente obsesionados con el estatus personal."

 # Eponymon (επώνυμον)
 innovation_heraldry_byzantine: "Eponymon"
 innovation_heraldry_byzantine_desc: "Establecer un eponímon fijo para identificar a nuestras familias nobles, en lugar de un simple patronímico, hará que sus miembros se vean como parte de un todo mayor, alentándolos a mejorar la reputación de su dinastía en lugar de estar simplemente obsesionados con el estatus personal."

 # Neshan (نشان)
 innovation_heraldry_iranian: "Neshan"
 innovation_heraldry_iranian_desc: "Establecer neshan hereditario para identificar a nuestras familias nobles hará que sus miembros se vean como parte de un todo mayor, alentándolos a mejorar la reputación de su dinastía en lugar de estar simplemente obsesionados con el estatus personal."

 # Shui Mo (水磨)
 innovation_windmills_chinese: "Shui Mo"
 innovation_windmills_chinese_desc: "El refinamiento de la shu Soluciones mó impulsada por el agua nos permite aprovechar el poder de fluir ríos mucho más eficientemente que antes, reduciendo enormemente el trabajo necesario para moler granos y procesar materias primas."

 # Asbad
 innovation_windmills_iranian: "Asbad"
 innovation_windmills_iranian_desc: "La construcción del asbad vertical nos permite aprovechar el poder del viento mucho más eficientemente que antes, reduciendo enormemente el trabajo necesario para moler granos y procesar materias primas."

 # Tianming (天命)
 innovation_divine_right_chinese: "Tianming"
 innovation_divine_right_chinese_desc: "Es hora de reconocer que es el tiānmìng, el mandato del cielo, el que ha puesto a nuestros gobernantes en sus tronos, y oponerse a ellos es oponerse al cielo mismo."

 # Khalifat Allah (خليفة الله)
 innovation_divine_right_arabic: "Khalifat Allah"
 innovation_divine_right_arabic_desc: "Es hora de reconocer a nuestro gobernante como khalīfat Allāh, el diputado de Dios sobre esta tierra, y oponerse a ellos es oponerse a la divinidad misma."

 # Devaraja
 innovation_divine_right_mon_khmer: "Devaraja"
 innovation_divine_right_mon_khmer_desc: "Es hora de reconocer a nuestro gobernante como devarāja, un dios-rey sobre esta tierra, y oponerse a ellos es oponerse a la divinidad misma."

 # Chakravartin (चक्रवर्तिन्)
 innovation_divine_right_indo_aryan: "Chakravartin"
 innovation_divine_right_indo_aryan_desc: "Es hora de que reconozcamos a nuestro gobernante como chakravartin, el monarca universal de giro de ruedas cuyo dominio legítimo se extiende sobre todas las tierras que él reclama, y oponerse a ellas es oponerse a la divinidad misma."

 # Tenno (天皇)
 innovation_divine_right_japonic: "Tenno"
 innovation_divine_right_japonic_desc: "Es hora de reconocer a nuestro tennō como un soberano celestial descendió de los dioses mismos, y oponerse a ellos es oponerse a la divinidad misma."

 # Mianyi Qian (免役钱)
 innovation_scutage_chinese: "Mianyi Qian"
 innovation_scutage_chinese_desc: "El servicio siempre ha sido esperado de nuestros súbditos, pero hay algunos que son incapaces o no están dispuestos a proporcionarlo. Al ofrecer una manera para que ellos cumplan con sus obligaciones con miЁnyì qián en lugar de trabajo o acero, podemos asegurarnos de que obtenemos nuestras cuotas de todos."

 # Hang (行)
 innovation_guilds_chinese: "Aguanta."
 innovation_guilds_chinese_desc: "A medida que nuestras tierras se expanden, se vuelve cada vez más ineficiente para gestionar directamente todo el comercio que pasa dentro de nuestro dominio. Concediendo cartas a háng, organizaciones de comerciantes y artesanos, podemos darles más autonomía sobre sus negocios, a la vez que garantizamos el beneficio de sus empresas."

 # Systemata (συστήματα)
 innovation_guilds_byzantine: "Systemata"
 innovation_guilds_byzantine_desc: "A medida que nuestras tierras se expanden, resulta cada vez más ineficiente para gestionar directamente todo el comercio que pasa dentro de nuestro dominio. Concediendo cartas a systēmata, organizaciones de comerciantes y artesanos, podemos darles más autonomía sobre sus negocios, a la vez que garantizamos el beneficio de sus empresas."

 # Shreni (श्रेणी)
 innovation_guilds_indo_aryan: "Shreni"
 innovation_guilds_indo_aryan_desc: "A medida que nuestras tierras se expanden, resulta cada vez más ineficiente para gestionar directamente todo el comercio que pasa dentro de nuestro dominio. Concediendo cartas a shrenis, organizaciones de comerciantes y artesanos con sus propias cortes y leyes, podemos darles más autonomía sobre sus negocios, a la vez que garantizamos que nos beneficiamos de sus empresas."

 # Ta'ifa (طائفة)
 innovation_guilds_arabic: "Ta'ifa"
 innovation_guilds_arabic_desc: "A medida que nuestras tierras se expanden, resulta cada vez más ineficiente para gestionar directamente todo el comercio que pasa dentro de nuestro dominio. Concediendo cartas a ta'ifas, organizaciones de comerciantes y artesanos, podemos darles más autonomía sobre sus negocios, a la vez que garantizamos el beneficio de sus empresas."

 # Za (座)
 innovation_guilds_japonic: "Za"
 innovation_guilds_japonic_desc: "A medida que nuestras tierras se expanden, se vuelve cada vez más ineficiente para gestionar directamente todo el comercio que pasa dentro de nuestro dominio. Concediendo za charters, organizaciones de comerciantes y artesanos, podemos darles más autonomía sobre sus negocios, a la vez que garantizamos el beneficio de sus empresas."

 # Hawala (حوالة)
 innovation_currency_03_arabic: "Hawala"
 innovation_currency_03_arabic_desc: "Particularmente grandes o costosos comercios a menudo requieren una cantidad inmutable de monedas pesadas. A través de la hawāla, transferir la propiedad de la riqueza en la confianza entre comerciantes sin mover las monedas físicas, grandes cantidades de bienes se pueden comerciar más fácilmente."

 # Jiaozi (交子)
 innovation_currency_03_chinese: "Jiaozi"
 innovation_currency_03_chinese_desc: "Particularmente grandes o costosos oficios a menudo requieren una cantidad inmutable de monedas pesadas. Issuing jiāoz Soluciones, certificados respaldados por y canjeables para moneda sostenida en tesorería segura, permitirá que grandes cantidades de bienes se comercialicen más fácilmente."

 # Trapeza (τράπεζα)
 innovation_currency_03_byzantine: "Trapeza"
 innovation_currency_03_byzantine_desc: "Particularmente grandes o costosos comercios a menudo requieren una cantidad inmutable de monedas pesadas. Depósito de que la riqueza en una trapeza y la transferencia de propiedad sin mover las monedas físicas permitirá que grandes cantidades de bienes se comercialicen más fácilmente."
 
 # Nokor
 innovation_knighthood_turko_mongolic: "Nokor"
 innovation_knighthood_turko_mongolic_desc: "Al elevar a nuestros mejores luchadores al estatus de nökör, compañeros jurados atados a nosotros por juramento personal en lugar de sangre, y otorgarles tenencias de tierras en lugar de mera moneda, podemos darles el honor que merecen, así como asegurar su lealtad a nosotros."

 # Rajput (राजपूत)
 innovation_knighthood_indo_aryan: "rajput"
 innovation_knighthood_indo_aryan_desc: "Al elevar a nuestros mejores combatientes al estatus de rajput y otorgarles tenencias de tierras en lugar de mera moneda, podemos darles el honor que merecen así como asegurar su lealtad a nosotros."

 # Druzhina (дружина)
 innovation_knighthood_slavic: "Druzhina"
 innovation_knighthood_slavic_desc: "Al elevar a nuestros mejores luchadores a nuestra druzhina y concederles tenencias de tierras en lugar de mera moneda, podemos darles el honor que merecen así como asegurar su lealtad a nosotros."

 # Musin (무신/武臣)
 innovation_knighthood_korean: "Musin"
 innovation_knighthood_korean_desc: "Al elevar a nuestros mejores combatientes al estatus de musin y concederles tenencias de tierras en lugar de mera moneda, podemos darles el honor que merecen así como asegurar su lealtad a nosotros."

 # Ahi (Ahilik)
 innovation_guilds_turkic: "Ahi"
 innovation_guilds_turkic_desc: "A medida que nuestras tierras se expanden, resulta cada vez más ineficiente para gestionar directamente todo el comercio que pasa dentro de nuestro dominio. Concediendo cartas a hermandad, organizaciones de comerciantes y artesanos, podemos darles más autonomía sobre sus negocios, a la vez que aseguramos que nos beneficiamos de sus empresas."
 
 # Huoyao (火药) - the original Chinese term for gunpowder
 innovation_gunpowder_chinese: "Huoyao"
 innovation_gunpowder_chinese_desc: "El desarrollo de hu Linayào ha creado nuevas razas de armas, y nuevos tipos de guerreros para utilizarlas. La puesta en marcha de estas potentes armas requiere cadenas de producción y suministro no llamadas en el pasado, pero el costo de estas obras se paga por sí mismo con el poder desbloqueado por esta nueva tecnología."

 # Junqijian (军器监) - the Directorate for Arms
 innovation_royal_armory_chinese: "Junqijian"
 innovation_royal_armory_chinese_desc: "A medida que aumenta el tamaño de nuestros ejércitos, debemos garantizar que todos y cada soldado estén debidamente armados y blindados. El establecimiento de un jūnqìjiàn para producir y albergar todo el equipo de nuestros ejércitos será un largo camino para satisfacer esta necesidad."

 # Shanwen Jia (山文甲) - "mountain-pattern armor"
 innovation_plate_armor_chinese: "Shanwen Jia"
 innovation_plate_armor_chinese_desc: "La forma definitiva de protección personal, un traje bien elaborado de shānwén jiγ entremezcla sus placas en un patrón de montaña inconfundible, dando una gama superior de movimiento en comparación con las armaduras anteriores, siendo todo menos impenetrable a las armas enemigas."

 # Klivanion (κλιβάνιον)
 innovation_plate_armor_byzantine: "Klivanion"
 innovation_plate_armor_byzantine_desc: "La forma definitiva de protección personal, un klivanion bien elaborado ha articulado articulaciones que le dan una gama superior de movimiento a las armaduras anteriores, mientras que siendo todo menos impenetrable a las armas enemigas."

 # Jawshan (جوشن)
 innovation_plate_armor_arabic: "Jawshan"
 innovation_plate_armor_arabic_desc: "La forma definitiva de protección personal, una mandíbula bien elaborada ha articulado articulaciones que le dan una gama superior de movimiento a armaduras anteriores, mientras que siendo todo menos impenetrable a las armas enemigas."
 
 # Mamluk (مملوك) - the slave-soldier corps that seized sovereign power in Egypt in 1250
 innovation_standing_armies_arabic: "Mamluk"
 innovation_standing_armies_arabic_desc: "Los levies militares nos proporcionan un gran número de soldados, sin embargo, no importa lo bien que tratemos de entrenar y equiparlos siempre serán inferiores a los soldados profesionales. El aumento de un cuerpo de mamíferos, soldados poseídos y entrenados de jóvenes para la guerra y nada más, asegurarán que los intereses de nuestro reino sean aplicados por los mejores combatientes alrededor."
 
 # Otchigin - the youngest son who inherits the family hearth/homeland
 innovation_primogeniture_turko_mongolic: "Otchigin"
 innovation_primogeniture_turko_mongolic_desc: "Un khanate, un heredero. Mientras que los hijos mayores de nuestro gobernante son enviados para tallar sus propios dominios de tierras no reclamadas, el otchigin permanece para heredar el propio corazón ancestral. Esta es la mejor manera de asegurarnos de mantener un reino estable que no se desgarra por crisis de sucesión."

 # Chakushi (嫡子)
 innovation_primogeniture_japonic: "Chakushi"
 innovation_primogeniture_japonic_desc: "Un reino, un heredero. Mientras que los niños más jóvenes de nuestro monarca pueden sentirse abandonados por ser negados una herencia, reconociendo sólo el chakushi es la mejor manera de asegurarnos de mantener un reino estable que no se desgarra por crisis de sucesión."

 # Muruwwah (مروءة)
 innovation_noblesse_oblige_arabic: "Muruwwah"
 innovation_noblesse_oblige_arabic_desc: "La nobleza es más que privilegios y derechos justos; también viene con muruwwah, una obligación de actuar con honor, generosidad y coraje. Claramente establecer lo que se espera de nuestra élite nos dará un ideal para aspirar y reunirnos mientras trabajamos para lograrlo."

 # Rajadharma (राजधर्म)
 innovation_noblesse_oblige_indo_aryan: "Rajadharma"
 innovation_noblesse_oblige_indo_aryan_desc: "La nobleza es más que privilegios y derechos justos; también viene con rajadharma, un deber sagrado para el reino y su pueblo. Claramente establecer lo que se espera de nuestra élite nos dará un ideal para aspirar y reunirnos mientras trabajamos para lograrlo."

 # Junzi (君子)
 innovation_noblesse_oblige_chinese: "Junzi"
 innovation_noblesse_oblige_chinese_desc: "La nobleza es más que privilegios y derechos justos; también viene con la obligación de convertirse en un junzi, una persona superior cuya conducta es apropiada y justa. Claramente establecer lo que se espera de nuestra élite nos dará un ideal para aspirar y reunirnos mientras trabajamos para lograrlo."

 # Kyuba no Michi (弓馬の道)
 innovation_noblesse_oblige_japonic: "Kyuba no Michi"
 innovation_noblesse_oblige_japonic_desc: "La nobleza es más que sólo privilegios y derechos; también viene con el kyūba no michi, el camino del arco y el caballo, una obligación de actuar de maneras que son apropiadas y justas. Claramente establecer lo que se espera de nuestra élite nos dará un ideal para aspirar y reunirnos mientras trabajamos para lograrlo."

 # Longpao (龙袍) - the imperial dragon robe
 innovation_ermine_cloaks_chinese: "Longpao"
 innovation_ermine_cloaks_chinese_desc: "Cualquiera puede reclamar un título, pero para ser un verdadero monarca debe inspirar asombro y majestad en sus súbditos. Nuestra nueva lóngpáo, túnicas que llevan el dragón reservado para nosotros solos, están seguros de lograrlo."

 # Porphyra (πορφύρα) - Tyrian purple
 innovation_ermine_cloaks_byzantine: "Porphyra"
 innovation_ermine_cloaks_byzantine_desc: "Cualquiera puede reclamar un título, pero para ser un verdadero monarca deben inspirar asombro y majestad en sus súbditos. Robes teñidos en porfira, la rara púrpura reservada para los nacidos del trono, están seguros de lograrlo."

 # Tiraz (طراز)
 innovation_ermine_cloaks_arabic: "Tiraz"
 innovation_ermine_cloaks_arabic_desc: "Cualquiera puede reclamar un título, pero para ser un verdadero monarca debe inspirar asombro y majestad en sus súbditos. Robes de tiraz, tejidos y bordados con nuestro propio nombre y títulos en nuestros talleres reales, están seguros de lograr sólo eso."

 # Keju (科举)
 innovation_court_officials_chinese: "Keju"
 innovation_court_officials_chinese_desc: "Nuestro reino se ha expandido hasta el punto en que incluso los nobles menores no pueden administrar todo de manera efectiva. La selección de los funcionarios de la corte y burócratas a través de los exámenes kēj competitivo para manejar las tareas más mundanas de la corte asegurará que las ruedas del gobierno continúen girando sin problemas."

 # Lixue (理学) - Neo-Confucianism, "Study of Principle"
 innovation_development_04_chinese: "Lixue"
 innovation_development_04_chinese_desc: "Los desarrollos en l Solucionesxué, filosofía y lógica han convertido nuestras ciudades en centros maravillosos de educación e innovación. Los enormes saltos tecnológicos y culturales que estamos haciendo han puesto hasta ahora un potencial sin precedentes dentro de nuestro alcance."

 # Palaiologan Renaissance
 innovation_development_04_byzantine: "Renacimiento de Palaiologan"
 innovation_development_04_byzantine_desc: "Los avances en ciencia, filosofía y lógica han convertido nuestras ciudades en maravillosos centros de educación e innovación. Los enormes saltos tecnológicos y culturales que estamos viendo ahora han puesto a nuestro alcance un potencial hasta ahora inimaginable."

 # Suftaja (سفتجة)
 innovation_currency_04_arabic: "Suftaja"
 innovation_currency_04_arabic_desc: "Una evolución de los sistemas bancarios anteriores, el suftaja permite a nuestros ciudadanos comerciar rápidamente y con seguridad bienes y servicios a través de grandes distancias sin que se sopese por la fuerte especulación."

 # Chao (钞)
 innovation_currency_04_chinese: "chao"
 innovation_currency_04_chinese_desc: "Una evolución de los sistemas bancarios anteriores, las notas de chāo estandarizadas permiten a nuestros ciudadanos comerciar rápidamente y con seguridad bienes y servicios a través de grandes distancias sin que se sopese por la fuerte especulación."
 
 # Sambyeolcho (삼별초/三別抄)
 innovation_standing_armies_korean: "Sambyeolcho"
 innovation_standing_armies_korean_desc: "Los levies militares nos proporcionan un gran número de soldados, sin embargo, no importa lo bien que tratemos de entrenar y equiparlos siempre serán inferiores a los soldados profesionales. El establecimiento de un sambyeolcho de soldados elite, de contrabando permanente, asegurará que los intereses de nuestro reino sean aplicados por los mejores combatientes alrededor."

 # Dar al-Silah (دار السلاح)
 innovation_royal_armory_arabic: "Dar al-Silah"
 innovation_royal_armory_arabic_desc: "A medida que aumenta el tamaño de nuestros ejércitos, debemos garantizar que todos y cada soldado estén debidamente armados y blindados. El establecimiento de un dar al-silah para producir y albergar todo el equipo de nuestros ejércitos irá un largo camino para satisfacer esta necesidad."

 # Khuyag
 innovation_plate_armor_turko_mongolic: "Khuyag"
 innovation_plate_armor_turko_mongolic_desc: "La forma definitiva de protección personal, un khuyag bien elaborado ha articulado articulaciones que le dan una gama superior de movimiento a las armaduras anteriores, mientras que siendo todo menos impenetrable a las armas enemigas."

 # Rajopachara (राजोपचार)
 innovation_ermine_cloaks_indo_aryan: "Rajopachara"
 innovation_ermine_cloaks_indo_aryan_desc: "Cualquiera puede reclamar un título, pero para ser un verdadero monarca deben inspirar asombro y majestad en sus súbditos. Nuestro rajopachara, la sagrada venganza que corresponde a un verdadero rey, está seguro de lograrlo."

 # Nasij
 innovation_ermine_cloaks_turko_mongolic: "Nasij"
 innovation_ermine_cloaks_turko_mongolic_desc: "Cualquiera puede reclamar un título, pero para ser un verdadero monarca deben inspirar el asombro y la majestad en sus súbditos. El vestido de nasij, hilo dorado reservado para la realeza sola, es seguro de lograr sólo eso."
 
 # Weisuo (卫所)
 innovation_periodic_musters_chinese: "Weisuo"
 innovation_periodic_musters_chinese_desc: "Al organizar nuestra soldadura hereditaria en las guarnición wèisu Amazon en todas las regiones del reino, siempre sabemos quién es apropiado para la guerra cuando los necesitamos."
 
 # Xinxue (心学)
 innovation_humanism_chinese: "Xinxue"
 innovation_humanism_chinese_desc: "Xīnxué se refiere a un enfoque en la conciencia humana innata y aboga por la libertad, la autonomía y el progreso humanos."

 # Zhuanzhi (专制)
 innovation_sovereignty_chinese: "Zhuanzhi"
 innovation_sovereignty_chinese_desc: "Zhuānzhì es la autoridad suprema e inmediata del trono. En esta era, los viejos oficios que una vez se interpusieron entre el gobernante y el reino han sido barridos a favor de una sola voluntad imperial incompleta."

 # Kanun (قانون)
 innovation_sovereignty_turkic: "Kanun"
 innovation_sovereignty_turkic_desc: "Kanun es la autoridad suprema dentro de un territorio, ley establecida por la propia mano del gobernante en lugar de costumbre sola. Como tal, el estado del gobernante cambia de primera entre iguales al legislador sobre todos."

 # Zemsky Sobor
 innovation_estate_assembly_east_slavic: "Zemsky Sobor"
 innovation_estate_assembly_east_slavic_desc: "Un sobor zemsky de los representantes de las fincas del reino, las divisiones de la sociedad en tiempos feudales formados por clérigos, nobleza y acompañantes, convocaron para propósitos de deliberación, legislación o tributación."

 # Sejm
 innovation_estate_assembly_west_slavic: "Sejm"
 innovation_estate_assembly_west_slavic_desc: "Un sejm de los representantes de las fincas del reino, las divisiones de la sociedad en tiempos feudales formados por clérigos, nobleza y comuneros, convocados para propósitos de deliberación, legislación o tributación."

 # Jiphyeonjeon (집현전)
 innovation_libraries_korean: "Jiphyeonjeon"
 innovation_libraries_korean_desc: "Mientras que los libros solían ser algo para sólo los monjes y los aprendices, el jiphyeonjeon reúne eruditos y sus obras recogidas bajo el patrocinio real para el mejoramiento del reino."

 # Cangshulou (藏书楼)
 innovation_libraries_chinese: "Cangshulou"
 innovation_libraries_chinese_desc: "Mientras que los libros solían ser algo para sólo los monjes y los aprendices, cada noble auto-respetuoso mantiene ahora su propia cángshūlóu, independientemente de si leen de ella o no."

 # Maktaba (مكتبة)
 innovation_libraries_arabic: "Maktaba"
 innovation_libraries_arabic_desc: "Mientras que los libros solían ser algo para sólo los monjes y los aprendices, cada noble auto-respetuoso ahora al menos posee una maktaba, independientemente de si leen de ella o no."
 innovation_RICE_enset: "Sistemas de Cultivo de Enset"
