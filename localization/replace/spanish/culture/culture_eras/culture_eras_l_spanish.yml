l_spanish:
 culture_era_tribal: "Antigüedad Tardía"
 culture_era_tribal_desc: "La Antigüedad Tardía es un periodo de transición entre la Antigüedad Clásica y la Edad Media (siglo III d.C. al siglo VIII d.C.). Muchas [cultures|E] y estados de todo el Viejo Mundo experimentan grandes y dinámicos cambios sociales y políticos. Los gobernantes con [tribal_government|E] sólo pueden hacer uso de las [innovations|E] de la Antigüedad Tardía."
 culture_era_early_medieval_desc: "La [early_medieval|E] ve la aparición de administradores profesionales y una serie de importantes [innovations|E], lo que permite a una [culture|E] salir de la Edad Media."
 culture_era_high_medieval_desc: "La [high_medieval|E] es una época de grandes avances tecnológicos y administrativos, que ve crecer las ciudades y el ascenso de la clase burguesa aun cuando la aristocracia reina suprema."
 culture_era_late_medieval_desc: "El [late_medieval|E] marca el cenit del mundo feudal. Burócratas, artesanos, mercaderes y prestamistas comienzan a usurpar el poder de las antiguas clases privilegiadas, a excepción de los propios monarcas.
 culture_group_silk_road: "Ruta de la Seda"
