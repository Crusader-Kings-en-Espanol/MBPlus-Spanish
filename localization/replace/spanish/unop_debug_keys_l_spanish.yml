unop_fix_the_great_steppe_decision:0 "#P Fijar el Gran Paso #!"
unop_fix_the_great_steppe_decision_desc:0 "Use esta decisión si ve algún problema con la situación de The Great Steppe como:\n$BULLET$Las estaciones de The Great Steppe no tienen ningún efecto en las provincias\n$BULLET$Usted no ve regiones en el modo Mapa de Situación\n$BULLET$La punta de la herramienta en la tarea de preparación de Oversee Stargazer está rota\n$BULLET$Ciertos casus nómadas belli no están disponibles\n\nEsta decisión sólo fija el tema para la actual sesión de juego. Úsalo una vez después de cada recarga hasta que el problema sea fijado de forma fiable por Paradox.\n\nDebido a la naturaleza de la cuestión, no es posible detectarla de forma fiable en un mod, por lo que esta decisión seguirá siendo mostrada incluso después de utilizarla y la cuestión está fijada."
unop_fix_the_great_steppe_decision_tooltip:0 "Las cuestiones con The Great Steppe se fijarán para la actual sesión de juego."
unop_fix_the_great_steppe_decision_confirm:0 "$unop_fix_the_great_steppe_decision$"

