#议定谥号
 death_shihao.001.title: "Decidir el título póstumo"
 death_shihao.001.desc: "¡Qué triste! El antiguo Emperador volverá al cielo, y el trono nacional lo continuaré yo. Para reflejar mi lealtad y piedad filial, la Corte Imperial redactará un título póstumo para el antiguo Emperador que resuma sus méritos y deméritos en vida."
 death_shihao.001.a: "XiaoMin, Modelo de Piedad Filial" #孝愍
 death_shihao.001.b: "Xiaoshang, Luto de piedad filial " #孝殇
 death_shihao.001.c: "Qin Ming Guang Xiao, Sabio y filial" #钦明广孝
 death_shihao.001.d: "Shengwen, santos y literatos" #圣文
 death_shihao.001.e: "Rui Sheng Zhi Cheng, Sabio y hombre honesto" #睿圣至诚
 death_shihao.001.f: "Rui Wen Xiao Wu, sabios literatos y militares filiales" #睿文孝武
 death_shihao.001.g: "Zhao Wen Xiao Duan, nobleza filial" #昭文孝端
 death_shihao.001.h: "Xiao Wen, la piedad filial y los literatos" #孝文
 death_shihao.001.i: "Shen Wu Xiao Wen, militarista como Dios y literato filial" #谥曰神武孝文
 death_shihao.001.j: "Jian Ping Xiao Jing, justicia frugal" #谥曰简平孝靖
 death_shihao.001.k: "Duan Wen Wen, Wu Jing Xiao"
 death_shihao.001.l: "Yu Wen Zhao Wu Xiao"
 death_shihao.001.m: "Da Sheng Da Hong Xiao, santo y promotor de la piedad filial" #谥曰天皇大圣大弘孝
 death_shihao.001.n: "Yi Sheng Jing Mu, Persona noble" #谥曰懿圣景穆
 death_shihao.001.o: "Sheng Zhe Ci Xiao, Santo de la bondad y la piedad filial" #谥曰圣哲慈孝
 death_shihao.001.p: "Xiao Si, piedad filial y pensador" #谥曰孝思
 death_shihao.001.q: "Santa moralidad, Gran crédito, civil y militar" #谥曰圣德神功文武
 death_shihao.001.r: "Xian Ci Xian Xiao, Modelo de bondad y piedad filial" # 谥曰宪慈显孝  
 death_shihao.001.s: "Kang Jing Xiao Gong, fuerte y piedad filial" #谥曰康靖孝恭
 death_shihao.001.t: "Zhao Ming Guang Xiao, Sabio del Sol" #谥曰昭明光孝
 death_shihao.001.u: "Zhao Xuan Guang Lie Xiao, fanático de la piedad filial" #谥曰昭宣光烈孝
 death_shihao.001.v: "Rui Wu Zhao Min Xiao, Un militarista filial y hombre sabio" #谥曰睿武昭愍孝
 death_shihao.001.w: "Xiao An, piedad filial y paz" #谥曰孝安
 death_shihao.001.x: "Xian min Gong Jian, Un hombre sabio y filialmente modesto" #谥曰献敏恭简
 death_shihao.001.y: "Xiao Duan, Filial y de buen comportamiento" #谥曰孝端
 death_shihao.001.z: "Sheng Ming An Xiao, Santo y buscador de la paz filial" #谥曰圣明安孝
 death_shihao.001.a1: "Zhao Wen Xiao Wu, tanto civil como militar" #谥曰昭文孝武
 death_shihao.001.b1: "Zhi De He Wu Qin Xiao, Modelo moral" #谥曰至德和武钦孝
 death_shihao.001.c1: "Xiao An Jing Zheng, Una persona respetuosa y recta" #谥曰孝安敬正
 death_shihao.001.d1: "Chong Sheng Si Xiao, piedad filial, Un joven monarca" #谥曰冲圣嗣孝
 death_shihao.001.e1: "Gong Wen Shun De Ren Xiao, Incompetente" #谥曰恭文顺德仁孝
 death_shihao.001.f1: "Wen Sheng, Wu Rui Zhe, Ming Xiao, Un santo misericordioso" #谥曰文圣武睿哲明孝
 death_shihao.001.g1: "Xuan Zhen Da Sheng Da Xing Xiao, santo gigante de la piedad filial" #谥曰玄真大圣大兴孝
 death_shihao.001.h1: "Hong Ren Da Xiao, Gran piedad filial" #谥曰洪仁大孝
 death_shihao.001.i1: "shaotianfa, antiguo Qinren, santo y piedad filial" #谥曰绍天法古钦仁圣孝
 death_shihao.001.j1: "Wen Wu Rui Zhe Gong De Da Cheng, Grandes logros en mérito y virtud" #谥曰文武睿哲功德大成
 death_shihao.001.k1: "Piedad filial y Zhuang Xian, filial y solemne" #谥曰孝和庄宪
 death_shihao.001.l1: "An'le, Paz y Alegría" #谥曰安乐
