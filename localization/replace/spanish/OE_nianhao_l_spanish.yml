 #####本地化
 nianhao.1.t: "Cambiar el Título del Año"
 nianhao.1.desc: "Año Título, el nombre de la Ortodoxia, la regla del Hijo del Cielo. El Emperador fue ordenado por el cielo para dar tiempo en nombre del cielo y establecer la secuencia temporal."
 change_nianhao_decision: "Cambiar la designación de un reinado imperial."
 change_nianhao_decision_desc: "Desde la primera vez que el Emperador Wu de la Dinastía Han usó el Título del año hasta tu dinastía imperial, cambiar el Título es la forma que tiene el Emperador de comunicarse con el cielo y la tierra. Un buen Título puede traer la paz y la prosperidad, y en tiempos de crisis nacional, el Título también dará la fuerza de la unidad pública."
 change_nianhao_decision_tooltip: "Obtener un nuevo Título del Año"
 change_nianhao_decision_confirm: "Título del Año cambiado ahora."
