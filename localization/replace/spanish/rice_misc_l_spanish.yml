 # Misc modifiers
 RICE_misc_myra_santa_claus:0 "Land of St. Nicholas"
 RICE_misc_myra_santa_claus_desc:0 "San Nicolás, famoso por su caridad, piedad y defensa de Nicea Ortodoxa, nació en Myra y posteriormente se convirtió en su obispo en el siglo IV CE. Una iglesia en Myra alberga la tumba del santo, y es venerado con frecuencia por la población local."
