 rule_RICE_yazidi_emergence:0 "RICE Yazidi Emergence"
 setting_RICE_yazidi_emergence_default:0 "Default"
 setting_RICE_yazidi_emergence_default_desc:0 "El Yazidi [faith|E] puede desovecer aleatoriamente medio siglo después del inicio del juego, pero es más probable que desobedezca después del siglo XII."
 setting_RICE_yazidi_emergence_historical:0 "#high Histórica#!"
 setting_RICE_yazidi_emergence_historical_desc:0 "El Yazidi [faith|E] puede desoverse aleatoriamente sólo después de mediados del siglo 12."
 setting_RICE_yazidi_emergence_unrestricted:0 "#high Unrestricted#!"
 setting_RICE_yazidi_emergence_unrestricted_desc:0 "El Yazidi [faith|E] puede desovearse en cualquier momento."
 rule_RICE_yarsani_emergence:0 "RICE Yarsani Emergence"
 setting_RICE_yarsani_emergence_default:0 "Default"
 setting_RICE_yarsani_emergence_default_desc:0 "El Yarsani [faith|E] puede desperdiciar aleatoriamente medio siglo después del inicio del juego, pero es más probable que despareciera después de mediados del siglo XIII."
 setting_RICE_yarsani_emergence_historical:0 "#high Histórica#!"
 setting_RICE_yarsani_emergence_historical_desc:0 "El Yarsani [faith|E] puede derivarse al azar sólo después de mediados del siglo XIV."
 setting_RICE_yarsani_emergence_unrestricted:0 "#high Unrestricted#!"
 setting_RICE_yarsani_emergence_unrestricted_desc:0 "El Yarsani [faith|E] puede desovearse en cualquier momento."
 rule_RICE_afro_roman_counties:0 "Presencia RICE $african_roman$"
 setting_RICE_afro_roman_counties_default:0 "Default"
 setting_RICE_afro_roman_counties_default_desc:0 "No hay $african_roman$ y $catholic_adj$ [counties|E] en el norte de África en fechas de inicio de vainilla. Otros mods añadiendo que anulen esto."
 setting_RICE_afro_roman_counties_reduced:0 "#high Semi-Realistic#!"
 setting_RICE_afro_roman_counties_reduced_desc:0 "Hay algunos $african_roman$ y $catholic_adj$ [counties|E] en el norte de África en fechas de inicio de vainilla en áreas donde sobrevivieron prominentemente. Otros mods añadiendo que anulen esto."
 setting_RICE_afro_roman_counties_extensive:0 "#high Exaggerated#!"
 setting_RICE_afro_roman_counties_extensive_desc:0 "Hay muchos $african_roman$ y $catholic_adj$ [counties|E] en el norte de África en fechas de inicio de vainilla, mucho más que su presencia real de vida."
 rule_RICE_easter_egg_characters:0 "Personajes de huevo de Pascua RICE"
 setting_RICE_easter_egg_characters_default:0 "Default"
 setting_RICE_easter_egg_characters_default_desc:0 "Los caracteres de huevo de Pascua añadidos por el mod RICE aparecen como normales al inicio del juego."
 setting_RICE_easter_egg_characters_removed:0 "#high Desactivada#!"
 setting_RICE_easter_egg_characters_removed_desc:0 "Los caracteres de huevo de Pascua añadidos por el mod RICE no aparecen en el juego al inicio del juego."
 rule_RICE_warning_events:0 "Advertencia RICE Eventos"
 setting_RICE_warning_events_default:0 "On"
 setting_RICE_warning_events_default_desc:0 "Los eventos te advierten sobre el orden de carga impropia, comportamiento extraño potencial en el juego, y más se activará en el inicio del juego si se detecta (es decir, no te va a hacer spam con él de otra manera)."
 setting_RICE_warning_events_removed:0 "#high Off#!"
 setting_RICE_warning_events_removed_desc:0 "Los eventos de advertencia no sucederán en el inicio del juego. #warning @warning_icon! Esto no es muy recomendable a menos que sepas lo que estás haciendo, ya que puedes perderte advertencias críticas sobre problemas de ruptura del juego! #!"
 rule_RICE_adventurers:0 "RICE Aventuras históricas"
 setting_RICE_adventurers_default:0 "On"
 setting_RICE_adventurers_default_desc:0 "[adventurers|E] añadido por RICE en cada fecha de inicio aparece como normal."
 setting_RICE_adventurers_disable_fictitious:0 "#high Desactivar #!"
 setting_RICE_adventurers_disable_fictitious_desc:0 "[adventurers|E] añadido por RICE en cada fecha de inicio que no son ni históricos ni legendarios, pero semi-plausibles, están deshabilitados después de la carga del juego, excepto cualquier controlado por los jugadores."
 setting_RICE_adventurers_disable_all:0 "#high Desactivar todo #!"
 setting_RICE_adventurers_disable_all_desc:0 "[adventurers|E] añadido por RICE en cada fecha de inicio están todos deshabilitados después de las cargas del juego, excepto cualquier controlado por los jugadores."
 rule_RICE_rus_emergence:0 "RICE Rus Emergence"
 setting_RICE_rus_emergence_default:0 "Default"
 setting_RICE_rus_emergence_default_desc:0 "En fechas de inicio anteriores, $russian$ [culture|E] se puede desove mediante [decision|E]. Otros mods $east_slavic_group$ la configuración de la cultura puede anular esto. #warning @warning_icon! ¡La configuración se aplica después del inicio del juego!#!"
 setting_RICE_rus_emergence_already:0 "#high Vanilla#!"
 setting_RICE_rus_emergence_already_desc:0 "En fechas de inicio anteriores, $russian$ [culture|E] existe al inicio del juego, como en vainilla. La configuración de la cultura $east_slavic_group$ de otros mods puede anular esto."
 setting_RICE_rus_emergence_partial:0 "#high Partial#!"
 setting_RICE_rus_emergence_partial_desc:0 "En fechas de inicio anteriores, $russian$ [culture|E] existe en el inicio del juego en algunos [counties|E], pero no todos. La configuración de cultura $east_slavic_group$ de otros mods puede anular esto. #warning @warning_icon! Setup se aplica después del inicio del juego! #!"
 setting_RICE_rus_emergence_override:0 "#high Override Otros Mods #!"
 setting_RICE_rus_emergence_override_desc:0 "En fechas de inicio anteriores, $russian$ [culture|E] se puede desove mediante [decision|E]Esto tratará de anular otros mods $east_slavic_group$ creación de cultura. #warning @warning_icon! ¡La configuración se aplica después del inicio del juego!#!"
 RICE_manichean_head_of_faith_name:0 "RICE Manichean Head of Faith"
 setting_RICE_manichean_head_of_faith_name_archegos:0 "Arquegos"
 setting_RICE_manichean_head_of_faith_name_archegos_desc:0 "El [head_of_faith|E] del [faith|E] Manichean se llama #V $RICE_manichean_religious_head_title_archegos$ #! ."
 setting_RICE_manichean_head_of_faith_name_yamag:0 "#high Yamag#!"
 setting_RICE_manichean_head_of_faith_name_yamag_desc:0 "El [head_of_faith|E] del [faith|E] Manichean se llama #V $RICE_manichean_religious_head_title_yamag$ #! como en vainilla."
 rule_RICE_struggle_greenland: "[RICE_greenland_struggle|E]"
 setting_RICE_struggle_greenland_toggle_on: "Enabled"
 setting_RICE_struggle_greenland_toggle_on_desc: "El [RICE_greenland_struggle|E] , un [struggle|E] en el Atlántico Norte, existirá o se puede activar dependiendo de la fecha de inicio."
 setting_RICE_struggle_greenland_toggle_off: "#high Desactivada#!"
 setting_RICE_struggle_greenland_toggle_off_desc: "El [RICE_greenland_struggle|E] no existirá en ninguna fecha de inicio, ni puede empezarse nunca. #warning @warning_icon! Esto no está soportado y puede causar problemas con [struggle|E] - contenido relacionado con #!"
 rule_RICE_struggle_normandy: "[RICE_normandy_struggle|E]"
 setting_RICE_struggle_normandy_toggle_on: "Enabled"
 setting_RICE_struggle_normandy_toggle_on_desc: "El [RICE_normandy_struggle|E] , un [struggle|E] en el [duchy|E] de Normandía, existirá o se puede activar dependiendo de la fecha de inicio."
 setting_RICE_struggle_normandy_toggle_off: "#high Desactivada#!"
 setting_RICE_struggle_normandy_toggle_off_desc: "El [RICE_normandy_struggle|E] no existirá en ninguna fecha de inicio, ni puede empezarse nunca. #warning @warning_icon! Esto no está soportado y puede causar problemas con [struggle|E] - contenido relacionado con #!"
 rule_RICE_struggle_sri_lanka: "[RICE_sri_lanka_struggle|E]"
 setting_RICE_struggle_sri_lanka_toggle_on: "Enabled"
 setting_RICE_struggle_sri_lanka_toggle_on_desc: "El [RICE_sri_lanka_struggle|E] , un [struggle|E] religioso en la isla de Sri Lanka, existirá o se activará dependiendo de la fecha de inicio."
 setting_RICE_struggle_sri_lanka_toggle_off: "#high Desactivada#!"
 setting_RICE_struggle_sri_lanka_toggle_off_desc: "El [RICE_sri_lanka_struggle|E] no existirá en ninguna fecha de inicio, ni puede empezarse nunca. #warning @warning_icon! Esto no está soportado y puede causar problemas con [struggle|E] - contenido relacionado con #!"
 rule_RICE_struggle_sicily: "[RICE_sicily_struggle|E]"
 setting_RICE_struggle_sicily_toggle_on: "Enabled"
 setting_RICE_struggle_sicily_toggle_on_desc: "El [RICE_sicily_struggle|E] , un [struggle|E] en el sur de Italia, existirá o se puede activar dependiendo de la fecha de inicio."
