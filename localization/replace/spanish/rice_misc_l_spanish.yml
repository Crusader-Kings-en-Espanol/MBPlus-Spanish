 RICE_bozo_bring_in_wangara: "Integrar a los Wangara en las Comunidades de [ROOT.Char.GetCulture.GetNameNoTooltip]"
 RICE_bozo_move_jenne_context_tooltip: "#emphasis Contexto Histórico:#! Jenne-Jeno ("Vieja Jenne"), el sitio original de Jenne, fue un importante centro urbano en el actual Mali, pero fue abandonado en algún momento del período medieval. Según la leyenda, esta mudanza ocurrió cuando los Soninke migraron a la región; intentaron establecer una ciudad cerca del sitio original asentado por los Bozo, pero se encontraron con varios desastres naturales. Solo pudieron fundar la ciudad después de que un oráculo les dijera que sacrificaran a una joven virgen enterrándola viva en los muros de la ciudad. La tumba de esta niña, conocida como Tapama Djenepo (es decir, "Tapama, la Mártir de Jenne"), aún se mantiene en la Jenne moderna."
 RICE_funded_irrigation_tank_small_desc: "Este personaje recientemente donó algunos fondos para trabajar con las élites locales e instituciones religiosas para construir depósitos de riego en su reino. Estos sistemas cuidadosamente diseñados de reservorios artificiales, que se encuentran por toda la India, juegan un papel importante en la vida comunitaria, ya que cosechan y preservan el agua de lluvia."
 RICE_india_land_grant_buddhism_option: "#Bold $buddhism_religion_adherent_plural$#!"
 RICE_india_land_grant_hinduism_option: "#Bold $hinduism_religion_adherent_plural$#!"
 RICE_india_land_grant_jainism_option: "#Bold $jainism_religion_adherent_plural$#!"
 RICE_iranian_sinicization: "Sinizarse como un Asiático Occidental"
 RICE_niger_delta_beadmakers_option_desc: "Las hermosas cuentas hechas de vidrio o coral son un verdadero signo de poder e influencia"
 RICE_niger_delta_bronze_casters_option_desc: "Los Fundidores de Bronce crean arte en bronce usando la técnica de fundición a la cera perdida"
 RICE_niger_delta_celebrate_new_yam_festival_context_tooltip: "#emphasis Contexto Histórico:#! Los Festivales del Nuevo Ñame son un tipo de evento anual en muchas sociedades africanas en la llamada 'Zona del Ñame' que se extiende por gran parte de las regiones boscosas y costeras de África Occidental, donde el ñame ha sido tradicionalmente el cultivo agrícola principal. Aunque los detalles del festival varían enormemente de una cultura a otra, pueden verse como un ritual festivo, social y religioso que marca el inicio de la cosecha de ñame y refuerza los lazos y tradiciones comunitarias."
 RICE_niger_delta_commission_art_from_craft_guilds: "Encargar una Obra de Arte a un Gremio de Artesanía"
 RICE_niger_delta_commission_art_from_craft_guilds_context_tooltip: "#emphasis Contexto Histórico:#! Las civilizaciones históricas de Nigeria son famosas por su arte, como el trabajo en bronce de Benín o las coronas de cuentas Yoruba, hasta el punto que a veces reciben un enfoque desproporcionado en las discusiones sobre estas culturas, incluso en la academia. Los artesanos que hicieron estas obras de arte estaban a menudo organizados en gremios formales vinculados a dinastías reales en esta región; esto aumentaba el prestigio real y el control sobre los recursos, mientras que permitía a los artesanos obtener mayor poder político e influencia."
 RICE_niger_delta_form_craft_guilds: "Organizar un Gremio de Artesanía Basado en Clanes"
 RICE_niger_delta_ife_effects: "\n\n#italic Los [rulers|E] del [county|E] de $c_ife$ pueden tomar la [decide|E] de organizar o encargar obras de arte del [niger_delta_craft_guilds|E] #bold Creador de Cuentas#! sin importar su [title_tier|E], incluso si su [culture|E] no tiene las [traditions|E] adecuadas.#!"
 RICE_niger_delta_ironsmiths_option_desc: "El hierro se usa para más que solo armas o herramientas - también puede usarse para arte"
 RICE_niger_delta_ivory_and_wood_carvers_option_desc: "El tallado de marfil y madera son dos habilidades estrechamente entrelazadas"
 RICE_niger_delta_kola_nut_interaction: "Juramento de Paz con Nueces de Kola"
 RICE_niger_delta_new_yam_festival_caught_eating_log: "[CHARACTER.GetShortUIName|U] fue atrapado comiendo ñames"
 RICE_niger_delta_new_yam_festival_caught_eating_log_title: "Atrapado Comiendo Ñames"
 RICE_niger_delta_partake_olojo_festival_context_tooltip: "#emphasis Contexto Histórico:#! El festival Olojo es uno de los festivales anuales más importantes celebrados en la ciudad nigeriana de Ife, o Ile-Ife. Tiene una serie de funciones religiosas, culturales y políticas, particularmente en relación con el gobernante tradicional de Ife, el llamado Ooni. Según la leyenda, el festival fue iniciado por el tercer Ooni, Ogun."
 RICE_niger_delta_request_beaded_crown: "Solicitar una Coronación por el Ọọ̀ni"
 RICE_reinforce_relations_silk_road_communities: "Reforzar Relaciones con las Comunidades de la Ruta de la Seda"
 RICE_silk_road_merchants_option: "Mercaderes de la Ruta de la Seda"
 RICE_socotra_collaborate_with_pirates_context_tooltip: "#emphasis Contexto Histórico:#! La línea entre un comerciante armado y un pirata a menudo era difusa. El simple saqueo a menudo no era un objetivo viable a largo plazo. Así, históricamente en muchas regiones marítimas como el Océano Índico, muchos élites trabajaban junto con piratas para obtener beneficios y debilitar a enemigos mutuos que eran competidores económicos."
 RICE_socotra_host_poetry_competition_context_tooltip: "#emphasis Contexto Histórico:#! Aunque la poesía es importante para muchas culturas, las tradiciones poéticas de los pueblos árabes del sur como los Socotrí difieren notablemente de sus primos árabes en otras partes de la península arábiga. En Socotra, frecuentemente se celebraban concursos para ver quién podía improvisar los mejores poemas basados en temas o temas proporcionados."
 RICE_socotra_host_poetry_contest_courtier_won_log: "[CHARACTER.GetShortUIName|U] ganó el concurso de poesía"
 RICE_socotra_host_poetry_contest_judge_intent_req: "Necesitas tener el [trait|E] [GetTrait('poet').GetName( GetNullCharacter )], o al menos #bold [EmptyScope.ScriptValue('decent_skill_rating')|0]#! en [diplomacy|E] o [learning|E]. Además, no puedes tener menos de #bold [EmptyScope.ScriptValue('mediocre_skill_rating')|0]#! en [diplomacy|E] ni [learning|E]."
 RICE_socotra_moon_sacrifice: "Celebrar el Sacrificio Lunar"
 RICE_south_ethiopia_fichee_advice_diplomacy_desc: "Como un líder importante, este personaje dio consejos a su clan y otros miembros de la comunidad que fueron considerados generalmente buenos durante un reciente festival Fichee-Chambalaalla que celebra el Año Nuevo. La comunidad, junto con este personaje, trabajarán duro para seguir estos consejos."
 RICE_special_guest_gimuwa: "Candidato Gimuwa"
 RICE_special_guest_gimuwa_desc: "Un $RICE_special_guest_gimuwa$ es el #bold cónyuge#! o #bold padre#! del sexo opuesto del propietario de ganado que se honra en una [GetActivityType( 'activity_RICE_south_ethiopia_cattle_counting_ceremony' ).GetName]. Ellos también son honrados en su propia ceremonia, el #italic Gimuwa#!. Su [opinion|E] del anfitrión se incrementará permanentemente, y al final de la [activity|E], obtendrán [prestige_i|E] [prestige|E] así como el [trait|E] [GetTrait('RICE_cattle_owner_spouse').GetName( GetNullCharacter )].\n\n#N Para calificar como $RICE_special_guest_gimuwa$, el invitado debe ser el cónyuge sin tierras o el padre del anfitrión del sexo opuesto, y tener al menos 30 años de edad.#!"
 RICE_sri_lanka_aspiration_vijayabahu_desc: "\n\n#bold [historical_aspiration_main_objectives|E]#!\n$EFFECT_LIST_BULLET$Ser el [king|E] de [GetTitleByKey('k_lanka').GetNameNoTier]\n$EFFECT_LIST_BULLET$Tomar la [decision|E] para $RICE_sri_lanka_polonnaruwa_capital$\n$EFFECT_LIST_BULLET$Permanecer budista\n\n#bold Recompensas#!\n$EFFECT_LIST_BULLET$Ganar @prestige_icon! #V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#! [prestige|E]\n$EFFECT_LIST_BULLET$Recibir #V 500#! [GetMaA('RICE_velakkara').GetName] [special_troops|E]\n$EFFECT_LIST_BULLET$Cada [county|E] en [GetGeographicalRegion('RICE_sri_lanka_alt_region').GetName] gana @development_icon! [development|E] #V [EmptyScope.ScriptValue('RICE_red_sea_al_umari_aspiration_dev_bonus')]#!\n\n#bold [historical_aspiration_bonus_objectives|E]#!\n$EFFECT_LIST_BULLET$Tomar la [decision|E] para $RICE_india_irrigation_tank_decision$ al menos una vez (Recompensa: @prestige_icon! #V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#! [prestige|E])\n$EFFECT_LIST_BULLET$Tomar la [decision|E] para $RICE_sri_lanka_support_monastery$ al menos una vez (Recompensa: @piety_icon! #V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#! [piety|E])"
 RICE_sri_lanka_book_burnings_buddhist: "Quema de Libros"
 RICE_sri_lanka_book_burnings_buddhist_desc: "Este gobernante recientemente ordenó que ciertos textos budistas encontrados en sus territorios sean confiscados por sus consejeros, y en algunos casos quemados. Ya sea correcto o incorrecto, creían que estos textos difundían ideas heréticas que malinterpretaron al Buda, alentaron interpretaciones incorrectas del Dharma y propagaron conflictos dentro de la Sangha."
 RICE_sri_lanka_choose_monastic_sect: "Alinear con un Monasterio de Sri Lanka"
 RICE_sri_lanka_choose_monastic_sect_context_tooltip: "#emphasis Contexto Histórico:#! Durante la antigüedad tardía y el período medieval, la comunidad monástica budista de Sri Lanka, la #italic Sangha#!, estaba dominada por tres monasterios y sectas: el Mahavihara, Abhayagiri y Jetavana. Estos tres competían por el patrocinio de los reyes y otros élites durante siglos, hasta que fueron unificados bajo el Mahavihara en 1165 como parte de las reformas religiosas apoyadas por el rey Parakramabahu I. Hasta qué punto esto fue realmente una victoria dramática para el Mahavihara, o una continuación más sutil de tendencias graduales, es debatible."
 RICE_sri_lanka_choose_monastic_sect_effect_tooltip_2: "Podrás acceder a [decisions|E] para apoyar tu [RICE_sri_lanka_monastery|E] elegido, y elevar su [RICE_sri_lanka_prominence|E], lo cual es importante si quieres resolver los conflictos dentro de la [RICE_sri_lanka_struggle|E]"
 RICE_sri_lanka_choose_monastic_sect_tooltip: "Elige apoyar oficialmente a uno de los tres principales [RICE_sri_lanka_monasteries|E] en [GetPlayer.Custom('RICE_sri_lanka_sangha_location')]."
 RICE_sri_lanka_defrock_heretics_buddhist: "Despojó de sus hábitos a los Herejes"
 RICE_sri_lanka_defrock_heretics_buddhist_desc: "Este gobernante recientemente ordenó que monjes corruptos y heréticos sean despojados de sus hábitos en sus territorios. Aquellos que fueron considerados como no cumpliendo con sus votos monásticos al participar en actos inmorales y alentar visiones erróneas debían tener sus posesiones confiscadas para que pudieran regresar a la vida laica o renovar sus votos monásticos bajo las autoridades monásticas aprobadas por este gobernante."
 RICE_sri_lanka_enshrine_relic_type: "Elegir el nuevo hogar de la reliquia"
 RICE_sri_lanka_pali_literature_basic: "Esta obra de literatura en Pali fue escrita por monjes o un monje de la orden [ROOT.Char.Custom('RICE_sri_lanka_patronized_monastery')]. Fue encargada por [ROOT.Char.GetTitledFirstName].\n\n"
 RICE_sri_lanka_persecute_monastery_buddhist: "Purificar la Sangha de Sri Lanka"
 RICE_sri_lanka_persecute_monastery_burn_books_option: "#Bold Quemar Libros#!"
 RICE_sri_lanka_persecute_monastery_defrock_heretics_option: "#Bold Despojar a los Herejes#!"
 RICE_sri_lanka_persecute_monastery_plunder_wealth_option: "#Bold Saquear Riquezas#!"
 RICE_sri_lanka_persecute_monastery_ransack_monasteries_option: "#Bold Saquear Monasterios#!"
 RICE_sri_lanka_persecute_monastery_seize_land_option: "#Bold Confiscar Tierras#!"
 RICE_sri_lanka_plunder_wealth_buddhist: "Saquearon la Riqueza de los Monasterios"
 RICE_sri_lanka_plunder_wealth_buddhist_desc: "Este gobernante recientemente ordenó que ciertos monasterios budistas en sus territorios entreguen algunos de sus objetos más preciados, como estatuas, escrituras, ornamentos y otros objetos de valor. Supuestamente, hicieron esto porque creían que estos monasterios eran demasiado codiciosos al acumular estos objetos, pero otros creen que este gobernante simplemente era codicioso, o en el mejor de los casos, quería debilitar a sus rivales políticos."
 RICE_sri_lanka_polonnaruwa_capital: "Trasladar la Capital a Polonnaruwa"
 RICE_sri_lanka_ramasetu_inspiration_desc: "Mientras peregrinaba a Ramasetu, el puente terrestre que conecta India y Sri Lanka, este personaje se inspiró en las historias del #italic Ramayana#! relacionadas con Ramasetu. En particular, se inspiraron en"
 RICE_sri_lanka_ransack_monasteries_buddhist: "Saquearon Monasterios Budistas"
 RICE_sri_lanka_ransack_monasteries_buddhist_desc: "Este gobernante recientemente ordenó que varios monasterios budistas en sus territorios sean completamente saqueados, destruidos y sus objetos de valor tomados. A pesar de ser nominalmente budista (al menos en el momento en que hicieron esto), está claro que este gobernante no se preocupa por el karma negativo que han acumulado, o, en el mejor de los casos, quería debilitar a los grupos monásticos dentro de la Sangha que consideraban inmorales y corruptos."
 RICE_sri_lanka_relic_batticaloa_option_desc: "La reliquia [county_modifier|E] se trasladará a [GetTitleByKey('c_batticaloa').GetNameNoTier]."
 RICE_sri_lanka_relic_dakhina_desa_option_desc: "La reliquia [county_modifier|E] se trasladará a [GetTitleByKey('c_dakhina_desa').GetNameNoTier]."
 RICE_sri_lanka_relic_jaffna_option_desc: "La reliquia [county_modifier|E] se trasladará a [GetTitleByKey('c_jaffna').GetNameNoTier]."
 RICE_sri_lanka_relic_kandy_option_desc: "La reliquia [county_modifier|E] se trasladará a [GetTitleByKey('c_kandy').GetNameNoTier]."
 RICE_sri_lanka_relic_kotte_option_desc: "La reliquia [county_modifier|E] se trasladará a [GetTitleByKey('c_kotte').GetNameNoTier]."
 RICE_sri_lanka_relic_phiti_option_desc: "La reliquia [county_modifier|E] se trasladará a [GetTitleByKey('c_phiti').GetNameNoTier]."
 RICE_sri_lanka_relic_rohana_option_desc: "La reliquia [county_modifier|E] se trasladará a [GetTitleByKey('c_rohana').GetNameNoTier]."
 RICE_sri_lanka_relic_trincomalee_option_desc: "La reliquia [county_modifier|E] se trasladará a [GetTitleByKey('c_trincomalee').GetNameNoTier]."
 RICE_sri_lanka_seize_land_buddhist: "Confiscaron Tierra Monástica"
 RICE_sri_lanka_seize_land_buddhist_desc: "Este gobernante recientemente ordenó la confiscación de algunas tierras pertenecientes a monasterios budistas en sus territorios. Algunos dicen que esto fue porque este gobernante sentía que estos monasterios se habían desviado del camino sagrado al tener que gestionar asuntos mundanos, pero otros dicen que esto se hizo por razones políticas o pura codicia."
 RICE_sri_lanka_struggle: "Sangha de Sri Lanka"
 RICE_sri_lanka_support_monastery: "Apoyar la Sangha de Sri Lanka"
 RICE_sri_lanka_support_monastery_almsgiving_option: "#Bold Donación de Limosnas#!"
 RICE_sri_lanka_support_monastery_ambalamas_option: "#Bold Ambalamas#!"
