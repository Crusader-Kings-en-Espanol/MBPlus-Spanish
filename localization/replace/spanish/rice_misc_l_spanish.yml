l_spanish:
 rule_RICE_intro_event:0 "Evento de introducción de RICE"
 setting_RICE_intro_event_on:0 "On"
 setting_RICE_intro_event_on_desc:0 "Un evento de introducción activará una vez cuando se carga en el juego, diciéndole la versión de RICE que está utilizando y sus características más nuevas. Ayuda a verificar si el mod está instalado correctamente y utilizando la versión más reciente."
 setting_RICE_intro_event_off:0 "Off"
 setting_RICE_intro_event_off_desc:0 "El evento de introducción se desactivará."
 RICEintro.0000.t:0 "RICE 1.18.1 "Saint Patrick""
 RICEintro.0000.desc:0 "RICE 1.18.1 ha sido instalado con éxito. Este evento sólo activa al comienzo del juego y puede ser deshabilitado a través de la regla del juego. Tenga en cuenta que algunas características agregadas en la última actualización requieren un nuevo juego. No dude en informar de errores o proporcionar comentarios sobre Steam Workshop, foros de PI, o mi discordia.\n\nRICE actualmente incluye #V #Bold 43#!#! Flavor Packs que abarcan varias culturas, religiones y regiones de todo el mundo. El paquete de sabor más nuevo es #V #Bold Mayo: Heather y Yew#!#!.\n\nEstos packs de sabor se centran en añadir nuevo sabor para [GetTitleByKey('c_mayo').GetNameNoTier] y el [RICE_culture.GetCollectiveNoun]."
 RICEintro.0000.a:0 "¡Suena bien!"
 RICEintro.0000.b:0 "Me gustaría una visión general de las nuevas adiciones para esta actualización."
 RICEintro.0000.c:0 "Por favor, deshabilita este mensaje para este ahorro en el futuro."
 RICEintro.0000.c.tooltip:0 "#EMP Tenga en cuenta que si elige esta opción, NO recibirá este mensaje para verificar actualizaciones exitosas en el futuro para este archivo guardado!#!"
 RICEintro_intro_tooltip:0 "#EMP La paz es mejor que una guerra exitosa. \n Un amigo es mejor que ale. \n El cambio es mejor que la destrucción. \n \n – Extractos de los Máximos del Rey Aldfrith de Northumbria, un Texto de Sabiduría Irlandesa medieval #!"
 RICEintro_TFE_warning_tooltip:0 "\n ---------------------------------------- \n \n #V #bold El águila fallecida #! #! ha sido detectado como funcionando. Si esto es cierto, por favor #bold asegúrate de que TFE es #underline debajo #! RICE en tu orden de carga mod #! antes de iniciar un nuevo juego."
 RICEintro_ROA_warning_tooltip:0 "\n -------------------------------------- \n \n #V #bold Rajas de Asia #! #! ha sido detectado como funcionando. Si esto es verdad, por favor #bold asegúrate de que ROA es #underline debajo #! RICE en tu pedido de carga mod #! antes de iniciar un nuevo juego."
 RICE_decision_pagan_requirement:0 "Sigue a un [faith|E] pagano"
 RICEintro.0010.t:0 "Flavor Pack Information"
 RICEintro.0010.desc:0 "¿Qué Flavor Pack te gustaría saber más sobre?"
 RICEintro.0010.next:0 "See more"
 RICEintro.0010.done:0 "No importa - Quiero ir al juego"
 RICEintro.0010.siwa:0 "Siwa: oasis del desierto occidental"
 RICEintro.0010.chios:0 "Chios: Isle of Mastic"
 RICEintro.info.a:0 "Suena bien, vamos a empezar a jugar el juego, entonces"
 RICEintro.info.b:0 "Por favor, llévame al menú para ver otro paquete de Flavor"
 RICEintro.0020.t:0 "Siwa: oasis del desierto occidental"
 RICEintro.0020.desc:0 "- Reconstruir el Oráculo de Amón y Templo de Hibis, y después buscar la guía del Oráculo o adorar las deidades locales del Desierto Occidental respectivamente\n- Visite la Fuente del Sol en Siwa para relajarse"
 RICEintro.0021.t:0 "Chios: Isle of Mastic"
 RICEintro.0021.desc:0 "- Asistir a la Mostra de Thymiana (una celebración carnaval celebrada cada primavera)\n- Construir Pueblos Masticos en Chios mediante la decisión de mejorar la economía local o la infraestructura\n- Erigir un monumento a Homero, cuya ciudad natal se dice estar en Chios\n- Aproveche el nuevo edificio de Industria Mastica en Chios"
 RICEintro.0010.siberia:0 "Siberia: Gente del Reindeer"
 RICEintro.0022.t:0 "Siberia: Gente del Reindeer"
 RICEintro.0022.desc:0 "- Los gobernantes turumicos pueden sacrificar a Reindeer para obtener una mayor comprensión sobre ellos mismos y el cosmos\n- Los gobernantes del norte pueden expandir las manadas de reno en el taiga\n- Grupo de Cultura Siberiana: Evenk, Nivkh, Yakut, Yeneisian, y los vagabundos de Yukaghir ocasionalmente desaparecieron en las cortes de los gobernantes del norte para enseñar a los cortesanos nuevas habilidades de supervivencia"

 # Game Rules
 rule_RICE_historical_context:0 "RICE Herramienta de contexto histórico"
 setting_RICE_historical_context_on:0 "On"
 setting_RICE_historical_context_on_desc:0 "Hay herramientas ocasionales para proporcionar contexto para varias características de RICE. Como a veces tomo libertades artísticas con la historia en aras del sabor y el juego, esto explica también esas situaciones."
 setting_RICE_historical_context_off:0 "#high Off#!"
 setting_RICE_historical_context_off_desc:0 "Las puntas de herramientas ocasionales que proporcionan contexto histórico sobre algunos aspectos de RICE no aparecerán. Esto es para los puristas de inmersión que encuentran estas herramientas puntas de ruptura de inmersión."
 rule_RICE_music:0 "Música RICE"
 setting_RICE_music_off:0 "#high Off#!"
 setting_RICE_music_off_desc:0 "Las pistas musicales agregadas por el mod RICE no jugarán."
 setting_RICE_music_default:0 "Default"
 setting_RICE_music_default_desc:0 "Las pistas musicales agregadas por el mod RICE sólo jugarán si juegas en la región apropiada, o juegas como la cultura o religión correctas."
 setting_RICE_music_unrestricted:0 "#high Unrestricted#!"
 setting_RICE_music_unrestricted_desc:0 "Las pistas musicales agregadas por el mod RICE jugarán independientemente de su región, cultura o religión."
 setting_RICE_music_no_vocal_music:0 "#high No Vocal Music #!"
 setting_RICE_music_no_vocal_music_desc:0 "La música con el canto será desactivada. La música ambiente y instrumental seguirá tocando."
 rule_RICE_new_characters:0 "Eventos de Sabor de inicio RICE"
 setting_RICE_new_characters_off:0 "#high Off#!"
 setting_RICE_new_characters_off_desc:0 "Los eventos de sabor de inicio de juego de RICE NO activarán, #emp excepto #! para aquellos con efectos de juego."
 setting_RICE_new_characters_default:0 "Default"
 setting_RICE_new_characters_default_desc:0 "RICE puede desencadenar eventos al inicio del juego dependiendo de la ubicación o el carácter para proporcionar información sobre la situación actual."
 rule_RICE_event_frequency:0 "Frecuencia de eventos RICE"
 setting_RICE_event_frequency_default:0 "Default"
 setting_RICE_event_frequency_default_desc:0 "Sabor genérico de RICE Los eventos disparan a la velocidad predeterminada."
 setting_RICE_event_frequency_high:0 "#high High#!"
 setting_RICE_event_frequency_high_desc:0 "Sabor genérico de RICE Los eventos desencadenan algo más frecuentemente. ADVERTENCIA: Debido a la forma en que funciona RNG, puede que todavía vea muchos eventos a la vez, o sin eventos por largos períodos de tiempo."
 setting_RICE_event_frequency_very_high:0 "#high Muy alta #!"
 setting_RICE_event_frequency_very_high_desc:0 "Sabor genérico de RICE Los eventos desencadenan mucho más frecuentemente. Esto puede causar spam del evento! ADVERTENCIA: Debido a la forma en que funciona RNG, usted puede todavía ver muchos eventos a la vez, o no eventos por largos tramos de tiempo."
 setting_RICE_event_frequency_low:0 "#high Low#!"
 setting_RICE_event_frequency_low_desc:0 "Sabor genérico de RICE Los eventos desencadenan un poco menos frecuentemente. ADVERTENCIA: Debido a la forma en que funciona RNG, puede que todavía vea muchos eventos a la vez, o sin eventos durante largos períodos de tiempo."
 setting_RICE_event_frequency_very_low:0 "#high Muy bajo #!"
 setting_RICE_event_frequency_very_low_desc:0 "Sabor genérico de RICE Los eventos desencadenan mucho menos con frecuencia. Usted puede rara vez ver eventos! ADVERTENCIA: Debido a la forma en que funciona RNG, usted puede todavía ver muchos eventos a la vez, o no eventos por largos tramos de tiempo."
 rule_RICE_courtier_spawn_frequency:0 "RICE Courtier Spawn Frequency"
 setting_RICE_courtier_spawn_frequency_default:0 "Default"
 setting_RICE_courtier_spawn_frequency_default_desc:0 "Los eventos cortesanos de RICE desencadenan a un ritmo predeterminado."
 setting_RICE_courtier_spawn_frequency_high:0 "#high High#!"
 setting_RICE_courtier_spawn_frequency_high_desc:0 "Los eventos cortesanos de RICE desencadenan un poco más frecuentemente."
 setting_RICE_courtier_spawn_frequency_very_high:0 "#high Muy alta #!"
 setting_RICE_courtier_spawn_frequency_very_high_desc:0 "Los eventos cortesanos de RICE desencadenan mucho más frecuentemente."
 setting_RICE_courtier_spawn_frequency_low:0 "#high Low#!"
 setting_RICE_courtier_spawn_frequency_low_desc:0 "Los eventos cortesanos de RICE desencadenan un poco menos frecuentemente."
 setting_RICE_courtier_spawn_frequency_very_low:0 "#high Muy bajo #!"
 setting_RICE_courtier_spawn_frequency_very_low_desc:0 "Los eventos cortesanos de RICE desencadenan con mucha menos frecuencia."
 rule_RICE_tuareg_emergence:0 "RICE Tuareg Emergence"
 setting_RICE_tuareg_emergence_default:0 "Default"
 setting_RICE_tuareg_emergence_default_desc:0 "Tuareg [culture|E] puede derivarse a través de [decision|E] en el $culture_era_high_medieval$ [era|E] y más tarde. Mods que añaden Tuaregs invalidan la implementación de RICE."
 setting_RICE_tuareg_emergence_already:0 "#high Exist en Game Start #!"
 setting_RICE_tuareg_emergence_already_desc:0 "Tuareg [culture|E] existe al inicio del juego. RICE anula la implementación de otros mods de Tuaregs para colocarlos en el mapa al inicio del juego según sea necesario."
 setting_RICE_tuareg_emergence_early:0 "#high Emergencia temprana #!"
 setting_RICE_tuareg_emergence_early_desc:0 "Tuareg [culture|E] puede desoverse a través de [decision|E] tan temprano como el $culture_era_early_medieval$ [era|E] . RICE anula otros Tuaregs de mods y los elimina del mapa al iniciar el juego según sea necesario."
 setting_RICE_tuareg_emergence_override:0 "#high Override Otros Mods #!"
 setting_RICE_tuareg_emergence_override_desc:0 "El Tuareg [culture|E] puede derivarse a través de [decision|E] en el $culture_era_high_medieval$ [era|E] y más tarde. RICE anula los Tuaregs de otros mods y los elimina del mapa al iniciar el juego según sea necesario."
