 activity_RICE_south_ethiopia_cattle_counting_ceremony: "Ceremonia de Conteo de Ganado"
 activity_RICE_south_ethiopia_cattle_counting_ceremony_context_tooltip: "#emphasis Contexto Histórico:#! Los Welayta, al igual que muchas culturas alrededor del mundo, valoran mucho el ganado. Esto se refleja en sus ceremonias de conteo de ganado, que son una manera importante para que los hombres Welayta se destaquen y ganen prestigio en la comunidad. Las ceremonias principales son #italic dala#!, para contar al menos cien cabezas de ganado, y la posterior #italic lika#!, para contar al menos mil cabezas de ganado. También están asociadas con la ceremonia #italic gimuwa#!, que se celebra en honor a la esposa o madre del candidato de #italic dala#! o #italic lika#!."
 activity_RICE_south_ethiopia_cattle_counting_ceremony_province_desc: ""
 activity_RICE_south_ethiopia_fichee_chambalaalla_festival: "Festival Fichee-Chambalaalla"
 activity_RICE_south_ethiopia_fichee_chambalaalla_festival_context_tooltip: "#emphasis Contexto Histórico:#! El año nuevo Sidama se llama Fichee-Chambalaalla. Su fecha es determinada por los Ayyaanto, los astrónomos tradicionales del pueblo Sidama. Según la leyenda, el festival se originó a partir de Ficho, una mujer que, después de casarse, visitaba anualmente a sus padres y vecinos, preparando un festín en su honor. Después de su muerte, sus vecinos nombraron la víspera del Año Nuevo como Fichee en su honor."
 activity_RICE_south_ethiopia_fichee_chambalaalla_festival_province_desc: ""
 activity_RICE_south_ethiopia_gifaataa_festival: "Festival Gifaataa"
 activity_RICE_south_ethiopia_gifaataa_festival_context_tooltip: "#emphasis Contexto Histórico:#! El año nuevo Welayta es conocido como Gifaataa. En tiempos modernos, es una celebración más secular y cultural. Un aspecto importante de la ocasión es la reconciliación: es un momento para enterrar el hacha de guerra y dejar de lado los conflictos con los demás."
 activity_RICE_south_ethiopia_gifaataa_festival_province_desc: ""
 activity_RICE_sri_lanka_ramasetu_pilgrimage: "Peregrinación a Ramasetu"
 activity_RICE_sri_lanka_ramasetu_pilgrimage_context_tooltip: "#emphasis Contexto Histórico:#! Ramasetu, conocido internacionalmente como el Puente de Adán, es hoy en día una serie de bancos de arena e islas frente a la costa noroeste de Sri Lanka. Históricamente, solía ser un puente terrestre, pero asumió su forma actual en 1480 después de algunas tormentas. A pesar de ello, el área ha estado asociada con un episodio en el antiguo épico sánscrito, el #italic Ramayana#!, cuando el dios Rama construyó un puente con la ayuda de monos para llegar a la isla de Lanka y rescatar a su esposa Sita del rey demonio Ravana. No obstante, ha sido un importante sitio religioso para diferentes creencias durante siglos."
 activity_RICE_sri_lanka_ramasetu_pilgrimage_host_desc: "$activity_RICE_local_pilgrimage_host_desc$\n$BULLET_WITH_TAB$ Posibilidad de ganar [character_modifiers|E] basados en tu [piety_level|E]"
 activity_RICE_sri_lanka_ramasetu_pilgrimage_province_desc: "Ramasetu está en el centro de la India."
 activity_RICE_sri_lanka_relic_veneration: "Veneración de Reliquias en $k_lanka$"
 activity_RICE_sri_lanka_relic_veneration_context_tooltip: "#emphasis Contexto Histórico:#! Sri Lanka alberga una serie de reliquias budistas, la más prominente es el diente Buda; controlar esta reliquia se consideraba incluso un tipo de derecho divino para los reyes de la isla. En tiempos modernos, la procesión del diente es probablemente el ritual y la celebración más famosa de Sri Lanka, pero su forma actual es relativamente reciente, habiendo sufrido muchos cambios a lo largo de los siglos. Irónicamente, durante el periodo del juego, el diente fue inicialmente despreciado por el Mahavihara que eventualmente se convirtió en el monasterio dominante en Sri Lanka, ya que estaba fuertemente asociado con sus rivales, el Abhayagiri, y el Mahavihara centró su veneración en otras reliquias, en particular el árbol Bodhi en Anuradhapura."
 activity_RICE_sri_lanka_relic_veneration_host_desc: "\n$BULLET_WITH_TAB$Pierde [stress_loss_i|E] [stress|E]\n$BULLET_WITH_TAB$Gana [piety_i|E] [piety|E]\n$BULLET_WITH_TAB$Gana [prestige_i|E] [prestige|E]\n$BULLET_WITH_TAB$Varios [character_modifiers|E] dependiendo de la reliquia\n$BULLET_WITH_TAB$Incremento en [RICE_sri_lanka_prominence|E] para los [RICE_sri_lanka_monasteries|E] de la isla, especialmente aquellos que patrocinas"
 activity_RICE_sri_lanka_sri_pada_pilgrimage: "Peregrinación a [GetPlayer.Custom('RICE_sri_pada')]"
 activity_RICE_sri_lanka_sri_pada_pilgrimage_context_tooltip: "#emphasis Contexto Histórico:#! Sri Pada (para budistas e hindúes) o Adam's Peak (para cristianos y musulmanes) es una notable montaña sagrada en el centro de Sri Lanka, conocida principalmente por la huella en forma de pie en la cumbre. Los budistas dicen que fue hecha por Buda y que él predicó aquí en algún momento. Los hindúes creen que la huella fue hecha por Shiva, mientras que los cristianos y musulmanes creen que fue hecha por Adán. A pesar de ello, la montaña ha sido un sitio de peregrinación durante siglos, y fue mencionada por viajeros famosos como Faxian, Marco Polo e Ibn Battuta, este último la escaló."
 activity_RICE_sri_lanka_sri_pada_pilgrimage_host_desc: "$activity_RICE_local_pilgrimage_host_desc$\n$BULLET_WITH_TAB$[modifier|E] dependiendo de tu [religion|E] o [religious_family|E]:\n$TAB$$BULLET_WITH_TAB$ Abrahamica: [GetModifier('RICE_sri_lanka_sri_pada_abrahamic_modifier').GetNameWithTooltip]\n$TAB$$BULLET_WITH_TAB$ Budista: [GetModifier('RICE_sri_lanka_sri_pada_buddhist_modifier').GetNameWithTooltip]\n$TAB$$BULLET_WITH_TAB$ Hindú: [GetModifier('RICE_sri_lanka_sri_pada_hindu_modifier').GetNameWithTooltip]\n$TAB$$BULLET_WITH_TAB$ Otras Orientales: [GetModifier('RICE_sri_lanka_sri_pada_other_eastern_modifier').GetNameWithTooltip]\n$TAB$$BULLET_WITH_TAB$ Otras No Orientales: [GetModifier('RICE_sri_lanka_sri_pada_pagan_modifier').GetNameWithTooltip]" 
 activity_RICE_sri_lanka_sri_pada_pilgrimage_province_desc: "[GetPlayer.Custom('RICE_sri_pada')] está en el centro de la India."
