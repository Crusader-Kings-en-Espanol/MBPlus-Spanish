 activity_RICE_local_pilgrimage:0 "Local Pilgrimage"
 activity_RICE_local_pilgrimage_desc:0 "El mundo está lleno de sitios sagrados locales. Estos lugares a menudo no son tan prominentes como un [faithpossessive|E] mayor [holy_sites|E] , y por lo tanto no son frecuentemente el objetivo de [pilgrimages|E] de larga distancia , pero todavía atraen devotos de la región circundante."
 activity_RICE_local_pilgrimage_selection_tooltip: "Vaya a un [local_pilgrimage|E] . \n \n $activity_RICE_local_pilgrimage_context_tooltip$"
 activity_RICE_local_pilgrimage_context_tooltip: "#emphasis Contexto histórico: #! Mientras que las peregrinaciones a menudo conjuran imágenes de grandes viajes a lugares religiosos conocidos como La Meca, Jerusalén, Santiago y Bodh Gaya, peregrinaciones a destinos locales, regionales fueron, y son, también comunes. Algunos de ellos han sido centros de adoración y veneración por tanto tiempo, o incluso más, que los lugares santos más famosos. A menudo están conectados con leyendas locales y cultura, y, a menudo, viajar a estos lugares era más práctico en la era pre-moderna cuando el viaje era difícil."
 activity_RICE_local_pilgrimage_host_desc: "\n$BULLET_WITH_TAB$Gain [piety_i|E][piety|E]\n$BULLET_WITH_TAB$Lose [stress_loss_i|E] [stress|E]\n$BULLET_WITH_TAB$[GetTrait('pilgrim').GetName( GetNullCharacter )] [trait|E] / [GetTrait('pilgrim').GetName( GetNullCharacter )] [trait_level_track_xp|E]" # \n$BULLET_WITH_TAB$Special #P beneficial#! [character_modifiers|E] depending on location\n$BULLET_WITH_TAB$ Bonuses are generally much less than a true [pilgrimage|E]
 activity_RICE_local_pilgrimage_guest_desc: "$activity_RICE_local_pilgrimage_host_desc$"
 activity_RICE_local_pilgrimage_province_desc: "la "
 activity_RICE_local_pilgrimage_destination_selection: "$activity_RICE_local_pilgrimage_province_desc$"
 activity_RICE_local_pilgrimage_guest_help_text: "$activity_RICE_local_pilgrimage$"
 activity_RICE_local_pilgrimage_predicted_cost: "El costo de un [local_pilgrimage|E] depende del [activity_options|E] que seleccione."
 activity_RICE_local_pilgrimage_conclusion_desc: "El [GetActivityType( 'activity_RICE_local_pilgrimage' ).GetName] ha llegado a su fin. ¡Fue una gran experiencia religiosa!"
 RICE_local_pilgrimage_type: "Tipo de visita"
 RICE_local_pilgrimage_type_devotion: "Act of Devotion"
 RICE_local_pilgrimage_type_devotion_desc: "\n$EFFECT_LIST_BULLET$Gain [piety_i|E] #V 100#! encima de otros [piety|E] ganancias\n$EFFECT_LIST_BULLET$Doble ganancia [trait_level_track_xp|E] para el [GetTrait('pilgrim').GetName( GetNullCharacter )] [trait|E] en comparación con otras opciones. [trait|E] Aún así, empezarás con algunos. [trait_level_track_xp|E] en lugar de ninguno.\n\n#weak Aunque no estamos necesariamente viajando a un sitio sagrado importante, todavía estamos en una peregrinación, y debemos tomar esto en serio.#!"
 RICE_local_pilgrimage_type_observance: "Observancia religiosa"
 RICE_local_pilgrimage_type_observance_desc: "\n$EFFECT_LIST_BULLET$Gain [prestige_i|E] #V 100#! encima de otros [prestige|E] ganancias\n$EFFECT_LIST_BULLET$Ganar el [GetModifier('RICE_misc_engaged_with_local_religious_practices').GetNameWithTooltip] [character_modifier|E]\n\n#weak Por honor [GetPlayer.GetFaith.PantheonTerm] según las costumbres locales, puedes mostrar tus temas que los entiendes y su forma de vida.#!"
 RICE_local_pilgrimage_type_vacation: "Vacaciones espirituales"
 RICE_local_pilgrimage_type_vacation_desc: "\n $EFFECT_LIST_BULLET$ Lose much more [stress_loss_i|E] [stress|E] comparó las otras opciones \n \n #weak Recuperar mental y físicamente es también un aspecto importante de cualquier experiencia religiosa a largo plazo, y permite acercarse a [GetPlayer.GetFaith.PantheonTerm] #!"
 RICE_local_pilgrimage_pilgrimage_phase: "$pilgrimage_phase_solo$"
 RICE_local_pilgrimage_pilgrimage_phase_desc: "$pilgrimage_phase_solo_desc$"
 RICE_local_pilgrimage_worship_intent_header: "Worship:"
 RICE_local_pilgrimage_worship_intent: "Worship"
 RICE_local_pilgrimage_worship_intent_desc: "Usted desea centrarse en los aspectos religiosos de este [local_pilgrimage|E]. Obtenga más [piety_i|E] [piety|E] en la parte superior de otras ganancias. Pérdese extra [stress_loss_i|E] [stress|E] si usted es [GetTrait('zealous').GetName( GetNullCharacter )] o [GetTrait('calm').GetName( GetNullCharacter )] ."
 RICE_local_pilgrimage_model_intent_header: "Modelo de papel:"
 RICE_local_pilgrimage_model_intent: "Modelo de función"
 RICE_local_pilgrimage_model_intent_desc: "Usted establecerá un ejemplo a todos los [GetPlayer.GetFaith.GetAdherentNamePlural] en la zona por ir en este [local_pilgrimage|E] . Obtenga más [prestige_i|E] [prestige|E] en la parte superior de otras ganancias. Pérdete extra [stress_loss_i|E] [stress|E] si eres [GetTrait('ambitious').GetName( GetNullCharacter )] o [GetTrait('diligent').GetName( GetNullCharacter )] ."
 RICE_local_pilgrimage_curiosity_intent_header: "Curiosity:"
 RICE_local_pilgrimage_curiosity_intent: "Curiosidad"
 RICE_local_pilgrimage_curiosity_intent_desc: "Usted quiere entender mejor a los habitantes locales, sus problemas, y cómo practican [GetPlayer.GetFaith.GetName] , mientras que va en este [local_pilgrimage|E] . Gane [experience|E] en su [lifestyle|E] . Pérdete extra [stress_loss_i|E] [stress|E] si eres [GetTrait('humble').GetName( GetNullCharacter )] o [GetTrait('just').GetName( GetNullCharacter )] ."
