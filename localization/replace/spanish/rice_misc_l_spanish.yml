 RICE_local_pilgrimage_votive_offering_type_small: "Ofertas Votivas Básicas"
 RICE_local_pilgrimage_votive_offering_type_small_desc: "$EFFECT_LIST_BULLET$ Base ganancia de [piety_i|E] #V 50 #! una vez terminado el [activity|E] . \n \n #weak Es una buena práctica dar a [GetPlayer.GetFaith.PantheonTerm] algún tipo de oferta una vez que uno llega al destino de su peregrinación. #!"
 RICE_local_pilgrimage_votive_offering_type_medium: "Ofertas de Gran Votivo"
