 RICE_local_pilgrimage_memorialization_type_medium: "Modest Insription"
 RICE_local_pilgrimage_memorialization_type_medium_desc: "$EFFECT_LIST_BULLET$Aumento de la base [prestige_i|E] #V 100#! después de la terminación de la [activity|E].\n$EFFECT_LIST_BULLET$Aumento de la base [dynasty_prestige_i|E] #V [GetPlayer.MakeScope.ScriptValue('miniscule_dynasty_prestige_gain')]#! [dynasty_prestige|E]\n\n#weak Para celebrar este viaje espiritual, una vez que esté completo, tendré una inscripción tallada cerca de casa.#!"
