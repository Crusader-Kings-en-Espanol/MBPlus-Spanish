 RICE_local_pilgrimage_type_performance: "Pious Performance"
 RICE_local_pilgrimage_type_performance_desc: "\n $EFFECT_LIST_BULLET$ Gain [legitimacy_i|E] [legitimacy|E] , la cantidad de la cual depende de lo que seleccione para la memoria #V #! [activity_option|E] \n \n #weak Esta peregrinación será una parte importante de su legado como un devolución, El gobernante [GetPlayer.GetFaith.GetAdjective]. #!"
