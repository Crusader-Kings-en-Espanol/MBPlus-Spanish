 activity_RICE_yazidi_bull_sacrifice: "Sacrificio del Toro a Mitra"
 activity_RICE_yazidi_bull_sacrifice_context_tooltip: "#emphasis Contexto Histórico:#! Se ha teorizado que los antiguos hablantes de iranio occidental en el noroeste de Irán, incluyendo los antepasados de los kurdos, seguían una religión relacionada pero distinta del zoroastrismo, la cual formó un sustrato religioso para el yazidismo, yarsanismo y otras sectas en esta región. Para complicar aún más el asunto, es posible que el zoroastrismo ortodoxo y las antiguas creencias iranias del noroeste coexistieran. De todos modos, una diferencia clave que tenía esta religión con el zoroastrismo ortodoxo era que el sacrificio primordial de un toro no era una acción malvada del ser maligno Ahriman, sino un acto positivo de creación por parte del dios Mitra. Estas ideas pueden haber influido en el Culto Romano de Mitra y haber sido un precursor del sacrificio de toros central en la Fiesta de la Asamblea, una importante celebración yazidí. Como tal, esta actividad, aunque algo ficticia, se basa en posibles tendencias y creencias entre los iranios del noroeste como los kurdos en la antigüedad y el período medieval temprano."
 activity_RICE_yazidi_bull_sacrifice_host_desc: "\n$BULLET_WITH_TAB$Cantidad aleatoria de [prestige|E] entre [prestige_i|E] #V 25#! y [prestige_i|E] #V 200#!\n$BULLET_WITH_TAB$Cantidad aleatoria de [piety|E] entre [piety_i|E] #V 25#! y [piety_i|E] #V 200#!\n$BULLET_WITH_TAB$#V [GetPlayer.MakeScope.ScriptValue('RICE_yazidi_bull_sacrifice_chance')]%#! posibilidad (basada en tu [piety_level|E]) de recibir un [character_modifier|E] #P positivo#! que mejore una de tus [skills|E]" 
 activity_RICE_yazidi_bull_sacrifice_province_desc: ""
 activity_RICE_yazidi_tawus_geran: "Tawûs Gêran"
 activity_RICE_yazidi_tawus_geran_context_tooltip: "#emphasis Contexto Histórico:#! Tawûs Gêran, el \"Paseo del Tawûs\", es una ceremonia yazidí que implica el desfile de un #italic sanjak#!, un estandarte de Melek Taus (el Ángel Pavo Real). #italic Qewals#!, que son artistas hereditarios de himnos religiosos yazidíes, llevarían así con ellos el #italic sanjak#! mientras viajan a diferentes pueblos yazidíes, siempre y cuando sea un tiempo de paz y cuando estén seguros de que los caminos son seguros. Es una oportunidad para que los yazidíes aprendan sobre sus creencias religiosas y demuestren su devoción religiosa. La descripción aquí se basa principalmente en un relato de primera mano del misionero inglés y erudito orientalista del siglo XIX, George Percy Badger."
 activity_RICE_yazidi_tawus_geran_host_desc: "\n$BULLET_WITH_TAB$Gana [piety_i] [piety|E]\n$BULLET_WITH_TAB$Gana [prestige_i|E][prestige|E]\n$BULLET_WITH_TAB$Aumenta [control_i|E] [control|E] del [county|E] donde se lleva a cabo esta [activity|E]\n$BULLET_WITH_TAB$Gana al menos #V [EmptyScope.ScriptValue('medium_lifestyle_xp')]#! [experience|E] en tu [lifestyle|E]" 
 activity_RICE_yazidi_tawus_geran_province_desc: ""
 activity_RICE_yazidi_tiwaf: "Festival de Tiwaf"
 activity_RICE_yazidi_tiwaf_context_tooltip: "#emphasis Contexto Histórico:#! Cada pueblo yazidí tiene un santuario dedicado a algún ser sagrado, y anualmente, se celebran festivales de tiwaf en estos santuarios para conmemorarlos. Además de su función religiosa, estas ocasiones festivas son importantes como una forma para que estos pueblos reafirmen su identidad y fortalezcan los lazos sociales, y es común que lleguen invitados de otros pueblos. Incluso cuando los yazidíes se establecen en otras tierras, ya sea por fuerza o por migración voluntaria, a menudo continúan celebrando el tiwaf de su pueblo original, para mantener vivas sus tradiciones ancestrales."
 activity_RICE_yazidi_tiwaf_host_desc: "\n$BULLET_WITH_TAB$Gana [piety_i] [piety|E]\n$BULLET_WITH_TAB$Gana [prestige_i|E][prestige|E]\n$BULLET_WITH_TAB$Pierde [stress_loss_i|E][stress|E]\n$BULLET_WITH_TAB$El [county|E] donde se lleva a cabo esta [activity|E] gana el [GetModifier('RICE_yazidi_tiwaf_religious_modifier').GetNameWithTooltip] o el [county_modifier|E] [GetModifier('RICE_yazidi_tiwaf_community_modifier').GetNameWithTooltip] dependiendo de tu [intent|E]" 
 activity_RICE_yazidi_tiwaf_province_desc: ""
 activity_RICE_yazidi_yarsani_jam: "Ceremonia Jam"
 activity_RICE_yazidi_yarsani_jam_context_tooltip: "#emphasis Contexto Histórico:#! La ceremonia Jam es un tipo de ceremonia religiosa practicada por los Yarsanis, un grupo etnoreligioso kurdo en Irak e Irán, así como por los Alevis, un grupo islámico heterodoxo en Turquía. Es una ceremonia altamente estructurada que tiene importantes funciones espirituales y sociales."
