 # Travel Options
 RICE_local_veneration_option:0 "Venerate at Local Shrines"
 RICE_local_veneration_option_desc:0 "Durante su viaje, usted puede viajar a través de lugares bendecidos por los santos locales [GetPlayer.GetFaith.GetReligion.GetAdjective] u otros santos divinos comienza, y es importante pagar sus respetos a ellos cada vez que los encuentre."
 RICE_local_veneration_option_effect_1:0 "Cada vez que entras en un [barony|E] que sigue a tu [religion|E]Hay un #V [GetPlayer.MakeScope.ScriptValue('RICE_local_veneration_option_bonus_chance')]%#! la oportunidad de ganar entre [piety_i|E] #V 1#! y [piety_i|E] #V [EmptyScope.ScriptValue('minor_piety_value')|0]#! dependiendo de tu [learning|E] y [piety_level|E]"
 RICE_local_veneration_option.toast.success:0 "Rezaste en un santuario [GetPlayer.GetFaith.GetReligion.GetAdjective] local"

 # Warning Events
 RICEintro.0030.t:0 "@warning_icon! Improper Load Order Detected"
 RICEintro.0030.desc:0 "Rajas de Asia y RICE han sido detectados como corriendo en su modlist actual pero con un orden de carga impropio.\n\nEste mensaje sólo aparece al comienzo del juego, por lo que no detectará ningún problema similar futuro. Tenga en cuenta también que el sistema de detección no es perfecto y puede estar mostrando una falsa alarma.\n\n#bold #warning @warning_icon! Asegúrese de que Rajas de Asia está cargado #underline después#! RICE en su orden de carga. También necesitará comenzar un nuevo juego.#!#!"
 RICEintro.0030.a:0 "Ok"
 RICEintro.0031.t:0 "@warning_icon! Improper Load Order Detected"
 RICEintro.0031.desc:0 "El Águila de Fallen y RICE han sido detectados como corriendo en su modlist actual pero con orden de carga inadecuada.\n\nEste mensaje sólo aparece al comienzo del juego, por lo que no detectará ningún problema similar futuro. Tenga en cuenta también que el sistema de detección no es perfecto y puede estar mostrando una falsa alarma.\n\n#bold #warning @warning_icon! Asegúrate de que el Águila Fallen esté cargado #underline después#! RICE en su orden de carga. También necesitará comenzar un nuevo juego.#!#!"
 RICEintro.0031.a:0 "Ok"
 RICEintro.0032.t:0 "@alert_icon! No Mother of All Achievement"
 RICEintro.0032.desc:0 "Este es un recordatorio amistoso de que las nuevas creencias paganas africanas de RICE, como las [ROOT.Char.GetFaith.GetReligion.GetAdjective] [faith|E], [ROOT.Char.GetFaith.GetName], lo haré #warning NO#! contar hacia el #bold Madre de todos nosotros#! sólo el logro pagano africano de Vanilla [faiths|E] Tenga en cuenta que otros mods pueden cambiar esto.\n\nEste mensaje no es una advertencia crítica, sino un recordatorio amistoso para prevenir la confusión futura."
 RICEintro.0032.a:0 "Ok"

