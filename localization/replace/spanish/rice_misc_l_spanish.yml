 RICE_tarim_basin_aspiration_al_kashgari_desc: "\n\n#bold [historical_aspiration_main_objectives|E]#!\n$EFFECT_LIST_BULLET$Tomar la [decision|E] para $RICE_tarim_basin_compile_the_turkic_dictionary$ y completar la cadena de eventos\n\n#bold Recompensas#!\n$EFFECT_LIST_BULLET$Ganar @prestige_icon! #V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#! [prestige|E]\n$EFFECT_LIST_BULLET$Ganar el [modifier|E] [GetModifier('RICE_tarim_basin_is_al_kashgari_upgrade').GetNameWithTooltip]\n\n#bold [historical_aspiration_bonus_objectives|E]#!\n$EFFECT_LIST_BULLET$Aprender al menos tres [languages|E] (Recompensa: Ganar #P 1#! [perk|E] en tu actual [lifestyle|E])\n$EFFECT_LIST_BULLET$Alcanzar $PRESTIGE_LEVEL_LABEL_3$ [prestige_level|E] (Recompensa: Ganar [diplomacy_i|E] #V 1#! y [learning_i|E] #V 1#!)"
 RICE_tarim_basin_aspiration_cao_yijin_desc: "\n\n#bold [historical_aspiration_main_objectives|E]#!\n$EFFECT_LIST_BULLET$[completely_control|E] [GetTitleByKey('d_guiyi').GetNameNoTier] y [GetTitleByKey('d_ganzhou').GetNameNoTier]\n$EFFECT_LIST_BULLET$Ser el [king|E] de [GetTitleByKey('k_guiyi').GetNameNoTier] o [GetTitleByKey('k_xia').GetNameNoTier]\n\n#bold Recompensas#!\n$EFFECT_LIST_BULLET$Ganar @prestige_icon! #V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#! [prestige|E]\n$EFFECT_LIST_BULLET$Recibir #V 1000#! [special_troops|E]\n\n#bold [historical_aspiration_bonus_objectives|E]#!\n$EFFECT_LIST_BULLET$Tomar la [decision|E] para $RICE_tarim_basin_patronize_a_mogao_cave$ (Recompensa: @piety_icon! #V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#! [piety|E])\n$EFFECT_LIST_BULLET$Tener una [alliance|E] con un [ruler|E] que sea de [rank|E] [king|E] o [emperor|E] (Recompensa: @dynasty_prestige_icon! #V [EmptyScope.ScriptValue('RICE_aspiration_medium_resource_bonus')]#! [dynasty_prestige|E])#!"
 RICE_tarim_basin_attend_ordam_mazar_festival: "Asistir al Festival Ordam"
 RICE_tarim_basin_attend_ordam_mazar_festival_context_tooltip: "#emphasis Contexto Histórico:#! #italic Mazars#! son tumbas de santos musulmanes, imanes, mártires y otras personas santas. En Asia Central, a menudo se celebran festivales en estas tumbas. El mayor de estos festivales en la Cuenca del Tarim es el Festival Ordam, que se celebra en el #italic mazar#! del mártir Ali Arslan Khan, un gobernante del Imperio Karakhanid. Las leyendas locales uigures cuentan sus hazañas heroicas en la larga guerra entre los Karakhanids musulmanes y el Reino budista de Khotan."
 RICE_tarim_basin_compile_the_turkic_dictionary: "Compilar el Primer Diccionario Túrcico"
 RICE_tarim_basin_construct_ordam_mazar: "Construir el Ordam Mazar"
 RICE_tarim_basin_dunhuang_economic_bonus_greater: "La Corte Tang Proporciona Asistencia Comercial"
 RICE_tarim_basin_dunhuang_military_bonus_greater: "La Corte Tang Proporciona Asistencia Militar"
 RICE_tarim_basin_dunhuang_political_bonus_greater: "La Corte Tang Proporciona Asistencia Política"
 RICE_tarim_basin_eight_protectors_blessing_1_desc: "Dicen que este personaje recibió las bendiciones de los [eight_protectors_of_khotan|E], después de participar en la procesión religiosa anual de la ciudad. Según la leyenda, Buda nombró a ocho deidades para proteger Khotan, asegurar su soberanía y defender las enseñanzas budistas. Estas ocho deidades son Aparajita, Samjnaya, Gaganasvara, Suvarnamala, Grhavatapta, Amgusa, Sthanavati y Vaisravana."
 RICE_tarim_basin_eight_protectors_blessing_2: "Bendiciones de los Ocho Protectores de Khotan"
 RICE_tarim_basin_gift_entertainers: "Presentar Hábiles Artistas de la Ruta de la Seda"
 RICE_tarim_basin_gift_kuchean_entertainers: "Presentar Hábiles Artistas Kucheanos"
 RICE_tarim_basin_gift_silk_road_bodyguards_1_desc: "Miembros de una comunidad local de origen extranjero a lo largo de la Ruta de la Seda, incluidos varios veteranos militares, han prometido recientemente sus servicios como leales guardaespaldas a este personaje."
 RICE_tarim_basin_gift_silk_road_deals_1_desc: "Este personaje recientemente concluyó un trato comercial con una comunidad local de origen extranjero a lo largo de la Ruta de la Seda."
 RICE_tarim_basin_gift_silk_road_ideas_1_desc: "Este personaje recientemente participó en un diálogo productivo con miembros eruditos y cultos de una comunidad local de origen extranjero de la Ruta de la Seda. Estos intelectuales finalmente ayudaron a inspirar algunas ideas para este personaje en varios aspectos de la vida."
 RICE_tarim_basin_gift_silk_road_infrastructure_1_desc: "Una comunidad local de origen extranjero a lo largo de la Ruta de la Seda ha reunido recursos para ayudar a las autoridades con varios proyectos para mejorar la infraestructura de la región."
 RICE_tarim_basin_gift_silk_road_intel_1_desc: "Este personaje tiene aliados en una comunidad local de origen extranjero, que recientemente usaron sus redes a lo largo de la Ruta de la Seda para proporcionar a este personaje información útil sobre varios complots y tramas que están ocurriendo actualmente."
 RICE_tarim_basin_gift_silk_road_medicine_1_desc: "Este personaje recibió recientemente un regalo de medicinas tradicionales de una comunidad local de origen extranjero de la Ruta de la Seda. Se supone que les ayudará a mejorar su salud y prevenir enfermedades no deseadas."
 RICE_tarim_basin_gift_silk_road_sea_travel_1_desc: "Miembros de una comunidad local de origen extranjero a lo largo de la Ruta Marítima de la Seda están asistiendo a este personaje para asegurar un viaje seguro y rápido por mar para aquellos que naveguen bajo su estandarte."
 RICE_tarim_basin_khotan_procession_context_tooltip: "#emphasis Contexto Histórico:#! En la época de esplendor de Khotan como centro del budismo, se celebraba una ceremonia procesional anual que duraba dos semanas en primavera, involucrando a toda la ciudad, desde los plebeyos hasta la familia real. Las imágenes sagradas budistas se colocaban en carruajes y se traían desde las afueras de la ciudad todos los días. La procesión de cada día era organizada por uno de los principales monasterios de Khotan; el Monasterio Gomati, el más importante de Khotan, tenía el privilegio de ir el primer día."
 RICE_tarim_basin_patronize_a_mogao_cave: "Patrocinar una Cueva Mogao"
 RICE_tarim_basin_reinhabit_gomati_monastery: "Reavivar el Monasterio Gomati"
 RICE_tarim_basin_silk_road_legacy_1_effect_1: "Desbloquea las [decisions|E] para Establecer una Oficina de Traducción y Patrocinar un Proyecto de Traducción Religiosa Importante"
 RICE_tarim_basin_silk_road_legacy_2_effect_1: "La [decision|E] de $RICE_reinforce_relations_silk_road_communities$ se puede tomar más de una vez en la vida"
 RICE_tarim_basin_silk_road_legacy_2_effect_2: "Desbloquea la [character_interaction|E] para Presentar [silk_road_entertainers|E] Hábiles a otros [rulers|E]"
 RICE_tarim_basin_silk_road_legacy_track_name: "Ruta de la Seda"
 RICE_tarim_basin_stage_animal_fight_context_tooltip: "#emphasis Contexto Histórico:#! Kucha fue uno de los estados-ciudad tocharios más ricos e influyentes, cuyas tradiciones de música, danza y otras festividades eran renombradas. Cada año nuevo, se organizaban peleas entre varios animales como ganado, caballos, cabras y camellos en Kucha. Los resultados se usaban para predecir futuras cosechas y la fertilidad de los rebaños."
 RICE_tarim_basin_took_me_as_a_plaything_likes_guy: "Juguete Involuntario"
 RICE_tarim_basin_visit_crescent_lake_context_tooltip: "#emphasis Contexto Histórico:#! Hay un lago a pocos kilómetros al sur de Dunhuang llamado #italic Yuèyá Quán#!, o Lago Crescente. Fue un sitio popular para el ocio desde la Dinastía Han; en un momento, estuvo rodeado de muchos templos y pabellones. Debido al uso excesivo de agua subterránea, el lago ha disminuido a un ritmo alarmante en las últimas décadas, aunque esto se ha mitigado en cierta medida por medidas de emergencia. Sin embargo, se deberán tomar medidas más serias si el lago quiere recuperar su antigua gloria."
