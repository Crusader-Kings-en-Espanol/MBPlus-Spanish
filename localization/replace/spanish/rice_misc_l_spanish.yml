 # RICEmisc.0010 in RICE_BAP_shared_misc
 RICEmisc.0011.t:0 "El viaje comienza"
 RICEmisc.0011.desc:0 "Es hora de comenzar el viaje a [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetName] para el [ROOT.Char.GetInvolvedActivity.GetShortName]. Estoy seguro de que el dolor de cabeza y la molestia de organizar este viaje valdrá la pena al final cuando lleguemos a nuestro destino... o al menos tendré que esperar que sea el caso, porque de lo contrario todo este estrés sobre la preparación para el viaje habría sido para nada."
 RICEmisc.0011.a:0 "Pasamos por estas molestias por una buena razón."
 RICEmisc.0012.t:0 "Las aguas termales de [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetName]"
 RICEmisc.0012.desc:0 "Acabamos de llegar a una de las fuentes termales locales en [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetName] . Aunque estas aguas termales no son particularmente famosas, en comparación con otras más populares, empapar las aguas cálidas es todavía bastante la experiencia agradable! \n \n"
 RICEmisc.0012.desc.private:0 "Siento que rara vez siento esto a gusto en mi vida diaria. Cierro los ojos y me relajo, ya que todas mis preocupaciones dejan mi mente, incluso si por un momento."
 RICEmisc.0012.desc.public:0 "Mientras aquí, también tomo tiempo para charlar con algunos de los lugareños, y conocer con algunos destacados notables de la zona. Es bueno socializar mientras se relaja así."
 RICEmisc.0012.desc.conclusion:0 "Es una pena que esta visita dure sólo tanto, así que intentaré aprovecharla mientras estoy aquí."
 RICEmisc.0012.a:0 "Me alegro de haber venido."
