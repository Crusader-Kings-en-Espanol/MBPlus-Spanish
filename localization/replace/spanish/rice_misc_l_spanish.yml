 # Game Concepts
 game_concept_hot_springs:0 "Aguas calientes"
 game_concept_hot_spring:0 "Hot Spring"
 game_concept_hot_springs_desc:0 "El [GetActivityType( 'activity_RICE_hot_springs_visit' ).GetName] es un tipo de [activity|E] disponible para muchos [rulers|E] como una forma de perder [stress|E] . Tiene dos [activity_options|E] : si la visita será un evento más público, de alto perfil, o un asunto privado y de bajo perfil. \n \n Hay unas cuantas fuentes #bold únicas #! encontradas en varios lugares alrededor del mapa, como la Fuente del Sol en Siwa. Si usted está en un [realm|E] con uno de estos lugares, usted puede ganar bonos adicionales como útil [character_modifiers|E] si usted decide a [travel|E] allí."
 game_concept_local_pilgrimage_short:0 "Peregrinación"
 game_concept_local_pilgrimages_short:0 "Peregrinaciones"
 game_concept_local_pilgrimage:0 "Local Pilgrimage"
 game_concept_local_pilgrimages:0 "Local Pilgrimages"
 game_concept_local_pilgrimage_desc:0 "$game_concept_local_pilgrimages$ son [activities|E] disponibles para [rulers|E] que gobiernan o viven cerca de ciertos lugares religiosos. Estas peregrinaciones son distintas de la [pilgrimages|E] más grande al [holy_sites|E] de la [faith|E], ya que son mucho más pequeñas en alcance e impacto. \n \n No todos tendrán acceso a peregrinaciones locales. Además, incluso si un [ruler|E] está en la ubicación correcta, una serie de peregrinaciones locales sólo estarán disponibles una vez que se tomen ciertos [decisions|E], o ocurren ciertos eventos. Las peregrinaciones locales a veces también están vinculadas a otros [decisions|E] especiales que pueden aumentar los beneficios que proporcionan, o la gama geográfica de personas que pueden ir a ellos. \n \n Independientemente, a pesar de proporcionar menos beneficios de lo normal [pilgrimages|E] , las peregrinaciones locales a menudo proporcionan beneficios únicos como [character_modifiers|E] especial dependiendo del destino específico. Además, son una buena manera de ganar [GetTrait('pilgrim').GetName( GetNullCharacter )] [trait_level_track_xp|E] , aunque a un ritmo más lento de lo normal [pilgrimages|E] , para prepararse para un [pilgrimage|E] grande."
 game_concept_RICE_aspiring:2 "Pretendiente"
 game_concept_RICE_aspires:2 "Inspira"
 game_concept_RICE_aspired:2 "Inspirado"
 game_concept_RICE_aspire:2 "Aspire"
 game_concept_RICE_aspiration:2 "Aspiración"
 game_concept_RICE_aspirations:2 "Aspiraciones"
 game_concept_historical_aspiration:2 "Aspiración histórica"
 game_concept_historical_aspirations:2 "Inspiraciones históricas"
 game_concept_historical_aspirations_desc:2 "$game_concept_historical_aspirations$ son misiones simples y opcionales disponibles para ciertos [characters|E] históricos al inicio del juego. A diferencia de los logros, estas aspiraciones otorgan varios bonos al finalizar, como [modifiers|E] o @dynasty_prestige_icon! [dynasty_prestige|E] . \n \n Las aspirinas generalmente reflejan las circunstancias históricas específicas y motivan al personaje, en lugar de grandes posibilidades o hipotéticas, y están destinadas a animar a los jugadores a jugar a los deseos y experiencias reales de ese personaje. \n \n Las aspirinas consisten en dos tipos de objetivos. [historical_aspiration_main_objectives|E] satisfecho para cumplir con la aspiración. [historical_aspiration_bonus_objectives|E] , por el contrario, no necesita estar satisfecho, pero haciendo así redes que extra bonos. Los objetivos pueden ser acciones directas, como tomar un [decision|E] , o pasiva, como seguir un [religion|E] . \n \n Es importante notar que la terminación de la aspiración se calcula en el #V que comienza #! del año, y no inmediatamente. En otras palabras, si cumples los objetivos al comienzo del año, entonces cumplirás la aspiración. Esto significa que puede tener un poco de tiempo de gracia para lograr objetivos de bonificación."
 game_concept_historical_aspiration_main_objective:2 "Objetivo principal"
 game_concept_historical_aspiration_main_objectives:2 "Objetivos principales"
 game_concept_historical_aspiration_main_objectives_desc:2 "$game_concept_historical_aspiration_main_objectives$ son requisitos que un personaje histórico necesita para cumplir con su [historical_aspiration|E], para aquellos que tienen uno. Ellos difieren de [historical_aspiration_bonus_objectives|E] , que son opcionales. \n \n Una vez cumplido el Objetivo Principal o los Objetivos, el personaje recibirá las recompensas pertinentes, incluyendo las de cualquier [historical_aspiration_bonus_objectives|E] que lograron cumplir."
 game_concept_historical_aspiration_bonus_objective:2 "Objetivo de bonificación"
 game_concept_historical_aspiration_bonus_objectives:2 "Objetivos de bonificación"
 game_concept_historical_aspiration_bonus_objectives_desc:2 "$game_concept_historical_aspiration_bonus_objectives$ son objetivos adicionales, opcionales que un personaje histórico puede tratar de lograr al cumplir su [historical_aspiration|E], para aquellos que tienen uno. En contraste con [historical_aspiration_main_objectives|E] , no son necesarios, pero están allí para proporcionar más recompensas si usted los busca. \n \n Sin embargo, [historical_aspiration_bonus_objectives|E] debe cumplirse cuando el [historical_aspiration_main_objectives|E] se logra para obtener las recompensas de bonificación. Si se encuentran después, el personaje no recibirá tales recompensas."
 game_concept_historical_aspiration_routes:2 "Rutas"
 game_concept_historical_aspiration_route:2 "Ruta"
 game_concept_historical_aspiration_route_desc:2 "Algunos [historical_aspirations|E] tienen diferentes $game_concept_historical_aspiration_routes$ . Esto significa que hay por lo menos dos juegos diferentes de [historical_aspiration_main_objectives|E] que se pueden cumplir, que son mutuamente excluyentes. Es decir, sólo se puede lograr uno, pero no el otro."

