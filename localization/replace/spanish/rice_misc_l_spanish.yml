 RICE_sri_lanka_support_monastery_pali_literature_option: "#Bold Literatura Pali#!"
 RICE_sri_lanka_support_monastery_parivena_schools_option: "#Bold Escuelas Pariveṇa#!"
 RICE_sri_lanka_support_monastery_ritual_deposits_option: "#Bold Depósitos Rituales#!"
 RICE_sri_lanka_support_monastery_senior_guides_option: "#Bold Guías Senior#!"
 RICE_sri_lanka_worship_local_deities_kataragama_option_desc: "El poderoso dios de la guerra que disipa a los enemigos"
 RICE_sri_lanka_worship_local_deities_natha_option_desc: "El dios en los cielos que desea salvar a todos"
 RICE_sri_lanka_worship_local_deities_pattini_option_desc: "La diosa sanadora que defiende a los débiles"
 RICE_sri_lanka_worship_local_deities_saman_option_desc: "El dios que habita en la montaña sagrada Sri Pada"
 RICE_sri_lanka_worship_local_deities_upulvan_option_desc: "El dios azul que protege $k_lanka$"
