 # Generic Activities
 activity_RICE_hot_springs_visit_host_an_a:0 "$host_activity_a$"
 activity_RICE_hot_springs_visit:0 "Visita de Hot Springs"
 activity_RICE_hot_springs_visit_desc:0 "Hay muchos notables [hot_springs|E] en este mundo, y soy lo suficientemente afortunado para vivir cerca de uno. Debo visitarlo para destrezar y tomar mi mente de las preocupaciones de la vida cotidiana."
 activity_RICE_hot_springs_visit_selection_tooltip: "Relájate en un [hot_springs|E] local. \n \n $activity_RICE_hot_springs_visit_context_tooltip$"
 activity_RICE_hot_springs_visit_context_tooltip: "#emphasis Contexto histórico: #! Los manantiales calientes suelen tener orígenes geotérmicos, como por actividad volcánica. Han sido utilizados por humanos durante miles de años, y muchos manantiales calientes se creen tradicionalmente que tienen propiedades curativas o terapéuticas."
 activity_RICE_hot_springs_visit_host_desc: "\n $BULLET_WITH_TAB$ Lose [stress_loss_i|E] [stress|E] \n $BULLET_WITH_TAB$ Otros beneficios posibles dependiendo de la ubicación"
 activity_RICE_hot_springs_visit_guest_desc: "$activity_RICE_hot_springs_visit_host_desc$"
 activity_RICE_hot_springs_visit_province_desc: "\n #N - El [hot_springs|E] aquí no son tan conocidos, pero todavía debe ser suficiente como un lugar para la relajación. #! \n #weak Esto llevará a menos [stress_loss_i|E] [stress|E] pérdida, y sin primas especiales, en comparación con [hot_springs|E] más conocido."
 activity_RICE_hot_springs_visit_destination_selection: "la "
 activity_RICE_hot_springs_visit_guest_help_text: "$activity_RICE_hot_springs_visit$"
 activity_RICE_hot_springs_visit_predicted_cost: "El costo de visitar un [hot_springs|E] depende del [activity_options|E] que seleccione."
 activity_RICE_hot_springs_visit_conclusion_desc: "El [GetActivityType( 'activity_RICE_hot_springs_visit' ).GetName] ha terminado. ¡Fue una experiencia divertida y relajante!"
 RICE_hot_springs_visit_type: "Tipo de visita"
 RICE_hot_springs_visit_type_public: "Public"
 RICE_hot_springs_visit_type_public_desc: "$EFFECT_LIST_BULLET$ Este será un viaje público de alto perfil al [hot_springs|E] que usted elija. Los locales harán todo lo posible para que su visita sea agradable. \n $EFFECT_LIST_BULLET$ Usted ganará más [prestige_i] [prestige|E] en comparación con una visita #bold privada #!, pero perder menos [stress_loss_i|E] [stress|E] . \n \n #weak ¿Qué es la relajación sin la compañía de otros? ¡Sólo alguien que es social y personalmente inepto evitaría a otros cuando es hora de divertirse! #!"
 RICE_hot_springs_visit_type_private: "Private"
 RICE_hot_springs_visit_type_private_desc: "$EFFECT_LIST_BULLET$ Este será un viaje privado y de bajo perfil al [hot_springs|E] que elijas. Evitarás llamar la atención para que puedas relajarte en paz. \n $EFFECT_LIST_BULLET$ Lose more [stress_loss_i|E] [stress|E] comparado con una visita #bold Public #!, pero gana menos [prestige_i] [prestige|E] (o ninguna en absoluto, dependiendo de dónde visite). \n \n #weak Aquellos que necesitan otros para divertirse no se sienten cómodos consigo mismos. Es mejor relajarse en un entorno tranquilo y tranquilo. #!"
 RICE_hot_springs_visit_leisure_phase: "Leisure"
 RICE_hot_springs_visit_leisure_phase_desc: "¡Es hora de disfrutar del [hot_springs|E]!"
 RICE_hot_springs_visit_relaxation_intent_header: "Relaxation:"
 RICE_hot_springs_visit_relaxation_intent: "Relaxation"
 RICE_hot_springs_visit_relaxation_intent_desc: "Usted se relajará en el [hot_springs|E] de su elección."
 RICE_hot_springs_visit_completed_log_title:0 "Visita de Hot Springs Completado"
 RICE_hot_springs_visit_completed_log:0 "[CHARACTER.GetShortUIName|U] completó la visita [CHARACTER.GetHerHis] al [hot_springs|E] en [PROVINCE.GetBaronyNameExplicitly]"
