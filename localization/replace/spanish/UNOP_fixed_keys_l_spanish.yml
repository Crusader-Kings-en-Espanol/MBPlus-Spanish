 # [ROOT.Char.ReligiousHeadTitleName] > [ROOT.Char.GetFaith.ReligiousHeadName] & [ROOT.Char.ReligiousHeadTitle] > [ROOT.Char.GetFaith.ReligiousHeadName]
 bp1_yearly.9020.desc.hof:0 "¿Cómo sería acostarse con el [ROOT.Char.GetFaith.ReligiousHeadName]? Todo ese tiempo, los dedos de [ROOT.Char.GetFaith.ReligiousHeadName] pasan tamizándose sobre los libros sagrados, por qué imaginar cómo debe sentir! Sé mi [ROOT.Char.GetFaith.ReligiousHeadName] y hazme tu [ROOT.Char.GetFaith.ReligiousText] !'"
 # Add the actual score by the addition of chancellor_foreign_affairs_realm_opinion_scale
 task_foreign_affairs_fallback_effect_desc:0 "\n\nOpinión de otros vasallos: #P +[SCOPE.ScriptValue('chancellor_foreign_affairs_realm_opinion_scale')|1]#!"
 # Reversed language [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip] > [owner.GetCulture.GetLanguage.GetNameNoTooltip]
 murder_save.1014.desc:0 "Una noche mientras me estoy preparando para la cama, escucho a dos de mis sirvientes hablando con voces abrazadas. Me lleva un momento darme cuenta de que están hablando en [owner.GetCulture.GetLanguage.GetNameNoTooltip] en lugar de [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip]. Claramente no se dan cuenta de que puedo entenderlos. \n \n 'Espera que [ROOT.Char.GetHerHim] se quede dormido. Luego vigila mientras le corté la garganta a [ROOT.Char.GetHerHis]'. \n \n I rápidamente sale de mis cuartos para informar a mis guardias que hay asesinos en mi habitación. Gracias [ROOT.Char.GetFaith.HighGodName] Hablo [owner.GetCulture.GetLanguage.GetNameNoTooltip] !"
 # Add \n\n to not have a wall of text on the weapon desc
 ep2_locale_events_artifact_motto_desc:0 "[my_weapon.GetDesc]\n\nA lo largo de la hoja se lee [my_weapon.GetOwner.GetHouse.GetMotto]."
 # [touring_grounds_scope.Custom('get_carvable_surface')] >[touring_grounds_scope.GetProvince.Custom('get_carvable_surface')]
 tour_grounds_events.3016.desc:0 "Al fin me las arreglé para encontrarme solo en los salvajes de [touring_grounds_scope.GetNameNoTooltip] y mi mente vaga a pensamientos de [liege_lover_scope.Custom2('MyCharacterIntroduction', ROOT.Char)]. \n \n No puedo negar que [touring_grounds_scope.GetNameNoTooltip] es un lugar de verdadera belleza, casi lo suficientemente hermoso para coincidir con mi amado [liege_lover_scope.GetNameNoTooltip] . Me siento obligado a dejar una marca aquí para que todos los que pasan por [touring_grounds_scope.GetNameNoTooltip] conozcan mi amor por [liege_lover_scope.GetHerHim]. Tal vez tallar el nombre [liege_lover_scope.GetHerHis] en un [touring_grounds_scope.GetProvince.Custom('get_carvable_surface')]!"
