 # You migtht > You might
 ra_kurultai_1_desc: "Usted tiene un [kurultai|E] [council|E] como regla en el [the_great_steppe|E]. \n \n Puede que ya esté familiarizado con tener un Consejo, pero al jugar como [nomad|E] tendrá un nuevo tipo de administradores que se centrarán más en apoyar su crecimiento [county_fertility|E] o [herd|E] ."
