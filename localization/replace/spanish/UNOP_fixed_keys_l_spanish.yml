 mpo_call_for_merchants_decision.merchant_will_arrive_generic: "Un extranjero rico viajará a su corte, llevando una caravana atada para las ciudades bien desarrolladas y asentadas. A su regreso, usted puede recibir los siguientes beneficios:\n$BULLET_WITH_TAB$[artifact|E] materiales de creación que desbloquean #V $commission_artifact_decision$#! [decision|E]\n$BULLET_WITH_TAB$Armamentos para su [horde|E] y [archer_cavalry|E]"
