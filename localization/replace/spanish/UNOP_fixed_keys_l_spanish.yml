 # Look at my with > Look at me with
 mpo_nerge.0110.desc: "A pesar de nuestros mejores intentos, la caza ha sido una visión deprimente. Un par de bestias han caído, pero no tantos como habíamos planeado o esperado. \n \n Mis compañeros de viaje me miran con ojos despondientes, la vergüenza tan pesada en ellos como en mí. ¿Cómo podemos mostrar nuestras caras en [ROOT.Char.GetCapitalLocation.GetName] después de esto?"
 # [ROOT.Char.Custom('VenomousCreature')] > [SCOPE.Custom('VenomousCreature')]
 murder_outcome.5001.creepy_crawly_known:0 "Incluso en la luz de luna débil puedo reconocer la forma de un [SCOPE.Custom('VenomousCreature')]."
 # [ROOT.Char.Custom('VenomousCreatureAttack')] > [SCOPE.Custom('VenomousCreatureAttack')]
 murder_outcome.5001.creepy_crawly_end:0 "El [SCOPE.Custom('VenomousCreatureAttack')] apenas pica al principio, pero pronto todo mi cuerpo está envuelto en dolor de costura. Trato de pedir ayuda, pero mi voz es demasiado débil mientras mis extremidades crecen entumecidas y mi conciencia se desvanece."
 # Add a |U after love_letter_section_2_part_3 so the new phrase start uppercased
 love_letter_compliment_system_text:0 "[ROOT.Char.Custom2('love_letter_compliment_system_section_1_part_1' , SCOPE.sC('second') )] [ROOT.Char.Custom2('love_letter_section_1_part_2' , SCOPE.sC('second') )]\n[ROOT.Char.Custom2('love_letter_section_2_part_1' , SCOPE.sC('second') )] [ROOT.Char.Custom2('love_letter_compliment_system_section_2_part_2' , SCOPE.sC('second') )]\n[ROOT.Char.Custom2('love_letter_section_2_part_3' , SCOPE.sC('second') )|U]\n[ROOT.Char.Custom2('love_letter_section_3_part_1' , SCOPE.sC('second') )]"
 #Removed the "" at the start of the second phrase
 legend_spread_events.5235.desc: "Estoy relatando mis hazañas en batalla a [chronicler.GetFirstName] cuando [chronicler.GetSheHe] interrumpe abruptamente. \n \n '¿Es verdad, entonces? ¿Mataste al comandante enemigo en combate único?' Los ojos de [chronicler.GetHerHis|U] brillan con las posibilidades. Claramente este es algún tipo de cuento alto absorbido a través de la palabra de boca. \n \n I estaba realmente allí en la batalla, pero la confusión del melee hace una posibilidad de prácticamente cualquier evento ..."
