 # who's faith > whose faith
 game_concept_designate_chief_sacrifice_desc:0 "Al celebrar un gran festival de sacrificios, [characters|E] puede designar uno de sus [prisoners|E] para ser el sacrificio primario. $game_concept_prisoner$ es asesinado primero, y puede hacer que el personaje sacrificar ganar más [piety|E].\n\nLos sacrificios preferentes son:\n$EFFECT_LIST_BULLET$ Landless $game_concept_characters$ cuyo [faith|E] o [faith_hostile|L] o [faith_evil|L]\n$EFFECT_LIST_BULLET$ [landed|E] $game_concept_characters$ por lo menos [count|E]-[rank|E]\n$EFFECT_LIST_BULLET$ [heads_of_faith|E] (aunque esto puede tener repercusiones)"
