 # GetManWoman > GetWomanMan
 ep3_contract_event.0565.desc.critsuccess: "El envío de [councillor.GetTitledFirstName] es brutalmente rápido; el [councillor.GetWomanMan] muere en ignominia, silenciado antes incluso los compañeros de [councillor.GetHerHis] pueden levantar un abrazo y llorar. \n \n La luz fría del día lava mis pecados casi limpios; un baño en una corriente local hace el resto. \n \n Un agente espera en el banco, ya sea lo mismo que antes, no puedo decir, con un embrague de sacos pesados. \n \n 'El [task_contract_employer.GetTitleAsNameNoTooltip] le agradece su trabajo. [task_contract_employer.GetSheHe|U] ha incluido un regalo adicional como signo de gratitud [task_contract_employer.GetHerHis].'"
 # GetTitledFirstFirstName > GetTitledFirstName
 ep3_contract_event.0565.desc.success: "[councillor.GetTitledFirstName] ya no es más. El duro acto de violencia no está perfectamente hecho, pero la verdad es la misma: he matado mi marca. \n \n La luz fría del día lava mis pecados casi limpios; un baño en una corriente local hace el resto. \n \n Un agente espera en el banco —ya sea lo mismo que antes, no puedo decir— con un saco pesado colgado de la silla [messenger.GetHerHis]. \n \n 'El [task_contract_employer.GetTitleAsNameNoTooltip] le agradece su trabajo. Tu servicio será recordado.'"
 #boldakritai > bold akritai
 AKRITAI_GLOSS: "El término griego #bold akritai#!, derivado de la palabra #EMP akron#! o 'frontera', se refiere a los soldados fronterizos a veces glorificados como defensores contra #EMP ghazi#! incursión, y ocasionalmente condenados como bandidos."
 #[ROOT.Char.Custom('GetCourt'|l)] -> [ROOT.Char.Custom('GetCourt')|l]
 stress_trait_coping_decisions.3001.desc:0 "En cuanto se reúne la [ROOT.Char.Custom('GetCourt')|l], sonrío [ROOT.Char.Custom('quirk_neg_adverb')]. Ha llegado el momento.\n\n«¡Vos de ahí! ¿Nacisteis así de patán o fue algo que desarrollasteis con los años?»."
 #[child.GetDaughterSon] -> [child.Custom('GetDaughterSon')]
 stress_threshold_prison.3011.child: "Mi [child.Custom('GetDaughterSon')], [child.GetFirstName], me agarra de la mano lo que hace que siga brillando la luz de mis ojos."
 #GetHerHe > GetSheHe
 laamp_extra_contract_schemes.0002.desc_intrigue: "[task_contract_target.GetName] es un [task_contract_target.GetWomanMan] bastante complejo — moral [task_contract_target.GetHerHis], no el intelecto [task_contract_target.GetHerHis]! He amasado una rica recompensa de rumores venenosos; algunas palabras cuidadosamente planificadas, y el [task_contract_target.GetTitleAsNameNoTooltip] será consciente de toda la dignidad [task_contract_target.GetSheHe] perderá oponiéndose a [task_contract_employer.GetTitledFirstName] . \n \n 'Cuán fácilmente la corte de mi teniente podría convertirse en un nido de víboras!' crows [task_contract_employer.GetTitledFirstName] . 'Seré misericordioso, y le daré la oportunidad de conceder los derechos de mis pueblos... antes de enviar los asuntos de [task_contract_employer.GetHerHis] en espiral fuera de control.'"
 # task_contract_employerr > task_contract_employer
 laamp_extra_contract_schemes.0003.desc_diplomacy: "[task_contract_target.GetNamePossessive] no me da nada, ni palanca ni simpatía. No importan mis palabras, los representantes de [task_contract_target.GetPrimaryTitle.GetAdjective] simplemente han encadenado mi cara \n \n 'Me han dicho que mi mentira ha tenido #EMP suficiente #! de su nagging!' grita [task_contract_employer.GetTitledFirstNameNoTooltip] . 'Tu corazón blando, cualquiera de mis personas pitosas, se burlan a través de [task_contract_employer.GetPrimaryTitle.GetNameNoTierNoTooltip]! El tuyo era una táctica obvia... y ahora #EMP nosotros #! soportamos las consecuencias."
 # 'location.GetName' > location.GetName
 legend_spread_events.5015.desc: "Probando la hoja de una espada como mi cronista [chronicler.GetFirstName] y peruso la armería en [SelectLocalization( IsLandlessAdventurer( ROOT.Char ), 'my camp', location.GetName)]. Es afilado y bien honrado. [chronicler.GetFirstNameNoTooltip] , sin embargo, está más interesado en otro arma colgando de la pared. \n \n 'He oído hablar tanto de este arma poderosa, mi [ROOT.Char.GetLadyLord].' [chronicler.GetSheHe|U] respira, admirando. 'He oído que ha matado a una media docena solo por tu mano! \n \n [artifact.GetName] cuelga allí placidamente. Es cierto que ha sido un arma fidedigna y letal durante toda su vida, sus flancos repetidamente azotados en la sangre de los enemigos. Una buena espada. Una espada roja."
 # All 3 of them have the same issue > [activity_camp_party|E] > [GetActivityType( 'activity_camp_party').GetName]
 ep3_camp_party_sad_lonesome_desc: "Este personaje alojó un [GetActivityType( 'activity_camp_party').GetName] solo para sí mismo y está embrujado por la memoria del silencio perturbado de la soledad"
 ep3_camp_party_shadows_in_the_dark_desc: "Este personaje se sentó a través de su [GetActivityType( 'activity_camp_party').GetName] solo, y muy, muy todavía"
 camp_party_fortress_of_solitude_desc: "Este personaje alojó un [GetActivityType( 'activity_camp_party').GetName] solo para sí mismo y está calentado por la memoria del silencio pacífico de la soledad"
