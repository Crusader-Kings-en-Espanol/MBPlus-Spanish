 # Replace [city_mayor.GetWomanMan] with [city_mayor.GetSheHe] to have the gender of the correct char
 hold_court.8290.desc: "Antes de mí representa un [city_mayor.GetWomanMan] no familiar: aparentemente [city_mayor.GetSheHe] es [city_mayor.GetFirstName] , un [city_mayor.GetTitleAsNameNoTooltip] en mi [ROOT.Char.Custom2('RelationToMeShort', city_vassal)] , [city_vassal.GetTitledFirstNamePossessive] , dominio. \n \n 'Mi [ROOT.Char.GetTitleAsNameNoTooltip] , Vengo aquí, sin el permiso de mi [ROOT.Char.GetLadyLord] , para pedir que concedas mi ciudad, [city_province.GetTitle.GetNameNoTier], las tierras circundantes para gobernar como se ve apropiado.' \n \n 'Podríamos manejar nuestros propios asuntos, y traer gran prosperidad al [ROOT.Char.GetPrimaryTitle.Custom('GetTierBase')] , si solo estábamos libres de los impuestos y responsabilidades que impone el [city_vassal.GetTitleAsNameNoTooltip] de [city_vassal.GetPrimaryTitle.GetNameNoTierNoTooltip] .'"
