l_spanish:
 silk_road_situation_sub_region_region_silk_road_proper_occident: "Occidente"
 silk_road_situation_sub_region_region_silk_road_proper_occident_desc: "$SITUATION_SUB_REGION_TOOLTIP_DESC$\n\n#weak Esta es la meta final de las grandes caravanas, donde las fortunas se hacen y se pierden.#!"

 silk_road_situation_sub_region_region_silk_road_proper_middle_east: "Al-Sharq"
 silk_road_situation_sub_region_region_silk_road_proper_middle_east_desc: "$SITUATION_SUB_REGION_TOOLTIP_DESC$ \n \n #weak Esta encrucijada de imperios vincula la Ruta de la Seda con el Mediterráneo y el Océano Índico. Los mercados más variados esperan en sus ciudades florecientes, pero el control del flujo puede cambiar rápidamente con cada conquista. #!"
 
 silk_road_situation_sub_region_region_silk_road_proper_sea: "Suvarnabhumi"
 silk_road_situation_sub_region_region_silk_road_proper_sea_desc: "$SITUATION_SUB_REGION_TOOLTIP_DESC$ \n \n #weak Las selvas densas y las montañas imponentes complican el comercio por tierra dentro de esta península, pero una red de pases de montaña y rutas fluviales conecta los grandes mercados de Khmer al este. Las fortunas están hechas aquí en especias y maderas exóticas. #!"

 
