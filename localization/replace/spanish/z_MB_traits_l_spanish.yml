 jinshi_desc: "Jinshi fue el grado más alto y final en el examen imperial en la China Imperial."
 trait_zhuangyuan: "Zhuangyuan"
 zhuangyuan_desc: "Zhuangyuan fue el título otorgado al erudito que obtuvo la puntuación más alta en el nivel más alto del examen imperial."

 trait_confucious: "Yansheng"
 trait_confucious_desc: "El Duque Yansheng, literalmente 'Honorable Que Desborda Sabiduría', a veces traducido como Santo Duque de Yen, fue un título de nobleza chino. Originalmente fue creado como un título de marqués en la dinastía Han Occidental para un descendiente directo de Confucio."
 trait_confucious_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] es un descendiente de Confucio."

