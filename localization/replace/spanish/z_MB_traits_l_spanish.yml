 trait_immortality: "Inmortalidad"
 trait_immortality_desc: "Este personaje es inmortal."
 trait_immortality_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] es inmortal."
 trait_child_of_adoption: "Hijo Adoptado"
 trait_child_of_adoption_desc: "Este personaje es un hijo adoptado y su padre es un padre adoptivo."
 trait_child_of_adoption_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] es un hijo adoptado. [ROOT.GetCharacter.GetHerHis|U] padre adoptivo es [ROOT.Var('shogunate_adoptive_father').Char.GetHouse.GetBaseNameNoTooltip] [ROOT.Var('shogunate_adoptive_father').Char.GetFirstNameNoTooltip], y [ROOT.GetCharacter.GetHerHis] verdadero padre es [ROOT.Var('shogunate_real_father').Char.GetHouse.GetBaseNameNoTooltip] [ROOT.Var('shogunate_real_father').Char.GetFirstNameNoTooltip]."
 trait_ashikaga_family: "Familia Ashikaga"
 trait_ashikaga_family_desc: "Este personaje es un descendiente del clan Ashikaga. Este parentesco no se limita a los miembros de la familia directa de los Ashikaga."
 trait_ashikaga_family_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] es un descendiente del clan Ashikaga. Este parentesco no se limita a los miembros de la familia directa de los Ashikaga."
 trait_tea_master: "Maestro del Té"
 trait_tea_master_desc: "Este personaje dominó el arte de la ceremonia del té y conoce el valor de los juegos de té. Esta habilidad permite a esta persona realizar mejores negociaciones diplomáticas organizando ceremonias de té o regalando tazas de té preciosas."
 trait_tea_master_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] dominó el arte de la ceremonia del té y conoce el valor de los juegos de té. Esta habilidad permite a esta persona realizar mejores negociaciones diplomáticas organizando ceremonias de té o regalando tazas de té preciosas."
 trait_painter: "Pintor"
 trait_painter_desc: "Este personaje tiene una excelente habilidad para el dibujo. Esta persona debería conocer bien la literatura clásica china, ya que una obra maestra de pintura a menudo requiere un poema chino apropiado sobre la imagen. El dibujo también se utiliza en el entrenamiento budista."
 trait_painter_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] tiene una excelente habilidad para el dibujo. Esta persona debería conocer bien la literatura clásica china, ya que una obra maestra de pintura a menudo requiere un poema chino apropiado sobre la imagen. El dibujo también se utiliza en el entrenamiento budista."
 trait_musician: "Músico"
 trait_musician_desc: "Este personaje toca instrumentos musicales como pasatiempo o trabajo. El Gagaku se desarrolló como música de corte en el período Heian, y los emperadores y aristócratas se familiarizaron con el Koto (cítara de medio tubo) y el Fue (flauta). En tiempos posteriores, muchos samuráis disfrutaron de instrumentos musicales como el Fue, Sho (órgano de boca), Tsuzumi (tamor de reloj de arena), Biwa (laúd) y Shakuhachi (flauta de pico)."
 trait_musician_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] toca instrumentos musicales como pasatiempo o trabajo. El Gagaku se desarrolló como música de corte en el período Heian, y los emperadores y aristócratas se familiarizaron con el Koto (cítara de medio tubo) y el Fue (flauta). En tiempos posteriores, muchos samuráis disfrutaron de instrumentos musicales como el Fue, Sho (órgano de boca), Tsuzumi (tamor de reloj de arena), Biwa (laúd) y Shakuhachi (flauta de pico)."
 trait_dancer: "Bailarín"
 trait_dancer_desc: "Este personaje baila como pasatiempo o trabajo. El Bugaku se desarrolló como un baile de corte en el período Heian, y los emperadores y aristócratas se familiarizaron con el baile. En tiempos posteriores, muchos plebeyos y samuráis disfrutaron de artes escénicas como el baile Dengaku, la obra de Noh y el Kabuki."
 trait_dancer_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] baila como pasatiempo o trabajo. El Bugaku se desarrolló como un baile de corte en el período Heian, y los emperadores y aristócratas se familiarizaron con el baile. En tiempos posteriores, muchos plebeyos y samuráis disfrutaron de artes escénicas como el baile Dengaku, la obra de Noh y el Kabuki."
