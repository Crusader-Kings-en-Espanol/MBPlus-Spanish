 trait_slave: "Dāsa"
 trait_slave_desc: "También conocido como Dāsa o Dāsyu, esta persona proviene de la Casta de Esclavos."
 trait_slave_character_desc: "También conocido como Dāsa o Dāsyu, [ROOT.GetCharacter.GetFirstNameNoTooltip] proviene de la Casta de Esclavos."
 trait_freed_slave: "Dāsa liberado"
 trait_freed_slave_desc: "Esta persona perteneció a la Casta de Esclavos durante un período de tiempo."
 trait_freed_slave_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] perteneció a la Casta de Esclavos durante un período de tiempo."
 trait_brahmin: "Brahmán"
 trait_brahmin_desc: "Esta persona proviene de los Brahmanes, que son venerados como una encarnación del conocimiento mismo, dotados de los preceptos y sermones que deben ser transmitidos a todas las Varnas de la sociedad dentro del sistema de castas indio."
 trait_brahmin_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] proviene de los Brahmanes, que son venerados como una encarnación del conocimiento mismo, dotados de los preceptos y sermones que deben ser transmitidos a todas las Varnas de la sociedad dentro del sistema de castas indio."
 trait_kshatriya: "Kshatriya"
 trait_kshatriya_desc: "Esta persona proviene de los Kshatriyas, la segunda Varna, constituida por la clan guerrero, los reyes, gobernantes de territorios y administradores dentro del sistema de castas indio."
 trait_kshatriya_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] proviene de los Kshatriyas, la segunda Varna, constituida por la clan guerrero, los reyes, gobernantes de territorios y administradores dentro del sistema de castas indio."
 trait_vaishya: "Vaishya"
 trait_vaishya_desc: "Esta persona proviene de los Vaishya, la tercera Varna, representada por agricultores, comerciantes, prestamistas y aquellos involucrados en el comercio dentro del sistema de castas indio."
 trait_vaishya_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] proviene de los Vaishya, la tercera Varna, representada por agricultores, comerciantes, prestamistas y aquellos involucrados en el comercio dentro del sistema de castas indio."

 trait_shudra: "Shudra"
 trait_shudra_desc: "Esta persona proviene de los Shudra, la cuarta Varna. Tradicionalmente, los Shudras eran campesinos y artesanos."
 trait_shudra_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] proviene de los Shudra, la cuarta Varna. Tradicionalmente, los Shudras eran campesinos y artesanos."


 trait_RICE_silk_road_merchant: "Mercader de la Ruta de la Seda"
 trait_RICE_silk_road_merchant_desc: "Este personaje es un comerciante prominente a lo largo de la llamada Ruta de la Seda, ya sea por las rutas comerciales terrestres o marítimas. Tienen experiencia en las artes del comercio, el viaje y la negociación."
