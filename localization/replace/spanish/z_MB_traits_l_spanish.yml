 trait_minamoto_clan: "Clan Minamoto"
 trait_minamoto_clan_desc: "Este personaje afirma ser miembro del clan Minamoto (Genji)."
 trait_minamoto_clan_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] afirma ser miembro del clan Minamoto (Genji). [ROOT.GetCharacter.GetSheHe|U] sería llamado \"Minamoto no [ROOT.GetCharacter.GetFirstNameNoTooltip]\" en público."
 
 trait_minamoto_seiwa_clan: "Clan Minamoto (Seiwa Genji)"
 trait_minamoto_seiwa_clan_desc: "Este personaje afirma ser miembro del clan Minamoto (Genji), específicamente los Seiwa Genji, la rama descendiente del emperador Seiwa a través de Minamoto no Tsunemoto, que llegó a dominar la clase guerrera y finalmente dio origen al shogunato Kamakura."
 trait_minamoto_seiwa_clan_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] afirma ser miembro del clan Minamoto (Seiwa Genji), rama Seiwa. [ROOT.GetCharacter.GetSheHe|U] sería llamado \"Minamoto no [ROOT.GetCharacter.GetFirstNameNoTooltip]\" en público."
 
 trait_minamoto_murakami_clan: "Clan Minamoto (Murakami Genji)"
 trait_minamoto_murakami_clan_desc: "Este personaje afirma ser miembro del clan Minamoto (Genji), específicamente los Murakami Genji, la rama descendiente del emperador Murakami, que se mantuvo como un linaje noble cortesano prominente a través de figuras como Minamoto no Toshifusa y Minamoto no Akifusa."
 trait_minamoto_murakami_clan_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] afirma ser miembro del clan Minamoto (Murakami Genji), rama Murakami. [ROOT.GetCharacter.GetSheHe|U] sería llamado \"Minamoto no [ROOT.GetCharacter.GetFirstNameNoTooltip]\" en público."
 
 trait_minamoto_daigo_clan: "Clan Minamoto (Daigo Genji)"
 trait_minamoto_daigo_clan_desc: "Este personaje afirma ser miembro del clan Minamoto (Genji), específicamente los Daigo Genji, la rama descendiente del emperador Daigo, notable sobre todo por el príncipe Takaakira, el ministro de la Izquierda cuyo exilio en el Incidente de Anna del año 969 marcó el punto álgido del dominio Fujiwara sobre la corte."
 trait_minamoto_daigo_clan_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] afirma ser miembro del clan Minamoto (Daigo Genji), rama Daigo. [ROOT.GetCharacter.GetSheHe|U] sería llamado \"Minamoto no [ROOT.GetCharacter.GetFirstNameNoTooltip]\" en público."
 
 trait_minamoto_saga_clan: "Clan Minamoto (Saga Genji)"
 trait_minamoto_saga_clan_desc: "Este personaje afirma ser miembro del clan Minamoto (Genji), específicamente los Saga Genji, la rama descendiente del emperador Saga, quien otorgó el apellido Minamoto a muchos de sus hijos. El más célebre de la línea fue Minamoto no Tōru, cuyo legendario jardín en Kawara-no-in se convirtió en sinónimo de la elegancia Heian."
 trait_minamoto_saga_clan_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] afirma ser miembro del clan Minamoto (Saga Genji), rama Saga. [ROOT.GetCharacter.GetSheHe|U] sería llamado \"Minamoto no [ROOT.GetCharacter.GetFirstNameNoTooltip]\" en público."
 
 trait_minamoto_uda_clan: "Clan Minamoto (Uda Genji)"
 trait_minamoto_uda_clan_desc: "Este personaje afirma ser miembro del clan Minamoto (Genji), específicamente los Uda Genji, la rama descendiente del emperador Uda a través de Minamoto no Masanobu, que dio origen al clan Sasaki y a otras familias guerreras del oeste de Japón."
 trait_minamoto_uda_clan_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] afirma ser miembro del clan Minamoto (Uda Genji), rama Uda. [ROOT.GetCharacter.GetSheHe|U] sería llamado \"Minamoto no [ROOT.GetCharacter.GetFirstNameNoTooltip]\" en público."
 
