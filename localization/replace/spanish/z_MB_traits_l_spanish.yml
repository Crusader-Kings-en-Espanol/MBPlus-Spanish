l_spanish:

 trait_maimed: "Manco"
 trait_maimed_desc: "Este personaje le falta una mano; tener solo una mano causa problemas en combate, pero facilita escapar de las tareas."
 trait_mamaluk: "Mameluco"
 trait_mamaluk_desc: "Mameluco, traducido como 'el que es poseído', es un término que se refiere comúnmente a soldados esclavos y libertos, de etnias diversas (principalmente turcas, caucásicas, del este y sudeste europeo) que fueron asignados a deberes militares y administrativos, sirviendo a las dinastías árabes gobernantes en el mundo musulmán. El reino mameluco más duradero fue la clase militar caballeresca en Egipto que eventualmente tomó el control de Egipto de los ayyubíes."

