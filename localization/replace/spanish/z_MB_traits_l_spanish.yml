 trait_fujiwara_clan: "Clan Fujiwara"
 trait_fujiwara_clan_desc: "Este personaje afirma ser miembro del clan Fujiwara (Toshi)."
 trait_fujiwara_clan_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] afirma ser miembro del clan Fujiwara (Toshi). [ROOT.GetCharacter.GetSheHe|U] sería llamado \"Fujiwara no [ROOT.GetCharacter.GetFirstNameNoTooltip]\" en público."

 trait_fujiwara_nanke_clan: "Clan Fujiwara (Nanke)"
 trait_fujiwara_nanke_clan_desc: "Este personaje afirma ser miembro del clan Fujiwara (Toshi), específicamente el Nanke (Casa del Sur), la rama primogénita, fundada por Muchimaro, que perdió su dominio cortesano tras la rebelión de Nakamaro en el año 764."
 trait_fujiwara_nanke_clan_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] afirma ser miembro del clan Fujiwara (Toshi), rama Nanke. [ROOT.GetCharacter.GetSheHe|U] sería llamado \"Fujiwara no [ROOT.GetCharacter.GetFirstNameNoTooltip]\" en público."

 trait_fujiwara_shikike_clan: "Clan Fujiwara (Shikike)"
 trait_fujiwara_shikike_clan_desc: "Este personaje afirma ser miembro del clan Fujiwara (Toshi), específicamente el Shikike (Casa de las Ceremonias), la rama fundada por Umakai, llamada así por su cargo al frente del Departamento de Ceremonias."
 trait_fujiwara_shikike_clan_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] afirma ser miembro del clan Fujiwara (Toshi), rama Shikike. [ROOT.GetCharacter.GetSheHe|U] sería llamado \"Fujiwara no [ROOT.GetCharacter.GetFirstNameNoTooltip]\" en público."

 trait_fujiwara_kyoke_clan: "Clan Fujiwara (Kyōke)"
 trait_fujiwara_kyoke_clan_desc: "Este personaje afirma ser miembro del clan Fujiwara (Toshi), específicamente el Kyōke (Casa de la Capital), la rama fundada por Maro, llamada así por su cargo administrativo en la capital."
 trait_fujiwara_kyoke_clan_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] afirma ser miembro del clan Fujiwara (Toshi), rama Kyōke. [ROOT.GetCharacter.GetSheHe|U] sería llamado \"Fujiwara no [ROOT.GetCharacter.GetFirstNameNoTooltip]\" en público."

 trait_fujiwara_oshu_clan: "Clan Fujiwara (Ōshū)"
 trait_fujiwara_oshu_clan_desc: "Este personaje afirma ser miembro de los Fujiwara del Norte (Ōshū Fujiwara-shi), una rama de los Hokke que estableció un dominio independiente sobre la región de Tōhoku a partir de finales del siglo XI."
 trait_fujiwara_oshu_clan_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] afirma ser miembro de los Fujiwara del Norte (Ōshū Fujiwara-shi). [ROOT.GetCharacter.GetSheHe|U] sería llamado \"Fujiwara no [ROOT.GetCharacter.GetFirstNameNoTooltip]\" en público."
 
 
