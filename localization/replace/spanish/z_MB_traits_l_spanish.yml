 trait_third_force_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] pertenece a la tercera fuerza, que quiere reemplazar a los actuales partidarios de la Corte del Norte."

 trait_ubaydi: "Ubaidí"
 trait_ubaydiyya: "Ubaidiyya"
 trait_ubaydi_desc: "El término ubaidí se atribuía a los miembros de la dinastía fatimí, de quienes varias sectas islámicas creían que habían falsificado su descendencia del profeta Mahoma."
 trait_ubaydi_character_desc: "Se cree que [ROOT.GetCharacter.GetFirstNameNoTooltip] es descendiente del profeta Mahoma, una afirmación que muchos cuestionan."

 trait_qurashi: "Qurayshi"
 trait_quraysh: "Qurayshi"
 trait_qurashiyya: "Qurayshiyya"
 trait_quraysh_desc: "El término Qurayshi describe a alguien que desciende de la legendaria tribu Quraysh de Arabia, aunque a diferencia de un Sayyid, no desciende directamente del Profeta Muhammad."
 trait_quraysh_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] tiene la sangre de la tribu Quraysh fluyendo por las venas de [ROOT.GetCharacter.GetHerHis]."
 rich_presence_quraysh: "Teniendo la sangre de Quraysh corriendo por las venas de [ROOT.Char.GetHerHis] como"

 trait_blood_of_salih: "Sangre de Salih"
 trait_blood_of_salih_desc: "Este personaje es un descendiente de Salih ibn Tarif, el autoproclamado profeta bereber de la religión barghwatiana."
 trait_blood_of_salih_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] tiene la sangre del profeta bereber barghwatiano, Salih ibn Tarif, fluyendo por sus venas."

 trait_miknasa: "Miknasa"
 trait_miknasa_desc: "Los Miknasa son aquellos que poseen la sangre de la antigua tribu Miknasa. Los miembros de esta línea de sangre son representantes de la realeza bereber y el éxito."
 trait_miknasa_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] desciende de la antigua tribu bereber Miknasa."

 trait_masmudi: "Masmuda"
 trait_masmudi_desc: "Los Masmuda son aquellos que poseen la sangre de la antigua tribu Masmuda. Los miembros de esta línea de sangre son representantes de la riqueza y prosperidad bereber."
 trait_masmudi_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] desciende de la antigua tribu bereber Masmuda."

 trait_sanhaja: "Sanhaja"
 trait_sanhaja_desc: "Los Sanhaja son aquellos que poseen la sangre de la antigua tribu Sanhaja. Los miembros de esta línea de sangre son representantes del pensamiento y la cultura bereber."
 trait_sanhaja_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] desciende de la antigua tribu bereber Sanhaja."

 trait_zenata: "Zenata"
 trait_zenata_desc: "Los Zenata son aquellos que poseen la sangre de la antigua tribu Zenata. Los miembros de esta línea de sangre son representantes de la determinación y perseverancia bereber."
 trait_zenata_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] desciende de la antigua tribu bereber Zenata."

