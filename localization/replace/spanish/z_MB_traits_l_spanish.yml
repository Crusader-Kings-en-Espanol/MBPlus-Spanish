 trait_track_hafidh: "Hafidh"
 trait_track_hafidh_desc: "En el nombre de Alá, el Más Compasivo, el Más Misericordioso..."
 trait_hafidh_3_character_normal_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] ha memorizado completamente el Corán, palabra por palabra, letra por letra. Este gran logro, junto con el extenso conocimiento de [ROOT.GetCharacter.GetHerHis] sobre el Hadith, sirve como un signo del conocimiento y piedad de [ROOT.GetCharacter.GetHerHis] para aquellos que buscan a [ROOT.GetCharacter.GetHerHim] por guía espiritual."
 trait_hafidh_3_character_quranist_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] ha memorizado completamente el Corán, palabra por palabra, letra por letra. Este gran logro sirve como un signo del conocimiento y piedad de [ROOT.GetCharacter.GetHerHis] para aquellos que buscan a [ROOT.GetCharacter.GetHerHim] por guía espiritual."
 trait_hafidh_2_character_normal_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] ha memorizado una gran parte del Corán y el Hadith. Esta hazaña le ha otorgado a [ROOT.GetCharacter.GetHerHim] gran respeto dentro de la comunidad islámica."
 trait_hafidh_2_character_quranist_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] ha memorizado una gran parte del Corán. Esta hazaña le ha otorgado a [ROOT.GetCharacter.GetHerHim] gran respeto dentro de la comunidad islámica."
 trait_hafidh_1_character_normal_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] aspira a memorizar completamente el Corán, y [ROOT.GetCharacter.GetSheHe] ha memorizado una buena cantidad de Suras, además de una pequeña cantidad de Hadith."
 trait_hafidh_1_character_quranist_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] aspira a memorizar completamente el Corán y ha memorizado una buena cantidad de Suras."
 trait_hafidh_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] aspira a memorizar completamente el Corán, pero aún no ha memorizado ningún Sura importante."
 trait_hafidh_desc: "Este personaje se ha dedicado a memorizar todo el Corán."

