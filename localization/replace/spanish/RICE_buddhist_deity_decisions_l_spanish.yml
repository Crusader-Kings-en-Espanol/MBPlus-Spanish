 ######## BUDDHIST Deities - Mahayana ########
 dharma_buddhism.202.t: "Dieta Meditacional Personal"
 dharma_buddhism.202.desc: "Una Deidad meditativa es una deidad, Buda o Boddhisattva que ayuda a alcanzar la iluminación espiritual. Devotándome a uno de ellos, me ayudarán a enfocarme en alcanzar la iluminación completa. \n \n Deseo concentrarme en venerar una deidad [ROOT.Char.GetFaith.GetAdjective] específica..."
