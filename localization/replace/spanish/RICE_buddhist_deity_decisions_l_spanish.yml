l_spanish:


 YIDAM_GLOSS: "El #bold Yidam #! es una deidad meditativa que ayuda a alcanzar la iluminación espiritual en la religión [GetReligionByKey('bon_religion').GetAdjective] y el [GetReligionByKey('buddhism_religion').GetName] tibetano. Son una parte importante de las prácticas espirituales de estas religiones, especialmente #italic deidad yoga #! (devatayoga), que implica recitar oraciones y mantras, o visualización de la deidad."
 NAT_GLOSS: "Los #bold Nats #! son deidades tradicionalmente veneradas en [GetGeographicalRegion('world_burma').GetName] . La adoración de estas deidades, y la religión popular birmana en general, se ha mezclado fuertemente con las prácticas religiosas [GetReligionByKey('buddhism_religion').GetAdjective]."

 #######################################
 # Select Personal Deity Decisions
 #######################################
  RICE_select_personal_deity_tibet_decision: "Seleccione un Yidam personal"
  select_personal_deity_tibet_decision_desc: "Un [Glossary( 'Yidam', 'YIDAM_GLOSS' )] es una deidad meditativa que ayuda a alcanzar la iluminación espiritual en [GetReligionByKey('bon_religion').GetAdjective] y $heritage_tibetan_name$ [GetReligionByKey('buddhism_religion').GetAdjective] creencia. Centrándose en un [Glossary( 'Yidam', 'YIDAM_GLOSS' )] en particular, pueden ayudarme en mi camino para convertirse en un ser completamente iluminado. \n \n I debería decidir cuál es el ser iluminado que más me llama."
  RICE_select_personal_deity_tibet_decision_confirm: "Contemplate a Yidam"
  select_personal_yidam_decision_tooltip: "Piensa en quién debería ser tu [Glossary( 'Yidam', 'YIDAM_GLOSS' )]."
  select_personal_yidam_decision_tt: "Gane un #P positivo #! [modifier|E] asociado con su [Glossary( 'Yidam', 'YIDAM_GLOSS' )] seleccionado"

  RICE_select_personal_nat_decision: "Seleccione un Nat personal"
  select_personal_nat_decision_desc: "Un #bold Nat #! es un espíritu en la creencia [GetReligionByKey('burmic_religion').GetAdjective] que puede ayudar a alcanzar la iluminación espiritual o proteger a uno del daño. Centrándose en una Nat particular, pueden ayudarme en mi camino para convertirse en un ser completamente iluminado. \n \n I debería decidir cuál es el ser iluminado que más me llama."
  RICE_select_personal_nat_decision_confirm: "Contemplate a Nat"
  select_personal_nat_decision_tooltip: "Piensa en quién debería ser tu Nat."
  select_personal_nat_decision_tt: "Ganar un #P positivo #! [modifier|E] asociado con su Nat seleccionado"

  RICE_select_personal_deity_buddhist_decision: "Seleccione una Deidad de Meditación Personal"
  select_personal_deity_buddhist_decision_desc: "Muchos [GetReligionByKey('buddhism_religion').GetAdherentNamePlural] se dedican a una Deidad de meditación #bold, Buda o Boddhisattva #! para ayudarlos a alcanzar la iluminación. Al dedicarme a uno de ellos, ellos pueden ayudarme en mi camino para convertirse en un ser completamente iluminado. \n \n I debería decidir qué ser divino me llama más."
  RICE_select_personal_deity_buddhist_decision_confirm: "Contempla una Deidad de meditación"
  select_personal_deity_buddhist_decision_tooltip: "Piensa en quién debe ser tu Deidad de meditación."
  select_personal_meditional_deity_decision_tt: "Obtenga un #P positivo #! [modifier|E] asociado con su Deidad de meditación seleccionada"

 #######################################
 # Picking Buddhist Deities
 #######################################
 dharma_buddhism.200.t: "Personal Yidam"
 dharma_buddhism.200.desc: "Un [Glossary( 'Yidam', 'YIDAM_GLOSS' )] es una Deidad meditativa que ayuda a alcanzar la iluminación espiritual. Devotándome a uno de ellos, me ayudarán a enfocarme en alcanzar la iluminación completa. \n \n Deseo concentrarme en venerar una deidad [ROOT.Char.GetFaith.GetAdjective] específica..."
 # Bon Deities
 dharma_buddhism.200.gyalmo: "Sipe Gyalmo, la Reina del Universo"
 dharma_buddhism.200.shenlha: "Shenlha Okar, el Sangía de la Compasión"
 dharma_buddhism.200.shenrab: "Tonpa Shenrab, el Completamente iluminado y fundador de Bön"
 dharma_buddhism.200.yeshe: "Yeshe Walmo, el preservador y protector de toda la sabiduría Bön"
 dharma_buddhism.200.takla: "Takla Mebar, el Dios del Tigre Flaming"
 dharma_buddhism.200.zhambala: "Zamba Lha, la deidad que manifiesta riqueza y prosperidad"
 dharma_buddhism.200.chamma: "Sherab Chamma, Madre de todos los iluminados, fuente de todo amor y compasión"
 # Buddhist Deities
 dharma_buddhism.200.palden: "Palden Lhamo, la diosa gloriosa"
 dharma_buddhism.200.tara: "Tara, madre de liberación y la Bodhisattva de compasión y acción"
 dharma_buddhism.200.avalokitesvara: "Avalokiteśvara, el Bodhisattva que encarna la compasión de todos los Budas"
 dharma_buddhism.200.yamantaka: "Yamantaka, conquistador del Señor de la Muerte"
 dharma_buddhism.200.hevajra: "Hevajra, la feroz deidad de la medición"
 dharma_buddhism.200.vajrayogini: "Vajrayogini, el dakini de todos los Budas"
 # Opt out
 dharma_buddhism.200.optout: "Aún no estoy listo para decidir"
