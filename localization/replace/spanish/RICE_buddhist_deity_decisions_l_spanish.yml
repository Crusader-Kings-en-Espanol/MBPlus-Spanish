 dharma_buddhism.202.ksitigarbha: "Ksitigarbha, el Bodhisattva que enseña los seis mundos"
 dharma_buddhism.202.bhaisajyaguru: "Bhaisajyaguru, el Buda de Medicina que cura el sufrimiento"
 # Indian Deities
 dharma_buddhism.202.vasudhara: "Vasudhara, la Bodhisattva de la riqueza, la prosperidad y la abundancia"
 dharma_buddhism.202.vajrapani: "Vajrapani, el protector y guía de Gautama Buda"
 dharma_buddhism.202.manjushri: "Manjushri, Gloria suave de la sabiduría"
 dharma_buddhism.202.samantabhadra: "Samantabhadra, la Boddhisattva de la práctica y la meditación"
 ######## BUDDHIST Deities - Vajarayana ########
 dharma_buddhism.202.tara: "Tara, la Bodhisattva de la compasión y la acción"
 dharma_buddhism.202.avalokitesvara: "Avalokiteśvara, el Bodhisattva que encarna la compasión de todos los Budas"
 dharma_buddhism.202.Ratnasambhava: "Ratnasambhava, uno de los Cinco Budas Dhyani, destructor de la envidia y la codicia"
 dharma_buddhism.202.vajrasattva: "Vajrapani, el protector y guía de Gautama Buda"

