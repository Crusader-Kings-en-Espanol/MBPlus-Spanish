 #Consolidated Bookmarks - Removed excessive parts of character names for space reasons. Epitaphs and ordinal numbers are kept but titles and dynasty names are removed (especially when the dynasty name is right below the character name anyway)

 bm_867_carolingians2: "Los Carolingios (2)"
 bm_867_carolingians2_desc: "\n\n#bold -> No hay Imperio de Francia en el marcador de 867 <- #!\n\n Después del fallecimiento de Luis el Piadoso, el otrora gran Imperio Carolingio se dividió en tres reinos separados: Francia Oriental, Francia Occidental y Media Francia. Desde entonces, estos reinos no han hecho más que fragmentarse más a medida que guerras, rebeliones y herencias varias causan inestabilidad y fragmentación.\n\n#bold ¿Hay algún Karling lo suficientemente fuerte como para reunificar su imperio? ¿O las disputas familiares los dejarán vulnerables ante los oportunistas?#!"

 #Charles the Bald
 bookmark_carolingians_charles_the_bald: "Carlos el Calvo"
 bookmark_carolingians_charles_the_bald_subheading: "Rey de Francia Occidental"
 bookmark_carolingians_charles_the_bald_desc: "En el momento del nacimiento de Carlos, sus hermanastros, ya crecidos, gobernaban sus propios reinos dentro del Imperio carolingio. Sin corona propia, pasó a ser conocido como "el Calvo", aunque finalmente heredó Aquitania y Francia Occidental. En el futuro incluso heredará Italia y el propio Sacro Imperio Romano Germánico, pero su línea no perseverará: su último nieto morirá sin hijos sólo siete años después de su propia muerte.\n\n#bold ¿Puedes cambiar el curso de la historia y asegurar una larga y próspera línea de descendientes de Carlos?#!"

 bookmark_carolingians_charles_the_bald_alt_judith: "$Judith$"
 bookmark_carolingians_charles_the_bald_alt_louis: "$Louis$ $nick_the_stammerer$"

 #King Lothaire
 bookmark_carolingians_king_lothaire: "Lotario II"
 bookmark_carolingians_king_lothaire_subheading: "Rey de Lotharingia"
 bookmark_carolingians_king_lothaire_desc: "Aunque estaba enamorado de su amante Waldrada, el padre de Lothaire le obligó a contraer matrimonio político con Teutberga. Su unión no produjo hijos, y la vida de Lothaire ha sido una lucha continua para divorciarse de su esposa y conseguir la legitimación de sus hijos bastardos. Aunque nunca deja de intentarlo, Lothaire morirá sin un heredero legal.\n\n#bold ¿Podrá superar las maquinaciones de los que conspiran contra usted y asegurar la continuidad de su casa?#!"

 bookmark_carolingians_king_lothaire_alt_waldrada: "$Waldrada$"
 bookmark_carolingians_king_lothaire_alt_teutberga: "$Teutberga$"

 #Ludwig the German
 bookmark_carolingians_ludwig_the_german: "Luis el Germánico"
 bookmark_carolingians_ludwig_the_german_subheading: "Rey de Francia Oriental"
 bookmark_carolingians_ludwig_the_german_desc: "Luis, un hombre ambicioso, ha intentado durante mucho tiempo reconquistar las partes del Imperio que considera su derecho de nacimiento. Sin embargo, estas ambiciones han sufrido un revés tras otro, ya que sus diversas campañas militares han acabado en fracaso y sus hijos rebeldes le han arrebatado la mayoría de sus tierras.\n\n#bold ¿Podrás revertir las desgracias de Luis y recuperar el Imperio para sus descendientes, o sus hijos están destinados a quedar relegados a una mera nota a pie de página en la historia?#!"

 bookmark_carolingians_ludwig_the_german_alt_youngerludwig: "$Ludwig$ $nick_the_younger$"
 bookmark_carolingians_ludwig_the_german_alt_karl: "$Karl$"

 #King Louis of Italy
 bookmark_carolingians_king_louis: "Luis II"
 bookmark_carolingians_king_louis_subheading: "Emperador de Italia"
 bookmark_carolingians_king_louis_desc: "El poder imperial había disminuido tanto cuando Luis fue coronado emperador del Sacro Imperio que el título ya no ofrecía ninguna autoridad real. Aunque consigue recuperar el Reino de Provenza, los tíos y el hermano de Luis, sin ninguna obligación de lealtad a la Corona Imperial, siguen actuando a su antojo. Con unos vecinos pendencieros y un reino inestable, Luis II morirá antes de engendrar un hijo.\n\n#bold ¿Puedes recuperar todos los territorios perdidos del Imperio y restablecer la Corona Imperial como una verdadera potencia?#!"

 bookmark_carolingians_king_louis_alt_ermengarde: "$Ermengarde$"
 bookmark_carolingians_king_louis_alt_engelberga: "$Engelberga$"

 # King Karlmann of Bavaria
 bookmark_carolingians_king_karlmann: "Carlomán"
 bookmark_carolingians_king_karlmann_subheading: "Rey de Baviera"
 bookmark_carolingians_king_karlmann_desc: "Hijo mayor de Luis el Germánico, Carlomán se rebeló contra su padre y le obligó a darle el control de las tierras de Baviera. Ampliará este dominio en guerras con los eslavos del este y más tarde será incluso elegido rey de Italia, aunque un desafortunado ataque le obligará a abdicar los tronos de Baviera e Italia en sus hermanos menores. Morirá pocos años después.\n\n#bold Con un poco de suerte, ¿podrá evitar el desafortunado fallecimiento de Karlmann y establecer un legado que perdure en el tiempo?#!"

 bookmark_mutazz: "Al-Mu'tazz"
 bookmark_mutazz_subheading: "Califato del Califato Abbasid"
 bookmark_mutazz_desc: "al-Muʿtazz bi-'llāh fue el califa abbasí de 866 a 869, durante un periodo de extrema inestabilidad interna en el califato abbasí, conocido como la "Anarquía de Samarra". Su reinado marca el apogeo de la decadencia de la autoridad central del califato y el clímax de las tendencias centrífugas, que se manifiestan en la aparición de las dinastías autónomas de los tuluníes en Egipto y de los saffaríes en Oriente, en los levantamientos alíes en Hiyaz y Tabaristán y en los primeros brotes de la gran rebelión del Zanj en el bajo Irak."

 bookmark_saffar: "Ya!"
 bookmark_saffar_subheading: "Emir del Emirato Saffarid"
 bookmark_saffar_desc: "Ya'qūb ibn al-Layth al-Saffār fue un calderero persa y el fundador de la dinastía Saffarid de Sistán, con capital en Zaranj. Bajo su liderazgo militar conquistó gran parte de las porciones orientales del Gran Irán, que consiste en el actual Irán, Afganistán, Turkmenistán, Uzbekistán, Tayikistán, así como porciones del oeste de Pakistán y una pequeña parte de Irak."

 bookmark_basil: "Basilio I"
 bookmark_basil_subheading: "Basileo del Imperio Bizantino"
 bookmark_basil_desc: "Basilio I, llamado el Macedonio, fue un emperador bizantino que reinó del 867 al 886. Nacido como un simple campesino en el tema de Macedonia, ascendió en la corte imperial. Entró al servicio de Teofilitzes, pariente del emperador Miguel III (r. 842-867), y recibió una fortuna del rico Danielis. Se ganó el favor de Miguel III, con cuya amante se casó por orden del emperador, y fue proclamado coemperador en 866. Ordenó el asesinato de Miguel al año siguiente. A pesar de sus humildes orígenes, demostró una gran habilidad en la gestión de los asuntos de Estado y fue el fundador de la dinastía macedonia. A su muerte le sucedió su hijo León VI."


 bookmark_carolingians_king_karlmann_alt_arnulf: "$Arnulf$"
 bookmark_carolingians_king_karlmann_alt_hemma: "$Hemma$"


 #1018


 bm_1018: "Canuto el Grande"
 bm_1018_desc: "La muerte de Harald II de Dinamarca en 1018 da paso a la creación del legendario Imperio del Mar del Norte, ya que el hermano de Harald, Knut, recientemente coronado rey de Inglaterra tras su victoria sobre los anglosajones, hereda también el trono de Dinamarca. Mientras los vikingos dominan las costas del norte de Europa, los bizantinos observan con interés la guerra civil de los rurikíes, que buscan extender su influencia tras haber vencido finalmente a su antiguo enemigo el Imperio Búlgaro y restaurado sus fronteras a orillas del Danubio. Al otro lado del Mediterráneo, los fatimíes se mantienen firmes en el Levante, aunque bajo el férreo control del trastornado califa al-Hakim. En la frontera oriental del mundo musulmán, los gaznávidas se adentran en las ricas tierras del Punjab y en Persia, mientras equilibran sus frágiles relaciones con los turcos de las estepas, cuya gran saga de migraciones y conquistas está a punto de desarrollarse..."

 bookmark_canute: "Canuto el Grande"
 bookmark_canute_subheading: "Rey de Inglaterra"
 bookmark_canute_desc: "Cnut el Grande, también conocido como Canuto, fue rey de Dinamarca, Inglaterra y Noruega, a menudo denominados conjuntamente como el Imperio del Mar del Norte durante su gobierno. Como príncipe danés, Canuto ganó el trono de Inglaterra en 1016, tras siglos de actividad vikinga en el noroeste de Europa. Su posterior acceso al trono danés en 1018 unió las coronas de Inglaterra y Dinamarca. Canuto trató de mantener esta base de poder uniendo a daneses e ingleses bajo los lazos culturales de la riqueza y las costumbres, así como mediante la pura brutalidad. Tras una década de conflictos con sus oponentes en Escandinavia, Cnut reclamó la corona de Noruega en Trondheim en 1028. En 1031, Malcolm II de Escocia también se sometió a él, aunque la influencia anglo-noruega sobre Escocia era débil y finalmente no perduró a la muerte de Cnut."

 bookmark_ere1018: "Basilio II"
 bookmark_ere1018_subheading: "Basileo del Imperio Bizantino"
 bookmark_ere1018_desc: "Basilio II, apodado el asesino de búlgaros, fue el emperador bizantino de mayor rango durante casi 50 años. También llevó a cabo una campaña contra el jaganato jázaro que hizo que el Imperio bizantino obtuviera parte de Crimea y una serie de exitosas campañas contra el reino de Georgia. A pesar de la guerra casi constante, Basilio se distinguió como administrador, reduciendo el poder de las grandes familias terratenientes que dominaban la administración y el ejército del Imperio, llenando su tesoro y dejándolo con su mayor extensión en cuatro siglos. Aunque sus sucesores fueron en gran medida gobernantes incapaces, el Imperio floreció durante décadas tras la muerte de Basilio. Una de las decisiones más importantes tomadas durante su reinado fue ofrecer la mano de su hermana Ana a Vladimir I de Kiev a cambio de apoyo militar, formando así la unidad militar bizantina conocida como la Guardia Varangia."

 bookmark_kabulistan1018: "Mahmud"
 bookmark_kabulistan1018_subheading: "Sultán del Imperio Ghaznavid"
 bookmark_kabulistan1018_desc: "Mahmud de Ghazni fue el primer gobernante independiente de la dinastía turca de los gaznávidas, que gobernó desde 999 hasta 1030. A su muerte, su reino se había transformado en un extenso imperio militar, que se extendía desde el noroeste de Irán propiamente dicho hasta el Punjab en el subcontinente indio, Khwarazm en Transoxiana y Makran. Altamente persianizado, el sultán Mahmud continuó con las costumbres burocráticas, políticas y culturales de sus predecesores, los samánidas, que sentaron las bases de un estado persa en el noroeste de la India. Su capital, Ghazni, se convirtió en un importante centro cultural, comercial e intelectual del mundo islámico, casi rivalizando con la importante ciudad de Bagdad."

 bookmark_persia1018: "Abu Shuja"
 bookmark_persia1018_subheading: "Shahanshah del Imperio Buyid"
 bookmark_persia1018_desc: "Abu Shuja, fue el emir buyí de Fars (1012-1024) y de Irak (1012-1021). En 1018, el sultán al-Dawla acudió de nuevo a Irak, en un intento de mantener relaciones amistosas con el vecino amirato de Mosul. Qawam al-Dawla, aprovechando la presencia de su hermano en el oeste, invadió Fars con el apoyo de los gaznávidas. El ataque fracasó y el de Qawam al-Dawla marcó la división del estado buyí. Tras rechazar el ataque de Qawam al-Dawla, el sultán al-Dawla regresó a Irak para consolidar su dominio en la zona. Las tierras de la marcha de la región, que se habían resistido durante mucho tiempo a la autoridad de los buyíes, fueron finalmente subyugadas. Sin embargo, los mercenarios turcos se mostraron descontentos por la presencia de las tropas daylamitas del sultán al-Dawla. Por ello, en 1021 alzaron a un hermano del emir, Musharrif al-Dawla, como gobernante. Tras una larga serie de negociaciones, el sultán al-Dawla reconoció a su hermano como "rey de Irak", a cambio de la sumisión de éste como vasallo. Así, el estado buyí se fracturó."

 bookmark_burgundy1018: "Rodolfo III"
 bookmark_burgundy1018_subheading: "Rey de Borgoña"
 bookmark_burgundy1018_desc: "Rodolfo III fue rey de Borgoña desde 993 hasta su muerte. Fue el último gobernante de un reino independiente de Arles, también llamado Segundo Reino de Borgoña, y el último miembro masculino del grupo borgoñón de la Casa Mayor de Welf. Como último miembro de los Welf borgoñones, Rodolfo fue considerado un gobernante débil por sus contemporáneos. El cronista Wipo de Borgoña lo calificó de afeitado; según Hermann de Reichenau, su gobierno estuvo marcado por la desidia y el caos. Thietmar de Merseburg nombró a los condes borgoñones como verdaderos gobernantes, mientras que Rodolfo sólo ostentaba el título real."

 bookmark_egypt1018: "Al-Hakim"
 bookmark_egypt1018_subheading: "Califato fatimí"
 bookmark_egypt1018_desc: "Abū ʿAlī Manṣūr, fue el sexto califa fatimí. Como ismaelita estuvo en constante conflicto con el califato abasí, que pretendía frenar la difusión del isma'ilismo. Hakim se enfrentó a numerosas dificultades y levantamientos durante su relativamente largo reinado. Las relaciones entre los fatimíes y los qarmatianos de Bahrein también siguieron siendo hostiles. Por otro lado, la política siria de Hakim tuvo éxito, ya que consiguió extender la hegemonía fatimí al emirato de Alepo. Sobre todo, las persistentes rivalidades entre las distintas facciones de los ejércitos fatimíes, especialmente los bereberes y los turcos, ensombrecieron los demás problemas del califato de Hakim. Al-Ḥākim mantuvo relaciones diplomáticas entre el Imperio Fatimí y muchos países diferentes. Fue necesaria una hábil diplomacia para establecer una base amistosa, aunque no neutral, de relaciones con el Imperio bizantino, que tenía objetivos expansivos a principios del siglo XI. Tal vez la misión diplomática de mayor alcance que realizó fue ante la dinastía Song."

 bookmark_poland1018: "Boleslao I el Valiente"
 bookmark_poland1018_subheading: "Rey de Polonia"
 bookmark_poland1018_desc: "Boleslao el Valiente, menos conocido como Bolesław el Grande, fue el primer rey de Polonia. Bolesław I fue un notable político, estratega y estadista. No sólo convirtió a Polonia en un país comparable a las antiguas monarquías occidentales, sino que la elevó a la primera fila de los estados europeos. Boleslao llevó a cabo exitosas campañas militares en el oeste, el sur y el este. Consolidó las tierras polacas y conquistó territorios fuera de las fronteras de la actual Polonia, como Eslovaquia, Moravia, Rutenia Roja, Meissen, Lusacia y Bohemia. Fue un poderoso mediador en los asuntos de Europa Central. Fue un hábil administrador que estableció la "Ley del Príncipe" y construyó muchas fortalezas, iglesias, monasterios y puentes. Introdujo la primera unidad monetaria polaca, la grzywna, dividida en 240 denarios, y acuñó su propia moneda. Bolesław I está considerado como uno de los gobernantes polacos más capaces y consumados del Piast."

 bookmark_novgorod1018: "Yaroslav el Sabio"
 bookmark_novgorod1018_subheading: "Príncipe de Novgorod"
 bookmark_novgorod1018_desc: "Yaroslav el Sabio o Yaroslav I fue el Gran Príncipe de Kiev desde 1019 hasta su muerte. También fue príncipe de Nóvgorod en tres ocasiones, uniendo los principados durante un tiempo. El nombre de bautismo de Yaroslav era Jorge, por San Jorge. Hijo de Vladimir el Grande, el primer príncipe cristiano de Kiev, Yaroslav actuó como virrey de Nóvgorod a la muerte de su padre en 1015. Posteriormente, su hermano mayor superviviente, Sviatopolk I de Kiev, mató a tres de sus otros hermanos y se hizo con el poder en Kiev. Yaroslav, con el apoyo activo de los novgorodianos y la ayuda de mercenarios varegos, derrotó a Sviatopolk y se convirtió en el Gran Príncipe de Kiev en 1019. Bajo el mandato de Yaroslav se inició la codificación de las costumbres legales y las disposiciones principescas, y este trabajo sirvió de base para un código de leyes llamado Russkaya Pravda. Durante el largo reinado de Yaroslav, la Rus de Kiev alcanzó el cenit de su florecimiento cultural y su poderío militar."

 bookmark_hungary1018: "Esteban I"
 bookmark_hungary1018_subheading: "Rey de Hungría"
 bookmark_hungary1018_desc: "Esteban I, también conocido como el rey San Esteban, fue el primer rey de Hungría desde el año 1000 o 1001. Tras suceder a su padre en 997, Esteban tuvo que luchar por el trono contra su pariente, Koppány, que contaba con el apoyo de un gran número de guerreros paganos. Derrotó a Koppány con la ayuda de caballeros extranjeros, como Vecelin, Hont y Pázmány, y de señores nativos. Esteban estableció al menos un arzobispado, seis obispados y tres monasterios benedictinos, lo que hizo que la Iglesia húngara se desarrollara independientemente de los arzobispos del Sacro Imperio Romano Germánico. Fomentó la difusión del cristianismo imponiendo severos castigos por ignorar las costumbres cristianas. Su sistema de administración local se basaba en condados organizados en torno a fortalezas y administrados por funcionarios reales."

 bookmark_france1018: "Roberto II"
 bookmark_france1018_subheading: "Rey de Francia"
 bookmark_france1018_desc: "Roberto II, llamado el Piadoso o el Sabio, fue rey de los francos desde 996 hasta 1031, el segundo de la casa Capet. Nació en Orleans, hijo de Hugo Capeto y Adelaida de Aquitania. Roberto se distinguió por un reinado extraordinariamente largo para la época. Sus 35 años de reinado se caracterizaron por sus intentos de ampliar el dominio real por cualquier medio, especialmente por su larga lucha por conseguir el Ducado de Borgoña."

 bookmark_leon1018: "Alfonso el Noble"
 bookmark_leon1018_subheading: "Rey de León"
 bookmark_leon1018_desc: "Alfonso V, llamado el Noble, fue rey de León del año 999 al 1028. Se sabe lo suficiente de él para justificar la creencia de que tenía algunas de las cualidades de un soldado y un estadista. Al igual que otros reyes de León, utilizó el título de emperador para afirmar su posición entre los gobernantes cristianos de España. Alfonso comenzó la labor de reorganización del reino cristiano del noroeste de la Península Ibérica tras un periodo muy desastroso de guerras civiles e incursiones árabes."

 bookmark_hre1018: "Enrique II"
 bookmark_hre1018_subheading: "Santo Emperador Romano"
 bookmark_hre1018_desc: "Enrique II, también conocido como San Enrique el Exuberante, fue emperador del Sacro Imperio desde 1014. Enrique pasó la mayor parte de su reinado preocupado por la renovación de los territorios imperiales al norte de los Alpes, una política resumida en su sello como Renovatio regni Francorum, que sustituyó a la Renovatio imperii Romanorum de Otón. Una serie de conflictos con el duque polaco Bolesław I, que ya había conquistado varios países de su entorno, requirió toda la atención de Enrique II y años de maniobras políticas y militares. Sin embargo, Enrique dirigió tres expediciones a Italia para hacer valer su reivindicación feudal, dos veces para reprimir revueltas secesionistas y una para hacer frente a los intentos bizantinos de obtener el dominio del sur de Italia. El gobierno de Enrique II se ha caracterizado como un periodo de autoridad centralizada en todo el Sacro Imperio Romano Germánico. Consolidó su poder cultivando vínculos personales y políticos con la Iglesia Católica."

 bookmark_georgia1018: "Jorge I"
 bookmark_georgia1018_subheading: "King of Georgia"
 bookmark_georgia1018_desc: "Jorge I, de la Casa de Bagrationi, fue el rey de Georgia desde 1014 hasta su muerte en 1027. Pasó la mayor parte de sus trece años de reinado librando una sangrienta e infructuosa guerra territorial con el Imperio Bizantino."

 bookmark_salerno1018: "Guaimario III"
 bookmark_salerno1018_subheading: "Príncipe de Salerno"
 bookmark_salerno1018_desc: "Guaimario III fue el príncipe lombardo de Salerno desde alrededor de 994 hasta su muerte. Bajo su reinado, Salerno entró en una época de gran esplendor. Opulenta Salernum era la inscripción de sus monedas. Convirtió a Amalfi, Gaeta y Sorrento en sus vasallos y anexionó gran parte de la Apulia y Calabria bizantinas."

 debug_bm_1340_history: "#D Depuración historia: 1340#!"
 debug_bm_1340_history_desc: "Ejecuta esto para depurar archivos de historia hasta 1340"


 #Pre-Hastings 1066

 bm_1066: "La Alta Edad Media"
 bm_1066_desc: "A finales del siglo X y principios del XI, el mundo musulmán estaba cambiando, y dinastías turcas como los selyúcidas y los gaznávidas dominaban ahora Persia. El Imperio Bizantino seguía resistiendo, pero se avecinaban tiempos peores. La Europa continental central y occidental estaba dividida entre Francia y un fuerte Sacro Imperio Romano, mientras que los reyes cristianos avanzaban contra una España musulmana fracturada y debilitada. Escandinavia se convertía rápidamente al cristianismo, y los colonos nórdicos de Rusia y Gran Bretaña se habían asimilado a las poblaciones locales. Sin embargo, los descendientes de los vikingos en Normandía e Italia preparaban nuevas conquistas, y se acercaba el momento de la Primera Cruzada..."

 # Murchad Briain, Duke of Munster, Ireland
 bookmark_rags_to_riches_petty_king_murchad: "Murchad"
 bookmark_rags_to_riches_petty_king_murchad_subheading: "Pequeño rey de Munster"
 bookmark_rags_to_riches_petty_king_murchad_desc: "A principios del siglo XI, la Alta Realeza de Irlanda ha caído dentro y fuera del alcance de la casa Briain, ya que las casas nobles irlandesas han guerreado por el territorio, entre sí y contra los colonos vikingos. Sin embargo, a pesar de provenir de una línea de hombres considerados destinados a la realeza, no se sabe mucho sobre el breve reinado de Murchad sobre la pequeña zona de Munster.\n\n#bold Con tu ayuda, ¿quizás un miembro de la casa de Briain pueda volver a sentarse en el trono de Irlanda?#!"

 bookmark_rags_to_riches_petty_king_murchad_alt_brian: "$Brian$"
 bookmark_rags_to_riches_petty_king_murchad_alt_bebinn: "$BE_binn$"

 # Matilda di Canossa, Duchess of Tuscany, Italy
 bookmark_rags_to_riches_duchess_matilda: "Matilda"
 bookmark_rags_to_riches_duchess_matilda_subheading: "Duquesa de Toscana"
 bookmark_rags_to_riches_duchess_matilda_desc: "Por habilidad o circunstancia, Matilde de Canossa está destinada a heredar un importante territorio en el norte de Italia. Se convertirá en una gobernante poderosa y con buenos contactos, llegando a alcanzar el rango único de vicaria imperial y virreina de Italia. Mucho después de su muerte, seguirá siendo una figura legendaria tanto por su piedad como por sus sospechas de brujería.\n\n#bold ¿Puede asegurarse de que el legado de Mathilda perdure y de que el linaje Canossa continúe durante generaciones?#!"

 # Yahya Dhunnunid, Emir (Duke) of Toldeo, Iberia
 bookmark_rags_to_riches_emir_yahya: "Yahya"
 bookmark_rags_to_riches_emir_yahya_subheading: "Emir de Toledo"
 bookmark_rags_to_riches_emir_yahya_desc: "El Reino de Toledo se establecerá a finales del siglo XI, cuando el rey de León se apodere de la ciudad homónima. Esta erradicación del emir Yahya y su influencia significa que la familia Dhunnunid perderá su dominio en la región, donde ha reinado durante generaciones.\n\n#bold Manipulando a tus rivales y encontrando más aliados, ¿tienes lo que hace falta para desafiar a los reyes de la península ibérica y cambiar la historia para la casa Dhunnunid?#!"

 bookmark_rags_to_riches_emir_yahya_alt_zahida: "$Zahida$"
 bookmark_rags_to_riches_emir_yahya_alt_yahya2: "$Yahya$"

 # Vratislav Premyslid, Duke of Bohemia, Czechia
 bookmark_rags_to_riches_duke_vratislav: "Vratislao"
 bookmark_rags_to_riches_duke_vratislav_subheading: "Duke of Bohemia"
 bookmark_rags_to_riches_duke_vratislav_desc: "La familia Přemyslid ha gobernado la región de Bohemia durante cientos de años. Han dependido en gran medida de la Antigüedad para su sucesión, lo que, en el caso del duque Vratislav, acabará provocando serios enfrentamientos con sus hermanos.\n\n#bold Para convertirse en rey de Bohemia, Vratislav tendrá que ser táctico con sus recursos, tanto materiales como no - ¿estás preparado para la tarea?#!"

 bookmark_rags_to_riches_duke_vratislav_alt_judita: "$Judita$"
 bookmark_rags_to_riches_duke_vratislav_alt_ota: "$Ota$ $nick_the_handsome$"


 # Robert 'The Fox' de Hauteville, Duke of Apulia, Sicily
 bookmark_rags_to_riches_duke_robert: "Roberto el Zorro"
 bookmark_rags_to_riches_duke_robert_subheading: "Duque de Apulia"
 bookmark_rags_to_riches_duke_robert_desc: "Roberto comenzó su carrera como ladrón y jefe de una banda de salteadores de caminos. Siendo uno de muchos hermanos, nunca se predijo que el aventurero hijo se convirtiera en un brillante estratega y estadista, gobernando vastas extensiones de tierra - sin embargo, aquí está, un poderoso duque del sur de Italia, listo para emprender el camino de la historia, que permitirá a los Hauteville tener un punto de apoyo en Sicilia durante más de cien años.\n\n#bold Si consigues consolidar el poder en el reino, ¡el Reino de Sicilia espera a su gobernante!#!"

 # Carcía Fernandez, King of Galicia, Iberia
 bookmark_iberia_king_garcia: "García"
 bookmark_iberia_king_garcia_subheading: "Rey de Galicia"
 bookmark_iberia_king_garcia_desc: "Siendo el reino más conflictivo de los tres hermanos, García intentó muchos remedios extremos para estabilizar su gobierno. Sin embargo, la frágil tierra pronto fue demasiado tentadora para su hermano Alfonso, que la invadió en 1071. Este ataque dio inicio a las numerosas guerras que siguieron entre los hermanos, pero García pasaría la mayor parte de este tiempo entre rejas.\n\n#bold ¡Toma las armas contra tus hermanos y lleva este inestable reino a la gloria y la victoria!#!"

 bookmark_iberia_king_alfonso_alt_sancha: "$Sancha$"
 bookmark_iberia_king_alfonso_alt_nuno: "$NuN_o$"

 # Alfonso VI Fernandez, King of León, Iberia
 bookmark_iberia_king_alfonso: "Alfonso VI"
 bookmark_iberia_king_alfonso_subheading: "Rey de León"
 bookmark_iberia_king_alfonso_desc: "Hijo mediano y favorito de su padre, Alfonso heredó el rico reino medio de León. Pasó a superar y subyugar a sus dos hermanos, y gobernó el reino reunido de su padre.\n\n#bold A través de la diplomacia y la agresión política y familiar, ¿tienes lo que se necesita para unir los tres reinos bajo una sola bandera?#!"

 # Sancho II Fernandez, King of Castille, Iberia
 bookmark_iberia_king_sancho: "Sancho II"
 bookmark_iberia_king_sancho_subheading: "Rey de Castille"
 bookmark_iberia_king_sancho_desc: "Sancho fue defraudado de su herencia completa por la división de la tierra entre los tres hermanos por parte de su padre. Hombre de oportunidades, se alzó rápidamente en armas contra sus hermanos en cuanto la paz empezó a desmoronarse, pero sólo llegó a gobernar brevemente el reino reunificado antes de ser asesinado.\n\n#bold A través de la acción militar y la planificación, ¿puedes restaurar el reino completo a su gloria bajo el único gobernante legítimo, y mantener el poder?#!"

 bookmark_iberia_king_sancho_alt_rodrigo: "$Rodrigo$"

 # Urraca Fernandez, Countess of Zamorra, Iberia
 bookmark_iberia_infanta_urraca: "Urraca"
 bookmark_iberia_infanta_urraca_subheading: "Condesa de Zamora"
 bookmark_iberia_infanta_urraca_desc: "Urraca, la mayor de los hijos de Fernando, ejerció una amplia influencia tanto sobre sus hermanos como sobre la Iglesia. Ella y su hermana Elvira recibieron el señorío de todos los monasterios de los tres reinos, y no se quedó de brazos cruzados mientras sus hermanos se destrozaban entre sí.\n\n#bold Para superar a sus hermanos y asegurar su lugar en la historia, Urraca necesita paciencia y audacia.#!"

 bookmark_iberia_infanta_urraca_alt_elvira: "$Elvira$"

 # Antso IV Gartziez, King of Navarra, Iberia
 bookmark_iberia_king_antso: "Antso IV"
 bookmark_iberia_king_antso_subheading: "Rey de Navarra"
 bookmark_iberia_king_antso_desc: "Muchos señores del oeste del reino abandonaron al rey Antso después de que éste subiera al trono tras el fallecimiento de sus padres. Pronto se vio envuelto en una guerra con su primo, el rey Sancho, en la que Antso fue derrotado, y tras un gobierno marcado por la guerra y la derrota fue asesinado por sus propios hermanos.\n\n#bold ¡Reescribe la historia, sé más astuto que tu familia y asegura tu dominio y patrimonio!#!"

 bookmark_hastings_england: "Harold"
 bookmark_hastings_england_subheading: "Rey de Inglaterra"
 bookmark_hastings_england_desc:2 "Harold Godwinson era el líder de una poderosa casa noble, y el cuñado del Rey, cuando el Rey Eduardo, sin hijos, murió. Ahora, elegido nuevo rey de Inglaterra por sus pares, se enfrenta al reto de mantener el trono, ya que el codicioso duque de Normandía, así como el rey Harald de Noruega, estimulados y ayudados por el hermano exiliado de Harold, tratan de sustituirlo.\n\n#bold Con un gran ejército a sus espaldas y el apoyo de los señores anglosajones, ¿se darán cuenta los lobos de que han mordido más de lo que pueden masticar?#!"

 bookmark_hastings_england_alt_tostig: "$Tostig$"
 bookmark_hastings_england_alt_eadgifu: "$Eadgifu$ $nick_the_fair$"

 bookmark_hastings_normandy: "Guillermo el Bastardo"
 bookmark_hastings_normandy_subheading: "Duke of Normandy"
 bookmark_hastings_normandy_desc: "La Casa de Normandía remonta su linaje a los vikingos nórdicos, y se estableció en el continente europeo hace más de 200 años. Ahora, Guillermo II sueña con llevar a su familia a gobernar el Reino de Inglaterra, y cree que su condición de sucesor al trono fue prometida por el difunto rey Eduardo, e incluso reconocida por el propio Harold Godwinson. Sin embargo, ahora que Eduardo se ha ido, Harold ha roto su juramento y ha tomado la corona para sí mismo.\n\n#bold Guillermo está en guerra con Inglaterra. Podrá reunir sus fuerzas y reclamar lo que es suyo por derecho?#!"

 bookmark_hastings_normandy_alt_robert: "$Robert$ $nick_the_curthose$"
 bookmark_hastings_normandy_alt_william: "$William$ $nick_the_red$"

 bookmark_hastings_norway: "Harald Hardrada"
 bookmark_hastings_norway_subheading: "King of Norway"
 bookmark_hastings_norway_desc: "Habiendo demostrado un formidable talento militar desde la juventud, Harald ha intentado recientemente, y fracasado, conquistar Dinamarca. Ahora, mira más allá del mar - por antiguo contrato, la corona de Inglaterra debería haber pasado a Harald, cuando el último rey murió sin heredero. Pero, en cambio, los anglosajones han puesto a Harold Godwinson en el trono. Por suerte, el falso Rey ha hecho enemigos, y Tostig Godwinson, el propio hermano de Harold, vive exiliado en Noruega...\n\n#bold Utilizando a sus propios enemigos en su contra, ¿podrás dar a este vikingo varguiano el control del Mar del Norte?#!"

 bookmark_hastings_norway_alt_olaf: "$Olaf$"
 bookmark_hastings_norway_alt_ingegerd: "$Ingegerd$"

 bookmark_hastings_denmark: "Svend"
 bookmark_hastings_denmark_subheading: "King of Denmark"
 bookmark_hastings_denmark_desc: "Con lazos de sangre con Inglaterra y Noruega, Svend tiene fuertes pretensiones a ambos tronos. Por desgracia, sus ejércitos son pequeños e indisciplinados, lo que hace inviable una guerra de conquista. Sin embargo, hay otras formas de perseguir sus sueños...\n\n#bold Si sus hijos se casaran con familias poderosas, podría conceder muchas alianzas útiles, alianzas que podría aprovechar para fundar un imperio que rivalizara con la propia Roma.#!"

 bookmark_hastings_denmark_alt_harald: "$Harald$ $nick_the_whetstone$"
 bookmark_hastings_denmark_alt_knud: "$Knud$"

 bookmark_hastings_scotland: "Malcolm"
 bookmark_hastings_scotland_subheading: "King of Scotland"
 bookmark_hastings_scotland_desc: "Conocido en Escocia como el "Gran Jefe", la situación de Malcolm III es tenue, pero llena de oportunidades. Al sur, las ricas tierras de Northumbria son vulnerables, ya que Inglaterra está desgarrada por la guerra, pero los señores de la guerra nórdicos y los montañeses gaélicos aún impugnan el gobierno del rey en casa.\n\n#bold Las Islas Británicas están repletas de peligros y oportunidades: ¿puede arrancar una rosa de este jardín de espinas?#!"

 bookmark_egypt1066: "Al-Mustansir Billah"
 bookmark_egypt1066_subheading: "Califato fatimí"
 bookmark_egypt1066_desc: "Abū Tamīm Ma'ad al-Mustanṣir bi-llāh fue el octavo califa fatimí desde 1036 hasta 1094. Fue uno de los gobernantes musulmanes que más tiempo reinó. El califa al-Mustanṣir bi-llāh fue el último imán antes de que una desastrosa división dividiera el califato en dos. Una parte del califato era leal al hijo mayor de al-Mustanṣir bi-llāh, Nizār al-Muṣtafā li-Dīn Allāh, que posteriormente administró desde Alamūt, en Irán. La otra parte del califato era leal al hijo menor de al-Mustanṣir bi-llāh, Aḥmad al-Mustaʿlī bi-llāh, que posteriormente administró desde El Cairo."

 bookmark_persia1066: "Alp Arslan"
 bookmark_persia1066_subheading: "Sultán del Imperio Seljuk"
 bookmark_persia1066_desc: "Alp Arslan, fue el segundo sultán del Imperio Selyúcida y bisnieto de Seljuk, el fundador epónimo de la dinastía. Como sultán, Alp Arslan amplió enormemente el territorio selyúcida y consolidó su poder, derrotando a sus rivales del sur y el noroeste. Su victoria sobre los bizantinos en la batalla de Manzikert, en 1071, marcó el inicio de la colonización turcomana de Anatolia. Por su destreza militar y sus habilidades de lucha obtuvo el nombre de Alp Arslan, que significa "León heroico" en turco."

 bookmark_india1066: "Someshvara I"
 bookmark_india1066_subheading: "Maharaja del Chalukya Occidental"
 bookmark_india1066_desc: "Someshvara I fue un rey de los Chalukyas occidentales. Sus numerosos éxitos militares en la India central le convirtieron en un formidable gobernante de un vasto imperio. Durante su gobierno, el imperio chalukiano se extendió hasta Gujarat y la India central en el norte"

 bookmark_hre1066: "Enrique IV"
 bookmark_hre1066_subheading: "Santo Emperador Romano"
 bookmark_hre1066_desc: "Enrique IV fue emperador del Sacro Imperio Romano Germánico de 1084 a 1105, rey de Alemania de 1054 a 1105 y de Italia y Borgoña de 1056 a 1105. Era hijo de Enrique III, emperador del Sacro Imperio Romano Germánico -el segundo monarca de la dinastía salina- y de Inés de Poitou. Tras la muerte de su padre, el 5 de octubre de 1056, Enrique quedó bajo la tutela de su madre. Ella hizo donaciones a los aristócratas alemanes para asegurar su apoyo. A diferencia de su difunto marido, no podía controlar la elección de los papas, por lo que la idea de la "libertad de la Iglesia" se fortaleció durante su gobierno. El papel preeminente de Enrique en la Controversia de las Investiduras, su "marcha a Canossa" y sus conflictos con sus hijos y su esposa establecieron su controvertida reputación, ya que algunos lo consideraban el estereotipo de un tirano y otros lo describían como un monarca ejemplar que protegía a los pobres."

 bookmark_ere1066: "Constantino X Doukas"
 bookmark_ere1066_subheading: "Basileo del Imperio Bizantino"
 bookmark_ere1066_desc: "Constantino X Doukas or Dukas, fue emperador bizantino de 1059 a 1067. Fue el fundador y el primer gobernante de la efímera dinastía de los ducados. Durante su reinado, los normandos se apoderaron de gran parte de los territorios bizantinos restantes en Italia, mientras que en los Balcanes los húngaros ocuparon Belgrado. También sufrió las derrotas del sultán selyúcida Alp Arslan.."


 #Post Hastings


 bm_1066_posthastings: "Guillermo el Conquistador"
 bm_1066_posthastings_desc: "Victorioso en la reñida batalla de Hastings, Guillermo, duque de Normandía, se ha proclamado rey de Inglaterra. Los señores sajones desplazados se enfurecen contra los usurpadores francófonos a medida que un feudo tras otro es entregado a los fieles seguidores de Williams. En Anatolia, los turcos selyúcidas al mando del gran sultán Alp Arslan están a punto de invadir el Imperio Bizantino en una lucha que determinará el destino de Asia Menor..."

 bookmark_hastings_normandyengland: "Guillermo el Conquistador"
 bookmark_hastings_normandyengland_subheading: "Rey de Inglaterra"
 bookmark_hastings_normandyengland_desc: "Guillermo el Conquistador, descendiente del jefe vikingo Rollo, se convirtió en duque de Normandía a una edad muy temprana, situación que se vio agravada por el hecho de que también era bastardo. Desde el principio fue utilizado constantemente como peón por las facciones rivales del ducado, siendo asesinados sucesivamente sus tutores. Una vez alcanzada la edad adulta, se enfrentó a años de guerra para hacerse con el control total de su ducado, saliendo finalmente victorioso. En 1066 invadió con éxito Inglaterra para reclamar el trono inglés. Pasó el resto de su reinado consolidando y reformando su nuevo reino frente a una oposición a veces feroz."


 ### CHARACTERS

 # 1067

 CONQUERER_WILLIAM: "Guillermo el Conquistador"


#####936


 bm_otto_the_first: "El siglo de hierro"
 bm_otto_the_first_desc: "El 7 de agosto de 936, Otón I fue coronado rey de los germanos. Inició su ardua campaña para aplastar a sus rivales y reconquistar el territorio perdido en Italia para reformar el Sacro Imperio Romano. Los magiares se establecieron en la cuenca de los Cárpatos y comenzaron a dejar su huella en el mundo mientras conquistaban y saqueaban a sus vecinos, llegando a ser temidos en toda Europa. En el norte, los cristianos intentaban introducirse en la península escandinava para empezar a convertir a los reyes paganos, pero la fe germánica seguía siendo fuerte entre los vikingos. En Bagdad, al sureste, el antiguo califato abasí, que gobernaba un imperio que se extendía desde Persia hasta Hispania, cayó finalmente por culpa de las luchas internas, quedándose sólo con el corazón de su antiguo imperio. Y en las costas de África se levantó un nuevo rival en forma de califato fatimí, dispuesto a ocupar las regiones vacantes dejadas por su adversario. \n\n#bold ¿Quién saldrá victorioso después de este tumultuoso momento de la historia?#!"

 bookmark_otto: "Otón el Grande"
 bookmark_otto_subheading: "Rey de Francia Oriental"
 bookmark_otto_desc: "Otón fue coronado rey de los germanos tras la muerte de su padre Enrique I. Al principio de su reinado tuvo que rechazar una rebelión del duque Eberhard de Baviera, así como luchar en una guerra contra Luis IV de Francia Occidental y el duque Gilberto de Lorena. Tras conseguir la paz en la guerra, Otón pasó a luchar por el trono de Italia y a rechazar la amenaza húngara en el este. En sus últimos años, tras su coronación como emperador del Sacro Imperio Romano Germánico, tuvo que seguir luchando en Italia para mantener su nuevo imperio bajo control. La dinastía otomana siguió controlando el imperio durante casi medio siglo después de su muerte, hasta que finalmente terminó con el fallecimiento de Enrique II en 1024."

 bookmark_Qaim: "Califa Al-Qa'im"
 bookmark_Qaim_subheading: "Califato fatimí"
 bookmark_Qaim_desc: "Al-Qa'im fue el segundo califa del califato fatimí de Ifriqiya y gobernó de 934 a 946. Es el duodécimo imán según la fe ismaelita."

 bookmark_ethelstan: "Æthelstan"
 bookmark_ethelstan_subheading: "Rey de Inglaterra"
 bookmark_ethelstan_desc: "Æthelstan fue rey de los ingleses desde 927 hasta 939, cuando murió. Era hijo del rey Eduardo el Viejo y de su primera esposa, Ecgwynn. Los historiadores modernos lo consideran el primer rey de Inglaterra y uno de los mayores reyes anglosajones. Æthelstan centralizó el gobierno; aumentó el control sobre la elaboración de los estatutos y convocó a sus consejos a personalidades de zonas lejanas. A estas reuniones asistían también gobernantes de fuera de su territorio, especialmente reyes galeses, que reconocían así su dominio. Se conservan más textos legales de su reinado que de cualquier otro rey inglés del siglo X. Muestran su preocupación por los robos generalizados y la amenaza que suponían para el orden social. Sus reformas legales se basaron en las de su abuelo, Alfredo el Grande. Æthelstan fue uno de los reyes sajones occidentales más piadosos, y era conocido por coleccionar reliquias y fundar iglesias. Su casa fue el centro de la enseñanza inglesa durante su reinado y sentó las bases de la reforma monástica benedictina de finales de siglo."

 bookmark_arpad: "Zoltán"
 bookmark_arpad_subheading: "Gran Príncipe de Hungría"
 bookmark_arpad_desc: "Arpad fue rey de los húngaros a principios del siglo XX. No se sabe mucho sobre su reinado, aunque se cree que todos los futuros reyes húngaros descienden de él."

 bookmark_hakon: "Haakon el Bueno"
 bookmark_hakon_subheading: "King of Norway"
 bookmark_hakon_desc: "Haakon Haraldsson, también Haakon el Bueno, fue el rey de Noruega de 934 a 961. Destacó por sus intentos de introducir el cristianismo en Noruega."

 bookmark_andalusia: "Abd al-Rahman III"
 bookmark_andalusia_subheading: "Califa de Córdoba"
 bookmark_andalusia_desc: "Abd al-Raḥmān III fue el emir omeya de Córdoba entre 912 y 929, momento en el que fundó el califato de Córdoba, siendo su primer califa hasta su muerte. 'Abd al-Raḥmān obtuvo el laqab (sobrenombre) al-Nasir li-Dīn Allāh -Defensor de la Fe de Dios- a los 20 años, cuando apoyó a los magrebíes en el norte de África contra la expansión fatimí y ascendió al califato. Su reinado de medio siglo (912-961) de al-Andalus -la España ibérica musulmana- fue conocido por su tolerancia religiosa."

 bookmark_yngvar: "Igor de Kiev"
 bookmark_yngvar_subheading: "Konung de Kiev"
 bookmark_yngvar_desc: "Igor el Viejo fue un gobernante vargo de la Rus de Kiev desde 912 hasta 945. Igor asedió dos veces Constantinopla en 941 y 944, y aunque el fuego griego destruyó parte de su flota, concluyó con el emperador romano de Oriente Constantino VII un tratado favorable (945), cuyo texto ha conservado la crónica."

 bookmark_samanid: "Nasr II"
 bookmark_samanid_subheading: "Amir del Imperio Samanid"
 bookmark_samanid_desc: "Nasr ibn Ahmad fue el gobernante (emir) de Transoxiana y Jurasán como jefe de la dinastía samánida desde 914 hasta 943. Su reinado marcó el punto álgido de la fortuna de la dinastía samánida."

 bookmark_burid: "Imad al-Dawla"
 bookmark_burid_subheading: "Shahanshah del Imperio Buyid"
 bookmark_burid_desc: "Alí ibn Buya fue el fundador de la dinastía de los buyíes. Como iraníes daylamitas, los buyíes revivieron conscientemente símbolos y prácticas del Imperio sasánida de Irán. A partir de 'Adud al-Dawla, utilizaron el antiguo título sasánida de Shahanshah. En su mayor extensión, la dinastía buyí abarcó el territorio de la mayor parte del actual Irán, Irak, Kuwait y Siria, junto con partes de Omán, los EAU, Turquía, Afganistán y Pakistán. Durante los siglos X y XI, justo antes de la invasión de los turcos selyúcidas, y especialmente bajo el rey "Adud al-Dawla, los buyíes fueron la dinastía más poderosa e influyente de Oriente Medio."

 bookmark_leon936: "Ramiro II"
 bookmark_leon936_subheading: "Rey de León"
 bookmark_leon936_desc: "Ramiro II fue rey de León desde 931 hasta su muerte. Inicialmente rey titular sólo de una parte menor del reino, obtuvo la corona de León (y con ella la de Galicia) tras suplantar a su hermano Alfonso IV y a su primo Alfonso Fróilaz en el año 931. Realizó una activa campaña contra los moros, que se referían a él como el Diablo debido a su ferocidad y fervor en la batalla. Derrotó a las huestes del califa omeya Abderramán III en la batalla de Simancas (939)."

 bookmark_ere936: "Romanos I"
 bookmark_ere936_subheading: "Basileo del Imperio Bizantino"
 bookmark_ere936_desc: "El 25 de marzo de 919, a la cabeza de su flota, Lekapenos tomó el palacio de Boukoleon y las riendas del gobierno. Inicialmente, fue nombrado magistros y megas hetaireiarches, pero se movió rápidamente para consolidar su posición: en abril de 919 su hija Helena se casó con Constantino VII, y Lekapenos asumió el nuevo título de basileopator; el 24 de septiembre, fue nombrado César; y el 17 de diciembre de 919, Romanos Lekapenos fue coronado emperador mayor. Su reinado fue testigo de una larga guerra con el Imperio Búlgaro que derrotó al Imperio Bizantino. El último reinado de Romanos estuvo marcado por el mayor interés del antiguo emperador por el juicio divino y su creciente sentimiento de culpa por su papel en la usurpación del trono a Constantino VII."



 ### CHARACTERS

 # 936

 OTTO_GREAT: "Otón el Grande"


#####1081


 bm_komnenos_dynasty: "La Alexíada"
 bm_komnenos_dynasty_desc: "Tras una serie de devastadoras pérdidas ante las fuerzas turcas invasoras, el Imperio Bizantino se tambalea. Pero hay esperanza: el gran general Alexios Komnenos acaba de arrebatar el trono al corrupto Nikephoros III. Alexios -cuya vida fue documentada por su hija Anna en "la Alexíada"- y sus sucesores detendrían el declive del Imperio y harían retroceder a los invasores turcos de Anatolia occidental, ganando más tiempo para los debilitados restos del antiguo Imperio Romano. Por el momento, Anatolia está gobernada por Suleyman I, miembro de la dinastía selyúcida, que llama arrogantemente a su nuevo estado el "Sultanato de Rum" (Roma). \n\n#bold ¿Podrá recuperarse el Imperio Romano de Oriente o el sultanato de Ron provocará su caída?#!"

 bookmark_alexios: "Alejo I"
 bookmark_alexios_subheading: "Basileo del Imperio Bizantino"
 bookmark_alexios_desc: "Un gran emperador que luchó tanto contra los turcos selyúcidas como contra los normandos. Sus reformas detuvieron la decadencia imperial, recuperando gran parte de la gloria anterior."

 bookmark_suleyman: "Suleyman I"
 bookmark_suleyman_subheading: "Sultan of Rûm"
 bookmark_suleyman_desc: "Suleyman fundó un estado turco selyúcida independiente en Anatolia y gobernó como sultán selyúcida de Rum. Su padre había luchado contra Alp Arslan por el trono del Gran Imperio Selyúcida. Suleyman huyó con sus tres hermanos tras la muerte de su padre, pero sólo él sobrevivió a las incursiones lanzadas por Alp Arslan."



 ### CHARACTERS

 # 1081

 ALEXIOS: "Alejo"
 SULEYMAN: "Suleyman"


##### 1124


 bm_jerusalem: "Jerusalén en su apogeo"
 bm_jerusalem_desc: "Jerusalén se mantiene fuerte y orgullosa. El Principado de Antioquía ha sido absorbido y el Reino se ha expandido hacia el interior, hacia la península del Sinaí y Damasco. Aunque el tamaño y la fuerza de Jerusalén contribuyen en gran medida a asegurar el dominio católico en el Levante, todo está lejos de estar garantizado. Damasco y Alepo aún se mantienen como guardias contra el enorme sultanato selyúcida en el este, y el califa fatimí se resiente de las pérdidas que sufrió Egipto durante la Primera Cruzada. Jerusalén tiene muchos enemigos y pocos amigos. En la distancia, suena un grito de Yihad..."

 bookmark_baud: "Balduino II"
 bookmark_baud_subheading: "Rey de Jerusalén"
 bookmark_baud_desc: "Balduino I fue el primer conde de Edesa desde 1098 hasta 1100, y el primer rey de Jerusalén desde 1100 hasta su muerte. Al ser el hijo menor de Eustaquio II, conde de Bolonia, y de Ida de Lorena, estaba destinado a la carrera eclesiástica, pero la abandonó y se casó con una noble normanda, Godehilde de Tosny. Recibió el condado de Verdún en 1096, pero pronto se unió al ejército cruzado de su hermano Godofredo de Bouillon y se convirtió en uno de los comandantes más exitosos de la Primera Cruzada."

 bookmark_davit: "David IV"
 bookmark_davit_subheading: "King of Georgia"
 bookmark_davit_desc: "David IV, también conocido como David el Constructor, de la dinastía Bagrationi, fue rey de Georgia desde 1089 hasta su muerte en 1125. Considerado popularmente como el mayor y más exitoso gobernante georgiano de la historia y artífice original de la Edad de Oro georgiana, consiguió expulsar a los turcos selyúcidas del país, ganando la batalla de Didgori en 1121. Sus reformas del ejército y la administración le permitieron reunificar el país y poner la mayor parte de las tierras del Cáucaso bajo el control de Georgia. Amigo de la Iglesia y notable promotor de la cultura cristiana, fue canonizado por la Iglesia Ortodoxa Georgiana."

 bookmark_almir: "Califa al-Amir"
 bookmark_almir_subheading: "Califato fatimí"
 bookmark_almir_desc: "Abu Ali al-Mansur ibn al-Musta'li fue el décimo califa fatimí y el vigésimo imán de la secta ismaelita de Musta'li del Islam chiíta, desde 1101 hasta su muerte en 1130. Hasta 1121, fue un gobernante títere de facto de su tío y suegro, el visir al-Afdal Shahanshah. Cuando éste fue asesinado, posiblemente con la connivencia de al-Amir, el califa nombró visir a al-Ma'mun al-Bata'ihi, pero fue asumiendo un papel cada vez más importante en el gobierno, y después de 1125 gobernó sin visir. Su reinado supuso la pérdida progresiva de todos los bastiones fatimíes en Palestina a manos de los cruzados, excepto Ascalón. Su asesinato en 1130, que dejó como heredero a su hijo pequeño al-Tayyib, sumió al régimen fatimí en una lucha por la sucesión en la que estuvo a punto de colapsar. El régimen fatimí se restableció con la sucesión del primo de al-Amir, al-Hafiz li-Din Allah, en 1132, lo que condujo a la división del ismailismo de Musta'li en las ramas rivales hafizi y tayibi"



 ### CHARACTERS

 # 1124

 BAUD: "Balduino"


 #####


 BM_SELJUK: "Colapso de los Selyúcidas"
 BM_SELJUK_desc: "En lo que resultó ser un efímero periodo de resurgimiento, el sultanato selyúcida ha caído en el desorden, provocado por la captura de Sanjar por las bandas rebeldes de Oghuz y su muerte poco después. Una miríada de ex vasallos, los miembros restantes de la familia selyúcida y los oportunistas están dispuestos a luchar por los restos. El califa suní, los antiguos atabegs y un sinfín de emires, algunos de ellos los últimos restos de la antigua élite persa, rodean el cadáver con hambre. \n\n Mientras tanto, Manuel Komnenos reina en Bizancio y Hungría mira con temor. Manuel, siempre oportunista, había concluido hace tiempo un pacto con el rey de Hungría, István III, por el que el hermano de István, Belá, sería educado en la corte imperial de Constantinopla. Manuel no tenía aún descendencia masculina legítima, y pretendía que Belá se casara con su hija María, para gobernar junto a ella como emperador. Sin embargo, viendo la oportunidad, Manuel decidió actuar contra István y presionar para que su yerno reclamara los ducados de Dalmacia y Croacia. Con esos títulos asegurados, Belá es ahora un vasallo terrateniente de Manuel, y el heredero de los reinos de Croacia y Hungría. Aunque el linaje de los Komnenos parece que puede perder la sede imperial a menos que Manuel tome medidas inmediatas, el Imperio Bizantino está a punto de conseguir el mayor premio que ha tenido en el punto de mira desde que los Komnenoi ocuparon el trono: el amortiguador entre el Sacro Imperio Romano y el Imperio Romano de Oriente."

 bookmark_esfa: "Arslan Shah II"
 bookmark_esfa_subheading: "Sultanía de la Sultanía de Seljuk"
 bookmark_esfa_desc: "El Gran Imperio Seljuk creado por Alp Arslan, que se extendió desde Anatolia y Siria en el oeste hasta el Imperio Ghaznavid en el este, del Mar Negro y Caspio y el Syr Darya en el norte y el Golfo Pérsico en el sur había fragmentado cuando Arslan Shah II asumió el trono en 1161. Reinó nominalmente sobre los territorios de Azerbaiyán, Iraq y Persia occidental y dependió de la lealtad de Emires independientes como Eldiguz para hacer cumplir su autoridad. Las tierras del viejo imperio son ahora libres para la toma por sus vecinos y otros ambiciosos señores de la guerra."

 bookmark_baud3: "Amaury"
 bookmark_baud3_subheading: "Rey de Jerusalén"
 bookmark_baud3_desc: "Amalarico fue rey de Jerusalén desde 1163. Era el segundo hijo de Melisenda y Fulco de Jerusalén, y sucedió a su hermano mayor Balduino III. Durante su reinado, Jerusalén se alió más estrechamente con el Imperio Bizantino, y ambos estados lanzaron una infructuosa invasión de Egipto. Mientras tanto, los territorios musulmanes que rodeaban Jerusalén empezaron a unirse bajo el mando de Nur ad-Din y, más tarde, de Saladino, que acabó poniendo sus miras en Tierra Santa. Fue el padre de tres futuros gobernantes de Jerusalén, Sibila, Balduino IV e Isabel I."

 bookmark_yelu: "Yelü Guin"
 bookmark_yelu_subheading: "Emperador del Qara-Khitai"
 bookmark_yelu_desc: "Durante más de dos siglos, los jitanos gobernaron un vasto imperio que se extendía desde Manchuria hasta Mongolia, equilibrando perfectamente su modo de vida tradicional y nómada al norte, y la cultura urbana y sofisticada de sus súbditos chinos al sur. Sin embargo, derrocados por sus vasallos jurchen en los primeros años del siglo XII, los restos del otrora gran Khitan han huido a Asia Central, donde intentan recrear su esplendor imperial. Tras derrotar a los otrora poderosos kara-khaníes y a los selyúcidas, los kitán, bajo el mando del emperador Yelü-Yilie, se han afianzado en la región. ¿Continuarán sus conquistas, difundiendo su cultura nómada sinicizada y su fe budista, o se conformarán con recrear su imperio chino en Asia Central?"

 bookmark_abd: "Abu Yaqub Yusuf"
 bookmark_abd_subheading: "Califato del Almohad Califato"
 bookmark_abd_desc: "Abu Ya`qub Yusuf o Yusuf I fue el segundo emir o califa almohade. Reinó desde 1163 hasta 1184 en Marrakech. En 1170 invadió Iberia, conquistando al-Andalus y asolando Valencia y Cataluña. Al año siguiente se estableció en Sevilla. Ordenó la construcción de numerosos edificios, como el Alcázar, el palacio de la Buhaira y la fortaleza de Alcalá de Guadaíra. Los almohades, en su apogeo, estuvieron a punto de deshacer la reconquista de los reinos cristianos."

 bookmark_barbarossa: "Federico Barbarroja"
 bookmark_barbarossa_subheading: "Santo Emperador Romano"
 bookmark_barbarossa_desc: "Federico Barbarroja, fue el emperador del Sacro Imperio Romano Germánico desde 1155 hasta su muerte 35 años después. Fue llamado Barbarroja por las ciudades del norte de Italia que intentó gobernar: Barbarroja significa "barba roja" en italiano; en alemán, se le conocía como Kaiser Rotbart, que tiene el mismo significado. La prevalencia del apodo italiano, incluso en el uso posterior del alemán, refleja la importancia de las campañas italianas en su carrera.  Los historiadores lo consideran uno de los mayores emperadores medievales del Sacro Imperio Romano Germánico. Combinaba cualidades que le hacían parecer casi sobrehumano a sus contemporáneos: su longevidad, su ambición, su extraordinaria capacidad de organización, su perspicacia en el campo de batalla y su perspicacia política. Entre sus contribuciones a la sociedad y la cultura centroeuropeas se encuentra el restablecimiento del Corpus Juris Civilis, o estado de derecho romano, que contrarrestó el poder papal que dominaba los estados alemanes desde la conclusión de la Controversia de las Investiduras."

 bookmark_manuel: "Manuel I"
 bookmark_manuel_subheading: "Basileo del Imperio Bizantino"
 bookmark_manuel_desc: "Manuel I Komnenos fue un emperador bizantino del siglo XII que reinó en un momento crucial de la historia de Bizancio y del Mediterráneo. Su reinado supuso el último florecimiento de la restauración komnena, durante la cual el Imperio bizantino había visto resurgir su poderío militar y económico, y había disfrutado de un renacimiento cultural. Deseoso de devolver a su imperio sus glorias pasadas como superpotencia del mundo mediterráneo, Manuel llevó a cabo una ambiciosa política exterior. Manuel reconfiguró los mapas políticos de los Balcanes y del Mediterráneo oriental, colocando los reinos de Hungría y de Ultramar bajo la hegemonía bizantina y haciendo una agresiva campaña contra sus vecinos tanto en el oeste como en el este. Llamado ho Megas por los griegos, se sabe que Manuel inspiraba una intensa lealtad a quienes le servían."

 bookmark_louis: "Luis VII"
 bookmark_louis_subheading: "Rey de Francia"
 bookmark_louis_desc: "Luis VII, llamado el Joven o la Joven, fue rey de los francos desde 1137 hasta 1180. Era hijo y sucesor del rey Luis VI, de ahí su apodo, y se casó con la duquesa Leonor de Aquitania, una de las mujeres más ricas y poderosas de Europa occidental. El matrimonio extendió temporalmente las tierras de los Capetos hasta los Pirineos, pero fue anulado en 1152 al no producirse ningún heredero varón. Inmediatamente después de la anulación de su matrimonio, Leonor se casó con Enrique Plantagenet, duque de Normandía y conde de Anjou, a quien transmitió Aquitania y produjo cinco herederos varones. Cuando Enrique se convirtió en rey de Inglaterra en 1154, como Enrique II, gobernó como rey, duque o conde sobre un gran imperio de reinos, ducados y condados que abarcaban desde Escocia hasta los Pirineos. Los esfuerzos de Enrique por conservar y ampliar este patrimonio para la Corona de Inglaterra marcarían el inicio de la larga rivalidad entre Francia e Inglaterra. El reinado de Luis VII vio la fundación de la Universidad de París y la desastrosa Segunda Cruzada. Luis y su famoso consejero, el abad Suger, impulsaron una mayor centralización del Estado y favorecieron el desarrollo de la arquitectura gótica francesa, especialmente la construcción de Notre-Dame de París."

 bookmark_henry: "Enrique II"
 bookmark_henry_subheading: "Rey de Inglaterra"
 bookmark_henry_desc: "Enrique II fue rey de Inglaterra desde 1154 hasta su muerte. Fue el primer rey de la Casa de Plantagenet. Su matrimonio en 1152 con Leonor, duquesa de Aquitania, cuyo matrimonio con Luis VII había sido anulado recientemente, le convirtió en duque de Aquitania. Se convirtió en Conde de Nantes por tratado en 1185. Antes de cumplir los 40 años, controlaba Inglaterra, gran parte de Gales, la mitad oriental de Irlanda y la mitad occidental de Francia, una zona que más tarde se llamaría Imperio Angevino. En varios momentos, Enrique también controló parcialmente Escocia, Gales y el Ducado de Bretaña. Enrique pronto entró en conflicto con Luis VII, y ambos gobernantes libraron lo que se ha denominado una "guerra fría" durante varias décadas. Enrique expandió su imperio a expensas de Luis, tomando Bretaña y avanzando hacia el este en el centro de Francia y hacia el sur en Toulouse; a pesar de las numerosas conferencias y tratados de paz, no se llegó a ningún acuerdo duradero."

 bookmark_saladin: "Salah ad-Din (padre)"
 bookmark_saladin_subheading: "Sultan de Egipto y Siria"
 bookmark_saladin_desc: "Saladino fue el fundador de la dinastía ayubí. Durante su reinado, Saladino ha sido descrito como el califa de facto del Islam y, en el apogeo de su poder, su imperio incluía Egipto, Siria, la Alta Mesopotamia, el Hiyaz, Yemen y otras partes del norte de África. En los años siguientes, dirigió incursiones contra los cruzados en Palestina, encargó la exitosa conquista de Yemen y contuvo las rebeliones fatimíes en el Alto Egipto. Poco después de la muerte de Nur ad-Din, en 1174, Saladino se lanzó a la conquista de Siria, entrando pacíficamente en Damasco a petición de su gobernador. Bajo el mando de Saladino, el ejército ayubí derrotó a los cruzados en la decisiva batalla de Hattin en 1187, y a partir de entonces arrebató el control de Palestina -incluida la ciudad de Jerusalén- a los cruzados, que habían conquistado la zona 88 años antes. Aunque el Reino Cruzado de Jerusalén siguió existiendo hasta finales del siglo XIII, su derrota en Hattin marcó un punto de inflexión en su conflicto con las potencias musulmanas de la región."

 bookmark_ghaznavi: "Khusrau Malik"
 bookmark_ghaznavi_subheading: "Sultán del Imperio Ghaznavid"
 bookmark_ghaznavi_desc: "Abu'l-Muzaffar Khusrau Malik ibn Khusrau-Shah, fue el último sultán del imperio gaznávida, que gobernó de 1160 a 1186. En 1161/2, un grupo de turcos oghuz tomó la capital gaznávida de Ghazna, obligando a Khusrau Malik a retirarse a Lahore, que se convirtió en su nueva capital. Desde allí hizo incursiones en el norte de la India, expandiendo su dominio hasta el sur de Cachemira. También creó una alianza con la tribu india Khokar. Lahore fue finalmente capturada por los ghuríes en 1186, mientras que Khusrau-Malik y su hijo Bahram-Shah fueron llevados a Ghur y encarcelados, lo que marcó el fin del imperio gaznávida."



 ### CHARACTERS

 # xxx

 MUHAMMED: "Balduino"

 #####

 bm_prelude: "La Tercera Cruzada"
 bm_prelude_desc: "Los Komnenoi han caído del trono imperial y Bizancio cae con ellos. Los nuevos reinos de Serbia y Bulgaria han declarado su independencia de la corona bizantina, los sultanes selyúcidas de Rum presionan contra las fronteras restauradas del Imperio en Anatolia, y un Béla III independiente gobierna en Hungría y Croacia. Todos los sueños de Manuel Komnenos se han quedado en nada, pero esta es una época de oportunidades, para aquellos lo suficientemente sabios como para verlas. Alexios Komnenos, un miembro infantil de la dinastía real Komnenos, gobierna en Trebisonda. Si puede reunir el apoyo suficiente para presionar su reclamo en Bizancio, el joven Komnenos puede trabajar para restaurar la edad de oro que la caída prematura de su familia puso fin. Mientras tanto, Jerusalén está a punto de caer en manos de Saladino, mientras que el rey Enrique II de Inglaterra, el rey Felipe II de Francia y el emperador del Sacro Imperio Romano Germánico Federico "Barbarroja" siguen luchando entre sí."

 bookmark_character1: "xxxxx"
 bookmark_character1_subheading: "Título de Caracter"
 bookmark_character1_desc: "xxxxx"


 ### CHARACTERS

 # 768

 PRELUDE: "Preludio"

  #####

 bm_fourth: "La Cuarta Cruzada"
 bm_fourth_desc: "La tristemente célebre y malograda Cuarta Cruzada, que debía retomar Jerusalén tras una invasión a través de Egipto, fue desbaratada por los intrigantes venecianos, los líderes corruptos y el depuesto emperador bizantino Alejo IV, que pretendía recuperar su trono perdido. El resultado fue el trágico saqueo de Constantinopla y el posterior establecimiento del llamado Imperio Latino. Casi ninguno de los cruzados llegó siquiera a Tierra Santa. Mientras tanto, el infame rey Juan, hermano de Ricardo Corazón de León, gobierna en Inglaterra, los estados cristianos de España se enfrentan a la poderosa dinastía almohade, el Sacro Imperio Romano comienza a perder su control sobre Italia y, muy al este, Temujin comienza a unir a los mongoles...."

 bookmark_isaakios: "Isaac II"
 bookmark_isaakios_subheading: "Basileo del Imperio Bizantino"
 bookmark_isaakios_desc: "Isaac II Angelos fue emperador bizantino de 1185 a 1195, y de nuevo de 1203 a 1204. Su padre, Andronikos Doukas Angelos, fue un líder militar en Asia Menor que se casó con Euphrosyne Kastamonitissa. Andronikos Doukas Angelos era hijo de Constantino Angelos y Teodora Komnene, la hija menor del emperador Alexios I Komnenos y de Irene Doukaina. Por tanto, Isaac era miembro del extenso clan imperial de los Komnenoi. El 11 de septiembre de 1185, mientras Andronikos estaba ausente de la capital, su lugarteniente Esteban Hagiochristophorites se movilizó para arrestar a Isaac. Isaac mató a Hagiochristophorites y se refugió en la iglesia de Santa Sofía. Andronikos era un gobernante capaz en algunos aspectos, pero era odiado por su crueldad y sus esfuerzos por mantener la obediencia de la aristocracia. Isaac apeló al populacho y se produjo un tumulto que se extendió rápidamente por toda la ciudad. Cuando Andronikos regresó se encontró con que había perdido el apoyo popular y que Isaac había sido proclamado emperador."

 bookmark_alexios2: "Alejo I"
 bookmark_alexios2_subheading: "Emperador de Trebizond"
 bookmark_alexios2_desc: "Alejo I Megas Komnenos o Alejo I Megas Comnenus fue, junto con su hermano David, el fundador del Imperio de Trebisonda y su gobernante desde 1204 hasta su muerte en 1222. Los dos hermanos eran los únicos descendientes masculinos del emperador bizantino Andronikos I, que había sido destronado y asesinado en 1185, por lo que pretendían representar el gobierno legítimo del Imperio tras la conquista de Constantinopla por la Cuarta Cruzada en 1204. Aunque sus rivales que gobernaban el Imperio de Nicea consiguieron convertirse en los sucesores de facto, y dejaron sin efecto sus pretensiones dinásticas al trono imperial, los descendientes de Alejo siguieron destacando su herencia y su conexión con la dinastía komneniana refiriéndose a sí mismos como Megas Komnenos o Gran Komnenos."

 bookmark_arslan: "Kilij Arslan II"
 bookmark_arslan_subheading: "Sultan of Rûm"
 bookmark_arslan_desc: "Kilij Arslan II fue sultán selyúcida de Rûm desde 1156 hasta su muerte en 1192. En 1180, el sultán aprovechó la inestabilidad del Imperio Bizantino tras la muerte de Manuel para asegurarse la mayor parte de la costa sur de Anatolia, y envió a su visir Ikhtiyar al-Din a concertar una alianza con Saladino, sucesor de Nur ad-Din, ese mismo año. Luego, en 1182, logró capturar la ciudad de Cotyaeum a los bizantinos. En 1185, hizo la paz con el emperador Isaac II Angelus, pero al año siguiente transfirió el poder a sus once hijos, que inmediatamente lucharon entre sí por el control. A pesar de la alianza de Kilij Arslan con Saladino, prometió a los ejércitos de la Tercera Cruzada, liderados por Federico Barbarroja, pasar libremente por sus territorios; sin embargo, sus hijos, que eran jefes locales, no estuvieron de acuerdo y lucharon contra los cruzados en la batalla de Filomelión y la batalla de Iconio."

 bookmark_bela: "Béla III"
 bookmark_bela_subheading: "Rey de Hungría"
 bookmark_bela_desc: "Béla III fue rey de Hungría y Croacia entre 1172 y 1196. Béla promovió el uso de registros escritos durante su reinado. Las crónicas húngaras del siglo XIV afirman incluso que fue el responsable de la creación de la Cancillería Real. El palacio real construido en Esztergom durante su reinado fue el primer ejemplo de arquitectura gótica en Europa Central. Fue el monarca europeo más rico de su época, según una lista de sus ingresos, pero la fiabilidad de la lista es cuestionada. Pasó gran parte de su vida participando en la política del Imperio Bizantino."

 bookmark_guy: "Guy"
 bookmark_guy_subheading: "Rey de Jerusalén"
 bookmark_guy_desc: "Guy de Lusignan fue un caballero poitevino francés, hijo de Hugo VIII de Lusignan y, como tal, nacido de la Casa de Lusignan. Fue rey de Jerusalén de 1186 a 1192 por derecho de matrimonio con Sibila de Jerusalén, y rey de Chipre de 1192 a 1194. Llegado a Tierra Santa (donde ya destacaba su hermano Aimery de Lusignan) en una fecha desconocida, Guy se casó apresuradamente con Sibila en 1180 para evitar un incidente político en el reino. Cuando la salud de su cuñado, Balduino IV de Jerusalén, se deterioró, Guy fue nombrado por Sibila como regente de su hijastro, Balduino V de Jerusalén. Balduino IV murió en 1185, seguido poco después por Balduino V en 1186, dando lugar a la sucesión de Sibila y Guy en el trono. El reinado de Guy estuvo marcado por el aumento de las hostilidades con los ayubíes gobernados por Saladino, que culminaron en la batalla de Hattin en julio de 1187 -durante la cual Guy fue capturado- y la caída de Jerusalén tres meses después."

 bookmark_philippe: "Felipe II"
 bookmark_philippe_subheading: "Rey de Francia"
 bookmark_philippe_desc: "Felipe II fue rey de Francia de 1180 a 1223. Sus predecesores habían sido conocidos como reyes de los francos, pero a partir de 1190, Felipe se convirtió en el primer monarca francés que se autodenominó "rey de Francia". Tras décadas de conflictos con la Casa de Plantagenet, Felipe consiguió poner fin al Imperio Angevino al derrotar a una coalición en la batalla de Bouvines en 1214. Esta victoria tendría un impacto duradero en la política de Europa occidental: la autoridad del rey francés se convirtió en indiscutible, mientras que el rey inglés Juan se vio obligado por sus barones a asentir a la Carta Magna y a hacer frente a una rebelión contra él ayudada por el hijo de Felipe, el príncipe Luis, la Primera Guerra de los Barones. Felipe transformó a Francia de un pequeño estado feudal en el país más próspero y poderoso de Europa. Controló el poder de los nobles y ayudó a las ciudades a liberarse de la autoridad señorial, concediendo privilegios y libertades a la burguesía emergente. Construyó una gran muralla alrededor de París, reorganizó el gobierno francés y aportó estabilidad financiera a su país."

 bookmark_saladin2: "Salah ad-Din"
 bookmark_saladin2_subheading: "Sultan de Egipto y Siria"
 bookmark_saladin2_desc: "Saladino fue el fundador de la dinastía ayubí. Durante su reinado, Saladino ha sido descrito como el califa de facto del Islam y, en el apogeo de su poder, su imperio incluía Egipto, Siria, la Alta Mesopotamia, el Hiyaz, Yemen y otras partes del norte de África. En los años siguientes, dirigió incursiones contra los cruzados en Palestina, encargó la exitosa conquista de Yemen y contuvo las rebeliones fatimíes en el Alto Egipto. Poco después de la muerte de Nur ad-Din, en 1174, Saladino se lanzó a la conquista de Siria, entrando pacíficamente en Damasco a petición de su gobernador. Bajo el mando de Saladino, el ejército ayubí derrotó a los cruzados en la decisiva batalla de Hattin en 1187, y a partir de entonces arrebató el control de Palestina -incluida la ciudad de Jerusalén- a los cruzados, que habían conquistado la zona 88 años antes. Aunque el Reino Cruzado de Jerusalén siguió existiendo hasta finales del siglo XIII, su derrota en Hattin marcó un punto de inflexión en su conflicto con las potencias musulmanas de la región."

 bookmark_barbarossa2: "Federico Barbarroja"
 bookmark_barbarossa2_subheading: "Santo Emperador Romano"
 bookmark_barbarossa2_desc: "Federico Barbarroja, fue el emperador del Sacro Imperio Romano Germánico desde 1155 hasta su muerte 35 años después. Fue llamado Barbarroja por las ciudades del norte de Italia que intentó gobernar: Barbarroja significa "barba roja" en italiano; en alemán, se le conocía como Kaiser Rotbart, que tiene el mismo significado. La prevalencia del apodo italiano, incluso en el uso posterior del alemán, refleja la importancia de las campañas italianas en su carrera.  Los historiadores lo consideran uno de los mayores emperadores medievales del Sacro Imperio Romano Germánico. Combinaba cualidades que le hacían parecer casi sobrehumano a sus contemporáneos: su longevidad, su ambición, su extraordinaria capacidad de organización, su perspicacia en el campo de batalla y su perspicacia política. Entre sus contribuciones a la sociedad y la cultura centroeuropeas se encuentra el restablecimiento del Corpus Juris Civilis, o estado de derecho romano, que contrarrestó el poder papal que dominaba los estados alemanes desde la conclusión de la Controversia de las Investiduras."

 bookmark_henry2: "Enrique II"
 bookmark_henry2_subheading: "Rey de Inglaterra"
 bookmark_henry2_desc: "Enrique II fue rey de Inglaterra desde 1154 hasta su muerte. Fue el primer rey de la Casa de Plantagenet. Su matrimonio en 1152 con Leonor, duquesa de Aquitania, cuyo matrimonio con Luis VII había sido anulado recientemente, le convirtió en duque de Aquitania. Se convirtió en Conde de Nantes por tratado en 1185. Antes de cumplir los 40 años, controlaba Inglaterra, gran parte de Gales, la mitad oriental de Irlanda y la mitad occidental de Francia, una zona que más tarde se llamaría Imperio Angevino. En varios momentos, Enrique también controló parcialmente Escocia, Gales y el Ducado de Bretaña. Enrique pronto entró en conflicto con Luis VII, y ambos gobernantes libraron lo que se ha denominado una "guerra fría" durante varias décadas. Enrique expandió su imperio a expensas de Luis, tomando Bretaña y avanzando hacia el este en el centro de Francia y hacia el sur en Toulouse; a pesar de las numerosas conferencias y tratados de paz, no se llegó a ningún acuerdo duradero."

 bookmark_ghurid2: "Ghiyath al-Din Muhammad"
 bookmark_ghurid2_subheading: "Sultán del Imperio Ghurid"
 bookmark_ghurid2_desc: "Ghiyath al-Din Muhammad, fue sultán de la dinastía ghurí de 1163 a 1202. Durante su reinado, la dinastía ghurí se convirtió en una potencia mundial, que se extendía desde Gorgan hasta Bengala. Al principio de su reinado, derrotó a los pretendientes al trono de los ghuríes y luchó con el Imperio Khwarazmian por el señorío de Jorasán. Ocupó Herat en 1176 y, en 1200, se hizo con el control de la mayor parte de lo que hoy es Afganistán y sus alrededores, hasta Bastam y Gurgan. Su hermano, Mu'izz al-Din, ayudó a gestionar y expandir la parte oriental del imperio (hasta Bengala) y sirvió a Ghiyath con la mayor lealtad y deferencia. Ghiyath murió en 1202 y le sucedió su hermano Mu'izz al-Din."


 ### CHARACTERS

 bookmark_latin: "Balduino I"
 bookmark_latin_subheading: "Emperador latino de Constantinopla"
 bookmark_latin_desc: "Balduino I fue el primer emperador del Imperio Latino de Constantinopla. Balduino fue uno de los líderes más destacados de la Cuarta Cruzada, que tuvo como resultado el saqueo de Constantinopla en 1204, la conquista de grandes partes del Imperio Bizantino y la fundación del Imperio Latino. Perdió su última batalla contra Kaloyan, el emperador de Bulgaria, y pasó sus últimos días como su prisionero."

 bookmark_nikaea: "Teodoro I"
 bookmark_nikaea_subheading: "Emperador de Nicaea"
 bookmark_nikaea_desc: "Teodoro I Laskaris fue el primer emperador de Nicea. Aunque nació en el seno de una oscura familia aristocrática bizantina, su madre estaba emparentada con el clan imperial de los Komnenos. Los griegos que huían del Imperio Latino -el estado cruzado que surgió en los territorios centrales bizantinos- acudieron en masa a Asia Menor para vivir bajo el gobierno de Teodoro. Los latinos capturaron al suegro de Teodoro e hicieron una alianza con Alejo I de Trebisonda, pero Teodoro derrotó a sus ejércitos. Se aseguró el apoyo de la mayoría de los aristócratas de Bitinia y se apoderó de los dominios de los que se resistían. En 1205, asumió los títulos tradicionales de los emperadores bizantinos. Tres años después, convocó un concilio eclesiástico para elegir un nuevo patriarca ortodoxo de Constantinopla. El nuevo patriarca coronó a Teodoro como emperador y estableció su sede en la capital de Teodoro, Nicea. La población ortodoxa del Imperio Latino consideraba a Teodoro como el principal defensor de su Iglesia, pero los gobernantes del Epiro debatieron la legalidad de su coronación."

 bookmark_england1200: "Juan"
 bookmark_england1200_subheading: "Rey de Inglaterra"
 bookmark_england1200_desc: "Juan fue rey de Inglaterra desde 1199 hasta su muerte en 1216. Perdió el Ducado de Normandía y la mayoría de sus otras tierras francesas a manos del rey Felipe II de Francia, lo que provocó el colapso del Imperio Angevino y contribuyó al posterior crecimiento del poder de la dinastía francesa de los Capetianos durante el siglo XIII. La revuelta de los barones al final del reinado de Juan condujo al sellado de la Carta Magna, un documento que a veces se considera un paso temprano en la evolución de la constitución del Reino Unido."

 bookmark_france1200: "Felipe II"
 bookmark_france1200_subheading: "Rey de Francia"
 bookmark_france1200_desc: "Felipe II fue rey de Francia de 1180 a 1223. Sus predecesores habían sido conocidos como reyes de los francos, pero a partir de 1190, Felipe se convirtió en el primer monarca francés que se autodenominó "Rey de Francia". Tras décadas de conflictos con la Casa de Plantagenet, Felipe consiguió poner fin al Imperio Angevino al derrotar a una coalición en la batalla de Bouvines en 1214. Esta victoria tendría un impacto duradero en la política de Europa occidental: la autoridad del rey francés se convirtió en indiscutible, mientras que el rey inglés Juan se vio obligado por sus barones a asentir a la Carta Magna y a hacer frente a una rebelión contra él ayudada por el hijo de Felipe, el príncipe Luis, la Primera Guerra de los Barones. Felipe transformó a Francia de un pequeño estado feudal en el país más próspero y poderoso de Europa. Controló el poder de los nobles y ayudó a las ciudades a liberarse de la autoridad señorial, concediendo privilegios y libertades a la burguesía emergente. Construyó una gran muralla alrededor de París, reorganizó el gobierno francés y aportó estabilidad financiera a su país."

 bookmark_portugal: "Sancho I"
 bookmark_portugal_subheading: "Rey de Portugal"
 bookmark_portugal_desc: "Sancho I, apodado "el Poblador", rey de Portugal. Sancho I dedicó gran parte de su reinado a la organización política y administrativa del nuevo reino. Acumuló un tesoro nacional, apoyó las nuevas industrias y la clase media de comerciantes. Además, creó varias ciudades y villas nuevas y se preocupó por poblar zonas remotas de las regiones cristianas del norte de Portugal, de ahí el apodo de "el Populador". El rey también era conocido por su amor al conocimiento y a la literatura. Sancho I escribió varios libros de poemas y utilizó el tesoro real para enviar estudiantes portugueses a universidades europeas."

 bookmark_rum1200: "Kilij Arslan III"
 bookmark_rum1200_subheading: "Sultan of Rûm"
 bookmark_rum1200_desc: "Kilij Arslan III fue el sultán selyúcida de Rûm durante un breve periodo entre 1204 y 1205, sucediendo a su padre Solimán II. Le sucedió su tío Kaykhusraw I."

 bookmark_mongol: "Gengis Kan"
 bookmark_mongol_subheading: "Gran Khan del Imperio Mongol"
 bookmark_mongol_desc: "Gengis Kan (nacido Temüjin Borjigin), fue el fundador y primer Gran Kan y Emperador del Imperio Mongol, que se convirtió en el mayor imperio contiguo de la historia tras su muerte. Tras fundar el Imperio y ser proclamado Gengis Kan, lanzó las invasiones mongolas que conquistaron la mayor parte de Eurasia, llegando hasta el oeste de Polonia y el Levante en Oriente Medio. Las campañas iniciadas durante su vida incluyen las realizadas contra los Qara Khitai, Khwarezmia y las dinastías Xia y Jin occidentales, y las incursiones en la Georgia medieval, la Rus de Kiev y la Bulgaria del Volga. Estas campañas solían ir acompañadas de masacres a gran escala de la población civil, especialmente en las tierras controladas por Khwarazmian y Xia Occidental. Debido a esta brutalidad, que dejó millones de muertos, muchos consideran que fue un gobernante brutal. Al final de su vida, el Imperio Mongol ocupaba una parte importante de Asia Central y China."

 bookmark_alexios1200: "Alejo I"
 bookmark_alexios1200_subheading: "Emperador de Trebizond"
 bookmark_alexios1200_desc: "Alejo I Megas Komnenos o Alejo I Megas Comnenus fue, junto con su hermano David, el fundador del Imperio de Trebisonda y su gobernante desde 1204 hasta su muerte en 1222. Los dos hermanos eran los únicos descendientes masculinos del emperador bizantino Andronikos I, que había sido destronado y asesinado en 1185, por lo que pretendían representar el gobierno legítimo del Imperio tras la conquista de Constantinopla por la Cuarta Cruzada en 1204. Aunque sus rivales que gobernaban el Imperio de Nicea lograron convertirse en los sucesores de facto, y dejaron sin efecto sus pretensiones dinásticas al trono imperial, los descendientes de Alejo siguieron destacando su herencia y su conexión con la dinastía komneniana refiriéndose a sí mismos como Megas Komnenos o Gran Komnenos."

 bookmark_epirus: "Miguel I"
 bookmark_epirus_subheading: "Despot of Epirus"
 bookmark_epirus_desc: "Miguel I Komnenos Doukas fue el fundador y primer gobernante del Despotado de Epiro. Los dominios de Miguel en el Epiro se convirtieron en refugio y centro de resistencia de los griegos contra los cruzados latinos. Para evitar la invasión y ganar tiempo para consolidar su posición en el Epiro, Miguel entabló pronto negociaciones con el Papa Inocencio III, y concluyó tratados con el Imperio Latino y la República de Venecia. Mientras tanto, su gobierno recibió un impulso de legitimidad cuando rescató del cautiverio al depuesto Alejo III. Según cronistas posteriores, Alejo III confirió el gobierno hereditario del Epiro a Miguel y sus descendientes."

 bookmark_hre1200: "Felipe de Suabia"
 bookmark_hre1200_subheading: "Rey de Alemania"
 bookmark_hre1200_desc: "La muerte de su hermano mayor, el emperador Enrique VI, en 1197, supuso el colapso del dominio Hohenstaufen en la Italia imperial y creó un vacío de poder en el norte de los Alpes. En un imperio sin constitución escrita, las reservas sobre la realeza del hijo menor de edad de Enrique VI, Federico, condujeron a dos elecciones reales en 1198, que dieron lugar a la disputa del trono alemán: los dos reyes elegidos, Felipe de Suabia y el Welf Otto de Brunswick, reclamaron el trono para sí mismos. Felipe logró imponer cada vez más su reinado frente a Otón en el norte de los Alpes. Sin embargo, en el apogeo de su poder, fue asesinado en 1208. Esto puso fin a la disputa por el trono; su oponente Otón de Brunswick encontró rápidamente el reconocimiento. En la posteridad, Felipe es uno de los gobernantes Hohenstaufen poco conocidos."



 # 768

 FOURTH: "Cuarta"

  #####

 bm_1220: "Edad de los Mongoles"
 bm_1220_desc: "Cuando Europa entró en el siglo XIII, Constantinopla había sido debilitada por los turcos y saqueada por la Cuarta Cruzada, por lo que el Imperio Bizantino estaba muy debilitado. Los turcos seguían reinando en Oriente Medio y Persia, y en la India muchos nuevos reinos se disputaban el poder tras la caída de las antiguas dinastías. La conquista normanda había traído nuevas luchas políticas y dinásticas a Inglaterra y Francia, los reinos cristianos de España se fortalecían continuamente, Escandinavia había dejado atrás el paganismo y se estaba centralizando. En Rusia, varios principados luchaban por el poder a la sombra de los bolgares y los cumanos del este. En Alemania e Italia, el Sacro Imperio Romano Germánico aún se mantenía firme, pero más allá de todo esto, al este, un nuevo poder iba a entrar en juego. Cuando los mongoles irrumpieron en Europa oriental y Persia, cambió el equilibrio de poder en toda Eurasia occidental..."



 ### CHARACTERS

 bookmark_ghengis: "Ghengis Khan"
 bookmark_ghengis_subheading: "Gran Khan del Imperio Mongol"
 bookmark_ghengis_desc: "Gengis Kan (nacido Temüjin Borjigin), fue el fundador y primer Gran Kan y Emperador del Imperio Mongol, que se convirtió en el mayor imperio contiguo de la historia tras su muerte. Tras fundar el Imperio y ser proclamado Gengis Kan, lanzó las invasiones mongolas que conquistaron la mayor parte de Eurasia, llegando hasta el oeste de Polonia y el Levante en Oriente Medio. Las campañas iniciadas durante su vida incluyen las realizadas contra los Qara Khitai, Khwarezmia y las dinastías Xia y Jin occidentales, y las incursiones en la Georgia medieval, la Rus de Kiev y la Bulgaria del Volga. Estas campañas solían ir acompañadas de masacres a gran escala de la población civil, especialmente en las tierras controladas por Khwarazmian y Xia Occidental. Debido a esta brutalidad, que dejó millones de muertos, muchos consideran que fue un gobernante brutal. Al final de su vida, el Imperio Mongol ocupaba una parte importante de Asia Central y China."

 bookmark_india: "Iltutmish"
 bookmark_india_subheading: "Sultan of Delhi"
 bookmark_india_desc: "Shams ud-Din Iltutmish fue el tercero de los reyes mamelucos que gobernaron los antiguos territorios ghuríes del norte de la India. Fue el primer soberano musulmán que gobernó desde Delhi, por lo que se le considera el fundador efectivo del sultanato de Delhi, que gobernaría el norte de la India durante 3 siglos. Iltutmish organizó la administración del sultanato, sentando las bases de su dominio sobre el norte de la India hasta la invasión mogol. Introdujo el tanka de plata y el jital de cobre, las dos monedas básicas del periodo del sultanato, con un peso estándar de 175 granos. Estableció el sistema Iqtadari: división del imperio en Iqtas, que se asignaban a los nobles y oficiales en lugar de un salario. Erigió muchos edificios, como mezquitas, monasterios, dargahs (santuarios o tumbas de personas influyentes) y un embalse para los peregrinos."

 bookmark_khwar: "Muhammad II"
 bookmark_khwar_subheading: "Sah del Imperio corasmio"
 bookmark_khwar_desc: "Ala ad-Din Muhammad II fue el Sha del Imperio de Khwarezmia desde 1200 hasta 1220 y fue bajo su mandato que el imperio llegaría a controlar un vasto imperio desde el Hindu Kush hasta Mesopotamia y el Mar de Aral en el norte. Quizá sea más conocido por haber incitado la invasión mongola de Khwarezmia al matar a los mensajeros de Ghengis, lo que provocó la destrucción total de su imperio y la masacre de su pueblo."

 bookmark_jerusalem1220: "Isabel II"
 bookmark_jerusalem1220_subheading: "Reina de Jerusalén"
 bookmark_jerusalem1220_desc: "Isabel II nació en Andria, en el sur del reino italiano de Sicilia. Era hija única de María de Montferrat, reina de Jerusalén, y de Juan de Brienne. María era hija de la reina Isabel I de Jerusalén de su segundo marido, Conrado I, y heredera, a la muerte de su madre, del reino de Jerusalén. María murió poco después de dar a luz a Isabel II en 1212, posiblemente por fiebre puerperal. Por ello, Isabel II fue proclamada reina de Jerusalén cuando sólo tenía unos días de vida. Como su padre Juan no tenía derecho directo al trono, gobernó como regente."

 bookmark_hre1220: "Federico II"
 bookmark_hre1220_subheading: "Santo Emperador Romano"
 bookmark_hre1220_desc: "Federico II fue emperador del Sacro Imperio Romano Germánico desde 1220 y rey de Jerusalén desde 1225. Sus ambiciones políticas y culturales eran enormes, ya que gobernaba una vasta zona que comenzaba en Sicilia y se extendía por Italia hasta el norte de Alemania. A medida que avanzaban las Cruzadas, adquirió el control de Jerusalén y se autoproclamó su rey. A la edad de tres años fue coronado rey de Sicilia como co-gobernante con su madre, Constanza de Hauteville, hija de Roger II de Sicilia. Frecuentemente en guerra con el papado, que estaba acorralado entre las tierras de Federico en el norte de Italia y su Reino de Sicilia (el Regno) al sur, fue excomulgado tres veces y a menudo vilipendiado en las crónicas pro-papales de la época y posteriores. El Papa Gregorio IX llegó a llamarlo Anticristo."

 bookmark_castille: "Fernando III"
 bookmark_castille_subheading: "Rey de Castille"
 bookmark_castille_desc: "Fernando III, llamado el Santo, fue rey de Castilla desde 1217. Fernando III fue uno de los reyes más exitosos de Castilla, asegurando no sólo la unión permanente de las coronas de Castilla y León, sino también dirigiendo la campaña de Reconquista más expansiva hasta la fecha. Mediante esfuerzos militares y diplomáticos, Fernando amplió enormemente los dominios de Castilla en el sur de España, anexionando muchas de las grandes ciudades antiguas de al-Andalus, incluidas las antiguas capitales andaluzas de Córdoba y Sevilla, y estableciendo los límites del estado castellano para los dos siglos siguientes."

 bookmark_england1220: "Enrique III"
 bookmark_england1220_subheading: "Rey de Inglaterra"
 bookmark_england1220_desc: "Enrique III, también conocido como Enrique de Winchester, fue rey de Inglaterra, señor de Irlanda y duque de Aquitania desde 1216 hasta su muerte. Enrique prometió respetar la Gran Carta de 1225, que limitaba el poder real y protegía los derechos de los principales barones. Su primer gobierno estuvo dominado primero por Hubert de Burgh y luego por Peter des Roches, que restableció la autoridad real tras la guerra. En 1230, el rey intentó reconquistar las provincias de Francia que habían pertenecido a su padre, pero la invasión fue una debacle. En 1232 estalló una revuelta dirigida por el hijo de Guillermo Mariscal, Ricardo Mariscal, que terminó con un acuerdo de paz negociado por la Iglesia."

 bookmark_france1220: "Felipe II"
 bookmark_france1220_subheading: "Rey de Francia"
 bookmark_france1220_desc: "Felipe II fue rey de Francia de 1180 a 1223. Sus predecesores habían sido conocidos como reyes de los francos, pero a partir de 1190, Felipe se convirtió en el primer monarca francés que se autodenominó "Rey de Francia". Tras décadas de conflictos con la Casa de Plantagenet, Felipe consiguió poner fin al Imperio Angevino al derrotar a una coalición en la batalla de Bouvines en 1214. Esta victoria tendría un impacto duradero en la política de Europa occidental: la autoridad del rey francés se convirtió en indiscutible, mientras que el rey inglés Juan se vio obligado por sus barones a asentir a la Carta Magna y a hacer frente a una rebelión contra él ayudada por el hijo de Felipe, el príncipe Luis, la Primera Guerra de los Barones. Felipe transformó a Francia de un pequeño estado feudal en el país más próspero y poderoso de Europa. Controló el poder de los nobles y ayudó a las ciudades a liberarse de la autoridad señorial, concediendo privilegios y libertades a la burguesía emergente. Construyó una gran muralla alrededor de París, reorganizó el gobierno francés y aportó estabilidad financiera a su país."

 bookmark_vladimir: "Yuri II"
 bookmark_vladimir_subheading: "Gran Príncipe de Vladimir"
 bookmark_vladimir_desc: "Yuri II fue el cuarto Gran Príncipe de Vladimir que presidía Vladimir-Suzdal en la época de la invasión mongola de la Rus'. Cuando los mongoles se acercaron por primera vez a Rusia en 1223, envió una pequeña unidad contra ellos, pero llegó demasiado tarde para participar en la desastrosa batalla del río Kalka. Cuando los mongoles regresaron en 1237, Yuri trató a sus enviados con desdén. Tampoco ayudó a Riazán cuando Batu Khan sitió la ciudad. Su propia capital, sin embargo, fue la siguiente. Los hijos de Yuri fueron derrotados de forma contundente cerca de Kolomna, y el propio Yuri apenas pudo escapar a Yaroslavl. Su esposa Ágata (hermana de Mijaíl de Kiev) y toda su familia murieron en Vladimir al derrumbarse una iglesia en la que se habían refugiado del fuego. El propio Yuri murió el 4 de marzo de 1238, en la batalla del río Sit, en la que vastas hordas mongolas derrotaron al ejército de Vladimir-Suzdal."

 # 768

 1200: "1200"

 ####

 bm_1241: "La Caída de Kiev"
 bm_1241_desc: "Marchando hacia el oeste con una fuerza aparentemente imparable, la horda mongola de Batu ha capturado Kiev, el corazón de la Rus de Kiev. Más de miles de personas yacen muertas en Kiev, como si presagiaran lo que está por venir en las tierras más al oeste. ¿Será Kiev la última ciudad en sufrir tal destino? En el Sacro Imperio Romano Germánico, los burgueses de las Ciudades Imperiales Libres de Lübeck y Hamburgo, en el norte de Alemania, acaban de formar una alianza comercial que acabará siendo conocida como la Liga Hanseática. Mientras tanto, la terrible Horda Mongola ha arrasado como una guadaña por Europa Oriental, segando sin esfuerzo toda la oposición. Mientras incluso el emperador del Sacro Imperio Romano Germánico Friedrich II se acobarda, la gran invasión se detiene inexplicablemente cuando Batu Khan de la Horda de Oro y Hulagu Khan del Ilkhanato regresan a Karakorum para elegir un nuevo Gran Khan."

 bookmark_golden1241: "Batu Khan"
 bookmark_golden1241_subheading: "Kan de la Horda de Oro"
 bookmark_golden1241_desc: "Batu Khan fue un gobernante mongol y fundador de la Horda de Oro, una división del Imperio Mongol. Batu era hijo de Jochi y nieto de Gengis Kan. Su ulus fue el estado principal de la Horda de Oro, que gobernó la Rus, la Bulgaria del Volga, Cumania y el Cáucaso durante unos 250 años, tras destruir también los ejércitos de Polonia y Hungría. Tras la muerte de los hijos de Gengis Kan, se convirtió en el príncipe más respetado, llamado agha ("hermano mayor"), del Imperio Mongol. La conquista de la Rus de Kiev se produjo de su mano. A finales de 1241, Batu y Subutai estaban ultimando los planes para invadir Austria, Italia y Alemania cuando llegó la noticia de la muerte de Ögedei Khan, que falleció en diciembre de 1241. Batu quería continuar la guerra, pero Subutai le recordó la ley de Yassa (Их Засаг). Los mongoles se retiraron a finales de la primavera de 1242, ya que los príncipes de la sangre, y Subutai, fueron llamados a Karakorum, donde se celebró el kurultai. Batu era un Gran Kan en potencia, pero al no conseguir el título se dedicó a consolidar sus conquistas en Asia y los Urales."

 bookmark_ilk1241: "Hülegü Khan"
 bookmark_ilk1241_subheading: "Kan del Ilkanato"
 bookmark_ilk1241_desc: "Hülegü Khan fue un gobernante mongol que conquistó gran parte de Asia occidental. Hijo de Tolui y de la princesa queraíta Sorghaghtani Beki, era nieto de Gengis Khan y hermano de Ariq Böke, Möngke Khan y Kublai Khan. El ejército de Hulagu expandió en gran medida la parte suroccidental del Imperio mongol, fundando el Iljanato de Persia, precursor de la eventual dinastía safávida, y luego del moderno estado de Irán. Bajo el liderazgo de Hulagu, el asedio de Bagdad (1258) destruyó la posición de Bagdad en la Edad de Oro islámica y debilitó a Damasco, lo que provocó un desplazamiento de la influencia islámica hacia el sultanato mameluco de El Cairo y puso fin a la dinastía abasí."

 bookmark_chag1241: "Yesü Möngke"
 bookmark_chag1241_subheading: "Kan del Kanato de Chagatai"
 bookmark_chag1241_desc: "Yesü Möngke fue jefe del ulus del Janato de Chagatai. Era el quinto hijo de Chagatai Khan y Yesülün Khatun. En 1246, o alrededor de esa fecha, fue nombrado kan del Janato de Chagatai por su primo el Gran Khan Güyük Khan, del que era amigo, tras la deposición de Qara Hülëgü. Sin embargo, el siguiente Gran Khan, Möngke Khan, inició una purga de los partidarios de la casa de Ögedei Khan, entre los que se encontraban los Chaghadaids. Yesü Möngke fue ejecutado por Orghana tras su destitución. Qara Hülëgü fue entonces restaurado en su antigua posición."

 bookmark_mongol1241: "Güyük Khan"
 bookmark_mongol1241_subheading: "Gran Khan del Imperio Mongol"
 bookmark_mongol1241_desc: "Güyük fue el tercer Khagan-Emperador del Imperio Mongol, el hijo mayor de Ögedei Khan y un nieto de Genghis Khan. Reinó de 1246 a 1248. Güyük revocó varios edictos impopulares de su madre la regente e hizo un kan sorprendentemente capaz, nombrando a Eljigidei en Persia en preparación de un ataque a Bagdad y a los ismaelitas y prosiguiendo la guerra contra la dinastía Song. No obstante, se mostró inseguro y se ganó la desaprobación de sus súbditos al ejecutar a varios altos funcionarios del régimen anterior por traición. Bajo su mandato, los funcionarios uigures aumentaron su dominio, dejando de lado a los chinos del norte y a los musulmanes. Güyük era una persona estricta e inteligente, aunque bastante taciturna y enfermiza, y su mala costumbre de beber empeoró su salud."

 bookmark_spain1241: "Fernando III"
 bookmark_spain1241_subheading: "Rey de Castille"
 bookmark_spain1241_desc: "Fernando III, llamado el Santo, fue rey de Castilla desde 1217. Fernando III fue uno de los reyes más exitosos de Castilla, asegurando no sólo la unión permanente de las coronas de Castilla y León, sino también dirigiendo la campaña de Reconquista más expansiva hasta la fecha. Mediante esfuerzos militares y diplomáticos, Fernando amplió enormemente los dominios de Castilla en el sur de España, anexionando muchas de las grandes ciudades antiguas de al-Andalus, incluidas las antiguas capitales andaluzas de Córdoba y Sevilla, y estableciendo los límites del estado castellano para los dos siglos siguientes."

 bookmark_hre1241: "Federico II"
 bookmark_hre1241_subheading: "Santo Emperador Romano"
 bookmark_hre1241_desc: "Federico II fue emperador del Sacro Imperio Romano Germánico desde 1220 y rey de Jerusalén desde 1225. Sus ambiciones políticas y culturales eran enormes, ya que gobernaba una vasta zona que comenzaba en Sicilia y se extendía por Italia hasta el norte de Alemania. A medida que avanzaban las Cruzadas, adquirió el control de Jerusalén y se autoproclamó su rey. A la edad de tres años fue coronado rey de Sicilia como co-gobernante con su madre, Constanza de Hauteville, hija de Roger II de Sicilia. Frecuentemente en guerra con el papado, que estaba acorralado entre las tierras de Federico en el norte de Italia y su Reino de Sicilia (el Regno) al sur, fue excomulgado tres veces y a menudo vilipendiado en las crónicas pro-papales de la época y posteriores. El Papa Gregorio IX llegó a llamarlo Anticristo."

 bookmark_hungary1241: "Béla IV"
 bookmark_hungary1241_subheading: "Rey de Hungría"
 bookmark_hungary1241_desc: "Béla IV fue rey de Hungría y Croacia entre 1235 y 1270. Los mongoles invadieron Hungría y aniquilaron al ejército de Béla en la batalla de Mohi el 11 de abril de 1241. Béla escapó del campo de batalla, pero un destacamento mongol lo persiguió de ciudad en ciudad hasta Trogir, en la costa del mar Adriático. Aunque sobrevivió a la invasión, los mongoles devastaron el país antes de su inesperada retirada en marzo de 1242. Béla introdujo reformas radicales para preparar su reino para una segunda invasión mongola. Permitió a los barones y a los prelados erigir fortalezas de piedra y crear sus propias fuerzas armadas. Promovió el desarrollo de ciudades fortificadas. Durante su reinado, miles de colonos llegaron desde el Sacro Imperio Romano Germánico, Polonia y otras regiones vecinas para instalarse en las tierras despobladas. Los esfuerzos de Béla por reconstruir su devastado país le valieron el epíteto de "segundo fundador del Estado"."

 bookmark_india1241: "Ala-ud-Din Masud Shah"
 bookmark_india1241_subheading: "Sultan of Delhi"
 bookmark_india1241_desc: "Ala ud-Din Masud (fl. 1242-46) fue el séptimo sultán de la dinastía mameluca. Era hijo de Rukn ud-Din Firuz, hijo del sultán Illtutmish y del sha Turkan y sobrino del sultán Raziyyat. Después de que su predecesor y tío Muiz ud-Din Bahram fuera asesinado por el ejército en 1242 tras años de desórdenes, los jefes eligieron que fuera él el siguiente gobernante. Sin embargo, era más bien una marioneta de los jefes y no tenía mucho poder o influencia en el gobierno. En cambio, se hizo famoso por su afición al entretenimiento y al vino. Al igual que su predecesor, fue considerado "incompetente e inútil". Hacia 1246, los jefes se disgustaron con su creciente ansia de más poder en el gobierno, y lo sustituyeron por su primo Nasiruddin Mahmud, nieto de Iltutmish a través de su hijo Nasiruddin Mahmud."

 bookmark_mali1241: "Sundiata Keita"
 bookmark_mali1241_subheading: "Mansa of Mali"
 bookmark_mali1241_desc: "Sundiata Keita fue un príncipe y fundador del Imperio de Malí. El gobernante maliense Mansa Musa, que peregrinó a La Meca, era su sobrino nieto."


 ### CHARACTERS

 # 1241


 #####

 bm_1267: "Gedimínidos restaurados"
 bm_1267_desc: "Tras el breve reinado del rey usurpador Treniotas, el pueblo de Lituania ha considerado oportuno restaurar la casa del rey Mindaugas en el trono, estableciendo a su primer hijo Vaisvilkas como rey. Vaisvilkas ha expandido Lituania hacia el este y, al hacerlo, ha convertido inadvertidamente a Lituania en uno de los gateguias de facto de Europa, junto con los reinos de Polonia, Hungría y Bulgaria, y el Gran Ducado de Nóvgorod. Aunque el reino de Vaisvilkas es todavía relativamente pequeño, su piadoso cristianismo le hace ganar tiempo y el posible apoyo de otros gobernantes cristianos. Si consigue ese apoyo y lo utiliza para contener a la horda mongola, el ambicioso y joven rey de Lituania podría recuperar algunas de sus tierras ancestrales perdidas a manos de los caballeros teutones... \n\n Mientras tanto, en Europa la Casa de Hohenstaufen desaparece con la muerte de Manfred y Carlos I de Anjou pasa a gobernar Sicilia."

 bookmark_lith1267: "Vaišvilkas"
 bookmark_lith1267_subheading: "Gran Duque de Lituania"
 bookmark_lith1267_desc: "Vaišvilkas fue el Gran Duque de Lituania (1264-1267). Era hijo de Mindaugas, el primer y único rey cristiano de Lituania. Como cristiano, intentó mantener relaciones amistosas con los Caballeros Teutónicos y la Orden de Livonia. Firmó un tratado de paz con Livonia sobre el comercio en el río Daugava. El apoyo lituano al Gran Levantamiento Prusiano cesó, y las órdenes avanzaron sin interrupción contra semigalianos y curones. Junto con Shvarn, Vaišvilkas atacó Polonia en 1265 para vengar la devastación de los yotvingios en 1264."

 bookmark_poland1268: "Boleslao V"
 bookmark_poland1268_subheading: "Alto Duque de Polonia"
 bookmark_poland1268_desc: "Boleslao V el Casto fue Alto Duque de Polonia desde 1243 hasta su muerte, como último representante masculino de la rama polaca menor de los Piasts. Fue bajo su gobierno que Polonia. En su gobierno se produjeron algunos conflictos con Lituania y colaboró con Hungría para intentar hacer frente a los mongoles durante la Segunda Invasión de Polonia."

 bookmark_hungary1267: "Béla IV"
 bookmark_hungary1267_subheading: "Rey de Hungría"
 bookmark_hungary1267_desc: "Béla IV fue rey de Hungría y Croacia entre 1235 y 1270. Los mongoles invadieron Hungría y aniquilaron al ejército de Béla en la batalla de Mohi el 11 de abril de 1241. Béla escapó del campo de batalla, pero un destacamento mongol lo persiguió de ciudad en ciudad hasta Trogir, en la costa del mar Adriático. Aunque sobrevivió a la invasión, los mongoles devastaron el país antes de su inesperada retirada en marzo de 1242. Béla introdujo reformas radicales para preparar su reino para una segunda invasión mongola. Permitió a los barones y a los prelados erigir fortalezas de piedra y crear sus propias fuerzas armadas. Promovió el desarrollo de ciudades fortificadas. Durante su reinado, miles de colonos llegaron desde el Sacro Imperio Romano Germánico, Polonia y otras regiones vecinas para instalarse en las tierras despobladas. Los esfuerzos de Béla por reconstruir su devastado país le valieron el epíteto de "segundo fundador del Estado"."

 bookmark_bulgaria1267: "Konstantin Tih"
 bookmark_bulgaria1267_subheading: "El zar de Bulgaria"
 bookmark_bulgaria1267_desc: "Konstantin Tih fue el zar de Bulgaria de 1257 a 1277. Su gobierno supuso un conflicto con Hungría y el Imperio Romano de Oriente."

 bookmark_sicily1267: "Carlos I"
 bookmark_sicily1267_subheading: "Rey de Sicilia"
 bookmark_sicily1267_desc: "Carlos I, comúnmente llamado Carlos de Anjou, fue un miembro de la dinastía real de los Capetianos y el fundador de la segunda Casa de Anjou. En 1263, tras años de negociaciones, aceptó la oferta de la Santa Sede de arrebatar el Reino de Sicilia a los Hohenstaufen. Este reino incluía, además de la isla de Sicilia, el sur de Italia hasta bien al norte de Nápoles y era conocido como el Regno. El Papa Urbano IV declaró una cruzada contra el titular Manfredo de Sicilia y ayudó a Carlos a recaudar fondos para la campaña militar. Carlos fue coronado rey en Roma el 5 de enero de 1266. Aniquiló el ejército de Manfred y ocupó el Regno casi sin resistencia. En 1270 participó en la Octava Cruzada y obligó al califa hafsí de Túnez a pagarle un tributo anual. Las victorias de Carlos le aseguraron un liderazgo indiscutible entre los partisanos italianos del papado (conocidos como güelfos), pero su influencia en las elecciones papales y su fuerte presencia militar en Italia molestaron a los papas."

 bookmark_france1267: "Luis IX"
 bookmark_france1267_subheading: "Rey de Francia"
 bookmark_france1267_desc: "Luis IX, conocido comúnmente como San Luis o Luis el Santo, es el único rey de Francia canonizado por la Iglesia Católica. Luis fue coronado a la edad de 12 años, tras la muerte de su padre Luis VIII; su madre, Blanca de Castilla, gobernó el reino como regente hasta que alcanzó la madurez. De adulto, Luis IX se enfrentó a conflictos recurrentes con algunos de los nobles más poderosos de su reino, como Hugo X de Lusignan y Pedro de Dreux. Simultáneamente, Enrique III de Inglaterra intentó restaurar las posesiones continentales angevinas, pero fue rápidamente derrotado en la batalla de Taillebourg. Su reinado es recordado como una edad de oro medieval en la que el Reino de Francia alcanzó su máximo nivel económico y político. Sus colegas europeos lo estimaban mucho, no sólo por su preeminencia militar o por el hecho de que gobernaba el reino más rico, sino también por su reputación de justicia e integridad moral: a menudo se le pedía que arbitrara sus disputas."

 bookmark_england1267: "Enrique III"
 bookmark_england1267_subheading: "Rey de Inglaterra"
 bookmark_england1267_desc: "Enrique III, también conocido como Enrique de Winchester, fue rey de Inglaterra, señor de Irlanda y duque de Aquitania desde 1216 hasta su muerte. Enrique prometió respetar la Gran Carta de 1225, que limitaba el poder real y protegía los derechos de los principales barones. Su primer gobierno estuvo dominado primero por Hubert de Burgh y luego por Peter des Roches, que restableció la autoridad real tras la guerra. En 1230, el rey intentó reconquistar las provincias de Francia que habían pertenecido a su padre, pero la invasión fue una debacle. En 1232 estalló una revuelta dirigida por el hijo de Guillermo Mariscal, Ricardo Mariscal, que terminó con un acuerdo de paz negociado por la Iglesia."

 bookmark_castille1267: "Alfonso X"
 bookmark_castille1267_subheading: "Rey de Castille"
 bookmark_castille1267_desc: "Alfonso X fue rey de Castilla, León y Galicia desde el 30 de mayo de 1252 hasta su muerte en 1284. Durante las elecciones de 1257, una facción disidente le eligió como rey de Alemania el 1 de abril. Renunció a sus pretensiones sobre Alemania en 1275 y, al crear una alianza con el Reino de Inglaterra en 1254, también a sus pretensiones sobre el Ducado de Gascuña. Alfonso X impulsó el desarrollo de una corte cosmopolita que fomentaba el aprendizaje. Judíos, musulmanes y cristianos tuvieron un papel destacado en su corte. Al fomentar la traducción de obras del árabe y el latín a la lengua vernácula de Castilla, se produjeron muchos cambios intelectuales, como el fomento del uso del castellano como lengua principal de la enseñanza superior, la ciencia y el derecho."

 bookmark_marin1267: "Abu Yusuf"
 bookmark_marin1267_subheading: "Sultán del Sultanato benimerín"
 bookmark_marin1267_desc: "Los meriníes llevaban luchando contra los almohades por la supremacía de Marruecos desde la década de 1210. A la muerte de Abu Yahya, en julio de 1258, los meriníes estaban instalados en Fez y controlaban el este y el norte de Marruecos, mientras que los almohades estaban reducidos a los distritos del sur, alrededor de su capital, Marrakech. Aunque Abu Yahya había designado a su hijo como sucesor en Fez, Abu Yusuf Yaqub, entonces gobernador en Taza, consiguió, con poca dificultad, desplazar a su sobrino y hacerse reconocer como emir de los meriníes. El reinado de Abu Yusuf Yaqub vería 4 expediciones militares a España. Aunque es habitual designar a Abd al-Haqq o a Abu Yahya como los fundadores de la dinastía meriní, no cabe duda de que Abu Yusuf Yaqub debe ser considerado con razón como el fundador del Estado meriní. Puso fin a los almohades, unificó Marruecos, estableció su nueva y grandiosa capital en Fez el-Jedid y dio a los meriníes un punto de apoyo en España."

 bookmark_mali1267: "Uli"
 bookmark_mali1267_subheading: "Mansa of Mali"
 bookmark_mali1267_desc: "Mansa Uli, también conocido como Ali o Wali en las fuentes árabes, fue el segundo mansa del Imperio de Malí. Mansa Uli Keita también aumentó considerablemente la producción agrícola del imperio. En el plano económico y político, Uli sentó un precedente al realizar el Hajj a La Meca durante su reinado. A diferencia de su padre, Mansa Wali no tuvo herederos de sangre, por lo que el trono se lo disputaron sus hermanos de adopción. Durante la consiguiente lucha por el poder, Ouati Keita se hizo con el trono, dejando de nuevo de lado a Manding Bory. Mansa Uli fue un gran líder y pronto dio a luz a la persona más rica del mundo, Mansa Musa. Mansa Musa difundió la cultura islámica por gran parte de África Occidental."

 bookmark_egypt1267: "Baibars"
 bookmark_egypt1267_subheading: "Sultán del Sultanato mameluco"
 bookmark_egypt1267_desc: "Al-Malik al-Zahir Rukn al-Din Baibars al-Bunduqdari, conocido comúnmente como Baibars, fue el cuarto sultán de Egipto de la dinastía mameluca Bahri, sucesor de Qutuz. Fue uno de los comandantes de las fuerzas egipcias que infligieron una derrota a la Séptima Cruzada del rey Luis IX de Francia. También dirigió la vanguardia del ejército egipcio en la batalla de Ain Jalut en 1260, que supuso la primera derrota sustancial del ejército mongol y se considera un punto de inflexión en la historia. El reinado de Baibars marcó el inicio de una era de dominio mameluco en el Mediterráneo oriental y consolidó la durabilidad de su sistema militar. Consiguió allanar el camino para el fin de la presencia de los cruzados en Levante y reforzó la unión de Egipto y Siria como estado musulmán preeminente de la región, capaz de rechazar las amenazas de cruzados y mongoles."

 bookmark_ilkhanate1267: "Abaqa Khan"
 bookmark_ilkhanate1267_subheading: "Ilkhan del Ilkhanate"
 bookmark_ilkhanate1267_desc: "Abaqa Khan fue el segundo gobernante mongol (Ilkhan) del Ilkhanato. Es hijo de Hulagu Khan y de Lady Yesünčin. Era el nieto de Tolui y reinó desde 1265 hasta 1282 y fue sucedido por su hermano Ahmed Tekuder. Gran parte del reinado de Abaqa se consumió en guerras civiles en el Imperio Mongol, como las que se produjeron entre el Ilkhanato y el kanato del norte de la Horda de Oro. Abaqa también participó en intentos infructuosos de invasión militar de Siria, como la segunda batalla de Homs."

 bookmark_golden1267: "Möngke Temür"
 bookmark_golden1267_subheading: "Kan de la Horda de Oro"
 bookmark_golden1267_desc: "Möngke Temür, hijo de Toqoqan Khan y Buka Ujin de Oirat y nieto de Batu Khan. Fue un kan de la Horda de Oro, una división del Imperio Mongol en 1266-1280. Durante su reinado, los mongoles, junto con sus súbditos príncipes rusos, emprendieron campañas militares contra Bizancio (c. 1269-1271), Lituania (1275) y los alanos en el Cáucaso (1277). El primer yarlyk (licencia) encontrado por los historiadores fue escrito en nombre de Mengu-Timur y contenía información sobre la liberación de la Iglesia Ortodoxa Rusa del pago de tributos a la Horda de Oro. Tanto los cruzados alemanes como los lituanos pusieron en peligro la seguridad de las tierras rusas. En 1268, envió sus fuerzas a Nóvgorod para ayudar a sus vasallos rusos a conquistar la Estonia danesa, pero tras la batalla de Wesenberg se vio obligado a retirarse. En 1274, Smolensk, el último de los principados rusos, quedó sometido a Möngke Temür khan de la Horda de Oro."

 bookmark_chagatai1267: "Baraq"
 bookmark_chagatai1267_subheading: "Kan del Kanato de Chagatai"
 bookmark_chagatai1267_desc: "Baraq fue un kan del janato de Chagatai (1266-1271). Era hijo de Yesünto'a y bisnieto de Chagatai Khan. Convertido al Islam, adoptó el nombre de Ghiyas-ud-din. A principios de la década de 1260 viajó a Asia Central y se ganó la confianza de Mubarak Shah. Cuando éste fue entronizado de nuevo como Chagatai Khan en 1266, Baraq obtuvo el apoyo del ejército para dar un golpe de estado, y depuso a Mubarak Shah en septiembre de ese año. Casi inmediatamente, repudió la autoridad de Kublai como Gran Khan. Destituyó al representante de Kublai en el Turquestán chino y lo sustituyó por uno de sus propios gobernadores. Su ejército, muy superior, impidió que los oficiales de Kublai lo expulsaran, y Khotan fue asolada por sus fuerzas. No obstante, Kublai Khan le envió una subvención en 1268, en un esfuerzo por poner fin al conflicto y centrarse en Kaidu. Después de 1270, Baraq no tuvo más remedio que conceder a Kaidu y, por tanto, los chagatai fueron marionetas durante los siguientes 30 años."

 bookmark_india1267: "Ghiyas ud din Balban"
 bookmark_india1267_subheading: "Sultan of Delhi"
 bookmark_india1267_desc: "Ghiyas ud din Balban fue el noveno sultán de la dinastía mameluca de Delhi. Ghiyas realizó varias conquistas, algunas de ellas como visir. Derrotó a los mewats que acosaban Delhi y reconquistó Bengala, todo ello mientras se enfrentaba con éxito a la amenaza mongola, lucha que le costó la vida a su hijo y heredero. Tras su muerte, en 1287, su nieto Qaiqabad fue nombrado sultán, aunque su gobierno minó el éxito obtenido bajo el reinado de su abuelo. A pesar de tener pocos logros militares, Balban reformó las líneas civiles y militares, lo que le valió un gobierno estable y próspero que le otorgó el puesto, junto con Shams ud-din Iltutmish y el posterior Alauddin Khalji, de uno de los sultanes más poderosos del sultanato de Delhi."

 bookmark_hre1267: "Ricardo"
 bookmark_hre1267_subheading: "Rey de los romanos"
 bookmark_hre1267_desc: "Ricardo fue rey de Alemania desde 1257 hasta su muerte. Fue uno de los hombres más ricos de Europa y se unió a la Cruzada de los Barones, donde logró el éxito como negociador para la liberación de prisioneros y colaboró en la construcción de la ciudadela de Ascalón."

 bookmark_ere1267: "Miguel VIII"
 bookmark_ere1267_subheading: "Basileo del Imperio Bizantino"
 bookmark_ere1267_desc: "Miguel VIII Palaiologos reinó como emperador del emperador bizantino desde 1261 hasta su muerte. Miguel VIII fue el fundador de la dinastía Palaiologos que gobernaría el Imperio Bizantino hasta la caída de Constantinopla en 1453. Recuperó Constantinopla del Imperio Latino en 1261 y transformó el Imperio de Nicea en un Imperio Bizantino restaurado. En su reinado se produciría una considerable recuperación del poder bizantino, incluida la ampliación del ejército y la armada bizantinos. También incluiría la reconstrucción de la ciudad de Constantinopla y el aumento de su población. Restableció la Universidad de Constantinopla, que daría lugar a lo que se considera el Renacimiento Palaíno entre los siglos XIII y XV. También sería en esta época cuando el foco de atención del ejército bizantino se trasladó a los Balcanes, contra los búlgaros, dejando descuidada la frontera de Anatolia. Sus sucesores no pudieron compensar esta insuficiencia."

 bookmark_yuan1267: "Kublai Khan"
 bookmark_yuan1267_subheading: "Gran Khan del Imperio Mongol"
 bookmark_yuan1267_desc: "Kublai, también conocido como el emperador Shizu de Yuan, fue el quinto khagan del Imperio Mongol, reinando desde 1260 hasta 1294. También fundó la dinastía Yuan en China como dinastía de conquista en 1271, y gobernó como primer emperador Yuan hasta su muerte en 1294. Kublai era el cuarto hijo de Tolui (su segundo hijo con Sorghaghtani Beki) y nieto de Gengis Kan. Sucedió a su hermano mayor Möngke como jagán en 1260, pero tuvo que derrotar a su hermano menor Ariq Böke en la guerra civil toluí que duró hasta 1264. Este episodio marcó el inicio de la desunión en el imperio. El poder real de Kublai se limitaba a China y Mongolia, aunque como jagán seguía teniendo influencia en el Ilkhanato y, en un grado significativamente menor, en la Horda de Oro. Si se cuenta el imperio mongol de la época como un todo, su reino se extendía desde el océano Pacífico hasta el mar Negro, desde Siberia hasta lo que hoy es Afganistán."


 ### CHARACTERS

 # 768

 1267: "Preludio"

 #####1285

 bm_1285: "Los Habsburgo"
 bm_1285_desc: "Rodolfo de Habsburgo, actual emperador del Sacro Imperio, ha derrotado a Ottokar II de Bohemia, su único rival por el trono imperial. Con la derrota de Ottokar, gran parte de sus tierras han vuelto a la corona, incluido el ducado de Österreich, que Rodolfo ha confiado a su hijo Albricht. Aunque la sucesión está asegurada y ha comenzado una nueva era con el control de los Habsburgo sobre Österreich, no todo va bien en el Imperio.\n\nTras las sangrientas secuelas de las Vísperas de Sicilia, una guerra en la que el rey aragonés intentó hacer valer su derecho al reino de Sicilia, el sur de la península italiana está dividido. En la isla de Sicilia se ha proclamado el Reino de Trinacria, en el que gobierna el hermano del rey aragonés, que reclama los derechos sobre la totalidad del reino. En tierra firme, el antiguo rey de Sicilia, ahora ausente de su título homónimo, se ha coronado a sí mismo como rey de Nápoles, y mira con celos la isla que debería ser suya por derecho. Ambos bandos del conflicto cuentan con poderosos aliados, el rey de Trinacria protegido por los reyes de Aragón y Castilla, y el rey de Nápoles apoyado por Hungría-Croacia, por lo que la nueva guerra no será fácil. También en la península ibérica, Felipe IV Capet ha llegado a heredar el Reino de Navarra, y puede contarse igualmente en la lucha ibérica. ¿Quién se moverá cuando, y contra qué se moverá?"

 bookmark_hre1285: "Rodolfo I"
 bookmark_hre1285_subheading: "Rey de los romanos"
 bookmark_hre1285_desc: "Rodolfo I fue el primer rey de Alemania de la Casa de Habsburgo. Primer conde-rey de Alemania, reinó desde 1273 hasta su muerte. La elección de Rodolfo marcó el fin del Gran Interregno que había comenzado tras la muerte del emperador Federico II de Hohenstaufen en 1250. De origen conde suabo, fue el primer Habsburgo que adquirió los ducados de Austria y Estiria frente a su poderoso rival, el rey Přemyslí Ottokar II de Bohemia, al que derrotó en la batalla de Marchfeld de 1278. Los territorios permanecieron bajo el dominio de los Habsburgo durante más de 600 años, formando el núcleo de la Monarquía de los Habsburgo y el actual país de Austria. Rodolfo desempeñó un papel fundamental en la elevación de la comital Casa de Habsburgo al rango de príncipes imperiales."

 bookmark_naples1285: "Carlos II"
 bookmark_naples1285_subheading: "Rey de Nápoles"
 bookmark_naples1285_desc: "Carlos II, también conocido como Carlos el Cojo, fue rey de Nápoles; también se autoproclamó rey de Albania y reclamó el reino de Jerusalén desde 1285. Era hijo de Carlos I de Anjou -uno de los monarcas europeos más poderosos de la segunda mitad del siglo XIII- y de Beatriz de Provenza. Su padre concedió a Carlos el Principado de Salerno en el Reino de Sicilia (o Regno) en 1272 y le nombró regente en Provenza y Forcalquier en 1279. Tras el levantamiento conocido como las Vísperas Sicilianas contra el padre de Carlos, la isla de Sicilia se convirtió en un reino independiente bajo el gobierno de Pedro III de Aragón en 1282. Un año después, su padre nombró a Carlos regente en los territorios continentales del Regno (o Reino de Nápoles). Carlos celebró una asamblea general en la que se abolieron los impuestos impopulares y se confirmaron las libertades de los nobles y clérigos. No pudo evitar que los aragoneses ocuparan Calabria y las islas del Golfo de Nápoles."

 bookmark_trinacria1285: "Jaime II"
 bookmark_trinacria1285_subheading: "Rey de Sicilia"
 bookmark_trinacria1285_desc: "Jaime II, llamado el Justo, fue rey de Aragón y Valencia y conde de Barcelona de 1291 a 1327. Por un tratado de paz con Carlos II de Anjou en 1296, aceptó renunciar a Sicilia, pero los sicilianos instalaron en cambio a su hermano Federico en el trono."

 bookmark_france1285: "Felipe IV"
 bookmark_france1285_subheading: "Rey de Francia"
 bookmark_france1285_desc: "Felipe IV, llamado Felipe el Hermoso, fue rey de Francia de 1285 a 1314. Aunque Felipe era conocido como guapo, de ahí el epíteto le Bel, su personalidad rígida e inflexible le valió (tanto de amigos como de enemigos) otros apodos, como el de Rey de Hierro. Felipe se apoyó en hábiles funcionarios, como Guillaume de Nogaret y Enguerrand de Marigny, para gobernar el reino en lugar de en sus nobles. Felipe y sus consejeros fueron fundamentales en la transformación de Francia de un país feudal a un estado centralizado. El rey, que pretendía una monarquía incontestada, obligó a sus vasallos mediante guerras y restringió los usos feudales. Sus ambiciones le hicieron muy influyente en los asuntos europeos. Su objetivo era colocar a sus parientes en tronos extranjeros. Príncipes de su casa gobernaron en Nápoles y Hungría. Intentó, sin éxito, convertir a otro pariente en emperador del Sacro Imperio Romano Germánico. Comenzó el largo avance de Francia hacia el este tomando el control de feudos dispersos."

 bookmark_aragon1285: "Alfonso III"
 bookmark_aragon1285_subheading: "Rey de Aragón"
 bookmark_aragon1285_desc: "Alfonso III, llamado el Liberal o el Libre, fue rey de Aragón, rey de Valencia, conde de Rosellón, conde de Cerdeña y conde de Barcelona (como Alfons II) desde 1285. Conquistó el Reino de Mallorca entre su sucesión y 1287. Poco después de asumir el trono, llevó a cabo una campaña para reincorporar las Islas Baleares al Reino de Aragón, que se había perdido debido a la división del reino por su abuelo, Jaime I de Aragón. Su reinado se vio empañado por una lucha constitucional con los nobles aragoneses, que finalmente culminó con los artículos de la Unión de Aragón - la llamada "Carta Magna de Aragón", que devolvió varios poderes reales clave a manos de los nobles menores. Su incapacidad para resistirse a las demandas de sus nobles dejaría una herencia de desunión en Aragón y una mayor disensión entre la nobleza, que cada vez veía menos motivos para respetar el trono, y llevó al Reino de Aragón al borde de la anarquía."

 bookmark_castille1285: "Sancho IV"
 bookmark_castille1285_subheading: "Rey de Castille"
 bookmark_castille1285_desc: "Sancho IV de Castilla llamado el Bravo, fue el rey de Castilla, León y Galicia desde 1284 hasta su muerte."

 bookmark_ere1285: "Andronikos II"
 bookmark_ere1285_subheading: "Basileo del Imperio Bizantino"
 bookmark_ere1285_desc: "Andronikos II Palaiologos, reinó como emperador bizantino de 1282 a 1328. El reinado de Andronikos estuvo marcado por el inicio del declive del Imperio Bizantino. Durante su reinado, los turcos conquistaron la mayor parte de los territorios de Anatolia occidental del Imperio y, durante los últimos años de su reinado, también tuvo que luchar contra su nieto Andronikos en la Primera Guerra Civil Palentina. La guerra civil terminó con la abdicación forzada de Andronikos II en 1328, tras lo cual se retiró a un monasterio, donde pasó los últimos cuatro años de su vida."

 bookmark_england1285: "Eduardo I"
 bookmark_england1285_subheading: "Rey de Inglaterra"
 bookmark_england1285_desc: "Eduardo I, también conocido como Eduardo Longshanks y el Martillo de los Escoceses, fue rey de Inglaterra desde 1272 hasta 1307. Eduardo pasó gran parte de su reinado reformando la administración real y el derecho común. A través de una amplia investigación legal, investigó la tenencia de varias libertades feudales, mientras que la ley fue reformada a través de una serie de estatutos que regulaban el derecho penal y de propiedad. Sin embargo, la atención de Eduardo se dirigió cada vez más hacia los asuntos militares. Eduardo respondió a una segunda rebelión galesa en 1282-83 con una guerra de conquista a gran escala. Tras una exitosa campaña, sometió a Gales al dominio inglés, construyó una serie de castillos y ciudades en el campo y los pobló con ingleses. A continuación, sus esfuerzos se dirigieron hacia el Reino de Escocia. Inicialmente invitado a arbitrar una disputa de sucesión, Eduardo reclamó la soberanía feudal sobre Escocia. La guerra que siguió continuó después de la muerte de Eduardo, aunque los ingleses parecieron victoriosos en varios momentos."

 bookmark_rajastan1285: "Ghiyas"
 bookmark_rajastan1285_subheading: "Sultan of Delhi"
 bookmark_rajastan1285_desc: "Ghiyas ud din Balban fue el noveno sultán de la dinastía mameluca de Delhi. Ghiyas realizó varias conquistas, algunas de ellas como visir. Derrotó a los mewats que acosaban Delhi y reconquistó Bengala, todo ello mientras se enfrentaba con éxito a la amenaza mongola, lucha que le costó la vida a su hijo y heredero. Tras su muerte, en 1287, su nieto Qaiqabad fue nombrado sultán, aunque su gobierno minó el éxito obtenido bajo el reinado de su abuelo. A pesar de tener pocos logros militares, Balban reformó las líneas civiles y militares, lo que le valió un gobierno estable y próspero que le otorgó el puesto, junto con Shams ud-din Iltutmish y el posterior Alauddin Khalji, de uno de los sultanes más poderosos del sultanato de Delhi."

 bookmark_yuan1285: "Kublai Khan"
 bookmark_yuan1285_subheading: "Emperador de la dinastía Yuan"
 bookmark_yuan1285_desc: "Kublai, también conocido como el emperador Shizu de Yuan, fue el quinto khagan del Imperio Mongol, reinando desde 1260 hasta 1294. También fundó la dinastía Yuan en China como dinastía de conquista en 1271, y gobernó como primer emperador Yuan hasta su muerte en 1294. Kublai era el cuarto hijo de Tolui (su segundo hijo con Sorghaghtani Beki) y nieto de Gengis Kan. Sucedió a su hermano mayor Möngke como jagán en 1260, pero tuvo que derrotar a su hermano menor Ariq Böke en la guerra civil toluí que duró hasta 1264. Este episodio marcó el inicio de la desunión en el imperio. El poder real de Kublai se limitaba a China y Mongolia, aunque como jagán seguía teniendo influencia en el Ilkhanato y, en un grado significativamente menor, en la Horda de Oro. Si se cuenta el imperio mongol de la época como un todo, su reino se extendía desde el océano Pacífico hasta el mar Negro, desde Siberia hasta lo que hoy es Afganistán."

 bookmark_ilkhanate1285: "Arghun"
 bookmark_ilkhanate1285_subheading: "Ilkhan del Ilkhanate"
 bookmark_ilkhanate1285_desc: "Arghun Khan fue el cuarto gobernante del Ilkhanato del imperio mongol, desde 1284 hasta 1291. Era hijo de Abaqa Khan y, al igual que su padre, era un devoto budista (aunque pro-cristiano). Fue conocido por enviar varias embajadas a Europa en un intento infructuoso de formar una alianza franco-mongola contra los musulmanes en Tierra Santa. También fue Arghun quien solicitó una nueva novia a su tío abuelo Kublai Khan. La misión de escoltar a la joven Kököchin a través de Asia hasta Arghun habría sido asumida por Marco Polo. Arghun murió antes de que Kököchin llegara, por lo que ella se casó con el hijo de Arghun, Ghazan."

 bookmark_golden1285: "Tode Mongke"
 bookmark_golden1285_subheading: "Kan de la Horda de Oro"
 bookmark_golden1285_desc: "Tuda Mengu, también conocido como Tode Mongke, fue kan de la Horda de Oro, división del Imperio Mongol, desde 1280 hasta 1287. Un kan piadoso, se convirtió al Islam en 1283. Debido a su profunda religión, Tudamongke no fue agresivo para expandir su territorio. Sin embargo, mantuvo un buen contacto con el sultanato mameluco de Egipto contra el Ilkhanato, que era enemigo infiel de ambos estados. Rashid Ad-din escribió que estaba dispuesto a mantener buenas relaciones con Kublai khan y liberó a su hijo Nomoghan a la corte de Yuan. Durante su gobierno la influencia de Nogai Khan aumentó mucho en la Horda de Oro, y hubo un segundo ataque contra Hungría en 1284/1285, lo que fue un desastre total para su ejército. Abdicó en favor de su sobrino Tole Buqa en 1287."

 bookmark_chagatai1285: "Duwa"
 bookmark_chagatai1285_subheading: "Kan del Kanato de Chagatai"
 bookmark_chagatai1285_desc: "Duwa, también conocido como Du'a, fue kan del kanato de Chagatai (1282-1307). Era el segundo hijo de Baraq. Fue el monarca que más tiempo reinó en el Janato Chagatai y aceptó la supremacía nominal de la dinastía Yuan como Gran Kan antes de su muerte. Bajo su mandato, el Janato Chagatai alcanzó su máximo esplendor."

 bookmark_maghreb1285: "Yusuf"
 bookmark_maghreb1285_subheading: "Sultán del Sultanato benimerín"
 bookmark_maghreb1285_desc: "Los meriníes llevaban luchando contra los almohades por la supremacía de Marruecos desde la década de 1210. A la muerte de Abu Yahya, en julio de 1258, los meriníes estaban instalados en Fez y controlaban el este y el norte de Marruecos, mientras que los almohades estaban reducidos a los distritos del sur, alrededor de su capital, Marrakech. Aunque Abu Yahya había designado a su hijo como sucesor en Fez, Abu Yusuf Yaqub, entonces gobernador en Taza, consiguió, con poca dificultad, desplazar a su sobrino y hacerse reconocer como emir de los meriníes. El reinado de Abu Yusuf Yaqub vería 4 expediciones militares a España. Aunque es habitual designar a Abd al-Haqq o a Abu Yahya como los fundadores de la dinastía meriní, no cabe duda de que Abu Yusuf Yaqub debe ser considerado con razón como el fundador del Estado meriní. Acabó definitivamente con los almohades, unificó Marruecos, estableció su nueva y grandiosa capital en Fez el-Jedid y dio a los meriníes un punto de apoyo en España"

 bookmark_mali1285: "Sakoura"
 bookmark_mali1285_subheading: "Mansa del Imperio Maliense"
 bookmark_mali1285_desc: "Mansa Sakura o Mansa Sakoura fue el sexto mansa del Imperio de Malí. Esclavo de nacimiento, Sakura fue liberado y se convirtió en general del ejército de Sundiata Keita, legendario fundador del Imperio de Malí. Tras una debilitante lucha por la sucesión entre los hijos de Sundiata, Ouati Keita y Khalifa Keita, y su hermano Abu Bakr, Sakura se hizo él mismo con el control del trono hacia 1285. El historiador casi contemporáneo Ibn Jaldún afirma que, bajo el liderazgo de Sakura, el Imperio realizó una serie de nuevas conquistas (sobre todo la de Gao), convirtiéndose en la fuerza política, económica y militar dominante en el oeste de Sudán."

 bookmark_hungary1285: "Ladislao IV"
 bookmark_hungary1285_subheading: "Rey de Hungría"
 bookmark_hungary1285_desc: "Ladislao IV, al también conocido como Ladislao el Cumano, fue rey de Hungría y Croacia de 1272 a 1290. Un buen gobernante, un legado papal, Felipe, obispo de Fermo, llegó a Hungría para ayudar a Ladislao a consolidar su autoridad, pero el prelado se sorprendió por la presencia de miles de cumanos paganos en Hungría. Ladislao prometió que les obligaría a adoptar un estilo de vida cristiano, pero se negaron a obedecer las exigencias del legado. Ladislao decidió apoyar a los cumanos, por lo que Felipe de Fermo le excomulgó. Los cumanos encarcelaron al legado y los partidarios de éste capturaron a Ladislao. A principios de 1280, Ladislao aceptó persuadir a los cumanos para que se sometieran al legado, pero muchos cumanos prefirieron abandonar Hungría. Ladislao derrotó a un ejército cumano que invadió Hungría en 1282. Hungría también sobrevivió a una invasión mongola en 1285. Para entonces, Ladislao se había vuelto tan impopular que muchos de sus súbditos le acusaron de incitar a los mongoles a invadir Hungría."

 bookmark_ottoman1285: "Osman I"
 bookmark_ottoman1285_subheading: "Bey del Beylicato otomano"
 bookmark_ottoman1285_desc: "Osman I u Osman Ghazi, fue el líder de los turcos otomanos y el fundador de la dinastía otomana. La dinastía que lleva su nombre estableció y gobernó posteriormente el Imperio Otomano (primero conocido como Beylik o Emirato Otomano). Este Estado, aunque sólo era un pequeño principado turcomano en vida de Osman, se transformó en un imperio mundial en los siglos posteriores a su muerte."



 ### CHARACTERS

 # 768

 1307: "Preludio"

 #####

 #####1307

 bm_1307: "El sueño de Osman"
 bm_1307_desc: "Con la desintegración del sultanato del Ron y el declive del Imperio bizantino, varios señores de la guerra de Anatolia buscan fama y gloria en el consiguiente vacío de poder. Entre ellos destaca Osman, un hombre piadoso y valiente. Según un sueño que tuvo hace muchos, muchos años, a Osman y a su dinastía les esperan grandes cosas. Incluso podrían conquistar la gran Constantinopla algún día. Pero el viaje a Constantinopla no será fácil, y el Imperio Bizantino, que ha resistido un ataque tras otro durante casi mil años, no caerá sin luchar. \n\n En Europa, debido a la prematura muerte del monarca polaco sin un heredero favorable, Vaclav II Premyslid de Bohemia ha sido coronado rey en lugar de otro Piast. Esto da a Vaclav -heredero de Ottokar, y todo el deseo de venganza contra los Hohenstaufen que conlleva ser su hijo- una gran cantidad de poder en Europa. Si a Vaclav se le da tiempo para consolidarse y expandirse, es poco probable que el Sacro Imperio Romano Germánico sea capaz de reafirmar su autoridad sobre Bohemia, ya que su control de la península italiana ya se está desmoronando. El momento de actuar es ahora."

 bookmark_ere1311: "Andronikos II"
 bookmark_ere1311_subheading: "Basileo del Imperio Bizantino"
 bookmark_ere1311_desc: "Andronikos II Palaiologos, reinó como emperador bizantino de 1282 a 1328. El reinado de Andronikos estuvo marcado por el inicio del declive del Imperio Bizantino. Durante su reinado, los turcos conquistaron la mayor parte de los territorios de Anatolia occidental del Imperio y, durante los últimos años de su reinado, también tuvo que luchar contra su nieto Andronikos en la Primera Guerra Civil Palentina. La guerra civil terminó con la abdicación forzada de Andronikos II en 1328, tras lo cual se retiró a un monasterio, donde pasó los últimos cuatro años de su vida."

 bookmark_osman1311: "Osman I"
 bookmark_osman1311_subheading: "Bey del Beylicato otomano"
 bookmark_osman1311_desc: "Osman I u Osman Ghazi, fue el líder de los turcos otomanos y el fundador de la dinastía otomana. La dinastía que lleva su nombre estableció y gobernó posteriormente el Imperio Otomano (primero conocido como Beylik o Emirato Otomano). Este Estado, aunque sólo era un pequeño principado turcomano en vida de Osman, se transformó en un imperio mundial en los siglos posteriores a su muerte."

 bookmark_trebizond1311: "Alejo II"
 bookmark_trebizond1311_subheading: "Emperador de Trebizond"
 bookmark_trebizond1311_desc: "Alejo II, fue emperador de Trebisonda de 1297 a 1330. Era el hijo mayor de Juan II y Eudokia Palaiologina. Alejo demostró ser un gobernante hábil y enérgico, bajo cuyo mandato el Imperio de Trebisonda alcanzó el clímax de su prosperidad. Rechazó las incursiones de los turcos merodeadores y gestionó adecuadamente la invasión de Génova y Venecia. También cultivó las artes y las ciencias en su corte, sirviendo de mecenas al astrónomo bizantino Gregorio Chioniades y al erudito Constantino Loukites."

 bookmark_naples1311: "Roberto"
 bookmark_naples1311_subheading: "Rey de Nápoles"
 bookmark_naples1311_desc: "Roberto de Anjou, conocido como Roberto el Sabio, fue rey de Nápoles, rey titular de Jerusalén y conde de Provenza y Forcalquier desde 1309 hasta 1343, figura central de la política italiana de su tiempo. El rey Roberto recibió el apodo de "el pacificador de Italia" debido a los años de cambios significativos que introdujo en Nápoles. La economía de la ciudad y de la nación estaba en manos de los comerciantes toscanos, que erigieron magníficos edificios, monumentos y estatuas que cambiaron drásticamente la capital del rey Roberto, que pasó de ser un sucio puerto marítimo a una ciudad de elegancia y esplendor medieval."

 bookmark_bulgaria1311: "Teodoro"
 bookmark_bulgaria1311_subheading: "El zar de Bulgaria"
 bookmark_bulgaria1311_desc: "Teodoro Svetoslav gobernó como emperador de Bulgaria de 1300 a 1322 Fue un gobernante sabio y capaz que trajo estabilidad y relativa prosperidad al Imperio búlgaro tras dos décadas de constante intervención mongola en los asuntos internos del Imperio. El reinado de Teodoro Svetoslav comenzó con la devolución del sur de Besarabia a Bulgaria y unos años más tarde consiguió derrotar a los bizantinos y retomar la mayor parte del norte de Tracia ocupado por ellos durante la crisis. A partir de 1307 dirigió una política pacífica hacia todos los vecinos, lo que se tradujo en la expansión del comercio y la economía."

 bookmark_goldenhorde1311: "Toqta"
 bookmark_goldenhorde1311_subheading: "Kan de la Horda de Oro"
 bookmark_goldenhorde1311_desc: "Tokhta fue un kan de la Horda de Oro, hijo de Mengu-Timur y bisnieto de Batu Khan. Gran parte de su gobierno consistió en consolidar su dominio sobre sus súbditos rusos. Fue el último kan no musulmán de la Horda de Oro."

 bookmark_chagatai1311: "Esen Buqa I"
 bookmark_chagatai1311_subheading: "Kan del Kanato de Chagatai"
 bookmark_chagatai1311_desc: "Esen Buqa I fue Kan del Janato de Chagatai (1310 - c. 1318). Era hijo de Duwa. Esen Buqa pasó la mayor parte de su reinado en conflicto con dos de sus vecinos, la dinastía Yuan de China y el Iljanato de Persia. Los chaghadaides temían una alianza entre los yuanes y el Iljanato contra el Estado; este temor fue causado por el testimonio del emisario de los yuanes ante el Iljanato, Abishqa. El diplomático, mientras viajaba por Asia Central, reveló a un comandante chaghadaide que se había creado tal alianza y que las fuerzas yuan-ilkanato se estaban movilizando para atacar al kanato. "

 bookmark_ilkhanate1311: "Öljaitü"
 bookmark_ilkhanate1311_subheading: "Ilkhan del Ilkhanate"
 bookmark_ilkhanate1311_desc: "Öljeitü fue el octavo gobernante de la dinastía Ilkhanid desde 1304 hasta 1316. En su reinado se llevaron a cabo pequeñas expediciones a zonas que no estaban bajo el control de los mongoles y las relaciones entre los reinos mongoles se hicieron más intensas. Los contactos comerciales con las potencias europeas fueron muy activos durante el reinado de Öljeitu. Los genoveses aparecieron por primera vez en la capital de Tabriz en 1280, y mantuvieron un cónsul residente en 1304. Oljeitu también concedió plenos derechos comerciales a los venecianos mediante un tratado en 1306. Después de sus predecesores Arghun y Ghazan, Öljeitu continuó con las gestiones diplomáticas con Occidente y reafirmó las esperanzas mongolas de una alianza entre las naciones cristianas de Europa y los mongoles contra los mamelucos, aunque el propio Öljeitu se había convertido al Islam."

 bookmark_india1311: "Alauddin Khalji"
 bookmark_india1311_subheading: "Sultan of Delhi"
 bookmark_india1311_desc: "Alaud-Dīn Khaljī (r. 1296-1316) fue un emperador de la dinastía Khalji que gobernó el sultanato de Delhi en el subcontinente indio. Alauddin instituyó una serie de cambios administrativos importantes, relacionados con los ingresos, el control de los precios y la sociedad. Es conocido por haber rechazado las invasiones mongolas de la India. En ocasiones, Alauddin explotó el fanatismo musulmán contra los jefes hindúes y el trato a los zimmis. Según el cronista posterior Barani, rara vez hacía caso a los ulemas ortodoxos, pero creía "que el hindú nunca será sumiso y obediente al musulmán a menos que se le reduzca a la pobreza extrema". Emprendió medidas para empobrecerlos y consideró que estaba justificado porque sabía que los jefes hindúes y los muqaddams llevaban una vida lujosa pero no pagaban ni un jital en impuestos. Bajo los mamelucos, los hindúes fueron privados de puestos en la alta burocracia. Sin embargo, el emir Khusrau menciona a un oficial hindú de su ejército enviado a repeler a los mongoles. Además, muchos no musulmanes sirvieron en su ejército."

 bookmark_yuan1311: "Külüg Khan"
 bookmark_yuan1311_subheading: "Emperador de la dinastía Yuan"
 bookmark_yuan1311_desc: "Külüg Khan, también conocido por el nombre de templo Wuzong, fue un emperador de la dinastía Yuan. Además de emperador de China, se le considera el séptimo Gran Kan del Imperio Mongol o de los mongoles, aunque sólo fue nominal debido a la división del imperio. "

 bookmark_musa1311: "Mansa Musa"
 bookmark_musa1311_subheading: "Mansa del Imperio Maliense"
 bookmark_musa1311_desc: "Musa I (c. 1280 - c. 1337 ), o Mansa Musa, fue el décimo Mansa del Imperio de Malí. En el momento de la subida al trono de Musa, Malí estaba formado en gran parte por el territorio del antiguo Imperio de Ghana, que Malí había conquistado. El Imperio de Malí constaba de tierras que ahora forman parte de Guinea, Senegal, Mauritania, Gambia y el moderno Estado de Malí. Durante su reinado, Musa ostentó muchos títulos, como el de "Emir de Melle", "Señor de las Minas de Wangara" y "Conquistador de Ghanata". Musa conquistó 24 ciudades, junto con sus distritos circundantes. Durante el reinado de Musa, Malí pudo ser el mayor productor de oro del mundo, y Musa ha sido considerado uno de los personajes históricos más ricos. Sin embargo, algunos comentaristas modernos han llegado a la conclusión de que no existe una forma precisa de cuantificar la riqueza de Musa."

 bookmark_castille1311: "Fernando IV"
 bookmark_castille1311_subheading: "Rey de Castille"
 bookmark_castille1311_desc: "Fernando IV de Castilla (6 de diciembre de 1285 - 7 de septiembre de 1312) llamado el Emplazado, fue el rey de Castilla y León desde 1295 hasta su muerte. Se enfrentó a la insubordinación de la nobleza, liderada en numerosas ocasiones por su tío Juan de Castilla, señor de Valencia de Campos, y por Juan Núñez II de Lara, que fueron apoyados en algunas ocasiones por otro pariente real, Juan Manuel, príncipe de Villena. Al igual que sus antecesores en el trono, Fernando IV continuó la Reconquista y, aunque no logró conquistar Algeciras en 1309, ese mismo año capturó la ciudad de Gibraltar, y en 1312 también se conquistó la ciudad de Alcaudete. Durante las Cortes de Valladolid de 1312, impulsó la reforma de la administración de justicia, y la de todos los ámbitos de la administración, al tiempo que intentó reforzar la autoridad real en detrimento de la nobleza."

 bookmark_hre1311: "Enrique VII"
 bookmark_hre1311_subheading: "Santo Emperador Romano"
 bookmark_hre1311_desc: "Enrique VII fue rey de Alemania desde 1308 y emperador del Sacro Imperio Romano Germánico desde 1312. Fue el primer emperador de la Casa de Luxemburgo. Durante su breve carrera dio nuevo vigor a la causa imperial en Italia, atormentada por las luchas partidistas entre las divididas facciones güelfas y gibelinas, e inspiró los elogios de Dino Compagni y Dante Alighieri. Fue el primer emperador desde la muerte de Federico II en 1250, poniendo fin al Gran Interregno del Sacro Imperio Romano Germánico; sin embargo, su prematura muerte amenazó con deshacer la obra de su vida. Su hijo, Juan de Bohemia, no logró ser elegido como su sucesor, y hubo brevemente otro antirey, Federico el Hermoso, que impugnó el gobierno de Luis IV."

 bookmark_england1311: "Eduardo II"
 bookmark_england1311_subheading: "Rey de Inglaterra"
 bookmark_england1311_desc: "Eduardo II, también llamado Eduardo de Caernarfon, fue rey de Inglaterra desde 1307 hasta que fue depuesto en enero de 1327. Cuarto hijo de Eduardo I, Eduardo se convirtió en el heredero del trono tras la muerte de su hermano mayor Alfonso. A partir de 1300, Eduardo acompañó a su padre en las campañas de pacificación de Escocia. En 1306, fue nombrado caballero en una gran ceremonia en la Abadía de Westminster. Tras la muerte de su padre, Eduardo sucedió en el trono en 1307. Se casó con Isabel, la hija del poderoso rey Felipe IV de Francia, en 1308, como parte de un largo esfuerzo por resolver las tensiones entre las coronas inglesa y francesa. Esto sería más tarde la causa de la Guerra de los Cien Años, cuando Carlos IV murió sin hijo ni hermano vivo."

 bookmark_france1311: "Felipe IV"
 bookmark_france1311_subheading: "Rey de Francia"
 bookmark_france1311_desc: "Felipe IV, llamado Felipe el Hermoso, fue rey de Francia de 1285 a 1314. Aunque Felipe era conocido como guapo, de ahí el epíteto le Bel, su personalidad rígida e inflexible le valió (tanto de amigos como de enemigos) otros apodos, como el de Rey de Hierro. Felipe se apoyó en hábiles funcionarios, como Guillaume de Nogaret y Enguerrand de Marigny, para gobernar el reino en lugar de en sus nobles. Felipe y sus consejeros fueron fundamentales en la transformación de Francia de un país feudal a un estado centralizado. El rey, que pretendía una monarquía incuestionable, obligó a sus vasallos mediante guerras y restringió los usos feudales. Sus ambiciones le hicieron muy influyente en los asuntos europeos. Su objetivo era colocar a sus parientes en tronos extranjeros. Príncipes de su casa gobernaron en Nápoles y Hungría. Intentó, sin éxito, convertir a otro pariente en emperador del Sacro Imperio Romano Germánico. Comenzó el largo avance de Francia hacia el este tomando el control de feudos dispersos."

 bookmark_serbia1311: "Estefan"
 bookmark_serbia1311_subheading: "Rey de Serbia"
 bookmark_serbia1311_desc: "Estefan Uroš II Milutin, conocido como Stefan Milutin, fue el rey de Serbia entre 1282-1321, miembro de la dinastía Nemanjić. Fue uno de los gobernantes más poderosos de Serbia en la Edad Media. A Milutin se le atribuye haber resistido con fuerza los esfuerzos del emperador bizantino Miguel VIII Palaiologos por imponer el catolicismo romano en los Balcanes tras la Unión de Lyon en 1274. Durante su reinado, el poder económico serbio creció rápidamente, sobre todo gracias al desarrollo de la minería. Fundó Novo Brdo, que se convirtió en una mina de plata de importancia internacional."



 ### CHARACTERS

