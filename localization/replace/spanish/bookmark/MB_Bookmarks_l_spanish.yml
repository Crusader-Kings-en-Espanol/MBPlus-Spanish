 #Characters


 #####1297

 bm_769: "Alta Edad Media"
 bm_769_desc: "La Alta Edad Media comenzó con la caída del Imperio Romano de Occidente a principios del siglo V. En la primera parte de esta época se produjeron las grandes migraciones germánicas y eslavas a través de Europa, con pueblos como los godos y lombardos que se asentaron en el sur de Europa, los francos que se instalaron en la Galia y los sajones que cruzaron el mar y se asentaron en Gran Bretaña. El Imperio Romano de Oriente se vio violentamente sacudido por la presión de los godos y los ávaros, y luchó amargamente con el antiguo enemigo persa. Con el auge del Islam, los árabes conquistaron grandes extensiones de territorio en Oriente Próximo y el norte de África, y el Imperio Persa cayó; en la India, varias grandes dinastías se disputaron el dominio, con el ascenso de los Rashtrakutas a finales del siglo VIII. En las estepas, los jázaros aumentaron su poder, y en Escandinavia las cosas estaban a punto de cambiar de una manera que iba a afectar a todo el continente..."

 bookmark_saxony769: "Widukind"
 bookmark_saxony769_subheading: "Rey de Sajonia"
 bookmark_saxony769_desc: "Widukind, también conocido como Wittekind, fue un líder de los sajones y el principal oponente del rey franco Carlomagno durante las Guerras Sajonas del 777 al 785. Carlomagno acabó imponiéndose, organizó Sajonia como provincia franca, masacró a miles de nobles sajones y ordenó la conversión de los sajones paganos al cristianismo. En tiempos posteriores, Widukind se convirtió en un símbolo de la independencia sajona y en una figura legendaria."

 bookmark_maharastra769: "Krishna"
 bookmark_maharastra769_subheading: "Maharaja del Imperio Rashtrakuta"
 bookmark_maharastra769_desc: "Krishna I, de la dinastía Rashtrakuta, tomó el poder en el año 756 y derrotó a varios competidores por el trono para asegurar su reino. Libró guerras contra los Chalukyas y los Pratiharas y conquistó Karnataka, haciendo que su dinastía fuera más poderosa que nunca. También fue un gran mecenas de los constructores y encargó muchos templos y monumentos nuevos."

 bookmark_abassid769: "Al-Mansur"
 bookmark_abassid769_subheading: "Califa del Imperio árabe"
 bookmark_abassid769_desc: "Al-Mansur se convirtió en el único gobernante del califato tras la muerte de su hermano. Tras derrotar a varios posibles aspirantes a su gobierno, dirigió un reinado largo y relativamente estable sobre su enorme imperio. Durante su mandato, la tolerancia cultural, la conversión de nuevos pueblos y grupos al Islam y la inclusión del mundo persa en el califato propiciaron el auge de la literatura y la erudición islámicas. En su reinado también se produjeron tímidos contactos diplomáticos con reinos tan lejanos como China."

 bookmark_andalusia769: "Abd-al-Rahman I"
 bookmark_andalusia769_subheading: "Sultán de Andalucía"
 bookmark_andalusia769_desc: "Abd-al-Rahman I nació cerca de Damasco, en Siria, pero tuvo que huir de su patria cuando los abbasíes tomaron el poder. Pasó varios años en el exilio antes de llegar a España, donde consiguió hacerse con el poder y declararse gobernante de Al-Andalus. Quiso volver a Oriente y vengarse de los abbasíes, pero la necesidad de ocuparse de asuntos más cercanos a su país se lo impidió. En cambio, dejó su huella en la historia de España, estableciendo allí el gobierno de su dinastía para los siglos venideros."

 bookmark_ere769: "Constantino V"
 bookmark_ere769_subheading: "Basileo del Imperio Bizantino"
 bookmark_ere769_desc: "Constantino V fue emperador bizantino de 741 a 775. Su reinado supuso la consolidación de la seguridad bizantina frente a las amenazas externas. Como hábil líder militar, Constantino aprovechó la guerra civil en el mundo musulmán para realizar ofensivas limitadas en la frontera árabe. Con esta frontera oriental asegurada, emprendió repetidas campañas contra los búlgaros en los Balcanes. Su actividad militar, y la política de asentamiento de poblaciones cristianas desde la frontera árabe en Tracia, hicieron más seguro el dominio de Bizancio sobre sus territorios balcánicos. Las luchas y controversias religiosas fueron una característica destacada de su reinado. Su ferviente apoyo a la iconoclasia y su oposición al monaquismo provocaron su vilipendio por parte de los historiadores y escritores bizantinos posteriores, que lo denigraron como Kopronymos o Copronymus, que significa "el nombrado"."

 bookmark_italy769: "Desiderio"
 bookmark_italy769_subheading: "Rey de Italia"
 bookmark_italy769_desc: "Desiderio se convirtió en rey de los lombardos en el año 756 tras sofocar la revuelta de su rival Ratchis. A lo largo de su reinado, compitió constantemente con los papas y los duques del sur por el dominio de Italia. Buscó una alianza con Carlomagno, pero cuando éste se divorció de su hija las relaciones se agriaron. Finalmente, el reino fue invadido y conquistado por los francos, lo que convirtió a Desiderio en el último rey lombardo."

 bookmark_francia769: "Carlomagno"
 bookmark_francia769_subheading: "Rey de Francia Occidental"
 bookmark_francia769_desc: "Hijo de Pipino el Breve y descendiente de Carlos Martel, Carlomagno (o Carlos, como lo llamaban sus contemporáneos) se convirtió en rey conjunto de los francos con su hermano Karloman en 769. Tras dos años de lucha por el poder, Karloman cayó repentina y convenientemente enfermo y murió, dejando a Carlos como único gobernante de los francos.  A partir de ese momento, hizo que el reino fuera más grande que nunca, conquistando Sajonia, Lombardía y otras tierras con medidas iguales de buena planificación estratégica y despiadada. Finalmente fue coronado emperador del Sacro Imperio Romano Germánico por el papa León III, y sus descendientes gobernaron gran parte de Europa durante mucho tiempo."

 bookmark_middlefrancia769: "Carlomán I"
 bookmark_middlefrancia769_subheading: "King of Middle Francia"
 bookmark_middlefrancia769_desc: "Carlomán se convirtió en rey conjunto de los francos junto con su hermano Carlos en 768. Los dos hermanos no eran amigos, sino que se produjo una rivalidad. Karloman se vio superado por la alianza de su hermano con los lombardos y buscó el apoyo del Papa para contrarrestarla, pero finalmente no lo consiguió. Murió inesperadamente en el 771, cuando la guerra por la corona franca parecía inevitable. Se ha afirmado que fue envenenado, pero nunca se demostró..."

 bookmark_asturias769: "Aurelio"
 bookmark_asturias769_subheading: "Rey de Asturias"
 bookmark_asturias769_desc: "Aurelio fue el rey de Asturias desde el año 768 hasta su muerte. Su reinado parece haber sido relativamente tranquilo y pacífico, como atestigua la casi ausencia de mención de su reinado en las crónicas medievales. El único acontecimiento de su reinado narrado en las crónicas fue una rebelión de siervos, que Aurelio sofocó. Se desconoce el lugar de la revuelta, pero es el primer caso registrado de revuelta antiseñorial en la historia de la Península Ibérica. Se cree que, según la costumbre de la época, negoció la paz con los musulmanes que dominaban las tierras del sur mediante un intercambio de novias."


 #Characters


 #####1297

 bm_1258: "El Sacro Imperio en Crisis"
 bm_1258_desc: "Ricardo Plantagenet, mediante sobornos al electorado alemán, ha sido elegido como Rey de los Alemanes. Sin embargo, su elección no es sencilla. Plantea serios interrogantes sobre el futuro del Sacro Imperio Romano Germánico. La poderosa Inglaterra de los Plantagenet es un fuerte aliado del Emperador, que puede necesitar, ya que el Sacro Imperio Romano está peligrosamente desequilibrado. Manfred von Hohenstaufen, rey de Sicilia e hijo de Federico II, gobierna una Sicilia independiente y busca celosamente la devolución de los títulos de su familia. Mientras tanto, Konrad, hijo de Konrad III, ostenta el ducado de Suabia, lo que significa que es un sucesor válido para reclamar también los títulos de su familia. Por si el peligro de los Reyes de fuera no fuera suficiente, Ottokar II de Bohemia se ha expandido hacia el mar Adriático, acumulando poder y apoyo para su propia elección potencial. ¿Podrá la Casa de Plantagenet mantener el control mediante otra elección? \n\nMientras tanto, en Mesopotamia el Ilkhanato ha lanzado su invasión de Mesopotamia y se prepara para saquear Bagdad. Si la ciudad cae, pondrá fin a la Edad de Oro islámica."

 bookmark_ilkhanate1258: "Hülegü Khan"
 bookmark_ilkhanate1258_subheading: "Kan del Ilkanato"
 bookmark_ilkhanate1258_desc: "Hülegü Khan fue un gobernante mongol que conquistó gran parte de Asia occidental. Hijo de Tolui y de la princesa queraíta Sorghaghtani Beki, era nieto de Gengis Khan y hermano de Ariq Böke, Möngke Khan y Kublai Khan. El ejército de Hulagu expandió en gran medida la parte suroccidental del Imperio mongol, fundando el Iljanato de Persia, precursor de la eventual dinastía safávida, y luego del moderno estado de Irán. Bajo el liderazgo de Hulagu, el asedio de Bagdad (1258) destruyó la posición de Bagdad en la Edad de Oro islámica y debilitó a Damasco, lo que provocó un desplazamiento de la influencia islámica hacia el sultanato mameluco de El Cairo y puso fin a la dinastía abasí."

 bookmark_abbassid1258: "Al-Musta'sim"
 bookmark_abbassid1258_subheading: "Califato del Califato Abbasid"
 bookmark_abbassid1258_desc: "Abu Ahmad Abdallah al-Musta'sim era hijo del penúltimo califa abbasí al-Mustansir, y su madre era Hayir. Nació en 1213. Tras la muerte de su padre, al-Musta'sim sucedió en el trono a finales de 1242. Destaca por su oposición al ascenso de Shajar al-Durr al trono egipcio durante la Séptima Cruzada. Envió un mensaje desde Bagdad a los mamelucos de Egipto que decía: "Si no tenéis hombres allí, decídnoslo para que os enviemos hombres". Sin embargo, al-Musta'sim tuvo que enfrentarse a la mayor amenaza contra el califato desde su establecimiento en el año 632: la invasión de las fuerzas mongolas que, bajo el mando de Hulagu Khan, ya habían aniquilado toda resistencia en Transoxiana y Jorasán. En 1255/1256, Hulagu obligó a los abbasíes a prestar sus fuerzas para la campaña contra Alamut. En 1258, Hulagu invadió el dominio abbasí, que entonces sólo comprendía Bagdad, sus alrededores inmediatos y el sur de Irak. En su campaña para conquistar Bagdad, Hulagu Khan hizo avanzar varias columnas simultáneamente sobre la ciudad y la sitió. Los mongoles retuvieron a los habitantes del califato abasí en su capital y ejecutaron a los que intentaron huir. Bagdad fue saqueada el 10 de febrero y el califa fue asesinado por Hulagu Khan poco después. Se cuenta que los mongoles no querían derramar "sangre real", por lo que lo envolvieron en una alfombra y lo pisotearon hasta la muerte con sus caballos. Algunos de sus hijos también fueron masacrados. Uno de los hijos supervivientes fue enviado como prisionero a Mongolia, donde, según los historiadores mongoles, se casó y tuvo hijos, pero no desempeñó ningún papel en el Islam a partir de entonces."

 bookmark_hre1258: "Ricardo de Cornualles"
 bookmark_hre1258_subheading: "Rey de los romanos"
 bookmark_hre1258_desc: "Ricardo fue elegido en 1257 como rey de Alemania por cuatro de los siete príncipes electorales alemanes tras gastar 28.000 marcos en sobornos. Nunca logró mucho en su gobierno y sólo visitó Alemania en cuatro breves visitas, pero marcó el fin del reinado de los Hohenstaufen. Tras su muerte, se produjo una lucha por el poder en Alemania, que sólo terminó en 1273 con la aparición de un nuevo rey romano, Rodolfo I de Habsburgo, el primer vástago de una familia noble de larga duración que gobernó el imperio. En Cornualles, Ricardo fue sucedido por Edmundo, hijo de su segunda esposa Sanchia."

 bookmark_sicily1258: "Manfredo"
 bookmark_sicily1258_subheading: "Rey de Sicilia"
 bookmark_sicily1258_desc: "Manfred fue el último rey de Sicilia de la dinastía Hohenstaufen, reinando desde 1258 hasta su muerte. Hijo natural del emperador del Sacro Imperio Romano Germánico Federico II, Manfred se convirtió en 1254 en regente del reino de Sicilia en nombre de su sobrino Conradino. Como regente sometió las rebeliones del reino, hasta que en 1258 usurpó el gobierno de Conradino. Tras un primer intento de apaciguar al Papa Inocencio IV, se hizo cargo del conflicto que enfrentaba a los Hohenstaufen con el papado mediante combates y alianzas políticas. Derrotó al ejército papal en Foggia el 2 de diciembre de 1254. Excomulgado por tres papas sucesivos, Manfred fue objeto de una cruzada convocada primero por el papa Alejandro IV y luego por Urbano IV. La llamada de Alejandro no tuvo éxito, pero Urbano consiguió la ayuda de Carlos de Anjou para derrocar a Manfred. Manfred fue asesinado durante su derrota por Carlos en la batalla de Benevento, y Carlos asumió la realeza de Sicilia."

 #1171

  bm_1171: "Salah ad-Din"
  bm_1171_desc: "Salah ad-Din Yusuf ibn Ayyub -más conocido en Occidente como Saladino- es visir del califato fatimí y poco a poco ha ido elaborando sus propios designios para tomar Egipto para sí convirtiéndose en el verdadero poder detrás del trono. Anteriormente sirviente del emir de Damasco, Nur ad-Din, Salah ad-Din fue enviado a Egipto debido a sus éxitos militares a pesar de ser sunní. Nur ad-Din ha encargado a Saladino que derroque a los fatimíes para restablecer el control abasí. ¿Hará Saladino lo que se le aconseja o reclamará Egipto para sí o permanecerá leal al califa fatimí al-Adid.\n\nIberia está equilibrada entre musulmanes y cristianos. En el norte, los católicos se reparten la tierra entre cinco reinos: Portugal, León, Castilla, Navarra y Aragón. Al sur, los musulmanes se unifican de nuevo bajo el emergente Califato Almohade. ¿Será ésta una época de oportunidades y crecimiento para los cristianos, o el califa almohade se adentrará aún más en Iberia?"

  bookmark_saladin1171: "Salah ad-Din"
  bookmark_saladin1171_subheading: "Vizier de Egipto"
  bookmark_saladin1171_desc: "Salah ad-Din, conocido comúnmente como Saladino, es un distinguido comandante militar y estadista que actualmente ejerce como visir del califato fatimí. Nacido en el seno de una familia de origen kurdo, Saladino saltó a la fama bajo el patrocinio de Nur ad-Din, el ambicioso emir de Damasco. Nur ad-Din imagina un frente unido entre los estados musulmanes para hacer frente a la amenaza invasora de los cruzados y, para lograrlo, envía a Saladino a los fatimíes. Encargado de una delicada misión, Saladino navegó con éxito por el intrincado panorama político de la corte fatimí, ascendiendo al influyente cargo de visir tras la muerte de su sobrino. En un principio, Saladino se mostró conciliador con al-Adid, pero pronto consolidó su dominio sobre Egipto y procedió a desmantelar gradualmente el régimen fatimí. El viaje de Saladino se desarrolla en un contexto de intriga, en el que debe equilibrar delicadamente sus deberes como visir con su lealtad a la gran visión de Nur ad-Din. El futuro del mundo musulmán pende de un hilo, y la brillantez estratégica de Saladino desempeñará un papel fundamental en la configuración del destino de Levante."

  bookmark_barbarossa1171: "Federico Barbarroja"
  bookmark_barbarossa1171_subheading: "Santo Emperador Romano"
  bookmark_barbarossa1171_desc: "Federico Barbarroja, formidable gobernante del Sacro Imperio Romano Germánico, se encuentra en el cenit de su poder. Conocido por su ardiente barba roja, sueña con reavivar la gloria del Imperio Romano. Tras enfrentarse a numerosos desafíos a su autoridad, como enfrentamientos con el Papa y vasallos díscolos, Barbarroja se erige en defensor a ultranza del legado imperial. Las ciudades-estado italianas lo observan con recelo y, a medida que se desarrolla la era de la caballería, Barbarroja intenta consolidar su legado navegando por las traicioneras aguas de la política y la guerra medievales. El espectro de la Tercera Cruzada se cierne sobre Barbarroja, que se debate entre afirmar su dominio en el Sacro Imperio Romano Germánico y responder a la llamada para recuperar Jerusalén. ¿Podrá forjar un legado duradero o sucumbir a las tumultuosas corrientes del mundo medieval?"

  bookmark_ghengis1171: "Temujin"
  bookmark_ghengis1171_subheading: "Kan de los mongoles jamag"
  bookmark_ghengis1171_desc: "A la edad de 9 años, el futuro conquistador Temujin, comúnmente conocido como Ghengis, es un joven enérgico y ambicioso dentro de las estepas mongolas y recientemente nombrado Khan del Khanato de Khamag tras la muerte de su padre. Aprovechando la destrozada unidad del Khanato, rivales de los Borjigin, como los Taichuud, ven en esta oportunidad su oportunidad de hacerse con el poder. Las tribus mongolas siguen divididas, y el camino hacia la grandeza está plagado de desafíos. A medida que Temujin navega por las complejidades de sus primeros años, el espectro amenazador de los kanatos vecinos, especialmente los tártaros y los kerait, añade una capa de intriga y peligro a su viaje. ¿Saldrá victorioso el joven Khan y sentará las bases del formidable Imperio Mongol, o las luchas de las estepas serán demasiado para este líder en ciernes? El destino de los mongoles descansa sobre los hombros de un niño que sueña con un imperio unido y poderoso."

  bookmark_yelu1171: "Zhilugu"
  bookmark_yelu1171_subheading: "Emperador del Qara-Khitai"
  bookmark_yelu1171_desc: "Durante más de dos siglos, los jitanos gobernaron un vasto imperio que se extendía desde Manchuria hasta Mongolia, equilibrando a la perfección su tradicional modo de vida nómada al norte y la cultura urbana y sofisticada de sus súbditos chinos al sur. Sin embargo, derrocados por sus vasallos jurchen en los primeros años del siglo XII, los restos del otrora gran Khitan han huido a Asia Central, donde intentan recrear su esplendor imperial. Tras derrotar a los otrora poderosos kara-khaníes y a los selyúcidas, los jitanos se han afianzado en la región. ¿Continuarán sus conquistas, extendiendo su cultura nómada sinicizada y su fe budista, o se asentarán, contentos con recrear su imperio chino en Asia Central?"

  bookmark_abd1171: "Abu Yaqub Yusuf"
  bookmark_abd1171_subheading: "Califato del Almohad Califato"
  bookmark_abd1171_desc: "Abu Ya`qub Yusuf o Yusuf I fue el segundo emir o califa almohade. Reinó desde 1163 hasta 1184 en Marrakech. En 1170 invadió Iberia, conquistando al-Andalus y asolando Valencia y Cataluña. Al año siguiente se estableció en Sevilla. Mandó construir numerosos edificios, como el Alcázar, el palacio de la Buhaira y la fortaleza de Alcalá de Guadaíra. En su apogeo, los almohades estuvieron a punto de deshacer la reconquista de los reinos cristianos."

  bookmark_louis1171: "Luis VII"
  bookmark_louis1171_subheading: "Rey de Francia"
  bookmark_louis1171_desc: "Una vez casado con la formidable Leonor de Aquitania, Luis VII se enfrenta a las consecuencias de su tumultuosa unión. La anulación de su matrimonio le ha dejado con un reino debilitado y ahora lucha por consolidar su poder dentro del reino, se enfrenta a las amenazas externas de la ambiciosa dinastía Plantagenet y a los desafíos internos de los vasallos descontentos. Los desafíos son múltiples, con disensiones internas y amenazas externas en ciernes. ¿Podrá Luis VII superar las sombras de su pasado y forjar un legado que resista las pruebas de la Europa medieval? El futuro de Francia descansa sobre sus hombros."

  bookmark_henry1171: "Enrique II"
  bookmark_henry1171_subheading: "Rey de Inglaterra"
  bookmark_henry1171_desc: "Enrique II, el formidable soberano del Imperio angevino, se ve envuelto en la intrincada red de la política medieval y las luchas familiares. Subido al trono en 1154, hereda un vasto reino que se extiende desde Inglaterra hasta los Pirineos. Sin embargo, la búsqueda del poder es implacable y Enrique se enfrenta a desafíos en el seno de su propia familia. La tumultuosa relación con su esposa, Leonor de Aquitania, añade otra capa de complejidad a su reinado. Mientras intenta consolidar sus posesiones y establecer una autoridad central fuerte, Enrique debe navegar por las aguas traicioneras de hijos rebeldes y nobles ambiciosos. El espectro del reciente asesinato de Thomas Becket persiste, ensombreciendo su reinado. ¿Podrá Enrique II mantener el control y asegurar el legado de la dinastía Plantagenet en este momento crucial del siglo XII?"

  bookmark_alfonso1171: "Alfonso VIII"
  bookmark_alfonso1171_subheading: "Rey de Castille"
  bookmark_alfonso1171_desc: "A principios del siglo XII, Alfonso VIII asciende al trono de Castilla como un joven y ambicioso gobernante. Su reino se enfrenta a desafíos internos, ya que las familias nobles compiten por la influencia, y externamente, los moros presionan contra las fronteras. Alfonso debe navegar por las complejidades de la política medieval, tratando de fortalecer su reino contra la disidencia interna y la amenaza inminente de los reinos rivales. El destino de Castilla depende de su habilidad para equilibrar el poder, la diplomacia y la fuerza militar."

  bookmark_shensong1171: "Xiaozong"
  bookmark_shensong1171_subheading: "Emperador del Imperio Cancionero"
  bookmark_shensong1171_desc: "El emperador Xiaozong de Song, de nombre personal Zhao Shen, fue el undécimo emperador de la dinastía Song de China y el segundo emperador de la dinastía Song del Sur. Comenzó su reinado en 1162, cuando su padre adoptivo y predecesor, el emperador Gaozong, abdicó y le cedió el trono. Aunque el emperador Gaozong se convirtió en Taishang Huang ("emperador retirado") tras su abdicación, siguió siendo el gobernante de facto, por lo que el emperador Xiaozong no asumió el poder total hasta 1187, tras la muerte del emperador Gaozong. Durante el reinado del emperador Xiaozong, los chinos aumentaron el número de misiones comerciales que atracaban en puertos de todo el océano Índico, donde antes predominaba la influencia árabe e hindú. Xiaozong también fue responsable de la rehabilitación póstuma de Yue Fei, de la limpieza de los restos de la facción de Qin Hui en la corte y de la estabilización de la economía, haciendo de su reinado la época más poderosa de la dinastía Song del Sur y se dice que fue el mejor gobernante de la dinastía Song del Sur."

  bookmark_urujin1171: "Shizong"
  bookmark_urujin1171_subheading: "Emperador del Imperio Jin"
  bookmark_urujin1171_desc: "El emperador Shizong de Jin, de nombre personal Wulu, fue el quinto emperador de la dinastía Jin de China, dirigida por los jurchen. Gobernó de 1161 a 1189 bajo el nombre de era "Dading", y su reinado fue el más largo y estable de los emperadores Jin. Una vez en el trono, Wulu -conocido históricamente como emperador Shizong- abandonó el plan de su predecesor de invadir la dinastía Song del Sur y abolió sus políticas internas de sinicización. Aunque conocedor de la cultura china Han, el emperador Shizong pensaba que la fuerza de los jurchens residía en mantener su cultura "simple y sincera", y a menudo atribuía la derrota de Digunai al abandono generalizado de ésta. Sus intentos de evitar la sinicización de su pueblo acabaron fracasando."

  bookmark_manuel1171: "Manuel I"
  bookmark_manuel1171_subheading: "Basileo del Imperio Bizantino"
  bookmark_manuel1171_desc: "Manuel I Komnenos fue un emperador bizantino del siglo XII que reinó en un momento crucial de la historia de Bizancio y del Mediterráneo. Su reinado fue testigo del último florecimiento de la restauración komnena, durante la cual el Imperio bizantino había experimentado un resurgimiento de su poder militar y económico, y había disfrutado de un renacimiento cultural. Deseoso de devolver a su imperio sus glorias pasadas como superpotencia del mundo mediterráneo, Manuel llevó a cabo una ambiciosa política exterior. Manuel remodeló los mapas políticos de los Balcanes y el Mediterráneo oriental, sometiendo los reinos de Hungría y Ultramar a la hegemonía bizantina y emprendiendo agresivas campañas contra sus vecinos tanto en el oeste como en el este. Llamado ho Megas por los griegos, se sabe que Manuel inspiraba una intensa lealtad a quienes le servían."

  bookmark_ghaznavi1171: "Khusrau Malik"
  bookmark_ghaznavi1171_subheading: "Sultán del Imperio Ghaznavid"
  bookmark_ghaznavi1171_desc: "Khusrau Malik, el último gobernante del otrora poderoso Imperio Ghaznávida, se encuentra en una encrucijada. El imperio que antaño se extendía por vastos territorios ha quedado reducido a una mera sombra de lo que fue. A medida que aumentan las amenazas de enemigos externos y las luchas internas, Khusrau debe navegar por la compleja red de lealtades entre sus vasallos y los reinos vecinos, como los crecientes ghuríes. Con Ghazni como sede del poder, debe decidir si luchar por la supervivencia del legado gaznávida o sucumbir a la inevitable marea de cambio que recorre el mundo islámico. ¿Será él quien revitalice la desvanecida gloria de los gaznávidas o será recordado como el gobernante que presidió su desaparición?"

  bookmark_ghurid21171: "Ghiyath al-Din Muhammad"
  bookmark_ghurid21171_subheading: "Sultán del Sultanato gúrida"
  bookmark_ghurid21171_desc: "Ghiyath al-Din Muhammad, fue sultán de la dinastía ghurí de 1163 a 1202. Durante su reinado, la dinastía ghurí se convirtió en una potencia mundial, que se extendía desde Gorgan hasta Bengala. A principios de su reinado, derrotó a los pretendientes ghuríes al trono y luchó con el imperio jwarazmí por el señorío de Jorasán. Ocupó Herat en 1176 y en 1200 se hizo con el control de la mayor parte de lo que hoy es Afganistán y sus alrededores, hasta Bastam y Gurgan. Su hermano, Mu'izz al-Din, ayudó a gestionar y expandir la parte oriental del imperio (hasta Bengala) y sirvió a Ghiyath con la mayor lealtad y deferencia. Ghiyath murió en 1202 y le sucedió su hermano Mu'izz al-Din"

  bookmark_aleppo1171: "Nur ad-Din"
  bookmark_aleppo1171_subheading: "Sultan de Siria"
  bookmark_aleppo1171_desc: "Nur ad-Din era el segundo hijo de Imad al-Din Zengi, atabeg turcomano de Alepo y Mosul, devoto enemigo de la presencia cruzada en Siria. Tras el asesinato de su padre en 1146, Nur ad-Din y su hermano mayor Saif ad-Din Ghazi I se repartieron el reino: Nur ad-Din gobernó Alepo y Saif ad-Din Ghazi se estableció en Mosul. Nur ad-Din intentó establecer alianzas con sus vecinos musulmanes del norte de Irak y Siria para reforzar el frente musulmán contra sus enemigos cruzados. El sueño de Nur ad-Din era unir a las distintas fuerzas musulmanas entre el Éufrates y el Nilo para hacer un frente común contra los cruzados, por lo que envió a Saladino al califato fatimí para dar paso al restablecimiento del dominio suní en Egipto."

  bookmark_baud31171: "Amaury"
  bookmark_baud31171_subheading: "Rey de Jerusalén"
  bookmark_baud31171_desc: "Amalric fue rey de Jerusalén desde 1163. Era el segundo hijo de Melisenda y Fulk de Jerusalén, y sucedió a su hermano mayor Balduino III. Durante el reinado de Balduino III, el condado de Edesa, el primer estado cruzado establecido durante la Primera Cruzada, fue conquistado por Zengi, el emir turco de Alepo. Zengi unió Alepo, Mosul y otras ciudades del norte de Siria, y pretendía imponer su control sobre Damasco en el sur. La Segunda Cruzada en 1148 había fracasado en conquistar Damasco, que pronto cayó ante el hijo de Zengi, Nur ad-Din. Jerusalén también perdió influencia ante Bizancio en el norte de Siria cuando el Imperio impuso su soberanía sobre el Principado de Antioquía. Así, Jerusalén volvió su atención hacia Egipto, donde la dinastía fatimí estaba sufriendo una serie de jóvenes califas y guerras civiles. Los bizantinos y Jerusalén luego lanzaron una invasión fallida de Egipto. Mientras tanto, los territorios musulmanes que rodeaban Jerusalén comenzaron a unirse bajo Nur ad-Din y más tarde Saladino, quien finalmente fijó su mirada en la Tierra Santa."


  #1324

  bm_1324: "Magnus IV"
  bm_1324_desc: "Magnus IV, por elección rey de Suecia y por derecho de nacimiento rey de Noruega, ha unido temporalmente gran parte de Escandinavia bajo su mando. A menos que Magnus demuestre ser un rey excepcional, es poco probable que la unión sobreviva más allá de él, pero hay quienes susurran sobre un Imperio del Norte, con Magnus I a su cabeza.\n\nGran parte del norte de Italia se ha vuelto contra el emperador después de la revuelta de Milán. Duques pelean con condes, alcaldes con dogos. ¿Quién unirá Italia o Italia se unirá en absoluto?\n\n#bold -> Haz clic en 'Jugar como cualquier gobernante' en la esquina inferior izquierda para jugar este marcador <- #!"

  #1157

  bm_1157: "Colapso de los selyúcidas"
  bm_1157_desc: "En lo que resultó ser un período efímero de resurgimiento, el Sultanato selyúcida bajo el sultán Sanjar ha caído en el desorden, desencadenado por la captura de Sanjar por las bandas rebeldes de Oghuz. Innumerables ex vasallos, miembros restantes de la familia selyúcida y oportunistas están listos para luchar por los restos. El califa sunita, antiguos atabegs y un sinfín de emires, algunos de ellos los últimos restos de la antigua élite persa, todos rodean el cadáver con hambre, ¿quién ganará el gran premio?\n\n#bold -> Haz clic en 'Jugar como cualquier gobernante' en la esquina inferior izquierda para jugar este marcador <- #!"

  #1212

  bm_1212: "Los sucesores selyúcidas"
  bm_1212_desc: "El Shadom Anushtiginid ha restaurado un grado de orden en el norte de Persia al someter territorios una vez disputados entre antiguos vasallos selyúcidas y nómadas Oghuz durante más de 50 años. A pesar del gran éxito, el camino hacia la gloria no es seguro para los Anushtiginids. Antiguos atabegs selyúcidas, un califato resurgente y curiosos rumores de jinetes en el este son suficientes para mantener a cualquier sultán sabio despierto durante las largas noches.\n\n#bold -> Haz clic en 'Jugar como cualquier gobernante' en la esquina inferior izquierda para jugar este marcador <- #!"

  bookmark_1211Khwar: "Muhammad II"
  bookmark_1211Khwar_subheading: "Sah del Imperio corasmio"
  bookmark_1211Khwar_desc: "Muhammad II de Khwarazm se encuentra en la altura del poder, habiendo construido un imperio que se extiende desde el Caspio a los Indus. Sin embargo, los rumores del este hablan de un nuevo poder que se levanta sobre las estepas, una figura llamada Temujin que ha unido a las tribus mongol. La confianza del Sha en sus vastos ejércitos y ciudades ricas puede ser aún su deshacer, ya que las nubes de tormenta se reúnen en el horizonte. ¿Puedes defender tu imperio contra la tentación venidera, o el orgullo del Sha conducirá a la destrucción?"

  bookmark_1211Nikaea: "Theodore I Laskaris"
  bookmark_1211Nikaea_subheading: "Emperador de Nicaea"
  bookmark_1211Nikaea_desc: "Theodore Laskaris, que huyó de Constantinopla cuando la ciudad cayó a cruzados latinos, ha excavado un refugio para la civilización romana en Nicaea. Ahora se enfrenta a una lucha desesperada mientras el depuesto Alexios busca recuperar su trono con la ayuda de Seljuk. Con enemigos apremiantes de todos los lados, Theodore debe demostrar que es digno de llevar el manto de Roma. ¿Conservarás la embajada de la civilización romana en el exilio, o Nicaea se convertirá en otro sucesor caído del legado de Constantinopla?"

  bookmark_1211Montfort: "Simon de Montfort"
  bookmark_1211Montfort_subheading: "Conde de Carcassonne"
  bookmark_1211Montfort_desc: "Simon de Montfort lleva a los ejércitos de Dios en una guerra santa contra los cátaros de Languedoc, su cruzada llevando fuego y espada a los herejes del sur de Francia. Aunque su proeza marcial es incuestionable, la compleja política de Occitania amenaza con enredarlo, ya que los nobles locales resisten la interferencia norteña en sus asuntos. ¿Puedes completar tu santa misión y establecer tu dinastía en estas tierras turbulentas, o serás deshecho por la cruzada que te trajo al poder?"

  bookmark_1211Livonia: "Lembitu"
  bookmark_1211Livonia_subheading: "Chieftain of Sakala"
  bookmark_1211Livonia_desc: "El mayor de los ancianos estonios lidera la resistencia desesperada de su pueblo contra los invasores cristianos de Livonia. Aunque las tribus estonias dispares se han unido bajo su bandera, el tiempo se hace corto a medida que llegan más cruzados con cada temporada pasada. ¿Guardarás los viejos caminos y devolverás a los invasores cristianos, o será forzado a tu pueblo a doblar la rodilla para cruzar y espada?"

  bookmark_1211Denmark: "Valdemar II"
  bookmark_1211Denmark_subheading: "King of Denmark"
  bookmark_1211Denmark_desc: "Valdemar II de Dinamarca los ojos se expanden hacia el sur hacia las tierras alemanas, mientras que las cruzadas también conducen a difundir el cristianismo entre los paganos del Báltico. Con el Imperio Romano Santo distraído por la lucha interna, el tiempo parece maduro para la ambición danesa. Sin embargo, tal expansión corre el riesgo de sacar el ire de los vecinos poderosos. ¿Puede establecer el dominio danés sobre el norte de Europa, o sus ambiciones superarán su alcance?"

  bookmark_1211Jin: "Yongji"
  bookmark_1211Jin_subheading: "Emperador del Imperio Jin"
  bookmark_1211Jin_desc: "Yongji de Jin enfrenta una amenaza a diferencia de cualquier dinastía que haya encontrado antes. Los bárbaros del norte, una vez divididos y débiles, se han unido bajo un líder aterrador que se estilo a sí mismo Genghis Khan. Aunque el Jin ordena vastos ejércitos y ciudades ricas, los informes de la frontera crecen más alarmantes con cada día que pasa. ¿Encontrarás la fuerza para resistir a la embestida mongol, o tu antiguo imperio se desmoronará antes de esta nueva fuerza?"

  bookmark_1211Delhi: "Iltutmish"
  bookmark_1211Delhi_subheading: "Sultan of Delhi"
  bookmark_1211Delhi_desc: "Iltutmish se ha apoderado del control de la Sultanía de Delhi, estableciendo a sí mismo a través de proezas militares y acumen político. Sin embargo, su posición sigue siendo precaria, amenazada por rivales internos y enemigos externos que buscan reclamar la riqueza de la India. ¿Puedes consolidar tu regla y establecer una dinastía que perdure, o Delhi se escapará de tu alcance?"

  bookmark_1211Leon: "xxxx"
  bookmark_1211Leon_subheading: "Rey de León"
  bookmark_1211Leon_desc: "Traido entre su deber cristiano y la realidad política, Alfonso mantiene una paz incómoda con los Almohads incluso mientras otros reinos españoles empujan por la cruzada. Su propio matrimonio disuelto por el decreto papal, él debe navegar entre las exigencias de Roma y la supervivencia de su reino."

  bookmark_1211Egypt: "Al-Adil I"
  bookmark_1211Egypt_subheading: "Sultán del Sultanato ayubí"
  bookmark_1211Egypt_desc: "Al-Adil, hermano del gran Saladino, gobierna un imperio que se extiende de Egipto a Siria. Aunque ha mantenido y expandido el legado de su hermano, el reino ayyubí enfrenta una presión creciente de miembros de la familia en disputa y las ambiciones de los reinos latinos. ¿Puede mantener unido el imperio de Saladino, o las rivalidades familiares destrozar lo que su hermano construyó?"

  bookmark_1211Cyprus: "xxxx"
  bookmark_1211Cyprus_subheading: "Rey de Chipre"
  bookmark_1211Cyprus_desc: "Desde su reino insular, Hugues mantiene un delicado equilibrio entre latín y el griego, entre Tierra Santa y Constantinopla, entre comercio y cruzada. La caída de Constantinopla ha creado nuevas oportunidades, pero también nuevos peligros para su reino estratégico."


  #813

  bm_813: "El Imperio Carolingio"
  bm_813_desc: "Carlomagno, una figura destacada de su era, se erige como un símbolo de fuerza y unidad en medio de la agitación. Habiendo forjado un imperio a través de la conquista y la diplomacia, ahora preside sobre un reino que se extiende desde las costas del Atlántico hasta las llanuras de Alemania, pero ¿permanecerá este imperio tras su muerte?\n\n#bold -> Haz clic en 'Jugar como cualquier gobernante' en la esquina inferior izquierda para jugar con este marcador <- #!"

  #bookmark_davit: "xxxxx"
  #bookmark_davit_desc: "xxxx"

  bm_1178: "Caminos al Poder"
  bm_1178_desc: "La fecha del DLC. La descripción se actualizará cuando se lance el DLC. (Creo que 1171 o 1187 son mejores fechas) \n\n#bold -> Haz clic en 'Jugar como cualquier gobernante' en la esquina inferior izquierda para jugar con este marcador <- #!"

  bm_1250: "¡Lituania se Une!"
  bm_1250_desc: "Con la Orden Teutónica ocupando sus tierras históricas en el Oeste y la Horda Dorada destruyendo a los Rurikovich en el Este, las numerosas tribus de Lituania finalmente han decidido unirse bajo un rey para su mejor protección, por necesidad. Mindaugas I es un gobernante fuerte, pero su reino no lo es. Careciendo de muchas de sus tierras históricas, las cuales han sido usurpadas por la Orden Teutónica, y estando a solo unos pocos ducados de una frontera completa con la Horda Dorada, su idoneidad será puesta a prueba en los días venideros. No solo Lituania tiene una vasallaje de religiones mixtas, algunas romuvanas y algunas católicas, los propios hijos de Mindaugas están divididos en su culto incluso de su propia fe, con su hijo y heredero Vaisvilkas siendo un cristiano ortodoxo y su segundo hijo Daumantas un romuvano. Para asegurar sus tierras y esculpir un futuro para el pueblo lituano, Mindaugas debe calmar la tensión religiosa en su reino mientras busca alianzas que lo ayuden a recuperar las tierras ancestrales de su pueblo. ¡Por Lietuva!\n\n#bold -> Haz clic en 'Jugar como cualquier gobernante' en la esquina inferior izquierda para jugar con este marcador <- #!"

  bm_1295: "Ascenso de Mahmud Ghazan"
  bm_1295_desc: "Destronando a su primo Baidu, Ghazan ha ascendido al trono del Iljanato. Como el primer Iljan que se convirtió públicamente al Islam, Ghazan hizo conocer su abrazo del Islam en todo su reino adoptando el nombre de Mahmud. Si Ghazan tendrá éxito en convertir el Iljanato en un importante reino musulmán permanece por verse."
