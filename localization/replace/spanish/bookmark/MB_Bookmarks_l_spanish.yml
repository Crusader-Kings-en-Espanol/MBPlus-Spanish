 #####1307

 bm_1337: "La Guerra de los Cien Años"
 bm_1337_desc: "La muerte del rey francés Carlos IV en 1328 sin heredero inmediato desencadenó una disputa sucesoria que duraría más de cien años. Eduardo III de Inglaterra era el heredero varón vivo más cercano, pero la nobleza francesa, que se oponía a la perspectiva de un rey extranjero, alegó que la línea no podía pasar por una mujer, y coronó a otro pretendiente: Felipe. Nueve años después, estalló la guerra... \n\n En Noruega, Magnus IV, rey de Suecia por elección y de Noruega por derecho de nacimiento, ha unido temporalmente gran parte de Escandinavia bajo su dominio. A menos que Magnus demuestre ser un rey excepcional, es poco probable que la unión perdure más allá de él, pero hay quienes susurran la idea de un Imperio del Norte, con Magnus I a la cabeza... \n\n En Persia, el Ilkhanato ha comenzado a desintegrarse y ahora ex vasallos y oportunistas se disponen a luchar por los restos, mientras que de Taraghai, del clan Barlas, nace un joven Timur que llegaría a conquistar la región."

 bookmark_yuan1337: "Toghon Temür"
 bookmark_yuan1337_subheading: "Emperador de la dinastía Yuan"
 bookmark_yuan1337_desc: "Toghon Temür, también conocido por el nombre de templo Huizong, fue un hijo de Khutughtu Khan Kusala que gobernó como emperador de la dinastía Yuan. Además de emperador de China, también se le considera el último jagán del Imperio Mongol. Durante los últimos años de su reinado, la dinastía Yuan fue derrocada por la Rebelión del Turbante Rojo, que instauró la dinastía Ming, aunque los restos Yuan siguieron controlando el norte de China y la meseta mongola. Por ello, fue el último monarca de la dinastía Yuan y el primer gobernante de la dinastía Yuan del Norte. El emperador Huizong fue un estudiante budista de los Karmapas (jefes de la escuela Karma Kagyu del budismo tibetano) y se le considera una encarnación anterior de los Tai Situpas."

 bookmark_golden1337: "Ozbeg"
 bookmark_golden1337_subheading: "Kan de la Horda de Oro"
 bookmark_golden1337_desc: "El sultán Giyas al-Din Mohammed Öz Beg, más conocido como Uzbeg u Ozbeg, fue el kan que más tiempo reinó en la Horda de Oro (1313-1341), bajo cuyo gobierno el estado alcanzó su apogeo. Le sucedió su hijo Tini Beg. Era hijo de Toghrilcha y nieto de Mengu-Timur, que había sido kan de la Horda de Oro de 1267 a 1280. Convertido al Islam por Ibn Abdul Hamid, un sayyid sufí bujaraní y jeque de la orden Yasavi, Öz Beg asumió el trono a la muerte de su tío Tokhta en enero de 1313 con la ayuda del visir de los antiguos kanes Temur Qutlugh y de Bulaghan khatun. Al principio, muchos nobles mongoles estaban en su contra y organizaron un complot para matar al nuevo kan. Öz Beg descubrió el complot y aplastó a los rebeldes. Su adopción del islam como religión de estado provocó una conspiración de príncipes chamanistas y budistas, a los que sometió con dureza. El Khan Öz Beg instó a la élite mongola a convertirse al Islam, pero al mismo tiempo preservó la vida de cristianos y paganos como rusos, circasianos, alanos, finougrios y griegos de Crimea mientras siguieran pagando la jizyah en sujeción al dominio islámico. A partir de Öz Beg, los kanes de la Horda de Oro fueron todos musulmanes."

 bookmark_chagatai1337: "Changshi"
 bookmark_chagatai1337_subheading: "Kan del Kanato de Chagatai"
 bookmark_chagatai1337_desc: "Changshi fue uno de los últimos kanes efectivos del kanato Chagatai. Su padre era el príncipe Ebugen, hijo de Duwa, el Khan Chagatai. Las fuentes occidentales afirman que era antimusulmán y bastante tolerante con los cristianos. Derrocó a los príncipes musulmanes del poder del kanato en 1334-1335. Sin embargo, fue asesinado por su familia en 1338 tras un corto periodo de su reinado."

 bookmark_hre1337: "Luis IV"
 bookmark_hre1337_subheading: "Santo Emperador Romano"
 bookmark_hre1337_desc: "Luis IV, llamado el Bávaro, de la casa de Wittelsbach, fue rey de los romanos desde 1314, rey de Italia desde 1327 y emperador del Sacro Imperio Romano Germánico desde 1328. La elección de Luis como rey de Alemania en 1314 fue controvertida, ya que su primo de los Habsburgo, Federico el Hermoso, fue elegido rey simultáneamente por un grupo de electores distinto. Luis derrotó a Federico en una batalla en 1322, y ambos acabaron reconciliándose. Luis se opuso y fue excomulgado por el papa francés Juan XXII; a su vez, Luis intentó deponer al papa e instalar un antipapa. "

 bookmark_ere1337: "Andronikos III"
 bookmark_ere1337_subheading: "Basileo del Imperio Bizantino"
 bookmark_ere1337_desc: "Andronikos III Palaiologos fue el emperador bizantino de 1328 a 1341. Era hijo de Miguel IX Palaiologos y de Rita de Armenia. Fue proclamado coemperador en su juventud, antes de 1313, y en abril de 1321 se rebeló contra su abuelo, Andronikos II Palaiologos. Fue coronado formalmente como coemperador en febrero de 1325, antes de derrocar a su abuelo y convertirse en emperador único el 24 de mayo de 1328. Su reinado incluyó los últimos intentos fallidos de frenar a los turcos otomanos en Bitinia y la derrota en Rusokastro frente a los búlgaros, pero también la exitosa recuperación de Quíos, Lesbos, Focea, Tesalia y Epiro. Su temprana muerte dejó un vacío de poder que desembocó en la desastrosa guerra civil entre su emperatriz-duquesa, Ana de Saboya, y su más cercano amigo y partidario, Juan VI Kantakouzenos."

 bookmark_lith1337: "Gediminas"
 bookmark_lith1337_subheading: "Gran Duque de Lituania"
 bookmark_lith1337_desc: "Gediminas fue Gran Duque de Lituania desde 1315 o 1316 hasta su muerte. Se le atribuye la fundación de esta entidad política y la expansión de su territorio, que más tarde se extendió desde el Mar Báltico hasta el Mar Negro. También se le considera una de las personas más importantes de la historia de Lituania, ya que fue el responsable de la construcción de Vilnius, la capital de Lituania, y del establecimiento de una dinastía que más tarde llegó a gobernar otros países europeos como Polonia, Hungría y Bohemia."

 bookmark_poland1337: "Casimiro III"
 bookmark_poland1337_subheading: "Rey de Polonia"
 bookmark_poland1337_desc: "Casimiro III el Grande reinó como rey de Polonia de 1333 a 1370. Más tarde se convirtió en rey de Rusia en 1340, y luchó por conservar el título en las guerras de Galitzia-Volinia. Casimiro heredó un reino debilitado por la guerra y lo hizo próspero y rico. Reformó el ejército polaco y duplicó el tamaño del reino. Reformó el sistema judicial e introdujo un código legal, lo que le valió el título de "el Justiniano polaco". Casimiro construyó extensamente y fundó la Universidad Jagellónica (entonces llamada simplemente Universidad de Cracovia), la universidad polaca más antigua y una de las más antiguas del mundo. También confirmó los privilegios y protecciones concedidos anteriormente a los judíos y los animó a establecerse en Polonia en gran número. Casimiro no dejó ningún heredero varón legítimo a su trono, ya que sólo tuvo hijas. Cuando murió en 1370 a causa de una herida recibida mientras cazaba, su sobrino, el rey Luis I de Hungría, le sucedió como rey de Polonia en unión personal con Hungría"

 bookmark_osman1337: "Orhan"
 bookmark_osman1337_subheading: "Sultanía de la Sultanía Otomana"
 bookmark_osman1337_desc: "Orhan Ghazi fue el segundo bey del Beylik otomano desde 1323/4 hasta 1362. Nació en Söğüt, como hijo de Osman. En las primeras etapas de su reinado, Orhan centró sus energías en la conquista de la mayor parte del noroeste de Anatolia. La mayoría de estas zonas estaban bajo dominio bizantino y ganó su primera batalla en Pelekanon contra el emperador bizantino Andronikos III Palaiologos. Orhan también ocupó las tierras de los karasíes de Balıkesir y los ahis de Ankara. Durante su reinado se crearon los jenízaros."

 bookmark_india1337: "Mahoma"
 bookmark_india1337_subheading: "Sultan of Delhi"
 bookmark_india1337_desc: "Muhammad bin Tughluq fue sultán de Delhi de 1325 a 1351. Era el hijo mayor de Ghiyas -ud -Din -Tughlaq, el fundador de la dinastía Tughluq. Los relatos de los visitantes durante su gobierno describen a Muhammad como un "excéntrico inhumano" de carácter extraño. También se le conoce por sus salvajes cambios de política. Ibn Battuta, el famoso viajero y jurista marroquí, fue huésped de su corte y escribió sobre su soberanía en su libro, en el que escribió que dependía de su propio juicio y rara vez aceptaba consejos de otros, y también lo ha criticado por sus excesivos regalos y "duros castigos"."

 bookmark_marin1337: "Abu al-Hasan"
 bookmark_marin1337_subheading: "Sultán del Sultanato benimerín"
 bookmark_marin1337_desc: "Abu Al-Hasan 'Ali ibn 'Othman fue un sultán de la dinastía meriní que reinó en Marruecos entre 1331 y 1348. En 1333 capturó Gibraltar a los castellanos, aunque un intento posterior de tomar Tarifa en 1339 acabó en fracaso. En el norte de África extendió su dominio sobre Tlemcen e Ifriqiya, que en conjunto abarcaban el norte de lo que hoy es Argelia y Túnez. Bajo su mandato, los reinos meriníes del Magreb cubrieron brevemente una superficie que rivalizaba con la del anterior califato almohade. Sin embargo, se vio obligado a retirarse debido a una revuelta de las tribus árabes, naufragó y perdió a muchos de sus partidarios. Su hijo Abu Inan Faris tomó el poder en Fez. Abu Al-Hasan murió en el exilio en las montañas del Alto Atlas."

 bookmark_georgia1337: "Jorge V"
 bookmark_georgia1337_subheading: "King of Georgia"
 bookmark_georgia1337_desc: "Jorge V el Brillante fue rey de Georgia desde 1299 hasta 1302 y de nuevo desde 1314 hasta su muerte en 1346. Político flexible y con visión de futuro, recuperó Georgia de una dominación mongola que duró un siglo, restaurando la fuerza anterior del país y la cultura cristiana."

 bookmark_castille1337: "Alfonso XI"
 bookmark_castille1337_subheading: "Rey de Castille"
 bookmark_castille1337_desc: "Alfonso XI, llamado el Justiciero, fue el rey de Castilla, León y Galicia. Era hijo de Fernando IV de Castilla y de su esposa Constanza de Portugal. A la muerte de su padre, en 1312, se produjeron varias disputas sobre quién ostentaría la regencia, que se resolvieron en 1313. Una vez que Alfonso fue declarado mayor de edad en 1325, comenzó un reinado que serviría para reforzar el poder real. Entre sus logros destacan la victoria en la Batalla del Río Salado sobre granadinos y meriníes y el control castellano sobre el Estrecho de Gibraltar."

 bookmark_sweden1337: "Magnus IV"
 bookmark_sweden1337_subheading: "Rey de Suecia"
 bookmark_sweden1337_desc: "Magnus IV fue rey de Suecia de 1319 a 1364, rey de Noruega como Magnus VII (incluyendo Islandia y Groenlandia) de 1319 a 1355, y gobernante de Escania de 1332 a 1360. A pesar de sus numerosas expansiones formales, su gobierno fue considerado un periodo de decadencia tanto para el poder real sueco como para Suecia en su conjunto. Naciones extranjeras como Dinamarca (tras su recuperación en 1340) y Mecklemburgo intervinieron y Magnus no parece haber sido capaz de contrarrestar la oposición interna que surgió. Se le consideraba un rey débil y se le criticaba por dar demasiado poder a los favoritos."

 bookmark_england1337: "Eduardo III"
 bookmark_england1337_subheading: "Rey de Inglaterra"
 bookmark_england1337_desc: "Eduardo III fue rey de Inglaterra hasta su muerte en 1377. Eduardo III transformó el Reino de Inglaterra en una de las potencias militares más formidables de Europa. Su reinado de cincuenta años fue el segundo más largo de la historia medieval inglesa, y fue testigo de desarrollos vitales en la legislación y el gobierno, en particular de la evolución del Parlamento inglés, así como de los estragos de la peste negra. Sobrevivió a su hijo mayor, Eduardo el Príncipe Negro, y el trono pasó a su nieto, Ricardo II. Tras una exitosa campaña en Escocia, se declaró heredero legítimo del trono francés en 1337. Esto dio comienzo a lo que se conoció como la Guerra de los Cien Años. Tras algunos contratiempos iniciales, esta primera fase de la guerra fue excepcionalmente buena para Inglaterra; las victorias en Crécy y Poitiers condujeron al muy favorable Tratado de Brétigny, en el que Inglaterra obtuvo ganancias territoriales, y Eduardo renunció a su pretensión al trono francés. Esta fase se conocería como la Guerra de Eduardo."

 bookmark_france1337: "Felipe VI"
 bookmark_france1337_subheading: "Rey de Francia"
 bookmark_france1337_desc: "Felipe VI, llamado el Afortunado y de Valois, fue el primer rey de Francia de la Casa de Valois, reinando desde 1328 hasta su muerte. El reinado de Felipe estuvo dominado por las consecuencias de una disputa sucesoria. Cuando el rey Carlos IV murió en 1328, el pariente masculino más cercano era su sobrino Eduardo III de Inglaterra, pero la nobleza francesa prefería al primo paterno de Carlos, Felipe. Al principio, Eduardo pareció aceptar la sucesión de Felipe, pero insistió en su reclamación del trono de Francia tras una serie de desacuerdos con Felipe. El resultado fue el inicio de la Guerra de los Cien Años en 1337. Tras los éxitos iniciales en el mar, la armada de Felipe fue aniquilada en la batalla de Sluys en 1340, asegurando que la guerra se desarrollara en el continente. Los ingleses tomaron otra ventaja decisiva en la batalla de Crécy (1346), mientras que la peste negra golpeaba a Francia, desestabilizando aún más el país."

 bookmark_timur1337: "Taraghai"
 bookmark_timur1337_subheading: "Emir del Barlas"
 bookmark_timur1337_desc: "Padre de Timur, conquistador turco-mongol que fundó el Imperio Timurí en los actuales Afganistán, Irán y Asia Central, convirtiéndose en el primer gobernante de la dinastía timurí. Como comandante invicto, se le considera uno de los mayores líderes militares y tácticos de la historia. También se le considera un gran mecenas del arte y la arquitectura, ya que se relacionó con intelectuales como Ibn Jaldún y Hafiz-i Abru, y su reinado introdujo el Renacimiento timurí. Timur fue el último de los grandes conquistadores nómadas de la estepa euroasiática, y su imperio sentó las bases para el surgimiento de los imperios islámicos de la pólvora, más estructurados y duraderos, en los siglos XVI y XVII.\n\nLos ejércitos de Timur eran incluso multiétnicos y eran temidos en toda Asia, África y Europa, partes considerables de las cuales fueron arrasadas por sus campañas. Los estudiosos estiman que sus campañas militares causaron la muerte de 17 millones de personas, lo que supone un 5% de la población mundial de la época. De todas las zonas que conquistó, Khwarazm fue la que más sufrió sus expediciones, ya que se levantó varias veces contra él."


 ##Additional Bookmarks

 #####1099

 bm_1099: "La Primera Cruzada"
 bm_1099_desc: "Concluida con la sangrienta caída de Jerusalén, la Primera Cruzada supuso una grave alteración de la estabilidad del Levante. En el norte, los principados de Antioquía y Edesa están en tensión no sólo entre sí, sino también con sus vecinos musulmanes y armenios. Al sur, el naciente Reino de Jerusalén se equilibra con el debilitado Califato Fatimí, el gran Emirato de Damasco y una miríada de atabegs menores que lo dividen de los Príncipes del norte. ¿Podrán los católicos resistir lo suficiente para unificarse, o habrá que convocar otra Cruzada para asegurar una Tierra Santa católica?"

 bm_1031: "Los Reyes Taifas"
 bm_1031_desc: "Tras dos décadas de continuas crisis sucesorias, el Califato de Córdoba ya no existe, ni siquiera como régimen figurado. Andalucía entra ahora en una nueva era de hombres fuertes y oportunistas locales independientes, que se conocerían como reyes de taifa ("facción"). El sur de Andalucía está dominado por varias tribus bereberes, incluida la dinastía bereberizada de los sayyid hammudíes, que habían sido invitados allí como auxiliares califales en las últimas décadas. La costa oriental de Andalucía ha sido tomada por antiguos esclavos saqaliba ("eslavos") de al-Mansur ibn Abi 'Amir (Almanzor), verdadero poder tras el trono responsable de degradar enormemente la autoridad califal décadas antes. En otros lugares, notables árabes locales, como el antiguo visir Jahwar en Córdoba, han sido elegidos para dirigir ayuntamientos, mientras que descendientes de las primeras tribus de colonos árabes y bereberes, como Banu Tujib y Banu Dhu 'l-Nun, siguen ejerciendo su dominio sobre territorios fronterizos.\n\n#bold -> Haz clic en "Juega como cualquier Gobernante" en la parte inferior izquierda para jugar a este marcador <- #!."

 bm_1043: "Época de los Normandos"
 bm_1043_desc: "Los normandos acaban de establecer un condado independiente en la Apulia bizantina, y el joven Guillermo el Bastardo acaba de alcanzar la mayoría de edad en Normandía y empieza a dejar su huella en el mundo. Se ha restablecido el dominio nativo en Inglaterra, con Eduardo el Confesor ocupando el trono mientras Magnus el Bueno de Noruega asciende al poder en Dinamarca tras la muerte de Harthacnut, hijo de Canuto el Grande. Mientras tanto, en Oriente, el mundo musulmán está al borde de la guerra cuando los selyúcidas se alzan con el poder en Jorasán tras la batalla de Dandanaqan, volviendo sus ojos hacia las ricas tierras centrales de Persia e Irak. La hegemonía de los gaznávidas y los buyíes pronto podría dar paso al ascenso de un imperio túrquico más joven y fuerte que transformaría la faz de Oriente Próximo y desencadenaría el comienzo de un choque de civilizaciones.\n\n#bold -> Haz clic en "Juega como cualquier Gobernante" en la parte inferior izquierda para jugar a este marcador <- #!."


 #Characters


 #####993

 bm_993: "Un Nuevo Milenio"
 bm_993_desc: "Sacerdotes y eruditos cristianos hablan del paso de un nuevo milenio, testimonio del perdurable legado de Cristo y de la Santa Madre Iglesia. Sin embargo, un testamento aún mayor descansa sobre la frente de Esteban, recientemente coronado rey de los húngaros, cuya espada defiende ahora la fe cristiana que antaño temblaba de miedo ante los cascos de las huestes de sus padres. En otros lugares de Europa oriental y septentrional, el paganismo declina con la conversión de Polonia, la Rus de Kiev y los reinos escandinavos. Lejos hacia el este, en la periferia del mundo islámico, Mahmud de Ghazna ha recibido la investidura califal con el título honorífico de Yamin al-Dawla ("Mano derecha del Estado"), lo que convierte al humilde hijo de un esclavo turco en gobernante legítimo de la gran provincia de Jorasán. Entre estos dos se extiende un mundo dividido entre califatos, reinos e imperios, cada uno de los cuales compite por el dominio sobre los demás: ¿cuál de ellos establecerá su supremacía en este extraño nuevo mundo?"


 bookmark_france997: "Roberto II"
 bookmark_france997_subheading: "Rey de Francia"
 bookmark_france997_desc: "Roberto II de Francia, conocido como Roberto el Piadoso, reinó de 996 a 1031. Fue un rey religiosamente devoto que luchó por afirmar la autoridad real en medio de los desafíos de poderosos nobles. Su reinado destaca por su piedad, pero a menudo se considera un periodo de relativa debilidad de la monarquía francesa."

 bookmark_denmark997: "Sveinn"
 bookmark_denmark997_subheading: "King of Denmark"
 bookmark_denmark997_desc: "Sveinn Forkbeard fue un rey vikingo de Dinamarca que gobernó brevemente Inglaterra. Se le conoce sobre todo por sus invasiones vikingas de Inglaterra y su reivindicación del trono inglés a principios del siglo XI. El reinado de Sweyn marcó un periodo turbulento en la historia de Inglaterra, ya que desafió a los gobernantes anglosajones y estableció el control danés sobre Inglaterra durante un breve periodo antes de su muerte en 1014. Su hijo, Canuto el Grande, continuó su legado y se convirtió en uno de los gobernantes vikingos más famosos de la historia."

 bookmark_bulgaria997: "Samuil"
 bookmark_bulgaria997_subheading: "El zar de Bulgaria"
 bookmark_bulgaria997_desc: "Samuil fue un zar búlgaro que gobernó de 997 a 1014. Es famoso por su resistencia a los intentos bizantinos de reconquistar Bulgaria a finales del siglo X y principios del XI. El reinado de Samuil marcó un periodo de intenso conflicto entre los imperios búlgaro y bizantino. Sus campañas militares, en particular la batalla de Kleidion en 1014, fueron momentos cruciales en esta lucha. La derrota de Samuil en Kleidion a manos del emperador bizantino Basilio II supuso importantes pérdidas territoriales para Bulgaria. Samuil es recordado por su resistencia frente a la agresión bizantina y sus esfuerzos por preservar la independencia búlgara. Su reinado sigue siendo un capítulo notable de la historia del Primer Imperio Búlgaro."

 bookmark_ere997: "Basilio II"
 bookmark_ere997_subheading: "Basileo del Imperio Bizantino"
 bookmark_ere997_desc: "Basilio II fue un emperador bizantino conocido por sus vigorosas campañas militares contra el Primer Imperio Búlgaro. Se ganó el epíteto de "el matador de búlgaros" debido a sus despiadadas campañas para someter a los búlgaros a finales del siglo X y principios del XI. Uno de sus logros más significativos fue la batalla de Kleidion en 1014, en la que derrotó a las fuerzas búlgaras del zar Samuil, con el resultado de la captura y cegamiento de miles de soldados búlgaros. El reinado de Basilio II también fue testigo de la expansión territorial del Imperio Bizantino, incluida la incorporación de partes de Armenia y Georgia. Sin embargo, su implacable búsqueda de la conquista búlgara sigue siendo su legado más perdurable. Su gobierno se caracterizó por una administración centralizada y reformas encaminadas a fortalecer el Estado bizantino. Los éxitos militares de Basilio II y su firme control sobre el imperio contribuyeron al resurgimiento del Imperio bizantino como potencia regional. Basilio II falleció en 1025, dejando tras de sí un legado como formidable líder militar que desempeñó un papel fundamental en el conflicto bizantino-búlgaro de su época."

 bookmark_kiev997: "Vladímir"
 bookmark_kiev997_subheading: "Gran Príncipe de Kiev"
 bookmark_kiev997_desc: "Más conocido por su conversión al cristianismo y la posterior cristianización de la Rus de Kiev. Antes de su conversión, Vladimir practicaba el paganismo eslavo tradicional y gobernaba un reino caracterizado por la inestabilidad política y los conflictos tribales. Sin embargo, en su reinado se produjo un cambio hacia el cristianismo. La conversión de Vladimir al cristianismo en 988, al parecer tras considerar varias opciones religiosas, incluido el Islam, tuvo profundas consecuencias. Abrazó el cristianismo bizantino, lo que sentó las bases para la cristianización de la Rus de Kiev. Bajo el gobierno de Vladimir, se promovió activamente la difusión del cristianismo, lo que llevó a la construcción de iglesias y al establecimiento de una jerarquía cristiana. Su conversión contribuyó a la transformación cultural y religiosa de la Rus. Vladimir el Grande falleció en 1015, dejando tras de sí un legado como gobernante que desempeñó un papel crucial en la cristianización y unificación de la Rus de Kiev. Su conversión al cristianismo marcó un importante punto de inflexión en la historia de los eslavos orientales."

 bookmark_hungary997: "Esteban"
 bookmark_hungary997_subheading: "Gran Príncipe de Hungría"
 bookmark_hungary997_desc: "Esteban I, también conocido como San Esteban, fue el Gran Príncipe de las tribus húngaras desde 997 hasta su coronación como primer Rey de Hungría en 1000. Su reinado marcó el establecimiento del Reino cristiano de Hungría. Promovió activamente la difusión del cristianismo y trabajó para establecer un estado cristiano, alineando a Hungría con la cristiandad occidental. Esteban I llevó a cabo una serie de reformas, como la organización de una administración centralizada, la introducción de nuevas leyes y la promoción del cristianismo en la región. Desempeñó un papel fundamental en la configuración de la identidad política y religiosa de Hungría. Su reinado también fue testigo de la expansión territorial, ya que trabajó para asegurar las fronteras de Hungría y proteger el reino de amenazas externas. Esteban I fue canonizado como santo por la Iglesia Católica debido a sus esfuerzos por difundir el cristianismo y su contribución a la cristianización de Hungría. Su legado perdura en la historia húngara, ya que se le reconoce como fundador del Reino de Hungría y figura clave en la conversión del país al cristianismo."

 #Characters


 #####1194

 bm_1194: "Richard y Philippe"
 bm_1194_desc: "Ricardo Corazón de León y Felipe II Augusto se miran fijamente al otro lado del Canal de la Mancha. Gracias a la herencia, el soborno, la traición y la conquista oportuna, los reyes de Inglaterra han podido ocupar más de la mitad de las tierras reclamadas por los reyes franceses, y están peligrosamente cerca de reclamar la corona francesa. Felipe II, conocido por la historia como Augusto, el monarca que revirtió las conquistas inglesas y restauró la unidad y el prestigio de Francia, parece estar en una posición imposible: ¿podrá replicar sus increíbles hazañas? En otro lugar del mundo, el emperador del Sacro Imperio Romano Germánico ha reclamado el Reino de Sicilia como su derecho de nacimiento dinástico."

 bookmark_france1194: "Felipe II"
 bookmark_france1194_subheading: "Rey de Francia"
 bookmark_france1194_desc: "Felipe II, también conocido por su brillante apodo de "Dios-regalado" o "Augusto", nació en el verano de 1165, con la expectación y la esperanza de la dinastía Capetiana y de todo el pueblo francés. Desde 1165, cuando nació Felipe, hasta 1180, cuando se convirtió en rey, el reino francés fue una nación histórica y grande, pero no pudo ganar fuerza debido al poder de la dinastía vecina de los Plantagenet. Nadie imaginaba que Francia expulsaría a la familia real inglesa y uniría a Francia, pero Felipe sorprendentemente tiene que conseguir esos logros por sí mismo.\n\n#bold En 1194, su rival Ricardo, que regresaba de las Cruzadas y había sido detenido en el camino, fue liberado. Si Philippe supera todas las pruebas y llega a la cima, todos los franceses cantarán sus logros, pero va a ser un camino muy duro...#!" 

 bookmark_england1194: "Ricardo Corazón de León"
 bookmark_england1194_subheading: "Rey de Inglaterra"
 bookmark_england1194_desc: ""Fue un mal hijo, un mal marido, un mal rey, pero un galante y espléndido soldado". Es el modificador perfecto para Ricardo Corazón de León. Nacido como miembro de la dinastía Plantagenet en 1157, Ricardo se rebeló varias veces contra su padre, el rey Enrique II, y acabó convirtiéndose en rey de Inglaterra a la muerte de éste. Ricardo, que ascendió al trono, se dirigió a Jerusalén para la Tercera Cruzada. La destreza marcial de Ricardo en Tierra Santa le hizo ser conocido como "Corazón de León". Sin embargo, el arrogante Ricardo fue capturado y encarcelado por el hostil duque de Austria a su regreso de Tierra Santa, y sólo fue liberado tras pagar un enorme rescate.\n\n#bold Ricardo, que regresó a Inglaterra después de muchas vicisitudes, acabó muriendo por una flecha ciega en 1199 mientras reprimía la rebelión. ¿Podrá revertir el destino de Ricardo y unir a toda Francia bajo el dominio de Inglaterra?#!"

 bookmark_hre1194: "Enrique VI"
 bookmark_hre1194_subheading: "Santo Emperador Romano"
 bookmark_hre1194_desc: "En 1165, Heinrich, hijo de Barbarroja, nació con la ambición y los sueños en ambas manos. Educado desde muy joven como sucesor del rey, Heinrich recibió una educación superior en derecho romano, derecho eclesiástico y latín, y desde la pubertad fue conocido como mecenas de poetas y gran poeta él mismo. Heinrich, convertido en adulto, tiene un matrimonio fatídico. En 1186 se casó con Constanza, la única heredera del Reino de Sicilia. Esto dio a Heinrich y a sus sucesores una causa para reclamar los derechos de Sicilia más adelante, y cuando su padre murió durante la Tercera Cruzada, Heinrich, que le sucedió como emperador, reclamó la causa de su esposa y conquistó Sicilia.\n\n#bold La ambición de Heinrich parece haber llegado por fin a su fin. Pero los enemigos desconfían y recelan del poder del emperador. ¿Podrá Heinrich superar esta situación y emerger como la fuerza número uno de toda Europa?#!"  

 #Characters


 #####1144

 bm_1144: "La Anarquía"
 bm_1144_desc: "La Anarquía fue un periodo de la historia inglesa temprana en el que la dinastía del conquistador normando Guillermo se rompió y fue sustituida por la casa cadete de los Plantagenet. Comenzó cuando el segundo rey normando de Inglaterra, Enrique I, murió sin descendencia legítima. Aunque Enrique intentó colocar a su hija Matilde en el trono, los señores de Inglaterra no lo permitieron. En lugar de su hija, un descendiente masculino de Guillermo por línea femenina, Esteban de Blois, fue declarado rey. Sin embargo, el apoyo a Esteban no fue absoluto, y hubo muchos leales que se pusieron del lado de Matilde en la sucesión. La propia Matilde estaba casada con el primer hijo del rey Foulque de Jerusalén, Geoffrey de Anjou, que más tarde sería conocido como Geoffrey Plantagenet. Geoffrey ha conseguido conquistar Normandía en su nombre, y la crisis sucesoria entre el poderoso vasallo y el débil rey Esteban de Inglaterra parece inevitable."

 bookmark_england1144: "Esteban de Blois"
 bookmark_england1144_subheading: "Rey de Inglaterra"
 bookmark_england1144_desc: "Esteban, a menudo llamado Esteban de Blois, fue rey de Inglaterra desde el 22 de diciembre de 1135 hasta su muerte en 1154. Hijo menor del Conde de Blois, fue Conde de Boulogne jure uxoris desde 1125 hasta 1147 y Duque de Normandía desde 1135 hasta 1144. Su reinado estuvo marcado por la Anarquía, una guerra civil con su prima y rival, la emperatriz Matilde, cuyo hijo, Enrique II, sucedió a Esteban como el primero de los reyes angevinos de Inglaterra tras la firma del Tratado de Winchester, en el que Esteban reconoció a Enrique como su heredero a cambio de la paz, pasando por encima de Guillermo, el segundo hijo de Esteban. Esteban murió al año siguiente."

 bookmark_anjou1144: "Geoffrey el Guapo"
 bookmark_anjou1144_subheading: "Duke of Normandy"
 bookmark_anjou1144_desc: "Geoffrey V, llamado el Hermoso, el Hermoso o Plantagenet, fue conde de Anjou, Touraine y Maine por herencia desde 1129, y también duque de Normandía por conquista desde 1144. Su matrimonio con la emperatriz Matilde, hija del rey Enrique I de Inglaterra, dio lugar al reinado durante siglos de la dinastía Plantagenet en Inglaterra. El nombre "Plantagenet" se tomó del epíteto de Geoffrey. El dominio ancestral de Geoffrey, Anjou, dio lugar al nombre de Angevin, y a lo que se conoció como el Imperio Angevino en el siglo XII."


 #Characters


 #####1229

 bm_1229: "Azote de Dios"
 bm_1229_desc: "Vinieron de Oriente, despiadados y sin piedad: hombres extraños, vestidos con armaduras exóticas y hablando en lenguas guturales que nadie entendía. Los rumores que atravesaban la Ruta de la Seda y el Océano Índico contaban cómo Gengis Kan y sus invencibles hordas mongolas destrozaron los mayores imperios del mundo conocido, desde Catay hasta Persia. Aunque Gengis Khan ha muerto, los hijos y nietos de Gengis pretenden continuar sus conquistas. Tienen sus ojos puestos en Europa y el resto de Oriente Medio, y el mundo entero podría unirse bajo el estandarte de Gengis... si sus descendientes no acaban luchando entre ellos, claro. Tal vez el fin de los días haya llegado por fin, un castigo por los pecados de los malvados... o tal vez esta sea la mayor prueba de Dios para los fieles.\n\nLa Cuarta Cruzada ha dejado a Bizancio paralizado, y a sus anteriores estados vasallos no les va mucho mejor. Tres poderosos duques se disputan el control de Grecia, y sólo uno de ellos es griego. El odio entre los imperios latino y bizantino no ha disminuido, pero tampoco se ha avanzado hacia el descubrimiento del vencedor final en su lucha. La gloria y los títulos están ahí, para un hombre lo suficientemente fuerte como para aprovecharlos."

 bookmark_russia1229: "Miguel"
 bookmark_russia1229_subheading: "Prince of Chernigov"
 bookmark_russia1229_desc: "San Miguel de Chernigov fue gran príncipe de Kiev 1236-1240, 1240, 1241-1243. Las pruebas arqueológicas revelan que las ciudades de Chernihiv disfrutaron de un grado de prosperidad sin precedentes durante su periodo, lo que sugiere que la promoción del comercio era una prioridad para él. Los intereses comerciales, en parte, también le motivaron a hacerse con el control de Halych y Kiev porque eran canales por los que pasaban las mercancías del valle del Rin y de Hungría a Chernihiv. También negoció tratados comerciales y alianzas políticas con los polacos y los húngaros y alivió la carga fiscal de los novgorodianos y concedió a sus boyardos mayor libertad política frente al príncipe. Fue el último príncipe mayor autónomo de Kiev, donde fue depuesto no por un príncipe más poderoso, sino por los invencibles mongoles. En vísperas de la invasión mongola, era uno de los príncipes más poderosos de la Rus'. Mijaíl fue el primer príncipe de los Olgovichi (la dinastía de Chernigov) que se convirtió en mártir según el significado común de la palabra: sufrió la pena de muerte por persistir en su fe cristiana. Él y su boyardo Fedor (Teodoro) fueron torturados y decapitados por los tártaros."

 bookmark_norway1229: "Haakon IV"
 bookmark_norway1229_subheading: "King of Norway"
 bookmark_norway1229_desc: "Haakon IV Haakonsson fue rey de Noruega de 1217 a 1263. Haakon nació en la agitada época de la guerra civil en Noruega, pero su reinado consiguió finalmente poner fin a los conflictos internos. Bajo el gobierno de Haakon, se considera que la Noruega medieval alcanzó su cenit o edad de oro. Su reputación y su formidable flota naval le permitieron mantener la amistad tanto con el papa como con el emperador del Sacro Imperio Romano Germánico, a pesar de sus conflictos. El Papa le ofreció en distintos momentos la corona imperial, una delegación de reyes irlandeses le ofreció la alta realeza irlandesa y el rey francés el mando de la flota cruzada francesa. Amplió la influencia de la cultura europea en Noruega importando y traduciendo la literatura europea contemporánea al nórdico antiguo, y construyendo edificios monumentales de piedra de estilo europeo. Junto con esto, empleó una política exterior activa y agresiva, y al final de su gobierno añadió Islandia y la comunidad nórdica de Groenlandia a su reino, dejando a Noruega en su apogeo territorial. Aunque por el momento consiguió asegurar el control noruego de las islas situadas frente a las costas del norte y el oeste de Gran Bretaña, cayó enfermo y murió cuando pasaba el invierno en las Orcadas tras algunos enfrentamientos militares con el reino escocés en expansión."

 bookmark_denmark1229: "Valdemar II"
 bookmark_denmark1229_subheading: "King of Denmark"
 bookmark_denmark1229_desc: "Valdemar II el Conquistador era el rey de Dinamarca. En 1223, el rey Valdemar y su hijo mayor, el príncipe Valdemar, fueron secuestrados por el conde Enrique I de Schwerin mientras cazaban. El conde Enrique exigió que Dinamarca entregara las tierras conquistadas en Holstein 20 años atrás y se convirtiera en vasallo del emperador del Sacro Imperio Romano Germánico. Los enviados daneses rechazaron estas condiciones y Dinamarca declaró la guerra. Mientras Valdemar estaba en prisión, la mayoría de los territorios alemanes se separaron de Dinamarca y la guerra terminó con la derrota danesa. Para asegurar su liberación, Valdemar tuvo que reconocer los territorios escindidos en Alemania, pagar 44.000 marcos de plata y firmar una promesa de no buscar venganza contra el conde Enrique. Valdemar apeló inmediatamente al Papa Honorio III para que declarara nulo su juramento. Honorio III eximió a Valdemar de su juramento forzoso, e inmediatamente se puso a intentar restaurar los territorios alemanes. Una serie de derrotas danesas cimentaron la pérdida de los territorios alemanes del norte de Dinamarca. A partir de ese momento, el rey Valdemar II centró sus esfuerzos en los asuntos internos. Uno de los cambios que instituyó fue el sistema feudal. Esto aumentó el poder de las familias nobles y dio lugar a los nobles menores, que controlaban la mayor parte de Dinamarca. Los campesinos libres perdieron los derechos y privilegios tradicionales de los que habían disfrutado desde la época vikinga."

 bookmark_wales1229: "Llywelyn el Grande"
 bookmark_wales1229_subheading: "Prince of Wales"
 bookmark_wales1229_desc: "Llywelyn el Grande fue un rey de Gwynedd, en el norte de Gales, y acabó gobernando todo el país. Mediante una combinación de guerra y diplomacia, dominó Gales durante 45 años. En 1200 era el único gobernante de Gwynedd y ese año firmó un tratado con el rey Juan de Inglaterra. Las relaciones de Llywelyn con Juan siguieron siendo buenas durante los diez años siguientes. Se casó con la hija natural de Juan, Juana, en 1205, y cuando Juan arrestó a Gwenwynwyn ap Owain de Powys en 1208, Llywelyn aprovechó la oportunidad para anexionar el sur de Powys. En 1210, las relaciones se deterioraron y Juan invadió Gwynedd en 1211. Llywelyn se vio obligado a buscar condiciones y a renunciar a todas las tierras al este del río Conwy, pero pudo recuperarlas al año siguiente en alianza con los demás príncipes galeses. Se alió con los barones que obligaron a Juan a firmar la Carta Magna en 1215. En 1216, era el poder dominante en Gales, y ese año celebró un consejo en Aberdyfi para repartir las tierras entre los demás príncipes. Tras la muerte del rey Juan, Llywelyn concluyó el Tratado de Worcester con su sucesor, Enrique III, en 1218. Durante los quince años siguientes, Llywelyn se vio envuelto con frecuencia en luchas con los señores de las Marcas y a veces con el rey, pero también estableció alianzas con varias potencias importantes de las Marcas. La Paz de Middle en 1234 marcó el final de la carrera militar de Llywelyn, ya que la tregua acordada de dos años se prolongó año tras año durante el resto de su reinado. Mantuvo su posición en Gales hasta su muerte en 1240 y le sucedió su hijo Dafydd ap Llywelyn."

 bookmark_mali1229: "Sundiata Keita"
 bookmark_mali1229_subheading: "Mansa of Mali"
 bookmark_mali1229_desc: "Sundiata Keita fue un príncipe y fundador del Imperio de Malí. El gobernante maliense Mansa Musa, que peregrinó a La Meca, era su sobrino nieto. Fue durante su reinado cuando Malí empezó a convertirse en una potencia económica, tendencia que continuaron sus sucesores y que mejoraron gracias al trabajo de base realizado por Sundiata, que controlaba las rutas comerciales y los yacimientos de oro de la región. La constitución social y política de Malí comenzó a codificarse durante el reinado de Mansa Sundiata Keita. Conocidas como el Gbara y el Kouroukan Fouga, aunque no estaban escritas e incluso estaban sujetas a alteraciones en su redacción y cuando se registraron por primera vez en forma escrita, formaban parte de las normas sociales y políticas de Malí. Muchas de estas leyes se han incorporado a la constitución del Malí actual. Sundiata Keita no sólo fue un conquistador que supo gobernar un gran imperio con diferentes tribus y lenguas, sino que también desarrolló los mecanismos de la agricultura maliense y se dice que introdujo el algodón y el tejido en Malí. Hacia el final de su reinado, la "seguridad absoluta" habría "prevalecido en todo su dominio"."

 bookmark_almohad1229: "Abd al-Wahid II"
 bookmark_almohad1229_subheading: "Califato del Almohad Califato"
 bookmark_almohad1229_desc: "Abu Muhammad ar-Rashid Abd al-Wahid fue un califa rival almohade que reinó desde 1232 hasta su muerte. Abd al-Wahid sucedió a su padre Idris I, que había muerto mientras marchaba contra Yahya, que controlaba la capital, Marrakech. Su reinado marcó el inicio de la fragmentación final del imperio almohade. No pudo expulsar a Yahya de Marrakech, mientras que el emir de Tlemcen se independizó a partir de 1236 (fundando la dinastía zayyaní), siguiendo el ejemplo del gobernante hafsí Abu Zakariya Yahya en Túnez."

 bookmark_delhi1229: "Iltutmish"
 bookmark_delhi1229_subheading: "Sultan of Delhi"
 bookmark_delhi1229_desc: "Shams ud-Din Iltutmish fue el tercero de los reyes mamelucos que gobernaron los antiguos territorios ghuríes del norte de la India. Fue el primer soberano musulmán que gobernó desde Delhi, por lo que se le considera el fundador efectivo del sultanato de Delhi, que gobernaría el norte de la India durante 3 siglos. Iltutmish organizó la administración del sultanato, sentando las bases de su dominio sobre el norte de la India hasta la invasión mogol. Introdujo el tanka de plata y el jital de cobre, las dos monedas básicas del periodo del sultanato, con un peso estándar de 175 granos. Estableció el sistema Iqtadari: división del imperio en Iqtas, que se asignaban a los nobles y oficiales en lugar de un salario. Erigió muchos edificios, como mezquitas, monasterios, dargahs (santuarios o tumbas de personas influyentes) y un embalse para los peregrinos."

 bookmark_golden1229: "Batu Khan"
 bookmark_golden1229_subheading: "Kan de la Horda de Oro"
 bookmark_golden1229_desc: "Batu Khan fue un gobernante mongol y fundador de la Horda de Oro, una división del Imperio Mongol. Batu era hijo de Jochi y nieto de Gengis Kan. Su ulus fue el estado principal de la Horda de Oro, que gobernó la Rus, la Bulgaria del Volga, Cumania y el Cáucaso durante unos 250 años, tras destruir también los ejércitos de Polonia y Hungría. Tras la muerte de los hijos de Gengis Kan, se convirtió en el príncipe más respetado, llamado agha ("hermano mayor"), del Imperio Mongol. La conquista de la Rus de Kiev se produjo de su mano. A finales de 1241, Batu y Subutai estaban ultimando los planes para invadir Austria, Italia y Alemania cuando llegó la noticia de la muerte de Ögedei Khan, que falleció en diciembre de 1241. Batu quería continuar la guerra, pero Subutai le recordó la ley de Yassa (Их Засаг). Los mongoles se retiraron a finales de la primavera de 1242, ya que los príncipes de la sangre, y Subutai, fueron llamados a Karakorum, donde se celebró el kurultai. Batu era un Gran Kan en potencia, pero al no conseguir el título se dedicó a consolidar sus conquistas en Asia y los Urales."

 bookmark_ilkhanate1226: "Hülegü Khan"
 bookmark_ilkhanate1226_subheading: "Kan del Ilkanato"
 bookmark_ilkhanate1226_desc: "Hülegü Khan fue un gobernante mongol que conquistó gran parte de Asia occidental. Hijo de Tolui y de la princesa queraíta Sorghaghtani Beki, era nieto de Gengis Khan y hermano de Ariq Böke, Möngke Khan y Kublai Khan. El ejército de Hulagu expandió en gran medida la parte suroccidental del Imperio mongol, fundando el Iljanato de Persia, precursor de la eventual dinastía safávida, y luego del moderno estado de Irán. Bajo el liderazgo de Hulagu, el asedio de Bagdad (1258) destruyó la posición de Bagdad en la Edad de Oro islámica y debilitó a Damasco, lo que provocó un desplazamiento de la influencia islámica hacia el sultanato mameluco de El Cairo y puso fin a la dinastía abasí."

 bookmark_mongol1229: "Ögedei Khan"
 bookmark_mongol1229_subheading: "Gran Khan del Imperio Mongol"
 bookmark_mongol1229_desc: "Ögedei fue el tercer hijo de Gengis Kan y el segundo khagan-emperador del Imperio Mongol, sucediendo a su padre. Continuó la expansión del imperio que había iniciado su padre, y fue una figura mundial cuando el Imperio Mongol alcanzó su máxima extensión hacia el oeste y el sur durante las invasiones mongolas de Europa y Asia oriental. Como todos los hijos principales de Gengis, participó ampliamente en las conquistas de China, Irán y Asia Central."

 bookmark_persia1229: "Jalal al-Din"
 bookmark_persia1229_subheading: "Sah del Imperio corasmio"
 bookmark_persia1229_desc: "Jalal al-Din Mangburni fue el último Khwarazmshah de la línea Anushtegin. Al año siguiente, la capital jwarazmiana de Gurganj fue capturada y devastada por los mongoles. Mientras tanto, en la ciudad de Ghazni, Jalal al-Din reunió un importante ejército formado por jwarazmianos, turcos y ghuríes, y posteriormente derrotó a las fuerzas perseguidoras del líder mongol Gengis Khan en la batalla de Ustuva, la batalla de Kendakhar, la batalla de Waliyan, la batalla de Djerdin y la batalla de Parwan. Sin embargo, Jalal al-Din se vio obligado a retirarse al noroeste de la India por las fuerzas mongolas.Alal ad-Din pasó el resto de sus días luchando contra los mongoles, los pretendientes al trono y los selyúcidas de Rûm. Jalal ad-Din obtuvo una breve victoria sobre los selyúcidas y arrebató a los ayubíes la ciudad de Akhlat, en Turquía. En 1227, luchó contra los mongoles en la aproximación a Isfahan y, aunque no derrotó a los invasores tras sus grandes pérdidas, no pudieron aprovechar su victoria y se retiraron después a través del río Oxus. En 1231, los mongoles habían conquistado por completo lo que quedaba de Khwarazm y Jalal al-Din fue asesinado por un kurdo."

 bookmark_egypt1229: "Al-Kamil"
 bookmark_egypt1229_subheading: "Sultan of Egypt"
 bookmark_egypt1229_desc: "Al-Kamil fue un gobernante musulmán y el cuarto sultán ayubí de Egipto. Durante su mandato como sultán, los ayubíes derrotaron a la Quinta Cruzada. Los cruzados francos lo conocían como Meledin, nombre con el que todavía se le conoce en algunas fuentes occidentales antiguas. Como resultado de la Sexta Cruzada, cedió Jerusalén a los cristianos y se sabe que se reunió con San Francisco.\n\nEn 1218, a la muerte de Al-Adil, los dominios ayubíes se dividieron en tres partes: Al-Kamil gobernaba Egipto, su hermano Al-Muazzam Isa gobernaba en Palestina y Transjordania, y un tercer hermano, Al-Ashraf Musa, en Siria y la Jazira. Los otros dos reconocieron nominalmente la supremacía de Al-Kamil como sultán. En este punto, y de forma inusual para una sucesión ayubí, no hubo disensiones ni rivalidades evidentes entre los hermanos, en parte porque justo antes de la muerte de Al-Adil, Egipto había sido atacado por las fuerzas de la Quinta Cruzada. Al-Kamil ejemplificó las leyes islámicas de la guerra. Por ejemplo, después de que Al-Kamil derrotara a los francos durante las Cruzadas, Oliverus Scholasticus elogió y comentó cómo Al-Kamil abastecía de alimentos al ejército franco derrotado."

 bookmark_jerusalem1229: "Alicia"
 bookmark_jerusalem1229_subheading: "Regente de Jerusalén"
 bookmark_jerusalem1229_desc: "Alicia de Champaña fue reina consorte de Chipre de 1210 a 1218, regente de Chipre de 1218 a 1223 y de Jerusalén de 1243 a 1246. Era la hija mayor de la reina Isabel I de Jerusalén y del conde Enrique II de Champaña. En 1210, Alicia se casó con su hermanastro, el rey Hugo I de Chipre, recibiendo como dote el condado de Jaffa. Tras la muerte de su marido en 1218, asumió la regencia del hijo de ambos, el rey Enrique I. Con el tiempo, empezó a buscar contactos en los condados de su padre en Francia para reforzar su reclamación de Champagne y Brie frente a su primo Teobaldo IV. Sin embargo, los reyes de Francia nunca reconocieron su reclamación. Cuando su hijo alcanzó la mayoría de edad en 1232, Alicia abdicó de su regencia y partió hacia Francia para reclamar Champaña y Brie. Posteriormente, renunció a sus pretensiones y regresó a Tierra Santa."

 bookmark_latin1229: "Juan"
 bookmark_latin1229_subheading: "Emperador latino de Constantinopla"
 bookmark_latin1229_desc: "Juan de Brienne, también conocido como Juan I, fue rey de Jerusalén de 1210 a 1225 y emperador latino de Constantinopla de 1229 a 1237. Era el hijo menor de Erard II de Brienne, un rico noble de Champaña. Juan, destinado en un principio a la carrera eclesiástica, se convirtió en caballero y poseía pequeñas propiedades en Champaña hacia 1200. Tras la muerte de su hermano, Walter III, gobernó el condado de Brienne en nombre de su sobrino menor Walter IV (que vivía en el sur de Italia).\n\nFue elegido emperador en 1229 como co-gobernante principal (con Balduino II) del Imperio Latino, y fue coronado en Constantinopla en 1231. Juan III Vatatzes, emperador de Nicea, e Iván Asen II de Bulgaria ocuparon los últimos territorios latinos en Tracia y Asia Menor, asediando Constantinopla a principios de 1235. Juan dirigió la defensa de su capital durante los meses que duró el asedio, y los sitiadores sólo se retiraron después de que Geoffrey II de Acaya y las flotas unidas de las ciudades italianas derrotaran a su flota en 1236. Al año siguiente, Juan murió como fraile franciscano."

 bookmark_treb1229: "Juan I"
 bookmark_treb1229_subheading: "Emperador de Trebizond"
 bookmark_treb1229_desc: "Juan I Axouchos fue emperador de Trebisonda de 1235 a 1238. Poco se sabe del reinado de Juan, salvo que éste murió mientras jugaba al tzykanion, una variante del polo de moda entre la nobleza bizantina, al caer de su caballo y morir pisoteado. Su heredero fue un tal Ioannikios, que fue confinado en un monasterio y el segundo hermano de Juan, Manuel I, ascendió al trono."

 bookmark_nikaea1229: "Juan III"
 bookmark_nikaea1229_subheading: "Emperador de Nicaea"
 bookmark_nikaea1229_desc: "Juan III Doukas Vatatzes fue un gobernante de éxito que sentó las bases para la recuperación de Constantinopla por parte de Nicea. Consiguió mantener relaciones generalmente pacíficas con sus vecinos más poderosos, Bulgaria y el sultanato de Rum, y su red de relaciones diplomáticas se extendió al Sacro Imperio Romano y al Papado, mientras que sus fuerzas armadas incluían mercenarios francos. Juan III llevó a cabo la expansión nicaica en Europa, donde al final de su reinado había anexionado a su antiguo rival Tesalónica y se había expandido a expensas de Bulgaria y Epiro. También amplió el control de Nicea sobre gran parte del Egeo y se anexionó la importante isla de Rodas, al tiempo que apoyaba las iniciativas para liberar a Creta de la ocupación veneciana con vistas a su reunificación con el imperio bizantino de Nicea. Además, a Juan III se le atribuye el mérito de haber desarrollado cuidadosamente la prosperidad y la economía internas de su reino, fomentando la justicia y la caridad. A pesar de su epilepsia, Juan III ejerció un liderazgo activo tanto en la paz como en la guerra, se reivindicó como el verdadero heredero del Imperio Romano y fue conocido por sus abundantes fiestas de la cosecha. Medio siglo después de su muerte, Juan III fue canonizado como santo, con el nombre de Juan el Misericordioso."

 bookmark_england1229: "Enrique III"
 bookmark_england1229_subheading: "Rey de Inglaterra"
 bookmark_england1229_desc: "Enrique III, también conocido como Enrique de Winchester, fue rey de Inglaterra, señor de Irlanda y duque de Aquitania desde 1216 hasta su muerte. Enrique prometió respetar la Gran Carta de 1225, que limitaba el poder real y protegía los derechos de los principales barones. Su primer gobierno estuvo dominado primero por Hubert de Burgh y luego por Peter des Roches, que restableció la autoridad real tras la guerra. En 1230, el rey intentó reconquistar las provincias de Francia que habían pertenecido a su padre, pero la invasión fue una debacle. En 1232 estalló una revuelta dirigida por el hijo de Guillermo Mariscal, Ricardo Mariscal, que terminó con un acuerdo de paz negociado por la Iglesia."

 bookmark_france1229: "Luis IX"
 bookmark_france1229_subheading: "Rey de Francia"
 bookmark_france1229_desc: "Luis IX, conocido comúnmente como San Luis o Luis el Santo, es el único rey de Francia canonizado por la Iglesia Católica. Luis fue coronado a la edad de 12 años, tras la muerte de su padre Luis VIII; su madre, Blanca de Castilla, gobernó el reino como regente hasta que alcanzó la madurez. De adulto, Luis IX se enfrentó a conflictos recurrentes con algunos de los nobles más poderosos de su reino, como Hugo X de Lusignan y Pedro de Dreux. Simultáneamente, Enrique III de Inglaterra intentó restaurar las posesiones continentales angevinas, pero fue rápidamente derrotado en la batalla de Taillebourg. Su reinado es recordado como una edad de oro medieval en la que el Reino de Francia alcanzó su máximo nivel económico y político. Sus colegas europeos lo estimaban mucho, no sólo por su preeminencia militar o por el hecho de que gobernaba el reino más rico, sino también por su reputación de imparcialidad e integridad moral: a menudo se le pedía que arbitrara sus disputas."

 bookmark_hre1229: "Federico II"
 bookmark_hre1229_subheading: "Santo Emperador Romano"
 bookmark_hre1229_desc: "Federico II fue rey de Sicilia desde 1198, rey de Alemania desde 1212, rey de Italia y emperador del Sacro Imperio Romano Germánico desde 1220. Sus ambiciones políticas y culturales eran enormes, ya que gobernaba una vasta zona, empezando por Sicilia y extendiéndose por Italia hasta el norte de Alemania. Sin embargo, el papado se convirtió en su enemigo y acabó imponiéndose. Viéndose a sí mismo como un sucesor directo de los emperadores romanos de la antigüedad, fue emperador de los romanos desde su coronación papal en 1220 hasta su muerte; también fue reclamante del título de rey de los romanos desde 1212 y titular sin oposición de esa monarquía desde 1215. Como tal, fue rey de Alemania, de Italia y de Borgoña. Frecuentemente en guerra con el papado, que estaba acorralado entre las tierras de Federico en el norte de Italia y su reino de Sicilia en el sur, fue excomulgado tres veces y a menudo vilipendiado en las crónicas pro-papales de la época y posteriores. El Papa Gregorio IX llegó a llamarlo Anticristo. Tras su muerte, su linaje no sobrevivió y la Casa de Hohenstaufen llegó a su fin. Además, el Sacro Imperio Romano Germánico entró en un largo periodo de decadencia durante el Gran Interregno del que no se recuperó completamente hasta el reinado de Carlos V, 250 años después."

 bookmark_castille1229: "Fernando III"
 bookmark_castille1229_subheading: "Rey de Castilla y León"
 bookmark_castille1229_desc: "Fernando III, llamado el Santo, fue rey de Castilla desde 1217 y de León desde 1230, así como de Galicia desde 1231. Era hijo de Alfonso IX de León y de Berenguela de Castilla. A través de su segundo matrimonio fue también conde de Aumale. Fernando III fue uno de los reyes más exitosos de Castilla, asegurando no sólo la unión permanente de las coronas de Castilla y León, sino también dirigiendo la campaña de Reconquista más expansiva hasta la fecha.\NPor medio de esfuerzos militares y diplomáticos, Fernando amplió enormemente los dominios de Castilla anexionando el valle del río Guadalquivir en el sur de la Península Ibérica, estableciendo los límites del estado castellano para los dos siglos siguientes. Los nuevos territorios incluían importantes ciudades como Baeza, Úbeda, Jaén, Córdoba o Sevilla, que fueron objeto de Repartimiento, dotadas de un nuevo fuero general y repobladas en los años siguientes."

 bookmark_epirus1229: "Miguel II"
 bookmark_epirus1229_subheading: "Despot of Epirus"
 bookmark_epirus1229_desc: "Miguel II Komnenos Doukas fue desde 1230 hasta su muerte en 1266/68 el gobernante del Despotado de Epiro. Tras el asesinato de su padre en 1215 y la sucesión de su tío Teodoro Komnenos Doukas, se exilió. Según la hagiografía de su posterior esposa, Santa Teodora de Arta, Teodoro le envió a él y a su madre al exilio en el Peloponeso[5] Tras la derrota de Teodoro y su captura por Iván Asen II de Bulgaria en la batalla de Klokotnitsa, el trono de Tesalónica pasó a ser ocupado por el hermano de Teodoro, Manuel Komnenos Doukas, que consiguió escapar de Klokotnitsa. Miguel aprovechó la oportunidad y regresó al Epiro. Miguel consiguió rápidamente, al parecer con el apoyo de la población local, hacerse con el control del país."

 #Characters


 #####1297

 bm_1297: "Guerra de la Independencia de Escocia"
 bm_1297_desc: "En toda Escocia se produjo un descontento y un desorden generalizados después de que la Corona inglesa extendiera su dominio sobre Escocia. Andrew de Moray y William Wallace surgieron como los primeros patriotas escoceses importantes. Cuando la noticia del ataque de Wallace a los ingleses se extendió por toda Escocia, los hombres se unieron a él. A principios de junio, Wallace y Douglas planearon un ataque simbólico para liberar Scone, la sede del Justiciero de Escocia nombrado por los ingleses, William de Ormesby. Desde Scone, un lugar considerado sagrado por los escoceses, Ormesby había estado impartiendo justicia inglesa. Ormesby fue advertido del inminente asalto de Wallace y huyó apresuradamente. Al enterarse del inicio de un levantamiento aristocrático, Eduardo I, aunque ocupado en los acontecimientos de Francia, envió una fuerza de soldados de a pie y de jinetes bajo el mando de Sir Henry Percy y Sir Robert Clifford para resolver el "problema escocés". Al recibir informes de que Sir William Douglas había desertado a los rebeldes, Eduardo envió a Robert Bruce, conde de Carrick, junto con los vasallos de su padre de Annandale, para atacar la fortaleza de Douglas en Lanarkshire. Mientras viajaba hacia el norte para enfrentarse a Douglas, Bruce empezó a pensar dónde estaban realmente sus lealtades. Decidió seguir la causa escocesa, y se le cita diciendo: "Ningún hombre siente odio por su carne y su sangre, y yo no soy una excepción. Debo unirme a mi propio pueblo y a la nación en la que nací"."

 bookmark_scotland1297: "Roberto Bruce"
 bookmark_scotland1297_subheading: "King of Scotland"
 bookmark_scotland1297_desc: "Roberto I, conocido popularmente como Roberto Bruce, fue rey de Escocia desde 1306 hasta su muerte en 1329. Robert fue uno de los guerreros más famosos de su generación y acabó liderando a Escocia durante la Primera Guerra de la Independencia Escocesa contra Inglaterra. Luchó con éxito durante su reinado para recuperar el lugar de Escocia como país independiente y ahora es venerado en Escocia como un héroe nacional."

 bookmark_england1297: "Eduardo I"
 bookmark_england1297_subheading: "Rey de Inglaterra"
 bookmark_england1297_desc: "Eduardo I, también conocido como Eduardo Longshanks y el Martillo de los Escoceses, fue rey de Inglaterra desde 1272 hasta 1307. Eduardo pasó gran parte de su reinado reformando la administración real y el derecho común. A través de una amplia investigación legal, investigó la tenencia de varias libertades feudales, mientras que la ley fue reformada a través de una serie de estatutos que regulaban el derecho penal y de propiedad. Sin embargo, la atención de Eduardo se dirigió cada vez más hacia los asuntos militares. Eduardo respondió a una segunda rebelión galesa en 1282-83 con una guerra de conquista a gran escala. Tras una exitosa campaña, sometió a Gales al dominio inglés, construyó una serie de castillos y ciudades en el campo y los pobló con ingleses. A continuación, sus esfuerzos se dirigieron hacia el Reino de Escocia. Inicialmente invitado a arbitrar una disputa de sucesión, Eduardo reclamó la soberanía feudal sobre Escocia. La guerra que siguió continuó después de la muerte de Eduardo, aunque los ingleses parecieron victoriosos en varios momentos."

 bookmark_bohemia1297: "Wenceslao II"
 bookmark_bohemia1297_subheading: "Rey de Bohemia"
 bookmark_bohemia1297_desc: "Wenceslao II Přemyslid fue rey de Bohemia (1278-1305), duque de Cracovia (1291-1305) y rey de Polonia (1300-1305). Era el único hijo del rey Ottokar II de Bohemia y de la segunda esposa de éste, Kunigunda. En 1291, Przemysł II, Alto Duque de Polonia, cedió el ducado soberano de Cracovia a Wenceslao. Cracovia quedó asociada al señorío de Polonia, pero Przemysł mantuvo los demás ducados y en 1295 fue coronado rey de Polonia. Tras la muerte de Przemysł en 1296, Wenceslao se convirtió en señor de Polonia y en 1300 se hizo coronar rey de Polonia. En 1301, el pariente de Wenceslao, Andrés III de Hungría, murió y la dinastía Árpád se extinguió en la línea masculina. Wenceslao fue uno de los parientes que reclamó el trono, y lo aceptó de un grupo de húngaros en nombre de su joven hijo, prometido a la única hija de Andrés, Isabel. El 27 de agosto de 1301, su hijo fue coronado en Székesfehérvár como rey de Hungría. En aquella época, el Reino de Hungría estaba dividido en varios principados de facto, y el joven Wenceslao sólo fue aceptado como rey de Hungría por los gobernantes de la Alta Hungría, en el actual Burgenland y en el territorio alrededor de la capital, Buda. Pero los Abas y Mateo Csák cambiaron de bando en 1303 y comenzaron a apoyar al rival de Wenceslao, Carlos Roberto de Anjou. En consecuencia, el joven Wenceslao, en Ofen (Buda), tuvo miedo y escribió a su padre en Praga para pedirle ayuda. Su padre tomó un gran ejército e invadió Buda, pero tras considerar la situación, tomó a su hijo y la corona húngara y regresó a Bohemia (1304)."

 bookmark_hre1297: "Adolfo"
 bookmark_hre1297_subheading: "Rey de Alemania"
 bookmark_hre1297_desc: "Adolfo fue conde de Nassau desde aproximadamente 1276 y rey electo de Alemania desde 1292 hasta su deposición por los príncipes electores en 1298. Nunca fue coronado por el Papa, lo que le habría asegurado el título imperial. Fue el primer gobernante del Sacro Imperio Romano Germánico física y mentalmente sano que fue depuesto sin una excomunión papal. Adolfo murió poco después en la batalla de Göllheim luchando contra su sucesor Alberto de Habsburgo. Fue el segundo en la sucesión de los llamados condes-rey de varias casas comitales rivales que luchaban por la dignidad real romano-germana. En Pentecostés de 1297, el elector de Brandeburgo, el duque de Sajonia y el rey de Bohemia se unieron para hacer valer sus intereses. El Elector de Maguncia, Gerhard II, se asoció a este grupo."

 williamwallace: "William Wallace"
