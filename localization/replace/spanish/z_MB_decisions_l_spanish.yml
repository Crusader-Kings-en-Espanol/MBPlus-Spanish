 reform_anarchy_to_tribalism_decision_tooltip: "Adoptar el gobierno tribal"
 reform_anarchy_to_tribalism_decision_desc: "Mi dinastía ha demostrado exitosamente su capacidad para gobernar a lo largo de varias generaciones. Si yo declarara el derecho a gobernar como perteneciente a mí y a mi linaje, ¿quién se atrevería a desafiarlo? Todo lo que queda es hacer el anuncio."
