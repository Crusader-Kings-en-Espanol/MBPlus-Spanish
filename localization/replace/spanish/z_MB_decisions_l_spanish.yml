 court_amenities_interactions.0010.b_turned_down: "¡A todos les encanta el nuevo estilo!"
 court_amenities_interactions.0010.t: "Una Nueva Moda en la Corte"
 court_amenities_interactions.0010.desc_intro: "[actor.GetNameNoTooltip|U] ha irrumpido en la corte, llamando la atención de todos los señores y damas del reino con [actor.GetHerHis] prendas más peculiares."
 court_amenities_interactions.0010.desc.flag_big_collar: "[actor.GetSheHe|U] lleva una prenda adornada con un cuello de la circunferencia de una rueda de carreta."
 court_amenities_interactions.0010.desc.flag_head_dress: "[actor.GetSheHe|U] ha adoptado una tradicional corona inclinada a un lado de su cabeza en una burla torcida de la cultura [actor.GetCulture.GetName]."
 court_amenities_interactions.0010.desc.flag_gold_boots: "[actor.GetSheHe|U] recorrió el gran salón de [debate_locale.GetNameNoTierNoTooltip], con sus botas de metal sólidas adornadas con incrustaciones de oro, prácticamente partiéndose el suelo con su tremendo peso."
 court_amenities_interactions.0010.desc.flag_sleeveless: "[actor.GetSheHe|U] ha quitado las mangas de sus ropas nobles."
 court_amenities_interactions.0010.desc.flag_commoner_clothes: "[actor.GetSheHe|U] ha entrado en [debate_locale.GetNameNoTierNoTooltip] con la vestimenta de un campesino."
 court_amenities_interactions.0010.desc_outro: "¡y se ha atrevido a declarar que esta es la última moda del reino! Todos los tontos en la corte parecen caer ante ella, pero ¿debería alzar mi mano para terminar con esta locura?"
 court_amenities_interactions.0010.a_flag_big_collar: "¡Parece un pájaro que tragó un plato!"
 court_amenities_interactions.0010.a: "¿Qué #EMP estás#! usando?"
 court_amenities_interactions.0010.b: "Morderme el labio y tratar de no reír."
 court_amenities_interactions.0010.a.tt_success: "Convences a la multitud de que el atuendo de [actor.GetNamePossessiveNoTooltip] es estúpido."
 court_amenities_interactions.0010.a.tt_failure: "La multitud no está de acuerdo contigo y piensa que el atuendo de [actor.GetNamePossessiveNoTooltip] es la nueva tendencia de moda."
 court_amenities_interactions.0011.t: "De Moda y Disputas"
 court_amenities_interactions.0011.desc_intro: "Me paseo por mi corte, orgulloso de mi nueva declaración audaz de moda,"
 court_amenities_interactions.0011.desc.flag_big_collar: "mi ropa adornada con un enorme cuello redondo para que todos lo admiren."
 court_amenities_interactions.0011.desc.flag_head_dress: "mi usual corona inclinada a un lado de mi cabeza, trayendo algo nuevo y fresco a una prenda de vestir generalmente antigua y monótona."
 court_amenities_interactions.0011.desc.flag_gold_boots: "mis pesadas botas doradas brillando a la luz de la sala de [debate_locale.GetNameNoTierNoTooltip]"
 court_amenities_interactions.0011.desc.flag_sleeveless: "¡una nueva vestimenta sin mangas que exhibe mis brazos para que todos los vean!"
 court_amenities_interactions.0011.desc.flag_commoner_clothes: "que cuestiona por qué la nobleza debe vestirse de forma tan diferente a los plebeyos cuando la sencillez es tan elegante."
 court_amenities_interactions.0011.desc_bridge: "[recipient.Custom2('MyCharacterIntroduction', ROOT.Char)] grita hacia mí desde el otro lado del salón.\n\nNos lanzamos insultos mutuamente, defendiendo lo que claramente es la mejor moda por encima de la cabeza de una mente simple."
 court_amenities_interactions.0011.desc_won: "A medida que la nobleza local se aglomera a mi alrededor, puedo considerar mi declaración de moda un éxito rotundo."
 court_amenities_interactions.0011.desc_lost: "Mientras la nobleza de [debate_locale.GetNameNoTierNoTooltip] rápidamente se une a [recipient.GetNameNoTooltip] en burlarse de mi atuendo, sé que mi declaración de moda no fue apreciada en su tiempo."
 court_amenities_interactions.0011.a_won: "¡Siempre sé lo que es mejor!"
 court_amenities_interactions.0011.a_lost: "¡Ellos simplemente no #EMP me entienden#!"
 court_amenities_interactions.0012.desc_intro: "Bueno, algunos de nosotros somos seguidores, y otros líderes." [actor.GetNameNoTooltip] se mantiene firme en su compromiso con esa ropa ridícula.\n\nPasamos las siguientes horas debatiendo la naturaleza de la alta moda, con un pequeño grupo de cortesanos observando mientras yo lanzo insulto tras insulto a este tonto."
 court_amenities_interactions.0012.desc_won: "Antes de mucho tiempo, muchos otros cortesanos comienzan a unirse a mí para burlarse de [actor.GetNameNoTooltip], y sé que mi trabajo está hecho."
 court_amenities_interactions.0012.desc_lost: "Desafortunadamente, la multitud no parecía influenciada por mis argumentos y, en pocos días, soy el único en la corte #EMP no#! vistiendo como [actor.GetNameNoTooltip]."
 court_amenities_interactions.0012.desc_lost.kof: "No solo eso, sino que muchos han comenzado a referirse a [actor.GetHerHim] como el "[actor.GetTitleAsNameNoTooltip] de la Moda.""
 court_amenities_interactions.0012.a_lost: "¡Estoy rodeado de aduladores y tontos!"
 court_amenities_interactions.0013.desc: "Con el paso del tiempo, muchos en [debate_locale.GetNameNoTierNoTooltip] han comenzado a llamarme el [actor.GetTitleAsNameNoTooltip] de la Moda!"
 court_amenities_interactions.0013.a: "¡Salve al [actor.GetTitleAsNameNoTooltip]!"
