 invite_islamic_settlers_decision: "Invitar a Colonos Islámicos"
 invite_islamic_settlers_decision_tooltip: "Invitar a colonos islámicos a tu reino desde más allá de los mares"
 invite_islamic_settlers_decision_desc: "Los musulmanes han logrado muchos avances impresionantes en las artes, la ciencia y las matemáticas, y comerciar con ellos ha sido muy lucrativo. Tal vez la herramienta más útil que puedan ofrecer a nuestro estado es su religión, que ha ido creciendo lentamente en popularidad a medida que pequeñas comunidades musulmanas han crecido en los puertos donde los musulmanes comercian. Tal vez deberíamos considerar alentar a los musulmanes a asentarse aquí, y de este modo, tener algo que ver con la forma en que el Islam se establece."
 invite_islamic_settlers_decision_confirm: "Invitar a Colonos Islámicos"
 invite_islamic_settlers_decision_tt_a: "Invitar a colonos $islam_religion_adj$ de [GetGeographicalRegion('world_west_indian_ocean_region').GetName] y $e_celestia_china$ para establecer comunidades en nuestros condados. Esto hará que aparezcan o crezcan minorías musulmanas [minority_faiths|E] en tus condados."
