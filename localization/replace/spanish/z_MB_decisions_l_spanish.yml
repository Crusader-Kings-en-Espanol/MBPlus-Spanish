 embrace_ottoman_culture_decision_desc: "Mis vasallos, mi familia, y yo he vivido junto a los griegos y armenios, y como nuestro lenguaje y costumbres se han mezclado con los suyos, es el momento de abrazar el hecho de que nos hemos convertido en uno."
