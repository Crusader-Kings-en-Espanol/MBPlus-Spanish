 patron_decision.0001.t: "Selección de un Patron Saint"
 patron_decision.0001.desc: "La práctica de seleccionar a un santo patrono a quien se debe la devoción extra ha sido una práctica de larga data en la fe cristiana. Por sus vidas, los santos honraron a Dios y trajeron almas al Señor Jesucristo. Por esta razón, orar por su intercesión se ha convertido en un lugar común. Los santos particulares tienden a tener ciertos focos y, cuando oran para intercesión, dan dones distintos. Como tal, debe ser cuidadosamente considerado lo que se necesita y cuál santo tiene esos atributos."
