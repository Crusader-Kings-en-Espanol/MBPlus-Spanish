 fatimid_invasion.1002.t: "Ascenso de los Fatimíes"
 fatimid_invasion.1002.desc: "Entre 902 y 909 se fundó el estado fatimí por los bereberes Kutama, bajo el liderazgo del da'i Abu Abdallah, cuya conquista de Ifriqiya allanó el camino para el establecimiento del Califato. Tras esta conquista, Abdallah al-Mahdi Billah fue recuperado de Sijilmasa y luego aceptado como Imam del movimiento, convirtiéndose en el primer califa y fundador de la dinastía gobernante en 909. En 921, la ciudad de al-Mahdiyya fue establecida como la capital."
 fatimid_invasion.1002.a: "Dudo que [al_hakim.GetSheHe] llegue muy lejos."
