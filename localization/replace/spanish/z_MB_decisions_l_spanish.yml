 CLE.1001.t: "El Imperio Latino ha nacido"
 CLE.1001.desc: "[latin_emperor.GetName] ha ganado el control sobre grandes territorios del antiguo Imperio Bizantino. ¡Ahora gobiernan como el emperador católico y reconocido por Occidente!"
 CLE.1001.a: "¡Una nueva era para Roma ha comenzado!"
 rkho_poland_becomes_elective.title: "Monarquía Electiva en [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]"
 rkho_poland_becomes_elective.desc: "La tradición de elegir al gobernante del país, que ocurría cuando no había un heredero claro al trono o para confirmar el nombramiento del heredero, data de los primeros tiempos de la existencia del Estado polaco. Existen leyendas sobre la elección en el siglo IX del legendario fundador de la primera familia real polaca, Piast el Carpintero de la dinastía Piast, y una votación similar de su hijo, Siemowit (lo que colocaría el voto de un gobernante polaco un siglo antes que los primeros de Islandia por el Althing). Sin embargo, las fuentes de esa época son muy escasas y es difícil estimar si esas elecciones eran más que una formalidad. El privilegio electoral, ejercido durante las asambleas conocidas como wiec, solía estar limitado a los nobles más poderosos (magnates) o funcionarios, y estaba fuertemente influenciado por las tradiciones locales y la fuerza del gobernante."
 rkho_poland_becomes_elective.a: "Por el reino."
 rkho_hungary_becomes_elective.title: "Monarquía Electiva en [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]"
 rkho_hungary_becomes_elective.desc: "La tradición de elegir al gobernante del país, que ocurría cuando no había un heredero claro al trono o para confirmar el nombramiento del heredero, es una práctica antigua que se remonta a la memoria de los hijos de la Antigua Estepa, tan lejos como cualquiera pueda recordar."
 rkho_hungary_becomes_elective.a: "Por el reino."
 monastic_order_government: "Orden Monástica"
 monastic_order_government_desc: "En el siglo XII, las tradicionales órdenes monásticas en Ultaramar evolucionaron hacia órdenes militares, inicialmente con el propósito de defender a los peregrinos, aunque luego se convirtieron en fuerzas militares más grandes que jugaron un papel clave en la lucha contra los esfuerzos musulmanes de reconquista y en el apoyo de la continuidad del dominio cristiano en la región. Estas órdenes incluyeron los Caballeros Templarios y los Hospitalarios."
 monastic_order_elective_succession_law: "Electivo Monástico"
 monastic_order_elective_electors: "Electores"
 monastic_order_elective_candidates: "Candidatos"
 rkho_livonian_crusade_1.title: "La Cruzada Livona"
 rkho_livonian_crusade_1.desc: "Los grandes maestros fueron los más poderosos después de la conquista de Prusia por la orden en el siglo XIII durante las Cruzadas del Norte y la creación del Estado militarizado de la Orden Teutónica, que duró hasta 1525 (de 1466 a 1525 como parte del Reino de Polonia como feudo). Después de que la capital de la orden se trasladara de Venecia a Malbork (Marienburg) en 1309, el poder del gran maestro alcanzó su punto más alto."
 rkho_livonian_crusade_1.a: "¡Por los dioses!"
 rkho_prussian_crusade_1.title: "La Cruzada Prusiana"
 rkho_prussian_crusade_1.desc: "Los grandes maestros fueron los más poderosos después de la conquista de Prusia por la orden en el siglo XIII durante las Cruzadas del Norte y la creación del Estado militarizado de la Orden Teutónica, que duró hasta 1525 (de 1466 a 1525 como parte del Reino de Polonia como feudo). Después de que la capital de la orden se trasladara de Venecia a Malbork (Marienburg) en 1309, el poder del gran maestro alcanzó su punto más alto."
 rkho_prussian_crusade_1.a: "¡Por los dioses!"
 rkho_livonian_autonomy_1.title: "Autonomía Livona"
 rkho_livonian_autonomy_1.desc: "La orden se formó a partir de los restos de los Hermanos Livonios de la Espada después de su derrota por los samogitios en 1236 en la Batalla de Schaulen (Saule). Fueron incorporados a los Caballeros Teutónicos y pasaron a ser conocidos como la Orden Livonia en 1237. En el verano de ese año, el Maestre de Prusia Hermann Balk llegó a Riga para instalar a sus hombres como comandantes de castillos y administradores de Livonia."
 rkho_livonian_autonomy_1.a: "¡Por la gracia y el poder de nuestro señor!"
 rkho_teutonic_end.title: "Fin de la Orden Teutónica"
 rkho_teutonic_end.desc: "Los títulos de tierras alguna vez poderosos de la Orden Teutónica ya no son gobernados por los Gran Maestres. Como tal, se han convertido en nuevos y seculares reinos."
 rkho_teutonic_end.a: "Así es."
 rkho_livonian_end.title: "Fin de la Orden Livonia"
 rkho_livonian_end.desc: "Los títulos de tierras alguna vez poderosos de la Orden Livonia ya no son gobernados por los Gran Maestres. Como tal, se han convertido en nuevos y seculares reinos."
 rkho_livonian_end.a: "Así es."
 rkho_novgorod_becomes_a_republic.title: "Despido del Gran Príncipe de Novgorod"
 rkho_novgorod_becomes_a_republic.desc: "Los boyardos de Novgorod comenzaron a dominar los cargos de posadnik y tysyatsky, que hasta mediados del siglo XII habían sido nombrados por el gran príncipe en Kiev. En 1136, los novgorodianos despidieron al príncipe Vsevolod Mstislavich y durante el siguiente siglo y medio pudieron invitar y despedir a varios príncipes. Sin embargo, estas invitaciones o despidos estaban a menudo basados en quién era el príncipe dominante en Rus' en ese momento, y no en un pensamiento independiente por parte de Novgorod."
 rkho_novgorod_becomes_a_republic.a: "¡Cómo se atreven!"
 nomads.3.title: "Hombres de la Estepa"
 nomads.3.desc: "Los nómadas son un pueblo temible, experto en tiro con arco ecuestre. Estos guerreros vienen buscando oro y gloria a cambio de su servicio."
 nomads.3.hire: "Me servirán bien."
 dynn_Osman: "Osmanoglu"
 ottoman_establishment.1002.t: "Ascenso de los Otomanos"
 ottoman_establishment.1002.desc: "La fecha exacta del nacimiento de Osman es desconocida, y se sabe muy poco sobre su vida temprana y orígenes debido a la escasez de fuentes y los muchos mitos y leyendas que los turcos de siglos posteriores contarán sobre él. Según la tradición otomana, el padre de Osman, Ertuğrul, condujo a la tribu turca Kayı desde Asia Central hacia Anatolia, huyendo de la ofensiva mongola. Luego, juró lealtad al sultán de los seljucos anatolios, quien le otorgó dominio sobre la ciudad de Söğüt en la frontera bizantina. Sin embargo, esta conexión entre Ertuğrul y los seljucos fue en gran parte inventada por los cronistas de la corte un siglo después, por lo que los verdaderos orígenes de los otomanos siguen siendo oscuros."
 ottoman_establishment.1002.a: "Dudo que [osman.GetSheHe] llegue muy lejos."
 rule_ottoman_establishment: "Ascenso de los Otomanos"
 setting_ottoman_historical: "Histórico"
 setting_ottoman_historical_desc: "Osman aparece entre 1250 y 1350. #S no #!aparecerá en marcadores posteriores a 1256."
 setting_ottoman_random: "Aleatorio"
 setting_ottoman_random_desc: "Osman puede aparecer en cualquier momento"
 setting_ottoman_off: "Desactivado"
 setting_ottoman_off_desc: "Desactiva a Osman"
 seljuk_invasion.1002.t: "Ascenso de los Seljucos"
 seljuk_invasion.1002.desc: "Aunque estuvo largo tiempo en la memoria de los turcos después de su desaparición, los días de esplendor del Imperio Gök Türk terminaron en el año 741 de la Era Cristiana. Este estado había sido una confederación y, tras su desintegración, las tribus constituyentes se separaron. Entre los sobrevivientes de este naufragio de nómadas se encontraban los llamados Oghuz, de donde surgió la familia de Seljuk. La tribu principal de la confederación Oghuz era la tribu Qïnïq, dentro de la cual los Seljuk eran una familia líder. Su origen está envuelto en las nubes de la fábula y la niebla del romance. El progenitor de la familia Seljuk fue Temür-Yaligh, pero fue su hijo quien se convirtió en el ancestro epónimo de los Seljuk. Padre e hijo sirvieron al jefe de los Oghuz, quien pronto se puso celoso del poder e influencia de Seljuk. Seljuk huyó a Jand, donde se convirtió al Islam, adoptando la fe y el modo de vida de los Ghâzî, los guerreros por la fe."
