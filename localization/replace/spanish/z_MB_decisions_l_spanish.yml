 celebrate_christmas_decision: "Celebrar la Navidad"
 celebrate_christmas_decision_desc: "Es la época del nacimiento de Nuestro Salvador: un tiempo para regocijarse!"
 celebrate_christmas_decision_effect_tooltip: "Gaudete Christus ex natus ex Maria Virgine!"
 celebrate_easter_decision: "Celebrar la Pascua"
 celebrate_easter_decision_desc: "Es la época de la muerte y resurrección de nuestro Salvador."
 celebrate_easter_decision_effect_tooltip: "Tu, devícto mortis acúleo, aperuísti credéntibus regna cælórum."
 antioch_schism.0002.t: "Cristo, el Salvador, ha Nacido"
 antioch_schism.0002.desc: "La temporada de Navidad es una de grandes festividades. Todo el reino está lleno de júbilo: los niños corren, el clero ora al Señor, los enemigos dejan de lado sus disputas. Todos se reúnen con ansias de la llegada de Nuestro Señor Jesucristo."
 antioch_schism.0002.a: "¡Veni, veni Emmanuel!"
 antioch_schism.0003.t: "Cristo Resucita de la Tumba"
 antioch_schism.0003.desc: "La temporada de Pascua es precedida por un tiempo de penitencia. Los jóvenes azotaban sus espaldas con cuerdas y se cubrían con cilicios. No se encontraba ni un solo trozo de carne en todo el reino. Pero con la llegada de la Pascua, la penitencia se convierte en celebración: porque Cristo ha resucitado de la tumba."
 antioch_schism.0003.a: "Quóniam tu solus Sanctus, tu solus Dóminus, tu solus Altíssimus, Jesu Christe, cum Sancto Spíritu: in glória Dei Patris. Amen."
