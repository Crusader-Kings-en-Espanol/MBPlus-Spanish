 restore_school_of_edessa_decision: "Restaurar la Escuela Catequética de Edesa"
 restore_school_of_edessa_decision_desc: "La Escuela Catequetica de Edessa fue el centro del pensamiento neostoriano en el Cercano Oriente y fue destruida por los bizantinos."
 restore_school_of_edessa_decision_tooltip: "Un gobernante neostoriano suficientemente poderoso puede restaurar la escuela."
 restore_school_of_edessa_decision_effect_tooltip: "El Sitio Santo de Edessan será activado y todas las fes Nestorianas ganarán la Iglesia de la doctrina especial de Oriente"
