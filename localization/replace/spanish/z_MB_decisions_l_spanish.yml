 stress_loss_hashishiyah_decision_desc: "Unos bocados y parece que el estrés fluyera fuera de mi cuerpo. La mente se me empieza a nublar y me vence una sensación de paz y reposo. ¡No hay nada más relajante que un buen hachís!"
