 mamluks_invasion.1002.t: "Revuelta Mameluca en Egipto"
 mamluks_invasion.1002.desc: "El uso de los mamelucos como un componente principal de los ejércitos musulmanes se convirtió en una característica distintiva de la civilización islámica desde el siglo IX d.C. La práctica comenzó en Bagdad bajo el califa abasí al-Muʿtaṣim (833–842), y pronto se extendió por todo el mundo musulmán. Además, el resultado político era casi siempre el mismo: los esclavos explotaron el poder militar que se les otorgó para apoderarse del control de las autoridades políticas legítimas, a menudo solo por un breve período, pero a veces durante largos períodos. Así, poco después del reinado de al-Muʿtaṣim, el califato mismo cayó víctima de los generales mamelucos turcos, quienes pudieron deponer o asesinar a los califas casi con impunidad. Aunque el califato se mantuvo como un símbolo de autoridad legítima, el poder real lo ejercían los generales mamelucos; y para el siglo XIII, los mamelucos habían logrado establecer dinastías propias, tanto en Egipto como en la India, en las que los sultanes eran necesariamente hombres de origen esclavo o los herederos de tales hombres."
 mamluks_invasion.1002.a: "Dudo que [mamluks.GetSheHe] llegue muy lejos."
