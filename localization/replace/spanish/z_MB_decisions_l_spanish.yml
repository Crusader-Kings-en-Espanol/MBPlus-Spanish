 refound_lunden_decision: "Refundar Lunden"
 refound_lunden_decision_desc: "El Anglo-Saxon Chronicle registra que Alfred 'refundó' Londres en 886. La investigación arqueológica muestra este abandono implicado de Lundenwic y un avivamiento de la vida y el comercio dentro de las viejas paredes romanas. Londres entonces creció lentamente hasta un aumento dramático en alrededor de 950."
