 appoint_a_righteous_caliph_decision_mutazila_variant: "Restore Mu'tazila"
 appoint_a_righteous_caliph_decision_general_iranian_variant: "Romper con el califato"
 appoint_a_righteous_caliph_decision_mutazila_variant_desc: "Desde el final de la Mihna, los que defienden la creación del Corán han sido perseguidos o descuidados por los califas. Me lo tomaré a mí mismo para vengar las leves que hemos sufrido, y una vez más traer la doctrina de Mu'tazila a la vanguardia del pensamiento islámico."
 appoint_a_righteous_caliph_decision_general_iranian_variant_desc: "Aunque el Islam fue llevado a Persia por la fuerza, ninguno puede ahora negar nuestra creencia en la Unidad de [ROOT.Char.GetFaith.HighGodNameAlternate]. Pero nuestros caminos y las formas árabes han crecido aparte, y debemos romper con [ROOT.Char.GetFaith.GetReligiousHead.GetTitledFirstName] de una vez por todas. Por lo tanto, yo personalmente dirigiré el [ROOT.Char.GetFaith.GetAdjective] ."
 mozarabic_bind_the_faith_to_rome_decision: "Vincular la Fe a Roma"
 mozarabic_bind_the_faith_to_rome_decision_desc: "Aunque [ROOT.Char.GetFaith.GetReligiousHead.GetTitledFirstName] sigue siendo nuestro único Papa verdadero, el aislamiento de la voluntad del Vicario de Cristo nos ha llevado por caminos extraños. Fueron los días en que los grandes cónclaves del clero de Europa trodaron los pasillos de Toledo. \n \n Sin embargo, no tienen que ser... Si nuestra fe se ha estraído, ¿no podría un pastor fuerte yugo de vuelta al rebaño?"
 mozarabic_bind_the_faith_to_rome_decision_tooltip: "Rebinar el camino hacia [ROOT.Char.GetFaith.GetAdjective] [faith|E] a [ROOT.Char.GetFaith.GetReligiousHead.GetFaith.GetName]"
