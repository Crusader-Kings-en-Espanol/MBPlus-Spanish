 custom_nb_restore_byzantine_decision: "Restaurar el Imperio Romano de Oriente"
 custom_nb_restore_byzantine_decision.0001.t: "Imperio Romano de Oriente Restaurado"
 custom_nb_restore_byzantine_decision.0001.desc: "Ahora la bandera imperial ondea nuevamente en Constantinopla, la capital.\n\nLlevaba el diadema imperial de un gran Imperio Romano y restauré gran parte del territorio legítimo que el imperio había perdido.\n\nEl Patriarca reconoció que era el sucesor legítimo del imperio, y los ciudadanos de Constantinopla me aplauden a mí y a la legión romana y gritan 'Basileus'.\n\nUna vez el imperio sufrió y se desplomó debido a traidores internos y invasores externos, pero ya no más.\n\nSoy rey de reyes, gobernante de gobernantes."
 custom_nb_restore_byzantine_decision.0002.t: "Imperio Romano de Oriente Restaurado"
 custom_nb_restore_byzantine_decision.0002.desc.roman: "Orgullosos romanos restauraron Constantinopla y reconstruyeron el Imperio Romano.\n\nLos usurpadores perdieron poder y huyeron fuera de la frontera como ratas, y bajo el liderazgo del nuevo emperador, el imperio recuperó estabilidad.\n\n¡Un brillante futuro espera al imperio reconstruido! ¡Para siempre, Imperio Romano!"
 custom_nb_restore_byzantine_decision.0002.desc.hre: "Según informes, los griegos recuperaron Constantinopla y reconstruyeron el Imperio Griego.\n\nTodos los que ocuparon territorio griego huyeron, y se dice que el emperador del Imperio Griego estabiliza su gobierno con excelente control.\n\nNo necesitamos preocuparnos. El imperio de esos pretendientes griegos está destinado a colapsar nuevamente de todos modos."
 custom_nb_restore_byzantine_decision.0002.desc.muslim: "Según los informes, los romanos restauraron Constantinopla y reconstruyeron el imperio.\n\nEl poderoso emperador romano y sus legiones, restauradas por sus manos, controlan Grecia y Anatolia y restauran las fronteras del imperio.\n\nSi el Imperio Romano se fortalece nuevamente bajo el liderazgo de ese emperador cristiano, nos atacarán nuevamente..."
  custom_nb_restore_byzantine_decision.0002.desc.slav: "Según los informes, los romanos de Grecia restauraron la capital y reconstruyeron el imperio.\n\nEl emperador romano y sus poderosas legiones supuestamente restauraron la frontera entre Grecia y el oeste de Anatolia y estabilizaron la frontera.\n\nNo sé cómo afectará esto a nosotros los eslavos, pero es hora de que establezcamos nuestra propia hegemonía."
 custom_nb_restore_byzantine_decision.0002.desc.fallback: "Según los informes, el Imperio Bizantino había sido reconstruido en los Balcanes y Anatolia.\n\nEl emperador restauró Constantinopla y estabilizó su territorio, y los invasores huyeron fuera de la frontera.\n\nNo sé si este evento nos ayudará o será una dificultad, pero heraldará una nueva era..."
 custom_nb_restore_byzantine_decision.0002.l: "El titular de Nova Roma ha cambiado nuevamente..."
 historical_catholic_norse_conversion_decision: "Cristianizar a los nórdicos"
 historical_catholic_norse_conversion_decision_tooltip: "Los hombres del norte bajo su gobierno adoptan el cristianismo católico"
 historical_catholic_norse_conversion_decision_desc: "Durante muchos años, nuestro pueblo ha asaltado y negociado con las islas occidentales cercanas y el continente sur. Estas personas luchan ferozmente y temen a su Dios singular, donde no tememos a nuestros dioses. ¿Esto tal vez significa que el 'Cristo victorioso' habla de aferramientos y otorga mayor fuerza? Sea para inclinarse ante Cristo y Su Vicario en Roma, o simplemente para evitar que su clero nos acostumbre en nuestras tierras, parece claro que la Cruz es el futuro de la fe de nuestro pueblo."
 historical_catholic_norse_conversion_decision_confirm: "¡Envíen por el Papa!"
 historical_catholic_westslav_conversion_decision: "Cristianizar el Slavicum occidental"
 historical_catholic_westslav_conversion_decision_tooltip: "La gente eslava occidental bajo su gobierno adopta el cristianismo católico"
 historical_catholic_westslav_conversion_decision_desc: "Durante muchos años, nuestro pueblo ha tratado con los moravos y los franquistas tanto en el comercio como en la guerra. Tal vez sea hora de forjar vínculos más estrechos con nuestros vecinos occidentales, a cambio de su reconocimiento de nosotros como personas independientes y autodeterminantes. Si la autoridad religiosa más alta del mundo occidental reconoce nuestro territorio como un estado soberano, nuestro pueblo sólo puede beneficiarse de abandonar a los viejos dioses."
 historical_catholic_westslav_conversion_decision_confirm: "¡Envíen por el Papa!"
 rus_gathering_decision: "Organizar una reunión de príncipes rusos"
 rus_gathering_decision_tooltip: "Oigamos lo que otros Príncipes tienen que decir..."
 rus_gathering_decision_desc: "Como gobernante de Rus, tengo una posición importante. Es en mi mejor interés invitar a otros príncipes poderosos a ganar su favor y discutir asuntos de nuestros reinos, esto ayudará a solidificar mi autoridad."
 rus_gathering_decision_confirm: "Envía las invitaciones."
 historical_orthodox_rus_conversion_decision: "Cristianizar a los rusos"
 historical_orthodox_rus_conversion_decision_tooltip: "La gente de Rus bajo su regla adopta el cristianismo ortodoxo"
 historical_orthodox_rus_conversion_decision_desc: "Durante muchos años, nuestro pueblo ha allanado y negociado con el reino rico de los romanos más allá del Mar Negro. En Constantinopla se encuentra la Hagia Sophia, el lugar de culto más grande del mundo conocido. ¿Tal vez ha llegado el momento de abandonar a los viejos dioses y adoptar la fe de la Ciudad del Deseo del Mundo? Después de todo, Jesús convirtió el agua en vino, y ¿no es cierto que beber es la alegría de todo Rus?"
 historical_orthodox_rus_conversion_decision_confirm: "¡Envíen por el Patriarca!"
 historical_russian_culture_conversion_decision: "Adoptar las costumbres de los rusos"
 historical_russian_culture_conversion_decision_tooltip: "Tú y algunas de tus tierras adoptarán las formas de los Rus"
 historical_russian_culture_conversion_decision_desc: "Vivimos entre las tierras de la gran Rus, y muchos de nuestros súbditos siguen sus caminos, pero somos ajenos a ellos. Esto debe ser rectificado si debemos gobernar más eficazmente."
 historical_russian_culture_conversion_decision_confirm: "¡Gloria a la Rus!"
 accept_the_pomory_decision: "Aceptar a los colonos pomoranos"
 accept_the_pomory_decision_tooltip: "Tú y algunas de tus tierras adoptarán las formas de los Rus"
 accept_the_pomory_decision_desc: "Los colonos eslavos de las tierras de la Rus buscan entrar en nuestro reino para hacer nuevas vidas y buscar nuevas fortunas. Podríamos ganar favor entre los nuevos aliados potenciales si no sólo aceptamos su presencia, sino también adoptamos algunas de sus maneras."
 accept_the_pomory_decision_confirm: "¡Qué idea!"
 northern_expansion_decision: "Planificar la expansión hacia el norte"
 northern_expansion_decision_tooltip: "Los preparativos deben hacerse."
 northern_expansion_decision_desc: "Para lograr su grandeza destinada, se requiere más acceso al mar para el comercio y la expansión de la influencia. El aumento en el territorio sólo servirá para fortalecer el reino de Novgorod.d."
 northern_expansion_decision_confirm: "¡Novgorod crecerá!"
 moscow_rising_decision: "Gran Principado de Moscovia"
 moscow_rising_decision_tooltip: "Encontramos un nuevo Estado ruso."
 moscow_rising_decision_desc: "Los Rus están en agitación. Kiev ya no es el centro cultural y de aprendizaje que era. Mientras sufrimos y trabajamos en la oscuridad y bajo la yema, puede ser posible... hay una idea... una idea de algo mayor."
 moscow_rising_decision_confirm: "¡Gloria a los Muscovites!"
 lithuanian_expansion_decision: "Expansión de Lituania"
 lithuanian_expansion_decision_tooltip: "Lay claim to Ruthenia"
 lithuanian_expansion_decision_desc: "Ruthenia se encuentra en la puerta de nuestro reino, sólo necesitamos llegar y tomarlo."
 lithuanian_expansion_decision_confirm: "¡Por el Reino!"
 historical_orthodox_perm_conversion_decision: "Rendirse a los misioneros ortodoxos rusos"
 historical_orthodox_perm_conversion_decision_tooltip: "Las personas bajo su regla adoptan el cristianismo ortodoxo"
 historical_orthodox_perm_conversion_decision_desc: "Durante muchos años, los hombres predicando la palabra de Dios y su único hijo engendrado han venido de nuestros vecinos occidentales en las tierras de la vieja Rus. Tal vez sea el momento de ceder, si por ninguna otra razón que agradar a nuestros nuevos aliados potenciales."
 historical_orthodox_perm_conversion_decision_confirm: "¡Envíen por el Patriarca!"
 historical_north_iberia_christianity: "Aceptar la influencia cristiana"
 historical_north_iberia_christianity_tooltip: "Tú y gran parte de tu reino volverán al catolicismo"
 historical_north_iberia_christianity_desc: "El pueblo de este reino es tradicionalmente cristiano y nunca se convertirá verdaderamente a nuestra fe. Afirman ser conversos, pero practican sus viejas religiones en secreto. Debemos convertirnos y permitir que aquellos que están escondidos salgan a la luz y practiquen abiertamente, solo entonces podremos gobernar lo mejor posible."
 historical_north_iberia_christianity_confirm: "Toda la gloria al Hijo de Dios."
 historical_south_iberia_islam: "Aceptar la influencia islámica"
 historical_south_iberia_islam_tooltip: "Tú y gran parte de tu reino volverán al islam sunní"
 historical_south_iberia_islam_desc: "El pueblo de este reino es tradicionalmente musulmán y nunca se convertirá verdaderamente a nuestra fe. Afirman ser conversos, pero practican sus viejas religiones en secreto. Debemos convertirnos y permitir que aquellos que están escondidos salgan a la luz y practiquen abiertamente, solo entonces podremos gobernar lo mejor posible."
 historical_south_iberia_islam_confirm: "Toda la gloria al Profeta de Alá."
 historical_west_persia_shia_conversion_decision: "Aceptar la verdadera fe de Alá"
 historical_west_persia_shia_conversion_decision_tooltip: "Usted y algunas de sus tierras seguirán la verdadera palabra del Profeta"
 historical_west_persia_shia_conversion_decision_desc: "Podemos venir de un legado del camino de Al-Sunnah, pero nuestros sacerdotes han demostrado ahora que este camino es falso. Y lo más importante, todos nuestros enemigos son del Al-Sunnah!"
 historical_west_persia_shia_conversion_decision_confirm: "¡Alá es bueno!"
 historical_steppe_islam_conversion_decision: "Ceder a los Misioneros Islámicos"
 historical_steppe_islam_conversion_decision_tooltip: "Tú y algunas de tus tierras seguirán la palabra del Profeta"
 historical_steppe_islam_conversion_decision_desc: "Durante muchos años, los hombres que predican la palabra de Dios y su profeta de los famosos reinos ricos e infamesmente fuertes al sur de la Gran Estepa han susurrado en la oreja de muchos caballos. Tal vez es hora de ceder, si por ninguna otra razón que engrasar las ruedas del comercio."
 historical_steppe_islam_conversion_decision_confirm: "¡Alá es bueno!"
