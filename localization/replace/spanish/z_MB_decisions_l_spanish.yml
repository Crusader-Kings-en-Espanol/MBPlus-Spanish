 scrape_the_barrel_decision: "Raspar el Barril"
 scrape_the_barrel_decision_desc: "Mi Corte Real es una falda de individuos cualificados para llenar los muchos puestos de la corte necesarios para mantener un [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] próspero ! \n \n Mi casa carece de la grandeza que merece, pero tal vez la solución aquí se encuentra en los lugares más improbables ..."
 scrape_the_barrel_decision_tooltip: "reclutaremos un [lowborn|E] para llenar un [court_position|E] al azar"
 scrape_the_barrel_decision.tt: "$scrape_the_barrel _decision_tooltip$"
 scrape_the_barrel_decision_confirm: "¡Comenzad a buscar!"
 minor_decisions.0003.t: "Raspando el Barril"
 minor_decisions.0003.desc.opening: "¡Mi barrido por [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] ha arrastrado a [barrel_character.GetName] para verme!"
 minor_decisions.0003.desc.diseased: "¡Delante de mí se encuentra un campesino enfermo cubierto de suciedad, vómito seco y una mirada en los ojos de [barrel_character.GetHerHis] apenas consciente!"
 minor_decisions.0003.desc.physical: "Lo que veo frente a mí es un campesino de aspecto más inusual, mirándome con asombro y reverencia como si fuera [ROOT.Char.GetFaith.HighGodName] [ROOT.Char.GetFaith.HighGodHerselfHimself]. Claramente, las condiciones del nacimiento de [barrel_character.GetHerHis] le han causado un dolor innecesario y ostracismo por parte de los plebeyos de [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]."
 minor_decisions.0003.desc.maimed: "El [barrel_character.GetWomanMan] parece haber visto más de lo que le corresponde en conflicto y crueldad en este mundo, y lleva las huellas de cada puño y cuchilla que lo derribaron."
 minor_decisions.0003.desc.criminal: "Este desgraciado fue sacado de las mazmorras; encerrado por crímenes innombrables contra la corona, esperando el perdón a cambio de [barrel_character.GetHerHis] habilidades."
 minor_decisions.0003.desc.ewan: "Lo que me veo obligado a mirar es una pesadilla horrenda de un [barrel_character.GetWomanMan], que apenas parece un ser humano. ¡La criatura desdichada está tan plagada de enfermedades, malformaciones e injurias que es un acto de brujería que [barrel_character.GetSheHe] sea capaz de mantenerse en pie!"
 minor_decisions.0003.desc.criminal_bridge: "\n\nAunque [barrel_character.GetSheHe] es un traidor culpable,"
 minor_decisions.0003.desc.bridge_1: "\n\nA pesar de [barrel_character.GetHerHis] aflicción,"
 minor_decisions.0003.desc.bride_2: "se ha traído a mi atención que [barrel_character.GetSheHe] es un hábil"
 minor_decisions.0003.desc.educated: "erudito, de alguna manera educado en el lenguaje escrito a pesar de la baja posición de [barrel_character.GetHerHis] en la vida. Siento que [barrel_character.GetNameNoTooltip] serviría bien en la corte en asuntos de religión, erudición o salud."
 minor_decisions.0003.desc.cunning: "estafador, ganando fortuna engañando a los lugareños de cada centavo que pueden sacarles. Su astucia y destreza harían bien a mi lado, escuchando los susurros que surgen en la corte y trayendo justicia a quienes hacen mal a la Corona."
 minor_decisions.0003.desc.charismatic: "diplomático con habilidades en el idioma [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip] que rivalizan con cualquier noble! La carisma subversiva y apariencia inusual de [barrel_character.GetHerHis|U] seguramente llamará la atención de cualquier noble extranjero que visite mi corte."
 minor_decisions.0003.desc.organised: "mercader con un entendimiento de las finanzas y la organización mucho más allá de lo que esperaría de un plebeyo. Sin duda, este [barrel_character.GetWomanMan] está desperdiciado como plebeyo y ha sido elegido por [ROOT.Char.GetFaith.HighGodName] para ascender al rango de nobleza y servirme en la corte."
 minor_decisions.0003.desc.strong: "líder, ganando incontables escaramuzas y liderando a [barrel_character.GetHerHis] grupo de bandidos de incursión en incursión. Sin duda, [barrel_character.GetSheHe] está desperdiciado rodando en un estofado de barro y sangre cometiendo robos menores en el campo y debería, en su lugar, ponerse los galones reales y unirse a mi fina corte."
 minor_decisions.0003.desc.outro: "Mi consejo ha determinado el rol que mejor le corresponde a [barrel_character.GetNameNoTooltip], la única pregunta que queda es si realmente estoy dispuesto a seguir con esto o no."
 minor_decisions.0003.a: "¡Por supuesto! ¡Bienvenido a la nobleza, [barrel_character.GetNameNoTooltip]!"
 minor_decisions.0003.b: "¡Solo el comercio de ejecución le corresponde a esta #EMP criatura#!."
 minor_decisions.0003.c: "[ROOT.Char.GetFaith.HighGodName], ¡tráeme a otra persona!"
 minor_decisions.0003.d: "Uhhh, aún no estamos tan desesperados..."
