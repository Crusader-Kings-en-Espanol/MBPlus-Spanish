 gain_weight_decision_desc: "Las limitaciones de mi cuerpo se están volviendo demasiado notorias. ¡Apenas tengo fuerzas para pasar el día!\n\nSe me ha sugerido una dieta que contiene, entre otras cosas, mucha leche, mantequilla y dátiles. Creo que es hora de probarla."
