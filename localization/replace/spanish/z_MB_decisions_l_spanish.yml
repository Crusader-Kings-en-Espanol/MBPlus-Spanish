 mz_build_pyramids_decision: "Construct Pyramid"
 mz_build_pyramids_decision_desc: "Para honrar adecuadamente a nuestros muertos, los grandes edificios deben estar preparados para albergar no sólo sus restos mortales, sino todas las posesiones que tendrán necesidad en la próxima vida. Tal gran construcción también traería gloria a mi reino y el [ROOT.Char.GetDynasty.GetName] [dynasty|E] ."
