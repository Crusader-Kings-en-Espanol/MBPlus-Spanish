 stablesteppenomads.0003.t: "Subyugación de la estepa $turkic$"
 stablesteppenomads.0003.desc: "A través de una brutal subyugación, la $e_golden_horde$ ha establecido un dominio duradero sobre los nómadas $turkic$."
