 espana.0001.t: "El Reino de Aragón"
 espana.0001.desc: "Este día será recordado por siempre como el amanecer del gran Reino de Aragón. A lo largo de los milenios, muchas civilizaciones han gobernado estas tierras. Todas han contribuido a la compleja red que es nuestra herencia cultural. Hoy tenemos nuestra propia identidad única, y al formar este nuevo reino nos llamamos orgullosamente aragoneses."
 espana.0001.a: "¡Ahora comienza nuestro tiempo!"
 espana.0002.start.desc: "¡Ha llegado una nueva era a la Península Ibérica!"
 espana.0002.relation_former.desc: "Mi [ROOT.Char.Custom2('RelationToMe', aragon_former)] [aragon_former.GetTitledFirstName]"
 espana.0002.former.desc: "[aragon_former.GetTitledFirstName]"
 espana.0002.end.desc: "ha formado el Reino de Aragón bajo la sombra de las Montañas de los Pirineos. Después de años de lucha, un orgulloso pueblo aragonés ha surgido, con [aragon_former.GetTitledFirstNameNoTooltip] como su líder.\n\n¿Se alzará esta joven nación hacia la gloria o será consumida en otra conquista? Solo el tiempo lo dirá."
 espana.0002.a1: "¡Gloria a [ROOT.Char.GetFaith.WarGodName]!"
 #espana.0002.b: "[ROOT.Char.GetFaith.WarGodName] bless Aragon!"
 #espana.0002.c: "I am still [ROOT.Char.GetCulture.GetName], no matter what they think."
 espana.0005.t: "El Reino de León"
 espana.0005.desc: "Este día marca el comienzo de una nueva era. ¡Los moros de la Iberia nos han amenazado por demasiado tiempo, y es hora de cambiar el curso de la guerra! ¡Usemos esta ubicación estratégica para montar una ofensiva y reconquistar la tierra de nuestros ancestros!"
 espana.0005.a: "¡Deus Vult!"
 espana.0006.start.desc: "¡Ha llegado una nueva era a la Península Ibérica!"
 espana.0006.relation_former.desc: "Mi [ROOT.Char.Custom2('RelationToMe', leon_former)] [leon_former.GetTitledFirstName]"
 espana.0006.former.desc: "[leon_former.GetTitledFirstName]"
 espana.0006.end.desc: "ha movido su capital a la provincia de León, y en consecuencia cambió el título de [leon_former.GetHerHisMy], viendo el aparente fin del Reino de Asturias. ¿Proveerá este movimiento estratégico a [leon_former.GetTitledFirstNameNoTooltip] la ventaja que necesita para montar una ofensiva contra los moros de Iberia? Sólo el tiempo lo dirá."
 espana.0006.a1: "¡Gloria a [ROOT.Char.GetFaith.WarGodName]!"
 espana.0010.t: "El Reino de Castilla"
 espana.0010.desc: "Este día será recordado por siempre como el amanecer del gran Reino de Castilla. A lo largo de los milenios, muchas civilizaciones han gobernado estas tierras. Todas han contribuido a la compleja red que es nuestro patrimonio cultural. ¡Hoy tenemos nuestra propia identidad única, y al formar este nuevo reino nos llamamos orgullosamente castellanos!"
 espana.0010.a: "¡Ahora comienza nuestro tiempo!"
 espana.0011.start.desc: "¡Ha llegado una nueva era a la Península Ibérica!"
 espana.0011.relation_former.desc: "Mi [ROOT.Char.Custom2('RelationToMe', castille_former)] [castille_former.GetTitledFirstName]"
 espana.0011.former.desc: "[castille_former.GetTitledFirstName]"
 espana.0011.end.desc: "ha formado el Reino de Castilla en su costa norte. Después de años de lucha, ha surgido un pueblo castellano orgulloso, con [castille_former.GetTitledFirstNameNoTooltip] como su líder.\n\n¿Se alzará esta joven nación hacia la gloria o será consumida en otra conquista? Sólo el tiempo lo dirá."
 espana.0011.a1: "¡Gloria a [ROOT.Char.GetFaith.WarGodName]!"
 #espana.0011.b: "[ROOT.Char.GetFaith.WarGodName] bless Castille!"
 #espana.0011.c: "I am still [ROOT.Char.GetCulture.GetName], no matter what they think."
 espana.0020.t: "Un Reino Visigodo Unido"
 espana.0020.desc: "Después de siglos de lucha contra los moros, los reinos visigodos han sido nuevamente unidos bajo un [ROOT.Char.GetTitleAsNameNoTooltip]. ¡Este día, hacemos orgullosos a nuestros antepasados restaurando el Reino de Toledo, ¡el verdadero reino de nuestro antiguo pueblo!\n\nUn día partiré de este mundo y llegaré al [ROOT.Char.GetFaith.DivineRealm], pero mi legado permanecerá en la Tierra para siempre. Me llamarán '[ROOT.Char.GetTitledFirstNameNoTooltip] — el [ROOT.Char.GetMotherFather|U] de los visigodos.'"
 espana.0020.a: "Este es el amanecer de una nueva era."
 espana.0021.start.desc: "Han pasado siglos desde que los visigodos fueron considerados una fuerza poderosa en Iberia, pero después de mucha lucha, los reinos visigodos han sido unidos bajo el mando de [toledo_former.GetPrimaryTitle.GetNameNoTier], [ROOT.Char.GetTitleAsNameNoTooltip] de Toledo."
 espana.0021.relation_former.desc: "Mi [ROOT.Char.Custom2('RelationToMe', toledo_former)] [toledo_former.GetTitledFirstName]"
 espana.0021.former.desc: "[toledo_former.GetTitledFirstName]"
 espana.0021.end.desc: "ha declarado [toledo_former.GetHerselfHimself] 'la [toledo_former.GetMotherFather|U] de los visigodos.'\n\nEl nombre de [toledo_former.GetHerHis|U] seguramente vivirá por siglos, pero ¿será [toledo_former.GetSheHe] recordado como un héroe o un tirano? Sólo [ROOT.Char.GetFaith.FateGodName] lo sabe."
 espana.0025.t: "Una España Unida"
 espana.0025.desc: "Una vez más, los tronos de España han sido unidos bajo un [ROOT.Char.GetTitleAsNameNoTooltip]. Los falsos monarcas han sido destronados, mientras el orgulloso [ROOT.Char.GetPrimaryTitle.GetNameNoTier] se mantiene más fuerte que nunca.\n\nUn día partiré de este mundo y llegaré al [ROOT.Char.GetFaith.DivineRealm], pero mi legado permanecerá en la Tierra para siempre. Me llamarán '[ROOT.Char.GetTitledFirstNameNoTooltip] — el [ROOT.Char.GetMotherFather|U] de España.'"
 espana.0025.a: "Este es el amanecer de una nueva era."
 espana.0026.start.desc: "Uno a uno, los reinos de España han caído bajo el mando de [spain_uniter.GetPrimaryTitle.GetNameNoTier]."
 espana.0026.relation_former.desc: "Mi [ROOT.Char.Custom2('RelationToMe', spain_uniter)] [spain_uniter.GetTitledFirstName]"
 espana.0026.former.desc: "[spain_uniter.GetTitledFirstName]"
 espana.0026.end.desc: "ha declarado [spain_uniter.GetHerselfHimself] 'la [spain_uniter.GetMotherFather|U] de España.'\n\nEl nombre de [spain_uniter.GetHerHis|U] seguramente vivirá por siglos, pero ¿será [spain_uniter.GetSheHe] recordado como un héroe o un tirano? Sólo [ROOT.Char.GetFaith.FateGodName] lo sabe."
