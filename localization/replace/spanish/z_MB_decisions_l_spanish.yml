 stop_lose_weight_decision_tooltip: "No seguirás intentando perder peso"
 stop_lose_weight_decision_confirm: "Dejar de perder peso"
 commit_suicide_decision: "Intentar suicidarme"
 commit_suicide_decision_desc: "Solo hay oscuridad y dolor. La gente me dice que todo mejorará, pero ¿cómo lo saben? ¿De qué me sirve eso en este momento? Es hora de despojarse de las ataduras de este reino mortal."
 commit_suicide_decision_desc_depressed: "$commit_suicide_decision_desc$"
 commit_suicide_decision_desc_incapable: "Sobrevivo pero no vivo de verdad. Mi estado actual me obliga a depender de otros para hacer las tareas más sencillas. Yo no elegí esto, tal vez sería más fácil acabar con todo…"
 commit_suicide_decision_desc_cancer: "Siento que la enfermedad se extiende dentro de mí. Lo que empezó como un pequeño inconveniente se ha convertido en una pelea diaria. La muerte es inevitable. Solo quiero que deje de doler."
 commit_suicide_decision_desc_leper: "La podredumbre se ha apoderado de mi ser mortal. Algunos de mis dedos ya han desaparecido y mis heridas supuran pus. ¿Cuánto tiempo debo sufrir este horrible destino?"
 commit_suicide_decision_desc_great_pox: "Ahora las pústulas me cubren el cuerpo, cada úlcera es más grande y dolorosa que la anterior. No veo más que miedo y asco en los ojos de mis súbditos. Esto solo va a empeorar…"
 commit_suicide_decision_desc_lunatic: "No puedo escapar de los constantes murmullos de odio y decepción. Me dicen que haga cosas que no debo hacer. Nada tiene sentido, la realidad se contradice. ¿Solo la muerte podrá liberarme?"
 commit_suicide_decision_desc_parent: "No hay movimiento. Estoy atrapado por el dolor por mi hijo perdido. [ROOT.Var('mourning_parent').Char.Custom2('MyCharacterIntroduction', ROOT.Char)|U] significaba el mundo para mí. ¿Qué punto hay para vivir, cuando la vida ha perdido su única fuente de alegría y risa?"
 commit_suicide_decision_desc_soulmate: "No puedo seguir soportando el vacío de mi alma. La vida sin ti, [ROOT.Var('mourning_soulmate').Char.GetFirstName], mi amor, no ha sido más que una carga. Si el único modo de volver a tus brazos es partir de este mundo, sea."
 commit_suicide_decision_desc_friend: "La vida es demasiado sombría si no puedo compartirla con un verdadero amigo. Momentos que me habría hecho reír junto a [ROOT.Var('mourning_friend').Char.GetFirstName] durante horas ahora solo me llenan de desesperación. Este camino de soledad no es para mí."
 commit_suicide_decision_desc_demoted: "Pocos han sufrido humillación como yo. Yo, que solía estar en la parte superior, ahora estoy obligado a gemir como el resto de estos tontos. Tal vez debería tomar las cosas en mis propias manos y salir de la manera que elijo."
 commit_suicide_decision_desc_divorce: "Me paso los días revolcándome en el pesar. ¿Qué podría haber hecho para evitar esta dolorosa despedida? ¿Cómo puedo restaurar el amor que se ha perdido? No hay remedio. Sin mi matrimonio, no soy nada."
 commit_suicide_decision_desc_witch: "Mi fascinación por lo arcano me ha llevado por un camino solitario y peligroso. Pero mi curiosidad ha tenido un precio horrible. Se me rechaza por mis creencias. Me temo que jamás me aceptarán por lo que soy."
 commit_suicide_decision_desc_cannibal: "Qué sociedad más atrasada la nuestra. Saciarme del exquisito manjar que es la carne humana resulta ser lo único que me produce alegría. ¡No quiero seguir viviendo en un mundo que lo prohíbe!"
 commit_suicide_decision_desc_sodomite: "El destino me ha tratado una mano cruel. ¿Por qué debo ser perseguido por los deseos de mi corazón? No puedo evitar haber nacido así. Si me condenan en la vida, ¿sólo seré aceptado en la muerte?"
 commit_suicide_decision_desc_deviant: "¿Quiénes son ellos para juzgarme? Puede que mis exploraciones lujuriosas me hayan llevado por muchos caminos sorprendentes, pero todos conducían a un intenso placer. Sin estos placeres carnales, no tengo nada por lo que vivir."
 commit_suicide_decision_desc_criminal: "No puedo escapar de mi pasado. Allá donde voy, siento miradas que me juzgan. ¿Cómo pudo pasar esto? ¿Por qué dejé que todo fuera tan lejos? Espero que perdonen mis crímenes cuando me haya ido."
 commit_suicide_decision_desc_stressed: "La presión se acumula día tras día. Vaya donde vaya, haga lo que haga, pronto acaba por superarme. ¡Todo se dispara fuera de control! ¡Tiene que acabar!"
 commit_suicide_decision_tooltip:2 "Ha llegado la hora de partir de este mundo"
 commit_suicide_decision_effect_tooltip: "@warning_icon! Acabarás con tu vida. ¿Seguro que es lo que quieres?"
