 encourage_confession_of_false_conversions_decision.desc: "#F Es un secreto a voces que hay cripto-religiosos en mi reino, practicando su fe en secreto. ¿Quizás una amnistía oficial los convencería de dejar la fachada?#!"
 encourage_confession_of_false_conversions_decision.desc.tt_pluralist: "Los cripto-religiosos dentro de tu reino pueden revelarse, si tu [faith|E] [tolerates|E] su fe secreta mejor que la pública"
 encourage_confession_of_false_conversions_decision.desc.tt_paranoia: "[characters|E] que son [GetTrait('deceitful').GetName( GetNullCharacter )] o [GetTrait('paranoid').GetName( GetNullCharacter )] no revelarán su [faith|E] secreta a menos que coincida con la tuya"
 encourage_confession_of_false_conversions_decision.desc.tt_pluralist_counties: "Si eres [independent|E], los [counties|E] dentro de tu [realm|E] que tengan [GetModifier('false_convert_modifier').GetNameWithTooltip] pueden convertirse abiertamente, dependiendo de cuán hostil seas con su nueva [faith|E]"
 encourage_confession_of_false_conversions_decision.desc.tt_coreligionist: "Los cripto-religiosos dentro de tu reino pueden revelarse, si su [faith|E] privada es la misma que la pública"
 encourage_confession_of_false_conversions_decision_confirm: "Hacer una proclamación"
 abandon_crypto_faith_decision: "Abandonar la fe secreta"
 abandon_crypto_faith_decision.tt: "Dejar de practicar mi antigua fe en secreto"
 abandon_crypto_faith_decision.desc: "#F Todas estas sermones secretos y oraciones susurradas están agotando mi paciencia. Mientras tanto, me he acostumbrado a mi vida pública en [ROOT.Char.GetFaith.GetName]. ¿Quizás es hora de dejar mi antigua fe descansar para siempre?#!"
