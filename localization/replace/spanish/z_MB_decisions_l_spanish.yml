 christology_doctrine_diophysite_desc: "Los dioxitas creen que Jesucristo tenía dos naturalezas: divina y humana, existiendo una junto a la otra. Esas dos naturalezas están unidas en Jesucristo en una unidad completa y perfecta, de modo que él es una hipóstasis con dos naturalezas. Esta posición fue históricamente defendida por la escuela de Antioquía."
 christology_doctrine_miaphysite_desc: "Los miafisitas creen que Jesucristo, como el Logos encarnado, es completamente divino y completamente humano dentro de una sola naturaleza. Esta posición fue establecida por primera vez por Cirilo de Alejandría en el concilio de Calcedonia."
 christology_doctrine_nestorian_desc: "La Iglesia siríaca oriental usó una formulación ligeramente diferente de la dioxita en el oeste romano: Jesucristo tenía dos #italic qnome#! (≈naturalezas), divina y humana, unidas en una sola #italic parsopa#! (≈persona). Aunque en tiempos modernos, esta formulación se considera consonante con el dioxitismo occidental, ambas posiciones se consideraban discordantes históricamente. Por lo tanto, sigue siendo una formulación separada del dioxitismo occidental en el juego."
 christology_doctrine_arianism_desc: "Existen varias posiciones no trinitarias, incluyendo el arianismo, el adopcionismo, el modalismo y otras. Están unidas en la idea de que Jesús no es Dios o no es igual a Dios."
 christology_doctrine_gnostic_desc: "El gnosticismo es una doctrina cristológica que afirma que el Dios Supremo es una Mónada, de la cual emergen seres divinos inferiores llamados Aeones. Uno de los Aeones, llamado Demiurgo (artesano), crea el universo físico, al cual caen los elementos divinos y quedan atrapados dentro de los seres humanos. El gnosticismo floreció en los primeros días del cristianismo en el Mediterráneo."
 christology_doctrine_monarchian_desc: "El monarchianismo sigue una cristología estrictamente unitaria, que afirma que Dios es una sola persona, que para nosotros puede aparecer en tres 'modos' de ser: Padre, Hijo y Espíritu Santo. El Padre es Dios antes de la encarnación, el Hijo es todo Dios, residiendo en Jesús, y el Espíritu Santo (que no es una identidad separada) es Dios en acción. Esta visión existió con mayor prominencia en el período patrístico."

