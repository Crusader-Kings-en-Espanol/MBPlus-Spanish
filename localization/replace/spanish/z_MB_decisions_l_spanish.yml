 unite_france.0001.t: "Un [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] unido"
 unite_france.0001.desc: "Una vez más, los reinos $frankish$ han sido unidos bajo un solo [ROOT.Char.GetTitleAsNameNoTooltip]. Los falsos monarcas han sido despojados de sus coronas, mientras que el orgulloso [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] se mantiene más fuerte que nunca.\n\nEn 987 d.C., [uf_first_capet.GetName], el primer [uf_first_capet.GetCulture.GetNameNoTooltip] [uf_first_capet.GetTitleAsNameNoTooltip] perteneciente a [house|E] [uf_first_capet.GetHouse.GetName], ascendió al trono. Los siglos de gobierno unido han demostrado nuestro derecho divino a gobernar estas tierras como una sola.\n\nMi reinado no durará para siempre, porque un día dejaré este mundo para ir a [ROOT.Char.GetFaith.DivineRealm], pero mi legado - un [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] unido - seguramente permanecerá en la Tierra para siempre."
 unite_france.0001.a: "Este es el amanecer de una nueva era."
 unite_france.0002.t: "Un [france_uniter.GetPrimaryTitle.GetNameNoTier] unido"
 unite_france.0002.start.desc: "Uno tras otro, los reinos $frankish$ de [GetGeographicalRegion('unite_france_west_francia_region_duchies').GetName] han caído bajo el gobierno de [france_uniter.GetPrimaryTitle.GetNameNoTierNoTooltip]."
 unite_france.0002.relation_former.desc: "Mi [ROOT.Char.Custom2('RelationToMe', france_uniter)] [france_uniter.GetTitledFirstName]"
 unite_france.0002.former.desc: "[france_uniter.GetTitledFirstName]"
 unite_france.0002.end.desc: "ha declarado que [france_uniter.GetHerselfHimself] 'la [france_uniter.GetMotherFather|U] de [france_uniter.GetPrimaryTitle.GetNameNoTierNoTooltip].'\n\nEl nombre de [france_uniter.GetHerHis|U] seguramente perdurará por siglos, pero ¿será [france_uniter.GetSheHe] recordada como heroína o tirana? ¿Se romperá [GetGeographicalRegion('unite_france_west_francia_region_duchies').GetName] una vez más? Solo [ROOT.Char.GetFaith.FateGodName] lo sabe."
