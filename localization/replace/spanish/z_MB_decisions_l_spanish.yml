 mz_build_pyramids_decision_confirm: "Confirmar"
 mz_pyramid_building_requirements: "Debes poseer personalmente una [barony|E] que no sea un sitio histórico universitario, no tenga un espacio de [special_building|E], y cuyo [county|E] siga una [faith|El] que permita la construcción de $building_type_mz_pyramids_01$."
 mz_sacred_grove_decision: "Hacer dedicación a la naturaleza"
 mz_sacred_grove_decision_desc: "Pedimos a [ROOT.Char.GetFaith.HighGodName] que mire los dones que nos han sido dados, que reconozcamos nuestra capacidad de cuidado de la naturaleza y su recompensa. Enviaré palabra a los bosques sagrados dentro de mi dominio y pediré que envíen representantes para dar testimonio de una dedicación hecha para reconocer la santidad de la naturaleza y pedir un honor digno."
 mz_sacred_grove_decision_tooltip: "Hacer una dedicación, ganando un bono escalado por la preservación de la naturaleza en su dominio"
 mz_sacred_grove_decision_confirm: "Confirmar"
 mz_sacred_grove_requirements: "Debes controlar un [county|E] que siga una fe que reverencie la naturaleza, y que contenga una [barony|E] con un espacio vacío de [holding|E] o terreno de bosque, taiga o jungla."
 mz_not_over_domain_limit_requirement: "No debes exceder el límite de tu [domain_limit|E]."
 mz_sacred_grove_decision_effect_header: "Los condados mantenidos por usted ganará [popular_opinion|E] , y usted ganará [opinion|E] con el [clergy|E] ."
 mz_sacred_grove_decision_effect_minor_modifier: "Para cada [barony|E] que contiene una tenencia con bosque, taiga, o terreno de la selva, usted ganará una bonificación menor."
 mz_sacred_grove_decision_effect_major_modifier: "Para cada [barony|E] que carece de un soporte, usted ganará un bono importante."
