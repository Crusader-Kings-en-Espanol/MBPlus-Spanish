 lay_claim_to_sicily_decision_desc: "La conquista normanda del sur de Italia duró de 999 a 1139, implicando muchas batallas y conquistadores independientes. En 1130, los territorios del sur de Italia se unieron como el Reino de Sicilia, que incluyó la isla de Sicilia, el tercio sur de la península italiana (excepto Benevento, que se celebró brevemente dos veces), el archipiélago de Malta, y partes del norte de África."
