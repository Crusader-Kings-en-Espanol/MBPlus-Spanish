 suleyman_invasion.1002.t: "Ascenso del Rum"
 suleyman_invasion.1002.desc: "Aunque estuvo largo tiempo en la memoria de los turcos después de su desaparición, los días de esplendor del Imperio Gök Türk terminaron en el año 741 de la Era Cristiana. Este estado había sido una confederación y, tras su desintegración, las tribus constituyentes se separaron. Entre los sobrevivientes de este naufragio de nómadas se encontraban los llamados Oghuz, de donde surgió la familia de Suleyman. La tribu principal de la confederación Oghuz era la tribu Qïnïq, dentro de la cual los Suleyman eran una familia líder. Su origen está envuelto en las nubes de la fábula y la niebla del romance. El progenitor de la familia Suleyman fue Temür-Yaligh, pero fue su hijo quien se convirtió en el ancestro epónimo de los Suleyman. Padre e hijo sirvieron al jefe de los Oghuz, quien pronto se puso celoso del poder e influencia de Suleyman. Suleyman huyó a Jand, donde se convirtió al Islam, adoptando la fe y el modo de vida de los Ghâzî, los guerreros por la fe."
 suleyman_invasion.1002.a: "Dudo que [suleyman.GetSheHe] llegue muy lejos."
