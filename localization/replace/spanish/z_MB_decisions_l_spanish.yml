 settle_nomadic_realm_decision: "Asentar a los Nómadas"
 settle_nomadic_realm_decision_desc: "Nuestros modos nómadas no podrían haber durado para siempre, y ahora es el momento de asentarnos y trabajar la tierra como una tribu. Esto será impopular con los señores que gobierno, pero al final es lo mejor para nuestra gente."
