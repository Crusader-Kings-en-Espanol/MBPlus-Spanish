 cad_decision.0005.t: "Importancia de la Ley"
 cad_decision.0005.desc: "Apenas ha pasado tiempo desde que dejamos claro nuestra intención de establecer una iglesia autcefálica, y ya existe un debate entre el clero sobre la aplicación de la ley de la iglesia. Una facción propone que la jerarquía de la iglesia tenga la autoridad para cortar a los pecadores y herejes mediante excomunión. Otra supone que las leyes de la iglesia deben estar sujetas a las leyes del estado. Pero otra facción llega a argumentar que las leyes del estado absorben las de la iglesia, dándonos así la autoridad para tomar decisiones en los asuntos religiosos."
 cad_decision.0005.a: "Lo mejor es que la iglesia tenga plena jurisdicción sobre los asuntos espirituales."
 cad_decision.0005.b: "¿No es el Rey designado por Dios? El estado puede manejar algunos de estos asuntos."
 cad_decision.0005.c: "Yo soy el Rey, yo soy la tradición, en verdad, yo soy la iglesia."
 cad_decision.0006.t: "Medios Ideales de Adoración"
 cad_decision.0006.desc: "Con la cuestión de la ley resuelta, ahora ha surgido la pregunta sobre la mejor forma de adorar. Una facción en particular propone que se prefieran las peregrinaciones a nuestros sitios sagrados. Otros, sin embargo, afirman que el estudio de las escrituras es la forma ideal y más rentable de adoración. Los grupos más marginales proponen que se utilicen ceremonias místicas para acercarse a Dios."
 cad_decision.0006.a: "Dejad que los campesinos vayan a las capillas a adorar."
 cad_decision.0006.b: "No hay verdad que no se pueda encontrar en las escrituras."
 cad_decision.0006.c: "La adoración privada, incluso cuando se vuelve incómoda para el público, es la forma más rentable de adoración."
 cad_decision.0007.t: "El Destino de los Monasterios"
 cad_decision.0007.desc: "Con la gran cantidad de desviaciones de nuestra antigua iglesia, algunos han comenzado a cuestionar la importancia de los monasterios. Los tradicionalistas insisten en que la vida monástica comunal es lo más provechoso para el pueblo cristiano. Otros, sin embargo, han comenzado a cuestionar la necesidad de la comunidad y afirman que los ascetas deben vivir como ermitaños. Mientras tanto, ha surgido un nuevo grupo de mendicantes, que creen que los religiosos deben estar en las ciudades realizando buenas obras, en lugar de encerrados en conventos y rezando."
 cad_decision.0007.a: "Las viejas costumbres están bien."
 cad_decision.0007.b: "¿Qué necesidad hay de comunidad? Dejemos que los religiosos vayan a rezar solos."
 cad_decision.0007.c: "Dejemos que los religiosos salgan a la comunidad y hagan buenas obras."
 cad_decision.0008.t: "El Destino de la Comunión"
 cad_decision.0008.desc: "A medida que nuestra autcefalía se ha vuelto más clara, han surgido preocupaciones sobre con quién entraremos en comunión. Las facciones leales a Roma y Constantinopla se han dividido entre el clero y los laicos, y muchos proponen que permanezcamos completamente independientes. Más preocupante aún, esta confusión ha permitido que ciertos clérigos heterodoxos expresen sus opiniones. Si esto no se resuelve pronto, nuestro experimento con la autcefalía seguramente fracasará."
 cad_decision.0008.a: "¡No necesitamos a nadie!"
 cad_decision.0008.b: "Constantinopla seguramente nos otorgará más independencia que Roma."
 cad_decision.0008.c: "Las escrituras son muy claras en que fue a Pedro a quien se le otorgaron las llaves."
 cad_decision.0008.d: "Me parece que Cristo tenía una sola naturaleza."
 cad_decision.0008.e: "¿Cómo puede una persona tener dos naturalezas? Claramente Cristo es dos personas."
 cad_decision.0008.f: "Hubo un tiempo en que el Hijo no existía; por lo tanto, Cristo no es Dios."
 cad_decision.0009.t: "Una ofrenda digna de una Reina"
 cad_decision.0009.desc: "La decisión de qué ofrecer a la diosa debe tomarse con cuidado, ya que afectará su consideración hacia nosotros."
 cad_decision.0009.a: "Quemar incienso ante su imagen"
 cad_decision.0009.b: "Ofrecer un colírico a ella"
 cad_decision.0009.c: "Ofrecer nada más que oraciones solas"
 cad_decision.0010.t: "Su Santidad"
 cad_decision.0010.desc: "Nosotros, una vez en cisma, solicitamos solemnemente que nos acepte en comunión con la Santa Iglesia Romana."
 cad_decision.0010.a: "No tenemos tiempo para esto"
 cad_decision.0010.b: "Muy bien"
 cad_decision.0010.notif.a: "No aceptaremos su comunión Católica"
 cad_decision.0010.notif.b: "Aceptaremos su comunión Católica"
 cad_decision.0012.t: "Unión con Roma"
 cad_decision.0012.desc: "La Iglesia Romana y aquellos en unión con ella representan el mayor potencial para el éxito de nuestra fe. Al entrar en unión con Roma, tendremos garantizada la paz con los príncipes católicos, aunque nuestras antiguas lealtades estarán descontentas."
 cad_decision.0012.a: "Entremos en esta unión"
 cad_decision.0012.b: "He cambiado de opinión"
 cad_decision.0013.t: "Unión con Constantinopla"
 cad_decision.0013.desc: "La Iglesia de Constantinopla y aquellos en unión con ella representan el mayor potencial para el éxito de nuestra fe. Al entrar en unión con Constantinopla, tendremos garantizada la paz con los príncipes ortodoxos, aunque nuestras antiguas lealtades estarán descontentas."
 cad_decision.0014.t: "Unión con los Miafisitas"
 cad_decision.0014.desc: "Las iglesias de los Miafisitas, aunque quizás más fragmentadas que los Católicos o los Griegos, representan el mayor potencial para el éxito de nuestra fe. Al entrar en unión con los Miafisitas, tendremos garantizada la paz con sus príncipes, aunque tendremos que aceptar su modelo cristológico."
 cad_decision.0015.t: "Unión con los Nestorianos"
 cad_decision.0015.desc: "La Iglesia del Este, aunque ahora mucho más débil que en su apogeo, representa el mayor potencial para el éxito de nuestra fe. Al entrar en unión con la Iglesia del Este, tendremos garantizada la paz con sus príncipes, aunque tendremos que aceptar su modelo cristológico."
 mend_antioch_schism_decision: "Remendar el Cisma de Antioquía"
 mend_antioch_schism_decision_desc: "#F Con gran esfuerzo, terminaré el cisma en Antioquía y afirmaré mi fe como la única Iglesia verdadera de Antioquía. #!"
 mend_antioch_schism_decision_tooltip: "Une la Iglesia de Antioquía bajo un patriarca"
 mend_antioch_schism_decision_effect_tooltip: "Las otras iglesias de Antioquía serán consideradas como ilegítimas"
 mend_antioch_schism_decision_confirm: "Que tres sean uno."
 antioch_schism.0001.t: "La Iglesia de Antioquía"
 antioch_schism.0001.desc.intro: "Al fin la Iglesia de Antioquía es una."
 antioch_schism.0001.desc.jacobite: "\n\nYa no se permitirá que los calcedonios difundan su herejía por toda la Iglesia de Antioquía. Con el establecimiento de iglesias a lo largo de Siria, y bajo el gobierno de un rey poderoso, las sectas heréticas tienen poca influencia sobre la Iglesia de Antioquía. \n\nEs solo cuestión de tiempo antes de que el resto de la Iglesia reconozca nuestra posición."
 antioch_schism.0001.desc.maronite: "\n\nCon los cismáticos y herejes finalmente expulsados de nuestra legítima herencia, los hijos de San Marón finalmente están al mando de la Sede de Antioquía. Los miafisitas y los pretendientes griegos han sido finalmente expulsados de la Sede Oriental. \n\nCon el respaldo del papado, la Iglesia en Antioquía volverá a prosperar, libre de herejía."
 antioch_schism.0001.desc.melkite: "\n\nDespués de mucho esfuerzo, y con el apoyo del Patriarca Ecuménico, finalmente hemos suprimido a los católicos y miafisitas que osaban reclamar el Patriarcado de Antioquía. \n\nCon Antioquía firmemente bajo control griego, estamos un paso más cerca de la restauración de la Pentarquía."
 antioch_schism.0001.desc.nestorian: "\n\nCon el Patriarcado de Antioquía firmemente bajo el gobierno de la Iglesia del Este, en un giro inesperado de los acontecimientos, las iglesias rivales han sido expulsadas y reducidas a sectas menores a los ojos de la Iglesia en general. \n\nAunque nunca hemos reclamado oficialmente Antioquía como nuestra Sede, no podemos dejar pasar esta oportunidad."
 antioch_schism.0001.a: "¡La Iglesia en Antioquía ya no está dividida!"
 antioch_schism.0101.desc.intro: "El Cisma de Antioquía ha terminado finalmente."
 antioch_schism.0101.desc.jacobite: "Con la conquista de Siria y, por extensión, la Sede Patriarcal de Antioquía, [scoped_emperor.GetTitledFirstName] ha logrado forzar a los sacerdotes de Antioquía a someterse a la visión miafisita y aceptar la autoridad de la Iglesia Jacobita. Los patriarcas rivales han sido forzados al exilio, y la noticia de su derrota se extiende por toda la cristiandad."
 antioch_schism.0101.desc.maronite: "Con la conquista de Siria y, por extensión, la Sede Patriarcal de Antioquía, [scoped_emperor.GetTitledFirstName] ha logrado forzar a los sacerdotes de Antioquía a someterse al Patriarca Maronita, y por extensión al Papa. Con los pretendientes griegos y los miafisitas expulsados de las tierras de Siria, los fieles del Este acuden a la Iglesia Maronita."
 antioch_schism.0101.desc.melkite: "Con la conquista de Siria y, por extensión, la Sede Patriarcal de Antioquía, [scoped_emperor.GetTitledFirstName] ha logrado forzar a los sacerdotes de Antioquía a someterse al Patriarca Melquita, y por extensión al Patriarca Ecuménico. Con los católicos y miafisitas aplastados bajo las botas ortodoxas, la Iglesia de Antioquía finalmente está en paz."
 antioch_schism.0101.desc.nestorian: "Con la conquista de Siria y, por extensión, la Sede Patriarcal de Antioquía, la Iglesia del Este se enfrenta a una oportunidad única: reclamar la sede de un pentarca. [scoped_emperor.GetTitledFirstName] ha expulsado a los herejes que actualmente ocupan la Iglesia de Antioquía, dejando espacio para que el Patriarca Nestoriano afirme su autoridad no solo en el Este, sino también en el Oeste."
 antioch_schism.0101.desc.generic: "Con la conquista de Siria y, por extensión, la Sede Patriarcal de Antioquía, [scoped_enmperor.GetTitledFirstName] ha afirmado la autoridad de la Iglesia [mending_antioch.GetAdjective] sobre toda la Iglesia de Antioquía, llevándola a una posición única para ejercer su autoridad sobre el Este."
 antioch_schism.0101.c: "Más noticias preocupantes desde el Oriente..."
 antioch_schism.0102.a: "Surge una nueva amenaza..."
