 unite_the_western_slavs_decision_desc: "Éramos un solo pueblo cuando llegamos a estas tierras, pero a lo largo de los años nos dispersamos, separándonos en muchas tribus. Hay fuerzas extranjeras merodeando a nuestra puerta y es hora de volver a estar unidos."
