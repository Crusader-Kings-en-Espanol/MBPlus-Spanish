 restore_roman_patriarchate_decision: "Restaurar el Patriarcado Romano"
 restore_roman_patriarchate_decision_desc: "La Iglesia Romana se ha extraviado y ahora debe ser restaurada a su antigua gloria, aunque bajo nuestra supervisión."
 restore_roman_patriarchate_decision_tooltip: "El patriarcado romano será establecido como vasallo."
