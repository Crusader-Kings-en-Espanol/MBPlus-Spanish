 lose_weight_decision_desc: "Mi cuerpo se debilita cada día que pasa y la panza me pesa tanto física como mentalmente.\n\nCorrer, baños calientes, tal vez una sustancia ligeramente purgante… Encontraré el modo de perder algo de peso."
