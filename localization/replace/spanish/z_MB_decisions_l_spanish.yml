 ottoman_decisions.0003.t: "Los turcos anatolios"
 ottoman_decisions.0003.desc: "El tiempo en que nosotros [embracer.GetCulture.GetCollectiveNounNoTooltip] considerábamos la Estepa nuestra patria ha quedado atrás. Nuestros hijos nacen aquí, rodeados de griegos, y para ellos, la Estepa será solo una mancha lejana en un mapa poco visto.\n\nY, a medida que hacemos propias algunas de las costumbres locales, también el legado de nuestra cultura se extiende por las tierras anatolias, dando lugar a una nueva identidad turca."
 ottoman_decisions.0003.a: "¡Viva los turcos!"
 ottoman_decisions.0004.desc: "El [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('embracer'))] [embracer.GetName], sus vasallos, y toda su familia ha respondido al llamado de Anatolia y ha adoptado la cultura turca."
 ottoman_decisions.0004.a: "Era solo cuestión de tiempo."
 ottoman_decisions.0004.b: "¡Traidores!"
# Create Ottoman Sultanate, by your sister (I had sex with her)
 ottoman_decisions.0001.t: "Una Nueva Roma"
 ottoman_decisions.0001.desc: "Con la conquista de las tierras ricas de Asia Menor, he acumulado suficiente poder para formar un nuevo Sultanato, uno que seguramente superará la grandeza de Roma misma.\n\nTodavía queda trabajo por hacer, pero no tengo dudas de que los historiadores consagrarán este momento como uno de los grandes pasos en la conquista de Europa por los seguidores de [scoped_ruler.GetFaith.HighGodName]."
 ottoman_decisions.0001.a: "¡Que tiemble Occidente!"
 ottoman_decisions.0002.desc.liege: "Después de una serie de victorias en Anatolia, [scoped_ruler.GetTitledFirstName] ha decidido coronarse [scoped_ruler.GetHerselfHimself] [scoped_ruler.GetTitleTierName] de los Otomanos, afirmando que ya no guarda ninguna lealtad hacia mí y que luchará contra los infieles en los términos de [scoped_ruler.GetHerHis]."
 ottoman_decisions.0002.desc.romans: "El salvaje señor de la guerra [scoped_ruler.GetTitledFirstName] ha labrado su camino a través de Anatolia y ha establecido un nuevo Sultanato en la región.\n\nComo si esto no fuera suficiente insulto, en una muestra despreciable de arrogancia, [scoped_ruler.GetSheHe] ha decidido reclamar para [scoped_ruler.GetHerselfHimself] el título de [scoped_ruler.GetTitleTierName] de Roma."
 ottoman_decisions.0002.desc.others: "La rica provincia de Asia Menor, que una vez fue un bastión del cristianismo, ha caído ahora bajo el control de [scoped_ruler.GetTitledFirstName], quien ha formado un nuevo Sultanato en la región."
 ottoman_decisions.0002.a: "¡Cómo osa [scoped_ruler.GetSheHe]!"
 ottoman_decisions.0002.b: "Ya veo..."
