 rite_doctrine_celtic_name: "Rito Gálata"

 rite_doctrine_latin_desc: "Los ritos litúrgicos latinos, o ritos litúrgicos occidentales, son los ritos católicos de adoración pública empleados por la Iglesia latina, la iglesia particular más grande sui iuris de la Iglesia Católica, que se originó en Europa, donde alguna vez dominó el idioma latino. Su idioma ahora se conoce como latín eclesiástico. El rito más usado es el Rito Romano."
 rite_doctrine_greek_desc: "El Rito Romaioi, también conocido como el Rito Griego o el Rito de Constantinopla, identifica el amplio rango de prácticas culturales, litúrgicas y canónicas que se desarrollaron en la Iglesia cristiana oriental de Constantinopla."
 rite_doctrine_coptic_desc: "El Rito Alejandrino es el rito litúrgico utilizado por tres iglesias ortodoxas orientales: la Iglesia Ortodoxa Copta de Alejandría, la Iglesia Ortodoxa Eritrea Tewahedo y la Iglesia Ortodoxa Etíope Tewahedo, así como por sus contrapartes católicas orientales."
 rite_doctrine_antiochean_desc: "El Rito Siríaco Occidental, también llamado Rito Sirio-Antioqueno, es un rito litúrgico cristiano oriental que emplea la Liturgia Divina de San Santiago en el dialecto siríaco occidental. Se practica en la Iglesia Maronita, la Iglesia Ortodoxa Siria, la Iglesia Católica Siria y varias Iglesias Malankara de la India. Es uno de los dos principales ritos litúrgicos del cristianismo siríaco, siendo el otro el Rito Siríaco Oriental."
 rite_doctrine_local_desc: "Esta fe tiene un rito único para la cultura de quienes lo siguen."
 rite_doctrine_chaldean_desc: "El Rito Siríaco Oriental o Rito Sirio Oriental, también llamado el Rito Caldeo, es un rito litúrgico cristiano oriental que emplea la Liturgia Divina de los Santos Addai y Mari y el dialecto siríaco oriental como su idioma litúrgico. Es uno de los dos principales ritos litúrgicos del cristianismo siríaco, siendo el otro el Rito Siríaco Occidental (Rito Sirio-Antioqueno)."
 rite_doctrine_armenian_desc: "El Rito Armenio es una liturgia independiente utilizada tanto por la Iglesia Apostólica Armena como por la Iglesia Católica Armena."
 rite_doctrine_celtic_desc: "Nadie sabe con certeza dónde se originó exactamente este rito, pero ha echado raíces en los extremos del cristianismo occidental."

