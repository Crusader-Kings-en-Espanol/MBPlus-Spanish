 submit_to_pentarch_decision: "Someterse al Pentarca Local"
 submit_to_pentarch_decision_desc: "Dentro de la Iglesia Ortodoxa existen cinco Pentarcas, cada uno que gobierne su propio territorio. Debido a que su capital está dentro de la jurisdicción de un Pentarca a quien usted no es sumiso, usted debe corregir esto."
 submit_to_pentarch_decision_tooltip: "Te convertirás a la fe de tu capital."
 submit_to_pentarch_decision_effect_tooltip: "Usted se convertirá. Familia y vasallos no lo harán, aunque los vasallos lo harán independientemente."
 submit_to_pentarch_decision_confirm: "Confirmar"

 abanondon_monothelite_maronite_decision: "Abrazar las costumbres romanas"
 abandon_monothelite_maronite_decision_desc: "Con la reciente revelación de que no somos los únicos cristianos que quedan, es quizás para lo mejor que abrazamos la teología de la Iglesia Romana, para que no caigamos de sus buenas gracias."
 abandon_monothelite_maronite_decision_tooltip: "Los maronitas dejarán de ser monothelitas."
 abandon_monothelite_maronite_decision_effect_tooltip: "La fe maronita ganará la doctrina diofita y la doctrina de la Comunión Católica."
 abandon_monothelite_maronite_decision_confirm: "Confirmar"

 autocephaly_decision.0001.t: "Declaración de Autocefalia"
 autocephaly_decision.0001.desc: "Después de mucho trabajo, nuestra iglesia finalmente ha alcanzado la autocefalia y el reconocimiento de los antiguos Patriarcados."
 autocephaly_decision.0001.a: "Dios está con nosotros."

 autocephaly_decision.0010.t: "Regresar a Roma"
 autocephaly_decision.0010.desc: "Después de mucha oración y días de negociaciones, nuestra iglesia finalmente ha abrazado la Iglesia Católica y ha abandonado las cadenas de sus herejías."
 autocephaly_decision.0010.a: "Cristo reina."

 autocephaly_decision.0020.t: "Patriarcado Romano Restaurado"
 autocephaly_decision.0020.desc: "La ciudad de Roma ha caído bajo control ortodoxo. Con esta victoria, la Iglesia Ortodoxa ha impuesto un nuevo Patriarcado Romano."
 autocephaly_decision.0020.a: "Roma es ortodoxa nuevamente."

 autocephaly_decision.0021.a: "Los seguiremos."
 autocephaly_decision.0021.b: "¡Nunca traicionaremos al Papa!"

 autocephaly_decision.0030.t: "Patriarca Latino instalado en Jerusalén"
 autocephaly_decision.0030.desc: "Con la reciente conquista de Jerusalén por los católicos, la ciudad ha visto una afluencia de residentes latinos. Deseando verlos mejor servidos, el nuevo Rey de Jerusalén ha expulsado al Patriarca griego e instalado un nuevo Patriarca Latino para supervisar a los fieles."
 autocephaly_decision.0030.a: "Épico."

 autocephaly_decision.0032.t: "Patriarca Latino instalado en Constantinopla"
 autocephaly_decision.0032.desc: "Con la reciente conquista de Constantinopla por los católicos, la ciudad ha visto una afluencia de residentes latinos. Deseando verlos mejor servidos, el nuevo gobernante de Constantinopla ha expulsado al Patriarca griego e instalado un nuevo Patriarca Latino para supervisar a los fieles."
 autocephaly_decision.0032.a: "Épico."

 autocephaly_decision.0034.t: "Patriarca Latino instalado en Antioquía"
 autocephaly_decision.0034.desc: "Con la reciente conquista de Antioquía por los católicos, la ciudad ha visto una afluencia de residentes latinos. Deseando verlos mejor servidos, el nuevo gobernante de Antioquía ha expulsado al Patriarca griego e instalado un nuevo Patriarca Latino para supervisar a los fieles."
 autocephaly_decision.0034.a: "Épico."

 autocephaly_decision.0036.t: "Patriarca latino instalado en Alejandría"
 autocephaly_decision.0036.desc: "Con la reciente conquista de Alejandría por parte de los católicos, la ciudad ha visto un aumento de residentes latinos. Deseando servirles mejor, el nuevo gobernante de Alejandría ha expulsado al Patriarca griego e instalado un nuevo Patriarca latino para supervisar a los fieles."
 autocephaly_decision.0036.a: "Épico."

 autocephaly_decision.0040.t: "Ascenso de la Iglesia del Este"
 autocephaly_decision.0040.desc: "Durante siglos, la Iglesia del Este ha sido expulsada de sus tierras ancestrales en Mesopotamia. Sus escuelas catequéticas han sido saqueadas y su clero expulsado más hacia el este. Pero con la expansión hacia el este han llegado muchos fervientes conversos de la India, Tartaria e incluso de los confines de la Corte China. Ahora ha regresado triunfante a Edessa, para gran pesar de los musulmanes. Los ojos del este ahora se vuelven hacia el oeste, renovados por sus recientes triunfos."
 autocephaly_decision.0040.a: "¡Viva la Iglesia del Este!"
 catholic_communion_nestorian_decision: "Regreso a Roma"
 catholic_communion_nestorian_decision_desc: "#F La Iglesia en Oriente necesita unirse a una comunión más amplia para sobrevivir. Sólo con el Papado perduraremos. #!"
 catholic_communion_nestorian_decision_tooltip: "Restaurar la Iglesia en Oriente para la comunión con Roma"
 catholic_communion_nestorian_decision_effect_tooltip: "El Nestorianismo se unirá a la Comunión Católica"
 catholic_communion_nestorian_decision_confirm: "¡O felix Roma!"

 change_communion.0001.t: "Babilonia y Babilonia"
 change_communion.0001.desc: "\n\nLos sacerdotes de la Iglesia del Este y de la Iglesia Católica se han reunido y acordado restaurar la comunión mutua."
 change_communion.0001.a: "¡Alabado sea Jesucristo!"
 change_communion.0002.desc: "\n\nLa Iglesia del Este se separó de la Iglesia Católica hace muchos siglos, debido a disputas en el Concilio de Éfeso. A pesar de esta disputa, la Iglesia del Este ha mantenido buenas relaciones, al menos teológicamente, con la Iglesia Católica desde que aceptaron el Concilio de Calcedonia en 544. Los clérigos de la Iglesia del Este han viajado a Roma y jurado lealtad al Papa. Con esto, el Patriarca del Este y el Papa han restaurado la comunión. /n/nAhora estamos al borde de una nueva era de ecumenismo en la cristiandad."
 change_communion.0002.a: "La Iglesia se acerca a la unidad."
 change_communion.0003.desc: "\n\nLos herejes de la Iglesia Católica y la Iglesia del Este se han reunido y conspirado para unir fuerzas. Sus Patriarcas ahora están en comunión el uno con el otro y se preparan para lanzar un asalto a la verdadera fe."
 change_communion.0003.a: "Abundan los herejes."

