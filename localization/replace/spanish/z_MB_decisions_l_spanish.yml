 mozarabic_break_with_rome_decision_desc: "¿Qué sabe [ROOT.Char.GetFaith.GetReligiousHead.GetTitledFirstName] de nuestras vidas o tierras? Roma es un distante señor temporal, no cuidando ni entendiendo nuestras necesidades espirituales. \n \n Sólo al liberarnos de los grilletes del [ROOT.Char.GetFaith.GetReligiousHeadTitle.GetBaseName] y purificar el último de sus mentiras puede [ROOT.Char.GetFaith.GetName] lograr la perfección."
