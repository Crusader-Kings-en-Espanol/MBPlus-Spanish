 sea_religion.0001.cancel: "Pensándolo mejor, tal vez ya estoy en el camino correcto."
 embrace_anarchy_decision: "Abandonar el Gobierno Tribal"
 embrace_anarchy_decision_desc: "Aunque disfruto de muchos privilegios como [ROOT.Char.GetTitleTierName], mi pueblo tradicionalmente se opone a tales jerarquías. Dejemos de lado estas prácticas extranjeras y volvamos a un sistema más libre y justo de autogobierno."
