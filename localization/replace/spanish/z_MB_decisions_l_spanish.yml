 saladin_invasion.1002.t: "Saladino"
 saladin_invasion.1002.desc: "Al-Nasir Salah al-Din Yusuf ibn Ayyub fue enviado originalmente a Egipto Fatimí en 1164 junto con su tío Shirkuh, un general del ejército Zengida, por órdenes de su señor Nur ad-Din para ayudar a restaurar a Shawar como visir del califa adolescente fatimí al-Adid. Se desató una lucha de poder entre Shirkuh y Shawar después de que este último fuera reinstalado. Mientras tanto, Saladino ascendió en los rangos del gobierno fatimí gracias a sus éxitos militares contra los ataques cruzados en su territorio y su cercanía personal con al-Adid. Tras el asesinato de Shawar y la muerte de Shirkuh en 1169, al-Adid nombró a Saladino visir, una rara nominación de un musulmán suní para tan importante puesto en el califato chií. Durante su mandato como visir, Saladino comenzó a socavar el establecimiento fatimí y, tras la muerte de al-Adid en 1171, abolió el Califato Fatimí y realineó la lealtad del país con el califato abasí suní basado en Bagdad."
 saladin_invasion.1002.a: "Dudo que [saladin.GetSheHe] llegue muy lejos."
