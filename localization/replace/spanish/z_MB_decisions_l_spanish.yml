 unite_the_southern_slavs_decision_confirm: "Unite the South Slavs"
 unite_the_southern_slavs_decision_desc: "Éramos un solo pueblo cuando llegamos a estas tierras, pero con el paso de los años nos dispersamos, separándonos en muchas tribus.\n\nAhora estamos rodeados de poderosos imperios con extrañas costumbres. Debido a su influencia, nuestra propia forma de vida se está deshaciendo lentamente. No podemos permitirlo, así que ha llegado el momento de volver a unirnos."
