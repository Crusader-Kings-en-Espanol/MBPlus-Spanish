 unsettle_nomadic_realm_decision_desc: "Mi pueblo se ha adaptado a la vida sedentaria desde hace algún tiempo, pero nuestros corazones anhelan las estepas. Es hora de regresar al camino de nuestros ancestros, atravesando las estepas bajo un cielo abierto."
