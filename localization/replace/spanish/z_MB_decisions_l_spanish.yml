 sea_religion.0001.t: "Las Tres Enseñanzas"
 sea_religion.0001.desc: "#italic Sānjiào Héyī.#! Las Tres Enseñanzas Armoniosas como Una. Durante muchos años, las filosofías de Confucio, Lao Tzu y Gautama Buda se han enseñado conjuntamente, influyéndose y complementándose mutuamente. Aunque cada una ofrece una perspectiva distinta, no es raro que un seguidor de una de estas disciplinas busque orientación en las otras."
