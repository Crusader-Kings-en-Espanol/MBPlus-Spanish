 indo_greek_culture_decision_desc: "Aunque la mayoría ha olvidado, la cultura griega floreció junto al pueblo indo-ario, mezclándose en los Reinos Indo-Griegos. Con los pueblos griegos e indo-arios volviendo a mezclarse en mi reino, tal vez pueda nacer una nueva cultura Yavana."
