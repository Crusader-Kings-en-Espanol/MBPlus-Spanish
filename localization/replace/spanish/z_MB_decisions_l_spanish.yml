 convert_to_feudal_from_chinese_bureaucracy_decision_desc: "Los principios burocráticos tienen su utilidad, pero ahora necesitamos algo más flexible. Dejemos de lado estas prácticas asfixiantes y volvamos a los viejos caminos, aunque sea por un tiempo."
