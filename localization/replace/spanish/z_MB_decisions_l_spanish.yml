 appoint_a_righteous_caliph_decision_desc: "[ROOT.Char.GetFaith.GetReligiousHead.GetTitledFirstName] es una figura distante, indigno, mal preparada para liderar la Ummah. Ser [ROOT.Char.GetFaith.GetReligiousHead.GetFaith.GetAdjective], [ROOT.Char.GetFaith.GetReligiousHead.GetSheHe] simplemente no #EMP entender#! muchas de las verdades sutiles de [ROOT.Char.GetFaith.GetAdjective] Pensado.\n\n[ROOT.Char.GetFaith.GetReligiousHead.GetSheHe|U] no puede, pero #EMP I#! Sí..."
