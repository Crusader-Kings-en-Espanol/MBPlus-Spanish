 revoke_false_conversion_decision.tt: "Reconversión pública a tu antigua [faith|E]"
 revoke_false_conversion_decision.desc: "#F Aunque oficialmente sigo la fe de [ROOT.Char.GetFaith.GetAdjectiveNoTooltip], no puedo dejar de lado muchos de los rituales personales y creencias privadas que mis antepasados mantenían. ¿Quizás los viejos tiempos realmente eran mejores?#!"
 revoke_false_conversion_decision.desc.tt: "Te reconviertes públicamente a tu [faith|E] anterior. Tus [vassals|E] y [close_family|E] pueden convertirte contigo"
 revoke_false_conversion_decision.desc.tt_own_faith_counties: "Si eres [independent|E], los [counties|E] dentro de tu [realm|E] que tengan [GetModifier('false_convert_modifier').GetNameWithTooltip] pueden convertirse contigo, si secretamente de tu [faith|E]"
