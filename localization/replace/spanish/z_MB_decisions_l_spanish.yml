 reform_government_decision_help_text: "Tú y todos tus vasallos con el mismo gobierno y fe coincidente reformarán sus [governments|E]"
 reform_government_decision_desc: "Usa esta decisión para corregir a los vasallos que tienen el gobierno equivocado.\n\nLa ley del reino dice una cosa, pero la ley divina dice otra. Debemos realizar cambios para que la estructura de nuestro gobierno se ajuste a lo que [ROOT.Char.GetFaith.HighGodName] ha decretado."
