 stablesteppenomads.0007.a: "¡Desde el Mar Negro hasta el Océano Índico!"
 rkho_global_culture.0002.t: "Una Nueva Rusia"
 rkho_global_culture.0002.desc: "No hace mucho tiempo, nuestros antepasados conquistaron a los eslavos del Este y construyeron sus primeros asentamientos. Hemos vivido aquí durante generaciones desde entonces, la tierra nos ha moldeado tanto como nosotros hemos moldeado la tierra.\n\nEs hora de preguntarnos, ¿seguimos siendo los Vikingrs de Rus'? ¿O somos algo completamente nuevo?"
 rkho_global_culture.0002.a: "Los tiempos están cambiando, y debemos cambiar con ellos."
 rkho_global_culture.0003.t: "$rkho_global_culture.0002.t$"
 rkho_global_culture.0003.desc: "Cuando una gran tribu nórdica llamada los Rus' migró por primera vez a las vastas llanuras y taigas interminables del este, eran extranjeros en una tierra nueva y extraña.\n\nEsto cambió a lo largo de muchas generaciones, ya que la tierra y sus pueblos nativos los moldearon tanto como ellos moldearon la tierra misma, y el destino de sus pueblos. Con el tiempo, los Vikingrs de Rus' se convirtieron en uno con los eslavos nativos de la región, y luego se conocieron simplemente como los Rus'. Estos Rus' ahora han crecido hasta convertirse en una nueva y distinta cultura eslava, afortunada y bendecida con la energía ilimitada de su legado nórdico y la persistencia estoica de su herencia eslava, los rusos.\n\nLos viejos días de la Gran Rus' y del centro cultural de Kiev en las tierras de los eslavos orientales están llegando a su fin. Hay algunos que aún afirman que estos humildes pueblos rusos están destinados a lograr la grandeza..."
 rkho_global_culture.0003.a: "Solo el tiempo dirá cómo esto impacta la región."
 rkho_global_culture.0005.t: "El Retroceso de los Andaluces"
 rkho_global_culture.0005.desc: "Una vez la tierra de los iberos de antaño. Luego, una de las provincias más históricas de los gloriosos y infames romanos. Más tarde, la conquista de los rudos y poderosos visigodos germánicos, los antepasados del actual reino de Iberia. Nosotros, los descendientes de esos antiguos nómadas del norte de Europa, nos hemos fragmentado en muchos idiomas y heraldos diferentes.\n\nDurante el último siglo, el grupo más poderoso de todos ha sido el pueblo del reino de Al-Andalus en el sur, cuyo idioma y costumbres son el resultado de una conquista por hombres procedentes de la Arabia islámica. Este tiempo ha terminado, ya que muchas de las antiguas costumbres del norte han hecho su camino hacia el sur."
 rkho_global_culture.0005.a: "Nos mantendremos firmes como siempre lo hemos hecho."
 rkho_global_culture.0006.t: "$rkho_global_culture.0005.t$"
 rkho_global_culture.0006.desc: "Una vez la tierra de los iberos de antaño. Luego, una de las provincias más históricas de los gloriosos y infames romanos. Más tarde, la conquista de los rudos y poderosos visigodos germánicos, los antepasados del actual reino de Iberia. Los descendientes de esos antiguos nómadas del norte de Europa se han fragmentado en muchos idiomas y heraldos diferentes.\n\nDurante el último siglo, el grupo más poderoso de todos ha sido el pueblo del reino de Al-Andalus en el sur, cuyo idioma y costumbres son el resultado de una conquista por hombres procedentes de la Arabia islámica. Este tiempo ha terminado, ya que muchas de las antiguas costumbres del norte han hecho su camino hacia el sur.."
 rkho_global_culture.0006.a: "¡Qué tan rápido cambia el destino en las Tierras de Iberia!"
 rkho_global_culture.0008.t: "Fin de la Influencia Romana en Italia"
 rkho_global_culture.0008.desc: "El antiguo Imperio Romano de Occidente ya no existe. La Ciudad de Roma ya no es el centro de cultura ni de comercio que fue en su apogeo. Y ahora, finalmente, la civilización romana ya no tiene ninguna influencia real en la región que fue su venerada cuna. Tal vez algún día en el futuro, Constantinopla volverá a poner la vista en sus efímeras provincias occidentales, pero por ahora ese tiempo ha llegado a su fin."
 rkho_global_culture.0008.a: "Verdaderamente, el fin de una era."
 rkho_global_culture.0009.t: "$rkho_global_culture.0008.t$"
 rkho_global_culture.0009.desc: "$rkho_global_culture.0008.d$"
 rkho_global_culture.0009.a: "¿Está apagándose el fuego de Roma?"
 rkho_global_culture.0011.t: "El Fin de Saami Finnmark"
 rkho_global_culture.0011.desc: "Los pueblos Saami han gobernado Finnmark durante generaciones. Este tiempo ha terminado, ya que su reino ha sido invadido por los del sur."
 rkho_global_culture.0011.a: "¡¿Cómo se atreven?!"
 rkho_global_culture.0012.t: "$rkho_global_culture.0011.t$"
 rkho_global_culture.0012.desc: "$rkho_global_culture.0011.d$"
 rkho_global_culture.0012.a: "Así son las cosas. Los reinos vienen y van."
 timur_invasion.1002.t: "Ascenso de los Timuridas"
 timur_invasion.1002.desc: "Nacido en la confederación Barlas en Transoxiana (en lo que hoy es Uzbekistán) el 9 de abril de 1336, Timur obtuvo el control del kanato Chagatai occidental para 1370. Desde esa base, lideró campañas militares por el oeste, el sur y el centro de Asia, el Cáucaso y el sur de Rusia, derrotando en el proceso a los kanes de la Horda de Oro, los mamelucos de Egipto y Siria, el Imperio Otomano en ascenso, y el Sultanato de Delhi de la India, emergiendo como el gobernante más poderoso del mundo islámico. A partir de estas conquistas, fundó el Imperio Timúrida, pero este imperio se fragmentó poco después de su muerte."
 timur_invasion.1002.a: "Dudo que [timur.GetSheHe] llegue muy lejos."
