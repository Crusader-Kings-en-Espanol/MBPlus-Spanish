 found_angkor_wat_decision: "Construir una Gran Ciudad Templo"
 found_angkor_wat_decision_desc: "En el centro de [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] yace la ciudad de Aninditapura. Es una gran ciudad, sin duda. Pero podría ser aún más grande. Excavaré barays, erigiré santuarios y en el corazón de todo estará el templo más grande que los dioses hayan visto."
