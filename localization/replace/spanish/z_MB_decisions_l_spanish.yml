 RICE_bozo_establish_wangara_decision: "Crear Monopolio de Oro Wangara"
 RICE_bozo_establish_wangara_decision_context_tooltip: "#emphasis Contexto Histórico:#! Los Wangara fueron una casta de comerciantes de África Occidental prominentes desde el período medieval hasta el siglo XIX. Comprendían varios pueblos mande, como los Malinke y Soninke, y inicialmente llegaron al poder dominando la producción de oro en Mali. Con el tiempo, no solo diversificaron su cartera para incluir sal, nueces de kola y otros bienes, sino que también expandieron sus operaciones e integraron en las políticas y sociedades de lugares tan lejanos como la costa Akan y las ciudades-estado Hausa."
