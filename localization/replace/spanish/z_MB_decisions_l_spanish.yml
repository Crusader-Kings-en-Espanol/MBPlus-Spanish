 RICE_restore_ooni_decision_context_tooltip: "#emphasis Contexto Histórico:#! Ife es vista como la cuna de la humanidad entre los pueblos yoruba. El gobernante de Ife (o Ile-Ife), llamado el Ooni, tenía y tiene gran autoridad religiosa y secular como resultado. Fuentes portuguesas del período moderno temprano también comparan al Ooni con el Papa, y uno de los primeros Oonis en la leyenda yoruba, Oduduwa, más tarde se convirtió en el progenitor legendario de muchas familias reales en la tierra yoruba y Benín. Los gobernantes de la región tradicionalmente viajaban a Ife para ser coronados formalmente por el Ooni con la corona de Oduduwa."
