 high_almoner_court_position_desc: "El $high_almoner_court_position$ está encargado de distribuir limosnas a los pobres y otros sujetos necesitados. \n \n Esta posición sólo puede ser sostenida por el clero."
 lady_in_waiting_court_position_desc: "Un $lady_in_waiting_court_position$ es un asistente y compañero de una Reina o Emperatriz, asistiendo a ella cada necesidad y cumpliendo cada capricho. \n \n Esta posición sólo puede ser sostenida por damas nobles, ya que sólo tenían el prestigio requerido para ser compañeros de reinas y princesas."
 master_of_hunt_court_position_desc: "El $master_of_hunt_court_position$ es responsable de cualquier fiesta de caza que los miembros de la corte de Liege arreglen. También están a cargo de las perreras y los perritos dentro de ella. \n \n Esta posición sólo puede ser sostenida por la nobleza."
 master_of_horse_court_position_desc: "El $master_of_horse_court_position$ es responsable de los majestuosos y establos de su Liege. Tienen su trabajo cortado para ellos ya que un caballo bien cuidado es un boon tanto en el campo de batalla como en la carretera. \n \n Esta posición sólo puede ser sostenida por la nobleza."
 seneschal_court_position_desc: "El $seneschal_court_position$ sirve un papel importante en la vida cotidiana de la familia real, administrando a los sirvientes y manteniendo todo funcionando sin problemas. \n \n Esta posición sólo puede ser sostenida por la nobleza."
 cupbearer_court_position_desc: "Un $cupbearer_court_position$ es responsable de servir bebidas en la mesa real y asegurarse de que la copa de nadie se agote. \n \n Esta posición sólo puede ser mantenida por la nobleza."
 garuda_court_position_desc: "Este caballero ha jurado cumplir con la voluntad de su mentira o morir intentando. Así como el ave mitológico $garuda_court_position$ llevaba el peso de Vishnu, los guerreros $garuda_court_position$ llevan la soberanía del monarca. \n \n Esta posición sólo puede ser sostenida por la nobleza."
 keeper_of_swans_court_position_desc: "El $keeper_of_swans_court_position$ está a cargo de los cisnes reales. Manteniendo la cuenta con el número de maravillas emplumadas que sus Liege pone y les proporciona cuidado; esta posición viene con graves responsabilidades. \n \n Esta posición sólo puede ser sostenida por la nobleza."
 champion_court_position_desc: "Un $champion_court_position$ es un luchador hábil y mortal que puede representar su Liege en duels. \n \n Esta posición sólo puede ser sostenida por un caballero."
 cultural_emissary_court_position_desc: "El propósito del $cultural_emissary_court_position$ es promover la comprensión entre diferentes culturas por medio de la celebración y la reverencia. \n \n Esta posición sólo puede ser sostenida por la nobleza."

 ### COURT POSITIONS EXPANDED - COURT POSITIONS ###

 court_herbalist_court_position: "herborista de Corte"
 court_herbalist_court_position_desc: "El <span class="math-inline">court\_herbalist\_court\_position</span> es el herborista principal del señor, encargado de asistir como alternativa a la salud, además del Médico de Corte, particularmente en la confección de remedios para afecciones que puedan surgir."
 queen_mother_position: "Reina Madre"
 queen_mother_position_desc: "La <span class="math-inline">queen\_mother\_position</span> asiste al señor en las funciones de la corte y de la familia, una persona versada en diplomacia y asuntos sociales sería una ayuda formidable."
 chief_herald_court_position: "Heraldo Mayor"
 chief_herald_court_position_desc: "El <span class="math-inline">chief\_herald\_court\_position</span>, también llamado Rey de Armas, tiene la tarea de certificar y otorgar escudos de armas en el reino. Tener este puesto lleno trae prestigio y legitimidad a tu casa y tus vasallos te apoyarán cuando proporciones este servicio de manera eficiente."
 master_of_the_royal_mounted_couriers_court_position: "Maestro de los Correos Reales a Caballo"
 master_of_the_royal_mounted_couriers_court_position_desc: "El <span class="math-inline">master\_of\_the\_royal\_mounted\_couriers\_court\_position</span> está a cargo de dirigir los Correos Reales a Caballo bajo tu supervisión para entregar correspondencia en todo tu reino. Establecer servicios de mensajería protegidos por el estado garantiza una mayor seguridad de toda tu correspondencia en la gobernanza. La persona encargada de dirigir este servicio debe ser de gran confianza, ya que tendrá un poder considerable sobre las comunicaciones oficiales."
 master_of_the_royal_mounted_couriers_employer_custom_effect_description: "@warning_icon!#X ¡Poderoso [agent|E] en [hostile_schemes|E] contra ti!#"
 royal_tax_collector_court_position: "Recaudador de Impuestos Reales"
 royal_tax_collector_court_position_desc: "El <span class="math-inline">royal\_tax\_collector\_court\_position</span> tiene la tarea de recaudar ingresos adicionales de los vasallos a costa de cierto malestar."
 royal_tariff_collector_court_position: "Recaudador de Aranceles Reales"
 royal_tariff_collector_court_position_desc: "El <span class="math-inline">royal\_tariff\_collector\_court\_position</span> es un oficial de aduanas jefe que recauda ingresos adicionales de los bienes que provienen de fuera de tu reino a costa de cierto malestar de otros gobernantes independientes."
 court_philosopher_position: "Filósofo de Corte"
 court_philosopher_position_desc: "El <span class="math-inline">court\_philosopher\_position</span> es el pensador maestro residente que reside en la corte."
 royal_chronicler_court_position: "Cronista Real"
 royal_chronicler_court_position_desc: "Ningún hombre es verdaderamente grande si solo es grande en su vida. La prueba de la grandeza es la página de la historia. El <span class="math-inline">royal\_chronicler\_court\_position</span> asegurará que tú y tu dinastía sean registrados de manera exhaustiva para los libros de los tiempos inmemoriales."
 court_historian_court_position: "Historiador de Corte"
 court_historian_court_position_desc: "El <span class="math-inline">court\_historian\_court\_position</span> tiene la tarea de registrar tu gobierno y proporcionar una fuente para que tu corte consulte sobre asuntos de las grandes historias de tus tierras."
 grand_admiral_court_position: "Gran Almirante"
 grand_admiral_court_position_desc: "El <span class="math-inline">grand\_admiral\_court\_position</span> es el oficial al mando más alto de tu flota."
 master_at_arms_position: "Maestro de Armas"
 master_at_arms_position_desc: "El <span class="math-inline">master\_at\_arms\_position</span> es el general y oficial al mando más alto de tus Caballeros y Hombres de Armas."
 grand_vizier_court_position: "Gran Visir"
 grand_vizier_court_position_desc: "El <span class="math-inline">grand\_vizier\_court\_position</span> es un ministro de gobierno jefe. A menudo tienen una amplia cartera que cubre la gestión del gobierno y otros ministros/visires."
 court_canonist_court_position: "Cronista de la corte"
 court_canonist_court_position_desc: "El $court_canonist_court_position$ es una autoridad legal cristiana principal en la corte, que asesora y asiste al señor sobre la ley canónica."
 master_of_sacrifices_court_position: "Maestro de Sacrificios"
 master_of_sacrifices_court_position_desc: "El $master_of_sacrifices_court_position$ es responsable de la organización de sacrificios de acuerdo con su religión."
 priest_of_the_sacred_grove_court_position: "Sacerdote del Bosque Sagrado"
 priest_of_the_sacred_grove_court_position_desc: "El $priest_of_the_sacred_grove_court_position$ mantiene un lugar sagrado (un 'alka' o 'elks') cerca de la capital que tu corte usa con frecuencia. Este bosque sagrado, entre otros, sirve como hogar de los dioses y lugar de sacrificios."
 royal_armorer_court_position: "Armero Real"
 royal_armorer_court_position_desc: "El $royal_armorer_court_position$ es el jefe de la armería real, utilizando su extenso conocimiento marcial para gestionar la adquisición y distribución de armaduras para la corte."
 head_torturer_court_position: "Jefe de los Torturadores"
 head_torturer_court_position_desc: "El $head_torturer_court_position$ es tu carcelero en la corte encargado de emplear métodos más... siniestros."
 peer_of_france_lay_court_position: "Par de Francia (Laico)"
 peer_of_france_lay_court_position_desc: "El $peer_of_france_lay_court_position$ se otorga al mayor y más alto miembro de la nobleza francesa. Este estatus le otorga al poseedor un gran prestigio y renombre en todo el reino."
 peer_of_france_bishop_court_position: "Par de Francia (Obispo)"
 peer_of_france_bishop_court_position_desc: "El $peer_of_france_bishop_court_position$ se otorga al mayor y más alto miembro del clero francés."
 dragoman_court_position: "Dragomán"
 dragoman_court_position_desc: "El $dragoman_court_position$ es el principal traductor e intérprete en la corte. Están particularmente involucrados en la correspondencia diplomática y en proporcionar información y asuntos de pueblos extranjeros al señor."
 minister_of_works_court_position: "Ministro de Obras"
 minister_of_works_court_position_desc: "El $minister_of_works_court_position$ está encargado de gestionar pesos y medidas, construir y mantener la infraestructura de transporte (carreteras, canales, etc.) y otras tareas de infraestructura delegadas."

