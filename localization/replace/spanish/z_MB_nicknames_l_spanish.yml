 nick_taejong_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] es venerado en el santuario ancestral como Taejong — el Gran Ancestro."

 nick_gwangjong: "Gwangjong"
 nick_gwangjong_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] es venerado en el santuario ancestral como Gwangjong — el Ancestro Refulgente, en honor a un monarca feroz y centralizador que quebró el poder de los clanes nobles."

 nick_seongjong: "Seongjong"
 nick_seongjong_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] es venerado en el santuario ancestral como Seongjong — el Ancestro Logrado, recordado por establecer firmemente el marco institucional confuciano del estado."

 nick_hyeonjong: "Hyeonjong"
 nick_hyeonjong_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] es venerado en el santuario ancestral como Hyeonjong — el Ancestro Profundo, que guió con valentía al estado a través de las devastadoras invasiones kitán."

 nick_chungnyeol: "Chungnyeol"
 nick_chungnyeol_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] queda registrado en la historia como el Rey Chungnyeol — el Leal y Ferviente. Al ser privado de un Nombre de Templo por sus señores mongoles, llevó el prefijo 'Chung' en señal de su absoluta sumisión a la dinastía Yuan."
 
 nick_jeongjong_2: "Jeongjong"
 nick_jeongjong_2_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] es venerado en el santuario ancestral como Jeongjong — el Ancestro Pacífico."

 nick_chungseon: "Chungseon"
 nick_chungseon_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] queda registrado en la historia como el Rey Chungseon — el Leal e Ilustre. Al igual que su predecesor, llevó el prefijo 'Chung' en señal de su sometimiento a la dinastía Yuan."

 nick_chungsuk: "Chungsuk"
 nick_chungsuk_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] queda registrado en la historia como el Rey Chungsuk — el Leal y Reverente, un rey vasallo bajo el yugo del Imperio mongol."

 nick_chunghye: "Chunghye"
 nick_chunghye_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] queda registrado en la historia como el Rey Chunghye — el Leal y Benéfico. A pesar del título positivo, se le recuerda por un reinado de graves faltas bajo la supervisión Yuan."

 nick_thai_to: "Thái Trópico"
 nick_thai_to_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] es venerado en el santuario ancestral como Thái Tổ — el Gran Progenitor, en honor al fundador supremo de la dinastía."

 nick_thai_tong: "Thái Tông"
 nick_thai_tong_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] es venerado en el santuario ancestral como Thái Tông — el Gran Ancestro."

 nick_thanh_tong: "Thánh Tông"
 nick_thanh_tong_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] es venerado en el santuario ancestral como Thánh Tông — el Ancestro Sabio."

 nick_nhan_tong: "Nhân Tông"
 nick_nhan_tong_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] es venerado en el santuario ancestral como Nhân Tông — el Ancestro Benevolente."

 nick_than_tong: "Tháison Tông"
 nick_than_tong_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] es venerado en el santuario ancestral como Thần Tông — el Ancestro Divino."

 nick_anh_tong: "Anh Tông"
 nick_anh_tong_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] es venerado en el santuario ancestral como Anh Tông — el Ancestro Sobresaliente."

 nick_cao_tong: "Cao Tông"
 nick_cao_tong_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] es venerado en el santuario ancestral como Cao Tông — el Ancestro Elevado."

 nick_hue_tong: "Husort Tông"
 nick_hue_tong_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] es venerado en el santuario ancestral como Huệ Tông — el Ancestro Excelente."

 nick_minh_tong: "Minh Tông"
 nick_minh_tong_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] es venerado en el santuario ancestral como Minh Tông — el Ancestro Brillante."

 nick_hien_tong: "Hiévene Tông"
 nick_hien_tong_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] es venerado en el santuario ancestral como Hiến Tông — el Ancestro Ilustre."

 nick_tien_hoang: "Tiên Hoàng"
 nick_tien_hoang_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] es recordado por el título único Tiên Hoàng — el Primer Emperador, en honor al hombre que primero declaró a Vietnam un imperio igual a China."

 nick_dai_hanh: "Hành"
 nick_dai_hanh_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] es recordado por el título provisional Đại Hành — el Emperador que Parte, ya que sus sucesores nunca finalizaron un Nombre de Templo, haciendo permanente este título temporal en la historia."

 nick_ngoa_trieu: "Ng determinadaa Tri curu"
 nick_ngoa_trieu_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] es recordado por el título burlón Ngọa Triều — El Emperador que Sostiene Corte Recostado, un testimonio de su enfermedad debilitante y su viciosa crueldad."

 nick_chongzong: "Chóngzōng"
 nick_chongzong_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] es venerado en el santuario ancestral como Chóngzōng — el Ancestro Exaltado, en honor a un largo reinado que estabilizó el imperio e integró profundamente el gobierno confuciano."

 nick_huanzong: "Huánzōng"
 nick_huanzong_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] es venerado en el santuario ancestral como Huánzōng — el Ancestro Vigoroso."

 nick_xiangzong: "Xiāngzōng"
 nick_xiangzong_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] es venerado en el santuario ancestral como Xiāngzōng — el Ancestro Auxiliador."
 
# MB Epithets

 nick_batonian: "el Batoniano"
 nick_unitor: "el Unificador"
 nick_goth: "el Godo"
 nick_dane: "el Danés"
 nick_northman: "el Nórdico"
 nick_swede: "el Sueco"
 nick_jute: "el Jute"
 nick_the_heathen_ce: "el Pagano"
 
 nick_the_crooked:0 "el Torcido"
 nick_the_crooked_desc:0 "Los contemporáneos de [CHARACTER.GetShortUINameNoTooltipNoFormat|U] lo reconocen por una notable deformidad física, una curvatura de la columna o de la postura que se ha convertido en su legado físico definitorio."
 
 nick_the_founder:0 "el Fundador"
 nick_the_founder_desc:0 "A través de la visión y la voluntad perdurable, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es proclamado el principal artífice y progenitor de las instituciones y la dinastía que definen su reino."
 
 nick_the_affluent:0 "el Afortunado"
 nick_the_affluent_desc:0 "Célebre en todo el mundo conocido por su inmensa fortuna personal, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] ejerce el poder financiero con la misma habilidad con la que cualquier monarca empuña una espada."
 
 nick_tzelepes:0 "Tzelepes"
 nick_tzelepes_desc:0 "Portando la forma helenizada del honorífico túrquico 'Çelebi', [CHARACTER.GetShortUINameNoTooltipNoFormat|U] se distingue por su noble cuna, sus modales refinados y una disposición caballerosa."
 
 nick_the_world_burner:0 "el Quemador del Mundo"
 nick_the_world_burner_desc:0 "Un epíteto aterrador ganado a través de una despiadada campaña de devastación, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] dejó ciudades enteras arder, marcando para siempre la tierra y la memoria de sus enemigos."
 
 nick_the_longshanks:0 "Piernas Largas"
 nick_the_longshanks_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] destaca por su altura excepcional y su imponente estatura física, sobresaliendo tanto entre sus súbditos como sus rivales."
 
 nick_the_barbarossa:0 "Barbarroja"
 nick_the_barbarossa_desc:0 "Célebre en las crónicas por su distintiva barba roja, la llamativa apariencia física de [CHARACTER.GetShortUINameNoTooltipNoFormat|U] se ha vuelto sinónimo de su autoridad imperial."
 
 nick_the_megas:0 "ho Megas"
 nick_the_megas_desc:0 "Con el título griego de 'ho Megas' (el Grande), [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es reconocido por una grandeza, unos logros monumentales y un arte de gobernar sin parangón."
 
 nick_the_lackland:0 "el Sin Tierra"
 nick_the_lackland_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] recibió este sobrenombre por no haber heredado un territorio sustancial al nacer, en marcado contraste con los vastos feudos concedidos a sus hermanos."
 
 nick_the_populator:0 "el Populador"
 nick_the_populator_desc:0 "Recordado como mecenas del asentamiento y el crecimiento, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] patrocinó una colonización generalizada y la fundación de nuevas ciudades por todos sus dominios."
 
 nick_the_augustus_nb:0 "Augusto"
 nick_the_augustus_nb_desc:0 "Un honorífico que evoca la gloria de Roma, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] recibe el título de 'Augusto' en señal de venerable majestad y de la notable expansión del dominio real."
 
 nick_the_dieudonne:0 "Dieudonné"
 nick_the_dieudonne_desc:0 "Que significa 'Dado por Dios', este epíteto refleja la creencia de que el nacimiento de [CHARACTER.GetShortUINameNoTooltipNoFormat|U] fue una bendición milagrosa, a menudo llegada tras un largo periodo de incertidumbre dinástica."
 
 nick_the_cuman:0 "el Cumano"
 nick_the_cuman_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] se distingue por sus fuertes vínculos, herencia materna o estrecha asociación cultural con la confederación nómada cumana."
 
 nick_curtmantle:0 "Mantocorto"
 nick_curtmantle_desc:0 "Notable por rechazar las largas y ondulantes túnicas cortesanas en favor de capas de montar más prácticas y cortas, la elección de indumentaria de [CHARACTER.GetShortUINameNoTooltipNoFormat|U] refleja una naturaleza célebremente inquieta y enérgica."
 
 nick_augustus:0 "Augusto"
 nick_augustus_desc:0 "Un honorífico que evoca la gloria de Roma, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es estilizado como 'Augusto' para significar una venerable majestad y la significativa expansión del dominio real."
 
 nick_lackland:0 "Sin Tierra"
 nick_lackland_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] recibió este sobrenombre por no heredar un territorio sustancial al nacer, en marcado contraste con los vastos feudos concedidos a sus hermanos."
 
 nick_barbarossa:0 "Barbarroja"
 nick_barbarossa_desc:0 "Conocido por los italianos como 'Barbarroja', la llamativa barba roja de [CHARACTER.GetShortUINameNoTooltipNoFormat|U] se convirtió en el símbolo imborrable de su autoridad imperial y sus campañas militares."
 
 nick_the_fortunate:0 "el Afortunado"
 nick_the_fortunate_desc:0 "Aparentemente bendecido por la providencia divina, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] heredó vastas tierras y ganó batallas cruciales con una suerte casi inquietante."
 
 nick_bloodaxe:0 "Hacha Sangrienta"
 nick_bloodaxe_desc:0 "Un apelativo sombrío ganado por la disposición a despachar sin piedad a los rivales —incluida su propia sangre—, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] gobierna con una ferocidad marcial incuestionable."
 
 nick_greycloak:0 "Capa Gris"
 nick_greycloak_desc:0 "Ganándose este nombre tras adquirir y lucir célebremente una capa de piel de lobo o de oveja gris, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] marcó una tendencia que quedó inextricablemente ligada a [CharYourHerHis(CHARACTER)] reinado."
 
 nick_forkbeard:0 "Barba Horquilla"
 nick_forkbeard_desc:0 "Identificado por una barba distintivamente peinada y partida, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] lleva un apelativo que evoca la estética feroz y tradicional del Norte."
 
 nick_nevsky:0 "Nevski"
 nick_nevsky_desc:0 "Otorgado este prestigioso título tras una monumental victoria militar en las orillas del río Neva, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es aclamado como defensor de la fe y del reino."
 
 nick_longsword:0 "Espada Larga"
 nick_longsword_desc:0 "Célebre por su destreza marcial y el manejo de espadas pesadas y alargadas, el epíteto de [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es un recordatorio constante de sus capacidades en el campo de batalla."
 
 nick_saladin:0 "Salah al-Din"
 nick_saladin_desc:0 "Conocido por los cronistas occidentales como Saladino, esta es la forma latinizada de Salāh ad-Dīn, reconociendo a [CHARACTER.GetShortUINameNoTooltipNoFormat|U] como la 'Rectitud de la Fe'."
 
 nick_saphadin:0 "Saphadin"
 nick_saphadin_desc:0 "Una corrupción franca del honorífico Sayf ad-Dīn, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es reconocido tanto por cruzados como por musulmanes como la 'Espada de la Fe'."
 
 nick_meledin:0 "Meledin"
 nick_meledin_desc:0 "Conocido como Meledín en los relatos europeos, este epíteto es una derivación occidentalizada de los títulos regios árabes formales de [CHARACTER.GetShortUINameNoTooltipNoFormat|U]."
 
 nick_the_big_nest:0 "el Gran Nido"
 nick_the_big_nest_desc:0 "Un testimonio del éxito dinástico, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] se ganó este apodo por engendrar un número excepcionalmente grande de hijos para asegurar la sucesión."
 
 nick_wrymouth:0 "Boca Torcida"
 nick_wrymouth_desc:0 "Conocido por una marcada asimetría facial o un labio torcido, el rasgo físico de [CHARACTER.GetShortUINameNoTooltipNoFormat|U] se convirtió en un identificador ampliamente reconocido entre sus súbditos."
 
 nick_longshanks:0 "Piernas Largas"
 nick_longshanks_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] destaca por su excepcional altura y su imponente estatura física, sobresaliendo tanto entre sus súbditos como entre sus rivales."
 
 nick_spindleshanks:0 "Piernas Delgadas"
 nick_spindleshanks_desc:0 "Un nombre algo despectivo y descriptivo que hace referencia a las piernas notablemente largas y delgadas de [CHARACTER.GetShortUINameNoTooltipNoFormat|U]."
 
 nick_the_bulgar_slayer:0 "el Matador de Búlgaros"
 nick_the_bulgar_slayer_desc:0 "Tras décadas de guerra implacable y brutal, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] destrozó el estado búlgaro, ganándose un temible título que resonará por toda la historia bizantina."
 
 nick_the_rich:0 "el Rico"
 nick_the_rich_desc:0 "Poseedor de un tesoro que rivaliza con los mayores imperios, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es universalmente conocido por una riqueza personal inmensa, casi inconcebible."
 
 nick_the_amorous:0 "el Amante"
 nick_the_amorous_desc:0 "Tan famoso por sus hazañas en la alcoba como en la sala del consejo, la naturaleza apasionada y los numerosos enredos amorosos de [CHARACTER.GetShortUINameNoTooltipNoFormat|U] son legendarios."
 
 nick_the_moneybag:0 "el Saco de Dinero"
 nick_the_moneybag_desc:0 "Conocido por una fiscalidad agresiva y un talento para acumular monedas, los súbditos ven a [CHARACTER.GetShortUINameNoTooltipNoFormat|U] como un gobernante cuya principal lealtad es hacia el tesoro."
 
 nick_the_proud_2:0 "$nick_the_proud$"
 nick_the_proud_2_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] lleva su linaje y sus logros con un talante inquebrantable y altanero, exigiendo el máximo respeto de todos los que se le acercan."
 
 nick_beauclerc:0 "Beauclerc"
 nick_beauclerc_desc:0 "Que significa 'Buen Erudito', este título honra el nivel de educación y alfabetización inusualmente alto de [CHARACTER.GetShortUINameNoTooltipNoFormat|U], un rasgo raro y respetado para un gobernante de esta época."
 
 nick_the_elder:0 "el Anciano"
 nick_the_elder_desc:0 "Un título de antigüedad que distingue a [CHARACTER.GetShortUINameNoTooltipNoFormat|U] de parientes más jóvenes y reconoce su largo tiempo en el trono."
 
 nick_the_black_prince:0 "el Príncipe Negro"
 nick_the_black_prince_desc:0 "Un epíteto marcial y ominoso, probablemente derivado del color de su armadura o de la oscura reputación que se ganó mediante despiadadas correrías militares."
 
 nick_the_short:0 "el Bajo"
 nick_the_short_desc:0 "Un descriptor crudo y universalmente reconocido para [CHARACTER.GetShortUINameNoTooltipNoFormat|U], cuya estatura diminuta es registrada con frecuencia por los cronistas."
 
 nick_the_hardy:0 "el Valiente"
 nick_the_hardy_desc:0 "Caracterizado por una inmensa resiliencia física y un espíritu inquebrantable, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] ha demostrado ser capaz de resistir penurias y campañas extremas."
 
 nick_caernarfon:0 "de Caernarfon"
 nick_caernarfon_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] es formalmente identificado por [CharYourHerHis(CHARACTER)] lugar de nacimiento en Caernarfon, vinculando su identidad personal al imponente castillo y a la región."
 
 nick_winchester:0 "de Winchester"
 nick_winchester_desc:0 "Identificado geográficamente, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es conocido por su asociación y nacimiento dentro de la histórica y real ciudad de Winchester."
 
 nick_the_bruce:0 "el Bruce"
 nick_the_bruce_desc:0 "Portando la forma anglicanizada de 'de Brus', [CHARACTER.GetShortUINameNoTooltipNoFormat|U] ha elevado este apellido noble hasta hacerlo sinónimo de la feroz independencia del reino."
 
 nick_toom_tabard:0 "Toom Tabard"
 nick_toom_tabard_desc:0 "Que significa 'Abrigo Vacío', este apodo escocés despectivo da a entender que [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es un gobernante hueco, una marioneta ineficaz despojada de verdadera autoridad real."
 
 nick_maid_norway:0 "La Doncella de Noruega"
 nick_maid_norway_desc:0 "Un identificador poético para una joven heredera procedente del otro lado del Mar del Norte, que simboliza el frágil puente dinástico entre dos reinos distantes."
 
 nick_virgo:0 "Virgo"
 nick_virgo_desc:0 "La Virgen. [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es célebre por hacer un estricto voto de castidad, priorizando la pureza espiritual y la devoción religiosa sobre los deberes dinásticos carnales."
 
 nick_the_fierce:0 "el Feroz"
 nick_the_fierce_desc:0 "Poseedor de un carácter aterrador y de un enfoque agresivo hacia la diplomacia y la guerra, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] gobierna a través de la intimidación y la pura fuerza de voluntad."
 
 nick_tairbith:0 "Tairbith"
 nick_tairbith_desc:0 "Un epíteto gaélico que significa 'el Desafortunado' o 'el Tropezador', que refleja un reinado caracterizado por su corta duración, su infortunio o una percibida ineptitud."
 
 nick_the_redking:0 "el Rey Rojo"
 nick_the_redking_desc:0 "Conocido por su tez rubicunda y un temperamento fogoso e impredecible, el reinado de [CHARACTER.GetShortUINameNoTooltipNoFormat|U] se recuerda por su naturaleza volátil y sangrienta."
 
 nick_the_diseased:0 "el Enfermo"
 nick_the_diseased_desc:0 "Trágicamente definido por una enfermedad crónica y muy visible, la corte de [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es un constante desfile de médicos desesperados."
 
 nick_the_chief:0 "el Jefe"
 nick_the_chief_desc:0 "Reconocido como el líder supremo de su pueblo, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] ostenta un título que trasciende los rangos feudales formales, arraigado en una profunda lealtad tribal o de clan."
 
 nick_the_fraticide:0 "el Fratricida"
 nick_the_fraticide_desc:0 "Un epíteto oscuro y condenatorio. [CHARACTER.GetShortUINameNoTooltipNoFormat|U] aseguró o mantuvo el poder cometiendo el tabú definitivo: derramar la sangre de un hermano."
 
 nick_the_aggressor:0 "el Agresor"
 nick_the_aggressor_desc:0 "Nunca conforme con la paz, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es conocido por sus ataques sin provocación y una política exterior interminablemente expansionista."
 
 nick_the_madman:0 "el Loco"
 nick_the_madman_desc:0 "Aquejado de graves episodios de inestabilidad mental o de un comportamiento errático e incomprensible, sus contemporáneos consideran que la mente de [CHARACTER.GetShortUINameNoTooltipNoFormat|U] está fracturada."
 
 nick_white_flower:0 "de las Flores Blancas"
 nick_white_flower_desc:0 "Un apelativo caballeresco y poético, probablemente en referencia a una insignia heráldica, una disposición romántica o una presencia cortesana notablemente elegante y refinada."
 
 nick_the_tall:0 "el Alto"
 nick_the_tall_desc:0 "Sobresaliendo con creces entre sus contemporáneos, la impresionante estatura vertical de [CharYourHerHis(CHARACTER)] es un rasgo físico definitorio e intimidante."
 
 nick_the_posthumous:0 "el Póstumo"
 nick_the_posthumous_desc:0 "Nacido tras la muerte de su padre, la propia existencia de [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es un testimonio de la continuidad dinástica contra todo pronóstico."
 
 nick_the_quarrelsome:0 "el Peleón"
 nick_the_quarrelsome_desc:0 "Inherentemente combativo y presto a ofenderse, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] se ve envuelto en disputas legales y militares casi constantes con sus vasallos."
 
 nick_the_do_nothing:0 "el Inactivo"
 nick_the_do_nothing_desc:0 "Una traducción de 'roi fainéant', este despectivo título marca a [CHARACTER.GetShortUINameNoTooltipNoFormat|U] como una figura decorativa que entrega el esfuerzo real de gobernar a poderosos subordinados."
 
 nick_d_outremer:0 "de Outremer"
 nick_d_outremer_desc:0 "Que significa 'de ultramar', [CHARACTER.GetShortUINameNoTooltipNoFormat|U] se ganó este título tras criarse en el exilio al otro lado del mar antes de regresar a reclamar [CharYourHerHis(CHARACTER)] derecho de nacimiento."
 
 nick_the_ceremonious:0 "el Ceremonioso"
 nick_the_ceremonious_desc:0 "Obsesionado con el protocolo cortesano, el ritual y la estricta codificación de la majestad real, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] gobierna a través de un cuidadoso boato."
 
 nick_the_liberal:0 "el Liberal"
 nick_the_liberal_desc:0 "Célebre por su munificencia sin reservas, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] reparte limosnas entre los pobres y concede amplias libertades a los burgueses del reino."
 
 nick_the_warrior:0 "el Guerrero"
 nick_the_warrior_desc:0 "Más cómodo en un campamento militar que en un palacio, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es primero un soldado y después un soberano, liderando desde la vanguardia."
 
 nick_the_summoned:0 "el Invocado"
 nick_the_summoned_desc:0 "Un título misterioso y ominoso, que hace referencia a la leyenda de que [CHARACTER.GetShortUINameNoTooltipNoFormat|U] fue condenado a responder a una llamada divina hacia la tumba por aquellos a quienes condenó injustamente."
 
 nick_the_desired:0 "el Deseado"
 nick_the_desired_desc:0 "Largamente esperado por un pueblo desesperado por estabilidad, el ascenso de [CHARACTER.GetShortUINameNoTooltipNoFormat|U] fue recibido con profundo alivio y grandes esperanzas."
 
 nick_the_emperor:0 "el Emperador"
 nick_the_emperor_desc:0 "Sin importar su rango real, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] actúa con tal grandeza imperial y ejerce tal hegemonía que sus contemporáneos lo llaman simplemente 'El Emperador'."
 
 nick_the_reckless:0 "el Temerario"
 nick_the_reckless_desc:0 "Conocido por lanzarse de cabeza a la batalla y a la política sin pensárselo dos veces, la valentía de [CHARACTER.GetShortUINameNoTooltipNoFormat|U] solo es igualada por una peligrosa falta de previsión."
 
 nick_the_catholic:0 "el Católico"
 nick_the_catholic_desc:0 "Otorgado por el Papa en reconocimiento a su excepcional piedad y ortodoxia, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es visto como el principal defensor temporal de la Santa Iglesia."
 
 nick_poet_king:0 "el Rey Poeta"
 nick_poet_king_desc:0 "Un alma educada y artística, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es tan hábil componiendo versos y patrocinando las artes como gobernando el reino."
 
 nick_the_boulonnais:0 "el Boulonnais"
 nick_the_boulonnais_desc:0 "Identifica las profundas raíces de [CHARACTER.GetShortUINameNoTooltipNoFormat|U] o su nacimiento en el Condado de Boulogne, vinculando su legado a ese estratégico territorio costero."
 
 nick_of_penalen:0 "de Peñalén"
 nick_of_penalen_desc:0 "Un trágico epíteto geográfico que hace referencia a los acantilados de Peñalén, el lugar donde [CHARACTER.GetShortUINameNoTooltipNoFormat|U] encontró un célebre y traicionero final."
 
 nick_of_najera:0 "de Nájera"
 nick_of_najera_desc:0 "Vinculando su legado a la ciudad de Nájera, un lugar de profunda importancia dinástica o militar durante la vida de [CHARACTER.GetShortUINameNoTooltipNoFormat|U]."
 
 nick_of_anjou:0 "de Anjou"
 nick_of_anjou_desc:0 "Identificado formalmente por su tierra ancestral de Anjou, una designación usada a menudo para distinguir a [CHARACTER.GetShortUINameNoTooltipNoFormat|U] tras heredar tronos extranjeros."
 
 nick_great_count:0 "el Gran Conde"
 nick_great_count_desc:0 "Aunque técnicamente ostenta un rango feudal inferior, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] acumuló tal poder y territorio que [CharYourHerHis(CHARACTER)] autoridad rivalizaba con la de los reyes."
 
 nick_the_bavarian:0 "el Bávaro"
 nick_the_bavarian_desc:0 "Un apelativo que resalta las raíces culturales, la crianza o la base de poder político de [CHARACTER.GetShortUINameNoTooltipNoFormat|U] dentro de las tierras históricas de Baviera."
 
 nick_the_venetian:0 "el Veneciano"
 nick_the_venetian_desc:0 "Conocido por sus estrechos lazos, nacimiento o alineamiento diplomático con la Serenísima República de Venecia, adoptando sus marcadores culturales marítimos y mercantiles."
 
 nick_the_bookish:0 "el Estudioso"
 nick_the_bookish_desc:0 "Prefiriendo la calma del scriptorium al fragor del torneo, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es un erudito devoto y mecenas de la traducción y el saber."
 
 nick_the_boxer:0 "el Boxeador"
 nick_the_boxer_desc:0 "Célebre por el combate cuerpo a cuerpo y los torneos marciales, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] confía en la pura fuerza corporal y la destreza en la lucha para imponer su dominio."
 
 nick_probus:0 "Probo"
 nick_probus_desc:0 "Un honorífico latino que significa 'El Recto' o 'El Bueno', que refleja un reinado caracterizado por la integridad moral, la justicia y una administración justa."
 
 nick_the_bearded:0 "el Barba"
 nick_the_bearded_desc:0 "En una época de nobles bien afeitados, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] mantuvo célebremente una barba completa y tradicional como símbolo de autoridad y herencia."
 
 nick_tanglefoot:0 "Pie Torcido"
 nick_tanglefoot_desc:0 "Un epíteto burlón y descriptivo que señala un andar torpe, una cojera o una tendencia a tropezar, haciendo que el movimiento de [CHARACTER.GetShortUINameNoTooltipNoFormat|U] sea muy reconocible."
 
 nick_the_curly:0 "el Rizado"
 nick_the_curly_desc:0 "Identificado por sus contemporáneos simplemente por la llamativa textura rizada de su cabello."
 
 nick_the_exile:0 "el Exiliado"
 nick_the_exile_desc:0 "Expulsado de sus tierras ancestrales por una convulsión política, la identidad histórica de [CHARACTER.GetShortUINameNoTooltipNoFormat|U] está indisolublemente ligada a su tiempo en el destierro extranjero."
 
 nick_ploughpenny:0 "Ploughpenny"
 nick_ploughpenny_desc:0 "Ganado tras instituir un impuesto sumamente impopular sobre cada arado del reino, vinculando para siempre el nombre de [CHARACTER.GetShortUINameNoTooltipNoFormat|U] a la extracción fiscal."
 
 nick_emune:0 "Emune"
 nick_emune_desc:0 "Que significa 'el Memorable', este epíteto danés señala a un gobernante cuyas acciones —para bien o para mal— dejaron una huella indeleble en la historia del reino."
 
 nick_hunger:0 "Hambre"
 nick_hunger_desc:0 "Un apelativo trágico y literal. El reinado de [CHARACTER.GetShortUINameNoTooltipNoFormat|U] coincidió con una hambruna devastadora y generalizada, llevando al pueblo a asociarlo con la inanición."
 
 nick_the_survivor:0 "el Superviviente"
 nick_the_survivor_desc:0 "Habiendo sobrevivido a rivales, resistido batallas catastróficas o escapado de numerosos intentos de asesinato, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] simplemente se niega a morir."
 
 nick_the_lawmender:0 "el Restablecedor de la Ley"
 nick_the_lawmender_desc:0 "Reverenciado como gran reformador legal, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] renovó los fragmentados códigos del reino, llevando una justicia estandarizada a las provincias."
 
 nick_the_barefoot:0 "Berrføtt"
 nick_the_barefoot_desc:0 "Que significa 'Descalzo', [CHARACTER.GetShortUINameNoTooltipNoFormat|U] adoptó el estilo gaélico de vestimenta —dejando las piernas al descubierto— tras extensas campañas en el oeste celta."
 
 nick_the_fearsomeeyes:0 "Los Ojos Temibles"
 nick_the_fearsomeeyes_desc:0 "Poseedor de una mirada intensa y penetrante, se dice que [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es capaz de imponer obediencia o infundir terror con solo cruzar la mirada con un súbdito."
 
 nick_longarm:0 "Brazo Largo"
 nick_longarm_desc:0 "Ya se refiera a un alcance físico real o a una impresionante capacidad para proyectar poder y justicia a través de grandes distancias, nadie escapa a las garras de [CHARACTER.GetShortUINameNoTooltipNoFormat|U]."
 
 nick_first_crowned:0 "el Primer Coronado"
 nick_first_crowned_desc:0 "Un título monumental que denota a [CHARACTER.GetShortUINameNoTooltipNoFormat|U] como el primero de [CharYourHerHis(CHARACTER)] dinastía o reino en ser formalmente elevado y coronado como Rey."
 
 nick_parapinakes:0 "Parapinakes"
 nick_parapinakes_desc:0 "Que significa 'Menos un Cuarto', este apodo despectivo se le dio tras devaluar la moneda y causar severa escasez de grano durante su reinado."
 
 nick_the_macedonian:0 "el Macedonio"
 nick_the_macedonian_desc:0 "Identificado por sus orígenes geográficos y culturales en el thema de Macedonia, iniciando una célebre era dinástica en el imperio."
 
 nick_the_armenian:0 "el Armenio"
 nick_the_armenian_desc:0 "Resaltando sus orígenes étnicos, este apelativo marca a [CHARACTER.GetShortUINameNoTooltipNoFormat|U] como proveniente de las escarpadas tierras y orgullosas tradiciones de Armenia."
 
 nick_the_khazar:0 "el Khazar"
 nick_the_khazar_desc:0 "Portando el legado de las estepas, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] recibe su nombre por la herencia materna del poderoso Kaganato Jázaro."
 
 nick_the_syrian:0 "el Isaurio"
 nick_the_syrian_desc:0 "Procedente de la frontera oriental, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] trajo la perspectiva curtida e iconoclasta de las fronteras sirias al trono imperial."
 
 nick_rhinotmetos:0 "Rinotmetos"
 nick_rhinotmetos_desc:0 "Que significa 'El Nariz Cortada', este brutal epíteto sirve como recordatorio visible de que [CHARACTER.GetShortUINameNoTooltipNoFormat|U] sufrió una mutilación facial —un castigo bizantino tradicional destinado a descalificar a alguien del trono."
 
 nick_chlorus:0 "Cloro"
 nick_chlorus_desc:0 "Que significa 'El Pálido', este clásico sobrenombre romano describe la tez notablemente clara o enfermiza de [CHARACTER.GetShortUINameNoTooltipNoFormat|U]."
 
 nick_the_clever:0 "el Astuto"
 nick_the_clever_desc:0 "Confiando en un intelecto agudo, ardides diplomáticos y previsión estratégica, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] burla con facilidad a rivales físicamente más imponentes."
 
 nick_the_resplendent:0 "el Resplandeciente"
 nick_the_resplendent_desc:0 "Deslumbrante tanto en apariencia como en grandeza cortesana, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] preside una edad de oro de riqueza y brillantez cultural."
 
 nick_the_minor:0 "el Menor"
 nick_the_minor_desc:0 "Añadido para distinguir a [CHARACTER.GetShortUINameNoTooltipNoFormat|U] de un pariente más famoso o de mayor rango, indicando juventud o una posición menor en la historia dinástica."
 
 nick_the_merciful:0 "el Misericordioso"
 nick_the_merciful_desc:0 "En una era de represalias brutales, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es célebre por conceder indultos generalizados y conmutar sentencias severas."
 
 nick_the_iron:0 "el de Hierro"
 nick_the_iron_desc:0 "Inquebrantable, inflexible y frío cuando es necesario, la voluntad y la constitución de [CHARACTER.GetShortUINameNoTooltipNoFormat|U] se comparan con los metales más fuertes."
 
 nick_anushirvan:0 "Anushirvan"
 nick_anushirvan_desc:0 "Un título persa que significa 'de Alma Inmortal', que refleja un legado de profunda justicia, genio administrativo y un reinado que se recordará eternamente."
 
 nick_the_unifier:0 "el Unificador"
 nick_the_unifier_desc:0 "A través de la diplomacia y la guerra, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] cosió con éxito un reino fragmentado, forjando tierras dispares en un único estado cohesionado."
 
 nick_the_leper:0 "el Leproso"
 nick_the_leper_desc:0 "Afligido por una enfermedad devastadora y muy estigmatizada, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] debe equilibrar las pesadas cargas de gobernar con la decadencia física."
 
 nick_the_calf:0 "el Ternero"
 nick_the_calf_desc:0 "Un apodo que probablemente denota juventud, un carácter dócil, o un reinado temprano supervisado por regentes más poderosos y controladores."
 
 nick_the_bent:0 "el Doblado"
 nick_the_bent_desc:0 "Describe una severa postura encorvada o una afección de la columna, marcando a [CHARACTER.GetShortUINameNoTooltipNoFormat|U] con una silueta distintiva conocida por todos."
 
 nick_le_rechin:0 "le Réchin"
 nick_le_rechin_desc:0 "Que significa 'El Huraño' o 'El Pendenciero', este epíteto francés capta a la perfección la personalidad notoriamente difícil, combativa y poco cooperativa de [CHARACTER.GetShortUINameNoTooltipNoFormat|U]."
 
 nick_greymantle:0 "Greymantle"
 nick_greymantle_desc:0 "Identificado por una prenda favorita, la sencilla capa gris de [CHARACTER.GetShortUINameNoTooltipNoFormat|U] se convirtió en un símbolo perdurable de [CharYourHerHis(CHARACTER)] gobierno pragmático."
 
 nick_the_abbot:0 "el Abad"
 nick_the_abbot_desc:0 "Mostrando un comportamiento piadoso y una gran implicación en los asuntos monásticos, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] a menudo parece más apto para un claustro que para un castillo."
 
 nick_the_graceful:0 "el Grácil"
 nick_the_graceful_desc:0 "Moviéndose con una elegancia casi musical, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] encarna los más altos estándares del refinamiento aristocrático."
 
 nick_mbbeaut:0 "el Hermoso"
 nick_mbbeaut_desc:0 "Bendecido con un atractivo físico extraordinario, la belleza de [CHARACTER.GetShortUINameNoTooltipNoFormat|U] se celebra en canciones y crónicas mucho más allá de las fronteras del reino."
 
 nick_seer:0 "el Vidente"
 nick_seer_desc:0 "Creído poseedor de clarividencia o de una intuición profunda y casi mística, los súbditos susurran que [CHARACTER.GetShortUINameNoTooltipNoFormat|U] puede percibir los sucesos antes de que ocurran."
 
 nick_the_learned:0 "el Sabio"
 nick_the_learned_desc:0 "Sumamente educado y versado en teología y filosofía, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es respetado tanto por su capacidad intelectual como por ostentar un título."
 
 nick_the_woolmaker:0 "el Tejedor de Lana"
 nick_the_woolmaker_desc:0 "Un mote inusual derivado de una gran implicación en el comercio textil o de un enfoque pragmático en los cimientos económicos de la riqueza del reino."
 
 nick_vidfamne:0 "Vidfamne"
 nick_vidfamne_desc:0 "Un legendario epíteto nórdico que significa 'de Vasto Alcance' o 'de Amplio Dominio', que denota a un conquistador cuyo dominio se extiende por vastos y distantes territorios."
 
 nick_fafnirkiller:0 "Fáfnirslayer"
 nick_fafnirkiller_desc:0 "Un título mítico y heroico que evoca al legendario Sigurd, asociando a [CHARACTER.GetShortUINameNoTooltipNoFormat|U] con la muerte de bestias y la superación de probabilidades imposibles."
 
 nick_beli:0 "Beli"
 nick_beli_desc:0 "Un antiguo identificador britónico que vincula el linaje de [CHARACTER.GetShortUINameNoTooltipNoFormat|U] con las legendarias figuras fundacionales y los míticos reyes de Britania."
 
 nick_tratalja:0 "Tallador de Madera"
 nick_tratalja_desc:0 "Derivado del nórdico antiguo 'Tretelgja' (Talador de Árboles), [CHARACTER.GetShortUINameNoTooltipNoFormat|U] se ganó este nombre al despejar sistemáticamente vastos bosques para asentar nuevas tierras."
 
 nick_skotkonung:0 "Skötkonung"
 nick_skotkonung_desc:0 "Que significa 'Rey del Tributo' o 'Rey del Tesoro', este título refleja el legado de [CHARACTER.GetShortUINameNoTooltipNoFormat|U] al acuñar la primera moneda real o establecer nuevos sistemas de tributo."
 
 nick_jacobus:0 "Jacob"
 nick_jacobus_desc:0 "Portando la forma latinizada de Santiago, el nombre de [CHARACTER.GetShortUINameNoTooltipNoFormat|U] tiene una profunda resonancia bíblica, subrayando su papel como patriarca del pueblo."
 
 nick_huguescapet:0 "Capeto"
 nick_huguescapet_desc:0 "Probablemente derivado del uso de una capa (cappa) específica como abad laico, este apelativo se convirtió en el identificador perdurable de una dinastía que moldearía la historia."
 
 nick_konradinus:0 "Konradin"
 nick_konradinus_desc:0 "El diminutivo 'Pequeño Conrado', un trágico identificador para un joven gobernante cuya vida y ambiciones se truncaron antes de poder siquiera comenzar."
 
 nick_the_illustrious:0 "el Ilustre"
 nick_the_illustrious_desc:0 "Irradiando gloria a través de guerras exitosas, mecenazgo cultural y leyes sabias, el reinado de [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es considerado un punto álgido para el reino."
 
 nick_the_bellicose:0 "el Belicoso"
 nick_the_bellicose_desc:0 "Siempre dispuesto a desenvainar la espada, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] posee un espíritu militante y un profundo y agresivo entusiasmo por la guerra."
 
 nick_the_leper_king:0 "el Rey Leproso"
 nick_the_leper_king_desc:0 "Una figura trágica pero heroica, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] sigue defendiendo ferozmente su reino a caballo pese a padecer la agonizante decadencia de la lepra."
 
 nick_the_strongbow:0 "Arco Largo"
 nick_the_strongbow_desc:0 "Célebre por su destreza marcial y sus expediciones militares, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es conocido por emplear la arquería mortal y tácticas de choque agresivas en la guerra."
 
 nick_karolyrobert:0 "Roberto"
 nick_karolyrobert_desc:0 "Conocido tanto como Carlos como Roberto, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] sorteó orígenes extranjeros complejos para reclamar y estabilizar con éxito un reino disputado."
 
 nick_battler:0 "el Batallador"
 nick_battler_desc:0 "Veterano de incontables escaramuzas y batallas campales, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] se define por una vida entera luchando en primera línea."

# Edited vanilla -- To reduce the memery of Paradox's descriptions for epithets

 nick_bluetooth:0 "Diente Azul"
 nick_bluetooth_desc:1 "Derivado de un prominente diente oscuro o descolorido, el distintivo apelativo de [CHARACTER.GetShortUINameNoTooltipNoFormat|U] se ha convertido en un identificador legendario en las sagas nórdicas."
 
 nick_canmore:1 "Cabeza Grande"
 nick_canmore_desc:1 "Del gaélico 'Ceann Mòr', que significa 'Gran Jefe' o 'Cabeza Grande', este título significa el indiscutible liderazgo y la formidable presencia dinástica de [CHARACTER.GetShortUINameNoTooltipNoFormat|U]."
 
 nick_tanglehair:0 "Cabello Enmarañado"
 nick_tanglehair_desc:1 "Antes de unificar su reino, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] juró célebremente dejarse el cabello sin cortar ni peinar, ganándose este rudo identificador."
 
 nick_fairhair:0 "Cabellera Hermosa"
 nick_fairhair_desc:1 "Habiendo cumplido un monumental juramento de conquista, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] por fin se peinó [CharYourHerHis(CHARACTER)] legendaria melena, ganándose un título sinónimo de la fundación de un reino unificado."
 
 nick_haardraade:0 "el Gobernante Severo"
 nick_haardraade_desc:1 "Que significa 'Gobernante Duro' o 'Consejo Severo', este epíteto refleja las intransigentes ambiciones militares de [CHARACTER.GetShortUINameNoTooltipNoFormat|U] y su inquebrantable dominio del trono."
 
 nick_hardeknud:0 "Hardicanuto"
 nick_hardeknud_desc:1 "Un formidable apelativo que significa 'Nudo Duro', reflejando tanto la naturaleza robusta de [CHARACTER.GetShortUINameNoTooltipNoFormat|U] como los complejos lazos políticos que [CharYouSheHe(CHARACTER)] navegó por los mares del norte."
 
 nick_hildetand:0 "Diente de Guerra"
 nick_hildetand_desc:1 "Que se traduce como 'Diente de Guerra', [CHARACTER.GetShortUINameNoTooltipNoFormat|U] lleva un temible título legendario, símbolo de una vida entera dedicada a la sangrienta vanguardia del combate."
 
 nick_lodbrok:1 "Lodbrok"
 nick_lodbrok_desc:1 "Que significa 'Bragas Peludas', este legendario apelativo tiene sus raíces en las sagas, atribuido al uso de prendas especialmente confeccionadas para protegerse de las mordeduras de serpientes."
 
 nick_ring:0 "Anillo"
 nick_ring_desc:1 "Un prestigioso identificador nórdico que probablemente denota el papel de [CHARACTER.GetShortUINameNoTooltipNoFormat|U] como generoso dador de anillos y distribuidor de riqueza entre su leal hueste."
 
 nick_snake_in_the_eye:0 "Serpiente en el Ojo"
 nick_snake_in_the_eye_desc:1 "Un identificador físico mítico de las sagas, que sugiere que [CHARACTER.GetShortUINameNoTooltipNoFormat|U] lleva la marca del ouroboros en su mirada, significando un linaje legendario."
 
 nick_the_affable:0 "el Afable"
 nick_the_affable_desc:1 "Conocido por una corte abierta y accesible y un talante inusualmente agradable, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es celebrado por su naturaleza diplomática y afable."
 
 nick_the_apostle:0 "el Apóstol"
 nick_the_apostle_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] es venerado en las crónicas eclesiásticas por dedicar su vida a la incansable evangelización y conversión de tierras paganas."
 
 nick_the_avenger:0 "el Vengador"
 nick_the_avenger_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] se ganó este sombrío título tras dedicar su reinado a una búsqueda implacable e incesante de venganza contra quienes agraviaron a su familia."
 
 nick_the_bald:0 "el Calvo"
 nick_the_bald_desc:1 "En una época en la que una cabellera abundante era señal de vigor real, la falta de cabello de [CHARACTER.GetShortUINameNoTooltipNoFormat|U] se convirtió en el rasgo físico definitorio registrado por los cronistas."
 
 nick_the_bald_ironic:0 "$nick_the_bald$"
 nick_the_bald_ironic_desc:1 "Un sobrenombre irónico. Aunque conservaba una cabellera completa, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] fue objeto de burlas por carecer de tierras o de corona, quedando 'calvo' de autoridad real."
 
 nick_the_bastard:0 "el Bastardo"
 nick_the_bastard_desc:1 "Un crudo recordatorio de su ilegitimidad, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] ha tenido que luchar el doble para asegurar un legado que los herederos legítimos dan por sentado."
 
 nick_the_black:0 "el Negro"
 nick_the_black_desc:1 "Ya denote el tono oscuro de su armadura, de su cabello, o la naturaleza despiadada e implacable de su reinado, el mote proyecta una larga sombra."
 
 nick_the_blessed:0 "el Bendito"
 nick_the_blessed_desc:1 "Erigido como paradigma de virtud, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es considerado ampliamente por el clero como favorecido por la gracia divina."
 
 nick_the_blind:0 "el Ciego"
 nick_the_blind_desc:1 "Privado de la vista —ya sea por enfermedad, en batalla o por una cruel mutilación judicial—, la discapacidad de [CHARACTER.GetShortUINameNoTooltipNoFormat|U] define su legado histórico."
 
 nick_the_bold:0 "el Audaz"
 nick_the_bold_desc:1 "Los cronistas alaban a [CHARACTER.GetShortUINameNoTooltipNoFormat|U] por sus audaces campañas militares y su disposición a tomar la iniciativa cuando otros dudan."
 
 nick_the_boneless:0 "el Deshuesado"
 nick_the_boneless_desc:1 "Un misterioso epíteto de saga, debatido por los estudiosos como referencia a una extraordinaria flexibilidad física, a una enfermedad ósea degenerativa, o a una metáfora de fluidez táctica."
 
 nick_the_brave:0 "el Valiente"
 nick_the_brave_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] ha demostrado su valor en incontables campos de batalla, ganándose una reputación de coraje inquebrantable ante las adversidades más insuperables."
 
 nick_the_chaste:0 "el Casto"
 nick_the_chaste_desc:1 "Estimado por su estricta adhesión a los votos religiosos y a la pureza moral, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] rara vez sucumbe a las tentaciones carnales de la corte."
 
 nick_the_confessor:0 "el Confesor"
 nick_the_confessor_desc:1 "Célebre por una vida de profunda piedad y por la firme defensa de la fe, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es venerado casi como un santo entre el clero."
 
 nick_the_conqueror:0 "el Conquistador"
 nick_the_conqueror_desc:1 "Mediante la pura fuerza de las armas y el genio táctico, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] sometió con éxito un reino extranjero, sellando un legado escrito en sangre y hierro."
 
 nick_the_cruel:0 "el Cruel"
 nick_the_cruel_desc:1 "Los cronistas pintan un cuadro sombrío del reinado de [CHARACTER.GetShortUINameNoTooltipNoFormat|U], definido por castigos draconianos, tortura y una absoluta falta de misericordia."
 
 nick_the_crusader:0 "el Cruzado"
 nick_the_crusader_desc:1 "Habiendo tomado la cruz, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es celebrado en todo el mundo por sus guerras santas contra los enemigos de la fe."
 
 nick_the_devil:0 "el Diablo"
 nick_the_devil_desc:1 "Un apelativo nacido del terror. Las acciones de [CHARACTER.GetShortUINameNoTooltipNoFormat|U] se consideran tan maliciosas y destructivas que sus contemporáneos creen que está aliado con fuerzas oscuras."
 
 nick_the_drunkard:0 "el Borracho"
 nick_the_drunkard_desc:1 "A pesar de su estirpe real, el historial de [CHARACTER.GetShortUINameNoTooltipNoFormat|U] está profundamente empañado por la embriaguez crónica y una escandalosa falta de templanza."
 
 nick_the_fair:0 "el Justo"
 nick_the_fair_desc:1 "Celebrado en el romance cortesano y en los anales reales, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es ampliamente reconocido por poseer una belleza y una gracia físicas extraordinarias."
 
 nick_the_fat:0 "el Gordo"
 nick_the_fat_desc:1 "Una descripción cruda y literal usada por los cronistas para registrar la inmensa corpulencia e inmovilidad física de [CHARACTER.GetShortUINameNoTooltipNoFormat|U]."
 
 nick_the_fearless:0 "el Intrépido"
 
 nick_the_fowler:0 "el Cazador de Aves"
 nick_the_fowler_desc:1 "Según la tradición, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] se ganó este título porque se le encontró colocando trampas para aves cuando se le informó de su ascenso al trono."
 
 nick_the_gentle:0 "el Gentil"
 nick_the_gentle_desc:1 "Un gobernante poco común que gobierna a través de la compasión antes que del terror, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es querido por su temperamento suave y misericordioso."
 
 nick_the_german:0 "el Alemán"
 nick_the_german_desc:1 "Un apelativo que vincula el legado político y cultural de [CHARACTER.GetShortUINameNoTooltipNoFormat|U] a las tierras al este del Rin."
 
 nick_the_german_post_mortem:0 "$nick_the_german$"
 nick_the_german_post_mortem_desc:1 "Un título póstumo, que reconoce a [CHARACTER.GetShortUINameNoTooltipNoFormat|U] como figura fundacional en el desarrollo de una identidad alemana diferenciada."
 
 nick_the_good:0 "el Bueno"
 nick_the_good_desc:1 "Recordado con cariño por sus leyes justas, sus bajos impuestos y un gobierno generalmente benevolente, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es universalmente estimado por sus súbditos."
 
 nick_the_gouty:0 "el Gotoso"
 nick_the_gouty_desc:1 "Aquejado por 'la enfermedad de los reyes', el reinado de [CHARACTER.GetShortUINameNoTooltipNoFormat|U] se ve interrumpido con frecuencia por un severo y debilitante dolor articular."
 
 nick_the_great:0 "el Grande"
 nick_the_great_desc:1 "Reservado para los monarcas más excepcionales, este título reconoce los logros sin igual de [CHARACTER.GetShortUINameNoTooltipNoFormat|U] en expansión, leyes y cultura."
 
 nick_the_hammer:0 "el Martillo"
 nick_the_hammer_desc:1 "Golpeando a sus enemigos con la fuerza devastadora e implacable de la herramienta de un herrero, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] destroza ejércitos enemigos."
 
 nick_the_handsome:0 "el Apuesto"
 nick_the_handsome_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] posee rasgos llamativos y regios, frecuentemente idealizados por poetas y comentados por dignatarios visitantes."
 
 nick_the_heathen:0 "el Pagano"
 nick_the_heathen_desc:1 "Plantándose en desafío a las religiones dominantes que avanzan, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] se aferra ferozmente a las antiguas costumbres tradicionales de sus ancestros."
 
 nick_the_heathen_rebel:0 "$nick_the_heathen$"
 nick_the_heathen_rebel_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] es infame por liderar un violento levantamiento reaccionario para restaurar a los viejos dioses y expulsar la nueva fe."
 
 nick_the_holy:0 "el Santo"
 nick_the_holy_desc:1 "La vida de [CHARACTER.GetShortUINameNoTooltipNoFormat|U] se caracteriza por una devoción religiosa y un ascetismo tan intensos que se le considera un recipiente viviente de lo divino."
 
 nick_the_hunchback:0 "el Jorobado"
 nick_the_hunchback_desc:1 "Una visible curvatura de la columna define la apariencia física de [CHARACTER.GetShortUINameNoTooltipNoFormat|U], lo que a menudo conduce a un prejuicio injusto en una época profundamente supersticiosa."
 
 nick_the_hunter:0 "el Cazador"
 nick_the_hunter_desc:1 "Sin igual a caballo y con el arco, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es célebre por su implacable pasión por la caza real."
 
 nick_the_ironside:0 "Costados de Hierro"
 nick_the_ironside_desc:1 "Ganándose una reputación de defensa impenetrable y resiliencia inquebrantable, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] se alza como un muro de hierro en el fragor de la batalla."
 
 nick_the_just:0 "el Justo"
 nick_the_just_desc:0 "Estimado por una aplicación estricta pero justa de la ley, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es recordado como un árbitro imparcial de disputas."
 
 nick_the_kind:0 "el Amable"
 nick_the_kind_desc:1 "Marcado por la filantropía y una inusual preocupación por el bienestar del pueblo llano, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] gobierna con mano blanda."
 
 nick_the_lame:0 "el Cojo"
 nick_the_lame_desc:1 "Ya sea por un defecto congénito o por una herida de guerra, el andar renqueante de [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es su rasgo físico más reconocido."
 
 nick_the_lawgiver:0 "el Legislador"
 nick_the_lawgiver_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] es inmortalizado como un monumental reformador legal, al haber codificado las dispares costumbres del reino en estatutos unificados."
 
 nick_the_liberator:0 "el Libertador"
 nick_the_liberator_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] alcanzó una fama eterna al expulsar a los ocupantes extranjeros y restaurar la soberanía de su pueblo."
 
 nick_the_lion:0 "el León"
 nick_the_lion_desc:1 "Feroz, orgulloso y dotado de una majestad regia, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] encarna las virtudes marciales del rey de las bestias."
 
 nick_the_lionheart:0 "Corazón de León"
 nick_the_lionheart_desc:1 "Un título legendario que reconoce la destreza marcial sin par, el coraje indomable y la reputación de [CHARACTER.GetShortUINameNoTooltipNoFormat|U] como el guerrero caballeresco por excelencia."
 
 nick_the_lisp_and_lame:0 "el Ceceoso y Cojo"
 nick_the_lisp_and_lame_desc:1 "Un doble epíteto históricamente cruel, que registra para la posteridad tanto el impedimento del habla como la discapacidad física de [CHARACTER.GetShortUINameNoTooltipNoFormat|U]."
 
 nick_the_magnificent:0 "el Magnífico"
 nick_the_magnificent_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] preside una corte de esplendor sin igual, patrocinando las artes y ejerciendo un inmenso poder geopolítico."
 
 nick_the_martyr:0 "el Mártir"
 nick_the_martyr_desc:1 "Habiendo sido asesinado por los enemigos de su fe o por rivales políticos, la muerte de [CHARACTER.GetShortUINameNoTooltipNoFormat|U] se ha convertido en un poderoso grito de guerra."
 
 nick_the_merry:0 "el Alegre"
 nick_the_merry_desc:1 "Célebre por su risa estrepitosa y una corte llena de banquetes y música, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] prefiere la alegría a las duras realidades del gobierno."
 
 nick_the_honorable:0 "el Honorable"
 nick_the_honorable_desc:1 "Reconocido no solo por su alta cuna, sino por un carácter definido por la caballerosidad, el honor y la virtud aristocrática."
 
 nick_the_monk:0 "el Monje"
 nick_the_monk_desc:1 "Prefiriendo el claustro a la corona, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] destaca por adoptar un estilo de vida ascético, llegando incluso a abdicar para tomar los hábitos."
 
 nick_the_noble:0 "el Noble"
 nick_the_noble_desc:1 "Reconocido por poseer un carácter definido por la caballerosidad, el honor y la virtud aristocrática que lo eleva por encima de sus pares."
 
 nick_the_old:0 "el Viejo"
 nick_the_old_desc:1 "Habiendo sobrevivido mucho más allá de la esperanza de vida de la época, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es visto como un venerable y perdurable patriarca."
 
 nick_the_pious:0 "el Pío"
 nick_the_pious_desc:1 "Profundamente comprometido con la iglesia y la observancia religiosa, el reinado de [CHARACTER.GetShortUINameNoTooltipNoFormat|U] está marcado por la construcción de iglesias y la reforma eclesiástica."
 
 nick_the_proud:0 "el Orgulloso"
 nick_the_proud_desc:1 "Portando un talante increíblemente altanero, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] exige una deferencia absoluta y considera su linaje superior a todos los demás."
 
 nick_the_quarreller:0 "el Pendenciero"
 nick_the_quarreller_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] es infame por una personalidad combativa y litigiosa, constantemente enredado en disputas con vasallos y reyes vecinos."
 
 nick_the_restorer:0 "el Restaurador"
 nick_the_restorer_desc:1 "Adentrándose en el vacío de un estado fracturado, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] reconstruyó con éxito las instituciones y fronteras de un reino antaño grande."
 
 nick_the_saint:0 "el Santo"
 nick_the_saint_desc:1 "Formalmente reconocido por las autoridades religiosas por una vida de milagros y suprema santidad, elevando su dinastía a un estatus sagrado."
 
 nick_the_scholar:0 "el Erudito"
 nick_the_scholar_desc:1 "Sumamente educado y mecenas del movimiento de traducción, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] se siente tan cómodo debatiendo teología como gobernando."
 
 nick_the_silent:0 "el Silencioso"
 nick_the_silent_desc:1 "Conocido por guardarse sus propias opiniones, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] usa la brevedad y el silencio como un arma política calculada."
 
 nick_the_stammerer:0 "el Tartamudo"
 nick_the_stammerer_desc:1 "Un grave impedimento del habla definió los discursos públicos de [CHARACTER.GetShortUINameNoTooltipNoFormat|U], una vulnerabilidad registrada sin piedad por los historiadores de la época."
 
 nick_the_strong:0 "el Fuerte"
 nick_the_strong_desc:1 "Célebre por su inmenso poder físico o por la innegable fuerza de su voluntad política, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] domina la época."
 
 nick_the_troubadour:0 "el Trovador"
 nick_the_troubadour_desc:1 "Mecenas del amor cortés y de la poesía lírica, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es célebre por sus propias composiciones y su sensibilidad artística."
 
 nick_the_unready:0 "el Desprevenido"
 nick_the_unready_desc:1 "Una traducción de 'Unræd' (Mal Consejo), que indica que el reinado de [CHARACTER.GetShortUINameNoTooltipNoFormat|U] estuvo plagado de malas decisiones y consejeros traicioneros."
 
 nick_the_unready_anglo_saxon:0 "$nick_the_unready$"
 nick_the_unready_anglo_saxon_desc:1 "Un trágico juego de palabras con su propio nombre; que significa 'Noble Consejo', pero universalmente recordado como 'Mal Consejo' debido a un gobierno desastroso."
 
 nick_the_usurper:0 "el Usurpador"
 nick_the_usurper_desc:1 "Una mancha oscura en su legado, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] se apoderó del trono ilegítimamente, rompiendo la sagrada línea de sucesión."
 
 nick_the_victorious:0 "el Victorioso"
 nick_the_victorious_desc:1 "Logrando una racha de triunfos militares ininterrumpidos, el nombre de [CHARACTER.GetShortUINameNoTooltipNoFormat|U] se ha vuelto sinónimo de éxito en el campo de batalla."
 
 nick_the_young:0 "el Joven"
 nick_the_young_desc:1 "Añadido en su temprana vida o para distinguirlo de un padre del mismo nombre, resaltando un reinado que comenzó en la minoría de edad."
 
 nick_the_younger:0 "el Joven"
 nick_the_younger_desc:2 "Un identificador genealógico usado por los historiadores para diferenciar a [CHARACTER.GetShortUINameNoTooltipNoFormat|U] de un pariente mayor y más prominente del mismo nombre exacto."
 
 nick_whiteshirt:0 "Camisa Blanca"
 nick_whiteshirt_desc:1 "Un epíteto de saga, que se cree hace referencia a que [CHARACTER.GetShortUINameNoTooltipNoFormat|U] vestía las prendas blancas de un bautismo reciente durante la batalla, o simplemente una túnica favorita."
 
 nick_the_bewitched:0 "el Hechizado"
 nick_the_bewitched_desc:1 "Aquejado de graves males físicos y mentales, sus contemporáneos creían genuinamente que [CHARACTER.GetShortUINameNoTooltipNoFormat|U] era víctima de una oscura brujería o de una maldición generacional."

 nick_the_shadow:0 "la Sombra"
 nick_the_shadow_desc:1 "Operando sin ser visto ni oído, sus contemporáneos creen que [CHARACTER.GetShortUINameNoTooltipNoFormat|U] gobierna el reino a través de una ineludible red de espías e informantes."
 
 nick_the_whisperer:0 "el Susurrador"
 nick_the_whisperer_desc:1 "Prefiriendo los rincones silenciosos de la cámara del consejo a la resonante acústica del gran salón, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] orquesta la política del estado en voz baja."
 
 nick_the_spider:0 "la Araña"
 nick_the_spider_desc:0 "Maestro de la diplomacia y el engaño, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] se sienta en el centro de una vasta red continental de intriga política y alianzas."
 
 nick_the_fox:0 "el Zorro"
 nick_the_fox_desc:1 "Célebre en las crónicas por su astuta agilidad política, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] supera a sus rivales mediante el engaño antes que la fuerza bruta."
 
 nick_the_shrewd:0 "el Astuto"
 nick_the_shrewd_desc:1 "Poseedor de una mente calculadora y un ojo agudo para la ventaja, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es reconocido como un formidable y pragmático operador político."
 
 nick_the_gracious:0 "el Gracioso"
 nick_the_gracious_desc:1 "Célebre por sus impecables modales cortesanos, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es anfitrión de una corte reconocida por su refinada etiqueta y hospitalidad."
 
 nick_the_magnanimous:0 "el Magnánimo"
 nick_the_magnanimous_desc:1 "Mostrando una generosidad de espíritu propia de la realeza, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es célebre por perdonar a enemigos derrotados y recompensar a servidores leales con una largueza sin igual."
 
 nick_the_architect:0 "el Arquitecto"
 nick_the_architect_desc:1 "Dejando un legado tallado en piedra, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es recordado como un visionario constructor de catedrales, fortalezas y grandes obras públicas."
 
 nick_the_wise:0 "el Sabio"
 nick_the_wise_desc:1 "Reverenciado en todo el mundo conocido por su profundo intelecto y su sagaz juicio, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] gobierna como un auténtico filósofo-[CHARACTER.GetTitleAsNameNoTooltip]."
 
 nick_the_impaler:0 "el Empalador"
 nick_the_impaler_desc:1 "Un mote aterrador ganado mediante la brutal guerra psicológica de exhibir a los enemigos ejecutados en estacas de madera para disuadir la traición y la invasión."
 
 nick_the_tormentor:0 "el Atormentador"
 nick_the_tormentor_desc:1 "Los cronistas registran el reinado de [CHARACTER.GetShortUINameNoTooltipNoFormat|U] como uno de crueldad y sufrimiento, marcado por el uso frecuente y creativo del calabozo y el potro de tortura."
 
 nick_the_wicked:0 "el Perverso"
 nick_the_wicked_desc:1 "Denunciado desde los púlpitos y registrado en los anales monásticos como un gobernante que desafió flagrantemente la ley moral y la decencia humana básica."
 
 nick_the_accursed:0 "el Maldito"
 nick_the_accursed_desc:1 "Visto por el clero y el pueblo llano como un paria, se cree que [CHARACTER.GetShortUINameNoTooltipNoFormat|U] sufre una maldición divina por [CharYourHerHis(CHARACTER)] pecados más graves."
 
 nick_priest_hater:0 "el Odiador de Sacerdotes"
 nick_priest_hater_desc:1 "Enzarzado en constantes y amargas luchas con el estamento eclesiástico, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es infame por apoderarse de tierras de la iglesia y desafiar al clero."
 
 nick_the_able:0 "el Capaz"
 nick_the_able_desc:1 "Un administrador sumamente competente y polifacético, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] aportó eficiencia y estabilidad a las instituciones del reino."
 
 nick_the_mad:0 "el Loco"
 nick_the_mad_desc:1 "Trágicamente aquejado de una grave inestabilidad mental, el reinado de [CHARACTER.GetShortUINameNoTooltipNoFormat|U] se vio empañado por periodos de delirio, incapacidad y regencia."
 
 nick_the_ruthless:0 "el Despiadado"
 nick_the_ruthless_desc:1 "Sin atarse a ideales caballerescos ni a la misericordia, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] ejecuta la política de estado con una brutalidad fría e implacable."
 
 nick_the_simple:0 "el Simple"
 nick_the_simple_desc:1 "Un gobernante directo y sin complicaciones, sus contemporáneos perciben a [CHARACTER.GetShortUINameNoTooltipNoFormat|U] como carente de la astucia y el intelecto esperados de un soberano."
 
 nick_half_hand:0 "Media Mano"
 nick_half_hand_desc:1 "Portando las cicatrices visibles de un enfrentamiento brutal, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] perdió una parte de [CharYourHerHis(CHARACTER)] mano, un testimonio permanente de su tiempo en el campo de batalla."
 
 nick_the_hideous:0 "el Espantoso"
 nick_the_hideous_desc:1 "Afligido por una grave desfiguración o desafortunados rasgos congénitos, la apariencia de [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es objeto de crueles burlas en cortes extranjeras."
 
 nick_the_frail:0 "el Frágil"
 nick_the_frail_desc:1 "Carente de la robusta constitución esperada de la nobleza, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] lucha constantemente contra la debilidad física y la mala salud."
 
 nick_the_weak:0 "el Débil"
 nick_the_weak_desc:1 "Visto como deficiente tanto en fuerza física como en voluntad política, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] tiene dificultades para proyectar la autoridad necesaria para controlar el reino."
 
 nick_the_brute:0 "el Bruto"
 nick_the_brute_desc:1 "Confiando por completo en la intimidación y la violencia física, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] gobierna con mano pesada y sin refinamiento."
 
 nick_the_bear:0 "el Oso"
 nick_the_bear_desc:1 "Poseedor de una corpulencia física inmensa y una ferocidad a la par, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es comparado con el depredador supremo de los bosques del norte."
 
 nick_the_terrible:0 "el Terrible"
 nick_the_terrible_desc:1 "Un título que denota un poder sobrecogedor y un reinado de terror, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] impone una obediencia absoluta y temblorosa en todos sus súbditos."
 
 nick_the_tyrant:0 "el Tirano"
 nick_the_tyrant_desc:1 "Gobernando a través del miedo, la extorsión y la suspensión arbitraria de las leyes tradicionales, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es despreciado como un déspota."
 
 nick_the_wolf:0 "el Lobo"
 nick_the_wolf_desc:1 "Feroz, depredador e implacable en la persecución de sus enemigos, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es visto como un oportunista peligroso y hambriento."
 
 nick_the_benevolent:0 "el Benevolente"
 nick_the_benevolent_desc:1 "Recordado como una figura paterna para el reino, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] impartió justicia con misericordia y se preocupó activamente por el bienestar del pueblo llano."
 
 nick_the_philosopher:0 "el Filósofo"
 nick_the_philosopher_desc:1 "Profundamente inmerso en el pensamiento clásico y el debate teológico, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] eleva el nivel intelectual de la corte real."
 
 nick_the_compassionate:0 "el Compasivo"
 nick_the_compassionate_desc:1 "Un soberano poco frecuente que busca genuinamente aliviar el sufrimiento, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es conocido por su amplia caridad y su naturaleza indulgente."
 
 nick_the_theologian:0 "el Teólogo"
 nick_the_theologian_desc:0 "Poseedor de una mente entregada a los misterios divinos, es tan probable que [CHARACTER.GetShortUINameNoTooltipNoFormat|U] escriba un tratado religioso como un decreto real."
 
 nick_the_enlightened:0 "el Iluminado"
 nick_the_enlightened_desc:0 "Abrazando nuevas ideas, reformas legales y el mecenazgo de eruditos, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es un faro de progreso intelectual."
 
 nick_the_stalwart:0 "el Fornido"
 nick_the_stalwart_desc:1 "Inquebrantable ante la crisis, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] proporciona una base de fiabilidad y coraje para todo el reino."
 
 nick_the_merciless:0 "el Despiadado"
 nick_the_merciless_desc:1 "Negándose a dar cuartel o aceptar rescates, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] hace la guerra con una finalidad absoluta y total."
 
 nick_the_imperious:0 "el Imperioso"
 nick_the_imperious_desc:1 "Comportándose con una arrogancia abrumadora y exigiendo una sumisión total, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] espera obediencia instantánea."
 
 nick_the_poet:0 "el Poeta"
 nick_the_poet_desc:1 "Célebre por componer versos elegantes y patrocinar las artes literarias, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] aporta refinamiento cultural al trono."
 
 nick_the_flayer:0 "el Despellejador"
 nick_the_flayer_desc:1 "Un epíteto grotesco ganado al recurrir al horrible castigo de la excoriación, desollando enemigos como sangrienta advertencia para los traidores."
 
 nick_the_meticulous:0 "el Meticuloso"
 nick_the_meticulous_desc:1 "Obsesionado con el detalle, la contabilidad y la formulación legal exacta, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] supervisa cada mínimo aspecto de la administración del estado."
 
 nick_the_foolish:0 "el Necio"
 nick_the_foolish_desc:1 "Los cronistas lamentan las decisiones desastrosas y mal concebidas que definieron el trágicamente inepto gobierno de [CHARACTER.GetShortUINameNoTooltipNoFormat|U]."
 
 nick_the_gullible: "el Crédulo"
 nick_the_gullible_desc: "Fácilmente influenciable por aduladores y falsas promesas, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es manipulado con frecuencia por cortesanos más astutos."
 
 nick_the_undefeated:0 "el Invicto"
 nick_the_undefeated_desc:1 "Habiendo comandado ejércitos en numerosas campañas sin sufrir una sola derrota, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] ostenta un historial militar impecable."
 
 nick_the_triumphant:0 "el Triunfante"
 nick_the_triumphant_desc:1 "Regresando de campañas extranjeras cargado de gloria y botín, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es celebrado con grandes procesiones al estilo romano."
 
 nick_the_fury:0 "la Furia"
 nick_the_fury_desc:1 "Golpeando como una fuerza de la naturaleza, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] hace la guerra con una ira implacable y cegadora que destroza las líneas enemigas."
 
 nick_the_hawk:0 "el Halcón"
 nick_the_hawk_desc:1 "Poseedor de una mirada depredadora y una política exterior ferozmente agresiva, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] siempre está listo para atacar ante el menor signo de debilidad."
 
 nick_the_trustworthy:0 "el de Confianza"
 nick_the_trustworthy_desc:1 "Un individuo poco frecuente en el mundo de la política feudal, se reconoce universalmente a [CHARACTER.GetShortUINameNoTooltipNoFormat|U] como un gobernante que honra sus juramentos."
 
 nick_the_unrelenting:0 "el Implacable"
 nick_the_unrelenting_desc:1 "Mostrando una voluntad de hierro, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] se niega a abandonar un asedio o un objetivo político, sin importar el tiempo o el coste requeridos."
 
 nick_the_glorious:0 "el Glorioso"
 nick_the_glorious_desc:1 "Envuelto en la majestad de conquistas exitosas y de un florecimiento cultural, el reinado de [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es considerado una edad de oro."
 
 nick_the_ecumenist:0 "el Ecumenista"
 nick_the_ecumenist_desc:1 "Dedicado a tender puentes sobre las divisiones teológicas de la época, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] trabaja incansablemente por reconciliar instituciones religiosas fracturadas."
 
 nick_the_unifier_of_africa:0 "el Unificador de África"
 nick_the_unifier_of_africa_desc:1 "Logrando un hito geopolítico sin precedentes, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] consiguió reunir los dispares reinos del continente bajo una única hegemonía."
 
 nick_the_motherfather_of_spain:0 "el [CHARACTER.GetMotherFather|U] de España"
 nick_the_motherfather_of_spain_desc:1 "Mediante calculados matrimonios dinásticos y conquistas, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] sentó las bases fundacionales de un estado ibérico unificado."
 
 nick_the_ladylord_of_the_ganges:0 "el [CHARACTER.GetLadyLord|U] del Ganges"
 nick_the_ladylord_of_the_ganges_desc:1 "Reclamando dominio sobre el río sagrado, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] afirma tanto un inmenso poder temporal como una profunda autoridad espiritual."
 
 nick_the_wend:0 "el Wendo"
 nick_the_wend_desc:1 "Reconocido por consolidar a las tribus eslavas occidentales, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] forjó un reino poderoso capaz de resistir el avance extranjero."
 
 nick_the_crowned:0 "el Coronado"
 nick_the_crowned_desc:1 "Marcando la transición de caudillo tribal a monarca legítimo y sancionado divinamente, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] fue el primero en aceptar una coronación formal."
 
 nick_the_bogatyr:0 "el Bogatyr"
 nick_the_bogatyr_desc:1 "Comparado con los legendarios héroes errantes de la poesía épica eslava, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es célebre por su inmensa fuerza y sus hazañas caballerescas."
 
 nick_the_polyanitsa:0 "la Polyanitsa"
 nick_the_polyanitsa_desc:0 "Comparada con las legendarias guerreras de la poesía épica eslava, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] se gana el respeto tanto en el campo de batalla como en el salón."
 
 nick_the_dane:0 "el Danés"
 nick_the_dane_desc:1 "Un apelativo que marca los orígenes escandinavos de [CHARACTER.GetShortUINameNoTooltipNoFormat|U], vinculando su gobierno al formidable legado de los nórdicos."
 
 nick_pendragon:0 "Pendragón"
 nick_pendragon_desc:1 "Invocando el antiguo y mítico título de los britanos, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] reclama el manto de la alta realeza sobre las Islas."
 
 nick_the_tuatha_de_danann:0 "los Tuatha Dé Danann"
 nick_the_tuatha_de_danann_desc:1 "Apoyándose en la herencia mística de la antigua Irlanda, el pueblo gaélico ve a [CHARACTER.GetShortUINameNoTooltipNoFormat|U] con una reverencia casi sobrenatural."
 
 nick_the_sword_of_god:0 "la Espada de Dios"
 nick_the_sword_of_god_desc:1 "Considerándose un instrumento de la ira divina, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] libra una guerra santa para forjar el Reino de los Cielos en la tierra."
 
 nick_the_messenger_of_christ:0 "el Mensajero de Cristo"
 nick_the_messenger_of_christ_desc:1 "Celebrado por la Iglesia como portador del evangelio, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] expandió la fe a través de la cruzada y la conversión."
 
 nick_the_maiden_of_virgin:0 "la Doncella de la Virgen"
 nick_the_maiden_of_virgin_desc:1 "Venerado por una vida ascética y un estricto voto de castidad, se considera a [CHARACTER.GetShortUINameNoTooltipNoFormat|U] bajo la protección directa de la Madre de Dios."
 
 nick_the_knight_of_gabriel:0 "el Caballero de Gabriel"
 nick_the_knight_of_gabriel_desc:1 "Luchando con un fervor que se cree inspirado por el Arcángel, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] se erige como campeón preeminente de la Tierra Santa."
 
 nick_the_shepherd:0 "el Pastor"
 nick_the_shepherd_desc:1 "Encarnando el ideal bíblico del gobierno, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] guía y protege al rebaño de sus súbditos con mirada vigilante."
 
 nick_the_judge:0 "el Juez"
 nick_the_judge_desc:1 "Evocando a los antiguos líderes de Israel, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es célebre por emitir veredictos legales sabios y decisivos que estabilizaron el reino."
 
 nick_the_saoshyant:0 "el Saoshyant"
 nick_the_saoshyant_desc:1 "Aclamado como el salvador profetizado del zoroastrismo, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] ha restaurado los Fuegos Sagrados y desterrado la oscuridad."
 
 nick_the_timely_rain:0 "la Lluvia Oportuna"
 nick_the_timely_rain_desc:1 "Un honorífico poético que significa que las acciones benevolentes y los esfuerzos de socorro de [CHARACTER.GetShortUINameNoTooltipNoFormat|U] llegaron exactamente cuando el pueblo más los necesitaba."
 
 nick_the_thunderbolt:0 "el Rayo"
 nick_the_thunderbolt_desc:1 "Moviendo ejércitos con una velocidad asombrosa, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] destroza las formaciones enemigas antes de que estas se percaten siquiera de estar bajo ataque."
 
 nick_the_whirlwind:0 "el Torbellino"
 nick_the_whirlwind_desc:1 "Una fuerza caótica y destructiva en el campo de batalla, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] arrasa con la oposición mediante ofensivas abrumadoras y rápidas."
 
 nick_the_beautiful_beard:0 "el de la Hermosa Barba"
 nick_the_beautiful_beard_desc:1 "Señalado por los cronistas por lucir una barba excepcionalmente larga y bien cuidada, un poderoso símbolo de autoridad masculina en la era medieval."
 
 nick_the_tattooed_monk:0 "el Monje Tatuado"
 nick_the_tattooed_monk_desc:1 "Portando tinta permanente junto a votos religiosos, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] combina la tradición marcial con un ascetismo estricto y esotérico."
 
 nick_the_pilgrim:0 "el Peregrino"
 nick_the_pilgrim_desc:1 "Habiendo emprendido un largo y peligroso viaje a los lugares santos de su fe, a [CHARACTER.GetShortUINameNoTooltipNoFormat|U] se le concede un profundo respeto espiritual."
 
 nick_the_black_whirlwind:0 "el Torbellino Negro"
 nick_the_black_whirlwind_desc:1 "Una figura aterradora en combate, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] cae sobre los enemigos con armadura oscura y una ferocidad imparable y frenética."
 
 nick_the_unrestrained:0 "el Desenfrenado"
 nick_the_unrestrained_desc:1 "Negándose a atarse a la convención social o a la ley feudal, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] actúa enteramente según sus propios y volátiles impulsos."
 
 nick_the_wild:0 "el Salvaje"
 nick_the_wild_desc:0 "Prefiriendo los bosques indómitos a la sofocante corte, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] posee un espíritu desatado y ferozmente independiente."
 
 nick_the_ferocious_giant:0 "el Gigante Feroz"
 nick_the_ferocious_giant_desc:1 "Combinando una estatura física inmensa con un carácter aterrador, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] domina tanto el campo de batalla como la cámara del consejo."
 
 nick_the_prodigy:0 "el Prodigio"
 nick_the_prodigy_desc:1 "Mostrando un intelecto genial desde una edad notablemente temprana, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] domina temas complejos con una gracia sin esfuerzo."
 
 nick_the_defender_of_highgod:0 "el Defensor de [CHARACTER.GetFaith.HighGodName]"
 nick_the_defender_of_highgod_desc:1 "Reconocido por las autoridades religiosas como el principal protector marcial de la fe frente a la herejía y los paganos que avanzan."
 
 nick_the_divine:0 "el Divino"
 nick_the_divine_desc:1 "Venerado por sus súbditos hasta tal punto que el reinado de [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es visto como una manifestación terrenal de la voluntad celestial."
 
 nick_the_anointed:0 "el Ungido"
 
 nick_the_stupor_mundi:0 "Stupor Mundi"
 nick_the_stupor_mundi_desc:1 "Aclamado por los cronistas como la 'Maravilla del Mundo', [CHARACTER.GetShortUINameNoTooltipNoFormat|U] asombra a sus contemporáneos con su genio polímata y su gobierno poco ortodoxo."
 
 nick_the_trojan:0 "el Troyano"
 nick_the_trojan_desc:1 "Invocando la antigüedad clásica de la Eneida, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] reclama descender de los legendarios héroes de Troya para legitimar su dinastía."
 
 nick_the_butcher:0 "el Carnicero"
 nick_the_butcher_desc:0 "Un epíteto horrendo ganado tras ordenar la matanza masiva de prisioneros o civiles, manchando para siempre de sangre el legado de [CHARACTER.GetShortUINameNoTooltipNoFormat|U]."
 
 nick_the_loyal:0 "el Leal"
 nick_the_loyal_desc:1 "En una época de traiciones constantes y lealtades cambiantes, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] destaca por su fidelidad inquebrantable a su señor y a sus juramentos."
 
 nick_troublemaker:0 "el Alborotador"
 nick_troublemaker_desc:1 "Agitando constantemente contra la autoridad e instigando disputas faccionales, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es una espina persistente en el costado de la corona."
 
 nick_the_timid:0 "el Tímido"
 nick_the_timid_desc:1 "Carente de la firmeza necesaria para gobernar, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] evita el conflicto y capitula con frecuencia ante exigencias agresivas."
 
 nick_the_red:0 "el Rojo"
 nick_the_red_desc:1 "Identificado universalmente por su llamativo cabello carmesí, un rasgo físico que se ha convertido en el marcador visual definitorio de su linaje."
 
 nick_the_truthspeaker:0 "el que Habla con la Verdad"
 nick_the_truthspeaker_desc:1 "Negándose a participar en la adulación cortesana, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es respetado —y a veces temido— por su honestidad absoluta e intransigente."
 
 nick_the_curthose:0 "Curthose"
 nick_the_curthose_desc:1 "Que significa 'Botas Cortas', este apodo burlón se le dio en la infancia y persistió obstinadamente durante toda la vida adulta y las campañas de [CHARACTER.GetShortUINameNoTooltipNoFormat|U]."
 
 nick_the_deep_minded:0 "el de Mente Profunda"
 nick_the_deep_minded_desc:1 "Reverenciado en las sagas por su profunda sabiduría, previsión y un enfoque estoico y calculador del liderazgo."
 
 nick_the_white:0 "el Blanco"
 nick_the_white_desc:1 "Un mote descriptivo que se refiere a la tez pálida, el cabello claro o la reputación de pureza inmaculada de [CHARACTER.GetShortUINameNoTooltipNoFormat|U]."
 
 nick_wang_khan:0 "Wang Kan"
 nick_wang_khan_desc:1 "Un prestigioso título sino-mongol que se traduce como 'Kan Rey', reconociendo la supremacía de [CHARACTER.GetShortUINameNoTooltipNoFormat|U] sobre las estepas orientales."
 
 nick_the_bard:0 "el Bardo"
 nick_the_bard_desc:1 "Maestro del arpa y de la palabra hablada, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] patrocina las tradiciones orales y compone sus propias epopeyas."
 
 nick_the_bard_ironic:0 "$nick_the_bard$"
 nick_the_bard_ironic_desc:1 "Un título irónico otorgado a un gobernante cuyos intentos de poesía y canto son notoria y agonizantemente malos."
 
 nick_hotspur:0 "Audaz"
 nick_hotspur_desc:1 "Ganándose este título por una naturaleza célebremente inquieta y agresiva, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] siempre está deseoso de cabalgar hacia la guerra sin previo aviso."
 
 nick_the_inevitable:0 "el Inevitable"
 nick_the_inevitable_desc:1 "Poseedor de un ímpetu aterrador, los reinos vecinos consideran ampliamente que resistirse a [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es, en última instancia, inútil."
 
 nick_the_plump:0 "el Rechoncho"
 nick_the_plump_desc:1 "Un epíteto suave y descriptivo que señala la generosa complexión de [CHARACTER.GetShortUINameNoTooltipNoFormat|U], una señal de riqueza y paz prolongada en el reino."
 
 
 nick_bloody:0 "Sangriento"
 nick_bloody_desc:1 "Un identificador crudo y horrible para un gobernante que se ha abierto paso entre la sangre de ejecuciones y masacres para asegurar el trono."
 
 nick_the_oathbreaker:0 "el Rompejuramentos"
 nick_the_oathbreaker_desc:0 "Culpable del mayor pecado medieval, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] violó votos sagrados, dejando su honor por siempre invalidado a ojos de sus pares."
 
 nick_little:0 "Pequeño"
 nick_little_desc:1 "Un identificador diminutivo, usado a menudo para distinguir a [CHARACTER.GetShortUINameNoTooltipNoFormat|U] de un padre más alto o de un hermano mayor del mismo nombre."
 
 nick_the_honest:0 "el Honesto"
 nick_the_honest_desc:1 "Manteniendo una reputación de cumplir su palabra, se confía plenamente en [CHARACTER.GetShortUINameNoTooltipNoFormat|U] en las negociaciones diplomáticas."
 
 nick_the_passionate:0 "el Apasionado"
 nick_the_passionate_desc:1 "Impulsado por una emoción intensa y un fervor apasionado, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] afronta tanto el amor como la guerra con una intensidad desenfrenada."
 
 nick_one_eyed:0 "Tuerto"
 nick_one_eyed_desc:0 "Portando la marca de una batalla brutal o un desafortunado accidente, la falta de un ojo de [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es un crudo testimonio de su supervivencia."
 
 nick_the_trembling:0 "el Tembloroso"
 nick_the_trembling_desc:1 "Ya sea aquejado de una parálisis nerviosa o simplemente célebre por su profunda cobardía, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] tiene dificultades para proyectar fortaleza."
 
 nick_the_rash:0 "el Temerario"
 nick_the_rash_desc:1 "Rápido para enojarse y más rápido aún para actuar, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] lanza con frecuencia campañas desastrosas sin detenerse a pedir consejo."
 
 nick_the_elegant:0 "el Elegante"
 nick_the_elegant_desc:0 "Marcando la pauta de la moda cortesana y los modales refinados, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es el epítome de la sofisticación aristocrática."
 
 nick_the_eager:0 "el Entusiasta"
 nick_the_eager_desc:1 "Poseedor de un entusiasmo juvenil, a veces ingenuo, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] afronta el gobierno con una energía desbordante e inquieta."
 
 nick_the_insane:0 "el Demente"
 nick_the_insane_desc:1 "Perdido en la oscuridad de una mente fracturada, los decretos de [CHARACTER.GetShortUINameNoTooltipNoFormat|U] son erráticos, incomprensibles y a menudo peligrosos."
 
 nick_the_quick:0 "el Veloz"
 nick_the_quick_desc:0 "Poseedor de reflejos fulgurantes y un ingenio afilado como una navaja, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] rara vez es tomado por sorpresa."
 
 nick_the_quick_ironic:0 "$nick_the_quick$"
 nick_the_quick_ironic_desc:1 "Un título burlón otorgado a un gobernante notorio por su lenta toma de decisiones y su porte físico letárgico."
 
 nick_the_selfish:0 "el Egoísta"
 nick_the_selfish_desc:1 "Gobernando únicamente para su propio enriquecimiento, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] ignora la difícil situación del pueblo llano y el consejo de los estamentos."
 
 nick_the_worthy:0 "el Digno"
 nick_the_worthy_desc:1 "Demostrando su valía a través de hazañas y un carácter excepcionales, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es universalmente aceptado como merecedor de la corona."
 
 nick_the_unworthy:0 "el Indigno"
 nick_the_unworthy_desc:0 "Fallando en cada prueba de liderazgo, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] ha demostrado ser un guardián desastroso de su herencia dinástica."
 
 nick_the_traitor:0 "el Traidor"
 nick_the_traitor_desc:1 "Habiendo traicionado a su señor feudal en un momento de crisis, el nombre de [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es sinónimo de perfidia."
 
 nick_the_courageous:0 "el Valeroso"
 nick_the_courageous_desc:1 "Sin flaquear jamás ante el peligro, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] inspira a las tropas encabezando las cargas en lo más reñido del combate."
 
 nick_the_brilliant:0 "el Brillante"
 nick_the_brilliant_desc:1 "Dotado de un intelecto sin igual, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] supera con facilidad a sus rivales tanto en la diplomacia como en la estrategia militar."
 
 nick_the_generous:0 "el Generoso"
 nick_the_generous_desc:1 "Célebre por su generosa caridad y por colmar de regalos a sus vasallos, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] asegura la lealtad a través de la pura munificencia."
 
 nick_the_diplomat:0 "el Diplomático"
 nick_the_diplomat_desc:1 "Un maestro del arte de gobernar, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] resuelve mediante tratados y matrimonios lo que otros no lograrían con espadas."
 
 nick_the_peacemaker:0 "el Pacificador"
 nick_the_peacemaker_desc:0 "Poniendo fin a décadas de derramamiento de sangre, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] medió con éxito en disputas de larga data para traer estabilidad al reino."
 
 nick_the_tactician:0 "el Táctico"
 nick_the_tactician_desc:0 "Poseedor de una comprensión brillante del terreno y del movimiento de tropas, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] supera constantemente en astucia a los comandantes enemigos en el campo de batalla."
 
 nick_the_overseer:0 "el Supervisor"
 nick_the_overseer_desc:1 "Manteniendo un control estricto e inquebrantable sobre la administración del reino, nada escapa a la mirada burocrática de [CHARACTER.GetShortUINameNoTooltipNoFormat|U]."
 
 nick_the_guardian:0 "el Guardián"
 nick_the_guardian_desc:1 "Habiendo hecho un voto solemne de proteger a los débiles y defender las fronteras, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] actúa como el escudo inquebrantable del reino."
 
 nick_the_chivalrous:0 "el Caballeroso"
 nick_the_chivalrous_desc:1 "Encarnando los más altos ideales de la caballería, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es célebre por su honor, destreza marcial y gracia cortesana."
 
 nick_the_valiant:0 "el Valiente"
 nick_the_valiant_desc:0 "Ganándose la gloria en el crisol del combate, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es celebrado en canciones como un guerrero intrépido y sumamente capaz."
 
 nick_the_deceiver:0 "el Embaucador"
 nick_the_deceiver_desc:0 "Confiando en el espionaje, las treguas rotas y las copas envenenadas, no se puede confiar en [CHARACTER.GetShortUINameNoTooltipNoFormat|U] en ninguna negociación."
 
 nick_the_crow:0 "el Cuervo"
 nick_the_crow_desc:1 "Asociado con campos de batalla y malos augurios, los enemigos de [CHARACTER.GetShortUINameNoTooltipNoFormat|U] lo ven como un oscuro carroñero oportunista."
 
 nick_the_trickster:0 "el Embaucador"
 nick_the_trickster_desc:1 "Utilizando la confusión y tácticas poco convencionales, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] disfruta desconcertando a sus enemigos y saltándose las reglas del combate."
 
 nick_the_chronicler:0 "el Cronista"
 nick_the_chronicler_desc:1 "Dedicado a la preservación de la historia, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] supervisa personalmente el registro de los anales y genealogías del reino."
 
 nick_the_truthseeker:0 "el Buscador de la Verdad"
 nick_the_truthseeker_desc:1 "Obsesionado con la justicia y la pureza teológica, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] investiga sin descanso la corrupción y la herejía dentro del reino."
 
 nick_the_sage:0 "el Sabio"
 nick_the_sage_desc:1 "Poseedor de un aura de sabiduría ancestral, dignatarios extranjeros buscan con frecuencia a [CHARACTER.GetShortUINameNoTooltipNoFormat|U] para pedir consejo y mediación."
 
 nick_the_historian:0 "el Historiador"
 nick_the_historian_desc:0 "Mirando al pasado para gobernar el futuro, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] se apoya en las lecciones de la antigüedad para guiar la política del estado."
 
 nick_the_sly:0 "el Astuto"
 nick_the_sly_desc:0 "Operando con una astucia discreta y poco llamativa, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] manipula las facciones de la corte sin despertar jamás sospechas."
 
 nick_the_peaceful:0 "el Pacífico"
 nick_the_peaceful_desc:0 "Negándose a desenvainar la espada salvo en la más extrema defensa, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] ha presidido una rara era de tranquilidad total."
 
 nick_the_whetstone:0 "la Piedra de Afilar"
 nick_the_whetstone_desc:1 "Un epíteto que indica que [CHARACTER.GetShortUINameNoTooltipNoFormat|U], aunque quizá poco glamuroso, afila las habilidades y las armas de quienes lo rodean."
 
 nick_the_slayer_of_the_snake:0 "el Matador de la Serpiente"
 nick_the_slayer_of_the_snake_desc:1 "Un título mítico ligado a la fundación legendaria de los estados hausa, que honra al héroe que mató a la gran serpiente para asegurar el futuro del reino."
 
 nick_the_illuminator:0 "el Iluminador"
 nick_the_illuminator_desc:1 "Reverenciado como fundador de la iglesia nacional, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] trajo la luz de la verdadera fe a un reino antes pagano."
 
 nick_the_builder:0 "el Constructor"
 nick_the_builder_desc:1 "Dejando una huella permanente en el paisaje, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] patrocinó la construcción de grandes ciudades, murallas y monumentos duraderos."
 
 nick_the_martyrophile:0 "el Amante de Mártires"
 nick_the_martyrophile_desc:1 "Devoto del culto a los santos, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] gasta vastas fortunas coleccionando reliquias y documentando los sufrimientos de los fieles."
 
 nick_the_campeador:0 "el Campeador"
 nick_the_campeador_desc:1 "Que se traduce como 'Señor del Campo de Batalla', este ilustre título se reserva para un campeón invicto de virtud marcial sin igual."
 
 nick_the_missionary:0 "el Misionero"
 nick_the_missionary_desc:1 "Viajando mucho más allá de la seguridad del reino, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] dedicó su vida a predicar el evangelio en naciones hostiles."
 
 nick_the_hotspur:0 "el Fogoso"
 nick_the_hotspur_desc:1 "Célebre por su velocidad cegadora y un afán temerario por el combate, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] siempre es el primero en la refriega."
 
 nick_the_vanquisher:0 "el Vencedor"
 nick_the_vanquisher_desc:1 "Habiendo aplastado por completo una gran rebelión o una invasión extranjera, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] se erige como el amo indiscutible del reino."
 
 nick_the_bloody:0 "el Sangriento"
 nick_the_bloody_desc:1 "Un apelativo siniestro para un monarca cuyo reinado se caracteriza por purgas brutales, ejecuciones masivas y una guerra sin fin."
 
 nick_the_shy:0 "el Tímido"
 nick_the_shy_desc:1 "Evitando la mirada pública y las exigencias del boato cortesano, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] gobierna como un auténtico recluso."
 
 nick_the_giant:0 "el Gigante"
 nick_the_giant_desc:1 "Sobresaliendo entre sus contemporáneos, las inmensas proporciones físicas de [CHARACTER.GetShortUINameNoTooltipNoFormat|U] lo convierten en una figura aterradora en el combate cuerpo a cuerpo."
 
 nick_the_little:0 "el Pequeño"
 nick_the_little_desc:1 "Un descriptor físico directo, usado a menudo para diferenciar a [CHARACTER.GetShortUINameNoTooltipNoFormat|U] de un predecesor de mayor estatura."
 
 nick_the_one_eyed:0 "el Tuerto"
 nick_the_one_eyed_desc:0 "Portando cicatrices permanentes de combate, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] perdió un ojo al servicio del reino, sumando a su temible reputación."
 
 nick_the_oppressor:0 "el Opresor"
 nick_the_oppressor_desc:1 "Imponiendo impuestos aplastantes y despojando a los vasallos de derechos ancestrales, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es universalmente odiado por el pueblo."
 
 nick_the_apostate:0 "el Apóstata"
 nick_the_apostate_desc:1 "Cometiendo la traición religiosa definitiva, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] renunció públicamente a la fe de [CharYourHerHis(CHARACTER)] bautismo en favor de otra."
 
 nick_the_pagan:0 "el Pagano"
 nick_the_pagan_desc:1 "Aferrándose obstinadamente a los viejos dioses en una era de conversión, la iglesia organizada ve a [CHARACTER.GetShortUINameNoTooltipNoFormat|U] como una peligrosa reliquia."
 
 nick_the_heretic:0 "el Hereje"
 nick_the_heretic_desc:1 "Abrazando doctrinas teológicas condenadas por las autoridades religiosas, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] se expone a la excomunión y a la guerra santa."
 
 nick_the_savage:0 "el Salvaje"
 nick_the_savage_desc:1 "Luchando sin honor ni contención, las cortes 'civilizadas' ven a [CHARACTER.GetShortUINameNoTooltipNoFormat|U] como un bárbaro brutal y sediento de sangre."
 
 nick_the_defiant:0 "el Desafiante"
 nick_the_defiant_desc:1 "Negándose a ceder ante fuerzas abrumadoramente superiores o ante bulas papales, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] se planta solo frente al mundo."
 
 nick_the_sea_king:1 "el [CHARACTER.Custom('GetQueenKing')|U] del Mar"
 nick_the_sea_king_desc:1 "Comandando vastas flotas y dominando las rutas comerciales marítimas, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] gobierna las olas con la misma seguridad que la tierra."
 
 nick_the_great_and_terrible:0 "el Grande y Terrible"
 nick_the_great_and_terrible_desc:1 "Un doble epíteto que reconoce que los monumentales logros de [CHARACTER.GetShortUINameNoTooltipNoFormat|U] se pagaron con una brutalidad aterradora."
 
 nick_the_stonefaced:0 "el de Rostro de Piedra"
 nick_the_stonefaced_desc:0 "Sin traicionar jamás sus emociones, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] mantiene un rostro frío y estoico incluso ante el triunfo absoluto o el desastre."
 
 nick_the_dry:0 "el Seco"
 nick_the_dry_desc:1 "Carente del carisma y la calidez esperados de un monarca, la corte de [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es notoriamente carente de alegría."
 
 nick_the_joyless:0 "el Alegre"
 nick_the_joyless_desc:1 "Abordando los asuntos de estado con una severidad sombría e intransigente, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] no tolera ninguna frivolidad."
 
 nick_the_dull:0 "el Sieso"
 nick_the_dull_desc:1 "Nada inspirador en el discurso, poco creativo en la táctica y completamente anodino en apariencia, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es un gobernante profundamente olvidable."
 
 nick_the_bane_of_danes:0 "el Azote de los Daneses"
 nick_the_bane_of_danes_desc:1 "Ganándose fama legendaria por detener con éxito las incursiones vikingas, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] destruyó el aura de invencibilidad nórdica."
 
 nick_the_culture_wall:0 "el Muro [CHARACTER.GetCulture.GetNameNoTooltip]"
 nick_the_culture_wall_desc:1 "Erigiéndose como un baluarte infranqueable contra la invasión extranjera, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] protegió por sí solo a su cultura de la aniquilación."
 
 nick_nord_foe:0 "Enemigo del Norte"
 nick_nord_foe_desc:1 "Dedicando su reinado a la erradicación de los saqueadores del norte, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es temido en toda Escandinavia."
 
 nick_the_scourge_of_the_northerners:0 "el Azote de los Norteños"
 nick_the_scourge_of_the_northerners_desc:1 "Llevando fuego y espada a las tierras natales de los saqueadores, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] cobró una venganza terrible y sangrienta."
 
 nick_gajapati:0 "Gajapati"
 nick_gajapati_desc:1 "Que se traduce como 'Señor de los Elefantes', este prestigioso título indio denota el inmenso poder militar y la riqueza real de [CHARACTER.GetShortUINameNoTooltipNoFormat|U]."
 
 nick_the_transcriber:0 "el Transcriptor"
 nick_the_transcriber_desc:0 "Dedicando recursos reales a la copia y preservación de textos antiguos, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] impulsó un renacimiento del saber."
 
 nick_of_clairvaux:0 "de Claraval"
 nick_of_clairvaux_desc:1 "Identificado por su profunda asociación con la influyente abadía cisterciense, moldeando el panorama espiritual de la época."
 
 nick_father_of_the_baltic:0 "Padre del Báltico"
 nick_father_of_the_baltic_desc:1 "A través de la cruzada y la colonización, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] estableció firmemente las instituciones del estado y la iglesia en las costas del Báltico."
 
 nick_mother_of_the_baltic:0 "Madre del Báltico"
 nick_mother_of_the_baltic_desc:0 "A través de la cruzada y la colonización, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] estableció firmemente las instituciones del estado y la iglesia en las costas del Báltico."
 
 nick_scourge_of_the_baltic:0 "Azote del Báltico"
 nick_scourge_of_the_baltic_desc:1 "Librando una guerra santa implacable y devastadora contra los paganos bálticos, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] forzó la conversión a espada."
 
 nick_the_mountain_king:0 "el Rey de la Montaña"
 nick_the_mountain_king_desc:1 "Gobernando desde inexpugnables fortalezas alpinas, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] ejerce un control absoluto sobre los pasos y valles de altura."
 
 nick_beth_nahrain:0 "Soberano de los Dos Ríos"
 nick_beth_nahrain_desc:0 "Reclamando el antiguo legado de Mesopotamia, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] gobierna las fértiles y históricas tierras entre el Tigris y el Éufrates."
 
 nick_the_anathema:0 "el Anatema"
 nick_the_anathema_desc:1 "Formalmente excomulgado y expulsado de la comunión de los fieles, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es rechazado tanto legal como espiritualmente."
 
 nick_the_angel_of_death:1 "el Ángel de [CHARACTER.GetFaith.DeathDeityName|U]"
 nick_the_angel_of_death_desc:1 "Visto como el verdugo definitivo, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] deja un rastro de cadáveres tan vasto que se le compara con un segador divino."
 
 nick_monophthalmos:0 "Monoftalmos"
 nick_monophthalmos_desc:1 "Que significa 'El Tuerto' en griego, este epíteto clásico honra el sacrificio visible que [CHARACTER.GetShortUINameNoTooltipNoFormat|U] hizo en el campo de batalla."
 
 nick_health_god_mercy:0 "Misericordia de [CHARACTER.GetFaith.HealthGodNamePossessive|U]"
 nick_health_god_mercy_desc:1 "Célebre por financiar hospitales y atender personalmente a los enfermos, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es visto como una extensión terrenal de la sanación divina."
 
 nick_genghis_khan:0 "Gengis Kan"
 nick_genghis_khan_desc:1 "El 'Gobernante Universal'. [CHARACTER.GetShortUINameNoTooltipNoFormat|U] ha unido la estepa y desatado una tormenta de conquista que alterará para siempre la historia del mundo."
 
 nick_cengiz_khan:0 "Cengiz Kan"
 nick_cengiz_khan_desc:0 "El 'Gobernante Universal'. [CHARACTER.GetShortUINameNoTooltipNoFormat|U] ha unido la estepa y desatado una tormenta de conquista que alterará para siempre la historia del mundo."
 
 nick_yekhe_khagan:0 "Kagán yekhe"
 nick_yekhe_khagan_desc:0 "El 'Gran Kan'. Reclamando la supremacía absoluta sobre todos los pueblos nómadas, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] ostenta la más alta autoridad en la estepa."
 
 nick_dort_yonlug_khagan:0 "Kagán Dört Yönlüg"
 nick_dort_yonlug_khagan_desc:0 "Kan de los Cuatro Rincones. [CHARACTER.GetShortUINameNoTooltipNoFormat|U] reclama un mandato divino para gobernar todas las tierras que se extienden hasta los confines de la Tierra."
 
 nick_tengri_khagan:0 "Kagán Tengri"
 nick_tengri_khagan_desc:0 "El Kan Nacido del Cielo. [CHARACTER.GetShortUINameNoTooltipNoFormat|U] afirma que su vasto e imparable imperio está ordenado directamente por el Gran Cielo Azul."
 
 nick_xormuzta:0 "Xormuzta"
 nick_xormuzta_desc:0 "Invocando el antiguo concepto oriental de la deidad suprema, este título eleva a [CHARACTER.GetShortUINameNoTooltipNoFormat|U] a un estatus casi mítico entre sus súbditos."
 
 nick_mar_sargis:0 "Mar Sargis"
 nick_mar_sargis_desc:0 "Tomando el nombre del reverenciado santo militar cristiano oriental, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] se posiciona como un guerrero santo de Oriente."
 
 nick_cihangir:0 "Cihangir"
 nick_cihangir_desc:0 "Un título persa que se traduce como 'Conquistador del Mundo', reflejando las devastadoramente exitosas campañas expansionistas de [CHARACTER.GetShortUINameNoTooltipNoFormat|U]."
 
 nick_culture_khagan:0 "Kan [CHARACTER.GetCulture.GetNameNoTooltip]"
 nick_culture_khagan_desc:0 "Reconocido como el soberano supremo de [CharYourHerHis(CHARACTER)] pueblo, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] ha forjado un imperio tribal unificado de un poder asombroso."
 
 nick_akhshunwar:0 "Akhshunwar"
 nick_akhshunwar_desc:0 "Reviviendo un título antiguo y prestigioso de la era heftalita, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] afirma su dominio sobre las arterias cruciales de la Ruta de la Seda."
 
 nick_the_wary:0 "el Cauteloso"
 nick_the_wary_desc:1 "Anticipando constantemente la traición, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] mantiene una guardia numerosa y confía en una profunda red de espías para asegurar su reinado."
 
 nick_the_hairy:0 "el Peludo"
 nick_the_hairy_desc:1 "Un mote directo y descriptivo otorgado a [CHARACTER.GetShortUINameNoTooltipNoFormat|U] por su excepcionalmente densa cobertura de vello corporal."
 
 nick_the_child:0 "el Niño"
 nick_the_child_desc:1 "Un epíteto trágico para un monarca cuyo reinado —y vida— terminó antes de que pudiera llegar verdaderamente a la mayoría de edad y ejercer el poder de forma independiente."
 
 nick_the_wake:0 "el Velatorio"
 nick_the_wake_desc:1 "Que significa 'el Vigilante', [CHARACTER.GetShortUINameNoTooltipNoFormat|U] se ganó este legendario título liderando una prolongada y esquiva resistencia de guerrillas contra los conquistadores extranjeros."
 
 
 nick_the_mountain_dweller:0 "el Morador de la Montaña"
 nick_the_mountain_dweller_desc:1 "Profundamente asociado a las escarpadas tierras altas, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] utiliza el traicionero terreno alpino para mantener una independencia absoluta."
 
 nick_the_legend_riad:0 "la Leyenda"
 nick_the_legend_riad_desc:1 "Logrando hazañas tan extraordinarias que desafían la creencia, la vida de [CHARACTER.GetShortUINameNoTooltipNoFormat|U] ya ha pasado de la historia al mito."
 
 nick_the_shadow_riad:0 "$nick_the_shadow$"
 nick_the_shadow_riad_desc:0 "$nick_the_legend_riad_desc$"
 
 nick_the_justicar:0 "el Justicia"
 nick_the_justicar_desc:1 "Actuando como la máxima autoridad legal de la tierra, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es célebre por imponer la paz del rey con inquebrantable equidad."
 
 nick_the_green:0 "el Verde"
 nick_the_green_desc:2 "Un mote caballeresco derivado del gusto de [CHARACTER.GetShortUINameNoTooltipNoFormat|U] por vestir prendas verdes y organizar elaborados torneos cortesanos."
 
 nick_the_foreigner:0 "el Extranjero"
 nick_the_foreigner_desc:1 "Procedente de tierras lejanas, la nobleza nativa ve a [CHARACTER.GetShortUINameNoTooltipNoFormat|U] con una desconfianza persistente pese a ocupar el trono."
 
 nick_the_culture:0 "el [CHARACTER.MakeScope.Var('nick_the_culture_var').Culture.GetNameNoTooltip]"
 nick_the_culture_desc:1 "Un apelativo que consolida el legado de [CHARACTER.GetShortUINameNoTooltipNoFormat|U] a las tradiciones culturales y los intereses políticos específicos de su tierra natal."
 
 nick_the_linguist:0 "el Lingüista"
 nick_the_linguist_desc:1 "Un políglota sumamente educado, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] lleva a cabo negociaciones diplomáticas complejas sin necesidad de traductores, impresionando a las cortes extranjeras."
 
 nick_the_clumsy:0 "el Torpe"
 nick_the_clumsy_desc:1 "Carente de toda gracia física o coordinación marcial, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es notoriamente inepto en las listas de torneo."
 
 nick_the_stumbler:0 "el Tropezador"
 nick_the_stumbler_desc:1 "Ya sea por padecer una dolencia física o por simple ineptitud, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] tiene dificultades para mantener un porte regio."
 
 
 nick_the_beautiful:0 "el Hermoso"
 nick_the_beautiful_desc:1 "Poseedor de una simetría y un encanto físico llamativos, la apariencia de [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es objeto de admiración generalizada en la corte."
 
 nick_the_beautiful_generous:0 "el Hermoso"
 nick_the_beautiful_desc_generous:0 "Aunque no poseía una belleza física clásica, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] se ganó este título por la profunda belleza de [CharYourHerHis(CHARACTER)] obras de caridad."
 
 nick_the_stutterer:0 "el Tartamudo"
 nick_the_stutterer_desc:1 "Un grave impedimento del habla definió los discursos públicos de [CHARACTER.GetShortUINameNoTooltipNoFormat|U], una vulnerabilidad registrada sin piedad por los historiadores de la época."
 
 nick_the_slow:0 "el Lento"
 nick_the_slow_desc:1 "Señalado por su extrema lentitud tanto en el movimiento físico como en la toma de decisiones políticas, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] falla constantemente en tomar la iniciativa."
 
 nick_the_eloquent:0 "el Elocuente"
 nick_the_eloquent_desc:1 "Maestro de la retórica, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] puede persuadir a consejos hostiles e inspirar a ejércitos derrotados con su elocuencia."
 
 nick_the_bell_keeper:0 "el Guardián de la Campana"
 nick_the_bell_keeper_desc:1 "Célebre por patrocinar fundiciones y equipar las iglesias del reino con enormes y resonantes campanas de bronce."
 
 nick_the_requiem:0 "el Réquiem"
 nick_the_requiem_desc:0 "Un título poético y solemne que denota a un gobernante cuyo reinado se definió por la tragedia, el luto y el fin de una larga era dinástica."
 
 nick_the_Thief_Slayer:0 "el Matador de Ladrones"
 nick_the_Thief_Slayer_desc:1 "Restaurando el orden en caminos sin ley, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] cazó sin piedad a reyes bandidos y aseguró las rutas comerciales del reino."
 
 nick_the_cid_campeador:0 "El Cid Campeador"
 nick_the_cid_campeador_desc:1 "El 'Señor Campeón del Campo de Batalla'. Un legendario título ibérico reservado para un genio militar invicto de honor sin parangón."
 
 nick_benavert:0 "Benavert"
 nick_benavert_desc:1 "Una corrupción árabe de un nombre más antiguo, este apelativo identifica a [CHARACTER.GetShortUINameNoTooltipNoFormat|U] como un señor de la guerra feroz e independiente que opera en territorios disputados."
 
 nick_the_pragmatic:1 "el Pragmático"
 nick_the_pragmatic_desc:0 "Descartando el idealismo y el dogma rígido, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] gobierna mediante decisiones políticas sumamente efectivas, flexibles y realistas."
 
 nick_the_equitable:1 "el Equitativo"
 nick_the_equitable_desc:1 "Célebre por su justicia imparcial, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] asegura que la ley se aplique por igual al más alto duque y al más humilde campesino."
 
 nick_the_crownless:0 "el Sin Corona"
 nick_the_crownless_desc:0 "Aunque posee un inmenso poder y territorio de facto, a [CHARACTER.GetShortUINameNoTooltipNoFormat|U] le falta ostensiblemente el título formal y consagrado de Rey."
 
 nick_strongarm:0 "Brazo Fuerte"
 nick_strongarm_desc:1 "Confiando en la fuerza física bruta y la coerción militar, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] fuerza el cumplimiento de vasallos recalcitrantes."
 
 nick_with_the_tress:0 "de la Trenza"
 nick_with_the_tress_desc:1 "Un identificador profundamente romántico, que señala que [CHARACTER.GetShortUINameNoTooltipNoFormat|U] llevaba célebremente a la batalla un mechón trenzado del cabello de su amante."
 
 nick_with_the_lock:0 "del Mechón"
 nick_with_the_lock_desc:0 "$nick_with_the_tress_desc$"
 
 nick_irontooth:0 "Diente de Hierro"
 nick_irontooth_desc:1 "Un apelativo intimidante que sugiere que [CHARACTER.GetShortUINameNoTooltipNoFormat|U] posee una mordida —tanto literal como política— que no se puede quebrar."
 
 nick_the_venator:0 "el Venator"
 nick_the_venator_desc:1 "El título latino para 'Cazador', que resalta la obsesión de [CHARACTER.GetShortUINameNoTooltipNoFormat|U] por la persecución aristocrática de la caza y el dominio de los bosques profundos."
 
 nick_the_dirty:0 "el Sucio"
 nick_the_dirty_desc:1 "Despreciando la higiene refinada de la corte, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] destaca por una apariencia tosca y desaliñada propia de un campañista constante."
 
 nick_the_cheater:0 "el Tramposo"
 nick_the_cheater_desc:1 "Célebre por romper las reglas de los torneos, falsificar documentos y violar treguas, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] no tiene ningún concepto del juego limpio."
 
 nick_the_toxophilite:0 "el Toxófilo"
 nick_the_toxophilite_desc:1 "Maestro de la arquería, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] patrocina intensamente el arco largo y la ballesta, integrando mortíferas tácticas de proyectiles en el ejército real."
 
 nick_saddle_born:0 "Nacido en la Silla"
 nick_saddle_born_desc:1 "Pasando gran parte de su vida a caballo, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es un comandante de caballería sin igual de las estepas."
 
 nick_the_champion:0 "el Campeón"
 nick_the_champion_desc:1 "Habiendo salido victorioso de incontables juicios por combate y grandes torneos, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es el guerrero preeminente de la época."
 
 nick_northmen_slayer:0 "Matador de Nórdicos"
 nick_northmen_slayer_desc:1 "Ganándose una fama legendaria al derrotar decisivamente una gran invasión vikinga, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] aseguró las costas frente a nuevos saqueos."
 
 nick_pirate_slayer:0 "Azote de los Mares"
 nick_pirate_slayer_desc:1 "Dando caza a corsarios y desmantelando refugios de piratas, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] devolvió la seguridad y la prosperidad a las rutas comerciales marítimas."
 
 nick_son_of_dangerous_animal:0 "el [CHARACTER.Custom('GetDaughterSon')|U] de [CHARACTER.Custom('GetAnimalPlural')|U]"
 nick_son_of_dangerous_animal_desc:1 "Un epíteto mítico que sugiere que [CHARACTER.GetShortUINameNoTooltipNoFormat|U] posee una fuerza feral e inhumana, criado por las fieras salvajes del bosque."
 
 nick_the_own_culture:0 "el [CHARACTER.GetCulture.GetNameNoTooltip]"
 nick_the_own_culture_desc:1 "Ferozmente orgulloso de su herencia, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] defiende activamente las costumbres tradicionales y la lengua de su pueblo."
 
 nick_the_mother_culture:0 "el [CHARACTER.GetMother.GetCulture.GetNameNoTooltip]"
 nick_the_mother_culture_desc:1 "Un apelativo que resalta el linaje materno de [CHARACTER.GetShortUINameNoTooltipNoFormat|U], vinculándolo a un poderoso legado cultural extranjero."
 
 nick_the_father_culture:0 "el [CHARACTER.GetFather.GetCulture.GetNameNoTooltip]"
 nick_the_father_culture_desc:1 "Un apelativo que resalta el linaje paterno de [CHARACTER.GetShortUINameNoTooltipNoFormat|U], vinculándolo a un poderoso legado cultural extranjero."
 
 nick_prester_john:0 "el Preste Juan"
 nick_prester_john_desc:1 "Visto a través del prisma del mito, se cree en cortes lejanas que [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es el legendario e inmensamente poderoso monarca cristiano de Oriente."
 
 nick_the_thoughtless:0 "el Irreflexivo"
 nick_the_thoughtless_desc:1 "Actuando por puro impulso, el reinado de [CHARACTER.GetShortUINameNoTooltipNoFormat|U] se caracteriza por políticas erráticas y mal planificadas que a menudo terminan en desastre."
 
 nick_the_heartless:0 "el Desalmado"
 nick_the_heartless_desc:1 "Carente de empatía o misericordia, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] ejecuta juicios severos sin el menor rastro de remordimiento, incluso contra su propia sangre."
 
 nick_the_craven:0 "el Cobarde"
 nick_the_craven_desc:1 "Huyendo de la batalla y capitulando ante las exigencias por puro terror, la cobardía de [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es una profunda vergüenza para la corona."
 
 nick_monarch_of_beauty_and_noblesse_masc:0 "Rey de la Belleza y la Nobleza"
 nick_monarch_of_beauty_and_noblesse_masc_desc:1 "Un título poético y caballeresco que celebra la perfección física de [CHARACTER.GetShortUINameNoTooltipNoFormat|U] y su dedicación a los más altos ideales de la virtud aristocrática."
 
 nick_monarch_of_beauty_and_noblesse:1 "Reina de la Belleza y la Nobleza"
 nick_monarch_of_beauty_and_noblesse_desc:0 "$nick_monarch_of_beauty_and_noblesse_masc_desc$"
 
 nick_monarch_of_grim_and_grievance_masc:0 "Rey de la Aflicción y el Agravio"
 nick_monarch_of_grim_and_grievance_masc_desc:1 "Gobernando sobre una corte definida por un amargo faccionalismo y quejas constantes, el reinado de [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es profundamente impopular."
 
 nick_monarch_of_grim_and_grievance:0 "Reina de la Aflicción y el Agravio"
 nick_monarch_of_grim_and_grievance_desc:0 "$nick_monarch_of_grim_and_grievance_masc_desc$"
 
 nick_the_naysayer:1 "el Detractor"
 nick_the_naysayer_desc:1 "Rechazando constantemente el consejo y obstruyendo las iniciativas de los estamentos, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es visto como una fuerza enteramente negativa y poco cooperativa."
 
 nick_monarch_of_fools_masc:0 "Obispo de los Locos"
 nick_monarch_of_fools_masc_desc:1 "Un título burlón que da a entender que [CHARACTER.GetShortUINameNoTooltipNoFormat|U] se rodea de aduladores e incompetentes, creando una corte de absoluta absurdidad."
 
 nick_monarch_of_fools:0 "Obispa de los Locos"
 nick_monarch_of_fools_desc:0 "$nick_monarch_of_fools_masc_desc$"
 
 nick_the_just_widowed:0 "el Recién Viudo"
 nick_the_just_widowed_desc:1 "Definido por la súbita y trágica pérdida de su cónyuge, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] gobierna bajo una prolongada y muy visible sombra de duelo."
 
 nick_the_resilient:0 "el Resiliente"
 nick_the_resilient_desc:1 "Habiendo sobrevivido a heridas devastadoras, enfermedades graves y múltiples intentos de usurpación, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] simplemente se niega a ceder."
 
 nick_one_eye:0 "Un Ojo"
 nick_one_eye_desc:0 "$nick_monophthalmos_desc$"
 
 nick_one_hand:0 "Una Mano"
 nick_one_hand_desc:1 "Un identificador físico crudo para un gobernante que sufrió una amputación —ya sea en batalla o bajo la sierra del cirujano— y que aun así sigue gobernando."
 
 nick_one_leg:0 "Una Pierna"
 nick_one_leg_desc:1 "Obligado a gobernar con la ayuda de una muleta o pata de palo, la falta de un miembro de [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es un recordatorio constante de su supervivencia a un trauma intenso."
 
 nick_the_persevering:0 "el Perseverante"
 nick_the_persevering_desc:1 "Soportando décadas de penurias, guerra civil y tragedia personal, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] mantiene el trono a través de una pura y tenaz determinación."
 
 nick_the_lord_of_realm:0 "el [CHARACTER.GetLadyLord|U] de [CHARACTER.GetCapitalLocation.GetTitle.GetBaseNameNoTierNoTooltip]"
 nick_the_lord_of_realm_desc:1 "Profundamente querido por los ciudadanos de su capital, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es visto como el máximo mecenas y defensor cívico."
 
 nick_twistedbeard:0 "Barba Torcida"
 nick_twistedbeard_desc:1 "Un identificador claramente bretón, que hace referencia a la costumbre de [CHARACTER.GetShortUINameNoTooltipNoFormat|U] de trenzar o rizar su vello facial antes de cabalgar hacia la guerra."
 
 nick_the_boar:0 "el Jabalí"
 nick_the_boar_desc:1 "Robusto, agresivo e increíblemente peligroso cuando se le acorrala, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] encarna la naturaleza feroz del jabalí salvaje."
 
 nick_the_faceless:0 "el Sin Rostro"
 nick_the_faceless_desc:1 "Ocultando una grave desfiguración tras una máscara o pesados velos, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] presenta un rostro anónimo y aterrador ante la corte."
 
 nick_the_cyclops:0 "el Cíclope"
 nick_the_cyclops_desc:1 "Una figura imponente a la que le falta un ojo, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es comparado con los monstruos colosales y temibles de la antigüedad clásica."
 
 nick_the_nun:0 "la Monja"
 nick_the_nun_desc:1 "Renunciando al lujo cortesano en favor de estrictos votos monásticos, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] transforma el palacio real en un auténtico claustro."
 
 nick_the_ill_ruler:0 "el Mal Gobernante"
 nick_the_ill_ruler_desc:1 "Un juicio histórico condenatorio, que marca a [CHARACTER.GetShortUINameNoTooltipNoFormat|U] como un monarca cuyo reinado solo trajo inestabilidad, corrupción y fracaso."
 
 nick_the_careless:0 "el Descuidado"
 nick_the_careless_desc:1 "Ignorando las intrincadas obligaciones del estado, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] enajena a sus vasallos y dilapida el tesoro por pura negligencia."
 
 nick_of_the_empty_pockets:0 "de los Bolsillos Vacíos"
 nick_of_the_empty_pockets_desc:1 "Un sobrenombre humillante para un soberano que, pese a su alto rango, sufre crónicamente de una ruina financiera extrema y una deuda descomunal."
 
 nick_the_goliath:0 "el Goliat"
 nick_the_goliath_desc:1 "Un auténtico titán entre [CHARACTER.GetWomanMan], [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es visto por los hombres de menor estatura con una mezcla de asombro y terror bíblico."
 
 nick_the_shield_of_capital:0 "el Escudo de [CHARACTER.GetCapitalLocation.GetTitle.GetBaseNameNoTierNoTooltip]"
 nick_the_shield_of_capital_desc:1 "Habiendo defendido con éxito la capital de un asedio catastrófico, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es aclamado como el salvador del reino."
 
 nick_the_peacock:0 "el Pavo Real"
 nick_the_peacock_desc:1 "Pavoneándose por la corte con sedas ostentosas y coloridas, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es notorio por su extrema vanidad y su orgullo superficial."
 
 nick_the_bellower:0 "el Bramador"
 nick_the_bellower_desc:1 "Poseedor de una voz como el trueno, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] acapara la atención en el campo de batalla y domina los consejos con puro volumen."
 
 nick_the_healer:0 "el Sanador"
 nick_the_healer_desc:2 "Inusualmente versado en las artes médicas para un noble, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] está profundamente implicado en la fundación de hospitales y el cuidado de los enfermos."
 
 nick_the_prophet:0 "el Profeta"
 nick_the_prophet_desc:1 "Reclamando una inspiración divina directa, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] guía a su pueblo con una carismática y ardiente visión religiosa."
 
 nick_the_understanding:0 "el Comprensivo"
 nick_the_understanding_desc:1 "Poseedor de una inteligencia emocional poco común, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es muy valorado por su enfoque empático y razonado de la justicia."
 
 nick_the_righteous:0 "el Justo"
 nick_the_righteous_desc:1 "Gobernando en estricta conformidad con la ley divina y los principios morales, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es visto como un pilar incorruptible de virtud."
 
 nick_the_venerable:0 "el Venerable"
 nick_the_venerable_desc:1 "Alcanzando una gran edad sin perder su sabiduría y piedad, se trata a [CHARACTER.GetShortUINameNoTooltipNoFormat|U] como a un santo viviente entre sus súbditos."
 
 nick_the_miracle_worker:0 "el Hacedor de Milagros"
 nick_the_miracle_worker_desc:1 "Asociado a sucesos inexplicables y prodigiosos, el pueblo llano cree firmemente que [CHARACTER.GetShortUINameNoTooltipNoFormat|U] ejerce el poder de la intervención divina."
 
 
 nick_the_silver_tongue:0 "Lengua de Plata"
 nick_the_silver_tongue_desc:2 "Poseedor de un encanto persuasivo y cautivador, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] puede hablar para librarse de un asedio o conseguir un tratado ventajoso con facilidad."
 
 nick_the_forgetful:0 "el Olvidadizo"
 nick_the_forgetful_desc:1 "Aquejado de una memoria poco fiable —o quizá de las primeras etapas de un declive mental—, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] tiene dificultades para gestionar las complejidades del gobierno."
 
 nick_the_hermit:0 "el Ermitaño"
 nick_the_hermit_desc:2 "Abandonando el esplendor de la capital, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] prefiere el aislamiento de un remoto pabellón de caza o un refugio en la montaña."
 
 nick_the_recluse:0 "el Recluso"
 nick_the_recluse_desc:1 "Cerrando las puertas de sus aposentos reales, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] gobierna a través de intermediarios y evita toda aparición pública."
 
 nick_the_feeble:0 "el Débil"
 nick_the_feeble_desc:2 "Carente de vitalidad o fuerza física, la ambiciosa nobleza ve a [CHARACTER.GetShortUINameNoTooltipNoFormat|U] como una figura frágil y patética."
 
 nick_the_vain:0 "el Vanidoso"
 nick_the_vain_desc:1 "Obsesionado con espejos, retratos y halagos, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] se rodea de aduladores que alimentan su enorme ego."
 
 nick_the_castellan:0 "el Castellano"
 nick_the_castellan_desc:1 "Centrado por completo en la defensa, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] ha rodeado el reino con una formidable red de torreones, murallas y torres fortificadas."
 
 nick_the_carpenter:0 "el Carpintero"
 nick_the_carpenter_desc:1 "Renunciando al ocio aristocrático, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es conocido por la humilde y piadosa práctica de trabajar la madera con sus propias manos."
 
 nick_the_griffin:0 "el Grifo"
 nick_the_griffin_desc:1 "Adoptando la bestia heráldica como símbolo personal, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es visto como un soberano majestuoso y ferozmente protector del reino."
 
 nick_the_patron_of_arts:0 "el Mecenas de las Artes"
 nick_the_patron_of_arts_desc:1 "Canalizando una vasta riqueza en encargos para pintores, escultores y músicos, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] ha dado a luz un renacimiento cultural."
 
 nick_the_zealot:0 "el Fanático"
 nick_the_zealot_desc:1 "Impulsado por un fervor religioso aterrador e intransigente, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] quemará el mundo con tal de ver triunfar la fe."
 
 
 nick_the_evil:0 "el Malvado"
 nick_the_evil_desc:1 "Un veredicto tajante y condenatorio de la historia, marcando a [CHARACTER.GetShortUINameNoTooltipNoFormat|U] como un gobernante consumido por la malicia, la crueldad y el pecado."
 
 nick_the_jovial:0 "el Jovial"
 nick_the_jovial_desc:1 "Irradiando buen humor, la corte de [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es un faro de banquetes, risas y diplomacia desenfadada."
 
 nick_the_jolly:0 "el Jovial"
 nick_the_jolly_desc:1 "Conocido por su figura rolliza y una risa contagiosa y atronadora, el pueblo llano adora a [CHARACTER.GetShortUINameNoTooltipNoFormat|U] por su cercanía."
 
 nick_the_strange:0 "el Extraño"
 nick_the_strange_desc:1 "Mostrando comportamientos altamente excéntricos e intereses poco ortodoxos, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es una constante fuente de chismes desconcertados."
 
 nick_the_unlucky:0 "el Desafortunado"
 nick_the_unlucky_desc:1 "Perseguido por accidentes extraños, tormentas repentinas y coincidencias desastrosas, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] parece maldito por el destino mismo."
 
 nick_the_lucky:0 "el Afortunado"
 nick_the_lucky_desc:1 "Bendecido por la providencia, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] sobrevive con frecuencia a probabilidades imposibles y cae en situaciones enormemente ventajosas."
 
 nick_the_effeminate:0 "el Afeminado"
 nick_the_effeminate_desc:1 "Objeto de burlas por sus pares marciales por preferir las sedas y la poesía a la armadura y la justa, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] desafía los ideales masculinos de la época."
 
 nick_the_clueless:0 "el Despistado"
 nick_the_clueless_desc:1 "Profundamente ignorante en materia de gobierno y geografía básicas, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] depende por completo de la orientación del consejo."
 
 nick_the_ill_tempered:0 "el de Mal Genio"
 nick_the_ill_tempered_desc:1 "Propenso a arrebatos de ira repentinos y violentos ante los más mínimos insultos percibidos, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es un amo aterrador al que servir."
 
 nick_the_sleeping_king:0 "el [CHARACTER.GetTitleAsNameNoTooltip] Durmiente"
 nick_the_sleeping_king_desc:1 "Letárgico hasta la incapacidad, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] deja el gobierno del reino enteramente en manos de regentes y cancilleres ambiciosos."
 
 nick_the_humble:0 "el Humilde"
 nick_the_humble_desc:1 "Rechazando los ostentosos atavíos de la realeza, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] viste con sencillez y lava los pies de los pobres en días santos."
 
 nick_the_horse:0 "el Caballo"
 nick_the_horse_desc:1 "Un epíteto que honra a un soberano nómada cuya vida, conquistas y cultura están inextricablemente ligadas al dominio de la silla de montar."
 
 
 nick_the_determined:0 "el Decidido"
 nick_the_determined_desc:1 "Poseedor de una voluntad de hierro, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] persigue sus ambiciones con un enfoque singular e inquebrantable."
 
 nick_do_nothing:0 "el Holgazán"
 nick_do_nothing_desc:1 "Una traducción de 'roi fainéant', un título despectivo para un soberano que reinó solo de nombre, entregando todo el poder a sus subordinados."
 
 nick_the_indolent:0 "el Indolente"
 nick_the_indolent_desc:1 "Definido por una profunda aversión al esfuerzo, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] permite que la administración del reino se pudra lentamente por pura pereza."
 
 nick_the_sluggard:0 "el Holgazán"
 nick_the_sluggard_desc:1 "Lento para levantarse, lento para marchar y lento para decidir, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es un comandante y rey frustrantemente letárgico."
 
 nick_the_idle:0 "el Ocioso"
 nick_the_idle_desc:1 "Prefiriendo el ocio y la caza a la ardua labor de gobernar, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es un monarca fundamentalmente ausente."
 
 
 nick_the_wrathful:0 "el Iracundo"
 nick_the_wrathful_desc:1 "Vengativo y presto a la ira, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] castiga la rebelión y la traición con una furia terrible y bíblica."
 
 nick_the_rotund:0 "el Rotundo"
 nick_the_rotund_desc:2 "Señalado por su extrema corpulencia física, el inmenso tamaño de [CHARACTER.GetShortUINameNoTooltipNoFormat|U] se interpreta ya sea como señal de gran riqueza o de pecado glotón."
 
 nick_the_faith:0 "el [CHARACTER.GetFaith.GetAdherentNameNoTooltip]"
 nick_the_faith_desc:2 "Definido principalmente por su adhesión a una religión minoritaria o extranjera, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es una auténtica novedad en la región."
 
 nick_the_eunuch:0 "el Eunuco"
 nick_the_eunuch_desc:1 "Habiendo sufrido la castración, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] ocupa una posición única, a menudo marginada, dentro de las férreas jerarquías patriarcales de la época."
 
 nick_greataxe:0 "Gran Hacha"
 nick_greataxe_desc:1 "Renunciando a la espada caballeresca en favor del poder brutal y arrollador de un hacha a dos manos, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es un devastador combatiente de choque."
 
 nick_the_mace:0 "la Maza"
 nick_the_mace_desc:1 "Especializado en aplastar armaduras pesadas, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] entra en batalla blandiendo una maza con aletas para destrozar formaciones de caballeros."
 
 nick_the_spear_of_capital:0 "la Lanza de [CHARACTER.GetCapitalLocation.GetTitle.GetBaseNameNoTierNoTooltip]"
 nick_the_spear_of_capital_desc:1 "Actuando como la agresiva vanguardia de su reino, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] proyecta poder militar mucho más allá de las murallas de la capital."
 
 nick_the_maul:0 "el Mazo"
 nick_the_maul_desc:1 "Confiando en una fuerza cinética abrumadora, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] empuña un enorme martillo de guerra para someter a golpes a sus enemigos."
 
 nick_the_tiger_of_place:0 "el Tigre de [CHARACTER.GetCapitalLocation.GetTitle.GetBaseNameNoTierNoTooltip]"
 nick_the_tiger_of_place_desc:1 "Comparado con el feroz depredador rayado de oriente, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] defiende su dominio con agilidad y poder letales."
 
 nick_the_navigator:0 "el Navegante"
 nick_the_navigator_desc:1 "Patrocinando la cartografía y las expediciones marítimas de larga distancia, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] ha ampliado los límites del mundo conocido."
 
 nick_the_berserker:0 "el Berserker"
 nick_the_berserker_desc:1 "Entrando en batalla en un estado de furia frenética y aullante, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] lucha con un terrorífico desprecio por su propia seguridad."
 
 nick_the_actually_bald:0 "el Calvo"
 nick_the_actually_bald_desc:1 "Carente de cabello en una época que lo valora enormemente, la calva de [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es un rasgo físico ampliamente reconocido."
 
 nick_the_iron_and_golden_king:0 "el [CHARACTER.GetTitleAsNameNoTooltip] de Hierro y Oro"
 nick_the_iron_and_golden_king_desc:1 "Poseedor de profundas minas de plata y oro además de un temible ejército, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] domina tanto la economía como la guerra."
 
 nick_the_slobberer:0 "el Baboso"
 nick_the_slobberer_desc:1 "Aquejado de parálisis o de simples malos modales, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es notoriamente desaliñado en los banquetes de estado, socavando su dignidad regia."
 
 nick_the_lover_of_elegance:0 "el Amante de la Elegancia"
 nick_the_lover_of_elegance_desc:1 "Rodeándose de las mejores sedas, tapices y perfumes, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] insiste en un refinamiento absoluto."
 
 nick_the_universal_spider:0 "la Araña Universal"
 nick_the_universal_spider_desc:1 "Maestro arquitecto del espionaje, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] teje una vasta red continental de diplomacia y soborno para atrapar a sus rivales."
 
 nick_the_collector:0 "el Coleccionista"
 nick_the_collector_desc:1 "Adquiriendo obsesivamente textos raros, reliquias sagradas y curiosidades exóticas, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] ha convertido el palacio real en un gran museo."
 
 nick_the_haunted:0 "el Atormentado"
 nick_the_haunted_desc:2 "Atormentado por pecados pasados, traumas o fantasmas percibidos, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] proyecta un aura de profunda e inquebrantable melancolía."
 
 
 nick_the_petulant:0 "el Petulante"
 nick_the_petulant_desc:1 "Reaccionando a los reveses políticos con rabietas infantiles y enfurruñamiento, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] carece de la madurez emocional esperada de un soberano."
 
 nick_the_turbulent:0 "el Turbulento"
 nick_the_turbulent_desc:1 "Una figura polarizadora y dramática, el reinado de [CHARACTER.GetShortUINameNoTooltipNoFormat|U] se define por una agitación constante, alianzas cambiantes y reformas radicales."
 
 nick_the_disgraceful:0 "el Deshonroso"
 nick_the_disgraceful_desc:1 "Habiendo cometido actos de profunda cobardía o depravación moral, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] ha traído una vergüenza duradera sobre su dinastía."
 
 nick_the_negotiator:0 "el Negociador"
 nick_the_negotiator_desc:1 "Poseedor de una mente jurídica brillante, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] destaca en la negociación de treguas complejas y en la obtención de concesiones sin derramar sangre."
 
 nick_the_executioner:0 "el Verdugo"
 nick_the_executioner_desc:1 "Prescindiendo de los tribunales de justicia a favor del rápido golpe del hacha, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es infame por su alarmante índice de penas capitales."
 
 nick_pennyfather:0 "el Tacaño"
 nick_pennyfather_desc:1 "Un término despectivo para un soberano consumido por la extrema tacañería, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] atesora monedas mientras los castillos del reino se deterioran lentamente."
 
 nick_swan_neck:0 "Cuello de Cisne"
 nick_swan_neck_desc:2 "Un identificador poético que señala la llamativa postura elegante y el famoso cuello largo y grácil de [CHARACTER.GetShortUINameNoTooltipNoFormat|U]."
 
 nick_softsword:0 "Espada Blanda"
 nick_softsword_desc:1 "Un sobrenombre sumamente insultante que da a entender que [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es tanto un comandante militar incompetente como alguien carente por completo de vigor viril."
 
 nick_the_chimera:0 "la Quimera"
 nick_the_chimera_desc:1 "Un gobernante complejo y multifacético, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] muestra rasgos enormemente contradictorios —piedad y crueldad, devoción y pecado— que desconciertan a los historiadores."
 
 nick_the_abominable:0 "el Abominable"
 nick_the_abominable_desc:1 "Cometiendo actos tan atroces que desafían la moral de la época, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es visto con puro y absoluto asco por el mundo civilizado."
 
 nick_bloody_hand:0 "el de la Mano Sangrienta"
 nick_bloody_hand_desc:1 "Un epíteto que indica que [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es directa y personalmente responsable del cruento asesinato de rivales y familiares."
 
 nick_the_coppersmith:0 "el Calderero"
 nick_the_coppersmith_desc:0 "Surgiendo de humildes orígenes artesanales, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] forjó un imperio, aunque la vieja nobleza nunca olvida sus raíces plebeyas."
 
 nick_the_eagle_of_arasbaran:0 "el Águila de Arasbarán"
 nick_the_eagle_of_arasbaran_desc:0 "Vigilando los escarpados valles desde fortalezas inexpugnables, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es el indiscutible y avizor amo de las montañas de Arasbarán."
 
 nick_the_fortress_builder:0 "el Constructor de Fortalezas"
 nick_the_fortress_builder_desc:0 "Respondiendo a la constante amenaza de invasión, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] militarizó el paisaje con una increíble red de torreones de piedra interconectados."
 
 nick_the_fire_quencher:0 "el Apagafuegos"
 nick_the_fire_quencher_desc:0 "Una figura profundamente traumática para los zoroastristas, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] se ganó este título extinguiendo sistemáticamente las antiguas llamas sagradas de la fe."
 
 nick_the_firekeeper:0 "el Guardián del Fuego"
 nick_the_firekeper_desc:0 "Reverenciado como el protector definitivo de las viejas costumbres, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] aseguró que los Fuegos Sagrados siguieran ardiendo pese a siglos de persecución."
 
 
 nick_the_ambidextrous:0 "el Ambidiestro"
 nick_the_ambidextrous_desc:0 "Poseedor de una coordinación física poco común, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es capaz de blandir una espada o una pluma con igual letalidad en cualquiera de las dos manos."
 
 nick_the_lute_player:0 "el Tañedor de Laúd"
 nick_the_lute_player_desc:0 "Mecenas de la música cortesana y músico consumado por derecho propio, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] aporta brillantez cultural al reino."
 
 nick_the_rekindler_of_iran:0 "la Llama de Persia"
 nick_the_rekindler_of_iran_desc:0 "Un título monumental y heroico. [CHARACTER.GetShortUINameNoTooltipNoFormat|U] logró romper la hegemonía extranjera y restaurar la gloria y la independencia ancestrales de la meseta iraní."
 
 nick_the_righteous_caliph:0 "el Justo"
 nick_the_righteous_caliph_desc:0 "Gobernando en estricta conformidad con la jurisprudencia islámica, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es venerado como un sucesor justo, piadoso y legítimo del Profeta."
 
 nick_the_conceding:0 "el Concesivo"
 nick_the_conceding_desc:0 "Obligado a firmar tratados humillantes y a ceder enormes prerrogativas reales a vasallos rebeldes, el reinado de [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es uno de capitulación."
 
 nick_order_of_the_realm:0 "la Orden del Reino"
 nick_order_of_the_realm_desc:0 "Un honorífico sumamente estimado que reconoce a [CHARACTER.GetShortUINameNoTooltipNoFormat|U] como el pilar fundacional de la estabilidad burocrática y la justicia cívica."
 
 nick_the_martyr_king:0 "el Rey Mártir"
 nick_the_martyr_king_desc:0 "Habiendo caído en batalla contra paganos o habiendo sido ejecutado por usurpadores, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es venerado como un sacrificio sagrado por la nación."
 
 nick_the_younger_missionary:0 "el Joven Misionero"
 nick_the_younger_missionary_desc:0 "Siguiendo los pasos de un hermano mayor y más famoso, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] dedicó su vida a la ardua conversión de las fronteras."
 
 nick_the_caliph_protector:0 "el Protector del Califato"
 nick_the_caliph_protector_desc:0 "Ostentando el poder secular supremo, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] actúa como el escudo militante y el señor absoluto del Califa espiritual."
 
 nick_the_true_culture:0 "el Verdadero [CHARACTER.GetCulture.GetNameNoTooltip]"
 nick_the_true_culture_desc:0 "En una era de asimilación e influencia extranjera, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] se erige como un bastión intransigente de las costumbres tradicionales [CHARACTER.GetCulture.GetName]."
 
 nick_the_reformer:0 "el Reformador"
 nick_the_reformer_desc:0 "Renovando leyes anticuadas e instituciones corruptas, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] arrastró al reino hacia una nueva era ilustrada."
 
 nick_royalsbane:0 "Azote de Reyes"
 nick_royalsbane_desc:0 "Una reputación aterradora en el campo de batalla; [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es conocido específicamente por buscar, abatir y matar a monarcas rivales."
 
 nick_the_city_builder:0 "el Constructor de Ciudades"
 nick_the_city_builder_desc:0 "Expandiendo la huella urbana del reino, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] trazó nuevas ciudades, concedió fueros y fomentó una próspera clase mercantil."
 
 nick_the_castle_builder:0 "el Constructor de Castillos"
 nick_the_castle_builder_desc:0 "Reconociendo la necesidad de defensa, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] fortificó fuertemente las fronteras con una impresionante red de castillos de piedra concéntricos."
 
 nick_the_temple_builder:0 "el Constructor de Templos"
 nick_the_temple_builder_desc:0 "Demostrando una inmensa piedad a través de la arquitectura, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] patrocinó la construcción de magníficas catedrales y lugares santos."
 
 nick_the_dragonslayer:0 "el Matadragones"
 nick_the_dragonslayer_desc:0 "Entrando en el reino del mito, el folclore acredita a [CHARACTER.GetShortUINameNoTooltipNoFormat|U] con la muerte de una gran bestia, estableciéndose como un héroe legendario."
 
 nick_natures_bane:0 "Azote de la Naturaleza"
 nick_natures_bane_desc:0 "Despejando vastos y antiguos bosques y drenando traicioneros pantanos, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] somete sin descanso la naturaleza salvaje para expandir la civilización."
 
 nick_the_stout:0 "el Robusto"
 nick_the_stout_desc:0 "Un identificador físico que señala la complexión ancha y robusta de [CHARACTER.GetShortUINameNoTooltipNoFormat|U], sugiriendo una constitución física resistente e inquebrantable."
 
 nick_chief_of_the_zanj:0 "Sahib az-Zanj"
 nick_chief_of_the_zanj_desc:0 "Liderando una de las revueltas de esclavos más masivas de la historia, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] se convirtió en el soberano indiscutible y libertador de los trabajadores zanj."
 
 nick_albaghid:0 "Albaghid"
 nick_albaghid_desc:0 "Que significa 'El Abominable', este título fue otorgado por las autoridades imperiales a [CHARACTER.GetShortUINameNoTooltipNoFormat|U] por liderar levantamientos incesantes, disruptivos y sumamente destructivos."
 
 nick_phrangopoulos:0 "Frangópulo"
 nick_phrangopoulos_desc:0 "Que significa 'Hijo de los Francos', este identificador griego resalta los distintos orígenes occidentales de [CHARACTER.GetShortUINameNoTooltipNoFormat|U] mientras sirve dentro de la esfera bizantina."
 
 
 nick_the_lazy:0 "el Perezoso"
 nick_the_lazy_desc:0 "Abandonando las responsabilidades de gobernar en favor del ocio, la apatía de [CHARACTER.GetShortUINameNoTooltipNoFormat|U] ha permitido que el reino se estanque."
 
 

 nick_the_stylite:0 "el Estilita"
 nick_the_stylite_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] es venerado por los fieles por emprender la extrema práctica ascética de vivir en lo alto de una columna, demostrando una profunda resistencia espiritual."
 
 nick_the_grazer:0 "el Pastor"
 nick_the_grazer_desc:1 "Adoptando el severo ascetismo de los 'boskoi', [CHARACTER.GetShortUINameNoTooltipNoFormat|U] abandonó la civilización para vivir en la naturaleza, subsistiendo únicamente de lo que la tierra provee."
 
 nick_the_iron_wearer:0 "el que Viste de Hierro"
 nick_the_iron_wearer_desc:1 "Un testimonio de extrema penitencia, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] mortificó físicamente su carne al portar pesadas cadenas de hierro, una señal muy visible de renuncia a lo mundano."

 nick_old_man_of_the_mountain:0 "el Viejo de la Montaña"
 nick_old_man_of_the_mountain_desc:1 "Un título de temor y reverencia, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] gobierna como el enigmático amo de una orden nizarí secreta, proyectando una influencia letal desde fortalezas montañosas inexpugnables."


 nick_danishmend:0 "Danişmend"
 nick_danishmend_desc:1 "Proveniente del término persa para 'erudito' o 'hombre sabio', este título honra la reconocida sabiduría, el saber religioso y el papel fundacional de [CHARACTER.GetShortUINameNoTooltipNoFormat|U] en el reino."

 nick_protosebastos:0 "Protosebasto"
 nick_protosebastos_desc:1 "Una exaltada dignidad cortesana bizantina que se traduce como 'Primer Venerable', elevando a [CHARACTER.GetShortUINameNoTooltipNoFormat|U] a los más altos escalones de proximidad y prestigio imperiales."

 nick_protosebaste:0 "Protosebasto"
 nick_protosebaste_desc:1 "Una exaltada dignidad cortesana bizantina que se traduce como 'Primer Venerable', elevando a [CHARACTER.GetShortUINameNoTooltipNoFormat|U] a los más altos escalones de proximidad y prestigio imperiales."

 nick_iscariot:0 "Iscariote"
 nick_iscariot_desc:1 "Un epíteto condenatorio extraído de la traición bíblica. Sus contemporáneos tachan a [CHARACTER.GetShortUINameNoTooltipNoFormat|U] de traidor que vendió a su señor, a su familia o a su fe por beneficio personal."

 nick_the_corpulent:0 "el Corpulento"
 nick_the_corpulent_desc:1 "Señalado en las crónicas de la época por su inmensa corpulencia física, esta se convirtió en un rasgo definitorio y ampliamente registrado de su reinado."

 nick_the_drunkard_michael_iii:0 "el Borracho"
 nick_the_drunkard_michael_iii_desc:1 "Un epíteto muy partidista, popularizado por dinastías rivales, destinado a deslegitimar el reinado de [CHARACTER.GetShortUINameNoTooltipNoFormat|U] presentándolo como irremediablemente adicto a la copa."
 
 nick_the_pious_michael_iii:0 "el Pío"
 nick_the_pious_michael_iii_desc:1 "Recordado favorablemente por los cronistas ortodoxos, este título reivindica a [CHARACTER.GetShortUINameNoTooltipNoFormat|U] por su papel fundamental en la restauración de la veneración de los iconos y la defensa de la verdadera fe."
 
 nick_the_young_michael_iii:0 "el Joven"
 nick_the_young_michael_iii_desc:1 "Coronado en la infancia y con un final temprano y violento, se recuerda a [CHARACTER.GetShortUINameNoTooltipNoFormat|U] con este título como una figura trágica que pasó su vida a la sombra de los regentes."
 
 
 nick_lackland_young:0 "Sin Tierra"
 nick_lackland_young_desc:1 "Un apelativo burlón aplicado en la juventud, ya que [CHARACTER.GetShortUINameNoTooltipNoFormat|U] quedó sin una herencia territorial sustancial en comparación con los vastos feudos de sus hermanos mayores."
 
 nick_lackland_ironic:0 "$nick_lackland_young$"
 nick_lackland_ironic_desc:1 "Inicialmente una cruel burla por su falta de herencia, el título se usa ahora irónicamente por los cronistas para resaltar la eventual adquisición de un vasto dominio por parte de [CHARACTER.GetShortUINameNoTooltipNoFormat|U]."
 
 nick_lackland_old:0 "$nick_lackland_young$"
 nick_lackland_old_desc:1 "Un título trágicamente profético. Aunque una vez gobernó un gran imperio, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] perdió vastas extensiones de territorio ancestral, terminando su reinado verdaderamente 'sin tierra'."
 

 nick_pauper_king:0 "el Rey Mendigo"
 nick_pauper_king_desc:1 "A pesar de ostentar el más alto cargo, se recuerda a [CHARACTER.GetShortUINameNoTooltipNoFormat|U] por adoptar los hábitos humildes, la vestimenta y la compañía del pueblo llano, ganándose el desconcierto de la nobleza."

 nick_the_mapmaker:0 "el Cartógrafo"
 nick_the_mapmaker_desc:1 "Célebre por patrocinar a cartógrafos y emprender extensos estudios geográficos, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] amplió el conocimiento del mundo conocido por el reino."

 nick_the_ploughman:0 "el Labrador"
 nick_the_ploughman_desc:1 "Arraigado en mitos fundacionales de la dinastía, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] es celebrado como un líder llamado directamente desde los campos, simbolizando un vínculo sagrado entre el gobernante y la tierra."
 
