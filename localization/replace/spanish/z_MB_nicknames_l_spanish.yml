 shogunate_nickname_desc_true_imperial_post: "\"[CHARACTER.GetNicknameNoTooltip]\" es el nombre de un cargo imperial. [CHARACTER.GetFirstNameNoTooltip] ocupa oficialmente el puesto, y todos llaman a [CHARACTER.GetHerHim] por ese nombre."
 shogunate_nickname_desc_false_imperial_post: "\"[CHARACTER.GetNicknameNoTooltip]\" es el nombre de un cargo imperial. Sin embargo, [CHARACTER.GetFirstNameNoTooltip] no ocupa oficialmente el puesto, por lo que [CHARACTER.GetSheHe] es autodenominado. En el período Sengoku, los samuráis a menudo se llamaban a sí mismos con rangos imperiales falsos (Buke-Kan'i)."
 shogunate_nickname_desc_azuma_hyakkan: "[CHARACTER.GetFirstNameNoTooltip] llama a [CHARACTER.GetHerHim] por el nombre parecido a un cargo imperial \"[CHARACTER.GetNicknameNoTooltip].\" Sin embargo, no es un puesto oficial, sino una imitación hecha en la región de Kanto. Generalmente lo llamamos Azuma-Hyakkan o Buke-Hyakkan."
 shogunate_nickname_desc_nickname: "[CHARACTER.GetFirstNameNoTooltip] llama a [CHARACTER.GetHerHim] por el apodo \"[CHARACTER.GetNicknameNoTooltip].\" Los japoneses medievales solían llamar a otros por apodos para evitar nombres verdaderos (Imina). Generalmente llamamos a los apodos Kemyo o Haikomei."
 shogunate_nickname_desc_catholic_name: "[CHARACTER.GetFirstNameNoTooltip] es conocido como un cristiano devoto, y [CHARACTER.GetSheHe] llama a [CHARACTER.GetHerHim] por el nombre bautismal \"[CHARACTER.GetNicknameNoTooltip].\""
 shogunate_nickname_desc_special: "Todos llaman a [CHARACTER.GetFirstNameNoTooltip] \"[CHARACTER.GetNicknameNoTooltip].\" Este nombre es único y especial, por lo que otros no pueden usarlo fácilmente."
