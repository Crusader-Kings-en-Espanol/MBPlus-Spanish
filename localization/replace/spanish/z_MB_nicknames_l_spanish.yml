 zhuifeng_decision: "Sellar a los Ancestros"
 death_miaohao.001.title: "Decidir el Nombre del Templo"
 death_miaohao.001.desc: "Escuché que la educación moral es más importante que la reforma diaria, y que el libro de los ritos no cae del cielo. Por lo tanto, el daño y beneficio de las dinastías pasadas pueden detenerse en cualquier momento. Pero el respeto por los ancestros es lo más importante en la corte imperial. Ahora, decidamos el nombre del templo para el emperador anterior."
