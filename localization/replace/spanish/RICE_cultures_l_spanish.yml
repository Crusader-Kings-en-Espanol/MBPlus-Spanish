 afro_roman_history_loc:0 "Formado a partir de [CULTURE.GetName] y púnico en el año 146 a.C."
 RICE_kinh_history_loc:0 "Formado a partir de [CULTURE.GetName] y [TARGET_CULTURE.GetName] en [Glossary( 'Vietnam', 'VIETNAMESE_GLOSS' )]"
 RICE_dorset_history_loc:0 "Los [Glossary( 'Tuniit', 'DORSET_GLOSS' )] son los antiguos habitantes del norte de Canadá y Groenlandia"
 RICE_inuit_history_loc:0 "Los [Glossary( 'Inuit', 'INUIT_GLOSS' )] son una reciente oleada de recién llegados al norte de Canadá y Groenlandia"
 RICE_laurentian_history_loc:0 "Los [Glossary( '$laurentian_collective_noun$', 'LAURENTIAN_GLOSS' )] son nativos del valle del río San Lorenzo."
 RICE_innu_history_loc:0 "Los [Glossary( '$innu_collective_noun$', 'INNU_GLOSS' )] son originarios de Labrador y Quebec"
 RICE_east_cree_history_loc:0 "Los [Glossary( '$east_cree_collective_noun$', 'EAST_CREE_GLOSS' )] son originarios de gran parte de Canadá"
 RICE_mikmaq_history_loc:0 "Los [Glossary( 'Mi’kmaq', 'MIKMAQ_GLOSS' )] son originarios de las provincias atlánticas de Canadá"
 RICE_maliseet_history_loc:0 "Los [Glossary( '$maliseet_collective_noun$', 'MALISEET_GLOSS' )] son originarios de Nuevo Brunswick, Quebec y Maine"
 RICE_passamaquoddy_history_loc:0 "Los [Glossary( '$passamaquoddy_collective_noun$', 'PASSAMAQUODDY_GLOSS' )] son originarios de Nuevo Brunswick y Maine"
 RICE_penobscot_history_loc:0 "Los [Glossary( '$penobscot_collective_noun$', 'PENOBSCOT_GLOSS' )] son originarios de Maine"
 RICE_abenaki_history_loc:0 "Los [Glossary( '$abenaki_collective_noun$', 'ABENAKI_GLOSS' )] son originarios de Maine, Vermont, Nuevo Hampshire y Quebec"
 RICE_beothuk_history_loc:0 "Los [Glossary( '$beothuk_collective_noun$', 'BEOTHUK_GLOSS' )] son originarios de Terranova"
 RICE_goliad_history_loc:0 "Descender de las tribus $baltic_group$ que viven en la cuenca del Dnieper en el primer milenio CE"
 RICE_chagga_history_loc:0 "Formado por los colonos $heritage_bantu_name$ alrededor del monte Kilimanjaro en el 2do milenio CE"
 RICE_nabati_history_loc:0 "Formado de los descendientes de los antiguos mesopotamios del sur"
 RICE_kutai_history_loc:0 "Se formó a partir de Dayaks en el este de Borneo con algunas influencias extranjeras"

 # Traditions
 tradition_RICE_siberian_survivalists_name:0 "Supervivencia Siberiana"
 tradition_RICE_siberian_survivalists_desc:1 "Desde tiempos inmemoriales, los pueblos de Siberia han vivido, sobrevivido y prosperado en las tierras heladas del lejano norte. Su conocimiento de la vida y la muerte en estas regiones les sirve bien."
 tradition_RICE_swahili_contacts_name:0 "Contactos Suajilis"
 tradition_RICE_swahili_contacts_desc:1 "Los pueblos de habla bantú de la costa suajili tienen siglos de experiencia explorando y aventurándose por las tierras e islas del lado oriental del Océano Índico."
 tradition_RICE_ubiquity_of_poetry_name:0 "Ubiquidad de la Poesía"
 tradition_RICE_ubiquity_of_poetry_desc:1 "Los vientos y las olas del Océano Índico llevan consigo no solo nuevos bienes y personas, sino también ideas e historias. Como resultado, la poesía está en todas partes para la gente de esta cultura: todos, desde el más humilde campesino hasta el monarca más poderoso, pueden ser escuchados recitando poesía en su vida diaria, y el lenguaje de las metáforas y el simbolismo es muy respetado."
 culture_parameter_unlock_rice_siberian_hunters:0 "Puede reclutar a [GetMaA('RICE_siberian_hunters').GetName] como [men_at_arms|E]"
 culture_parameter_unlock_rice_swahili_sailors:0 "Puede reclutar a [GetMaA('RICE_swahili_sailors').GetName] como [men_at_arms|E]"
 culture_parameter_unlock_rice_decision_poetry_contest:0 "Desbloquea la [activity|E] [GetActivityType('activity_RICE_socotra_host_poetry_contest').GetName]"
 tradition_RICE_xianbei_scions_name:0 "Descendientes de los Xianbei"
 tradition_RICE_xianbei_scions_desc:1 "Estas personas se ven a sí mismas como los verdaderos sucesores, directos o simbólicos, de los antiguos poderosos y temidos clanes nómadas Xianbei, particularmente la rama Murong. Salvaguardan hábilmente sus tradiciones nómadas mientras se adaptan a las costumbres de las tribus que gobiernan o viven cerca de ellas."
 culture_parameter_unlock_rice_decision_nadun_festival:0 "Desbloquea la [decision|E] $RICE_tuyuhun_attend_nadun_festival$"
 culture_parameter_unlock_rice_decision_restore_tuyuhun_kingdom:0 "Desbloquea la [decision|E] para $RICE_tuyuhun_restore_tuyuhun_kingdom$"
 culture_parameter_unlock_rice_travel_option_qinghaicong_horses:0 "Permite la [GetTravelOption('RICE_tuyuhun_qinghaicong_horses_option').GetName] [travel_option|E]"
 tradition_RICE_white_huns_name:0 "Hunos Blancos"
 tradition_RICE_white_huns_desc:0 "#F Estas personas descienden de temibles tribus de la estepa llamadas los Hunos Blancos por algunos, que invadieron Persia e India en la antigüedad tardía. Con su mezcla de influencias iraníes, hunas, túrquicas e indias, sus orígenes están envueltos en misterio. Se han asentado un poco, adoptando el comercio y nuevas creencias religiosas, pero su habilidad en la batalla aún es reconocida.#!"
 culture_parameter_unlock_rice_decision_hephthalite_empire:0 "Desbloquea las [decisions|E] para $RICE_pamir_reclaim_hephthalite_homeland$ y $RICE_pamir_restore_hephthalite_empire$"
 culture_parameter_unlock_cantiga_decisions:0 "Obtén las [decisions|E] para Componer [cantigas|E] y las Cantigas de Santa María, independientemente del [language|E] o [heritage|E] de tu [culture|E] (si se cumplen otros requisitos)"
 culture_parameter_better_cantiga_results:0 "[characters|E] de esta [culture|E] tienen una mejor oportunidad de componer [cantigas|E] de mayor [cantiga_quality|E]"
 #culture_parameter_more_frequent_cantiga_compositions:0 "Cooldown for composing [cantigas|E] is reduced by #P -20% #!"
 culture_parameter_promote_cantiga_bonuses:0 "Tomar la [decision|E] para $RICE_galicia_promote_cantiga$ proporciona más [piety|E] y [prestige|E], y los [artifacts|E] que crea tienen bonificaciones adicionales"
 # and to Compose the Cantigas de Santa Maria - NOT SECULAR?
 culture_parameter_unlock_rice_pamir_tribesmen:0 "Puede reclutar a [GetMaA('RICE_pamir_tribesmen').GetName] como [men_at_arms|E]"
 tradition_RICE_whalers_name:0 "Balleneros Experimentados"
 tradition_RICE_whalers_desc:0 "#F Esta cultura está bien versada en los métodos utilizados para cazar ballenas y cómo extraer carne y grasa de la ballena.#!"
 tradition_RICE_master_whalers_name:0 "Maestros Balleneros"
 tradition_RICE_master_whalers_desc:0 "#F No es una exageración decir que esta cultura comprende verdaderamente la caza de ballenas de una manera que pocos forasteros pueden. No solo son expertos en localizar y cazar ballenas, y procesar su carne y grasa, sino que también son emprendedores astutos, cuyos líderes están ansiosos por financiar la industria ballenera para lucrar con ella.#!"
 culture_parameter_unlock_rice_whaling:0 "Desbloquea la [decision|E] para $RICE_north_atlantic_whale_hunt$"
 culture_parameter_unlock_rice_whaling_stations:0 "Desbloquea las [decisions|E] para $RICE_north_atlantic_whale_exempt_tax$ y $RICE_north_atlantic_whale_levy_extra_tax$ para [rulers|E] de [counties|E] de esta [culture|E]"
 culture_parameter_unlock_rice_better_whaling:0 "Desbloquea la [decision|E] para $RICE_north_atlantic_whale_hunt$ y, en comparación con otras [cultures|E] que también tienen esta [decision|E], tiene mejores probabilidades de un resultado exitoso y podría ganar más [gold|E] si eso sucede"
 tradition_RICE_arctic_adaptations_name:0 "Adaptaciones Árticas"
 tradition_RICE_arctic_adaptations_desc:0 "#F A lo largo de los siglos, esta cultura ha desarrollado conocimientos y tradiciones que son esenciales para ayudarlos no solo a sobrevivir, sino a prosperar en las frías tierras y aguas de la región ártica.#!"
 culture_parameter_unlock_rice_arctic_innovations:0 "Desbloquea las [innovations|E] $innovation_RICE_dog_sleds$, $innovation_RICE_toggling_harpoons$, y $innovation_RICE_arctic_boats$ para esta [culture|E] en la [era|E] $culture_era_tribal$"
 RICE_greenland_negative_resource_mitigation_desc:0 "Reduce los efectos negativos de baja @RICE_greenland_resilience_icon! [greenland_resilience|E] y @RICE_greenland_networks_icon! [greenland_networks|E] en las [decisions|E] para [rulers|E] [struggle_involved|E] en la [RICE_greenland_struggle|E]"
 RICE_whale_success_bonus_desc:0 "Aumenta las posibilidades de éxito al tomar la [decision|E] para $RICE_north_atlantic_whale_hunt$"
 RICE_whale_cost_bonus_desc:0 "Reduce los costes de la [decision|E] para $RICE_north_atlantic_whale_hunt$"
 #RICE_expedition_success_bonus_desc:0 "Increases the chances of success for [greenland_expeditions|E] in the North Atlantic"
 RICE_expedition_cost_bonus_desc:0 "Reduce los costes de [greenland_expeditions|E] en el Atlántico Norte"
 tradition_RICE_seasonal_migrators_name:0 "Migradores Estacionales"
 tradition_RICE_seasonal_migrators_desc:0 "#F Esta cultura vive de manera sostenible observando el ciclo de las estaciones. En verano, la gente se queda cerca de cuerpos de agua como ríos, lagos y la costa para alimentarse de una dieta marina; en invierno, van al bosque a cazar y recolectar. Así, la vida se estructura en un claro ritmo binario.#!"
 tradition_RICE_red_ochre_name:0 "Pueblo del Ocre Rojo"
 tradition_RICE_red_ochre_desc:0 "#F El color rojo puede ser importante para muchas sociedades en todo el mundo, pero en esta cultura, tiene una posición preeminente. El ocre rojo se usa liberalmente para pintar todo, desde casas y armas hasta personas. Se usa como repelente de insectos, en rituales religiosos y como un indicador de que uno pertenece a la tribu; aquellos que son expulsados se les niega el derecho de usar esta pintura roja.#!"
 RICE_icelandic_history_loc:0 "Formado a partir de colonos $north_germanic_group$ y $goidelic_group$ en el año [DATE.GetYear]"
 tradition_RICE_boba_drinkers_name:0 "Bebedores de Boba"
 tradition_RICE_boba_drinkers_desc:0 "#F Boba, también conocido como té de burbujas o té de perlas, se consume regularmente por los miembros de esta cultura en varios contextos sociales y rituales. Por ejemplo, entre los jóvenes solteros de esta cultura, es común beberlo en grupo después de una gran comida.#!"
 tradition_RICE_music_practice_name:0 "Practicantes y Disfrutadores de Música"
 tradition_RICE_music_practice_desc:0 "#F Esta cultura cree que es importante practicar instrumentos clásicos regularmente, ya sea para enriquecimiento personal o para ganar estatus, independientemente de la habilidad musical real de uno. Por otro lado, los jóvenes de esta cultura a menudo disfrutan asistiendo a raves y escuchando música EDM. (Los miembros de esta cultura también, curiosamente, tienden a tener una mayor probabilidad de tener oído absoluto.)#!"
 culture_parameter_unlock_rice_edm_raves:0 "Desbloquea la [decision|E] para Asistir a un Rave de EDM y la [interaction|E] para pedirle a alguien que sea tu Rave Bae"
 culture_parameter_unlock_rice_music_practice:0 "Desbloquea la [decision|E] para Practicar un Instrumento y potencialmente ganar el [trait|E] [GetTrait('poet').GetName( GetPlayer )]"
 culture_parameter_unlock_rice_boba_drink:0 "Desbloquea la [decision|E] para Beber Boba para reducir [stress|E] o socializar con otros"
 culture_parameter_unlock_rice_kevin_nguyen_abg:0 "Desbloquea las [decisions|E] para Convertirse en un AGB o Kevin Nguyen y formar las [cultures|E] Kevin o ABG"
 tradition_RICE_kala_settlements_name:0 "Asentamientos Kala"
 tradition_RICE_kala_settlements_desc:0 "Las fronteras del mundo iraní y las estepas de Asia Central son tierras llenas de diferentes pueblos y estilos de vida que a menudo están en un estado de flujo. El conflicto es inevitable en estas tierras fronterizas, y esta cultura ha desarrollado una tradición de convertir sus asentamientos importantes en centros fortificados para proteger lo que es suyo y facilitar el comercio y el control político."
 culture_parameter_unlock_rice_kala_decision:0 "Desbloquea la [decision|E] para Reforzar Kalas"
 tradition_RICE_akhtarvenik_name:0 "Akhtarveniks"
 tradition_RICE_akhtarvenik_desc:0 "Desde tiempos antiguos, los pueblos de Khwarezm han sido reconocidos en todo el Medio Oriente y Asia Central por sus habilidades en astronomía, calendario y matemáticas. Akhtarvenik es el término tradicional Khwarezmiano para un astrónomo."
 tradition_RICE_khuzi_name:0 "Pueblo de Khuz"
 tradition_RICE_khuzi_desc:0 "Durante generaciones, los Khuzis han sido estigmatizados por sus vecinos, quienes incluso usan su nombre como un término de insulto. Muchos tienen trabajos serviles en las cortes de nobles y reyes poderosos, como asistentes de baño y nodrizas, lo que les otorga un grado de influencia entre bastidores."
 culture_parameter_khuzi_mechanic_1:0 "Todas las [cultures|E] descendientes de $khuzi$, y $khuzi$ en sí, ya sea que tengan esta [tradition|E] o no, obtienen automáticamente la [innovation|E] $innovation_RICE_khuzi$, que tiene efectos #N negativos#! como una reducción de [domain_limit|E], [diplomacy|E], y [prestige|E]"
 culture_parameter_khuzi_mechanic_2:0 "Al tomar la [decision|E] para $RICE_khuzestan_khuzi_status_decision$, no solo se elimina la [innovation|E] $innovation_RICE_khuzi$ de todas las [cultures|E] que la tienen, sino que esta [tradition|E] también se actualiza para proporcionar mejores bonificaciones"
 RICE_khuzi_mechanic_desc:0 "Esta [innovation|E] es obtenida automáticamente por las [cultures|E] con la [tradition|E] $tradition_RICE_khuzi_name$, o cualquier [cultures|E] descendiente de tal [culture|E], a menos que se tome la [decision|E] para $RICE_khuzestan_khuzi_status_decision$; hacerlo también eliminará esta [innovation|E] de todas las [cultures|E] que la tienen"
 # Their previous experiences as lowly menials at the courts of powerful nobles and royals have taught them much about politics, courtly life, art, and human nature.
 tradition_RICE_khuzi_elevated_elymaean_name:0 "Pueblo de Khuz"
 tradition_RICE_khuzi_elevated_elymaean_desc:0 "Los antepasados de esta cultura en Khuzestan fueron una vez estigmatizados por sus vecinos, quienes incluso usaban su nombre como un término de insulto. Sin embargo, con los recientes cambios políticos y sociales, estas personas se han reafirmado como un pueblo digno de respeto. Ahora emulan a sus predecesores inmediatos en la antigüedad, los Elimeos, que eran hábiles en la arquería y mantuvieron obstinadamente su independencia."
 tradition_RICE_khuzi_elevated_community_name:0 "Pueblo de Khuz"
 tradition_RICE_khuzi_elevated_community_desc:0 "Los antepasados de esta cultura en Khuzestan fueron una vez estigmatizados por sus vecinos, quienes incluso usaban su nombre como un término de insulto. Sin embargo, con los recientes cambios políticos y sociales, estas personas se han reafirmado como un pueblo digno de respeto. Durante demasiado tiempo, se les asoció con el rol de asistentes de baño, nodrizas y otros roles serviles. ¡Ahora serán reyes, filósofos y artistas!"
 tradition_RICE_khuzi_elevated_traders_name:0 "Pueblo de Khuz"
 tradition_RICE_khuzi_elevated_traders_desc:0 "Los antepasados de esta cultura en Khuzestan fueron una vez estigmatizados por sus vecinos, quienes incluso usaban su nombre como un término de insulto. Sin embargo, con los recientes cambios políticos y sociales, estas personas se han reafirmado como un pueblo digno de respeto. Reinvigorados, buscan aprovechar la histórica prosperidad agrícola y los lazos comerciales de Khuzestan con tierras lejanas para construir una nueva civilización."
 tradition_RICE_northmen_name:0 "Legado de los Hombres del Norte"
 tradition_RICE_northmen_desc:0 "Esta cultura desciende de una mezcla de colonos nórdicos y antiguos pueblos francos y celtas en Normandía. Los francos los ven como intrigantes de dos caras que podrían convertirse en bárbaros rapaces en cualquier momento, mientras que los escandinavos los ven como débiles que han olvidado sus formas ancestrales."
 tradition_RICE_adventurers_and_aristocrats_name:0 "Aventureros y Aristócratas"
 tradition_RICE_adventurers_and_aristocrats_desc:0 "Esta cultura desciende de una mezcla de colonos nórdicos y antiguos pueblos francos y celtas en Normandía. Combinan hábilmente lo mejor de las ideas y costumbres francas y escandinavas. Buscadores intrépidos de fama y gloria en la guerra, también son conocidos por su sociedad cosmopolita y piedad."
 culture_parameter_rice_cheaper_normandy_settlers:0 "Las [decisions|E] para Invitar Colonos Nórdicos y Normandos son más baratas (suponiendo que se cumplan otros requisitos)"
 culture_parameter_rice_norman_mechanic_1:0 "Esta [tradition|E] se actualizará a la [tradition|E] $tradition_RICE_adventurers_and_aristocrats_name$ si se toma la [decision|E] para $RICE_normandy_commission_historia_normannorum$"
 culture_parameter_rice_norman_mechanic_2:0 "Esta [tradition|E] se actualizará para proporcionar mejores bonificaciones si la [RICE_normandy_struggle|E] se resuelve con los finales $RICE_normandy_struggle_ending_conquest_decision$ o $RICE_normandy_struggle_ending_assimilation_decision$"
 not_bureaucratic_spiritual_or_courtly_desc:1 "La [culture|E] no tiene la [ethos|E] $ethos_bureaucratic_name$, $ethos_spiritual_name$ o $ethos_courtly_name$"
 culture_parameter_rice_norman_adventurers:1 "[rulers|E] pueden usar el [RICE_norman_adventure|E] [casus_belli|E] en las [eras|E] $culture_era_early_medieval$ y $culture_era_high_medieval$"
 tradition_RICE_adventurers_and_aristocrats_military_name:0 "$tradition_RICE_adventurers_and_aristocrats_name$"
 tradition_RICE_adventurers_and_aristocrats_military_desc:0 "$tradition_RICE_adventurers_and_aristocrats_desc$"
 tradition_RICE_adventurers_and_aristocrats_culture_name:0 "$tradition_RICE_adventurers_and_aristocrats_name$"
 tradition_RICE_adventurers_and_aristocrats_culture_desc:0 "$tradition_RICE_adventurers_and_aristocrats_desc$"
 culture_parameter_unlock_rice_norman_cavalry:0 "Puede reclutar a [GetMaA('RICE_norman_cavalry').GetName] como [men_at_arms|E]"
 culture_parameter_unlock_rice_tuareg_decision:0 "Desbloquea la [decision|E] para $RICE_tuareg_found_empire_of_air$"
 culture_parameter_unlock_rice_cheaper_dream_divination:0 "La [activity|E] $activity_RICE_tuareg_dream_incubation$ es más barata"
 tradition_RICE_tuareg_name:0 "Kel Tagelmust"
 tradition_RICE_tuareg_desc:0 "Esta cultura desciende de nómadas amazigh (o bereberes) intrépidos que se asentaron en el sur del Sahara y se organizan en torno a clanes matrilineales, o #italic tawshet#!. A menudo se llaman a sí mismos #italic Kel Tagelmust#! (entre otros nombres), o 'Gente del Velo', aludiendo a los distintivos velos turbantes de color azul o índigo que usan sus hombres."
 RICE_culture_in_africa_desc:1 "La [culture|E] no tiene #V 5%#! de sus [counties|E] en [GetGeographicalRegion('world_africa').GetName]"
 tradition_RICE_munya_estates_name:0 "Haciendas Munya"
 tradition_RICE_munya_estates_desc:0 "En las colinas y tierras de cultivo de [GetGeographicalRegion('world_europe_west_iberia').GetName], la gente de esta cultura construye grandes haciendas llamadas #italic munya#!. Además de su belleza arquitectónica, también sirven como lugares donde la gente puede relajarse, donde eruditos y poetas pueden mezclarse, y donde se realizan experimentos agrícolas y botánicos."
 culture_parameter_unlock_rice_munya_activity:0 "Desbloquea las [activities|E] para organizar vacaciones en una [munya|E], independientemente de tu [religion|E]"
 culture_parameter_unlock_rice_munya_activity_cost:0 "Reduce los costes de las vacaciones en [munya|E]"
 culture_parameter_unlock_rice_munya_activity_private_variety:0 "Desbloquea las opciones de actividad #V $RICE_granada_munya_vacation_private_type_agriculture$#! y #V $RICE_granada_munya_vacation_private_type_botany$#! para la [activity|E] [GetActivityType('activity_RICE_granada_munya_vacation_private').GetName]"
 culture_parameter_unlock_rice_munya_activity_group_variety:0 "Desbloquea las opciones de actividad #V $RICE_granada_munya_vacation_group_type_gardens$#! y #V $RICE_granada_munya_vacation_group_type_poetry$#! para la [activity|E] [GetActivityType('activity_RICE_granada_munya_vacation_group').GetName]"
 tradition_RICE_cave_dwellers_name:0 "Habitantes de Cuevas"
 tradition_RICE_cave_dwellers_desc:0 "Esta cultura hace un uso extensivo de cuevas y abrigos rocosos para varios propósitos. Algunos en esta cultura incluso prefieren vivir en estos lugares."
 tradition_RICE_wewas_name:0 "Sistemas Wewa"
 tradition_RICE_wewas_desc:0 "Esta cultura, que tiene orígenes o influencias de Sri Lanka, ha refinado las técnicas utilizadas para crear tanques de riego en todo el subcontinente indio. En Sri Lanka, estos tanques, conocidos como wewas, se construyen en grandes cantidades y con un alto nivel de sofisticación en ingeniería y administración."
 tradition_RICE_stepwells_name:0 "Constructores de Pozos Escalonados"
 tradition_RICE_stepwells_desc:0 "Los pozos escalonados son pozos resistentes con un corredor de escalones que desciende hasta el nivel del agua, que proporcionan agua confiable para la agricultura, pero también sirven como lugares de culto, ocio y baño. Aunque son construidos por muchas culturas del subcontinente indio, esta cultura es conocida por construir muchos de estos pozos escalonados, incluyendo algunos de los más grandes de la región."
 tradition_RICE_zimbabwe_name:0 "Zimbabwes"
 tradition_RICE_zimbabwe_desc:0 "Los asentamientos de esta cultura, llamados Zimbabwes, están construidos utilizando técnicas avanzadas de trabajo en piedra que no requieren ningún mortero. Una característica prominente de estos sitios son sus altas paredes de piedra."
 tradition_RICE_bantu_migrators_name:0 "Migradores Bantú"
 tradition_RICE_bantu_migrators_desc:0 "Esta cultura es parte del mayor paraguas de varios pueblos bantúes que, a lo largo de su historia, han participado en muchas migraciones a través de África."
 culture_parameter_unlock_rice_maa_bantu_warriors:0 "Puede reclutar a [GetMaA('RICE_bantu_warriors').GetName] como [men_at_arms|E]"
 tradition_RICE_cattle_kraals_name:0 "Corrales de Ganado"
 tradition_RICE_cattle_kraals_desc:0 "La gente de esta cultura a menudo vive en grupos de hogares adjuntos a un #italic kraal#!, un gran recinto para ganado, especialmente ganado que es muy venerado. El kraal está rodeado por cercas hechas de madera, barro, ramas de arbustos espinosos y otros materiales."
 #tradition_RICE_nine_tribes_name:0 "Nine Tribes"
 #tradition_RICE_nine_tribes_desc:0 "The settlements of this culture, called Zimbabwes, are built using advanced stone-working techniques that do not require any mortar. A prominent feature of these sites are their tall stone walls."
 culture_parameter_unlock_rice_activity_zapust_festival:0 "Desbloquea la [activity|E] [GetActivityType('activity_RICE_polabian_zapust_festival').GetName]"
 tradition_EEE_people_of_boika_name:0 "Pueblo de Boika"
 tradition_EEE_people_of_boika_desc:0 "La gente de esta cultura ha estado viviendo en la tierra de Boika durante generaciones, soportando muchas dificultades para llamar a este lugar su hogar."
 tradition_RICE_judicati_name:0 "Judicati"
 tradition_RICE_judicati_desc:0 "Los gobernantes locales de esta cultura son llamados Jueces (o #italic Judicati#!); tales juzgados, y las comunidades que gobiernan, derivan legalmente y están influenciados por las tradiciones políticas y culturales de Bizancio. El juez no es un gobernante absoluto, ya que responde ante un consejo compuesto por consejeros locales, nobles y clérigos, y puede ser destronado o incluso ejecutado por sus súbditos por tiranía."
 culture_parameter_unlock_rice_judicati_upgrade:0 "Esta [tradition|E] se actualizará con mejores bonificaciones si un [ruler|E] poderoso en [GetGeographicalRegion('RICE_sardinia_region').GetName] toma la [decision|E] para $RICE_sardinia_decide_sardinia_orientation$"
 tradition_RICE_judicati_catholic_name:0 "Latino $tradition_RICE_judicati_name$"
 tradition_RICE_judicati_catholic_desc:0 "$tradition_RICE_judicati_desc$ Con el tiempo, los #italic Judicati#! han construido lazos con el Occidente Latino."
 culture_parameter_unlock_rice_judicati_catholic_decision:0 "Desbloquea la [decision|E] para $RICE_sardinia_catholic_decision$, que proporciona el [county_modifier|E] [GetModifier('RICE_sardinia_latin_monks').GetNameWithTooltip], entre otras bonificaciones"
 tradition_RICE_judicati_orthodox_name:0 "Bizantino $tradition_RICE_judicati_name$"
 tradition_RICE_judicati_orthodox_desc:0 "$tradition_RICE_judicati_desc$ Con el tiempo, los #italic Judicati#! han reconstruido sus lazos con el Oriente Griego."
 culture_parameter_unlock_rice_judicati_orthodox_decision:0 "Desbloquea la [decision|E] para $RICE_sardinia_orthodox_decision$, que proporciona el [county_modifier|E] [GetModifier('RICE_sardinia_byzantine_administration').GetNameWithTooltip], entre otras bonificaciones"
 tradition_RICE_judicati_north_african_name:0 "Norteafricano $tradition_RICE_judicati_name$"
 tradition_RICE_judicati_north_african_desc:0 "$tradition_RICE_judicati_desc$ Con el tiempo, los #italic Judicati#! han construido lazos con el Norte de África."
 culture_parameter_unlock_rice_judicati_north_african_decision:0 "Desbloquea la [decision|E] para $RICE_sardinia_north_african_decision$, que proporciona el [county_modifier|E] [GetModifier('RICE_sardinia_north_african_networks').GetNameWithTooltip], entre otras bonificaciones"
 tradition_RICE_judicati_none_name:0 "Independiente $tradition_RICE_judicati_name$"
 tradition_RICE_judicati_none_desc:0 "$tradition_RICE_judicati_desc$ Con el tiempo, los #italic Judicati#! a menudo se han negado a vincularse demasiado estrechamente con otras regiones, manteniendo su independencia en espíritu y mente, si no en realidad."
 culture_parameter_unlock_rice_judicati_none_decision:0 "Desbloquea la [decision|E] para $RICE_sardinia_none_decision$, que proporciona el [county_modifier|E] [GetModifier('RICE_sardinia_none_fortifications').GetNameWithTooltip], entre otras bonificaciones"
 culture_parameter_unlock_rice_condaghes_innovation:0 "Esta tradición permite a una [culture|E] desbloquear la [innovation|E] #V $innovation_RICE_condaghes$#! en la [era|E] $culture_era_early_medieval$"
 culture_parameter_unlock_tfe_cheaper_qanats:0 "Los costes de tomar la [decision|E] para #V $RICE_yazd_build_a_new_qanat$#! se reducen"
 tradition_RICE_between_three_worlds_name:0 "Entre Tres Mundos"
 tradition_RICE_between_three_worlds_desc:0 "Esta cultura nació en la región fronteriza de [GetGeographicalRegion('custom_sicily').GetNameNoTooltip], que se encuentra en la encrucijada entre el Islam, Bizancio y el Occidente Latino. Su gente está profundamente influenciada por los tres, y sabe cómo navegar por el a veces confuso paisaje político del Mediterráneo."
 culture_parameter_unlock_rice_sicilian_trait_bonuses:0 "El [trait|E] [GetTrait('RICE_sicilian_ruler').GetName( GetNullCharacter )] proporciona bonificaciones adicionales"
 culture_parameter_unlock_rice_sicilian_recruit_soldiers_bonuses:0 "La [decision|E] de $RICE_sicily_recruit_soldiers_decision$ es más probable que cause que aparezca un [county_modifier|E] [sicily_stronghold|E]"
 culture_parameter_unlock_rice_sicilian_request_expedition_bonuses:0 "La [interaction|E] de $RICE_request_sicily_intervention_interaction$ es más barata"
 culture_parameter_unlock_rice_sicilian_bargain_bonuses:0 "La [decision|E] de Negociar con [sicily_strongholds|E] tiene una mayor probabilidad de éxito"
 tradition_RICE_longbeards_name:0 "Barbas Largas"
 tradition_RICE_longbeards_desc:0 "Los ancestros de esta cultura recibieron su nombre, los Barbas Largas, por sus distintivas barbas largas. Estas barbas eran un símbolo orgulloso de la tenacidad y la obstinada independencia de los Barbas Largas y sus descendientes frente a cualquier amenaza a su libertad, incluso si esas amenazas venían de sus propios parientes."
 culture_parameter_unlock_rice_maa_sicily_bowmen:0 "Puede reclutar [GetMaA('RICE_sicily_bowmen').GetName] como [men_at_arms|E]"
 culture_parameter_unlock_rice_sicilian_grain_tradition_bonuses:0 "Aumento del [prestige_i|E] [prestige|E] cuando envíes [sicily_grain|E] a otros [rulers|E] a través de [interaction|E]"
 tradition_RICE_mediterranean_masserie_name:0 "Masserie Mediterráneas"
 tradition_RICE_mediterranean_masserie_desc:0 "Las tierras fértiles en esta cultura, originalmente arraigada en el sur de Italia, están salpicadas de #italic masserie#!, un tipo de explotaciones agrícolas que forman parte de un sistema agrícola que gestiona eficientemente la producción y el comercio de productos ganaderos, cereales, aceite de oliva y más."
 culture_parameter_unlock_rice_maa_arimanni:0 "Puedes reclutar a [GetMaA('RICE_arimanni').GetName] como [men_at_arms|E]"
 tradition_RICE_berber_marignal_tribalism_name:0 "Makhazen y Siba"
 tradition_RICE_berber_marignal_tribalism_desc:0 "Los orígenes de estos pueblos bereberes provienen de las tierras interiores entre #italic Makhazen#! - "el pale," es decir, las regiones costeras del norte de África, gobernadas por el estado - y #italic Siba#!, la periferia no gobernada más allá del pale. Son cautelosos y rechazarán el gobierno centralizado si eso se ajusta a sus intereses."
 tradition_RICE_contentious_colonizers_name:0 "Colonizadores Conflictivos"
 tradition_RICE_contentious_colonizers_desc:0 "Esta cultura se formó a partir de una mezcla caótica pero fructífera de colonos y pioneros, así como de grupos indígenas establecidos desde hace mucho tiempo, de diferentes culturas, credos y clases sociales. Aunque los forasteros los ven como propensos a la rebelión y carentes de disciplina religiosa, su diversidad y autosuficiencia también son una fuente de fortaleza."
 tradition_RICE_image_of_china_name:0 "Imagen de China"
 tradition_RICE_image_of_china_desc:0 "Aunque los antepasados de esta cultura no eran originalmente chinos, sus descendientes han adoptado a fondo muchas costumbres y prácticas asociadas con China, en particular en la gobernanza. Los forasteros los han asociado con sus ideales de la sociedad china, los gobernantes creyentes de esta cultura son justos, aprendidos y sofisticados."
 tradition_RICE_zhangzhung_stonework_name:0 "Auspicious Mountain Stonework"
 tradition_RICE_zhangzhung_stonework_desc:1 "Esta cultura construye estructuras de piedra entera que a menudo son talladas en las montañas y cuevas de las tierras altas de Himalayan. Muchos de estos edificios tienen importantes funciones rituales, en particular el #italic sekhang #! o #italic sekhar #! (casa o castillo de los dioses)."
 culture_parameter_unlock_rice_zhangzhung_stone_decision:1 "Desbloquea el [decision|E] a #V $RICE_zhangzhung_supplicate_ancient_pillars$ #! fuera de [GetGeographicalRegion('RICE_upper_tibet').GetName]"
 culture_parameter_improved_rice_zhangzhung_stone_decision:1 "Mejores posibilidades de #P buenos resultados #! al tomar el [decision|E] a #V $RICE_zhangzhung_supplicate_ancient_pillars$ #!"
 culture_parameter_unlock_rice_restore_zhangzhung_decision:1 "Desbloquea el [decision|E] a #V Rebuild el castillo de plata #! para [independent|E] [kings|E] y [emperors|E]"
 tradition_RICE_changthang_nomads_name:0 "Changthang Nomads"
 tradition_RICE_changthang_nomads_desc:1 "Los nómadas ubicuos de los Himalayas son llamados #italic drokpas#!. El #italic drokpas#! que forman parte de esta cultura, y que se originaron en las duras tierras de Changthang en el Tíbet Alto y Ladakh, son respetados por su dureza y piedad, y temidos por su valentía despiadado. Atravesan terrenos escarpados para cazar, ir en peregrinación, y participar en el comercio de larga distancia como pocos otros pueden."
 culture_parameter_unlock_rice_maa_drokpa_horsemen:1 "Puede reclutar [GetMaA('RICE_drokpa_horsemen').GetName] como [men_at_arms|E]"
 culture_parameter_unlock_rice_better_salt_trade_decision:1 "Posibilidades más altas de un resultado exitoso, y de obtener más [gold_i|E] [gold|E] , desde el [decision|E] a #V $RICE_zhangzhung_western_tibet_salt_decision$ #!"
 culture_parameter_unlock_rice_piety_when_traveling_for_activity:1 "Ganar una cantidad aleatoria de [piety|E] entre [piety_i|E] #V 1#! y [piety_i|E] #V [EmptyScope.ScriptValue('medium_piety_gain')|0]#! cada vez que empiezas [traveling|E] para una [activity|E]"
 tradition_RICE_gandharan_art_name:0 "Arte Gandharan"
 tradition_RICE_gandharan_art_desc:1 "El estilo artístico de esta cultura es descendido de un sincretismo de arte helénico e indico que data de tiempos antiguos. Este estilo artístico, que está fuertemente ligado a la herencia religiosa de esta cultura, ha sido una influencia importante en tierras lejanas."
 tradition_brus_river_lifeblood_name:0 "Land of Towns"
 tradition_brus_river_lifeblood_desc:0 "Los Varangians llamaron nuestras tierras #italic Garðaríki, #! 'la tierra de las ciudades', para los muchos asentamientos que construimos a lo largo de las rutas comerciales, flanqueados por los grandes ríos que formaron a nuestro pueblo con su ferry de riqueza y guerra."
 culture_parameter_rice_portage_decision_bonus:0 "El [decision|E] a #bold $RICE_develop_portage_routes$ #! cuesta menos [gold_i|E] [gold|E] y se puede hacer cada #V 5 #! años en lugar de 10"
 culture_parameter_rice_volga_dnieper_merchant_spawn_bonus:0 "Aumenta las posibilidades [volga_dnieper_merchants|E] en su [court|E] , especialmente después de tomar el [decision|E] a $RICE_develop_portage_routes$ si su [realm_capital|E] está situado en el [GetGeographicalRegion('RICE_volga_dnieper_trade_region').GetName]"
 culture_parameter_unlock_rice_maa_iron_forest:0 "Puede reclutar [GetMaA('RICE_iron_forest').GetName] como [men_at_arms|E]"
 tradition_RICE_scribes_of_the_steppe_name:0 "Cunas de la estepa"
 tradition_RICE_scribes_of_the_steppe_desc:0 "#F Aunque estos pueblos eran originalmente nómadas de estepa, sus antepasados aprendieron y dominaron el arte de escribir después de entrar en contacto con las civilizaciones de la Ruta de la Seda. Son reconocidos por su conocimiento y alfabetización. #!"
 tradition_RICE_royal_physicians_name:0 "Médicos Reales"
 tradition_RICE_royal_physicians_desc:0 "#F Esta cultura ha producido muchos doctores aprendidos, así como escribas y hombres santos, que son empleados popularmente en tribunales extranjeros. #!"
 culture_parameter_unlock_rice_better_local_pilgrimage_memorialization_prestige:0 "El #V Memorialización#! [activity_option|E] para [local_pilgrimages|E] Prestaciones #P doble#! [prestige_i|E] [prestige|E]"
 tradition_RICE_heirs_of_kush_name:0 "Herederos de Kush"
 tradition_RICE_heirs_of_kush_desc:0 "#F Estas personas son, ya sea por sangre o en espíritu, los sucesores culturales del antiguo reino de Kush. Ellos continúan su legado al continuar sus costumbres y prácticas de varias maneras, incluso si en forma modificada. #!"
 tradition_RICE_nuba_sports_competitions_name:0 "Atletas pasionadas"
 tradition_RICE_nuba_sports_competitions_desc:0 "#F La gente de esta cultura tiene altos estándares para la aptitud y la belleza. A menudo acogen competiciones deportivas ritualizadas, y disfrutan de la mayor parte del espectáculo de lucha y lucha de palos, que sobresalen y han sido famosos por tan lejos como los días de los faraones. #!"
 tradition_RICE_spear_masters_name:0 "Maestros de Spear"
 tradition_RICE_spear_masters_competitions_desc:0 "#F Aunque la gente de esta cultura prefiere vivir como independiente, clanes descentralizados, están dominados por una clase de personas llamadas #italic Spear Masters #! , o #italic Masters of the Fishing Spear #! , que proporcionan liderazgo religioso, manejar el sacrificio de los bueyes, mediate disputes, y guiarlos en la guerra ritual. #!"
 culture_parameter_unlock_rice_sabir_activity:0 "Desbloquea el [GetActivityType('activity_RICE_nubia_sibir_festival').GetName] [activity|E]"
 culture_parameter_unlock_rice_nilotic_sacrifice_activity:0 "Desbloquea el #V Bovine Sacrifice #! [activity|E] independientemente de [faith|E]"
 culture_parameter_unlock_rice_cattle_raid_intent:0 "Desbloquea el #V $RICE_cattle_raid_intent$ #! [raid_intent|E]"
 tradition_RICE_cattle_economy_name:0 "Cattle Economy"
 tradition_RICE_cattle_economy_desc:0 "#F La gente de esta cultura hará mucho para proteger su propio ganado que colocan gran valor en como símbolo de prestigio y estatus. Incluso tomarán el ganado de sus enemigos en redadas y guerra ritualizada. #!"
 tradition_RICE_darfur_mountain_palaces_name:0 "Palacios en las Montañas"
 tradition_RICE_darfur_mountain_palaces_desc:0 "#F Aunque a menudo difuntos como tiranos brutales, egoístas, a caballo por sus enemigos, los gobernantes de Darfur, sin importar su origen, han aprendido a dominar el arte de construir palacios poderosos, obras defensivas, terrazas agrícolas y ciudades prósperas en esta región montañosa durante los siglos. #!"
 culture_parameter_unlock_rice_decision_nubian_agriculture:0 "Desbloquea el [decision|E] a #V $RICE_nubia_agriculture_decision$ #!"
 culture_parameter_unlock_rice_nile_pastoralist_farmer_bonus_prestige:0 "El [decisions|E] para interactuar con las comunidades locales #V Agrarian #! y #V Pastoralista #! a lo largo de [RICE_nile_river|E] dan bono [prestige_i|E] [prestige|E] dependiendo de su [rank|E]"
 culture_parameter_unlock_rice_nilotic_raiders:0 "Puede reclutar [GetMaA('RICE_nilotic_raiders').GetName] como [men_at_arms|E] ."
 culture_parameter_unlock_rice_sudanese_highlanders:0 "Puede reclutar [GetMaA('RICE_sudanese_highlanders').GetName] como [men_at_arms|E] ."
 culture_parameter_unlock_rice_tebeldi_trees_piety:0 "La [decision|E] de #bold $RICE_nubia_tebeldi_trees_decision$#! en la [region|E] de [GetGeographicalRegion('RICE_greater_darfur').GetName] otorga [prestige_i|E] [prestige|E] adicional"
 culture_parameter_unlock_rice_lake_oracles_activity:0 "Desbloquea el [decision|E] a #V $RICE_nubia_lake_oracle_decision$ #! independientemente de [faith|E]"
 culture_parameter_unlock_rice_alodian_cavalry:0 "Puede reclutar [GetMaA('RICE_alodian_cavalry').GetName] como [men_at_arms|E] ."
 tradition_RICE_nilotic_migrators_name:0 "Nilotic Settlers"
 tradition_RICE_nilotic_migrators_desc:0 "#F La gente de esta cultura, cuyos antepasados se originan del valle del río Nilo meridional, han estado involucrados en grandes migraciones a través de las sabanas y las tierras altas de África oriental durante siglos. #!"
 culture_parameter_unlock_rice_cattle_economy_interactions:0 "Desbloquea el [interactions|E] a #bold Demanda #! o #bold Oferta Compensación de la botella #!"
 tradition_RICE_rainforest_ritualists_name:0 "Rainforest Ritualists"
 tradition_RICE_rainforest_ritualists_desc:0 "#F Estas personas de origen de la selva creen que para evitar el peligro espiritual y no socavar [Glossary( 'slamad', 'SLAMAD_GLOSS' )], hay que observar ciertos rituales y tabúes, en particular el tabú en frustrar los deseos de otras personas y espíritus. Para los forasteros, sin embargo, estas personas parecen poseer habilidad sobrenatural en sobrevivir la selva y extraer recursos abundantes de ella. #!"
 culture_parameter_unlock_rice_aslian_blood_decision:0 "Desbloquea el [decision|E] a #bold $RICE_aslian_blood_sacrifice_decision$ #! independientemente de [faith|E]"
 culture_parameter_unlock_rice_southeast_asian_gather_tropical_goods_decision:0 "Desbloquea el [decision|E] a #bold $RICE_SEA_harvest_rare_tropical_goods_decision$ #!"
 culture_parameter_unlock_rice_southeast_asian_gather_tropical_goods_interaction:0 "$culture_parameter_unlock_rice_southeast_asian_gather_tropical_goods_decision$"
 culture_parameter_unlock_rice_southeast_asian_trade_tropical_goods_interaction:0 "Desbloquea el [interaction|E] a #bold Exchange Rare Tropical Goods #! con otros [rulers|E]"
 tradition_RICE_tropical_purveyors_name:0 "Purveyors tropicales"
 tradition_RICE_tropical_purveyors_desc:0 "#F Durante generaciones, estas personas han perfeccionado sus conocimientos sobre las selvas tropicales del sudeste asiático. Son especialmente buenas para encontrar y cosechar productos tropicales raros como especias y plantas medicinales y desempeñan un papel importante en la exportación de estos productos a través de las rutas comerciales marítimas del Océano Índico. #!"
 tradition_RICE_fear_of_spirits_name:0 "El miedo de los Espíritus"
 tradition_RICE_fear_of_spirits_desc:0 "#F Independientemente de su afiliación religiosa, las personas de esta cultura ven los espíritus del mundo, incluso benevolentes, con gran desconfianza y precaución. Además de los rituales religiosos para defenderse de los espíritus, esta cultura también a menudo se dedica a medidas prácticas como defensas construidas rápidamente, o una tendencia a evitar viajar durante la noche o en zonas traicioneras, para protegerse de espíritus peligrosos. #!"
 tradition_RICE_sea_nomads_name:0 "Sea Nomads"
 tradition_RICE_sea_nomads_desc:0 "#F Hay quienes afirman vivir una vida marítima, navegando barcos aquí y allá, pero simplemente adoptaron el mar. La gente de esta cultura nace literalmente en las aguas, y moldeada por ella: todas sus vidas, ellos vagan los océanos en sus naves o viven en pueblos flotantes. #!"
 culture_parameter_unlock_rice_sea_nomads_travel_option:0 "Desbloquea el $RICE_sea_nomads_option$ [travel_option|E] independientemente de la ubicación"
 culture_parameter_unlock_rice_sea_nomads_travel_option_free:0 "El $RICE_sea_nomads_option$ [travel_option|E] es siempre gratuito"
 culture_parameter_unlock_rice_sea_nomads_decision:0 "Desbloquea el [decision|E] a #bold $RICE_SEA_manage_sea_lanes$ #!"
 tradition_RICE_brehon_law_name:0 "Leyes de Brehon"
 tradition_RICE_brehon_law_desc:0 "#F Las antiguas leyes de Irlanda se originaron de la tradición oral que posteriormente fueron escritas, y son administradas por #italic Brehons #! , que preservan e interpretan la ley como árbitros. Sirven a los diversos clanes que forman la base de la sociedad de esta cultura. #!"
 RICE_bog_butter_decisions_unlock:1 "Desbloquea el [decision|E] a #bold $RICE_mayo_bury_bog_butter$ #!"
 RICE_butter_interaction_unlock:1 "Desbloquea el [decision|E] a #bold $RICE_mayo_retrieve_bog_butter$ #!"
 #RICE_butter_interaction_unlock:1 "Unlocks the [interaction|E] to #bold $RICE_mayo_butter_interaction$#! regardless of your [culture_possessive|E] [traditions|E]"
 RICE_butter_decision_bonus:1 "El [decision|E] a #bold $RICE_mayo_retrieve_bog_butter$ #! ofrece bonos [prestige_i|E] [prestige|E]"
 culture_parameter_unlock_rice_butter_interaction:0 "Desbloquea el [interaction|E] a #bold $RICE_mayo_butter_interaction$ #!"
 culture_parameter_unlock_rice_gaelicization_mechanic:0 "[rulers|E] cuyo [capital|E] o [domicile|E] están en [counties|E] de este [culture|E] puede tomar el [decision|E] a #bold $RICE_embrace_gaelicization$ #!"
 culture_parameter_unlock_rice_bog_butter_bonus_prestige:0 "$RICE_butter_decision_bonus$"
 tradition_RICE_sorcerous_corsairs_name:0 "Herrosos Corsairs"
 tradition_RICE_sorcerous_corsairs_desc:0 "#F Extranjeros ven a la gente y las tierras de esta cultura con miedo, hablando en susurros destrozados sobre cómo son poderosos magos y piratas despiadados que harán cualquier cosa para proteger las islas y costas que llaman hogar. #!"
 culture_parameter_unlock_rice_insular_sorcery_decision:0 "Desbloquea los mecánicos [RICE_socotra_sorcery|E] únicos como el [decision|E] a #V $RICE_socotra_cast_insular_sorcery$ #! y el [GetTrait('RICE_socotra_sorcerer').GetName( GetNullCharacter )] [trait|E]"
 culture_parameter_unlock_rice_moon_sacrifice_decision:0 "Desbloquea el [decision|E] a #V $RICE_socotra_moon_sacrifice$ #!"
 culture_parameter_unlock_rice_enables_pirate_options_by_default:0 "Todas las opciones para el [decision|E] a #V $RICE_pirate_indian_ocean_decision$ #! no requieren que usted establezca relaciones primero"
 tradition_RICE_honorable_marauders_name:0 "Honorable Marauders"
 tradition_RICE_honorable_marauders_desc:0 "#F Desde tiempos antiguos, los vecinos de esta cultura han temido sus rápidas y brutales redadas. Sin embargo, a pesar de esto, esta cultura se adhiere a un estricto código de conducta, [Glossary( 'salif', 'SALIF_GLOSS' )], que enfatiza la hospitalidad, el diálogo y el autocontrol, incluso cuando libra la guerra. #!"
 culture_parameter_unlock_rice_sycamore_tree_decision:0 "Desbloquea el [decision|E] a #V $RICE_south_ethiopia_pray_to_a_sycamore_tree$ #!"
 tradition_RICE_toloka_name:0 "Toloka"
 tradition_RICE_toloka_desc:0 "#F Esta cultura tiene una tradición de trabajo recíproco y comunal donde las personas en un pueblo se ayudarán mutuamente con diversos esfuerzos importantes, tales como la construcción de casas o cosecha de cultivos. Después de la labor se hace, el principal beneficiario de la ayuda gracias a todos con una fiesta. #!"
 tradition_SEA_ade_name:0 "Ade"
 tradition_SEA_ade_desc:0 "Esta cultura tiene una colección de leyes no escritas llamadas [Glossary( 'Ade', 'ADE_GLOSS' )], que dicta cada aspecto de la vida. Aquellos que lo siguen gozan de gran respeto, y se celebran y adoran; aquellos que la violan repetidamente deben ser ostracizados por todos, como si ni siquiera existieran."
 tradition_RICE_enthusiastic_debaters_name:0 "Debates entusiásticos"
 tradition_RICE_enthusiastic_debaters_desc:0 "La gente de esta cultura disfruta de debatir sobre la verdad de las cosas. Incluso cuando se trata de una trivia inconsecuente, ellos saldrán de su camino para encontrar evidencias que respaldan sus argumentos."
 tradition_RICE_marine_armor_name:0 "Armadura marina"
 tradition_RICE_marine_armor_desc:0 "Contrariamente a la suposición algunos sostienen que los habitantes de las costas prefieren luchar ligeramente blindados, esta cultura ha dominado el arte de elaborar armaduras versátiles que se adapten al combate en entornos marítimos mientras que todavía proporciona una protección adecuada."
 tradition_RICE_bronze_drum_conoisseurs_name:0 "Bronce Drum Conoisseurs"
 tradition_RICE_bronze_drum_conoisseurs_desc:0 "Los tambores de bronce se encuentran en todo el sudeste asiático, ya sea en forma de una tradición viva, o como antiguas reliquias descubiertas en el suelo. Esta cultura pone gran importancia ritual en estos tambores, que se ven como una fuente importante de poder político y espiritual."




