 # south_arabian_desc:0 "#emphasis Historical Context:#! "South Arabian" here refers to speakers of the so-called Modern South Arabian Languages (MSAL), including Mehri and Soqotri. MSAL is not to be confused with the Old South Arabian Languages (OSAL) such as Sabaean or Himyarite, as MSAL is actually more closely related to the Ethiopian branch of the Semitic languages. Al-Hamdani, a 10th century Yemeni Arab polymath and geographer, mentioned that people in what is nowadays eastern Yemen to have spoken an incomprehensible language to Arab ears. Besides linguistic differences, MSAL speakers also have a number of cultural differences as well, such as differing approaches to poetry compared to their Arab cousins."

