 # Game Concepts
 game_concept_heritages: "Herencias"

 game_concept_heritage_family: "Familia patrimonial"
 game_concept_heritage_families: "Familias patrimoniales"
 game_concept_heritage_family_desc: "Las familias de herencia son agrupaciones de [heritages|E] relacionadas. Una Familia patrimonial compartida aumenta la línea de base [cultural_acceptance|E]."

 game_concept_heritage_group: "Grupo de Herencia"
 game_concept_heritage_groups: "Grupos de herencia"
 game_concept_heritage_group_desc: "Los Grupos de Herencia son agrupaciones de [heritages|E] relacionados. Un grupo de herencias compartidas aumenta la línea de base [cultural_acceptance|E]."

 game_concept_heritage_kulturbund: "Kulturbund"
 game_concept_kulturbund: "$game_concept_heritage_kulturbund$"
 game_concept_heritage_kulturbunds: "Kulturbunds"
 game_concept_heritage_kulturbund_desc: "Los #kulturbunds itálicos son asociaciones de herencias que, aunque distintas, tienen un gran número de similitudes (por ejemplo, las culturas turco-mongolas). Un #Kulturbund#! compartido aumenta la [cultural_acceptance|E] de base."

 game_concept_language_group: "Grupo Lingüístico"
 game_concept_language_groups: "Grupos lingüísticos"
 game_concept_language_group_desc: "Los Grupos Lingüísticos son agrupaciones de [languages|E] relacionadas. Un grupo lingüístico compartido aumenta la [cultural_acceptance|E] de base, y es más fácil aprender un idioma del mismo grupo que el de tu [culture|E]."

 game_concept_language_branch: "Rama lingüística"
 game_concept_language_branches: "Ramas lingüísticas"
 game_concept_language_branch_desc: "Las ramas lingüísticas son agrupaciones de [language|E] relacionadas. Una rama lingüística compartida aumenta la base de [cultural_acceptance|E], y es más fácil aprender un idioma de la misma rama que la de tu [culture|E]."

 game_concept_language_family: "Familia de lenguas"
 game_concept_language_families: "Familias lingüísticas"
 game_concept_language_family_desc: "Las Familias lingüísticas son agrupaciones de [language_branches|E] relacionadas. Una familia lingüística compartida aumenta la [cultural_acceptance|E] de base, y es más fácil aprender una lengua de la misma familia que la de tu [culture|E]."

 game_concept_language_union: "Unión lingüística"
 game_concept_language_unions: "Uniones lingüísticas"
 game_concept_language_union_desc: "Las Uniones Lingüísticas son sprachbunds de [languages|E] genéticamente no relacionados. Una unión lingüística compartida aumenta la base de [cultural_acceptance|E], y es más fácil aprender un idioma de la misma unión que el de tu [culture|E]."

 game_concept_language_dialect_continuum: "Continuidad dialectal"
 game_concept_language_dialect_continuum_desc: "Dialect Continuum representan lenguas que están relacionadas y son mutuamente inteligibles, pero pueden no ser inteligibles para otras lenguas dentro de la misma [language_branch|E]"
 game_concept_dialect_continuum: "Continuidad dialectal"

 game_concept_language_creole: "Criollo"
 game_concept_language_creole_desc: "Las lenguas criollas son lenguas naturales estables que se desarrollan a partir de la simplificación y mezcla de dos lenguas diferentes en una nueva en un periodo de tiempo bastante breve. Como tales, siguen siendo algo inteligibles para algunas lenguas que de otro modo no estarían genéticamente relacionadas."
 game_concept_creole: "Criolla"

