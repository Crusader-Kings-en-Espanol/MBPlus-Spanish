 MBintro.0000.t: "Más marcadores+"
 MBintro.0000.desc: "Este evento sólo se activa al inicio de la partida y puede desactivarse mediante una regla de juego. \n No dudes en informar de errores o dar tu opinión en Steam Workshop, en los foros de PI o en los discord de mods.\n\nPara sacar el máximo partido a algunas culturas y religiones de este mod, te recomendamos que te suscribas a los siguientes mods si deseas jugar en esas regiones, ya que, de lo contrario, es posible que algunas tradiciones no funcionen del todo. Todos estos mods son totalmente compatibles entre sí y, de todos modos, sólo serían incompatibles con mods con los que este mod no funcionaría:\n\n#bold #V Asegúrate de seguir el orden de carga en la página de Steam de este mods#!#!\n\n- #bold Muslim Enhancements #!- Islamic Characters\n- #bold RICE #! - Diversos acontecimientos, decisiones y culturas de sabor por todo el mapa\n- #bold Cultures Expanded #! - Culturas más detalladas y un sistema de opinión mejorado gracias a la integración de CCU. Con esto obtendrás la configuración de cultura más completa (lenguas, innovaciones, herencias, etc.)."

 MBintro.0000.a: "¡Suena bien!"
 MBintro_intro_tooltip: "Comienza el juego"

 rule_gamerule_dejure_empires: "#G MB+MGR: #! Imperios De Jure"
 setting_default_empires: "Por defecto"
 setting_default_empires_desc: "Todos los reinos empiezan perteneciendo a un imperio, algunos de los cuales son ahistóricos."
 setting_historical_empires: "#high Histórico #!"
 setting_historical_empires_desc: "Sólo títulos de imperios que se utilicen en los marcadores de este mod. IE: Bizancio, Arabia, Magreb, SIR, Jaganatos Mongoles e Imperios Indios."
 setting_no_dejure_empires: "#high Ninguno #!"
 setting_no_dejure_empires_desc: "Al principio de la partida no existen imperios de iure. "

