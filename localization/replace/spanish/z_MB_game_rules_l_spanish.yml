# Vanilla

 setting_historicity_extra_admin_egypt_historic_always_desc: "Egipto siempre comenzará con un [administrative|E] [government|E] para reflejar mejor su organización histórica, aunque puede no funcionar también en el juego. \n \n #N El gobierno administrativo impacta el rendimiento del juego #!"

 setting_historicity_extra_admin_arabia_historic_867_desc: "El Imperio Arábico comenzará con un [administrative|E] [government|E] en 867 para reflejar mejor su organización histórica. \n \n #N El gobierno administrativo impacta el rendimiento del juego #!"

 setting_historicity_extra_admin_ghana_historic_always_desc: "Ghana siempre comenzará con un [administrative|E] [government|E] para reflejar mejor su organización histórica, aunque puede que no funcione también en el juego. \n \n #N El gobierno administrativo impacta el rendimiento del juego #!"

 setting_historicity_extra_admin_kabulistan_historic_always_desc: "Los Ghaznivids siempre comenzarán con un [administrative|E] [government|E] para reflejar mejor su organización histórica, aunque puede que no funcione también en el juego. \n \n #N El gobierno administrativo impacta el rendimiento del juego #!"

 setting_historicity_extra_admin_persia_historic_1178_desc: "El Reino de Persia comenzará con un [administrative|E] [government|E] en 1178 para reflejar mejor su organización histórica. \n \n #N El Gobierno Administrativo impacta el rendimiento del juego #!"
 setting_historicity_extra_admin_persia_alt_historic_always_desc: "El Imperio de Persia &amp; Reino de Persia siempre comenzará con un [administrative|E] [government|E] , que no refleja su organización histórica. \n \n #N El gobierno administrativo impacta el rendimiento del juego #!"

 setting_historicity_extra_admin_maghreb_historic_post_1066_desc: "El Maghreb comenzará con un [administrative|E] [government|E] en 1066 &amp; 1178 para reflejar mejor su organización histórica. \n \n #N El gobierno administrativo impacta el rendimiento del juego #!"

 setting_historicity_extra_admin_maghreb_alt_historic_always_desc: "El Maghreb siempre comenzará con un [administrative|E] [government|E] , que no refleja su organización histórica en 867. \n \n #N El gobierno administrativo impacta el rendimiento del juego #!"

 setting_historicity_extra_admin_tamilakam_historic_1066_desc: "El Cholas comenzará con un [administrative|E] [government|E] en 1066 para reflejar mejor su organización histórica. \n \n #N El gobierno administrativo impacta el rendimiento del juego #!"

 setting_historicity_extra_admin_tamilakam_alt_historic_always_desc: "El Cholas siempre empezará con un [administrative|E] [government|E] , que no es consistentemente reflectante de su organización histórica. \n \n #N El gobierno administrativo impacta el rendimiento del juego #!"

 setting_historicity_extra_admin_carolingians_alt_historic_all_administrative_desc: "Todos los reinos carolingianos comenzarán como [administrative|E] [governments|E] en 867, lo que no refleja su organización histórica. \n \n #N El gobierno administrativo impacta el rendimiento del juego #!"

 setting_historicity_extra_admin_carolingians_alt_historic_west_francia_administrative_desc: "Sólo Francia Occidental comenzará como un [administrative|E] [government|E] en 867, que no es reflectante de su organización histórica. \n \n #N El gobierno administrativo impacta el rendimiento del juego #!"

 setting_historicity_extra_admin_carolingians_alt_historic_lotharingia_administrative_desc: "Sólo Lotharingia comenzará como un [administrative|E] [government|E] en 867, que no es reflectante de su organización histórica. \n \n #N El gobierno administrativo impacta el rendimiento del juego #!"

 setting_historicity_extra_admin_carolingians_alt_historic_east_francia_administrative_desc: "Sólo el este de Francia comenzará como un [administrative|E] [government|E] en 867, que no refleja su organización histórica. \n \n #N El gobierno administrativo impacta el rendimiento del juego #!"

 setting_historicity_extra_admin_carolingians_alt_historic_italy_administrative_desc: "Sólo Italia comenzará como un [administrative|E] [government|E] en 867, que no es reflectante de su organización histórica. \n \n #N El gobierno administrativo impacta el rendimiento del juego #!"

 rule_name_of_byzantium: "Nombre de Bizancio"
 setting_default_name_of_byzantium: "$e_byzantium$"
 setting_default_name_of_byzantium_desc: "El nombre del $e_byzantium$ no cambiará. Este nombre fue creado durante el Renacimiento. Algunos historiadores modernos creen que, como un término original perjudicial e inexacto, no debe ser utilizado."
 setting_eastern_rome_name_of_byzantium: "#high $e_eastern_roman_empire$#!"
 setting_eastern_rome_name_of_byzantium_desc: "El nombre del $e_byzantium$ cambiará al de $e_eastern_roman_empire$."
 setting_roman_empire_name_of_byzantium: "#high $e_roman_empire$#!"
 setting_roman_empire_name_of_byzantium_desc: "El nombre del $e_byzantium$ será cambiado al $e_roman_empire$ . Lo que el Imperio se llamó a sí mismo a través de todo el tiempo."
 setting_romania_name_of_byzantium: "#high $e_romania_empire$#!"
 setting_romania_name_of_byzantium_desc: "El nombre del $e_byzantium$ cambiará al de $e_romania_empire$."
 setting_empire_of_the_greeks_name_of_byzantium: "#high $e_empire_of_the_greeks$#!"
 setting_empire_of_the_greeks_name_of_byzantium_desc: "El nombre del $e_byzantium$ se cambiará al $e_empire_of_the_greeks$ . Lo que el pueblo de Europa Occidental prefirió llamar al Imperio, debido a tener un legado impugnado a la identidad romana y asociar connotaciones negativas de la literatura latina antigua."
 setting_rhomaion_name_of_byzantium: "#high $e_rhomaion$#!"
 setting_rhomaion_name_of_byzantium_desc: "El nombre del $e_byzantium$ cambiará al de $e_rhomaion$."
 setting_unholy_roman_empire_name_of_byzantium: "#high $e_unholy_roman_empire$#!"
 setting_unholy_roman_empire_name_of_byzantium_desc: "El nombre del $e_byzantium$ cambiará al de $e_unholy_roman_empire$."

